version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ['type: infra']
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5
    ignore:
      # Node 22 is the supported runtime, and typescript-eslint supports TypeScript < 6.1.
      # Move these by hand when the runtime or the linter moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ['type: infra']
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
