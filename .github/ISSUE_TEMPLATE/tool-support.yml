name: Tool support request
description: Ask for Hodios to support a new AI tool, export format or install path, or report that a tool changed its format.
title: '[tool] '
labels: ['type: tool-support', 'status: needs-review']
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      placeholder: e.g. Kiro, Amp, Junie, a new Copilot surface
    validations:
      required: true
  - type: dropdown
    id: request
    attributes:
      label: Request
      options:
        - Support a new tool
        - Support a new feature of a supported tool (skills, commands, agents, rules...)
        - The tool changed its format or limits
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Format details
      description: Where the tool reads files from, the file format, argument syntax and size limits. Links to official docs are the most useful part of this issue.
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: How can we verify it?
      description: The commands to install the tool and check that an exported entry works.
