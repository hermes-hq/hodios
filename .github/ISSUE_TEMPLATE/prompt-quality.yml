name: Prompt bug or quality issue
description: An entry gives wrong, weak, unsafe or outdated results, or does not install correctly.
title: '[quality] '
labels: ['type: quality', 'status: needs-review']
body:
  - type: input
    id: entry
    attributes:
      label: Entry id
      description: The id from the URL or install command, for example review-pull-request.
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What kind of problem?
      options:
        - Wrong or misleading output
        - Weak output (no better than asking the model directly)
        - Ignores instructions or output format
        - Unsafe or risky behaviour
        - Outdated (tool, API or model changed)
        - Install or export problem
        - Typo or wording
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Claude Code
        - Codex
        - Cursor
        - GitHub Copilot
        - Gemini CLI
        - Antigravity
        - OpenCode
        - Windsurf
        - Zed
        - Continue
        - ChatGPT
        - claude.ai
        - MCP client
        - Hermes IDE
        - Other
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model (if known)
  - type: textarea
    id: repro
    attributes:
      label: What you ran and what happened
      description: Inputs, the output you got (trim it), and what you expected instead. Remove secrets and personal data.
    validations:
      required: true
  - type: input
    id: catalog
    attributes:
      label: Catalog version (if known)
      description: From `.hodios.lock`, the plugin version or the site, for example 2026.1002.0.
