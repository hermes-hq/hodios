name: New prompt request
description: Ask for a prompt, persona, workflow, rule or style that the library does not have yet.
title: '[request] '
labels: ['status: needs-review']
body:
  - type: markdown
    attributes:
      value: |
        Search the library first: https://hermes-ide.com/prompts. Want to write it yourself? See [CONTRIBUTING.md](https://github.com/hermes-hq/hodios/blob/main/CONTRIBUTING.md); it takes about five minutes.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - prompt (a one-off task)
        - persona (who the agent is)
        - workflow (ordered, gated steps)
        - rule (always-on instructions)
        - style (an output modifier)
        - not sure
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What do you need to get done?
      description: The task or situation, not the prompt text. What goes wrong when you just ask the model directly?
      placeholder: When I ask my agent to fix a flaky test it adds retries instead of finding the race...
    validations:
      required: true
  - type: textarea
    id: good-output
    attributes:
      label: What would a great result look like?
      description: The output, format or behaviour you expect.
  - type: input
    id: stack
    attributes:
      label: Stack (optional)
      description: Languages, frameworks or tools this is specific to. Leave empty if it applies everywhere.
      placeholder: typescript, react, postgres
  - type: checkboxes
    id: tools
    attributes:
      label: Where would you use it?
      options:
        - label: Claude Code
        - label: Codex
        - label: Cursor
        - label: GitHub Copilot
        - label: Gemini CLI / Antigravity
        - label: OpenCode
        - label: ChatGPT / claude.ai
        - label: MCP client
        - label: Hermes IDE
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to write this entry myself.
