# How general an entry is inside its category (TAXONOMY.md §3.12). Exactly one per entry, in front matter `depth:`.
# The ORDER of the values is the display order everywhere: the first value is the category's front door ("Start
# here"), the last is the expert end, and an entry or row without a depth counts as the middle value. Readers (the CLI,
# the site, Hermes IDE) take labels and order from this file and never hard-code the ids, so a level can be renamed or
# added here without a code change. `hodios validate` requires every live category to hold at least one entry at the
# first level (PS064) and essentials.yml to list only first-level entries (PS061).
schema: 1
facet: depth
description: "How general an entry is inside its category. Ordered: the first value is shown first ('Start here')."
values:
  - value: basic
    label: "Start here"
    description: "The general, start-from-zero entry for a need in this category: it works from a blank start, asks for what it needs and hands off to the specific entries. Example: Plan a trip."
  - value: specific
    label: "Specific"
    description: "One situation, audience, tool or format inside the category. Example: Plan a road trip with children."
  - value: advanced
    label: "Advanced"
    description: "Expert or deep work that assumes the user can judge expert output. Example: Plan croissant lamination."
