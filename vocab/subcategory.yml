# Subcategories: the optional third path level, used only when a category is split (TAXONOMY.md §2.4).
# Each value names its parent category. While the parent's layout is flat, `subcategory` is a plain filter;
# when the parent switches to `layout: nested`, every entry in it must declare one and live under
# library/<domain>/<category>/<subcategory>/<id>/.
# Values are globally unique slugs; prefix with the parent when a short name would be ambiguous (testing-e2e).
# Empty in vocab 1.0.0: no category is near the split threshold yet.
schema: 1
facet: subcategory
description: "Optional third path level inside a split category. Closed; 0 or 1 per entry; each value has a parent category."
values: []
