schema: 1
facet: requires
description: Capabilities an agent needs to run the entry. works_in is computed from this and targets.yml. Write an MCP server as mcp:<server>.
values:
  - value: none
    label: Nothing
    description: Works in any chat with pasted context.
  - value: repo-read
    label: Read the repository
    description: Reads and searches files in the workspace.
  - value: file-write
    label: Write files
    description: Creates or edits files.
  - value: shell
    label: Run commands
    description: Runs shell commands.
  - value: web
    label: Web access
    description: Fetches pages or searches the web.
  - value: git
    label: Git
    description: Reads git history, diffs and branches.
  - value: mcp
    label: MCP server
    description: Needs a named MCP server, written as mcp:<server>.
