# Primary category. Exactly one per entry; it is the second folder level: library/<domain>/<category>/<id>/.
# Each category belongs to exactly one domain (vocab/domain.yml). Category ids are globally unique across domains,
# so `cat:testing` never needs a domain prefix and moving a category to another domain changes no entry file.
#
# Fields per value:
#   domain        owning domain (required)
#   description   what belongs here (shown in every UI)
#   scope_note    the boundary with neighbours: "Not: ... (use X)". Read it before choosing.
#   examples      illustrative entry ids (not validated)
#   advice_risk   sensitive areas every entry here must declare, plus the matching guardrail partials (lint PS052, PS053; TAXONOMY.md §3.9)
#   layout        flat (default) or nested; nested means library/<domain>/<category>/<subcategory>/<id>/ (TAXONOMY.md §2.4)
#   deprecated_by retired value; still resolves, never reused
#
# Adding, splitting, merging or moving a category: TAXONOMY.md §5.
schema: 1
facet: category
description: "Primary category. One per entry; the second folder level in library/. Globally unique across domains."
