# Primary categories: one folder level under library/. Adding a category needs a GOVERNANCE vote.
# Tie-break: the specialist who owns the outcome wins.
# security > accessibility > performance > specific activity > code-review > generic.
schema: 1
facet: category
description: Primary category of an entry. Equals the folder under library/.
values:
  - value: architecture
    label: Architecture
    description: System design, boundaries, ADRs and API contracts.
  - value: code-review
    label: Code review
    description: Reviewing diffs and pull requests for defects and risk.
  - value: debugging
    label: Debugging
    description: Finding and fixing the root cause of a failure.
  - value: testing
    label: Testing
    description: Writing, fixing and improving automated tests.
  - value: refactoring
    label: Refactoring
    description: Changing structure without changing behaviour.
  - value: migration
    label: Migration
    description: Upgrading dependencies, languages, frameworks and data.
  - value: performance
    label: Performance
    description: Profiling and making code, queries and builds faster.
  - value: security
    label: Security
    description: Threat modelling, secure review and hardening.
  - value: accessibility
    label: Accessibility
    description: Making software usable by everyone, including assistive technology users.
  - value: devops
    label: DevOps
    description: CI/CD, containers, infrastructure and delivery.
  - value: incident
    label: Incident response
    description: Triage, mitigation and postmortems for production incidents.
  - value: git
    label: Git
    description: Commits, branches, pull request text and merge conflicts.
  - value: docs
    label: Documentation
    description: READMEs, API references, guides and comments.
    synonyms: [documentation]
  - value: data
    label: Data
    description: SQL, data modelling, pipelines and analysis.
  - value: ai-ml
    label: AI and ML
    description: Building with models, evals, RAG and ML pipelines.
  - value: product
    label: Product
    description: PRDs, requirements, user research and prioritisation.
  - value: planning
    label: Planning
    description: Breaking work down, estimating and implementation plans.
  - value: design
    label: Design
    description: UI and UX design, design systems and prototypes.
  - value: writing
    label: Writing
    description: Clear prose for any audience, outside technical docs.
  - value: learning
    label: Learning
    description: Explaining code and concepts, tutoring and onboarding.
  - value: conventions
    label: Conventions
    description: Coding standards and always-on project rules.
  - value: business
    label: Business
    description: Pricing, go-to-market, operations and monetisation.
    synonyms: [monetization]
  - value: legal
    label: Legal
    description: Licences, policies and compliance drafting (not legal advice).
  - value: meta
    label: Meta
    description: Prompts about prompting, agents, handoffs and output styles.
