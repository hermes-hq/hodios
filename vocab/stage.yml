schema: 1
facet: stage
description: Where in the software lifecycle an entry helps. Maps 1:1 onto Hermes Feature Track phases.
values:
  - value: discover
    label: Discover
    description: Understand the problem and ask the right questions.
  - value: plan
    label: Plan
    description: Scope, break down and sequence the work.
  - value: design
    label: Design
    description: Decide structure, interfaces and trade-offs.
  - value: build
    label: Build
    description: Write and change code.
  - value: verify
    label: Verify
    description: Test and check that the change works.
  - value: review
    label: Review
    description: Review changes before they merge.
  - value: ship
    label: Ship
    description: Release, deploy and announce.
  - value: operate
    label: Operate
    description: Run, monitor and respond in production.
  - value: maintain
    label: Maintain
    description: Upgrade, refactor and pay down debt.
  - value: learn
    label: Learn
    description: Understand code, tools and concepts.
