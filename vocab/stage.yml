# Activity / lifecycle stage. Closed. Maps 1:1 onto Hermes Track phases, so values never change meaning.
# The wording is domain-neutral: "build" is writing code, drafting an essay or cooking the meal.
schema: 1
facet: stage
description: "Where in a piece of work the entry helps. Closed; 0 to 3 per entry; maps onto Hermes Track phases."
values:
  - value: discover
    label: "Discover"
    description: "Understand the problem, the material or the codebase before acting."
    synonyms: ["research", "explore", "understand", "investigate"]
  - value: plan
    label: "Plan"
    description: "Decide what to do and in what order."
    synonyms: ["planning", "outline", "scope"]
  - value: design
    label: "Design"
    description: "Shape the structure: interfaces, data, architecture, outline or format."
    synonyms: ["shape", "architect"]
  - value: build
    label: "Build"
    description: "Make the thing: write the code, draft the text, produce the artefact."
    synonyms: ["implement", "draft", "create", "write", "make"]
  - value: verify
    label: "Verify"
    description: "Test and check the work against what it should do."
    synonyms: ["test", "check", "validate", "fact-check"]
  - value: review
    label: "Review"
    description: "Critique a finished piece of work before it ships."
    synonyms: ["critique", "feedback", "edit"]
  - value: ship
    label: "Ship"
    description: "Release, publish, deploy or send."
    synonyms: ["release", "deploy", "publish", "launch", "send"]
  - value: operate
    label: "Operate"
    description: "Run it: monitor, respond to problems, support users."
    synonyms: ["run", "monitor", "support", "respond"]
  - value: maintain
    label: "Maintain"
    description: "Keep it healthy over time: upgrade, refactor, update, pay down debt."
    synonyms: ["upkeep", "update", "refresh"]
  - value: learn
    label: "Learn"
    description: "Explain, teach, practise and reflect."
    synonyms: ["teach", "explain", "study", "practice", "practise", "reflect"]
