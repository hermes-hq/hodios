# Everyday browse layer (TAXONOMY.md §6.3): what people want to DO (intents, verbs) and what it is ABOUT (topics,
# nouns), over the categories. Shown in this order by the site and Hermes IDE ("Write · Plan · Learn …" and topic
# chips). Every live category maps to 1–2 intents and exactly one topic (PS062); an entry may override both with
# front matter `intent:` / `topic:`. Catalog rows carry the result as `int` and `top`.
# Not a facet vocabulary (no `facet:` key): it maps categories, it does not add values to entries.
intents:
  - { id: write, label: Write, hint: 'emails, posts, letters' }
  - { id: plan, label: Plan, hint: 'trips, meals, money' }
  - { id: learn, label: Learn, hint: 'explain, study' }
  - { id: decide, label: Decide, hint: 'compare, choose' }
  - { id: fix, label: Fix, hint: 'bugs, problems' }
  - { id: create, label: Create, hint: 'ideas, recipes, art' }
  - { id: talk, label: 'Talk it through', hint: 'think out loud' }
  - { id: code, label: Code, hint: 'review, build, test' }
topics:
  - { id: travel, label: Travel }
  - { id: food, label: Food }
  - { id: money, label: Money }
  - { id: health, label: Health }
