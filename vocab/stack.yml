# Stack and tools: the technology, platform or product an entry is specialised for.
# Open but curated: adding a value is a one-file PR with one vocab-owner approval (TAXONOMY.md §5.2).
# Empty `stack` on an entry means agnostic, which is the default and the common case.
#
# Fields per value:
#   type     language | framework | library | runtime | platform | database | cloud | tool | app
#   implies  broader values this one implies (react implies javascript). Search for a value also matches
#            entries tagged with anything that implies it; entries never list implied values themselves (lint PS058).
#   detect   hints Hermes uses ON THE DEVICE to detect the value in an open project (TAXONOMY.md §8):
#              files: file names or globs at any depth (package.json, *.csproj)
#              deps:  "<ecosystem>:<package>" found in a manifest (npm, pypi, cargo, go, gem, maven, nuget, composer, pub, hex)
schema: 1
facet: stack
description: "Technology, platform or product the entry is specialised for. Open, curated, normalised; 0 to 6 per entry; empty means agnostic."
values:
  # ── languages ──
