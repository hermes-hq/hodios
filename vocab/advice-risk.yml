# Professional-advice risk. Closed. Separate from `risk` (what the agent may do on a machine):
# this facet is about what a wrong answer could do to a person.
# Any entry that declares a value must include the listed guardrail partials in its body (lint PS053),
# and every entry in a category whose vocab lists advice_risk must declare those values (lint PS052).
schema: 1
facet: advice-risk
description: "Areas where the entry could be mistaken for professional advice. Closed; 0 to 4 per entry; required by sensitive categories."
values:
  - value: medical
    label: "Medical"
    description: "Health, fitness, nutrition, symptoms, medication or medical results."
    synonyms: ["health", "clinical"]
    partials: ["guardrails/professional-limits"]
  - value: mental-health
    label: "Mental health"
    description: "Emotional wellbeing, stress, mood, grief, crisis or anything near therapy."
    synonyms: ["mental", "psychological", "wellbeing"]
    partials: ["guardrails/professional-limits", "guardrails/crisis-safety"]
  - value: legal
    label: "Legal"
    description: "Contracts, rights, disputes, compliance, immigration or official procedures."
    synonyms: ["law"]
    partials: ["guardrails/professional-limits"]
  - value: financial
    label: "Financial"
    description: "Money decisions: investing, taxes, debt, insurance, budgeting or accounting."
    synonyms: ["finance", "money", "tax", "investment"]
    partials: ["guardrails/professional-limits"]
