# Everyday-word routing (TAXONOMY.md §6.4). When a search contains one of these phrases, the entry in `to` (a front
# door) comes first and the `refine` entries (the specialists it hands off to) come next, whatever else matches. The
# longest phrase found in the query wins; the first item listed breaks a tie. A phrase routes to one entry only
# (PS063). Phrases are lower case words; matching ignores plural "s" and similar endings. The build compiles this file
# to catalog/v1 (manifest `queries`), and adds each phrase to its entry's search terms (`syn`).
# Add a phrase when a plain query lands on the wrong entry, and add the query to test/golden-queries.yml.

# ─── Travel ──────────────────────────────────────────────────────────────
- to: plan-a-trip
  phrases:
    [trip, travel, vacation, holiday, holidays, getaway, weekend away, city break, travel plans, plan a trip, time off]
  refine: [plan-itinerary, choose-destination, plan-road-trip, plan-family-trip, build-packing-list]
- to: plan-itinerary
  phrases: [itinerary, day by day plan, things to do in]
  refine: [plan-multi-city-route, plan-a-trip]
- to: plan-road-trip
  phrases: [road trip, driving holiday]
  refine: [plan-rv-trip, build-packing-list]
- to: build-packing-list
  phrases: [packing list, what to pack, pack for]
  refine: [plan-a-trip]

