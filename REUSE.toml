# Licensing map (https://reuse.software). The last matching annotation wins.
# Code (packages/, tools/, schema/, CI and config) is Apache-2.0.
# Content (library/, partials/, vocab/, packs/, evals/) and brand assets (assets/) are CC0-1.0: use it anywhere, no attribution required.
version = 1
SPDX-PackageName = "Hodios"
SPDX-PackageSupplier = "Hermes IDE <https://hermes-ide.com>"
SPDX-PackageDownloadLocation = "https://github.com/hermes-hq/hodios"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Hodios contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["library/**", "partials/**", "vocab/**", "packs/**", "evals/**", "assets/**", "test/fixtures/**", "test/golden/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Hodios contributors"
SPDX-License-Identifier = "CC0-1.0"
