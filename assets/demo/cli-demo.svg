<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="644" viewBox="0 0 880 644" role="img" aria-label="hodios in a Next.js project">
<title>hodios in a Next.js project</title>
<style>
text{font:13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;animation:in .2s ease-out backwards}
.c{fill:#e9e5ff;font-weight:600}.o{fill:#b4b0c8}
@keyframes in{from{opacity:0}}
@media (prefers-reduced-motion:reduce){text{animation:none}}
</style>
<rect width="880" height="644" rx="10" fill="#14121c"/>
<rect width="880" height="34" rx="10" fill="#211e2c"/><rect y="24" width="880" height="10" fill="#211e2c"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="440" y="22" text-anchor="middle" style="fill:#8a86a0;font-size:12px;animation:none">hodios in a Next.js project</text>
<text class="c" x="20" y="68" style="animation-delay:0.25s">~/my-app $ npx @hermes-hq/hodios search "pull request" --limit 3</text>
<text class="o" x="20" y="87" style="animation-delay:0.31s">review-pr-for-security    prompt   Review a pull request for security</text>
<text class="o" x="20" y="106" style="animation-delay:0.37s">                          Reviews a diff for exploitable vulnerabilities and reports only findings</text>
<text class="o" x="20" y="125" style="animation-delay:0.43s">                          with a concrete attack path. Use before merging changes to input handling,</text>
<text class="o" x="20" y="144" style="animation-delay:0.49s">                          auth, data access or dependencies.</text>
<text class="o" x="20" y="163" style="animation-delay:0.55s">review-pull-request       prompt   Review a pull request</text>
<text class="o" x="20" y="182" style="animation-delay:0.61s">                          Reviews a pull request diff for correctness bugs, risky changes and</text>
<text class="o" x="20" y="201" style="animation-delay:0.67s">                          missing tests, and returns ranked findings. Use before merging a PR,</text>
<text class="o" x="20" y="220" style="animation-delay:0.73s">                          branch or diff.</text>
<text class="o" x="20" y="239" style="animation-delay:0.79s">split-large-pull-request  prompt   Split a large pull request into a stack</text>
<text class="o" x="20" y="258" style="animation-delay:0.85s">                          Splits a large pull request into a stack of small, independently</text>
<text class="o" x="20" y="277" style="animation-delay:0.91s">                          reviewable PRs with their order, dependencies and the branch commands to</text>
<text class="o" x="20" y="296" style="animation-delay:0.97s">                          build them. Use when a PR is too big to review well.</text>
<text class="o" x="20" y="315" style="animation-delay:1.03s"></text>
<text class="o" x="20" y="334" style="animation-delay:1.09s">3 of 14 (catalog 2026.1003.2). Next: --page 2. Install: hodios install &lt;id&gt; --target &lt;tool&gt;</text>
<text class="o" x="20" y="353" style="animation-delay:1.15s"></text>
<text class="c" x="20" y="372" style="animation-delay:1.21s">~/my-app $ npx @hermes-hq/hodios install review-pull-request --target claude-code</text>
<text class="o" x="20" y="391" style="animation-delay:1.27s">added     review-pull-request -&gt; .claude/skills/review-pull-request/SKILL.md</text>
<text class="o" x="20" y="410" style="animation-delay:1.33s"></text>
<text class="c" x="20" y="429" style="animation-delay:1.39s">~/my-app $ head -n 9 .claude/skills/review-pull-request/SKILL.md</text>
<text class="o" x="20" y="448" style="animation-delay:1.45s">---</text>
<text class="o" x="20" y="467" style="animation-delay:1.51s">name: review-pull-request</text>
<text class="o" x="20" y="486" style="animation-delay:1.57s">description: Reviews a pull request diff for correctness bugs, risky changes and missing tests, and</text>
<text class="o" x="20" y="505" style="animation-delay:1.63s">returns ranked findings. Use before merging a PR, branch or diff.</text>
<text class="o" x="20" y="524" style="animation-delay:1.69s">license: CC0-1.0</text>
<text class="o" x="20" y="543" style="animation-delay:1.75s">arguments:</text>
<text class="o" x="20" y="562" style="animation-delay:1.81s">  - diff</text>
<text class="o" x="20" y="581" style="animation-delay:1.87s">  - focus</text>
<text class="o" x="20" y="600" style="animation-delay:1.93s">argument-hint: &lt;diff&gt; [focus]</text>
<text class="o" x="20" y="619" style="animation-delay:1.99s">disable-model-invocation: true</text>
</svg>
