      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="hd-mark">
      <g fill="none" stroke="url(#hd-g)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
        <path d="M119 124V388M289 124V388"/>
        <path d="M119 256H407"/>
        <path d="M361 210L407 256L361 302"/>
        <circle cx="119" cy="104" r="20"/>
        <circle cx="289" cy="104" r="20"/>
        <circle cx="119" cy="408" r="20"/>
        <circle cx="289" cy="408" r="20"/>
      </g>
      <circle cx="204" cy="256" r="14" fill="url(#hd-g)"/>
    </g>
    <g id="hd-core" fill="none" stroke="#F3F0FF" stroke-opacity="0.75" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M119 124V388M289 124V388"/>
      <path d="M119 256H407"/>
      <path d="M361 210L407 256L361 302"/>
      <circle cx="119" cy="104" r="20"/>
      <circle cx="289" cy="104" r="20"/>
      <circle cx="119" cy="408" r="20"/>
      <circle cx="289" cy="408" r="20"/>
      <circle cx="204" cy="256" r="6" fill="#F3F0FF" stroke="none"/>
