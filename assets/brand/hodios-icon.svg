<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Hodios</title>
  <defs>
    <linearGradient id="hd-g" x1="0" y1="75" x2="0" y2="437" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FDDF8"/>
      <stop offset="1" stop-color="#A874FA"/>
    </linearGradient>
    <linearGradient id="hd-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#100F24"/>
      <stop offset="1" stop-color="#060512"/>
    </linearGradient>
    <radialGradient id="hd-halo" cx="0.5" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#5B6CF0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5B6CF0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hd-grid" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H24M0 0V24" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2"/>
