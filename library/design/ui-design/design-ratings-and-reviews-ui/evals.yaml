schema: 1
baseline: "Design a reviews section for: {{review_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-apparel-reviews
    vars:
      platform: both
      review_context: "Clothing shop. Most items have 0-15 reviews. Returns are high because of fit. Today the review form has 8 required fields and we ask for a review the day the order ships."
    assert:
      - {type: contains, value: "## Summary block"}
      - {type: llm-rubric, value: "Moves the ask to after delivery and use, allows rating-only submission, adds a fit attribute with summary, shows low counts honestly, provides clickable distribution and filters, marks verified purchases, and covers no-review and one-review states."}
  - name: edge-course-platform-replies
    vars:
      platform: web
      review_context: "Online course marketplace; instructors can reply to reviews and courses are updated over time, making old reviews outdated."
    assert:
      - {type: llm-rubric, value: "Handles instructor replies and their moderation, flags reviews from before a major course update, offers sort by recent, and avoids letting replies bury the review."}
  - name: negative-review-gating
    vars:
      platform: mobile-app
      review_context: "We want to first ask 'Are you happy?' and only send happy users to leave a public review; unhappy ones go to a private feedback form."
    assert:
      - {type: llm-rubric, value: "Declines review gating, explains it misleads readers and may breach platform or consumer rules (stated as to confirm), and designs the same review request for everyone with a separate support route that is not a filter."}
