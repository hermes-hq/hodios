schema: 1
baseline: "Design a {{device}} interface for: {{tasks}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cinema-kiosk
    vars:
      device: kiosk
      tasks: "Buy or collect cinema tickets in under 90 seconds: choose film and time, pick seats, pay by card, print or scan ticket."
      environment: "27-inch portrait touch screens in a bright foyer, queues at weekends, noisy."
    assert:
      - {type: contains, value: "Timeouts"}
      - {type: llm-rubric, value: "Designs a short flow with step timings, large tap targets within reach for standing and seated users, a seat map usable by touch, inactivity warning and full reset that clears payment and personal data, an audio or assisted alternative, language choice on the first screen, payment failure handling, and a test plan on the real device."}
  - name: edge-tv-search
    vars:
      device: tv
      tasks: "Browse and search a streaming catalogue, resume watching, manage profiles."
      environment: ""
    assert:
      - {type: llm-rubric, value: "States assumed viewing distance and title-safe margins, defines a directional focus model with a clearly visible focus state not relying on colour alone, back-button behaviour, avoids long on-screen typing by offering voice or phone pairing, and sizes text for distance."}
  - name: negative-no-tasks
    vars:
      device: signage
      tasks: ""
      environment: "a shop window"
    assert:
      - {type: llm-rubric, value: "Asks what the screen needs to communicate or let people do and stops, rather than inventing content for the signage."}
