schema: 1
baseline: "List the screens we need to design for this feature: {{brief}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-expense-approvals
    vars:
      brief: "Feature: expense approvals. Employees submit expenses with receipts on mobile and web. Managers approve or reject with a comment. Finance can export approved expenses. Approvals over 1,000 EUR need a second approver. Platforms: iOS, Android, web."
      existing_product: "Existing app has expense list and expense detail screens; roles: employee, manager, finance admin."
    assert:
      - {type: contains, value: "## State matrix"}
      - {type: llm-rubric, value: "Lists screens per role including approval queue, approve and reject dialogs with comment, second-approver flow, finance export, notifications and emails that deep link, and changes to existing expense list and detail; gives a state matrix including empty queue, rejected, pending second approval and no permission; and raises open questions such as delegation when a manager is away."}
  - name: edge-tiny-feature
    vars:
      brief: "Add a 'duplicate project' action."
      existing_product: ""
    assert:
      - {type: llm-rubric, value: "Keeps the inventory proportionate (menu entry, naming dialog or default, progress for large projects, success and error states, permission rules) and asks questions about what gets copied, without inflating scope."}
  - name: negative-no-feature-defined
    vars:
      brief: "We need an app for our business."
      existing_product: ""
    assert:
      - {type: llm-rubric, value: "Asks what users should be able to do before listing screens, rather than inventing a generic app inventory."}
