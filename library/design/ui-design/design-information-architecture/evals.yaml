schema: 1
baseline: "Design the information architecture and sitemap for: {{content}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-council-website
    vars:
      content: "Small town council website, 140 pages organised by department (Planning Dept, Environmental Services, Finance Dept, Leisure Services, Democratic Services). Content includes bin collection days, council tax payment, planning applications search, parking permits, report a pothole, library opening times, council meeting minutes, councillor contacts, jobs, swimming pool timetable."
      users_and_tasks: "Residents. Top tasks from search logs: bin collection day, pay council tax, report a problem (potholes, fly-tipping), parking permits, planning applications, library and pool opening times."
    assert:
      - {type: contains, value: "## Sitemap"}
      - {type: llm-rubric, value: "Replaces the department-based structure with a task or topic-based scheme for residents, puts the top tasks within 2-3 levels with a listed path each, uses plain resident language for labels instead of department names, shows an indented sitemap with cross-links, and writes tree-test scenarios that avoid the labels with correct destinations and targets."}
  - name: edge-no-tasks-given
    vars:
      content: "B2B project management SaaS: projects, tasks, timelines, workload view, reports, integrations, billing, user management, templates, automations, help centre."
    assert:
      - {type: llm-rubric, value: "Infers top tasks and marks them as assumptions, recommends top-task research, separates product navigation from utility areas like billing and user management, and includes a validation plan with tree-test tasks."}
  - name: negative-too-thin
    vars:
      content: "A website."
    assert:
      - {type: llm-rubric, value: "Does not invent a sitemap; asks a few specific questions about the content, users and purpose."}
