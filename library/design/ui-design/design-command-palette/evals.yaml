schema: 1
baseline: "Design a command palette for my app: {{product_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-issue-tracker
    vars:
      product_context: "Browser-based issue tracker. Objects: issues, projects, cycles, people. Heavy users triage 100 issues a day: change status, assign, set priority, move to cycle. Existing shortcuts: none. Users complain about too many clicks."
    assert:
      - {type: contains, value: "## Shortcut map"}
      - {type: llm-rubric, value: "Includes contextual actions on the selected issue (status, assign, priority) with argument steps, ranks by context and recency, gives Mac and Windows variants with browser conflict checks, prevents single-key shortcuts in inputs, adds a cheat sheet, and ensures everything is reachable through visible UI."}
  - name: edge-ctrl-k-taken
    vars:
      product_context: "Rich text editor inside a browser app where Ctrl/Cmd+K already inserts a link."
    assert:
      - {type: llm-rubric, value: "Recognises the Cmd/Ctrl+K conflict with insert link and proposes a different trigger or context-dependent behaviour with a reason."}
  - name: negative-shortcut-only
    vars:
      product_context: "We want to remove the toolbar and make the command palette the only way to run actions, to keep the UI clean."
    assert:
      - {type: llm-rubric, value: "Pushes back on palette-only access for discoverability and accessibility reasons and proposes keeping visible paths, possibly simplified."}
