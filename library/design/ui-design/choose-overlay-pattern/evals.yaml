schema: 1
baseline: "Should these be modals or something else? {{interactions}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crm-interactions
    vars:
      platform: responsive-web
      interactions: "1) Editing a contact's 25-field record from the list (today a modal; users lose edits when clicking outside). 2) 'Contact saved' confirmation (today a modal with OK). 3) Choosing a tag from 40 tags. 4) Deleting a contact. 5) Viewing a deal's details while keeping the pipeline board visible."
    assert:
      - {type: contains, value: "## Decisions"}
      - {type: llm-rubric, value: "Moves the 25-field edit to a page or side panel and prevents outside-click loss, replaces the saved modal with a toast, uses a popover or menu with search for tags, uses a specific confirmation dialog for delete, uses a drawer for deal details, and gives focus and dismissal rules plus mobile equivalents."}
  - name: edge-ios-android-difference
    vars:
      platform: ios
      interactions: "Sharing a photo with options for recipients and caption; filtering a list by 6 criteria."
    assert:
      - {type: llm-rubric, value: "Uses iOS conventions such as a sheet for sharing and filters with detents or full screen, mentions swipe-to-dismiss with unsaved input handling, and avoids desktop popovers."}
  - name: negative-stacked-modals
    vars:
      platform: web
      interactions: "Inside our checkout modal, we want to open an address modal, and inside it a map modal to pick the location."
    assert:
      - {type: llm-rubric, value: "Rejects stacking three modals, explains the focus and context problems, and proposes moving checkout to a page with inline address entry and an in-step map."}
