schema: 1
baseline: "Add tooltips and help to this screen: {{screen_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-payroll-settings
    vars:
      screen_context: "Payroll setup screen for small businesses. Fields: pay schedule, first pay date, 'pay period end offset', tax registration number, default overtime rule. Tickets: people don't understand 'pay period end offset'; many enter the tax number in the wrong format; nobody finds the docs."
    assert:
      - {type: contains, value: "## Fix first"}
      - {type: llm-rubric, value: "Proposes renaming or rephrasing 'pay period end offset' before adding help, adds an inline format hint and example for the tax number instead of a tooltip, chooses patterns per spot with reasons, drafts exact help text, and defines how to measure ticket reduction."}
  - name: edge-complex-concept
    vars:
      screen_context: "Analytics tool setting for 'attribution window' with options 1, 7, 28 days. Users choose without understanding the effect on reported conversions."
    assert:
      - {type: llm-rubric, value: "Uses an expandable explanation or side panel with a concrete example of the effect, not a one-line tooltip, and suggests showing consequences of the choice in the UI."}
  - name: negative-tooltip-everything
    vars:
      screen_context: "Please add a tooltip to every field on our checkout form, including the required card number rules."
    assert:
      - {type: llm-rubric, value: "Pushes back on tooltips for essential information like card rules, recommends inline hints and validation instead, and limits help to where it is needed."}
