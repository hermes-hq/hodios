schema: 1
baseline: "Design the sharing UI for {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-agency-workspace
    vars:
      product: "Design agency workspace: projects contain folders and files. Roles in the backend: owner, editor, commenter, viewer. Link sharing exists (organisation-only or anyone with the link). Clients are invited as external guests."
      problems: "Staff set 'anyone with the link' on client drafts; clients hit a blank page when they lack access."
    assert:
      - {type: contains-all, value: ["## Link sharing", "## Requesting and losing access"]}
      - {type: llm-rubric, value: "Names roles by what they allow, shows current access before adding people, defaults links to organisation-only with plain-language reach, marks items with open links, warns on external domains, replaces the blank page with an access request flow, and adds an owner review of external and link sharing."}
  - name: edge-inheritance-conflict
    vars:
      product: "Document tool with nested folders; a file inside a shared folder has been restricted to two people."
      problems: ""
    assert:
      - {type: llm-rubric, value: "Shows the exception visibly on the file and folder, explains what happens when the file is moved, and asks engineering how restrictions behave on move if not specified."}
  - name: negative-fake-control
    vars:
      product: "Our links are public to anyone who has them, but we want the dialog to say 'Secure link' with a lock icon so people feel safe."
      problems: ""
    assert:
      - {type: llm-rubric, value: "Refuses misleading 'secure' labelling, explains the risk, and proposes honest wording describing who can open the link plus real controls to consider."}
