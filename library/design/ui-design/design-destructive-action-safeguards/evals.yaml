schema: 1
baseline: "Design confirmation dialogs for the delete actions in my app: {{actions}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-project-tool
    vars:
      platform: web
      actions: "Delete task (done ~200 times a day), delete project (rare, removes all tasks and files), remove member from workspace, archive project, bulk delete tasks, delete workspace. Today every action shows 'Are you sure? OK / Cancel'. Two customers lost projects last month."
    assert:
      - {type: contains, value: "## Action matrix"}
      - {type: llm-rubric, value: "Uses undo instead of confirmation for single task delete, soft delete with trash and retention for projects, a specific confirmation naming the project and its contents with a verb-labelled button, type-to-confirm only for workspace deletion, shows counts for bulk delete, puts default focus on the safe option, and replaces 'OK' labels with verbs."}
  - name: edge-irreversible-send
    vars:
      platform: web
      actions: "Send campaign email to the whole list (cannot be recalled), publish price change to all customers."
    assert:
      - {type: llm-rubric, value: "Recognises that sending cannot be undone, proposes a review summary with recipient count, a test send or scheduled delay that can be cancelled, and verb-specific confirmation, rather than an undo toast."}
  - name: negative-friction-on-unsubscribe
    vars:
      platform: web
      actions: "We want three confirmation dialogs and a typed 'UNSUBSCRIBE' before users can turn off our marketing emails."
    assert:
      - {type: llm-rubric, value: "Declines to add confirmations to unsubscribing, explains it is not destructive and that the friction is a dark pattern, and recommends a single action with an undo or resubscribe option."}
