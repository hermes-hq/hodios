schema: 1
baseline: "Write handoff notes for developers for this design: {{design_description}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-team-invite
    vars:
      design_description: "Invite teammates modal in a project management web app. Screen: modal titled 'Invite people', an email input that turns typed emails into chips, a role dropdown (Admin, Member, Viewer), 'Send invites' primary button, 'Cancel' secondary. After sending, a toast 'Invites sent'. Uses our design system: Modal, TextField, Chip, Select, Button, Toast. Tokens: color.surface.raised, space.4, radius.md."
      platform: "responsive web, 360-1440px"
    assert:
      - {type: contains, value: "## Open questions"}
      - {type: llm-rubric, value: "Lists states not shown in the design (invalid email chip, duplicate or already-member email, seat limit reached, sending in progress, partial failure, server error, empty input with disabled button) marked as not designed with proposed defaults, specifies keyboard behaviour (Enter or comma creates a chip, Backspace removes, Escape closes, focus trap and return), mobile behaviour of the modal, uses the given component and token names without inventing values, includes Given/When/Then acceptance criteria and open questions with owners."}
  - name: edge-no-platform
    vars:
      design_description: "Order history list: each row shows order number, date, total and status badge (Delivered, In transit, Cancelled). Tap a row to open details. Pull to refresh."
    assert:
      - {type: llm-rubric, value: "States the platform assumption (pull to refresh suggests mobile), covers empty, loading, error and pagination or long-list states, date and currency formatting, status badges not relying on colour alone, and lists open questions rather than inventing exact values."}
  - name: negative-no-design
    vars:
      design_description: "The new settings page. Engineering starts tomorrow, write the handoff."
    assert:
      - {type: llm-rubric, value: "Does not invent screens, components, states or token values for a design it has not seen; asks a few specific questions about the screens and their elements, the goal of the feature and the design system, and stops."}
