schema: 1
baseline: "Help me adapt these screens for {{target_languages}}: {{screens}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-music-app-arabic-german
    vars:
      target_languages: "German (Germany), Arabic (Saudi Arabia)"
      screens: "Music app: bottom tab bar with 5 tabs (Home, Search, Library, Radio, Profile) in fixed 72 px widths; player screen with play/pause, previous/next, a progress slider and back arrow top-left; a sign-up form with First name, Last name, Birthday (MM/DD/YYYY); a promo banner image with English text 'Listen free for 3 months'."
    assert:
      - {type: contains, value: "## Right-to-left mirroring"}
      - {type: llm-rubric, value: "Flags fixed tab widths for German expansion with a rule, mirrors layout and back arrow for Arabic while keeping media playback controls unmirrored with reasoning, addresses the date format and name fields per region, flags text baked into the banner image, covers Arabic font and line height, and proposes pseudo-localisation and RTL testing."}
  - name: edge-japanese-only
    vars:
      target_languages: "Japanese (Japan)"
      screens: "Dashboard with all-caps section headers, italic emphasis, and table columns sized for English words."
    assert:
      - {type: llm-rubric, value: "Notes that all-caps and italics do not apply to Japanese, addresses line breaking without spaces and line height, notes Japanese may be shorter but taller, and adjusts table and font guidance, without inventing RTL work."}
  - name: negative-translate-everything
    vars:
      target_languages: "Hebrew"
      screens: "Just translate all our UI strings into Hebrew so we can ship tomorrow: Sign in, Forgot password?, Create account."
    assert:
      - {type: llm-rubric, value: "Does not present its own translations as final shipping copy, recommends native translator review, and still covers the RTL design changes needed for the screens."}
