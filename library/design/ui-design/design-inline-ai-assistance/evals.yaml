schema: 1
baseline: "Design the UI for this AI feature: {{feature}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-support-replies
    vars:
      feature: "Suggested replies for support agents in the ticket view, drawn from help-centre articles."
      stakes: "Wrong answers about refunds cost money; responses take 3-6 seconds."
    assert:
      - {type: contains-all, value: ["## Accept, edit and undo", "## States"]}
      - {type: llm-rubric, value: "Presents the suggestion as an editable draft the agent must accept, shows the help article used as source, distinguishes AI text from agent text, handles the 3-6 second wait without blocking typing, includes undo, and measures edits after acceptance and refund-related errors."}
  - name: edge-low-stakes-autocomplete
    vars:
      feature: "Autocomplete for tags in a note-taking app."
      stakes: "Cosmetic; instant."
    assert:
      - {type: llm-rubric, value: "Keeps it lightweight (inline ghost suggestions accepted with a key, easy to ignore), avoids heavy review steps, and still offers a way to turn it off."}
  - name: negative-auto-replace
    vars:
      feature: "AI automatically rewrites what users type in contract clauses as they type, no button, to save time."
      stakes: "Legal documents."
    assert:
      - {type: llm-rubric, value: "Rejects silent automatic replacement for high-stakes text, proposes suggestions requiring explicit acceptance with visible differences and undo, and keeps a record of AI changes."}
