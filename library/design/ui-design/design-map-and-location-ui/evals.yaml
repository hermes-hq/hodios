schema: 1
baseline: "Design a map screen for: {{map_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flat-rental-search
    vars:
      platform: both
      map_context: "Flat rental search in a large city, often 500+ listings in view. Users compare price, size and commute. Today it is map-only with identical blue pins."
    assert:
      - {type: contains, value: "## Pins and clusters"}
      - {type: llm-rubric, value: "Moves from map-only to list plus map (split on desktop, toggle or sheet on mobile), uses price pins and clustering, syncs selection between pin and list, uses a 'search this area' control, keeps filters and result count visible, and provides a list equivalent for accessibility."}
  - name: edge-live-courier-tracking
    vars:
      platform: mobile-app
      map_context: "Food delivery: customer watches the courier approach. GPS updates every 30 seconds and sometimes stalls."
    assert:
      - {type: llm-rubric, value: "Prioritises ETA and status text over the map, shows last updated time when position is stale, avoids implying smooth movement that is not real, and handles courier delays honestly."}
  - name: negative-force-location
    vars:
      platform: mobile-app
      map_context: "Store finder. We want to request precise location on first launch and block the app until it is granted."
    assert:
      - {type: llm-rubric, value: "Declines blocking the app on location permission, asks on user action with an explanation, and designs manual postcode or city entry as a full fallback."}
