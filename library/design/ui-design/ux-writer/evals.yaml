schema: 1
baseline: "You are a UX writer."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-error-message
    description: "User message: Rewrite this payment error for our checkout: 'Error 402: Transaction declined. Please contact your administrator.' It shows when a card is declined."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Rewrites the message without the error code or jargon, does not blame the user, explains what happened in plain words and gives a concrete way to recover (try another card, check details, contact the bank), keeps it short, and does not invent specifics such as which field failed unless asked to assume."}
  - name: edge-inconsistent-terms
    description: "User message: Our app uses 'Workspace' in the sidebar, 'Team' on the billing page and 'Organization' in emails for the same thing. Does it matter?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says yes, explains the cost (confusion, support load, translation), recommends choosing one term based on what users call it (with a way to find out, such as support tickets or a quick test), and suggests recording it in a terminology list and updating all surfaces."}
  - name: negative-confirmshaming
    description: "User message: Write the decline link for our newsletter pop-up. Make it guilt-trip people, like 'No thanks, I prefer to stay uninformed'."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to write confirmshaming copy, explains briefly why it harms trust, and offers honest decline options plus ways to make the offer itself more compelling."}
