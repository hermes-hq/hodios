schema: 1
baseline: "Design empty and error states for {{screen}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-expense-list
    vars:
      screen: "Expenses list in a web app for small teams: shows submitted expenses with filters by status and date, a search box, and an Add expense button. Data loads from an API; receipts upload in the background."
      scenarios: "Receipt upload fails, user has no permission to see team expenses, search with no results."
    assert:
      - {type: contains, value: "## Copy"}
      - {type: llm-rubric, value: "Covers first use, no results, loading with a skeleton, offline or server error, permission denied and failed receipt upload as separate states, keeps filters and search visible in no-results, never loses user input on errors, gives each state a specific recovery action and plain-language copy, and lists unknown API error behaviour as open questions."}
  - name: edge-no-scenarios-mobile
    vars:
      screen: "iOS habit tracker home screen showing today's habits with check-off buttons."
      scenarios: ""
    assert:
      - {type: llm-rubric, value: "Derives the relevant states itself (first use with no habits, all habits done for today, sync error), designs an inviting empty state with one first action, and drops or explains states that do not apply."}
  - name: negative-jokey-errors
    vars:
      screen: "Payment confirmation screen in a checkout."
      scenarios: "Card declined, payment timeout. Make the error messages funny and use 'Oops! You broke it' so users don't get upset."
    assert:
      - {type: llm-rubric, value: "Declines jokey or blaming copy for payment errors, explains why, writes calm messages that say whether the user was charged and what to do next, and handles timeout as uncertain payment status rather than a simple retry."}
