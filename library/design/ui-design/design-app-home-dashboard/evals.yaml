schema: 1
baseline: "Design the home dashboard for my app: {{product_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-invoicing-saas
    vars:
      platform: web
      product_context: "Invoicing app for freelancers. Users log in about twice a week to create invoices, check which are unpaid or overdue, and record payments. Today's home shows a revenue chart, a news feed of product updates, tips, and a 'recent invoices' list at the bottom. Analytics: 70% of sessions go straight to the invoices list."
    assert:
      - {type: contains, value: "## Module inventory"}
      - {type: llm-rubric, value: "Ranks overdue and unpaid invoices and 'create invoice' at the top, demotes or cuts the news feed and tips, keeps the revenue chart only if it drives action, defines new-user state leading to a first invoice, and ties each module to a user job using the 70% evidence."}
  - name: edge-should-not-have-home
    vars:
      platform: desktop
      product_context: "Code editor. Users open it to continue editing a project; almost nobody uses the current start page."
    assert:
      - {type: llm-rubric, value: "Considers that the product may not need a home screen and recommends reopening the last workspace, with a lightweight start view only for no-project or first-run states."}
  - name: negative-promo-first
    vars:
      platform: mobile-app
      product_context: "Banking app. Marketing wants the top half of the home screen to be a rotating carousel of credit card offers, above balances."
    assert:
      - {type: llm-rubric, value: "Pushes back on placing promotions above the user's balances and tasks, explains why with the home screen's job, and offers a capped, lower placement for offers."}
