schema: 1
baseline: "Design the navigation for my app. Sections: {{sections}}. Main tasks: {{primary_tasks}}. Platform: {{platform}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fitness-app
    vars:
      sections: "Today (workout of the day), Plans (library of programmes), Progress (charts, history), Community (groups, challenges), Coach chat, Shop, Settings, Profile, Notifications, Help."
      primary_tasks: "Start today's workout (daily), log a set during a workout (many times per session), check progress (weekly), message coach (a few times per week)."
      platform: cross-platform
    assert:
      - {type: contains, value: "Deep links"}
      - {type: llm-rubric, value: "Chooses a bottom tab bar of no more than five destinations on mobile built around the primary tasks, moves Shop, Help, Settings and Notifications to secondary places, defines per-tab stacks, re-tap behaviour and system back on Android, builds the parent stack for deep links, adapts to a rail or sidebar on larger screens, and counts taps for each primary task."}
  - name: edge-b2b-web-many-sections
    vars:
      sections: "Dashboard, Orders, Customers, Products (catalogue, inventory, pricing), Reports (12 report types), Integrations, Team, Billing, Settings (30+ pages)."
      primary_tasks: "Process new orders (operations staff, all day), look up a customer (support, often), run monthly reports (managers)."
      platform: web
    assert:
      - {type: llm-rubric, value: "Recommends a collapsible side navigation with grouping, keeps Settings and Billing in an account area, explains nested navigation for Products and Reports, covers role-based destinations, browser back and shareable URLs, and includes keyboard and landmark notes."}
  - name: negative-too-vague
    vars:
      sections: "home, stuff, settings"
      primary_tasks: "use the app"
      platform: ios
    assert:
      - {type: llm-rubric, value: "Asks two or three focused questions about what the app does, its sections and the most frequent tasks, and stops instead of producing a full navigation design from guesses."}
