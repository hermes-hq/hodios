schema: 1
baseline: "Adapt this desktop screen for mobile: {{desktop_screen}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dashboard
    vars:
      desktop_screen: "Sales dashboard. Left sidebar nav with 8 items. Top: date range picker and export button. Row of 6 KPI cards. Large line chart of revenue over 12 months with hover tooltips. Table of 50 deals with 9 columns (name, owner, stage, value, close date, probability, last activity, source, notes), sortable, row actions on hover. Analytics: on mobile, 80% of sessions only look at KPIs and the deals closing this week."
      mobile_constraints: "Mobile web, smallest width 360px. The product's mobile web uses a bottom tab bar."
    assert:
      - {type: contains, value: "## Content priority"}
      - {type: llm-rubric, value: "Uses the analytics to prioritise KPIs and deals closing this week, reduces KPI cards to the most important ones or a swipeable row, converts the 9-column table into cards or a list with key fields and a detail view, replaces hover actions and tooltips with tap alternatives, moves sidebar items into the existing bottom tab bar plus a menu, specifies touch target sizes, and lists what is deferred (e.g. export, notes column) with where users can still reach it."}
  - name: negative-too-thin
    vars:
      desktop_screen: "Our homepage."
    assert:
      - {type: llm-rubric, value: "Does not invent a homepage layout; asks a few specific questions about the regions, purpose and main tasks."}
