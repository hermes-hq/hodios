schema: 1
baseline: "Design a file upload UI for {{context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-id-verification
    vars:
      context: "Renters upload ID and three recent payslips to apply for a flat. Mostly on phones. PDFs and photos."
      constraints: "Max 10 MB per file, JPG, PNG, PDF. Files are virus-scanned after upload, which can take 20 seconds."
    assert:
      - {type: contains-all, value: ["## Failures and recovery", "## Mobile and accessibility"]}
      - {type: llm-rubric, value: "States the 10 MB and type limits before selection, offers camera capture with photo guidance for documents, shows per-file progress plus a separate scanning state, keeps successful files when one fails, gives specific error messages with recovery, and does not rely on drag-and-drop."}
  - name: edge-bulk-csv
    vars:
      context: "Admins import a CSV of up to 50,000 customer records."
      constraints: "Processing takes minutes; rows can fail validation individually."
    assert:
      - {type: llm-rubric, value: "Separates file upload from row processing, lets the person leave and get notified, reports per-row errors with a downloadable error file, and allows fixing and re-importing failed rows only."}
  - name: negative-drag-only
    vars:
      context: "Design a clean drop-zone-only uploader with no button, for a minimalist look."
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on drop-zone-only, explaining touch, keyboard and screen reader users, and keeps a visible picker button while preserving a clean look."}
