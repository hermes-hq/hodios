schema: 1
baseline: "Design a booking flow for: {{booking_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hair-salon
    vars:
      platform: web
      booking_context: "Hair salon with 6 stylists, services from 30 to 180 minutes, open Tue-Sat. Customers book online; 15% no-show rate. We want a 20% deposit for colour services and a 24-hour cancellation policy."
    assert:
      - {type: contains, value: "## Slot picker"}
      - {type: llm-rubric, value: "Orders service then stylist with an 'any stylist' default, leads with next available slots, marks unavailable days, holds the slot during details, shows the deposit and 24-hour policy before payment, designs reschedule in place and late-cancellation messaging, and lists no-show and reschedule metrics."}
  - name: edge-remote-tutoring-time-zones
    vars:
      platform: mobile-app
      booking_context: "Online tutoring marketplace. Tutors in 30 countries, students anywhere. 50-minute video lessons. Frequent complaints that students joined at the wrong hour."
    assert:
      - {type: llm-rubric, value: "Shows slots in the student's local time with the time zone labelled on every time, handles daylight-saving changes, puts time zone and local time in confirmation and reminders, and includes add-to-calendar; treats time-zone errors as the main design problem."}
  - name: negative-hide-fees
    vars:
      platform: web
      booking_context: "Restaurant reservations. We want to show the 40 EUR no-show fee only in the confirmation email so people don't drop off."
    assert:
      - {type: llm-rubric, value: "Declines to hide the no-show fee until after booking, explains the trust and likely consumer-law risk briefly without stating law as fact, and designs clear fee disclosure before the card is taken."}
