schema: 1
baseline: "Does this design follow {{platform}} conventions? {{screens}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-android-patterns-on-ios
    vars:
      platform: ios
      screens: "Inbox screen: hamburger menu top left opening a side drawer with 4 sections; a round floating '+' button bottom right; deleting a message shows a toast at the bottom with 'Undo'; a custom back arrow top left that only responds to taps; all text is fixed at 14px; date field opens a custom calendar grid."
    assert:
      - {type: contains, value: "## Accessibility settings"}
      - {type: llm-rubric, value: "Flags the drawer (suggests a tab bar), the floating action button (suggests a navigation-bar or toolbar action), the toast (suggests an iOS-appropriate undo or confirmation), the missing edge-swipe back, fixed text that ignores Dynamic Type as high severity, and the custom date picker versus the system picker, each with severity and a native alternative."}
  - name: edge-web-image-limits
    vars:
      platform: web
      screens: "A single screenshot of a settings page: cards with toggle switches, a 'Save' button at the bottom, and icons without labels in a top bar. I can't tell you how it behaves."
    assert:
      - {type: llm-rubric, value: "Judges what is visible (unlabelled icons, save pattern, control semantics), marks keyboard operation, focus styles, URL state and zoom reflow as not visible rather than assuming, and lists what to check in the browser."}
  - name: negative-too-thin
    vars:
      platform: android
      screens: "our app"
    assert:
      - {type: llm-rubric, value: "Asks for screenshots or a fuller description of the screens and stops instead of producing generic findings."}
