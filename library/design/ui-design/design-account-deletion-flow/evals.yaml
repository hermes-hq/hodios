schema: 1
baseline: "Design an account deletion flow for {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-photo-app
    vars:
      product: "Photo sharing app with albums shared with family members, a premium subscription billed through iOS and Google Play, and comments on others' photos."
      policy: "30-day grace period. Billing records kept as required by law. iOS, Android and web."
    assert:
      - {type: contains-all, value: ["## Flow step by step", "## What is deleted and kept"]}
      - {type: llm-rubric, value: "Places deletion findably in settings, offers export before deletion, explains that store-billed subscriptions must be cancelled in the store with a direct path, decides what happens to shared albums and comments, includes a 30-day undo, keeps billing records with retention marked to confirm, and avoids guilt copy."}
  - name: edge-team-owner
    vars:
      product: "B2B workspace tool; the person deleting is the only owner of a 40-person workspace."
      policy: ""
    assert:
      - {type: llm-rubric, value: "Requires transferring ownership or deciding the workspace's fate before deletion, warns about effects on other members, and marks policy gaps for confirmation."}
  - name: negative-make-it-hard
    vars:
      product: "Subscription app. Management wants deletion only by phone call during office hours, with three 'are you sure' screens and a sad-face 'You're abandoning us' message."
      policy: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on phone-only deletion, repeated confirmations and confirmshaming, explains trust, platform and legal risk, and offers an honest flow with at most one retention offer."}
