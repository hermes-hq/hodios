schema: 1
baseline: "Design comments with mentions for my product: {{collaboration_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-doc-editor
    vars:
      platform: web
      collaboration_context: "Shared document editor for legal teams. Comments attach to text selections. Complaints: comments disappear when text is rewritten, people get mentioned on documents they cannot open, and nobody knows which threads are still open."
    assert:
      - {type: contains, value: "## Mentions"}
      - {type: llm-rubric, value: "Keeps threads when anchored text changes with an orphaned or changed marker, warns or offers sharing when mentioning someone without access, defines resolve and reopen with resolved threads recoverable, and adds filters for open and mentions-me threads."}
  - name: edge-design-canvas-pins
    vars:
      platform: desktop
      collaboration_context: "Design canvas tool where comments are pins on a frame; frames move and get duplicated."
    assert:
      - {type: llm-rubric, value: "Uses pin anchoring relative to the frame, defines what happens to pins when frames are moved or duplicated, handles many pins in one area, and keeps a list view for navigation and accessibility."}
  - name: negative-too-vague
    vars:
      platform: web
      collaboration_context: "Comments."
    assert:
      - {type: llm-rubric, value: "Asks what is being commented on and by whom before designing, or states clear assumptions only after asking."}
