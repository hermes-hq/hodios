schema: 1
baseline: "Design a messaging inbox for my app: {{messaging_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-marketplace-buyer-seller
    vars:
      platform: both
      messaging_context: "Local marketplace. Buyers message sellers about a listing; sellers may have 30 conversations about different items. Scammers ask buyers to pay by bank transfer off-platform."
    assert:
      - {type: contains, value: "## Safety controls"}
      - {type: llm-rubric, value: "Threads conversations per listing with the item shown in the inbox row and thread header, gives sellers filtering by item, shows sending/failed states with retry, adds block and report, warns on off-platform payment requests, and sets lock-screen privacy rules."}
  - name: edge-clinic-patients
    vars:
      platform: mobile-app
      messaging_context: "Patients message their clinic's care team, not individual doctors. Replies may take a day. Messages are not for emergencies."
    assert:
      - {type: llm-rubric, value: "Sets expectations on reply time and emergencies in the thread and composer, uses private lock-screen previews by default, handles a team inbox identity, and marks retention and privacy rules to confirm."}
  - name: negative-ai-chatbot
    vars:
      platform: web
      messaging_context: "I actually want the UI for our AI assistant chat where users ask questions to an LLM."
    assert:
      - {type: llm-rubric, value: "Notes that this entry covers messaging between people and that an AI assistant chat has different needs (streaming, regenerate, sources), and either redirects to an AI chat interface design or adapts with that caveat stated."}
