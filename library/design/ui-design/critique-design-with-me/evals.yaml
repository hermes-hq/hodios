schema: 1
baseline: "Give me feedback on this design: {{design}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-turn-no-goals
    vars:
      design: "Landing page for a freelance bookkeeping service: big hero photo of a laptop, headline 'Numbers made simple', three feature cards, testimonials, pricing table, and a contact form at the very bottom."
      goals: ""
      stage: mid-fidelity
    assert:
      - {type: contains, value: "## Framing"}
      - {type: llm-rubric, value: "Restates what it sees briefly, asks up to three questions about audience, the one goal and constraints, and stops without delivering a full critique yet."}
  - name: edge-area-turn-with-taste-reasoning
    description: "Goals are set and the agenda agreed; the designer answers the hierarchy intent question with: 'I made the logo huge because I like big logos.'"
    vars:
      design: "Mobile app home screen for a gym: logo takes the top third, class schedule below the fold, a small 'Book' button."
      goals: "Members should book a class in under 30 seconds."
      stage: mid-fidelity
    assert:
      - {type: llm-rubric, value: "Ties feedback to the booking goal (schedule and Book action pushed down by the logo), asks one follow-up that makes the designer test the taste-based choice, offers one or two options, does not argue repeatedly, and asks whether to go deeper or move on."}
  - name: negative-stage-mismatch
    vars:
      design: "Rough paper sketch of a three-step signup flow, boxes and arrows only."
      goals: "Get new users to create an account and invite a teammate."
      stage: sketch
    assert:
      - {type: llm-rubric, value: "Keeps the critique at concept, flow and content priority, and does not comment on typography, colour or pixel spacing for a sketch."}
