schema: 1
baseline: "Map the user flow for {{task}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-invite-teammate
    vars:
      task: "A workspace admin invites a teammate by email in a project management tool; the invitee may or may not already have an account, and the free plan allows 5 members."
    assert:
      - {type: contains, value: "## Flow diagram"}
      - {type: llm-rubric, value: "Includes a Mermaid flowchart with branches for an existing versus new account, the 5-member plan limit, an invalid email and an expired invite, and rates drop-off risk per step with fixes."}
  - name: edge-with-analytics
    vars:
      task: "Checkout on a mobile shop"
      current_design: "Analytics: cart 100%, shipping form 62%, account creation 31%, payment 27%, confirmation 24%."
    assert:
      - {type: llm-rubric, value: "Uses the analytics to identify forced account creation as the largest drop-off, labels it as observed rather than assumed, and proposes guest checkout or deferring account creation."}
  - name: negative-no-dead-ends
    vars:
      task: "Password reset where the reset link expires after 10 minutes; the current design shows 'Link expired' and nothing else."
    assert:
      - {type: llm-rubric, value: "Flags the expired-link screen as a dead end and adds a recovery path such as requesting a new link from that screen."}
