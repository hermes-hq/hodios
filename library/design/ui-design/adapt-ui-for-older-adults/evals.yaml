schema: 1
baseline: "Make this app easier for elderly users: {{screens}} Users: {{users}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pharmacy-refill
    vars:
      screens: "Prescription refill app. Home has six icon-only tiles in a 3x2 grid. Refill flow: swipe a card left to select a medicine, a 13px grey 'Next' link, a 5-minute session timeout, an error 'Invalid input (code 422)' if the date format is wrong, and a chatbot as the only help."
      users: "People over 70 ordering repeat prescriptions on their own phones; some have tremor or cataracts; many are anxious about making mistakes."
    assert:
      - {type: contains, value: "Before"}
      - {type: llm-rubric, value: "Adds labels to icon tiles, replaces the swipe-to-select gesture with tappable controls, makes the Next action a large, high-contrast button, removes or extends the timeout with a warning, rewrites the error in plain language with a fix, adds human help routes, provides a before-and-after language table and a test plan with older participants, without a patronising tone."}
  - name: edge-capable-users
    vars:
      screens: "An investment dashboard on desktop with dense charts, 12px body text and hover-only tooltips explaining terms."
      users: "Retired professionals aged 65 to 80, confident with computers, some with declining near vision."
    assert:
      - {type: llm-rubric, value: "Keeps the full functionality and density options rather than simplifying away features, focuses on text size and scaling, contrast, replacing hover-only tooltips, and avoids assuming low tech confidence."}
  - name: negative-senior-mode-request
    vars:
      screens: "A banking app."
      users: "Make a separate 'Senior Mode' with huge buttons, cartoon icons and only three features, turned on automatically for anyone over 65."
    assert:
      - {type: llm-rubric, value: "Explains why an automatic, reduced senior mode is patronising and risky, recommends improving the main interface and offering opt-in display preferences instead, and asks for the actual screens before giving detailed changes."}
