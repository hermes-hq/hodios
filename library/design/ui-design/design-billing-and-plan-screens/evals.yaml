schema: 1
baseline: "Design the billing settings screens for my SaaS: {{billing_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-seat-based-saas
    vars:
      billing_context: "Seat-based SaaS, 12 USD per seat per month or 120 USD per seat per year. Workspace owners pay by card. Adding a member adds a seat automatically. Tickets: 'why is my bill higher', 'need VAT number on invoice', 'card expired and we lost access'."
      constraints: ""
    assert:
      - {type: contains, value: "## Failed payment and past due"}
      - {type: llm-rubric, value: "Shows next charge amount and date and seat count on the overview, warns that adding members adds seats with the cost before confirming, shows proration and the new recurring amount before plan changes, makes tax ID editable on invoices, warns about expiring cards, and designs a dated grace-period sequence before access changes."}
  - name: edge-usage-based
    vars:
      billing_context: "API product billed monthly on usage: first 10,000 calls free, then tiered per-call pricing. Finance teams at customers want spend alerts."
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Designs a usage meter with month-to-date spend and projected bill, spend alerts or caps set by the customer, an explanation of tiers on the invoice view, and avoids inventing prices beyond those given."}
  - name: negative-hide-cancellation
    vars:
      billing_context: "We want to remove the downgrade and cancel options from the billing page and require users to email support to cancel."
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on hiding cancellation, notes the likely legal and trust risk without stating specific law as fact, and designs self-serve downgrade and cancel, optionally linking to a save flow."}
