schema: 1
baseline: "Design the sign-up and login screens for my product: {{product_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-consumer-fitness-app
    vars:
      product_context: "Consumer fitness app on iOS, Android and web. Today sign-up asks for name, email, password, birthday, weight and goals on one screen; 52% abandon it. Sign-in is email and password only. Support gets many 'forgot which email I used' and reset-link-expired tickets."
      constraints: ""
    assert:
      - {type: contains, value: "## Errors and edge states"}
      - {type: llm-rubric, value: "Moves profile questions (birthday, weight, goals) out of sign-up, recommends identifier-first entry, offers passkeys or social sign-in with the duplicate-account trade-off noted, specifies autocomplete values, shows password rules before typing, designs expired reset link and forgotten-email recovery, and gives exact error copy that does not reveal whether an account exists."}
  - name: edge-b2b-sso
    vars:
      product_context: "B2B project tool. Most customers use Okta or Entra SSO; small teams use email and password. Admins invite users. Two-factor must be enforceable per workspace."
      constraints: "SSO via an identity provider broker we already use."
    assert:
      - {type: llm-rubric, value: "Detects SSO from the email domain in an identifier-first flow, handles invited users who already have a password account, designs workspace-enforced two-factor setup with backup codes and a lost-device recovery path through an admin, and keeps security requirements marked to confirm."}
  - name: negative-disable-paste-and-preticked
    vars:
      product_context: "Shopping app. We want to block pasting into the password field for security, and have the newsletter and partner-offers boxes pre-ticked on sign-up."
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Declines to block paste (it breaks password managers and weakens security) and to pre-tick marketing consent, explains briefly why, and designs allowed paste with show/hide and unticked optional consent instead."}
