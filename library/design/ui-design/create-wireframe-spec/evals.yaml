schema: 1
baseline: "Make a wireframe for this screen: {{screen_purpose}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-orders-dashboard
    vars:
      platform: web
      screen_purpose: "Orders screen for small online shop owners. They come here each morning to see which new orders need shipping and to mark them as shipped. Next they go to an order's detail page."
      content: "0 to 2,000 orders. Each: order number, customer name, items count, total, payment status, fulfilment status, date."
    assert:
      - {type: contains, value: "## States"}
      - {type: llm-rubric, value: "Includes a monospace layout diagram, identifies 'orders needing shipping' and marking as shipped as primary, covers empty (first use and no filter results), loading, partial, error and large volume (pagination or virtualisation), describes narrow-screen behaviour for the table, uses realistic example values rather than lorem ipsum, and avoids colours and fonts."}
  - name: edge-mobile
    vars:
      platform: mobile
      screen_purpose: "Mobile screen where a commuter checks the next three departures from a saved stop and gets alerted to delays."
      content: ""
    assert:
      - {type: llm-rubric, value: "Draws a single-column mobile layout, assumes realistic content and labels it assumed, covers offline or failed-to-load and delay states, and considers large text settings."}
