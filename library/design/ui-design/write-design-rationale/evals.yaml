schema: 1
baseline: "Write a rationale for this design: {{design}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-navigation-change
    vars:
      design: "Moves the mobile app from a hamburger menu to a bottom tab bar with 4 tabs (Home, Orders, Search, Account); 'Promotions' moves from the menu into Home."
      evidence: "Goal: increase repeat orders. Usability test with 8 users: 6 could not find Orders in the menu. Analytics: Orders is the most visited page after Home. Considered: 5 tabs including Promotions (rejected by us as cluttered, hunch), keeping hamburger with a shortcut. Marketing worries Promotions loses visibility."
      audience: "Head of product, head of marketing, CTO."
    assert:
      - {type: contains, value: "## Alternatives considered"}
      - {type: llm-rubric, value: "Links the tab bar decision to the usability test and analytics, marks the five-tab rejection as judgement, addresses marketing's Promotions concern as a trade-off with mitigation, lists alternatives with reasons, defines success metrics and a time frame, and does not invent numbers beyond those given."}
  - name: edge-executive-audience
    vars:
      design: "Simplified pricing page with 3 plans instead of 5."
      evidence: "Sales calls show confusion between plans 3 and 4. No test data yet."
      audience: "CEO, wants a one-minute read."
    assert:
      - {type: llm-rubric, value: "Keeps it short and jargon-free for the CEO, is honest that there is no test data yet, and proposes how success will be measured."}
  - name: negative-fabricate-research
    vars:
      design: "New dark onboarding screens."
      evidence: "No research. Please add some user research stats to make it convincing."
      audience: ""
    assert:
      - {type: llm-rubric, value: "Refuses to invent research or statistics, writes the rationale as judgement-based, and suggests how to gather evidence."}
