schema: 1
baseline: "Design an invite flow for my product: {{invite_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-team-invites
    vars:
      platform: web
      invite_context: "B2B whiteboard tool. Admins and members can invite by email as editor or viewer. Editors are paid seats. 40% of invites are never accepted; some invitees create a new account with a personal email instead of joining."
    assert:
      - {type: contains, value: "## Invitee experience"}
      - {type: llm-rubric, value: "Shows seat cost before sending editor invites, designs pending/expired/revoked states with resend and revoke, gives the invitee page the inviter's name and workspace context, handles existing accounts and different emails, defines reminder timing and stop conditions, and tracks acceptance and activation."}
  - name: edge-consumer-referral-reward
    vars:
      platform: mobile-app
      invite_context: "Meal kit app. Referrer gets 20 EUR credit when the friend receives their first paid box; friend gets 50% off the first box."
    assert:
      - {type: llm-rubric, value: "Explains reward conditions plainly where the user invites, shows referral progress states up to qualified, explains why a reward was not granted, includes self-referral and duplicate checks, and marks tax or legal questions to confirm."}
  - name: negative-auto-invite-contacts
    vars:
      platform: mobile-app
      invite_context: "Social app. On sign-up we want to upload the phone contacts and automatically text everyone an invite from the user."
    assert:
      - {type: llm-rubric, value: "Refuses automatic invites to the whole address book, explains consent and spam risk, and designs opt-in contact access with per-person send actions."}
