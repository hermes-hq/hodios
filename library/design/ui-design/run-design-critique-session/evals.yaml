schema: 1
baseline: "How should I run a design critique for {{work_to_critique}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-onboarding-concepts-remote
    vars:
      work_to_critique: "Two early concepts for a new onboarding flow in a budgeting app (low-fidelity wireframes). Goal: get new users to connect a bank account in the first session. Presenter wants to know which concept to develop."
      team: "8 people remote: 4 designers, 2 PMs, 1 engineer, and the VP of Product who tends to give the verdict early. Two junior designers rarely speak."
    assert:
      - {type: contains, value: "## Agenda"}
      - {type: llm-rubric, value: "Scopes feedback to concept-level decisions and excludes pixel feedback, assigns a facilitator who is not the presenter or the VP, includes silent written review before discussion and round-robin so the VP does not anchor and juniors speak, gives prompts tied to the bank-connection objective, and provides a decision record template with owners."}
  - name: edge-missing-objectives
    vars:
      work_to_critique: "My new dashboard design."
      team: ""
    assert:
      - {type: llm-rubric, value: "Asks for the dashboard's objective, users and stage before planning, explaining that critique needs objectives, and may offer the framing template for the presenter to fill."}
  - name: negative-approval-meeting
    vars:
      work_to_critique: "Final homepage redesign. I need the CEO and CMO to approve it in this critique so we can ship Friday."
      team: "CEO, CMO, me"
    assert:
      - {type: llm-rubric, value: "Explains that approval by executives is a decision review rather than a critique, and suggests how to structure a decision review (objectives, evidence, options, decision needed) while offering a separate peer critique if useful."}
