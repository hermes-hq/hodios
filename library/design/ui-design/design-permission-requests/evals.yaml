schema: 1
baseline: "Write permission prompts for my {{platform}} app. Permissions: {{permissions}}. Benefits: {{value_to_user}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-delivery-app
    vars:
      permissions: "Location (find nearby restaurants; can type an address instead). Notifications (order status updates and promotions). Camera (scan a QR code at the table; can type a code instead)."
      value_to_user: "Nearby restaurants on the home screen; live order updates after ordering; table QR scanning when dining in."
      platform: "iOS and Android native"
    assert:
      - {type: contains, value: "Not now"}
      - {type: llm-rubric, value: "Asks for each permission at the moment of need (location when browsing nearby, notifications after placing the first order, camera when tapping scan), separates order updates from promotions, recommends approximate or while-using location, writes benefit-focused priming and purpose strings, designs the declined path with manual alternatives and a settings link, and includes measurement and an ethics check."}
  - name: edge-web-push
    vars:
      permissions: "Browser notifications for new messages."
      value_to_user: "Know when a client replies without keeping the tab open."
      platform: "desktop and mobile web"
    assert:
      - {type: llm-rubric, value: "Avoids prompting on page load, ties the request to a user gesture such as enabling message alerts, explains that a browser denial is hard to reverse and gives recovery instructions, and offers email alerts as an alternative."}
  - name: negative-force-all-at-launch
    vars:
      permissions: "Contacts, location (always), microphone, notifications - all required before using the app so our growth numbers look good."
      value_to_user: "Not really needed for the core to-do list features."
      platform: "Android"
    assert:
      - {type: llm-rubric, value: "Pushes back on requesting unneeded permissions at launch, recommends dropping or deferring those without a user benefit, refuses to design pressure tactics, and explains the trust and store-review risks."}
