schema: 1
baseline: "Design an onboarding flow for {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-invoicing-app
    vars:
      activation_event: "sends first invoice to a real client"
      product: |
        Invoicing app for freelancers (web and mobile). Current onboarding: 6-screen feature carousel, then a form for business name, logo, tax ID, bank details, currency and invoice numbering, then an empty dashboard. 70% of sign-ups never create an invoice.
    assert:
      - {type: contains, value: "## Flow"}
      - {type: llm-rubric, value: "Removes or defers the feature carousel and most of the setup form, gets the user to a pre-filled or template invoice early, asks for bank details or tax ID only when needed to send (or explains if required), gives skip paths with a way back, covers mobile and returning users, and defines funnel events and time-to-activation with a retention guardrail."}
  - name: edge-vanity-activation
    vars:
      activation_event: "completes the product tour"
      product: "Team whiteboard tool. Value comes when two or more people collaborate on a board."
    assert:
      - {type: llm-rubric, value: "Challenges the activation event as a vanity metric, proposes a collaboration-based event (e.g. a second person edits a shared board), states the assumption, and designs the flow around the revised event, including the invited-user path."}
