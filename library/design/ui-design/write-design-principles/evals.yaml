schema: 1
baseline: "Write design principles for {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-logistics-dispatch-tool
    vars:
      product: "Dispatch software used by logistics coordinators who watch 200+ shipments on large monitors all day. Debates: marketing wants a spacious, branded look like our website; coordinators ask for more rows on screen. Another debate: whether to auto-refresh the board (things move) or let users refresh manually."
      values: "Company values: reliability, speed, respect for the customer's time. Research: coordinators keep a spreadsheet open because the app shows too little at once."
    assert:
      - {type: contains, value: "## Tested against real decisions"}
      - {type: llm-rubric, value: "Writes 4 to 6 principles that take positions (for example density over decoration), each with meaning, accepted trade-off, concrete do and don't examples on the dispatch board, and its source in the research or values; ranks them; settles both debates by naming the deciding principle and outcome; and lists rejected generic candidates like simple or delightful."}
  - name: edge-evaluate-drafts
    vars:
      product: "Mobile banking app for older adults. Debate: whether to follow iOS and Android defaults or a custom consistent look across both."
      values: "Draft principles: Simple. Delightful. Accessible. Human."
    assert:
      - {type: llm-rubric, value: "Evaluates the drafts as too generic, rewrites them as positioned principles with trade-offs tied to older users, and settles the platform-defaults debate with a principle."}
  - name: negative-no-debates
    vars:
      product: "A SaaS product."
      values: ""
    assert:
      - {type: llm-rubric, value: "Asks for users and two or three real design disagreements before writing principles, explaining that otherwise they will be generic, rather than producing generic principles."}
