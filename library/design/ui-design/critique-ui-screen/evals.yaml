schema: 1
baseline: "Give me feedback on this UI screen: {{screen}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pricing-page
    vars:
      platform: web
      goal: "Get visitors to start a free trial of the Pro plan."
      screen: |
        Pricing page, desktop. Top: large hero image of a team laughing (60% of first viewport), headline "Pricing" in 18px.
        Below: three plan cards (Free, Pro, Enterprise) of equal size. Each has a filled blue button: "Sign up", "Buy", "Contact".
        Pro card has no "recommended" marker. Feature lists use grey #B0B0B0 14px text on white.
        A FAQ accordion follows, then a footer. A second "Start free trial" link sits in the footer in 12px.
    assert:
      - {type: contains, value: "## Issues"}
      - {type: llm-rubric, value: "Identifies that the primary action (start Pro trial) is not visually dominant: three equal filled buttons, inconsistent button labels, no recommended plan, trial CTA buried in the footer, hero image pushing plans below the first viewport. Flags the light grey feature text as a likely contrast failure needing a check. Ranks issues P1-P3 with specific fixes, and includes a revised layout."}
  - name: edge-ios-conventions
    vars:
      platform: ios
      goal: "Let users log a workout quickly."
      screen: "Workout logging screen. Floating action button bottom-right (Android-style) to add a set. Custom back arrow top-right. Tab bar at the top of the screen. Set rows have 28x28 pt delete icons."
    assert:
      - {type: llm-rubric, value: "Points out conflicts with iOS conventions (back navigation top-left, tab bar at the bottom, floating action button is an Android pattern) and that 28 pt targets are below the 44 pt guideline, with concrete fixes."}
  - name: negative-too-vague
    vars:
      platform: web
      goal: ""
      screen: "The dashboard."
    assert:
      - {type: llm-rubric, value: "Asks for a screenshot or a detailed description rather than giving generic advice."}
