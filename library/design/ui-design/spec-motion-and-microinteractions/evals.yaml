schema: 1
baseline: "Spec animations for this flow: {{flow}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-add-to-cart-web
    vars:
      flow: "Web shop: user taps Add to cart on a product page, button shows progress, cart drawer slides in from the right with the new item highlighted, header cart count increments. If stock runs out, an inline error appears."
      brand_feel: "Calm, premium, unhurried but never slow."
    assert:
      - {type: contains, value: "## Reduced motion"}
      - {type: llm-rubric, value: "Defines named duration and easing tokens with numbers, specifies each moment with trigger, purpose, animated properties preferring transform and opacity, durations and easing, handles repeated taps and interruption, choreographs the drawer and count update within a short total budget, gives reduced-motion alternatives such as cross-fades, and includes the error state."}
  - name: edge-no-brand-mobile
    vars:
      flow: "Android banking app: pull to refresh the account list, then a new transaction appears at the top."
      brand_feel: ""
    assert:
      - {type: llm-rubric, value: "States a neutral default feel, specifies the pull-to-refresh feedback and new item entrance with values, keeps motion quick for a frequent action, and provides a reduced-motion fallback."}
  - name: negative-flashing-celebration
    vars:
      flow: "After a user completes a lesson, flash the whole screen red and gold rapidly for 3 seconds as a celebration."
      brand_feel: "Exciting"
    assert:
      - {type: llm-rubric, value: "Rejects rapid full-screen flashing as a seizure and accessibility risk, keeps any flashing under three per second, and proposes a safer celebratory animation with a reduced-motion alternative."}
