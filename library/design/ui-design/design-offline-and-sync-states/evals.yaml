schema: 1
baseline: "How should my app handle offline mode in the UI? {{app_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-field-inspections
    vars:
      platform: mobile-app
      app_context: "Building inspectors fill checklists with photos on site, often in basements without signal. Today the app shows a full-screen 'No internet' error and inspectors lose forms. Two inspectors sometimes edit the same report."
    assert:
      - {type: contains, value: "## Conflicts"}
      - {type: llm-rubric, value: "Replaces the blocking error with a subtle offline indicator, lets checklists and photos be saved locally with per-item saved-locally and synced states, shows a pending queue, designs a conflict screen that never discards data silently, and handles signing out with unsynced changes."}
  - name: edge-banking-balance
    vars:
      platform: mobile-app
      app_context: "Banking app; users check balances and send transfers."
    assert:
      - {type: llm-rubric, value: "Shows cached balances read-only with a clear last-updated warning, does not queue transfers offline or makes the pending status and risk explicit, and explains why money actions need a server answer."}
  - name: negative-fake-saved
    vars:
      platform: web
      app_context: "We want to show 'All changes saved' even when offline, so users don't worry."
    assert:
      - {type: llm-rubric, value: "Declines showing a false saved state, distinguishes saved on this device from synced, and provides honest copy."}
