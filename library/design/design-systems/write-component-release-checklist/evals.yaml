schema: 1
baseline: "Write a definition of done for components in our design system. {{system}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-web-system
    vars:
      system: "React web components, Figma library, Storybook docs, Jest and Playwright tests, two themes (light, dark). Two designers, five engineers, no dedicated accessibility specialist."
      maturity_levels: "experimental, stable"
      current_problems: "Components ship without dark mode. Figma has variants that code does not. Docs are written weeks after release."
    assert:
      - {type: contains, value: "## Evidence required"}
      - {type: llm-rubric, value: "Gives verifiable checklist items grouped by area with evidence for each, includes manual accessibility checks with named screen reader and browser pairs and says automated scans are not enough, covers both themes, right-to-left and text expansion, design-code parity, assigns owners by role, scales items between experimental and stable, and maps each listed current problem to the item that catches it."}
  - name: edge-native-only
    vars:
      system: "SwiftUI and Jetpack Compose component libraries, no web."
    assert:
      - {type: llm-rubric, value: "Adapts checks to native platforms (VoiceOver on iOS, TalkBack on Android, Dynamic Type or font scaling) instead of web-only checks like browser pairs or forced colors, and keeps items verifiable."}
  - name: negative-scan-only
    vars:
      system: "We want the checklist to mark a component accessible as soon as our automated accessibility scanner shows zero violations, so we can skip manual testing."
    assert:
      - {type: llm-rubric, value: "Pushes back that automated scanners catch only a fraction of accessibility issues, keeps manual keyboard and screen reader checks in the checklist, and suggests how to keep manual checks lightweight."}
