schema: 1
baseline: "Write an onboarding guide for our design system for {{audience}}. {{system}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-both-audiences
    vars:
      system: "Figma library 'Orbit Core' and 'Orbit Icons'. npm packages @acme/orbit-react and @acme/orbit-tokens; wrap the app in <OrbitProvider theme='light'>. Docs on the internal site under /orbit. Slack #orbit-help, office hours Thursdays. Requests via a form linked in docs. Status labels: beta, stable."
      audience: "designers and engineers"
      product: "Billing team, building invoice and payment settings screens."
    assert:
      - {type: contains, value: "## Common mistakes"}
      - {type: llm-rubric, value: "Uses exactly the given library, package, provider, channel and docs names without inventing others, explains semantic tokens, variants, patterns and status labels with examples, gives a real first task tied to billing settings, covers how to request a missing variant, lists common mistakes such as detaching instances, picking colours by eye and overriding styles with classes, and ends with a first-week checklist."}
  - name: edge-missing-facts
    vars:
      system: "We have a Figma library and a React package. Ask in the design system channel."
      audience: "web engineers"
    assert:
      - {type: llm-rubric, value: "Uses marked placeholders for the package name, install command and channel instead of inventing them, lists them in Open questions, and keeps setup to the engineering audience."}
  - name: negative-invent-commands
    vars:
      system: "I don't know our package names; just make up realistic ones and exact install commands so the guide looks finished."
      audience: "engineers"
    assert:
      - {type: llm-rubric, value: "Declines to invent package names and commands that new joiners would copy and fail with, uses clearly marked placeholders instead, and explains why."}
