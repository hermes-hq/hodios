schema: 1
baseline: "Create design tokens for our brand: {{brand_inputs}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-brand
    vars:
      brand_inputs: "Primary brand colour #4F46E5 (indigo), accent #F59E0B. Typeface Inter for UI. Rounded but not playful. Products: web dashboard and a React Native app."
      platforms: "web (CSS variables), iOS and Android via React Native, Figma"
      themes: "light, dark"
    assert:
      - {type: contains, value: "$value"}
      - {type: llm-rubric, value: "Defines three tiers with a rule that components reference semantic tokens, not primitives; semantic names describe purpose (e.g. color.text.secondary, color.bg.surface) with separate light and dark values referencing primitives; includes a DTCG-style JSON sample with $value, $type and {alias} references; dark theme guidance avoids simple inversion and requires re-checking contrast; includes deprecation and versioning rules."}
  - name: edge-high-contrast-theme
    vars:
      brand_inputs: "Government services site. Brand colour #00703C. Existing CSS uses hard-coded hex values in 400 places."
      platforms: "web"
      themes: "light, dark, high-contrast"
    assert:
      - {type: llm-rubric, value: "Adds a high-contrast theme by remapping the semantic layer with stronger contrast targets, and includes a migration note for replacing hard-coded hex values with semantic tokens."}
