schema: 1
baseline: "Design layout components for our design system: {{system}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-react-css-modules
    vars:
      system: "React with TypeScript and CSS modules. Spacing tokens --space-1 to --space-10 (4px base). Teams keep rebuilding: settings forms, card grids that wrap, a page with a filter sidebar, and toolbars with buttons that wrap."
      current: "A Flex component that accepts any CSS prop, plus wrapper divs with margin-top on every child."
    assert:
      - {type: contains, value: "## What not to build"}
      - {type: llm-rubric, value: "Proposes about five to seven primitives with small typed APIs whose spacing props accept only token names, uses gap rather than child margins, includes an as prop for semantics, warns against visual reordering props for focus and reading order, implements some primitives in React with CSS modules, rebuilds the listed layouts, and plans deprecation of the all-props Flex."}
  - name: edge-tailwind
    vars:
      system: "Vue 3 with Tailwind; spacing uses Tailwind's default scale. Layouts: dashboards with stat cards, two-column forms."
    assert:
      - {type: llm-rubric, value: "Writes the primitives as Vue components using Tailwind classes, maps spacing props to a fixed set of scale values without building class names by string interpolation that Tailwind cannot detect, and uses intrinsic grid techniques before breakpoint props."}
  - name: negative-style-props
    vars:
      system: "React. We want a single Box component that accepts every CSS property as a prop with any pixel value so nobody needs CSS again."
    assert:
      - {type: llm-rubric, value: "Pushes back on an all-props Box with raw values because it recreates hard-coded styling outside the token system, explains the cost, and proposes a small set of token-constrained primitives instead of building the requested Box."}
