schema: 1
baseline: "Add accessibility notes to this design for the developers: {{screen_description}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-settings-screen
    vars:
      screen_description: |
        Account settings page in a web app.
        Top bar: logo (links home), main nav (Dashboard, Projects, Settings - current), avatar button opening a menu (Profile, Sign out).
        Left sub-nav: Profile, Notifications, Billing (current).
        Main: large bold text "Billing" (styled like a heading), smaller bold "Payment method" and "Invoices".
        Payment method card: card icon, "Visa ending 4242", "Update" link-styled button opening a modal with card fields.
        Invoices table: Date, Amount, Status (green/red dot only), and a download icon button per row.
        After updating the card, a green toast appears for 3 seconds: "Payment method updated".
      components: "Modal and Menu come from our accessible component library. Toast is custom."
    assert:
      - {type: contains, value: "## Focus order"}
      - {type: llm-rubric, value: "Defines landmarks including two named navigation regions, an h1 'Billing' with h2s, a numbered focus order, row-specific accessible names for download icon buttons, aria-current for current nav items, flags status conveyed by colour dots alone and requires a text status, defers modal and menu behaviour to the library, specifies the custom toast as a polite status announcement and questions the 3-second timeout, and cites WCAG 2.2 criteria correctly."}
  - name: edge-custom-widget
    vars:
      screen_description: "Flight search form with a custom date-range picker (calendar grid, two months side by side, prices under each day) and a passenger counter with minus and plus buttons."
      components: "Both are custom, no accessibility spec."
    assert:
      - {type: llm-rubric, value: "Specifies keyboard interaction for the calendar grid (arrow keys, Page Up and Page Down for months, Home and End, Enter to select), names for days that include the date and price, announcement of the selected range, focus return on close, and labelled minus and plus buttons with the count announced, following ARIA Authoring Practices patterns."}
  - name: negative-too-thin
    vars:
      screen_description: "Our homepage."
      components: ""
    assert:
      - {type: llm-rubric, value: "Asks for an element-by-element description or layer list of the homepage and stops, without inventing elements to annotate."}
