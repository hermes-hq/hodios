schema: 1
baseline: "Plan the governance of our design system. Context: {{org_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mid-size
    vars:
      org_context: "Fintech, 14 product teams, 22 designers, 120 engineers, web (React) and native iOS/Android. Design system team: 2 designers and 3 engineers. Leadership wants faster delivery and consistent UI."
      current_state: "Figma library and React package v2. Mobile teams built their own components. Many detached instances. Requests to the DS team wait 6+ weeks. Breaking changes shipped in a minor release last quarter and broke checkout."
    assert:
      - {type: contains, value: "## Decision rights"}
      - {type: llm-rubric, value: "Recommends a hybrid model with a core team and product-team contributors sized to 5 people, defines decision rights with turnaround times, a contribution process with reuse evidence and accessibility review, semantic versioning rules that would classify the checkout-breaking change as major with migration guides, a deprecation lifecycle with notice periods, measurable adoption metrics (coverage, version lag, detached instances, request cycle time), a plan to bring mobile platforms in, and a 90-day plan."}
  - name: edge-small-startup
    vars:
      org_context: "Start-up with 3 product squads, 2 designers, 12 engineers, one web app. No dedicated design system team."
    assert:
      - {type: llm-rubric, value: "Proposes a lightweight federated model with part-time ownership, avoids heavy bureaucracy such as review boards, and keeps versioning and contribution steps simple while still defining who decides."}
  - name: negative-too-thin
    vars:
      org_context: "We have a design system."
    assert:
      - {type: llm-rubric, value: "Asks a few specific questions about team sizes, platforms, who maintains the system and the current problems before proposing a governance model."}
