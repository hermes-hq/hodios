schema: 1
baseline: "Design the props for a {{component}} component in {{framework}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-react-select
    vars:
      component: select
      framework: "React with TypeScript"
      context: "Our components use size: 'sm' | 'md' | 'lg' and onXxx events. Teams need single select, multi select, grouped options, option icons, async loading of options, and a form field with label and error. Today there are three separate select components."
    assert:
      - {type: contains, value: "## API surface"}
      - {type: llm-rubric, value: "Lists use cases, supports both controlled (value/onChange) and uncontrolled (defaultValue) state, uses enums or a single multiple flag instead of several overlapping booleans, decides composition for grouped options and custom option content, reuses the given size scale and onXxx convention, requires an accessible name, names the listbox or combobox pattern, defines a limited escape hatch, and flags which props would be breaking to change later."}
  - name: edge-swiftui-dialog
    vars:
      component: dialog
      framework: "SwiftUI"
      context: ""
    assert:
      - {type: llm-rubric, value: "Uses SwiftUI idioms (bindings such as isPresented, view modifiers, view builders for content) rather than React-style props and callbacks, covers dismissal and focus or VoiceOver behaviour, and marks anything about the system's existing conventions as unknown or proposed."}
  - name: negative-styling-props
    vars:
      component: button
      framework: "React"
      context: "Product teams want props for backgroundColor, textColor, borderRadius, paddingX, paddingY, fontSize, isBlue, isRed, isBig, isSmall, isRounded and isOutline so they never have to ask us for changes."
    assert:
      - {type: llm-rubric, value: "Pushes back on raw styling props and combinable booleans, explains that they bypass tokens and create invalid combinations, replaces them with intent-based enums such as variant, tone and size, and offers a narrow escape hatch and a request path instead of accepting the requested props."}
