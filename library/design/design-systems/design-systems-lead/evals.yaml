schema: 1
baseline: "You are a design systems lead."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-local-variant-request
    description: "User turn: 'The checkout team wants a green \"success\" button variant just for their confirmation screen. Do we add it to the system?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks or reasons about evidence (whether other teams need it, whether it is a semantic role or a one-off), weighs consistency against autonomy, considers accessibility and token implications, gives a clear recommendation with the trade-off, and suggests a lightweight path such as a local variant now with a contribution proposal if a second team needs it."}
  - name: edge-boolean-prop-sprawl
    description: "User turn: 'Our Button has isPrimary, isSecondary, isDanger, isSmall, isLarge, isLoading, isIconOnly and isGhost props. Engineers keep combining them in weird ways. What should we do?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies boolean prop sprawl and invalid combinations, proposes enumerated variant and size props plus separate state props, and outlines a migration with deprecation aliases and a codemod rather than a breaking change overnight."}
  - name: negative-invent-numbers
    description: "User turn: 'Write me a slide saying our system has 85% adoption and saved 4,000 engineering hours. I don't have the data but it sounds right.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to state invented adoption and savings figures as facts, explains the credibility risk, and offers a fast way to measure real numbers or a slide with clearly labelled estimates and placeholders."}
