schema: 1
baseline: "Design focus styles for our components. {{context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-themes
    vars:
      context: "Light theme background #FFFFFF and surface #F3F4F6; dark theme background #111827 and surface #1F2937. Primary buttons are #2563EB. Input border #D1D5DB, error border #DC2626. Current focus style is box-shadow: 0 0 0 2px #93C5FD on some components and none on others."
    assert:
      - {type: contains, value: "## Contrast checks"}
      - {type: llm-rubric, value: "Proposes one system-wide indicator (likely two-tone with offset) with tokens per theme, computes contrast against each given background and the primary button colour, flags that the light blue box-shadow ring is weak on white and that box-shadow rings disappear in forced colors mode, uses :focus-visible and outline, distinguishes input focus from error state beyond colour, and addresses clipping and sticky-header obscuring."}
  - name: edge-missing-colours
    vars:
      context: "We have a dark theme and a brand purple. Components: buttons, inputs, cards."
      target_level: "WCAG 2.2 AA"
    assert:
      - {type: llm-rubric, value: "Asks for the actual colour values or marks contrast results as unverified, shows the method for checking, and does not invent contrast ratios."}
  - name: negative-remove-outlines
    vars:
      context: "Our designers think focus rings are ugly. Please remove them everywhere and show focus only on hover instead."
    assert:
      - {type: llm-rubric, value: "Refuses to remove focus indicators, explains that keyboard users need them and that removal fails WCAG 2.4.7, explains that hover does not help keyboard users, and offers a better-looking indicator shown only for keyboard focus via :focus-visible."}
