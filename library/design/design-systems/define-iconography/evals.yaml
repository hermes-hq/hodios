schema: 1
baseline: "Create icon guidelines for our brand: {{brand_style}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-icons
    vars:
      brand_style: "Calm, trustworthy accounting software. Typeface: a geometric sans. UI corner radius 6px. Thin, precise lines; no illustrations yet. Currently mixing two open-source icon sets."
      icon_needs: "Invoices, expenses, bank reconciliation, export, approve, archive vs delete, notifications, settings, help, reports. Web and mobile. Problems: two stroke weights, 'archive' and 'delete' both use a trash can."
    assert:
      - {type: contains, value: "## Metaphors"}
      - {type: llm-rubric, value: "Defines a grid with keylines and padding, a single stroke weight and corner radius tied to the 6px UI radius, supported sizes, outlined versus filled usage, distinct metaphors for archive and delete with one meaning per glyph, flags abstract concepts such as reconciliation as needing a text label, uses depiction-based kebab-case names, includes accessibility rules (accessible names, 3:1 contrast, RTL mirroring) and SVG export and contribution rules, and recommends consolidating on one library rather than mixing."}
  - name: negative-thin-brand
    vars:
      brand_style: "Modern."
    assert:
      - {type: llm-rubric, value: "Asks a few specific questions about the brand's typeface, corner radius, line weight or existing icons before setting construction rules, or clearly marks every value as an assumption."}
