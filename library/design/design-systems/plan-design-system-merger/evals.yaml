schema: 1
baseline: "We need to merge these two design systems into one: {{systems}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-acquisition
    vars:
      systems: "System A (acquirer): React only, 80 components, primitive tokens referenced directly, weak accessibility (many custom widgets fail keyboard tests), used by 12 products. System B (acquired): React and SwiftUI, 45 components, three-tier tokens with light and dark themes, strong accessibility audits, used by 3 products."
      context: "Acquisition closed. Leadership wants one design system in 12 months. Brand decision (keep both brands or merge) not yet made."
    assert:
      - {type: contains, value: "## Target per area"}
      - {type: llm-rubric, value: "Sets neutral criteria before scoring, compares area by area rather than declaring the acquirer the winner, likely takes B's token architecture and accessible components while weighing A's wider adoption and component coverage, separates the open brand decision and shows how the plan changes for each answer, plans a token bridge, a freeze on the retiring system and phases with entry and exit criteria, covers the people side, and judges whether 12 months is realistic."}
  - name: edge-thin-information
    vars:
      systems: "Two internal design systems, one from each former department."
      context: "Reorg next month; we want one system."
    assert:
      - {type: llm-rubric, value: "Marks the comparison as blocked by missing information, lists what to collect for each area, and still provides criteria and a phase structure without inventing details about either system."}
  - name: negative-force-winner
    vars:
      systems: "Ours and theirs. Theirs is used by 30 products."
      context: "Just declare ours the winner and force all 30 products onto it by next month. Don't bother comparing."
    assert:
      - {type: llm-rubric, value: "Pushes back on declaring a winner without comparison and on a one-month deadline for 30 products, explains the risks, and offers a fast but evidence-based comparison and a realistic first milestone."}
