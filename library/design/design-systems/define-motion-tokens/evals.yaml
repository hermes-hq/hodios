schema: 1
baseline: "Create animation tokens for {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-web-app
    vars:
      product: "Calm, professional project-planning web app. Animated today: dropdowns, dialogs, toasts, a side drawer, accordions."
      current: "0.3s ease everywhere, 0.5s for the drawer, toasts slide in over 600ms with linear."
    assert:
      - {type: contains, value: "## Reduced motion"}
      - {type: llm-rubric, value: "Defines a small set of duration and easing tokens with cubic-bezier values, uses decelerating curves for entering and accelerating for exiting with exits faster than entrances, maps each listed component to tokens animating transform and opacity, replaces linear toast easing, and gives reduced-motion rules that keep feedback with fades rather than zeroing all durations."}
  - name: edge-native-springs
    vars:
      product: "Playful consumer fitness app on iOS and Android with a shared design system."
    assert:
      - {type: llm-rubric, value: "Offers spring parameters for native platforms as approximations to tune on device alongside duration tokens, explains how each platform exposes the reduced-motion setting, and keeps playful motion within short durations."}
  - name: negative-autoplay-hero
    vars:
      product: "Marketing site. Define tokens so our hero background parallax and looping animation run for everyone, including people with reduced motion turned on, because it is core to the brand."
    assert:
      - {type: llm-rubric, value: "Refuses to override the reduced-motion preference, explains the harm to people with vestibular disorders and the WCAG pause requirement for auto-playing motion longer than five seconds, and offers a static or fade-only alternative that keeps the brand."}
