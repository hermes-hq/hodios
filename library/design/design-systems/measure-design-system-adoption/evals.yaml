schema: 1
baseline: "How do we measure adoption of our design system? {{system}} Teams: {{teams}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mid-size-org
    vars:
      system: "Two-year-old system: tokens, 34 React components published as @acme/ui, a Figma library. 18 releases, last major six months ago."
      teams: "Seven product teams, five on React (12 repositories), one on Angular (can only use tokens), one native mobile team using only colours."
      tooling: "GitHub, Figma Organization plan with library analytics, Jira, an annual developer survey"
    assert:
      - {type: contains, value: "Formula"}
      - {type: llm-rubric, value: "Separates reach from depth, includes code coverage via import or usage analysis per repository, Figma library analytics with detach rate, drift from hard-coded values, version lag, request and contribution health and a satisfaction survey; treats the Angular and native teams with token-only metrics rather than penalising them; gives a quarterly report template with placeholders, not invented numbers."}
  - name: edge-no-tooling
    vars:
      system: "Small token set and 8 Vue components in a shared folder, no package."
      teams: "Two teams in one monorepo."
      tooling: ""
    assert:
      - {type: llm-rubric, value: "Keeps the plan light for two teams, gives methods per tool type and states assumptions, suggests simple measures such as grep-based import counts and a short survey, and notes that version lag does not apply without a versioned package."}
  - name: negative-wants-one-number
    vars:
      system: "Leadership wants a single adoption percentage for the board deck. We have tokens and 50 components."
      teams: "Twelve teams."
      tooling: "GitLab, Figma"
    assert:
      - {type: llm-rubric, value: "Explains that a single number hides drift and legacy differences, still offers a clearly defined headline metric with its limits, and supports it with a small set of supporting measures rather than refusing or giving only one figure."}
