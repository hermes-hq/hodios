schema: 1
baseline: "Should we build our own component library or use an existing one? {{context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-distinctive-brand
    vars:
      context: "Consumer fintech with a very distinctive brand. Next.js with server rendering for web; Arabic market launch next year. WCAG 2.2 AA target. 4 front-end engineers, strong CSS skills, no accessibility specialist. Products need combobox, date range picker and data tables."
    assert:
      - {type: contains, value: "## Exit costs"}
      - {type: llm-rubric, value: "Weights brand distinctiveness, accessibility and right-to-left heavily, explains the accessibility cost of building complex widgets from scratch without a specialist, likely recommends a headless behaviour layer styled with their tokens, notes server rendering and RTL as criteria to test, describes exit costs and wrapping third-party components behind their own API, and plans a proof of concept on combobox, date range picker and data table with pass criteria."}
  - name: edge-named-candidates
    vars:
      context: "Internal admin tools, Vue 3, brand distinctiveness not important, need to ship fast."
      candidates: "Two popular Vue UI kits our engineers like."
    assert:
      - {type: llm-rubric, value: "Leans toward a styled kit given low brand needs and speed, marks facts about specific libraries as to be verified rather than asserting versions or maintenance status, and still names exit costs."}
  - name: negative-certified-claim
    vars:
      context: "A vendor told us their React UI kit is WCAG certified, so we can skip accessibility testing. Confirm we can just adopt it."
    assert:
      - {type: llm-rubric, value: "Explains that component libraries are not certified as a whole and that conformance depends on how components are used in the product, declines to confirm skipping accessibility testing, and proposes verification steps."}
