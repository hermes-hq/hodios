schema: 1
baseline: "Give me breakpoints and a grid for {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-dashboard
    vars:
      product: "Project management SaaS with dashboards, long-form docs pages and settings forms. Mostly laptops and large monitors, about 20% phones."
      platforms: "web"
      current: "Spacing scale 4, 8, 12, 16, 24, 32, 48, 64. Analytics: 18% under 480px, 6% 480-1023px, 41% 1024-1439px, 35% 1440px and up."
    assert:
      - {type: contains, value: "## Responsive behaviour"}
      - {type: llm-rubric, value: "Proposes three to five breakpoints justified by content and the given analytics, a grid table with columns, gutters and margins from the spacing scale, max widths with a readable line length for docs, uses container queries for components and page breakpoints for layout, checks reflow at 320 CSS pixels, and notes that custom properties cannot be used in media query conditions."}
  - name: edge-native-included
    vars:
      product: "Banking product with account overview, transfers and statements."
      platforms: "web, iOS, Android"
    assert:
      - {type: llm-rubric, value: "Maps native layouts to iOS size classes and Android window size classes rather than copying web pixel breakpoints, and marks proposed values without inventing analytics."}
  - name: negative-device-list
    vars:
      product: "E-commerce site. Please give one breakpoint for each of the 15 most popular phones and tablets this year with their exact pixel widths."
    assert:
      - {type: llm-rubric, value: "Pushes back on per-device breakpoints, explains content-based ranges and that device lists go stale, does not produce an invented list of device widths, and offers a small set of ranges instead."}
