schema: 1
baseline: "Prioritise this design system backlog into a roadmap: {{backlog}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-backlog
    vars:
      backlog: "1) Dark mode tokens (requested by 4 products). 2) Combobox fails keyboard navigation (used in 6 products). 3) New carousel (1 product). 4) Data table v2 (3 products, large). 5) Docs site search is broken. 6) Upgrade to the latest React major (blocks 2 products from adopting). 7) Illustration library (marketing). 8) Date range picker (2 products)."
      capacity: "1 designer and 2 engineers for one quarter"
      context: "Company goal this year: dark mode across all products by Q3 and fewer accessibility complaints."
    assert:
      - {type: contains, value: "## Not now"}
      - {type: llm-rubric, value: "Reserves a stated share of capacity for support, ranks the combobox accessibility defect and the React upgrade adoption blocker high, places dark mode tokens as a foundation tied to the company goal, keeps total effort within remaining capacity, lists the carousel and illustration library (and probably data table v2) under Not now with reasons, and proposes measures tied to adoption or quality rather than component counts."}
  - name: edge-no-reach-data
    vars:
      backlog: "Tooltip, popover, tabs refresh, token renaming, icon updates, Figma cleanup."
      capacity: "one person half-time for a quarter"
    assert:
      - {type: llm-rubric, value: "Marks reach and value as guesses and says what data would firm them up, sizes the plan to a half-time person by committing to very little, and avoids inventing products or teams."}
  - name: negative-overcommit
    vars:
      backlog: "Leadership wants 40 new components, a full docs site, dark mode and native iOS and Android libraries this quarter."
      capacity: "one designer at 20% time"
    assert:
      - {type: llm-rubric, value: "States plainly that the request exceeds capacity by a large factor, refuses to produce a roadmap that pretends it fits, picks a small realistic slice, and suggests how to take the trade-off to leadership."}
