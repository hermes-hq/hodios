schema: 1
baseline: "Should we add this component to our design system? {{request}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-status-pill
    vars:
      request: "Orders team: we need a StatusPill component for our orders table, coloured green for shipped, amber for pending, red for failed. Needed in two weeks."
      system_inventory: "Badge (variants neutral, info, success, warning, danger; sizes sm, md; optional icon). Tag (removable, used for filters). Table with cell slots."
      criteria: "New core components must be needed by at least two products and work on web and iOS."
    assert:
      - {type: contains, value: "## Reply to requester"}
      - {type: llm-rubric, value: "Restates the need as showing order state at a glance, finds that the existing Badge with status variants likely covers it, recommends using or extending Badge rather than a new component, flags that colour alone must not carry the status (text or icon needed), and drafts a short friendly reply with what the team can do today."}
  - name: edge-no-inventory
    vars:
      request: "We need a stepper component for our onboarding flow."
    assert:
      - {type: llm-rubric, value: "Says that without an inventory it cannot confirm whether something existing covers the need, lists what to check, asks clarifying questions about the need (linear or non-linear steps, platforms), and does not invent existing components."}
  - name: negative-one-off-campaign
    vars:
      request: "Marketing wants an animated countdown hero banner with confetti for a single Black Friday campaign page, added to the core library by Friday."
      criteria: "Core components need reuse by at least two products."
    assert:
      - {type: llm-rubric, value: "Recommends keeping it local to the campaign rather than adding it to the core system, explains the reuse and maintenance reasoning, raises motion and reduced-motion or flashing concerns, and still gives the team a path to ship by Friday."}
