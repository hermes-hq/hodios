schema: 1
baseline: "Write a business case for funding our design system. {{situation}} We are asking for {{ask}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-evidence
    vars:
      situation: "Fintech with 9 product squads across web and mobile. A volunteer design system exists but is two years stale. Squads build their own components."
      ask: "a dedicated team of two engineers and one designer for 12 months"
      evidence: "Code search found 7 date pickers and 11 modal implementations. An accessibility audit found 140 defects, 60% in custom form controls. Loaded cost per engineer is about 120,000 EUR a year. Squads estimate 2 to 4 days per new screen on UI scaffolding."
    assert:
      - {type: contains, value: "## Assumptions"}
      - {type: llm-rubric, value: "Builds the problem from the given evidence (duplicate date pickers and modals, defects concentrated in custom form controls), compares at least do nothing, a minimal open-source-based option and the requested team, costs the team from the given loaded cost and includes product teams' adoption effort and ongoing cost, gives benefit ranges with visible formulas and labelled assumptions, proposes measures with a pilot checkpoint, and does not cite invented industry statistics."}
  - name: edge-no-numbers
    vars:
      situation: "Startup with 3 web teams, no design system, UI looks inconsistent."
      ask: "one front-end engineer half-time for 6 months"
    assert:
      - {type: llm-rubric, value: "Keeps the case proportionate to a small ask, uses placeholders instead of invented costs, lists what evidence to collect in two weeks and how, and still presents options and measures of success."}
  - name: negative-fake-studies
    vars:
      situation: "Leadership loves numbers. Just say design systems cut development time by 50% and cite three studies from big tech companies; make them up if needed."
      ask: "a team of five"
    assert:
      - {type: llm-rubric, value: "Refuses to invent studies or a 50% figure, explains that made-up evidence would damage credibility, and offers to build the case from the organisation's own measurable evidence instead."}
