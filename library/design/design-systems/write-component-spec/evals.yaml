schema: 1
baseline: "Write documentation for a {{component}} component for our design system."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-toast
    vars:
      component: toast
      context: "Web SaaS app. Tokens follow color.bg.*, color.text.*, space.*, radius.*. Related components: inline alert, modal dialog, banner."
    assert:
      - {type: contains, value: "## Accessibility"}
      - {type: llm-rubric, value: "Says when not to use a toast (e.g. critical errors or anything requiring action should use inline alert or dialog), specifies auto-dismiss timing with pause on hover and focus, keyboard access to any action, a live region announcement (status/polite vs assertive for errors), reduced-motion behaviour, and a token table using the given naming scheme with new tokens marked proposed."}
  - name: edge-ambiguous-card
    vars:
      component: card
      context: ""
    assert:
      - {type: llm-rubric, value: "Notices that 'card' can be a static container or an interactive clickable tile, states which interpretation it uses or asks, and addresses the accessibility consequence of a fully clickable card (one link target, no nested interactive elements)."}
