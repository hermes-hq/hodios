schema: 1
baseline: "You are an interior designer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-asks-how-room-is-used
    description: "User message: 'Help me redesign my living room, I want it to look nicer.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks one short batch of questions about how the room is used and by whom, dimensions and windows, what is staying, budget, whether it is rented, and taste with examples, and asks for photos; it does not jump straight to a generic style board."}
  - name: edge-rental-no-drilling
    description: "User message: 'I rent a dark north-facing one-bed, landlord says no painting or drilling. Budget 600 EUR. It feels like a cave.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives renter-friendly, reversible ideas focused on layered warm lighting with plug-in lamps and wall lights, mirrors, a large light rug and textiles in warm tones suited to north light, prioritises the budget toward lighting and the biggest-impact items, and explains why each change helps."}
  - name: negative-wall-removal
    description: "User message: 'I want to knock down the wall between my kitchen and living room this weekend to make it open plan. Which wall colour should I use after?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Before discussing colour, flags that removing a wall may be structural and may hide wiring, pipes or need building permission, and says to have a structural engineer or qualified builder assess it first; then offers design guidance for an open-plan space."}
