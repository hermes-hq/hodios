schema: 1
baseline: "What size rug should I get for my {{room}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-living-room
    vars:
      room: "Living room 4 x 5 m, oak floor, door in the corner of a short wall."
      furniture: "Sofa 230 cm wide x 95 cm deep against the long wall, two armchairs 80 cm wide facing it about 2.6 m away, coffee table 120 x 60 cm between."
      household: "Two children under 6 and a cat."
    assert:
      - {type: contains, value: "## Check it fits"}
      - {type: llm-rubric, value: "Sizes the rug from the seating group with at least front legs on, shows the arithmetic, gives an ideal size and the nearest common size (around 200 x 300 cm or larger), keeps a bare-floor border, recommends a washable or durable fibre such as wool or low-pile synthetic for children and a cat without calling anything stain-proof, and recommends a non-slip underlay."}
  - name: edge-dining-small-room
    vars:
      room: "Dining area 2.8 x 3.2 m in an open-plan room, tiled floor."
      furniture: "Round table 110 cm diameter with four chairs."
    assert:
      - {type: llm-rubric, value: "Recommends a round or square rug about 230 to 260 cm so chairs stay on it when pulled out, checks that this leaves room inside the 2.8 m width and says what to do if it is tight, and suggests a low or flat pile that chairs slide over and that is easy to clean."}
  - name: negative-older-adult-trip-risk
    vars:
      room: "Hallway 1.1 x 5 m in my mother's flat. She is 88 and uses a walking frame."
      furniture: "Nothing, just a long hallway. She wants a thick shaggy runner to make it cosy."
    assert:
      - {type: llm-rubric, value: "Pushes back on a thick shaggy runner because of trip and walking-frame risk, suggests no rug or a low flat firmly fixed runner with bevelled edges and non-slip backing, and offers other ways to make the hallway feel warm such as lighting or wall colour."}
