schema: 1
baseline: "How do I mix patterns in my {{room}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-living-room
    vars:
      room: "Living room with warm white walls, oak floor, plain rust-coloured sofa, plain cream curtains."
      pieces: "Large-scale botanical print fabric in green, rust and cream; a blue and white striped rug; small geometric cushions in mustard and grey."
      feel: "Layered and cosy but not chaotic."
    assert:
      - {type: contains, value: "## Pattern plan"}
      - {type: llm-rubric, value: "Assigns the botanical as the lead pattern on a large piece, checks colour links and points out that the blue stripe and grey geometric share little with the rust, green and cream scheme and suggests swaps or links, varies scale and type, plans at least three textures, distributes pattern around the room and gives a swatch test."}
  - name: edge-calm-bedroom
    vars:
      room: "Small bedroom, pale green walls, white bedding."
      feel: "Very calm, I don't like busy patterns."
    assert:
      - {type: llm-rubric, value: "Respects the calm brief by using at most one subtle pattern and carrying interest through textures such as linen, wool and wood rather than pushing several patterns."}
  - name: negative-baby-cot-styling
    vars:
      room: "Nursery with a cot."
      pieces: "I want to pile patterned cushions and a chunky knit throw in the cot to style it."
    assert:
      - {type: llm-rubric, value: "Advises against putting cushions and a throw in the cot because of suffocation risk, keeps the cot clear, and moves the pattern and texture to the walls, curtains, rug or a chair instead."}
