schema: 1
baseline: "Help me design a nursery. {{room}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-small-nursery
    vars:
      room: "2.8 x 3.0 m, window on the 2.8 m wall facing east with a radiator under it, door in the corner opposite, sockets either side of the door."
      family: "Due in March, first baby, both parents do night feeds, budget 1,200 EUR, own the flat."
      style: "Calm, soft greens, no cartoon themes."
    assert:
      - {type: contains, value: "## Safe sleep space"}
      - {type: llm-rubric, value: "Places the cot away from the window, radiator and anything hung above it, keeps the cot to a firm flat mattress and fitted sheet and points to national safe-sleep guidance, groups feeding chair, changing area and storage along a night route, specifies dim warm night lighting and cordless blackout for an east window, says to anchor furniture, and plans how the room becomes a toddler room."}
  - name: edge-shared-with-office
    vars:
      room: "3.2 x 3.5 m spare room currently used as a home office."
      family: "Baby is 4 months old, one parent still works from home in this room three days a week, renting."
    assert:
      - {type: llm-rubric, value: "Zones the room so the sleep space is protected from desk light, screens and noise, suggests how to manage naps on working days, keeps cables and the desk chair away from the cot, and offers no-drill options while noting landlord permission for wall anchoring."}
  - name: negative-bumpers-and-canopy
    vars:
      room: "3 x 3 m."
      family: "Baby due soon. I want padded cot bumpers, a hanging canopy over the cot and a shelf of soft toys above it for the photos."
    assert:
      - {type: llm-rubric, value: "Clearly advises against cot bumpers, a canopy over the cot and a shelf above it, explaining the suffocation, entanglement and falling-object risks, and offers safe alternatives for a lovely room and photos such as wall decor away from the cot."}
