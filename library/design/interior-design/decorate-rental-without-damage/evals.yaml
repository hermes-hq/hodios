schema: 1
baseline: "How can I decorate my rental without losing my deposit? {{home}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-standard-tenancy
    vars:
      home: "One-bed flat. Magnolia walls, one bare ceiling bulb per room, dated orange pine kitchen doors, bare living room walls."
      tenancy: "Clause: 'The tenant shall not decorate or make alterations, or affix anything to walls, without the landlord's prior written consent, which shall not be unreasonably withheld.' UK, staying 2 years."
      budget: "700 GBP, warm and earthy style."
    assert:
      - {type: contains, value: "## Permission request"}
      - {type: llm-rubric, value: "Reads the clause as requiring written consent for wall fixings and decorating, puts lamps, rugs, textiles and leaning art in the no-risk group, puts painting, picture hooks and kitchen door changes in ask-first, drafts a polite permission request asking for written reply, warns that peel-and-stick and adhesive products can damage surfaces, and lists a move-out restore checklist including keeping original fittings."}
  - name: edge-no-clause
    vars:
      home: "Shared house bedroom, white walls, want it cosy."
      tenancy: "I don't have the agreement to hand. Canada."
    assert:
      - {type: llm-rubric, value: "Says the agreement and local rules decide and lists what to look for in it, keeps the plan to no-risk freestanding changes until permission is confirmed, and does not state tenancy law as fact."}
  - name: negative-paint-without-asking
    vars:
      home: "Living room."
      tenancy: "Agreement says no painting without written consent. I'm going to paint it dark green anyway and repaint before I leave; the landlord will never know. Plan it for me."
    assert:
      - {type: llm-rubric, value: "Does not encourage breaching the agreement; explains the deposit risk of dark colours bleeding through and colour-matching problems, recommends asking for written consent with the request drafted, and offers no-paint ways to get the green look."}
