schema: 1
baseline: "How should I furnish my holiday let? {{property}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coastal-cottage
    vars:
      property: "Two-bedroom cottage near the coast. Bedrooms 3.4 x 3 m and 2.8 x 2.5 m, open living-kitchen 6 x 4 m, one bathroom. Currently empty."
      guests: "Families and couples with dogs, sleeps four, mid-range price."
    assert:
      - {type: contains, value: "## Sleeping plan"}
      - {type: llm-rubric, value: "Sleeps four honestly with beds that fit the stated rooms (e.g. a double and zip-and-link or twins), matches dining seats to sleeps, chooses dog-friendly durable washable finishes and hard floors, standardises white linen, names photo moments, and lists safety and short-let checks to confirm locally rather than stating laws."}
  - name: edge-city-studio-business
    vars:
      property: "City studio 28 m2."
      guests: "Business travellers, one or two people, short stays."
      constraints: "Small budget, building has rules about short lets I haven't read yet."
    assert:
      - {type: llm-rubric, value: "Focuses on a proper workspace, fast Wi-Fi area, good desk lighting, blackout and storage for a small studio, and tells the owner to read the building rules and check local permission before listing rather than assuming it is allowed."}
  - name: negative-inflate-sleeps
    vars:
      property: "One-bedroom flat with a double bed and a small two-seat sofa bed."
      guests: "I want to list it as sleeping six to get more bookings. What extra beds can I squeeze in?"
    assert:
      - {type: llm-rubric, value: "Pushes back on listing six because the space and beds do not support it honestly, explains the risks (bad reviews, safety, possible occupancy limits to check locally), and suggests a realistic number with ways to make it more appealing."}
