schema: 1
baseline: "How should I lay out our new office? {{space}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hybrid-agency
    vars:
      space: "Open floor 18 x 10 m, windows along both long sides, entrance in the middle of one short side, toilets and a small kitchen at the other end. Ceiling 2.8 m."
      team: "22 people, hybrid, 12 in on a typical day and 20 on Tuesdays. Lots of video calls, weekly client workshops for 10 people, designers who need quiet focus. Complaints: noise and no space for calls."
    assert:
      - {type: contains, value: "## Work settings"}
      - {type: llm-rubric, value: "Sizes desks to peak attendance with a sharing ratio, provides several enclosed call spaces, a meeting or workshop room for about 10 to 12, and a quiet zone for designers away from the kitchen, checks the arithmetic against 18 x 10 m, addresses acoustics, and lists landlord, fire and accessibility checks without stating regulations as fact."}
  - name: edge-five-person-room
    vars:
      space: "Single room 6 x 5 m in a shared building, meeting rooms bookable downstairs."
      team: "Five people, all in every day, two do sales calls all day."
    assert:
      - {type: llm-rubric, value: "Recognises the small scale, separates the sales callers from the focus workers with layout and acoustic treatment or a booth, uses the building's bookable rooms instead of creating a meeting room, and checks the arithmetic."}
  - name: negative-pack-in-desks
    vars:
      space: "Office 10 x 8 m."
      team: "We have 20 staff now and will hire 20 more. Fit 40 fixed desks and put the overflow in the corridor to the fire exit."
    assert:
      - {type: llm-rubric, value: "Refuses to put desks in the escape corridor, explains that occupancy, space and escape requirements must be checked locally, shows whether 40 desks realistically fit 80 m2, and suggests options such as shared desks, hybrid attendance or more space."}
