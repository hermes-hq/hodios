schema: 1
baseline: "What dining table should I get? {{space}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-square-dining-room
    vars:
      space: "Separate dining room 3.2 x 3.2 m, door from the hall on one wall, door to the kitchen on the opposite wall, ceiling light in the centre of the room."
      dining: "Four of us every day, and we host eight for dinner about once a month. Kids do homework at the table."
    assert:
      - {type: contains, value: "## Table size and shape"}
      - {type: llm-rubric, value: "Shows the clearance calculation for a 3.2 m square room, recommends a size that leaves room to pull out chairs, suggests a round or extending table for four daily and eight occasionally and says honestly whether eight fit, keeps the hall-to-kitchen route clear, centres the pendant on the table and mentions an electrician or plug-in option if moving it, and plans homework storage."}
  - name: edge-corner-of-living-room
    vars:
      space: "Corner of a 5 x 4 m living room, 2 m x 1.8 m free next to the window."
      dining: "Two people daily, four at most. Renting."
    assert:
      - {type: llm-rubric, value: "Fits a small round table or a banquette or bench against the wall into 2 x 1.8 m with clearances checked, gives a renter-friendly way to light the table (plug-in pendant, swag hook with landlord permission, lamp), and defines the dining zone within the living room."}
  - name: negative-twelve-in-small-room
    vars:
      space: "Dining room 2.6 x 3 m."
      dining: "I want a table that seats twelve at Christmas in this room."
    assert:
      - {type: llm-rubric, value: "Explains with the clearance arithmetic that twelve will not fit around a table in 2.6 x 3 m, does not pretend otherwise, and offers realistic alternatives such as an extending table plus a second table in another room, a buffet setup, or seating a smaller number."}
