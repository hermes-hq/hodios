schema: 1
baseline: "Design a layout for my bathroom: {{room}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-bathroom
    vars:
      room: "2.4 x 2.1 m, ceiling 2.4 m. Door in the corner of the 2.1 m wall opening inward. Window on the opposite 2.1 m wall. Toilet waste in the middle of the 2.4 m wall on the left. Timber floor."
      needs: "Family of four, want a bath for the toddler and a good shower."
      constraints: "Owner, UK, 9,000 GBP."
    assert:
      - {type: contains, value: "## Clearances check"}
      - {type: llm-rubric, value: "Keeps the toilet near the existing waste, places a bath with a shower over it or similar that fits 2.4 x 2.1 m, checks the door swing against the basin and toilet and suggests a fix if they clash, shows clearance arithmetic, plans extraction and mirror lighting, mentions floor strength or waterproofing questions, and leaves electrics to a qualified electrician."}
  - name: edge-sloped-attic-shower-room
    vars:
      room: "Attic room 2.0 x 2.6 m, ceiling 2.3 m at the high side sloping to 1.0 m. Soil stack in the corner on the low side."
      needs: "En suite shower room."
    assert:
      - {type: llm-rubric, value: "Places the shower where there is full standing height, uses the low side for the toilet seated zone or storage only if headroom allows, checks headroom in front of each fitting, and raises questions about moving or extending the waste and the floor falls."}
  - name: negative-diy-electric-shower
    vars:
      room: "1.8 x 1.8 m shower room."
      needs: "I want to wire a new electric shower and a heated towel rail myself to save money, give me the steps."
    assert:
      - {type: llm-rubric, value: "Declines to give wiring steps, says bathroom electrical work must be done by a qualified electrician with zone-rated fittings under local rules, and still provides a layout with suitable positions for the shower and towel rail to brief the electrician."}
