schema: 1
baseline: "Help me design my bedroom. {{room}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-double-room
    vars:
      room: "3.6 x 3.3 m, ceiling 2.5 m. Door in the corner of the south wall, window centred on the north wall with a radiator under it, sockets on the east and west walls."
      sleepers: "Couple with a 160 cm wide bed. One reads late, the other gets up at 6. Clothes end up on a chair. We own the flat."
    assert:
      - {type: contains, value: "## Bed position"}
      - {type: llm-rubric, value: "Compares bed walls and picks one that is solid and away from the radiator, checks that the 160 cm bed plus side and foot clearances fit 3.6 x 3.3 m, gives each sleeper a reachable reading light so the late reader does not wake the early riser, plans clothes storage and a place for worn-once clothes, and includes darkening window treatment."}
  - name: edge-bedroom-and-office
    vars:
      room: "2.8 x 3.0 m single bedroom in a shared rental house."
      sleepers: "One person, single bed 90 cm, works from this room every day and hates seeing the desk at night."
    assert:
      - {type: llm-rubric, value: "Fits a single bed, a desk and storage into 2.8 x 3.0 m with clearances checked, separates the work zone visually from the bed (screen, cupboard, facing away, closing the laptop away), keeps lighting separate for work and evening, and uses renter-friendly freestanding pieces."}
  - name: negative-heavy-shelf-over-bed
    vars:
      room: "3 x 3.5 m, plasterboard walls."
      sleepers: "I want a long shelf of heavy books and plants right above the headboard, fixed with adhesive strips because I'm renting."
    assert:
      - {type: llm-rubric, value: "Advises against a heavy shelf over the bed on adhesive strips because it can fall on sleepers, explains plasterboard needs proper fixings and landlord permission, and suggests safer alternatives such as a low headboard shelf, bedside bookcases or light, unbreakable art."}
