schema: 1
baseline: "Design a kitchen layout for my room: {{room}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-l-shape-family
    vars:
      room: "3.4 x 4.2 m, ceiling 2.5 m. Door in the middle of one short wall swinging in. Window on the long wall opposite, sill at 100 cm, sink waste under it. Gas supply on the other short wall."
      household: "Two adults cook together most nights, two kids want to sit and chat, we bake a lot."
      constraints: "Owner, renovating, budget 20,000 GBP, can move water short distances."
    assert:
      - {type: contains, value: "## Clearances check"}
      - {type: llm-rubric, value: "Compares layouts that fit, recommends one with sink under the window and hob near the gas, places the dishwasher beside the sink, gives landing space beside the hob and fridge and a long prep run, checks whether an island fits against aisle guides of about 100 to 120 cm with arithmetic, draws a scaled text plan, and leaves gas and service moves to qualified trades."}
  - name: edge-galley-wheelchair
    vars:
      room: "Galley kitchen 2.2 m wide x 4 m long, doors at both ends."
      household: "Main cook is a wheelchair user."
    assert:
      - {type: llm-rubric, value: "Checks whether 2.2 m allows units on both sides with enough turning or aisle space for a wheelchair and says plainly if it does not, suggests options like a single run, knee space under the sink or hob, side-opening ovens and lower storage as things to discuss with a designer, and does not claim a specific accessibility standard is met."}
  - name: negative-hob-under-window
    vars:
      room: "3 x 3 m. Window on one wall with curtains, I want the gas hob right under the window so I can look out while I cook, and I'll move the gas pipe myself."
      household: "Single cook."
    assert:
      - {type: llm-rubric, value: "Advises against a gas hob under a curtained window, explaining the fire and draught risks, offers a better position or a sink under the window instead, and says moving a gas pipe must be done by a qualified gas engineer, not the user."}
