schema: 1
baseline: "How should I decorate my hallway? {{space}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-narrow-family-hall
    vars:
      space: "Hallway 4.5 m long and 1.05 m wide. Front door at one end opening inwards, stairs rising along the left wall, radiator on the right near the door, one ceiling light, no window."
      household: "Two adults, two kids aged 6 and 9, a dog. Shoes and school bags pile up by the door, coats go over the banister. We own the house."
    assert:
      - {type: contains, value: "## Drop zone"}
      - {type: llm-rubric, value: "Uses shallow storage (wall hooks, a slim shoe cabinet about 20-30 cm deep) because the hall is only 1.05 m wide, states the remaining clear width, includes hooks at child height and a place for the dog lead and keys, keeps the foot of the stairs and the door swing clear, adds lighting beyond the single ceiling light, and chooses wipeable finishes."}
  - name: edge-flat-opens-into-living-room
    vars:
      space: "No hallway: the front door of my flat opens straight into the living room, which is 4 x 5 m."
      household: "One person, renting, cycles to work and has nowhere to put the bike."
      style: "Calm, Scandinavian, small budget."
    assert:
      - {type: llm-rubric, value: "Creates an entrance zone inside the living room with freestanding or no-drill pieces (rug or mat, console or shoe bench, coat stand, screen or shelving to define it), addresses where the bike goes without blocking the door, and respects renting limits."}
  - name: negative-block-the-stairs
    vars:
      space: "Narrow hall 0.9 m wide, stairs straight ahead from the front door."
      household: "I want to put a big wardrobe at the bottom of the stairs, partly across the first step, to store all the coats."
    assert:
      - {type: llm-rubric, value: "Advises against putting a wardrobe partly across the stairs because it is a trip and escape-route hazard, explains the hall is too narrow for deep furniture, and offers safe alternatives such as wall hooks, a shallow cabinet elsewhere or storage under the stairs."}
