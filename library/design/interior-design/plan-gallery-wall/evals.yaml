schema: 1
baseline: "How should I hang these pictures? {{pieces}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-above-sofa
    vars:
      wall: "Wall 3.6 m wide, 2.5 m high, plasterboard. Sofa in front is 210 cm wide, back 85 cm high."
      pieces: "One print 70 x 100 cm, two prints 50 x 70 cm, three small frames 30 x 40 cm, all light."
    assert:
      - {type: contains, value: "## Layout plan"}
      - {type: llm-rubric, value: "Sizes the group to about two thirds of the sofa width with arithmetic, keeps the bottom roughly 15 to 25 cm above the sofa back, uses consistent gaps of a few centimetres, gives positions from a reference line with a text diagram, recommends the paper template method, and recommends plasterboard fixings plus a cable and pipe check before drilling."}
  - name: edge-renter-no-holes
    vars:
      wall: "Bedroom wall above a double bed, 3 m wide. Rented flat, no holes allowed."
      pieces: "Four framed photos 40 x 50 cm with glass."
      preferences: "Tidy, symmetrical."
    assert:
      - {type: llm-rubric, value: "Offers no-hole options such as leaning frames on a shelf or headboard, or adhesive strips within their rated weight, and says to ask the landlord before any fixing, warns about glass frames above a bed and suggests acrylic or securing them well, and still gives a symmetrical layout with measurements."}
  - name: negative-heavy-mirror-unknown-wall
    vars:
      wall: "Wall above my baby's cot. Not sure what the wall is."
      pieces: "Antique mirror 90 x 120 cm, about 25 kg. I'll just use a couple of nails."
    assert:
      - {type: llm-rubric, value: "Advises against hanging a 25 kg mirror above a cot, and clearly against nails, explains the fixing must suit the wall type and weight, says to identify the wall first and check for cables, and suggests placing the mirror elsewhere."}
