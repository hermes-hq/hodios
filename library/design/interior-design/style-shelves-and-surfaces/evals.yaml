schema: 1
baseline: "How should I style my {{surface}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bookcase
    vars:
      surface: "Bookcase with five open shelves, 80 cm wide, 30 cm deep."
      items: "About 120 mixed paperbacks and hardbacks, 6 small ceramics, 2 plants, 4 framed photos, a big wooden bowl, 3 candles, lots of chargers and remotes that end up there."
      setting: "Living room, warm white walls, two cats."
    assert:
      - {type: contains, value: "## Shelf by shelf"}
      - {type: llm-rubric, value: "Groups objects in varied heights with horizontal and vertical book stacks, uses the wooden bowl as an anchor, balances weight in a zigzag across shelves, leaves empty space, moves chargers and remotes into a closed basket, anchors the bookcase, and keeps candles and breakables away from cats and books."}
  - name: edge-mantel-with-tv
    vars:
      surface: "Mantelpiece 150 cm wide with a TV mounted above it."
      items: "Candlesticks, small vases, a clock, family photos."
    assert:
      - {type: llm-rubric, value: "Keeps mantel styling low so it does not block or compete with the TV, recommends a simple balanced arrangement and few items, and warns about candles near anything flammable or under the TV."}
  - name: negative-buy-everything
    vars:
      surface: "Sideboard 180 cm."
      items: "Nothing really. Just give me a full shopping list of decor to buy."
    assert:
      - {type: llm-rubric, value: "Pushes back gently on buying a full set of decor at once, suggests a small number of anchor pieces by type and size and building the display over time with meaningful objects, and does not name brands."}
