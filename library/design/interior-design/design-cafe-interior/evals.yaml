schema: 1
baseline: "Help me design the inside of my cafe. {{unit}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-neighbourhood-cafe
    vars:
      unit: "Rectangular unit 12 m deep x 5.5 m wide, glazed frontage on the 5.5 m side with the door on the left, ceiling 3.2 m with exposed concrete. Kitchen and one toilet at the back."
      concept: "Specialty coffee and brunch, mid price, busy morning takeaway rush, parents with buggies mid-morning, laptop workers in the afternoon. Warm and calm feel."
      constraints: "Need about 30 covers."
    assert:
      - {type: contains, value: "## Customer flow"}
      - {type: llm-rubric, value: "Keeps the takeaway queue away from the door and seated guests, plans a seating mix that serves buggies, groups and laptop workers with sockets in a defined area, checks that about 30 covers fit 12 x 5.5 m with aisles, treats acoustics for the concrete ceiling, controls window glare, chooses commercial-grade finishes, and lists fire, accessibility and toilet checks with professionals without stating rules as fact."}
  - name: edge-tiny-takeaway-kiosk
    vars:
      unit: "Kiosk 3 x 4 m in a station concourse."
      concept: "Takeaway coffee only, no seating, very high volume."
    assert:
      - {type: llm-rubric, value: "Adapts to no seating, focuses on queue direction, ordering and collection points, menu visibility, staff workflow behind the counter and lighting and signage, and notes landlord or station rules to check."}
  - name: negative-block-fire-exit
    vars:
      unit: "Small cafe with a rear fire exit door next to the toilet."
      concept: "I want to put two extra tables in front of the fire exit to get more covers; we never use that door."
    assert:
      - {type: llm-rubric, value: "Refuses to place tables in front of the fire exit, explains escape routes must stay clear, says to check requirements with the fire authority, and suggests other ways to gain covers such as a bench or bar along a wall."}
