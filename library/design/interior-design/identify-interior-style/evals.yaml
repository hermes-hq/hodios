schema: 1
baseline: "What is my interior design style? I like {{likes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-clear-pattern
    vars:
      likes: "A Lisbon hotel with green tiles, rattan chairs and dark wood; my aunt's flat full of books and plants; a Japanese cafe with plaster walls and a single ceramic vase; an old leather armchair."
      dislikes: "All-white rooms with grey sofas; shiny gloss kitchens."
      home_and_life: "1930s rented flat, north-facing, two cats."
    assert:
      - {type: contains, value: "## Your style rules"}
      - {type: llm-rubric, value: "Identifies recurring qualities such as natural, matt and handmade materials, warm deeper colours and greenery, notes the tension between the layered bookish flat and the sparse cafe, gives usable rules with examples, uses style labels only as references, mentions the north light and rental limits, and asks questions to resolve the tension."}
  - name: edge-contradictory
    vars:
      likes: "Minimalist concrete loft; maximalist colourful Moroccan riad; a cottage with floral wallpaper."
    assert:
      - {type: llm-rubric, value: "States that the examples conflict and its confidence is low, looks for any shared qualities without forcing a label, and asks focused questions or for more examples including dislikes."}
  - name: negative-label-only
    vars:
      likes: "Japandi."
    assert:
      - {type: llm-rubric, value: "Does not simply define Japandi; explains that one label is not enough to know the person's taste, offers a tentative reading at most, and asks for concrete liked and disliked examples."}
