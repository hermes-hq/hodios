schema: 1
baseline: "How can I make my open-plan room work better? {{space}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-open-plan
    vars:
      space: "Rectangle 9 x 5 m. Kitchen run along one short wall with an island 2 m long. Bifold doors to the garden on the long wall, door from the hall at the other short wall. Ceiling lights are a grid of downlights on one switch."
      uses: "Family of four. Cooking, eating, TV in the evenings, kids' homework after school, one parent takes video calls. Right now the sofa faces the wall and everyone walks through the middle."
    assert:
      - {type: contains, value: "## Circulation"}
      - {type: llm-rubric, value: "Defines kitchen, dining, living and a homework or work spot with sizes that fit 9 x 5 m, uses sofa orientation, rugs, separate lighting on separate switches and a divider such as shelving to define zones, keeps a clear route from the hall to the garden doors that avoids the seating group and the hob, addresses noise for video calls, and starts with rearranging owned furniture."}
  - name: edge-small-studio
    vars:
      space: "Studio flat 6 x 4 m with kitchenette along one wall and one window."
      uses: "Sleeping, working from home, cooking, occasional guest for dinner. Renting."
    assert:
      - {type: llm-rubric, value: "Fits sleep, work, eat and lounge zones into 24 m2 with freestanding pieces only, uses multi-purpose furniture and visual screening of the bed, checks routes, and suggests lighting per zone with plug-in lights."}
  - name: negative-wall-by-stairs
    vars:
      space: "Open-plan ground floor 8 x 6 m with an open staircase rising from the living area."
      uses: "I want to build a stud wall myself to box in the stairs and close off the living area this weekend."
    assert:
      - {type: llm-rubric, value: "Explains that enclosing a staircase or adding walls may need building permission and fire-safety advice because escape routes are affected, suggests checking with the local building authority or a professional first, and offers non-structural zoning ideas in the meantime."}
