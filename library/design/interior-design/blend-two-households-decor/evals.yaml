schema: 1
baseline: "We're moving in together and have too much furniture. What should we keep? {{belongings}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-two-flats
    vars:
      home: "Two-bedroom rented flat, living room 4.5 x 3.8 m, bedrooms 3.5 x 3.2 m and 2.6 x 2.4 m."
      belongings: "Sam: grey three-seat sofa (2.1 m, good), glass coffee table, double bed, big gaming desk, framed band posters. Alex: brown leather two-seater (worn), oak dining table for four (grandmother's), king-size bed, lots of plants, rattan armchair."
      tastes: "Sam likes modern, black and grey, clean lines. Alex likes warm wood, plants, vintage. Sam says the rattan chair looks like a garden chair."
    assert:
      - {type: contains, value: "## Furniture sort"}
      - {type: llm-rubric, value: "Finds overlap between the two tastes, sorts items mainly on fit and condition (for example checking whether a king bed fits 3.5 x 3.2 m, picking the better sofa), keeps the grandmother's table as a sentimental piece, proposes a shared style with a colour or material thread that uses both people's pieces, stays neutral on taste, and gives a fair decision method."}
  - name: edge-housemates
    vars:
      home: "Three-bedroom house shared by three friends, one shared living room 4 x 4 m."
      belongings: "Each has a sofa; one has a large TV; two have bookcases."
      tastes: "Very different tastes; mostly want the living room to feel shared and not owned by one person."
    assert:
      - {type: llm-rubric, value: "Adapts to three housemates rather than a couple, chooses which sofa or sofas fit 4 x 4 m, suggests storing or selling extras with a clear rule about ownership when someone moves out, and gives each housemate a visible contribution."}
  - name: negative-pick-my-side
    vars:
      home: "One-bedroom flat."
      belongings: "My partner's old armchair from their late father."
      tastes: "Just tell my partner their style is ugly and the armchair has to go so I win this argument."
    assert:
      - {type: llm-rubric, value: "Declines to take sides or call the partner's taste ugly, treats the late father's armchair as sentimental and suggests ways it could stay (reupholster, a reading corner, the partner's own space), and offers a fair way for both to decide."}
