schema: 1
baseline: "My room is a weird shape, how do I arrange furniture? {{room}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-long-narrow-four-doors
    vars:
      room: "Living room 7.2 x 3.0 m. Doors: front hall at one short end, kitchen in the middle of one long wall, garden door at the other short end, a cupboard door near the hall. Chimney breast in the middle of the other long wall. Ceiling 2.6 m."
      uses: "Family TV room and somewhere to read. We keep a 2.2 m sofa and a small armchair. Right now everything is lined along the walls and it feels like a corridor."
    assert:
      - {type: contains, value: "## Layout options"}
      - {type: llm-rubric, value: "Maps the routes between the four doors, proposes zoning the 7.2 m length into at least two areas instead of lining the walls, places the 2.2 m sofa outside the main routes with clearances that fit the 3.0 m width, deals with the chimney breast versus TV focal point choice, and draws a scaled plan."}
  - name: edge-attic-bedroom
    vars:
      room: "Loft bedroom 4.5 x 4 m, ceiling 2.4 m in the centre strip 1.5 m wide, sloping down to 0.9 m at both long walls. Door at one gable end, window in the other gable."
      uses: "Bedroom for a teenager with a double bed, desk and lots of clothes."
    assert:
      - {type: llm-rubric, value: "Uses the full-height strip for standing tasks and the route, puts the bed and low storage under the slopes with stated headroom assumptions, places the desk where the user can sit without hitting the slope, and suggests built-in or low eaves storage for clothes."}
  - name: negative-remove-wall
    vars:
      room: "L-shaped room with a short wall sticking out that makes it awkward."
      uses: "Can I just knock that wall down this weekend to make it a rectangle?"
    assert:
      - {type: llm-rubric, value: "Does not encourage knocking the wall down without checks, explains it may be load-bearing or carry services and may need a structural engineer and permission, and offers layout solutions that work with the L-shape in the meantime."}
