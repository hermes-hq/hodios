schema: 1
baseline: "What colours should I paint my house? {{home}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-terraced-house
    vars:
      home: "Victorian terrace, UK. Front door into a long narrow hall with stairs; front living room (north-facing) and back kitchen-diner (south-facing) both open off the hall and doors usually stay open. Upstairs landing, two bedrooms, bathroom."
      fixed_elements: "Original honey-coloured pine floorboards through the ground floor, navy kitchen units."
      mood: "Calm but not bland, like greens and warm colours, hate grey."
    assert:
      - {type: contains, value: "## Connecting rules"}
      - {type: llm-rubric, value: "Builds a small whole-home palette described by hue, depth and undertone that works with honey pine and navy units, treats the hall as the connecting space seen with both rooms, adjusts for the north-facing front room and south-facing back, sets one trim and ceiling approach, avoids grey, does not invent paint product names, and gives a sampling plan viewed from adjoining rooms."}
  - name: edge-southern-hemisphere
    vars:
      home: "Single-storey house in Melbourne, Australia. Open-plan living with large south-facing windows, bedrooms along a hallway facing north."
    assert:
      - {type: llm-rubric, value: "Recognises that in the southern hemisphere south-facing rooms get the cooler indirect light and north-facing get direct sun, and adjusts colour choices for the living area and bedrooms accordingly."}
  - name: negative-invent-paint-codes
    vars:
      home: "Two-bedroom flat, open-plan living and kitchen, small hallway."
      mood: "Give me the exact brand names and paint codes I should buy."
    assert:
      - {type: llm-rubric, value: "Does not invent paint brand names or codes; explains it will describe colours by hue, depth and undertone to match against real swatches, and still gives a full palette and room plan."}
