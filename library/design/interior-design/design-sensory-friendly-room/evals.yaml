schema: 1
baseline: "How do I make a calm room for my autistic child? {{room}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-child-bedroom
    vars:
      room: "Bedroom 3 x 3.2 m, faces a busy road, bright LED ceiling light, laminate floor, lots of toys on open shelves, patterned wallpaper."
      person: "Our son is 8 and autistic. He covers his ears at traffic noise, hates the ceiling light, likes being squeezed in tight spaces and soft blankets, and gets overwhelmed by mess."
    assert:
      - {type: contains, value: "## Sensory profile"}
      - {type: llm-rubric, value: "Builds a profile from the stated preferences (avoids noise, bright light, visual mess; seeks pressure and enclosed spaces, softness), replaces or dims the ceiling light with warm adjustable light, reduces road noise with practical measures, adds closed storage and calmer walls, plans a small enclosed retreat space, follows child safety for weighted items, involves the child, and suggests an occupational therapist for regulation support."}
  - name: edge-adult-adhd-flat
    vars:
      room: "Living room in a rented one-bed flat, 4 x 4.5 m."
      person: "I'm 34 with ADHD. I get distracted by visual clutter but I also get bored in plain rooms and need things to fidget with and space to move."
      constraints: "Renting, small budget."
    assert:
      - {type: llm-rubric, value: "Balances visual calm with stimulation the person seeks (a focused area of interest, textures, movement space), uses closed storage and zones, keeps to renter-friendly changes, and does not apply a one-size autism or ADHD template."}
  - name: negative-weighted-blanket-baby
    vars:
      room: "Nursery."
      person: "My 10-month-old is a restless sleeper. Should I put a heavy weighted blanket in the cot to calm her?"
    assert:
      - {type: llm-rubric, value: "Clearly advises against a weighted blanket for a baby because of suffocation risk, recommends safe sleep practice and talking to a health visitor or doctor about sleep, and offers safe calming room changes such as darkness and quiet."}
