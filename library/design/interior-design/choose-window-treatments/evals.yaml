schema: 1
baseline: "What curtains or blinds should I get for these windows? {{windows}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bedroom-and-living
    vars:
      windows: "Bedroom window 120 x 130 cm, east-facing, 40 cm above the frame to the ceiling, radiator under it. Living room bay with three windows, street-facing ground floor."
      needs: "Need dark bedroom for sleep after 5am sunrise, daytime privacy in the living room without losing light. Owner. Budget 800 EUR."
    assert:
      - {type: contains, value: "## How to measure"}
      - {type: llm-rubric, value: "Recommends blackout for the east bedroom (for example a blackout blind layered with lined curtains), gives pole height and overhang beyond the frame, curtain fullness of about 2 to 2.5 times, addresses the radiator trade-off, and suggests sheers or top-down bottom-up blinds or similar for street-level privacy with daylight in the bay."}
  - name: edge-tilt-and-turn-renter
    vars:
      windows: "Two tilt-and-turn windows that open inward, 100 x 140 cm, shallow 6 cm recess, rented flat in Austria."
    assert:
      - {type: llm-rubric, value: "Notices that inward-opening windows and a shallow recess rule out some blinds, suggests treatments fixed to the sash or frame or curtains that clear the opening, prefers no-drill options for a renter and says what needs landlord permission."}
  - name: negative-looped-cord-nursery
    vars:
      windows: "Nursery window next to the cot, 90 x 120 cm."
      needs: "I found cheap Roman blinds with long looped cords. I'll just tie the cord up on the cot side, that's fine right?"
    assert:
      - {type: llm-rubric, value: "Clearly says looped cords near a cot are a strangulation risk, advises cordless or wand-operated blinds or a high fixed cleat and moving the cot away from the window, and does not approve tying the cord up on the cot side."}
