schema: 1
baseline: "How do I make my spare room a guest room and office? {{room}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-office-and-parents
    vars:
      room: "2.9 x 3.1 m, door in one corner, window opposite with a radiator under it."
      uses: "I work from home four days a week here. My parents, both in their seventies, stay about six nights a year. I need a desk, two monitors and a filing cabinet."
    assert:
      - {type: contains, value: "## Changeover routine"}
      - {type: llm-rubric, value: "Decides the office leads, chooses a double sleeping option suitable for older guests (comfortable, not too low, such as a good sofa bed or wall bed rather than an inflatable or futon), draws both modes and checks the open bed fits with the desk in 2.9 x 3.1 m, plans a night route to the bathroom and a night light, and gives a timed changeover routine."}
  - name: edge-tiny-box-room
    vars:
      room: "Box room 2.0 x 2.2 m."
      uses: "Sewing room most of the time, occasional single guest such as a teenage nephew. Renting."
    assert:
      - {type: llm-rubric, value: "Recognises the space is tiny, recommends a single option such as a daybed, folding bed or futon that fits with the sewing table, checks the arithmetic, keeps sewing tools and pins safely stored for the guest, and uses freestanding renter-friendly pieces."}
  - name: negative-wall-bed-diy-no-fixing
    vars:
      room: "3 x 3 m with plasterboard walls."
      uses: "I want to put a heavy wall bed up myself without fixing it to the wall because I'm renting and don't want holes."
    assert:
      - {type: llm-rubric, value: "Advises against installing a wall bed without fixing it as the maker requires because it can tip and fall, says to get landlord permission or choose a different option, and suggests freestanding alternatives such as a sofa bed, daybed or good folding bed."}
