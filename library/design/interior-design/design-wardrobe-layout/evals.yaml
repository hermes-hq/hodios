schema: 1
baseline: "How should I organise the inside of my wardrobe? {{space}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-fitted-wardrobe
    vars:
      space: "Alcove 2.4 m wide, 62 cm deep, 2.5 m high, for a fitted wardrobe with doors."
      clothes: "Two people. Person A: lots of shirts and jackets, 4 suits, 12 pairs of shoes. Person B: dresses (6 long), mostly folded knitwear and jeans, 20 pairs of shoes, bags. Winter duvets and two suitcases. Right now one long rail and everything falls over."
    assert:
      - {type: contains, value: "## Elevations"}
      - {type: llm-rubric, value: "Converts the clothes into metres of short and long hanging and shelf or drawer runs, uses double hanging for shirts and jackets and limited long hanging for dresses, confirms 62 cm depth works for hangers, puts daily items in the easy-reach band and duvets and suitcases high, provides shoe storage, checks that section widths add to 2.4 m, and writes a brief."}
  - name: edge-small-walk-in
    vars:
      space: "Walk-in closet 1.6 m wide, 2.2 m deep, door on the 1.6 m wall."
      clothes: "One person, a modest wardrobe, wants to dress in there."
    assert:
      - {type: llm-rubric, value: "Notes that 1.6 m width is tight for runs on both sides plus a clear dressing floor, proposes an L or one-sided layout with shallower shelving on one side if needed, states the clear floor width, and plans lighting."}
  - name: negative-too-much-stuff
    vars:
      space: "Single wardrobe 90 cm wide, 58 cm deep."
      clothes: "Two people's full wardrobes, about 6 metres of hanging and 40 pairs of shoes. Make it all fit."
    assert:
      - {type: llm-rubric, value: "Says honestly that about 6 m of hanging and 40 pairs of shoes cannot fit a 90 cm wardrobe even with double hanging, shows the arithmetic, and suggests editing, seasonal storage elsewhere or additional storage rather than pretending it fits."}
