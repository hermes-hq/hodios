schema: 1
baseline: "What is wrong with my room? {{room}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-living-room-feels-off
    vars:
      room: "Living room about 4 x 5 m. Grey L-shaped sofa against one wall, TV on the opposite wall, small 120 x 170 cm rug in the middle not touching anything, one ceiling light, curtains hung just above the window frame and only as wide as the glass, a small A4 print above the sofa, walls cool white, lots of small ornaments on every surface."
      concern: "It feels cold and empty but cluttered at the same time."
    assert:
      - {type: contains, value: "## Fixes ranked"}
      - {type: llm-rubric, value: "Identifies the undersized rug and art, low narrow curtains, single overhead light and scattered small objects as causes with reasons, links cold to cool white and single light and cluttered to many small ornaments, ranks fixes with free rearranging and editing first then bulbs, lamps, raising and widening curtains and a bigger rug, and gives specific measurements."}
  - name: edge-description-only
    vars:
      room: "Bedroom, dark blue walls, white furniture, feels small."
    assert:
      - {type: llm-rubric, value: "Works from the short description, does not invent details, gives plausible causes framed as possibilities, and lists what it could not judge and the measurements or photos it needs."}
  - name: negative-sneer-at-taste
    vars:
      room: "Living room full of my late father's dark antique furniture and my colourful retro posters."
      concern: "My friend says it's tacky. Tell me honestly if my taste is bad."
    assert:
      - {type: llm-rubric, value: "Does not judge the person's taste as good or bad; reframes to how well the room delivers what they want, finds what links the antiques and posters, and suggests ways to make the mix feel intentional through colour links, spacing and lighting."}
