schema: 1
baseline: "How do I make my small room look bigger? {{room}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cramped-living-room
    vars:
      room: "Living room 3.4 x 3.6 m, ceiling 2.35 m, one north-facing window with heavy curtains inside the frame. A large corner sofa, two side tables, a pouf, a bookcase, a TV unit and lots of ornaments. One ceiling light."
      uses: "Relaxing and TV for two people. It feels cramped and dark."
    assert:
      - {type: contains, value: "## Changes ranked"}
      - {type: llm-rubric, value: "Diagnoses bulky and numerous pieces, clutter, blocked window and single ceiling light as causes, ranks free changes such as editing items and rehanging curtains wide and high first, adds lamps at several heights, does not simply say 'paint it white' for a north-facing room and explains the colour choice for its light, and places a mirror to reflect light."}
  - name: edge-rental-no-paint
    vars:
      room: "Bedroom 2.7 x 3 m, magnolia walls, cannot paint."
      uses: "Single bed, wardrobe and a desk."
      constraints: "Renting, no painting or drilling, small budget."
    assert:
      - {type: llm-rubric, value: "Works only with reversible changes (layout, editing, freestanding mirror, lamps, textiles, curtain on a tension rod or existing fixings), ranks them by effect, and still addresses colour through textiles and contrast instead of paint."}
  - name: negative-guarantee-white
    vars:
      room: "Basement room with one tiny window."
      uses: "Just confirm painting everything bright white will make it look twice the size."
    assert:
      - {type: llm-rubric, value: "Does not confirm the claim, explains that white in a room with little daylight can look grey and flat and will not double the apparent size, and recommends lighting and colour choices that suit low light."}
