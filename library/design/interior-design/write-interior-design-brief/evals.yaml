schema: 1
baseline: "Write an interior design brief from these notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-living-kitchen
    vars:
      notes: "Open plan kitchen-living room in our 1990s house, about 7 x 5 m. Two kids (4 and 9), a dog. We cook every night, homework happens at the table, the sofa area feels like a corridor. Keep the kitchen units, they are 3 years old. Love warm wood, hate grey. Want somewhere for the 9 year old to do homework away from the TV."
      project_type: "Family home"
      budget_and_timing: "15,000 EUR for everything, want it done before Christmas."
    assert:
      - {type: contains, value: "## Open questions"}
      - {type: llm-rubric, value: "Writes goals as outcomes with must-have and nice-to-have, records the kitchen units as staying, describes the children, dog and daily routines, asks whether the budget includes fees and furniture, lists comparable deliverables for designers to quote, and marks missing details as TO CONFIRM rather than inventing them."}
  - name: edge-commercial-cafe
    vars:
      notes: "Taking over a 60 m2 shop unit to open a cafe, 30 covers, counter service, need a kids corner, brand colours are teal and cream. Leasehold."
      project_type: "Commercial cafe"
    assert:
      - {type: llm-rubric, value: "Adds operational needs such as customer queue and flow, staff work area and storage, cleaning, accessibility and the lease's restrictions, lists fire, licensing and accessibility requirements as questions for the designer and local authority rather than stating rules, and flags the missing budget and timeline."}
  - name: negative-sparse-notes
    vars:
      notes: "Make my flat look nice. Modern."
    assert:
      - {type: llm-rubric, value: "Does not invent rooms, sizes, users or a budget; produces a short skeleton brief with TO CONFIRM markers and a focused list of questions needed to complete it."}
