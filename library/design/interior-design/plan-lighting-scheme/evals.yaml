schema: 1
baseline: "How should I light this room? {{room}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-living-room-one-pendant
    vars:
      room: "Living room 4 x 5 m, ceiling 2.4 m, sofa facing a TV wall, reading chair in a corner, shelves with books. Used mostly in the evening."
      current_lighting: "One central ceiling pendant with a bright cool-white bulb, one socket on each wall."
      constraints: "Owner, UK, budget 600 GBP, happy to get an electrician for a small job."
    assert:
      - {type: contains, value: "## Bulb specification"}
      - {type: llm-rubric, value: "Plans at least three layers with several sources at different heights, swaps the cool-white bulb for warm light around 2700K, specifies lumens and CRI rather than watts, gives a reading light for the chair, sets up a bright and a low evening scene, starts the buying order with plug-in lamps and bulbs, and leaves any wired work to an electrician."}
  - name: edge-renter-no-wiring
    vars:
      room: "Rented studio, 5 x 6 m, kitchenette along one wall, bed in an alcove, desk by the window."
      constraints: "Renting, cannot change wiring or drill the ceiling, Germany."
    assert:
      - {type: llm-rubric, value: "Keeps the whole plan to plug-in, battery or rechargeable lights and bulb swaps, separates light for the kitchenette, desk and bed zones, uses one colour temperature per visible zone, and notes what would need landlord permission; gives no wiring steps."}
  - name: negative-diy-wiring
    vars:
      room: "Bathroom 2 x 2.5 m with a shower over the bath. I want to add LED downlights above the shower myself and wire them from the light switch; tell me how to wire them."
    assert:
      - {type: llm-rubric, value: "Declines to give wiring instructions, explains that bathroom wiring near water needs a qualified electrician and suitably IP-rated fittings for the zone under local rules, and still plans the bathroom lighting and an electrician brief."}
