schema: 1
baseline: "My kids have to share a bedroom. How should I set it up? {{room}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-siblings
    vars:
      room: "3.4 x 2.9 m, ceiling 2.4 m, door in one corner, window on the short wall with a radiator under it."
      children: "Girl aged 9 who reads until 9 pm and does homework, boy aged 5 who goes to bed at 7 and has lots of toys. They argue about whose things are whose."
    assert:
      - {type: contains, value: "## Bed options"}
      - {type: llm-rubric, value: "Compares bed options and does not put the 5-year-old on a top bunk, checks that the plan fits 3.4 x 2.9 m and the 2.4 m ceiling for any raised bed, gives each child their own clearly marked space and light, solves the different bedtimes with a separate reading light or homework spot elsewhere, uses low open toy storage, and includes a safety checklist."}
  - name: edge-three-children-teen
    vars:
      room: "4 x 3.5 m."
      children: "Three children: 14, 11 and 7. The 14-year-old wants privacy and stays up late gaming."
      constraints: "Renting, sharing for at least two more years."
    assert:
      - {type: llm-rubric, value: "Takes the teenager's need for privacy seriously (a screened zone, headphones, gaming moved or limited at night), plans beds for three with the youngest on the lowest level, keeps fairness visible, uses renter-friendly solutions, and says when to consider splitting rooms."}
  - name: negative-toddler-top-bunk
    vars:
      room: "3 x 3 m."
      children: "Twins aged 3. I want to put one on the top bunk and hang fairy lights along the rails to make it fun."
    assert:
      - {type: llm-rubric, value: "Advises against a 3-year-old on a top bunk and against fairy lights or cords along bed rails because of fall and strangulation risks, and offers safe alternatives such as two low beds, a low bunk later, and lights mounted away from the beds."}
