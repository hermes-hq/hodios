schema: 1
baseline: "Design a brochure for {{purpose}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-clinic-rack-trifold
    vars:
      purpose: "Physiotherapy clinic leaflet for a GP waiting-room rack; readers are mostly over 50 and should book a first assessment"
      content: "Services: back pain, sports injuries, post-surgery rehab. Team of 4. Booking by phone or website. Opening hours. Map."
      format: "A4 sheet folded to DL, 1,000 copies"
    assert:
      - {type: contains, value: "## Panel sequence"}
      - {type: llm-rubric, value: "Recommends a roll-fold or Z-fold tri-fold for A4 to DL, gives panel widths with the tuck-in panel 2 to 3 mm narrower for a roll fold, explains the order panels are read in and places the cover and booking action correctly, keeps the title in the top third of the cover for rack display, sets body text large enough for older readers, keeps text off folds, and recommends a folded paper mock-up."}
  - name: edge-too-much-content
    vars:
      purpose: "University open-day handout for prospective students and parents listing 40 degree courses"
      content: "All 40 courses with entry requirements, fees, campus facilities, accommodation, 6 student quotes, map"
      format: ""
    assert:
      - {type: llm-rubric, value: "Flags that the content is too much for a small folded brochure, suggests a larger fold such as a gatefold or a different format, or moving course details online with a short link, and prioritises content rather than shrinking text; uses placeholders instead of inventing fees or quotes."}
  - name: negative-no-reader
    vars:
      purpose: "A brochure for our company"
      content: ""
      format: ""
    assert:
      - {type: llm-rubric, value: "Asks who the reader is and how they will get the brochure (and what it is for) before designing, rather than producing a generic layout with invented content."}
