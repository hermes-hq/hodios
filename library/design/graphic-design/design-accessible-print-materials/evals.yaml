schema: 1
baseline: "Make this {{material}} accessible for {{audience}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-patient-leaflet
    vars:
      material: "patient information leaflet about preparing for a colonoscopy"
      audience: "Adults of all ages, many over 60; some with low vision; some reading English as a second language; read at home over several days."
      constraints: "A4 folded to A5, full colour, hospital brand blue #005EB8."
    assert:
      - {type: contains, value: "Alternative formats"}
      - {type: llm-rubric, value: "Recommends a clear typeface at a readable minimum size with regular weight, sentence case and left alignment, strong contrast with no text over images, numbered preparation steps in plain language with a before-and-after rewrite, matte paper, colour not used as the only signal, and alternative formats such as large print, easy read, audio and translations with a clear request route."}
  - name: edge-brand-conflict
    vars:
      material: "museum gallery guide"
      audience: "Visitors of all ages reading while standing in dimly lit galleries."
      constraints: "Brand font is a light condensed sans; pocket-size 10x21cm; designers want white text on pale photos."
    assert:
      - {type: llm-rubric, value: "Explains the conflict of light condensed type, small format and text on photos with dim lighting, proposes compromises (heavier weight or brand font for headings only, larger type, solid backgrounds), and suggests a large-print version available at the entrance."}
  - name: negative-dyslexia-font-only
    vars:
      material: "school newsletter"
      audience: "Parents, some with dyslexia. We just want to switch to a dyslexia font and be done."
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Explains that a special font alone is not a reliable fix and that size, spacing, layout, contrast and plain language matter more, while not forbidding the font, and gives the practical changes."}
