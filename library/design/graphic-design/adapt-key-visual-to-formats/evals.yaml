schema: 1
baseline: "Resize this design for these formats: {{visual}} {{formats}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-museum-exhibition-campaign
    vars:
      visual: "Portrait A1 poster for a museum exhibition: close-up photo of a woman's face looking left, exhibition title 'Faces of the Harbour' in a tall condensed serif, dates, museum logo bottom right, a teal band across the bottom"
      formats: "1080x1920 story, 1080x1080 feed, 1200x628 link preview, 728x90 and 300x250 banners, 48-sheet billboard, email header 600x200"
      rules: "Logo at least 25 px tall on screen; teal band always present"
    assert:
      - {type: contains, value: "## Copy cuts"}
      - {type: llm-rubric, value: "Defines the DNA (face crop, title typeface, teal band, logo), groups formats by aspect ratio, recomposes rather than scales for the leaderboard and billboard, gives short title and date versions for small banners, keeps text out of story overlay zones and says to confirm platform specs, respects the 25 px logo minimum, proposes a naming pattern, and says to review the smallest format first."}
  - name: edge-print-and-screen-mix
    vars:
      visual: "Square social graphic for a charity run: illustration of runners, headline 'Run for River Health', date, sign-up web address"
      formats: "A4 flyer, A0 poster, 9:16 story, roll-up banner"
      rules: ""
    assert:
      - {type: llm-rubric, value: "Addresses scaling a square illustration up to print sizes (resolution or vector), separate colour modes for print and screen, and recomposition into tall formats."}
  - name: negative-shrink-everything
    description: "The user adds: 'Just shrink the whole poster to fit each size, including all the text.'"
    vars:
      visual: "Poster with a 30-word paragraph, headline and logo. The user adds: Just shrink the whole poster to fit each size, including all the text."
      formats: "728x90 banner, 320x50 mobile banner"
      rules: ""
    assert:
      - {type: llm-rubric, value: "Explains that shrinking the whole poster would make text unreadable in small banners and proposes cutting copy and recomposing instead."}
