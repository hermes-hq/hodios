schema: 1
baseline: "Help me lay out a zine about {{zine}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-riso-photo-zine
    vars:
      zine: "Photo and short-text zine about the night buses in my city, 12 photos and about 600 words, quiet and melancholic, about 16 pages"
      production: "Two-colour risograph (blue and fluorescent pink), 150 copies"
    assert:
      - {type: contains, value: "## Imposition"}
      - {type: llm-rubric, value: "Sets a page count as a multiple of 4 including covers, gives a page plan with the centre spread used for a strong image, shows imposition for a saddle-stitched zine and recommends a folded paper dummy, explains one greyscale file per ink colour with registration and overprinting, keeps margins for the non-printing edge, and mentions creep and a test print."}
  - name: edge-no-production-mini-zine
    vars:
      zine: "A tiny guide to the edible plants in my local park, drawings and handwritten notes, about 8 pages"
      production: ""
    assert:
      - {type: llm-rubric, value: "Assumes photocopying and says so, recommends an 8-page one-sheet mini zine with its imposition and the single cut, and advises on keeping fine drawings and handwriting legible when photocopied."}
  - name: negative-wrong-page-count
    description: "The user adds: 'I want exactly 10 pages, stapled in the middle.'"
    vars:
      zine: "Poetry zine, 10 poems. The user adds: I want exactly 10 pages, stapled in the middle."
      production: "Library photocopier, 40 copies"
    assert:
      - {type: llm-rubric, value: "Explains that a saddle-stapled zine needs a multiple of 4 pages, and offers options such as 12 pages with a title page and notes, or 8 pages with fewer poems, instead of planning an impossible 10-page stapled zine."}
