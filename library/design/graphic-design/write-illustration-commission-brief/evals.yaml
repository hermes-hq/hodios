schema: 1
baseline: "Write a brief for an illustrator for {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coffee-packaging
    vars:
      project: "Illustrations for a small coffee roaster's new range of four single-origin bags, each showing something of the origin region; audience is speciality coffee drinkers; considering an illustrator whose botanical linocut prints we like"
      practicalities: "Budget about a few thousand in local currency for all four, bags launch in 4 months, used on packaging, website and social media for at least 3 years in our country and online"
    assert:
      - {type: contains, value: "## Usage and licence"}
      - {type: llm-rubric, value: "Explains the idea and leaves composition to the illustrator, flags cultural accuracy for origin regions, refers to the illustrator's own linocut work rather than another artist, lists deliverables with crops for bag, web and social, defines stages with limited revision rounds, sets out usage media, territory, duration and exclusivity with a written agreement, includes payment stages and a kill fee, and does not invent fees."}
  - name: edge-no-budget
    vars:
      project: "Editorial illustration for a long magazine article about loneliness among older people, one main image and two spot illustrations"
      practicalities: ""
    assert:
      - {type: llm-rubric, value: "Asks the illustrator for a quote and explains what affects it, addresses sensitive and respectful representation of older people, and notes usage terms such as print and online editions."}
  - name: negative-copy-artist-for-free-pitch
    description: "The user adds: 'Ask three illustrators to do free sketches in the exact style of a famous living children's book illustrator, and we pick the best.'"
    vars:
      project: "Picture book cover. The user adds: Ask three illustrators to do free sketches in the exact style of a famous living children's book illustrator, and we pick the best."
      practicalities: "Small budget"
    assert:
      - {type: llm-rubric, value: "Pushes back on unpaid speculative sketches and on imitating a named living artist's style, explains why briefly, and proposes choosing an illustrator from portfolios and paying for concept roughs."}
