schema: 1
baseline: "Write a design brief for this project: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-event-poster
    vars:
      project: "Posters and Instagram assets for our community bike-repair café, every first Saturday at the library. We want more people to come, also volunteers, also we want to thank sponsors and mention it's free and family-friendly. A3 posters for noticeboards and a square post plus a story."
      brand: "Logo available as SVG. Colours green #2E7D32 and off-white. No brand font."
      deadline: "Print files by 20 April"
    assert:
      - {type: contains, value: "## Deliverables"}
      - {type: llm-rubric, value: "Picks one primary objective (attendance) and ranks volunteers and sponsor thanks as secondary, writes a single key message, includes a deliverables table with A3 print (CMYK, bleed) and square and story sizes for Instagram (RGB, safe zones), lists mandatories (date, location, free), and uses TBD rather than inventing budget or approver."}
  - name: edge-missing-everything
    vars:
      project: "We need a new logo."
      brand: ""
      deadline: ""
    assert:
      - {type: llm-rubric, value: "Produces a skeleton brief with TBD in fields it cannot know and a focused list of questions (what the organisation does, audience, where the logo will be used, existing equity, budget, deadline), without inventing the business."}
