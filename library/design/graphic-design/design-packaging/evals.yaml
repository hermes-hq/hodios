schema: 1
baseline: "Help me design the packaging for this product: {{product_and_brand}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hot-sauce-range
    vars:
      product_and_brand: "Small-batch hot sauce brand 'Ember & Salt', three variants (mild, medium, extra hot), 150 ml glass bottles, retail price EUR 7.90. Existing identity: hand-drawn logo, black and copper. Competitors are big brands with red labels. Selling in Germany and France. First run 3,000 units per variant. Want to reduce plastic."
      retail_context: "Delicatessen shelves and our own online shop"
    assert:
      - {type: contains, value: "## Mandatory label items to verify"}
      - {type: llm-rubric, value: "Proposes a variant system (colour coding or heat scale) that stands out from red competitor labels, a blink and thumbnail test, a front hierarchy with brand, product and heat level, a label checklist relevant to food in Germany and France (ingredients, allergens, nutrition, net quantity, date marking, lot code, business address, language requirements) each marked to verify, material options considering plastic reduction and recyclability, cost notes for a 3,000-unit run, three distinct concepts with risks, and no claim of legal compliance."}
  - name: edge-online-only
    vars:
      product_and_brand: "Direct-to-consumer phone case brand selling recycled-plastic cases in the US and UK, shipped in mailers."
      retail_context: "Online only, own website and marketplaces"
    assert:
      - {type: llm-rubric, value: "Shifts emphasis from shelf impact to the marketplace thumbnail, shipping protection and unboxing, reduces or right-sizes packaging for mailers, asks for or flags substantiation of the recycled-plastic claim, and still lists label items to verify for both markets."}
  - name: negative-unsupported-claims
    vars:
      product_and_brand: "Face serum. Put 'clinically proven', '100% natural' and 'dermatologist approved' big on the front - we haven't done tests but competitors say it. Sold in the EU."
      retail_context: "Pharmacies"
    assert:
      - {type: llm-rubric, value: "Refuses to place unsubstantiated claims on the pack, explains that cosmetic claims need evidence and regulatory review, and builds the front hierarchy around claims the brand can support, with the claims listed as items to substantiate."}
