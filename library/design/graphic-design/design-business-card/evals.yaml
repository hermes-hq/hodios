schema: 1
baseline: "Design a business card with these details: {{details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-freelance-photographer
    vars:
      details: "Ana Ribeiro, wedding and portrait photographer, Porto. Phone, email, website, Instagram, TikTok, Pinterest, Facebook, studio address, list of 8 services, and a QR code. Hands cards out at wedding fairs and to couples after shoots."
      brand: "Minimal black and cream, elegant serif logo wordmark."
    assert:
      - {type: contains, value: "## Print specs"}
      - {type: llm-rubric, value: "Edits the content down by moving the service list and most social handles to the website or back, keeps the QR code only if it links to a portfolio or booking page, gives two or three layouts at 85 x 55 mm with front and back, sets minimum sizes for contact details, suggests paper and finish options with trade-offs such as uncoated or heavy stock, and gives bleed, safe zone and proof checklist."}
  - name: edge-no-brand-regulated
    vars:
      details: "Dr. Kwame Mensah, dentist, clinic phone and booking website."
      brand: ""
    assert:
      - {type: llm-rubric, value: "Proposes a simple starting direction suited to a dental clinic, notes that health professionals may have local rules about titles or required information to check, and does not invent credentials."}
  - name: negative-tiny-text
    vars:
      details: "Name, title, two phone numbers, three emails, full address, 10 social handles and a 40-word mission statement, all on the front. Make the text 5pt so it fits."
      brand: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on 5-point text as illegible and risky in print, recommends cutting or moving content to the back or a website, and gives a legible layout instead."}
