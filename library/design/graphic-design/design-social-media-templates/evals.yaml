schema: 1
baseline: "Design social media templates for this brand: {{brand}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-instagram
    vars:
      brand: "Neighbourhood coffee roaster. Colours: espresso brown #3B2416, oat #EFE6D8, tomato red #E5462B. Fonts: a chunky serif for headlines, a clean sans for body (both free Google Fonts). Photography: natural light, hands and beans, no posed models."
      content_types: "Instagram feed and stories, LinkedIn occasionally. 4 posts a week: new beans, brewing tips (carousels), events, behind the scenes. Built in Canva by the owner."
    assert:
      - {type: contains, value: "## Variety rules"}
      - {type: llm-rubric, value: "Gives formats per platform with ratios and common sizes flagged to confirm, safe zones for stories and the profile grid crop, a small template set mapped to the four content types including a carousel structure for tips, colour roles using only the given hex values with contrast-checked text combinations, variety rules for rotating templates across the grid, accessibility (alt text, captions), and Canva-specific production notes."}
  - name: negative-no-brand
    vars:
      brand: "My page."
    assert:
      - {type: llm-rubric, value: "Asks for the brand assets, audience and platforms (or the content types) instead of inventing colours and fonts."}
