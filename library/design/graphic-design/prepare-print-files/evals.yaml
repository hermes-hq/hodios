schema: 1
baseline: "How do I prepare this for print: {{print_item}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-trifold-with-specs
    vars:
      print_item: "Tri-fold (roll fold) A4 brochure for a dental clinic, 2,000 copies, designed in Affinity Publisher. Photos came from the clinic's website. Brand blue is a bright RGB blue."
      printer_specs: "3mm bleed, PDF/X-1a, FOGRA39 profile, total ink limit 300%, min text 6pt."
    assert:
      - {type: contains, value: "## Preflight checklist"}
      - {type: llm-rubric, value: "Uses the printer's 3mm bleed, PDF/X-1a, FOGRA39 and 300% ink limit as the requirement, explains roll-fold panel widths with the inside panel slightly narrower, flags website photos as likely too low resolution for 300 ppi at print size, warns the bright RGB blue will shift in CMYK and suggests a proof, recommends 100% black for body text, and gives a checkbox preflight list plus questions for the printer."}
  - name: edge-no-specs
    vars:
      print_item: "Business cards, 85x55mm, 500 copies, designed in Canva, gold foil logo wanted."
    assert:
      - {type: llm-rubric, value: "Uses common defaults clearly marked to confirm with the printer, explains that foil usually needs a separate spot layer or file and checks whether the design tool and printer support it, and lists questions for the printer and a proof request."}
