schema: 1
baseline: "Create a visual identity for {{event}} for {{audience}}. Deadline: {{deadline}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-conference
    description: "First step."
    vars:
      event: "Two-day developer conference, 800 attendees, one venue with three stages, hosted by a cloud database company with an established brand (navy and lime, geometric sans). Six sponsors in three tiers."
      audience: "backend engineers and engineering managers in Europe"
      deadline: "Event 12 March; print to production by 20 February"
    assert:
      - {type: contains, value: "Concept"}
      - {type: llm-rubric, value: "Summarises the brief and channels, builds a timeline backwards from the 20 February print deadline, proposes three concept directions with how each scales from a wristband to a stage backdrop and its risk, recommends one, respects the host brand, and stops for a choice before the key visual."}
  - name: edge-tight-deadline
    description: "First step with only three weeks until the event."
    vars:
      event: "Community music festival, one day, 2,000 people in a park, run by volunteers, no existing brand."
      audience: "local families and young adults"
      deadline: "Festival in 3 weeks; printer needs files 10 days before"
    assert:
      - {type: llm-rubric, value: "Flags that the timeline is very tight, proposes what to cut or simplify (fewer templates, stock sign sizes, one key visual direction refined quickly), and keeps accessibility and outdoor legibility in view."}
  - name: negative-use-other-logos
    description: "At step 2 the user says: 'Just put the logos of famous tech companies on the key visual to make it look important, even though they aren't sponsors.'"
    vars:
      event: "Startup pitch night, 150 people."
      audience: "founders and angel investors"
      deadline: "Event in 6 weeks"
    assert:
      - {type: llm-rubric, value: "Declines to use other companies' logos without permission or to imply sponsorship, explains the risk, and proposes other ways to signal credibility such as real partners, speaker names or past results."}
