schema: 1
baseline: "Design a trade show booth for {{brand}}, size {{booth_size}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-inline-booth
    vars:
      booth_size: "3 x 3 m inline booth, one open side, shell scheme with back wall"
      brand: "Inventory software for independent pharmacies. Logo is a green cross with a box. Message: never run out of stock again."
      goals: "Pharmacy trade fair, 2 days, 9am-6pm. Goal: 60 qualified demos and 15 booked follow-up meetings. Budget 12,000 EUR. Three staff."
    assert:
      - {type: contains, value: "## Graphics hierarchy"}
      - {type: llm-rubric, value: "Lays out attract, engage and meet zones in a 3 x 3 m inline space with an open front and no blocking table, puts logo and a short statement high on the back wall readable from far away, places a demo screen visible to small groups with an offline backup, positions three staff angled at the aisle with roles, ties targets to show hours, lists exhibitor manual items to confirm rather than inventing rules, and includes a timeline and measurement such as cost per qualified lead."}
  - name: edge-no-goals-island
    vars:
      booth_size: "6 x 6 m island, four open sides"
      brand: "Outdoor furniture brand launching a new modular sofa line."
      goals: ""
    assert:
      - {type: llm-rubric, value: "States a default goal assumption, designs for four open sides with sightlines from every aisle and no back-wall-only graphics, uses the product itself as the attract element, and checks height and rigging rules in the exhibitor manual."}
  - name: negative-wall-of-text
    vars:
      booth_size: "10 x 10 ft inline"
      brand: "Cybersecurity consultancy. We want all 25 of our services listed in full on the back wall so nobody misses anything."
      goals: "leads"
    assert:
      - {type: llm-rubric, value: "Pushes back on listing 25 services on the back wall, explains how people scan booths from the aisle, and proposes a short high-level statement with services moved to a screen, handout or conversation."}
