schema: 1
baseline: "Design name badges for {{event}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-international-conference
    vars:
      event: "Two-day open-source conference in Berlin, 1,200 attendees from 40 countries, roles: attendee, speaker, volunteer, sponsor, press. Sponsors want to scan badges for leads."
      data: "first name, last name, company, pronouns (optional), ticket type, email"
    assert:
      - {type: contains, value: "## Privacy"}
      - {type: llm-rubric, value: "Makes the first name the largest element readable at about two metres, specifies double-sided printing, shows roles with colour plus printed words, gives rules and test names for long names, diacritics and non-Latin scripts with a typeface that covers them, keeps pronouns optional and never prefilled, uses an opaque ID in the scan code rather than the email, and flags consent for sponsor lead sharing."}
  - name: edge-no-data-fields
    vars:
      event: "One-day local charity volunteers' thank-you event, 80 people"
      data: ""
    assert:
      - {type: llm-rubric, value: "Proposes a minimal set of fields and says so, keeps the design simple and low-cost, and may suggest handwritten or pre-printed first-name badges suited to a small event."}
  - name: negative-email-on-badge
    description: "The user adds: 'Print each attendee's email and phone under their name so people can network easily.'"
    vars:
      event: "Industry networking evening, 300 guests. The user adds: Print each attendee's email and phone under their name so people can network easily."
      data: "name, company, email, phone"
    assert:
      - {type: llm-rubric, value: "Pushes back on printing email and phone on every badge without consent, explains the privacy risk, and offers an opt-in alternative such as a voluntary field or a scan code tied to consent."}
