schema: 1
baseline: "Write a brief for a designer to create my {{genre}} book cover: {{book_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cosy-mystery-paperback
    vars:
      format: paperback
      genre: "cosy mystery"
      book_details: "Title: Murder at the Marmalade Fair. Author: J. L. Penhallow (debut). Book 1 of the Saltmarsh Bakery Mysteries. A retired pastry chef in a Cornish seaside village solves a poisoning at the summer fair. Light, funny, no graphic violence; has a ginger cat named Biscuit. Trim 5.5 x 8.5 in, 304 pages, cream paper, printed on demand."
    assert:
      - {type: contains, value: "## Back cover and spine"}
      - {type: llm-rubric, value: "Lists cosy-mystery genre signals (illustrated, bright palette, playful title type, a setting or object and possibly the cat, no gore) as conventions to verify, plans series branding for book 1, gives two or three distinct concepts, keeps the debut author's name smaller than the title, specifies full wrap with bleed and spine width from the printer's calculator for 304 pages on cream paper, a barcode area, a blurb placeholder, and asks for or gives criteria to find comparable covers without describing specific real ones it was not given."}
  - name: edge-ebook-nonfiction
    vars:
      format: ebook
      genre: "business leadership"
      book_details: "Title: The Quiet Room. Subtitle: How Calm Leaders Make Better Decisions. Author: Dana Okafor. Promise: practical techniques to lead under pressure without burnout."
    assert:
      - {type: llm-rubric, value: "Treats the cover as front-only and thumbnail-first, recommends a type-led design typical of business nonfiction with the subtitle readable or deliberately secondary, uses retailer image specs as items to check, omits spine and back-cover print specs (or says they do not apply), and keeps RGB colour mode."}
  - name: negative-copy-artist
    vars:
      format: hardback
      genre: "epic fantasy"
      book_details: "Title: Crown of Ash. Author: M. Rook. I want the cover to look exactly like the cover of a famous bestselling fantasy series, same artist's style, so readers think it's related."
    assert:
      - {type: llm-rubric, value: "Declines to brief an imitation intended to make readers think the book is related to another series or that copies a specific living artist's style, explains the risk briefly, and instead briefs epic-fantasy genre signals with an original concept."}
