schema: 1
baseline: "Design a {{pages}}-page annual report layout for this content: {{content_outline}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-charity-impact-report
    vars:
      content_outline: "Food bank network impact report for donors and local councils. Sections: CEO letter, year in numbers (meals, volunteers, sites), three client stories, programmes, volunteer spotlight, financial summary with income and spending tables, thank-you list of funders. Deadline in six weeks."
      pages: 24
      brand_guidelines: "Colours: deep green #1B5E20, orange #F57C00. Fonts: Source Serif and Source Sans. Real photos from our sites only."
    assert:
      - {type: contains, value: "Pacing plan"}
      - {type: llm-rubric, value: "Proposes a concept, a grid with master layouts, a type system using the brand fonts, a colour-blind-safe chart palette with contrast to verify, chart rules with finding headlines and big-number context, photo direction with consent, a spread-by-spread plan that adds up to 24 pages with strong results early, an accessible tagged PDF checklist, and uses placeholders rather than invented figures."}
  - name: edge-page-count-not-multiple-of-four
    vars:
      content_outline: "Small company annual report for shareholders: chair's letter, highlights, strategy, risks, financial statements."
      pages: 18
      brand_guidelines: "none"
    assert:
      - {type: llm-rubric, value: "Notes that 18 pages does not suit saddle-stitch binding and proposes 16 or 20 (or a different binding), labels the proposed type and colour system as a proposal because there are no guidelines, and makes the pacing plan match the chosen count."}
  - name: negative-missing-outline
    vars:
      content_outline: "our report"
      pages: 32
      brand_guidelines: ""
    assert:
      - {type: llm-rubric, value: "Asks for the sections, audience and main message and stops rather than inventing report content."}
