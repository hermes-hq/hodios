schema: 1
baseline: "Design a poster layout for: {{brief}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-jazz-night-print
    vars:
      brief: "Poster for a jazz night at a neighbourhood bar, Friday 13 November, 9pm, free entry. Headliner: a local quartet. Must include 6 sponsor logos, the bar's Instagram handle, a paragraph about the band, and a QR code for the playlist. Will be posted in shop windows and on lamp posts. Vintage, warm feel. We have one good band photo."
      size: "A2"
      output: print
    assert:
      - {type: contains, value: "## Content hierarchy"}
      - {type: llm-rubric, value: "Sorts content into three levels with the photo or headline at level 1 and what, when and where at level 2, recommends shrinking or moving the sponsor logos and band paragraph to level 3 or elsewhere, sizes text for street viewing distance at A2, offers two distinct layouts with a recommendation, and gives print specs with bleed, CMYK, 300 ppi and a tested QR code at final size."}
  - name: edge-screen-no-size
    vars:
      brief: "Digital poster for a university library's late opening hours during exam season, shown on hallway TV screens and on Instagram stories."
      size: ""
      output: screen
    assert:
      - {type: llm-rubric, value: "Recommends pixel sizes for both landscape hallway screens and vertical stories, notes safe zones for story overlays, uses sRGB, and adapts hierarchy to short viewing times."}
  - name: negative-missing-details
    vars:
      brief: "Make a poster for our event, something cool."
      size: ""
      output: print
    assert:
      - {type: llm-rubric, value: "Asks what the event is, when and where, the audience and where the poster will hang before planning, rather than inventing event details."}
