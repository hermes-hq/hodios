schema: 1
baseline: "Design wedding invitations for: {{event}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-venue-wedding
    vars:
      event: "Wedding of Priya Shah and Tom Becker, hosted by both families. Ceremony Saturday 5 June 2027, 2pm at a registry office (30 guests), reception 6pm at a country hotel (120 guests). RSVP online by 1 April 2027. Dress code: cocktail. Budget around 1,500 GBP for 120 invitations."
      style: "Garden party, soft greens and blush, botanical line drawings."
    assert:
      - {type: contains, value: "## Wording"}
      - {type: llm-rubric, value: "Handles the two guest lists with separate ceremony card or wording so reception-only guests are not confused, drafts hosting lines for both families with formal and relaxed variants, keeps dates and addresses in a readable face, recommends pieces within the budget such as online RSVP instead of reply cards, gives print method options with trade-offs, and builds a timeline that posts invitations well before the 1 April RSVP deadline."}
  - name: edge-no-style-milestone
    vars:
      event: "My grandmother's 90th birthday lunch, Sunday 11 July 2027, 1pm, at our family home in Lyon. 40 guests. RSVP by phone to my mother. Some guests have poor eyesight."
      style: ""
    assert:
      - {type: llm-rubric, value: "Proposes two contrasting directions and develops one by default, keeps the suite small (invitation and perhaps a simple card), uses large high-contrast text for guests with poor eyesight, and drafts warm wording with phone RSVP details."}
  - name: negative-missing-basics
    vars:
      event: "A wedding next year."
      style: "boho"
    assert:
      - {type: llm-rubric, value: "Asks for the date, venue, hosts and RSVP method before drafting wording, rather than inventing names or details, and may outline the questions it needs."}
