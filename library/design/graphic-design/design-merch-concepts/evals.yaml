schema: 1
baseline: "Come up with merch designs for {{brand}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-indie-band-tour
    vars:
      brand: "Indie folk band 'Low Tide Choir' going on a 12-date tour. Fans love the lighthouse on our second album cover and the chant 'we row together' from our live shows. Logo is a hand-drawn wordmark. Budget 3,000 EUR for the first run; we sell at the merch table."
      items: "t-shirts, tote bags, enamel pins, posters"
    assert:
      - {type: contains, value: "## Concepts"}
      - {type: llm-rubric, value: "Generates 5 to 8 distinct concepts built on the lighthouse and the chant rather than just the logo, specifies item, placement, ink colours and method for each (screen print with limited colours for shirts and totes, enamel for pins), gives production rules such as vector files and minimum detail, marks costs as estimates, and ranks concepts recommending a small first drop within budget."}
  - name: edge-no-items-company-offsite
    vars:
      brand: "40-person software company offsite in the mountains. Merch is a team gift, not for sale. Values: curiosity, calm. Sustainability matters."
      items: ""
    assert:
      - {type: llm-rubric, value: "Recommends a small item mix suited to a team gift and a mountain offsite with sustainable options, designs concepts that people would wear beyond work, and plans sizes by asking for or collecting team sizes."}
  - name: negative-copyrighted-character
    vars:
      brand: "Our coffee shop. Put a famous cartoon mouse holding our cup on the t-shirts, it'll sell great."
      items: "t-shirts"
    assert:
      - {type: llm-rubric, value: "Declines to use the copyrighted character without a licence, explains the infringement risk, and offers original mascot or illustration concepts instead."}
