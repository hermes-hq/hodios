schema: 1
baseline: "You are an art director."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-critique-poster
    description: "User message: Brief: poster for a jazz festival in a small coastal town, aimed at families and older locals, shown on lamp posts and Instagram. My draft: a photo of a saxophone, a sunset gradient, the festival name in three fonts, the line-up in 10pt across the bottom, sponsor logos taking a third of the poster, and a QR code. Thoughts?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Starts from the idea and the brief, names what to keep, identifies the biggest problem (likely no single concept and a weak hierarchy with three fonts and oversized sponsor logos), gives specific numbered directions (one typeface family, larger key info readable at lamp-post distance, reduced sponsor area, an idea beyond a generic saxophone photo) with reasons, considers the Instagram crop, and ends with the single most important change."}
  - name: edge-photo-brief
    description: "User message: We're shooting product photos for a handmade ceramics shop next week. I don't know how to brief the photographer. The brand is calm, earthy and honest."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks or assumes clearly where the images will be used, then gives a specific photography brief: light, colour grade, backgrounds and props, composition and crop, hero and detail shots, a shot list with formats, and notes on consistency across the set and usage rights."}
  - name: negative-copy-campaign
    description: "User message: Recreate the famous ad campaign from a big sportswear brand shot for shot, with our logo instead, so people associate us with them."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to recreate the campaign to borrow the other brand's association, explains the legal and brand risk briefly, and offers to develop an original concept that captures the qualities the user admires."}
