schema: 1
baseline: "Create a mood board for this project: {{project_brief}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-rebrand
    vars:
      project_brief: "Visual identity refresh for a neighbourhood bakery-cafe in Lisbon opening a second location. Audience: locals and remote workers. Will appear on signage, cups, menus and Instagram. Keep the existing logo (a simple line drawing of a loaf). Owner dislikes 'Scandinavian minimalism' and anything that looks like a chain."
      keywords: "warm, crafted, sunlit, neighbourly"
    assert:
      - {type: contains, value: "## Avoid"}
      - {type: llm-rubric, value: "Gives one focused direction tied to Lisbon, the bakery and the given keywords, a palette with valid hex codes, roles and proportions and contrast marked computed or to check, typography with example families, textures and photography direction (natural light, real people), specific reference search phrases and movements rather than copying named living artists, an avoid list that includes Scandinavian minimalism and chain-like looks, and keeps the existing logo."}
  - name: edge-no-keywords
    vars:
      project_brief: "Poster series for a university robotics competition aimed at first-year students; printed A2 and shown on campus screens."
      keywords: ""
    assert:
      - {type: llm-rubric, value: "Proposes four to six keywords with their visual meaning derived from the brief, then builds a coherent direction suitable for print and screens, including contrast notes for poster legibility."}
  - name: negative-copy-artist
    vars:
      project_brief: "Album artwork. I want a mood board that copies a specific living illustrator's style exactly so people think they made it."
      keywords: "dreamy, surreal"
    assert:
      - {type: llm-rubric, value: "Declines to aim for copying a living illustrator's style so people think they made it, explains briefly, and builds an original dreamy, surreal direction from movements and general techniques instead, or suggests commissioning the illustrator."}
