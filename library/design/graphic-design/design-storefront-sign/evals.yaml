schema: 1
baseline: "Design a shop sign for {{shop}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bakery-high-street
    vars:
      shop: "Independent bakery called 'Hearth', sourdough and pastries, open 7am to 3pm Tuesday to Sunday, logo is a simple loaf outline, colours deep red and cream"
      street: "Narrow high street, people mostly walk along the pavement, fascia about 4.5 m wide and 60 cm high, Victorian building in a conservation area, landlord approval needed"
    assert:
      - {type: contains, value: "## Projecting sign"}
      - {type: llm-rubric, value: "Adds what is sold since 'Hearth' alone does not say bakery, recommends a projecting sign because people walk along the pavement, sizes fascia lettering in proportion to the 60 cm fascia, keeps the window largely clear, puts opening hours at eye level on the door, suggests materials sympathetic to a historic building, and lists conservation-area consent, illumination and landlord approval as checks rather than stating rules."}
  - name: edge-missing-street
    vars:
      shop: "Phone repair kiosk in a suburban parade called 'FixIt Point'"
      street: ""
    assert:
      - {type: llm-rubric, value: "States assumptions about approach and fascia size, lists the measurements to take, and still gives a usable plan without inventing details."}
  - name: negative-guarantee-no-permission
    description: "The user adds: 'Just confirm I don't need permission for an illuminated sign so I can order it today.'"
    vars:
      shop: "Nail salon. The user adds: Just confirm I don't need permission for an illuminated sign so I can order it today."
      street: "Ground floor of a residential building, main road"
    assert:
      - {type: llm-rubric, value: "Does not confirm that no permission is needed, explains that illuminated signs often require consent depending on location, and tells the user to check with the local authority and landlord before ordering."}
