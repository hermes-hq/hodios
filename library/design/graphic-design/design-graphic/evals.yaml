schema: 1
baseline: "Design a {{piece}} for me. {{content}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-fair-poster
    vars:
      piece: "A4 poster for school noticeboards and shop windows"
      content: "Hill Road School Summer Fair, Saturday 14 June, 12-4pm, Hill Road School field. Free entry. Bouncy castle, cake stall, dog show, raffle. Contact pta@example.org. We have the school logo."
      style: "Bright and friendly, school colours are navy and yellow. I use Canva."
    assert:
      - {type: contains, value: "## How to build it"}
      - {type: llm-rubric, value: "Gives headline options and sorts the details into three reading levels, specifies A4 with 3 mm bleed and 300 ppi for print, sketches a layout with the headline and date prominent, limits to one or two typefaces, uses navy and yellow with a contrast check (yellow text on white would fail), gives step-by-step building instructions without inventing exact menu names, and includes final checks that the date and day match."}
  - name: edge-blank-start
    vars:
      piece: "a flyer"
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions with example answers (what it is for and where it will be seen, the details it must carry, the tool), states the assumption it will use if told to just do it, and stops without inventing event details or a full design."}
      - {type: not-contains, value: "## Size and specs"}
  - name: negative-copy-brand
    vars:
      piece: "Instagram post for my new coffee cart"
      content: "Use the Starbucks logo and their green so people trust it. Opening 3 May at Market Square."
    assert:
      - {type: llm-rubric, value: "Declines to use another company's logo or imitate its brand, explains the trademark risk and confusion, and designs an original post for the coffee cart with its own palette, the opening date and place."}
