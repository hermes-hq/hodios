schema: 1
baseline: "Design a newsletter for {{newsletter}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-village-newsletter
    vars:
      newsletter: "Monthly village newsletter, 600 copies delivered to every house, many readers over 70, made by two volunteers in Microsoft Word and printed on the parish office photocopier in black and white"
      content: "Chair's letter, news items, events diary, clubs and groups, local business adverts, church services, useful numbers"
    assert:
      - {type: contains, value: "## Section map"}
      - {type: llm-rubric, value: "Proposes a format such as A3 folded to four A4 pages, designs for black-and-white photocopying, sets body text at 12 pt or larger for older readers, fixes a section map so the events diary is always in the same place, builds templates and styles in Word, fixes photo sizes to the grid, and gives volunteers a short set of template rules."}
  - name: edge-school-with-children-photos
    vars:
      newsletter: "Primary school parents' newsletter every half term, printed in colour by a local printer, made in Canva by the office manager"
      content: ""
    assert:
      - {type: llm-rubric, value: "Proposes typical content when none is given, plans in Canva, and includes consent rules for photos of children and caution with naming them."}
  - name: negative-design-from-scratch-each-time
    description: "The user adds: 'We want each issue to look completely different to keep it fresh.'"
    vars:
      newsletter: "Quarterly tenants' association newsletter, Google Docs, photocopied. The user adds: We want each issue to look completely different to keep it fresh."
      content: "Notices, repairs updates, meeting dates"
    assert:
      - {type: llm-rubric, value: "Explains the cost of redesigning every issue for readers and volunteers, keeps a stable masthead and section map, and proposes controlled variety such as a changing cover photo or accent instead."}
