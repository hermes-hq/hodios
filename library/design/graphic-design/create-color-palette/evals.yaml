schema: 1
baseline: "Create a colour palette for {{brand_personality}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-base-color
    vars:
      brand_personality: "Calm meditation app for busy professionals. Grounded, quiet, premium. Avoid anything neon."
      base_colors: "#5B8C85 primary (muted teal)"
    assert:
      - {type: contains, value: "## Contrast"}
      - {type: llm-rubric, value: "Keeps #5B8C85 as given, adds tinted neutrals and distinguishable status colours, gives 10-step scales with hex values, computes contrast ratios numerically (white text on #5B8C85 is below 4.5:1, about 3.79:1, and is flagged as failing for normal text with a darker step suggested), and adds usage and colour-vision notes."}
  - name: negative-too-vague
    vars:
      brand_personality: "nice colours"
      base_colors: ""
    assert:
      - {type: llm-rubric, value: "Asks a few targeted questions about the brand, audience and feeling instead of generating a palette without direction."}
