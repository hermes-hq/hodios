schema: 1
baseline: "Create a colour palette for {{brand_personality}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-base-color
    vars:
      brand_personality: "Calm meditation app for busy professionals. Grounded, quiet, premium. Avoid anything neon."
      base_colors: "#5B8C85 primary (muted teal)"
    assert:
      - {type: contains, value: "## Contrast"}
      - {type: llm-rubric, value: "Keeps #5B8C85 as given, adds tinted neutrals and distinguishable status colours, gives 10-step primary and neutral scales with OKLCH lightness targets and hex values marked approximate, gives background, border and text steps for each status colour, computes contrast ratios numerically (white text on #5B8C85 is below 4.5:1, about 3.79:1, and is flagged as failing for normal text with a darker step suggested), and adds usage and colour-vision notes."}
  - name: edge-red-brand
    vars:
      brand_personality: "Late-night food delivery app for students. Energetic, cheeky, fast."
      base_colors: "#E11D48 primary (raspberry red)"
    assert:
      - {type: llm-rubric, value: "Keeps #E11D48 unchanged, recognises that a red brand colour collides with the danger status, and resolves it with a clearly different danger hue or a required second cue (icon or label) rather than reusing the brand red for errors; computes white on #E11D48 numerically (about 4.69:1 truncated, passing for normal text) and shows luminance values."}
  - name: negative-too-vague
    vars:
      brand_personality: "nice colours"
      base_colors: ""
    assert:
      - {type: llm-rubric, value: "Asks a few targeted questions about the brand, audience and feeling instead of generating a palette without direction."}
