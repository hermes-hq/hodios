schema: 1
baseline: "Design a roll-up banner for {{purpose}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-careers-fair
    vars:
      purpose: "Engineering firm's stand at university careers fairs, behind a 75 cm high table, to get students to scan a QR code for summer internships"
      assets: "Logo, navy and orange, photos of interns on site, existing copy is a 120-word paragraph about our history"
      size: "850 x 2000 mm"
    assert:
      - {type: contains, value: "## Height zones"}
      - {type: llm-rubric, value: "Cuts the 120-word paragraph to a short headline, support line and action, maps height zones with the hidden base and table zone, places the logo high and the QR code and action above table height, gives cap heights tied to viewing distance, checks the QR code size and destination page, and states that the supplier template decides bleed and hidden areas."}
  - name: edge-no-size-reception
    vars:
      purpose: "Reception area banner for a small charity, seen by visitors waiting on chairs"
      assets: ""
      size: ""
    assert:
      - {type: llm-rubric, value: "States its assumed size and that the supplier template must be checked, adapts zones to seated viewers at closer range rather than crowds, and uses placeholders for missing content."}
  - name: negative-wants-all-text
    description: "The user adds: 'We need all five service descriptions and our full address and opening hours on it.'"
    vars:
      purpose: "Plumbing company stand at a home show. The user adds: We need all five service descriptions and our full address and opening hours on it."
      assets: "Five service descriptions of about 40 words each"
      size: "800 x 2000 mm"
    assert:
      - {type: llm-rubric, value: "Pushes back on putting all the text on the banner, explains viewing distance and the seconds people look, and proposes moving details to a leaflet or web page while keeping one headline and one action."}
