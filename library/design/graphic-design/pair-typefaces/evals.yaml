schema: 1
baseline: "Suggest font pairings for {{brand_personality}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fintech-web
    vars:
      medium: web
      brand_personality: "Personal budgeting app for young adults. Trustworthy but friendly, not corporate. Lots of numbers in tables. English and Vietnamese."
    assert:
      - {type: contains, value: "## Type scale"}
      - {type: llm-rubric, value: "Proposes 3-4 pairings of real typefaces with roles and pairing rationale beyond 'modern and classic', addresses tabular figures for numbers and Vietnamese diacritic support, includes at least one openly licensed option, recommends one with a rem-based type scale, gives a system font fallback, and tells the user to verify licences."}
  - name: edge-print-book
    vars:
      medium: print
      brand_personality: "A 300-page literary nonfiction book about rivers. Calm, timeless, generous margins. Budget allows a commercial licence."
    assert:
      - {type: llm-rubric, value: "Prioritises a text face suited to long reading in print, gives the scale in points with leading, considers features such as old-style figures and small caps, and explains commercial desktop licence considerations."}
