schema: 1
baseline: "Design a presentation template for this brand: {{brand}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sales-and-board
    vars:
      brand: "Industrial software company. Colours: navy #0B1F3A, signal yellow #FFC400, steel grey #8A99A8, white. Brand font: a licensed grotesk not installed on staff laptops; fallback Arial. Logo: horizontal and stacked versions, white and navy. Imagery: real factory photography, no stock smiles."
      use_cases: "Sales reps build pitch decks in PowerPoint; finance builds quarterly board decks heavy on charts and tables. Current decks use tiny text and rainbow charts."
    assert:
      - {type: contains, value: "## Master layouts"}
      - {type: llm-rubric, value: "Specifies 10-14 layouts mapped to sales and board use cases (including chart with takeaway title and table layouts), handles the non-installed brand font by recommending embedding or the Arial fallback in PowerPoint theme fonts, sets a type scale with minimum presented sizes, maps theme colour slots using only the given hex values with a chart palette and highlight colour (noting contrast limits of yellow on white), defines chart and table styles that fix rainbow charts, includes accessibility, do and don't pairs and PowerPoint build notes."}
  - name: edge-missing-values
    vars:
      brand: "Charity supporting young carers. Warm, hopeful, never pitying. Logo exists; we don't have the colour codes to hand. Use Google Slides."
    assert:
      - {type: llm-rubric, value: "Marks colour values (and anything else missing) as TBD instead of inventing them, still specifies layouts, type scale and rules, recommends fonts available in Google Slides, and includes image guidance that avoids pitying imagery and respects the privacy of young people."}
