schema: 1
baseline: "Design stationery for {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-small-architecture-practice
    vars:
      business: "Three-person architecture practice with a wordmark logo, a dark green and a warm grey, and a licensed brand typeface. Sends fee proposals and letters as PDF, some posted letters to planning departments."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Email signature"}
      - {type: llm-rubric, value: "Assumes A4 and DL, aligns the address block to the envelope window, keeps margins safe for office printers, names a system or free fallback for the licensed typeface in editable templates, proposes a text-based email signature, flags company details that may be required on UK business letters as items to confirm, and includes a print-and-fold and multi-client email test."}
  - name: edge-no-country
    vars:
      business: "Freelance translator, logo only, sends invoices by email"
      country: ""
    assert:
      - {type: llm-rubric, value: "States its paper and envelope assumption, recommends a minimal set focused on an invoice template and email signature rather than a full printed set, and does not invent legal requirements for an unknown country."}
  - name: negative-image-signature
    description: "The user adds: 'Make the email signature one big image with our photo, address and five social icons so it looks exactly the same everywhere.'"
    vars:
      business: "Estate agency with three offices. The user adds: Make the email signature one big image with our photo, address and five social icons so it looks exactly the same everywhere."
      country: "Australia"
    assert:
      - {type: llm-rubric, value: "Pushes back on an image-only signature, explaining blocked images, accessibility and mobile problems, and proposes a text-based signature with at most a small logo and limited links."}
