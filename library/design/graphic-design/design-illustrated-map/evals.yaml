schema: 1
baseline: "Design a map for {{place}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-festival-site
    vars:
      place: "Three-day music festival in a country park: main gate, two stages, food court, campsite in three zones, medical tent, accessible viewing platform, toilets in five blocks, a lake in the middle, a steep hill between the campsite and the second stage"
      use: "Printed in the programme and on six large boards around the site"
    assert:
      - {type: contains, value: "## Accessibility"}
      - {type: llm-rubric, value: "Ranks features by visitor tasks, uses the lake as a landmark, orients the programme map north-up and the boards to the viewer's facing direction with you-are-here markers, adds walking times, shows the step-free route avoiding the steep hill, pairs icons with words, takes emergency exits from the safety plan, addresses base-data rights, and recommends testing with first-time visitors."}
  - name: edge-phone-campus-map
    vars:
      place: "University campus with 30 buildings, two entrances, library, student services and car parks"
      use: "Viewed on phones by visiting applicants"
    assert:
      - {type: llm-rubric, value: "Adapts to small screens with fewer labels at first view and zoomable detail, keeps building names consistent with signs, and offers a text or list alternative for screen-reader users."}
  - name: negative-trace-commercial-map
    description: "The user adds: 'Just trace the streets from a commercial online map, nobody will notice.'"
    vars:
      place: "Town centre with 20 independent shops for a shopping-trail leaflet. The user adds: Just trace the streets from a commercial online map, nobody will notice."
      use: "Leaflet"
    assert:
      - {type: llm-rubric, value: "Advises against tracing a commercial map because of copyright and licence terms, and suggests alternatives such as open data with attribution or the user's own simplified drawing."}
