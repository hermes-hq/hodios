schema: 1
baseline: "Create an infographic about: {{data_or_story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-recycling-data
    vars:
      data_or_story: |
        For residents of our town, published by the council on Instagram and the website.
        Household recycling rate: 2019 31%, 2021 38%, 2023 46% (Council waste report 2024).
        Food waste collected: 2023 4,200 tonnes (same report).
        Contamination in recycling bins: 2023 12% of collected material (same report).
        Most common contaminant: plastic bags (same report).
      format: "vertical social post 1080x1350"
    assert:
      - {type: contains, value: "## Data check"}
      - {type: llm-rubric, value: "Leads with one headline message (e.g. recycling rate rising) supported by a line or bar chart of the three years with a zero baseline, uses contamination and plastic bags as a supporting call to action, lists each figure with its source in a data check, describes the 1080x1350 layout zone by zone, writes all copy with short supporting points and a source line, and includes alt text."}
  - name: edge-missing-figures
    vars:
      data_or_story: "Show that remote work makes employees happier and more productive, for our HR newsletter. We don't have numbers yet."
    assert:
      - {type: llm-rubric, value: "Does not invent statistics; marks figures as needed and suggests where to find them, cautions against claiming causation, and still plans hierarchy and layout with placeholders."}
