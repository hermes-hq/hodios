schema: 1
baseline: "Plan signage for {{space}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-day-conference
    vars:
      space: "Two-day conference in a university building: main entrance on the ground floor, registration in the atrium, two lecture halls (ground and first floor), six breakout rooms on the second floor, lunch in the cafeteria across a courtyard, one lift at the back, toilets on each floor. Last year people got lost finding breakout rooms and the lift."
      audience: "800 attendees, many international, some wheelchair users"
    assert:
      - {type: contains, value: "## Sign schedule"}
      - {type: llm-rubric, value: "Identifies key journeys including to breakout rooms, the lift and the cafeteria across the courtyard, places signs at decision points such as the atrium, stair landings and lift lobby, defines a small temporary sign family, gives a sign schedule table, uses consistent room names matching the programme, marks the step-free route at every decision point, uses widely recognised symbols with text for international visitors, and recommends walking the routes with mock-ups."}
  - name: edge-no-audience-small-office
    vars:
      space: "Small office floor with reception, 4 meeting rooms named after rivers, kitchen and toilets. Clients often wander into the kitchen."
      audience: ""
    assert:
      - {type: llm-rubric, value: "Plans for first-time visitors by default, keeps the sign family minimal, addresses the kitchen problem with directional and identification signs, and suggests showing meeting room names consistently in calendar invites."}
  - name: negative-missing-layout
    vars:
      space: "Our hospital."
      audience: "patients"
    assert:
      - {type: llm-rubric, value: "Asks for entrances, key destinations or a floor plan description before planning, rather than inventing departments and routes."}
