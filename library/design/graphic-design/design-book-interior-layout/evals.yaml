schema: 1
baseline: "Design the interior layout for my {{genre}} book, {{trim_size}}, {{formats}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-novel-both-formats
    vars:
      genre: "literary novel"
      formats: "Both: print-on-demand paperback and a reflowable ebook. About 85,000 words."
      trim_size: "5.5x8.5in"
    assert:
      - {type: contains, value: "Front and back matter"}
      - {type: llm-rubric, value: "Gives margins with a larger gutter in inches and millimetres, a text serif body at a suitable size and leading with real alternatives and licence notes, chapters opening on recto with a defined opening style, scene break handling, conventional front matter order, widow, orphan and hyphenation rules, a reflowable ebook mapping without running heads, an estimate of characters per line and page count, and a note to check the printer's guide."}
  - name: edge-technical-guide
    vars:
      genre: "technical guide with code samples, tables and diagrams"
      formats: "print (offset, 400 pages) and ebook"
      trim_size: "7x9.25in"
    assert:
      - {type: llm-rubric, value: "Adapts to a scannable reference layout with a monospaced code style and rules for long lines, table and figure styles with captions, a deeper heading hierarchy, an index in back matter, a gutter suited to 400 pages, and accessible tables and alt text in the ebook."}
  - name: negative-unclear-format
    vars:
      genre: "poetry collection"
      formats: "not sure yet"
      trim_size: "6x9in"
    assert:
      - {type: llm-rubric, value: "Asks whether the book will be print, ebook or both (and explains briefly why poetry line breaks make the choice matter), and stops before producing a full specification."}
