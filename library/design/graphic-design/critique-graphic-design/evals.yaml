schema: 1
baseline: "What do you think of this design? {{design}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-concert-poster
    vars:
      purpose: "A2 street poster for a jazz night; people walking past should get what, when and where."
      design: |
        A2 portrait. Full-bleed photo of a saxophone, dark. Band name "The Blue Hour" in a thin script font at 40pt, centred, dark blue on the dark photo.
        Date, venue and ticket URL in 10pt light grey sans at the bottom edge, 3 mm from the trim. Five sponsor logos across the middle, each as large as the band name. Image is a 72 ppi web download.
    assert:
      - {type: contains, value: "## Production checks"}
      - {type: llm-rubric, value: "Flags as must fix: band name and details unreadable at distance (thin script, low contrast on dark photo, 10pt info), sponsor logos competing with the main message, text too close to the trim (safe margin) and a 72 ppi image far below print resolution. Gives concrete changes and separates taste from function."}
  - name: edge-social-thumbnail
    vars:
      purpose: "Instagram feed post announcing a 30% off weekend sale."
      design: "1080x1080. Paragraph of 60 words in 24px text across the image; '30% off' appears in the last line. Brand logo large in the top-left."
    assert:
      - {type: llm-rubric, value: "Notes that the offer is buried and the copy is too long to read in a scroll, recommends making '30% off' the dominant element and cutting copy, and mentions checking legibility on a phone and in the profile grid crop."}
