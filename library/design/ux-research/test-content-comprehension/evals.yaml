schema: 1
baseline: "How can I test whether users understand this content: {{content}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cancellation-policy
    vars:
      content: "Subscription cancellation policy for a gym chain. Must understand: free cancellation within 14 days; after that one month's notice; freeze option for injury."
      readers: "Members reading on a phone at the front desk; many read English as a second language."
    assert:
      - {type: contains-all, value: ["## Tasks and questions", "## Scoring"]}
      - {type: llm-rubric, value: "Uses scenario questions that require applying the policy (for example a member who joined 20 days ago), a paraphrase or highlighter technique, tests on phones with second-language readers, scores with a rubric, and never uses self-rated clarity as the measure."}
  - name: edge-medication-leaflet
    vars:
      content: "Patient leaflet for a new inhaler; must know dose, when to rinse mouth, and when to seek help."
      readers: ""
    assert:
      - {type: llm-rubric, value: "Covers the safety-critical message about seeking help with a scenario question, and notes that changes to medical wording need sign-off from the responsible clinical or regulatory expert."}
  - name: negative-self-report
    vars:
      content: "Our terms page. We just want to ask 200 users 'Is this page clear? Yes/No' and report the percentage."
      readers: ""
    assert:
      - {type: llm-rubric, value: "Pushes back that a yes/no clarity question overstates understanding and proposes a performance-based measure instead."}
