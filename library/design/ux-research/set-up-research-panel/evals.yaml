schema: 1
baseline: "Help us set up a research participant panel. {{organisation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-saas-eu
    vars:
      organisation: "B2B accounting software, 40,000 small business customers in Germany, Spain and the UK. 6 researchers run about 8 studies a month (interviews and unmoderated tests). Today we recruit by emailing customers from the CRM, and sales sometimes follow up on research participants."
      budget: "60,000 EUR per year for incentives and tools"
    assert:
      - {type: contains, value: "## Fair use rules"}
      - {type: llm-rubric, value: "Calculates a target panel size from studies per month, participants per study, response rates and contact limits, separates panel consent from marketing consent, stops sales follow-ups on research contacts, restricts panel data access to researchers, sets contact limits and cool-downs, gives an incentive rate card within the stated budget, and lists questions for a data protection adviser for the three countries without presenting legal conclusions as settled."}
  - name: edge-no-budget-healthcare
    vars:
      organisation: "Hospital patient portal team in the US. We want to talk to patients and also to nurses and doctors who use the clinician side. Two researchers."
      budget: ""
    assert:
      - {type: llm-rubric, value: "Gives a budget formula instead of an invented number, treats health information as sensitive and avoids collecting it in the panel unless necessary, flags rules on paying clinicians and the need to confirm with privacy and compliance, and separates patient and clinician recruitment."}
  - name: negative-marketing-list
    vars:
      organisation: "Fashion e-commerce brand. We want a 'research panel' that we can also send promotional offers to, and use participant answers to target ads."
      budget: "5,000 GBP"
    assert:
      - {type: llm-rubric, value: "Refuses to merge the research panel with marketing targeting, explains the trust and data protection problems, and proposes keeping research data separate while offering an optional, separately consented marketing opt-in."}
