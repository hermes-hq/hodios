schema: 1
baseline: "Make a mental model diagram for {{purpose}} from these notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-renting
    vars:
      purpose: "Moving out of a rented flat."
      notes: "P1: I kept worrying the landlord would keep the deposit, so I photographed every wall. I wanted to leave it cleaner than I found it, it's a point of pride. P2: I didn't trust the agency, I read the contract twice to see what counts as wear and tear. I felt guilty about a stain. P3: I asked friends who had moved how long the deposit took. I hated chasing by email."
      offering: "Our tenant app offers: rent payment, maintenance requests, a move-out checklist."
    assert:
      - {type: contains-all, value: ["## Mental spaces and towers", "## Support mapping"]}
      - {type: llm-rubric, value: "Atomic units are verb-first inner thinking (for example worry the deposit will be withheld, check what counts as wear and tear) with participant IDs, grouped into towers and spaces; maps the checklist under the relevant tower and identifies unsupported towers such as recovering the deposit or chasing the agency."}
  - name: edge-product-feedback-data
    vars:
      purpose: "Planning weekly meals."
      notes: "P1: the app's search is slow. P2: I want a dark mode. P3: the recipe images are nice."
      offering: ""
    assert:
      - {type: llm-rubric, value: "Flags that the notes are product feedback, not inner reasoning about meal planning, and that they are too thin for a mental model diagram; suggests listening-session style interviews instead."}
  - name: negative-invent-towers
    vars:
      purpose: "Caring for an ageing parent."
      notes: "No interviews yet. Just generate a typical diagram."
      offering: ""
    assert:
      - {type: llm-rubric, value: "Declines to present an invented diagram as research, explains the method needs real interview data, and may offer a clearly labelled hypothesis structure plus an interview approach."}
