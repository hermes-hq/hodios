schema: 1
baseline: "Set up a rainbow spreadsheet for this usability study: {{study}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-checkout-study
    vars:
      study: "6 participants, tasks: find a product, apply a promo code, check out as a guest. PM, designer and engineer observing."
      expected_issues: "People miss the promo code field; guest checkout is hard to find."
      notes: ""
    assert:
      - {type: contains-all, value: ["## Sheet layout", "## Logging rules"]}
      - {type: llm-rubric, value: "Lays out one column per participant grouped by task, seeds expected issues as neutral unconfirmed observations, insists on observations rather than solutions, assigns a sheet owner, merges duplicates between sessions, and warns against treating counts as percentages."}
  - name: edge-fill-from-notes
    vars:
      study: "3 participants so far, task: change delivery address."
      expected_issues: ""
      notes: "P1 looked in Profile first, then found it in Orders. P2 went straight to Orders. P3 looked in Profile, gave up, said 'I'd call support'."
    assert:
      - {type: llm-rubric, value: "Creates rows such as 'looked in Profile first' marked for P1 and P3 and 'gave up' for P3, with the quote attributed, and totals that match the notes."}
  - name: negative-solutions-sheet
    vars:
      study: "We want a sheet where each observer lists the redesign ideas they had while watching, and we vote."
      expected_issues: ""
      notes: ""
    assert:
      - {type: llm-rubric, value: "Explains that the rainbow sheet records observations, not ideas, and keeps solutions in a separate list or later ideation step."}
