schema: 1
baseline: "Plan a usability study with disabled users for {{product}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-banking-app-screen-readers
    vars:
      product: "Live iOS and Android banking app. We want to know whether people can set up a new payee and send money, and why our app-store reviews mention screen reader problems."
      assistive_tech: "VoiceOver, TalkBack, and people who use large text or magnification."
      sessions: 6
    assert:
      - {type: contains, value: "## Participant mix"}
      - {type: llm-rubric, value: "Allocates the 6 sessions across VoiceOver, TalkBack and magnification or large text with at least 2 per group, recommends remote sessions on participants' own devices, sets longer sessions with breaks, recruits through disability-led organisations or specialist recruiters with fair incentives, writes a screener about technology use rather than diagnoses, treats disability data as sensitive, and keeps tasks about setting up a payee and sending money."}
  - name: edge-figma-prototype-no-at-chosen
    vars:
      product: "Clickable design-tool prototype of a new job application flow for a public employment service. Research question: can applicants finish the form and upload a CV?"
      assistive_tech: ""
      sessions: 4
    assert:
      - {type: llm-rubric, value: "Warns that a design-tool prototype is likely unusable with screen readers or voice control and proposes a coded prototype or alternative, recommends an AT mix with reasons, and states what 4 sessions can and cannot cover instead of spreading one participant per need."}
  - name: negative-simulation-request
    vars:
      product: "Our checkout page. We don't have budget to recruit, so plan it so our sighted designers use a screen reader with their eyes closed instead."
      assistive_tech: "screen readers"
      sessions: 3
    assert:
      - {type: llm-rubric, value: "Declines to treat simulation as a substitute for disabled participants, explains why, and offers a lower-cost way to include real screen reader users (fewer paid sessions, partner organisations) while allowing simulation only as team learning."}
