schema: 1
baseline: "Plan a first-click test for these screens: {{screens}} and these tasks: {{tasks}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retail-account-page
    vars:
      screens: "Mobile account page (static image) with: Orders, Returns, Addresses, Payment methods, Help, a promo banner at the top, and a new 'My stuff' icon tab in the bottom bar. Variant B replaces 'My stuff' with 'Account'."
      tasks: "Start a return, change the delivery address of an order already placed, remove a saved card, find out when a refund will arrive."
    assert:
      - {type: contains, value: "## Tasks"}
      - {type: llm-rubric, value: "Writes goal-based tasks that avoid the words return, address, card and refund where they are labels, defines correct click areas in advance including more than one where reasonable (address change could be Orders or Addresses), uses a between-subjects comparison of My stuff vs Account, recommends about 30 to 50 per variant, and analyses first-click success with confidence intervals and pre-agreed decision rules."}
  - name: edge-vague-screens
    vars:
      screens: "Our homepage"
      tasks: "Find pricing and contact sales"
    assert:
      - {type: llm-rubric, value: "Asks for a description or element list of the homepage, marks correct click areas as pending, and still plans tasks, participants, setup and analysis."}
  - name: negative-label-tasks
    vars:
      screens: "Dashboard with sidebar: Reports, Integrations, Team, Billing."
      tasks: "Please make the tasks 'Click Billing' and 'Click Integrations' so it's quick."
    assert:
      - {type: llm-rubric, value: "Explains that tasks naming the label measure reading rather than findability, rewrites them as goal-based scenarios without the label words, and keeps the rest of the plan."}
