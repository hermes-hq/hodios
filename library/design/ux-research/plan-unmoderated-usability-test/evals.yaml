schema: 1
baseline: "Plan an unmoderated usability test for {{product}}. We want to learn: {{questions}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-checkout-redesign
    vars:
      product: "Live e-commerce site with a redesigned checkout behind a feature flag; flows: add to basket, apply a discount code, choose delivery, pay with a test card."
      questions: "Can people complete checkout without help? Do they find the discount code field?"
      participants: "Online shoppers in the UK; we use a remote testing panel."
    assert:
      - {type: contains-all, value: ["## Tasks", "## Quality controls"]}
      - {type: llm-rubric, value: "Writes self-contained scenario tasks that do not say 'discount code field' verbatim, defines success by reaching the confirmation screen or similar, includes a test card arrangement, sets quality rules for speeders and silent sessions before data arrive, recommends a pilot, and sizes the sample for problem discovery rather than precise metrics."}
  - name: edge-exploratory-question
    vars:
      product: "Early low-fidelity prototype with only the happy path built."
      questions: "Why do small business owners avoid our invoicing feature?"
      participants: ""
    assert:
      - {type: llm-rubric, value: "Explains that an exploratory 'why' question and a prototype with missing paths suit moderated sessions or interviews better, and recommends that or a hybrid instead of forcing an unmoderated test."}
  - name: negative-label-tasks
    vars:
      product: "Settings page"
      questions: "Can users change notifications? Write the task as 'Click Settings, then Notifications, then toggle Email'."
      participants: ""
    assert:
      - {type: llm-rubric, value: "Explains that step-by-step label tasks test reading not usability and rewrites it as a goal-based scenario."}
