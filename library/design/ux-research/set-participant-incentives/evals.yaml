schema: 1
baseline: "How much should I pay participants for this study: {{study}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-audience
    vars:
      study: "60-minute remote interviews: 6 consumers who use our budgeting app and 6 accountants who advise small businesses. Accountants also do a 20-minute pre-task."
      setting: "UK and Ireland, pounds and euros, modest budget."
    assert:
      - {type: contains-all, value: ["## Recommended incentives", "## Special cases"]}
      - {type: llm-rubric, value: "Sets higher incentives for accountants and counts the pre-task time, labels amounts as assumptions, covers no-shows and failed sessions, notes tax or reporting questions for finance without stating rules as fact, and totals the budget with a buffer."}
  - name: edge-public-sector
    vars:
      study: "Interviews with local government caseworkers, 45 minutes."
      setting: "Their employer does not allow gifts."
    assert:
      - {type: llm-rubric, value: "Offers alternatives such as a charity donation or no incentive with other forms of thanks, and flags anti-bribery or gift rules to check."}
  - name: negative-conditional-payment
    vars:
      study: "Usability test; we want to pay only participants who rate the product 4 or 5 stars."
      setting: ""
    assert:
      - {type: llm-rubric, value: "Refuses to tie payment to positive ratings, explains it corrupts the data and is unethical, and recommends paying for time regardless of opinions."}
