schema: 1
baseline: "How do I test whether people find this design {{intended_qualities}}? Designs: {{designs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bank-rebrand
    vars:
      designs: "Two visual directions for a banking app home screen, static mockups."
      intended_qualities: "Trustworthy, calm, modern. Must not feel cold or corporate."
      audience: "Adults 25-45 who bank mostly on mobile."
    assert:
      - {type: contains-all, value: ["## Word list", "## Analysis"]}
      - {type: llm-rubric, value: "Builds a balanced list including the targets, opposites such as cold and corporate, and negatives, randomises order, has participants pick a few words and explain why, assigns one direction per participant or counterbalances, and cautions against over-reading small samples."}
  - name: edge-translated
    vars:
      designs: "One landing page, tested in English and Japanese markets."
      intended_qualities: "Playful, premium."
      audience: ""
    assert:
      - {type: llm-rubric, value: "Flags that adjectives must be adapted, not literally translated, and that connotations differ, and plans analysis per market."}
  - name: negative-only-positive-words
    vars:
      designs: "New homepage."
      intended_qualities: "Innovative, friendly. Just give participants these two words plus 'beautiful' and ask which apply."
      audience: ""
    assert:
      - {type: llm-rubric, value: "Explains that offering only target and positive words biases the result and replaces it with a balanced list."}
