schema: 1
baseline: "Scope a UX research project for this: {{question}}. Constraints: {{limits}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-onboarding-decision
    vars:
      question: "Decide whether to rebuild our mobile banking onboarding or fix the current flow; drop-off at identity verification is 40%."
      limits: "Six weeks until planning. One researcher at 50%, one designer can help. Incentive budget is limited. We have a remote testing tool."
      audience: "New retail customers aged 18 to 65; we can email recent sign-ups."
    assert:
      - {type: contains-all, value: ["## Three options", "## Effort and cost breakdown", "## Timeline"]}
      - {type: llm-rubric, value: "Gives three distinct options each with what it cannot answer, counts recruiting, analysis and reporting time rather than only session hours, allows for no-shows, gives costs as ranges or placeholders rather than invented prices, and recommends one option with what would change it."}
  - name: edge-impossible-deadline
    vars:
      question: "Understand how hospital pharmacists reconcile medication lists, to inform a new feature."
      limits: "Readout needed in 8 working days. No existing contacts with pharmacists. No budget for agencies."
      audience: ""
    assert:
      - {type: llm-rubric, value: "Flags that recruiting a hard-to-reach professional audience in 8 days is unrealistic, says so plainly, and offers what can be done in the time (for example desk research, proxies, or a smaller first step) without pretending a full study fits."}
  - name: negative-vague-request
    vars:
      question: "We want some research on our app."
      limits: "Not sure yet."
      audience: ""
    assert:
      - {type: llm-rubric, value: "Does not produce an invented detailed budget; identifies that the decision and constraints are missing, asks for them or offers a tentative scope clearly labelled as assumption-based."}
