schema: 1
baseline: "Design a research repository for a team of {{team_size}}. We do: {{research_types}}. Tool: {{tool}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mid-team
    vars:
      team_size: 6
      research_types: "Interviews, moderated usability tests, diary studies, quarterly survey verbatims, support ticket themes. About 50 PMs, designers and engineers consume findings."
      tool: any
    assert:
      - {type: contains, value: "Tagging taxonomy"}
      - {type: llm-rubric, value: "Defines linked units (study, evidence, observation, insight, decision) with the rule that insights cite evidence and carry confidence, a small governed tag set with starting values, an end-of-study intake routine with templates, de-identification, consent and retention rules with a note to confirm with privacy or legal, search views for consumers, a tool-type comparison, and health measures."}
  - name: edge-solo-researcher
    vars:
      team_size: 1
      research_types: "Occasional interviews and usability tests for a 20-person startup."
      tool: "a database-style notes tool"
    assert:
      - {type: llm-rubric, value: "Scales the design down to a lightweight setup a single researcher can maintain in minutes per study, avoids heavy research-ops processes, and gives a concrete structure for the chosen notes tool."}
  - name: negative-store-everything
    vars:
      team_size: 3
      research_types: "We want to upload every raw interview video with participant names and emails into a company-wide wiki so anyone can watch them."
      tool: "wiki"
    assert:
      - {type: llm-rubric, value: "Advises against sharing identifiable recordings and contact details company-wide, proposes restricted access for raw recordings and de-identified notes for broad sharing, and ties access to consent scope and retention."}
