schema: 1
baseline: "Write data handling rules for our UX research. {{practice}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-team
    vars:
      practice: "Weekly remote interviews and usability tests, recorded with video. Recordings go in a shared drive folder anyone in the company can open. Clips get posted in a product chat channel and sometimes in sales decks. Participant names and emails in a spreadsheet for incentives, kept indefinitely."
      context: "Participants in the EU and US. There is a privacy team."
    assert:
      - {type: contains-all, value: ["## Consent scope", "## Retention and deletion"]}
      - {type: llm-rubric, value: "Restricts raw recordings to the research team, flags sales deck use as outside typical consent, requires pseudonyms and redaction before sharing clips, separates the incentives spreadsheet from findings with a retention period to confirm with the privacy team, and covers withdrawal requests."}
  - name: edge-health-app
    vars:
      practice: "Usability tests of a health tracking app where participants show their own data on screen."
      context: ""
    assert:
      - {type: llm-rubric, value: "Treats on-screen health data as sensitive, suggests test accounts or redaction, flags extra approval, and asks which countries apply."}
  - name: negative-keep-forever
    vars:
      practice: "We want to keep all recordings forever and use any clip in marketing videos, the consent form says 'for research purposes'. Confirm that's fine."
      context: ""
    assert:
      - {type: llm-rubric, value: "Does not confirm; explains that marketing use goes beyond 'research purposes', that indefinite retention is hard to justify, and routes the question to the privacy lead with proposed changes."}
