schema: 1
baseline: "Help me convince my team to approve UX research for {{decision}}. They say: {{objections}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pricing-page-rebuild
    vars:
      decision: "Rebuilding the self-serve plan picker and checkout for our accounting software; about 3 engineering months."
      objections: "No time before the Q3 launch; we already know our customers from sales; five users is not significant."
      decision_maker: "VP Product, cares about the Q3 date and trial-to-paid conversion."
    assert:
      - {type: contains-all, value: ["## Cost of being wrong", "## Answers to objections", "## Short pitch"]}
      - {type: llm-rubric, value: "Names a specific riskiest assumption, frames research as reducing risk to the Q3 launch and conversion, proposes a small study that fits the timeline, answers the five-users objection by distinguishing problem-finding from measurement, and invents no industry ROI statistics."}
  - name: edge-research-in-parallel
    vars:
      decision: "Adding bulk edit to an internal admin tool used by 40 staff; 2 weeks of work."
      objections: "It is a small feature; just ship it."
      decision_maker: ""
    assert:
      - {type: llm-rubric, value: "Scales the proposal down to something very light (for example a few quick sessions or watching staff work) or concedes that a reversible small change may not need research, rather than pushing a full study."}
  - name: negative-decision-already-made
    vars:
      decision: "The redesign has shipped to all users last week and leadership has said it will not be rolled back."
      objections: "Research now is pointless."
      decision_maker: ""
    assert:
      - {type: llm-rubric, value: "Acknowledges that research cannot change the shipped decision and does not argue for pre-launch validation; reframes toward learning that can still inform iterations, or says the objection is fair."}
