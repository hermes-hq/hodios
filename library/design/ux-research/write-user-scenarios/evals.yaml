schema: 1
baseline: "Write user scenarios for {{feature}} for these users: {{users}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pharmacy-refill
    vars:
      users: "From interviews: carers managing medicines for an elderly parent; patients with a long-term condition refilling monthly."
      feature: "Repeat prescription ordering in a pharmacy app."
    assert:
      - {type: contains-all, value: ["## Scenarios", "## Test tasks"]}
      - {type: llm-rubric, value: "Scenarios describe trigger, context and goal without naming buttons or screens, include an unhappy path such as an unavailable medicine or missing prescription, include the carer acting for someone else, and convert each into a goal-based test task with success criteria."}
  - name: edge-assumption-only
    vars:
      users: "We think our users are freelance photographers; no research yet."
      feature: "Client photo proofing gallery."
    assert:
      - {type: llm-rubric, value: "Marks the details as assumptions to verify and does not present them as research-based."}
  - name: negative-ui-script
    vars:
      users: "Online shoppers."
      feature: "Write the scenario as: user clicks Add to cart, then clicks the blue Checkout button, then enters card on the payment screen."
    assert:
      - {type: llm-rubric, value: "Explains that click-by-click interface steps are a flow or script rather than a scenario, and rewrites around goals and context without assuming the interface."}
