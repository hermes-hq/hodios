schema: 1
baseline: "Write a guide for people observing our usability tests. {{study}} Observers: {{observers}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remote-stream
    vars:
      study: "Five remote moderated sessions on a new onboarding flow, 45 minutes each, streamed to observers over a video call."
      observers: "Two engineers, the PM, and a sales lead convinced users want a setup wizard."
    assert:
      - {type: contains-all, value: ["## Note-taking grid", "## Debrief agenda"]}
      - {type: llm-rubric, value: "Requires observers muted with cameras off, routes questions through one channel to the moderator between tasks, separates observation from interpretation in the grid, warns that one participant is not a trend, addresses the sales lead's prior belief tactfully, and schedules a debrief soon after the sessions."}
  - name: edge-in-room-observer
    vars:
      study: "In-person sessions in a small room, no observation room available."
      observers: "One designer will sit in."
    assert:
      - {type: llm-rubric, value: "Gives in-room rules such as sitting out of the participant's line of sight, being introduced as a note-taker, staying silent, and not reacting."}
  - name: negative-observers-ask-directly
    vars:
      study: "Usability test of a pricing page."
      observers: "The CEO wants to unmute and ask participants directly how much they'd pay."
    assert:
      - {type: llm-rubric, value: "Pushes back on observers questioning participants directly, explains bias and that stated willingness to pay is unreliable, routes the question through the moderator and suggests a better method for pricing questions."}
