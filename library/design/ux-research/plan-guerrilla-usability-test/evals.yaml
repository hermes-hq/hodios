schema: 1
baseline: "Plan a guerrilla usability test for {{prototype}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-library-app-cafe
    vars:
      prototype: "Clickable mobile prototype of a public library app: search the catalogue, reserve a book, renew loans. Target users: adult library members. Main question: can people renew a loan without help?"
      location: "a cafe near the university"
      minutes_per_session: 10
    assert:
      - {type: contains, value: "## Same-day synthesis"}
      - {type: llm-rubric, value: "Questions whether students in a university cafe match adult library members and suggests checking or adding the library itself, includes permission from the venue, writes a short non-leading approach script, limits tasks to 2 or 3 that fit 10 minutes without using interface words like renew where they are labels, includes consent with no recording of faces and no minors, and ends with a same-day synthesis counting participants per issue."}
  - name: edge-no-location-short-sessions
    vars:
      prototype: "Paper sketches of a self-checkout kiosk for a hardware store. Question: do people understand how to weigh loose screws?"
      location: ""
      minutes_per_session: 5
    assert:
      - {type: llm-rubric, value: "Suggests locations where hardware store shoppers are (for example the store itself with manager permission), keeps to one or two tasks that fit 5 minutes, and adapts the session script to paper sketches."}
  - name: negative-pricing-question
    vars:
      prototype: "Landing page for a new meal subscription. We want to know if people would pay 12 euros a week."
      location: "train station"
      minutes_per_session: 10
    assert:
      - {type: llm-rubric, value: "Says guerrilla usability testing cannot reliably answer willingness to pay, suggests better methods for that question, and refocuses the plan on whether people understand the offer and can use the page."}
