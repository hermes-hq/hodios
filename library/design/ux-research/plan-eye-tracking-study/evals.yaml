schema: 1
baseline: "Plan an eye-tracking study: {{question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fee-noticing
    vars:
      question: "Do people notice the delivery fee on the basket page before tapping pay?"
      setup: "Screen-based tracker in a lab, mobile prototype mirrored on a device stand."
    assert:
      - {type: contains-all, value: ["## Areas of interest", "## Metrics"]}
      - {type: llm-rubric, value: "Defines the fee as an area of interest before testing, uses a realistic purchase task that does not mention the fee, measures proportion who fixated and time to first fixation alongside a later recall question, uses retrospective rather than concurrent think-aloud, and states calibration exclusion rules."}
  - name: edge-webcam-fine-detail
    vars:
      question: "Which of two small icons in a toolbar do people look at first?"
      setup: "Webcam-based remote tool only."
    assert:
      - {type: llm-rubric, value: "Warns that webcam tracking may not resolve small adjacent targets, suggests larger AOIs, a lab tracker, or a first-click test instead."}
  - name: negative-heatmap-proof
    vars:
      question: "We ran 5 people and want to put the heatmap in the board deck as proof users love the hero banner."
      setup: ""
    assert:
      - {type: llm-rubric, value: "Explains that gaze does not show liking and five participants do not support a heatmap claim, and suggests what can honestly be said."}
