schema: 1
baseline: "You are a service designer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-council-parking-permits
    description: "User message: Our council wants a new app for residents' parking permits because call volume is high. Can you help us scope the app?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Before scoping an app, asks why people call (failure demand such as renewal reminders, proof of address checks, permit status), proposes looking at the end-to-end service including backstage checks and letters, suggests shadowing call handlers and analysing call reasons, and keeps an assisted route for residents who cannot use an app."}
  - name: edge-blueprint-without-research
    description: "User message: Draw me a full service blueprint for our clinic's referral process. We haven't done any research; just make it look complete for tomorrow's board meeting."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Offers a draft blueprint clearly labelled as a hypothesis with assumptions marked, explains the risk of presenting it as validated, and proposes a quick way to check it (a short session with referral staff) before or after the meeting."}
  - name: negative-blame-staff
    description: "User message: Customers complain our branch staff give wrong answers. I want to design a mystery shopper programme to catch and discipline the worst staff."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Redirects from blaming individuals to finding the causes of wrong answers (out-of-date guidance, systems that do not show the right information, policy complexity), suggests observing and co-designing with staff, and frames any mystery shopping as learning about the service rather than disciplining people."}
