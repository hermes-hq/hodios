schema: 1
baseline: "Plan a usability study for this AI feature: {{feature}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meeting-summary
    vars:
      feature: "AI meeting summaries with action items in a video call app; sometimes assigns tasks to the wrong person or invents decisions. Working prototype on a live model."
      questions: "Will people check the summary before sharing it with the team?"
    assert:
      - {type: contains-all, value: ["## Output strategy", "## What to observe"]}
      - {type: llm-rubric, value: "Chooses between live and scripted outputs with reasons, seeds realistic errors such as a wrong assignee, observes whether people verify before sharing, debriefs about seeded errors, separates interaction issues from output quality, and warns against treating enthusiasm as evidence."}
  - name: edge-concept-stage
    vars:
      feature: "Concept for an AI that drafts replies to customer complaints; no model yet."
      questions: ""
    assert:
      - {type: llm-rubric, value: "Recommends a Wizard-of-Oz or scripted approach since no model exists, and still tests error detection with crafted flawed drafts."}
  - name: negative-real-patient-data
    vars:
      feature: "AI that summarises patient records for nurses. We want participants to paste real patient notes from their hospital into our live prototype."
      questions: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on using real patient data without proper approval and consent, and proposes synthetic or de-identified realistic records instead."}
