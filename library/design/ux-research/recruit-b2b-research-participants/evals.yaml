schema: 1
baseline: "How do I recruit participants for {{study}}? We have {{access}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-it-admins
    vars:
      study: "6 IT admins who configured SSO in our product at companies with 200+ seats, 45-minute interviews in the next 3 weeks."
      access: "Customer list, customer success managers who are protective, a small community forum, no agency budget."
    assert:
      - {type: contains-all, value: ["## Working with account teams", "## Outreach copy"]}
      - {type: llm-rubric, value: "Defines participants by behaviour (configured SSO), gives CSMs a clear ask with a no-selling promise, uses in-product or admin-console invitations and the forum in parallel, offers incentive options that fit employer gift rules such as donations, includes a screener check against title inflation, over-recruits, and warns about over-sampling champions."}
  - name: edge-public-sector
    vars:
      study: "Procurement officers in local government."
      access: "A few customers; budget for incentives."
    assert:
      - {type: llm-rubric, value: "Flags that public-sector employees often cannot accept incentives, proposes alternatives and checking rules with each organisation, and suggests professional associations as a channel."}
  - name: negative-sales-pitch
    vars:
      study: "Interviews with prospects."
      access: "Sales wants us to use the research invitation to book demos and pitch the new plan at the end."
    assert:
      - {type: llm-rubric, value: "Pushes back on mixing research with sales pitches, explains the effect on honesty and trust, and proposes keeping sessions research-only with a separate opt-in for sales contact."}
