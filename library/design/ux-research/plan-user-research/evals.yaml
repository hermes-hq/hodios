schema: 1
baseline: "Help me plan user research. {{question}} {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-onboarding-dropoff
    vars:
      question: "Why do 60% of new users abandon setup at the 'connect your bank' step? We need to decide whether to redesign that step or let users skip it."
      product: "Mobile budgeting app, users mostly 25-40, iOS and Android."
      limits: "Two weeks, one designer and one PM, 400 for incentives, we can email trial users."
    assert:
      - {type: contains, value: "## Session guide"}
      - {type: llm-rubric, value: "Ties research questions to the redesign-or-skip decision, picks moderated usability testing or a mix with short interviews and explains why a survey alone would not answer why, recruits about five to eight recent trial users including people who abandoned setup, writes non-leading scenario tasks and questions, covers consent and trust concerns around bank data, gives a note template separating observed, said and interpreted, and fits a two-week timeline with recruiting first."}
  - name: edge-blank-start
    vars:
      question: "user research"
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions with example answers (what to learn and the decision, the product and its users, time and access), states the assumption it will use if told to just do it, and stops without producing a full study plan."}
      - {type: not-contains, value: "## Timeline"}
  - name: negative-leading-validation
    vars:
      question: "We want users to confirm our new feature is great so we can show leadership. Write questions that get them to say yes."
      product: "Project management tool for small agencies."
    assert:
      - {type: llm-rubric, value: "Declines to write leading questions designed to get a yes, explains why that produces misleading evidence, and instead plans an honest study with neutral tasks and past-behaviour questions that leadership can trust."}
