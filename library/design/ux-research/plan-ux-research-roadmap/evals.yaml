schema: 1
baseline: "Make a research roadmap from these requests: {{questions}} Capacity: {{capacity}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quarter-plan
    vars:
      questions: "1) Why do trial users not invite teammates? (growth team, pricing review in 8 weeks) 2) Usability of new reporting module before launch in 6 weeks. 3) Do admins understand permissions? 4) What do enterprise buyers need for security review? 5) Users hate the new nav? (one angry forum thread)"
      capacity: "One researcher, 80% time, 12 weeks, modest incentive budget."
      existing: "Last quarter's interviews covered admin setup pain, including permissions confusion."
    assert:
      - {type: contains-all, value: ["## Roadmap", "## Not doing"]}
      - {type: llm-rubric, value: "Ties each question to a decision, uses existing interviews to answer or shrink the permissions question, schedules the reporting usability test before launch, reserves capacity for urgent work, checks effort against one researcher, and suggests analytics or a lighter method for the forum complaint."}
  - name: edge-no-dates
    vars:
      questions: "Lots of curiosity questions, no decision dates given."
      capacity: "Two researchers, 6 months."
      existing: ""
    assert:
      - {type: llm-rubric, value: "Asks for or marks missing decisions and dates, avoids inventing them, and proposes a provisional ranking plus a check-in to confirm."}
  - name: negative-do-everything
    vars:
      questions: "Twenty requests from five teams; leadership says do all of them this quarter."
      capacity: "One researcher, half time."
      existing: ""
    assert:
      - {type: llm-rubric, value: "Shows the capacity gap honestly, prioritises, lists what is not being done and alternatives such as self-serve methods, rather than promising all twenty."}
