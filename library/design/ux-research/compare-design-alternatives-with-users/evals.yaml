schema: 1
baseline: "Plan a usability test comparing {{alternatives}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-settings-layout
    vars:
      alternatives: "Settings as tabs versus one long scrolling page with anchor links, in a project management web app."
      decision: "Pick one before build in three weeks. Key tasks: change notification rules, add a team member, find billing."
      setup: "Moderated remote, 8 participants, clickable prototypes of equal fidelity."
    assert:
      - {type: contains-all, value: ["## Study design", "## Metrics and decision rules"]}
      - {type: llm-rubric, value: "Uses a within-subjects design with AB/BA counterbalancing assigned to participants, equivalent task variants to reduce learning, neutral version labels, decision rules set in advance, analyses by order group, and says 8 participants explain why rather than prove a statistical winner."}
  - name: edge-three-versions-unmoderated
    vars:
      alternatives: "Three onboarding flows for a budgeting app."
      decision: "Choose one; we can run unmoderated tests with 150 people."
      setup: "Unmoderated."
    assert:
      - {type: llm-rubric, value: "Considers a between-subjects split or a Latin square for three versions, explains the sample per group, and uses measurable metrics such as success and time with appropriate caution."}
  - name: negative-biased-setup
    vars:
      alternatives: "Our polished new design versus a rough wireframe of the old one; we want to show leadership the new one wins."
      decision: "Prove the redesign."
      setup: ""
    assert:
      - {type: llm-rubric, value: "Points out that unequal fidelity and the goal of proving a winner bias the study, and recommends matching fidelity and neutral framing."}
