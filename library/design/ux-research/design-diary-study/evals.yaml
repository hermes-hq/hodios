schema: 1
baseline: "Design a {{duration_days}}-day diary study to answer: {{research_questions}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meal-planning
    vars:
      duration_days: 14
      research_questions: "How do working parents decide what to cook on weeknights, when do plans break down, and what do they do instead? Participants: parents of children under 12 in the UK, both working. We sell a meal-planning app."
    assert:
      - {type: contains, value: "## Prompts schedule"}
      - {type: llm-rubric, value: "Chooses a mix of event-contingent logging (when deciding or cooking) and a short daily prompt, writes full neutral past-behaviour prompts each under about 5 minutes with rotating deeper prompts, plans onboarding and final reflection entries, staged incentives, reminders and researcher check-ins, over-recruitment for drop-out, photo consent that avoids capturing children, and an analysis plan with per-participant timelines."}
  - name: edge-duration-mismatch
    vars:
      duration_days: 5
      research_questions: "How do small landlords handle the monthly rent collection cycle and late payments?"
    assert:
      - {type: llm-rubric, value: "Flags that 5 days is unlikely to capture a monthly cycle and recommends a longer study or a different design (for example an event-triggered study timed around rent day, or interviews), and does not ask participants to share tenants' personal data."}
  - name: negative-vague
    vars:
      duration_days: 10
      research_questions: "Understand our users."
    assert:
      - {type: llm-rubric, value: "Does not produce a full study with invented focus; asks a few specific questions about the behaviour to study, the participants and the decision the research informs."}
