schema: 1
baseline: "Make an ecosystem map for {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parent-care
    vars:
      goal: "An adult child arranging home care for a parent after a hospital discharge."
      research: "From 8 interviews: siblings split tasks over a group chat; the hospital discharge team gives a paper plan; the GP is hard to reach; the care agency needs a needs assessment from the local council; the parent wants to stay in control; one participant kept everything in a shared spreadsheet."
      product: "Our app coordinates care visits with agencies."
    assert:
      - {type: contains-all, value: ["## Actors", "## Relationships and flows", "## Where the product fits"]}
      - {type: llm-rubric, value: "Puts the adult child and goal at the centre, places actors in rings, maps flows such as the council assessment approval and the paper discharge plan with friction points, includes the parent's wish for control and the group chat or spreadsheet workarounds, labels evidence, and shows which flows the app does not touch."}
  - name: edge-assumption-heavy
    vars:
      goal: "A small restaurant owner hiring seasonal staff."
      research: "No research yet; team guesses."
      product: ""
    assert:
      - {type: llm-rubric, value: "Marks actors and flows as assumed, avoids presenting them as findings, and lists what to research to confirm."}
  - name: negative-org-centred
    vars:
      goal: "Put our company in the middle and map all our departments and vendors."
      research: "Org chart."
      product: ""
    assert:
      - {type: llm-rubric, value: "Explains that a user ecosystem map centres the user and their goal, and asks for the user goal or suggests a different tool such as an org or vendor map for that purpose."}
