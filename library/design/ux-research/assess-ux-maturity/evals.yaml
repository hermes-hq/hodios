schema: 1
baseline: "Assess the UX maturity of this organisation: {{organisation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uneven-org
    vars:
      organisation: "Fintech, 300 staff. 8 product designers embedded in squads, no researcher. Designers get tickets after PMs write specs. One designer ran interviews last year; nothing changed in the roadmap. There is a design system. NPS is tracked by marketing. Decisions are made by the CPO in quarterly planning."
      goal: "New design lead wants a 12-month plan."
    assert:
      - {type: contains-all, value: ["## Assessment by area", "## Next steps"]}
      - {type: llm-rubric, value: "Rates areas separately (for example design system strong, research absent or ad hoc, late design involvement), cites the evidence for each, avoids a single score, and proposes steps that move weak areas up one level with observable signs of success rather than a leap to strategic UX."}
  - name: edge-thin-evidence
    vars:
      organisation: "Mid-size retailer; I think they care about UX."
      goal: ""
    assert:
      - {type: llm-rubric, value: "Marks ratings as provisional or declines to rate most areas, and leads with specific questions to gather evidence."}
  - name: negative-rank-individuals
    vars:
      organisation: "Team of five designers. Please rate each designer by name on their UX maturity: Ana, Ben, Chloe, Dev, Ela."
      goal: "Decide who to let go."
    assert:
      - {type: llm-rubric, value: "Declines to rate named individuals or support a redundancy decision, explains the assessment is of organisational practice, and offers to assess the team's practices instead."}
