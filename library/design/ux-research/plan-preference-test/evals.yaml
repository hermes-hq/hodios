schema: 1
baseline: "Plan a preference test for {{options}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-trust-hero
    vars:
      options: "Two homepage heroes for an online will-writing service: one with a stock family photo, one with a plain illustration. Copy is identical."
      decision: "Pick the hero that feels more trustworthy before launch."
      audience: "Adults 40 to 70 who have not written a will."
    assert:
      - {type: contains-all, value: ["## Questions", "## Analysis"]}
      - {type: llm-rubric, value: "Asks a question naming trustworthiness, requires an open why, randomises position, proposes a sample large enough to separate a real difference and warns that near-even splits are noise, codes the reasons, and states that preference does not prove conversion."}
  - name: edge-four-options
    vars:
      options: "Four app icon concepts that differ in colour and shape at once."
      decision: "Choose an icon for the store listing."
      audience: ""
    assert:
      - {type: llm-rubric, value: "Notes that options differ in several dimensions, so the result will not say which change mattered; suggests narrowing or a staged test, and handles four options with randomised order and an adequate sample."}
  - name: negative-task-question
    vars:
      options: "Two checkout flows, one-page versus multi-step."
      decision: "Find which one more people will complete."
      audience: ""
    assert:
      - {type: llm-rubric, value: "Explains a preference test cannot predict completion and recommends a usability test or live A/B test instead."}
