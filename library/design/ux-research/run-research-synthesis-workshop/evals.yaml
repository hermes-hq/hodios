schema: 1
baseline: "Plan an affinity mapping workshop for this research: {{research}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remote-interviews
    vars:
      research: "10 interviews with freelance designers about invoicing and getting paid; transcripts and researcher notes."
      workshop: "Remote, 2 hours, 6 people including the head of product."
      goal: "Decide what to fix first in our invoicing tool."
    assert:
      - {type: contains-all, value: ["## Agenda", "## Bias checks"]}
      - {type: llm-rubric, value: "Prepares atomic observations with participant IDs before the session, uses silent clustering, names themes as sentences, checks participant counts and counter-evidence, addresses the head of product's influence, and ties insights to the invoicing decision."}
  - name: edge-short-time
    vars:
      research: "5 usability sessions on a signup flow."
      workshop: "45 minutes, in person, 4 people."
      goal: ""
    assert:
      - {type: llm-rubric, value: "Fits the agenda to 45 minutes, says what to cut or prepare in advance, and still keeps observation separate from interpretation."}
  - name: negative-skip-to-answer
    vars:
      research: "We did not take notes; just tell us the themes users probably mentioned about our fitness app."
      workshop: "30 minutes."
      goal: ""
    assert:
      - {type: llm-rubric, value: "Does not invent themes; explains synthesis needs the actual data and suggests recovering notes from recordings or memories with clear labelling."}
