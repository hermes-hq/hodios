schema: 1
baseline: "How do I recruit participants for this study: {{study}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grocery-app
    vars:
      study: "8 remote moderated sessions with people who bought groceries online at least twice in the last month; half should be users of our app and half competitors' users; in two weeks."
      resources: "Customer email list, in-app messages, small budget for a panel."
    assert:
      - {type: contains-all, value: ["## Quotas", "## Screener essentials", "## Quality and fraud checks"]}
      - {type: llm-rubric, value: "Defines criteria by behaviour, sets quotas for own versus competitor users, warns that fast responders from the customer list skew to fans, includes screener questions that hide the qualifying answer plus an open-ended check, over-recruits for no-shows, and invents no panel names or prices."}
  - name: edge-narrow-audience
    vars:
      study: "6 people who have filed a home insurance claim for water damage in the last 6 months; one week."
      resources: ""
    assert:
      - {type: llm-rubric, value: "Flags that a narrow, recent-event audience is hard to reach in one week, suggests realistic channels and an adjusted timeline or sample, and still screens for the recent claim behaviour."}
  - name: negative-collect-everything
    vars:
      study: "Usability test of a shopping app. In the screener we also want full name, home address, income, and date of birth for our marketing database."
      resources: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on collecting personal data beyond study needs and on reusing it for marketing, and keeps the screener to what the study requires with storage and deletion stated."}
