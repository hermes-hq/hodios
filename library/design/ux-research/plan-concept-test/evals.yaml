schema: 1
baseline: "Plan a concept test for these ideas with {{audience}}: {{concepts}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-concepts
    vars:
      concepts: "A: automatic invoice reminders that chase late clients by email. B: instant payout of invoices for a 2% fee. C: a shared client portal showing project status and invoices."
      audience: "freelance designers who invoice clients monthly"
      participants: 8
    assert:
      - {type: contains, value: "Order"}
      - {type: llm-rubric, value: "States the decision and a riskiest-assumption hypothesis per concept, starts the guide with current behaviour and the last real late payment before showing concepts, writes neutral comparable concept statements, rotates order with a table, uses trade-off ranking and behaviour-based intent probes, lists questions to avoid, and sets go, iterate or stop criteria before fieldwork while noting eight sessions cannot measure preference shares."}
  - name: edge-needs-numbers
    vars:
      concepts: "Two pricing models for a meal kit: weekly subscription versus pay-per-box."
      audience: "urban households of two to four people"
      participants: 6
    assert:
      - {type: llm-rubric, value: "Explains that qualitative sessions cannot size preference or pricing, adds a survey design with a sample size rationale, and keeps the qualitative sessions for understanding reasons and objections."}
  - name: negative-too-vague
    vars:
      concepts: "An AI app."
      audience: "everyone"
      participants: 8
    assert:
      - {type: llm-rubric, value: "Asks for the target user, the problem and the benefit of the concept, and a narrower audience, and stops instead of writing a full plan."}
