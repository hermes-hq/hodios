schema: 1
baseline: "Create user personas from this research: {{research_data}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interview-notes
    vars:
      research_data: |
        Product: invoicing tool for freelancers. 8 interviews, March.
        P1 designer: sends 2-3 invoices a month, uses a Word template, forgets to chase late payments, "I hate asking for money".
        P2 developer: 15+ invoices a month across retainers, wants automation and recurring invoices, uses spreadsheets to track.
        P3 photographer: invoices per shoot, often on phone right after the shoot, needs deposits.
        P4 copywriter: 2 invoices a month, embarrassed to chase, has had clients pay 90 days late.
        P5 consultant: 10 invoices, multiple currencies, accountant asks for exports at year end.
        P6 illustrator: occasional invoices, mostly through platforms, rarely sends own invoices.
        P7 developer: retainers, recurring invoices, integrates with time tracking.
        P8 wedding videographer: deposits and final payments, invoices from phone on site.
    assert:
      - {type: contains, value: "## Behavioural variables"}
      - {type: llm-rubric, value: "Builds a behavioural variable table placing participants, forms around 2-4 behaviour-based personas (for example low-volume avoiders of chasing payments, high-volume automation seekers, on-the-go deposit-based creatives), cites participant ids for each, uses only quotes present in the data, marks inferences as assumptions, notes the small sample as provisional, and names gaps such as missing segments."}
  - name: negative-no-research
    vars:
      research_data: "We think our users are millennials who love tech and care about sustainability. Make 3 personas for our recycling app."
    assert:
      - {type: llm-rubric, value: "States that this is not research data, does not present research-based personas, offers clearly labelled proto-personas or hypotheses at most, and recommends specific research to validate them."}
