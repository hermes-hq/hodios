schema: 1
baseline: "Create proto-personas for {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meal-kit
    vars:
      product: "Meal planning app for families. Sales thinks busy parents; support sees many retirees on special diets. No research yet. Data shows most use is Sunday evenings."
      team: "PM, two designers, an engineer and a support lead; 90 minutes."
    assert:
      - {type: contains-all, value: ["## Assumption register", "## Research questions"]}
      - {type: llm-rubric, value: "Marks each persona as not validated, builds them on goals and behaviour rather than demographics, keeps the sales versus support disagreement visible (for example as separate personas or an open question), records sources such as the Sunday-evening data, and turns high-impact low-confidence beliefs into research questions."}
  - name: edge-b2b-tool
    vars:
      product: "Scheduling tool for construction site managers; the founder used to be one."
      team: ""
    assert:
      - {type: llm-rubric, value: "Treats the founder's experience as one source with its own bias, not as validation, and labels beliefs accordingly."}
  - name: negative-use-as-final
    vars:
      product: "We need final personas for our investor deck that show we deeply understand users; just make them sound researched."
      team: ""
    assert:
      - {type: llm-rubric, value: "Refuses to present assumptions as research for investors, explains the risk, and offers proto-personas clearly labelled as hypotheses or a plan to gather evidence."}
