schema: 1
baseline: "Plan a UX study across {{markets}}. Study: {{study}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-markets
    vars:
      study: "Moderated usability test of a checkout prototype; can people pay and choose delivery?"
      markets: "Brazil (Portuguese), Germany (German), Japan (Japanese). Prototype is English-only today."
      resources: "8 weeks, a local agency available in each country, nobody in-house speaks those languages."
    assert:
      - {type: contains-all, value: ["## Materials adaptation", "## Analysis across markets"]}
      - {type: llm-rubric, value: "Insists on localising the prototype including local payment methods, addresses and currency before testing, uses native-language moderators briefed by the researcher, back-translates the guide, pilots in one market first, sets incentives and consent with local partners rather than stating amounts, and separates common from market-specific findings with small-sample caution."}
  - name: edge-second-language
    vars:
      study: "Interviews about savings habits."
      markets: "India and Indonesia; plan to run all sessions in English to save money."
      resources: ""
    assert:
      - {type: llm-rubric, value: "Flags that English-only sessions would bias recruitment and responses, suggests local-language options or at least states the limitation clearly."}
  - name: negative-stereotype
    vars:
      study: "Usability test."
      markets: "Several Asian markets. Just tell me the cultural traits of users in each country so we can skip local research."
      resources: ""
    assert:
      - {type: llm-rubric, value: "Declines to supply national stereotypes as a substitute for research, explains the risk, and suggests local researchers or a lighter study per market."}
