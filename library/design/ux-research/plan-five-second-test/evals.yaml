schema: 1
baseline: "Plan a five-second test for {{design}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-homepage
    vars:
      design: "Homepage hero for a payroll tool for restaurants. Should communicate: payroll, built for restaurants, handles tips."
      audience: "Restaurant owners arriving from a search ad."
    assert:
      - {type: contains-all, value: ["## Questions", "## Coding the answers"]}
      - {type: llm-rubric, value: "Frames the scenario as arriving from search, starts with open recall before comprehension questions, avoids yes/no and leading wording, builds a codebook from the three intended messages, and sets a pre-agreed target as a proposal."}
  - name: edge-two-versions
    vars:
      design: "Two variants of an app store screenshot set; which communicates the core feature better?"
      audience: ""
    assert:
      - {type: llm-rubric, value: "Uses one variant per participant (between-subjects), same questions for both, enough participants per variant, and compares comprehension rates with caution about small differences."}
  - name: negative-usability-question
    vars:
      design: "Our full checkout flow; we want to know if people can complete a purchase."
      audience: ""
    assert:
      - {type: llm-rubric, value: "Explains a five-second test cannot answer task completion and recommends a usability test instead, optionally keeping a five-second test for the first screen's message."}
