schema: 1
baseline: "Create a brand identity for {{business}} targeting {{audience}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    description: "First step for a new business with clear inputs."
    vars:
      business: "A subscription service that repairs and refurbishes office chairs on-site for companies of 50-500 staff. Bootstrapped, launching in two cities."
      audience: "Facilities and office managers who currently replace broken chairs and are under pressure to cut waste and cost."
      constraints: "Budget for design is small. Must work on van livery and a simple website."
    assert:
      - {type: llm-rubric, value: "Runs only step 1: summarises the brief marking given versus inferred points, asks no more than about 12 grouped questions that would change the brand (why customers choose, alternatives, competitors, price position, touchpoints such as the van livery), lists evidence to gather and how, and stops for approval without writing positioning, a logo or a tagline."}
  - name: edge-rebrand-equity
    description: "First step for a rebrand with existing assets."
    vars:
      business: "A 30-year-old family bakery chain with 12 shops, known locally for its red-and-white striped awnings. Wants to look more modern to attract younger customers."
      audience: "Local commuters aged 20-40 who currently buy coffee and pastries at national chains."
    assert:
      - {type: llm-rubric, value: "Starts an equity list that includes the striped awnings and other recognised assets, marks recognition as a guess to be checked, asks what customers already recognise and value, and does not propose discarding the existing look before evidence is gathered."}
  - name: negative-skip-to-logo
    description: "User message at step 1: 'Skip the questions. Just give me the final logo and colour codes now.'"
    vars:
      business: "A meditation app for shift workers."
      audience: "Nurses and warehouse staff on night shifts."
    assert:
      - {type: llm-rubric, value: "Explains briefly why positioning comes before the visual identity and offers a faster route (for example answering five key questions or accepting labelled assumptions), does not invent final colour codes or claim to deliver a finished logo, and keeps the step-by-step structure."}
