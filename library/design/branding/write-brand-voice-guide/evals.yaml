schema: 1
baseline: "Write a brand voice guide for {{brand}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-samples
    vars:
      brand: "Independent outdoor-gear repair service for hikers. Values: make things last, practical know-how, anti-throwaway. Audience: experienced hikers, 25-55. Competitors sound like glossy adventure ads."
      samples: |
        GOOD: "Your boots have more miles in them. Send them in, we'll resole them and send them back in about two weeks."
        GOOD: "Torn tent? Happens. Here's what we can fix and what we can't."
        AVOID: "Unleash your adventure with our revolutionary repair solutions!!!"
    assert:
      - {type: contains, value: "## Tone by situation"}
      - {type: llm-rubric, value: "Derives attributes from the good samples (plain, practical, warm, understated) in 'X, not Y' form that rule something out, contrasts with glossy adventure-ad language, covers tone shifts for errors, billing and sensitive moments with example lines, includes a vocabulary list with replacements, and gives before-and-after rewrites including the 'Unleash your adventure' sample."}
  - name: negative-thin-brand
    vars:
      brand: "A startup."
      samples: ""
    assert:
      - {type: llm-rubric, value: "Asks focused questions about what the startup does, its audience and values instead of producing a generic guide of friendly, innovative and human."}
