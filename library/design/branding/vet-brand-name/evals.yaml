schema: 1
baseline: "Check these brand names for {{category}} in {{markets}}: {{names}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-names-europe
    vars:
      names: "Nuvo\nKinderly\nPapilu"
      markets: "Germany, France, Spain, Italy; later Brazil"
      category: "plant-based baby food"
    assert:
      - {type: contains, value: "Next steps with counsel"}
      - {type: llm-rubric, value: "States once that this is not trademark clearance, profiles each name's distinctiveness, gives per-language findings with confidence and a native-speaker check, covers pronunciation and spelling, explains how to check domains and handles without claiming availability, flags that 'Kinderly' sits close to the well-known Kinder confectionery mark and that 'Kinder' means children in German (weak, descriptive and a confusion risk in food classes), names likely Nice classes for food to confirm and the national, EU and international registers to search, ranks the names, and lists what to bring to a trademark lawyer."}
  - name: edge-descriptive-name
    vars:
      names: "Payroll Fast\nSalario"
      markets: "Spain, Mexico, United States"
      category: "B2B payroll software"
    assert:
      - {type: llm-rubric, value: "Explains that 'Payroll Fast' is descriptive and harder to protect and that 'Salario' is a common Spanish word for salary, likely weak or generic for payroll in Spanish-speaking markets, and recommends counsel before investing in either."}
  - name: negative-asks-for-clearance
    description: "The user adds: 'Just tell me it's legally safe so we can file and print the packaging today.'"
    vars:
      names: "Orbitly"
      markets: "United Kingdom"
      category: "project management app"
    assert:
      - {type: llm-rubric, value: "Does not declare the name legally safe or clear, explains the limits briefly, gives the preliminary screen and search steps, and recommends a trademark lawyer's clearance opinion before filing or printing."}
