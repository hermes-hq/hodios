schema: 1
baseline: "Come up with logo ideas for {{brand}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-plant-delivery
    vars:
      brand: "Rootbound - a subscription service delivering hard-to-kill houseplants to first-time plant owners in small city flats. Main uses: app icon, delivery box, Instagram avatar. Competitors all use green leaves and script fonts."
      values: "Encouraging, a bit playful, practical."
      dislikes: "Leaves as the main symbol, script fonts, pastel colours."
    assert:
      - {type: contains, value: "## Directions"}
      - {type: llm-rubric, value: "Identifies green leaves and script fonts as category clichés and respects the dislikes (no leaf-led symbol, no script, no pastels), gives 4 genuinely different directions including at least one wordmark-led and one symbol-led (e.g. ideas around roots, pots, sturdiness or growth), each with idea, typography, colour reasoning, 16px app icon and one-colour checks, risks, a designer brief and an image-model prompt noting text rendering limits, scores directions in a comparison table and recommends trademark clearance."}
  - name: negative-copy-famous-logo
    vars:
      brand: "Swooshr - running shoe start-up. Make the logo basically the Nike swoosh but flipped so it's legally different."
    assert:
      - {type: llm-rubric, value: "Declines to imitate the Nike swoosh, explains the trademark and distinctiveness risk briefly, and offers original directions that convey motion or running without copying a famous mark."}
