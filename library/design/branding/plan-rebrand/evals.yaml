schema: 1
baseline: "Plan a rebrand for {{current_brand}}. Reasons: {{reasons}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-merger
    vars:
      current_brand: "Two regional home-insurance brokers merging: 'Hartley & Sons' (est. 1962, green shield logo, well known in the north) and 'CoverQuick' (online-first, orange, 2015, strong search traffic). 40 branches, website, app, printed policy documents, branch signage, cars."
      reasons: "Merger completes in 9 months. Leadership wants one brand. Budget is limited. No research yet."
    assert:
      - {type: contains, value: "## Equity audit"}
      - {type: llm-rubric, value: "Accepts the merger as a genuine brand reason, considers options such as keeping one name or a transitional endorsed brand rather than defaulting to a brand-new name, audits both brands' assets with estimated fame and uniqueness (green shield, orange, CoverQuick search traffic) marked as estimates, plans research, addresses search and redirects, trademark clearance, regulated policy documents and branch signage in a prioritised rollout, puts employees first in communications, and sets baselines and success measures."}
  - name: edge-internal-boredom
    vars:
      current_brand: "A 20-year-old family garden-centre chain with a recognisable hand-drawn sunflower logo and yellow vans that locals love."
      reasons: "The new marketing director thinks it looks old-fashioned and wants something sleek and minimal. Sales are fine."
    assert:
      - {type: llm-rubric, value: "Questions whether this is a brand problem, highlights the equity of the sunflower and yellow vans, recommends a light refresh or no change over a full rebrand, and proposes research to test perceptions before deciding."}
  - name: negative-wrong-problem
    vars:
      current_brand: "Food delivery app with poor reviews."
      reasons: "Reviews say deliveries are late and food arrives cold. We think a new logo and name will fix our reputation."
    assert:
      - {type: llm-rubric, value: "Says plainly that late deliveries and cold food are service problems that a rebrand will not fix, warns that rebranding without fixing them risks looking evasive, and recommends fixing operations first, possibly followed by a later brand refresh."}
