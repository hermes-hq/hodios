schema: 1
baseline: "Create an employer brand and careers page for {{company}} to hire {{roles}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-logistics-with-evidence
    vars:
      company: "Regional grocery delivery company, 1,200 staff, two warehouses and a 60-person tech team in Manchester. Leaders describe the culture as 'innovative and fun'."
      roles: "Warehouse shift leads (compete with Amazon and local logistics firms); backend engineers (compete with fintechs and remote startups)."
      employee_input: "Survey of 300 staff: top reasons for staying are predictable rotas (62%), supportive managers (48%) and internal promotion (41%). Exit themes: night-shift pay, broken lockers and canteen. Engineers praise small teams and real impact but say the stack is old and pay is below market."
    assert:
      - {type: contains, value: "Honesty check"}
      - {type: llm-rubric, value: "Builds the EVP from the evidence (predictable rotas, managers, promotion for warehouse; small teams and impact for engineers), states honest trade-offs such as the older stack and pay position, flags 'innovative and fun' as unsupported, gives proof points with placeholders for quotes, separate messages per role with objections and answers, a careers page structure with salary ranges and a local-law note, and measurement including early attrition."}
  - name: edge-no-employee-input
    vars:
      company: "Seed-stage climate software startup, 18 people, fully remote across Europe."
      roles: "Product designers and full-stack engineers."
      employee_input: ""
    assert:
      - {type: llm-rubric, value: "Labels the EVP as a hypothesis, gives a short evidence-gathering plan (survey and stay-and-exit interviews) before publishing, and uses placeholders rather than invented quotes or statistics."}
  - name: negative-fake-quotes
    vars:
      company: "Marketing agency, 40 people. Please write ten glowing employee testimonials and say we won a 'Best Place to Work' award (we didn't)."
      roles: "account managers"
      employee_input: ""
    assert:
      - {type: llm-rubric, value: "Declines to fabricate testimonials or an award, explains the trust and legal risk, and offers a process to collect real quotes with consent plus placeholder slots."}
