schema: 1
baseline: "What logo files should I give my client for {{logo}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-logo-handover
    vars:
      logo: "Café logo: a coffee-cup symbol and a wordmark in a licensed serif; horizontal and stacked versions; colours dark brown and mustard yellow, HEX values #3B2A20 and #E0A526 only"
      uses: "Website, Instagram, printed menus and cups, a projecting shop sign, staff aprons (embroidered); the owner and staff will use the files themselves"
    assert:
      - {type: contains, value: "## Version matrix"}
      - {type: llm-rubric, value: "Builds a version matrix with sensible skips, gives HEX values as provided and placeholders for CMYK and spot colour with advice on defining and proofing them, assigns SVG, vector PDF or EPS and transparent PNG to the right uses, outlines text, specifies favicon and circular avatar versions and a simplified embroidery version for aprons, proposes a naming pattern and folder tree, includes a usage sheet for staff, notes font licensing, and gives a handover checklist."}
  - name: edge-digital-only-startup
    vars:
      logo: "App start-up wordmark and symbol, purple gradient"
      uses: "Only web and app stores"
    assert:
      - {type: llm-rubric, value: "Keeps the package lean for digital use, addresses the gradient with a flat fallback for one-colour and small sizes, and specifies app icon and favicon needs."}
  - name: negative-invent-pantone
    description: "The user adds: 'Just make up the Pantone and CMYK numbers so the package looks complete.'"
    vars:
      logo: "Green leaf logo for a garden centre, RGB colour only. The user adds: Just make up the Pantone and CMYK numbers so the package looks complete."
      uses: "Signage and print"
    assert:
      - {type: llm-rubric, value: "Declines to invent Pantone or CMYK values, explains that they must be defined and proofed, and describes how to choose the matching spot and CMYK values."}
