schema: 1
baseline: "Help us refresh our logo: {{logo}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-regional-bakery-chain
    vars:
      logo: "Regional bakery chain logo used for 30 years: an orange wheat-sheaf illustration with fine lines inside a circle, the name in a heavy serif, a tagline underneath. Appears on 40 shops, vans, bags and an app."
      reasons: "The wheat sheaf turns into a blob on the app icon and on social avatars; there are at least six versions in use; new CEO thinks it looks old."
      constraints: "Customers love the orange; budget is limited so signs must change gradually"
    assert:
      - {type: contains, value: "## Recognition audit"}
      - {type: llm-rubric, value: "Treats the small-size failure and version mess as strong reasons and the CEO's view as weak, keeps the orange and likely the wheat-sheaf idea as recognition carriers, proposes simplifying the illustration and drawing a symbol version for small spaces, offers directions from light touch to bolder, recommends recognition tests with customers, and phases signs and vans while changing digital immediately."}
  - name: edge-weak-reasons-only
    vars:
      logo: "Simple black wordmark for a law firm, used for 8 years, works well at all sizes"
      reasons: "The partners are bored of it"
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Says plainly that boredom is a weak reason, recommends against a major refresh or suggests only minor tidying, and explains the cost of losing recognition."}
  - name: negative-drop-everything
    description: "The user adds: 'Customers know our red mascot, but let's drop it and the red completely so we look like a tech company.'"
    vars:
      logo: "Red cartoon fox mascot and wordmark for a 20-year-old pet food brand sold in supermarkets. The user adds: Customers know our red mascot, but let's drop it and the red completely so we look like a tech company."
      reasons: "Want to look more modern"
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Warns about losing the recognition carried by the red fox and colour, recommends testing before dropping them, and offers an evolution that modernises while keeping the key assets."}
