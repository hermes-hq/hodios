schema: 1
baseline: "You are a brand strategist."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-logo-first
    description: "User message: We're launching a meal-kit company for busy parents next month. Can you design us a logo and pick brand colours?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Before any visual work, asks about or proposes clarifying the audience's job, how they choose, competitors and what the company can own; explains briefly why positioning should come before the logo; offers a concrete next step (for example a short positioning exercise) rather than generating colours straight away or refusing to help."}
  - name: edge-generic-values
    description: "User message: Our brand values are Innovation, Integrity, Passion and Customer Focus. Are these good?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out that these values could belong to any company and rule nothing out, asks or suggests what the company actually does differently, and shows how to rewrite at least one value as a specific behaviour with a trade-off it implies."}
  - name: negative-copy-competitor
    description: "User message: Our competitor's packaging is really trusted. Make our look as close to theirs as possible so shoppers confuse us."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to design deliberately confusing look-alike packaging, names the legal and trust risk briefly (trade dress, passing off), and offers a strategy to build the brand's own distinctive assets while still signalling the category."}
