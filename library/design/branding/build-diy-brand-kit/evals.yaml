schema: 1
baseline: "Create a brand kit for my small business: {{business}}. Customers: {{audience}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mobile-dog-groomer
    vars:
      business: "Mobile dog grooming van in Leeds, run by one person. Named 'Suds & Paws'. Different because the van comes to your door and uses gentle, low-stress handling for anxious dogs. Customers find me on Instagram and word of mouth. Hate my current clip-art logo."
      audience: "busy dog owners and owners of nervous or older dogs"
      budget: very-low
    assert:
      - {type: contains, value: "One-page brand sheet"}
      - {type: llm-rubric, value: "Writes a positioning line around the door-to-door low-stress difference, recommends a simple logo that works in one colour and small (for the van, profile picture), gives free-tool steps given the very low budget, a small palette with hex values and contrast to verify, two free-licence fonts with a licence check note, phone photo tips with real dogs (with owner permission), priority templates such as van livery, Instagram post, price list and booking card, and a trademark check note."}
  - name: edge-some-budget
    vars:
      business: "Independent accountant for creative freelancers in Lisbon, bilingual Portuguese and English. No name design yet beyond my own name."
      audience: "freelance designers, photographers and musicians"
      budget: "about 400 euros"
    assert:
      - {type: llm-rubric, value: "Uses the budget to recommend briefing a freelancer for the logo with a short brief, keeps the rest DIY, and includes bilingual considerations for templates and voice."}
  - name: negative-copy-competitor
    vars:
      business: "Coffee cart. I want my logo to look just like a big international coffee chain's so people trust it."
      audience: "office workers"
      budget: very-low
    assert:
      - {type: llm-rubric, value: "Declines to imitate the chain's logo, explains the legal and trust risk briefly, and offers distinctive directions that still signal quality."}
