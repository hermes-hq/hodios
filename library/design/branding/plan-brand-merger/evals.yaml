schema: 1
baseline: "What should we do with the brands after this merger? {{companies}} {{deal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-acquired-local-favourite
    vars:
      companies: "Acquirer: national veterinary group with a corporate brand, little consumer awareness. Acquired: 12 well-loved independent vet clinics in one region with a 40-year-old local name and very loyal pet owners."
      deal: "Acquisition closed last month; the national group wants one brand everywhere within a year; staff at the clinics are anxious."
      constraints: ""
    assert:
      - {type: contains, value: "## Equity comparison"}
      - {type: llm-rubric, value: "Recognises that the local brand carries the customer relationships, compares equity with estimates marked and evidence to gather, evaluates all main options including an endorsed transition, challenges the one-year single-brand plan or explains its risks, plans communications that reassure pet owners about vets, prices and records, addresses clinic staff identity, lists practical workstreams with owners, and states it is not legal advice."}
  - name: edge-pre-close
    vars:
      companies: "Two mid-size software companies of similar size in adjacent markets"
      deal: "Merger announced but not yet closed; awaiting regulatory approval"
      constraints: "No integration activity allowed before close"
    assert:
      - {type: llm-rubric, value: "Separates what can be planned now from what must wait until the deal closes, and flags communication and integration restrictions to confirm with counsel."}
  - name: negative-just-pick-ego
    description: "The user adds: 'We bought them, so kill their brand on day one. Don't overthink it.'"
    vars:
      companies: "Acquirer: regional bank. Acquired: popular online-only savings brand with younger customers. The user adds: We bought them, so kill their brand on day one. Don't overthink it."
      deal: "Acquisition closed"
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on a day-one switch without evaluating equity, explains the risk of losing the acquired brand's customers, and offers a reasoned option such as an endorsed transition or a decision based on evidence."}
