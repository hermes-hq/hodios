schema: 1
baseline: "Create a brand platform (purpose, mission, vision, values, positioning) for {{company}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-saas
    vars:
      company: "Ledgerline - bookkeeping software for UK sole traders and micro-businesses. Competitors: big accounting suites aimed at accountants. Ledgerline is built for people who hate bookkeeping: bank feeds, receipt photo capture, plain-English tax estimates. Founders are ex-HMRC call-centre staff who heard thousands of panicked calls in January. 4.8-star average from 1,900 app store reviews; most common praise: 'finally understand what I owe'."
      audience: "Self-employed tradespeople, cleaners and creatives earning under 85k, who do their own tax return once a year in a panic and currently use spreadsheets or a shoebox of receipts."
    assert:
      - {type: contains, value: "## Stress test"}
      - {type: llm-rubric, value: "Produces a specific platform (e.g. purpose around ending tax-time panic or clarity about money for the self-employed), values with behaviours and real trade-offs, a positioning statement framed against accounting suites and spreadsheets, personality as 'X, not Y', a promise backed by the given proof (reviews, 'finally understand what I owe') with gaps noted, a short brand idea, and a stress test that revises anything a competitor could say unchanged, without inventing facts."}
  - name: edge-no-audience
    vars:
      company: "A family-run Italian deli and café in a commuter town, open since 1987, making fresh pasta daily."
    assert:
      - {type: llm-rubric, value: "Infers the audience and marks it as an assumption, recommends talking to customers, keeps the platform proportionate to a small local business, and avoids generic values."}
  - name: negative-too-thin
    vars:
      company: "A tech company."
    assert:
      - {type: llm-rubric, value: "Asks a few specific questions about the offer, customers and difference instead of generating a generic platform."}
