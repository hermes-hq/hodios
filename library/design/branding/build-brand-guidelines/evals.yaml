schema: 1
baseline: "Write brand guidelines for these assets: {{brand_assets}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-small-business
    vars:
      brand_assets: |
        Fernway Physio, two physiotherapy clinics. Logo: a stylised fern symbol plus wordmark, horizontal and stacked, navy and white versions. Colours: Navy #14284B (CMYK 100/85/35/30), Fern #3FA47A (no CMYK yet), Sand #F2E9DC. Fonts: Source Sans 3 (free, all uses). Photos: real patients and staff in our clinics, natural light. Used by reception staff, our two physios and a freelance designer.
      voice: "Reassuring, plain-spoken, encouraging. Never clinical jargon without explanation."
    assert:
      - {type: contains, value: "## Logo"}
      - {type: llm-rubric, value: "Starts with an asset inventory marking missing items (e.g. Fern CMYK, Pantone, one-colour or reversed logo) as TBD, uses only the given values, defines clear space and minimum sizes with concrete units, lists specific logo misuses, computes contrast for text pairs (e.g. navy on sand), summarises the voice with before-and-after examples, picks applications relevant to a clinic (e.g. appointment letters, signage, social posts), stays proportionate to a small business, and includes governance."}
  - name: negative-no-assets
    vars:
      brand_assets: "We need brand guidelines."
    assert:
      - {type: llm-rubric, value: "Asks for the logo, colours, fonts and other assets instead of inventing a full set of brand values."}
