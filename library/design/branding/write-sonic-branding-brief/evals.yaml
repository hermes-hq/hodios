schema: 1
baseline: "Write a sonic branding brief for {{brand}}. Uses: {{uses}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fintech
    vars:
      brand: "Neighbourhood bank app for young adults in Brazil and Portugal. Positioning: money made calm. Personality: warm, straightforward, quietly optimistic. Visual identity: soft coral and deep teal, rounded type."
      uses: "Audio logo at the end of video and podcast ads; phone hold music; app sounds for payment success, payment failure and incoming transfer."
      budget: "small studio, 10 weeks"
    assert:
      - {type: contains, value: "Does not sound like"}
      - {type: llm-rubric, value: "Translates attributes into tempo, harmony, timbre and contour with sounds-like and not-sounds-like, lists every use with duration, device, frequency and technical limits including the narrow phone band, distinguishes success and failure sounds with visual or haptic equivalents, describes references in words, includes originality and cultural checks for both markets, and gives evaluation criteria with a listener test."}
  - name: edge-copy-request
    vars:
      brand: "Energy drink brand for gamers. They say: 'Make it sound exactly like a famous console startup chime, people love that.'"
      uses: "Audio logo for streams and ads."
      budget: ""
    assert:
      - {type: llm-rubric, value: "Declines to brief an imitation of a specific existing sound, explains the legal and distinctiveness risks, and instead describes the qualities that make startup chimes effective in words."}
  - name: negative-thin-brand
    vars:
      brand: "a company"
      uses: "audio logo"
      budget: ""
    assert:
      - {type: llm-rubric, value: "Asks for the brand's positioning, audience and personality before writing the brief, and stops."}
