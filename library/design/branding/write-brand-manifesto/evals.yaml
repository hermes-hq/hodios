schema: 1
baseline: "Write a brand manifesto for {{brand}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-repair-friendly-electronics
    vars:
      brand: "Maker of headphones designed to be repaired; against throwaway electronics and glued-shut devices; customers are people tired of replacing gadgets"
      proof: "Every part sold separately for 10 years after launch, screws not glue, free repair guides, battery swappable in 2 minutes, we refused a retailer deal that required sealed packaging-only returns"
      use: "Launch film voice-over and about page; voice is direct and a bit defiant"
    assert:
      - {type: contains, value: "## Proof check"}
      - {type: llm-rubric, value: "Opens with a clear tension against throwaway electronics, uses beliefs a competitor could disagree with, ties each to the given proof such as 10-year parts and screws not glue, writes in short read-aloud lines in a direct defiant voice, avoids empty buzzwords, gives a 30 to 50 word short version, and includes a proof check table without inventing new facts."}
  - name: edge-no-use-given
    vars:
      brand: "Neighbourhood bookshop that hosts free reading groups for teenagers"
      proof: "Free weekly teen reading group for 6 years, staff picks written by hand, no algorithm recommendations"
      use: ""
    assert:
      - {type: llm-rubric, value: "Writes in a suitable voice without being told, keeps claims to the proof given, and suggests where the manifesto fits."}
  - name: negative-no-proof
    vars:
      brand: "We are an innovative company that puts customers first and is passionate about quality"
      proof: "None really, we just want something inspiring"
      use: "Website"
    assert:
      - {type: llm-rubric, value: "Points out that there is no specific belief or proof, asks what the company actually does differently, and does not produce a generic manifesto full of unsupported claims (or clearly marks any draft as placeholder pending proof)."}
