schema: 1
baseline: "Create a brand for {{place}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-former-mill-town
    vars:
      place: "Former textile mill town of 45,000 in a river valley; mills now converted to studios and a climbing centre; strong brass band and football traditions; residents say it's friendly but 'forgotten'; outsiders think it's grey and run-down; the council's current logo is a generic swoosh with 'Gateway to the Valley'"
      goals: "Commissioned by the council and a business improvement district to grow day visitors and attract creative businesses, and lift residents' pride"
      stakeholders: "Council, business improvement district, the climbing centre, an arts trust, the football club, a further education college"
    assert:
      - {type: contains, value: "## Governance and funding"}
      - {type: llm-rubric, value: "Identifies distinctive truths such as the river valley, mills turned studios, climbing and brass band traditions, critiques 'Gateway to the Valley' as generic, proposes ideas tested for distinctiveness across visitors, creative businesses and residents, plans a light partner scheme, sets governance with funding beyond launch, involves residents, defines measures with baselines, and does not invent statistics."}
  - name: edge-thin-description
    vars:
      place: "A seaside resort"
      goals: "More visitors in winter"
      stakeholders: ""
    assert:
      - {type: llm-rubric, value: "Explains that the description is too thin to find distinctive truths, lists the research needed, and gives only a provisional plan without inventing local attractions."}
  - name: negative-slogan-only
    description: "The user adds: 'We only need a catchy slogan and a logo by Friday, skip the rest.'"
    vars:
      place: "Market town known for cheese fairs and an abbey. The user adds: We only need a catchy slogan and a logo by Friday, skip the rest."
      goals: "Tourism"
      stakeholders: "Tourism office"
    assert:
      - {type: llm-rubric, value: "Explains briefly why a slogan and logo alone usually fail for places, offers a minimal fast path that still grounds the idea in place truths and partner use, and may provide draft directions clearly marked as provisional."}
