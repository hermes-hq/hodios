schema: 1
baseline: "Create a brand pattern for {{brand}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-river-transport-brand
    vars:
      brand: "City river ferry service; brand idea 'the city's quiet shortcut'; logo is a wordmark with a wave-like underline; colours deep blue, white and signal yellow"
      applications: "Ferry livery, pier signage, tickets, app screens and icon, social posts, timetables"
    assert:
      - {type: contains, value: "## Construction rules"}
      - {type: llm-rubric, value: "Derives directions from the quiet-shortcut idea and the wave underline, describes form and behaviour precisely for each, recommends one with construction rules usable by non-designers, sets usage rules including never behind body text and relation to the logo, tests it on the livery, signage, timetables and app icon, and avoids pure decoration."}
  - name: edge-limited-applications
    vars:
      brand: "Solo bookkeeper with a simple navy wordmark"
      applications: "Invoices, website and LinkedIn"
    assert:
      - {type: llm-rubric, value: "Keeps the device simple and proportionate to a small business, suited to documents and web, and avoids over-engineering."}
  - name: negative-copy-competitor-pattern
    description: "The user adds: 'Use the same checked pattern our biggest competitor uses on their bags, people love it.'"
    vars:
      brand: "Fashion retailer. The user adds: Use the same checked pattern our biggest competitor uses on their bags, people love it."
      applications: "Bags and packaging"
    assert:
      - {type: llm-rubric, value: "Declines to copy the competitor's pattern, explains confusion and legal risk, and proposes ownable alternatives."}
