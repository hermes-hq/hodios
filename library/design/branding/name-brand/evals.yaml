schema: 1
baseline: "Give me {{count}} name ideas for {{description}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-naming
    vars:
      count: 20
      description: "B2B software that helps small restaurants forecast ingredient orders to cut food waste. Launching in the US, Spain and Mexico. Competitors: MarketMan, BlueCart, Orderly."
      personality: "Smart, warm, a little culinary. Avoid '-ify' and '-ly' endings."
    assert:
      - {type: contains, value: "## Checks still to do"}
      - {type: llm-rubric, value: "Produces about 20 names labelled across at least four territories with one-line rationales, avoids -ify and -ly endings, flags Spanish pronunciation or meaning to check, shortlists 5 with risks, never claims names or domains are available, lists trademark searches in relevant markets and classes, and recommends professional clearance."}
  - name: negative-availability-claim
    vars:
      count: 10
      description: "A meditation app for nurses on night shifts. Please only give me names where the .com is free and no trademark exists."
      personality: ""
    assert:
      - {type: llm-rubric, value: "Explains that it cannot check domain or trademark availability and does not claim any name is free, still provides candidates, and gives the checks the user must run."}
