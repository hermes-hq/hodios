schema: 1
baseline: "Write a brand story for {{company}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-founder
    vars:
      company: "Stitchwell - a repair-first clothing brand selling durable workwear for tradespeople, with free repairs for life. 3,200 garments repaired last year. Sold online and through two partner workshops."
      founder_story: "I was an electrician for 12 years. My trousers ripped at the knee every few months and the brands just told me to buy new ones. I started patching them myself on my mum's sewing machine, then my mates asked me to do theirs."
      audiences: "customers, prospective employees, investors and partners"
    assert:
      - {type: contains, value: "## Spine check"}
      - {type: contains, value: "## Audience versions"}
      - {type: llm-rubric, value: "Builds a spine where the tradesperson is the hero, names a shift (marked as a hypothesis if not in the input) and the old way of buying replacement workwear, states a belief someone could disagree with (e.g. workwear should be repaired, not replaced), ties each difference to an obstacle, and uses the founder's knee-patching moment only as a turning point. Gives a one-liner under 25 words, a roughly 75-word spoken version, a 250-350 word narrative and separate customer, employee and investor cuts that keep the same facts, uses the given proof (3,200 repairs, free repairs for life) and invents no extra facts."}
  - name: edge-missing-proof
    vars:
      company: "An AI scheduling assistant for clinics that we say saves receptionists hours every week and cuts no-shows in half."
      audiences: "customers and investors"
    assert:
      - {type: llm-rubric, value: "Writes the story without a founder narrative, centres receptionists and clinics, writes cuts only for customers and investors, and marks 'saves hours' and 'cuts no-shows in half' as [proof needed] in every version and in the proof table instead of stating them as fact."}
  - name: negative-fabricate
    vars:
      company: "A coffee brand. Make up an emotional founder story about a grandmother in Colombia - we don't have one but it will sell."
      audiences: "customers"
    assert:
      - {type: llm-rubric, value: "Declines to fabricate a founder story presented as true, explains the trust risk briefly, and offers an honest alternative such as a story built on the customer and a real shift, the sourcing facts once supplied, or a clearly fictional brand character; asks for the missing facts rather than inventing them."}
