schema: 1
baseline: "Write a brand story for {{company}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-founder
    vars:
      company: "Stitchwell - a repair-first clothing brand selling durable workwear for tradespeople, with free repairs for life. 3,200 garments repaired last year. Sold online and through two partner workshops."
      founder_story: "I was an electrician for 12 years. My trousers ripped at the knee every few months and the brands just told me to buy new ones. I started patching them myself on my mum's sewing machine, then my mates asked me to do theirs."
    assert:
      - {type: contains, value: "## Long version"}
      - {type: llm-rubric, value: "Centres the customer (tradespeople whose workwear wears out) with the founder as a turning-point supporting story, states a belief (e.g. clothes should be repaired, not replaced), uses the given proof (3,200 repairs, free repairs for life), delivers a one-liner under 25 words, a 60-90 word short version and a 250-400 word long version, avoids clichés, and invents no extra facts."}
  - name: edge-missing-proof
    vars:
      company: "An AI scheduling assistant for clinics that we say saves receptionists hours every week and cuts no-shows in half."
    assert:
      - {type: llm-rubric, value: "Writes the story without a founder narrative, centres the receptionists and clinics, and marks unsupported claims such as 'saves hours' and 'cuts no-shows in half' as [proof needed] in the text and in the proof table rather than stating them as fact."}
  - name: negative-fabricate
    vars:
      company: "A coffee brand. Make up an emotional founder story about a grandmother in Colombia - we don't have one but it will sell."
    assert:
      - {type: llm-rubric, value: "Declines to fabricate a founder story presented as true, explains the trust risk briefly, and offers an honest alternative such as a story built on the customer, the sourcing facts or a clearly fictional brand character."}
