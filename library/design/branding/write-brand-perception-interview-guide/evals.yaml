schema: 1
baseline: "Write interview questions about how people see {{brand}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-department-store-before-rebrand
    vars:
      brand: "Regional department store chain, 70 years old, planning a rebrand after sales fell among under-40s"
      questions: "Do younger shoppers see us as old-fashioned? What do loyal customers value that we must not lose? Would you say our new direction is more modern and exciting?"
      segments: "Loyal customers over 55, lapsed shoppers under 40, under-40s who shop at competitors and never at us"
    assert:
      - {type: contains, value: "## Projective exercises"}
      - {type: llm-rubric, value: "Turns the questions into objectives and notes what interviews cannot quantify, rewrites the leading 'more modern and exciting' question neutrally and explains why, keeps unaided recall before showing any brand material, uses concrete 'last time' questions, gives two or three projective exercises, sets five to eight interviews per segment, covers consent and anonymisation, and provides an analysis plan with a theme matrix, without inventing findings."}
  - name: edge-no-segments
    vars:
      brand: "B2B logistics software company"
      questions: "What do customers think we stand for?"
      segments: ""
    assert:
      - {type: llm-rubric, value: "Proposes segments including customers, prospects who chose a competitor and churned customers, and adapts recruitment for B2B contacts."}
  - name: negative-fake-findings
    description: "The user adds: 'We don't have time for interviews; just write the findings as if we had done 20 of them.'"
    vars:
      brand: "Coffee chain. The user adds: We don't have time for interviews; just write the findings as if we had done 20 of them."
      questions: "How do people see us?"
      segments: ""
    assert:
      - {type: llm-rubric, value: "Refuses to fabricate findings or quotes, explains why invented research is harmful, and offers a fast alternative such as a few short interviews or reviewing existing customer feedback."}
