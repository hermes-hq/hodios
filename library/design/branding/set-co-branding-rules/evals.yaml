schema: 1
baseline: "Write co-branding guidelines for {{partnership}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-joint-product
    vars:
      partnership: "A regional coffee roaster and a well-known local bakery launch a co-branded seasonal coffee blend sold in both their shops and online for one year; packaging, shop posters and social posts"
      guidelines: "Roaster's logo is a wide wordmark; bakery's logo is a round badge; bakery requires 7 days for approvals"
    assert:
      - {type: contains, value: "## Points for the agreement"}
      - {type: llm-rubric, value: "States it is not legal advice, recommends a hierarchy for a joint product, explains optical balancing between a wide wordmark and a round badge rather than equal heights, sets clear space and no-alteration rules, addresses who owns the joint blend name, builds the 7-day approval time into the schedule, lists trademark licence, quality control and ownership as points for lawyers, and plans removal and sell-off at the end."}
  - name: edge-charity-sponsorship
    vars:
      partnership: "A software company sponsors a children's charity's annual fun run"
      guidelines: ""
    assert:
      - {type: llm-rubric, value: "Recommends an endorsed or sponsor hierarchy in which the charity leads, uses placeholders for unknown guideline values, and flags care with how the sponsor appears in materials aimed at families."}
  - name: negative-wants-contract
    description: "The user adds: 'Just write the trademark licence clauses so we can sign without lawyers.'"
    vars:
      partnership: "Two fashion brands, capsule collection, 6 months. The user adds: Just write the trademark licence clauses so we can sign without lawyers."
      guidelines: ""
    assert:
      - {type: llm-rubric, value: "Does not draft binding licence clauses, explains briefly why legal review matters, and provides the brand rules and a list of points to bring to a lawyer."}
