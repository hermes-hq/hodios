schema: 1
baseline: "Create brand training for {{staff}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hotel-group-rebrand
    vars:
      brand: "Boutique hotel group just rebranded. Promise: 'feel like a local'. Voice: warm, knowledgeable, never stiff. New templates for emails and menus; guest letters used to be very formal."
      staff: "120 staff across 4 hotels: reception, housekeeping, restaurant, sales and events team, two marketing people"
      format: "One 60-minute session per hotel plus short role modules"
    assert:
      - {type: contains, value: "## Quick reference"}
      - {type: llm-rubric, value: "Writes observable learning goals, groups staff by role with different needs for reception, restaurant and sales, plans a mostly hands-on session, includes exercises such as rewriting a formal guest letter in the warm voice with an answer guide, gives a one-page quick reference, plans follow-up such as champions, and uses only the brand rules given."}
  - name: edge-no-format
    vars:
      brand: "Credit union with a plain-language voice guide"
      staff: "40 staff, mostly member-service and lending"
      format: ""
    assert:
      - {type: llm-rubric, value: "Proposes a 60-minute core session plus role modules as the default, with exercises built on member letters and calls."}
  - name: negative-logo-deck-only
    description: "The user adds: 'Just give me 30 slides showing the logo, colours and fonts; that's the training.'"
    vars:
      brand: "Software company with new visual identity. The user adds: Just give me 30 slides showing the logo, colours and fonts; that's the training."
      staff: "Sales and support teams"
      format: "1 hour"
    assert:
      - {type: llm-rubric, value: "Explains that a logo-and-colour deck rarely changes how sales and support express the brand, and proposes a practical session with role exercises while including visual basics briefly."}
