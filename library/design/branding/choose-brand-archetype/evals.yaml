schema: 1
baseline: "What brand archetype fits {{brand}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-outdoor-gear-repair
    vars:
      brand: "Outdoor clothing company founded by two mountain guides; offers lifetime repairs, publishes route guides, refuses to discount; wants to feel adventurous but trustworthy"
      audience: "Hikers and climbers aged 25 to 55 who value durable kit and real expertise"
      competitors: "Big brands mostly use heroic summit imagery and 'conquer' language"
    assert:
      - {type: contains, value: "## What it rules out"}
      - {type: llm-rubric, value: "Frames archetypes as a tool not science, evaluates three candidates such as Explorer, Sage and Caregiver with evidence from the guides' founding, repairs and route guides, notes that heroic conquer imagery crowds the category, recommends a primary archetype with reasons, gives voice examples and visual cues, and lists things it rules out."}
  - name: edge-no-competitors
    vars:
      brand: "Children's dentist practice that uses games and storytelling to calm kids"
      audience: "Parents of anxious children"
      competitors: ""
    assert:
      - {type: llm-rubric, value: "Considers archetypes such as Caregiver, Jester or Innocent with evidence, notes that competitor crowding is unknown and how to check it, and gives expression cues for a children's dental setting that also reassure parents."}
  - name: negative-aspiration-contradicts-behaviour
    vars:
      brand: "Budget airline known for strict fees and no-frills service; wants to be seen as the Caregiver who looks after every passenger"
      audience: "Price-sensitive travellers"
      competitors: ""
    assert:
      - {type: llm-rubric, value: "Points out that the Caregiver aspiration contradicts the no-frills, strict-fee behaviour and would ring false, and recommends an archetype the actual behaviour supports, such as Regular Person or Jester, or explains what would need to change."}
