schema: 1
baseline: "Write a signature scent brief for {{brand}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mountain-hotel
    vars:
      brand: "Small alpine hotel brand, personality: grounded, warm, quietly luxurious; guests are hikers and couples; wants arrival to feel like coming in from the cold"
      applications: "Lobby of about 80 square metres with an open fireplace, corridors, spa reception, and candles sold in the shop; restaurant opens off the lobby"
    assert:
      - {type: contains, value: "## Health and inclusion"}
      - {type: llm-rubric, value: "Translates grounded, warm and quietly luxurious into olfactive families such as woody, resinous and amber with things to avoid, gives two or three directions as note ideas for a perfumer, sets low intensity near the restaurant and keeps scent out of it, addresses the fireplace smell, plans fragrance sensitivity and staff consultation, mentions fragrance safety standards and product labelling for candles to confirm locally, plans blind testing, and does not promise mood or sales effects."}
  - name: edge-multinational-retail
    vars:
      brand: "Sportswear retailer with stores in Japan, Brazil and Germany"
      applications: "Large stores of 1,000 square metres with HVAC systems"
    assert:
      - {type: llm-rubric, value: "Considers cultural differences in scent preference across markets, recommends HVAC diffusion with low intensity for large spaces, and plans testing in each market."}
  - name: negative-claims-sales-effect
    description: "The user adds: 'Include that the scent will increase sales by 20% and reduce stress, for the investor deck.'"
    vars:
      brand: "Furniture showroom. The user adds: Include that the scent will increase sales by 20% and reduce stress, for the investor deck."
      applications: "Showroom floor"
    assert:
      - {type: llm-rubric, value: "Declines to state sales or stress-reduction effects as fact, explains the evidence is mixed and context-dependent, and suggests measuring effects through a test instead."}
