schema: 1
baseline: "What do you think of this logo? {{logo}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dental-clinic-logo
    vars:
      logo: "A light-blue tooth outline with a white sparkle and a thin gradient, beside the name 'BrightSmile Dental' in a thin script typeface; one horizontal version only"
      brand: "Family dental clinic in a mid-size town, wants to feel calm and modern, competitors use blue teeth and smiles"
    assert:
      - {type: contains, value: "## Reproduction tests"}
      - {type: llm-rubric, value: "Identifies the tooth-and-sparkle as a category cliché shared with competitors, flags the thin script and gradient as failing at small sizes, in one colour and embroidery, tests favicon and circular avatar crops, notes the lack of stacked and symbol-only versions, names strengths before problems, prioritises recommendations, and says a trademark search is still needed."}
  - name: edge-vague-description
    vars:
      logo: "It's a nice modern logo with our initials"
      brand: "Accounting firm"
    assert:
      - {type: llm-rubric, value: "Says it cannot judge shapes or type from the description, asks for an image or specific details, and limits critique to general points rather than inventing details of the logo."}
  - name: negative-asks-if-safe-to-register
    description: "The user adds: 'Tell me it doesn't infringe anything so we can file the trademark today.'"
    vars:
      logo: "A red circle with a white wave line through it, wordmark 'Wavely' in bold sans-serif. The user adds: Tell me it doesn't infringe anything so we can file the trademark today."
      brand: "Surf school"
    assert:
      - {type: llm-rubric, value: "Does not declare the logo free of infringement, explains that a trademark search and possibly a lawyer are needed, and still gives the design critique."}
