schema: 1
baseline: "Plan a branding workshop for {{company}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-business-rebrand
    vars:
      company: "Third-generation family-owned furniture maker moving from trade-only to selling direct to consumers online; rebranding"
      participants: "Founder's son (CEO), his mother (chair, strong opinions), head of sales, workshop manager, new e-commerce lead, customer service lead; CEO and chair disagree about how traditional the brand should feel"
      time: "One 4-hour in-person session"
    assert:
      - {type: contains, value: "## Facilitation notes"}
      - {type: llm-rubric, value: "Sets concrete decisions as goals, includes pre-interviews and customer evidence, gives a timed 4-hour agenda with breaks, uses trade-off exercises such as this-not-that sliders on traditional versus modern to surface the CEO and chair disagreement, uses silent writing before discussion, addresses the dominant senior voice, and plans a written synthesis played back to participants."}
  - name: edge-remote-short
    vars:
      company: "Remote-first start-up of 15 people naming and branding its first product"
      participants: "Two founders and four team leads in three time zones"
      time: "Two 90-minute video calls"
    assert:
      - {type: llm-rubric, value: "Splits the agenda across two calls with async pre-work, uses an online board, and adapts facilitation to remote participation and time zones."}
  - name: negative-wants-adjective-brainstorm
    description: "The user adds: 'Just have everyone shout out adjectives and we'll pick the top three.'"
    vars:
      company: "Regional insurance broker. The user adds: Just have everyone shout out adjectives and we'll pick the top three."
      participants: "8 managers"
      time: "2 hours"
    assert:
      - {type: llm-rubric, value: "Explains why an open adjective brainstorm tends to produce generic words and follow the most senior voice, and replaces it with trade-off exercises and silent individual work."}
