schema: 1
baseline: "Design a brand architecture for {{portfolio}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fintech-sprawl
    vars:
      portfolio: "Master brand 'Lumio' (business bank account for freelancers, 70% of revenue). Products named by teams: 'Lumio Pay' (invoicing), 'Stackr' (expense cards, launched separately), 'Taxly' (acquired tax filing app with 200k loyal users in Germany only), 'Lumio Plus' (premium tier), and a planned crypto savings product."
      strategy: "Grow cross-selling to existing account holders across Europe. Possible sale of the tax unit in 3 years. Board worries crypto could damage trust in the bank brand."
    assert:
      - {type: contains, value: "## Decision tree for new offerings"}
      - {type: llm-rubric, value: "Maps the current mixed naming, sets criteria including cross-selling, risk and possible sale of the tax unit, compares realistic models, recommends a hybrid such as a branded house for core products with Taxly endorsed to keep equity and allow a sale, keeps the crypto product separated or endorsed to protect trust, gives naming rules with renames like Stackr to a descriptive Lumio name, a decision tree, a migration plan with endorsement periods, and flags trademark and legal checks."}
  - name: edge-no-strategy
    vars:
      portfolio: "Family bakery brand 'Maison Rive' with three shops, a wholesale bread line sold to cafes, a new frozen pastry range for supermarkets, and a baking school."
      strategy: ""
    assert:
      - {type: llm-rubric, value: "States assumptions about growth, weighs whether the supermarket range could harm the premium shop brand, recommends a simple architecture with naming rules and visual relationships suited to a small business, and keeps cost of supporting separate brands in view."}
  - name: negative-missing-portfolio
    vars:
      portfolio: "We have a few products. Which brand architecture is best?"
      strategy: ""
    assert:
      - {type: llm-rubric, value: "Asks for the list of offerings, their audiences and current names before recommending a model, explaining the choice depends on them, rather than declaring one model best in general."}
