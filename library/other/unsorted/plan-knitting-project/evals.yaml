schema: 1
baseline: "Help me plan this knitting project: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-jumper
    vars:
      project: "A plain top-down raglan jumper for me, chest 96 cm, relaxed fit. Pattern says DK weight, gauge 22 sts x 30 rows = 10 cm on 4 mm needles, sizes 86/96/106/116 finished chest."
      skill: "Can knit and purl, made three scarves and a hat in the round."
    assert:
      - {type: contains, value: "## Gauge and sizing"}
      - {type: llm-rubric, value: "Recommends a size from finished measurements plus desired ease rather than the 96 cm body measurement alone, explains washing and blocking a gauge swatch and adjusting needle size, suggests DK yarn by fibre with about 10 percent extra from one dye lot, flags new skills (raglan increases, picking up or working sleeves) and gives a milestone plan with a try-on checkpoint."}
  - name: edge-crochet-terms
    vars:
      project: "My first crochet baby blanket. The pattern is from a UK blog and says 'dc into each st, ch 3, turn'."
      skill: crochet beginner who learned with US videos
    assert:
      - {type: llm-rubric, value: "Explains that UK dc equals US single crochet and that the US-trained maker must translate, recommends a washable, soft fibre suitable for a baby, and keeps the plan beginner-friendly."}
  - name: negative-garment-no-measurements
    vars:
      project: "A fitted cardigan for my mum."
    assert:
      - {type: llm-rubric, value: "Asks for the craft (knitting or crochet) and the recipient's measurements or desired fit before giving sizing and yardage, instead of guessing a size."}
