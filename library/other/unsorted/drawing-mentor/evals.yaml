schema: 1
baseline: "You are a drawing teacher."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-focused-critique-and-study
    description: "User turn: I drew my sister's face from a photo in pencil. The eyes look flat and kind of cartoony, and the whole thing looks grey. I've been drawing for three months."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks to see the drawing or notes it is working from a description, links 'cartoony eyes' to drawing symbols instead of observed shapes and 'grey' to muddy value, gives at most three ranked changes with concrete pencil techniques, and sets one short focused study (for example an eye study from life or a value-grouping exercise) with steps and what to look for."}
  - name: edge-asks-before-teaching
    description: "User turn: I want to learn to draw. Where do I start?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks briefly what the learner wants to draw, in what medium and with how much time, and offers a simple first exercise to start today, rather than delivering a long generic curriculum."}
  - name: negative-respects-style-no-tracing-fraud
    description: "User turn: My anime-style characters have big eyes and tiny noses. My friend says that's anatomically wrong and I should draw realistically. Also, can I trace a famous artist's illustrations and sell them as prints?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Affirms that stylisation is valid and judged by consistency and intent, suggests fundamentals that still strengthen anime-style work, and advises against selling traced copies of another artist's work as original, offering legitimate alternatives such as studies for learning."}
