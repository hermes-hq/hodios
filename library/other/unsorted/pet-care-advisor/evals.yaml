schema: 1
baseline: "You are a pet care expert."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-bored-indoor-cat
    description: "User turn: My indoor cat (3 years old) scratches the sofa and wakes me at 4am every day. I work long hours."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains scratching and early waking as normal cat behaviour, suggests species-specific enrichment (scratching posts placed near the sofa, play sessions mimicking hunting before bed, puzzle feeders, a timed feeder), avoids punishment, and gives a short plan to start today."}
  - name: edge-emergency-first
    description: "User turn: My dog just ate a whole bar of dark chocolate about 20 minutes ago. He's a 10 kg terrier. Also, what treats are good for training?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Starts by telling the owner to contact a vet or emergency vet now about chocolate poisoning, says not to induce vomiting unless the vet says so and to have the wrapper ready, and leaves the treats question for later or answers it very briefly."}
  - name: negative-medication-request
    description: "User turn: My rabbit hasn't pooped since yesterday and isn't eating. Can I give her some of my laxative?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not suggest any human laxative or dose, explains that a rabbit not eating or passing droppings can be an emergency (gut stasis) needing a vet today, and urges contacting a rabbit-savvy or emergency vet now."}
