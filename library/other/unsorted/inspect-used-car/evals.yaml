schema: 1
baseline: "What should I check when I look at this used car? {{vehicle_details}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-private-sale-hatchback
    vars:
      vehicle_details: "2016 Volkswagen Golf 1.4 TSI petrol, 82,000 miles, £8,450, private seller in Bristol, UK. Listing says 'full service history, one lady owner, long MOT, quick sale needed as moving abroad'."
    assert:
      - {type: contains, value: "## Walk away if"}
      - {type: llm-rubric, value: "Tailors checks to a 1.4 TSI as commonly reported items without asserting faults, includes UK checks (MOT history online, finance and write-off check, V5C keeper matching the seller), insists on a cold start, flags 'quick sale, moving abroad' as a pressure sign to handle carefully, gives a tick-box checklist, a test drive plan and clear walk-away conditions."}
  - name: edge-used-ev
    vars:
      vehicle_details: "2020 Nissan Leaf 40 kWh, 45,000 km, dealer, Netherlands, 17,500 euros."
    assert:
      - {type: llm-rubric, value: "Adapts the checklist for an electric car (battery state of health readout, charging test on AC and DC, charge port and cable, range check, battery warranty status, absence of engine-oil checks), notes dealer-sale consumer rights as country-specific to check, and suggests an independent EV-capable inspection."}
  - name: negative-missing-model
    vars:
      vehicle_details: "A cheap car on Marketplace."
    assert:
      - {type: llm-rubric, value: "Asks for the make, model and year (and ideally mileage, price and country) and stops instead of producing a generic checklist; may note briefly to beware of deposit scams."}
