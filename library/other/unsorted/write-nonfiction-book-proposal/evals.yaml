schema: 1
baseline: "Write a book proposal for my nonfiction book: {{book_idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nurse-book
    vars:
      book_idea: "A practical, story-driven book on how ordinary people can stay calm and useful in the first ten minutes of a medical emergency, before help arrives. For parents, teachers and coaches. 10 chapters, each built around a real (anonymised) case from my ER work. About 70,000 words."
      author_platform: "ER nurse for 15 years; newsletter with 8,000 subscribers; spoke at two national nursing conferences; articles in two trade magazines."
    assert:
      - {type: contains, value: "## Gaps to fill"}
      - {type: llm-rubric, value: "A complete proposal with a hooked overview, specific target readers, comparable titles marked [VERIFY] or search criteria instead of invented books, an author bio using only the supplied platform numbers, a concrete marketing plan built on the newsletter and speaking, ten chapter summaries that each say what the chapter teaches, specs around 70,000 words, and a checklist of placeholders."}
  - name: edge-no-platform
    vars:
      book_idea: "A history of the humble paperclip as a lens on industrial design and office life, for curious general readers. No outline yet."
    assert:
      - {type: llm-rubric, value: "Proposes a chapter structure and labels it a proposal, writes the About the author and marketing sections with [ADD] placeholders rather than invented credentials or numbers, and flags platform as a gap to strengthen."}
  - name: negative-no-idea-or-reader
    vars:
      book_idea: "I want to write a nonfiction book."
    assert:
      - {type: llm-rubric, value: "Asks for the core idea and the intended reader before drafting any proposal."}
