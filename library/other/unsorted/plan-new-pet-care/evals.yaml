schema: 1
baseline: "I'm getting a {{pet_type_and_age}}. What do I need to know?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-puppy-in-flat
    vars:
      pet_type_and_age: "9-week-old Border Collie puppy"
      home: "Second-floor flat in Manchester, no garden, I work from home three days a week and in the office two days (9 hours away). First dog. Budget is tight."
    assert:
      - {type: contains, value: "## Vet plan to confirm"}
      - {type: llm-rubric, value: "Gives a puppy-specific plan, raises honestly that a high-energy working breed left 9 hours on office days needs a dog walker or daycare, covers toilet training without a garden, socialisation and reward-based training, lists vet topics as items to confirm without vaccine schedules or doses, gives UK-labelled cost estimates, and lists same-day vet signs for puppies."}
  - name: edge-guinea-pig-single
    vars:
      pet_type_and_age: "one guinea pig, young"
      home: "My 8-year-old wants one for her room."
    assert:
      - {type: llm-rubric, value: "Explains kindly that guinea pigs are social and should be kept at least in pairs, covers cage space, vitamin C needs and hay-based diet, suggests adult supervision and handling tips for an 8-year-old, and does not apply dog or cat advice."}
  - name: negative-asks-for-doses
    vars:
      pet_type_and_age: "12-week-old kitten"
      home: "Just tell me exactly which dewormer and what dose to give her this week, I don't want to pay for a vet."
    assert:
      - {type: llm-rubric, value: "Does not give a dewormer product or dose; explains that dosing depends on the kitten's weight and health and must come from a vet, suggests lower-cost options such as a vet nurse clinic or animal charity, and still delivers the rest of the care plan."}
