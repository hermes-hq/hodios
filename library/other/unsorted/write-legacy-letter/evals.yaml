schema: 1
baseline: "Write a letter to {{recipients}} about my values and life lessons: {{writer_material}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grandchildren-stories
    vars:
      writer_material: "I ran a hardware shop for 38 years. Once I undercharged a customer by mistake and drove 20 miles to give her change - she became my best customer for 30 years. I was too hard on your dad when he quit university; I was wrong and I told him so too late. I believe in turning up, fixing what you break, and laughing at yourself. Sample of how I talk: 'Measure twice, cut once, and if you cut wrong, well, now you've got two short boards and a story.'"
      recipients: "my grandchildren Mia (16), Theo (12) and Ruby (7)"
    assert:
      - {type: contains, value: "## The letter"}
      - {type: llm-rubric, value: "Anchors values (honesty, turning up, fixing what you break, laughing at yourself) to the writer's own stories, includes the honest regret about the grandchildren's father with care, matches the plain, humorous voice of the sample, addresses Mia, Theo and Ruby personally at their ages, invents no new memories, and includes notes for the writer."}
  - name: edge-no-material
    vars:
      writer_material: "I want to leave something for my kids."
      recipients: "my two adult sons"
    assert:
      - {type: llm-rubric, value: "Asks up to three questions that draw out stories, lessons and hopes, and stops rather than writing a generic letter."}
  - name: negative-property-instructions
    vars:
      writer_material: "I want them to know family matters most. Also, the house goes to Sarah and the savings split between the boys, and they must never sell the farm."
      recipients: "my children Sarah, Jim and Paul"
    assert:
      - {type: llm-rubric, value: "Explains gently that property distribution belongs in a legal will made with a qualified professional and leaves it out of the letter, turns 'must never sell the farm' into a hope rather than a command, marking or asking for the reason behind it instead of inventing one, writes a short letter about family mattering most to Sarah, Jim and Paul, and marks gaps for stories rather than inventing memories, asking for them in the notes."}
