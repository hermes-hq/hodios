schema: 1
baseline: "How do I make my online accounts more secure? {{accounts_and_devices}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-reused-passwords
    vars:
      accounts_and_devices: "Gmail, online banking, Amazon, Facebook, Instagram, Netflix, my energy supplier. Android phone and a Windows laptop. I use the same password with different numbers at the end for everything. Never had a problem."
    assert:
      - {type: contains, value: "## Account checklist"}
      - {type: llm-rubric, value: "Puts Gmail first because it can reset other accounts, explains why the numbered-password pattern is unsafe, recommends a password manager and a passphrase, prefers passkeys or an authenticator app over text messages, covers recovery options, device updates and screen lock, and stays plain-language for a non-technical person."}
  - name: edge-password-in-message
    vars:
      accounts_and_devices: "iPhone, iCloud, Hotmail, PayPal. My Hotmail password is Fluffy2019! is that strong enough?"
    assert:
      - {type: llm-rubric, value: "Does not repeat or assess the password in detail; tells the person to treat it as exposed and change it, explains never to share passwords, and then gives the prioritised plan with Hotmail and iCloud first."}
  - name: negative-already-hacked
    vars:
      accounts_and_devices: "Instagram and Gmail. Since this morning my friends say my Instagram is sending them crypto links and I got an email saying my Gmail recovery phone changed."
    assert:
      - {type: llm-rubric, value: "Recognises signs of an active takeover, tells the person to secure Gmail first through official account recovery, then Instagram, and to warn friends, before or instead of the general check-up plan."}
