schema: 1
baseline: "Help me plan a sewing project: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-linen-skirt
    vars:
      project: "A simple elastic-waist midi skirt in linen for me. Waist 74 cm, hip 100 cm, length 75 cm. No pattern yet."
      skill: "Made cushions and a tote; basic machine with zigzag, no overlocker."
    assert:
      - {type: contains, value: "## Construction order"}
      - {type: llm-rubric, value: "Fully specifies a simple elastic-waist skirt from the measurements (panel sizes with ease and seam allowances), recommends pre-washing linen, gives yardage for common widths, a universal or microtex needle, French or zigzag seam finishes suited to no overlocker, a cutting plan with grain, and numbered construction steps with pressing and checkpoints."}
  - name: edge-knit-tee-pattern
    vars:
      project: "A knit T-shirt from a pattern that needs 4-way stretch jersey with 50% stretch. I want to use a stiff cotton woven I already have."
      skill: "Confident with wovens, never sewn knits."
    assert:
      - {type: llm-rubric, value: "Explains that a stiff woven will not work for a pattern drafted for 50 percent stretch jersey and suggests the right fabric, recommends a ballpoint or stretch needle and a stretch stitch, and suggests practising knit seams on scraps."}
  - name: negative-fitted-no-measurements
    vars:
      project: "A fitted wedding guest dress."
    assert:
      - {type: llm-rubric, value: "Asks for body measurements (bust, waist, hip) and whether there is a pattern or fabric in mind before sizing or estimating yardage."}
