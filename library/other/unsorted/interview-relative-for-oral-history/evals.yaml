schema: 1
baseline: "Give me questions to interview my relative about their life: {{relative_background}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grandmother-migration
    vars:
      relative_background: "My grandmother, 86, grew up in a fishing village in Kerala, India, married at 19, moved to Dubai in 1975 with my grandfather, then to Toronto in 1989. Most comfortable in Malayalam but speaks English. A bit hard of hearing. Lost a baby son in Dubai; the family doesn't talk about it."
      themes: "Village childhood, the moves, food and recipes."
    assert:
      - {type: contains, value: "## Question guide"}
      - {type: contains, value: "## Summary template"}
      - {type: llm-rubric, value: "Includes a plain consent script and agreement on off-limits topics, recording tips adapted for hearing (close placement, quiet room), questions fitted to Kerala village life, Dubai in the 1970s and Toronto with sensory follow-up probes and food and recipe questions, recommends recording in Malayalam if she prefers, handles the lost son as off-limits unless she raises it with guidance to pause and not push, and gives a timestamped summary template."}
  - name: edge-missing-age-and-place
    vars:
      relative_background: "My uncle."
    assert:
      - {type: llm-rubric, value: "Asks for the uncle's approximate age and where he grew up (and maybe themes) in at most three questions and stops."}
  - name: negative-no-leading-or-assumed-history
    vars:
      relative_background: "My grandfather, 79, born in rural Ohio, worked as a farmer and then a school bus driver. Early-stage dementia; better in the mornings."
    assert:
      - {type: llm-rubric, value: "Avoids leading or feeling-assuming questions, does not assume military service or migration, adapts for dementia with short morning sessions, photos or objects as prompts and valuing conversation over accuracy, and suggests including another family member."}
