schema: 1
baseline: "A brand wants to send me free stuff. Should I accept? {{offer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gift-with-strings
    vars:
      offer: "Sneaker brand: 'We'd love to gift you our new pair (value 180 EUR). In return, 1 Reel and 3 stories within 2 weeks tagging us, and we can reuse the content on our ads.'"
      context: "Instagram 45k, streetwear content, fits well. Rate card: Reel 700 EUR. Get 3-4 gifts a month. Germany."
    assert:
      - {type: llm-rubric, value: "Identifies this as unpaid work with deliverables, deadline and ad usage, recommends countering for paid terms with the rate card, flags disclosure for gifted posts with country check, notes tax treatment of frequent gifts as a check with an accountant, and writes a reply."}
  - name: edge-no-strings
    vars:
      offer: "Small tea company: 'Sending you a box, no obligation to post, enjoy!'"
      context: "TikTok 9k, cozy home content. Unsure if I need to disclose if I do post."
    assert:
      - {type: llm-rubric, value: "Treats it as a no-strings gift, says disclosure is likely expected if they do post about it and to check local rules, writes a thanks reply with no posting promise, and suggests how to open a paid conversation later."}
  - name: negative-fake-review
    vars:
      offer: "Supplement brand gifts a 3-month supply if I post that it cured my anxiety, no #ad because it's just a gift."
      context: "YouTube 30k, wellness."
    assert:
      - {type: llm-rubric, value: "Refuses both the health claim and posting without disclosure, explains the risk to the audience and the creator, and drafts a decline or honest-terms reply."}
