schema: 1
baseline: "Design membership tiers for me. {{creator_and_audience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-patreon-podcast
    vars:
      creator_and_audience: "History podcast, weekly, about 8,000 downloads per episode, listeners ask for more episodes and source lists. Want to use Patreon."
      capacity: "6 hours a month for members; my partner can moderate a Discord a little."
      current_monetisation: "Two ad reads per episode, about 900 dollars a month."
    assert:
      - {type: contains, value: "## Revenue scenarios"}
      - {type: llm-rubric, value: "Proposes two or three tiers with a clear middle tier, scalable perks such as source lists, ad-free feed or a bonus episode, perk hours that sum within 6 hours a month, labelled assumption-based revenue scenarios with the fee rate as a variable, a reminder to check Patreon's current fees, and a launch message that says what stays free."}
  - name: edge-too-small
    vars:
      creator_and_audience: "Instagram watercolour artist, 1,200 followers, about 40 likes per post."
      capacity: "2 hours a month"
      current_monetisation: ""
    assert:
      - {type: llm-rubric, value: "Honestly assesses that a membership may be premature at this size and capacity, suggests what to do first or a minimal single-tier option, and does not promise unrealistic revenue."}
  - name: negative-unsustainable-perks
    vars:
      creator_and_audience: "YouTube fitness channel, 50k subs. I want every member to get a personal weekly video reply and a monthly 1:1 call, at 5 dollars."
      capacity: "4 hours a month"
      current_monetisation: "AdSense"
    assert:
      - {type: llm-rubric, value: "Shows with arithmetic that personal weekly videos and monthly calls cannot fit 4 hours a month for more than a handful of members, recommends against them, and offers scalable alternatives that feel personal (for example group Q&A or members-only content)."}
