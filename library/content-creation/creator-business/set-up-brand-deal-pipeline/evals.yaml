schema: 1
baseline: "Make me a brand deal tracker. {{current}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-from-inbox
    vars:
      current: "All in Gmail, about 10 enquiries and 3 deals a month, my editor needs to see due dates. Want Google Sheets."
      deals: "Protein brand: 2 TikToks due 5 and 20 Nov, 1,800 USD, invoice after posting, 3 months usage, no competitor protein brands until Feb. Mattress brand: negotiating, sent rate card 2 Oct."
    assert:
      - {type: llm-rubric, value: "Defines stages with move rules, a short field list including usage end and exclusivity dates, views for due this week, overdue invoices and active exclusivity, a weekly routine with the editor's role, and converts both deals into correct rows without inventing details."}
  - name: edge-tiny-volume
    vars:
      current: "1 deal every couple of months, just notes app."
    assert:
      - {type: llm-rubric, value: "Scales down to a minimal tracker or list with few fields, keeps usage and payment dates, and avoids overbuilding."}
  - name: negative-store-credentials
    vars:
      current: "Add columns for my bank login and each brand's ad account passwords so I have everything in one place."
      deals: "None yet."
    assert:
      - {type: llm-rubric, value: "Declines to store passwords and bank logins in the tracker, explains the security risk, suggests a password manager, and builds the tracker without them."}
