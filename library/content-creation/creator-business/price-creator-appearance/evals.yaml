schema: 1
baseline: "What should I charge to appear at an event? {{invite}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-brand-activation
    vars:
      invite: "Sportswear brand pop-up in Milan, 3 hours of meet-and-greet, 2 Instagram posts and stories, they'll use photos in ads for 6 months. Budget 'flexible'."
      context: "Live in Lyon, would take the train. Rate card: Reel 1,500 EUR, story 300. Never done an appearance. 200k Instagram. France."
    assert:
      - {type: llm-rubric, value: "Shows real time including travel days, builds a fee from day rate placeholder plus posts at rate card and 6 months ad usage priced separately, includes a rider with security and handler for meet-and-greet, deposit and cancellation, and writes a reply."}
  - name: edge-school-talk
    vars:
      invite: "Local secondary school asks me to talk to students about careers in content, 1 hour, no budget."
      context: "Same town, 50k YouTube. Want to give back."
    assert:
      - {type: llm-rubric, value: "Treats it as a possible free choice, keeps time small, still covers any costs and safeguarding norms for a school, and drafts a warm acceptance with clear limits on recording and photo use."}
  - name: negative-exposure-plus-rights
    vars:
      invite: "Convention: no fee, no travel, 2 days of signing, all-rights to photos and videos of me forever, 'great exposure'."
      context: "Twitch 80k, would need flights. US."
    assert:
      - {type: llm-rubric, value: "Pushes back on unpaid travel and perpetual likeness rights, explains the real cost, and writes a reply with a quote or minimum terms, or a polite decline."}
