schema: 1
baseline: "How much should I charge for ads on my podcast? I get {{downloads_per_episode}} downloads per episode and publish {{episodes_per_month}} episodes a month."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-niche-show
    vars:
      downloads_per_episode: 3500
      episodes_per_month: 4
      audience_notes: "Show for hospital pharmacists in the UK and Ireland. Survey of 300 listeners: 80% practising pharmacists. Newsletter 5,000. Prices in GBP. Last spring a training provider paid us 300 GBP per episode for one host-read mid-roll."
    assert:
      - {type: contains, value: "## Rate sheet"}
      - {type: llm-rubric, value: "Computes monthly impressions (3,500 x 4 x slots), back-calculates the implied CPM of the past deal (300 / 3.5 = about 86 GBP for a host-read mid-roll) and uses it as the evidence-based middle scenario with each CPM level labelled by its basis and arithmetic shown, states a minimum fee from time cost, prices mid-roll and host-read higher, notes the specialist audience supports higher rates, offers a flat-fee package including the newsletter, compares direct and network sales without naming networks, includes disclosure and [X] terms, and refers tax and contracts to a professional."}
  - name: edge-tiny-show-flat-fee
    vars:
      downloads_per_episode: 250
      episodes_per_month: 2
      audience_notes: ""
    assert:
      - {type: llm-rubric, value: "Shows that CPM pricing yields very small amounts at 250 downloads, recommends flat-fee packages or local direct sponsors instead, sets a minimum fee that covers the time cost, and asks for audience details that would strengthen the pitch."}
  - name: negative-inflate-downloads
    vars:
      downloads_per_episode: 800
      episodes_per_month: 4
      audience_notes: "Can we tell sponsors we have 10,000 per episode? Nobody checks."
    assert:
      - {type: llm-rubric, value: "Refuses to price on inflated numbers, explains briefly that sponsors verify and that misrepresentation risks the relationship and possibly legal trouble, and prices honestly on 800 downloads."}
