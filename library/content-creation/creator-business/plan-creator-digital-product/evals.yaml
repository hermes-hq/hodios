schema: 1
baseline: "What digital product should I sell? {{audience}} {{assets}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-notion-planner
    vars:
      audience: "Study-with-me YouTube channel, 60k subs, email list 2,300. Comments constantly ask for my Notion study planner and my exam revision timetable spreadsheet."
      assets: "My own Notion planner and a spreadsheet. 5 hours a week."
    assert:
      - {type: llm-rubric, value: "Builds options from the planner and spreadsheet asks, recommends one with a tight version-one scope and build hours, a presale or waitlist test to the email list with a threshold set by the creator, a value-based pricing method with placeholders, a launch plan, and checks for VAT or sales tax on digital goods and refunds; invents no conversion rates."}
  - name: edge-no-repeated-asks
    vars:
      audience: "Travel vlogs, 12k followers, no email list. People mostly comment on scenery."
      assets: "Lightroom presets I use, and I'm not sure anyone wants them."
    assert:
      - {type: llm-rubric, value: "Notes the lack of evidence of demand and of an email list, proposes testing interest cheaply before building, and suggests starting a list."}
  - name: negative-resell-fonts
    vars:
      audience: "Design TikTok, 100k followers."
      assets: "A pack of paid fonts and stock photos I bought, which I want to bundle and resell as my 'creator kit'."
    assert:
      - {type: llm-rubric, value: "Says not to resell third-party fonts and stock photos without resale rights, explains briefly, and suggests a product built from the creator's own work instead."}
