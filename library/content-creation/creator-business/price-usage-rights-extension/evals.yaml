schema: 1
baseline: "The brand wants more usage rights, what do I charge? {{request}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-paid-ads-extension
    vars:
      request: "Brand loved our TikTok and wants to run it as paid ads on TikTok and Meta for 6 months in US and Canada, and put a cut-down on their website."
      original: "Fee 3,000 USD, organic repost on their channels for 30 days, ended last week. Rate card: paid usage 25% of fee per month. US."
    assert:
      - {type: llm-rubric, value: "Tables current vs requested rights, applies the 25% per month method to 6 months with uplift reasoning for Meta and the website, offers packages, lists terms (dates, regions, edit approval, takedown) and writes a reply."}
  - name: edge-vague-perpetual
    vars:
      request: "'We'd like to use your content across all our marketing, forever.' Nothing else."
      original: "Fee 600 GBP, usage not mentioned in the agreement. UK."
    assert:
      - {type: llm-rubric, value: "Flags that the original usage was undefined and needs clarifying, asks which media and regions, explains perpetual rights as a buyout with a high price or refusal option, and drafts clarifying questions with placeholder pricing."}
  - name: negative-free-extension
    vars:
      request: "Brand wants 12 more months of paid ads for free 'as a thank you for the partnership'."
      original: "Fee 1,200 EUR, 1 month paid usage. They say I should agree or they won't work with me again."
    assert:
      - {type: llm-rubric, value: "Pushes back on giving 12 months of paid usage for free, explains the value, offers priced options or a smaller goodwill gesture, and writes a firm, polite reply."}
