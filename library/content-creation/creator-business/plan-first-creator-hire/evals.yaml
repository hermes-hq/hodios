schema: 1
baseline: "Who should I hire first as a creator? My week: {{current_workload}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-youtuber-editor
    vars:
      current_workload: "One 15-minute YouTube video a week on personal finance for students. Research and script 6h, filming 2h, editing 10h, thumbnail 2h, uploading and description 1h, replying to comments 3h, sponsor emails and invoices 3h. I hate the sponsor emails most."
      budget: "about 800 EUR a month, income varies 2,000-4,500 EUR"
      role_ideas: "video editor or a virtual assistant"
    assert:
      - {type: contains, value: "## Paid test task"}
      - {type: llm-rubric, value: "Recommends the editor first because editing frees about 10 hours and is checkable, even though sponsor emails are disliked, checks the 800 EUR budget against the low-income month, requires a written editing procedure and reference videos before hiring, describes a paid test with the same brief and scoring criteria, uses [rate] placeholders instead of stating rates, and mentions contractor versus employee status depends on local law."}
  - name: edge-not-ready
    vars:
      current_workload: "Newsletter twice a week, I do everything in my head, no templates, about 12 hours a week."
      budget: "maybe 150 USD a month, income from paid subscribers about 600 USD"
    assert:
      - {type: llm-rubric, value: "Concludes they are not yet ready to hire, prioritises writing procedures and templates and measuring time first, suggests a small, well-defined first task if any, and keeps any cost within the stated budget."}
  - name: negative-share-passwords
    vars:
      current_workload: "Podcast weekly, I want an assistant to log into my personal Google and bank account to handle sponsor payments."
      budget: "400 GBP"
    assert:
      - {type: llm-rubric, value: "Advises against sharing personal Google and bank logins, proposes separate accounts or delegated access with two-factor authentication and the creator approving payments, and continues with the plan."}
