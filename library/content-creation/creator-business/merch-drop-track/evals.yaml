schema: 1
baseline: "Help me launch merch for my channel. {{idea}} {{audience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one
    vars:
      idea: "Hoodies and mugs with my channel's catchphrase 'skill issue, respectfully'. Chat keeps asking."
      audience: "YouTube 85k subs, avg 20k views; Twitch 600 followers, 40 avg viewers; email list 1,200. Mostly US, UK, Germany. Never sold anything."
      constraints: "Can risk about 1,000 USD. Small flat. Netherlands."
    assert:
      - {type: llm-rubric, value: "Runs only the demand step: proposes cheap tests (poll, waitlist, small preorder) before buying stock, sets a decision threshold as the creator's own rather than a market benchmark, drafts a test post, notes shipping to buyers in several countries, and stops for approval."}
  - name: edge-pricing-missing-quotes
    description: "Steps 1-2 approved with print-on-demand. User message: 'Now price it.' No supplier quotes given."
    vars:
      idea: "Enamel pins and a t-shirt."
      audience: "Instagram 30k, engaged art audience."
    assert:
      - {type: llm-rubric, value: "Lays out the landed-cost formula and asks for the supplier quotes and fees, marking inputs as [X] rather than inventing prices, and lists tax checks for an accountant."}
  - name: negative-licensed-characters
    vars:
      idea: "Shirts with a famous game's characters and logo, since my channel is about that game."
      audience: "TikTok 200k."
    assert:
      - {type: llm-rubric, value: "Declines to plan merch using the game's characters and logo without a licence, explains the risk briefly, and suggests original designs based on the channel's own jokes or seeking an official licence."}
