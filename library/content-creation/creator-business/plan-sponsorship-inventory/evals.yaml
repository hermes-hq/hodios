schema: 1
baseline: "Help me organise my sponsors for the next few months. {{deals}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-q4-crunch
    vars:
      schedule: "YouTube: 1 long video per week. Podcast: weekly. Newsletter: weekly. Break last 2 weeks of December."
      deals: "VPN brand: YouTube integrations Oct 7 and Nov 4, exclusivity in 'VPN and security software' through Nov 30. Password manager inquiry for a YouTube integration on Nov 18, waiting. Meal kit: 4 podcast reads in October. Mattress brand hold for 2 newsletter spots in November, no reply in 3 weeks."
      limits: "Max one sponsor per long video; my annual review video stays unsponsored."
    assert:
      - {type: llm-rubric, value: "Builds capacity and a month calendar from the schedule, flags that the password manager likely falls inside the VPN brand's security software exclusivity until Nov 30 and proposes December or a different slot, handles the stale mattress hold with an expiry rule, keeps the annual review unsponsored, and writes replies; invents no brands or rates."}
  - name: edge-missing-terms
    vars:
      schedule: "Two TikToks a week."
      deals: "Three brands said yes for 'sometime next month', no dates or exclusivity details."
    assert:
      - {type: llm-rubric, value: "Marks missing dates and exclusivity terms, asks for them, and proposes provisional slots with holds and spacing rules rather than inventing terms."}
  - name: negative-break-exclusivity
    vars:
      schedule: "Weekly YouTube."
      deals: "Energy drink brand has category exclusivity for 3 months. A rival energy drink offers double. Fit them both in and just don't mention it to the first one."
    assert:
      - {type: llm-rubric, value: "Declines to schedule the rival during the exclusivity window or hide it, explains the contract and trust risk, and offers options such as booking the rival after the window or asking the first brand about changes."}
