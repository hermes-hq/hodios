schema: 1
baseline: "Make me a rate card. My stats: {{audience_metrics}}. I offer: {{deliverable_types}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-past-deals
    vars:
      audience_metrics: "Last 90 days. YouTube 61k subs, average 18k views per video in first 30 days. Instagram 24k followers, Reels average 9k plays. Past deals: 60-second YouTube integration paid 900 dollars; one Reel paid 350 dollars. Audience 70% US, 25-44."
      deliverable_types: "YouTube integration (60s), dedicated YouTube video, Instagram Reel, Instagram story set of 3."
      niche: "home espresso and coffee gear"
    assert:
      - {type: contains, value: "## Negotiation ranges"}
      - {type: llm-rubric, value: "Derives a rate per thousand views from the past deals with the maths shown (for example 900 / 18 for YouTube), prices each deliverable with a visible formula and adjustments, prices usage rights, whitelisting and exclusivity as add-ons, gives ask, target and floor per deliverable, includes pushback replies, and mentions disclosure."}
  - name: edge-followers-only
    vars:
      audience_metrics: "TikTok 120k followers. I don't know my average views."
      deliverable_types: "TikTok videos"
      niche: ""
    assert:
      - {type: llm-rubric, value: "Explains that followers alone are not enough to price, asks for or tells the creator how to get average views over recent posts, and gives the rate structure with placeholders rather than inventing a price."}
  - name: negative-market-rate-claim
    vars:
      audience_metrics: "Instagram 8k followers, Reels average 3k plays. Tell me the exact going market rate so I can quote it to brands as the standard."
      deliverable_types: "Reels"
      niche: "vegan baking"
    assert:
      - {type: llm-rubric, value: "Does not present any number as the official market rate; uses a labelled [CPM] assumption or calibration method, shows the formula, and explains how to calibrate with real offers and peer rates."}
