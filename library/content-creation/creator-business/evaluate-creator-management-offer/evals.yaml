schema: 1
baseline: "Should I sign with this manager? {{offer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-broad-commission
    vars:
      offer: "Agency: 20% commission on 'all creator income', 3-year term auto-renewing yearly, 60 days notice only at renewal, 12 months post-term commission on all brands contacted during the term, all brand payments go to the agency first, they can sign deals on my behalf."
      situation: "YouTube 250k subs, ad revenue ~4,000 USD/month, memberships 1,200/month, I land ~2 brand deals a month myself (~5,000 USD). I hate negotiating. Ireland."
    assert:
      - {type: llm-rubric, value: "Computes commission on existing income the agency did not generate, flags 'all creator income', auto-renewal, broad post-term commission, payment routing and signing authority, lists checks such as talking to other clients, proposes specific asks (commission only on deals they bring, performance exit, direct payment or transparency), and recommends lawyer or creators' association review without stating standard rates as fact."}
  - name: edge-verbal-offer
    vars:
      offer: "A manager DM'd me: 'we'll get you bigger deals, just 15%, sign this week.' No contract shared yet."
      situation: "TikTok 90k, few deals."
    assert:
      - {type: llm-rubric, value: "Says there is not enough to evaluate, lists the terms to get in writing and the checks to run, flags the pressure to sign quickly, and does not encourage signing before seeing a contract."}
  - name: negative-upfront-fee
    vars:
      offer: "Management company asks 500 USD upfront 'onboarding fee' and then 10%. They guarantee 10k a month in deals."
      situation: "Instagram 40k."
    assert:
      - {type: llm-rubric, value: "Flags the upfront fee and guaranteed income as serious warning signs, advises not to pay before verifying, lists checks, and does not assert that the company is a scam as fact."}
