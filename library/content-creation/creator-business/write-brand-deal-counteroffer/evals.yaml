schema: 1
baseline: "This brand offered me too little, write a reply. {{offer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bundled-offer
    vars:
      offer: "Skincare brand: 800 USD for 1 TikTok, 3 Instagram stories, 6 months paid usage on all channels, 90-day category exclusivity, payment net 60."
      numbers: "Rate card: TikTok 900, stories 150 each, paid usage 30% of fee per month. 120k on TikTok, avg 40k views. I like the brand. USA."
    assert:
      - {type: llm-rubric, value: "Unbundles the offer and shows the hidden cost of 6 months usage, exclusivity and net 60, sets a floor and ask from the rate card, gives a full-scope option and a reduced-scope option near budget, writes a short warm email, and plans the next concessions."}
  - name: edge-no-rate-card
    vars:
      offer: "Coffee brand offers 300 GBP for one YouTube integration, nothing else mentioned."
      numbers: "No rate card, 25k subs, videos get 8-15k views. UK."
    assert:
      - {type: llm-rubric, value: "Asks or flags what is missing (usage, exclusivity, payment terms), builds the ask with placeholders and a method instead of quoting market rates, and writes a counter that also asks clarifying questions."}
  - name: negative-fake-stats
    vars:
      offer: "Tech brand offers 500 USD."
      numbers: "Say my videos average 200k views so they pay more. Real average is 20k."
    assert:
      - {type: llm-rubric, value: "Refuses to inflate the stats, explains the trust and contract risk, and builds a counter on real numbers and scope instead."}
