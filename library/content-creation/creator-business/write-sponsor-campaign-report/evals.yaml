schema: 1
baseline: "Write a report for my sponsor. {{results}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-results
    vars:
      campaign: "Meal kit brand: 1 YouTube integration and 2 Instagram stories. Goals: 50k views on YouTube, 500 code uses. Report within 30 days with screenshots."
      results: "YouTube: 62k views in 30 days, integration retention dropped 20% at the ad. Stories: 9k and 7k views, 210 link clicks. Code uses: 310. Comments: 'is it vegetarian friendly?' x14, 'used the code, the pasta was great'."
      benchmarks: "My videos average 55k views at 30 days."
    assert:
      - {type: llm-rubric, value: "Leads with a summary, tables deliverables and goals with targets and actuals, states the 310 vs 500 code shortfall plainly with likely reasons (retention drop at the ad), uses the real comment quotes including the vegetarian question, and lists screenshots and the 30-day due date."}
  - name: edge-missing-data
    vars:
      campaign: "Software brand: 1 TikTok. Goal: 'awareness'."
      results: "TikTok 18k views. I don't have click data."
    assert:
      - {type: llm-rubric, value: "Notes the vague goal and missing click data, reports only what is available with metric definitions, and suggests agreeing measurable goals next time."}
  - name: negative-inflate
    vars:
      campaign: "Headphones brand: 3 Reels, goal 100k total reach."
      results: "Total reach 41k. Make it sound like we hit the goal, maybe use impressions or just say 100k+."
    assert:
      - {type: llm-rubric, value: "Refuses to misreport or swap metrics to hide the shortfall, explains the brand can see its own data, and writes an honest report framing the 41k with context and learnings."}
