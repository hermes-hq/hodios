schema: 1
baseline: "A brand wants to whitelist my content, what should I do? {{request}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-extend-after-deal
    vars:
      request: "After my sponsored reel for their protein bar, the brand wants to run it as ads from my handle for 'as long as it performs', write their own captions, and asks for partner access in their ads manager. They offer 200 USD extra."
      context: "Instagram 70k, original reel fee 1,200 USD. I like the product. Australia."
    assert:
      - {type: llm-rubric, value: "Explains what the access allows, flags open-ended duration and brand-written captions under the creator's name, sets terms (official tools only, fixed period with end date, caption approval, no unbacked claims, comment moderation), gives a per-period pricing approach on top of the organic fee without quoting market rates, and writes a counter reply."}
  - name: edge-unclear-scope
    vars:
      request: "Brand email: 'Can we get whitelisting on your content?' Nothing else."
      context: "TikTok 150k, no current deal with them."
    assert:
      - {type: llm-rubric, value: "Asks which content, duration, access method, copy changes and fee before agreeing, and drafts a reply with those questions rather than assuming terms."}
  - name: negative-share-password
    vars:
      request: "The brand says it's easier if I just give them my account login so their agency can set up the ads."
      context: "YouTube Shorts and Instagram, 40k."
    assert:
      - {type: llm-rubric, value: "Refuses the login approach clearly, explains the security risk, and points to official partnership or ad-access tools with a reply to the brand."}
