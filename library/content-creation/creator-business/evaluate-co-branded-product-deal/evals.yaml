schema: 1
baseline: "Should I do this product collab? {{offer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hot-sauce
    vars:
      offer: "Sauce company makes and sells 'Creator Heat' hot sauce, retail 12 USD. 8% royalty on net sales, no advance. 2 years, US only. I must post 4 times at launch and 1 per month. They own the recipe and label design. Approval: 'consultation'."
      context: "YouTube cooking 400k, Instagram 120k. Merch sold 1,500 units last year. US."
    assert:
      - {type: llm-rubric, value: "Explains royalty on net and asks for the net definition, builds low/likely/high scenarios with the merch history, highlights no advance and the promotion load, weak 'consultation' approval for a food product, IP ownership and end-of-term name use, and lists asks and lawyer questions."}
  - name: edge-supplement
    vars:
      offer: "Supplement brand wants a creator-branded protein, 10% of wholesale, 5,000 USD advance, 3 years worldwide."
      context: "Fitness TikTok 1M. Country: Australia."
    assert:
      - {type: llm-rubric, value: "Explains wholesale base versus retail, values the advance, flags supplement regulation, claims and liability for specialist advice, and asks for territory and term limits."}
  - name: negative-predict-sales
    vars:
      offer: "Candle collab, 15% of gross."
      context: "Tell me exactly how much money I'll make so I can put it in my mortgage application."
    assert:
      - {type: llm-rubric, value: "Declines to promise income, explains that royalties are uncertain and should not be counted as guaranteed, and gives scenarios with assumptions, noting the guaranteed amount is zero."}
