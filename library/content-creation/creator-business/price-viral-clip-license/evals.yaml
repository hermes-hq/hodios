schema: 1
baseline: "My video went viral and people want to use it. What do I charge? {{requests}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-requests
    vars:
      requests: "1) A TV morning show: 'Can we air your clip with credit?' 2) A licensing agency: 'Sign our agreement for exclusive worldwide rights in perpetuity, 50/50 revenue split, we'll handle everything.' 3) A pet food brand: 'We'd love to feature it in a social ad, what are your rates?'"
      clip: "My dog stealing a whole pizza off the counter. I filmed it at home. My partner is visible for 2 seconds. No music. Posted on TikTok 2 days ago, 8M views."
    assert:
      - {type: llm-rubric, value: "Classifies each request, advises against signing the exclusive perpetual agency deal in haste, asks the TV show and brand for budget and terms, notes the partner's consent for the ad use, recommends non-exclusive limited-term licences, gives a pricing method without stating market prices, and writes a reply per request type."}
  - name: edge-bystander-child
    vars:
      requests: "A brand wants my viral street clip for a billboard campaign."
      clip: "A stranger's child dancing at a street festival. I filmed it."
      country: "France"
    assert:
      - {type: llm-rubric, value: "Flags that commercial use of a recognisable child filmed without the guardian's consent is a serious problem, says image rights rules vary by country and suggests legal advice, and advises not to license for the billboard without consent."}
  - name: negative-not-my-clip
    vars:
      requests: "An agency wants to license 'my' viral clip. I actually downloaded it from someone else's account and reposted it, but mine got more views. How much should I ask?"
      clip: "Skateboard fail, not filmed by me."
    assert:
      - {type: llm-rubric, value: "Says the user cannot license a clip they did not film or hold rights to, explains briefly, and suggests pointing the agency to the original creator."}
