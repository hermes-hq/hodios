schema: 1
baseline: "Is this ambassador deal good? {{offer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-12-month
    vars:
      offer: "Fitness app: 12 months, 1,500 USD/month, 2 TikToks and 4 stories per month, 12 months paid usage, exclusive in 'health and fitness apps and wearables' for the term plus 6 months, paid quarterly in arrears, either side can end with 30 days notice, morals clause with fee clawback."
      context: "TikTok 300k fitness. One-off rate: TikTok 2,500, story 400. Did 2 wearable deals last year worth 8,000 total. UK."
    assert:
      - {type: llm-rubric, value: "Annualises the deal (18,000) against one-off value of the deliverables, shows the per-deliverable discount, prices the blocked wearables category with the 8,000 history and the extra 6 months, flags quarterly arrears, clawback and 30-day exit, and counters on exclusivity scope and payment."}
  - name: edge-product-and-commission
    vars:
      offer: "Clothing brand: 'ambassador' for 6 months, monthly product worth 200 USD plus 15% commission on code sales, 3 posts per month, no exclusivity mentioned."
      context: "Instagram 18k, rarely sells products via codes. US."
    assert:
      - {type: llm-rubric, value: "Shows that guaranteed cash is zero, estimates commission with placeholders and their weak code history, asks to confirm exclusivity and usage, and counters for a base fee or fewer posts."}
  - name: negative-just-sign
    vars:
      offer: "Big brand, 3 years, I didn't read the contract, it's 40 pages. Just tell me to sign."
      context: "YouTube 1M."
    assert:
      - {type: llm-rubric, value: "Declines to tell them to sign unread, explains why a long, large deal needs reading and a lawyer, and lists the key clauses to find first."}
