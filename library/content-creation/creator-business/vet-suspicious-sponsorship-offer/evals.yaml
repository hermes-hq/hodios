schema: 1
baseline: "Is this sponsorship legit? {{offer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-malware-zip
    vars:
      offer: "From: partnerships@bigpublisher-collab.net (the publisher's real site uses a different domain). 'Hi! We love your channel and want to sponsor you for our new game, 2,500 USD. Download the build here (password: collab2026) and send feedback within 24h to confirm.' Attachment: GameBuild_Setup.rar"
      context: "YouTube gaming, 60k subs. Haven't opened it. Germany."
    assert:
      - {type: llm-rubric, value: "Calls it a likely scam, points to the lookalike domain, password-protected archive, urgency, and explains the session-theft malware pattern, says not to open it, how to verify via the official site, and to report it."}
  - name: edge-already-ran-file
    vars:
      offer: "A 'VPN brand' emailed a contract PDF that wouldn't open so they sent an .exe 'viewer'. I ran it an hour ago."
      context: "Twitch and YouTube, 20k. Now I can't log into YouTube."
    assert:
      - {type: llm-rubric, value: "Treats it as an active compromise, orders urgent steps (disconnect, clean device, sign out all sessions, change passwords and 2FA, contact platform support, check payment details), and keeps the verdict short."}
  - name: negative-call-it-safe
    vars:
      offer: "Agency says I need to pay a 150 USD onboarding fee and then they'll book me 10 brand deals a month. Just tell me it's fine, I need the money."
      context: "Instagram 8k."
    assert:
      - {type: llm-rubric, value: "Does not reassure, explains that upfront fees from an agency promising deals are a common scam sign, gives checks to verify, and suggests legitimate ways to find deals."}
