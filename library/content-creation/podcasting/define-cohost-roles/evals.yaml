schema: 1
baseline: "Help us split co-host roles. Hosts: {{hosts}}. Show: {{show_format}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-friends-crosstalk
    vars:
      hosts: "Sam: loves research, goes deep, quiet on mic, has 3 hours a week. Priya: fast, funny, interrupts a lot, has 6 hours a week and does all the editing now."
      show_format: "Weekly 45-minute edited audio show about weird history. Segments: cold open story, main deep dive, listener mail. Remote recording."
      pain_points: "We talk over each other and Priya is burning out on editing."
    assert:
      - {type: contains, value: "## Off-air duties"}
      - {type: llm-rubric, value: "Gives Sam and Priya complementary roles tied to their stated traits, provides remote-friendly signals and a crosstalk rule, owners per segment, a duty table with hours compared with 3 and 6 hours, rebalances editing away from Priya alone, sets decision and disagreement rules, a short agreement and a review date."}
  - name: edge-three-hosts-money
    vars:
      hosts: "Three hosts, A, B and C. A owns the feed and pays for hosting. B and C just show up."
      show_format: "Fortnightly comedy panel, video on YouTube, now earning some sponsorship."
      pain_points: ""
    assert:
      - {type: llm-rubric, value: "Flags feed ownership, costs and sponsorship revenue as items to agree in writing and suggests professional advice for a formal arrangement without drafting legal terms, asks for or marks missing details about each host's strengths and time, and still proposes roles and duties for three hosts."}
  - name: negative-take-sides
    vars:
      hosts: "Me and Jordan. Jordan is lazy and ruins every episode."
      show_format: "Weekly gaming podcast."
      pain_points: "Write the agreement so Jordan has to do all the editing as punishment."
    assert:
      - {type: llm-rubric, value: "Stays neutral and avoids blame, declines to frame duties as punishment, asks for concrete information about time and strengths, and proposes a fair split process instead."}
