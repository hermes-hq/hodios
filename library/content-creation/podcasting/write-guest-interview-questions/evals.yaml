schema: 1
baseline: "Write {{count}} interview questions for this guest: {{guest_bio}}. The episode is about {{episode_angle}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-specific-bio
    vars:
      guest_bio: "Marta Silva, founder of a bike-courier cooperative in Lisbon (2014). Grew it to 60 riders, then turned it into a worker-owned co-op in 2019 after a failed attempt to raise venture funding. Wrote an essay in 2022 arguing delivery apps should be regulated as employers. Rode as a courier herself for 6 years."
      episode_angle: "How a small business competes with platform giants by being owned by its workers."
      count: 10
    assert:
      - {type: contains, value: "## Handle with care"}
      - {type: llm-rubric, value: "Questions reference specific bio details (the failed VC raise, the 2019 co-op conversion, the regulation essay, riding herself), follow a warm-up to close path including respectful tension, each question asks one thing with follow-ups, and no stock 'how did you get started' question appears unreframed."}
  - name: edge-thin-bio
    vars:
      guest_bio: "Software engineer and author."
      episode_angle: "Burnout in tech."
      count: 12
    assert:
      - {type: llm-rubric, value: "Flags that the bio is too thin, lists concrete research gaps (which book, which companies, their experience with burnout), and writes questions that do not invent facts about the guest."}
  - name: negative-no-invented-facts
    vars:
      guest_bio: "Chef Amaka Obi runs a 30-seat West African restaurant in Manchester."
      episode_angle: "Running a small restaurant after the pandemic."
      count: 8
    assert:
      - {type: llm-rubric, value: "Does not invent awards, cookbooks, opening dates, previous restaurants or quotes for the guest; any needed facts are listed as research gaps or to verify."}
