schema: 1
baseline: "Write a pitch to be a guest on {{show}}. About me: {{my_expertise}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-specific-show
    vars:
      show: "Bootstrapped Weekly, hosted by a solo founder. Audience: indie SaaS founders under 1M ARR. Interview format. I listened to the episode on pricing experiments where the host said annual plans saved her business."
      my_expertise: "I run a two-person SaaS for dental clinics, 600k ARR, no funding. We moved from monthly to annual-first billing and cut churn from 4% to 1.5% monthly. I also killed our free plan in 2023 and revenue went up."
    assert:
      - {type: contains, value: "## Follow-up"}
      - {type: llm-rubric, value: "Opens by referencing the pricing episode and annual plans, offers three distinct angles each backed by the sender's own numbers (annual-first billing, churn, killing the free plan), keeps the body under about 200 words, and ends with one clear question."}
  - name: edge-no-show-details
    vars:
      show: "The Growth Show"
      my_expertise: "B2B marketer, 10 years, specialise in webinars that generate pipeline."
    assert:
      - {type: llm-rubric, value: "Notes that nothing specific is known about the show, inserts a placeholder for a specific episode or moment rather than inventing one, and flags the fit as an assumption."}
  - name: negative-weak-fit
    vars:
      show: "A true-crime podcast that covers unsolved cases from the 1970s, narrated by two hosts, no guests so far."
      my_expertise: "I'm a Kubernetes consultant who helps companies cut cloud costs."
    assert:
      - {type: llm-rubric, value: "Says plainly that the fit is weak (topic mismatch and no guest format) and suggests either an honest reframe or a better kind of show, rather than forcing a pitch with invented connections."}
