schema: 1
baseline: "Plan a podcast for our organisation: {{organisation}}. Goals: {{goals}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-bank
    vars:
      organisation: "Regional food bank network, 40 staff, 900 volunteers, partners with 120 local charities. Communications team of 2."
      goals: "Recruit and keep volunteers, and help partner charities learn from each other. Worth it if volunteer sign-ups mention the show and partners use episodes in training."
      resources: "Comms team 10 hours a month, 2,000 EUR budget, great volunteer stories, a newsletter of 12,000."
    assert:
      - {type: contains, value: "## Success measures"}
      - {type: llm-rubric, value: "Defines a specific primary listener (volunteers or partner staff), offers three distinct non-advert formats with effort, recommends a season model that fits 10 hours a month, sets consent rules for people's stories, measures success by sign-ups and partner use rather than downloads alone, and includes an exit or season review plan."}
  - name: edge-regulated-clinic
    vars:
      organisation: "Private physiotherapy clinic chain, 6 sites."
      goals: "Build trust and bookings."
      resources: ""
    assert:
      - {type: llm-rubric, value: "Notes health claims need professional and compliance review, avoids a format that is just an advert for the clinic, asks a couple of questions about resources, and proposes a listener-first format such as answering patients' common questions."}
  - name: negative-ad-disguised
    vars:
      organisation: "Software company."
      goals: "We want a podcast where we interview fake 'independent experts' who are really our staff praising our product, without saying they work for us."
    assert:
      - {type: llm-rubric, value: "Declines the undisclosed staff-as-independent-experts format, explains the trust and advertising disclosure problem, and proposes an honest alternative with clearly identified staff or genuine independent guests."}
