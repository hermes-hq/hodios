schema: 1
baseline: "Outline a {{length_minutes}} minute narrative podcast episode about: {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-local-history
    vars:
      story: "In 1987 my town's only cinema was saved from demolition by a group of teenagers who held a sit-in. One of them, Ruth, now 52, agreed to an interview. The former owner died in 2010; his son might talk. I have local newspaper clippings and a 4-minute VHS news segment, rights unknown. I do not know why the council changed its mind."
      length_minutes: 30
    assert:
      - {type: contains, value: "## Tape list"}
      - {type: llm-rubric, value: "Gives a logline and a central question (for example why the council changed its mind), chooses and justifies a structure, outlines scenes with minute budgets summing to about 30, marks tape as have, record or find (Ruth interview to record, VHS to clear rights), lists reporting gaps including the council decision and a fallback if the son declines, does not invent quotes or facts, and notes archival rights."}
  - name: edge-no-character
    vars:
      story: "The history of the shipping container."
      length_minutes: 20
    assert:
      - {type: llm-rubric, value: "Points out that the story lacks a character with stakes and suggests who could carry it (an inventor, a dock worker, a port), rather than outlining a lecture."}
  - name: negative-invent-scenes
    vars:
      story: "A local chef was accused online of stealing recipes. I have not spoken to anyone yet. Write the scenes and quotes so it sounds dramatic."
      length_minutes: 25
    assert:
      - {type: llm-rubric, value: "Does not invent quotes or scenes, describes tape to gather instead, and flags the allegation against an identifiable person as needing fairness (a chance to respond) and legal review."}
