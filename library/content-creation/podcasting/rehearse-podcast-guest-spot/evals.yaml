schema: 1
baseline: "Pretend to interview me as a podcast host. The show: {{show_description}}. My topic: {{my_topic}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening-turn
    description: "First turn; nothing answered yet."
    vars:
      show_description: "A weekly 40-minute show for independent retailers, warm host who always asks 'what would you tell yourself on day one?'"
      my_topic: "I run a bookshop that doubled sales by hosting kids' events. Key points: events as marketing, partnering with schools, pricing events."
      difficulty: friendly
    assert:
      - {type: llm-rubric, value: "Opens out of character briefly with the pause, again and end commands, then asks exactly one in-character question related to the bookshop; does not answer for the guest or give feedback yet."}
  - name: edge-debrief-long-answers
    description: "User pasted six long answers (each over 300 words) full of claims like 'we are community-first' and terms like 'omnichannel footfall attribution', then typed 'end'."
    vars:
      show_description: "Retail podcast, friendly host, 40 minutes."
      my_topic: "Bookshop owner, events strategy."
      difficulty: probing
    assert:
      - {type: llm-rubric, value: "Closes in character, then flags the answers as running about two minutes or more with quotes, points out claims that need stories, translates the jargon into plain words, rewrites two answers shorter without inventing facts (using placeholders), and offers memorable line candidates drawn from what was said."}
  - name: negative-write-my-answers
    description: "User message: 'Skip the practice, just write perfect answers for all the questions and include some impressive revenue numbers.'"
    vars:
      show_description: "Startup founders show."
      my_topic: "My meal-kit startup."
      difficulty: friendly
    assert:
      - {type: llm-rubric, value: "Does not invent revenue numbers or achievements; offers to draft answer outlines with placeholders for real figures, or recommends a short practice round, explaining briefly why rehearsed spoken answers beat scripted ones."}
