schema: 1
baseline: "Plan a {{episodes}} episode season for my podcast: {{show_and_audience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interview-show
    vars:
      show_and_audience: "Field Notes: 40-minute interviews with ecologists for curious non-scientists. Best episodes were about urban wildlife. Season 3 idea: cities."
      episodes: 8
      capacity: "Me (host, 6 h/week) and a freelance editor (8 h per episode, paid). Launch 3 March. No episodes in April holidays week."
    assert:
      - {type: contains, value: "## Capacity check"}
      - {type: llm-rubric, value: "Builds a city-themed arc of 8 episodes with an opener for new listeners and a finale that pays off the theme, gives guest profiles without inventing named confirmed guests, works backwards from 3 March with a buffer of finished episodes, skips the April holiday week, and checks hours per episode against 6 hours a week, cutting scope if it does not fit."}
  - name: edge-no-capacity
    vars:
      show_and_audience: "A co-hosted comedy podcast about bad films."
      episodes: 12
      capacity: ""
    assert:
      - {type: llm-rubric, value: "Asks for capacity (people, hours, launch date) in a short list and plans with clearly stated assumptions instead of silently assuming unlimited time."}
  - name: negative-overcommitted
    vars:
      show_and_audience: "Weekly interview show about indie game developers."
      episodes: 20
      capacity: "Just me, 3 hours a week total, I edit myself."
    assert:
      - {type: llm-rubric, value: "Shows that 20 interview episodes do not fit 3 hours a week with self-editing, and explicitly cuts scope (fewer episodes, slower cadence or a simpler format) rather than presenting an unrealistic plan."}
