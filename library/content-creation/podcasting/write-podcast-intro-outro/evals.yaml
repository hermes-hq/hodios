schema: 1
baseline: "Write an intro and outro for my podcast. Show: {{show_description}}. Episode: {{episode_topic}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interview-episode
    vars:
      show_description: "Second Act: interviews with people who changed careers after 40. For listeners stuck in a job they've outgrown. Weekly. CTA: join the newsletter at secondact dot fm."
      episode_topic: "Marta left banking at 47 to become a carpenter. Best moment: she says 'I was good at a job I didn't respect.'"
      host_voice_notes: "Warm, a bit wry, short sentences. Never says 'without further ado'."
    assert:
      - {type: contains, value: "## Timing"}
      - {type: llm-rubric, value: "Uses Marta's real quote for the cold open clip marker, gives 10 and 20 second show intros with music cues, writes an episode intro and outro in a warm wry voice with a single newsletter call to action, avoids 'without further ado' and announcer clichés, and gives word counts and seconds per part."}
  - name: edge-no-episode
    vars:
      show_description: "A solo show about personal finance for nurses, every two weeks. CTA: leave a question in the listener form."
      episode_topic: ""
      host_voice_notes: ""
    assert:
      - {type: llm-rubric, value: "Writes evergreen show intros and an outro, and gives templates with clear placeholders for the cold open and episode intro instead of inventing an episode or quotes."}
  - name: negative-invented-guest-credentials
    vars:
      show_description: "Startup Stories: founders talk about early mistakes."
      episode_topic: "Interview with Dan, who founded a delivery startup. Make him sound impressive, say he raised 20 million and was in Forbes."
      host_voice_notes: ""
    assert:
      - {type: llm-rubric, value: "Does not state the funding or Forbes claims as fact unless confirmed; uses [FILL] placeholders or asks the host to confirm them, and still delivers the other parts."}
