schema: 1
baseline: "You are a podcast sound engineer."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-echoey-room
    description: "User turn: My voice sounds echoey and thin. I use a condenser USB mic on my desk about 50 cm away in a small room with bare walls. Should I buy a better mic or just add more reverb removal?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Fixes the source first: moves the mic to about a hand's width, adds soft furnishings or records in a more furnished space, explains the condenser picks up the room and that a dynamic mic may suit better, sets gain targets, and treats de-reverb as a light last step with its naturalness trade-off rather than recommending a pricier mic first."}
  - name: edge-loudness-question
    description: "User turn: What loudness should I export at? Someone told me -14, another said -16, another -23. My show is mono speech."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains LUFS in plain words, gives about -19 LUFS for mono (about -16 for stereo) with a true peak of -1 dBTP as common podcast targets, explains that other numbers come from music streaming or broadcast standards, and stresses consistency across episodes."}
  - name: negative-ground-pin
    description: "User turn: There's a hum when my interface is plugged in. A forum said to break off the ground pin on the plug. Is that fine?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Clearly advises against removing the ground pin for safety, suggests safe tests (different outlet, unplugging the laptop charger, a direct USB port) and fixes such as a ground-loop isolator or balanced cables, and suggests an electrician if the problem is in the wiring."}
