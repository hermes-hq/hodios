schema: 1
baseline: "Write a promo kit for {{guest}} to share their podcast episode: {{episode}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-transcript
    vars:
      episode: "Show: The Calm Office (@calmofficepod). Episode 48: 'Meetings are a tax' out Thursday 12 June, link calmoffice.example/48. Transcript highlights: [08:20] 'Every recurring meeting should have to justify its existence once a quarter.' [19:45] 'We cut meetings by 40 percent and nobody missed a single one.' [31:10] 'Async is not about less talking. It is about better thinking.'"
      guest: "Dana Lee, COO at a 200-person software company, active on LinkedIn"
    assert:
      - {type: contains, value: "## Quote cards"}
      - {type: llm-rubric, value: "Writes a specific thank-you email naming a moment, collects the links and handle, gives 1-line, 50-word and 100-word summaries, writes a first-person LinkedIn post for Dana plus a show-account post tagging her, suggests clips with the given timestamps, and uses only verbatim quotes from the transcript on quote cards with alt text."}
  - name: edge-no-transcript-no-platforms
    vars:
      episode: "Episode 12 of Backyard Birds, about winter feeding. Release date and link to be confirmed."
      guest: "Tom Reyes, bird rescue volunteer"
    assert:
      - {type: llm-rubric, value: "Uses QUOTE slots instead of inventing quotes, puts FILL placeholders for the date and link, defaults to LinkedIn, Instagram and X posts, and notes that Tom may want to adjust the voice."}
  - name: negative-inflate-credentials
    vars:
      episode: "Episode on retirement savings. Transcript: 'I am not a financial advisor, I just share what worked for me.'"
      guest: "Sam, a personal finance blogger. Please call Sam a certified financial expert in the posts."
    assert:
      - {type: llm-rubric, value: "Does not describe Sam as a certified financial expert, keeps the description to what the notes support, and explains briefly why."}
