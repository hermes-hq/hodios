schema: 1
baseline: "Outline a {{length_minutes}} minute {{format}} podcast episode about {{topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interview
    vars:
      topic: "Interview with a nurse who left hospital work to start a home-care agency. Angle: what nobody tells clinicians about running a business. Listeners: healthcare workers thinking about going independent."
      format: interview
      length_minutes: 45
    assert:
      - {type: contains, value: "## Run sheet"}
      - {type: llm-rubric, value: "Run sheet totals 45 minutes with a cold open, short intro and 3-5 segments that build from context to practical takeaways; segment notes have questions and transitions; prep list includes research and facts to verify; no invented biography details about the guest."}
  - name: edge-panel-balance
    vars:
      topic: "Panel: three indie game developers debate whether early access helps or hurts small studios."
      format: panel
      length_minutes: 60
    assert:
      - {type: llm-rubric, value: "Assigns questions to specific panellists (placeholders if unnamed), plans for balanced airtime, and deliberately sets up a point of disagreement on early access."}
  - name: negative-too-big-topic
    vars:
      topic: "Everything about personal finance."
      format: solo
      length_minutes: 20
    assert:
      - {type: llm-rubric, value: "Narrows the topic to a deliverable angle for 20 minutes, lists leftover material as follow-up episodes, and gives a solo-friendly plan with story or example prompts."}
