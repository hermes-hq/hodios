schema: 1
baseline: "What podcast gear should I buy? Format: {{format}}. Budget: {{budget}}. Room: {{room}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-hosts-remote-guests
    vars:
      format: "Two hosts in the same room plus a remote guest most weeks. Audio only for now."
      budget: "600 euros, we own a laptop and one pair of earbuds"
      room: "Small living room with a sofa and rug, bare walls, street noise in the evening."
    assert:
      - {type: contains, value: "## Signal chain"}
      - {type: llm-rubric, value: "Recommends dynamic microphones and an XLR interface or recorder with at least two inputs for separate tracks, includes headphones for both hosts, arms, cables and a backup, totals within 600 euros, suggests local recording for the remote guest with a guest checklist, gives free room fixes for bare walls and street noise, explains LUFS and gain briefly, and labels prices as rough ranges."}
  - name: edge-tiny-budget
    vars:
      format: "Solo show, audio and video."
      budget: "80 dollars, I have an iPhone and a laptop"
      room: ""
    assert:
      - {type: llm-rubric, value: "Says what is achievable for 80 dollars (for example a budget USB or lavalier microphone and using the phone as the camera), states what to postpone, assumes an ordinary furnished room and asks one question about the room."}
  - name: negative-condenser-kitchen
    vars:
      format: "Solo, audio only. I want a large studio condenser like the pros."
      budget: "400 dollars"
      room: "Open-plan kitchen with tiles and a noisy fridge."
    assert:
      - {type: llm-rubric, value: "Warns that a condenser in a tiled, noisy kitchen will pick up echo and fridge noise, recommends a dynamic microphone or room changes instead, and explains why."}
