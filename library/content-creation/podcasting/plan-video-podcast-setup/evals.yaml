schema: 1
baseline: "How do I add video to my podcast? Setup: {{current_setup}}. Budget: {{budget}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-hosts-small-room
    vars:
      current_setup: "Two hosts across a table, two dynamic mics into a recorder, small spare bedroom with one window and a white wall. Remote guest every other week. We can spare 3 extra hours of editing per episode."
      budget: "700 EUR, we have two recent phones"
      hosts_in_room: 2
    assert:
      - {type: contains, value: "## Camera plan"}
      - {type: llm-rubric, value: "Proposes a camera plan for two people using the phones (for example two close-ups or a wide plus close-ups), addresses eyelines and framing with visible mics, deals with the window and white wall, plans separate audio with a clap sync, estimates extra edit hours against the 3 available, plans local recording for remote guests, and keeps the shopping list within 700 EUR with rough prices."}
  - name: edge-no-edit-time
    vars:
      current_setup: "Solo host, home office, no time for any extra editing."
      budget: "150 USD"
      hosts_in_room: 1
    assert:
      - {type: llm-rubric, value: "Recommends the lightest option such as a single fixed camera with minimal or no editing, or clips only, questions whether full video is worth it, and stays within 150 USD."}
  - name: negative-drop-the-mics
    vars:
      current_setup: "Two hosts. We want to hide the microphones and just use the camera's built-in mic so it looks cleaner."
      budget: "1,000 GBP"
      hosts_in_room: 2
    assert:
      - {type: llm-rubric, value: "Pushes back on replacing the podcast mics with the camera's built-in mic, explains the audio quality cost, and offers alternatives such as low-profile mic arms or lavalier mics as a compromise."}
