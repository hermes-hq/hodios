schema: 1
baseline: "Write show notes for this podcast episode: {{transcript}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-detailed-interview
    vars:
      show_name: The Small Kitchen Podcast
      style: detailed
      transcript: |
        [00:00] HOST: Welcome. My guest today is Priya Raman, who ran a pastry kitchen for twelve years before starting a bakery consultancy.
        [01:30] PRIYA: The biggest mistake new bakeries make is pricing from competitors instead of from their own costs. Um, you know, you have to know your cost per croissant.
        [08:10] PRIYA: Labour is the cost people forget. If a laminated dough takes three days, you're paying for three days.
        [15:45] HOST: What about waste?
        [15:52] PRIYA: Waste is a menu problem, not a staff problem. Fewer items, baked more often.
        [24:00] PRIYA: I always tell people to read "The Bread Baker's Apprentice" and to track every gram for a month.
        [31:20] HOST: Where can people find you? PRIYA: My site is priyaraman-consulting dot com.
    assert:
      - {type: contains, value: "## Quotable lines"}
      - {type: llm-rubric, value: "Summary names Priya Raman and her stated credential and the pricing/cost idea; timestamps match the transcript; quotes are verbatim (filler removed only with ellipsis) with speaker and timestamp; the book is listed with [LINK NEEDED] or no fabricated URL; the spoken website is listed as stated and flagged to confirm."}
  - name: edge-brief-no-timestamps
    vars:
      show_name: ""
      style: brief
      transcript: "Today I want to talk about why I stopped using to-do lists and switched to a calendar-first system. The short version: lists don't know how long things take. A calendar forces you to admit what fits. I block the first two hours for deep work and batch email at 11 and 4."
    assert:
      - {type: llm-rubric, value: "Produces brief notes (summary, three takeaways, resources) under about 150 words, omits or explains the missing timestamps rather than inventing them, and does not invent a show name."}
  - name: negative-no-fabricated-quotes
    vars:
      show_name: Founders Unfiltered
      style: detailed
      transcript: "[00:00] HOST: Quick solo episode. I think most startups should charge from day one. Free users give you polite feedback; paying users give you real feedback."
    assert:
      - {type: llm-rubric, value: "Only quotes words actually in the transcript, does not invent a guest, extra timestamps or resources, and keeps the notes proportional to the short source."}
