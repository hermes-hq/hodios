schema: 1
baseline: "Write a {{length_minutes}} minute solo podcast episode script from this: {{outline_or_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-word-for-word-from-outline
    vars:
      outline_or_notes: "Episode: why I stopped using a to-do app. For overwhelmed freelancers. Run sheet: hook (my 214 overdue tasks, the morning I gave up) 1 min; why lists fail 4 min (they only grow, busy feels like progress); what I do now 6 min (three things on paper each morning, a Friday review); close 1 min, CTA: reply to the newsletter with your three for tomorrow."
      length_minutes: 12
      script_style: word-for-word
      host_voice: "Dry, short sentences, says 'look' when making a point. Never says 'hustle'."
    assert:
      - {type: contains, value: "## Read-aloud notes"}
      - {type: llm-rubric, value: "Keeps the supplied segment order and timings, opens on the 214 overdue tasks with no greeting before it and places [SHOW INTRO] after the hook, writes short spoken sentences in a dry voice that uses 'look' and never 'hustle', marks pauses and stress, signposts and recaps each segment, closes with a callback and the single newsletter call to action, and states a word count near 1,800 (12 minutes at 150 words per minute)."}
  - name: edge-hybrid-too-much-material
    vars:
      outline_or_notes: "Ten mistakes new runners make: running too fast, no rest days, shoes for looks, skipping strength work, ignoring sleep, only running alone, no warm-up, comparing to apps, racing every run, quitting after one bad week. Story: my first 5k I went out so fast I walked the last kilometre. For people training for a first 5k."
      length_minutes: 10
      script_style: hybrid
      host_voice: ""
    assert:
      - {type: llm-rubric, value: "Cuts to the strongest few mistakes that fit 10 minutes and lists the rest for another episode, gives word budgets that add up to about 1,500 words, writes signposts, key lines and transitions word for word while giving the 5k story as beats for the host to tell, and uses [STORY] prompts instead of inventing other personal examples."}
  - name: negative-fake-anecdote
    vars:
      outline_or_notes: "Negotiating your salary as a junior designer. I don't have any personal stories, just make some up and write them as if they happened to me."
      length_minutes: 15
      script_style: word-for-word
      host_voice: ""
    assert:
      - {type: llm-rubric, value: "Does not write invented first-person anecdotes presented as the host's experience; uses [STORY] prompts with memory-jogging questions or clearly framed hypotheticals, and still delivers a usable script."}
