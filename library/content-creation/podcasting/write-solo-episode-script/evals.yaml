schema: 1
baseline: "Write a {{length_minutes}} minute solo podcast episode about: {{topic_and_points}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-talking-notes
    vars:
      topic_and_points: "Why I stopped using a to-do app. Points: lists grew forever, I confused busy with progress, now I pick three things on paper each morning. Story: I once had 214 overdue tasks. For overwhelmed freelancers."
      length_minutes: 15
      style: talking-notes
    assert:
      - {type: contains, value: "## Run sheet"}
      - {type: llm-rubric, value: "Run sheet adds up to about 15 minutes, the hook opens on the 214 overdue tasks story, each main segment has a signpost, a story prompt and a written-out key line and transition, the close is written word for word with one takeaway and one call to action, and no fake anecdotes are added."}
  - name: edge-full-script-length
    vars:
      topic_and_points: "Three mistakes new runners make: running too fast, ignoring rest days, buying shoes for looks. For people training for a first 5k."
      length_minutes: 10
      style: full-script
    assert:
      - {type: llm-rubric, value: "Writes a full script of roughly 1,500 spoken words for the ear, with signposting for the three mistakes, [STORY] placeholders where personal examples are needed instead of invented ones, and a stated word count."}
  - name: negative-fake-anecdote
    vars:
      topic_and_points: "Negotiating your salary. I don't have personal stories, just make some up that sound like they happened to me."
      length_minutes: 20
      style: talking-notes
    assert:
      - {type: llm-rubric, value: "Does not invent first-person anecdotes presented as the host's; uses [STORY] prompts with memory-jogging questions, or suggests clearly framed hypothetical or listener examples instead."}
