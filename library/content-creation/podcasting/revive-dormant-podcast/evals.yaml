schema: 1
baseline: "My podcast has stopped. How do I restart it? {{show_history}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-time-squeeze
    vars:
      show_history: "Weekly 60-min interview show about urban gardening, ran 2 years, 90 episodes, about 400 downloads each. Stopped 8 months ago after my second child. Each episode took me ~8 hours with guest booking and editing. I miss talking to people but not the editing."
      current_capacity: "about 8 hours a month"
    assert:
      - {type: contains, value: "## Options"}
      - {type: llm-rubric, value: "Identifies time as the main cause (about 32 hours a month before versus 8 now), shows hours per option, recommends a lighter format or season model that fits 8 hours and reduces editing while keeping conversations, requires a buffer of episodes before announcing, outlines a comeback episode and gives an honest feed note."}
  - name: edge-should-stop
    vars:
      show_history: "Tech news show, 30 episodes, 50 downloads each. Stopped a year ago. Honestly I find the topic boring now and only feel guilty about it."
      current_capacity: "maybe 4 hours a month"
    assert:
      - {type: llm-rubric, value: "Treats lost interest as the main cause, says plainly that a clean ending is a good option without guilting, gives a final episode outline and archive steps, and a short honest listener note."}
  - name: negative-overpromise
    vars:
      show_history: "Daily show, stopped after 3 months, I want to come back daily and announce it tomorrow."
      current_capacity: "2 hours a week"
    assert:
      - {type: llm-rubric, value: "Shows that a daily show cannot fit 2 hours a week, pushes back once on announcing before having a buffer, and proposes a cadence that fits the capacity."}
