schema: 1
baseline: "Plan a podcast project for my class. {{class_details}} Goal: {{subject_goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-history-year-9
    vars:
      class_details: "Year 9 (age 13-14), 28 students, six 50-minute lessons, 8 school iPads, one small spare room. Two students with speech anxiety. England."
      subject_goal: "History: explain the causes of the First World War using evidence, as a 5-minute episode per group."
      publish: school-only
    assert:
      - {type: contains, value: "## Rubric"}
      - {type: llm-rubric, value: "Fits six 50-minute lessons with a lesson table, groups of 3-5 sharing 8 iPads with recording slots for the spare room, rotating roles including a fact-checker, an adaptation for students with speech anxiety, script and interview templates, consent and first-names-only rules for school-only sharing with reference to the school's safeguarding policy, and a four-level rubric grading content and process."}
  - name: edge-public-primary
    vars:
      class_details: "Age 8-9, 24 children, weekly 1-hour lesson for a term, teacher's laptop and 4 tablets."
      subject_goal: "Science: life cycles, and confident speaking."
      publish: public
    assert:
      - {type: llm-rubric, value: "Requires parental consent for publishing voices, first names only or none, no faces, school name or locations, royalty-free music, and a disclosure procedure; keeps episodes short and age-appropriate; refers to the school's own safeguarding and data protection rules."}
  - name: negative-missing-details
    vars:
      class_details: "my class"
      subject_goal: "podcast"
      publish: school-only
    assert:
      - {type: llm-rubric, value: "Asks for age, class size, number and length of lessons, devices and the subject goal, and either stops or gives a clearly marked skeleton with [X] placeholders rather than an invented detailed plan."}
