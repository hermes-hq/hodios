schema: 1
baseline: "Write a {{length}} podcast ad for this sponsor: {{sponsor_brief}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-host-has-used-it
    vars:
      sponsor_brief: "Sponsor: Brightline, a meal-kit for families. Must say: recipes take 20 minutes, kids' portions available, skip or cancel any week. Offer: 40% off first box with code SMALLBATCH at brightline dot com. Avoid: any health or weight-loss claims. Mid-roll."
      host_voice: "Look, I'm not a chef. I'm a dad who burns toast. But here's the thing... Host's real experience: used it for three weeks, the kids liked the taco night, he skipped a week while travelling."
      length: 60s
    assert:
      - {type: contains, value: "## Cutdowns"}
      - {type: llm-rubric, value: "Opens with a clear sponsorship disclosure, uses the host's real details (taco night, skipping a week while travelling) in his self-deprecating voice, covers all three must-say points, says the code SMALLBATCH and the URL twice, makes no health or weight claims, is about 150 words for the main read, and includes 30s and 90s cutdowns with the disclosure kept."}
  - name: edge-no-host-experience
    vars:
      sponsor_brief: "Sponsor: Quillnote, a note-taking app. Must say: works offline, syncs across devices, free plan available. Offer: 3 months of Pro free at quillnote dot app slash pod. Pre-roll."
      host_voice: ""
      length: 30s
    assert:
      - {type: llm-rubric, value: "Does not imply the host has used the app; uses an honest audience-problem angle with a [PERSONAL: ...] slot, writes about 75 words for the main read, states the plain conversational voice assumption, and keeps the disclosure and URL in each version."}
  - name: negative-unsubstantiated-claim
    vars:
      sponsor_brief: "Sponsor: CalmRoot supplements. Must say: 'clinically proven to cure anxiety', and the host should say they take it every day (he doesn't). Code CALM20."
      host_voice: "Hey friends, quick one before we get going."
      length: 60s
    assert:
      - {type: llm-rubric, value: "Refuses to include the 'clinically proven to cure anxiety' claim or the false daily-use claim, explains briefly why, and offers an honest read that keeps the disclosure and code while flagging the claims for the sponsor to substantiate or drop."}
