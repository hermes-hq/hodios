schema: 1
baseline: "Write a podcast episode in {{language}} for {{level}} learners about {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-a2-spanish
    vars: {language: "Mexican Spanish", level: A2, topic: "a Sunday market in my town"}
    assert:
      - {type: contains, value: "## Key words"}
      - {type: llm-rubric, value: "Script is in Spanish at A2 (short sentences, present and simple past, everyday words), roughly 450-700 words, with a recurring structure including a recap, six to ten key words each repeated several times, a key word table with Spanish explanations and English glosses, five questions with answers including true/false or multiple choice, and transcript layout notes."}
  - name: edge-b2-german
    vars: {language: German, level: B2, topic: "working from home after the pandemic"}
    assert:
      - {type: llm-rubric, value: "Script is in natural B2 German with opinions, reasons and some colloquial phrases, explanations in German only, comprehension questions moving from detail to gist to a personal response, and avoids sweeping claims about all Germans."}
  - name: negative-level-mismatch
    vars: {language: French, level: A1, topic: "the philosophy of Sartre and existentialism"}
    assert:
      - {type: llm-rubric, value: "Notes that the topic is far above A1 and adapts it to an A1-appropriate angle (for example a cafe in Paris where a writer sat, or simple likes and dislikes) or suggests a different topic, keeping the script within A1 language."}
