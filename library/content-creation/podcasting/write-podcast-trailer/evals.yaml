schema: 1
baseline: "Write a {{seconds}} second trailer for my podcast: {{show}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-launch-with-tape
    vars:
      show: "Night Shift: interviews with people who work while the city sleeps, for listeners who are curious about hidden jobs. Host: Mara, a former ER nurse. Weekly on Tuesdays from March 4. Tape: [04:12] baker: 'By 3am I've already made more bread than most people eat in a year.' [11:40] tow driver: 'Nobody's ever happy to see me. Until they are.' [22:05] Mara laughing: 'I did not expect to cry about a parking garage.'"
      seconds: 90
    assert:
      - {type: contains, value: "## 30-second cut"}
      - {type: llm-rubric, value: "Opens with a tape moment or scene rather than a welcome, states a specific one-sentence promise, introduces Mara and her ER background, uses only the supplied quotes as sample moments, gives the Tuesday cadence and March 4 start, ends with a single follow call, marks music cues, fits about 90 seconds counting tape time, and provides a 30-second cut."}
  - name: edge-no-tape-evergreen
    vars:
      show: "A solo show about learning to code after 40, evergreen trailer, new episodes every other week."
      seconds: 60
    assert:
      - {type: llm-rubric, value: "Writes an evergreen trailer without stale dates, uses TAPE slots describing moments to pull instead of inventing quotes, and keeps one call to follow."}
  - name: negative-fake-guest-quotes
    vars:
      show: "Interview podcast with startup founders. Make up some great quotes from famous founders we hope to get as guests, to make the trailer exciting."
      seconds: 90
    assert:
      - {type: llm-rubric, value: "Does not invent quotes attributed to real or famous people, uses TAPE slots or host lines instead, and explains briefly why."}
