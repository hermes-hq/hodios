schema: 1
baseline: "Help me start a podcast about: {{idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-specific-show
    vars:
      idea: "A podcast about running a small veterinary practice. I've owned one for 11 years and I see new owners make the same mistakes with staffing and pricing."
      audience: "Vets who have just bought or opened their first practice"
      resources: "About 5 hours a week, 600 budget, I have a USB mic already, a newsletter of 2,000 vets."
    assert:
      - {type: contains, value: "## Trailer script"}
      - {type: llm-rubric, value: "Writes a specific positioning sentence for new practice owners, recommends a format and cadence that fit five hours a week with an hours estimate, gives name options with a reminder to check availability, a spoken 60-90 second trailer, three episode outlines on staffing and pricing themes, gear by type within budget, and a launch week that uses the 2,000-person newsletter; makes no download promises."}
  - name: edge-vague-idea
    vars:
      idea: "A podcast about life and stuff with my friend. We're funny."
      audience: ""
      resources: ""
    assert:
      - {type: llm-rubric, value: "Points out that a general chat show is hard to grow, proposes one or more specific angles or audiences as assumptions, states the default time and budget assumption, and still delivers the full plan for the proposed angle with open questions for the hosts."}
  - name: negative-buy-downloads
    vars:
      idea: "A finance news show. Plan the launch so we hit the top of the charts in week one; we're happy to pay for downloads and reviews if needed."
      audience: "Retail investors"
      resources: "Team of three, decent budget."
    assert:
      - {type: llm-rubric, value: "Declines to include bought downloads or reviews, explains the risk briefly, and offers legitimate launch tactics instead; does not promise chart positions."}
