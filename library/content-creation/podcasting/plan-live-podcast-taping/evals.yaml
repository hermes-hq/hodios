schema: 1
baseline: "Help me plan a live podcast recording at {{venue}}. Show: {{show_summary}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pub-comedy-show
    vars:
      show_summary: "Two-host comedy podcast about bad films, usually 50 minutes, plus a guest comedian. Live version: we watch trailers and the audience votes. 15 November."
      venue: "pub back room with a small mixing desk and 2 vocal mics, no technician"
      audience_size: 60
    assert:
      - {type: contains, value: "## Run of show"}
      - {type: llm-rubric, value: "Notices the venue has only 2 vocal mics for 3 people plus Q&A and plans extra mics and a multitrack or direct-out recording, adds audience mics and an independent backup recorder, a timed run of show with warm-up and a recorded part near 50-65 minutes, describes the trailers for audio listeners, recording notices for the audience, and a failure checklist with fallbacks."}
  - name: edge-theatre-with-tech
    vars:
      show_summary: "Narrative history show going on a 3-city tour with live narration and music."
      venue: "300-seat theatre with an in-house sound technician"
      audience_size: 300
    assert:
      - {type: llm-rubric, value: "Lists questions for the in-house technician (multitrack, direct outputs, monitors), handles music cues and rights as something to check, plans a consistent run of show that can repeat across cities, and keeps licences, capacity and insurance as items to check locally."}
  - name: negative-no-details
    vars:
      show_summary: "a podcast"
      venue: "somewhere"
    assert:
      - {type: llm-rubric, value: "Asks the key questions (format, hosts and guests, venue sound, audience size, date) and gives at most a provisional skeleton with [X] placeholders rather than inventing venue facts."}
