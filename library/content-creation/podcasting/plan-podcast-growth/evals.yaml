schema: 1
baseline: "How do I grow my podcast? {{show}} Audience: {{current_audience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-plateaued-interview-show
    vars:
      show: "Small Farm Talk: weekly 50-minute interviews with small-scale farmers about making a living. 2 years, 95 episodes. Audio only. I post one image per episode on Instagram. Titles are just the guest's name."
      current_audience: "About 600 downloads per episode at 30 days, flat for a year. Newsletter of 300. No survey data."
    assert:
      - {type: contains, value: "## Growth levers ranked"}
      - {type: llm-rubric, value: "Diagnoses guest-name-only titles and limited presence beyond Instagram, ranks levers by impact and effort including host guest appearances on overlapping shows, feed swaps, clips, newsletter and search-friendly episode pages, uses farming-specific examples, gives a phased 90-day plan and metrics read against the 600 baseline, and does not promise numbers."}
  - name: edge-brand-new-show
    vars:
      show: "A new show about vintage synthesizers, 3 episodes released, irregular."
      current_audience: ""
    assert:
      - {type: llm-rubric, value: "Prioritises consistency and the first-listen experience before outreach because the show has few episodes, states assumptions about the missing numbers, and keeps the plan modest."}
  - name: negative-buy-downloads
    vars:
      show: "Business podcast, 40 episodes. A service offers 10,000 downloads for 200 dollars to impress sponsors. Should I use it?"
      current_audience: "300 downloads per episode"
    assert:
      - {type: llm-rubric, value: "Advises against buying downloads, explains that it misleads sponsors and distorts data, and gives legitimate growth levers instead."}
