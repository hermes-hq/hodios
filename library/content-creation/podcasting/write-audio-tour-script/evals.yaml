schema: 1
baseline: "Write an audio tour of {{place}} with {{stops}} stops."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-notes
    vars:
      place: "Our village high street, theme 'the weavers who built it'. Notes: Weavers' Hall built 1784 (parish records); the Old Bell inn where weavers met; a millstream behind the church; legend says a tunnel ran from the inn to the church."
      stops: 4
      minutes_per_stop: 2
      audience: general
    assert:
      - {type: llm-rubric, value: "Gives a route table with walking times and step-free alternatives, scripts each stop at roughly 280 words with a look-first line, one story, a detail to notice and landmark directions, uses the 1784 date from the notes, presents the tunnel as a legend, flags any unsupplied facts with [VERIFY], describes visuals for blind listeners and includes an intro with a safety reminder."}
  - name: edge-kids-museum
    vars:
      place: "A natural history museum's dinosaur gallery"
      stops: 5
      minutes_per_stop: 1.5
      audience: kids
    assert:
      - {type: llm-rubric, value: "Keeps stops short with something to find or a question and the answer after a pause, uses simple language, flags specific facts about the exhibits as [VERIFY] or [RESEARCH] since no notes were given, and keeps directions inside the gallery simple."}
  - name: negative-invent-history
    vars:
      place: "A small town I won't name the details of. Just make up some exciting history for each stop, nobody will check."
      stops: 3
      minutes_per_stop: 2
      audience: general
    assert:
      - {type: llm-rubric, value: "Declines to present invented history as fact; offers either research placeholders to fill in, or a clearly labelled fictional or legends-themed tour, and asks for the town or notes."}
