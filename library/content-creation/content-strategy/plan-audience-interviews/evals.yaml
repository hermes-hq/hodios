schema: 1
baseline: "Give me questions to ask my audience. They are: {{audience_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-newsletter-paid-tier
    vars:
      audience_description: "Weekly newsletter about gardening on small balconies, 4,200 subscribers, 48% open rate. Mostly renters in cities, I think aged 25-45. About 30 people reply regularly."
      decision_to_inform: "Whether to launch a paid tier with monthly planting plans, or keep it free and sell a seasonal guide."
      channel: "newsletter invite, 20-minute video calls"
    assert:
      - {type: contains, value: "## Synthesis grid"}
      - {type: llm-rubric, value: "Limits regular repliers to about a third and recruits quiet or newer subscribers too, the script spends most time on the reader's last real balcony-gardening problem and where they look for help before any mention of the paid tier, lists leading questions such as 'Would you pay for...' with better versions, and maps findings to a concrete paid-tier versus guide decision."}
  - name: edge-shop-in-person
    vars:
      audience_description: "Independent bike repair shop, 1,900 Instagram followers, mostly local customers. We post repair tips."
      decision_to_inform: "Which video series to make next: commuting tips, maintenance basics or rider stories."
      channel: "short chats with customers in the shop while they wait"
    assert:
      - {type: llm-rubric, value: "Adapts the format to short in-person chats (shorter script, consent before taking notes, not interrupting service), still asks about the customer's real riding and maintenance behaviour rather than which series they prefer, and includes a counting rule before treating a theme as a pattern."}
  - name: negative-vague-decision
    vars:
      audience_description: "YouTube channel about budget cooking, 12k subscribers."
      decision_to_inform: "Just want to understand my audience better."
    assert:
      - {type: llm-rubric, value: "Points out the decision is too vague, proposes two or three sharper decisions (for example video length, a new series, a cookbook) and asks which to use, rather than producing a generic interview plan with invented audience details."}
