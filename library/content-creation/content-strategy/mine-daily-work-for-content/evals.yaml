schema: 1
baseline: "Give me content ideas for my business. {{work_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bathroom-fitter
    vars:
      work_description: "Self-employed bathroom fitter, 2-3 jobs a week, mostly 1930s houses. Customers always ask about tile choice, how long it takes and whether they can keep the old bath. I often find rotten floorboards and bad old plumbing once I rip things out."
      time_per_week: "15 minutes on a Sunday"
    assert:
      - {type: contains, value: "## 20 ideas from your week"}
      - {type: llm-rubric, value: "Gives capture habits tied to moments in the job (arriving, rip-out reveals, finished room), exactly 20 trade-specific ideas such as rotten floorboards found under old baths and tile choice questions, sizes output to about one post a week for 15 minutes, and warns against showing customers' faces, addresses or house numbers without permission."}
  - name: edge-nurse-confidentiality
    vars:
      work_description: "Community nurse doing home visits. I'd like to share tips on wound care and staying well in winter on Instagram, but I'm careful about patients."
      time_per_week: "an hour a week"
    assert:
      - {type: llm-rubric, value: "Puts patient confidentiality and professional rules first, captures only non-identifying material (general tips, the nurse's own routine, kit), avoids individual clinical advice and tells followers to see their own clinician, and produces ideas that do not depend on patient photos or stories."}
  - name: negative-too-thin
    vars:
      work_description: "I run a business."
    assert:
      - {type: llm-rubric, value: "Asks two or three specific questions about what the work is and a typical week instead of producing generic ideas, and does not invent the type of business."}
