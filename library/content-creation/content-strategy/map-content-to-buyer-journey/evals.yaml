schema: 1
baseline: "Map my content to the buyer journey for {{audience}} buying {{offer}}: {{content_list}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-top-heavy-library
    vars:
      audience: "practice managers at small dental clinics"
      offer: "a 30-day trial of our appointment reminder software"
      sales_motion: self-serve
      content_list: |
        - "Why patients miss appointments" (article; causes of no-shows) - CTA: start free trial
        - "10 ways to reduce no-shows" (article; tips incl. reminders) - CTA: start free trial
        - "No-show statistics for dental practices" (article) - no CTA
        - "How to reduce no-shows at your clinic" (video; same tips as the article) - CTA: subscribe
        - "Getting started: connect your calendar" (help doc) - no CTA
        - Pricing page (lists three plans) - CTA: start free trial
    assert:
      - {type: llm-rubric, value: "Defines buyer questions per stage, places each piece once, flags the two no-show tips pieces as overlapping, flags trial CTAs on awareness articles as skipping stages and the statistics article as a dead end, identifies decision-stage gaps such as comparisons with alternatives, proof from similar clinics, setup effort and data security, and ranks new pieces with links from and to existing ones; invents no traffic figures."}
  - name: edge-sales-led-champion
    vars:
      audience: "heads of finance at mid-size manufacturers"
      offer: "an enterprise spend management platform, sold via sales calls"
      sales_motion: sales-led
      content_list: "- Blog: 'What is spend management?' - Case study: a 400-person manufacturer cut approval time - Webinar recording: month-end close tips - Product tour video"
    assert:
      - {type: llm-rubric, value: "Includes champion and approver questions (for example IT security, procurement, ROI justification for the CFO or board) at the decision stage, identifies gaps like a business case template or security documentation, and places the case study at decision or late consideration."}
  - name: negative-thin-descriptions
    vars:
      audience: "busy parents"
      offer: "a meal-kit subscription"
      sales_motion: self-serve
      content_list: "post1, post2, post3, video-final-v2, page-new"
    assert:
      - {type: llm-rubric, value: "Explains it cannot tell what the pieces cover from these names, asks for a title and one-line description for each, and stops without guessing a map."}
