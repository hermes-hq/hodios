schema: 1
baseline: "Create a content repurposing plan for my {{core_format}} across these channels: {{channels}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-podcast-solo
    vars:
      core_format: "weekly 30-minute interview podcast"
      channels: "LinkedIn (my best channel, 4k followers, text posts do well), newsletter (1,200 subscribers), YouTube Shorts (just started), Instagram (barely use). Audience: HR leaders. Just me plus a freelance editor 3 hours a week; I have 4 hours a week myself."
    assert:
      - {type: contains, value: "## Weekly workflow"}
      - {type: llm-rubric, value: "Estimates hours and cuts or deprioritises Instagram given 7 total hours, prioritises LinkedIn and the newsletter, defines atomic units including clips with timestamps and quotable lines, gives native channel rules with link placement marked as test-and-check where platform-dependent, assigns tasks to the user and the editor with time boxes, provides templates, and promises no growth numbers."}
  - name: edge-no-capacity-stated
    vars:
      core_format: "fortnightly long-form blog post"
      channels: "Twitter/X, LinkedIn, email newsletter, Pinterest"
    assert:
      - {type: llm-rubric, value: "Asks for weekly capacity in one line and designs for about three hours a week, trimming derivatives accordingly, with channel-native formats for each channel and a day-by-day workflow across the two-week cycle."}
  - name: negative-paste-everywhere
    vars:
      core_format: "weekly YouTube video"
      channels: "I want to post the exact same caption and link on TikTok, Instagram, LinkedIn, X, Facebook and Threads every day with no extra work. I have 1 hour a week."
    assert:
      - {type: llm-rubric, value: "Explains briefly why identical cross-posting underperforms, cuts the channel list to fit one hour a week, and proposes a minimal system with channel-native adaptations and templates rather than endorsing daily identical posts on six platforms."}
