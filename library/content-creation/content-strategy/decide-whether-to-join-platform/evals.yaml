schema: 1
baseline: "Should I join {{platform}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-accountant-video-app
    vars:
      platform: "TikTok"
      current_channels: "LinkedIn 3 posts a week (2,400 followers, brings most of my client enquiries), monthly email to 600 small-business owners. About 3 hours a week for content."
      audience_description: "Small-business owners who need bookkeeping help. A few younger clients said they found tax tips on TikTok, but I have no idea how many."
    assert:
      - {type: contains, value: "## Scorecard"}
      - {type: llm-rubric, value: "Scores audience presence low-to-moderate because the evidence is anecdotal, notes short vertical video is a format the accountant would have to learn, shows that 3 hours a week cannot cover it without cutting LinkedIn which brings clients, and ends with wait or skip plus cheap evidence checks (ask clients, test repurposed clips), not join."}
  - name: edge-strong-fit-join
    vars:
      platform: "a WhatsApp channel"
      current_channels: "Neighbourhood bakery. Instagram 4,000 local followers, posts daily specials. 2 hours a week. A paper sign-up sheet at the till for 'news' that nobody uses."
      audience_description: "Local regulars, many over 50, who tell staff they use WhatsApp daily and miss specials because they do not use Instagram."
    assert:
      - {type: llm-rubric, value: "Scores audience presence and format fit high from customer evidence, recommends join with a 60-day trial reusing the daily specials already made for Instagram, sets a numeric exit test (for example followers from the till or mentions of the channel when ordering), and says the paper sign-up can point to the channel."}
  - name: negative-no-info
    vars:
      platform: "Bluesky"
      current_channels: "some socials"
      audience_description: "people"
    assert:
      - {type: llm-rubric, value: "Does not give a verdict on invented assumptions; asks for the current channels with results and hours, and who the audience is, and stops."}
