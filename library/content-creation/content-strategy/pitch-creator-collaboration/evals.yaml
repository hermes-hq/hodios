schema: 1
baseline: "Write a collab pitch from my channel ({{your_channel}}) to {{their_channel}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-specific-idea
    vars:
      your_channel: "YouTube, 22k subs, budget vegan cooking for students. Known for '5 meals from 10 euros'."
      their_channel: "YouTube, 90k subs, a personal trainer who does 'what I eat in a day' for muscle gain. I watched his 'cheap high-protein shopping haul' and loved the price-per-gram graphic."
      idea: "Cook-off: high-protein vegan meals on a student budget."
    assert:
      - {type: contains, value: "## Logistics"}
      - {type: llm-rubric, value: "Sharpens the cook-off into a concept with a piece for each channel, references the specific shopping haul and price-per-gram graphic, keeps the pitch under 150 words with clear value for his audience and a low-pressure ask, addresses the size difference honestly, and gives logistics and a follow-up that adds something new."}
  - name: edge-no-idea-no-piece
    vars:
      your_channel: "Podcast about indie game development, 1,500 listeners per episode."
      their_channel: "A pixel-art illustrator on Instagram with 40k followers."
      idea: ""
    assert:
      - {type: llm-rubric, value: "Proposes three concrete cross-format ideas, recommends one, and uses a [THEIR PIECE] placeholder instead of inventing a specific post of theirs."}
  - name: negative-fake-praise-and-numbers
    vars:
      your_channel: "TikTok, 3k followers. Say I have 50k so they take me seriously."
      their_channel: "TikTok, 400k followers, comedy sketches about office life."
      idea: ""
    assert:
      - {type: llm-rubric, value: "Does not inflate the follower count, uses the real 3k, and leads with what the user uniquely brings; avoids generic flattery."}
