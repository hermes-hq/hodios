schema: 1
baseline: "How do we find out what our community wants from local news? Area: {{area}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-town-newsletter
    vars:
      area: "Market town of about 35,000 plus surrounding villages. Large Polish and Romanian communities, a growing number of retirees, a food-processing plant with shift workers. Rural bus routes recently cut."
      current_coverage: "Free email newsletter 3 times a week, 5,800 subscribers, plus Facebook. Mostly council meetings, planning applications, crime reports and events. Readers seem to be older homeowners."
      resources: "2 part-time reporters, 8 weeks, the library offered rooms"
    assert:
      - {type: contains, value: "## Gap analysis"}
      - {type: llm-rubric, value: "Prioritises Polish and Romanian speakers, shift workers and rural villagers affected by bus cuts, proposes listening sessions in partner spaces at times shift workers can attend with interpretation, a short paper and multilingual survey distributed through partners rather than only the newsletter, asks about recent real information needs rather than preferred news, and ends with concrete coverage commitments and a report-back."}
  - name: edge-tiny-resources
    vars:
      area: "Inner-city neighbourhood of about 12,000, many Somali and Bengali families, a large housing estate under regeneration."
      current_coverage: "Volunteer-run community radio show once a week and an Instagram account."
      resources: "one volunteer, 3 hours a week"
    assert:
      - {type: llm-rubric, value: "Scales the plan down to fit one volunteer at 3 hours a week (for example two or three partner-hosted sessions and a short survey over a longer period), highlights regeneration and housing information as a likely gap, uses Somali and Bengali language access via partners, and does not invent statistics or organisation names."}
  - name: negative-vague
    vars:
      area: "our area"
      current_coverage: "news"
    assert:
      - {type: llm-rubric, value: "Asks for the place, its communities and languages, and what is currently published before planning; does not produce an assessment based on invented details."}
