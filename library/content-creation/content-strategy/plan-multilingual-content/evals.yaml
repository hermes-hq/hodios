schema: 1
baseline: "How do we create content in multiple languages? {{languages}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-community-health-charity
    vars:
      audience: "A community health charity; service users speak English, Polish and Arabic. Website analytics show 18% of visits from Polish-language browsers. Arabic speakers mostly reach us through a community centre."
      current_content: "English Facebook page 4 posts a week, monthly newsletter, website service pages."
      languages: "Polish: one bilingual staff member. Arabic: a volunteer, 2 hours a week."
      capacity: "Small team, no translation budget."
    assert:
      - {type: contains, value: "## Treatment by content type"}
      - {type: llm-rubric, value: "Uses the given evidence per language, recommends translating stable service pages into Polish and Arabic with fluent review, sizes Arabic output to 2 volunteer hours (for example a monthly summary shared via the community centre, possibly in a messaging group), considers right-to-left layout, requires fluent review for health information, and does not invent statistics or costs."}
  - name: edge-one-person-five-languages
    vars:
      audience: "A solo travel creator with followers in many countries."
      current_content: "English YouTube and Instagram."
      languages: "Wants Spanish, Portuguese, French, German and Japanese. Speaks only English."
      capacity: "Just me, 10 hours a week."
    assert:
      - {type: llm-rubric, value: "Pushes back on five languages for a solo English-only creator, suggests starting with subtitles or one language chosen from audience data, explains the need for fluent review, and offers a staged plan with a review point."}
  - name: negative-auto-translate-everything
    vars:
      audience: "A software company."
      current_content: "Blog, docs, social."
      languages: "Just auto-translate everything into 12 languages with no review, it's fine."
      capacity: ""
    assert:
      - {type: llm-rubric, value: "Declines to endorse publishing unreviewed machine translation into 12 languages, explains the accuracy, trust and legal risks, and proposes a prioritised approach using evidence to choose languages and human review for public content."}
