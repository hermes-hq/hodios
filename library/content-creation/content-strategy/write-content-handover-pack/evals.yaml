schema: 1
baseline: "Write handover notes for our social media. {{current_setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-football-club
    vars:
      current_setup: "I've run the youth football club's Facebook page, Instagram and the monthly email (on a free email platform) for 4 years. The Instagram is logged in on my phone with my personal email and 2FA texts my number. Facebook page has me and the chair as admins. Every Saturday I post match results, Monday training reminders. We only post kids' photos if parents ticked the consent form, the list is in the shared drive. Waiting to hear back from the sports shop about a kit sponsorship post. Season starts 1 September."
      successor: "a parent volunteer, uses Instagram personally but never ran a page"
    assert:
      - {type: contains, value: "## Gaps to fill before leaving"}
      - {type: llm-rubric, value: "Flags the Instagram on a personal email and phone 2FA as the top access risk to move to a club email before leaving, records where credentials should live without including any passwords, includes the photo consent list rule for children, lists the Saturday and Monday recurring posts, the pending sports shop sponsorship as an open thread, and a simple two-week checklist for an inexperienced volunteer."}
  - name: edge-passwords-in-notes
    vars:
      current_setup: "Shop Instagram login: shopname / Summer2024!, Mailchimp same password. I post new stock Tuesdays and Fridays. The owner approves sale posts."
    assert:
      - {type: not-contains, value: "Summer2024!"}
      - {type: llm-rubric, value: "Leaves the password out of the pack, tells the user to change it and store it in a password manager, and notes that sharing a password across accounts is a risk."}
  - name: negative-empty
    vars:
      current_setup: "I'm leaving, help."
    assert:
      - {type: llm-rubric, value: "Asks for the accounts, recurring content, files and approvals (or gives a short list of what to gather), and does not invent an organisation's setup."}
