schema: 1
baseline: "Help me fix my content strategy. Current content: {{current_content}}. Goals: {{goals}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    vars:
      current_content: "Interior design studio of 2. Last 6 months: Instagram 4x a week (12k followers, lots of likes, few enquiries), TikTok 3x a week (started 3 months ago, 900 followers, exhausting), Pinterest auto-posted, a blog post every 2 months, a newsletter we stopped in March. Enquiries mostly mention our project case studies on the website or Houzz."
      goals: "More full-room design projects (we want 4 new projects a month, getting 1-2). Reset because we're burned out on daily posting."
      weekly_hours: 6
    assert:
      - {type: llm-rubric, value: "Runs only the audit step: a channel inventory table with hours and goal results (enquiries, not likes) and a keep, fix or drop verdict per channel, notices case studies as the content linked to enquiries, flags TikTok as high effort for low result, names burnout and too many channels as reasons for stalling, ends with open questions and stops for approval without choosing pillars or writing a plan."}
  - name: edge-step-four-overcommitted
    description: "Steps 1-3 approved: primary channel Instagram with one case-study carousel and two reels per week, newsletter monthly. User message: 'Approved, now do the cadence. Actually let's also do daily stories and a weekly YouTube video.'"
    vars:
      current_content: "Interior design studio, see earlier steps."
      goals: "4 new projects a month."
      weekly_hours: 6
    assert:
      - {type: llm-rubric, value: "Calculates hours per piece and shows that adding daily stories and weekly YouTube exceeds 6 hours plus buffer, pushes back with arithmetic, offers to swap rather than add, and sets measures with enquiries as the outcome metric and decision rules after 8-12 weeks."}
  - name: negative-no-goal
    vars:
      current_content: "I post stuff on Instagram sometimes."
      goals: "idk, just want it to be better"
    assert:
      - {type: llm-rubric, value: "Asks what the content is for, who it is for, which channels and how often, and hours available, before auditing; does not invent analytics or a plan."}
