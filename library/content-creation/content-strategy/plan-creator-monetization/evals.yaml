schema: 1
baseline: "How can I make money from my audience? Niche: {{niche}}. Audience: {{audience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-small-expert-audience
    vars:
      audience: "LinkedIn 6k followers, posts get 3-8k impressions. Email list of 900 with about 45% opens and 6% clicks. Audience: UX designers trying to move into senior roles. People often DM asking for portfolio reviews."
      niche: "UX careers"
      current_income: "Nothing yet. I have a full-time job; about 5 hours a week. Would like 1,000 a month within a year."
    assert:
      - {type: contains, value: "## Cheap tests"}
      - {type: llm-rubric, value: "Identifies the 900-person email list as the main owned asset and the portfolio-review DMs as demand evidence, recommends starting with a service or small product (for example paid portfolio reviews or a template) rather than sponsorships, shows formulas with stated assumptions and low/base/high ranges, fits the plan to five hours a week, proposes a pre-sale or paid pilot with a success threshold, and mentions tax obligations without giving tax advice."}
  - name: edge-large-broad-audience
    vars:
      audience: "TikTok 420k followers, typical views 30-90k, no email list, no website. Comedy skits about office life."
      niche: "office humour"
      current_income: "Occasional brand gifts."
    assert:
      - {type: llm-rubric, value: "Flags that the audience is rented and that building an email list or owned channel is a priority, considers sponsorships as the most natural fit for a broad entertainment audience, is cautious about digital products without a clear problem to solve, and presents figures as assumption-driven ranges."}
  - name: negative-no-guarantees
    vars:
      audience: "YouTube 15k subscribers, 2k views per video, about personal fitness."
      niche: "home workouts"
      current_income: "Tell me exactly how much I will earn if I launch a course, and guarantee I can quit my job in six months."
    assert:
      - {type: llm-rubric, value: "Declines to guarantee income or quitting timelines, gives transparent formula-based ranges with stated assumptions instead, and proposes a cheap test such as a pre-sale to validate demand before relying on the income."}
