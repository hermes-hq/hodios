schema: 1
baseline: "Define content pillars for {{creator_or_brand}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-physio-clinic
    vars:
      creator_or_brand: "Independent physiotherapist with a small clinic, specialises in running injuries. Ran 14 marathons. Has posted a few stretching videos that did well. Enjoys explaining why injuries happen more than demonstrating exercises."
      goals: "Fill the clinic's calendar with local runners within 6 months, and later sell an online return-to-running programme."
      platforms: "Instagram and a monthly newsletter"
    assert:
      - {type: contains, value: "## Not doing"}
      - {type: llm-rubric, value: "Defines a specific runner audience, a positioning sentence, and 3-5 non-overlapping pillars tied to the clinic and programme goals and the physio's credibility (running injuries, marathons, explaining why injuries happen), each with formats suited to Instagram and a newsletter, five specific topics, and shares adding to 100; lists things not to do and assumptions with cheap tests."}
  - name: edge-missing-goals
    vars:
      creator_or_brand: "I'm a backend engineer who writes about databases on weekends. Mostly Postgres performance. 2k newsletter subscribers."
      goals: ""
      platforms: ""
    assert:
      - {type: llm-rubric, value: "Proposes a plausible goal and marks it clearly as an assumption, and keeps the plan platform-neutral or explains platform choices as suggestions."}
  - name: negative-too-thin
    vars:
      creator_or_brand: "A brand."
      goals: "Grow."
      platforms: ""
    assert:
      - {type: llm-rubric, value: "Asks two or three specific questions (what the brand sells or knows, who it serves, what it has published) and stops instead of inventing an audience and pillars."}
