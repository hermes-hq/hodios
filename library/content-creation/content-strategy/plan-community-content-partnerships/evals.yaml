schema: 1
baseline: "Give me ideas for collaborating with local organisations. We are {{organisation}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bookshop
    vars:
      organisation: "Independent bookshop with a small events room, 2,600 Instagram followers and a monthly email to 1,100 customers."
      potential_partners: "Town library, two primary schools, a local history society, the cafe next door"
      goals: "Reach families new to the area and fill weekday afternoon events."
    assert:
      - {type: contains, value: "## Simple agreement"}
      - {type: llm-rubric, value: "Ranks partners against the family and weekday goals, notes school safeguarding and photo consent rules for children, proposes concrete co-hosted formats (for example a library-bookshop reading list or after-school story event) with a first piece, splits tasks between partners, writes a specific outreach message, and gives a plain-language agreement template with an end clause."}
  - name: edge-newsroom-independence
    vars:
      organisation: "Hyperlocal news site with a weekly newsletter of 7,000 readers."
      potential_partners: "The council's youth service, a housing association, the football club"
    assert:
      - {type: llm-rubric, value: "Protects editorial independence by keeping partners out of approval of news coverage, labels any paid partnership, flags the conflict of covering the council and housing association while partnering with them, and suggests formats such as community Q&As or distribution help rather than co-written news."}
  - name: negative-missing-partners
    vars:
      organisation: "Local yoga studio."
      potential_partners: ""
    assert:
      - {type: llm-rubric, value: "Asks which local organisations they have in mind or suggests types to consider and asks to confirm, and does not invent named partners or contacts."}
