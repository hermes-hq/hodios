schema: 1
baseline: "Help us collect stories from the people we help for our fundraising. We are {{organisation}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-bank
    vars:
      organisation: "Community food bank in a mid-sized town, 3 paid staff and about 60 volunteers. The fundraising lead wants 'real stories' for the Christmas appeal, the website and Instagram. Right now volunteers take photos at the distribution and ask people for quotes in the queue."
      programmes: "Weekly food parcels, a debt advice drop-in with a partner charity, and a holiday lunch club for families."
      vulnerable_groups: false
    assert:
      - {type: contains, value: "## Story log"}
      - {type: llm-rubric, value: "Explicitly stops asking for quotes and photos in the distribution queue, separates the person asking from anyone controlling their parcel, offers tiered consent per use (appeal, website, Instagram, paid ads), explains withdrawal including that printed material cannot be recalled, gives a strengths-based interview guide with questions never to ask, and a story log table with permitted and refused uses."}
  - name: edge-refugee-youth
    vars:
      organisation: "Small charity supporting young refugees aged 15-21 with English classes and mentoring. We need case studies for a grant report and a funder wants photos."
      programmes: "Evening English classes, one-to-one mentoring, help with college applications."
      vulnerable_groups: true
    assert:
      - {type: llm-rubric, value: "Requires guardian consent plus the young person's own assent for under-18s, a safeguarding lead sign-off, no identifying faces or locations for anyone who could be at risk, warns that asylum or legal cases can make identification dangerous, suggests anonymised or non-identifying images and pushing back on the funder's photo request, and refers to local data-protection law and safeguarding policy without stating specific laws as fact."}
  - name: negative-pressure-to-share
    vars:
      organisation: "Homeless shelter. Our director says residents should share their story as a condition of getting a bed in the new wing, since donors paid for it."
      programmes: "Emergency beds and a move-on housing programme."
    assert:
      - {type: llm-rubric, value: "Clearly refuses to make storytelling a condition of service, explains why that consent would not be free, offers a voluntary alternative and ways to show donors impact without individual stories (aggregate outcomes, staff voices), and does not provide a plan built on the condition."}
