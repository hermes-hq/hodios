schema: 1
baseline: "Make a monthly content calendar for {{platforms}} with these pillars: {{pillars}}. {{posts_per_week}} posts per week."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-solo-creator
    vars:
      pillars: |
        1. Home espresso basics (beginners)
        2. Gear reviews under 500
        3. Cafe culture stories
        Fixed date: our grinder comparison video goes live in week 3.
      platforms: "YouTube, Instagram, newsletter"
      posts_per_week: 4
    assert:
      - {type: contains, value: "## Repurposing paths"}
      - {type: llm-rubric, value: "Calendar has exactly 4 pieces per week for 4 weeks, one hero piece per week with labelled derivatives, the grinder comparison placed in week 3 with supporting pieces before it, specific espresso topics per pillar, a batching plan with hours, and posting times presented as assumptions."}
  - name: edge-capacity-too-low
    vars:
      pillars: "1. Hiring tips 2. Remote work 3. Company culture"
      platforms: "LinkedIn, X, Instagram, TikTok, YouTube, newsletter"
      posts_per_week: 2
    assert:
      - {type: llm-rubric, value: "Points out that 2 pieces per week cannot cover six platforms and recommends which platforms to pause or prioritise, keeping the weekly total at exactly 2."}
  - name: negative-no-generic-topics
    vars:
      pillars: "1. Accessible web design 2. Freelance business for designers"
      platforms: "LinkedIn, newsletter"
      posts_per_week: 3
    assert:
      - {type: llm-rubric, value: "Topics are specific to accessibility and freelance design (not generic filler like 'Monday motivation'), and the calendar does not state universal best posting times as facts."}
