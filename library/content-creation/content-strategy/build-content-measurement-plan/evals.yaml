schema: 1
baseline: "What should I measure for my content? Goals: {{goals}}. Channels: {{channels}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-fitter
    vars:
      goals: "Get 8 qualified enquiries a month for kitchen fitting from content by June. Currently most work comes from referrals."
      channels: "Instagram 3 posts a week (before and after photos, reels of installs), Facebook page shares the same posts, a website with a contact form, Google business profile."
      tools: "Instagram insights, website analytics, the contact form, a spreadsheet"
    assert:
      - {type: contains, value: "## Decision rules"}
      - {type: llm-rubric, value: "Makes qualified enquiries the outcome metric, adds a fixed-option 'how did you hear about us' field to the contact form and phone calls, gives a consistent UTM naming pattern for the Instagram bio and posts, excludes follower count as a success measure, sets a baseline from recent enquiries, and writes keep/change/stop rules in advance."}
  - name: edge-no-history-nonprofit
    vars:
      goals: "Recruit 40 new volunteers for the spring river clean-up and raise our profile in the town."
      channels: "Facebook group, a monthly email to 900 supporters, posters in shops"
      tools: ""
    assert:
      - {type: llm-rubric, value: "Turns 'raise our profile' into a measurable proxy and asks to confirm it, handles the lack of baseline by recording a starting point now, tracks posters with a short link or QR per poster batch or a sign-up form question, and names offline word of mouth as a blind spot with a cheap proxy."}
  - name: negative-only-vanity
    vars:
      goals: "I just want my follower count to look bigger so brands take me seriously."
      channels: "TikTok, Instagram"
    assert:
      - {type: llm-rubric, value: "Questions follower count as the goal, explains brands usually look at engagement and audience fit, proposes an underlying goal (brand deals or rate) with behavioural metrics, and does not suggest buying followers or engagement."}
