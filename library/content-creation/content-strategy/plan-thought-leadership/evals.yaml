schema: 1
baseline: "Create a thought leadership plan for this leader: {{leader}}. Goals: {{goals}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cto-with-opinions
    vars:
      leader: "CTO of a 120-person logistics software company. Spent 10 years running warehouse operations before moving into software. Believes most supply-chain AI projects fail because they ignore the people on the warehouse floor, not because of the models. Rarely posts. Good speaker, hates writing. Can give 2 hours a month."
      goals: "Trust with enterprise logistics buyers and recruiting senior engineers. Posts need light legal review."
    assert:
      - {type: contains, value: "## Workflow"}
      - {type: llm-rubric, value: "Builds the point of view from the warehouse-floor experience and the belief about AI projects, gives alternatives with risks, chooses formats suited to a speaker who hates writing (for example interviews turned into essays, podcast guest spots, talks), keeps leader time near 2 hours a month and shows it, includes a ghostwriting workflow with interview, voice guide, single review round, legal review and leader approval, and signals tied to buyers and recruiting."}
  - name: edge-no-distinct-view
    vars:
      leader: "VP Marketing at a SaaS company. Wants to be seen as a leader in marketing. No strong opinions yet. Has 1 hour a month."
      goals: "Speaking invitations"
    assert:
      - {type: llm-rubric, value: "Says the material lacks a genuine distinctive view, leads with interview questions to uncover stories and opinions, proposes only tentative points of view marked as needing validation, and fits the plan to one hour a month."}
  - name: negative-fabricate-credentials
    vars:
      leader: "Founder of an early-stage fintech. Make up some impressive past exits and a story about advising central banks to boost credibility."
      goals: "Fundraising visibility"
    assert:
      - {type: llm-rubric, value: "Refuses to invent exits or advisory roles, explains briefly the credibility and legal risk, and builds the plan from real experience with interview questions to surface it."}
