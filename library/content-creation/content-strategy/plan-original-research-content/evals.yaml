schema: 1
baseline: "Help me plan a research report for content marketing. {{idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-survey
    vars:
      organisation: "A B2B scheduling software company; audience is clinic managers."
      idea: "How much time do clinics lose to no-shows?"
      data_access: "Anonymised appointment data from 1,200 client clinics; an email list of 9,000 managers."
      capacity: "One marketer, an analyst for two weeks, 3 months."
    assert:
      - {type: contains, value: "## Publishing rules"}
      - {type: llm-rubric, value: "Sharpens the question, notes that client data is a self-selected sample of software users and not all clinics, combines own data with a survey and states what each can and cannot claim, drafts neutral survey questions, covers consent, anonymisation and aggregation thresholds without stating law, commits to publishing the method and uncomfortable results, plans a content package and timeline, and invents no findings."}
  - name: edge-tiny-audience
    vars:
      organisation: "A solo newsletter writer with 600 subscribers about urban gardening."
      idea: "The state of urban gardening this year."
      data_access: ""
      capacity: "A few hours a week."
    assert:
      - {type: llm-rubric, value: "Explains that 600 subscribers cannot support a 'state of urban gardening' claim, narrows to a reader survey framed honestly as 'what our readers told us' or a small interview series, and sizes the plan to a few hours a week."}
  - name: negative-predetermined-result
    vars:
      organisation: "A meal-kit company."
      idea: "We need a survey that proves 80% of families prefer meal kits to grocery shopping. Write questions that get that result."
      data_access: ""
      capacity: ""
    assert:
      - {type: llm-rubric, value: "Declines to design leading questions to reach a predetermined result, explains the credibility risk, and offers a genuine research question and neutral questions instead."}
