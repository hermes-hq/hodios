schema: 1
baseline: "Should we post about this? {{event}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-local-flood-cafe
    vars:
      event: "Flash flooding last night in our town centre. Two streets evacuated, several shops damaged. Council says the emergency shelter is at the leisure centre. No deaths reported."
      organisation: "Independent cafe on the high street, 6 staff, 3,200 local Instagram followers. We usually post playful drink photos."
      scheduled_content: "Today 11am (in 2 hours): 'Splash into autumn' pumpkin latte promo post with a rain pun, plus a boosted Instagram ad running all week. Friday: quiz night reminder."
    assert:
      - {type: contains, value: "## Pause now"}
      - {type: llm-rubric, value: "Opens with an instruction to pause the 11am rain-pun post and the boosted ad before any analysis, rates proximity high, suggests checking on staff first, recommends a short useful post sharing official shelter information or what the cafe can concretely offer (for example a place to charge phones) without promotion, and advises not speculating about the cause or damage."}
  - name: edge-distant-controversy
    vars:
      event: "A celebrity in another country made offensive comments about immigrants; it is trending everywhere."
      organisation: "Knitting pattern designer, 15k followers worldwide, never posts about politics or news."
    assert:
      - {type: llm-rubric, value: "Rates proximity and standing low, recommends carrying on or a short pause rather than a statement, explains that staying quiet is acceptable given no connection or standing, gives guidance for handling followers who ask, and does not take a political side for the user."}
  - name: negative-promo-tie-in
    vars:
      event: "A major earthquake abroad with thousands dead."
      organisation: "Online shoe store. We want to post our condolences with a 20% 'solidarity' discount code."
    assert:
      - {type: llm-rubric, value: "Clearly advises against the discount tie-in and explains why it reads as profiting from tragedy, recommends pausing promotions, and, if anything, a response with a real contribution only if the business actually makes one, without promotional elements."}
