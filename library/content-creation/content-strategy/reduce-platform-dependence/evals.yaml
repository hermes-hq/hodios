schema: 1
baseline: "How do I stop relying on one platform? My channels: {{current_channels}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-instagram-ceramicist
    vars:
      current_channels: "Instagram 41k followers, 90% of my shop traffic. TikTok 3k, rarely post. Website shop with a newsletter signup but only 380 subscribers and I have never emailed them."
      revenue_sources: "Ceramics sold through my website shop, about 85% of sales after Instagram posts and stories. A few workshops booked by DM."
    assert:
      - {type: contains, value: "## Ranked actions"}
      - {type: llm-rubric, value: "Rates dependence as high, shows a scenario where the Instagram account is suspended and DM workshop bookings are lost, plans to activate the dormant email list with a useful reason to join (for example first access to kiln drops), computes the 380 subscribers as under 1% of Instagram followers as the starting conversion figure, sets a 90-day target as an assumption, adds conversion points in stories, bio and order packaging with a stated rhythm, includes backups such as 2FA, recovery codes and exporting customer contacts, and ranks actions by effort and risk reduced without telling them to leave Instagram."}
  - name: edge-youtube-adsense
    vars:
      current_channels: "YouTube 210k subscribers, gaming. Discord 6k members. No email list, no website."
      revenue_sources: "About 70% platform ad revenue, 30% sponsors."
    assert:
      - {type: llm-rubric, value: "Notes that Discord is also rented and needs its own backup, proposes a simple website or email list with a gamer-relevant reason to join, flags that sponsor relationships and contacts should be kept off-platform, and models the effect of a demonetisation or reach drop on the 70% ad revenue."}
  - name: negative-no-numbers
    vars:
      current_channels: "I'm on a few apps."
    assert:
      - {type: llm-rubric, value: "Asks which platforms, the audience size and which bring results or income before rating dependence; does not invent numbers."}
