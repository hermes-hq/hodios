schema: 1
baseline: "Turn these notes into a content strategy summary: {{strategy_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-board-charity
    vars:
      strategy_notes: "Charity for carers of people with dementia. Goal: more carers using our helpline and online forum (currently ~300 helpline calls a month). Audience: adult children 40-65 caring for a parent, often working. Ideas: practical guides (benefits, care homes, sleep), carer stories, short videos with our nurses. Channels: website guides + SEO, Facebook, monthly email. Need a part-time content officer (0.6 FTE, about 18k) and 2k for video. Stop the daily Twitter posting, nobody engages. Board meets in March."
      reader: board
    assert:
      - {type: contains, value: "## The ask"}
      - {type: llm-rubric, value: "Opens with the board decision (approve 0.6 FTE content officer and video budget), links content to helpline and forum use with the 300 calls baseline, uses plain language without platform jargon, includes stopping daily Twitter posting under what will not be done, mentions safeguarding or reputational risk of carer stories, and stays near one page."}
  - name: edge-client-missing-figures
    vars:
      strategy_notes: "Client: regional chain of 4 physio clinics. They want more bookings for sports injury appointments. We'd do 2 blog posts a month, Instagram reels with physios 2x week, Google business posts. Fee TBC. They need to give us a physio for 2 hours a month for filming."
      reader: client
    assert:
      - {type: llm-rubric, value: "Frames for a client with deliverables and what the client must provide (physio filming time and approvals), marks the fee and baseline bookings as [X] and lists them on a 'To confirm' line rather than inventing figures, and uses bookings as the success measure."}
  - name: negative-no-goal
    vars:
      strategy_notes: "We should post more on TikTok and LinkedIn. Maybe a podcast."
    assert:
      - {type: llm-rubric, value: "Points out there is no organisational goal, audience or resource information, asks for these, and does not produce a full one-pager filled with invented goals or numbers."}
