schema: 1
baseline: "How long will this content plan take? {{content_plan}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-solo-yoga-teacher
    vars:
      content_plan: "Yoga teacher, doing it alone. Plan: 1 YouTube class video a week (30 min class, I film in my studio, editing takes me about 4 hours), 5 Instagram reels a week cut from the class, 1 email a week, and a blog post twice a month for SEO. I use a paid editing app."
      available_hours: 24
      budget: "60 GBP"
    assert:
      - {type: contains, value: "## Options to fit"}
      - {type: llm-rubric, value: "Breaks each format into stages using the stated 4-hour edit, shows monthly hours with arithmetic and a buffer, shows the plan exceeds 24 hours, offers options such as fewer reels cut in one batch from the weekly class and turning the class into the blog post, recommends a fitted plan within 24 hours that protects the weekly class, and does not state tool or freelancer prices as fact."}
  - name: edge-team-nonprofit
    vars:
      content_plan: "Comms team of 2 at a housing charity. Monthly: 4 case-study videos with an external videographer, 12 social posts, a newsletter, a quarterly report. Each case study needs sign-off from programme staff and legal."
      available_hours: 120
    assert:
      - {type: llm-rubric, value: "Includes the hidden time of approvals and consent for case studies, puts the videographer as [rate] times hours rather than inventing a fee, notes the budget is not stated, and compares options such as fewer videos with repurposed cut-downs."}
  - name: negative-no-volumes
    vars:
      content_plan: "Some videos and posts."
      available_hours: 10
    assert:
      - {type: llm-rubric, value: "Asks which formats and how many per week or month, and who does the work, rather than inventing a plan to cost."}
