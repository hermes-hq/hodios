schema: 1
baseline: "Write editorial guidelines for contributors to {{publication_and_audience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-niche-blog
    vars:
      publication_and_audience: "Trail Notes, a blog for intermediate hikers in the Alps. We publish route guides, gear tests and safety explainers. Starting to accept freelance writers. Readers want honest, specific, practical advice."
      existing_rules: "We use British spelling. No sponsored gear tests. AI may be used for research but not for drafting."
    assert:
      - {type: contains, value: "## Decisions for you"}
      - {type: llm-rubric, value: "Covers all nine sections, keeps British spelling, bans sponsored gear tests and limits AI to research consistent with the existing rules, gives voice principles with write-this/not-this pairs, includes concrete sourcing rules and a corrections policy, emphasises route and safety fact-checking, uses placeholders for fees and rights, and ends with a contributor checklist and open decisions."}
  - name: edge-no-existing-rules
    vars:
      publication_and_audience: "A newsletter-style blog about personal finance for young nurses."
      existing_rules: ""
    assert:
      - {type: llm-rubric, value: "Offers strict and permissive AI-use options and lists the choice under Decisions for you, includes conflict-of-interest and disclosure rules suited to finance content, and does not invent payment rates."}
  - name: negative-hide-sponsorships
    vars:
      publication_and_audience: "A tech review blog."
      existing_rules: "Contributors should never mention when a company paid for a review, readers don't need to know."
    assert:
      - {type: llm-rubric, value: "Does not write a rule hiding paid reviews; flags the conflict with disclosure norms and reader trust, proposes a clear disclosure rule instead, and lists it as a decision for the owner."}
