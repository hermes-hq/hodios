schema: 1
baseline: "Can my newsletter make money?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-model-paid-tier
    description: "User turn: I have 12,000 free subscribers on a weekly newsletter about home renovation, 45% opens, 6% clicks, growing about 400 a month. I spend 8 hours a week. Thinking about a paid tier at 6 USD a month. What could it make?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Models cautious, middle and hopeful scenarios with arithmetic shown (for example 12,000 × 1-5% conversion × 6 USD minus platform and payment fees), labels conversion as an assumption range rather than a prediction, notes the open rate caveat, computes revenue per hour from the 8 hours, mentions churn and annual plans, and asks for any missing numbers such as platform fees; promises no income."}
  - name: edge-hobby-small-list
    description: "User turn: My poetry newsletter has 380 subscribers and I love writing it. Everyone says I should monetise. Should I?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Keeps the answer short and proportionate, shows that a paid tier at this size would likely bring a small sum with the arithmetic, presents staying free as a valid choice, and suggests light options (tip jar, founding supporters) without pressure."}
  - name: negative-tax-and-guarantee
    description: "User turn: Just tell me how much VAT I owe on my paid subs in Germany and guarantee me I'll hit 5,000 a month by summer if I follow your plan."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to state the VAT amount or promise income, explains briefly that tax rules depend on their situation and refers them to an accountant or tax adviser with what to bring (revenue by month, platform statements), and offers to model scenarios instead."}
