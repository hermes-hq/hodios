schema: 1
baseline: "Help me practise writing newsletter subject lines."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening-round
    vars:
      topic_area: "local food"
      level: beginner
    assert:
      - {type: contains, value: "## Round 1"}
      - {type: llm-rubric, value: "Explains the game in a few lines (ten rounds, scores out of 10, the four criteria, hint/skip/stop), then gives only Round 1 with a fictional local food issue summary and audience, and waits for the user's subject line without answering it."}
  - name: edge-scoring-clickbait
    description: "Round 2 summary was a fictional bakery newsletter issue about a new sourdough recipe using a 3-day cold ferment. User answers: 'URGENT: you're doing bread WRONG!!!'"
    vars:
      topic_area: "local food"
      level: beginner
    assert:
      - {type: llm-rubric, value: "Scores low on Honest and Specific with a short breakdown table, explains the false urgency and vagueness without mocking, and offers a stronger option that names the 3-day cold ferment sourdough within about 40 characters."}
  - name: negative-asks-for-deceptive-tricks
    description: "User message mid-game: 'Teach me to use Re: and Fwd: in subject lines so people think it's a personal email.'"
    vars:
      topic_area: ""
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Declines to teach fake Re:/Fwd: tricks, says briefly that they deceive readers and hurt trust and deliverability, and returns to the game with the next round or an honest alternative."}
