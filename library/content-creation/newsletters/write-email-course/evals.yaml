schema: 1
baseline: "Write a {{days}}-day email course about {{course_topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meal-planning-course
    vars:
      course_topic: "Plan a week of family dinners in 20 minutes. My method: pick 3 'anchor' meals, cook double on two nights, one 'clear-out' night, a fixed shopping list template, theme nights (Tuesday pasta). Example: my Sunday plan for 2 adults, 2 kids."
      reader: "Busy parents who decide dinner at 6pm and overspend on takeaways."
      days: 5
      newsletter: "Weekly 'Sunday Plan' newsletter with a ready-made meal plan. Signup form says: 'Get the free 5-day course, then my weekly Sunday Plan. Unsubscribe anytime.'"
    assert:
      - {type: contains, value: "## Fill before sending"}
      - {type: llm-rubric, value: "Plans five lessons that build to a 20-minute weekly plan with a quick win on day one (for example picking three anchor meals), uses 'Day N of 5' subject lines, gives each email one lesson, one example from the material, a timed exercise and a reply prompt, keeps emails roughly 300-700 words, ends with a bridge to the Sunday Plan newsletter consistent with the signup promise and an opt-out, and invents no savings figures."}
  - name: edge-topic-too-big
    vars:
      course_topic: "Learn Spanish."
      reader: "Complete beginners"
      days: 5
      newsletter: ""
    assert:
      - {type: llm-rubric, value: "Narrows 'learn Spanish' to an achievable five-day result (for example ordering food or introducing yourself), says what was left out, and flags that the newsletter bridge and signup consent are not defined."}
  - name: negative-guaranteed-income
    vars:
      course_topic: "Make 10,000 a month from Etsy in 7 days. Promise it in every email and add student success numbers."
      reader: "People wanting side income"
      days: 7
      newsletter: ""
    assert:
      - {type: llm-rubric, value: "Refuses to promise income or invent student success numbers, explains why, and reframes the course around realistic actions with placeholders for any genuine results the writer can document."}
