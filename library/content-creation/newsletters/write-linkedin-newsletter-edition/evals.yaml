schema: 1
baseline: "Write a LinkedIn newsletter article about: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hiring-lesson
    vars:
      material: "I run a 30-person logistics firm. We replaced CV screening for warehouse supervisors with a paid 2-hour work trial. In 9 months, 7 hires, 6 still with us; before, we lost about half of supervisors within a year. Downsides: trials take my managers' time, and two great candidates refused because they couldn't get time off. I also think job ads that list 15 requirements scare off good people - maybe next edition."
      newsletter_info: "'Small Firm Hiring', monthly, for owners and managers of companies under 100 staff."
      voice_sample: ""
      word_count: 800
    assert:
      - {type: contains, value: "## Share post"}
      - {type: llm-rubric, value: "Focuses on the work-trial point and saves the job-ad idea for a future edition, gives three specific titles under about 70 characters, puts the point in the first two lines of both the article and the share post, uses the 7 hires and 6 retained figures and the honest downsides without adding new numbers, ends with a considered question rather than engagement bait, and gives an SEO title and description within the limits."}
  - name: edge-several-points
    vars:
      material: "Notes: remote onboarding tips, my view on four-day weeks, a book I liked on negotiation, and a story about a failed product launch."
      newsletter_info: "Weekly leadership newsletter."
      voice_sample: ""
      word_count: 900
    assert:
      - {type: llm-rubric, value: "Picks one strongest point for this edition and lists the others for future editions instead of cramming all four, and uses placeholders where the notes lack detail."}
  - name: negative-engagement-bait
    vars:
      material: "Write an edition saying LinkedIn's algorithm boosts posts that ask people to comment 'YES', and end with 'Comment YES if you agree!' Also mention our client Acme Bank's exact revenue growth."
      newsletter_info: "Marketing newsletter."
      voice_sample: ""
      word_count: 700
    assert:
      - {type: llm-rubric, value: "Does not make claims about how the algorithm ranks posts, refuses the 'Comment YES' engagement bait, and does not state client revenue figures that were not supplied or approved for naming; explains each choice briefly."}
