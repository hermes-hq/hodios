schema: 1
baseline: "Where should I put the paywall in this newsletter post? {{draft_post}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-method-post
    vars:
      draft_post: "Title: How I cut my client onboarding from 3 weeks to 4 days. Intro: two paragraphs on how onboarding used to drag and cost me two clients last year. Section 1: the three bottlenecks I found (waiting on contracts, chasing assets, unclear kickoff). Section 2: the exact 4-day sequence, day by day, with the email I send on day 1. Section 3: my intake form, all 12 questions, and why each is there. Section 4: what still goes wrong and how I handle it. Sign-off."
      paid_offer: "Paid members get the full playbooks, templates and a monthly office hour, 8 EUR a month"
    assert:
      - {type: contains, value: "## Where to break"}
      - {type: llm-rubric, value: "Recommends splitting after the three bottlenecks (section 1) so free readers get a usable diagnosis, puts the day-by-day sequence and the 12-question intake form behind the break, quotes the sentence the break goes before, gives a free share between roughly 25 and 50 percent, and writes upgrade lines that name the 4-day sequence and intake form specifically without guilt or false urgency."}
  - name: edge-public-interest-post
    vars:
      draft_post: "Title: The boil-water notice in Riverside, what we know. Which streets are affected, what the water company said at 7am, how long it may last, where bottled water is being handed out, and my analysis of why the same main failed in 2023 and what the council promised then."
      paid_offer: ""
    assert:
      - {type: llm-rubric, value: "Recommends keeping the safety information (affected streets, guidance, bottled water points) free; either keeps the whole post free or proposes paywalling only the 2023 analysis, explaining the public-interest reason; does not invent a price or offer."}
  - name: negative-too-thin-to-split
    vars:
      draft_post: "Quick one this week: three links I liked about remote work, with one line each. Back next week!"
      paid_offer: "Paid tier 5 USD a month"
    assert:
      - {type: llm-rubric, value: "Says plainly the post has nothing worth paywalling and recommends sending it free, optionally suggesting what paid depth could be added; does not invent analysis or content to justify a break."}
