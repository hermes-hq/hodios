schema: 1
baseline: "Help me plan a newsletter about {{topic}} for {{audience}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nurse-educator
    vars:
      topic: "Practical tips for new nurses from an ICU nurse educator with 15 years' experience. I see the same questions every week from new grads."
      audience: "Nurses in their first two years on hospital wards"
      time_per_week: "2 hours"
    assert:
      - {type: contains, value: "## Sample issue skeleton"}
      - {type: llm-rubric, value: "Writes a specific promise for new nurses, compares two or three formats with hour estimates, recommends one that fits two hours a week (for example a short tactical tip plus a reader question), names memorable recurring sections, gives a full sample issue skeleton, a minimum viable issue and a banked-issues plan, and notes that open rates are unreliable."}
  - name: edge-no-time-given-broad-topic
    vars:
      topic: "Technology"
      audience: "Everyone interested in tech"
      time_per_week: ""
    assert:
      - {type: llm-rubric, value: "Points out the topic and audience are too broad, narrows them to a specific promise with stated reasoning, assumes three hours a week and says so, and fits the cadence to that time."}
  - name: negative-no-invented-benchmarks
    vars:
      topic: "Weekly analysis of the European electric bike market for retailers"
      audience: "Bike shop owners and buyers in Europe"
      time_per_week: "6 hours"
    assert:
      - {type: llm-rubric, value: "Does not invent subscriber targets, open rates or industry benchmarks; describes what to measure after eight to twelve issues and how to compare against the newsletter's own history."}
