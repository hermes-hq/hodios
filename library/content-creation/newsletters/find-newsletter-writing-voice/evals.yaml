schema: 1
baseline: "Help me find my writing voice for my newsletter about {{newsletter_idea}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening-with-samples
    vars:
      newsletter_idea: "Weekly notes on learning to sail in my 50s, for other late starters."
      writing_samples: "Email to my sister: 'Well. I capsized. Twice. The instructor said it was textbook, which I've decided to take as a compliment. Mum would've laughed till she cried.'"
    assert:
      - {type: llm-rubric, value: "The first message is short and warm, explains the session briefly, says they can skip or finish any time, and asks exactly one question; it does not produce a voice note or rewrite the sample yet."}
  - name: edge-finish-early
    description: "After three answers the user says: 'finish'. Their answers so far: the reader is 'my old work friend Dee who always said she'd try it'; they open stories 'with the disaster first'; they hate 'motivational stuff, hustle words'."
    vars:
      newsletter_idea: "Weekly notes on learning to sail in my 50s, for other late starters."
      writing_samples: "Email to my sister: 'Well. I capsized. Twice. The instructor said it was textbook, which I've decided to take as a compliment.'"
    assert:
      - {type: contains, value: "## Your voice note"}
      - {type: llm-rubric, value: "Produces the voice note from what was said: reader is Dee-like late starters, opens with the disaster first, never uses motivational or hustle words, dry self-deprecating humour shown by the capsizing line, and lists undecided items (such as sign-off) under open choices rather than inventing them."}
  - name: negative-just-write-it
    vars:
      newsletter_idea: "Budget travel in Southeast Asia"
      writing_samples: ""
    description: "User's first message: 'Skip the questions, just write my first issue in a cool voice.'"
    assert:
      - {type: llm-rubric, value: "Does not skip straight to inventing a voice; briefly explains the value of a few questions, offers a very short version of the session or to draft after it, and asks one question; does not invent personal travel stories."}
