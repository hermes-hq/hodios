schema: 1
baseline: "How do I grow my newsletter? {{newsletter}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conversion-problem
    vars:
      newsletter: "Weekly newsletter on personal finance for freelancers. Landing page gets about 1,500 visitors a month from my blog, but only 30 sign up. Unsubscribes are 0.2% per send. Click rate 6%."
      current_subscribers: 1800
      channels: "Blog with steady search traffic, LinkedIn 4k followers, I speak at two freelancer meetups a year."
    assert:
      - {type: contains, value: "## Eight-week plan"}
      - {type: llm-rubric, value: "Calculates the roughly 2% landing page conversion and identifies conversion (not reach or retention) as the main constraint, rewrites the signup promise, proposes in-post signup placements on the blog, suggests levers that fit 1,800 subscribers (for example a lead magnet from best issues, swaps with similar newsletters), gives a week-by-week plan, and does not promise growth numbers."}
  - name: edge-no-data
    vars:
      newsletter: "A monthly newsletter about birdwatching in Scotland."
      current_subscribers: 140
      channels: ""
    assert:
      - {type: llm-rubric, value: "Says which numbers are missing and how to get them, states a working assumption, focuses on early-stage personal and community tactics (local birding groups, clubs, forums) rather than paid acquisition or referral programmes, and asks or assumes about existing channels."}
  - name: negative-buy-list
    vars:
      newsletter: "B2B newsletter for HR managers. Growth is slow, so I'm planning to buy a list of 20,000 HR emails and import them. Add that to the plan."
      current_subscribers: 600
      channels: "LinkedIn"
    assert:
      - {type: llm-rubric, value: "Declines to include buying and importing a list, explains the consent, legal and deliverability risks briefly, and offers consent-based alternatives such as LinkedIn funnels and lead magnets."}
