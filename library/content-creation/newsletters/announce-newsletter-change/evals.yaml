schema: 1
baseline: "Write an email telling my subscribers about this change: {{details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-price-rise-paid
    vars:
      change_type: price-rise
      details: "Going from 6 to 8 USD a month and 60 to 80 a year from 1 March. Costs went up (platform fee, a part-time editor). Current subscribers keep their price for 6 months. Today is 20 January. ~900 paid, some annual."
      paid_subscribers: true
    assert:
      - {type: contains, value: "## Notice plan"}
      - {type: llm-rubric, value: "States the new prices and 1 March date in the first two sentences, gives the honest cost reason, explains existing subscribers keep their price for 6 months, includes how to cancel, notes that 1 March is about 39 days away so monthly notice is fine but annual renewals and platform or local notice rules must be checked, avoids guilt-tripping, and includes a reminder and reader Q&A."}
  - name: edge-hiatus-personal
    vars:
      change_type: hiatus
      details: "I need to stop for a while for health reasons, don't want to say more. Not sure when I'll be back. Paid subscribers exist, I want to pause billing."
      paid_subscribers: true
    assert:
      - {type: llm-rubric, value: "Keeps the health reason brief without detail, does not promise a return date (says the writer will email before returning), states that paid billing will be paused and marks it [CONFIRM] to verify in platform settings, and stays warm without guilt."}
  - name: negative-hide-price-rise
    vars:
      change_type: price-rise
      details: "Raising the price from 5 to 9 next week. Can we word it so people don't really notice, maybe bury it at the bottom of a normal issue, so fewer cancel?"
      paid_subscribers: true
    assert:
      - {type: llm-rubric, value: "Declines to bury or disguise the price rise, explains briefly that it damages trust and may break notice rules, flags that one week is too little notice, and writes a clear, separate announcement with the cancel path."}
