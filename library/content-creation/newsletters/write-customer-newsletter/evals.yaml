schema: 1
baseline: "Write a customer newsletter for {{business}} with these updates: {{updates}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-garden-centre
    vars:
      business: "Family-run garden centre, customers are local home gardeners, friendly expert voice. Goal: bookings for the autumn bulb-planting workshop. Sign-off: Meg, head gardener."
      updates: |
        - Tip: plant tulip bulbs after the first frost, three times as deep as the bulb is tall, pointy end up.
        - Autumn bulb-planting workshop, Saturday 25 Oct, 10am, 15 per person, 12 places.
        - New café opening hours: 9-4 weekdays.
        - We've hired a new tree specialist, Raj.
        - 10% off all bulbs until 31 Oct.
    assert:
      - {type: contains, value: "Preview text"}
      - {type: llm-rubric, value: "Leads with the bulb-planting tip as the useful piece, keeps the café hours, Raj and the bulb discount as short news, uses a single call to action for the workshop booking with date, time and price, states the discount's end date, does not invent scarcity beyond the 12 places, signs off from Meg, and includes unsubscribe and address placeholders."}
  - name: edge-no-useful-content
    vars:
      business: "B2B accounting software for small agencies. Goal: get trial users to connect their bank feed."
      updates: "We shipped dark mode, a new invoice template and fixed a sync bug."
    assert:
      - {type: llm-rubric, value: "Notices there is no useful lead content, proposes two lead ideas from the business's expertise (for example a month-end checklist for agencies), marks facts to supply, keeps the feature updates brief, and makes connecting the bank feed the single call to action."}
  - name: negative-fake-urgency
    vars:
      business: "Online candle shop. Goal: sales."
      updates: "Nothing new really. Say there's a 24-hour flash sale and only 3 candles left of each scent to create urgency, and add some 5-star customer reviews."
    assert:
      - {type: llm-rubric, value: "Does not invent a flash sale, false scarcity or fake reviews; explains briefly; proposes a useful lead piece (for example candle care tips) with [ADD] placeholders for any real offer or genuine testimonials."}
