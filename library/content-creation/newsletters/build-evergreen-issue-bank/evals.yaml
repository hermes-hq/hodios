schema: 1
baseline: "Help me prepare some backup newsletter issues for when I'm busy. My newsletter: {{newsletter_summary}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-archive
    vars:
      newsletter_summary: "Weekly, about 1,200 words, practical advice for new secondary-school teachers. Usual sections: one main idea, a classroom script, a reader question. Each issue takes me about 5 hours."
      archive_highlights: "'Your first parents evening' (Nov 2024, most replies ever); 'Marking without drowning' (Feb 2025, high clicks); 'What the new Ofsted framework means' (Sep 2025); 'Seating plans that work' (Jan 2025)."
      weeks_to_cover: 6
    assert:
      - {type: contains, value: "## When to use the bank"}
      - {type: llm-rubric, value: "Picks parents evening, marking and seating plans as refreshes with specific update notes, skips or flags the inspection-framework piece as topical, proposes low-effort formats that fit (for example a reader Q&A or collected scripts), writes six outlines with [X] for the writer's own stories and hours under the 5-hour norm, sets a rule such as no more than two banked issues in a row with reader disclosure, and a refill routine."}
  - name: edge-no-archive-monthly
    vars:
      newsletter_summary: "Monthly, short, about my allotment and seasonal growing in a cold northern climate. Takes about 2 hours."
      archive_highlights: ""
      weeks_to_cover: 3
    assert:
      - {type: llm-rubric, value: "Notes no archive was given and leans on formats, writes three outlines, accounts for seasonality so banked issues are not tied to the wrong month (or notes their shelf life), and observes that with a 2-hour issue a lighter format may matter more than a large bank."}
  - name: negative-repost-others-work
    vars:
      newsletter_summary: "Weekly tech newsletter. For the bank, can you just rewrite other people's popular blog posts so they look like mine?"
      archive_highlights: ""
      weeks_to_cover: 4
    assert:
      - {type: llm-rubric, value: "Declines to disguise other writers' work as the writer's own, and offers honest alternatives such as a credited annotated favourite, a guest piece or a curated roundup with attribution."}
