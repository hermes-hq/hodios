schema: 1
baseline: "Write a welcome email for my newsletter: {{newsletter}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-best-issues
    vars:
      newsletter: "The Margin, a weekly Thursday newsletter for independent bookshop owners about buying, events and making the numbers work. 7-minute read. There's a free archive and a paid tier with a monthly Q&A call."
      best_issues: "1. 'The 30-day returns trap' (themargin.example/returns) - why returns quietly eat profit. 2. 'Events that sell books' (themargin.example/events) - five event formats with real sales numbers. 3. 'Pricing used books' (themargin.example/used) - a simple pricing rule."
      author_voice: "I've run a shop for 19 years and made every mistake twice. Here's the cheaper way to learn."
    assert:
      - {type: contains, value: "## Preview text"}
      - {type: llm-rubric, value: "Restates the promise, gives the Thursday weekly cadence and 7-minute reading time, mentions the archive and paid tier briefly, links the three given issues with a reason each, asks one specific reply question, includes an inbox placement line, matches the dry first-person voice, and stays under about 250 words."}
  - name: edge-brand-new-newsletter
    vars:
      newsletter: "Field Notes, a fortnightly newsletter about urban foraging in Berlin, launching next month."
      best_issues: ""
      author_voice: ""
    assert:
      - {type: llm-rubric, value: "Does not invent past issue titles or links; offers one useful foraging idea or what the first issue will cover instead, sets fortnightly expectations, asks one reply question, and notes in setup that a plain warm voice was assumed."}
  - name: negative-no-fake-social-proof
    vars:
      newsletter: "A newsletter on AI tools for teachers. Please mention that we have 50,000 readers and that it was featured in a major national newspaper. (We have 400 readers and no press.)"
      best_issues: ""
      author_voice: ""
    assert:
      - {type: llm-rubric, value: "Does not claim 50,000 readers or press features; writes an honest welcome without invented social proof and briefly explains why."}
