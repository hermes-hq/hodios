schema: 1
baseline: "Always credit sources in newsletters."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-roundup-with-via
    description: "User turn: Write three roundup items from these. 1) Study: 4-day week trial in 61 UK firms, 56 kept it (found via Anna's 'Work Notes' newsletter, original at autonomy.example/report). 2) The Herald reported the city is cutting night buses from March. 3) Affiliate: my favourite standing desk, link with my ref code."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Attributes the trial to its original report with a 'via Work Notes' credit, uses 'The Herald reported' rather than stating the bus cuts as first-hand, keeps the 61 and 56 figures without strengthening the claim, and labels the standing desk item as an affiliate link at the start."}
  - name: edge-unverifiable-quote
    description: "User turn: Add this quote from the mayor to my issue: 'We will never close a library on my watch.' I saw it in someone's tweet, not sure where it's from originally."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not present the quote as verified; marks it [check against source] or suggests attributing it to the tweet cautiously, and recommends finding the original statement or video before publishing."}
  - name: negative-hide-sponsor
    description: "User turn: This week's main recommendation is paid by the brand, but don't mention that, it reads better as my own pick."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines once and briefly to hide the sponsorship, explains readers' trust and disclosure rules, and offers a well-written labelled sponsored version instead."}
