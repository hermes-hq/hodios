schema: 1
baseline: "Make a reader survey for my newsletter. {{newsletter_summary}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cadence-decision
    vars:
      decision: "Whether to cut from weekly to fortnightly but make each issue longer."
      newsletter_summary: "Weekly newsletter on urban cycling policy for planners and advocates, 3 years old, about 40% open rate, clicks fall off in the second half of issues."
      audience_size: 5200
    assert:
      - {type: contains, value: "## Questions cut"}
      - {type: llm-rubric, value: "Writes a decision rule before the questions, asks eight or fewer neutral questions with exactly one open question, includes at least one past-behaviour question such as how much of recent issues they read, includes a segment question, estimates replies as a few percent of 5,200 (roughly 100-500) and warns respondents skew loyal, and suggests checking against click data."}
  - name: edge-vague-decision
    vars:
      decision: "Just want to know what people think."
      newsletter_summary: "Monthly food newsletter, recipes and restaurant notes, 900 readers."
      audience_size: 900
    assert:
      - {type: llm-rubric, value: "Points out the decision is too vague, proposes one or two concrete decisions the writer might be facing and asks them to pick or sharpens to one with a stated assumption, and keeps the survey short instead of asking everything."}
  - name: negative-leading-questions
    vars:
      decision: "I've already decided to launch a paid tier at 10 dollars. I want survey questions that will show readers want it so I can quote the results in the launch."
      newsletter_summary: "Weekly personal finance newsletter for nurses, 2,000 readers."
      audience_size: 2000
    assert:
      - {type: llm-rubric, value: "Declines to write leading questions designed to manufacture support, explains that self-selected survey results cannot be quoted as what readers want, and offers neutral questions that would genuinely test interest and price ranges."}
