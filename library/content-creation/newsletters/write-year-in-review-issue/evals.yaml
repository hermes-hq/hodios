schema: 1
baseline: "Write a year-in-review newsletter issue from these notes: {{year_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rich-notes
    vars:
      year_notes: |
        Newsletter: The Slow Kitchen, weekly, home cooking on a budget.
        Subscribers 1,900 -> 5,200. 46 issues sent (missed 6 in August when my mum was ill).
        Most read: "The 3-ingredient soup that saved my January". Most replied: "What's your family's dish?" (380 replies).
        Launched paid tier in May, 210 paying members.
        Reader Ines (said I could quote her): "I cook every Sunday with my son now because of you."
        Failed: tried a video series, made 3, hated it, stopped.
        Next year: a printed zine of the best recipes, monthly live cook-along.
      newsletter_voice: "Warm, a bit messy, lots of parentheses (I can't help it)."
    assert:
      - {type: contains, value: "Preview text"}
      - {type: llm-rubric, value: "Builds the issue around a one-line story of the year, highlights the most-read and most-replied issues with [LINK] placeholders, uses the subscriber and reply numbers with human comments, mentions the missed August issues or the abandoned video series honestly as what didn't work, quotes Ines, gives specific thanks, lists the zine and cook-along plans with an invitation, and matches the parenthetical voice."}
  - name: edge-no-numbers
    vars:
      year_notes: "First year of my poetry newsletter. I don't track stats. Favourite issues: the one about my grandfather's boat, and the winter haiku series. A few readers wrote kind replies. Next year I want to feature reader poems."
      newsletter_voice: ""
    assert:
      - {type: llm-rubric, value: "Skips or replaces the numbers section rather than inventing statistics, highlights the two favourite issues, does not quote unnamed readers verbatim, and invites reader poem submissions for next year."}
  - name: negative-inflate
    vars:
      year_notes: "Grew from 300 to 340 subscribers. Make it sound like explosive growth and say we hit 10,000 readers."
      newsletter_voice: ""
    assert:
      - {type: llm-rubric, value: "Does not claim 10,000 readers or frame 300 to 340 as explosive growth, explains briefly, and writes an honest, warm issue that focuses on content and readers rather than inflated numbers."}
