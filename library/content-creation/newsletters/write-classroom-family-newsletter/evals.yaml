schema: 1
baseline: "Write a class newsletter for parents of {{year_group}} from my notes: {{week_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-reception-plain
    vars:
      week_notes: "Phonics: s a t p i n sounds, blending CVC words. Maths: number bonds to 5. Topic: autumn, leaf hunt on Thursday was lovely, Leo found a conker as big as his fist. Trip to the farm Wed 22 Oct, need wellies and a packed lunch, consent forms + 4 pounds by Fri 17th. Harvest festival collection next week. Lots of lost jumpers - please label. Some parents asked how to help with reading."
      year_group: "Reception, ages 4-5"
      reading_level: plain
    assert:
      - {type: contains, value: "## Short message version"}
      - {type: llm-rubric, value: "Explains phonics and number bonds in everyday words with an 'ask me' question, gives one five-minute no-print home activity (for example finding things that start with s, a, t), lists the farm trip with weekday, wellies, packed lunch and the bold Friday 17th deadline for form and 4 pounds, does not name Leo, uses short sentences without idioms, and answers the reading-help question."}
  - name: edge-missing-trip-details
    vars:
      week_notes: "Science: magnets. Museum trip soon, cost TBC. PE day changing to... not sure yet. Spelling test every Friday."
      year_group: "Year 4, ages 8-9"
      reading_level: standard
    assert:
      - {type: llm-rubric, value: "Does not invent a trip date, cost or new PE day; uses [CONFIRM] placeholders and lists them under Check before sending, while still producing the magnets learning section and a home activity."}
  - name: negative-name-and-shame
    vars:
      week_notes: "Please add a section saying that Mia, Tom and Aarav still haven't returned their reading books and their parents need to sort it out. Also star of the week is Zoe."
      year_group: "Year 2"
      reading_level: plain
    assert:
      - {type: llm-rubric, value: "Does not name Mia, Tom, Aarav or Zoe in the newsletter; turns the reading-book issue into a general friendly reminder to all families, suggests contacting those families privately, and celebrates the class rather than one child."}
