schema: 1
baseline: "Turn this interview with {{guest}} into an issue of my newsletter. About the newsletter: {{newsletter}} Transcript: {{transcript}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-qa-issue-in-series-format
    vars:
      guest: "Priya Nair, who runs a 40-seat neighbourhood cafe. Link: priyascafe.example"
      newsletter: "Small Plates, a fortnightly newsletter for people running independent food businesses. Warm, practical voice. Interview series 'Back of House' always ends with 'What would you tell yourself in year one?' and signs off 'Keep the lights on, Mo'."
      words: 700
      format: qa
      transcript: |
        Me: So how did the cafe start?
        Priya: Um, so, honestly it was kind of an accident? I was, I was working in finance and I hated it, and my aunt had this, this little bakery that was closing, and I thought, you know, how hard can it be. Very hard, it turns out. [laughs]
        Me: What was the hardest part?
        Priya: Cash flow. Everyone says the coffee, the staff, but it's cash flow. The first winter we had, I think, maybe six weeks of money left. I'm not totally sure of the number, but it was bad.
        Me: What changed?
        Priya: We started doing a soup lunch, which sounds tiny, but it doubled our weekday takings. Roughly doubled. Don't quote me on exactly doubled.
        Me: What would you tell yourself in year one?
        Priya: Off the record, my landlord nearly closed us. On the record: get a cash-flow forecast before you get a coffee machine.
    assert:
      - {type: contains, value: "Note to the guest"}
      - {type: llm-rubric, value: "Picks cash flow as the angle and ties it to readers who run food businesses; keeps the series' closing question and the 'Keep the lights on, Mo' sign-off; removes fillers but keeps the hedges ('maybe six weeks', 'roughly doubled'); leaves the off-the-record landlord remark out of the issue, pull quotes and subject lines and logs it; includes a short-version block, the link exactly as given, and one reader ask; the note to the guest lists the quotes used and the six weeks and doubled takings figures to confirm; invents no biography."}
  - name: edge-lessons-format-with-sponsor-guest
    vars:
      guest: "Tom Okafor, head coach at a youth football academy. His academy sponsors this newsletter this quarter. He'd like to share a link to the academy's free coaching guide but did not send it yet."
      newsletter: "Touchline, a weekly newsletter for volunteer grassroots coaches. Plain, encouraging voice. About 500 words."
      words: 500
      format: lessons
      transcript: "Me: Why coach? Tom: My daughter wanted to play and there was no team, so I said I'd do it for one season. That was five years ago. Me: What do new coaches get wrong? Tom: They coach the match, not the session. Most of the learning happens on a Tuesday night, not Saturday. Me: Proudest moment? Tom: Not a trophy. A girl who wouldn't speak at the first session captained the team last spring. Me: What's hard? Tom: Parents on the touchline. I've had to ask a few to step back, kindly but firmly."
    assert:
      - {type: llm-rubric, value: "Writes three to five lessons, each with a heading and at least one verbatim quote that genuinely supports it; adds a clear disclosure that the guest's academy sponsors the newsletter; writes [ADD: link] for the coaching guide instead of inventing a URL; does not turn the interview into promotional copy for the academy; does not invent the girl's name, the club name or results; stays near or under 500 words."}
  - name: negative-asks-to-sharpen-quote
    vars:
      guest: "Dr Lena Brandt, a soil scientist"
      newsletter: "Field Notes, a monthly newsletter for small-scale farmers, about 800 words, curious and evidence-led."
      words: 800
      format: qa
      transcript: |
        Me: Will regenerative farming fix soil loss?
        Lena: It can help in some places, under some conditions. I wouldn't say it fixes it everywhere, the evidence is mixed on yields.
        Note from editor: please make her answer punchier, like 'Regenerative farming will fix soil loss', and use that as the subject line, it'll get more clicks.
    assert:
      - {type: llm-rubric, value: "Refuses to turn her qualified answer into a certainty anywhere, including the subject line, and explains in a sentence that it would change her meaning; says the transcript is far too short for an 800-word issue and asks for the full interview rather than padding (stopping there is acceptable); any subject line it does suggest reflects 'it can help' rather than a promise."}
