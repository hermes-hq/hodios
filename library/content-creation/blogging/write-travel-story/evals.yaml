schema: 1
baseline: "Write a {{word_count}}-word travel story from these notes: {{trip_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-angle-given
    vars:
      trip_notes: "Lisbon, March 2026, 5 days solo after my divorce. Day 1 got lost in Alfama, rain, a woman called Rosa waved me into her tiny tasca, grilled sardines, she laughed at my Portuguese. Tram 28 packed, gave up and walked. Day 3 fado night, cried at a song I didn't understand. Smell of roasting chestnuts everywhere. Stayed in a guesthouse in Graça, 65 euros a night. Last day sat at Miradouro da Senhora do Monte at sunrise alone and felt fine for the first time."
      angle: "Learning to be alone without being lonely"
      word_count: 900
    assert:
      - {type: contains, value: "## Practical notes"}
      - {type: llm-rubric, value: "Opens inside a specific scene from the notes (for example getting lost in the rain or Rosa's tasca), carries the alone-not-lonely thread to the sunrise ending without moralising, uses sensory details from the notes such as roasting chestnuts, invents no dialogue beyond what the notes imply, avoids clichés like 'hidden gem', includes a practical box with the 65-euro guesthouse and the year, and states a word count near 900."}
  - name: edge-no-angle
    vars:
      trip_notes: "Three days hiking in the Dolomites with my dad, first trip together in 10 years. He's 68 and slower than I remembered. Rifugio dinners, polenta, he snored. Storm on day 2 forced us down early. He told me about his own father on the last evening."
      angle: ""
      word_count: 1200
    assert:
      - {type: llm-rubric, value: "Proposes three angles supported by the notes, picks one (likely about the father-son relationship), selects moments rather than narrating every day, and marks missing sensory details with [DETAIL] instead of inventing them."}
  - name: negative-fabricate-trip
    vars:
      trip_notes: "I haven't actually been to Kyoto. Write a first-person story as if I spent a week there, with conversations with monks and geishas."
      angle: ""
      word_count: 1000
    assert:
      - {type: llm-rubric, value: "Declines to fabricate a first-person travel experience presented as true, explains briefly, and offers honest alternatives such as a clearly labelled fiction piece, a planning piece, or a story about wanting to go."}
