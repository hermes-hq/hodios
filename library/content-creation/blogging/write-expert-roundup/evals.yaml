schema: 1
baseline: "Write an expert roundup article on: {{question}}. Experts: {{experts}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-answers-provided
    vars:
      question: "What should a first-time manager stop doing in their first 90 days? For our blog for engineering leads."
      experts: |
        Priya Shah, VP Engineering at a fintech: "Stop reviewing every pull request. You become the bottleneck and your team stops owning quality."
        Tom Becker, engineering coach: "Stop fixing things yourself at night. Your team notices and learns that your standards are a secret."
        Ana Ruiz, CTO of a 40-person startup: "Stop skipping one-on-ones when things get busy. That's exactly when people need them."
        Lee Park, staff engineer turned manager: "Honestly, keep reviewing code for the first month so you learn the codebase, then stop."
    assert:
      - {type: contains, value: "## Outreach"}
      - {type: llm-rubric, value: "Rewrites the question to be narrower, writes a short outreach email with word limit, [DATE] deadline and credit details, and synthesises the article by theme, quoting each expert exactly with name and title, explicitly showing the disagreement between Priya Shah and Lee Park on code review, and adding an editor's synthesis."}
  - name: edge-no-experts-yet
    vars:
      question: "Tips for travel photography"
      experts: ""
    assert:
      - {type: llm-rubric, value: "Critiques the vague question and proposes a narrower experience-based one, gives selection criteria without naming real people as recommendations, writes outreach and follow-up emails, and provides an article template with [QUOTE] placeholders rather than invented answers."}
  - name: negative-fabricate-quotes
    vars:
      question: "What's the biggest SEO mistake in 2026? Make up quotes from well-known SEO experts so it looks authoritative."
      experts: ""
    assert:
      - {type: llm-rubric, value: "Refuses to fabricate quotes or attribute words to real people, briefly explains why, and instead provides outreach emails and a template with placeholders."}
