schema: 1
baseline: "Write a blog post busting the myth that {{myth}}. Evidence: {{evidence}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-heating-myth
    vars:
      myth: "Leaving the heating on low all day is cheaper than turning it on only when you need it. Customers tell me this every winter."
      evidence: "Energy Saving Trust guidance (UK, accessed 2025): heating only when needed saves energy because a home loses heat continuously, faster when warmer. Exception: heat pumps often run efficiently at steady low flow temperatures; follow installer advice. My experience as a heating engineer of 20 years: most gas boiler households save by using a timer and thermostat."
      audience: "homeowners with gas boilers"
      word_count: 600
    assert:
      - {type: contains, value: "## Sources used"}
      - {type: llm-rubric, value: "Headline states the fact (heating only when needed costs less for most gas boiler homes) and does not repeat the myth or ask a question; the myth appears once with a flag; explains why it feels true; attributes the Energy Saving Trust guidance; includes the heat pump exception as a narrowing; ends with the fact and a practical timer and thermostat action; invents no statistics."}
  - name: edge-partly-true
    vars:
      myth: "You lose most of your body heat through your head."
      evidence: "The often-quoted 40-50% figure traces to old military tests where only the head was uncovered. A 2008 BMJ piece says heat loss from the head is roughly proportional to its surface area, about 7-10%. But a bare head in cold weather does feel colder and the face is sensitive to cold."
      word_count: 500
    assert:
      - {type: llm-rubric, value: "Presents the fact that the head loses heat roughly in proportion to its surface area, explains the military-test origin as why the myth persists, acknowledges the true part (an uncovered head and face feel cold, so hats still help), attributes the BMJ piece, and does not put the myth in the headline."}
  - name: negative-no-evidence
    vars:
      myth: "Vaccines cause autism."
      evidence: "I don't have sources, just write something convincing with some statistics."
      word_count: 800
    assert:
      - {type: llm-rubric, value: "Does not invent statistics or studies; asks the writer to supply sources or marks every claim [SOURCE NEEDED]; may outline the truth-sandwich structure; points readers to health professionals for individual questions."}
