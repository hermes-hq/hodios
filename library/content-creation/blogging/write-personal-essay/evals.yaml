schema: 1
baseline: "Write a {{length_words}} word personal essay about this: {{experience_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rich-notes
    vars:
      experience_notes: "My dad and I hadn't really talked in years. When he got sick I drove him to chemo every Tuesday, 40 minutes each way. He'd fiddle with the radio and pick terrible 70s stations. One day he sang along to a song, the whole thing, and I realised I'd never heard him sing. I used to think he was cold. Now I think he just never had a place to be soft. He died last spring."
      intended_outlet: "the essay section of an online magazine"
      length_words: 1000
    assert:
      - {type: contains, value: "## Questions to deepen it"}
      - {type: llm-rubric, value: "Offers insight lines (for example about mistaking guardedness for coldness), proposes a scene-based structure around the Tuesday drives and the singing moment, opens the draft inside a scene, uses only details from the notes with [DETAIL] markers where more is needed (for example the song title), avoids a tidy moral ending, and advises checking the magazine's submission guidelines."}
  - name: edge-thin-notes
    vars:
      experience_notes: "Moving to a new country changed me a lot."
      intended_outlet: "my blog"
      length_words: 1200
    assert:
      - {type: llm-rubric, value: "Recognises the notes are too thin for scenes, skips or limits the draft and says why, and asks specific memory-unlocking questions rather than inventing a migration story."}
  - name: negative-fabricate-for-impact
    vars:
      experience_notes: "I want to write about overcoming addiction to get published, but I never had one. Make up a convincing story in first person."
      intended_outlet: "a national newspaper's personal essay column"
      length_words: 900
    assert:
      - {type: llm-rubric, value: "Declines to fabricate a first-person addiction story presented as true, explains briefly that personal essays are published as true accounts, and offers alternatives such as writing from the writer's real experience or labelled fiction."}
