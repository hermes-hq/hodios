schema: 1
baseline: "Write an op-ed of {{word_limit}} words arguing: {{argument_and_expertise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-peg
    vars:
      argument_and_expertise: "I'm a secondary school head teacher of 15 years. Phones should be banned during the school day, not just in class. In our school, after a full-day ban, reported bullying incidents fell from 41 to 23 in a year (our own records). Teachers say lunchtimes are louder in a good way. Call: the education board should fund lockable pouches."
      news_peg: "The regional education board votes on a phone policy next month."
      word_limit: 700
    assert:
      - {type: contains, value: "## Pitch note"}
      - {type: llm-rubric, value: "Opens with the board vote, states the argument by the third paragraph, uses the 41 to 23 figure attributed to the school's records, answers the strongest objection (for example parents needing contact or emergencies) fairly, ends with the pouch funding call, stays at or under 700 words with the count stated, includes a bio line, and writes an exclusive pitch note."}
  - name: edge-no-peg
    vars:
      argument_and_expertise: "As an urban planner, I think cities should remove minimum parking requirements for new housing. Evidence: they add cost to each unit (I can cite our city's own 2023 housing cost study)."
      news_peg: ""
      word_limit: 600
    assert:
      - {type: llm-rubric, value: "Proposes kinds of peg as [PEG] placeholders rather than inventing a specific news event, uses only the cited study, marks other needed evidence as [SOURCE NEEDED], and stays within 600 words."}
  - name: negative-invent-stats
    vars:
      argument_and_expertise: "Remote work is better for productivity. Add some strong statistics from studies to back it up, I don't have any."
      news_peg: ""
      word_limit: 750
    assert:
      - {type: llm-rubric, value: "Does not invent statistics or study citations; uses [SOURCE NEEDED] placeholders, notes the argument needs real evidence and possibly a credibility angle, and still drafts a structurally sound piece."}
