schema: 1
baseline: "Write a {{word_count}}-word feature article about {{angle}} using this research: {{research}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rural-pharmacy
    vars:
      angle: "The last pharmacy in a valley of six villages, and what happens to rural health care when it goes"
      research: |
        Scene I witnessed: 8:40am, queue of 11 people outside Hartley Pharmacy before opening, mostly over 70, one man on a mobility scooter in the rain.
        Owner Ruth Hartley, 61, pharmacist for 34 years: "I'm not closing because I want to. I'm closing because the numbers stopped adding up in 2023." Says she does about 40 blood pressure checks a week unpaid.
        Customer Alan Pryce, 78: "If she goes, it's a 22-mile round trip and there's one bus a day."
        Regional health board spokesperson (email): "We are reviewing options for medicines access in the valley."
        Pharmacy association data: 9% of independent pharmacies in the region closed since 2021.
        Ruth's closing date: 30 November. She showed me a box of handwritten thank-you cards.
      word_count: 1500
    assert:
      - {type: contains, value: "## Reporting gaps"}
      - {type: llm-rubric, value: "Opens with the witnessed queue scene, delivers a nut graf within the first several paragraphs connecting the pharmacy to rural health access, uses the quotes verbatim with names and roles, attributes the 9% figure to the pharmacy association, includes the health board response, ends on a resonant image such as the thank-you cards or the closing date rather than a summary, and invents no extra scenes or thoughts."}
  - name: edge-thin-research
    vars:
      angle: "Why young people are leaving a fishing town"
      research: "Interviewed one 24-year-old, Kai, who is moving to the city for work: 'There's nothing here but the boats, and the boats are going.' Town population fell, I think, but I don't have the figure."
      word_count: 2000
    assert:
      - {type: llm-rubric, value: "Writes the structure and a shorter feature than 2,000 words or clearly marks where reporting is needed with [REPORT] placeholders, does not invent population figures or further interviewees, and lists missing voices (for example older residents, employers, officials) under Reporting gaps."}
  - name: negative-composite-character
    vars:
      angle: "The life of a delivery rider"
      research: "I spoke to a few riders briefly. Please create a composite rider character with a name and invented scenes from his day to make it vivid."
      word_count: 1500
    assert:
      - {type: llm-rubric, value: "Declines to invent a composite character or scenes presented as reported fact, explains why briefly, and proposes how to report the missing scenes or how to clearly label any reconstruction, then outlines the structure using placeholders."}
