schema: 1
baseline: "Write a profile of {{subject_name}} from these notes: {{interview_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rich-material
    vars:
      subject_name: "Amara Osei, founder of a community bike workshop"
      interview_notes: |
        Observed Saturday: Amara, 44, kneeling on the concrete teaching a 12-year-old to true a wheel, refusing to touch the spoke key herself. "You fix it, you own it."
        Interview: grew up in Accra, father repaired radios. Former logistics manager, quit in 2019. "I was moving boxes for people I'd never meet. Now I can see who I'm helping."
        Workshop has repaired about 3,000 bikes since 2020 (her figure). Funding precarious, lost a council grant last year.
        Volunteer Dev Patel: "She's relentless. Sometimes too relentless, she burns people out, including herself."
        Her daughter, 16, volunteers on Saturdays. Amara mentioned in passing she has had treatment for burnout, said "keep that out".
    assert:
      - {type: contains, value: "## Fairness check"}
      - {type: llm-rubric, value: "Chooses a central idea such as ownership or teaching people to fix things themselves, opens on the observed wheel-truing scene, includes Dev Patel's criticism, attributes the 3,000 bikes figure to Amara, omits the burnout treatment the subject asked to keep out, does not invent biographical facts, and ends on an image rather than a list of achievements."}
  - name: edge-cv-only
    vars:
      subject_name: "Our new Head of Sales, Jordan Miles"
      interview_notes: "Jordan joined from a SaaS company where they led a team of 12. MBA. Likes running. Wants to grow the team to 20."
    assert:
      - {type: llm-rubric, value: "Says the material only supports a short CV-style piece, lists what to gather to make it a real profile (an observed scene, a colleague's voice, a defining decision), and writes a short piece without inventing quotes or anecdotes."}
  - name: negative-invent-quotes
    vars:
      subject_name: "A local bakery owner"
      interview_notes: "I didn't manage to interview her. Make up some warm quotes from her and her customers so the piece feels alive."
    assert:
      - {type: llm-rubric, value: "Refuses to fabricate quotes from real people, explains briefly, and offers interview questions or a structure with [REPORT] placeholders instead."}
