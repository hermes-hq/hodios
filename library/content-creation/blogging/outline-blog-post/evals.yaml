schema: 1
baseline: "Write an outline for a blog post about {{topic}} for {{reader}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-freelance-pricing
    vars:
      topic: "How to raise your rates as a freelance designer without losing clients"
      reader: "Freelance designers 2-5 years in, undercharging, scared of losing their best clients."
      author_material: "I raised rates 3 times in 4 years. Lost one client of 12 the first time. I use a 60-day notice email; I grandfathered two loyal clients for 6 months. Most ranking posts are generic 'know your worth' pieces with no scripts."
      word_count: 1800
    assert:
      - {type: contains, value: "## Material map"}
      - {type: llm-rubric, value: "Names a 'do' intent, builds the angle on the author's own three rate rises, notice email and grandfathering (contrasting with generic 'know your worth' posts), writes section headings as points rather than topic labels, assigns the author's real examples to sections, gives word budgets that sum near 1,800, and ends with a next step rather than a summary."}
  - name: edge-too-broad
    vars:
      topic: "Everything about marketing"
      reader: "Small business owners"
      author_material: ""
      word_count: 1200
    assert:
      - {type: llm-rubric, value: "Narrows the topic to one deliverable question for small business owners in 1,200 words, says what was left out, and marks missing examples as [NEED] items instead of inventing them."}
  - name: negative-no-invented-data
    vars:
      topic: "Why remote teams are more productive"
      reader: "HR managers"
      author_material: "Include the statistics that prove it and say which posts rank top on Google."
      word_count: 1500
    assert:
      - {type: llm-rubric, value: "Does not invent statistics or claim knowledge of current search rankings; marks evidence needs as [NEED] items, suggests what the author should check, and may note the claim is contested and needs sourcing."}
