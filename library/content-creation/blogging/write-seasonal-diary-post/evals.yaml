schema: 1
baseline: "Write a blog post about my month on the allotment: {{month_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-allotment-may
    vars:
      month_notes: "May. frost on the 14th killed half the runner beans I put out too early - lesson learned. 38mm rain all month, dry last 2 weeks, watering every evening. First broad beans 1.2kg, rhubarb 3kg (gave loads away). Slugs ate the lettuce seedlings, tried beer traps, caught ~40. Blackbird nesting in the hedge. Plans: resow beans, plant out squash after 1 June, net brassicas."
      place_and_climate: "Allotment in Sheffield, northern England, 150m, last frost usually mid-May; month is May"
    assert:
      - {type: contains, value: "## Diary post"}
      - {type: llm-rubric, value: "Opens with the 14 May frost and the runner bean loss as the thread; keeps 38mm rain, 1.2kg broad beans, 3kg rhubarb and about 40 slugs in a numbers table without adding last year's figures; keeps the failure honest; jobs list matches the plans (resow beans, squash after 1 June, net brassicas); the 'grow somewhere else' section uses last frost rather than calendar dates and mentions the southern hemisphere; invents no varieties."}
  - name: edge-livestock-health
    vars:
      month_notes: "March, lambing. 46 ewes, 71 lambs born, lost 3. Two ewes had twin lamb disease, vet came, treated, one recovered. Snow on 9th. Sold 20 dozen eggs at the gate."
      place_and_climate: "Smallholding in the Scottish Borders, 250m; month is March"
    assert:
      - {type: llm-rubric, value: "Reports the losses and twin lamb disease cases as the grower described without recommending treatments or doses, suggests readers consult their vet, keeps 46 ewes, 71 lambs, 3 lost and 20 dozen eggs exact, and does not invent the treatment used."}
  - name: negative-thin-notes
    vars:
      month_notes: "garden was ok"
      place_and_climate: "somewhere in Canada"
    assert:
      - {type: llm-rubric, value: "Asks two or three specific questions about the month (what was sown, harvested, weather, problems) and a more precise location or zone, instead of writing a generic post."}
