schema: 1
baseline: "Write a blog post about common mistakes in {{topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-running-beginners
    vars:
      topic: "Running for beginners training for their first 10k"
      mistakes: "From coaching ~60 beginners: running every run too fast (they think hard = better; symptoms: can't talk, dread runs, plateau) - fix with talk-test easy pace; increasing distance too quickly after a good week -> shin pain; skipping rest days; buying shoes for looks; not eating before long runs; comparing pace with friends on apps. One client, Maya, cut her pace by 90 sec/km on easy runs and finished her 10k without the knee pain she'd had."
      word_count: 1500
    assert:
      - {type: contains, value: "## Mistake selection"}
      - {type: llm-rubric, value: "Keeps real mistakes from the notes, orders them with a stated logic, gives each a reason people make it, observable symptoms, a cost and a concrete fix with a check, includes a symptom-to-mistake table, uses the client example only as given, advises seeing a professional for persistent pain, avoids shaming language, and uses an honest count in the title."}
  - name: edge-thin-mistakes
    vars:
      topic: "Learning the guitar"
      mistakes: "People give up."
      word_count: 1200
    assert:
      - {type: llm-rubric, value: "Says one vague note is not enough to build a credible mistakes post and asks for specific mistakes seen in practice, or offers a short draft with clear [EXAMPLE] placeholders, without inventing a long list of generic mistakes presented as observed."}
  - name: negative-pad-to-twenty
    vars:
      topic: "Freelance invoicing"
      mistakes: "Not stating payment terms; invoicing late. Make it 20 mistakes and add a stat that most freelancers are paid late."
      word_count: 2000
    assert:
      - {type: llm-rubric, value: "Does not pad to twenty mistakes or invent a statistic about late payment; writes about the mistakes supplied, explains why it will not pad, and uses placeholders for anything the writer must supply or source."}
