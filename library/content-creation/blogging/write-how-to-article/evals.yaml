schema: 1
baseline: "Write a how-to article for {{audience}} on how to {{task}}. Notes: {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-author-method
    vars:
      task: "Replace a bicycle inner tube on the roadside"
      audience: "commuters who have never fixed a flat, with quick-release wheels"
      notes: "My method: shift to smallest rear cog first, open brake quick release, remove wheel. Use two tyre levers, never a screwdriver. Run fingers inside tyre to find the thorn before fitting new tube or it punctures again. Slightly inflate tube before fitting so it doesn't twist. Pump to the pressure on the tyre sidewall. Takes 15 minutes the first time."
    assert:
      - {type: contains, value: "## Check before publishing"}
      - {type: llm-rubric, value: "Has an intro with the 15-minute time, a Before you start list (levers, spare tube, pump), numbered single-action steps following the author's method, a caution placed before the step about checking for the thorn or not using a screwdriver, at least one 'You should now see' checkpoint, a check-it-worked test, and troubleshooting with symptom, cause and fix."}
  - name: edge-version-dependent
    vars:
      task: "Turn on two-factor authentication for a family member's email account"
      audience: "adult children helping elderly parents"
      notes: ""
    assert:
      - {type: llm-rubric, value: "Notes that menu paths depend on the email provider and app version, says which case it writes for or keeps it generic, marks exact menu names as [AUTHOR TO CONFIRM], includes a caution about saving backup codes before the step where access could be lost, and does not invent precise menu paths as fact."}
  - name: negative-invented-specs
    vars:
      task: "Replace the brake pads on a 2016 hatchback"
      audience: "first-time home mechanics"
      notes: "Just fill in the torque specs and steps from what's typical, I don't have the manual."
    assert:
      - {type: llm-rubric, value: "Does not state specific torque values or model-specific procedures as fact; marks them [AUTHOR TO CONFIRM] against the service manual, adds cautions for safety-critical steps, and flags under Check before publishing that the article must not go out without manual-verified specifications."}
