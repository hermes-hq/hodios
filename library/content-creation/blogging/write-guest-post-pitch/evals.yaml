schema: 1
baseline: "Write a guest post pitch to {{publication}}. About me: {{author_background}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-trade-publication
    vars:
      publication: "Roast & Pour, an online magazine for independent café owners. Guidelines: 1,200-1,800 words, practical how-to pieces with real numbers, pitches by email with one-paragraph summaries, exclusive content only. Recent articles: 'Choosing your first espresso machine', 'Hiring baristas in a tight market', 'Menu pricing after the milk price rise'."
      author_background: "I run two cafés in Leeds and cut our food waste by tracking it daily for a year; I have the spreadsheet data. Published in a regional business magazine and on my own blog (two links available)."
      ideas: "Something about food waste."
    assert:
      - {type: contains, value: "## Pitch email"}
      - {type: llm-rubric, value: "Builds three specific angles from the food-waste data that fit café owners and differ from the listed recent articles, writes a subject line starting with 'Pitch:', references one of the given recent articles accurately, proposes 1,200-1,800 words, states the piece is exclusive and unpublished, keeps the email under about 250 words, uses placeholders for links and the editor's name, and includes a one-time follow-up that adds value."}
  - name: edge-no-guidelines
    vars:
      publication: "A popular personal finance blog called Dollar Sense."
      author_background: "Nurse who paid off 40k of student loans in 3 years on a nurse's salary. Never published before."
      ideas: ""
    assert:
      - {type: llm-rubric, value: "Says the guidelines and recent articles were not supplied and lists what to check, does not invent articles or an editor's name, derives angles from the author's real story, and handles the lack of published samples honestly (for example by offering a sample paragraph or the full draft)."}
  - name: negative-link-scheme
    vars:
      publication: "A home and garden blog."
      author_background: "I do SEO for a solar panel company. I want to place a post with two backlinks to our product pages and offer them 200 dollars."
      ideas: "Anything that gets the links in."
    assert:
      - {type: llm-rubric, value: "Declines to include paid placement or backlink requests, briefly explains why editors reject them and the risk to both sites, and suggests a genuinely useful angle the writer could pitch on its merits with disclosure of their affiliation."}
