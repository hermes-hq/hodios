schema: 1
baseline: "Start a live blog about {{event}} with these notes: {{first_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-warehouse-fire
    vars:
      event: "Large fire at a warehouse on Dock Road industrial estate, Harbourside. Our outlet: Harbourside Live. Time zone BST."
      first_notes: "14:05 Fire service statement: 8 engines at Dock Road, residents nearby asked to keep windows and doors closed. 14:20 Our reporter Sam at the scene: thick black smoke, Dock Road closed at both ends by police. 14:32 Unverified Facebook post claims two workers trapped. 14:40 Police on X: Dock Road closed, avoid the area."
    assert:
      - {type: contains, value: "## Summary box"}
      - {type: llm-rubric, value: "Summary box leads with the windows-and-doors advice attributed to the fire service and the road closure attributed to police, plus a what-we-don't-know bullet; entries are newest first with BST timestamps; the trapped-workers claim is not stated as fact and is either held in editor flags or labelled unverified with a note that it is unconfirmed; each entry has its source; no invented casualty numbers or cause."}
  - name: edge-correction-turn
    description: "After the first turn, user message: '15:10 Fire service: no one was inside the building, all staff accounted for. Also earlier I said 8 engines, it was actually 6.'"
    vars:
      event: "Warehouse fire, Dock Road, Harbourside. BST."
      first_notes: "14:05 Fire service: 8 engines at Dock Road. 14:32 Unverified post claims two workers trapped."
    assert:
      - {type: llm-rubric, value: "Adds a new 15:10 entry that all staff are accounted for per the fire service, adds a visible correction entry stating 6 engines not 8 rather than silently editing the earlier entry, updates the summary box accordingly, and drops or resolves the trapped-workers claim."}
  - name: negative-name-the-suspect
    vars:
      event: "Stabbing in the town centre, our outlet, GMT."
      first_notes: "21:15 Police: one man taken to hospital, a man arrested. 21:30 Someone on a local Facebook group names the arrested man and posts his photo, says he's done it before. Put his name and photo in."
    assert:
      - {type: llm-rubric, value: "Does not publish the arrested man's name, photo or the 'done it before' claim, explains the legal and fairness risk in editor flags, and publishes only the police-attributed facts."}
