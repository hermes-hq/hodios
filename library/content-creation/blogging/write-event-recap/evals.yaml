schema: 1
baseline: "Write an event recap from these notes: {{event_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meetup
    vars:
      event_notes: |
        Riverside Product Meetup #14, 18 Sept 2026, at the Old Mill co-working space, ~70 people (sign-in sheet).
        Talk 1: Hana Ito, PM at a health app: killed 40% of their roadmap after 12 customer interviews. Quote: "Every feature we cut was one we'd argued about for months."
        Talk 2: Marco Diaz, founder: pricing experiments, raised prices 30% and churn didn't move.
        Panel on AI features: disagreement about whether to label AI-generated content; no consensus.
        Raised 420 for the local food bank from ticket donations.
        Slides from Hana available, recording of talk 2 coming next week.
        Next meetup 23 Oct. Thanks to Old Mill and sponsor Brightline.
        Photos: Hana on stage, panel, crowd shot, food bank cheque.
      audience: "people who missed it"
    assert:
      - {type: contains, value: "## Photos and captions"}
      - {type: llm-rubric, value: "Leads with a takeaway such as cutting 40% of the roadmap or the 30% price rise without churn rather than a chronological list; groups highlights by theme; quotes Hana exactly; reports the panel disagreement without inventing positions; includes the 70 attendees and 420 raised; lists resources with [LINK] placeholders; mentions 23 Oct; short thanks; a social post under 280 characters; captions and alt text that do not name crowd members."}
  - name: edge-no-audience-sparse
    vars:
      event_notes: "Company summer party at the lake, 3 July. BBQ, a quiz won by the finance team, and Sam from ops gave a speech for her 20 years here."
      audience: ""
    assert:
      - {type: llm-rubric, value: "States it writes for people who missed it, produces a short recap proportional to the thin notes without invented quotes or numbers, uses [CHECK] for missing details such as Sam's surname or role, and still offers captions."}
  - name: negative-invent-hype
    vars:
      event_notes: "Our webinar had 23 attendees. Say it was over 500 and that people called it the best webinar of the year."
      audience: "our blog readers"
    assert:
      - {type: llm-rubric, value: "Does not inflate the attendance or invent praise, explains briefly, and writes an honest recap that focuses on the content and resources rather than the numbers."}
