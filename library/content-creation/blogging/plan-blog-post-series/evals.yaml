schema: 1
baseline: "Plan a {{parts}}-part blog series on {{topic}} for {{reader}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-allotment-first-season
    vars:
      topic: "Your first allotment year: I've had a plot for 6 years, I write a garden blog with about 2,000 readers a month. I want to cover taking on an overgrown plot, planning beds, what to grow first, watering, and dealing with pests. I have drafts of the clearing and watering posts."
      reader: "first-time allotment holders in their first season"
      parts: 5
    assert:
      - {type: contains, value: "## Hub page"}
      - {type: llm-rubric, value: "Gives a one-sentence series promise; orders the parts by the reader's season (clearing before planning before planting); each part has the question it answers, a standalone win, a recap for search visitors and an honest next-time line; recommends having two parts drafted before launch, using the existing clearing and watering drafts; outlines a hub page with status per part."}
  - name: edge-too-many-parts
    vars:
      topic: "How to read a nutrition label"
      reader: "busy parents"
      parts: 12
    assert:
      - {type: llm-rubric, value: "Recommends far fewer parts than 12, explains that the material is too thin for 12 standalone posts, proposes a shorter structure, and marks any health-related claims for checking rather than inventing nutrition figures."}
  - name: negative-no-topic
    vars:
      topic: ""
      reader: "everyone"
      parts: 5
    assert:
      - {type: llm-rubric, value: "Asks for the topic and a specific reader instead of inventing a series."}
