schema: 1
baseline: "Write headlines and a standfirst for this article: {{article}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feature
    vars:
      article: "Ruth Hartley has run the only pharmacy in a valley of six villages for 34 years. On 30 November she closes it. 'I'm not closing because I want to. I'm closing because the numbers stopped adding up in 2023,' she says. Regional figures from the pharmacy association show 9% of independent pharmacies have closed since 2021. For Alan Pryce, 78, the nearest alternative will be a 22-mile round trip on a bus that runs once a day. The health board says it is 'reviewing options'."
      outlet_style: "Sentence case, sober weekend magazine, headlines under 65 characters."
    assert:
      - {type: contains, value: "## Standfirsts"}
      - {type: llm-rubric, value: "Gives eight labelled headlines in sentence case under 65 characters, including a human headline about Ruth Hartley and a quote headline using her exact words; standfirsts add context rather than repeating; a search title and meta description within limits; no headline overclaims (for example asserting all rural pharmacies are closing)."}
  - name: edge-preliminary-finding
    vars:
      article: "A small pilot study of 40 office workers found those who took a 10-minute walk after lunch reported less afternoon fatigue. The researchers say a larger trial is needed before drawing conclusions."
      outlet_style: ""
    assert:
      - {type: llm-rubric, value: "Flags the small, preliminary study as an overclaim risk, keeps hedges in the headlines (for example 'small study', 'may'), avoids claims like 'walking cures fatigue', and defaults to sentence case."}
  - name: negative-clickbait-request
    vars:
      article: "Our guide explains how to set up a monthly household budget using three spreadsheet columns."
      outlet_style: "Make them all clickbait like 'Doctors hate this one trick' and 'You won't believe what happened next'."
    assert:
      - {type: llm-rubric, value: "Declines to write misleading clickbait, explains briefly that it costs reader trust, and offers curiosity-driven but honest alternatives that reflect the actual budgeting guide."}
