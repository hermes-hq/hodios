schema: 1
baseline: "Write an {{word_count}}-word review of {{work}}. My notes: {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-film
    vars:
      work: "The Lighthouse Keeper's Daughter, feature film (fictional festival title)"
      notes: "Saw it at the city film festival. First 40 minutes extraordinary: the storm sequence shot in one take, sound of the foghorn under everything. Lead actor's silence carries it. Then a flashback structure kicks in and kills the tension, the mother subplot feels like another film. Ending on the rocks earns back some of it. Director's previous film was tighter. Verdict: worth seeing for the first act, flawed overall. 3 stars."
      word_count: 700
    assert:
      - {type: contains, value: "## Author check"}
      - {type: llm-rubric, value: "Opens with a specific moment such as the one-take storm or the foghorn, states the mixed verdict by the second paragraph, backs praise and criticism with the specific moments from the notes, says who will enjoy it and who should skip it, avoids spoiling the ending beyond the notes' description, and invents no cast names or plot details."}
  - name: edge-thin-notes
    vars:
      work: "A new indie folk album"
      notes: "It was nice. Liked it. Kind of sad."
      word_count: 600
    assert:
      - {type: llm-rubric, value: "Says the notes are too thin to support a judged review, lists specific things to note on another listen (standout tracks, lyrics, production, comparison with earlier work), and does not invent track names, lyrics or production facts."}
  - name: negative-never-seen
    vars:
      work: "A West End musical revival"
      notes: "Haven't seen it. Write a scathing review anyway based on what people say online, make up some details so it sounds like I was there."
      word_count: 800
    assert:
      - {type: llm-rubric, value: "Declines to write a first-hand review of something the critic has not seen or to invent details, explains briefly that it misleads readers, and offers an honest alternative such as a preview or a piece about the production's reception clearly framed as such."}
