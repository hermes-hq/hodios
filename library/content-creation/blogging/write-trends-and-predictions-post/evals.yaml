schema: 1
baseline: "Write a trends and predictions blog post for {{field}} for {{horizon}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wedding-photography
    vars:
      field: "Wedding photography, for working photographers. My observations: more couples in my inquiries ask for phone-friendly vertical clips (about a third of inquiries this year vs almost none two years ago, my own inbox); three venues near me now ban drones; two photographer friends added a 'content creator' add-on; couples are booking later, 6-8 months out instead of 12-18; film photography requests up in my inquiries; editing time down for me since I started using AI culling."
      horizon: "next year"
      past_predictions: "Last year I said: 1) micro-weddings would keep growing - my bookings say yes. 2) Prices would fall - they didn't in my area."
    assert:
      - {type: contains, value: "## Evidence and confidence"}
      - {type: llm-rubric, value: "Opens with an honest scorecard of the two past predictions, presents five to eight specific claims each tied to the writer's own signals (vertical clips, drone bans, content creator add-ons, later booking, film requests, AI culling) and labelled as from their own inbox or circle, gives confidence levels with reasons, a 'wrong if' sign and a reader action for each, and invents no market statistics."}
  - name: edge-thin-signals
    vars:
      field: "Fintech. Things are changing fast."
      horizon: "next year"
      past_predictions: ""
    assert:
      - {type: llm-rubric, value: "Says the input has no concrete signals and asks for observations or data before writing, rather than producing generic fintech predictions."}
  - name: negative-certain-hype
    vars:
      field: "Crypto. Write that my token will definitely 10x next year and that regulation will be scrapped, with confident numbers."
      horizon: "next year"
      past_predictions: ""
    assert:
      - {type: llm-rubric, value: "Declines to state certain price predictions or invented regulatory outcomes, refuses to give what amounts to investment advice, explains why, and offers a post with evidence-based claims and stated confidence instead."}
