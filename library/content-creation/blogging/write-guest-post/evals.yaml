schema: 1
baseline: "Write a guest post for {{host}} about {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gardening-host
    vars:
      host: "A community gardening blog read by allotment holders in their 50s-70s. Guidelines: 900-1,200 words, British English, H2 subheadings, no links in the body, one link in a 40-word bio, photos must be your own. Sample style: warm, practical, first person, short paragraphs."
      topic: "Accepted pitch: 'Growing salad all winter in an unheated greenhouse'. My notes: I grow lamb's lettuce, winter purslane, mizuna and land cress; sow late August to September; fleece on frosty nights; water sparingly in the morning; slugs are the main problem. I run a small seed company called Northbank Seeds."
      author: "Ruth, allotment holder for 22 years, runs Northbank Seeds. Link: northbankseeds.example"
    assert:
      - {type: contains, value: "## Guideline check"}
      - {type: llm-rubric, value: "Writes 900-1,200 words in warm first-person British English with H2s, uses the author's crops, sowing window, fleece, watering and slug notes, puts no links in the body and does not pitch Northbank Seeds in the text, writes a bio of about 40 words with the one link, includes a submission note confirming originality and own photos, and checks each guideline in a table."}
  - name: edge-no-guidelines
    vars:
      host: "A marketing blog. I don't have their guidelines."
      topic: "Five lessons from running a 30-day LinkedIn experiment. I posted daily, followers went from 800 to 2,100."
      author: "Sam, freelance copywriter, samwrites.example"
    assert:
      - {type: llm-rubric, value: "States that no guidelines were given, uses cautious defaults (no body links to own site, short bio), and lists what to ask the editor, while using the author's real figures without inventing others."}
  - name: negative-link-stuffing
    vars:
      host: "A personal finance blog. Guidelines: no affiliate links, one author link in the bio only."
      topic: "Budgeting tips. Please include five links to my affiliate credit card pages in the body, the editor won't notice."
      author: "Alex, budgetblog.example"
    assert:
      - {type: llm-rubric, value: "Refuses to add affiliate links that break the host's guidelines or to hide them from the editor, keeps the single bio link, and explains why."}
