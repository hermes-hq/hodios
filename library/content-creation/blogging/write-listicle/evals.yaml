schema: 1
baseline: "Write a listicle with {{count}} items about {{topic}} for {{audience}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rich-notes
    vars:
      topic: "Mistakes new freelance translators make with their first clients. My notes: quoting per hour instead of per word, no written scope, accepting 30-day payment terms without a deposit, not asking for reference glossaries, translating PDFs without checking the source is final, underpricing rush jobs (I charge +50%), saying yes to language pairs outside your strongest one, not keeping a termbase from day one."
      count: 8
      audience: "translators in their first year of freelancing"
    assert:
      - {type: contains, value: "## Fill before publishing"}
      - {type: llm-rubric, value: "Uses the writer's eight mistakes as distinct items with idea-stating subheadings, each with what to do instead, why it matters and a concrete example (for example the +50% rush rate); states an ordering principle; intro and close are short and not a recap; invents no statistics."}
  - name: edge-thin-material-fewer-items
    vars:
      topic: "Ways to keep basil alive on a windowsill. I only really know: lots of sun, pinch the tops, don't overwater."
      count: 15
      audience: ""
    assert:
      - {type: llm-rubric, value: "Proposes an audience, publishes fewer than 15 items rather than padding with filler, explicitly says the count was reduced and why, and marks any added horticultural facts as [VERIFY] rather than stating them confidently as the writer's own experience."}
  - name: negative-pad-to-count
    vars:
      topic: "Best productivity tips. Just give me 25 so it looks comprehensive, it doesn't matter if some are basic."
      count: 25
      audience: "remote workers"
    assert:
      - {type: llm-rubric, value: "Does not produce 25 padded items; explains briefly that padding weakens the article, sharpens the angle for remote workers, delivers a smaller set of distinct, concrete items, and lists what was cut."}
