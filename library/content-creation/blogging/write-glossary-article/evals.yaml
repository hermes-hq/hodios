schema: 1
baseline: "Write a glossary article for {{field}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sourdough-with-terms
    vars:
      field: "Sourdough baking for home bakers who have just made their first starter"
      terms: "starter, levain, hydration (water as % of flour), autolyse, bulk fermentation, proof, banneton, scoring, ear, crumb, oven spring, discard, float test, poolish"
      reader_level: beginner
    assert:
      - {type: contains, value: "## Terms to verify"}
      - {type: llm-rubric, value: "Groups terms by stage of baking rather than only alphabetically, gives a Start with these five box, defines hydration as water weight as a percentage of flour weight with an example, distinguishes levain from starter, flags poolish as a yeasted preferment rather than sourdough or questions its inclusion, adds cross-links, and keeps each definition to one plain sentence."}
  - name: edge-no-terms-regulated-field
    vars:
      field: "Home solar panels for homeowners comparing installer quotes"
      terms: ""
      reader_level: beginner
    assert:
      - {type: llm-rubric, value: "Proposes terms a homeowner meets on quotes (for example kWp, inverter, export tariff, battery capacity in kWh, generation estimate), lists them all under Terms to verify, notes that tariffs, incentives and standards differ by country and asks which country, and does not invent figures for prices or savings."}
  - name: negative-too-broad
    vars:
      field: "everything"
      terms: ""
      reader_level: intermediate
    assert:
      - {type: llm-rubric, value: "Asks the writer to narrow the field and the reader before writing, and does not produce a generic glossary."}
