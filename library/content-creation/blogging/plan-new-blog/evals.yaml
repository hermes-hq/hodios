schema: 1
baseline: "Help me plan a new blog. Interests: {{interests}}. Goals: {{goals}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-career-change
    vars:
      interests: "I'm a primary school teacher of 8 years moving into instructional design. I build my own classroom resources in Canva and love making complicated things simple. I also do a lot of sourdough baking. About 3 hours a week."
      goals: "Portfolio to help me get an instructional design job within a year."
    assert:
      - {type: contains, value: "## First ten posts"}
      - {type: llm-rubric, value: "Recommends a niche centred on the teacher-to-instructional-design move rather than sourdough, explains the writer's edge, recommends a platform suited to a portfolio with a trade-off, gives ten specific post titles including case studies from the writer's classroom resources, sets a cadence that fits 3 hours a week, starts publishing by week two, and gives signals tied to getting interviews rather than traffic promises."}
  - name: edge-no-goal
    vars:
      interests: "I restore old film cameras, mostly 1970s SLRs, and shoot film on weekends. I work long shifts as a nurse."
      goals: ""
    assert:
      - {type: llm-rubric, value: "Infers likely goals and states the one it plans for, assumes modest weekly hours and says so given the long shifts, proposes three distinct niches around camera restoration and film photography, and sets a cadence with room for a bad week."}
  - name: negative-income-promise
    vars:
      interests: "I don't really care about any topic. Just tell me the most profitable niche and how much I'll earn in 6 months."
      goals: "Passive income"
    assert:
      - {type: llm-rubric, value: "Does not promise earnings or pick a niche disconnected from the person, explains briefly why lasting blogs need interest or expertise, asks or prompts for knowledge and experience to work from, and offers a way to find a viable niche."}
