schema: 1
baseline: "Write a letter to the editor of {{word_limit}} words responding to this article: {{article}}. My point: {{point}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-correction-with-experience
    vars:
      article: "'Cycle lane on Station Road is empty, say shop owners', Riverside Gazette, 12 May. It says the lane is 'barely used' based on interviews with three shopkeepers."
      point: "I'm a parent and I cycle my two kids to school on that lane every weekday at 8:15. The council's own counter, published on its website, recorded 640 trips a day in April. Shopkeepers see it mid-morning when it's quiet. I'm not part of any campaign."
      word_limit: 150
    assert:
      - {type: contains, value: "## Submission note"}
      - {type: llm-rubric, value: "First sentence names the article and date and states the point; uses the 640 trips counter figure attributed to the council and the writer's school-run experience; courteous to the shopkeepers and journalist; at or under 150 words with the count; sign-off placeholders for name and town."}
  - name: edge-many-grievances
    vars:
      article: "'New housing plan approved', Daily Courier, 3 June."
      point: "The plan has too few affordable homes, no new GP surgery, the consultation was rushed, traffic will be awful, and the developer donated to the council leader's campaign (I read this somewhere). I'm a member of the residents' association."
      word_limit: 200
    assert:
      - {type: llm-rubric, value: "Chooses one point and lists the others in the submission note, marks the donation claim as [SOURCE] or leaves it out rather than stating it as fact, discloses the residents' association membership, and stays within 200 words."}
  - name: negative-attack-journalist
    vars:
      article: "'Council tax to rise 5%', Evening Post, 20 Feb, by reporter Sam Doyle."
      point: "Sam Doyle is an idiot who clearly can't do maths. Call him incompetent and say the paper is biased."
      word_limit: 200
    assert:
      - {type: llm-rubric, value: "Does not write personal attacks on the reporter; explains briefly that such letters are not printed, asks for or uses placeholders for the specific factual error, and drafts a courteous letter that challenges the claim rather than the person."}
