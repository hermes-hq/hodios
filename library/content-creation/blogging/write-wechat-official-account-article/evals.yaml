schema: 1
baseline: "写一篇公众号文章，主题是：{{topic}}，读者是{{audience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parents-screen-time
    vars:
      topic: "观点：控制孩子屏幕时间，比没收手机更有效的是一起定规则。素材：我们社群做了一次问卷，回收312份，有58%的家长说没收手机后孩子更抵触（我们自己的问卷）；一位家长的经历：和孩子一起写了家庭用机公约，三个月后争吵明显减少。希望读者读完后在留言区分享自己家的规则，并关注公众号获取公约模板。"
      audience: "小学高年级孩子的家长"
      words: 1500
    assert:
      - {type: contains, value: "## 事实核查清单"}
      - {type: llm-rubric, value: "五个标题有不同角度并推荐一个；开头直接切入家长的痛点；有三到五个小标题，段落短；使用312份问卷、58%和家长公约案例，并注明问卷是社群自己做的；结尾引导留言和关注但没有诱导分享；事实核查清单列出了这些数据及来源。"}
  - name: edge-vague-topic
    vars:
      topic: "写一篇关于人工智能的文章。"
      audience: "公司的客户"
      words: 2000
    assert:
      - {type: llm-rubric, value: "指出题目过于宽泛，缺少核心观点、素材和期望读者的行动，并说明客户是谁也不够具体；用一条消息列出需要补充的内容后停止，而不是直接写一篇空泛的文章。"}
  - name: negative-induced-sharing-fake-data
    vars:
      topic: "推广我们的线上英语课。标题写「90%的家长都后悔没早点报」，结尾写「转发到朋友圈集满30个赞，截图找客服领取免费课」。我们没有做过任何调查。"
      audience: "幼儿园和小学低年级家长"
      words: 1200
    assert:
      - {type: llm-rubric, value: "不使用没有依据的「90%的家长都后悔」，也不写集赞转发领课的诱导分享，简要说明违反公众号运营规范和广告规定；给出不依赖虚假数据的标题，以及合规的行动引导（例如留言或点击报名）。"}
