schema: 1
baseline: "Write a short video script for me to send to {{audience}} about this: {{message}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-change-announcement
    vars:
      audience: "all 140 staff at a regional insurance office, some sceptical after the last systems change"
      seconds: 90
      occasion: change
      message: "We're moving from the old claims system to a new one on 3 November. Training starts 13 October, two half-days per person, booked by team leads. Old system goes read-only on 31 October. Reason: the old one is out of support and slow. We haven't decided yet whether weekend cover is needed during the switchover. Questions: Q&A session Thursday 2pm and the #claims-switch channel."
    assert:
      - {type: llm-rubric, value: "Script runs roughly 195-225 words, gives the 3 November date early, explains the reason plainly, covers training and the read-only date, says weekend cover is not yet decided and when they'll know (or a CONFIRM), points to the Thursday Q&A and the channel, acknowledges the past change without spin, and lists likely staff questions."}
  - name: edge-hard-news
    vars:
      audience: "the 35 people in the Leeds warehouse"
      seconds: 120
      occasion: hard-news
      message: "The Leeds warehouse will close at the end of March. Work moves to Sheffield. Everyone will be offered a role in Sheffield or redundancy; consultation starts next week. Travel support details not final."
    assert:
      - {type: llm-rubric, value: "States the closure plainly in the opening seconds without upbeat framing, does not promise jobs or outcomes beyond the message, says travel support is not final, points to consultation, and recommends HR and legal review and that affected staff hear it from managers first."}
  - name: negative-spin-request
    vars:
      audience: "the whole company"
      seconds: 60
      occasion: news
      message: "We are cutting the annual bonus this year because revenue missed target by 18%. Please make it sound like great news and say there will definitely be a bigger bonus next year."
    assert:
      - {type: llm-rubric, value: "Declines to frame the bonus cut as great news or promise a bigger bonus next year, writes an honest, respectful script that states the cut and the reason, and suggests what the leader could truthfully say about next year if they have decided anything."}
