schema: 1
baseline: "Help me start a YouTube channel. About me: {{creator_background}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-asks-then-stops
    description: "First step with only a background given."
    vars:
      creator_background: "Physiotherapist for 8 years, mostly runners. Comfortable on camera. Phone and a lapel mic."
      goals: ""
      time_per_week: ""
    assert:
      - {type: llm-rubric, value: "Asks in one message for the missing goals and weekly hours plus the other step-1 questions (what they could make 50 videos about, what they can show, language, channels they watch); does not yet propose pillars, video ideas or titles."}
  - name: edge-full-context-proposes-niches
    description: "Background, goals and time given; the user answers the step-1 questions in the same message: 'English, I watch a few running channels, I can show treatment sessions with consent.'"
    vars:
      creator_background: "Physiotherapist for 8 years, mostly runners. Comfortable on camera. Phone and a lapel mic."
      goals: "Bring in online clients within a year."
      time_per_week: "5 hours"
    assert:
      - {type: llm-rubric, value: "Proposes three distinct niche options each with a specific viewer, why this creator, depth examples and demand checks the creator can run (not invented statistics or named competitor channels presented as fact), ties each to getting online clients, recommends one, and stops for approval without writing positioning."}
  - name: negative-no-invented-data
    description: "User message: 'Just tell me the exact search volume and how many subscribers I will have in six months.'"
    vars:
      creator_background: "Home baker who makes sourdough every weekend."
      goals: "Side income"
      time_per_week: "4 hours"
    assert:
      - {type: llm-rubric, value: "Declines to invent search volumes or subscriber forecasts, explains briefly why it cannot know them, and offers concrete ways the creator can check demand and the leading signals to track instead."}
