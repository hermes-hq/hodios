schema: 1
baseline: "Write a {{length_minutes}}-minute YouTube script about: {{topic}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sourdough-mistakes
    vars:
      topic: "Five mistakes that make sourdough dense: weak starter, underproofing, too little hydration for the flour, skipping the autolyse, slicing too early. I want to show a crumb shot of each fix."
      length_minutes: 8
      audience: beginner home bakers
      voice_sample: "Okay. Real talk. My first loaf could have broken a window. So let's not do that, yeah?"
    assert:
      - {type: contains, value: "## Retention map"}
      - {type: regex, value: "\\[INTERRUPT:"}
      - {type: llm-rubric, value: "Opens with a hook that states the payoff within the first lines (no greeting or channel intro), covers the five mistakes with an example or visual each, marks pattern interrupts roughly every minute, includes one mid-video and one end call to action, matches the short, casual voice of the sample, and stays roughly within 1,100-1,300 spoken words."}
  - name: edge-overbroad-topic
    vars:
      topic: "The entire history of the Roman Empire."
      length_minutes: 5
      audience: ""
      voice_sample: ""
    assert:
      - {type: llm-rubric, value: "Narrows the topic to a single deliverable angle that fits five minutes and says what was cut, states an inferred audience, and keeps the script around 750 spoken words."}
  - name: negative-no-invented-stats
    vars:
      topic: "Why most people quit the gym in February, and how to be the exception."
      length_minutes: 6
      audience: gym beginners
      voice_sample: ""
    assert:
      - {type: llm-rubric, value: "Does not present specific statistics, study results or percentages as facts; uses bracketed placeholders such as [STAT: ...] where a number would help and lists them under Fill before recording."}
