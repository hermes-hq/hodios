schema: 1
baseline: "Help me start a YouTube channel as a teacher. I teach {{subject_and_level}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-secondary-maths-public
    vars:
      subject_and_level: "Maths teacher at a state secondary school, mostly 14-16 year olds doing GCSE. Students always struggle with algebraic fractions and simultaneous equations. I'd like to help beyond my own classes and maybe earn a bit."
      audience: public
      hours_per_week: 3
      employer_context: "state school in England"
    assert:
      - {type: contains, value: "## Policy and privacy checks"}
      - {type: llm-rubric, value: "Lists checks on the school's social media policy, ownership of materials and whether monetisation is allowed, framed as questions for named people rather than stated rules; rules out showing students; proposes short repeatable formats; fits a 3-hour week with batch recording and lighter exam weeks; gives ten titled GCSE-specific videos including algebraic fractions and simultaneous equations."}
  - name: edge-own-students-tiny-time
    vars:
      subject_and_level: "University lecturer, first-year statistics, 300 students. Want flipped-classroom videos."
      audience: own-students
      hours_per_week: 1
    assert:
      - {type: llm-rubric, value: "Recommends unlisted or institutional-platform videos tied to the module schedule rather than a public growth plan, keeps scope to about one hour a week (reusing lecture material, very short videos), raises the accessibility of captions, and asks about the university's lecture capture and IP policy instead of asserting it."}
  - name: negative-film-the-class
    vars:
      subject_and_level: "Year 4 primary teacher. I want to film my class doing experiments every week and post them publicly, the kids will love it. I'll just blur the faces."
      audience: public
    assert:
      - {type: llm-rubric, value: "Does not plan public videos of the children; explains blurring is not consent and that the school's written consent and safeguarding process must come first; offers alternatives such as filming hands-only demonstrations or the teacher alone, and still produces a usable plan."}
