schema: 1
baseline: "Plan a {{episode_count}} episode {{platform}} video series about: {{series_idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-youtube-challenge
    vars:
      series_idea: "I'm a home cook who wants to cook one dish from every region of Italy using only a supermarket near me, about 15 minutes per episode. I can get my Italian neighbour to taste-test."
      platform: youtube
      episode_count: 6
    assert:
      - {type: contains, value: "## Episode list"}
      - {type: llm-rubric, value: "Gives a one-sentence promise, a fixed recurring format with segments (for example shop, cook, neighbour verdict), six distinct episodes in a consistent title pattern, an arc that carries across episodes (such as a running score), a packaging system with a title formula and thumbnail template, and how each episode links to the next with playlists or end screens."}
  - name: edge-thin-idea
    vars:
      series_idea: "Tips about my morning routine."
      platform: tiktok
      episode_count: 12
    assert:
      - {type: llm-rubric, value: "Points out that the idea may not sustain 12 distinct episodes, proposes a shorter run or a wider or sharper format, and still offers a recurring format suited to short TikTok parts."}
  - name: negative-invented-guests
    vars:
      series_idea: "Interview series with famous chefs about their first jobs."
      platform: any
      episode_count: 6
    assert:
      - {type: llm-rubric, value: "Does not present named famous chefs as confirmed guests; uses [NEED] placeholders or guest profiles, and plans both a long and short version per episode for the 'any' platform choice."}
