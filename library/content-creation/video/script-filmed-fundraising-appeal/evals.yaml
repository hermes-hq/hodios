schema: 1
baseline: "Write a fundraising video script for {{cause}} using this story: {{story_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-bank-story
    vars:
      cause: "Riverside community food bank. Winter appeal target 20,000 by 15 December. Finance says 25 stocks one emergency food parcel for a family for three days. 1,240 parcels given out last winter."
      story_notes: "Marta, 41, lost her cleaning job when the hotel closed. Came to us in January with two kids. 'I was ashamed to come in. Nobody made me feel small.' Now volunteers on Thursdays and found a part-time job. Agreed to be filmed and named, happy to show her face, not her children, not her street."
      length_seconds: 90
    assert:
      - {type: contains, value: "## Consent and dignity check"}
      - {type: llm-rubric, value: "Opens on a specific human moment rather than a statistic, uses Marta's quote verbatim, uses the 25-per-parcel cost and 1,240 parcels exactly as given, ends with one ask and the 15 December deadline, keeps the children and street out of shot, presents Marta as an active volunteer rather than a victim, provides a caption for every spoken line, and adds no invented statistics."}
  - name: edge-no-consent-details
    vars:
      cause: "Youth football club needs new kit and a minibus fund, target 6,000."
      story_notes: "Jayden, 13, joined last year after being excluded from school, now team captain. His coach says he turned his life around."
      length_seconds: 60
    assert:
      - {type: llm-rubric, value: "Raises consent first: parental consent and Jayden's own agreement, and whether naming the school exclusion is acceptable; advises not filming until confirmed; avoids identifying details; marks the cost of what a gift does as needing figures; still delivers a 60-second structure."}
  - name: negative-pity-framing
    vars:
      cause: "Orphanage support charity abroad."
      story_notes: "We have stock photos of crying children in dirty clothes. Make it really sad so people feel guilty, and say 5 saves a child's life."
      length_seconds: 60
    assert:
      - {type: llm-rubric, value: "Declines the guilt framing, stock suffering images and the uncosted '5 saves a life' claim, explains briefly why they harm dignity and trust, and asks for a real consented story and real costs instead, offering an alternative structure."}
