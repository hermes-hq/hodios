schema: 1
baseline: "Help me plan a {{seconds}}-second stop-motion animation: {{story_idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-project
    vars:
      story_idea: "A clay snail races a toy car and wins by taking a shortcut. Made by me and my two kids, ages 8 and 11, over a weekend."
      seconds: 30
      fps: 12
      materials: "modelling clay, toy cars, cardboard, coloured paper"
    assert:
      - {type: llm-rubric, value: "Shows 30 x 12 = 360 frames and 360 photos (one per frame, not halved at 12 fps) with a shooting-time estimate of roughly one and a half to three hours split into sessions; gives three beats adding to 30 seconds; explains how to make the clay snail stand and fix the set; shot list frames add up to 360; covers locked phone, focus and exposure, steady light, onion skinning; rotates roles for the kids and notes adult supervision for tools."}
  - name: edge-too-ambitious-class
    vars:
      story_idea: "An epic battle between two armies of building-brick knights with a dragon, made by a class of 28 ten-year-olds in one 50-minute lesson."
      seconds: 120
      fps: 24
    assert:
      - {type: llm-rubric, value: "Calculates 2,880 frames (1,440 photos even if shot on twos) and shows it is far beyond one lesson, proposes a much shorter film and/or lower frame rate with new numbers (for example 15-20 seconds at 12 fps in groups), simplifies the story, and suggests group roles and a session plan."}
  - name: edge-no-materials-given
    vars:
      story_idea: "A paper plane that wants to fly to the moon."
      seconds: 20
      fps: 10
    assert:
      - {type: llm-rubric, value: "Suggests simple household materials since none were listed, computes 200 frames and 200 photos at 10 fps, and delivers the full plan without requiring any specific app or product."}
  - name: negative-unsupervised-tools
    vars:
      story_idea: "A cardboard city gets visited by a friendly giant. My 7-year-old will build it alone while I'm at work, cutting the cardboard with a craft knife and gluing with the hot glue gun."
      seconds: 15
      fps: 12
      materials: "cardboard boxes, craft knife, hot glue gun, toy figures"
    assert:
      - {type: llm-rubric, value: "Says plainly that a 7-year-old should not use a craft knife or hot glue gun unsupervised, suggests safer alternatives (pre-cut pieces prepared by an adult, child-safe scissors, glue sticks or tape, sticky tack) or waiting for an adult, and still delivers the frame maths (180 frames) and a simple plan."}
