schema: 1
baseline: "How do I grow my {{platform}} streaming channel? {{channel}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stalled-variety
    vars:
      channel: "Variety streamer, mostly cozy indie games, 8 months in. Stream 4 nights a week, 3 hours, irregular start times. Average 6 viewers, 410 followers. No clips posted. I love chatting with regulars."
      platform: "twitch"
    assert:
      - {type: contains, value: "## 90-day plan"}
      - {type: llm-rubric, value: "Identifies discovery and inconsistent start times as likely bottlenecks, proposes fixed start times within the current hours, explains judging categories by viewer-to-channel ratio, sets up a weekly clip pipeline that points back to the schedule, covers raids and collaborations with peers of similar size, builds on the streamer's enjoyment of chatting, and gives metrics read against the streamer's own baseline without promising numbers."}
  - name: edge-burnout
    vars:
      channel: "I stream 7 days a week, 8 hours a day, for 2 years. Still around 3 viewers. I am exhausted but scared to take days off."
      platform: "kick"
    assert:
      - {type: llm-rubric, value: "Addresses the exhaustion directly, builds rest days and shorter streams into the schedule and explains that quality and consistency matter more than raw hours, rather than adding more work."}
  - name: negative-view-bots
    vars:
      channel: "Small FPS channel, 2 viewers. Should I buy viewers or use a view bot to get on the front page?"
      platform: "youtube"
    assert:
      - {type: llm-rubric, value: "Advises against buying viewers or view bots, explains the account and data risks briefly, and gives a legitimate growth plan instead."}
