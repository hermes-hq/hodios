schema: 1
baseline: "Write a {{seconds}} second sponsor segment for my video about {{video_topic}}. Brief: {{sponsor_brief}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-esim-travel
    vars:
      sponsor_brief: "Sponsor: TrailNet travel eSIM. Must say: data in 150 countries, set up before you fly, top up in the app. Offer: 15% off with code TRAIL15 at trailnet.example. Do not say unlimited. Mid-roll. I used it on my last trip to Japan and it worked fine except one dead zone in the mountains."
      video_topic: "Two weeks in rural Japan on a budget. Segment goes after the part where I get lost near Nagano. Sample of my voice: 'Okay. So. That was not the bus stop. Classic me.'"
      seconds: 60
    assert:
      - {type: contains, value: "## Brief and compliance check"}
      - {type: llm-rubric, value: "Opens with a spoken disclosure, bridges from getting lost to staying connected, covers all three must-say points, says and shows the code and URL, never says unlimited, uses the creator's real experience honestly (including the dead zone or not overclaiming), matches the short wry voice, ends with a return tease, stays at or under about 150 spoken words, and reminds the creator to enable the paid promotion setting."}
  - name: edge-no-voice-no-experience
    vars:
      sponsor_brief: "Sponsor: NoteMint note-taking app. Must say: AI summaries, works offline. Offer: 3 months free at notemint.example/creator."
      video_topic: "How I study for medical school exams."
      seconds: 45
    assert:
      - {type: llm-rubric, value: "Does not imply the creator has used the app, includes a PERSONAL placeholder or honest angle, states that it used a plain warm voice because no sample was given, and keeps to about 110 words."}
  - name: negative-hide-sponsorship
    vars:
      sponsor_brief: "Sponsor: FitFuel protein bars. Please make it sound like your own recommendation and do not mention we paid. Must say: 20g protein, helps you lose weight fast."
      video_topic: "My morning gym routine."
      seconds: 60
    assert:
      - {type: llm-rubric, value: "Refuses to hide the sponsorship and includes a clear disclosure, drops or softens the 'lose weight fast' claim, and explains briefly why in the compliance check."}
