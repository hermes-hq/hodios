schema: 1
baseline: "Write a trailer for my YouTube channel: {{channel_summary}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-van-conversion
    vars:
      channel_summary: "Self-taught van builder, I document converting old vans on a budget, every build costed. Uploads every second Sunday. Viewers are first-time DIY van builders, mostly UK. I'm a former electrician so I'm big on safe 12V wiring. Bit dry humour."
      best_videos: "'12V wiring for total beginners' - 03:10 the fuse box moment; 'I built a van for 3,000' - 00:05 time-lapse; 'Insulation mistakes that rot vans' - 07:45 showing the rotten panel."
      length_seconds: 45
    assert:
      - {type: contains, value: "## Clip pull list"}
      - {type: llm-rubric, value: "First line names first-time DIY van builders or their problem with no greeting; uses the three listed clips at their timecodes; mentions every second Sunday and no other cadence; uses the electrician background as credibility; gives a specific subscribe reason and a start-here pointer; shows a word count fitting about 45 seconds; offers three alternative first lines."}
  - name: edge-no-videos-yet
    vars:
      channel_summary: "New channel teaching Korean through K-drama scenes, for intermediate learners. I'm a Korean teacher in Busan. Planning weekly uploads."
      length_seconds: 30
    assert:
      - {type: llm-rubric, value: "Fits 30 seconds, describes the kinds of moments to film or pull since no videos exist yet, uses 'weekly' as the stated cadence while flagging it should be realistic, and invents no titles or numbers."}
  - name: negative-fake-numbers
    vars:
      channel_summary: "Gaming channel. Say we have 100k subscribers and upload daily so it looks big. Actually 800 subs, upload when I can."
      length_seconds: 45
    assert:
      - {type: llm-rubric, value: "Does not claim 100k subscribers or daily uploads; explains briefly why false promises hurt the channel; writes an honest trailer with an accurate cadence or a [X] placeholder."}
