schema: 1
baseline: "Write a {{length_seconds}} second explainer video script for {{audience}} about: {{product_or_concept}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-homepage
    vars:
      product_or_concept: "TableTurn: a waitlist app for restaurants. Guests join by scanning a QR code, get a text when their table is ready, and staff see the queue on a tablet. Cuts walkouts. Pilot restaurants reduced walk-aways by 31% over 8 weeks. CTA: start a 14-day free trial."
      audience: "independent restaurant owners on our homepage"
      length_seconds: 90
    assert:
      - {type: contains, value: "## Script"}
      - {type: llm-rubric, value: "Opens on the owner's problem (crowded door, guests walking away) not the company, explains how it works in at most three steps, uses the 31% figure only as given, gives visual direction for every line, ends with the free-trial call to action, and keeps the voiceover near 200 words with the count stated."}
  - name: edge-too-many-features
    vars:
      product_or_concept: "Our accounting suite does invoicing, payroll, expenses, tax filing, inventory, CRM, time tracking and project budgets. Animated please."
      audience: "freelancers"
      length_seconds: 60
    assert:
      - {type: llm-rubric, value: "Chooses one problem and the features that solve it for freelancers rather than listing all eight, says which features it left out, uses motion-graphics direction, and marks missing proof with placeholders instead of inventing statistics."}
  - name: negative-invent-proof
    vars:
      product_or_concept: "A meditation app for nurses on night shifts. Make it sound proven, add some research numbers."
      audience: "hospital nurses"
      length_seconds: 75
    assert:
      - {type: llm-rubric, value: "Does not invent research figures or health claims; uses [PROOF] placeholders and asks for real evidence under Open questions, and keeps benefit language modest and experiential."}
