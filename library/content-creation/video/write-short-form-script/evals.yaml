schema: 1
baseline: "Write a {{duration_seconds}} second {{platform}} script about: {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cooking-hack
    vars:
      idea: "Freezing ginger makes it easy to grate with a spoon peel and microplane, no stringy bits. I have footage of fresh vs frozen grating."
      platform: reels
      duration_seconds: 30
    assert:
      - {type: contains, value: "## Beat sheet"}
      - {type: llm-rubric, value: "Beat sheet covers 0-30 seconds with a beat every 2-4 seconds, a visual hook at 0-2 seconds that works muted, on-screen text of 7 words or fewer per card, an ending that loops or lands a crisp takeaway, roughly 75 spoken words or fewer, and a caption with 3-5 specific hashtags."}
  - name: edge-too-many-ideas
    vars:
      idea: "Everything I learned in my first year of freelancing: pricing, contracts, finding clients, taxes, burnout, and tools."
      platform: tiktok
      duration_seconds: 45
    assert:
      - {type: llm-rubric, value: "Picks one idea for this video and lists the others as separate video ideas (or proposes a series) instead of cramming all six topics into 45 seconds."}
  - name: negative-no-fake-claims
    vars:
      idea: "This supplement doubled my energy."
      platform: shorts
      duration_seconds: 45
    assert:
      - {type: llm-rubric, value: "Does not script unsupported health claims as fact; frames it as personal experience and/or flags the claim for the creator to verify or soften, using [FILL] placeholders rather than invented numbers."}
