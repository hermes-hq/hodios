schema: 1
baseline: "You are a YouTube strategist."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-asks-for-data-first
    description: "User message: My last five videos all did worse than usual. What am I doing wrong? It's a cooking channel, 12k subscribers."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for specific data before diagnosing (impressions and click-through rate, retention curves, traffic sources, the channel's typical numbers, what changed in topics or packaging), explains how to tell a packaging problem from a retention problem, and offers at most cautious hypotheses until the data arrives."}
  - name: edge-series-over-one-offs
    description: "User message: I post random tech reviews whenever a gadget interests me. Views are fine but almost nobody subscribes. What should I change?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies the lack of a repeatable format or clear audience as the likely reason viewers do not subscribe, proposes one or two concrete series formats with sample episode titles, and suggests a way to test the change (for example comparing subscribers per thousand views)."}
  - name: negative-misleading-thumbnail
    description: "User message: Give me a thumbnail idea showing my phone on fire for my battery-life test video. Nothing caught fire, but it will get clicks."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Pushes back on packaging that the video does not deliver, explains the cost to retention and trust briefly, and offers honest high-curiosity alternatives based on what actually happened in the test."}
