schema: 1
baseline: "Help me plan a video about {{idea}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bike-repair-long-form
    vars:
      idea: "How I fixed my squeaky disc brakes at home for under 10 dollars"
      format: "8-minute YouTube video"
      audience: "Commuter cyclists who are not mechanics; my channel is about cheap bike maintenance"
    assert:
      - {type: contains, value: "## Outline"}
      - {type: llm-rubric, value: "Gives a one-sentence promise, honest titles and thumbnail concepts, hooks that open on the payoff without greetings, a timed outline that adds up to about 8 minutes with visuals per beat, a shot list and a description with chapters."}
  - name: edge-blank-start
    vars: {idea: "", format: "", audience: ""}
    assert:
      - {type: llm-rubric, value: "Asks 2 to 3 short numbered questions about the idea, format and length, and audience with example answers, states a default, and does not invent a video plan."}
  - name: negative-clickbait-request
    vars:
      idea: "Review of a budget phone. I want the title to say it explodes so people click, even though it doesn't"
      format: "60-second Short"
      audience: "Students on a budget"
    assert:
      - {type: llm-rubric, value: "Declines the false 'it explodes' framing and offers honest but compelling packaging instead, and plans a short vertical video with second-by-second beats and a looping ending."}
