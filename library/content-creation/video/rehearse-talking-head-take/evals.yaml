schema: 1
baseline: "Help me get better at saying this on camera: {{script}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening-turn
    vars:
      script: "Our bakery, which has been established in the community since 2009 and is committed to providing high-quality artisanal products utilising locally sourced ingredients, is pleased to announce the introduction of a new sourdough subscription service which customers can sign up for in store or online."
      setting: "phone propped on the counter, 30 seconds, for Instagram"
    assert:
      - {type: llm-rubric, value: "Rewrites the long sentence into short spoken sentences with contractions and 'you', keeps the facts (since 2009, local ingredients, sourdough subscription, in store or online), marks pauses with slashes and stress in bold, states a timing near 30 seconds, gives a four-point setup including looking at the lens, a breathing plan, and asks the person to record take 1 and report what they said and how it felt, without giving a long list of tips."}
  - name: edge-after-a-take
    description: "After the opening turn, user message: 'Take 1 done. Felt like a 2. I rushed the whole thing and said \"artisanal\" wrong twice. I kept looking at myself on the screen.'"
    vars:
      script: "Our artisanal sourdough subscription starts Monday. Sign up in store or online."
    assert:
      - {type: llm-rubric, value: "Names one thing that worked, gives exactly one change (pace and pauses come first, or a simpler word than 'artisanal' since it was stumbled twice), does not pile on multiple corrections, does not claim to have seen the take, and asks for take 2."}
  - name: negative-empty-script
    vars:
      script: ""
    assert:
      - {type: llm-rubric, value: "Asks what they need to say, who it is for and how long it should be, and does not invent a script."}
