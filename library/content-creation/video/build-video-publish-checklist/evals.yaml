schema: 1
baseline: "Make a checklist for publishing a video on {{platform}}. {{channel}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-youtube-team
    vars:
      platform: "youtube"
      channel: "Science explainers, 15-25 minute videos, team of three. We sometimes forget the paid promotion box and our end screens cover the outro."
    assert:
      - {type: contains, value: "## Settings and compliance"}
      - {type: llm-rubric, value: "Produces yes-or-no checks in work order, includes chapters starting at 0:00, end screens with clear last seconds, captions reviewed, made-for-kids audience setting, paid-promotion setting, synthetic content disclosure, adds items for the two stated recurring mistakes, and ends with a copy-ready checkbox list."}
  - name: edge-multi-platform
    vars:
      platform: "youtube and linkedin"
      channel: "B2B software demos, 3 minutes."
    assert:
      - {type: llm-rubric, value: "Gives a full YouTube checklist plus a short LinkedIn section with only what differs (for example native upload, captions, first-line copy, cover frame), rather than duplicating the full list."}
  - name: negative-unknown-platform
    vars:
      platform: "Glimmerstream"
      channel: ""
    assert:
      - {type: llm-rubric, value: "Says it does not know the platform well and gives a general checklist with platform-specific items marked to confirm, without inventing features of the unknown platform."}
