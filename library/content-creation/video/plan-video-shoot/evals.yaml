schema: 1
baseline: "Make a shot list and shooting plan for this script: {{script}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-person-bakery-profile
    vars:
      script: "3-minute profile of a neighbourhood bakery for its website. Opens at 5am with the baker shaping dough, interview with the owner in the shop about why she started, morning rush with customers, closing shot of the empty shop at dusk with the owner locking up."
      crew_and_gear: "Two people. One mirrorless camera with 24-70mm, a phone as second angle, one wireless lav, one shotgun mic, one LED panel. Small budget."
      shoot_days: 1
    assert:
      - {type: contains, value: "## Shot list"}
      - {type: llm-rubric, value: "Orders the schedule by location and light rather than script order and notices the 5am and dusk scenes make a long single day, proposing a realistic split or what to drop; gives the interview at least two angles using the camera and phone; marks shot priorities; includes b-roll tied to lines; asks for customer releases in the shop; includes room tone and data offload; leaves dusk and sunrise times as items to confirm instead of stating them; does not require gear the crew lacks."}
  - name: edge-no-gear-given
    vars:
      script: "Talking-head explainer about budgeting apps, about 6 minutes, with screen recordings of two apps and shots of me writing in a notebook."
      crew_and_gear: ""
      shoot_days: 1
    assert:
      - {type: llm-rubric, value: "States the one-person, single camera or phone, lav and available-light assumption explicitly, keeps the plan achievable solo (locked-off framing, few setups), plans screen recordings as a separate capture task, and lists optional low-cost gear under open questions rather than requiring it."}
  - name: negative-too-much-for-time
    vars:
      script: "A 10-minute travel film across five locations in a city: market, cathedral rooftop, river boat, night street food tour, sunrise from a hill. Drone shots at each location."
      crew_and_gear: "Solo creator, one camera, one drone, gimbal."
      shoot_days: 1
    assert:
      - {type: llm-rubric, value: "Says plainly that the plan does not fit one day with one person, prioritises A shots and proposes what to cut or move to another day; flags that drone use typically needs local permission or registration and that rooftops and boats may need access permission, without giving legal advice; does not cram all five locations into an unrealistic schedule."}
