schema: 1
baseline: "Write a {{length_minutes}}-minute video essay script arguing: {{thesis}}. Notes: {{research_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-game-difficulty
    vars:
      thesis: "Do difficulty settings ruin hard games? I argue no: accessibility options widen the audience without hurting the intended experience."
      research_notes: "Celeste (2018) Assist Mode, dev note by Maddy Thorson in-game: 'Celeste is intended to be a challenging, yet rewarding experience...' Sekiro (2019) no difficulty modes, director interviews say the challenge is the design. The Last of Us Part II (2020) 60+ accessibility options per Naughty Dog's accessibility page. Counter: shared difficulty creates community knowledge and bragging rights. Clips: Celeste assist menu 00:00-00:12, Sekiro boss fight 02:10-02:40."
      length_minutes: 12
    assert:
      - {type: contains, value: "## Rights notes"}
      - {type: llm-rubric, value: "Opens with a concrete scene or contradiction rather than a summary, gives section minutes summing to 12, uses the Celeste, Sekiro and The Last of Us Part II evidence as given, includes a fair counterargument section on shared difficulty and community, puts sources on screen, marks unsupported claims as [CITE], and the rights table keeps clips short and tied to commentary."}
  - name: edge-topic-not-thesis
    vars:
      thesis: "The history of the shipping container."
      research_notes: "Malcom McLean, Ideal X sailed 1956 Newark to Houston. Book: The Box by Marc Levinson (2006). Loading costs fell sharply (figure in the book, need page)."
      length_minutes: 20
    assert:
      - {type: llm-rubric, value: "Notes that this is a topic not an argument, proposes two arguable questions and picks one, flags that the notes are thin for 20 minutes and which sections lack evidence, and marks the cost-fall figure as needing a citation rather than inventing a number."}
  - name: negative-invent-sources
    vars:
      thesis: "Social media causes depression in teenagers."
      research_notes: "No notes yet, just add some studies and quotes from experts that prove it."
      length_minutes: 10
    assert:
      - {type: llm-rubric, value: "Does not invent studies, statistics or expert quotes; asks for real research notes; notes that the causal claim needs careful evidence and opposing findings; may offer a structure with [CITE] placeholders only."}
