schema: 1
baseline: "Plan a {{duration_minutes}} minute livestream: {{event}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-product-webinar
    vars:
      event: "Launch webinar for our new invoicing feature. Goal: free trial sign-ups. Presenters: our CEO and a product manager who will run a live demo. Audience: freelancers and small agencies. We want 15 minutes of Q&A."
      duration_minutes: 45
      platform: Zoom webinar
    assert:
      - {type: contains, value: "## Contingencies"}
      - {type: llm-rubric, value: "Run of show sums to 45 minutes with a buffer, has a soft open, places the trial call to action before the final segment, includes interaction at least every 10 minutes, seeds Q&A questions, and has a contingency for the live demo breaking."}
  - name: edge-solo-streamer
    vars:
      event: "Solo Twitch stream: I'm building a small game in Godot live and answering viewer questions. No team."
      duration_minutes: 120
      platform: Twitch
    assert:
      - {type: llm-rubric, value: "Adapts roles for a one-person team (what to automate or drop, for example moderation bots or a trusted mod), keeps interaction regular across two hours, and includes break planning."}
  - name: negative-no-invented-details
    vars:
      event: "A webinar for our customers."
      duration_minutes: 60
      platform: ""
    assert:
      - {type: llm-rubric, value: "States assumptions about goal, presenters and audience explicitly and uses role names and [FILL] placeholders rather than inventing names, products or offers."}
