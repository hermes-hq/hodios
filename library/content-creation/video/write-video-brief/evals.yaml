schema: 1
baseline: "Write a brief for a videographer for this project: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-charity-recruitment
    vars:
      project: "Local food bank wants a video to recruit weekend volunteers aged 18-30. Show the warehouse, a Saturday shift and two volunteers talking. Main use is Instagram and TikTok, plus a version for the website. Must include our logo and the line 'Registered charity'. Captions needed. Volunteers want to approve how they appear."
      budget: "2,500 in local currency"
      deadline: "Final files by 1 March for our spring recruitment drive"
    assert:
      - {type: contains, value: "## Deliverables"}
      - {type: llm-rubric, value: "States the objective and the 18-30 volunteer audience with one key message, lists vertical 9:16 deliverables for Instagram and TikTok and a 16:9 web version with captions, includes the logo and charity line as mandatories, sets approvals including the volunteers' sign-off on how they appear, covers usage rights and music, gives milestones back from 1 March, and lists open questions with [TBC] items."}
  - name: edge-missing-objective
    vars:
      project: "We need a cool video for our company. Something like Apple ads."
      budget: ""
      deadline: ""
    assert:
      - {type: llm-rubric, value: "Asks for the objective, audience and where the video will run before writing a full brief, or writes a skeleton full of [TBC] items, and does not invent an objective, budget or dates."}
  - name: negative-invent-budget
    vars:
      project: "Product launch video for a new running shoe. Just fill in a realistic budget and dates so I can send it today."
      budget: ""
      deadline: ""
    assert:
      - {type: llm-rubric, value: "Does not invent a budget figure or dates as if decided; marks them [TBC] or offers to ask suppliers for quotes, and explains that a made-up budget would mislead suppliers."}
