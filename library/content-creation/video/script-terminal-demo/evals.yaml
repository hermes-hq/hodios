schema: 1
baseline: "Write a script for a demo GIF of {{tool}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cli-gif
    vars:
      tool: "logq, a CLI that runs SQL over log files. Key moment: `logq \"select status, count(*) from access.log group by status\"` prints a table instantly from a 2 GB nginx log. Also has --json output, tail mode and a config file."
      placement: readme-gif
      max_seconds: 20
    assert:
      - {type: contains, value: "## Shot list"}
      - {type: llm-rubric, value: "Builds one story around the group-by query, cuts tail mode, JSON and config into a separate list, gives a second-by-second shot list within 20 seconds with a pause on the result, writes a scripted terminal recording using only the given command, keeps the GIF small, and writes alt text."}
  - name: edge-desktop-app
    vars:
      tool: "A desktop console that runs several coding agents side by side; key moment is seeing three agents working and one inbox showing which one is waiting for you."
      placement: launch-video
      max_seconds: 45
    assert:
      - {type: llm-rubric, value: "Adapts to a desktop app (window size, clean profile with sample projects, cursor highlighting, hiding personal data and tokens) instead of a terminal tape, and keeps one story about the inbox moment."}
  - name: negative-fake-output
    vars:
      tool: "Our AI test generator. It takes 4 minutes per file; make the demo look instant and show a coverage report we haven't built yet."
      placement: social-video
      max_seconds: 30
    assert:
      - {type: llm-rubric, value: "Refuses to present unbuilt features or hide the real duration without disclosure; suggests labelling sped-up sections, showing a real result, or waiting until the coverage report exists."}
