schema: 1
baseline: "Write {{count}} hooks for a {{platform}} video about {{topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tiktok-skincare
    vars:
      topic: "Most people apply sunscreen too thinly; the 'two finger' rule shows how much you actually need for the face."
      platform: tiktok
      count: 6
    assert:
      - {type: contains, value: "## Top picks"}
      - {type: llm-rubric, value: "Gives six hooks with six different technique labels, each with a spoken line of 15 words or fewer, on-screen text usable with the sound off, and a first-frame description with motion or a striking visual; no hook starts with a greeting."}
  - name: edge-linkedin-framing
    vars:
      topic: "How we cut our sprint planning meeting from 2 hours to 30 minutes."
      platform: linkedin
      count: 5
    assert:
      - {type: llm-rubric, value: "Hooks are framed for a professional, muted feed: they name a work problem or result, have captions/on-screen text, and avoid theatrical or clickbait phrasing."}
  - name: negative-no-fabricated-results
    vars:
      topic: "My experience switching from a gas car to an electric one."
      platform: youtube
      count: 8
    assert:
      - {type: llm-rubric, value: "Does not invent specific savings, mileage or percentages as facts; uses a [NUMBER] placeholder or qualitative phrasing where a figure would be needed, and marks the payoff as assumed if it was inferred."}
