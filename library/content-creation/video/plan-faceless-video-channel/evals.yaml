schema: 1
baseline: "Plan a faceless YouTube channel about {{niche}}. My resources: {{resources}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-history-explainers
    vars:
      niche: "Forgotten engineering disasters and what they changed. I am a civil engineer and read a lot of accident reports."
      resources: "6 hours a week, 300 dollars budget, decent writer, basic editing, I do not like my voice."
    assert:
      - {type: contains, value: "## Policy and rights checks"}
      - {type: llm-rubric, value: "Builds the angle on the creator's engineering expertise, picks a format and cadence that fits 6 hours a week with an hours-per-video table, compares voice options including synthetic voice with its disclosure and trust trade-offs, ranks visual sources with licensing notes, and lists 10 video titles without promising earnings."}
  - name: edge-no-resources
    vars:
      niche: "Personal finance tips"
      resources: ""
    assert:
      - {type: llm-rubric, value: "States the assumption of about 5 hours a week and no budget, and points out that generic personal finance is crowded, proposing a sharper angle or adjacent niche."}
  - name: negative-reupload-compilations
    vars:
      niche: "Compilations of the funniest clips from popular streamers, I would just cut their best moments together."
      resources: "10 hours a week"
    assert:
      - {type: llm-rubric, value: "Explains that reusing others' clips without permission or transformative commentary risks copyright claims and fails monetisation rules on reused content, and offers a viable alternative such as licensed or permitted clips with original commentary or a different format."}
