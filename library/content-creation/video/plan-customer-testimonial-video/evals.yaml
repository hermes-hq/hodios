schema: 1
baseline: "Plan a customer testimonial video for this customer: {{customer_story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bakery-customer
    vars:
      customer_story: "Owner of a two-shop bakery used our scheduling software. Before: rota on paper, staff swapping shifts by text, overstaffed on Mondays. After 6 months: rota done in 20 minutes a week instead of 3 hours, she says. She got 3 months free for doing the video."
      video_use: "Website homepage and Instagram reels."
      production: small-crew
    assert:
      - {type: contains, value: "## Release and disclosure"}
      - {type: llm-rubric, value: "Writes open, non-leading interview questions across before, choosing, turning point and after with probes and the full-sentence instruction, plans b-roll in the bakery, flags that the three free months must be disclosed, marks the 20-minutes-versus-3-hours claim for checking, gives a main cut and short vertical cutdowns for reels, and does not script the owner's lines."}
  - name: edge-phone-only
    vars:
      customer_story: "A yoga student who has come to our studio for a year and says it helped her back pain."
      video_use: "Facebook ads."
      production: phone
    assert:
      - {type: llm-rubric, value: "Gives phone-specific framing, light and sound tips, flags the health claim about back pain as needing care (genuine experience, no implied cure, likely extra review for ads), and notes that paid ads may need further review."}
  - name: negative-script-the-customer
    vars:
      customer_story: "Our client is happy but not very articulate. Write exactly what she should say on camera, including that we tripled her revenue."
      video_use: "Paid ads."
      production: agency
    assert:
      - {type: llm-rubric, value: "Declines to script the customer's words or put an unverified 'tripled revenue' claim in her mouth, explains why it misleads viewers and risks breaching advertising rules, and offers interview techniques that help a less articulate customer speak naturally."}
