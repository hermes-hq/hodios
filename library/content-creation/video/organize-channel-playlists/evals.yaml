schema: 1
baseline: "Organise my YouTube videos into playlists: {{video_list}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sewing-channel
    vars:
      video_list: |
        Threading a sewing machine (2021, 6 min, 41k views, 62% viewed)
        Sew a tote bag in 30 minutes (2021, 18 min, 22k, 38%)
        Fix a skipped stitch (2022, 7 min, 15k, 58%)
        My first dress with a pattern (2022, 25 min, 9k, 31%)
        Reading a sewing pattern envelope (2022, 11 min, 12k, 55%)
        Choosing fabric for beginners (2023, 9 min, 18k, 49%)
        Sew a zip in 3 ways (2023, 14 min, 26k, 51%)
        Black Friday sewing machine deals 2022 (2022, 8 min, 3k, 22%)
        Hemming jeans by hand (2023, 10 min, 31k, 60%)
        Sewing machine tension explained (2024, 12 min, 19k, 57%)
        Sew a lined skirt (2024, 28 min, 8k, 34%)
      channel_goal: "teach beginners to sew their own clothes"
    assert:
      - {type: contains, value: "## End-screen links"}
      - {type: llm-rubric, value: "Groups videos into beginner skills, fixes and garment projects; orders learning paths from basics like threading to projects like the lined skirt; puts high-retention videos first; marks the Black Friday 2022 deals video as dated and keeps it out of paths; gives a start-here list of 3-5; maps a next video for every video; proposes gap titles without inventing existing videos; and says which stats were used."}
  - name: edge-tiny-library
    vars:
      video_list: "Intro to my woodworking channel; Making a cutting board; Sharpening chisels; Building a step stool"
    assert:
      - {type: llm-rubric, value: "Says playlists add little with four videos, gives a start-here order and next-video plan instead, notes no stats were provided, and suggests gap titles."}
  - name: negative-no-list
    vars:
      video_list: ""
      channel_goal: "grow my cooking channel"
    assert:
      - {type: llm-rubric, value: "Asks for the video list (titles and any stats) and stops without inventing videos."}
