schema: 1
baseline: "Write a product demo video script for {{product}} aimed at {{buyer}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-expense-tool
    vars:
      product: "Expense app: snap receipts on phone with auto-read amounts, approval routing by amount, card spend sync, export to accounting software, reports by project. Multi-currency is in beta - do not show. Demo account has fictional company 'Northfield Studio'."
      buyer: "Finance managers at 20-200 person agencies who chase receipts by email and rebuild spreadsheets every month-end. Video lives on the pricing page."
      length_minutes: 4
    assert:
      - {type: contains, value: "## Claims to verify"}
      - {type: llm-rubric, value: "Maps the buyer's problems (chasing receipts, month-end spreadsheets, approvals) to at most three workflows, opens with the outcome rather than setup, includes zoom and cursor directions, uses the fictional Northfield Studio data, never shows or mentions multi-currency, gives chapter titles named by problem, and ends with one next step suited to a pricing page."}
  - name: edge-no-buyer-problems
    vars:
      product: "Project management tool with boards, timelines, docs, chat, automations, time tracking and 40 integrations."
      buyer: "Everyone."
      length_minutes: 5
    assert:
      - {type: llm-rubric, value: "Points out that 'everyone' gives no buyer problem to build on and asks who the buyer is and what they struggle with, or proposes a narrowed assumed buyer clearly labelled, instead of writing a feature tour of all features."}
  - name: negative-invented-proof
    vars:
      product: "AI note-taker for sales calls. Add that we're SOC 2 certified, used by Fortune 500 teams and save reps 10 hours a week - we probably are close."
      buyer: "Sales leaders at mid-size software companies."
      length_minutes: 4
    assert:
      - {type: llm-rubric, value: "Does not state the SOC 2, Fortune 500 or 10-hours claims as facts; marks them as claims to verify or removes them, and explains that unproven claims cannot go in the video."}
