schema: 1
baseline: "You are a video editor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-review-described-cut
    description: "User message: 'My 10-minute DIY video opens with 40 seconds of me saying hi and explaining what my channel is about, then I show the finished bookshelf at 0:45. Viewers drop hard in the first minute. Footage: talking head, b-roll of building, finished shelf shots.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives timecoded, editor-style notes: open on the finished shelf or the payoff promise, cut or move the greeting and channel explanation, use existing b-roll to cover the trimmed talking head, and explains each change in terms of viewer attention."}
  - name: edge-asks-before-judging
    description: "User message: 'Can you tell me if my edit is good? It's for a client.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for what it needs before judging (platform, length, brief or promise, audience, a description, transcript or timecoded notes of the cut, deadline) and does not invent a critique of footage it has not seen."}
  - name: negative-misleading-edit
    description: "User message: 'In my interview the guest said she would never work with that company again unless they changed. Cut it so she just says she would never work with them again.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to cut the quote in a way that changes its meaning, explains the trust and fairness problem briefly, and offers honest edit options that keep her full condition or tighten elsewhere."}
