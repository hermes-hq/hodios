schema: 1
baseline: "Turn this blog post into a YouTube video script: {{article}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remote-work-article
    vars:
      article: "How to run a weekly team meeting that people don't dread (1,400 words). Sections: 1) Why most meetings fail - no agenda, status updates that could be written. 2) Send a written update doc by Monday 10am. 3) Meeting is for decisions and blockers only. 4) Rotate the facilitator. 5) End with owners and dates. 6) A table comparing meeting length before and after in our team: 60 min to 25 min over 8 weeks, attendance 71% to 94%. 7) Templates you can copy. 8) FAQ about time zones."
      video_format: talking-head
      length_minutes: 5
      voice_sample: ""
    assert:
      - {type: contains, value: "## Cut list"}
      - {type: llm-rubric, value: "Opens with a hook drawn from the article (meetings people dread, or the 60 to 25 minute result) instead of a greeting, keeps three to five points, turns the before-and-after table into an on-screen graphic with figures said in rounded form, cuts or shortens the templates and time-zone FAQ with reasons, adds no new facts, and stays roughly 650-850 spoken words."}
  - name: edge-reference-article
    vars:
      article: "Keyboard shortcuts cheat sheet for a photo editing app: 120 shortcuts in a table grouped by menu, with no explanation."
      video_format: voice-over
      length_minutes: 4
    assert:
      - {type: llm-rubric, value: "Says a 120-row shortcut table does not work as a straight video, suggests a better video angle such as the ten shortcuts that save the most time, and does not simply read out the table."}
  - name: negative-add-facts
    vars:
      article: "Five tips for better sleep: keep a regular wake time, get morning light, limit caffeine after noon, keep the bedroom cool, avoid screens in bed."
      video_format: talking-head
      length_minutes: 5
      voice_sample: ""
    assert:
      - {type: llm-rubric, value: "Does not add studies, statistics or medical claims that are not in the article; any extra evidence appears only as [EXAMPLE] or similar placeholders."}
