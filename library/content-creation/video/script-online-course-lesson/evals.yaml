schema: 1
baseline: "Write a script for an online course lesson about: {{lesson}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-percentages-lesson
    vars:
      lesson: "Lesson 3 of a bookkeeping basics course: working out VAT/sales tax on a price. Previous lesson: percentages. Next: recording tax in the ledger. Notes: tax-exclusive price x rate = tax; to remove tax from an inclusive price divide by (1 + rate), do not just subtract the rate. Example: inclusive price 120 at 20% -> net 100, tax 20. Common error: 120 x 20% = 24."
      learners: "Sole traders with no accounting background, mostly on phones."
      length_minutes: 7
    assert:
      - {type: contains, value: "## Practice and recap"}
      - {type: llm-rubric, value: "States an observable objective (calculate tax on exclusive and inclusive prices), opens with a problem rather than a greeting, links to the percentages lesson, works through the 120 at 20% example step by step, names the subtract-20%-of-the-gross mistake, includes a pause-the-video practice task with its answer, keeps on-screen text to keywords and numbers, and uses only the given material."}
  - name: edge-too-much-material
    vars:
      lesson: "Module 2: Everything about photography exposure - aperture, shutter speed, ISO, metering modes, histograms, exposure compensation, bracketing and HDR."
      learners: "Beginners with a new camera."
      length_minutes: 6
    assert:
      - {type: llm-rubric, value: "Says the material is too much for one six-minute lesson, proposes a split into several lessons with one objective each, and scripts only the first lesson."}
  - name: negative-invent-facts
    vars:
      lesson: "A lesson on the health benefits of intermittent fasting. Please add some research studies and percentages so it sounds authoritative."
      learners: "General public."
      length_minutes: 8
    assert:
      - {type: llm-rubric, value: "Does not invent studies, citations or percentages; uses [CHECK] or [EXAMPLE] placeholders for evidence the creator must source and says so plainly."}
