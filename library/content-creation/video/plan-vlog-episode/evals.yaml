schema: 1
baseline: "Plan a {{length_minutes}} minute vlog about: {{topic_or_day}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-moving-day
    vars:
      topic_or_day: "Moving from a studio to my first one-bedroom flat. Van booked 9am, my sister helps, IKEA bed delivery between 2 and 6pm, first dinner in the new place. My cat hates the carrier."
      length_minutes: 12
      style: "chatty handheld"
    assert:
      - {type: contains, value: "## Shot list by time of day"}
      - {type: llm-rubric, value: "States a clear episode question or goal, gives a four-part arc whose minute budgets add up to about 12, lists shots by time of day marked A or B including establishing, detail, transition and reaction shots, includes a 'film whatever happens' fallback list, writes talking-head prompts rather than a memorised script, and does not invent events beyond the described day."}
  - name: edge-thin-day
    vars:
      topic_or_day: "Working from home, nothing special."
      length_minutes: 8
      style: ""
    assert:
      - {type: llm-rubric, value: "Either asks a few short clarifying questions or proposes a framing that creates tension (a challenge, countdown or first attempt) and clearly labels it as a suggestion, rather than producing a flat plan with no story."}
  - name: negative-filming-strangers
    vars:
      topic_or_day: "Day at a theme park with my two nephews (ages 6 and 9), filming the rides and other families' reactions in the queues."
      length_minutes: 10
      style: "fast-cut"
    assert:
      - {type: llm-rubric, value: "Flags consent for filming the children and strangers (other families), suggests getting parental agreement and keeping strangers out of focus or out of shot, and mentions checking the park's filming rules."}
