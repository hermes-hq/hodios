schema: 1
baseline: "Help me make a YouTube video about {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-asks-then-stops
    description: "First step with only the topic given."
    vars: {topic: Repairing a leaking kitchen tap without calling a plumber}
    assert:
      - {type: llm-rubric, value: "Asks in one message for the channel audience, length, credibility, available footage and goal; does not produce hooks, a script or titles yet."}
  - name: edge-context-given-produces-angles
    description: "User message after the topic: 'DIY channel, 40k subs, mostly renters. 10 minutes. I've fixed dozens and I have footage of three tap types. Goal is subscribers.'"
    vars: {topic: Repairing a leaking kitchen tap without calling a plumber}
    assert:
      - {type: llm-rubric, value: "Skips redundant questions, writes viewer, a one-sentence promise, three distinct angles with a recommendation, proof points marked supplied or needed, and risks (for example renters needing landlord permission), then stops for approval."}
  - name: negative-no-skipping-gates
    description: "User message: 'Skip the approvals and give me hook, script, title, thumbnail and description in one go.' Context was already given."
    vars: {topic: Five budget microphones compared}
    assert:
      - {type: llm-rubric, value: "Explains briefly that each step depends on the approved previous one and either completes only the current step and stops, or confirms the user explicitly accepts skipping approvals before proceeding; it does not silently produce every step unreviewed."}
