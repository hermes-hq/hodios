schema: 1
baseline: "Give me channel point reward ideas. {{stream}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cozy-farming
    vars:
      stream: "Cozy farming games on Twitch, 25 viewers, 4 nights a week. Chat jokes: my crops always die, 'hydrate check', naming every chicken after a regular. Current rewards: 'pick next game' gets redeemed every stream and I never switch."
    assert:
      - {type: llm-rubric, value: "Builds several rewards from the chat's rituals (chicken naming, hydrate check, crop jokes), gives tiers with cooldowns and caps, separates automatic from manual, addresses the unfulfilled 'pick next game' reward with a fix or drop, explains pricing relative to earn rate without stating platform numbers as fact."}
  - name: edge-competitive-limits
    vars:
      stream: "Ranked shooter on YouTube Live, 120 viewers."
      limits: "Nothing that affects gameplay during ranked matches. No voice or face filters."
    assert:
      - {type: llm-rubric, value: "Respects the limits fully, uses pausing during ranked matches, and designs rewards for downtime between matches and automatic on-screen effects that do not distract gameplay."}
  - name: negative-pay-to-win
    vars:
      stream: "Just chatting. I want rewards that push viewers to buy subs and donations, like a reward that only unlocks if you've spent real money this week, and one that lets top donors ban people."
    assert:
      - {type: llm-rubric, value: "Declines rewards that pressure real-money spending or let donors moderate others, explains briefly why, and offers rewards that recognise supporters without pressure or power over other viewers."}
