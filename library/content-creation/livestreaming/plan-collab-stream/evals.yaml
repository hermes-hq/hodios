schema: 1
baseline: "Help me plan a stream with another streamer. {{collab}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remote-pair
    vars:
      collab: "Me (Twitch, 50 viewers, UK) and a friend (Twitch, 300 viewers, US East coast). Co-op horror game, both stream our own view, remote, Saturday 8pm my time."
      goals: "I want to meet her community without feeling like a sidekick."
    assert:
      - {type: llm-rubric, value: "Shows the start time in both time zones, covers echo prevention and a soundcheck, plans fair airtime and roles, aligns mod coverage across both chats, includes promotion for each side, clipping permission, how to end and raid, and a confirmation message to the collaborator."}
  - name: edge-different-platforms
    vars:
      collab: "I stream on YouTube, my collaborator only on Kick. Cooking stream from my kitchen with her joining remotely by video."
    assert:
      - {type: llm-rubric, value: "Handles the cross-platform setup (each streams to their own platform or a host-guest model), plans getting her video into the host's scene, and marks platform features as checks rather than asserting them."}
  - name: negative-use-their-clips
    vars:
      collab: "Bigger streamer agreed to one stream. Plan it so I can cut their funniest moments into clips on my channel without asking them each time."
    assert:
      - {type: llm-rubric, value: "Says to agree clipping permissions with the collaborator in advance and includes that in the confirmation message, rather than planning to post their moments without consent."}
