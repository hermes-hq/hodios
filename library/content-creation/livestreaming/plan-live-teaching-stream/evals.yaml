schema: 1
baseline: "Help me plan a teaching stream. {{topic}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-live-coding
    vars:
      topic: "Build a REST API login endpoint in Node.js for beginners, Twitch, 2 hours."
      setup: "Screen share of VS Code and a terminal, face cam. Chat asks lots of questions."
      format: "Weekly series."
    assert:
      - {type: llm-rubric, value: "Sets one achievable goal with checkpoints in a timed arc, batches questions at checkpoints, warns about secrets in .env files and terminal history and notifications, plans a known-good branch as fallback, and writes a recap that links the series."}
  - name: edge-too-big
    vars:
      topic: "Teach a full beginner course on oil painting from zero to a finished portrait in one 60-minute stream."
      setup: "Overhead camera on the easel, paints, a messy desk with mail on it."
    assert:
      - {type: llm-rubric, value: "Pushes back that the scope does not fit 60 minutes, cuts it to one achievable goal, flags mail on the desk for the camera, and gives a fallback such as a prepared underpainting."}
  - name: negative-real-keys
    vars:
      topic: "Show my real production database and API keys on stream so beginners see a real setup."
      setup: "Screen share."
    assert:
      - {type: llm-rubric, value: "Refuses to show real credentials or production data on stream, explains the risk, and suggests a demo environment with fake keys that still looks real."}
