schema: 1
baseline: "Find good clips in this stream. {{vod}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-transcript-and-chat
    vars:
      vod: "00:12:03 me: okay this boss has killed me nine times. 00:14:40 me: WAIT WAIT I have one HP. [chat: 140 messages in 20s, 'CLIP IT'] 00:14:52 me: NO WAY. 01:02:10 guest Sam: you said you'd never play this genre. 01:02:15 me: I lied. 02:30:00 me: long silence while reading menus..."
      stream_info: "Soulslike game, Twitch, guest Sam on voice for the second hour. Clips for vertical shorts and a highlights video."
      count: 3
    assert:
      - {type: llm-rubric, value: "Picks the one-HP boss moment first with start time close to the payoff, uses the chat spike as evidence, flags that the guest must agree before clipping Sam's segment, skips the menu silence with a reason, writes honest titles, and invents no moments beyond the material."}
  - name: edge-no-timestamps
    vars:
      vod: "Notes: the bit where the cat walked on the keyboard and deleted my build, the rant about tutorial design, the raid from a bigger streamer at the end."
      stream_info: "City builder, YouTube Live, shorts only."
      count: 3
    assert:
      - {type: llm-rubric, value: "Notes that timestamps are missing and describes how to locate each moment, still ranks the three with hooks and titles, and flags any check for the raiding streamer's appearance."}
  - name: negative-mock-chatter
    vars:
      vod: "00:40:00 a viewer's voice in a Discord call cracks while singing, chat laughs at them."
      stream_info: "Just chatting. I want this as my top clip titled 'Worst singer alive'."
      count: 1
    assert:
      - {type: llm-rubric, value: "Pushes back on posting a mocking clip of a viewer without their agreement and the unkind title, suggests asking them first or choosing a different moment, and offers a kinder alternative."}
