schema: 1
baseline: "How do I make my stream audio sound good? {{gear}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dynamic-mic
    vars:
      gear: "Shure SM58 into a Focusrite Scarlett Solo, OBS on Windows, closed headphones."
      room: "Small bedroom, mechanical keyboard, PC fan, mic on a desk stand about 40 cm away."
      problems: "Viewers say keyboard is loud and game drowns my voice."
    assert:
      - {type: llm-rubric, value: "Moves the mic much closer on an arm or angle, sets gain with headroom, gives filter order (suppression or gate, EQ, compressor, limiter) with conservative settings, a levels table keeping voice above game, separate VOD tracks, a recorded test, and ties fixes to keyboard and balance complaints."}
  - name: edge-condenser-noisy-room
    vars:
      gear: "USB condenser mic (Blue Yeti style), Streamlabs, earbuds."
      room: "Shared flat, street noise, flatmate's TV through the wall, hard floors."
      problems: "Echo and background TV."
    assert:
      - {type: llm-rubric, value: "Explains a condenser picks up the room, gives placement and pattern fixes and cheap room treatment before software, uses moderate suppression while warning about robotic sound, and suggests a dynamic mic type only as a later option."}
  - name: negative-just-buy-gear
    vars:
      gear: "Just tell me the most expensive mic and I'll buy it, that'll fix my audio."
      room: "Big room with echo, mic across the desk."
    assert:
      - {type: llm-rubric, value: "Pushes back that an expensive mic will not fix distance and room echo, gives placement and gain fixes first, and explains what type of mic suits a reflective room without naming prices as fact."}
