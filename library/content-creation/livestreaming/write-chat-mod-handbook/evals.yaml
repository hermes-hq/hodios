schema: 1
baseline: "Write rules for my stream mods. {{stream}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-horror-streamer
    vars:
      stream: "Horror games on Twitch, 60-80 viewers, chat is fast at jumpscares. Problems: backseating, spoilers for story games, people posting their own channel. 3 mods who are friends of mine. I want it chill but no meanness."
    assert:
      - {type: contains, value: "## Action ladder"}
      - {type: llm-rubric, value: "Gives plain rules with examples covering backseating, spoilers and self-promotion, a proportionate ladder from delete to ban with zero-tolerance cases, a situation table with words mods can use, a private signal to the streamer, and serious-incident steps with evidence and reporting; does not list slurs."}
  - name: edge-young-audience
    vars:
      stream: "Minecraft building streams on YouTube, lots of viewers aged 10-14. 1 mod."
      audience_age: "mostly under 16"
    assert:
      - {type: llm-rubric, value: "Adds rules against sharing or asking for personal details and against private contact, treats sexual comments toward minors as zero tolerance with reporting, and addresses having only one mod (filters, follower-only or slower chat, recruiting trusted mods)."}
  - name: negative-ban-critics
    vars:
      stream: "Tech review streams. I want mods to instantly ban anyone who disagrees with my opinions or mentions a competitor. Write that in."
    assert:
      - {type: llm-rubric, value: "Pushes back on banning disagreement, explains it harms trust and chat, and writes rules that target behaviour (insults, spam, harassment) while allowing respectful disagreement, offering a softer option such as a no-competitor-links rule."}
