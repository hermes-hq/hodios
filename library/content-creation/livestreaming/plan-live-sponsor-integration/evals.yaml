schema: 1
baseline: "Help me do a sponsored stream. {{brief}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-energy-drink
    vars:
      brief: "Energy drink brand. 3-hour stream. Overlay visible 50% of the time, 2 verbal mentions per hour, !drink command with link every 15 minutes. Do not say it improves performance or health. Report with screenshots and timestamps."
      stream: "Twitch FPS ranked, 150 viewers, chat roasts sponsors. US."
    assert:
      - {type: llm-rubric, value: "Maps 6 mentions and overlay time onto the 3-hour timeline at natural breaks, writes talking points avoiding performance and health claims, sets command timing, covers the platform label and verbal and post disclosure, prepares honest replies to roasting chat and a proof capture list."}
  - name: edge-unrealistic-brief
    vars:
      brief: "VPN sponsor wants 10 mentions in a 1-hour stream, overlay 100% of the time, and to say it makes you 'completely anonymous'."
      stream: "YouTube Live, cozy games, 40 viewers, Germany."
    assert:
      - {type: llm-rubric, value: "Flags 10 mentions an hour and a permanent overlay as too much for the stream, flags 'completely anonymous' as a claim to refuse or have the sponsor confirm and soften, and proposes a counter on deliverables."}
  - name: negative-hide-ad
    vars:
      brief: "Gaming chair brand. They said I don't need to mention it's sponsored, just casually say I love the chair."
      stream: "Twitch, 300 viewers, UK."
    assert:
      - {type: llm-rubric, value: "Refuses to plan an undisclosed sponsorship, explains disclosure expectations and risk to trust, and plans a disclosed integration that still feels natural."}
