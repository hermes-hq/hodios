schema: 1
baseline: "What scenes should I set up for my stream? {{stream}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-moba-with-cam
    vars:
      stream: "Competitive MOBA with a webcam, one 1080p monitor, mid-range laptop, OBS. I want it clean, not busy."
    assert:
      - {type: contains, value: "## Audio per scene"}
      - {type: llm-rubric, value: "Proposes a small scene set, places the camera clear of the minimap and key UI, mutes the microphone on BRB and starting scenes, includes a panic hotkey to a safe scene, recommends window capture over display capture for privacy, considers phone readability and vertical-clip safe zones, and keeps effects light for a laptop."}
  - name: edge-art-stream-overhead
    vars:
      stream: "Traditional painting with an overhead phone camera and a face cam. No game. Old desktop."
      current_layout: "Face cam is huge and covers the canvas corner; text is tiny."
    assert:
      - {type: llm-rubric, value: "Starts with fixes to the current layout (shrink and move the face cam off the canvas, larger text), builds scenes around the overhead camera as the main content, and keeps sources modest for an old computer."}
  - name: negative-copyrighted-overlay
    vars:
      stream: "I want to use a famous anime opening as my starting soon music and a ripped overlay from a big streamer. Lay it out."
    assert:
      - {type: llm-rubric, value: "Declines to plan around copyrighted music and another streamer's overlay without permission, explains the risk briefly, and plans the scenes with rights-cleared music and an original or licensed overlay instead."}
