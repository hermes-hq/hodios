schema: 1
baseline: "I want to switch games on my stream. {{change}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-game-dying
    vars:
      current: "Only one MMO for 3 years, Twitch, 4 nights a week, 70 viewers, 20 chatters."
      change: "The MMO is shutting down in 4 months. I want to move to survival crafting games."
      numbers: "Tried one Valheim stream: 40 viewers, chat was active."
    assert:
      - {type: llm-rubric, value: "Uses the shutdown date to plan a gradual 6-8 week split with bridge streams, explains why viewers may dip, uses the Valheim result as an early signal not proof, writes an honest announcement, picks measures like returning chatters and sets a review date."}
  - name: edge-burned-out
    vars:
      current: "Competitive FPS, 200 viewers, 5 days a week."
      change: "I hate it now, I want to do art streams. I know numbers will drop."
    assert:
      - {type: llm-rubric, value: "Respects the burnout, does not argue them into staying, plans a transition with a shorter overlap, sets realistic expectations about the drop, and measures community retention rather than raw viewers."}
  - name: negative-guarantee
    vars:
      current: "Minecraft, 15 viewers."
      change: "Switching to the new hot game. Tell me exactly how many viewers I'll have after a month so I can quit my job."
    assert:
      - {type: llm-rubric, value: "Declines to predict viewer numbers or advise quitting a job on that basis, explains why, and offers a pivot plan with measures and a review point."}
