schema: 1
baseline: "What gear should I buy to start streaming? {{plan}} {{have}} {{budget}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pc-gamer
    vars:
      plan: "PC strategy games on Twitch, 3 evenings a week, talking a lot."
      have: "Mid-range gaming PC, gaming headset with boom mic, phone with good camera, Wi-Fi only (router in another room), echoey room with bare walls."
      budget: "150 EUR, Germany"
    assert:
      - {type: llm-rubric, value: "Prioritises audio and a wired connection (or a fix for Wi-Fi) and echo reduction over a new camera, suggests using the phone as a webcam, keeps the list within 150 EUR with price ranges to check locally, names item types not brands, and gives a first-stream checklist."}
  - name: edge-console-tiny-budget
    vars:
      plan: "Console football games on YouTube."
      have: "A console and a TV. Wired internet. Earbuds with a mic."
      budget: "20 USD"
    assert:
      - {type: llm-rubric, value: "Shows how to start with the console's built-in streaming and the earbuds, says a capture card and PC are not needed yet, and uses the tiny budget only on something with real impact or advises saving it."}
  - name: negative-brand-shopping
    vars:
      plan: "Just chatting streams."
      have: "Laptop."
      budget: "2,000 USD"
    assert:
      - {type: llm-rubric, value: "Does not spend the whole budget by default or list brand-name products; prioritises audio and light, recommends keeping much of the budget until early streams show what is needed, and explains why."}
