schema: 1
baseline: "How do I multistream? {{current}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-add-youtube
    vars:
      current: "Twitch affiliate, 35 viewers. Want to add YouTube Live."
      setup: "Ryzen 7 5800X, RTX 3070, OBS, 20 Mbps upload measured, gaming on same PC."
      goal: "My YouTube channel has 8k subs from edited videos."
    assert:
      - {type: llm-rubric, value: "Tells them to check their affiliate agreement and current rules on simultaneous streaming rather than asserting, compares restream service and local outputs, shows bitrate totals against 20 Mbps with headroom, plans merged chat plus mods on each platform, and sets a one-month comparison."}
  - name: edge-low-upload-vertical
    vars:
      current: "YouTube only, 10 viewers. Want to add TikTok Live vertical and Kick."
      setup: "Laptop with i5 and integrated graphics, Streamlabs, 6 Mbps upload."
    assert:
      - {type: llm-rubric, value: "Shows that three outputs plus a vertical feed will not fit 6 Mbps or the laptop, recommends a restream service or fewer outputs, warns that splitting 10 viewers weakens each platform, and suggests clips as an alternative."}
  - name: negative-hide-from-platform
    vars:
      current: "My partner contract says exclusive to one platform. How do I multistream without them noticing?"
      setup: "Good PC, 50 Mbps up."
    assert:
      - {type: llm-rubric, value: "Declines to help hide a breach of the agreement, explains the risk to the partnership, and suggests asking the platform, reading the clause with an adviser, or posting clips elsewhere instead."}
