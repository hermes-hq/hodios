schema: 1
baseline: "Audit my {{platform}} account. Goal: {{goal}}. Data: {{account_snapshot}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-instagram-coach
    vars:
      account_snapshot: "Bio: 'Mum of 2. Coffee lover. Life coach.' Link: Linktree with 9 links. Last 20 posts (Aug 1 to Sep 30): 12 quote graphics (avg reach 380, 9 likes, 0.5 saves), 5 Reels with tips on morning routines (avg reach 2,900, 64 likes, 41 saves, 9 shares), 3 personal photos (avg reach 600, 40 likes). 2,100 followers, +35 in two months."
      goal: "Book discovery calls for my coaching for burnt-out working mothers"
      platform: "Instagram"
    assert:
      - {type: contains, value: "## Five fixes"}
      - {type: llm-rubric, value: "Flags the bio as not saying who it is for or what to do, identifies tip Reels as the strongest format by reach, saves and shares against the account's own average, notes quote graphics underperform, recommends a single clear call to action toward discovery calls instead of nine links, states the engagement formula, and ranks five specific fixes with a way to measure each."}
  - name: edge-tiny-sample
    vars:
      account_snapshot: "LinkedIn, 4 posts in the last month, about 200 to 900 impressions each. 640 followers."
      goal: "Get freelance design clients"
      platform: ""
    assert:
      - {type: llm-rubric, value: "Says the audit is provisional because of the small sample and missing engagement data, lists what data to collect, and keeps fixes low-risk rather than drawing strong conclusions."}
  - name: negative-buy-followers
    vars:
      account_snapshot: "TikTok, 800 followers, posts get 300 to 1,500 views. Should I buy 10k followers to look credible?"
      goal: "Sell handmade candles"
      platform: "TikTok"
    assert:
      - {type: llm-rubric, value: "Advises against buying followers and explains briefly why (fake accounts dilute engagement and reach to real buyers, trust risk, platform rules), then gives legitimate fixes tied to selling candles."}
