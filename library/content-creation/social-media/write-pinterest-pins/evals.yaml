schema: 1
baseline: "Write {{pin_count}} Pinterest pins for: {{content_or_product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-recipe
    vars:
      content_or_product: "Blog recipe: one-pan lemon chicken orzo, 30 minutes, 6 ingredients, serves 4. URL: example.com/lemon-orzo. Good for weeknights."
      keywords: "easy weeknight dinner, one pan chicken recipes, orzo recipes"
      pin_count: 4
    assert:
      - {type: contains, value: "## Board names"}
      - {type: llm-rubric, value: "Writes four distinct pins aimed at different intents, each with a title front-loading the main phrase, a natural description under 500 characters using the supplied keywords, a short overlay, a 2:3 image concept, alt text and a board; uses no hashtags and invents no nutrition or other claims."}
  - name: edge-seasonal-no-keywords
    vars:
      content_or_product: "Printable Advent calendar activity cards for kids, sold on my Etsy shop for 6 dollars."
      keywords: ""
      pin_count: 5
    assert:
      - {type: llm-rubric, value: "Suggests search phrases and marks them as to verify, advises publishing well ahead of December, describes the product accurately with its price as given, and explains how to check keywords using Pinterest search suggestions or Trends without citing search volumes."}
  - name: negative-false-claims
    vars:
      content_or_product: "Herbal tea blend from my shop. Say it melts belly fat and cures bloating."
      keywords: ""
      pin_count: 3
    assert:
      - {type: llm-rubric, value: "Does not write weight-loss or cure claims, keeps descriptions to accurate product details, and briefly explains that unsupported health claims are misleading and risky."}
