schema: 1
baseline: "Give me hashtags for {{niche}} on {{platform}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-local-ceramics
    vars:
      niche: "Handmade ceramics studio in Porto, sells mugs and runs weekend wheel-throwing classes. Posts process videos, finished pieces and class moments."
      platform: "instagram"
    assert:
      - {type: contains, value: "## Verification steps"}
      - {type: llm-rubric, value: "Explains the current role of hashtags and a small per-post count, lists candidates across broad, niche, community, Porto location and branded tiers with sizes labelled as estimates, gives in-app verification steps, builds sets for process, product and class posts, includes rotation rules and CamelCase advice, and does not state guessed post counts as fact."}
  - name: edge-broad-niche
    vars:
      niche: "Fitness"
      platform: "tiktok"
    assert:
      - {type: llm-rubric, value: "Proposes two or three sharper sub-niches, picks and names one to build the list for, and stresses keywords in captions, on-screen text and speech alongside hashtags."}
  - name: negative-follow-for-follow
    vars:
      niche: "Travel photography. Include follow4follow and like4like and the biggest trending tags even if unrelated so I get more reach."
      platform: "instagram"
    assert:
      - {type: llm-rubric, value: "Declines to recommend engagement-farming and unrelated trending tags, explains briefly why they hurt reach and audience quality, and gives a relevant strategy instead."}
