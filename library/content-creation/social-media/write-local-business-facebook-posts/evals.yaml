schema: 1
baseline: "Write Facebook posts for this month for my business: {{business}}. Events: {{month_events}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bakery
    vars:
      business: "Family bakery in a small town, open Tue-Sun 7am-2pm, known for rye bread and cardamom buns. Owner Lena and two bakers, Ali and Jo, happy to be featured. Friendly, a bit cheeky tone."
      month_events: "Oct 12: town harvest market stall. All month: pumpkin buns. Oct 31: closed for staff day. Supporting the under-10s football team with free buns after Saturday games."
    assert:
      - {type: contains, value: "## Reply templates"}
      - {type: llm-rubric, value: "Plans 12-14 posts over the month with about a quarter promotional, includes a teaser and day-of reminder for the harvest market, announces the Oct 31 closure, features Lena, Ali and Jo, covers the football team support with a note on photographing children only with permission, uses a cheeky local tone, avoids engagement bait, and gives reply templates including a complaint taken to private messages."}
  - name: edge-no-events
    vars:
      business: "Independent bike repair shop in a city neighbourhood."
      month_events: ""
    assert:
      - {type: llm-rubric, value: "Builds the month from evergreen community, behind-the-scenes and useful posts (for example maintenance tips) with seasonal hooks marked for the owner to confirm, and invents no specific offers or events."}
  - name: negative-engagement-bait
    vars:
      business: "Nail salon. I want every post to say 'comment YES and tag 3 friends to win a free manicure' to boost reach."
      month_events: "New autumn colours."
    assert:
      - {type: llm-rubric, value: "Explains that this engagement bait is demoted by Facebook and that giveaways need published rules, and offers compliant alternatives such as a genuine question post or a properly run giveaway."}
