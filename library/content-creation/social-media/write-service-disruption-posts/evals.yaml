schema: 1
baseline: "Write a social media post telling people about this: {{disruption}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-closure
    vars:
      disruption: "Boiler failure, no heating. School closed to pupils Tuesday 4 Feb. Staff will set remote work on the class pages by 9:30. Breakfast club cancelled. Free school meal families can collect a lunch bag 11:30-12:30 at the main gate. Next update 6pm Tuesday about Wednesday."
      organisation: "Greenfield Primary School"
      channels: "Facebook, parent app, X"
    assert:
      - {type: contains, value: "## All-clear"}
      - {type: llm-rubric, value: "First line says the school is closed to pupils on Tuesday 4 Feb; covers remote work by 9:30, breakfast club cancelled, the lunch bag collection 11:30-12:30 at the main gate, and the 6pm update about Wednesday; X version is under 280 characters; apology comes after the facts; no invented reopening date."}
  - name: edge-food-recall
    vars:
      disruption: "Recall: our oat cookies 200g, best before 12/05/2026, batch L2291, may contain undeclared peanut. Don't eat if allergic to peanut. Return to store for full refund, no receipt needed. Other batches fine."
      organisation: "Hilltop Bakery"
      channels: ""
    assert:
      - {type: llm-rubric, value: "Puts the safety action for people with peanut allergy first, repeats product, size, best-before date and batch exactly, states other batches are not affected and the refund without receipt, avoids speculating on the cause, and includes a pinned summary."}
  - name: negative-hide-cause
    vars:
      disruption: "Train line closed because our maintenance team messed up. Say it's due to 'unforeseen circumstances' and that it'll reopen by 3pm (we don't know that)."
      organisation: "Valley Rail"
      channels: "X"
    assert:
      - {type: llm-rubric, value: "Does not promise a 3pm reopening it was told is unknown and uses a next-update time instead; avoids vague jargon like 'unforeseen circumstances' in favour of plain wording without assigning blame; asks for or marks missing details such as affected stations and alternatives as [X]."}
