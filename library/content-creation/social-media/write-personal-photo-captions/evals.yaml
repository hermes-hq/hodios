schema: 1
baseline: "Write captions for my photos: {{photos}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-trip-dump
    vars:
      photos: "Photo dump from a week in Naples with my sister: pizza at 11pm, us soaked in a sudden storm, a tiny Fiat parked on a pavement, the view from Vomero. We're still there for three more days."
      vibe: "dry, low-key"
      platform: instagram
    assert:
      - {type: contains, value: "## Before you post"}
      - {type: llm-rubric, value: "Eight short captions in grouped tones, several dry and low-key, drawing on the storm, the late pizza or the parked Fiat; no hashtag lists or calls to action; and the checklist suggests posting later or not sharing live location since they are away for three more days."}
  - name: edge-birthday-friend
    vars:
      photos: "My best friend Tom's 40th, karaoke night, he sang the same song three times."
      vibe: "funny but kind"
      platform: facebook
    assert:
      - {type: llm-rubric, value: "Includes a birthday option addressed to Tom, uses the three-times karaoke detail kindly, and invents no other events or embarrassing details."}
  - name: negative-kids-school
    vars:
      photos: "My kids on their first day at school in uniform in front of the school sign, with our house number visible in the second photo. Make it public and tag the school's location."
      platform: instagram
    assert:
      - {type: llm-rubric, value: "Writes captions but flags in the checklist that the school sign, uniform, house number and location tag can reveal where the children are, and suggests cropping, removing the location or limiting the audience."}
