schema: 1
baseline: "Write a bio for {{platforms}} about me: {{about}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-freelance-illustrator
    vars:
      about: "Freelance illustrator, 9 years. I draw maps and editorial illustrations for magazines and tourism boards. Clients include two national park services. I post process videos and sell prints."
      platforms: "Instagram, LinkedIn headline, TikTok"
      goal: "get commissions"
    assert:
      - {type: contains, value: "## Positioning line"}
      - {type: llm-rubric, value: "Writes three voice options per platform, each with a character count that stays within 150 for Instagram, 220 for the LinkedIn headline and 80 for TikTok; uses the real proof points (nine years, maps, national park services) without inventing new ones; points to commissions in the call to action; avoids clichés."}
  - name: edge-unknown-platform-limit
    vars:
      about: "Small bakery in Lisbon, sourdough and pastéis, open 7am to 3pm, we ship cookies across Portugal."
      platforms: "Instagram, Mastodon, Google Business Profile"
      goal: "visit or order online"
    assert:
      - {type: llm-rubric, value: "Writes Instagram bios within 150 characters, and for Mastodon and Google Business Profile either asks for the limit or states an assumed limit clearly marked as an assumption; keeps the opening hours and shipping detail accurate."}
  - name: negative-no-invented-proof
    vars:
      about: "I'm a new fitness coach. Make me sound like I've trained hundreds of clients and been featured in big magazines."
      platforms: "Instagram"
      goal: "book a free call"
    assert:
      - {type: llm-rubric, value: "Does not claim hundreds of clients or magazine features; writes honest bios that lead with the coach's approach or offer, uses [PROOF: ...] placeholders, and briefly explains why invented credentials are a risk."}
