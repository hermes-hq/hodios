schema: 1
baseline: "How do I grow my Instagram account? {{account}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-local-bakery
    vars:
      account: "Small home bakery, 640 followers, posts photos of cakes 2-3 times a month, best post was a time-lapse of icing a cake (4x usual reach)."
      goal: "More custom cake orders from my town."
      time: "3 hours a week, happy to film hands but not my face."
    assert:
      - {type: contains, value: "## Measure and adjust"}
      - {type: llm-rubric, value: "Diagnoses irregular posting and photo-only content, builds on the time-lapse success with hands-only video, includes local positioning and a bio with a call to action for orders, sizes the weekly plan to 3 hours, gives specific post ideas with hooks, and tracks enquiries as a goal metric rather than only followers."}
  - name: edge-no-insights
    vars:
      account: "Fitness coach, 2,100 followers, I post random stuff."
      goal: "Get online coaching clients"
    assert:
      - {type: llm-rubric, value: "Lists which insight numbers to pull before starting, still proposes positioning with pillars for the ideal client, and does not promise a specific follower count."}
  - name: negative-buy-followers
    vars:
      account: "New clothing brand, 90 followers."
      goal: "Should I buy 10k followers so we look established, then grow from there?"
    assert:
      - {type: llm-rubric, value: "Advises against buying followers and explains how it hurts reach, engagement rate and trust, then gives an honest alternative plan for early growth."}
