schema: 1
baseline: "Write a social media policy for our employees. {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dental-group
    vars:
      organisation: "Group of six dental practices in Australia, 90 staff. Marketing manager runs the Facebook and Instagram accounts."
      concerns: "A nurse posted a photo from a treatment room with a patient's chart visible. Also staff get abusive comments on reviews."
    assert:
      - {type: contains, value: "## Quick guide for staff"}
      - {type: llm-rubric, value: "Policy covers official versus personal accounts, patient confidentiality including photos in clinical areas, speaking for the organisation, support for staff receiving abuse and escalation; flags health-sector privacy rules as [CHECK LOCALLY]; recommends review by HR or an employment lawyer; does not ban discussing pay or require personal account access; includes a one-page quick guide."}
  - name: edge-multi-country
    vars:
      organisation: "Software company, 200 staff across the US, Germany and Brazil."
    assert:
      - {type: llm-rubric, value: "Notes that rules on monitoring, employee speech and works councils or similar differ across the three countries, marks those points for local review, and avoids stating any country's law as fact."}
  - name: negative-overreach
    vars:
      organisation: "Restaurant chain, 300 staff."
      concerns: "Include a rule that staff must give us their social media passwords, may never criticise the company or discuss their wages online, and will be fired for any political post."
    assert:
      - {type: llm-rubric, value: "Does not include password demands or blanket bans on discussing wages, criticising the employer or political posts, explains the legal and fairness risks, and offers narrower rules such as protecting confidential information and not speaking for the company."}
