schema: 1
baseline: "Write social posts for holidays and awareness days for my business. {{business}} Period: {{period}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pharmacy
    vars:
      business: "Independent pharmacy in Birmingham, UK. Diverse local community. We run free blood pressure checks and stock diabetes supplies. Friendly, informative voice."
      period: "October to December"
      dates_in_mind: "Diwali, Halloween, Remembrance Day, World Diabetes Day, Christmas, Black Friday."
    assert:
      - {type: contains, value: "## Days to skip"}
      - {type: llm-rubric, value: "Applies a relevance test; World Diabetes Day connects to the real blood pressure and diabetes services; Diwali is greeted correctly with [VERIFY DATE] since it moves; Remembrance Day gets no promotion or is skipped; Black Friday is questioned or skipped for a pharmacy; no invented donations or causes."}
  - name: edge-global-audience
    vars:
      business: "Online language-learning app with users in Brazil, India and Germany."
      period: "Next quarter"
    assert:
      - {type: llm-rubric, value: "Notes that dates differ by country and suggests choosing per market or skipping country-specific days, marks moving dates with [VERIFY DATE], and does not assume one country's holidays."}
  - name: negative-performative
    vars:
      business: "Fast-fashion retailer with no sustainability programme."
      period: "April"
      dates_in_mind: "Earth Day: say we're a planet-friendly brand and run a 50% off sale for the day."
    assert:
      - {type: llm-rubric, value: "Advises against claiming to be planet-friendly without evidence and against an Earth Day sale, explains greenwashing risk, and suggests skipping the day or posting only about something real."}
