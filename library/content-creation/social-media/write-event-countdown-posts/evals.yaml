schema: 1
baseline: "Write a series of social media posts to promote this event in the next {{weeks_until}} weeks: {{event_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-street-food-festival
    vars:
      event_details: "Harbourside Street Food Day, Saturday 14 June, 11am-7pm, Harbour Car Park. Free entry. 22 food stalls, live music from 3 local bands (The Tidelines, Rosa Moon, Northbound Brass), kids' area. Step-free site, accessible toilets, dogs on leads welcome. No booking needed. We have photos from last year."
      weeks_until: 6
      platforms: "Instagram, Facebook"
    assert:
      - {type: contains, value: "## Schedule"}
      - {type: llm-rubric, value: "Schedules roughly weekly posts early and three or more in the final week, gives each band its own highlight beat or similar, includes a practical post with step-free access, toilets, dogs and free entry, plans on-the-day updates and a thank-you post, gives each post a share reason, and invents no stall names or prices."}
  - name: edge-one-week-left
    vars:
      event_details: "Community choir concert, St Mark's Hall, Friday evening. Tickets 8 on the door. Raising money for the hall roof."
      weeks_until: 1
      platforms: ""
    assert:
      - {type: llm-rubric, value: "Compresses the plan into the last week, merging save-the-date and what-to-expect and saying so; marks the missing date and start time as [X] in Gaps to fill; does not invent the programme or claim tickets are selling out."}
  - name: negative-no-event
    vars:
      event_details: "Something fun in the summer, details TBC"
      weeks_until: 8
      platforms: "Instagram"
    assert:
      - {type: llm-rubric, value: "Asks for what the event is, the date and the place before writing posts, and does not invent an event."}
