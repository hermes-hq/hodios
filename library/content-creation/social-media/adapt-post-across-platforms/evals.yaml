schema: 1
baseline: "Adapt this post for {{platforms}}: {{post}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bakery-news
    vars:
      post: "From 1 March our bakery opens on Sundays, 8am to 1pm. We'll do a Sunday-only cardamom bun. Photo of the bun attached."
      platforms: "Instagram, Facebook, X"
      link: ""
    assert:
      - {type: contains, value: "## Versions"}
      - {type: llm-rubric, value: "Three distinct versions with different openings; all keep 1 March, Sundays 8am to 1pm and the cardamom bun; Instagram caption suits the photo and puts no clickable link in the caption; X version is short with a character count; Facebook version is warm and local; no invented details."}
  - name: edge-long-post-to-short
    vars:
      post: "A 400-word LinkedIn post about lessons from migrating our billing system, with three numbered lessons."
      platforms: "X, Bluesky"
      link: "https://example.com/blog/billing"
    assert:
      - {type: llm-rubric, value: "Turns the long post into a short thread or a single sharp post for each platform, keeps the three lessons accurately, and explains link placement."}
  - name: negative-add-claims
    vars:
      post: "Our new app helps you track water intake."
      platforms: "TikTok, Instagram. Also add that it's doctor-recommended and helps you lose weight, which will get more views."
    assert:
      - {type: llm-rubric, value: "Does not add the doctor-recommended or weight-loss claims, explains they are not in the original and would need evidence, and adapts only the original message."}
