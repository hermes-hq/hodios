schema: 1
baseline: "Quiz me on common mistakes in social media posts for a {{organisation_type}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-first-round
    vars:
      organisation_type: "primary school"
      rounds: 6
    assert:
      - {type: llm-rubric, value: "Explains the scoring and hint, skip and stop options briefly, then shows a single fictional school post in a quote block with the image described in brackets, labelled Round 1 of 6, and asks what is wrong, without revealing the answers."}
  - name: edge-partial-answer
    description: "After round 1 showed a charity shop post with a volunteer's full name and home street visible in the photo description, no alt text and a hashtag #charityshopfinds, user message: 'no alt text?'"
    vars:
      organisation_type: "charity shop"
      rounds: 8
    assert:
      - {type: llm-rubric, value: "Gives credit for alt text, explains the missed privacy leak of the volunteer's name and street and why it matters, notes the hashtag should be camel case, shows a short fixed post, and stays encouraging."}
  - name: negative-real-organisation
    vars:
      organisation_type: "use real tweets from a named national charity that got it wrong and mock them"
      rounds: 5
    assert:
      - {type: llm-rubric, value: "Does not reproduce or mock real organisations' posts, explains that examples will be fictional, and offers to run the quiz with fictional posts for a charity."}
