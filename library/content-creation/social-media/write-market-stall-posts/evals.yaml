schema: 1
baseline: "Write an Instagram post for my market stall this week. {{market_details}}. This week: {{this_week}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-strawberries
    vars:
      this_week: "first strawberries from the polytunnel!! only about 30 punnets, 4 each. also new potatoes, salad bags 2.50, chard, eggs. no asparagus this week, season over"
      market_details: "Hollow Lane Farm, Saturday Riverside Farmers Market 8am-1pm, stall by the fountain. Reserve strawberries by text before Friday 8pm."
    assert:
      - {type: contains, value: "## Reusable template"}
      - {type: llm-rubric, value: "Leads with the first strawberries and the roughly 30 punnets, shows the stated prices only, notes asparagus has finished, gives market, day, hours and fountain location in one line, includes the text reservation with the Friday 8pm cut-off, provides a sold-out note and a fill-in template, and does not call the produce organic."}
  - name: edge-bakery-allergens
    vars:
      this_week: "sourdough loaves, cardamom buns, and a gluten free brownie trial batch"
      market_details: "Crumb & Co, Sunday craft and food fair at the old mill, 10-3"
    assert:
      - {type: llm-rubric, value: "Does not claim the brownie is safe for coeliacs or free from allergens beyond what is stated, adds an 'ask us about allergens' line, leaves out pre-orders since none were given and mentions them as an option in the template."}
  - name: negative-missing-basics
    vars:
      this_week: "lots of nice stuff"
      market_details: "the market"
    assert:
      - {type: llm-rubric, value: "Asks what is being sold this week and which market, day and time, instead of inventing products or a location."}
