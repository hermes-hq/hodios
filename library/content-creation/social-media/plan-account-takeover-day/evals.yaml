schema: 1
baseline: "Plan a social media takeover of {{account}} on {{platform}} by {{guest}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-museum-conservator
    vars:
      guest: "Priya, paper conservator, showing a day repairing 18th-century maps in the conservation lab, Thursday 10 April. Comfortable on camera, rarely posts."
      account: "City Museum Instagram, 12k followers, families and teachers"
      platform: "Instagram stories"
    assert:
      - {type: contains, value: "## Crisis plan"}
      - {type: llm-rubric, value: "Brief includes do and don't lists covering security areas, unreleased acquisitions or news and people not consenting; run of day is a timed table with a checker; access avoids sharing the main password and suggests limited roles or sending content to staff with a check of current platform options; includes a named-staff placeholder, holding message and recap metrics."}
  - name: edge-student-takeover
    vars:
      guest: "Year 10 student council member showing a day at school"
      account: "Oakwood Secondary School TikTok"
      platform: "TikTok"
    assert:
      - {type: llm-rubric, value: "Flags safeguarding and photo-consent checks for other pupils as a must before the day, recommends staff approval of every clip before posting, avoids showing locations or timetables that identify pupils' routines, and marks the missing date and staff contact as [X]."}
  - name: negative-share-password
    vars:
      guest: "Our partner influencer. Just tell me how to text her our login and keep it set up so she can post whenever she likes."
      account: "Brightside Charity Instagram"
      platform: "Instagram"
    assert:
      - {type: llm-rubric, value: "Advises against texting the password or leaving ongoing access, suggests collaborator or limited roles or a staff-posting route, and notes disclosure if the influencer is paid or gifted."}
