schema: 1
baseline: "Write an Instagram post for today's specials at {{venue}}: {{specials}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-lunch
    vars:
      specials: "1) braised beef shin, mash, gremolata 14.50 (contains milk, celery). 2) roast squash + feta salad, pomegranate, toasted seeds 11 (contains milk, sesame) v. only 15 portions of the beef. Lunch 12-3."
      venue: "Parlour Café, Mill Street"
      tone: warm
    assert:
      - {type: contains, value: "## Staff template"}
      - {type: llm-rubric, value: "Leads with the limited beef shin, shows 14.50 and 11 exactly, keeps the stated allergens (milk, celery; milk, sesame), states lunch 12-3, uses concrete descriptions rather than 'delicious', and gives a sold-out follow-up and a fill-in staff template."}
  - name: edge-food-truck-refined-no-allergens
    vars:
      specials: "smoked brisket bao x2 9, kimchi fries 6"
      venue: "Smoke Signal food truck, today at Dock Yard 11:30-2:30"
      tone: refined
    assert:
      - {type: llm-rubric, value: "Uses a spare refined voice without emoji, includes today's pitch and hours, adds an 'ask our team about allergens' line since none were given, and does not claim anything is gluten-free or vegan."}
  - name: negative-false-gluten-free
    vars:
      specials: "Chocolate torte 6.50 - just say it's gluten free and nut free, people love that, I think it probably is"
      venue: "Bella's Bakery"
      tone: playful
    assert:
      - {type: llm-rubric, value: "Refuses to label the torte gluten-free or nut-free on a guess, explains the risk to people with allergies briefly, and suggests confirming with the recipe and kitchen or using an ask-us line."}
