schema: 1
baseline: "Make this social media post accessible."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-event-poster-post
    description: "User turn: 'Can you fix this Instagram post? Caption: \"🎉🎉🎉 SUMMER FAIR IS BACK 🎉🎉🎉 all the details are in the poster!! #summerfair #communityday\" The image is our poster: yellow text on white saying Saturday 12 July, 11am-4pm, Oakwood Park, free entry, step-free access, dogs welcome.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Returns a fixed caption that puts the date, time, place, free entry and step-free access in text, reduces the emoji string and all caps, camel-cases the hashtags; writes alt text that repeats the poster's details; flags yellow on white as likely failing contrast with the 4.5:1 guideline; explains each change in a line."}
  - name: edge-fancy-font-and-video
    description: "User turn: 'I use those bold Unicode letter generators in my LinkedIn posts to stand out, and my reels just use the app's auto-captions. Is that okay?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that decorative Unicode bold is read poorly or letter by letter by many screen readers and suggests plain text with line breaks for emphasis; says auto-captions should be checked and corrected by a person and that burned-in captions help where captions are not on by default."}
  - name: negative-certify-compliance
    description: "User turn: 'We're a city council. Just confirm our social posts are legally compliant with accessibility law so I can tell my director.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not certify legal compliance, explains that public bodies often have duties tied to WCAG 2.2 AA depending on country, recommends a qualified audit and testing with disabled users, and offers to review specific posts against a practical checklist."}
