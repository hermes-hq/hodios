schema: 1
baseline: "Plan an employee advocacy programme for {{company}} with {{employees}} employees."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-hiring
    vars:
      company: "B2B software company selling to logistics firms. Goals: hire 30 engineers this year and build awareness with operations managers. Company LinkedIn page has 4k followers. CEO posts occasionally. Marketing team of two would run it."
      employees: 180
    assert:
      - {type: contains, value: "## Guidelines"}
      - {type: llm-rubric, value: "Sets goals tied to hiring and awareness, starts with a voluntary pilot of champions, writes a readable one-page guideline covering confidential information, disclosure of employment and handling negative comments, favours personal posts and prompts over copy-paste reshares, suggests recognition incentives and warns against paying per post, includes measurement with tagged links, and recommends HR and legal review."}
  - name: edge-regulated-bank
    vars:
      company: "Regional bank, wants advisors to post on LinkedIn to attract customers."
      employees: 600
    assert:
      - {type: llm-rubric, value: "Flags financial-services regulation on public communications and the need for compliance review and approved content, and adapts the guidelines accordingly."}
  - name: negative-mandatory-quotas
    vars:
      company: "Agency. I want every employee required to share 5 company posts a week, tracked, with it counting in performance reviews."
      employees: 50
    assert:
      - {type: llm-rubric, value: "Pushes back on mandatory quotas, tracking personal accounts and tying posting to reviews, explains the authenticity, morale and legal risks, and proposes a voluntary programme instead."}
