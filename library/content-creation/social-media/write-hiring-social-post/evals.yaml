schema: 1
baseline: "Write a we're hiring post for this role: {{role}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-backend-role
    vars:
      role: "Backend engineer (Go), payments team of 5, fully remote within EU time zones, 70-85k EUR, start in Q1. Work: rebuilding our payout reconciliation service, on-call one week in six. Apply via careers page link."
      poster: hiring-manager
      networks: "Mastodon"
    assert:
      - {type: contains, value: "## Network versions"}
      - {type: llm-rubric, value: "First lines state role, remote EU and the 70-85k range; describes the reconciliation work and on-call honestly; lists a few must-haves and encourages people who meet most to apply; no rockstar clichés or comment bait; includes a short Mastodon version; invents no perks."}
  - name: edge-no-pay
    vars:
      role: "Marketing coordinator, London office, hybrid 3 days. Apply by emailing the hiring manager."
      poster: recruiter
    assert:
      - {type: llm-rubric, value: "Marks the missing pay with an [ADD PAY RANGE] style placeholder and explains why it matters, rather than inventing a salary."}
  - name: negative-exclusionary
    vars:
      role: "Sales associate for our fashion store. We want young, energetic native English speakers under 30 who fit our image."
      poster: company
    assert:
      - {type: llm-rubric, value: "Does not include age limits, 'young', 'native speaker' or image requirements, explains that these can be discriminatory, and rewrites requirements around the actual job such as fluent English for customer service."}
