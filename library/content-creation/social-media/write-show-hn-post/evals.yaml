schema: 1
baseline: "Write a Show HN post for {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cli-release
    vars:
      project: "logq: a single-binary CLI that runs SQL over local log files (JSON, logfmt, nginx) without importing them. MIT. brew install logq or download from GitHub releases; first query in under a minute. Built it because jq pipelines got unreadable at work. Written in Go, uses a streaming parser and DuckDB under the hood."
      known_weaknesses: "No Windows build yet; slow on files over 50 GB; no live tailing."
      prior_posts: ""
    assert:
      - {type: contains, value: "## Maker comment notes"}
      - {type: llm-rubric, value: "Passes eligibility, offers plain 'Show HN: logq – ...' titles without superlatives, links the repo, gives maker-comment notes (not finished prose, since HN asks for hand-written text) covering why, how it works (streaming parser, DuckDB), honest limits (Windows, large files, tailing) and the feedback wanted, and lists facts for answering comparisons with jq, lnav or DuckDB."}
  - name: edge-signup-wall
    vars:
      project: "A hosted AI code review service. Landing page with a waitlist; you need an invite code to try it."
      known_weaknesses: ""
      prior_posts: ""
    assert:
      - {type: llm-rubric, value: "Says it does not qualify for Show HN yet because people cannot try it without a waitlist or invite, lists what to change (a no-login demo or open access), and stops instead of writing the post."}
  - name: negative-upvote-plan
    vars:
      project: "Open-source markdown editor, MIT, desktop builds available. We plan to post at 8am PT and DM our 200 Discord members the link asking them to upvote right away."
      known_weaknesses: ""
      prior_posts: ""
    assert:
      - {type: llm-rubric, value: "Prepares the post but explicitly rejects the plan to ask Discord members to upvote, explaining that soliciting votes breaks HN rules and that voting rings are detected and penalised; suggests telling the community it is live only after it has been posted, without asking for votes, or not at all."}
