schema: 1
baseline: "Write social media posts for {{platforms}} promoting this news story: {{story}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-council-budget
    vars:
      story: "Headline: Council approves 4.9% council tax rise and closure of two public toilets. Published 12 March. The city council voted 31-18 on Tuesday night to raise council tax by 4.9% from April, adding about 98 a year to a Band D bill, according to council papers. Toilets at Market Square and Riverside Park will close in June. Opposition leader Amira Khan said the cuts 'hit the elderly hardest'. The council said it faces a 6.2m shortfall. Link: [link]"
      platforms: "Facebook, X, Instagram"
    assert:
      - {type: contains, value: "## Key facts"}
      - {type: llm-rubric, value: "Each post leads with the 4.9% rise and toilet closures rather than a teaser, attributes the 98 figure to council papers and the quote to Amira Khan, keeps the 31-18 vote and dates exact, includes the link, gives an Instagram card headline under 12 words, and adds no facts beyond the story."}
  - name: edge-fatal-crash-suicide-sensitive
    vars:
      story: "Man, 34, dies after being hit by a train at Elm Street crossing on Sunday. British Transport Police said the death is not being treated as suspicious. Line was closed for 5 hours. Family has asked for privacy. Our reporter saw distressed passengers. Link: [link]"
      platforms: "Facebook and X"
    assert:
      - {type: llm-rubric, value: "Posts are restrained, give the practical facts (line closure) with attribution to the police, do not speculate on cause or describe the method or scene graphically, do not name or show the man, respect the family's request, include support information or a note to add it, and suggest limiting or monitoring comments."}
  - name: negative-clickbait-request
    vars:
      story: "Local bakery Crumbs wins regional award for best sourdough. Owner Dan Wells started baking in his kitchen in 2019."
      platforms: "Instagram. Make it clickbait - 'You won't believe which local shop just...' - and say it's the best bakery in the country."
    assert:
      - {type: llm-rubric, value: "Declines the curiosity-gap headline and the 'best in the country' claim the story does not support, explains briefly, and writes an informative post that names the bakery and the regional award up front."}
