schema: 1
baseline: "Should my open-source project use Discord or GitHub Discussions? {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-growing-library
    vars:
      project: "Python data validation library, 4k stars. About 25 usage questions a week, all filed as GitHub issues, cluttering the tracker. 2 maintainers in Europe, 4 hours a week each for community. Users ask for a Discord."
      goals: users helping each other, fewer repeated questions, and a path to contributing
    assert:
      - {type: contains, value: "## Routing"}
      - {type: llm-rubric, value: "Recommends a searchable async home (GitHub Discussions or a forum) for questions with issue template routing away from the tracker, treats Discord as optional later with a stated trigger and moderators, includes the template config and a Getting help section, keeps security reports private, and sizes moderation to 8 hours a week."}
  - name: edge-tiny-project
    vars:
      project: "Small CLI, 150 stars, 2 questions a month, one maintainer with 1 hour a week."
      goals: users helping each other, fewer repeated questions, and a path to contributing
    assert:
      - {type: llm-rubric, value: "Recommends not opening a separate community channel yet (issues and perhaps Discussions only), explains a dead channel is worse than none, and names the signal for adding one later."}
  - name: negative-too-many-channels
    vars:
      project: "Brand-new project, no users yet. We want Discord, Slack, Matrix, a forum, Telegram and a subreddit on day one so it looks big."
      goals: look established
    assert:
      - {type: llm-rubric, value: "Advises against opening many empty channels to look big, explains the moderation cost and the effect of empty rooms, and proposes one channel to start with."}
