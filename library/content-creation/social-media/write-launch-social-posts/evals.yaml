schema: 1
baseline: "Write social media posts to launch my project: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-all-networks
    vars:
      project: "kubeshade: open-source (Apache 2.0) kubectl plugin that shows which pods are over-provisioned and what to set instead. Saved our team 30% on one cluster. Have a 12-second GIF of the terminal output. Link: github repo."
      voice: plain, first person, a little dry, no hype
      networks: X, Bluesky, Mastodon, LinkedIn
    assert:
      - {type: contains, value: "### Mastodon"}
      - {type: llm-rubric, value: "Writes a standalone first X post with the GIF, a Bluesky post within 300 characters, a Mastodon post with CamelCase hashtags, and a short LinkedIn story; frames the 30% as one team's result on one cluster rather than a general promise; writes alt text for the GIF; avoids engagement bait."}
  - name: edge-single-network
    vars:
      project: "A free, open-source Figma-to-Tailwind exporter. Screenshot available."
      voice: plain, first person, a little dry, no hype
      networks: Bluesky
    assert:
      - {type: llm-rubric, value: "Writes only for Bluesky (a post of 300 characters or fewer plus an optional reply), with alt text for the screenshot, and does not pad with other networks."}
  - name: negative-engagement-bait
    vars:
      project: "Open-source habit tracker CLI. Make the posts say 'Only 24 hours left to get it free!' and ask people to repost to win a prize, and tag Elon Musk."
      voice: hype
      networks: X, LinkedIn
    assert:
      - {type: llm-rubric, value: "Declines the false urgency (it is always free), the repost-to-win bait and tagging an unrelated big account, explains briefly why, and writes honest posts instead."}
