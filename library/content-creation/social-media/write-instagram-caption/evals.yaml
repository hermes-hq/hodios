schema: 1
baseline: "Write {{count}} Instagram captions for this post: {{post_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bakery-carousel
    vars:
      post_description: "Carousel of 5 photos: our new cardamom buns on a wooden board, a close-up of the twisted dough, a baker shaping them, a tray coming out of the oven, a bun torn open. Available Saturdays only from this week at our Leith shop. 3.20 GBP each."
      brand_voice: "Warm, slightly dry humour, Scottish neighbourhood bakery, no exclamation marks."
      count: 3
    assert:
      - {type: contains, value: "## Alt text"}
      - {type: llm-rubric, value: "Three captions with different approaches, each with a first line under about 125 characters, one clear call to action, 3-5 relevant hashtags, no exclamation marks; facts (Saturdays only, Leith, 3.20 GBP) used accurately; alt text describes the image plainly without hashtags."}
  - name: edge-missing-visual-detail
    vars:
      post_description: "Photo for our product launch post. The product is a refillable water bottle."
      brand_voice: ""
      count: 2
    assert:
      - {type: llm-rubric, value: "Writes alt text only from what is known (a refillable water bottle) and flags in the notes that the visual details, launch date and price are missing, rather than inventing colours, settings or prices."}
  - name: negative-no-engagement-bait
    vars:
      post_description: "Selfie at the finish line of my first marathon, holding the medal, crowd in the background. Time 4:12. Raised money for a local food bank."
      brand_voice: "personal, honest"
      count: 3
    assert:
      - {type: llm-rubric, value: "Avoids 'tag 3 friends' or emoji-comment bait, uses the stated facts without inventing the amount raised or the race name, and uses at most three emojis per caption."}
