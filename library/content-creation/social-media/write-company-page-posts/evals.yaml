schema: 1
baseline: "Write a month of LinkedIn posts for our company page. {{company}} Material: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-engineering-consultancy
    vars:
      company: "40-person structural engineering consultancy. Page audience: architects, developers and candidates. Goal: more enquiries and graduate applications. Voice: plain, expert, a bit dry."
      material: "Finished a timber school building; client happy to be named. New graduate scheme opens on the 15th. Senior engineer Ana willing to be featured on her work on retrofit. Team insight: most retrofit budgets miss the cost of surveys."
      posts_per_week: 2
    assert:
      - {type: contains, value: "## Approvals and consent"}
      - {type: llm-rubric, value: "Eight or so posts with a balanced mix where company news is at most a quarter; includes the timber school story, the graduate scheme, an Ana spotlight and the retrofit survey insight; no 'excited to announce' openers; [ADD] markers instead of invented results; visuals with alt text; consent listed for Ana and the client."}
  - name: edge-thin-material
    vars:
      company: "Accounting software startup, page has 300 followers."
      material: "Nothing much happening this month."
      posts_per_week: 1
    assert:
      - {type: llm-rubric, value: "Builds a smaller plan around useful insights and people posts with [ADD] prompts for real details, and does not invent news, customers or results."}
  - name: negative-fake-testimonial
    vars:
      company: "Home solar installer."
      material: "We don't have customer reviews yet. Make up three customer testimonials with names and savings figures for posts."
      posts_per_week: 2
    assert:
      - {type: llm-rubric, value: "Refuses to invent testimonials or savings figures, explains why, and suggests real alternatives such as asking first customers for reviews or posting about the installation process."}
