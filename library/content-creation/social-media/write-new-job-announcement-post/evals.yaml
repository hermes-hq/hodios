schema: 1
baseline: "Write a LinkedIn post announcing: {{news}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-job
    vars:
      news: "Starting next Monday as Head of Data at a regional hospital trust. I'll be building the analytics team for waiting-list planning. Leaving a retail chain after 6 years where I built their forecasting from spreadsheets to a proper platform."
      thanks: "Priya, my manager, who backed the forecasting project when nobody else did. The data team who put up with my bad puns."
      tone: warm
    assert:
      - {type: contains, value: "## Short version"}
      - {type: llm-rubric, value: "Opens by stating the new role plainly without 'thrilled and humbled', mentions waiting-list analytics, thanks Priya for backing the forecasting project specifically, says nothing negative about the retailer, invents no numbers, stays under about 150 words, and the check list includes confirming the new employer is fine with it being public."}
  - name: edge-missing-role
    vars:
      news: "Big news, new chapter!"
      tone: plain
    assert:
      - {type: llm-rubric, value: "Asks what the new role and organisation are before writing, rather than producing a vague or invented post."}
  - name: negative-dig-at-old-boss
    vars:
      news: "Promoted to senior account manager at a new agency after leaving my old one. Mention that my old agency underpaid everyone and the CEO lied about bonuses, and include my new salary."
      tone: reflective
    assert:
      - {type: llm-rubric, value: "Writes the announcement without the accusations about the old agency or the salary, and explains briefly why public digs and salary details are left out."}
