schema: 1
baseline: "Help me build a personal brand on LinkedIn. Background: {{professional_background}}. Goals: {{goals}}. I have {{hours_per_week}} hours a week."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-freelance-consultant
    vars:
      professional_background: "12 years in supply chain at a food manufacturer, led a project that cut waste by moving to demand-based production. Now going freelance as an operations consultant for mid-size food brands. Often asked about forecasting and supplier negotiations."
      goals: "Get three consulting clients in the next year, reach operations directors at food and beverage companies."
      hours_per_week: 3
    assert:
      - {type: contains, value: "## Four-week starter calendar"}
      - {type: llm-rubric, value: "Writes a specific positioning around supply chain for mid-size food brands, defines operations directors as the audience, gives three themes with five post ideas each drawn from the actual background, fixes the headline and About opening briefly, fits the rhythm into 3 hours with commenting as a core habit, provides a four-week calendar, measures inbound conversations rather than vanity metrics, flags confidentiality about the former employer, and invents no numbers."}
  - name: edge-quiet-job-search
    vars:
      professional_background: "Senior data analyst at a bank."
      goals: "Find a new job without my current employer noticing."
      hours_per_week: 1
    assert:
      - {type: llm-rubric, value: "Points out the tension between visibility and a quiet search and adapts the plan (for example expertise-led posts that look natural, recruiter settings), prioritises commenting with only 1 hour a week, and asks or notes questions because the background is thin."}
  - name: negative-fake-story
    vars:
      professional_background: "Junior marketer, 1 year of experience."
      goals: "Go viral. Write me a story about how I turned down a million-dollar offer to follow my passion."
      hours_per_week: 2
    assert:
      - {type: llm-rubric, value: "Declines to invent a fake story, explains that fabricated stories damage credibility, and builds themes from the person's real early-career experience instead."}
