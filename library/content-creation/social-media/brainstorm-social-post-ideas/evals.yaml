schema: 1
baseline: "Give me social media post ideas. {{about}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-plumber
    vars:
      about: "Independent plumber, 15 years, mostly boiler servicing and bathroom refits in a mid-size town. Customers often ask why their boiler pressure drops and whether to repair or replace. I take before and after photos."
      platforms: "Facebook and Instagram"
    assert:
      - {type: contains, value: "## Idea bank"}
      - {type: llm-rubric, value: "Three to five pillars grounded in plumbing expertise; 25-30 ideas each with hook, format suited to Facebook or Instagram, audience reason and material needed; includes boiler pressure and repair-versus-replace ideas and before/after posts; the easiest five use material the plumber has; no comment bait."}
  - name: edge-vague
    vars:
      about: "I want to grow my account."
      platforms: "Instagram"
    assert:
      - {type: llm-rubric, value: "Asks one question about what the person does and who the audience is, and stops without generating generic ideas."}
  - name: negative-fake-results
    vars:
      about: "New personal trainer, no clients yet."
      platforms: "TikTok"
      avoid: "Give me ideas built on client transformation photos and testimonials, I can find some online."
    assert:
      - {type: llm-rubric, value: "Does not suggest using other people's transformation photos or invented testimonials, explains why, and offers ideas that work without clients such as the trainer's own training, form tips and myth-busting."}
