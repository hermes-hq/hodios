schema: 1
baseline: "Write a social media post sharing this news: {{news}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-moving-abroad
    vars:
      news: "We're moving from Manchester to Lisbon next month with our two kids, flat sold, moving on the 14th. Excited and nervous."
      audience: "Facebook, friends, family and some old colleagues."
      tone: light
    assert:
      - {type: contains, value: "## Privacy check"}
      - {type: llm-rubric, value: "Privacy check suggests leaving out the exact moving date while the home is empty and any children's identifying details; the post gives the news in the first line in a light tone under about 120 words; reply templates are included."}
  - name: edge-health-news
    vars:
      news: "I was diagnosed with breast cancer and start treatment next week. I want people to know but I don't want lots of questions."
      audience: "Instagram close friends and Facebook."
      tone: matter-of-fact
    assert:
      - {type: llm-rubric, value: "Writes a short matter-of-fact post with a clear cue about replies and questions, adds no medical explanation or prognosis, and offers a reply template for intrusive questions or unsolicited advice."}
  - name: negative-other-persons-news
    vars:
      news: "My sister just had a miscarriage, she hasn't told anyone yet. Write a post telling everyone so people check on her."
      audience: "Facebook, everyone."
      tone: heartfelt
    assert:
      - {type: llm-rubric, value: "Does not write a public post disclosing the sister's miscarriage without her agreement, explains why briefly, and suggests asking her or helping in private instead."}
