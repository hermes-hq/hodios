schema: 1
baseline: "Write a LinkedIn post about: {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-insight-with-detail
    vars:
      idea: "We stopped doing daily standups on my 6-person team for a quarter and switched to a written async update in Slack. Cycle time dropped from 6.5 to 4.8 days, but two juniors said they felt more isolated, so we kept one live call on Mondays."
      voice_sample: ""
      goal: insight
    assert:
      - {type: llm-rubric, value: "Opening lines lead with the specific result or tension; body uses the real numbers (6.5 to 4.8 days) and the junior isolation trade-off without inventing dialogue or extra numbers; 120-250 words; no 'Agree?' or comment bait; no wall of one-line paragraphs; at most three hashtags."}
  - name: edge-no-concrete-detail
    vars:
      idea: "Leadership is about serving your team."
      voice_sample: ""
      goal: insight
    assert:
      - {type: llm-rubric, value: "Asks for a specific detail (a situation, decision or result) before writing, or clearly marks [ADD] placeholders instead of inventing an anecdote."}
  - name: negative-hiring-no-bait
    vars:
      idea: "We're hiring a senior data engineer in Berlin, hybrid, to own our event pipeline (Kafka, dbt). Small team of four. Salary band 85-100k EUR."
      voice_sample: "We build boring, reliable software. No rockstars, no ninjas. If that sounds dull, we're not for you, and that's fine."
      goal: hiring
    assert:
      - {type: llm-rubric, value: "Describes the role, team and work concretely including the stated salary band, matches the dry, plain voice of the sample, says who would not thrive, and avoids 'comment interested' or tag-a-friend bait."}
