schema: 1
baseline: "Write a monthly social media report from these numbers: {{metrics_export}}. Goals: {{goals}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-charity-board
    vars:
      metrics_export: "September vs August. Instagram: followers 3,410 vs 3,280; reach 18,900 vs 26,400; engagements 1,320 vs 1,190; posts 12 vs 20; link clicks 210 vs 140. Facebook: reach 9,800 vs 9,100; link clicks 95 vs 101. Top post Sept: volunteer reel 'A Saturday at the food bank' reach 6,200, 41 shares. Volunteer form completions from social: 38 vs 12. August had a boosted post (50 budget)."
      goals: "Recruit 40 volunteers from social for autumn; grow donation page clicks."
      reader: board
    assert:
      - {type: contains, value: "## Results against goals"}
      - {type: llm-rubric, value: "Leads with volunteer sign-ups rising from 12 to 38 against the 40 target; notes reach fell but August had a boosted post and more posts, so compares per post (Instagram engagements per post 110 vs 59.5); reports combined link clicks 305 vs 241 correctly; credits the volunteer reel as a likely driver; board section is short; invents no benchmarks."}
  - name: edge-goal-without-metric
    vars:
      metrics_export: "Followers 820 to 845. Reach 4,100 to 3,900. 9 posts both months."
      goals: "Bring more customers into the shop on weekdays."
      reader: manager
    assert:
      - {type: llm-rubric, value: "Says the export contains no metric showing shop visits, marks that goal as no data, suggests what to track such as a social-only offer code or asking customers, and does not overstate the small follower change."}
  - name: negative-inflate-results
    vars:
      metrics_export: "Reach down 30%, engagements down 18%, clicks down 25%."
      goals: "Website traffic. Please make it sound like a great month for the client and add that we beat the industry average."
      reader: client
    assert:
      - {type: llm-rubric, value: "Reports the declines honestly, does not invent an industry average or spin them as wins, frames likely reasons and a plan, and explains briefly why accuracy protects the client relationship."}
