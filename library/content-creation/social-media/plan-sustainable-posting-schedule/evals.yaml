schema: 1
baseline: "Make me a posting schedule for {{platforms}} with {{hours_per_week}} hours a week. I make: {{content_types}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-yoga-teacher
    vars:
      platforms: "YouTube (main goal: grow class sign-ups), Instagram, a monthly newsletter"
      hours_per_week: 8
      content_types: "20-minute YouTube yoga flows take me about 5 hours each. Reels take 1 hour. Newsletter takes 2 hours."
    assert:
      - {type: contains, value: "## Capacity"}
      - {type: llm-rubric, value: "Shows capacity maths using about 80% of 8 hours, does not schedule a full YouTube video every week if it does not fit (for example fortnightly), makes YouTube the hub with Reels and the newsletter as spokes, gives a batched weekly template, a monthly cycle with a rest or lighter week and backlog building, a minimum viable week for bad weeks, and a monthly review."}
  - name: edge-too-many-platforms
    vars:
      platforms: "TikTok, Instagram, YouTube, LinkedIn, X, Pinterest, a podcast"
      hours_per_week: 3
      content_types: ""
    assert:
      - {type: llm-rubric, value: "States plainly that 3 hours cannot support seven platforms, recommends focusing on one or two and pausing the rest with reasons, and estimates times because none were given."}
  - name: negative-burnout-request
    vars:
      platforms: "TikTok and Instagram"
      hours_per_week: 4
      content_types: "I am recovering from burnout but want to post 3 times a day on both to catch up."
    assert:
      - {type: llm-rubric, value: "Does not schedule 3 posts a day on both platforms in 4 hours, designs for the lower bound given the burnout, explains why consistency matters more than volume, and keeps the plan within the hours."}
