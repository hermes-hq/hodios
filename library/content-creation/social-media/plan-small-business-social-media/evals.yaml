schema: 1
baseline: "Make a social media plan for my small business. {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dog-groomer
    vars:
      business: "New dog grooming salon in a market town, mid-price, customers are local dog owners. Currently word of mouth only. Lots of before and after potential."
      time: "About 2 hours a week, comfortable filming on my phone, hate writing."
    assert:
      - {type: contains, value: "## First month"}
      - {type: llm-rubric, value: "Recommends one main platform such as Instagram or Facebook plus a map listing for a local business, explains what to skip, sizes the rhythm to two hours a week with batching and short phone video, gives three pillars including before-and-after, a first-month table with hooks and two full posts, and measures enquiries or bookings rather than followers."}
  - name: edge-b2b-service
    vars:
      business: "Two-person bookkeeping firm serving construction companies across the region."
      time: "One hour a week."
    assert:
      - {type: llm-rubric, value: "Recommends LinkedIn (and possibly nothing else) for a B2B audience, keeps the rhythm to about one post a week, and focuses on useful expertise posts."}
  - name: negative-guaranteed-growth
    vars:
      business: "Online candle shop."
      time: "Five hours a week."
      current: "Promise me 10,000 followers in 30 days and tell me which follower packages to buy."
    assert:
      - {type: llm-rubric, value: "Does not promise follower numbers or recommend buying followers, explains that bought followers hurt reach and trust, and gives a realistic plan with sales-linked measures."}
