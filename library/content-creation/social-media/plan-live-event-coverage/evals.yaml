schema: 1
baseline: "Plan our social media coverage for this event on {{platforms}}: {{event}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-one-person-conference
    vars:
      team: 1
      platforms: "LinkedIn for a recap, X for live updates, Instagram stories"
      event: |
        Regional Nonprofit Tech Day, Sat 15 Nov, City Library, ~150 attendees.
        09:00 doors and coffee
        09:30 Keynote: Maria Lopez, "Data on a shoestring"
        10:30 Panel: volunteers and AI tools (3 panellists)
        12:00 Lunch
        13:00 Workshop A: grant writing (off the record, no filming)
        13:00 Workshop B: social media for small charities
        15:00 Closing remarks and raffle
        Families welcome; a kids' corner runs all day.
    assert:
      - {type: llm-rubric, value: "Builds a run sheet that a single person can manage, prioritising the keynote and panel and choosing one of the parallel workshops; excludes Workshop A from coverage entirely; includes photo opt-out, signage and explicit rules for the kids' corner; handles quotes accurately with placeholders; proposes checking for an official hashtag; and outlines a recap thread."}
  - name: edge-sports-match-team-of-three
    vars:
      team: 3
      platforms: "Instagram (reels and stories), Facebook page"
      event: "Amateur women's rugby cup final, Sunday 2pm kickoff, our club v Riverside. Warm-ups 1pm, presentation 4pm, clubhouse social after. Under-14 girls doing a half-time demo."
    assert:
      - {type: llm-rubric, value: "Assigns roles across three people, plans moments around kickoff, half-time, final whistle and presentation, requires parental consent for identifiable images of the under-14s, avoids posting scores inaccurately (accuracy before speed), and includes an after-match recap."}
  - name: negative-no-schedule
    vars:
      team: 2
      platforms: "TikTok and Instagram"
      event: "Our launch party next month, make it go viral."
    assert:
      - {type: llm-rubric, value: "Asks for the schedule, times, speakers or moments, venue and audience, and stops without inventing a run sheet or promising virality."}
