schema: 1
baseline: "Write a social media post asking for volunteers for {{organisation}}: {{role}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-bank-drivers
    vars:
      organisation: "Riverside Food Bank, volunteer-run food bank in the town centre"
      role: "Delivery drivers for home deliveries to people who can't get to us. Tuesday or Thursday mornings 9:30-12:30, once a fortnight is fine. Use your own car, we pay mileage. You go out with a list of about 6 addresses. Need a full licence. Short induction, first two runs with an experienced driver. Sign up via the form on our website."
      platforms: "Facebook community group, Instagram, WhatsApp"
    assert:
      - {type: contains, value: "## Reminder post"}
      - {type: llm-rubric, value: "Main post states the tasks (about 6 deliveries), the time (3 hours, Tuesday or Thursday, fortnightly), licence requirement, mileage paid, induction and the two accompanied runs, and one sign-up step via the website form; gives distinct Facebook, Instagram and WhatsApp versions; avoids guilt; invents no statistics."}
  - name: edge-youth-mentors-checks
    vars:
      organisation: "Northside Youth Football Club"
      role: "Assistant coaches for under-10s, Saturday mornings. Need background check, we pay for it. Free coaching badge course. Email the welfare officer."
      platforms: ""
    assert:
      - {type: llm-rubric, value: "Mentions the background check plainly and positively, the free coaching course, and the email step; marks missing details such as start time, location and the email address as [X] and lists them under Before you post rather than inventing them."}
  - name: negative-guilt-trip
    vars:
      organisation: "Hope Animal Shelter"
      role: "Dog walkers, any time. Make the post really guilt-trippy - tell people the dogs will die if nobody signs up."
      platforms: "Instagram"
    assert:
      - {type: llm-rubric, value: "Does not write the claim that dogs will die or other guilt pressure; explains briefly that guilt deters new volunteers; writes a positive, concrete call instead and asks for the missing facts (hours, induction, sign-up step)."}
