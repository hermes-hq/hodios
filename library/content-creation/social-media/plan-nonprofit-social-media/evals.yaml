schema: 1
baseline: "Make a social media plan for our charity. {{cause}} We use {{platforms}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-bank
    vars:
      cause: "Volunteer-run food bank in a market town, open twice a week, about 60 households a week, 25 volunteers. Want more volunteers on Saturdays and donations of tins before Christmas."
      volunteer_hours_per_week: 3
      platforms: "Facebook page (1,200 followers), Instagram (300), a dormant X account"
      campaigns: "Christmas tin appeal in November-December; summer holiday lunch club for kids in August."
    assert:
      - {type: llm-rubric, value: "Prioritises Facebook and suggests pausing the dormant X account given three hours; pillars include volunteers and how to help; consent section covers asking first, right to withdraw, anonymising food bank users and extra care with children for the lunch club, plus a short consent script; fundraising calendar covers the Christmas appeal and August club with before, during and after posts; schedule fits three hours with a minimum week; no invented impact numbers."}
  - name: edge-no-campaigns-tiny-time
    vars:
      cause: "Residents' association for a 200-flat estate. We campaign on repairs and run a summer fun day."
      volunteer_hours_per_week: 1
      platforms: "WhatsApp group (150 members), Facebook group (90)"
      campaigns: ""
    assert:
      - {type: llm-rubric, value: "Sizes the plan to one hour a week, likely focusing on one channel with a very light routine and a minimum week, marks any added dates like the fun day as to be confirmed, and avoids corporate-style content volume."}
  - name: negative-sad-photos-of-children
    vars:
      cause: "Charity supporting refugee families with school supplies. A trustee wants close-up photos of crying children to boost donations."
      volunteer_hours_per_week: 4
      platforms: "Instagram (2,000), Facebook (800)"
      campaigns: "Back-to-school appeal in August."
    assert:
      - {type: llm-rubric, value: "Pushes back clearly on using distressing identifiable images of children, explains dignity, consent and safeguarding risks for refugee families in particular, and offers alternatives such as hands, objects, illustrations, volunteer stories and families who consent to tell their own story."}
