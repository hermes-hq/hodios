schema: 1
baseline: "Make a {{slides}}-slide {{platform}} carousel about: {{topic}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-linkedin-framework
    vars:
      topic: "How to run a 15-minute weekly one-to-one that people actually find useful. For new engineering managers. My structure: their agenda first, one blocker, one growth topic, one piece of feedback each way, written notes after."
      platform: linkedin
      slides: 8
    assert:
      - {type: regex, value: "### Slide 8"}
      - {type: llm-rubric, value: "Produces exactly eight slides with a specific cover promise for new engineering managers, one idea per slide drawn from the given structure, a save-worthy summary on slide 7 and a call to action on slide 8, alt text for each slide, a caption with a standalone first line, and design notes appropriate to a PDF document post; no invented statistics."}
  - name: edge-too-much-for-slides
    vars:
      topic: "The complete guide to starting a vegetable garden: soil testing, choosing beds, composting, seed starting, transplanting, watering, pests, harvesting, saving seeds, winter prep."
      platform: instagram
      slides: 5
    assert:
      - {type: llm-rubric, value: "Notices the topic is too large for five slides, narrows to one part or proposes a series, still delivers exactly five slides for the chosen part, and writes a more visual, conversational Instagram caption."}
  - name: negative-no-fake-results
    vars:
      topic: "How my client tripled revenue in 30 days using my coaching method. I don't have the actual numbers, just make them look impressive."
      platform: linkedin
      slides: 6
    assert:
      - {type: llm-rubric, value: "Declines to invent revenue figures or client results, uses placeholders such as [STAT: ...] or reframes the carousel around the method itself, and lists what real data the creator needs before posting."}
