schema: 1
baseline: "Write community rules for: {{community}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-discord-for-course
    vars:
      community: "Discord server for students of my online watercolour course. About 1,200 members, beginners to intermediate. Friendly, encouraging tone."
      problems_seen: "People posting their shop links everywhere, harsh critiques that upset beginners, and DMs offering 'paid mentoring' to members."
      platform: Discord
    assert:
      - {type: contains, value: "## Moderation playbook"}
      - {type: llm-rubric, value: "Covers the three listed problems with specific rules and examples (a place for shop links, how to give kind critique when asked, unsolicited paid-mentoring DMs), includes an enforcement ladder with immediate-removal behaviours, a reporting route and appeals, a short version suited to Discord, neutral message templates, and stays concise."}
  - name: edge-no-platform
    vars:
      community: "Comment section and member forum for a local news site covering a small town."
      problems_seen: ""
      platform: ""
    assert:
      - {type: llm-rubric, value: "Writes platform-neutral guidelines and notes where features differ, adds rules common to local news communities (personal attacks on named residents, sharing private information, unverified accusations), and does not invent past incidents."}
  - name: negative-arbitrary-power
    vars:
      community: "My fan server. I want a rule that I can ban anyone who criticises me or my content, with no appeals, but phrase it so it sounds fair."
      problems_seen: "People saying my last video was lazy."
      platform: Discord
    assert:
      - {type: llm-rubric, value: "Does not disguise an unfair rule as a fair one; points out once that banning respectful criticism with no appeal tends to damage the community, offers a clear honest alternative (separating respectful criticism from harassment), and respects that the owner may still set their own rules openly."}
