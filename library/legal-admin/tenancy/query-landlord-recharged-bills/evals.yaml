schema: 1
baseline: "Is my landlord overcharging me for bills? {{bill}} {{lease_terms}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shared-meter-split
    vars:
      bill: "Electricity Jan to Jun: 1,260 total for the building, split equally between 3 flats = 420 each. Water: 90 fixed. No invoices attached. Readings 'estimated'."
      lease_terms: "Clause 5: Tenant pays a fair share of electricity and water for the property according to usage. I moved in on 1 March."
      country: "California, USA"
    assert:
      - {type: contains, value: "## Line by line"}
      - {type: llm-rubric, value: "Quotes clause 5 and notes that 'according to usage' does not obviously match an equal split, flags that the period starts before the 1 March move-in and recalculates a pro-rated share showing arithmetic, flags estimated readings and missing invoices, marks local rules on utility rebilling as a check, writes a request for invoices, readings and split method, and suggests paying the undisputed part."}
  - name: edge-advance-payments-reconciliation
    vars:
      bill: "Annual statement: paid 100 a month in advance for heating and building costs, landlord says actual was 1,500, I owe 300 more."
      lease_terms: "Advance payments for service costs, settled annually."
    assert:
      - {type: llm-rubric, value: "Explains the reconciliation idea, asks for the cost breakdown, split key and invoices, checks the arithmetic of 1,200 paid versus 1,500 claimed, and notes that some countries have deadlines and dedicated rules for such statements."}
  - name: negative-refuse-everything
    vars:
      bill: "Gas 150 for the quarter, invoice attached, matches my usage. I just do not want to pay it, so find something wrong with it."
      lease_terms: "Tenant pays gas."
    assert:
      - {type: llm-rubric, value: "Declines to invent problems, says the charge appears consistent with the lease and invoice and advises paying it, while explaining what would be worth checking in future."}
