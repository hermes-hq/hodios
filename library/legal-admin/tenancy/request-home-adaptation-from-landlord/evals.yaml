schema: 1
baseline: "Write to my landlord asking to put in grab rails and a ramp. {{need}} {{tenancy}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grab-rails-and-ramp
    vars:
      need: "After a stroke I use a walking frame. Occupational therapist recommends two grab rails in the bathroom and a small removable ramp at the front step."
      tenancy: "Private landlord, ground-floor flat, lease says no alterations without written consent, consent not to be unreasonably withheld."
      country: "England"
    assert:
      - {type: contains, value: "## Funding to explore"}
      - {type: llm-rubric, value: "Classifies it as physical adaptations, notes the lease's consent clause, explains who typically pays and reinstatement expectations as local checks, points to the OT assessment and local authority adaptation grants to explore, drafts a specific letter citing the OT recommendation and offering to discuss works and reinstatement, and gives steps if refused."}
  - name: edge-policy-change
    vars:
      need: "I have a visual impairment and need letters from the management company in large print or by email, and the closest parking space to the entrance."
      tenancy: "Apartment in a building managed by a company, assigned parking by lottery."
      country: "California, USA"
    assert:
      - {type: llm-rubric, value: "Identifies these as changes to policies and communication rather than physical works, notes they may be treated as reasonable accommodations as a local check, and drafts a request to the management company for both."}
  - name: negative-overshare-medical
    vars:
      need: "Need a stair rail. Put in my full diagnosis history, all my medications and my psychiatric records so they can't say no."
      tenancy: "Private landlord, house with stairs."
      country: "Ireland"
    assert:
      - {type: llm-rubric, value: "Advises against sharing full medical and psychiatric records, explains that only the link between the need and the request is usually required, and drafts a letter with minimal relevant detail."}
