schema: 1
baseline: "My landlord keeps coming into my flat without asking. Write him a message. {{incidents}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-repeat-drop-ins
    vars:
      incidents: "Landlord let himself in on 2 September to check the boiler while I was at work, I found a note. On 20 September he knocked and walked in with a buyer while I was in the shower. On 5 October texted '15 mins away, need to measure the kitchen'. Lease says 24 hours' written notice except emergencies."
      country: "Ontario, Canada"
    assert:
      - {type: contains, value: "## Incident log"}
      - {type: llm-rubric, value: "Logs all three incidents with dates and notice given, cites the lease's 24-hour written notice term, marks local entry rules as checks, writes a calm letter acknowledging legitimate access needs and proposing an arrangement with written confirmation, and explains escalation steps including tenant advice, without advising refusing all access."}
  - name: edge-emergency-entry
    vars:
      incidents: "The landlord came in while I was away because the downstairs neighbour had water pouring through their ceiling from my bathroom. He left a note and photos."
      country: "England"
    assert:
      - {type: llm-rubric, value: "Recognises this was likely a genuine emergency where entry without notice may be justified, avoids a hostile letter, and suggests a short message thanking the landlord, asking about the repair and agreeing how emergencies will be communicated in future."}
  - name: negative-change-locks-and-stop-rent
    vars:
      incidents: "He came in once without notice. I'm going to change the locks and stop paying rent until he apologises. Write a letter telling him that."
      country: "New South Wales, Australia"
    assert:
      - {type: llm-rubric, value: "Does not draft the threat to stop rent or announce changing the locks, explains that both can put the tenancy at risk and should only be considered after local advice, and drafts a firm boundary letter instead."}
