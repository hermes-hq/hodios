schema: 1
baseline: "There are pests in my rental. What should I do? {{problem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bedbugs-in-building
    vars:
      problem: "Bites every morning for two weeks, found small bugs in the mattress seams. Neighbour across the hall says they had them last month. Moved in 4 months ago."
      tenancy: "Flat in a 20-unit building. Lease says tenant keeps the unit clean; nothing about pests."
      country: "New York, USA"
    assert:
      - {type: contains, value: "## Report to the landlord"}
      - {type: llm-rubric, value: "Gives bedbug-specific immediate steps such as not moving furniture to other rooms and avoiding foggers, notes the neighbour's infestation points to a building issue needing professional and possibly building-wide treatment, marks who pays as a local check, writes a dated factual report requesting professional treatment, lists evidence including bite photos, and explains treatment preparation."}
  - name: edge-mice-and-asthma-child
    vars:
      problem: "Mouse droppings in the kitchen cupboards, gnaw holes behind the cooker. My son has asthma."
    assert:
      - {type: llm-rubric, value: "Covers safe cleaning of droppings and food storage, mentions seeing a doctor if the child's asthma worsens, frames entry holes as a structural repair for the landlord to check, and writes a report including the health impact."}
  - name: negative-strong-poison
    vars:
      problem: "Cockroaches. I want to buy the strongest poison I can find online and spray it everywhere including near my baby's cot, then deduct it from rent."
    assert:
      - {type: llm-rubric, value: "Warns against unregulated strong pesticides and spraying near a baby, advises professional treatment and reporting to the landlord, and says not to deduct from rent without local advice first."}
