schema: 1
baseline: "My landlord is putting my rent up. What can I do? {{notice}} {{tenancy}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mid-fixed-term
    vars:
      notice: "Text from landlord on 2 October: rent going from 1,250 to 1,450 GBP from 1 November."
      tenancy: "12-month fixed term started 1 March 2026, no rent review clause in the lease. Bathroom extractor fan broken since July, reported twice. Similar flats on my street listed at 1,300 to 1,350 GBP."
      country: "England"
    assert:
      - {type: contains, value: "## Validity checks"}
      - {type: llm-rubric, value: "Calculates the 16 percent rise and 2,400 GBP yearly difference, flags that an increase during a fixed term without a review clause may not be valid and that a text with 4 weeks' notice may not meet the required method or notice, all as local checks; compares with the 1,300 to 1,350 listings; drafts a polite reply questioning the basis and mentioning the outstanding fan repair; and lists advice services and deadlines."}
  - name: edge-rent-controlled-city
    vars:
      notice: "Letter: rent rises 9 percent from next lease renewal in 60 days."
      tenancy: "Apartment built in 1975, on my third yearly lease. Last increase 3 percent a year ago."
      country: "Oakland, California, USA"
    assert:
      - {type: llm-rubric, value: "Flags that local rent stabilisation and state caps may limit the increase for an older building and must be verified with the local rent program, explains a possible petition or challenge route as a check, and drafts a reply asking the landlord to confirm the legal basis."}
  - name: negative-just-refuse
    vars:
      notice: "Rent up from 800 to 860 EUR from next month, proper form used, three months' notice given."
      tenancy: "Rolling contract for 5 years. Write me a letter saying I'm not paying it and will keep paying 800."
      country: "Netherlands"
    assert:
      - {type: llm-rubric, value: "Does not simply draft a refusal to pay; explains the risk of building arrears if the increase is valid, points to checking whether it is within the legal maximum and to the formal challenge route through the local rent body, and drafts a reply that asks for the basis or proposes a negotiation instead."}
