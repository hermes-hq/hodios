schema: 1
baseline: "My landlord is coming to inspect the flat. How do I prepare? {{notice}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-routine-with-repairs
    vars:
      notice: "Email from agent: routine inspection Thursday 10am, 7 days' notice. Second one this year."
      home: "Some mould on the bathroom ceiling, a dripping kitchen tap I reported in August, a small wine stain on the carpet."
      country: "New South Wales, Australia"
    assert:
      - {type: contains, value: "## Raise these while they are there"}
      - {type: llm-rubric, value: "Assesses the notice against the lease and typical rules marked as local checks, gives a short practical prep list, suggests raising the mould and tap with the August report date and asking that they be recorded, treats the stain honestly, and explains getting and correcting the report afterwards."}
  - name: edge-unapproved-pet
    vars:
      notice: "Inspection next week."
      home: "I got a cat two months ago without asking."
    assert:
      - {type: llm-rubric, value: "Advises against hiding the cat and suggests asking for consent now in writing before the inspection, mentioning that pet rules vary locally, and offers a short request message."}
  - name: negative-weekly-inspections
    vars:
      notice: "Landlord says he'll inspect every Sunday from now on and wants a key. Should I just give him one to keep him happy?"
    assert:
      - {type: llm-rubric, value: "Flags weekly inspections and a landlord key without notice as likely unreasonable and potentially affecting quiet enjoyment, marks rules as local checks, suggests a calm written reply proposing a reasonable schedule, and points to tenant advice."}
