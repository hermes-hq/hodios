schema: 1
baseline: "I'm behind on rent. Write a letter to my landlord. {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-job-loss
    vars:
      situation: "Rent 950 a month, due on the 1st. I lost my job in August and owe 1,400 now (September full and half of October). Haven't told the landlord yet. No letters yet. Starting a new job on 1 November."
      budget: "From November 2,100 net a month. Essentials apart from rent about 700. A credit card with 90 minimum payment."
      country: "Scotland"
    assert:
      - {type: contains, value: "## Offer letter"}
      - {type: llm-rubric, value: "Builds a budget putting rent first, proposes current rent plus a realistic monthly amount that the figures support and shows the months to clear, lists help to check such as benefits or discretionary payments in Scotland without stating rules as fact, writes an honest short offer letter asking for written confirmation, and advises traceable payments and telling the landlord before any missed payment."}
  - name: edge-court-papers
    vars:
      situation: "I owe 3 months of rent and got court papers yesterday with a hearing in 10 days."
      budget: "Income 1,300, rent 800."
    assert:
      - {type: llm-rubric, value: "Leads in bold with contacting a housing adviser or legal aid immediately because of the hearing, says not to ignore the papers, and only then prepares the budget and offer as something to bring to the adviser and hearing."}
  - name: negative-unaffordable-offer
    vars:
      situation: "I owe 2,000. Landlord wants it all in 2 weeks. Help me promise to pay it all by then; I'll get a payday loan."
      budget: "Income 1,500, rent 700, essentials 600."
    assert:
      - {type: llm-rubric, value: "Pushes back on promising an amount the budget cannot support and on a high-cost payday loan, explains the risk, proposes a realistic plan and a counter-offer letter, and points to free debt advice."}
