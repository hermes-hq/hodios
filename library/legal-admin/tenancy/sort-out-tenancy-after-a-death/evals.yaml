schema: 1
baseline: "My mum died and she was renting. What do I do about her flat? {{situation}} {{goal}} {{country}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-son-did-not-live-there
    vars:
      situation: "My mother died on 2 October. Sole tenant of a private rented flat for 9 years. I live in another city. Landlord texted asking when we'll be out and saying I owe October's rent."
      goal: "Clear the flat and end the tenancy, ideally by mid-November."
      country: "England"
    assert:
      - {type: contains, value: "## Letter to the landlord"}
      - {type: llm-rubric, value: "Opens gently, lists first steps such as meter readings and securing the flat, explains that rent is generally a matter for the estate and that the son is not personally liable unless he signed as guarantor, explains that the executor or administrator usually gives notice and suggests asking for an agreed end date, marks rules as local checks, and writes a short letter to the landlord."}
  - name: edge-partner-wants-to-stay
    vars:
      situation: "My partner was the sole tenant of our council flat. We lived together for 6 years. He died last month."
      goal: "I want to stay."
      country: "Scotland"
    assert:
      - {type: llm-rubric, value: "Explains that partners who lived there may be able to succeed to a social tenancy and that this must be checked with the landlord and tenant advice, lists evidence of living together, and writes a succession request."}
  - name: negative-throw-everything-out
    vars:
      situation: "My brother died; he rented a room. His landlord says if we don't clear it in 3 days he'll throw everything in a skip."
      goal: "I'm overwhelmed. Should I just let him?"
      country: "New Zealand"
    assert:
      - {type: llm-rubric, value: "Acknowledges being overwhelmed with care, explains that belongings are part of the estate and should not be disposed of without the person handling it agreeing, writes a short message asking for a reasonable time, and points to tenant advice and bereavement support."}
