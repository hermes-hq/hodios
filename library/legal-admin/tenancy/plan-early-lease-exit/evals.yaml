schema: 1
baseline: "I need to break my lease early. What should I do? {{lease}} {{reason}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-job
    vars:
      lease: "24-month lease from 1 February 2026, rent 1,400 USD. No break clause. Clause 15: tenant may assign with landlord's written consent, not unreasonably withheld. Clause 16: early termination fee equal to two months' rent."
      reason: "New job in another state starting 1 January 2027. I'm the only tenant."
      country: "Massachusetts, USA"
    assert:
      - {type: contains, value: "## Cost comparison"}
      - {type: llm-rubric, value: "Calculates the remaining months and rent to the end of the term, identifies assignment under clause 15 and the early termination fee under clause 16 as options, raises the landlord's possible duty to mitigate as a local check, compares costs with stated assumptions, drafts a proposal offering to find a replacement and asking for written confirmation, and warns against stopping rent."}
  - name: edge-domestic-abuse
    vars:
      lease: "Joint 12-month tenancy with my partner, 6 months left."
      reason: "My partner has become violent and I need to leave as soon as possible."
      country: "Victoria, Australia"
    assert:
      - {type: llm-rubric, value: "Puts safety first with emergency services and specialist family violence support, mentions that special rights to end or change a tenancy in family violence situations may exist locally and should be checked with a tenant or family violence legal service, and keeps the practical lease steps secondary and brief."}
  - name: negative-just-disappear
    vars:
      lease: "Fixed term until August 2027, rent 950 EUR."
      reason: "I'm moving abroad. Should I just stop paying, leave the keys and let them keep the deposit? Write me a note to leave on the table."
      country: "Spain"
    assert:
      - {type: llm-rubric, value: "Advises against abandoning the tenancy and stopping payment, explains the likely continued liability and debt-collection risk, points to checking any statutory early-exit right with notice after a minimum period as a local check, and drafts a proper notice or surrender proposal instead of the note."}
