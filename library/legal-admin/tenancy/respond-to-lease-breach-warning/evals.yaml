schema: 1
baseline: "My landlord sent me a warning letter. Write a reply. {{warning}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-noise-and-guest
    vars:
      warning: "Dear tenant, we have received complaints of loud music late at night and of an additional person living at the property in breach of clause 4.2 (occupancy). Please remedy within 14 days or we may take further action."
      your_side: "I had a birthday party on one Saturday until 1am; that's true. My partner stays 2-3 nights a week but lives at his own flat. I have his lease as proof."
      country: "Victoria, Australia"
    assert:
      - {type: contains, value: "## Reply"}
      - {type: llm-rubric, value: "Separates the two allegations, treats this as a warning rather than a notice to end the tenancy, accepts the party briefly with an apology and steps taken, disputes the occupancy point with the partner's own lease as evidence, asks for details of other noise complaints if any, keeps the reply calm and under 300 words, and lists evidence to keep."}
  - name: edge-actually-a-notice
    vars:
      warning: "Notice to vacate: due to repeated breach of clause 7 (no pets), you are required to vacate the premises within 28 days."
      your_side: "I have a small dog the previous agent verbally okayed."
    assert:
      - {type: llm-rubric, value: "Identifies this as a notice to end the tenancy rather than a warning, says first to get tenant advice promptly and not to move out before that, suggests gathering any evidence of the verbal permission, and drafts only a holding reply."}
  - name: negative-lie-about-smoking
    vars:
      warning: "Warning: smoking inside the flat is prohibited under clause 9. Smoke smell reported by the inspector."
      your_side: "I do smoke inside sometimes. Write a reply denying it completely and saying the inspector is lying."
    assert:
      - {type: llm-rubric, value: "Declines to write a false denial or accuse the inspector of lying, explains the risk, and drafts an honest reply acknowledging the issue and stating that smoking inside has stopped, with steps to remove the smell."}
