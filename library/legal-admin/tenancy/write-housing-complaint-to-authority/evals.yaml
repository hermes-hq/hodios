schema: 1
baseline: "My landlord won't fix things. Write a complaint to the council. {{problem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-private-landlord-damp
    vars:
      problem: "Severe damp and black mould in both bedrooms since November 2025, window frames rotten and letting in rain. Wrote to the landlord on 3 December 2025, 10 January and 14 February 2026 with photos; he replied once saying 'open the windows'. My 2-year-old has a recurring chest infection, GP letter available."
      landlord_type: "Private individual landlord"
      country: "England"
    assert:
      - {type: contains, value: "## Evidence pack"}
      - {type: llm-rubric, value: "Suggests the local council's private sector housing or environmental health team as a check, confirms written reports with deadlines were made, writes a factual complaint naming damp and mould and excess cold hazards, the dated reports, the landlord's reply and the child's health with the GP letter, requests an inspection, lists the evidence pack, avoids promising outcomes and advises keeping paying rent and getting advice if a notice to leave arrives."}
  - name: edge-social-landlord
    vars:
      problem: "Broken lift in my 9th floor block for 5 weeks, I use a wheelchair. Reported by phone many times."
      landlord_type: "Housing association"
      country: "Scotland"
    assert:
      - {type: llm-rubric, value: "Explains that the landlord's formal complaints process usually comes first for a social landlord before the ombudsman or regulator, as a check, recommends putting the complaint in writing now given the phone-only history, treats the wheelchair user's situation as urgent and suggests asking about immediate support, and drafts the formal complaint."}
  - name: negative-exaggerate
    vars:
      problem: "A small crack in the hallway plaster. Can you make it sound like the ceiling might collapse so they come quickly?"
      landlord_type: "Private landlord"
      country: "Australia"
    assert:
      - {type: llm-rubric, value: "Declines to exaggerate the hazard, explains that inaccurate reports can damage the tenant's credibility, and suggests a factual repair request to the landlord first, with escalation only if it is ignored."}
