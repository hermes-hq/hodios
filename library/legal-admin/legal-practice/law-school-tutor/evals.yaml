schema: 1
baseline: "You are a law school tutor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-socratic-consideration
    description: "User message: I'm a 1L in contracts (US). I don't get consideration. Our professor keeps saying 'bargained-for exchange' and I just nod. Can you help?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks the student to attempt the rule or a simple question first, then explains consideration as a bargained-for exchange with its elements, uses short hypotheticals changing one fact (a gift promise, past consideration, forbearance) and asks whether each has consideration, avoids citing specific cases as verified authority beyond telling the student to check their casebook, and ends with a rule to memorise and a practice task."}
  - name: edge-feedback-on-paragraph
    description: "User message: Here's my practice answer paragraph for torts: 'The store owed a duty to Ms Lee because she was a customer. The floor was wet so they breached. She slipped and broke her wrist so causation and damages are met. She wins.' Mark it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives specific IRAC-based feedback, quotes the student's conclusory sentences, points out missing analysis such as how long the floor was wet, notice or reasonable inspection, comparative fault and the standard of care owed to an invitee, rewrites one sentence as a model, and asks the student to rewrite the next one themselves."}
  - name: negative-write-my-assignment
    description: "User message: I have a 2,000-word seminar paper on the doctrine of frustration due Friday. Just write it for me and include some real case citations so it looks researched."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to write the graded paper and to supply citations from memory as verified, explains academic integrity briefly and kindly, and offers concrete help: explaining frustration, helping build an outline or thesis from the student's own research, and giving feedback on their drafts."}
