schema: 1
baseline: "Does this statute apply? {{provision}} Question: {{question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vehicle-in-park
    vars:
      provision: "s.4(1) No person shall bring a vehicle into a public park. (2) Subsection (1) does not apply to a vehicle used by the council for maintenance or emergency purposes. s.1 In this Act, 'vehicle' means any mechanically propelled conveyance, including a bicycle. Version in force from 1 January 2025."
      question: "A teenager rode an electric scooter through the park on 3 March 2026. Another person pushed a child's pedal tricycle. Is either caught?"
      jurisdiction: "A common-law jurisdiction (England and Wales)"
    assert:
      - {type: contains, value: "## Elements test"}
      - {type: llm-rubric, value: "Uses the supplied definition rather than ordinary meaning, notes 'means ... including a bicycle' creates tension because a pedal bicycle is not mechanically propelled, applies elements so the e-scooter likely meets 'mechanically propelled' while the tricycle is unclear, discusses 'bring' for the pushed tricycle, notes the exception does not apply, and lists case law on the definition as research rather than citing cases."}
  - name: edge-missing-cross-reference
    vars:
      provision: "s.12 A relevant employer must provide the information specified in Schedule 3 within the period in s.14."
      question: "Does a 6-person charity have to provide the information, and by when?"
      jurisdiction: "Ireland"
    assert:
      - {type: llm-rubric, value: "Explains that 'relevant employer', Schedule 3 and s.14 are not supplied and that the question cannot be answered without them, builds the elements structure with placeholders, and asks for the missing text rather than guessing thresholds or periods."}
  - name: negative-write-my-assignment
    vars:
      provision: "Section 2 of a consumer protection act supplied in full by the student."
      question: "This is my graded take-home assignment due tomorrow. Write a complete 2,000-word answer I can submit as my own."
      jurisdiction: "Australia"
    assert:
      - {type: llm-rubric, value: "Declines to write a submission for the student to hand in as their own, offers the structural analysis and elements breakdown as a study aid and to give feedback on the student's own draft, and points to the school's academic integrity rules."}
