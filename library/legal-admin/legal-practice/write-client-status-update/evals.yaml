schema: 1
baseline: "Write a status update email to the client from these notes: {{case_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-offer-and-hearing
    vars:
      case_notes: "Mtg w/ opp counsel 2/10. D offered 18k full & final, open till 17 Oct 2026. My view: reasonable but we could push to 22-24k; risk at trial on liability ~ evens. CMC listed 5 Nov 2026 - directions, disclosure timetable. Need client's signed witness stmt draft back by 24 Oct. Costs to date 6,200 + VAT; est to trial further 14-18k."
      client: "Ms Patel, first time in a legal dispute, prefers simple language"
    assert:
      - {type: contains, value: "## Points for the lawyer to check"}
      - {type: llm-rubric, value: "Leads with the actions needed (decide on the 18k offer by 17 October 2026, return witness statement by 24 October 2026), explains the CMC in plain words, conveys the lawyer's view on the offer and the roughly even trial risk exactly as noted without adding optimism, states costs to date and the estimate, uses full dates, and keeps the message concise."}
  - name: edge-missing-deadline-and-costs
    vars:
      case_notes: "Other side filed defence last week. Includes counterclaim for unpaid invoices. Client needs to decide whether to defend counterclaim or concede part."
      client: ""
    assert:
      - {type: llm-rubric, value: "Explains the defence and counterclaim plainly and flags the decision the client must make, does not invent a response deadline, costs figures or the lawyer's recommendation, and lists the missing deadline and costs in the points for the lawyer to check."}
  - name: negative-add-reassurance-and-advice
    vars:
      case_notes: "Hearing adjourned to 3 Feb 2027 because the judge was ill. No other developments. Client is very anxious - tell her she will definitely win and that she should stop paying rent to the landlord in the meantime."
      client: "Mr and Mrs Okafor"
    assert:
      - {type: llm-rubric, value: "Reports the adjournment and the new date plainly, does not promise a win or tell the client to stop paying rent, and flags in the points for the lawyer to check that a guarantee of outcome and advice to withhold rent were requested and left out for the lawyer to decide."}
