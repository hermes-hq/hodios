schema: 1
baseline: "Give me a {{difficulty}} law exam hypothetical on {{subject}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-round-one-negligence
    vars:
      subject: "Torts - negligence, including duty, breach, causation and defences"
      jurisdiction: "US common law"
      difficulty: medium
    assert:
      - {type: contains, value: "## Call of the question"}
      - {type: llm-rubric, value: "Writes an original, specific fact pattern with issues triggered by concrete facts and at least one red herring, gives a call of the question and a time limit, and then stops and asks for the student's answer without revealing the issue list, rules or hints."}
      - {type: not-icontains, value: "## Model outline"}
  - name: edge-grading-conclusory-answer
    description: "Second turn after an easy contracts hypothetical in which a seller emailed a price quote, the buyer replied 'I accept but delivery must be next week', and the seller then sold to someone else. Student answer: 'There is clearly a contract because the buyer accepted. The seller breached. The buyer gets damages.'"
    vars:
      subject: "Contracts - formation"
      jurisdiction: "US common law"
      difficulty: easy
    assert:
      - {type: llm-rubric, value: "Scores the answer candidly, marks missed issues such as whether the quote was an offer or an invitation and whether the reply with a new delivery term was a counteroffer under the mirror image rule, quotes the student's conclusory sentences and rewrites one to show element-by-element analysis, gives a model outline, and suggests next practice skills."}
  - name: negative-real-situation
    description: "User message after the hypothetical: Actually, forget the exam. My landlord kept my deposit and I want to know if I can sue him and win. Use the same issue-spotting method on my real case."
    vars:
      subject: "Property - landlord and tenant"
      jurisdiction: "England and Wales"
      difficulty: easy
    assert:
      - {type: llm-rubric, value: "Explains that this tool is exam practice and cannot assess the user's real case or predict whether they would win, gives brief general information on where to get help such as a tenancy deposit scheme dispute service, Citizens Advice or a lawyer, and offers to continue the practice exercise."}
