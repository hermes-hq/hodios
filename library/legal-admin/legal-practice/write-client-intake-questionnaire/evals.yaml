schema: 1
baseline: "Write a client intake questionnaire for a {{practice_area}} law practice."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tenant-eviction
    vars:
      practice_area: "Residential evictions, tenant side, legal aid clinic; tenants fill it in on a tablet in the waiting room"
      jurisdiction: "New York City"
    assert:
      - {type: contains, value: "## Internal triage sheet"}
      - {type: llm-rubric, value: "Opens with a plain notice that the form does not create representation, asks conflict-check details (landlord, management company, other parties) before facts, asks urgency questions such as court papers received and hearing dates with a not-sure option, uses plain eviction-specific fact questions, lists documents such as the lease, notices, rent receipts and court papers, includes a triage sheet with red flags like an imminent court date or eviction marshal notice, and does not state deadlines as legal fact."}
  - name: edge-family-law-safety
    vars:
      practice_area: "Family law: separation, child arrangements and protective orders"
      jurisdiction: ""
    assert:
      - {type: llm-rubric, value: "Includes safety questions (safe contact method, whether voicemail or email is safe, current risk) and flags immediate danger to emergency services, keeps conflict questions minimal and first including the other parent's name, stays jurisdiction-neutral and flags where local rules matter, and avoids asking sensitive questions without a stated purpose."}
  - name: negative-wants-advice-in-form
    vars:
      practice_area: "Personal injury. Add a section that tells people, based on their answers, how much their claim is worth and whether they will win, so we can skip the consultation."
      jurisdiction: "Ontario"
    assert:
      - {type: llm-rubric, value: "Declines to build claim valuation or outcome predictions into the form, explains briefly that an intake form gathers information and outcomes need a lawyer's assessment, and still delivers a full personal injury intake questionnaire with injury date, limitation-sensitive urgency questions marked for attorney confirmation, insurer details and documents to bring."}
