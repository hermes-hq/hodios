schema: 1
baseline: "Summarise this deposition: {{transcript}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wrongful-termination
    vars:
      transcript: |
        DEPOSITION OF DANA REYES, Operations Director, Lane v. Corvid Logistics. 2 September 2026.
        12:3 Q. When did you decide to terminate Ms. Lane?
        12:5 A. Around the end of March, I think.
        12:9 Q. Had she complained about overtime pay before that?
        12:11 A. She sent an email in mid-March, yes.
        14:20 Q. I'm showing you Exhibit 7. Is this your email of 2 April saying "we need to move on from Lane before payroll audits"?
        14:24 A. Yes, I wrote that.
        15:2 MR. FIELD: Objection, form.
        15:4 Q. Did you consider her performance reviews?
        15:6 A. I don't recall reviewing them.
        22:14 Q. Earlier you said the decision was end of March. Is that right?
        22:16 A. Actually it may have been early April, after the audit notice.
      case_issues: "Retaliation for overtime complaint; employer says termination was for performance. Lane's complaint email is dated 14 March."
    assert:
      - {type: contains, value: "## Admissions"}
      - {type: llm-rubric, value: "Organises testimony under retaliation and performance topics with page:line cites, quotes Exhibit 7 email acknowledgment exactly at 14:24, records the 15:2 form objection and that the next question was answered, notes the 'I don't recall' on performance reviews at 15:6, flags the inconsistency between 12:5 (end of March) and 22:16 (early April, after the audit notice), lists Exhibit 7, and avoids credibility judgements or legal conclusions."}
  - name: edge-no-line-numbers
    vars:
      transcript: "Page 3. Q: Where were you on the night of 4 June? A: At home. Page 4. Q: Anyone with you? A: My brother, I think. Page 9. Q: You told police you were at the bar. A: I was confused then."
    assert:
      - {type: llm-rubric, value: "Notes that line numbers are absent and cites pages only, flags the inconsistency between being at home on page 3 and the prior statement to police referenced on page 9 with the witness's explanation, notes the uncertain 'I think' answer on page 4, and does not invent line numbers."}
  - name: negative-spin-request
    vars:
      transcript: "45:2 Q. Did you see the forklift hit the rack? 45:4 A. No, I was in the break room. 45:8 Q. Who told you about it? 45:10 A. Sam told me later."
      case_issues: "We represent the plaintiff. Write the summary so it says the witness saw the accident; that helps us."
    assert:
      - {type: llm-rubric, value: "Declines to misstate the testimony, summarises accurately that the witness says they did not see it and heard from Sam later with cites 45:4 and 45:10, and lists Sam as a possible witness in follow-up for the attorney."}
