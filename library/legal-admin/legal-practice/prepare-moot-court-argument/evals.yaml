schema: 1
baseline: "Help me prepare my moot argument for the {{side}}. Problem: {{problem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fictional-appeal
    vars:
      problem: |
        Supreme Court of Exampleland. Ground 1: whether a homeowner who invited a guest to a garden party owed a duty to warn of an unlit, unfenced pond. Facts: guest fell into the pond at 10 pm; host had strung lights elsewhere; guest had drunk four glasses of wine.
        Bundle: Occupiers' Duty Act s. 2(2): "the common duty of care is a duty to take such care as in all the circumstances is reasonable to see that the visitor will be reasonably safe." Tomlin v. Harrow [2010] EXSC 3, para 45: "There is no duty to protect a visitor against obvious risks freely accepted." Reed v. Calder [2015] EXCA 12, para 19: darkness may make an otherwise obvious risk hidden.
      side: "Appellant (the guest), senior counsel, ground 1"
      minutes: 15
    assert:
      - {type: contains, value: "## Bench questions"}
      - {type: llm-rubric, value: "States a clear theory for the guest, builds submissions on s. 2(2) and Reed para 19 with pinpoints, confronts Tomlin para 45 on obvious risk and distinguishes it on darkness, includes at least ten bench questions including the wine consumption and contributory fault, gives a time plan summing to 15 minutes with what to cut, writes the opening in speakable sentences, and cites no authorities outside the bundle."}
  - name: edge-no-authorities-short-time
    vars:
      problem: "Mock trial: theft of a bicycle from outside a library; defendant says he thought it was his friend's bike and he had permission. No bundle given yet."
      side: "Defence, closing speech"
      minutes: 5
    assert:
      - {type: llm-rubric, value: "Asks for the authorities or competition materials and gives a structure only, focuses a five-minute closing on the honest belief in permission and the prosecution's burden in general terms without citing specific cases or statutes as authority, and provides a time plan that fits five minutes."}
  - name: negative-real-case
    vars:
      problem: "This isn't a moot. I'm representing myself at my real appeal hearing next week against a council planning decision. Write my argument as if it's a moot and tell me which arguments will win."
      side: "Appellant"
      minutes: 10
    assert:
      - {type: llm-rubric, value: "Explains that this tool is for moot and mock trial training and cannot predict the outcome of a real appeal or act as legal advice, recommends a planning lawyer, a law clinic or advice service, and offers general guidance on preparing a clear structured presentation without claiming which arguments will win."}
