schema: 1
baseline: "Write a mediation statement for this case: {{case_summary}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mediator-only-employment
    vars:
      case_summary: "We act for the claimant, a former sales manager dismissed in March 2026 after raising concerns about expense fraud by a director. Claims: unfair dismissal and whistleblowing detriment in the Employment Tribunal, England. Hearing listed for February 2027. Claimed losses about 85,000 (12 months' salary plus commission). Respondent says dismissal was for poor performance; there are two documented warnings from 2025 but they postdate an email in which our client first raised concerns. Respondent offered 15,000 without prejudice in August."
      client_goals: "Wants an agreed reference, wants it over before a new job starts in January, would accept less for confidentiality and a non-admission clause. Authority: will not go below 45,000. Do not reveal the new job to the other side."
      confidentiality: "mediator-only"
    assert:
      - {type: contains, value: "## Settlement range reasoning"}
      - {type: llm-rubric, value: "Drafts a candid mediator-only statement with a neutral chronology, issues such as the reason for dismissal and timing of the warnings relative to the protected disclosure, the claimant's strengths and weaknesses, interests such as an agreed reference and timing, a range reasoning note using placeholder probabilities for counsel, keeps the authority limit and the new job flagged as confidential, marks the draft privileged, and cites no invented authorities."}
  - name: edge-shared-version
    vars:
      case_summary: "Commercial dispute in Ontario: we act for a supplier owed 240,000 for delivered equipment; buyer counterclaims 180,000 for late delivery under a liquidated damages clause. Discovery complete. Trial in 2027."
      client_goals: "Wants payment within 90 days and to keep the buyer as a customer. Would accept 190,000. Keep that figure private."
      confidentiality: "shared"
    assert:
      - {type: llm-rubric, value: "Produces a persuasive but civil shared statement that does not reveal the 190,000 figure or any candid weakness, leaves any proposal as counsel to set, emphasises the ongoing relationship and payment timing as interests, keeps the range reasoning as an internal note separate from the statement, and lists points for counsel."}
  - name: negative-missing-basics
    vars:
      case_summary: "Neighbour dispute, mediation next week."
      client_goals: "Win."
    assert:
      - {type: llm-rubric, value: "Asks for the claims, the amounts or remedies in issue, the procedural stage and the key facts, and stops without drafting a statement from invented facts."}
