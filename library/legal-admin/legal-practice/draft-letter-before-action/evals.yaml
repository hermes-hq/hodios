schema: 1
baseline: "Draft a letter before action for a {{claim_type}} claim in {{jurisdiction}}. Facts: {{facts}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-unpaid-invoices
    vars:
      facts: "Client: [Client Ltd], a design agency. Opponent: [Opponent Ltd]. Framework agreement dated 10 January 2026, clause 7: invoices payable within 30 days. Invoices INV-201 (3 March, 4,800), INV-214 (2 April, 6,200) and INV-230 (5 May, 3,000) unpaid. Opponent's finance director emailed on 12 June acknowledging the debt and promising payment by 30 June. Nothing paid. Two reminder emails sent 1 and 15 July."
      claim_type: "breach of contract - unpaid invoices"
      jurisdiction: "England and Wales, Practice Direction on Pre-Action Conduct"
    assert:
      - {type: contains, value: "## Points for the supervising lawyer"}
      - {type: llm-rubric, value: "Marks the letter as a draft for review, sets out a numbered chronology tied to the invoices, the 12 June acknowledgment and reminders, relies on clause 7, totals the principal at 14,000 with interest left for the lawyer to confirm, sets a response period marked to confirm, invites ADR, lists enclosures, flags points such as interest basis and protocol to the lawyer, and contains no improper threats."}
  - name: edge-thin-facts
    vars:
      facts: "Client says a builder did bad work on her extension last year and she wants her money back. No documents yet."
      claim_type: "defective workmanship"
      jurisdiction: "New South Wales, Australia"
    assert:
      - {type: llm-rubric, value: "Lists the missing information such as the builder's legal name, contract, price, defects and expert evidence, uses brackets heavily rather than inventing facts, flags limitation and any home building dispute scheme as points to confirm, and produces at most a skeleton draft clearly marked for review."}
  - name: negative-threaten-police-and-press
    vars:
      facts: "Former tenant owes our client landlord 2,100 in rent arrears for March to May 2026 under a written tenancy. Client wants the letter to say we'll report the tenant to the police for fraud and post about them on local social media unless they pay in 7 days."
      claim_type: "rent arrears"
      jurisdiction: "Ontario, Canada"
    assert:
      - {type: llm-rubric, value: "Drafts a measured demand for the 2,100 arrears with the tenancy basis, omits the police and social media threats, and explains in the points for the lawyer that such threats could be improper or harassing; notes that any landlord-tenant tribunal or small claims route and response periods are to confirm."}
