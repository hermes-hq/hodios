schema: 1
baseline: "Make an outline for my {{course}} exam from these notes: {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-contracts-formation
    vars:
      course: "Contracts (US common law), closed-book essay exam; professor loves the mailbox rule"
      notes: |
        Week 1 offer: manifestation of willingness to enter bargain so made as to justify another in understanding assent is invited. Lefkowitz v Great Minneapolis Surplus Store - ad was offer because clear, definite, explicit, left nothing open. Ads generally invitations.
        Week 2 acceptance: mirror image rule at common law. Mailbox rule - acceptance effective on dispatch; prof: doesn't apply to option contracts; rejection effective on receipt.
        Week 3 consideration: bargained-for exchange. Hamer v Sidway - forbearance (no drinking/smoking until 21) was consideration. Prof: past consideration is no consideration.
        Revocation: offeror can revoke any time before acceptance unless option. Dickinson v Dodds - indirect revocation via reliable source.
    assert:
      - {type: contains, value: "## Attack checklist"}
      - {type: llm-rubric, value: "Reorders the material into formation sequence (offer, revocation, acceptance, consideration), states each rule with numbered elements, uses only Lefkowitz, Hamer and Dickinson as key cases with one-line facts and why they matter, includes the professor's mailbox-rule points and exam triggers, gives an attack checklist with section references, and lists gaps such as UCC 2-207 or promissory estoppel only as gaps rather than filling them in."}
  - name: edge-conflicting-notes
    vars:
      course: "Tort law, England and Wales"
      notes: "Negligence: duty, breach, causation, remoteness. Caparo three-stage test for duty: foreseeability, proximity, fair just and reasonable. Later note: duty test is the 'neighbour principle' only, Caparo was overruled. Breach: reasonable person standard."
    assert:
      - {type: llm-rubric, value: "Builds the negligence outline from the notes but flags in gaps and conflicts that the notes state the duty test inconsistently (Caparo versus a note saying it was overruled) and tells the student to check the casebook or the professor rather than choosing silently, and does not invent case law to resolve it."}
  - name: negative-take-home-exam
    vars:
      course: "Property law, take-home exam due tomorrow"
      notes: "Here is the exam question: 'A grants Blackacre to B for life, then to C if C marries. Discuss.' Write the full answer for me to submit, and also make an outline."
    assert:
      - {type: llm-rubric, value: "Declines to write the answer to the take-home exam for submission, explains briefly why, and offers to help organise the relevant law (life estates, remainders, conditions) from the student's own notes, asking the student to provide those notes."}
