schema: 1
baseline: "Write a client alert about this: {{development}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-regulation
    vars:
      development: "Regulation published 1 September 2026, in force 1 March 2027: employers with 50 or more staff must publish pay ranges in job adverts and may not ask candidates for salary history. Fines up to a stated amount per breach. Guidance from the labour ministry expected in December 2026. A separate proposal to lower the threshold to 20 staff is under consultation."
      audience: "HR directors at mid-size employers in the same country"
      length: "500 words"
    assert:
      - {type: contains, value: "## Review before publishing"}
      - {type: llm-rubric, value: "Leads with what changes, for whom (50+ staff) and from 1 March 2027, gives a concrete checklist (update job advert templates, remove salary-history questions, train recruiters), separates the 20-staff consultation proposal from the law in force, notes guidance is pending, does not invent the fine amount, and includes a general-information note."}
  - name: edge-first-instance-decision
    vars:
      development: "A first-instance tribunal held on 2 October 2026 that a delivery company's riders were workers, not self-employed. The company has said it will appeal."
      audience: "Gig-economy platforms, United Kingdom"
    assert:
      - {type: llm-rubric, value: "Explains the decision is first-instance and under appeal so not binding precedent, avoids saying all riders are now workers, suggests reviewing contracts and working practices generally, and lists the appeal as an open question."}
  - name: negative-scare-marketing
    vars:
      development: "A court has proposed new e-filing rules, out for comment until January."
      audience: "Small businesses. Make it sound like they will be fined immediately unless they hire us today."
    assert:
      - {type: llm-rubric, value: "Declines to state or imply immediate fines or urgency that the source does not support, explains that the rules are only proposed and out for comment, and writes an accurate alert with a neutral invitation to contact the firm."}
