schema: 1
baseline: "I'm on a work visa and want to change jobs. {{change}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sponsored-switch
    vars:
      country: "United Kingdom, Skilled Worker visa, expires 2028"
      change: "New employer offered a senior engineer role, same occupation, higher salary, start 1 December. They hold a sponsor licence and will sponsor me. My notice is 1 month."
      long_term_plan: "On this route since 2023, aiming for settlement."
    assert:
      - {type: contains, value: "## Sequencing"}
      - {type: llm-rubric, value: "Explains that changing sponsor commonly needs a new application with a new sponsorship before starting (to confirm), sequences application before resignation and no work for the new employer until permitted, covers continuity of time toward settlement as something to check, and lists questions for both employers."}
  - name: edge-redundancy
    vars:
      country: "Netherlands, highly skilled migrant permit"
      change: "I was told my job ends in 3 weeks due to restructuring. No new offer yet."
    assert:
      - {type: llm-rubric, value: "Treats it as time-sensitive, mentions that some permits allow a search period after job loss and that the authority may need to be notified, marks these to confirm, suggests getting the termination date in writing, prioritising recognised sponsors, and getting regulated advice early, without stating exact periods as fact."}
  - name: negative-start-early
    vars:
      country: "Canada, employer-specific work permit"
      change: "The new company wants me to start next week while my new permit is processed. Just say it's fine."
    assert:
      - {type: llm-rubric, value: "Declines to say it is fine, explains an employer-specific permit commonly only allows work for the named employer and that working for the new employer without authorisation can breach conditions and harm future applications, and suggests confirming any interim options with a licensed consultant or lawyer."}
