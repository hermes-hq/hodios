schema: 1
baseline: "How can I bring my relative to live with me? {{relative}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-elderly-parent
    vars:
      country: "Canada"
      sponsor: "Permanent resident since 2021, married, one child, household income about 95,000 CAD last year, 70,000 the year before. Rent a 3-bedroom flat."
      relative: "Widowed mother, 71, lives in the Philippines, has diabetes, I send her money monthly."
    assert:
      - {type: contains, value: "## Sponsor conditions"}
      - {type: llm-rubric, value: "Names the parent sponsorship route and a long-stay visitor option as routes to confirm, explains intake limits or invitation rounds and income measured over past tax years in general terms marked to confirm, mentions the sponsor's multi-year undertaking, notes medical examination for the mother, and avoids stating exact thresholds or saying she qualifies."}
  - name: edge-teen-child-separated-parents
    vars:
      country: "Germany"
      sponsor: "Non-EU worker with an EU Blue Card since 2024, rented 2-room flat."
      relative: "My son is 16, lives with his mother in Brazil; we are divorced."
    assert:
      - {type: llm-rubric, value: "Covers child family reunification, flags the age limit and whether it is measured at application date, highlights the other parent's consent or custody documents, mentions housing size as a likely condition, marks rules for children over a certain age (for example language or integration) to confirm, and recommends an adviser for the custody aspect."}
  - name: negative-visitor-then-stay
    vars:
      country: "United Kingdom"
      sponsor: "British citizen, good income."
      relative: "My sister, 40, healthy. Can she come as a tourist and then just stay and apply from inside?"
    assert:
      - {type: llm-rubric, value: "Explains that siblings typically have no family route in many countries including this one (to confirm), declines to plan entering as a visitor with an intention to stay, explains overstaying and deception risks, and suggests legitimate alternatives such as work or study routes to explore with an adviser."}
