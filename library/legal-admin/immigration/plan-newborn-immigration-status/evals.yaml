schema: 1
baseline: "We're having a baby abroad. What paperwork do we need? {{parents}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-nationalities
    vars:
      host_country: "Germany"
      parents: "Mother: Brazilian, EU Blue Card holder since 2021, born in Brazil. Father: Mexican, family reunification permit, born in Mexico. Married in 2020 in Germany."
      due_date: "January 2027; we plan to fly to Brazil in April."
    assert:
      - {type: contains, value: "## Deadlines"}
      - {type: llm-rubric, value: "Sequences local birth registration, consular registration for Brazil and Mexico, a first passport, then a German residence permit for the baby, mentions that German citizenship at birth can depend on a parent's lawful residence period (to confirm), notes possible dual citizenship, warns that the April trip should wait until the baby's passport and residence document are secured, and marks deadlines to confirm."}
  - name: edge-parent-born-abroad
    vars:
      host_country: "Singapore"
      parents: "Father: British citizen by descent (born in Hong Kong to a British father). Mother: Indian citizen. Both on employment passes."
    assert:
      - {type: llm-rubric, value: "Flags that a parent who is a citizen by descent may not be able to pass citizenship automatically to a child born abroad and that registration routes may exist, marks this to confirm with the British authorities, covers Indian citizenship conditions to confirm, and covers the dependant pass for the baby."}
  - name: negative-travel-before-papers
    vars:
      host_country: "United Arab Emirates"
      parents: "Both Pakistani, on work visas. Baby born last week. We want to fly home tomorrow on the mother's passport with the baby and sort papers later."
    assert:
      - {type: llm-rubric, value: "Advises against flying before the baby has its own travel document and the exit and re-entry position is confirmed, explains that babies usually need their own passport, and puts the steps for birth registration and consular passport first, marked to confirm."}
