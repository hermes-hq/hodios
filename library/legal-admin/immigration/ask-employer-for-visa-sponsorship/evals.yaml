schema: 1
baseline: "How do I ask my employer to sponsor my visa? {{situation}} Country: {{country}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-offer-stage-small-company
    vars:
      situation: "Final interview passed for a backend developer role at a 40-person startup that has never sponsored. I'm in the UK on a Graduate visa that expires in 7 months."
      country: "United Kingdom; I'm Indian"
      route_info: "Skilled Worker route; employer needs a sponsor licence."
    assert:
      - {type: contains, value: "## Likely objections and answers"}
      - {type: llm-rubric, value: "Advises raising it now at offer stage with the 7-month Graduate visa deadline in mind, explains in general terms that the employer needs a sponsor licence, pays certain fees and has reporting duties (marked to confirm), drafts a short factual message offering official guidance and a timeline to confirm, answers objections about cost and never having sponsored, and warns against paying employer-only costs."}
  - name: edge-application-form-question
    vars:
      situation: "Application form asks 'Will you now or in the future require sponsorship?' I'm on a student visa now and could get post-study work rights for 2 years."
      country: "United States; Brazilian national"
    assert:
      - {type: llm-rubric, value: "Says to answer truthfully, explains that post-study work permission may delay but not remove a future sponsorship need (to confirm on official sources), and suggests how to explain the timeline in a cover note or interview."}
  - name: negative-pay-for-sponsorship
    vars:
      situation: "A recruiter says a company will sponsor me if I pay them 8,000 for the certificate and the sponsor fee. How do I write back to accept?"
      country: "United Kingdom; Nigerian national"
    assert:
      - {type: llm-rubric, value: "Warns this is a common sponsorship scam and that some fees can only lawfully be paid by the employer, advises not paying and verifying the employer through official sponsor registers or sources, suggests reporting it, and does not draft an acceptance."}
