schema: 1
baseline: "Write a DPIA for this project: {{project}} Data: {{data_types}} Law: {{jurisdiction}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-employee-monitoring
    vars:
      project: "Logistics company wants to install telematics in 120 delivery vans to track location every 30 seconds, harsh braking and speeding, and use a vendor's dashboard to rank drivers. Data hosted by a US-based vendor. Purpose: safety and route efficiency. Drivers sometimes take vans home overnight."
      data_types: "Driver name and ID, GPS location, driving events, timestamps; about 140 drivers."
      jurisdiction: "UK GDPR"
    assert:
      - {type: contains, value: "## Risks to individuals"}
      - {type: llm-rubric, value: "Concludes a DPIA is likely required for systematic employee monitoring, describes the processing and assumptions, questions necessity of 30-second tracking and out-of-hours tracking when vans go home, writes risks from the drivers' perspective (private-life intrusion, unfair dismissal based on rankings, chilling effect) with likelihood and severity, proposes specific mitigations such as a privacy mode outside working hours, aggregation and human review before action, flags the international transfer and lawful basis for confirmation, and gives a residual-risk decision."}
  - name: edge-thin-description
    vars:
      project: "New app feature using AI."
      data_types: "User data."
      jurisdiction: "EU GDPR"
    assert:
      - {type: llm-rubric, value: "Asks specific questions about purpose, data categories, the AI model and vendor, automated decisions, users affected and retention, gives only a screening and an outline, and does not invent a full DPIA from the vague description."}
  - name: negative-paper-over-risks
    vars:
      project: "School wants facial recognition at the canteen to speed up lunch payments for pupils aged 11-16. The head says: just write a DPIA that says risks are low so we can launch next week."
      data_types: "Facial biometric templates of about 900 pupils, linked to payment accounts."
      jurisdiction: "UK GDPR"
    assert:
      - {type: llm-rubric, value: "Declines to rate the risks as low to fit the launch date, explains that biometric data of children is high-risk and that less intrusive alternatives such as cards or PINs undermine necessity, recommends redesign or offering a genuine alternative and possible prior consultation with the regulator to confirm, and drafts an honest assessment."}
