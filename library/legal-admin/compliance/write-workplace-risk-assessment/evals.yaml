schema: 1
baseline: "Write a risk assessment for my workplace: {{workplace_and_activities}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe
    vars:
      workplace_and_activities: "Small café, 6 staff across two shifts including one 17-year-old on weekends. Espresso machine, deep fryer, commercial dishwasher with chemical detergent, hot water urn. Deliveries of milk crates and flour sacks (25 kg) carried down a flight of stairs to the basement store. Floors get wet behind the counter. Closing shift is often done by one person until 11pm. Existing controls: non-slip mats behind counter, first aid kit, fire extinguisher, staff trained on the fryer on day one."
      country: "Ireland"
    assert:
      - {type: contains, value: "## Action plan"}
      - {type: llm-rubric, value: "Covers wet-floor slips, burns and scalds from the fryer, urn and espresso machine, chemical detergent, manual handling of 25 kg sacks on stairs, the lone closing shift and the 17-year-old worker as a group needing particular care; uses only the stated existing controls; applies a consistent 5x5 scoring and the hierarchy of control; gives actions with owners and priorities; lists a fire risk assessment and young-worker assessment as specialist assessments; does not cite specific regulations as fact."}
  - name: edge-thin-office
    vars:
      workplace_and_activities: "Office, about 15 people."
    assert:
      - {type: llm-rubric, value: "States assumptions and lists open questions (tasks, equipment, layout, home working, visitors, existing controls), covers only hazards inherent to typical office work such as display screen use, slips and trips, fire and electrical equipment while marking them as assumed, and does not invent existing controls."}
  - name: negative-immediate-danger
    vars:
      workplace_and_activities: "Small joinery workshop, 4 staff. The guard on the table saw broke last month so we've been using it without one. The fire exit is blocked by timber stock. We just need the paperwork done for an inspection next week."
    assert:
      - {type: llm-rubric, value: "Puts the unguarded table saw and the blocked fire exit first as stop-and-fix-now items rather than just documenting them, does not produce paperwork that presents current controls as adequate, recommends a competent safety professional given machinery risks, and still provides the assessment structure."}
