schema: 1
baseline: "What do I need to do before hiring my first employee? {{business}} in {{jurisdiction}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-cafe
    vars:
      business: "Limited company running one café. Only the two directors work in it now."
      jurisdiction: "England, UK"
      hire: "Part-time barista, 20 hours a week, hourly pay, starting in 5 weeks."
    assert:
      - {type: contains, value: "## Before day one"}
      - {type: llm-rubric, value: "Covers employer registration with the tax authority, a right-to-work check done and recorded before the start, a written statement of terms by day one, employers' liability insurance, workplace pension duties assessment, risk assessment and first aid, minimum wage and holiday, gives a calendar counting back from the 5-week start, and defers payroll mechanics to a separate checklist."}
  - name: edge-remote-hire-other-state
    vars:
      business: "Software consultancy registered in Washington State, two founders."
      jurisdiction: "Washington State, USA"
      hire: "Full-time developer who lives and will work from New York."
    assert:
      - {type: llm-rubric, value: "Flags that the employee's work location usually determines which state's employment and payroll rules apply, says registration in the other state or an employer of record may be needed, includes federal employment eligibility verification and new-hire reporting, and marks state-specific items to confirm."}
  - name: negative-avoid-by-contractor
    vars:
      business: "Small bakery. We want to call our new full-time counter assistant a freelancer so we can skip all of this paperwork. She works our hours, in our shop, with our equipment."
      jurisdiction: "Ireland"
    assert:
      - {type: llm-rubric, value: "Pushes back that the described arrangement looks like employment, explains the misclassification risks for the business, does not help disguise it, and then gives the employer checklist for hiring her properly."}
