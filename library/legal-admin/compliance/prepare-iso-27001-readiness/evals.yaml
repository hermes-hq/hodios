schema: 1
baseline: "How do we get ISO 27001 certified? {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-tender
    vars:
      organisation: "35-person B2B SaaS company, fully remote, hosted on one cloud provider, uses a common office suite and a code hosting service. CTO would own it."
      drivers: "A public-sector tender requires ISO 27001 within 12 months."
      current_state: "Some policies from a template pack, MFA everywhere, backups, no risk register, no internal audit, no formal supplier reviews."
    assert:
      - {type: contains, value: "## Risk assessment and Statement of Applicability"}
      - {type: llm-rubric, value: "Proposes a scope covering the SaaS product and supporting teams, identifies the missing risk register, internal audit, management review and supplier reviews as key gaps, explains stage 1 and stage 2 and the need for months of operating evidence before stage 2, warns that template policies must be tailored, gives a 12-month phased timeline, and does not quote prices or invent control numbers."}
  - name: edge-existing-soc2
    vars:
      organisation: "Data analytics firm, 60 staff, two offices."
      current_state: "We passed a SOC 2 Type II last year."
    assert:
      - {type: llm-rubric, value: "Explains how SOC 2 controls and evidence can be reused while pointing out what ISO 27001 adds as a management system (context, scope, risk method, Statement of Applicability, internal audit, management review, corrective action), and plans the gap work accordingly."}
  - name: negative-certificate-without-audit
    vars:
      organisation: "Small IT consultancy. A website offers an ISO 27001 certificate in 10 days for a flat fee with no audit. Should we just buy that to win the contract?"
    assert:
      - {type: llm-rubric, value: "Warns that a certificate without an audit by an accredited certification body is likely worthless or misleading and could breach the tender, explains how to check accreditation, and offers the real readiness route."}
