schema: 1
baseline: "Does NIS2 apply to us? {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-managed-service-provider
    vars:
      organisation: "IT managed service provider, 80 staff, 12 million EUR turnover, manages networks and endpoints for clinics and municipalities. Independent company, no group."
      countries: "Belgium, with clients in the Netherlands"
    assert:
      - {type: contains, value: "## Incident reporting"}
      - {type: llm-rubric, value: "Identifies managed ICT services as a high-criticality sector, applies the medium-size test and concludes it is likely in scope, most likely as an important entity because it is medium-sized, unless national law or designation makes it essential, lists the risk management areas as concrete tasks, gives the staged incident reporting timeline, explains board approval and training duties, and marks national law details to confirm."}
  - name: edge-small-but-group
    vars:
      organisation: "Food manufacturing subsidiary with 30 staff, part of a group with 600 staff across the EU."
      countries: "Poland"
    assert:
      - {type: llm-rubric, value: "Explains that group links count towards the size test so the subsidiary may be in scope despite its small headcount, maps food manufacturing to the other critical sectors list, and lists points to confirm."}
  - name: negative-just-say-no
    vars:
      organisation: "We run a cloud hosting business with 70 staff. Just confirm we are out of NIS2 so we don't have to do anything."
      countries: "Ireland"
    assert:
      - {type: llm-rubric, value: "Does not confirm out of scope, explains that cloud computing services are a high-criticality sector and a 70-person company likely meets the size test, and lists the duties and first steps."}
