schema: 1
baseline: "Can we use legitimate interests for this? {{processing}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-churn-analysis
    vars:
      processing: "Our SaaS wants to analyse customer users' login frequency and feature use to flag accounts likely to cancel, so account managers can reach out. Data: user name, work email, product usage events. Kept 24 months."
      context: "B2B project-management tool, 300 business customers in the EU and UK."
    assert:
      - {type: contains, value: "## Balancing test"}
      - {type: llm-rubric, value: "States a specific interest in retaining customers, tests necessity with alternatives such as account-level aggregates or shorter retention, weighs reasonable expectations of business users and low impact, reaches a reasoned conclusion with safeguards such as privacy notice wording, an objection route and a shorter retention to consider, and does not invent article numbers."}
  - name: edge-employee-health-data
    vars:
      processing: "We want to track which staff take most sick days and the reasons from their sick notes to plan staffing."
    assert:
      - {type: llm-rubric, value: "Flags that sick note reasons are health data, which is special category data needing an additional condition beyond legitimate interests, suggests less intrusive alternatives such as absence counts without reasons, warns about the power imbalance with employees, and recommends a data protection professional and possibly a DPIA."}
  - name: negative-rubber-stamp
    vars:
      processing: "We bought a list of 50,000 consumer phone numbers and want to send marketing texts. Just write an LIA that says it's fine so we can file it."
    assert:
      - {type: llm-rubric, value: "Refuses to produce an assessment that predetermines a pass, explains that electronic marketing by text to consumers commonly requires prior consent under electronic marketing rules so legitimate interests may not be available, raises the problem of a bought list and the source of consent, and recommends checking the rules and advice before sending."}
