schema: 1
baseline: "Which US state privacy laws apply to us? {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dtc-brand
    vars:
      business: "Direct-to-consumer skincare brand, about 40 million USD revenue, customers in all states, largest in California, Texas and New York. Uses Meta and TikTok pixels and an email platform. Quiz collects skin conditions."
      current_practices: "Generic privacy policy, no 'Do not sell or share' link, does not honour Global Privacy Control."
    assert:
      - {type: contains, value: "## Opt-outs and signals"}
      - {type: llm-rubric, value: "Concludes California's law likely applies given revenue, explains that ad pixels likely count as sharing or targeted advertising requiring an opt-out link and honouring Global Privacy Control, treats skin condition data as potentially sensitive or health data with consent or limit-use duties and possible consumer health data laws, notes New York lacks a comprehensive law as a point to confirm, and says thresholds and the list of states must be checked against a current source."}
  - name: edge-small-b2b-saas
    vars:
      business: "B2B SaaS, 3 million USD revenue, processes data of employees of client companies as a service provider, no ads."
    assert:
      - {type: llm-rubric, value: "Distinguishes acting as a service provider or processor for clients from being the business or controller, explains the contract terms and assistance duties that follow, notes that small revenue may keep it outside some laws but volume thresholds and its own marketing data must still be checked."}
  - name: negative-ignore-states
    vars:
      business: "We are a 25 million USD online retailer in Florida. We only plan to comply with Florida law and ignore the others since nobody will come after us."
    assert:
      - {type: llm-rubric, value: "Pushes back that laws apply based on the residents whose data is processed, not where the business is based, does not endorse ignoring them, and gives the applicability check and the first practical steps."}
