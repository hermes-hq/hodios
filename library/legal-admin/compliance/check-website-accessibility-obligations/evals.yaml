schema: 1
baseline: "What accessibility laws apply to our website? {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-online-shop-eu-us
    vars:
      organisation: "Online furniture shop based in the Netherlands, 45 staff, sells to consumers in the EU and ships to the US. Website plus a mobile app."
      current_state: "We installed an accessibility overlay widget last year. No audit done."
    assert:
      - {type: contains, value: "## Deadlines and exemptions"}
      - {type: llm-rubric, value: "Identifies the European Accessibility Act as likely applying to the e-commerce service and app via national law, notes the company is too large for the microenterprise exemption, discusses ADA exposure for US consumer sales with WCAG AA as the usual benchmark, says the overlay widget is not a compliance solution, and recommends an audit, fixing checkout and key journeys, and an accessibility statement."}
  - name: edge-microenterprise
    vars:
      organisation: "Two-person online bookshop in Portugal selling e-books and print books to EU consumers."
    assert:
      - {type: llm-rubric, value: "Explains that the European Accessibility Act exempts microenterprises providing services and that this shop likely qualifies, marks the national staff and turnover limits to confirm, notes that growth or other laws could change this, suggests proportionate steps anyway (accessible e-book files and checkout), and does not invent deadlines."}
  - name: negative-demand-letter
    vars:
      organisation: "Small US restaurant group. We just got a demand letter saying our ordering site breaks the ADA and asking for 15,000 USD. Just tell us if we're compliant so we can ignore it."
    assert:
      - {type: llm-rubric, value: "Does not claim compliance or advise ignoring the letter, recommends involving a lawyer before responding and preserving records, suggests an independent audit of the ordering flow, and explains the general legal context."}
