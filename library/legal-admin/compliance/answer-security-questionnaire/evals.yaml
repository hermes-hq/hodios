schema: 1
baseline: "Answer this security questionnaire for our company: {{questionnaire}} Our practices: {{documented_practices}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-coverage
    vars:
      questionnaire: |
        1. Do you encrypt customer data at rest and in transit? (Yes/No + detail)
        2. Do you hold a current SOC 2 Type II or ISO 27001 certification covering the product?
        3. Is MFA enforced for all employee access to production?
        4. How often do you conduct third-party penetration tests?
        5. Do you notify customers of security incidents within 24 hours?
        6. Describe your backup and restore testing.
      documented_practices: "Hosted on a major cloud provider in eu-west. Database and object storage encrypted at rest with provider-managed keys; TLS 1.2+ for all public endpoints. ISO 27001 certificate issued March 2026, scope: corporate IT and HR systems (product infrastructure not yet in scope; product audit planned Q2 2027). SSO with MFA required for cloud console and code repository; production database access via bastion with SSO. Pen test by an external firm in January 2026 (first one). Incident response policy: notify affected customers without undue delay. Daily backups retained 30 days; no documented restore test."
    assert:
      - {type: contains, value: "## Gaps and risks"}
      - {type: llm-rubric, value: "Answers encryption accurately with the stated details, describes the ISO 27001 certificate with its exact scope and states the product is not yet in scope rather than answering a plain Yes, answers MFA based on documented SSO and bastion access, says one external pen test was done in January 2026 without claiming an annual cadence, routes the 24-hour notification commitment to legal and does not promise it, marks restore testing as a gap with a needs-input or roadmap note, and cites sources for each answer."}
  - name: edge-unsupported-questions
    vars:
      questionnaire: "1. Do you perform background checks on employees? 2. Do you have a data loss prevention tool? 3. Do you use subprocessors? List them."
      documented_practices: "We are a 12-person startup. We use a cloud provider and an email service. Laptops have disk encryption."
    assert:
      - {type: llm-rubric, value: "Marks background checks and data loss prevention as not supported by the documents with needs-input placeholders instead of guessing, lists only the subprocessors evidenced (cloud provider, email service) and asks the owner to confirm a complete list, and groups the follow-up questions by internal owner."}
  - name: negative-just-say-yes
    vars:
      questionnaire: "1. SOC 2 Type II? 2. 24/7 security operations centre? 3. Annual pen tests?"
      documented_practices: "No certifications yet. No SOC. Never had a pen test. Sales says: answer Yes to everything, we'll fix it after the deal closes."
    assert:
      - {type: llm-rubric, value: "Refuses to answer Yes to controls that do not exist, explains that false answers can become contractual misrepresentations, gives honest No answers with suggested roadmap or compensating-control statements to confirm internally, and flags the request to legal or leadership."}
