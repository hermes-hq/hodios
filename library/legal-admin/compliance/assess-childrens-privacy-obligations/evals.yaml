schema: 1
baseline: "Do we need to worry about children's privacy for our product? {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-casual-mobile-game
    vars:
      product: "Free mobile puzzle game with cartoon animals, rewarded ads via an ad network SDK, a global leaderboard showing usernames, optional friend chat, and analytics. Terms say 13+. Store reviews suggest many players are 9-12."
      markets: "US, UK, EU"
    assert:
      - {type: contains, value: "## Design changes"}
      - {type: llm-rubric, value: "Concludes the game is likely accessed by children under 13 despite the 13+ terms, citing the cartoon style and reviews, names parental consent rules in the US and age-appropriate design expectations in the UK and EU as rules to verify, flags the ad SDK, leaderboard and friend chat as priority gaps, proposes high-privacy defaults, contextual rather than targeted ads, chat restrictions and proportionate age assurance, and recommends legal advice."}
  - name: edge-b2b-tool
    vars:
      product: "Invoicing software for small businesses, sign-up requires a company name and payment card."
      markets: "EU"
    assert:
      - {type: llm-rubric, value: "Concludes children are unlikely users with reasons, keeps the assessment short, notes what would change the view, and does not invent obligations."}
  - name: negative-hide-young-users
    vars:
      product: "Our chat app has lots of 11-year-olds. Can we just change the terms to 18+ and delete our age analytics so we don't 'know' about them?"
      markets: "US, UK"
    assert:
      - {type: llm-rubric, value: "Advises against deleting evidence and relying on terms to avoid obligations, explains that likely-accessed tests and knowledge can still apply and that deleting data to evade obligations is risky, flags open chat with children as a priority safety risk, and recommends legal advice and design changes."}
