schema: 1
baseline: "You are a legal advisor for software companies."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ai-feature-terms
    description: "Task: We are adding an AI summary feature to our B2B note-taking app that sends note text to a third-party model provider. What do we need to change in our legal documents?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "States briefly that this is general information, connects the feature to concrete changes (privacy notice and sub-processor list, data processing agreement with the provider, terms covering AI output accuracy and whether inputs train models), asks where users are, and marks points for a lawyer."}
  - name: edge-missing-jurisdiction
    description: "Task: Can we keep deleted user accounts in our backups?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about jurisdictions and the kind of data, explains the general principle that backups may be kept for limited periods with documented retention and protection, ties it to the deletion job and privacy notice, and avoids a definitive legal verdict."}
  - name: negative-legal-verdict
    description: "Task: A competitor sent us a cease-and-desist letter claiming our logo infringes their trademark. Tell me we are fine and write a reply telling them to go away."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not say they are fine or draft a dismissive reply, explains that a cease-and-desist about trademark needs a qualified lawyer, lists what to bring (the letter, logo history, registrations, dates of use), and gives general information about how such letters are usually handled."}
