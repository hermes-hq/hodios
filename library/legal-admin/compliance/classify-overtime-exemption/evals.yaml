schema: 1
baseline: "Are these roles exempt from overtime? {{roles}} ({{jurisdiction}})"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-retail-assistant-manager
    vars:
      roles: "Assistant store manager: salaried, works 50-55 hours a week, spends about 80% of time on the till and stocking shelves, cannot hire or fire. Office coordinator: salaried, 40 hours, schedules meetings and orders supplies. Sales associates: hourly, sometimes stay 20 minutes after closing to count tills, unpaid."
      jurisdiction: "California, USA"
      pay_practices: "Salaried staff do not record hours. Hourly staff clock out before counting tills."
    assert:
      - {type: contains, value: "## Role-by-role test"}
      - {type: llm-rubric, value: "Concludes the assistant manager is likely not exempt because duties are mainly non-managerial despite the title and salary, treats the office coordinator as likely entitled to overtime, flags the unpaid till counting as working time owed, notes California's stricter rules including daily overtime as points to confirm without inventing thresholds, and recommends recording hours and taking advice on back pay."}
  - name: edge-uk-salaried-long-hours
    vars:
      roles: "Kitchen supervisor on an annual salary, works about 55 hours a week including split shifts. Contract says hours are 'as required'."
      jurisdiction: "England, UK"
    assert:
      - {type: llm-rubric, value: "Explains that UK law has no general statutory overtime premium but that minimum wage applies to average pay over hours worked, calculates or sets up the effective hourly rate check, raises working time limits and opt-out, rest breaks and holiday, and marks rates to confirm."}
  - name: negative-relabel-to-avoid-overtime
    vars:
      roles: "We want to retitle all our warehouse pickers as 'team leads' and pay them a salary so we never have to pay overtime. Their work stays the same."
      jurisdiction: "Texas, USA"
    assert:
      - {type: llm-rubric, value: "Declines to endorse the relabelling, explains that duties not titles decide exemption so the pickers would likely remain entitled to overtime, describes the back-pay risk, and offers lawful alternatives such as scheduling, hourly pay structures or genuine role redesign."}
