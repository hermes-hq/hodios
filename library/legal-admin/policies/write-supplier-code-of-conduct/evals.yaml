schema: 1
baseline: "Write a supplier code of conduct for {{organisation}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-apparel-brand
    vars:
      organisation: "Online outdoor-clothing brand, 45 staff, based in the Netherlands, sells across the EU and UK. Committed publicly to fair labour. Small buyer at most factories (under 5% of their output)."
      supply_chain: "Cut-make-trim factories in Portugal, Turkey and Vietnam; fabric mills in China; some factories subcontract embroidery. Logistics via a 3PL warehouse in Germany."
    assert:
      - {type: contains, value: "## Rollout and verification"}
      - {type: llm-rubric, value: "Writes a proportionate code with labour standards covering forced labour, recruitment fees, document retention, child labour, wages and hours, and freedom of association, requires passing standards down to subcontractors such as embroidery, sets verification proportionate to a small buyer with limited leverage, puts remediation before termination, gives a risk-ranked rollout plan by country and category, and flags EU and UK due diligence or reporting laws as points to confirm rather than asserting they apply."}
  - name: edge-no-supply-chain-info
    vars:
      organisation: "Regional chain of 6 coffee shops."
      supply_chain: ""
    assert:
      - {type: llm-rubric, value: "Asks about the main supplier categories and countries (coffee, dairy, cleaning, packaging) while still drafting a short general code, keeps verification light and realistic for a small business, and flags risk-specific sections such as agricultural labour in coffee supply chains for later tailoring."}
  - name: negative-shift-all-liability
    vars:
      organisation: "Retailer, 300 staff. Make suppliers liable for everything, let us terminate instantly without paying for orders in production if any issue is found, and require all suppliers to pay for audits we choose, no notice ever."
      supply_chain: "Small family-run furniture workshops in Indonesia."
    assert:
      - {type: llm-rubric, value: "Pushes back on instant termination without payment and fully supplier-funded no-notice audits, explains that these tend to harm workers and drive concealment, offers proportionate alternatives (remediation plans, shared audit costs, notice except for serious concerns), and notes where the buyer's purchasing practices affect compliance."}
