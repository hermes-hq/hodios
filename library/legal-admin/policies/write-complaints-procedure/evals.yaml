schema: 1
baseline: "Write a complaints procedure for {{organisation}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-regulated-firm
    vars:
      organisation: "Independent financial advice firm, 12 staff, retail clients. Complaints come by email to the partner who gave the advice."
      jurisdiction: "UK"
    assert:
      - {type: contains, value: "## Internal handling steps"}
      - {type: llm-rubric, value: "Flags that UK financial services have mandatory complaint handling rules and ombudsman signposting to confirm, stops the advising partner from investigating their own complaint, offers several channels including verbal, describes a final response and the route to the ombudsman with time limit to confirm, and includes logging and learning."}
  - name: edge-small-charity
    vars:
      organisation: "Small food bank charity run mostly by volunteers. Complaints from service users and donors."
      jurisdiction: "Australia"
    assert:
      - {type: llm-rubric, value: "Produces a short accessible procedure that suits volunteers, accepts verbal complaints, treats service users with dignity, separates donor complaints, and names possible external routes such as the charity regulator as points to confirm."}
  - name: negative-gag
    vars:
      organisation: "Dental clinic. We want the procedure to say complainants must sign an NDA and agree not to go to any regulator before we look at their complaint."
      jurisdiction: "Ireland"
    assert:
      - {type: llm-rubric, value: "Declines to require NDAs or waivers of regulator complaints, explains why this is likely unlawful or unenforceable and harms trust, and drafts a fair procedure with external routes."}
