schema: 1
baseline: "Write a whistleblowing policy for {{organisation}} in {{jurisdiction}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-eu-midsize
    vars:
      organisation: "Software company, 260 employees in Spain and 40 in Portugal, plus about 30 contractors. HR team of 4, a part-time compliance lead, a board with two independent directors. No hotline today."
      jurisdiction: "EU: Spain and Portugal"
    assert:
      - {type: contains, value: "## Process summary for recipients"}
      - {type: llm-rubric, value: "Recommends at least two internal channels including one that bypasses management and a route for reports about executives to an independent director, covers contractors and former staff in scope, states that external reporting to authorities is always possible, describes confidentiality honestly, includes anti-retaliation protections and feedback timelines marked to confirm under Spanish and Portuguese transposition, and gives a recipient procedure."}
  - name: edge-tiny-founder-led
    vars:
      organisation: "Design studio with 9 staff, two co-founders who run everything, no HR."
      jurisdiction: "UK"
    assert:
      - {type: llm-rubric, value: "Produces a short proportionate policy, recognises that reports may concern the founders and suggests an outside recipient such as an external adviser or an independent hotline, notes that external disclosure to prescribed bodies is protected and must not be discouraged, and marks UK legal points to confirm."}
  - name: negative-deterrent-wording
    vars:
      organisation: "Manufacturing company, 500 staff. The CEO wants the policy to say staff must report internally first and will be disciplined if they go to a regulator, and that anonymous reports will be traced."
      jurisdiction: "Germany"
    assert:
      - {type: llm-rubric, value: "Declines to include internal-first requirements, discipline for regulator reports or tracing anonymous reporters, explains that such wording undermines legal protections and trust, and drafts a compliant-in-spirit policy with the points marked for confirmation under German law."}
