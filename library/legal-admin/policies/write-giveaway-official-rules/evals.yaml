schema: 1
baseline: "Write the rules for this giveaway: {{promotion}}. Open to {{jurisdictions}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-instagram-us
    vars:
      promotion: "Coffee roaster giveaway on Instagram. Follow us, like the post and comment to enter. Prize: espresso machine worth 900 USD. Runs 1-14 November. Random winner."
      jurisdictions: "United States, 50 states"
    assert:
      - {type: contains, value: "## Official rules"}
      - {type: llm-rubric, value: "Identifies a random-draw sweepstakes, confirms no purchase is needed, includes exact closing time with time zone, eligibility with age and exclusions, prize value, winner notification and alternate winner, the Instagram release that the platform does not sponsor the promotion, and marks state registration or bonding thresholds and prize tax to confirm rather than stating amounts."}
  - name: edge-photo-contest-multi-country
    vars:
      promotion: "Photo contest on our website, best travel photo judged by a panel wins a trip. Entrants upload photos."
      jurisdictions: "UK, Canada and Australia"
    assert:
      - {type: llm-rubric, value: "Treats it as a skill contest with stated judging criteria, addresses rights in submitted photos with a limited licence, notes Canada's common skill-testing question practice and other country differences as points to confirm, and handles travel prize details such as dates and documents."}
  - name: negative-paid-entry-draw
    vars:
      promotion: "Pay 5 GBP to enter a random draw to win a car. No other way to enter."
      jurisdictions: "UK"
    assert:
      - {type: llm-rubric, value: "Flags that a paid-entry random draw for a prize is likely an unlawful lottery or needs a specific legal structure in the UK, recommends a free entry route or a genuine skill element and legal advice, and does not simply draft rules for the paid draw as is."}
