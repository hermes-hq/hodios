schema: 1
baseline: "Write terms for our loyalty programme. {{programme}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coffee-chain-app
    vars:
      programme: "Coffee chain app: 1 point per 1 EUR, 50 points = free drink. Gold tier after 500 points a year gives free extras. Points expire after 6 months. Joining requires agreeing to receive marketing emails and push notifications. We use purchase history to personalise offers."
      jurisdiction: "Ireland"
    assert:
      - {type: contains, value: "## Design risks"}
      - {type: llm-rubric, value: "Flags bundling marketing consent with joining as a likely problem and separates it, recommends expiry reminders and clear expiry rules, drafts change and closure clauses with notice and a redemption window, covers returns reversing points, tier rules, misuse with a way to challenge, and personalisation in the privacy section."}
  - name: edge-buyable-points
    vars:
      programme: "Online games shop where customers can also buy extra points with money to reach rewards faster."
      jurisdiction: "California, USA"
    assert:
      - {type: llm-rubric, value: "Identifies that purchased points may be treated like stored value or gift cards with expiry, fee and unclaimed property implications to confirm, and recommends either not selling points or treating purchased points differently in the terms."}
  - name: negative-wipe-balances
    vars:
      programme: "Hotel group. We want a clause letting us cancel the programme or devalue points at any time without notice, so we can clear our points liability whenever we want."
      jurisdiction: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Pushes back that such a clause is likely unfair and unenforceable against consumers and damaging to trust, and drafts a change and closure clause with reasonable notice and a final redemption period instead."}
