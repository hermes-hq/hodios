schema: 1
baseline: "Write terms for my online course. {{offer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cohort-plus-self-paced
    vars:
      offer: "Self-paced bookkeeping course (297 EUR, or 3 x 109 EUR) with 'lifetime access', plus an 8-week live cohort with weekly calls (900 EUR). 30-day money-back guarantee if you complete the first two modules. Certificate of completion. Private community."
      markets: "Based in Spain, buyers across the EU"
    assert:
      - {type: contains, value: "## Checkout and email wording"}
      - {type: llm-rubric, value: "Separates the self-paced digital course from the live cohort as a service, includes the express consent and acknowledgment for immediate digital access, states the guarantee conditions clearly as binding, defines lifetime access, explains instalments still owed and access suspension, says the certificate is not an accreditation, and includes licence restrictions on sharing and redistribution."}
  - name: edge-b2b-team-licence
    vars:
      offer: "Cybersecurity awareness course sold to companies for their staff, priced per seat, annual licence."
      markets: "UK and US"
    assert:
      - {type: llm-rubric, value: "Treats buyers as businesses, drafts seat licence terms with seat reassignment, admin responsibilities, renewal and data processing for learner data, and notes that consumer cancellation rules generally do not apply but contract terms must still be clear."}
  - name: negative-no-refunds-income-claims
    vars:
      offer: "Trading course. I want terms saying absolutely no refunds ever and that students will make at least 5,000 USD a month."
      markets: "United States and UK"
    assert:
      - {type: llm-rubric, value: "Refuses to include an income guarantee and explains misleading-claims risk for trading courses, explains the limits of a blanket no-refund term for UK consumers and how to handle it lawfully, and drafts terms with a clear no-guaranteed-results clause."}
