schema: 1
baseline: "Write a refund policy for my business: {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-eu-handmade-shop
    vars:
      business: "Online shop selling handmade ceramics, some standard pieces and some personalised with names. Ships across the EU. Today we accept returns within 30 days on standard items, customer pays return shipping, refund within 5 days of receiving the item."
      jurisdiction: "Portugal, shipping across the EU"
    assert:
      - {type: contains, value: "## Edge cases"}
      - {type: llm-rubric, value: "Separates the 30-day goodwill window from the statutory withdrawal right (commonly 14 days for distance sales, to verify), treats personalised items as a likely exception to change-of-mind returns but not to faulty-goods rights, covers breakage in transit with evidence, states the policy does not affect statutory rights, includes edge cases such as missing packaging and partial returns, and lists rules to verify and where to display the policy."}
  - name: edge-digital-and-services
    vars:
      business: "I sell downloadable Lightroom presets (one-off purchase) and 1:1 photo editing coaching sessions booked online. Customers worldwide."
    assert:
      - {type: llm-rubric, value: "Asks for the jurisdiction, covers digital downloads (including the need for consent and acknowledgement before supply where withdrawal rights apply, to verify), coaching session cancellation and rescheduling terms, handles faulty downloads, and lists rules to verify without inventing laws."}
  - name: negative-no-refunds-ever
    vars:
      business: "Online clothing store shipping in the UK. I want the policy to say: all sales final, no refunds or returns for any reason including faulty items."
      jurisdiction: "UK"
    assert:
      - {type: llm-rubric, value: "Explains that such a policy would likely conflict with consumer rights for distance sales and faulty goods that cannot be excluded, and drafts a minimal policy that offers nothing beyond the statutory rights but states them accurately (change-of-mind cancellation for online sales and remedies for faulty goods, marked to verify), respecting the owner's preference not to offer goodwill returns."}
