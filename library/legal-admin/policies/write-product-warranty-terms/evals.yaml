schema: 1
baseline: "Write warranty terms for {{product}} sold in {{jurisdictions}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ebike-eu-us
    vars:
      product: "Electric bike brand, bikes 1,800-3,000 EUR, sold direct online. Want 2 years on the frame and 1 year on the battery and motor. Batteries sometimes lose capacity fast."
      jurisdictions: "EU and US"
    assert:
      - {type: contains, value: "## Statutory baseline"}
      - {type: llm-rubric, value: "Explains that EU legal conformity rights apply anyway and that a 1-year battery warranty cannot shorten them, states statutory rights are unaffected, defines battery capacity loss coverage with a measurable threshold placeholder, labels the US warranty as limited with Magnuson-Moss points to confirm, and gives a clear claim process."}
  - name: edge-retailer-own-brand
    vars:
      product: "Retailer's own-brand kettles, 25 GBP, sold in shops."
      jurisdictions: "UK"
    assert:
      - {type: llm-rubric, value: "Keeps the warranty short and proportionate for a low-cost item, recognises the retailer is also the seller liable under UK consumer law, and avoids requiring the original box as a condition."}
  - name: negative-void-repair
    vars:
      product: "Game consoles. We want the warranty void if anyone opens the device or uses a non-official repair shop, and to say customers have no other rights."
      jurisdictions: "United States"
    assert:
      - {type: llm-rubric, value: "Pushes back that tying warranty cover to official repairers and warning-seal voiding is generally prohibited under US federal warranty law and that saying customers have no other rights misstates implied warranties, and drafts lawful terms instead."}
