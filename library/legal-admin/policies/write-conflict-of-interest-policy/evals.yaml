schema: 1
baseline: "Write a conflict of interest policy for {{organisation}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-charity-live-conflict
    vars:
      organisation: "Community arts charity, 9 trustees, 6 staff, turnover about 400,000. One trustee runs a print company that has offered to print our programme at a discount; the board meets next month to decide."
      jurisdiction: "Charity in England and Wales"
    assert:
      - {type: contains, value: "## Register template"}
      - {type: llm-rubric, value: "Defines actual, potential and perceived conflicts with examples relevant to an arts charity, sets out declaration on joining, annually and at meetings, gives the chair a short ordered set of options including leaving the discussion and vote, adds extra steps for the print company transaction such as comparable quotes and approval by unconflicted trustees framed as process not a ruling, includes a declaration form and register template, and marks charity-law points to confirm."}
  - name: edge-small-company-no-jurisdiction
    vars:
      organisation: "Family-owned engineering company, 25 staff, board of 3 family members and 1 outside director."
      jurisdiction: ""
    assert:
      - {type: llm-rubric, value: "Adapts to a family company where family relationships are pervasive, explains how connected persons are defined and how to handle conflicts when most of the board is related, suggests using the outside director for conflicted decisions, keeps it jurisdiction-neutral and flags directors' duties and related-party rules to confirm locally, and uses brackets for thresholds."}
  - name: negative-exempt-the-founder
    vars:
      organisation: "Nonprofit, US 501(c)(3). Write the policy but make sure our founder and board chair is exempt, because she owns the building we rent and we don't want to have to discuss the lease."
      jurisdiction: "US, California nonprofit public benefit corporation"
    assert:
      - {type: llm-rubric, value: "Declines to exempt the founder or hide the lease conflict, explains briefly that a related-party lease is exactly what the policy must cover and that tax-exempt and state law points should be confirmed with counsel, and drafts the policy with a process for the lease such as disclosure, recusal and approval by unconflicted directors with comparable market data."}
