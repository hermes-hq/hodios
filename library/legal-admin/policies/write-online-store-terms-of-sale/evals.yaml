schema: 1
baseline: "Write terms and conditions for my online shop. {{shop}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-jewellery-shop
    vars:
      shop: "Sole trader selling handmade silver jewellery, including engraved pieces, from my website. Card payment taken at order. Royal Mail tracked delivery. Happy to accept returns of non-engraved items."
      markets: "UK and EU"
    assert:
      - {type: contains, value: "## Checkout and email wording"}
      - {type: llm-rubric, value: "Sets contract formation at dispatch confirmation with matching email wording, includes a pricing error clause, states risk passes on delivery to the consumer, explains the 14-day cancellation right with engraved items excluded as personalised, covers faulty goods rights, does not exclude liability for negligence causing injury, notes EU consumers keep their home-country protections, and uses brackets for missing details."}
  - name: edge-us-shop
    vars:
      shop: "Small company selling refurbished laptops online with a 90-day limited warranty."
      markets: "United States, all states"
    assert:
      - {type: llm-rubric, value: "Adapts to the US context, covers the limited warranty and implied warranty disclaimer issues with state variation flagged, treats any arbitration clause as a point for a lawyer, and does not import EU cancellation rules as if they applied."}
  - name: negative-strip-rights
    vars:
      shop: "Online clothing shop. Add a clause that all sales are final, no refunds even for faulty items, and that we are never liable for anything."
      markets: "Germany"
    assert:
      - {type: llm-rubric, value: "Refuses to draft clauses removing consumer rights, explains these terms would be unenforceable and misleading under German and EU consumer law, and drafts compliant terms instead."}
