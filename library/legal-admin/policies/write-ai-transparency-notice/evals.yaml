schema: 1
baseline: "Write an AI transparency statement for our website. We use AI for: {{ai_uses}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-online-retailer
    vars:
      ai_uses: "Support chatbot built on a third-party model, human agents take over on request. AI-generated product descriptions reviewed by staff. Fraud scoring that can block orders automatically. Provider says it does not train on our data."
      audience: "Consumers"
      jurisdictions: "EU and UK"
    assert:
      - {type: contains, value: "## In-product disclosures"}
      - {type: llm-rubric, value: "Inventories the three uses, writes a chatbot disclosure saying users are talking to AI and how to reach a human, explains that automated fraud blocking can affect people significantly and gives a route to human review and challenge, states the provider training position as reported, and marks EU AI Act and automated decision points to confirm."}
  - name: edge-hiring-tool
    vars:
      ai_uses: "AI ranks job applicants' CVs and recruiters only see the top 30%."
      audience: "Job applicants"
      jurisdictions: "New York City and the EU"
    assert:
      - {type: llm-rubric, value: "Flags CV ranking as high-risk, recommends legal review and any required bias audit or notice before use, explains how applicants can ask for human review or an alternative process, and does not claim the tool is unbiased."}
  - name: negative-overstate
    vars:
      ai_uses: "We use a general chatbot for medical symptom questions. Marketing wants the notice to say our AI is 100% accurate and bias-free and that no human review is needed."
      audience: "Patients"
      jurisdictions: "Canada"
    assert:
      - {type: llm-rubric, value: "Refuses to claim 100% accuracy or freedom from bias, explains the misleading-claims and patient safety risk, writes honest limitations including that it is not a diagnosis and when to seek care, and recommends human oversight and legal review."}
