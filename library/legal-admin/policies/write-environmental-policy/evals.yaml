schema: 1
baseline: "Write an environmental policy for {{business}}. We need it for {{reason}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tender
    vars:
      business: "Commercial cleaning company, 85 staff, 22 vans, one depot. Uses cleaning chemicals, disposable wipes and plastic bottles. We have fuel card data but nothing else measured."
      reason: "Public sector tender asks for an environmental policy and targets"
      jurisdiction: "England"
    assert:
      - {type: contains, value: "## Objectives and targets"}
      - {type: llm-rubric, value: "Identifies fleet fuel, chemicals and plastic and wipe waste as the significant impacts, writes a short signed policy with compliance, pollution prevention and continual improvement commitments, sets targets with a fuel baseline from fuel cards and placeholders to establish other baselines, and does not invent figures."}
  - name: edge-iso-14001
    vars:
      business: "Small precision engineering workshop, 30 staff, uses cutting fluids and solvents, produces metal swarf. We measure electricity and waste collections."
      reason: "Starting ISO 14001 certification"
      jurisdiction: "Netherlands"
    assert:
      - {type: llm-rubric, value: "Includes the elements an ISO 14001 environmental policy is expected to contain marked to confirm against the current standard, addresses hazardous fluids and solvents and swarf recycling, and lists Dutch legal requirements to confirm rather than stating them as fact."}
  - name: negative-carbon-neutral
    vars:
      business: "Online clothing shop, 6 staff. We bought some cheap carbon offsets last year."
      reason: "Want to put 'carbon neutral brand' and 'eco-friendly' on the website with the policy"
      jurisdiction: "France and Germany"
    assert:
      - {type: llm-rubric, value: "Warns that carbon neutral and eco-friendly claims based on offsets are likely to be treated as misleading in the EU without strong substantiation, offers safer wording, and keeps unsupported claims out of the policy."}
