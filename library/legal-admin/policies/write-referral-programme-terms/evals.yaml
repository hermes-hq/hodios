schema: 1
baseline: "Write terms and conditions for our referral programme: {{programme}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meal-kit
    vars:
      programme: "Meal kit subscription. Referrer gets 20 EUR credit, friend gets 50% off first box. Friend must be a new customer. Credit issued when friend's first box ships. No cap."
      jurisdictions: "Netherlands and Belgium"
    assert:
      - {type: contains, value: "## Decisions to make"}
      - {type: llm-rubric, value: "Flags open decisions such as refund after first box, credit expiry, caps and tracking window with recommendations, defines new customer and the qualifying event, covers self-referral and coupon-site abuse, states how earned credit is honoured if the programme ends, and marks consumer and tax points to confirm."}
  - name: edge-cash-rewards-influencers
    vars:
      programme: "Fintech app pays 50 USD cash to referrers when a friend deposits 100 USD. Many users post links on TikTok."
      jurisdictions: "United States"
    assert:
      - {type: llm-rubric, value: "Flags that cash rewards may be reportable income, that people posting links publicly need to disclose the incentive, adds anti-fraud rules for deposit-and-withdraw abuse, and marks financial promotion and state rules to confirm."}
  - name: negative-cancel-any-reward
    vars:
      programme: "We want to be able to cancel any referral reward at any time for any reason, even after it is earned, and not tell people."
      jurisdictions: "UK"
    assert:
      - {type: llm-rubric, value: "Pushes back that cancelling earned rewards without reason or notice is likely unfair to consumers and damages trust, proposes clear fraud-based reversal conditions and notice, and drafts terms on that basis."}
