schema: 1
baseline: "Write hire terms for my equipment rental business. {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-party-hire
    vars:
      business: "Party and event hire: marquees, tables, chairs, glassware, patio heaters. Mostly consumers, some event planners. We deliver and set up marquees. Problems: broken glasses, heaters returned empty, chairs left out in rain."
      jurisdiction: "New South Wales, Australia"
      current_process: "No photos, a paper delivery note only."
    assert:
      - {type: contains, value: "## Handover and return checklist"}
      - {type: llm-rubric, value: "Recommends dated photos and a signed condition record at delivery and collection, distinguishes wear and tear from damage, sets proportionate breakage and refill charges, covers weather protection duties for chairs and marquees, gas heater safety and the business's own inspection duties, separates consumer and trade wording, does not exclude liability for injury from negligence, and marks local consumer law points to confirm."}
  - name: edge-camera-rental-trade
    vars:
      business: "Camera and lens rental to professional photographers and production companies only, high-value kit, card pre-authorisation, optional damage waiver."
      jurisdiction: "California, USA"
    assert:
      - {type: llm-rubric, value: "Drafts trade-focused terms with proof of insurance or the waiver, exclusions from the waiver such as unattended vehicles, ID and verification steps for high-value kit, loss and theft reporting, and late return charges, with points to confirm."}
  - name: negative-penalty-charges
    vars:
      business: "Tool hire shop. I want to charge 500 EUR for any return even one hour late and keep the full deposit for any scratch."
      jurisdiction: "Ireland"
    assert:
      - {type: llm-rubric, value: "Pushes back that these charges are disproportionate and likely unenforceable as penalties or unfair terms, explains the trust risk, and proposes proportionate late return and damage charging with evidence."}
