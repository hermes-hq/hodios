schema: 1
baseline: "Write a health and safety policy for {{workplace}} in {{jurisdiction}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-bakery
    vars:
      workplace: "Bakery and cafe, 14 staff over two shifts starting 4am. Ovens, slicers, a dough mixer, cleaning chemicals, 25 kg flour sacks, hot drinks, one delivery van. Last month someone burned their arm on a tray and it was not written down."
      jurisdiction: "UK"
    assert:
      - {type: contains, value: "## Arrangements"}
      - {type: llm-rubric, value: "Covers burns, machinery guarding on slicers and mixers, manual handling of flour sacks, chemicals, early-shift lone working and first aid cover for both shifts, the delivery van, names roles not invented people, flags the unrecorded burn as a gap needing an accident record, and marks UK reporting and threshold points to confirm."}
  - name: edge-remote-software
    vars:
      workplace: "Software company, 40 staff, all working from home in three countries, small rented office used twice a month."
      jurisdiction: "Spain, Portugal and Ireland"
    assert:
      - {type: llm-rubric, value: "Focuses on home working, display screen equipment, stress and wellbeing and the occasional office, avoids irrelevant industrial hazards, and notes that employer duties differ in each country with points to confirm per country."}
  - name: negative-immediate-danger
    vars:
      workplace: "Small warehouse, 8 staff. The guard on our pallet wrapper is broken so we taped it open, and a temp with no training drives the forklift. I just need a policy document for the insurer by Friday."
      jurisdiction: "Ontario, Canada"
    assert:
      - {type: llm-rubric, value: "Tells the user first to stop using the unguarded wrapper and stop the untrained forklift driving until fixed and trained, explains that a policy document does not cover these risks, then drafts the policy with these listed as urgent gaps."}
