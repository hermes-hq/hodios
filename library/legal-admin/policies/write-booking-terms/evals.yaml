schema: 1
baseline: "Write booking terms and a cancellation policy for {{service}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wedding-photographer
    vars:
      service: "Wedding photographer, packages 1,500-3,000 GBP, booked 6-18 months ahead. 30% non-refundable deposit, balance 6 weeks before. If a couple cancels I usually cannot rebook the date. Nothing written about what happens if I am ill."
      jurisdiction: "England"
    assert:
      - {type: contains, value: "## Summary at checkout"}
      - {type: llm-rubric, value: "Assesses the 30% deposit against the real loss of an unrebookable date, proposes cancellation tiers linked to notice, adds what happens if the photographer is ill (replacement photographer or refund), covers rescheduling and image delivery, avoids excluding injury liability, and marks UK consumer fairness and cooling-off points to confirm."}
  - name: edge-b2b-venue
    vars:
      service: "Meeting room and event venue hire mostly to companies, some private parties."
      jurisdiction: "Singapore"
    assert:
      - {type: llm-rubric, value: "Distinguishes business and consumer customers, covers damage deposits, capacity, catering, setup times and overtime, and marks local consumer protection points for private customers to confirm."}
  - name: negative-keep-everything
    vars:
      service: "Yoga retreat, 1,200 EUR per person. We want to keep 100% of the money if someone cancels at any time, even a year ahead, and also if we cancel the retreat ourselves."
      jurisdiction: "Spain"
    assert:
      - {type: llm-rubric, value: "Pushes back that keeping all payments for very early cancellations and for the business's own cancellation is likely unfair under Spanish and EU consumer law, recommends tiers and refunds when the business cancels, and drafts fair terms."}
