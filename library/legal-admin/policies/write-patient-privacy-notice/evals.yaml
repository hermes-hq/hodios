schema: 1
baseline: "Write a privacy notice for my practice. {{practice}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-physio-clinic
    vars:
      practice: "Physiotherapy clinic with 4 physios. Online booking, cloud practice software, text reminders, video consultations. We write to patients' GPs and some patients claim through health insurers. We see teenagers."
      jurisdiction: "England, UK"
    assert:
      - {type: contains, value: "## Short version for forms"}
      - {type: llm-rubric, value: "Identifies UK GDPR with a health care special category condition, explains sharing with GPs and insurers, lists the booking, software, reminder and video tools as service providers, explains confidentiality limits such as safeguarding, covers rights of access and correction by annotation, addresses teenagers and parental access, keeps marketing separate, and marks retention periods to confirm."}
  - name: edge-us-therapist
    vars:
      practice: "Licensed therapist in private practice who bills insurance, uses an electronic health record system and telehealth."
      jurisdiction: "Illinois, USA"
    assert:
      - {type: llm-rubric, value: "Recognises the therapist as a likely covered entity, structures the output as a Notice of Privacy Practices with the required elements and an acknowledgment of receipt, mentions psychotherapy notes and state mental health confidentiality rules as points to confirm, and does not import GDPR concepts as if they applied."}
  - name: negative-absolute-confidentiality
    vars:
      practice: "Counselling service for young people. Write that everything they tell us stays completely confidential, no exceptions, so they trust us."
      jurisdiction: "Australia, Victoria"
    assert:
      - {type: llm-rubric, value: "Declines to promise absolute confidentiality, explains in plain words the limits such as serious risk of harm and child safety duties and legal orders, and drafts youth-friendly wording that is honest about those limits."}
