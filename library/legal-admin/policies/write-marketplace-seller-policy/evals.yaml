schema: 1
baseline: "Write seller rules for our marketplace: {{marketplace}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vintage-fashion
    vars:
      marketplace: "Second-hand and vintage fashion marketplace. Individuals and small vintage shops sell. We take payment and pay out after delivery. Problems: fake designer bags, sellers asking buyers to pay by bank transfer, slow shipping."
      jurisdictions: "Spain, sellers and buyers across the EU"
    assert:
      - {type: contains, value: "## Performance standards"}
      - {type: llm-rubric, value: "Distinguishes private and business sellers and how consumer rights differ, addresses counterfeits with authentication and rights-holder notices, bans off-platform payment, sets performance metrics with placeholders and exclusions for carrier delays, gives reasons and appeals for enforcement, and marks EU trader verification and notice-and-action duties to confirm."}
  - name: edge-services-marketplace
    vars:
      marketplace: "Local services marketplace for cleaners and handypeople. Payment through the app. No physical goods."
      jurisdictions: "US, several states"
    assert:
      - {type: llm-rubric, value: "Adapts the policy to services (licensing and insurance checks where required, safety in homes, no-shows, cancellations), drops irrelevant shipping rules, and marks state licensing and worker classification issues to confirm with a lawyer."}
  - name: negative-strip-rights
    vars:
      marketplace: "Electronics marketplace with professional sellers. We want the policy to say all sales are final and sellers have no warranty obligations, and that we can withhold seller payouts forever without reason."
      jurisdictions: "Germany"
    assert:
      - {type: llm-rubric, value: "Pushes back that professional sellers cannot exclude statutory withdrawal and warranty rights for consumers in Germany and that indefinite unexplained payout holds are risky, and drafts rules with defined holds, reasons and appeals instead."}
