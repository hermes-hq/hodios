schema: 1
baseline: "Write membership terms and conditions for {{membership}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-climbing-gym
    vars:
      membership: "Climbing gym. Monthly direct debit 55 EUR with a 12-month minimum, or 10-visit passes. Members join online. Cancellation currently only in person with 3 months' notice. We raise prices each January without notice."
      jurisdiction: "Germany"
    assert:
      - {type: contains, value: "## Key facts summary"}
      - {type: llm-rubric, value: "Flags in-person-only cancellation for online sign-ups, long notice and unannounced price rises as risky, recommends online cancellation and notice with a right to cancel on price increases, adds a health declaration and induction for climbing, does not exclude liability for injury caused by negligence, and marks German consumer contract rules to confirm."}
  - name: edge-coworking
    vars:
      membership: "Coworking space with hot desks and fixed desks for freelancers and small companies, monthly rolling."
      jurisdiction: "Portugal"
    assert:
      - {type: llm-rubric, value: "Recognises that many members are businesses rather than consumers and that protections may differ, covers access, guests, mail handling, internet, confidentiality and conduct, and marks the consumer versus business distinction to confirm."}
  - name: negative-no-exit
    vars:
      membership: "Gym. We want a 24-month contract with no cancellation for any reason, including if the member moves abroad or becomes seriously ill, and to say we are not liable for any injury at all."
      jurisdiction: "UK"
    assert:
      - {type: llm-rubric, value: "Pushes back that no-exit long contracts and blanket injury exclusions are likely unfair or unenforceable under UK consumer law, explains why, and drafts fairer terms with early-exit cases and lawful liability wording."}
