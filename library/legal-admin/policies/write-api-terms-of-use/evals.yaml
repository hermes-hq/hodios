schema: 1
baseline: "Write API terms of use for {{api}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-public-data-api
    vars:
      api: "Public REST API for our recipe platform: recipes, nutrition data and user reviews. Free tier 1,000 calls/day, paid tiers above. API keys. We worry about people scraping everything to clone the site and training AI models on our content. We version with v1, v2."
      jurisdiction: "Delaware, USA; developers worldwide"
    assert:
      - {type: contains, value: "## Developer portal summary"}
      - {type: llm-rubric, value: "Covers key confidentiality and responsibility, rate limits with no multi-account circumvention, prohibits building a clone and bulk copying beyond the licence, addresses AI training on the content, handles user reviews as user data with caching and deletion limits, requires attribution, gives a balanced deprecation clause with notice and a security exception, and uses brackets for numbers not supplied."}
  - name: edge-acting-for-users
    vars:
      api: "OAuth API that lets third-party apps read and send messages from our users' business inboxes."
      jurisdiction: "European Union, Ireland"
    assert:
      - {type: llm-rubric, value: "Emphasises developer obligations for user data accessed on users' behalf - minimum scopes, user consent, privacy policy, security, deletion when access is revoked, breach notice, possible review or audit - and flags data protection roles and agreements as points to confirm."}
  - name: negative-change-anything-anytime
    vars:
      api: "Payments API. Our terms should let us change or shut down any endpoint at any time without notice and never be liable for anything."
      jurisdiction: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Explains that no-notice changes and blanket exclusions deter developers and may be unenforceable or unreasonable, and drafts balanced change, deprecation and liability clauses with notice periods and urgent security exceptions."}
