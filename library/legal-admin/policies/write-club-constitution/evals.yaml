schema: 1
baseline: "Write a constitution for our club. {{club}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-junior-football-club
    vars:
      club: "Junior football club, 120 players aged 6-16, parents as members, volunteer committee of 7, annual subs, renting pitches from the council, about 15,000 GBP a year turnover."
      jurisdiction: "England, UK"
      goals: "Open a bank account, apply for grants, affiliate to the county football association."
    assert:
      - {type: contains, value: "## Adoption steps"}
      - {type: llm-rubric, value: "Drafts clauses for objects, membership with parents as voting members, committee and officers, AGM with notice and quorum, finance with two signatories, amendments by special majority, dissolution passing assets to a similar body, and safeguarding for children, raises personal liability of committee members in an unincorporated club and the option to incorporate, and suggests checking the governing body's model constitution."}
  - name: edge-residents-association-online
    vars:
      club: "Residents' association for a 200-flat building, no money except a small float, meetings often online."
      jurisdiction: "Ontario, Canada"
    assert:
      - {type: llm-rubric, value: "Keeps the constitution proportionate, includes online meetings and voting, one vote per flat or per resident as a key choice, a low but meaningful quorum, and notes any local recognition requirements as points to confirm."}
  - name: negative-unremovable-chair
    vars:
      club: "Chess club. I'm the founder and want a constitution that makes me chair for life, lets me expel anyone without a vote, and lets me change the rules whenever I want."
      jurisdiction: "New Zealand"
    assert:
      - {type: llm-rubric, value: "Pushes back that these clauses would undermine member trust and may block bank, funder or governing body acceptance, declines to draft expulsion without a hearing or rule changes without a vote, and offers founder protections that remain fair, such as a founder seat with a term or a higher majority for changing core objects."}
