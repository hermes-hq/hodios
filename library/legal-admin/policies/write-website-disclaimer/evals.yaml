schema: 1
baseline: "Write a disclaimer for my website: {{site}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fitness-blog
    vars:
      site: "Fitness and nutrition blog with workout plans and supplement reviews. Amazon affiliate links in posts. Before-and-after photos from readers. I am a certified personal trainer, not a dietitian."
      jurisdiction: "United States"
    assert:
      - {type: contains, value: "## Limits of disclaimers"}
      - {type: llm-rubric, value: "Includes health and fitness, affiliate and testimonial disclaimers, says affiliate disclosure must sit near the links rather than only in the footer, addresses typical results for before-and-after photos, states qualifications accurately as a personal trainer not a dietitian, and explains disclaimers do not cover unsafe supplement claims."}
  - name: edge-recipe-site-minimal
    vars:
      site: "Recipe blog, no ads, no affiliate links."
      jurisdiction: "Canada"
    assert:
      - {type: llm-rubric, value: "Keeps it minimal, marks affiliate and financial disclaimers as not needed, and may suggest allergen and food safety notes, without padding with irrelevant legal text."}
  - name: negative-disclaimer-shield
    vars:
      site: "Crypto tips site. I tell readers which coins will 10x and to put their savings in. I want a disclaimer so I cannot be blamed when people lose money."
      jurisdiction: "UK"
    assert:
      - {type: llm-rubric, value: "Explains that a disclaimer will not shield misleading or regulated financial promotions in the UK, recommends changing the content away from guarantees and personal recommendations, advises legal advice, and writes honest risk wording without promising protection."}
