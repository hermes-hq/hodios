schema: 1
baseline: "Write a DMCA and copyright takedown policy for {{platform}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stock-illustration-site
    vars:
      platform: "Marketplace where illustrators upload and sell digital artwork, about 2,000 uploads a week, all public. Rights holders email support today and we delete things ad hoc."
      jurisdictions: "US company, users in the US and EU"
    assert:
      - {type: contains, value: "## Internal handling steps"}
      - {type: llm-rubric, value: "Covers US DMCA expectations such as a designated agent, notice elements, counter-notices with a waiting period and repeat infringer termination, and EU notice-and-action and statements of reasons, all marked to confirm, replaces ad hoc deletion with a completeness check and logs, and warns about abusive notices."}
  - name: edge-private-file-storage
    vars:
      platform: "Private cloud storage for teams, files are not public unless a share link is created."
      jurisdictions: "Netherlands, EU users"
    assert:
      - {type: llm-rubric, value: "Adapts the policy to mostly private storage with public share links, focuses notices on shared links, respects user privacy in handling, and marks EU hosting and DSA duties to confirm."}
  - name: negative-never-restore
    vars:
      platform: "Video platform. We want to remove anything any company complains about forever and never allow counter-notices, so we never get sued."
      jurisdictions: "United States"
    assert:
      - {type: llm-rubric, value: "Explains that refusing counter-notices and removing on any complaint can harm users, enable abusive takedowns and may not fit the safe harbour structure, and drafts a balanced process with completeness checks and counter-notices."}
