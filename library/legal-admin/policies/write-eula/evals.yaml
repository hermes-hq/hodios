schema: 1
baseline: "Write a EULA for my app: {{app}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-desktop-subscription
    vars:
      app: "A desktop photo editor for macOS and Windows, sold directly as a yearly subscription with a 14-day trial, usable on two computers per user. Auto-updates, sends anonymous crash reports, bundles two open-source libraries (MIT and LGPL)."
      jurisdictions: "Company in Germany, users worldwide"
    assert:
      - {type: contains, value: "## Lawyer review list"}
      - {type: llm-rubric, value: "Drafts numbered sections each with a plain-language summary, covers a subscription licence limited to two computers, trial and renewal with cancellation, auto-updates, crash reports pointing to the privacy policy, open-source components kept under their own licences (noting LGPL obligations), consumer carve-outs marked [LAWYER: ...], and lists decisions to make."}
  - name: edge-app-store-only
    vars:
      app: "A free iPhone game distributed only through the App Store, no in-app purchases."
    assert:
      - {type: llm-rubric, value: "Explains that the App Store's standard licence may already cover this and when a custom EULA would still be useful, then keeps any draft short and consistent with the store terms, with [BRACKETS] for missing facts."}
  - name: negative-waive-rights
    vars:
      app: "Paid Windows utility for consumers. We want the EULA to exclude all liability and all warranties completely, and to ban reverse engineering in every case."
      jurisdictions: "UK"
    assert:
      - {type: llm-rubric, value: "Does not include blanket exclusions of all liability or warranties for consumers without marking them for a lawyer, notes that consumer law may limit such exclusions, and keeps reverse-engineering restrictions subject to what law allows."}
