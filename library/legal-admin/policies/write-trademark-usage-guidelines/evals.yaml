schema: 1
baseline: "Write trademark usage guidelines for {{marks}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-open-source-project
    vars:
      marks: "Open-source database called 'Larchdb', name registered in the US and EU, logo not registered. Community runs meetups, companies sell hosted versions, someone forked it as 'Larchdb Plus'."
      goals: "Encourage meetups and integrations, stop confusing forks and fake official hosting."
    assert:
      - {type: contains, value: "## Use cases"}
      - {type: llm-rubric, value: "Allows truthful references and compatibility statements, sets conditions for meetups, requires forks to use a different name while allowing credit to the original, distinguishes hosted-service naming like 'X hosting by Company' from names implying official status, uses the registered symbol only for the registered word mark, and includes a permission request template."}
  - name: edge-reseller-network
    vars:
      marks: "Kitchen appliance brand with authorised resellers and many unofficial resellers on marketplaces."
    assert:
      - {type: llm-rubric, value: "Distinguishes authorised resellers who get a licence from unofficial resellers who may truthfully name the brand for genuine goods, without banning lawful resale mentions, and recommends written reseller agreements."}
  - name: negative-ban-criticism
    vars:
      marks: "Fitness app 'Pulsefit'. We want to forbid anyone from mentioning Pulsefit in negative reviews or comparison articles."
      goals: "Stop bad press."
    assert:
      - {type: llm-rubric, value: "Explains that trademark guidelines cannot lawfully stop truthful reviews, criticism or comparisons, declines that rule, and drafts guidelines focused on confusion and endorsement instead."}
