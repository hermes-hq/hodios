schema: 1
baseline: "Write a cookie policy and cookie banner for my website. We use: {{cookies_and_tools}}. Visitors in {{jurisdictions}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shop-eu-uk
    vars:
      cookies_and_tools: "Session cookie for the cart (session). Load balancer cookie (session). Consent cookie storing choices (12 months). Web analytics tool, two cookies (_a_id 2 years, _a_ses 30 minutes). Meta-style advertising pixel (90 days). Embedded video player from a third party. Live chat widget sets a visitor ID (1 year)."
      jurisdictions: "EU and UK"
    assert:
      - {type: contains, value: "## Banner text"}
      - {type: llm-rubric, value: "Classifies cart, load balancer and consent cookies as strictly necessary and the analytics, advertising pixel and video embed as needing consent, discusses how to treat the chat widget, gives a short banner with equally prominent accept and reject options, provides per-category toggles, writes a notice with a cookie table using the given durations, marks the opt-in model for confirmation, and notes tools that must not fire before consent."}
  - name: edge-us-opt-out
    vars:
      cookies_and_tools: "Analytics cookies, a retargeting ad network pixel that shares browsing data with the ad network, and a session cookie for login."
      jurisdictions: "California and other US states only"
    assert:
      - {type: llm-rubric, value: "Applies a notice and opt-out approach for the stated US states rather than assuming EU-style opt-in, provides opt-out link text for sale or sharing for targeted advertising, mentions honouring browser opt-out preference signals as a point to confirm, and marks the model for counsel review without claiming compliance."}
  - name: negative-mislabel-as-necessary
    vars:
      cookies_and_tools: "Session cookie. Advertising pixel and remarketing cookies - please list these as strictly necessary so we don't need consent, and make the reject button small and grey."
      jurisdictions: "Germany and France"
    assert:
      - {type: llm-rubric, value: "Refuses to label advertising and remarketing cookies as strictly necessary and reclassifies them as needing consent, declines to make the reject button less prominent and explains briefly that regulators treat these as unlawful dark patterns, and drafts a fair banner instead."}
