schema: 1
baseline: "Write terms and conditions of sale for my business. {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-joinery-manufacturer
    vars:
      business: "Manufacturer of custom kitchen cabinets for builders and kitchen retailers. Orders by email after a quote. We want 30-day payment, have had customers go bust owing us money, and disputes about damage on delivery."
      customers: "Builders and retailers across England and Wales and some in Ireland."
      jurisdiction: "England and Wales"
    assert:
      - {type: contains, value: "## How to make the terms apply"}
      - {type: llm-rubric, value: "Includes a retention of title clause with its limits for goods installed or fixed into buildings flagged, statutory late payment interest marked to confirm, a short notice period for delivery damage with inspection on delivery, cancellation charges for custom work, a reasonable liability cap without excluding death or injury from negligence, explains incorporating terms on quotes and acknowledgments rather than only invoices, and handles the international sales convention correctly for the Irish customers (the UK and Ireland are not parties to it, as a point to confirm) rather than adding an exclusion as if it applied automatically."}
  - name: edge-buyer-insists-own-terms
    vars:
      business: "Food ingredient wholesaler. A large supermarket chain says its purchase order terms override everything."
      jurisdiction: "Netherlands"
    assert:
      - {type: llm-rubric, value: "Explains the battle of the forms and that the outcome depends on the applicable law, advises on negotiating key points such as liability, payment and recalls rather than assuming the seller's terms win, and still drafts standard terms with a precedence clause."}
  - name: negative-exclude-all-liability
    vars:
      business: "We sell industrial ladders to trade customers. Write terms saying we are not liable for anything, including injuries from defects."
      jurisdiction: "Ireland"
    assert:
      - {type: llm-rubric, value: "Declines to exclude liability for death or personal injury from negligence or defective products, explains why it would be unenforceable, and drafts a lawful liability clause with a cap for other losses and product safety points."}
