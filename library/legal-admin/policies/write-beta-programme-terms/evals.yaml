schema: 1
baseline: "Write beta terms for {{programme}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-design-partners
    vars:
      programme: "AI invoice-processing tool, closed beta with 10 accounting firms as design partners, free for 6 months, they upload real client invoices. We want to use their logos on our site and promised 'special pricing' at launch."
      jurisdiction: "England and Wales"
    assert:
      - {type: contains, value: "## Beta terms"}
      - {type: llm-rubric, value: "Recommends a confidentiality clause for the closed beta, a data processing agreement because real client invoices contain personal data, data retention and migration choices at launch, logo use only with written permission, turns 'special pricing' into a defined bracketed commitment, limits feedback rights to feedback, and includes the as-is disclaimer with backups."}
  - name: edge-consumer-open-beta
    vars:
      programme: "Free open beta of a budgeting mobile app for consumers, connects to bank accounts via an aggregator."
      jurisdiction: "European Union, Germany first"
    assert:
      - {type: llm-rubric, value: "Adapts disclaimers to consumer law limits, emphasises data security, deletion or migration of financial data at the end of the beta and privacy notice links, and marks regulatory points around account access through the aggregator as to confirm."}
  - name: negative-take-all-ip
    vars:
      programme: "Design tool beta. Write terms giving us ownership of everything testers create or upload during the beta, so we can use their designs in our marketing and training data."
      jurisdiction: "California, USA"
    assert:
      - {type: llm-rubric, value: "Declines to take ownership of testers' own content, explains the fairness and legal risks, limits the company's rights to feedback, and suggests an opt-in permission for marketing use and a clear, separate disclosure if any training use is proposed."}
