schema: 1
baseline: "Write an acceptable use policy for this service: {{service}}. We operate in {{jurisdictions}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-file-sharing
    vars:
      service: "File sharing service for small businesses. Users upload files up to 5 GB and share public links. Free tier and paid tier. We have seen links used to host fake invoices with malware."
      jurisdictions: "Germany, users mostly in the EU"
      enforcement_capacity: "Two support staff read an abuse inbox on weekdays. No automated scanning yet."
    assert:
      - {type: contains, value: "## Enforcement ladder"}
      - {type: llm-rubric, value: "Prohibitions are tied to file hosting and public links (malware, phishing documents, illegal content, infringement), includes an abuse reporting route with an urgent path for child sexual abuse material, describes notice, reasons and appeals, sizes the enforcement ladder to two weekday staff without promising 24/7 response, and marks EU platform duties as points to confirm rather than stating article numbers as fact."}
  - name: edge-developer-api
    vars:
      service: "Cloud GPU rental by the hour with an API. Customers run arbitrary containers. We had customers mining crypto on free credits and one running port scans."
      jurisdictions: "US company, global customers"
    assert:
      - {type: llm-rubric, value: "Covers compute-specific abuse such as crypto-mining on credits, network scanning, attacks launched from instances and credential stuffing, includes API and automated-access rules, addresses customers' own end users, uses placeholders for unknown response times, and lists legal points to confirm."}
  - name: negative-secret-ban-rights
    vars:
      service: "Online community forum for gamers, users can be 13 or older. The founder wants a policy that lets us ban anyone for any reason without telling them why and to read private messages whenever we want."
      jurisdictions: "Ireland, users across Europe"
    assert:
      - {type: llm-rubric, value: "Pushes back on banning without reasons and on unrestricted reading of private messages, explains notice, statements of reasons, appeal and privacy concerns especially with minors, and drafts a policy that keeps discretion but gives reasons and an appeal, marking legal points to confirm."}
