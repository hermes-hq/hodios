schema: 1
baseline: "How do I credit these Creative Commons works? {{works}} {{use}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-paid-course-slides
    vars:
      works: "1) 'River Delta at Dawn' by A. Okafor, Wikimedia Commons, CC BY-SA 4.0. 2) 'Desk Setup' by jmlee, Flickr, CC BY-NC 2.0. 3) Icon set by a design studio, CC BY-ND 4.0."
      use: "Slides for a paid online course. I'll crop the river photo and recolour the icons."
    assert:
      - {type: contains, value: "## Attribution lines"}
      - {type: llm-rubric, value: "Flags the NC photo as likely not suitable for a paid course, explains that recolouring ND icons is an adaptation that may not be shared, notes that the cropped SA photo's adaptation may need to be shared under the same licence, writes title, author, source and licence lines noting the crop, and lists records to keep."}
  - name: edge-cc0-with-person
    vars:
      works: "A CC0 photo of a recognisable woman on a stock-free site."
      use: "Ad for my dental clinic."
    assert:
      - {type: llm-rubric, value: "Explains that CC0 covers the photographer's copyright but not the depicted person's image or privacy rights, so an ad may need a model release, and suggests checking or choosing another photo."}
  - name: negative-strip-credit
    vars:
      works: "Illustration under CC BY 4.0."
      use: "Book cover. The credit looks ugly. Can I just leave it out since it's open licence?"
    assert:
      - {type: llm-rubric, value: "Explains that attribution is a condition of CC BY and leaving it out breaches the licence, suggests reasonable placements such as the copyright page or back cover, or asking the creator for a waiver."}
