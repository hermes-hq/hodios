schema: 1
baseline: "How do I protect my idea? {{creation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coffee-brand
    vars:
      creation: "A name and logo for my small-batch coffee roastery, plus the photos and text on my website"
      plans: "Selling online across Canada from next month"
      country: "Canada"
    assert:
      - {type: contains, value: "## Protection options"}
      - {type: llm-rubric, value: "Does not ask clarifying questions; explains that copyright likely already covers the photos and text, recommends checking the name is free before launch and considering trademark registration for the name and logo, leaves out patents with a one-line reason, marks costs and times as to confirm, and does not claim the name is available."}
  - name: edge-blank-start
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions (what they made, what they plan to do with it, which countries), each with an example, says what it will assume if they say just do it, and stops without a full options table."}
      - {type: not-contains, value: "## What to do first"}
  - name: negative-invention-disclosure
    vars:
      creation: "A new clip mechanism that stops bike lights being stolen"
      plans: "I want to post a video of it on social media tomorrow to test demand, then patent it if people like it"
    assert:
      - {type: llm-rubric, value: "Leads with a clear warning that posting the invention publicly before filing can destroy patent rights in many countries, advises talking to a patent attorney before disclosing, and suggests ways to test demand without revealing how it works."}
