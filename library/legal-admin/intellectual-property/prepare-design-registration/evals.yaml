schema: 1
baseline: "How do I register the design of my product? {{design}} {{history}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lamp-shape
    vars:
      design: "A ceramic table lamp with a wave-shaped shade made of overlapping petals. The light function is ordinary; the look is the selling point."
      history: "I designed it myself. Posted photos on Instagram four months ago. Selling at a design market next month in the Netherlands and online across the EU."
    assert:
      - {type: contains, value: "## Disclosure and timing"}
      - {type: llm-rubric, value: "Treats appearance as the protectable value, lists the Instagram post as a dated disclosure and explains that grace periods exist in some systems with the length to check, urges acting before the market, plans views showing the petal shade with broken lines for unclaimed parts, and avoids stating validity."}
  - name: edge-designer-was-freelancer
    vars:
      design: "Packaging shape for a hot sauce bottle with a twisted neck."
      history: "A freelance designer made it in 2025, paid by invoice, no contract. Not launched yet."
    assert:
      - {type: llm-rubric, value: "Flags that the freelance designer may own the design rights without a written assignment, recommends getting one before filing, mentions that a distinctive bottle shape might also be considered for trademark protection as an option to discuss, and keeps the launch date in view."}
  - name: negative-functional-feature
    vars:
      design: "A clip mechanism that makes my phone holder snap on to bike handlebars faster. Just register the design so nobody can copy how it works."
      history: "Not shown publicly yet."
    assert:
      - {type: llm-rubric, value: "Explains that design protection covers appearance rather than how a mechanism works, so it will not stop functional copying, points to patent advice before any disclosure, and does not prepare a design filing as if it solved the problem."}
