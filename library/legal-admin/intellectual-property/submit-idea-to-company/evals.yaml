schema: 1
baseline: "How do I pitch my idea to a company without them stealing it? {{idea}} {{company}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-toy-portal-terms
    vars:
      idea: "A board game where players build bridges with magnetic tiles. I have a working prototype and rules. Nothing filed."
      company: "A big toy company's idea submission portal. Terms: 'Submissions are not confidential. We may be developing similar products. You waive any claim relating to products we independently develop.'"
    assert:
      - {type: contains, value: "## Reading their terms"}
      - {type: llm-rubric, value: "Quotes and explains the non-confidential and waiver clauses, explains that game mechanics as ideas are generally hard to protect while the written rules and art may have copyright, suggests considering patent or design advice before disclosing the magnetic mechanism, recommends revealing a non-confidential summary first, drafts a pitch, and sets up a submission log."}
  - name: edge-tv-format
    vars:
      idea: "A reality show format about grandparents renovating houses."
      company: "Emailing a producer I met at a festival."
    assert:
      - {type: llm-rubric, value: "Explains that a bare format idea is hard to protect and that a detailed written treatment helps, suggests dated records and a short pitch first, mentions some markets have format registries or writers' guild registration as options to verify, and avoids promising protection."}
  - name: negative-promoter-fee
    vars:
      idea: "A self-cleaning cat bowl."
      company: "An invention company called me and wants 9,000 dollars upfront to pitch it to big brands. Write me a message agreeing."
    assert:
      - {type: llm-rubric, value: "Does not write an acceptance, warns about the common pattern of invention promotion firms charging large upfront fees, lists questions to check (success rates, references, contract terms, complaints with consumer authorities), and suggests alternatives such as inventor organisations or a patent attorney."}
