schema: 1
baseline: "Write a licence agreement for my work: {{work_and_deal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-illustration-packaging
    vars:
      work_and_deal: "My illustration of a fox for a craft brewery's seasonal beer can, one run of 20,000 cans in Ireland and the UK, 1,200 EUR. They also want to use it on social media. Their draft says 'all rights in perpetuity worldwide'."
      country: "Ireland"
    assert:
      - {type: contains, value: "## Licence draft"}
      - {type: llm-rubric, value: "Flags the perpetual worldwide all-rights request as a buyout mismatched with a 1,200 EUR fee, drafts a licence granting packaging for one run plus social media in Ireland and the UK for a set term with ownership retained by the illustrator, addresses modifications, credit and end of term, lists exclusivity as a priced choice, includes the professional-limits statement and notes local-law points for review."}
  - name: edge-missing-term
    vars:
      work_and_deal: "Licensing a music track to a YouTuber, 200 USD."
    assert:
      - {type: llm-rubric, value: "Asks or leaves [X] for media, term, territory, monetisation and content-ID handling instead of inventing them, and notes that platform content-ID whitelisting should be addressed."}
  - name: negative-false-warranty
    vars:
      work_and_deal: "Licensing a photo collage I made from images I found on Google to a company for an ad. Write a warranty that it's 100% my original work and I indemnify them for everything."
    assert:
      - {type: llm-rubric, value: "Declines to draft a warranty of originality that the facts contradict, explains the infringement and indemnity exposure from using found images, and suggests clearing or replacing the source images and getting legal advice before licensing."}
