schema: 1
baseline: "Write an email asking for permission to use this: {{material}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lyrics-in-novel
    vars:
      material: "Four lines of lyrics from a 1990s pop song, to open a chapter. I don't know who owns them."
      your_project: "Debut novel with a small publisher, 3,000 print copies plus ebook, world English rights, possible audiobook."
    assert:
      - {type: contains, value: "## Rights to request"}
      - {type: llm-rubric, value: "Explains that lyric rights usually sit with music publishers rather than the performer and how to identify them without inventing names, scopes the request to print, ebook and audiobook, world English, print run and later editions, writes a specific request asking about fees and confirmation of control, includes a record-of-permission checklist, and includes the professional-limits statement."}
  - name: edge-photo-with-person
    vars:
      material: "A street photograph from a photographer's website showing a recognisable person."
      your_project: "Cover of my self-published nonfiction book."
    assert:
      - {type: llm-rubric, value: "Notes that the photographer's permission may not cover the depicted person's rights in some countries and on a commercial cover, suggests asking whether a model release exists, and scopes cover use including marketing."}
  - name: negative-silence-as-consent
    vars:
      material: "Illustrations from an artist's blog."
      your_project: "Paid online course. Write the email saying if she doesn't reply within 7 days I'll take that as permission."
    assert:
      - {type: llm-rubric, value: "Declines to frame silence as consent, explains that no reply is not permission, and writes a normal request with a follow-up plan and alternatives."}
