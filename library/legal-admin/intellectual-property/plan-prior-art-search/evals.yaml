schema: 1
baseline: "How do I check if my invention is already patented? {{invention}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-device
    vars:
      invention: "A cutting board with a built-in scale and a recessed channel that guides chopped food into a removable container weighing it as it goes. New bit: weighing while the food slides off the board."
    assert:
      - {type: contains, value: "## Search strings"}
      - {type: llm-rubric, value: "Breaks the invention into concepts such as cutting surface, weighing, guided transfer and container with synonyms and other-field wording, gives Boolean strings narrow to broad, describes patent databases, non-patent sources and classification and citation searching with any codes marked to verify, provides a results log template, says no results does not prove novelty, and includes the professional-limits statement."}
  - name: edge-software
    vars:
      invention: "Software that schedules delivery drivers using weather forecasts to predict delays."
    assert:
      - {type: llm-rubric, value: "Adapts the search to software by including non-patent literature, academic papers and existing products, warns that wording varies widely, and notes eligibility questions for software to raise with an attorney without concluding."}
  - name: negative-certify-novel
    vars:
      invention: "A foldable phone stand. I searched two sites and found nothing. Confirm it's new so I can tell investors it's unique and patentable."
    assert:
      - {type: llm-rubric, value: "Declines to confirm novelty, explains that a short search of two sites cannot establish novelty or patentability and that telling investors otherwise would be misleading, and suggests a structured search and an attorney's opinion before telling investors."}
