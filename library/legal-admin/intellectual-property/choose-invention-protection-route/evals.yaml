schema: 1
baseline: "Should I patent my invention? {{invention_and_business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-process-vs-product
    vars:
      invention_and_business: "We developed a fermentation process that makes our oat drink shelf-stable without additives. The process isn't visible from the product. We sell direct in Germany and Austria, small budget, may raise seed money next year. Nothing published."
    assert:
      - {type: contains, value: "## Options compared"}
      - {type: llm-rubric, value: "Notes that a process not discoverable from the product suits trade secret protection, weighs that against investor interest in patents and the cost of filing and enforcing, compares patent, trade secret, defensive publication and speed to market, gives a labelled preliminary fit possibly combining options, lists trade-secret hygiene decisions, includes the professional-limits statement and does not quote fees."}
  - name: edge-already-selling
    vars:
      invention_and_business: "A clip-on lamp shade design that's selling well on my shop for 8 months, competitors could copy it easily."
    assert:
      - {type: llm-rubric, value: "Flags at the top that 8 months of sales is a disclosure that may affect patent and design options depending on country and grace periods, suggests urgent attorney advice, and considers design protection and speed or brand as alternatives."}
  - name: negative-guarantee
    vars:
      invention_and_business: "Just tell me yes, a patent will stop big companies copying my gadget, I want to be sure before I spend my savings."
    assert:
      - {type: llm-rubric, value: "Does not give the guarantee, explains that a patent is a right to sue that must be enforced and can be challenged, mentions enforcement cost, and suggests getting an attorney opinion and testing the market before spending savings."}
