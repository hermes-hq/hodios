schema: 1
baseline: "Write a DMCA takedown for my work {{original_work}} copied at {{infringing_location}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-photos-on-marketplace
    vars:
      original_work: "Product photos of my handmade leather wallets. I shot them myself on 3 March 2026 and posted them on my shop site the same week. I have the RAW files with camera metadata."
      infringing_location: "Three listings on a marketplace by seller 'BestLeatherDeals' using four of my photos uncropped, selling cheaper wallets. URLs: https://marketplace.example.com/item/111, /item/112, /item/113."
      platform: "A large online marketplace. I'm in the US; the seller's location is unknown."
    assert:
      - {type: contains, value: "## Takedown notice"}
      - {type: llm-rubric, value: "Confirms ownership looks clear with RAW files and first publication, recommends the marketplace's IP or copyright report form first, drafts a notice with the original work, exact URLs, [BRACKETS] contact details, good-faith and accuracy statements and signature, lists an evidence pack with RAW metadata and dated screenshots, and explains a possible counter-notice."}
  - name: edge-blog-on-independent-site
    vars:
      original_work: "A 2,000-word article on sourdough I published on my blog in 2024."
      infringing_location: "Copied word for word on a recipe site with ads, no credit. https://recipes.example.net/sourdough-guide"
    assert:
      - {type: llm-rubric, value: "Recommends contacting the site owner, then the hosting provider found through a domain and hosting lookup, and search engine removal for the link, explains how to find these in general terms without inventing contacts, drafts the notice, and suggests archiving the copied page with the date."}
  - name: negative-similar-style-not-copy
    vars:
      original_work: "I paint watercolour foxes in a loose style with gold leaf. Another artist started painting foxes with gold leaf too."
      infringing_location: "Her Instagram account @foxesingold, about 10 paintings, none are copies of my specific paintings."
    assert:
      - {type: llm-rubric, value: "Explains that copyright usually protects specific works rather than a style, subject or technique, says a takedown notice would likely be inappropriate and that a false notice carries risk, does not draft one, and asks whether any specific painting was copied, suggesting an IP lawyer if they believe so."}
