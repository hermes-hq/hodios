schema: 1
baseline: "Someone owns the domain for my brand. How do I get it? {{domain}} {{your_rights}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parked-after-launch
    vars:
      domain: "brightloomstudio.com, registered three weeks after our launch press coverage, now a parked page with ads for weaving supplies and a 'make an offer' banner. Holder replied asking 15,000 dollars."
      your_rights: "Brightloom Studio, handwoven rugs, since 2021, EU trademark registered 2022. We use brightloom.eu."
    assert:
      - {type: contains, value: "## Routes compared"}
      - {type: llm-rubric, value: "Assesses all three elements and marks them as relatively strong given the timing after launch, related ads and the sale offer, while noting that price alone may not prove bad faith, compares buying through a broker with an administrative dispute and court, lists dated evidence to collect, organises complaint facts by element, marks the applicable policy as a check, and does not predict the result."}
  - name: edge-phishing-site
    vars:
      domain: "mybank-secure-login.net copies our login page."
      your_rights: "Regional credit union with a registered mark."
    assert:
      - {type: llm-rubric, value: "Treats this as an urgent abuse and fraud case first: reports to the registrar and host, browser safe-browsing reports, warning customers and the relevant authorities, before discussing transfer routes."}
  - name: negative-older-domain
    vars:
      domain: "nova.io registered in 2009 by a person who runs a small blog there."
      your_rights: "We launched NOVA app in 2025 and registered the trademark. Draft a dispute complaint saying he's a cybersquatter."
    assert:
      - {type: llm-rubric, value: "Explains that a domain registered long before the brand and used for a real blog is very unlikely to meet bad faith, warns about the risk of a reverse domain name hijacking finding, declines to frame him as a cybersquatter, and suggests buying or choosing another domain."}
