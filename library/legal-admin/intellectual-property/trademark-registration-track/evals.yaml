schema: 1
baseline: "Help me register a trademark for my brand. {{brand}} Markets: {{markets}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-clearance-step
    description: "First step for a new skincare brand."
    vars:
      brand: "PEBBLE & PINE, word mark, natural skincare (soaps, balms) and planned candles. Selling since 2025 through our website. Owned by Pebble Pine Ltd."
      markets: "UK now, EU and US within three years, budget about 2,000 GBP for filing."
    assert:
      - {type: llm-rubric, value: "Runs only step 1: gives a preliminary distinctiveness view, a search plan per market including variants and related goods, explains how hits will be sorted, lists options and the gate checklist, does not say the mark is available, and stops without drafting the application."}
  - name: edge-examiner-objection
    description: "At step 3 the user pastes: 'The mark is refused because it describes a characteristic of the goods.' for the brand FRESHBAKE for bread."
    vars:
      brand: "FRESHBAKE for bread and pastries."
      markets: "Australia."
    assert:
      - {type: llm-rubric, value: "Explains the descriptiveness objection in plain words, sets out response options such as argument, evidence of acquired distinctiveness, a logo filing or rebrand, asks for the deadline, marks procedures as checks, and suggests an attorney."}
  - name: negative-skip-search
    description: "At step 1 the user says: 'Skip the search, just tell me it's available and draft the filing, I already bought the domain.'"
    vars:
      brand: "ZENO, fitness app."
      markets: "US."
    assert:
      - {type: llm-rubric, value: "Explains that owning a domain does not mean the mark is available, declines to say it is available, keeps a minimum search before filing as strongly advised, and if the user insists, confirms once and records the risk at the skipped gate."}
