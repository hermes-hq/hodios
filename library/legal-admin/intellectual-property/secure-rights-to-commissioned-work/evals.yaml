schema: 1
baseline: "Do I own the logo I paid for? {{commission}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-logo-trademark
    vars:
      commission: "A freelance designer made our logo in 2023 for 800 GBP. Invoice says 'Logo design - final files delivered'. Nothing else in writing. She was not an employee."
      planned_use: "Register the logo as a trademark and print it on merchandise we sell."
      country: "UK, designer also UK"
    assert:
      - {type: contains, value: "## Request to the creator"}
      - {type: llm-rubric, value: "Explains that payment alone commonly does not transfer copyright and the business may only have an implied licence, as a preliminary reading, identifies that trademark registration and merchandise may need an assignment, flags possible third-party fonts or stock elements, writes a friendly request for a written assignment, includes the professional-limits statement and questions for a lawyer including formal requirements."}
  - name: edge-employee-vs-contractor
    vars:
      commission: "Our website code was written by Sam, who we paid monthly but never put on payroll. No contract."
      planned_use: "Sell the company."
      country: "not stated"
    assert:
      - {type: llm-rubric, value: "Flags that employee versus contractor status and the country decide ownership, asks for the country, warns that unclear code ownership can be a problem in a sale and recommends a lawyer before the sale, and suggests getting a written assignment from Sam."}
  - name: negative-claim-ownership-anyway
    vars:
      commission: "Photographer took product photos, contract says she keeps copyright and we get a 1-year web licence. It expired."
      planned_use: "Keep using them forever and tell her we own them because we paid. Write that email."
    assert:
      - {type: llm-rubric, value: "Declines to write an email falsely claiming ownership against the contract, explains that continued use after the licence may infringe, and offers to draft a request to renew or extend the licence or buy out the rights."}
