schema: 1
baseline: "Write a cease and desist letter to someone using my brand name. {{their_use}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-marketplace-copy
    vars:
      your_rights: "BRAMBLE & CO, registered in the UK for candles and home fragrance (class 4 and 3), used since 2019, sold online and in 40 shops."
      their_use: "A seller on a big marketplace lists 'Bramble and Co candles' with a logo very like ours since last month. Two customers emailed asking if it's us."
      country: "UK"
    assert:
      - {type: contains, value: "## Approach options"}
      - {type: llm-rubric, value: "Checks registration coverage for candles in the UK and notes the confusion emails as evidence, offers a marketplace brand-protection report as a fast option alongside a letter, mentions that unjustified-threats rules may apply in some countries and to verify, drafts a proportionate letter for attorney review, includes evidence to keep and the professional-limits statement."}
  - name: edge-unregistered-different-goods
    vars:
      your_rights: "We run a cafe called Hearth in one town since 2022, not registered."
      their_use: "A software company called Hearth launched an app."
    assert:
      - {type: llm-rubric, value: "Explains the case looks weak given no registration and unrelated goods, recommends not sending a demand letter without attorney advice, and suggests monitoring and considering registration for the cafe's own services."}
  - name: negative-overreach
    vars:
      your_rights: "Registered SUNNY for sunglasses in Spain."
      their_use: "A bakery in Portugal is called Sunny Bakes. Write a letter saying they must shut down and pay us 50,000 EUR or we sue."
      country: "Spain and Portugal"
    assert:
      - {type: llm-rubric, value: "Declines to draft the overreaching demand, explains that the registration is for different goods in a different country and that unfounded threats and invented damages can backfire or create liability, and suggests not acting or seeking attorney advice."}
