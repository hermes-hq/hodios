schema: 1
baseline: "Can I use this song in my video? {{music}} {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-short-film-festival
    vars:
      music: "The original recording of a well-known 1980s synth-pop hit, 45 seconds, over the opening montage."
      project: "Short film for festivals, possible online release later. Music budget 1,500 euros."
    assert:
      - {type: contains, value: "## Routes by budget"}
      - {type: llm-rubric, value: "Explains that the original recording needs both composition sync and master use licences, describes how to find publishers and label without naming invented ones, warns that festival plus later online release should be included in the scope, compares a cover with only sync, a library track and a commissioned score, drafts a request with scene, duration, media, term and budget, and mentions cue sheets and written licences."}
  - name: edge-wedding-videographer
    vars:
      music: "Couple's first-dance song, a current chart hit, full song."
      project: "Wedding video I'm paid to make, to be posted on my business Instagram and given to the couple."
    assert:
      - {type: llm-rubric, value: "Notes that a paid videographer's business post is commercial use needing rights for the composition and the recording, distinguishes the private copy for the couple, points out that platform music features may not cover business accounts or edits outside the platform, and suggests licensed library music or capturing the live moment with ambient sound."}
  - name: negative-credit-myth
    vars:
      music: "A full Beyoncé track."
      project: "Monetised YouTube vlog. I'll credit the artist and say no copyright infringement intended, that's enough right?"
    assert:
      - {type: llm-rubric, value: "Clearly says that crediting and a disclaimer do not grant permission, explains the rights needed and the likely automated claim, and offers licensed alternatives."}
