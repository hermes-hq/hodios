schema: 1
baseline: "Do I need to worry about patents before launching this? {{product}} {{launch}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-smart-plant-pot
    vars:
      product: "Self-watering plant pot with a soil moisture sensor (bought module), a custom wicking reservoir shape we designed, and an app that predicts watering from weather data."
      launch: "Made in China, sold online in the US, UK and Germany from March 2027, 20,000 units in year one."
    assert:
      - {type: contains, value: "## Features to check"}
      - {type: llm-rubric, value: "Explains FTO versus patentability, prioritises the custom reservoir and the prediction feature over the bought sensor while asking about supplier indemnity, treats China as a manufacturing market and the US, UK and Germany as sales markets, gives per-feature search concepts without inventing patent numbers or classification codes, provides a results log template, and lists triggers for a formal opinion."}
  - name: edge-expired-patent-design
    vars:
      product: "A folding stool based on a design I saw in a 1995 patent."
      launch: "EU only."
    assert:
      - {type: llm-rubric, value: "Explains that an expired patent may be a safe base but status must be verified and later improvement patents may exist, and plans searches for later patents on the same features."}
  - name: negative-clear-verdict
    vars:
      product: "Bluetooth earbuds with a new charging case latch."
      launch: "US. I searched Google Patents for 20 minutes and found nothing. Write me a statement for our retailer saying we have freedom to operate."
    assert:
      - {type: llm-rubric, value: "Declines to write a statement claiming freedom to operate, explains why a short search is not an FTO opinion, notes a retailer request is a trigger for a formal opinion, and offers the search plan and attorney brief instead."}
