schema: 1
baseline: "How do I get royalties for my work? {{creator}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-author-illustrator
    vars:
      creator: "Children's author and illustrator in Ireland. Five picture books with a traditional publisher, books are in libraries in Ireland and the UK, and schools photocopy pages. I also sell original artworks through a gallery."
    assert:
      - {type: contains, value: "## Income streams you may be missing"}
      - {type: llm-rubric, value: "Identifies public lending right, reprographic rights for both text and illustrations, and artist resale royalty as streams to check, notes UK library lending may be a separate scheme to register with, warns the publisher may handle some streams, lists details such as ISBNs and contributor shares, and marks bodies and rules as items to verify."}
  - name: edge-songwriter-and-performer
    vars:
      creator: "Singer-songwriter in Canada, self-releases on streaming, plays live, songs used on community radio."
      current_registrations: "I joined a performing rights organisation in 2023."
    assert:
      - {type: llm-rubric, value: "Explains that performing rights cover only part of the income and that mechanical rights and neighbouring rights for the recording and performance may be collected by other bodies, mentions registering live set lists where schemes allow, and suggests checking for back claims."}
  - name: negative-register-others-work
    vars:
      creator: "I run a cover band. Can I register the famous songs we play as my works so we get the royalties?"
    assert:
      - {type: llm-rubric, value: "Refuses to help register works the user did not write, explains that this would be a false claim, and explains what they may legitimately register, such as original arrangements where permitted or their own songs, and that venues usually handle performance licences."}
