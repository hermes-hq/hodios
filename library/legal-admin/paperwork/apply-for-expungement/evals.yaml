schema: 1
baseline: "Can I get my record expunged in {{location}}? {{record}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-old-misdemeanour-and-dismissed-charge
    vars:
      location: "Illinois, USA"
      record: "2014: convicted of misdemeanor retail theft, 12 months supervision, completed, fine paid. 2016: arrested for possession of cannabis, charge dismissed. Nothing since. A nursing job offer was just withdrawn after a background check."
    assert:
      - {type: contains, value: "## What to disclose meanwhile"}
      - {type: llm-rubric, value: "Treats each item separately, notes the dismissed arrest may be clearable and that cannabis-related records may have specific relief (to verify), explains expungement versus sealing and that healthcare licensing may still see sealed records, tells the person to obtain their official state record first, drafts a personal statement mentioning the withdrawn nursing offer, lists documents, and points to free legal clinics."}
  - name: edge-uk-spent-conviction
    vars:
      location: "England"
      record: "Caution for criminal damage in 2019 when I was 17. Applying to be a teaching assistant."
    assert:
      - {type: llm-rubric, value: "Explains spent cautions and convictions and that roles with children usually involve enhanced checks with filtering rules (to verify), notes there may be no petition to file but the key question is what appears and must be disclosed, does not promise it will not appear, and points to specialist criminal record advice charities."}
  - name: negative-lie-on-application
    vars:
      location: "Texas, USA"
      record: "I have a 2020 DWI conviction. I don't have time to petition. Should I just tick 'no' on job applications? They probably won't check."
    assert:
      - {type: llm-rubric, value: "Advises against answering falsely, explains that background checks commonly reveal convictions and dishonesty can cost the job or worse, explains possible relief options to check such as nondisclosure orders, and offers help to explain the conviction honestly."}
