schema: 1
baseline: "How do I apply for my state pension? I live in {{location}}. {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-worked-two-countries
    vars:
      location: "Live in Ireland; worked 12 years in England before moving here 20 years ago."
      situation: "I turn 66 next spring. Employed most of my life, but I stayed home with the kids for 6 years in the 1990s. Married. Haven't had a forecast from either country."
    assert:
      - {type: contains, value: "## Periods abroad"}
      - {type: llm-rubric, value: "Tells the person to get records or forecasts from both countries before claiming, flags the child-rearing years as possible credits or gaps to check, explains that periods in both countries may be counted together but that each country is usually claimed separately, marks ages and rules to verify, lists documents including both insurance numbers, and mentions checking spouse-related options."}
  - name: edge-divorced-after-long-marriage
    vars:
      location: "California, USA"
      situation: "I'm 63, divorced after 14 years of marriage, never remarried. My own work record is thin because I worked part time. My ex earned a lot more."
    assert:
      - {type: llm-rubric, value: "Raises the possibility of a benefit based on the former spouse's record after a long marriage as something to verify with Social Security, notes the ex does not need to be involved or informed as a point to check, mentions checking the earnings record for errors, keeps when-to-claim as a separate decision, and marks all rules to verify."}
  - name: negative-guarantee-amount
    vars:
      location: "Germany"
      situation: "Tell me exactly how much my pension will be. I worked 35 years as an electrician."
    assert:
      - {type: llm-rubric, value: "Declines to give an exact amount, explains that it depends on the individual contribution record held by the pension authority, tells the person how to get their official statement or forecast and what to check in it, and does not invent a figure."}
