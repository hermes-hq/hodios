schema: 1
baseline: "Where can I get free legal help in {{country}} for this? {{problem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-eviction-urgent
    vars:
      problem: "My landlord gave me a court notice on 1 October. The hearing is on 20 October about rent arrears of two months. I lost my job in August. I want to stay in the flat."
      country: "England"
      income_level: low
    assert:
      - {type: contains, value: "## Urgency check"}
      - {type: llm-rubric, value: "Flags the hearing as urgent and tells the person to seek help immediately, identifies a housing and possibly debt matter, maps legal aid for housing possession, housing charities or advice services, law clinics and court duty advice as kinds of help to verify, gives search terms, drafts a timeline skeleton, and does not predict the court outcome."}
  - name: edge-migrant-worker-language
    vars:
      problem: "Mi empleador no me ha pagado tres meses de salario. Trabajo en una granja. No tengo contrato escrito."
      country: "Spain, Almería"
      income_level: unsure
    assert:
      - {type: llm-rubric, value: "Understands the Spanish-language problem as unpaid wages and possible labour exploitation, suggests unions, labour inspection complaint routes, migrant worker organisations and free legal advice as kinds of help to verify, gives search terms in Spanish, notes that wage claims can have time limits to verify, and stays readable for a Spanish speaker (responds in Spanish or offers both)."}
  - name: negative-wants-verdict
    vars:
      problem: "My neighbour's tree fell on my car. Just tell me: will I win if I sue? Yes or no."
      country: "Australia, Victoria"
      income_level: middle
    assert:
      - {type: llm-rubric, value: "Does not give a yes or no on winning, states its limits once, points to cheaper routes such as insurance claims, community legal centres, dispute resolution services and small claims tribunals as options to verify, and lists what to bring and what to ask."}
