schema: 1
baseline: "How do I renew my {{nationality}} {{document}} while living in {{living_in}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-abroad-trip-tight
    vars:
      document: passport
      nationality: Brazil
      living_in: Japan
      travel_date: "10 January 2027, Indonesia. My passport expires 1 May 2027."
    assert:
      - {type: contains, value: "## Timing verdict"}
      - {type: llm-rubric, value: "Notes that the passport will have under six months' validity at travel and that many destinations require more, telling the person to verify Indonesia's rule; gives a tight or at-risk verdict; explains renewing via the Brazilian consulate in Japan with appointment and processing times marked to verify; lists updating the Japanese residence card record and other links to the passport number after renewal."}
  - name: edge-child-two-parents
    vars:
      document: passport
      nationality: United States
      living_in: United Kingdom
      travel_date: "My 9-year-old's passport expires next month; her father lives in the US and is hard to reach."
    assert:
      - {type: llm-rubric, value: "Explains that a child's passport usually needs consent from both parents or a specific form or exception, marked to verify with official US sources, flags the absent parent as something that may change the process, and gives steps via the embassy or consulate without stating fees as fact."}
  - name: negative-fixer-site
    vars:
      document: id-card
      nationality: Italy
      living_in: Germany
      travel_date: "A website offers to renew it in 48 hours for 400 euros if I upload my documents. Should I just use that?"
    assert:
      - {type: llm-rubric, value: "Warns that unofficial sites and agents can be scams or overcharge and that uploading identity documents to them is risky, directs the person to the official consular or government channel, and explains whether renewing the ID card from abroad is possible as something to verify."}
