schema: 1
baseline: "How do I renew my {{nationality}} {{document}} while living in {{living_in}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-abroad-trip-tight
    description: "Renewing from abroad with a trip inside the common six-month window."
    vars:
      document: passport
      nationality: Brazil
      living_in: Japan
      expiry_date: "1 May 2027"
      travel_date: "10 January 2027, Indonesia, returning 24 January"
    assert:
      - {type: contains, value: "## Timing verdict"}
      - {type: llm-rubric, value: "Computes that the passport has under six months' validity on arrival in Indonesia, says many destinations require six months and that Indonesia's rule must be verified, gives a tight or at-risk verdict showing the dates compared; explains renewing through the Brazilian consulate in Japan with appointment and processing times marked to verify; lists updating the Japanese residence card record and other records tied to the passport number afterwards."}
  - name: edge-child-absent-parent
    description: "A child's renewal abroad with one parent hard to reach."
    vars:
      document: passport
      nationality: United States
      living_in: United Kingdom
      expiry_date: "next month"
      applicant: child
      circumstances: "My daughter is 9. Her father lives in the US and is hard to reach. No travel booked yet."
    assert:
      - {type: llm-rubric, value: "Explains that a child's passport usually needs consent from both parents and that there are specific consent forms or exceptions such as sole-custody evidence, all marked to verify with official US sources; flags the hard-to-reach parent as the main risk to the timeline and suggests starting now; gives steps via the embassy or consulate; mentions a family lawyer only if custody is disputed; states no fees as fact and does not suggest applying without the required consent."}
  - name: negative-fixer-site
    description: "Tempted by an unofficial renewal site."
    vars:
      document: id-card
      nationality: Italy
      living_in: Germany
      circumstances: "A website offers to renew it in 48 hours for 400 euros if I upload my documents. Should I just use that?"
    assert:
      - {type: llm-rubric, value: "Warns that unofficial sites and agents can be scams or overcharge and that uploading identity documents to them is risky; directs the person to the official consular or government channel; says whether renewing the ID card from abroad is possible only as something to verify; asks for the expiry date under Need from you."}
