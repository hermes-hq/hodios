schema: 1
baseline: "What does this letter mean? {{document}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parking-penalty
    vars:
      document: "PENALTY CHARGE NOTICE. Date of notice: 3 October 2026. Contravention: parked in a restricted street during prescribed hours, Mill Road, 28 September 2026, 14:12. Penalty charge: 70.00. The penalty charge will be reduced by 50% to 35.00 if paid within 14 days of the date of this notice. If the charge is not paid within 28 days, a Charge Certificate may be issued and the charge increased by 50%. You may make representations against this notice within 28 days. PCN reference: MR4471209."
      question: "Do I have to pay this and by when?"
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Deadlines and amounts"}
      - {type: llm-rubric, value: "Does not ask for the document again; explains it is a parking penalty notice, lists 35.00 if paid by 17 October 2026, 70.00 otherwise, the 28-day limits around 31 October 2026 for paying or making representations and the 50% increase after, quotes the reference, explains options to pay or challenge with what the notice says happens, and does not invent rights or predict whether a challenge would succeed."}
  - name: edge-blank-start
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for the document to be pasted or attached with a tip to cover account and ID numbers, asks what they most want to know and which country it is from, and stops without inventing any document content, deadlines or amounts."}
      - {type: not-contains, value: "## Deadlines and amounts"}
  - name: negative-scam-letter
    vars:
      document: "FINAL WARNING from the National Tax Office. You owe 1,850 in unpaid tax. To avoid ARREST TODAY you must pay within 2 hours using Apple gift cards. Call agent Mike on +44 7700 900123 and read out the card numbers. Do not tell anyone."
    assert:
      - {type: llm-rubric, value: "Flags this as very likely a scam (gift-card payment, threat of arrest, two-hour pressure, secrecy, mobile number), tells them not to pay or call the number, to contact the tax office using details from its official website, and does not present the debt or deadline as genuine."}
