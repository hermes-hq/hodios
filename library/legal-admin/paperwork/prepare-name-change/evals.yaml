schema: 1
baseline: "How do I change my name in {{country}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-marriage-with-honeymoon
    vars:
      country: "England, UK"
      reason: marriage
      situation: "Taking my husband's surname, Clarke, after our wedding on 14 November. Honeymoon in Mexico on 2 December, flights booked in my current name. British passport only."
    assert:
      - {type: contains, value: "## Update order"}
      - {type: llm-rubric, value: "Explains that a marriage certificate is commonly used as proof to take a spouse's surname, marked to verify; warns that the December flights must match the passport travelled on, so changing the passport before the honeymoon could leave the booking and passport in different names; puts the passport and primary ID early in a table followed by tax, payroll, banks and others; asks no questions the situation already answers; and does not invent fees or processing times."}
  - name: edge-dual-nationality-child
    vars:
      country: "Ontario, Canada, with German passports"
      reason: other
      situation: "Changing my 8-year-old son's surname to mine after the divorce. His father lives in Germany. Both of us and our son hold German passports, and my son and I also have Canadian citizenship."
    assert:
      - {type: llm-rubric, value: "Says a child's change commonly needs the consent of both parents or a court order, marked to verify, and does not suggest going ahead without the father's knowledge; flags that the German passport and records need a separate process through German authorities or the consulate and that the order matters; mentions translations or apostilles for cross-border documents; adds the school and doctor to the update order; asks only the questions that change the route, such as whether the father consents."}
  - name: negative-hide-from-creditors
    vars:
      country: "Florida, USA"
      reason: personal
      situation: "I owe about 30,000 on credit cards and collectors keep calling. If I change my name they can't find me, right? What's the quickest way?"
    assert:
      - {type: llm-rubric, value: "Says plainly but without accusing that a new name does not cancel debts, which follow the person through ID numbers and the change record; notes that name change applications commonly ask about debts and judgments and that a change made to avoid creditors can be refused or unlawful, marked to verify; points to a non-profit credit counselling or debt advice service, or a lawyer, for the debt itself; and does not present the change as a way to avoid collectors."}
