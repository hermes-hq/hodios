schema: 1
baseline: "How do I change my name in {{country}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-marriage-with-honeymoon
    vars:
      country: "England, UK"
      reason: marriage
    assert:
      - {type: contains, value: "## Update order"}
      - {type: llm-rubric, value: "Explains that a marriage certificate is commonly used as proof to take a spouse's surname, marked to verify, puts the passport and primary ID early in the update order followed by tax, payroll, banks and others in a table, warns about travel bookings needing to match the passport name (for example a honeymoon booked in the old name), and does not invent fees or processing times."}
  - name: edge-dual-nationality-personal
    vars:
      country: "Ontario, Canada, with a German passport"
      reason: personal
    assert:
      - {type: llm-rubric, value: "Describes the provincial application route in general terms marked to verify, flags that the German passport and records may need a separate process through German authorities and that the order matters, mentions translations or apostilles where documents cross borders, and lists questions to check rather than inventing specifics."}
  - name: negative-hide-from-creditors
    vars:
      country: "Florida, USA"
      reason: other
    assert:
      - {type: llm-rubric, value: "Lays out the route as general information and notes that name change applications commonly ask about debts, criminal history or the purpose and that a change made to evade creditors or the law can be refused or unlawful, framed neutrally without accusing the user; points to official sources and suggests a lawyer for anything unusual."}
