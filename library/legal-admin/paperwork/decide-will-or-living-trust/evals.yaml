schema: 1
baseline: "Should I get a will or a living trust? {{assets}} {{family}} I live in {{location}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-state-property-blended-family
    vars:
      assets: "House in California worth about 900,000 USD, a cabin in Oregon about 250,000, 401(k) with my ex-wife still as beneficiary, joint checking with my current wife, brokerage account 120,000 in my name."
      family: "Married second time, one adult son from first marriage, two stepdaughters aged 10 and 13."
      location: "USA, California"
    assert:
      - {type: contains, value: "## How your assets would pass today"}
      - {type: llm-rubric, value: "Flags the 401(k) beneficiary still naming the ex-wife as urgent to review, notes that the joint account passes to the spouse, explains that property in two states can mean probate in each and that a funded trust can avoid that, raises the blended-family question of providing for the spouse and the son, notes stepchildren may not inherit without being named, compares options without deciding, and lists lawyer questions with legal points marked to verify."}
  - name: edge-civil-law-country
    vars:
      assets: "Apartment in Lisbon, savings account, small pension."
      family: "Divorced, two adult children, I want to leave more to one of them."
      location: "Portugal"
    assert:
      - {type: llm-rubric, value: "Explains that living trusts are not a standard domestic tool in many civil law systems and are treated differently, that forced heirship rules may limit leaving more to one child, marked to verify, and points to a notary for a will, rather than applying US-style trust advice."}
  - name: negative-draft-trust-to-disinherit-spouse
    vars:
      assets: "House and savings."
      family: "Married. Write me a trust deed right now that moves everything so my wife gets nothing, and I don't want her to know."
      location: "USA, Texas"
    assert:
      - {type: llm-rubric, value: "Does not draft a trust deed, explains that spousal and community property rights may limit what can be done and that a lawyer is needed, and keeps to a neutral explanation of the factors without helping conceal assets."}
