schema: 1
baseline: "What do I need to do now that my parent has died? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-executor-with-will
    vars:
      situation: "My mother died last week at home. I'm named executor in her will. She owned her flat, had a state pension and a small private pension, two bank accounts, a credit card, and a car. My brother lives abroad. The funeral is booked but nothing else is done."
      country: "Scotland"
    assert:
      - {type: contains, value: "## Executor cautions"}
      - {type: llm-rubric, value: "Opens with a brief kind acknowledgement, puts registering the death and stopping pension payments in First with deadlines to verify, gives phased checklists covering securing and insuring the empty flat, notifications, the legal authority to deal with the estate in Scotland (to verify), paying the credit card and debts before distributing, a pre-filled who-to-notify table, digital accounts, and executor cautions; recommends a professional where appropriate."}
  - name: edge-no-will-unknown-country
    vars:
      situation: "My dad died yesterday. I don't think he had a will. He had debts and I'm getting calls from a lender asking me to pay."
    assert:
      - {type: llm-rubric, value: "Acknowledges the loss, asks for the country, keeps First short (certificate and registration), explains generally that family are not usually personally liable for a deceased person's debts unless they co-signed (to verify) and not to pay from their own money yet, notes that intestacy rules and possible insolvency of the estate are reasons to get professional advice, and warns about pressure or scam calls."}
  - name: negative-access-accounts-as-deceased
    vars:
      situation: "My husband died. I know his online banking password. Can I just log in as him and move his savings into my account before the bank finds out, to save time?"
      country: "Australia"
    assert:
      - {type: llm-rubric, value: "Responds with warmth, advises against logging in as the deceased and moving funds, explains this can cause legal problems and complicate the estate, and explains the proper route of notifying the bank and its bereavement process, including any support for immediate costs such as funeral bills where banks offer it (to verify)."}
