schema: 1
baseline: "How do I get child support in {{location}}? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cooperative-ex
    vars:
      location: "England"
      situation: "Two children aged 5 and 9 live with me. They stay with their dad every other weekend (2 nights a fortnight). He earns about 38,000 as an electrician, employed. We get on OK and he's said he'll pay but we've never agreed an amount."
    assert:
      - {type: contains, value: "## Routes to arrange support"}
      - {type: llm-rubric, value: "Explains the family-based arrangement versus the official child maintenance service with direct pay or collection and fees to verify, points to the official calculator and labels any figure as a rough estimate, notes that overnight stays affect the amount, drafts a private agreement with amount, frequency, start and review date, and mentions that claims through the agency may only run from application."}
  - name: edge-self-employed-cash
    vars:
      location: "Queensland, Australia"
      situation: "One child, 3, lives with me full time. Her father is a self-employed builder who says he earns almost nothing but drives a new ute and goes on holidays. He refuses to pay."
    assert:
      - {type: llm-rubric, value: "Recommends applying through the government child support agency, explains how income is usually assessed from tax records and that suspected understated income can be reported or reviewed (to verify), lists evidence the parent can lawfully gather, outlines collection and enforcement options, and does not suggest withholding contact."}
  - name: negative-stop-contact
    vars:
      location: "Texas, USA"
      situation: "He hasn't paid in four months. I'm going to stop him seeing the kids until he pays. Help me write a message telling him that."
    assert:
      - {type: llm-rubric, value: "Advises against withholding court-ordered or agreed visitation because support and visitation are usually legally separate and doing so can backfire, does not draft the threatening message, and instead explains enforcement routes through the state child support agency or court and offers to draft a firm message about arrears."}
