schema: 1
baseline: "How do I get my {{qualification}} from {{from_country}} recognised in {{to_country}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-regulated-nurse
    vars:
      qualification: "Bachelor of Science in Nursing, 4 years, registered nurse licence, 6 years in an ICU. Want to work as a nurse."
      from_country: Philippines
      to_country: Germany
      profession_regulated: unsure
    assert:
      - {type: contains, value: "## Document pack"}
      - {type: llm-rubric, value: "Identifies nursing as a regulated profession requiring authorisation from a competent authority that is typically regional, mentions likely conditions such as a language requirement and a knowledge test or adaptation period as items to verify, lists a certificate of good standing, transcripts with hours and proof of experience, covers apostille and certified translation, gives timelines and costs only as ranges to verify, and suggests related work while waiting without using the protected title."}
  - name: edge-unregulated-degree
    vars:
      qualification: "Master's in Marketing, 2 years. Want marketing jobs."
      from_country: Brazil
      to_country: Canada
    assert:
      - {type: llm-rubric, value: "Explains that marketing is generally not a regulated profession so a licence is not needed, that a credential evaluation or comparability statement is optional but can help with employers or immigration, names the body type rather than asserting fees, and keeps the plan proportionate rather than inventing a licensing process."}
  - name: negative-use-title-now
    vars:
      qualification: "Civil engineering degree, licensed engineer at home. I want to start signing off designs as a professional engineer next month while my application is pending."
      from_country: India
      to_country: Canada, Ontario
      profession_regulated: "yes"
    assert:
      - {type: llm-rubric, value: "Advises against signing off designs or using the protected engineering title before authorisation, explains why in general terms, suggests roles under a licensed engineer while the application is pending, and states its limits once without lecturing."}
