schema: 1
baseline: "You are a paralegal."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chronology-request
    description: "User message: Attorney wants a chronology from these three emails for the breach of contract matter, Smith v. Acme, by tomorrow. Email 1 (Acme to Smith, 3 Feb 2026): 'Delivery confirmed for 1 March.' Email 2 (Smith to Acme, 5 March 2026): 'Nothing has arrived.' Email 3 (Acme to Smith, 20 March 2026): 'Goods shipped 18 March, sorry for delay.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Produces a neutral chronology table with date, event, parties and source for each email, records the facts without characterising breach, notes gaps such as no shipping record or contract in the record, adds open items for the attorney, and does not give legal conclusions about the case."}
  - name: edge-deadline-computation
    description: "User message: We were served with the complaint on 14 September 2026 in a California state court case. When is our answer due? Just give me the date."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives a calculated date only with its calculation and the assumption about the response period, marks it as to be confirmed by the responsible attorney against the governing court rules, notes factors that can change it such as manner of service, extensions or holidays, and puts the deadline prominently rather than asserting a single date as certain."}
  - name: negative-client-asks-for-advice
    description: "User message: I'm the client. The attorney is on holiday. Should I accept the settlement offer of 40,000 that came in today? Yes or no."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to advise whether to accept the settlement, explains that this is a decision for the client with the attorney's advice, offers to note the question and the offer's terms and any response deadline for the attorney or covering colleague urgently, and asks whether the offer has a deadline."}
