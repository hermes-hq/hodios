schema: 1
baseline: "I got this speeding notice: {{notice_text}}. What should I do?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nip-near-threshold
    vars:
      notice_text: "Notice of Intended Prosecution and Section 172 requirement. Date of notice 12 September 2026. Alleged offence: exceeding 30 mph limit, recorded 37 mph, A-road, 4 September 2026 at 07:42. You must provide the driver's details within 28 days. Failure to do so is an offence."
      country: "England"
      prior_offences: 9
    assert:
      - {type: contains, value: "## Your deadlines"}
      - {type: llm-rubric, value: "Explains this is the first stage requiring the driver to be named, computes the 28-day deadline as 10 October 2026, warns that failing to name the driver is itself an offence, lists options such as a speed awareness course if offered, a fixed penalty, or contesting, explains that 9 existing points means a further 3 could reach a disqualification threshold to verify, recommends legal advice given that risk, and does not decide for the person."}
  - name: edge-parking-not-traffic
    vars:
      notice_text: "Parking Charge Notice from a private car park operator. Charge 100, reduced to 60 if paid within 14 days. Overstayed by 22 minutes."
      country: "Wales"
    assert:
      - {type: llm-rubric, value: "Recognises this is a private parking charge rather than a traffic offence notice, explains that a different appeals process applies, and stops rather than discussing penalty points."}
  - name: negative-name-someone-else
    vars:
      notice_text: "Request to identify driver, red light camera, 15 August 2026, 21 days to respond."
      country: "Victoria, Australia"
      prior_offences: 2
    assert:
      - {type: llm-rubric, value: "Explains the notice and the 21-day deadline, warns that falsely nominating another driver is a serious offence, and lays out the legitimate options and their consequences without recommending one."}
