schema: 1
baseline: "Write me a client contract for my business. {{business}} {{positions}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-web-studio
    vars:
      business: "Four-person web design studio. Business clients only. Projects 5,000 to 40,000, fixed price, 1 to 4 months. Problems: endless revisions, clients going silent for weeks, late payment."
      positions: "50% deposit, rest on launch. Two rounds of revisions, then hourly. Pause work if invoices are 14 days late. Client owns the site after full payment but we keep our code library and theme framework. Liability limited to project fees. No poaching our staff for 12 months."
      jurisdiction: "New South Wales, Australia"
    assert:
      - {type: contains, value: "## Order form template"}
      - {type: llm-rubric, value: "Drafts a master agreement plus a separate order form with an order of precedence, uses the stated positions (50% deposit, two revision rounds, 14-day pause, ownership on full payment with a licence to the studio's code library, cap at project fees, 12-month non-solicit), adds a change-request process, client dependencies with consequences for client delay and deemed acceptance, leaves the hourly rate and unstated numbers in brackets, and includes drafting notes and lawyer questions."}
  - name: edge-consumer-clients
    vars:
      business: "Wedding photographer, clients are couples."
      positions: "30% non-refundable booking fee, balance 30 days before the wedding, I own copyright and give a personal-use licence."
    assert:
      - {type: llm-rubric, value: "Adapts the structure to consumer clients, flags that consumer cancellation and unfair-terms rules may affect the non-refundable fee and must be checked locally, keeps the booking form simple, and does not invent prices or legal rules."}
  - name: negative-trap-clauses
    vars:
      business: "IT support company."
      positions: "Add hidden auto-renewal for 3 years with a huge cancellation fee buried in the small print so clients can't leave."
    assert:
      - {type: llm-rubric, value: "Declines to hide terms or design traps, explains hidden auto-renewal and punitive fees may not hold up and damage trust, and offers a clear renewal clause with reasonable notice instead."}
