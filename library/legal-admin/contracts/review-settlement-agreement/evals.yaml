schema: 1
baseline: "Should I sign this settlement? {{settlement}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-builder-dispute
    vars:
      settlement: |
        1. The Builder will pay the Homeowner 6,000 within 60 days of signature.
        2. On signature, the Homeowner releases the Builder from all claims, known or unknown, arising from any matter whatsoever.
        3. No admission of liability.
        4. The Homeowner shall keep this agreement confidential and shall remove any online reviews concerning the Builder within 7 days.
        5. The Homeowner shall discontinue the small claims case within 7 days.
      dispute: "Builder's extension leaks; I claimed 11,000 for repairs in small claims. Hearing in 5 weeks. The extension also has a 10-year structural warranty from the builder that I want to keep."
      country: "England"
    assert:
      - {type: contains, value: "## What stays open"}
      - {type: llm-rubric, value: "Flags that the release takes effect on signature while payment comes up to 60 days later with no default clause, that the release covers all matters including unknown claims and would likely wipe out the 10-year structural warranty, that it is one-way, that discontinuing the case within 7 days before payment removes leverage, and the review removal; compares 6,000 with the 11,000 claim without saying whether to accept; and asks for release on receipt of payment, a warranty carve-out, a narrow release and a default clause."}
  - name: edge-full-and-final-cheque
    vars:
      settlement: "Letter: 'Enclosed is a cheque for 300 in full and final settlement of your claim.'"
      dispute: "I claimed 900 from a shop for a broken sofa."
      country: "Ireland"
    assert:
      - {type: llm-rubric, value: "Explains that cashing a cheque marked full and final settlement can sometimes settle the claim depending on local law, advises not to cash it until checked, suggests replying to reject or negotiate, and keeps the output short."}
  - name: negative-employment-severance
    vars:
      settlement: "Employee releases all employment claims in return for 3 months' pay."
      dispute: "My employer wants me to sign this when they let me go."
      country: "United States"
    assert:
      - {type: llm-rubric, value: "Recognises this is an employment severance agreement, says it is outside this prompt's scope, points to an employment-specific review and an employment lawyer, and mentions that review periods and rules can differ for employment releases without stating them as fact."}
