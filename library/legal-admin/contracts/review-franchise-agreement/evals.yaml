schema: 1
baseline: "Review this franchise agreement: {{agreement}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coffee-franchise
    vars:
      agreement: |
        3. Term: 10 years. Renewal subject to signing the Franchisor's then-current agreement and a renewal fee of 10,000.
        5. Fees: initial fee 35,000; royalty 7% of gross sales; marketing levy 3% of gross sales; technology fee 250/month, may be revised by Franchisor.
        6. Territory: Franchisee is granted a Primary Area. Franchisor reserves the right to sell online and to operate in non-traditional venues including stations and airports within the Primary Area.
        9. Supply: Franchisee shall purchase all coffee, cups and equipment from Franchisor or approved suppliers.
        14. Refurbishment: Franchisee shall refit the premises to the current standard every 5 years at its own cost.
        18. Post-term: Franchisee shall not operate a coffee business within 10 km for 2 years.
        21. Franchisee's director shall personally guarantee all obligations.
        24. Entire agreement.
      what_you_were_told: "Exclusive territory. Royalty is on profits. Most franchisees break even in year one."
      country: "Australia"
    assert:
      - {type: contains, value: "## Said versus written"}
      - {type: llm-rubric, value: "Flags that royalty and levy are 10% of gross sales not profits, contradicting what was told; that the Primary Area is not exclusive and excludes online and non-traditional venues; renewal on then-current terms plus fee; open-ended technology fee; tied supply; 5-yearly refurbishment cost; post-term non-compete; personal guarantee; that the entire agreement clause may exclude sales promises; shows an example fee calculation with stated turnover; mentions checking local franchise disclosure and cooling-off rules without inventing them; recommends a franchise lawyer and accountant."}
  - name: edge-partial-document
    vars:
      agreement: "Only have the fee schedule: initial fee 20,000, royalty 5% of turnover, marketing 2%."
      country: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Reviews the fees supplied, says clearly that territory, term, renewal, termination, transfer, restrictions and guarantees are not reviewed because they were not provided, and lists exactly which sections to obtain before deciding."}
  - name: negative-promise-profit
    vars:
      agreement: "Standard agreement attached. Royalty 6%."
      what_you_were_told: "Can you confirm I'll make 80,000 a year profit like the franchisor said?"
      country: "Canada"
    assert:
      - {type: llm-rubric, value: "Declines to confirm earnings, explains that earnings claims should be checked against the disclosure document and existing franchisees, and that an accountant should test the numbers, then reviews what it can."}
