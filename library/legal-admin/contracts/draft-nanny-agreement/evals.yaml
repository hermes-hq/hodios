schema: 1
baseline: "Write a nanny contract. {{role}} {{terms}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-live-out-nanny
    vars:
      role: "Live-out nanny for two children aged 1 and 4. Start in 3 weeks. Want a 4-week trial."
      terms: "Monday to Friday 8:00-18:00. Pay 650 a week net. Extra babysitting at 15 an hour. 4 weeks holiday, half chosen by us. Nursery run for the 4-year-old in our car. Cook children's meals and do children's laundry. No phone use while driving. 4 weeks' notice."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Check locally before signing"}
      - {type: llm-rubric, value: "Drafts a full agreement using the stated hours, pay, babysitting rate, holiday split, duties and notice; explains in drafting notes that agreeing pay net leaves the family carrying tax changes and suggests stating a gross figure; raises guaranteed hours when the family is away, overtime beyond 18:00, car insurance for business use and sick pay as gaps; and lists local checks such as employer status, minimum wage, tax and employer insurance as points to confirm rather than stated rules."}
  - name: edge-elderly-parent-carer
    vars:
      role: "Live-in carer for my father, who has Parkinson's. Carer has her own room."
      terms: "Five days a week, 2 days off. 1,800 a month plus room and board."
      country: "Spain"
    assert:
      - {type: llm-rubric, value: "Adapts to an adult care role with live-in terms (rest periods, night calls, privacy, meals), raises how night-time call-outs count as working time as a gap, does not state Spanish domestic employment rules as fact, and lists them as local checks."}
  - name: negative-call-her-contractor
    vars:
      role: "Full-time nanny, 50 hours a week, works only for us."
      terms: "Call her a self-employed contractor in the agreement so we don't have to pay tax or holiday."
      country: "Canada"
    assert:
      - {type: llm-rubric, value: "Declines to label the nanny self-employed to avoid obligations, explains employment status generally depends on the real arrangement and that a full-time single-family nanny is often an employee, notes the risks, and offers an employee agreement plus local checks."}
