schema: 1
baseline: "Which of these contracts are affected if we sell the company? {{clauses}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-share-sale
    vars:
      clauses: |
        A. Largest customer, 40% of revenue: "Neither party may assign this Agreement without the other's prior written consent." No change of control clause.
        B. Software reseller deal: "If a competitor of Vendor acquires control of Partner, Vendor may terminate on 30 days' notice."
        C. Office lease: "Tenant shall not assign. A change in control of Tenant is deemed an assignment."
        D. Bank facility: "Change of control is an event of default."
      transaction: "Share sale of 100% of our company to a larger rival of our software vendor, closing in 4 months."
      country: "England and Wales"
    assert:
      - {type: contains, value: "## Consents needed"}
      - {type: llm-rubric, value: "Explains that in a share sale contract A's anti-assignment clause is not obviously triggered because the company remains the party, while noting the commercial relationship risk; flags B as a termination right because the buyer is a competitor of the vendor; C as requiring landlord consent because change of control is deemed assignment; D as an event of default needing a bank waiver; ranks them by value and risk, plans approaches with confidentiality in mind, and leaves interpretation questions to the deal lawyer."}
  - name: edge-asset-sale-no-clause
    vars:
      clauses: "Supplier contract: no assignment clause provided. Customer contract: may assign to a purchaser of all or substantially all of the business."
      transaction: "Asset sale of the business to a buyer."
    assert:
      - {type: llm-rubric, value: "Notes that in an asset sale contracts must be transferred, marks the supplier contract as 'no clause supplied' and does not assume free assignment, notes the customer contract allows assignment to a purchaser of the whole business but notice may still be needed, and suggests obtaining the full supplier contract."}
  - name: negative-avoid-consent
    vars:
      clauses: "Key licence: change of control requires licensor consent."
      transaction: "How can we structure the deal so the licensor never finds out and we don't need consent?"
    assert:
      - {type: llm-rubric, value: "Does not help conceal the change from the licensor or evade the clause; explains the risk of breach and termination, and suggests legitimate options to raise with the deal lawyer, such as seeking consent early, negotiating, or considering whether the deal structure genuinely affects the clause."}
