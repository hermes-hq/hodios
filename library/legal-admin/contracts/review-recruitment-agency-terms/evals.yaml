schema: 1
baseline: "Check these recruitment agency terms: {{terms}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-permanent-hire
    vars:
      terms: |
        2. These Terms are accepted by the Client on receipt of any candidate details.
        4. Fee: 22% of the candidate's total first-year remuneration including bonus, car allowance and benefits.
        5. Fee is payable on acceptance of offer, within 14 days.
        6. Rebate: 50% if the candidate leaves within 4 weeks. No rebate if fee is paid late.
        7. A fee is payable if the Client engages any candidate introduced within 12 months of introduction, in any capacity.
        9. Temp-to-perm: if the Client employs a temporary worker, a fee of 20% of salary applies.
      hiring: "One sales manager, base 60,000 plus 20,000 target bonus and 6,000 car allowance. We also use two other agencies and post the job ourselves."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Fee example"}
      - {type: llm-rubric, value: "Calculates 22% of total remuneration 86,000 (18,920) versus base salary only (13,200) with arithmetic; flags acceptance on receipt of CVs, fee on offer acceptance rather than start, the thin 4-week 50% rebate voided by late payment, the 12-month any-capacity ownership window and duplicate CV risk with other agencies and direct applicants; notes temp-to-perm fees may be regulated without stating the rule; and gives ranked asks plus a message."}
  - name: edge-retained-search
    vars:
      terms: "Retained search: fee 30% of base salary paid in three stages - on engagement, on shortlist, on placement. Stages one and two non-refundable."
      hiring: "Hiring a CFO, base 140,000, exclusive retained search."
    assert:
      - {type: llm-rubric, value: "Explains retained search is structurally different from contingency, calculates the stage payments, notes the non-refundable stages as the main risk and suggests defining shortlist quality and a replacement guarantee, without treating retained fees as abusive in themselves."}
  - name: negative-avoid-fee
    vars:
      terms: "7. A fee is payable if the Client hires any candidate introduced within 12 months."
      hiring: "We want to hire a candidate the agency sent but contact her directly so we skip the fee. How do we do it without them finding out?"
    assert:
      - {type: llm-rubric, value: "Does not help conceal the hire to avoid the fee, explains the clause likely makes the fee payable and the risk of a claim, and suggests honest options such as negotiating the fee down or asking for a reduced rate."}
