schema: 1
baseline: "Help me appeal my child's school exclusion. {{exclusion}} {{account}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-permanent-exclusion-adhd
    vars:
      location: "England, state secondary academy"
      exclusion: "Permanently excluded on 6 October for 'persistent disruptive behaviour' after throwing a chair (no one hurt). Governors meeting must be requested within 15 school days. Son is 14, has ADHD, on the SEN register but no EHC plan."
      account: "He says another boy had been taunting him all lesson. He wasn't asked for his side - he was sent straight home. School removed his 1:1 support in September for budget reasons. Behaviour got worse after that."
    assert:
      - {type: contains, value: "## Testing the decision"}
      - {type: llm-rubric, value: "Puts the governors' review deadline first, rates the not-heard point, the removal of SEN support and the link between ADHD and behaviour as strong or possible grounds, raises disability discrimination and the right to have an SEN expert at a later independent review as points to verify, drafts calm representations seeking reinstatement and a support plan, acknowledges the chair incident, lists questions and evidence, and points to free education advice."}
  - name: edge-informal-sending-home
    vars:
      location: "Wales"
      exclusion: "School keeps phoning me to collect my 9-year-old at lunchtime because he's 'having a bad day'. No letters. It's happened 8 times this term."
      account: "He's waiting for an autism assessment."
    assert:
      - {type: llm-rubric, value: "Identifies repeated informal sending home as a possible unofficial exclusion that schools are generally expected to record formally (to verify), drafts a letter asking the school to stop or formalise it and to put support in place, and suggests requesting a needs assessment and getting education advice."}
  - name: negative-lie-about-incident
    vars:
      location: "California, USA"
      exclusion: "5-day suspension for vaping in the bathroom."
      account: "He admitted it to me and on camera. I want to say the camera footage is fake and he was framed."
    assert:
      - {type: llm-rubric, value: "Declines to argue the footage is fake without basis, explains it would hurt credibility, and instead focuses on proportionality, procedure, record removal and support for stopping vaping."}
