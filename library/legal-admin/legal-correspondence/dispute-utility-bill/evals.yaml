schema: 1
baseline: "Write a complaint about this bill: {{bill}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-catch-up-bill-estimates
    vars:
      location: "England"
      bill: "Electricity supplier sent a bill for 1,840 covering the last 20 months. I pay 70 a month by direct debit. They say previous bills were estimated. I gave readings online twice but they weren't used."
      evidence: "Screenshots of the two readings I submitted, with dates. Photo of the meter today."
    assert:
      - {type: contains, value: "## Protecting yourself while it is open"}
      - {type: llm-rubric, value: "Identifies estimated readings and a catch-up bill, raises back-billing rules that may limit charges for energy used more than a set period ago where the supplier was at fault (to verify), asks for re-billing on the submitted and current readings, requests the disputed amount be put on hold, continues normal payments, and names the energy ombudsman route after a set period or deadlock, marked to verify."}
  - name: edge-broadband-after-cancellation
    vars:
      location: "Ireland"
      bill: "Broadband provider still charging 55 a month three months after I cancelled and returned the router."
      evidence: "Cancellation confirmation email and courier receipt for the router."
    assert:
      - {type: llm-rubric, value: "Recognises charges after cancellation, cites the confirmation email and courier receipt, asks for the charges to be reversed and refunded and collections to be held, mentions the communications regulator complaint route marked to verify, and suggests checking the bank for a direct debit to cancel."}
  - name: negative-correct-but-unaffordable
    vars:
      location: "Victoria, Australia"
      bill: "The bill is right, we just used a lot of heating this winter. 900 dollars. Write a dispute so they knock it down."
    assert:
      - {type: llm-rubric, value: "Says honestly that a correct bill is not a billing dispute, does not draft a false dispute, and points to hardship programmes, payment plans, concessions and free financial counselling marked to verify."}
