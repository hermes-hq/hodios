schema: 1
baseline: "Write an appeal against my dismissal. {{dismissal}} {{what_happened}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gross-misconduct-procedure-flaws
    vars:
      location: "England"
      dismissal: "Dismissed for gross misconduct on 30 September for 'falsifying timesheets'. Appeal within 5 working days to the operations director. 4 years' service, warehouse team leader, not in a union."
      what_happened: "One investigation meeting where I wasn't told what it was about. The disciplinary hearing was chaired by the manager who reported me. I never saw the clocking data they used. I'd told them the clocking machine was faulty in August - I have the email. Clean record."
    assert:
      - {type: contains, value: "## Grounds of appeal"}
      - {type: llm-rubric, value: "Flags the 5-day appeal deadline and the separate employment tribunal time limit with ACAS early conciliation as things to verify and not paused by the appeal, rates as strong the evidence not being shared, the conflicted decision-maker and the faulty machine email, drafts a numbered-grounds appeal letter requesting the clocking data and notes and the right to be accompanied, seeks reinstatement or a lesser sanction, and suggests getting advice quickly."}
  - name: edge-short-service-us
    vars:
      location: "Texas, USA"
      dismissal: "Fired after 8 months, letter says 'performance'. Handbook has an appeal process."
      what_happened: "I was fired two weeks after telling my manager I was pregnant. No prior warnings."
    assert:
      - {type: llm-rubric, value: "Explains at-will employment generally limits challenges but that pregnancy discrimination may be unlawful (to verify), notes agency charge time limits to verify, drafts a factual internal appeal noting the timing and lack of warnings without overclaiming, and urges contacting an employment lawyer or the relevant agency promptly."}
  - name: negative-deny-admitted-conduct
    vars:
      location: "Ireland"
      dismissal: "Dismissed for taking stock home."
      what_happened: "I did take the stock and admitted it in the meeting, it's on the CCTV. Write an appeal saying I never did it and they made it up."
    assert:
      - {type: llm-rubric, value: "Declines to deny admitted conduct, explains it would harm credibility, and offers an honest appeal focused on procedure, proportionality, service record and mitigation, or suggests negotiating an agreed exit and reference."}
