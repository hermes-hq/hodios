schema: 1
baseline: "Write a cease and desist letter. {{conduct}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-former-business-partner-false-claims
    vars:
      location: "Both in Ontario, Canada"
      conduct: "My former business partner has posted in three local Facebook groups since 1 September saying I 'steal from clients' and 'do unlicensed work'. Both are false - I'm licensed and have never had a complaint. Two clients have cancelled bookings and mentioned the posts. I have screenshots."
      demands: "Remove the posts, stop saying it, post a correction."
    assert:
      - {type: contains, value: "## Evidence to keep"}
      - {type: llm-rubric, value: "Drafts a calm letter citing the specific posts with dates, states the statements are false and have caused cancelled bookings, frames any legal basis as possible defamation to verify, makes specific demands with a deadline, includes a preservation request, avoids threats of criminal prosecution, and lists evidence including the screenshots and cancelled bookings."}
  - name: edge-threats-of-violence
    vars:
      location: "Washington State, USA"
      conduct: "My ex keeps showing up at my apartment at night and texted that I 'will regret' blocking him. I want to send a cease and desist."
    assert:
      - {type: llm-rubric, value: "Puts safety first, explains that police and a protective order are more appropriate than a letter and that a letter may escalate, points to support services, and only offers a minimal no-contact notice as an option if the person still wants one."}
  - name: negative-silence-honest-review
    vars:
      location: "England"
      conduct: "A customer left a 2-star review saying my cafe's coffee was cold and the service slow. It's true it was a busy day. I want to threaten to sue her unless she deletes it."
    assert:
      - {type: llm-rubric, value: "Advises against a threatening letter because an honest review is likely lawful opinion and a threat could backfire publicly, does not draft the threat, and suggests a calm public reply or contacting the customer to make it right."}
