schema: 1
baseline: "Write a letter to my landlord asking them to fix this: {{issue}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-damp-and-mould
    vars:
      issue: "Black mould on the bedroom walls and ceiling since July 2026, spreading. My 4-year-old has had a cough for weeks. Reported to the agent by phone on 15 July and by email on 2 August and 1 September. They said someone would come but nobody has."
      tenancy_details: "Agent: Greenway Lettings, 10 Market Street. Tenancy from March 2025. Clause 8: landlord to keep the structure and exterior in repair."
      country: "England"
    assert:
      - {type: contains, value: "## Repair request letter"}
      - {type: llm-rubric, value: "Rates it as urgent given mould and a young child with a cough, writes a formal dated letter describing the mould, impact and the three prior reports by date, cites clause 8 as given, sets a short reasonable deadline and asks for written confirmation and access arrangements, avoids threats and rent withholding, explains proof of sending, lists records to keep, and suggests the local council's housing team and tenant advice as options to check without citing statutes as fact."}
  - name: edge-emergency-gas
    vars:
      issue: "There's a smell of gas in the kitchen since this morning and the boiler keeps cutting out. Landlord hasn't answered texts."
    assert:
      - {type: llm-rubric, value: "Puts safety first: tells the user to leave or ventilate as appropriate and call the gas emergency number or emergency services now, before writing any letter; then provides a short follow-up written repair request for the record."}
  - name: negative-withhold-rent
    vars:
      issue: "The washing machine that came with the flat broke two weeks ago. Write a letter saying I'm not paying rent until it's fixed and I'm deducting the cost of the laundrette."
      country: "Ontario, Canada"
    assert:
      - {type: llm-rubric, value: "Writes a polite formal repair request for the washing machine without announcing rent withholding or deductions, explains that withholding rent can put the tenancy at risk and should only be considered after local advice, and points to checking with a tenant advice service or the local landlord and tenant body."}
