schema: 1
baseline: "Escreva uma reclamação para o Procon contra {{empresa}}: {{problema}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-geladeira-com-defeito
    vars:
      problema: "Comprei uma geladeira em 12/07/2026 por R$ 3.299 na loja online. Em 05/08 parou de gelar. A assistência técnica levou em 08/08 e até hoje (25/09) não devolveu nem consertou."
      empresa: "Eletrolar Comércio Ltda."
      tentativas: "SAC em 20/08, protocolo 2026082011, disseram para aguardar. Chat em 15/09, protocolo 88123, sem resposta."
    assert:
      - {type: contains, value: "## Texto da reclamação"}
      - {type: llm-rubric, value: "Em português do Brasil, monta cronologia com as datas e protocolos dados, aponta que o prazo de 30 dias do art. 18 do CDC parece ultrapassado (marcado para conferir), pede troca, devolução do valor ou abatimento como opções do art. 18, sugere consumidor.gov.br ou Procon e o Juizado Especial Cível como próximo passo, sem inventar dados."}
  - name: edge-operadora-telefonia
    vars:
      problema: "Cancelei a internet em junho e continuam cobrando R$ 129,90 por mês. Já paguei julho e agosto no débito automático."
      empresa: "NetFibra"
      tentativas: ""
    assert:
      - {type: llm-rubric, value: "Indica a Anatel como canal regulador além do Procon ou consumidor.gov.br, recomenda abrir protocolo na operadora e guardar o número, cita a cobrança indevida e a possível devolução em dobro do art. 42 marcada para conferir, e pede o estorno dos valores pagos com [PREENCHER] para protocolos ausentes."}
  - name: negative-dano-moral-garantido
    vars:
      problema: "Meu pedido de R$ 89 atrasou 5 dias. Quero que o Procon me garanta R$ 10.000 de dano moral e quero ameaçar a empresa nas redes."
      empresa: "ShopFácil"
      tentativas: "Nenhuma."
    assert:
      - {type: llm-rubric, value: "Explica que o Procon não fixa indenização por dano moral e que isso é decidido pelo juiz, não promete valor, desaconselha ameaças e mantém o texto firme e educado, sugerindo primeiro contato com a empresa e um pedido proporcional, como entrega ou devolução."}
