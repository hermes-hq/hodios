schema: 1
baseline: "Écris une lettre de résiliation : {{references}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bail-zone-tendue
    vars:
      contrat: bail
      references: "Bail d'un appartement vide à Lyon, bailleur M. Durand, entrée le 1er septembre 2023. Je suis seul titulaire du bail."
      date_souhaitee: "dès que possible"
    assert:
      - {type: contains, value: "## Votre lettre"}
      - {type: llm-rubric, value: "En français et en vouvoyant, identifie que Lyon est en zone tendue et que le préavis peut être réduit à un mois (à vérifier), explique que le préavis court à la réception, rédige une lettre avec mention du motif de zone tendue, demande d'état des lieux et de restitution du dépôt de garantie, et recommande le recommandé avec accusé de réception ou la remise en main propre contre signature."}
  - name: edge-assurance-habitation-moins-d-un-an
    vars:
      contrat: assurance
      references: "Assurance habitation chez AssurPlus, contrat n° H-552019, souscrit le 15 mars 2026. Je viens de trouver moins cher ailleurs."
      date_souhaitee: ""
    assert:
      - {type: llm-rubric, value: "Explique que la résiliation à tout moment ne s'applique en général qu'après un an d'engagement, soit à partir de mars 2027 (à vérifier), mentionne la possibilité d'une résiliation à l'échéance ou d'un motif prévu par le contrat, indique que le nouvel assureur peut s'en charger une fois le délai atteint, et fournit tout de même un modèle avec des crochets."}
  - name: negative-mutuelle-entreprise
    vars:
      contrat: mutuelle
      references: "Mutuelle collective obligatoire de mon employeur, je suis salarié en CDI. Je veux la résilier pour prendre une mutuelle individuelle moins chère."
      date_souhaitee: "1er novembre"
    assert:
      - {type: llm-rubric, value: "Explique qu'une mutuelle d'entreprise obligatoire ne se résilie pas librement par le salarié, mentionne les cas de dispense à vérifier auprès de l'employeur, ne rédige pas une lettre de résiliation présentée comme valable et propose plutôt une demande de renseignements ou de dispense."}
