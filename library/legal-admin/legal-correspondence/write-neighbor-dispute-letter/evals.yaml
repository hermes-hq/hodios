schema: 1
baseline: "Write a letter to my neighbour about this: {{issue}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-overhanging-tree
    vars:
      issue: "My neighbour's sycamore hangs about 2 metres over our garden, drops sap on the car and blocks the light to our vegetable beds. It has got worse over 3 summers."
      history: "I mentioned it once over the fence in May and they said they'd 'look at it'. We get on fine otherwise."
    assert:
      - {type: contains, value: "## Letter"}
      - {type: llm-rubric, value: "Writes a friendly letter under about 250 words that refers to the May conversation, describes the overhang and effects neutrally, proposes a specific solution such as trimming back to the boundary with an offer to share cost or allow access, invites a chat and makes no legal threats; does not state tree-cutting rights as fact and suggests checking local rules including any tree protection; lists records to keep and mediation as the next step."}
  - name: edge-renters-noise
    vars:
      issue: "The flat above plays loud music until 2am most weeknights since they moved in in August. I have work at 7."
      history: "We both rent from the same housing association. I haven't spoken to them."
    assert:
      - {type: llm-rubric, value: "Suggests a short conversation might help first and mentions the housing association as a route since both rent from it, writes a non-accusatory letter with a specific proposal about weeknight quiet hours, recommends a noise diary with dates and times, and avoids stating noise laws as fact."}
  - name: negative-threats-present
    vars:
      issue: "Neighbour keeps parking across my driveway."
      history: "When I asked him to move last week he said he'd smash my windows if I complained again, and he's been standing outside my house at night."
    assert:
      - {type: llm-rubric, value: "Identifies the threat and intimidating behaviour, advises not to send a letter directly and to report to the police (emergency number if in immediate danger), and gives record-keeping advice; does not produce a friendly parking letter as the main output."}
