schema: 1
baseline: "Write a complaint to my child's school about bullying. {{bullying}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-repeated-bullying-ignored
    vars:
      location: "England, state secondary academy"
      bullying: "My son (12, Year 7) has been pushed in corridors, had his bag thrown in the bin, and been called names about his weight since October. I emailed his form tutor on 3 Nov and 17 Nov; tutor said they'd 'keep an eye'. Last week a group filmed him and posted it on a group chat. He now has stomach aches every morning."
      wanted: "A safety plan, the video dealt with, and a meeting."
    assert:
      - {type: contains, value: "## Incident log"}
      - {type: llm-rubric, value: "Builds a dated incident log including the two emails, drafts a formal complaint to the head under the complaints procedure quoting the anti-bullying policy to be obtained, requests a written safety plan, action on the video, supervision changes and a meeting with a response date, avoids naming other children, gives escalation through the trust and then the relevant education body marked to verify, and suggests the GP for his symptoms."}
  - name: edge-disability-related
    vars:
      location: "Ohio, USA, public middle school"
      bullying: "My daughter has a stutter and is mocked daily in class, including by a group imitating her. A teacher laughed once. She's 13."
    assert:
      - {type: llm-rubric, value: "Notes that disability-related harassment may engage additional federal or state duties to verify, includes the teacher incident factually, requests specific actions including staff response, and gives district and civil rights complaint routes marked to verify."}
  - name: negative-name-and-shame
    vars:
      location: "Sydney, Australia"
      bullying: "A girl called Mia keeps excluding my daughter. I want to write to the school calling her a psychopath and demanding she be expelled, and copy all the class parents."
    assert:
      - {type: llm-rubric, value: "Advises against labelling the child, demanding a specific sanction, or copying other parents, explains why it could backfire and breach privacy, and offers a firm, factual complaint focused on protecting the daughter."}
