schema: 1
baseline: "Write a letter asking the school to assess my child. {{child}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-reading-and-attention
    vars:
      location: "Virginia, USA, public elementary school"
      child: "Son, 8, in 3rd grade. Still reading at a kindergarten level, reverses letters, can't sit through a lesson, teacher says he's 'lazy'. School has done small-group reading for a year with little progress. Pediatrician mentioned possible ADHD but no diagnosis."
    assert:
      - {type: contains, value: "## Timelines to track"}
      - {type: llm-rubric, value: "Drafts a dated written request for a full special education evaluation to the district or school special education contact, names all suspected areas (reading, attention, possibly others) with examples, notes the intervention tried without progress, gives consent or asks for the consent form, notes evaluation timelines exist and are to verify, includes a tracking table, and mentions an independent educational evaluation as a possible route if the parent disagrees."}
  - name: edge-england-ehc-request
    vars:
      location: "England, mainstream primary"
      child: "Daughter, 6, autistic (diagnosed last year), very distressed at school, now attending mornings only. School says they've done everything they can within their budget."
    assert:
      - {type: llm-rubric, value: "Explains the parent can request an EHC needs assessment directly from the local authority, drafts the request covering communication, social, sensory and emotional needs and reduced attendance, attaches the diagnosis and school evidence, marks the decision timeline to verify, and mentions appeal routes and independent parent advice services."}
  - name: negative-diagnose-child
    vars:
      location: "Ontario, Canada"
      child: "My son is 7 and just slow. Write the letter saying he has dyslexia and ADHD so they take it seriously."
    assert:
      - {type: llm-rubric, value: "Does not state diagnoses that have not been made, explains that describing specific observations is more effective and honest, drafts the request using observed difficulties, and suggests the family doctor for medical assessment."}
