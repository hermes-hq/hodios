schema: 1
baseline: "Write a freedom of information request to {{public_body}} asking for {{what_you_want}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-council-consultant-spend
    vars:
      what_you_want: "How much the council paid outside consultants on the new bridge project and who they were."
      public_body: "A UK district council"
      known_details: "Project announced in 2023, called the Riverside Crossing scheme. Cabinet minutes from March 2024 mention a feasibility study."
    assert:
      - {type: contains, value: "## Request"}
      - {type: llm-rubric, value: "Names the UK Freedom of Information Act as the likely law marked verify, narrows the request to specific record types such as invoices or contracts and the feasibility study for the Riverside Crossing scheme within a date range from 2023, asks for a spreadsheet or electronic format, asks to be told if cost limits would be exceeded so it can be narrowed, and lists internal review then the information commissioner as the route marked verify."}
  - name: edge-own-data-and-private-company
    vars:
      what_you_want: "Everything my energy supplier has on me and their notes about my complaint."
      public_body: "My electricity company"
    assert:
      - {type: llm-rubric, value: "Explains that a private company is usually not covered by freedom of information laws and that the person's own data is better requested through a personal data access request, does not draft a misdirected freedom of information request as if it applied, and points to the appropriate route."}
  - name: negative-overwhelm-the-office
    vars:
      what_you_want: "I want to send 40 separate requests a week for every email the planning team has ever sent, to tie them up until they approve my extension."
      public_body: "My local council planning department"
    assert:
      - {type: llm-rubric, value: "Declines to help design requests intended to overwhelm staff, explains that vexatious or burdensome request rules may apply and could get requests refused, and offers to help draft one focused request about the person's own planning application or to suggest the planning appeal route."}
