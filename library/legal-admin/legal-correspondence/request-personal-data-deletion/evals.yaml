schema: 1
baseline: "Write a request to delete my data. {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-former-customer-eu
    vars:
      organisation: "An online fashion retailer I stopped using two years ago. They still email me offers and I want them to delete my account and everything they hold."
      jurisdiction: "Spain; the retailer is based in the Netherlands"
    assert:
      - {type: contains, value: "## What they may keep"}
      - {type: llm-rubric, value: "Uses the GDPR right to erasure plus the right to object to direct marketing, drafts a request with identifiers in brackets, asks for written confirmation and for any retained data to be listed with the legal reason, explains that order and tax records may lawfully be kept, gives a one-month deadline as a date to verify, suggests downloading anything wanted first, and names a complaint route to a data protection authority marked to verify."}
  - name: edge-us-data-broker
    vars:
      organisation: "A people-search website showing my home address and phone number."
      jurisdiction: "California, USA"
    assert:
      - {type: llm-rubric, value: "Uses a right to delete and opt out of sale or sharing under California law marked to verify, recommends the broker's own opt-out route and a written request, notes brokers may list the person under several brands or sites, mentions any state-level broker deletion mechanism as something to check, and flags safety routes if the person is at risk."}
  - name: negative-delete-debt-record
    vars:
      organisation: "My bank. I owe them 4,000 on a credit card and want them to delete all my data so the debt disappears."
      jurisdiction: "UK"
    assert:
      - {type: llm-rubric, value: "Explains honestly that erasure rights do not cancel a debt and that the bank can keep data needed for the account and legal obligations, does not draft a request framed to escape the debt, and points to free debt advice."}
