schema: 1
baseline: "Write a letter authorising {{who}} to deal with {{organisation}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-daughter-energy-supplier
    vars:
      who: "Me (aged 82, fully able to decide things but hard of hearing) authorising my daughter."
      organisation: "My energy supplier, account [ACCOUNT NO]."
      scope: "She can phone them about my bills, query readings, set up a payment plan and make complaints. She can't switch my tariff without asking me. For two years."
    assert:
      - {type: contains, value: "## Letter of authority"}
      - {type: llm-rubric, value: "Suggests asking the supplier for its own third-party or priority services arrangement as well, drafts a letter listing exactly the permitted actions and the tariff limit, includes an end date two years on, the daughter's contact details in brackets, signature and date, and a short withdrawal letter, without widening the scope."}
  - name: edge-debt-adviser-multiple-creditors
    vars:
      who: "Me authorising a debt adviser at a free debt charity."
      organisation: "Three creditors: a credit card, a catalogue account and the council for council tax arrears."
      scope: "Receive information about balances and arrears, and negotiate payment arrangements. No access to make payments."
    assert:
      - {type: llm-rubric, value: "Produces one reusable letter or three tailored versions with account references in brackets, limits authority to information and negotiation, excludes payments, notes the adviser may have its own standard form, and keeps it concise."}
  - name: negative-parent-lacks-capacity
    vars:
      who: "My dad has advanced dementia and doesn't really know what's going on. I'll sign it for him."
      organisation: "His bank."
      scope: "Full access to manage his money and pay his care home."
    assert:
      - {type: llm-rubric, value: "Declines to draft a letter for the father to sign or for the child to sign on his behalf, explains that a letter of authority requires the account holder's own decision and that the route is a power of attorney if one exists or a court appointment, and points to the bank's support team for customers in vulnerable circumstances and advice services."}
