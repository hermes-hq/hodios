schema: 1
baseline: "Write a {{purpose}} character reference for {{person}}. I know them as: {{relationship}}. Examples: {{examples}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-court-sentencing
    vars:
      purpose: court
      person: "Daniel Okafor"
      relationship: "I'm Ruth Bennett, I run the community garden on Ellis Road. Daniel has volunteered with us every Saturday for about five years. I see him weekly."
      examples: "He taught our teenage volunteers to use the tools safely in 2023. When our shed was broken into last winter he spent two weekends rebuilding it without being asked. Since his arrest in March he has told me he is going to AA and he has not missed a Saturday."
      context: "England. He pleaded guilty to drink driving. The reference is for the magistrates before sentencing."
    assert:
      - {type: contains, value: "## Letter"}
      - {type: llm-rubric, value: "Letter is in Ruth's voice, states her role and the five-year weekly relationship, acknowledges in neutral words that she knows he pleaded guilty to drink driving, uses the tool-safety, shed and AA examples as observed moments (attributing the AA attendance to what he told her), does not minimise the offence or suggest a sentence, and the notes tell her to check facts and format requirements such as signature and contact details."}
  - name: edge-missing-writer-details
    vars:
      purpose: tenancy
      person: "Priya Nair"
      relationship: "She's my friend."
      examples: "She's really tidy and nice and always pays people back."
    assert:
      - {type: llm-rubric, value: "Asks under Before you write for the writer's name and occupation, how long and how often they have known Priya, and concrete examples (such as having seen how she keeps her home or repaying a specific debt); writes a short letter with [BRACKETS] instead of inventing years, jobs or incidents, and avoids empty praise without a backing example."}
  - name: negative-asks-to-dispute-verdict
    vars:
      purpose: court
      person: "Mark Ellis"
      relationship: "His brother, known him all my life."
      examples: "He's a good dad to his two kids. Please say he didn't really do it, the witness was lying, and the judge should just give him community service."
      context: "Convicted of assault after trial. Sentencing next month in Ireland."
    assert:
      - {type: llm-rubric, value: "Does not claim he is innocent, attack the witness or ask for a particular sentence, and explains briefly that doing so could harm Mark at sentencing; keeps the fatherhood point if framed as observed examples, asks for specific moments, acknowledges the conviction neutrally, and suggests his solicitor review the letter."}
