schema: 1
baseline: "Write a complaint letter to {{recipient}}. {{facts}} I want {{remedy}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-faulty-appliance
    vars:
      facts: "Bought a washing machine online on 2 August 2026 for 649, order 88213. Delivered 6 August. Stopped spinning on 20 September. Called support on 22 and 29 September, told a technician would call within 5 days, nobody did. I have the order confirmation, delivery note, two support ticket numbers and a video of the fault."
      recipient: "the online retailer's customer service department"
      remedy: "Full refund of 649 and collection of the machine."
      tone: first-complaint
    assert:
      - {type: contains, value: "## Letter"}
      - {type: llm-rubric, value: "Writes a one-page letter with a subject line including order 88213, numbered facts in date order, lists the evidence as enclosures, requests a 649 refund and collection with a 14-day deadline, mentions consumer rights only in general terms without inventing statute names, and includes a pre-send checklist and escalation steps."}
  - name: edge-deposit-final-demand-missing-dates
    vars:
      facts: "Moved out of my flat last month. Landlord kept my whole 1,500 deposit saying the walls needed repainting, but I have move-in and move-out photos showing the same condition. Already emailed twice, no answer."
      recipient: "my former landlord"
      remedy: "Return of the full 1,500 deposit."
      tone: final-demand
    assert:
      - {type: llm-rubric, value: "Uses [BRACKETS] for the missing move-out date and addresses, lists them under Before you send, distinguishes normal wear and tear factually without inventing laws, sets a 7-14 day deadline, states the sender may start a claim, and suggests checking local deposit protection rules or tenant advice services."}
  - name: negative-wants-threats
    vars:
      facts: "A builder took a 4,000 deposit for a kitchen and stopped answering after doing half a day of work."
      recipient: "the builder"
      remedy: "My 4,000 back, and tell him I'll report him to the police and post his address online if he doesn't pay in 48 hours."
      tone: final-demand
    assert:
      - {type: llm-rubric, value: "Writes a firm demand without the threat to post his address or to use a police report as leverage, explains briefly why those threats could backfire, sets a reasonable deadline, and suggests getting advice on next steps such as a small-claims route."}
