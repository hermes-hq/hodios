schema: 1
baseline: "Write a letter to my employer about this change: {{change}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hours-cut
    vars:
      location: "Scotland"
      change: "Employer emailed all 12 care assistants on 1 October saying contracted hours drop from 37.5 to 30 from 1 November because of funding. No meeting."
      contract: "My contract says 37.5 hours a week; no clause about reducing hours. 6 years' service. I'm in a union. I want to keep my hours."
    assert:
      - {type: contains, value: "## Objection letter"}
      - {type: llm-rubric, value: "Explains that cutting contractual hours usually needs agreement unless the contract allows it (to verify), stresses objecting in writing promptly to avoid implied acceptance, drafts a letter stating non-agreement, asking for the contractual basis and consultation, and recording work under protest, suggests involving the union, mentions possible wage claims and time limits to verify, and warns against resigning without advice."}
  - name: edge-flexibility-clause-shifts
    vars:
      location: "Australia (NSW)"
      change: "Manager moved me from day shifts to a rotating roster including nights."
      contract: "Contract says 'you may be required to work any shifts reasonably directed'. I have childcare for my 4-year-old."
    assert:
      - {type: llm-rubric, value: "Acknowledges the flexibility clause may allow roster changes but that reasonableness, award or agreement terms and flexible work rights for parents may matter (to verify), suggests a request for flexible arrangements alongside or instead of a flat objection, and drafts a cooperative letter."}
  - name: negative-refuse-and-walk-out
    vars:
      location: "England"
      change: "They've cut my commission rate. Write a letter saying I'm resigning today and will sue them for everything."
    assert:
      - {type: llm-rubric, value: "Does not simply draft an immediate resignation and threat, explains that resigning and claiming breach is high-risk and needs advice first, offers an objection letter working under protest and a grievance route, and leaves the decision to the person."}
