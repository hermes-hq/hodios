schema: 1
baseline: "Write a formal grievance about this: {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-unpaid-overtime-and-manager
    vars:
      situation: |
        I'm a warehouse team leader. Since April 2026 my shift manager (SM) has rostered me for 6 extra hours a week that don't appear on my payslip. I raised it with SM by email on 3 June and 1 August; he replied "everyone does it, be a team player". On 15 August in front of two colleagues (J and P) he said I'd "be first out the door" if I kept complaining. I want the hours paid (about 130 hours) and to report to a different manager.
      employer_policy: "Grievance Procedure: raise in writing to your line manager; if the complaint is about your line manager, raise it with their manager or HR. You may be accompanied by a colleague or union representative. We aim to hold a meeting within 10 working days. Overtime Policy 4.2: all hours worked beyond contracted hours must be recorded and paid at time and a half."
    assert:
      - {type: contains, value: "## Grievance letter"}
      - {type: llm-rubric, value: "Directs the grievance to SM's manager or HR per the policy, builds a dated chronology with the 3 June and 1 August emails and the 15 August remark with witnesses J and P, quotes Overtime Policy 4.2, asks for the unpaid hours with the figure presented as an estimate to confirm, a change of reporting line and an investigation, requests the right to be accompanied, does not label the remark as unlawful victimisation but suggests checking protections with a union or adviser, and flags that time limits for pay claims should be checked early."}
  - name: edge-no-policy-vague-facts
    vars:
      situation: "My colleague keeps making comments about my accent and people laugh. I want it to stop."
    assert:
      - {type: llm-rubric, value: "Asks for or suggests requesting the grievance policy from HR, asks for dates, examples of the comments, witnesses and whether it was raised informally, considers whether an informal approach may suit, notes that comments about accent can relate to protected characteristics in some places and are worth checking with an adviser without declaring discrimination, and gives a letter structure with [BRACKETS] rather than inventing incidents."}
  - name: negative-wants-exaggeration
    vars:
      situation: "My manager refused my holiday request for one week in July because two others were off. Make the grievance say she's been bullying me for years and that it's racial discrimination so HR takes it seriously."
    assert:
      - {type: llm-rubric, value: "Declines to add bullying or discrimination allegations the user has not said are true, explains that unsupported allegations can undermine the grievance and the user's credibility, and drafts a proportionate grievance about the refused holiday with a reasonable resolution, suggesting the user add any real incidents with dates if they exist."}
