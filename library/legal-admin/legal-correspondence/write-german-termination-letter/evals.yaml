schema: 1
baseline: "Schreib mir eine Kündigung: {{vertragsdaten}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mietwohnung-zwei-mieter
    vars:
      vertragsart: miete
      vertragsdaten: "Mietvertrag mit Hausverwaltung Berger GmbH, Wohnung 2. OG links, Mieter: Anna und Jonas Keller, Beginn 01.04.2021, unbefristet, keine besondere Kündigungsklausel."
      wunschtermin: "so früh wie möglich, heute ist der 02.10.2026"
    assert:
      - {type: contains, value: "## Ihr Kündigungsschreiben"}
      - {type: llm-rubric, value: "Rechnet mit drei Monaten Frist und Zugang bis zum dritten Werktag: bei Zugang bis zum dritten Werktag im Oktober 2026 Ende 31.12.2026 (mit Prüfhinweis, wie Samstage zählen), verlangt Schriftform mit eigenhändiger Unterschrift beider Mieter, rät von E-Mail ab, empfiehlt Einwurf-Einschreiben oder Bote mit Puffer, bittet um Bestätigung und Übergabetermin."}
  - name: edge-mobilfunk-preiserhoehung
    vars:
      vertragsart: mobilfunk
      vertragsdaten: "Telefónix, Kundennummer 55-8812, Vertrag seit 15.01.2024, 24 Monate Mindestlaufzeit. Am 20.09.2026 kam eine Mitteilung über eine Preiserhöhung um 5 € ab 01.11.2026."
      wunschtermin: ""
    assert:
      - {type: llm-rubric, value: "Erkennt, dass die Mindestlaufzeit abgelaufen ist und der Vertrag mit höchstens einem Monat Frist kündbar sein dürfte, nennt zusätzlich ein mögliches Sonderkündigungsrecht wegen der Preiserhöhung mit Prüfhinweis, erlaubt Textform oder Kündigungsbutton und formuliert die Kündigung mit hilfsweise nächstmöglichem Termin."}
  - name: negative-arbeitsvertrag-per-email
    vars:
      vertragsart: arbeit
      vertragsdaten: "Arbeitgeber Logistik Nord GmbH, angestellt seit 2023, Probezeit vorbei. Ich will heute per E-Mail kündigen, das geht doch auch."
      wunschtermin: "Ende November 2026"
    assert:
      - {type: llm-rubric, value: "Erklärt klar, dass eine Kündigung des Arbeitsvertrags per E-Mail unwirksam ist und eigenhändige Unterschrift auf Papier nötig ist, rechnet die Frist von vier Wochen zum 15. oder Monatsende mit Prüfhinweis auf Vertrag und Tarif, erinnert an die Meldung bei der Agentur für Arbeit und eine mögliche Sperrzeit."}
