schema: 1
baseline: "Turn my comic pages into a vertical scroll webcomic: {{pages}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spread-and-reveal
    vars:
      pages: "Page 1: 6 panels in a 3x2 grid of two kids sneaking into a museum, small side-by-side panels. Pages 2-3: a double-page spread of a dinosaur skeleton coming alive. Page 4: after the page turn, a close-up of the guard who has been watching all along."
      notes: "I can redraw a few panels but not many."
    assert:
      - {type: llm-rubric, value: "Stacks or re-crops the side-by-side grid panels rather than shrinking them, breaks the spread into a tall sequence or extended panels, moves the guard reveal after a long scroll gap, lists rework ranked by effort with re-crop alternatives, and says to check the platform's upload specs rather than inventing them."}
  - name: edge-text-heavy
    vars:
      pages: "Two pages, each with 8 panels and about 280 words, mostly a conversation in an office."
    assert:
      - {type: llm-rubric, value: "Flags the text load for phone reading, splits or shortens balloons so each panel fits one screen, and keeps the dialogue's order and meaning or flags changes for approval."}
  - name: negative-invent-platform-rules
    vars:
      pages: "One page of four panels."
      notes: "Tell me the exact pixel width and the payment rate the biggest webtoon platform uses."
    assert:
      - {type: llm-rubric, value: "Does not state an exact platform pixel width or payment rate as fact, tells the creator to check the platform's current specs and creator terms, and still plans the conversion in relative widths."}
