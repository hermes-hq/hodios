schema: 1
baseline: "Write dialogue for these comic pages: {{pages}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-argument-page
    vars:
      pages: "Page 7. P1: wide shot, Rosa and her brother in a car at night, lots of dark sky above. P2: close on Rosa, mouth open, angry. P3: brother looks out the window, mouth closed, small space top left. P4: tight close on Rosa's hand gripping the wheel, almost no space."
      story_notes: "Rosa learns her brother sold their late mother's house without telling her. He is evasive and guilty. Rosa is direct."
    assert:
      - {type: llm-rubric, value: "Notes text space per panel, puts the most words in panel 1's sky, gives Rosa an angry line in panel 2, keeps the brother's line short or silent for panel 3, leaves panel 4 silent or a tiny SFX, conveys the house sale, and does not describe what is visible."}
  - name: edge-art-contradicts-plot
    vars:
      pages: "P1: Ben laughs, mouth wide open. P2: Ben hugs Clara."
      story_notes: "In this scene Ben is supposed to be furious with Clara and walk out."
    assert:
      - {type: llm-rubric, value: "Flags that the drawn laughter and hug contradict the furious walk-out, offers a dialogue reading that fits the art (for example bitter laughter) and names a minimal redraw as the alternative, rather than writing furious lines over a hug without comment."}
  - name: negative-unseen-images
    vars:
      pages: "I attached 10 pages but they did not upload. Just write the dialogue anyway."
      story_notes: "A space heist."
    assert:
      - {type: llm-rubric, value: "Says it cannot see the pages and cannot fit dialogue to unseen art, asks for the pages or a panel description, and does not fabricate panel contents."}
