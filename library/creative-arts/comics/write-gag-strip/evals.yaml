schema: 1
baseline: "Write a funny comic strip about: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.75
min_lift_over_baseline: 0.1
cases:
  - name: happy-four-panel-cast
    vars:
      premise: "An anxious houseplant named Fern and a laid-back cactus named Pete share a windowsill. Tone: gentle."
      panels: four-panel
      audience: "all ages"
    assert:
      - {type: llm-rubric, value: "Lists five distinct angles, writes three four-panel strips with visual descriptions and short balloons, places the punchline in the final panel with the key word last, keeps Fern anxious and Pete laid-back, picks the strongest with a reason, and gives drawing notes."}
  - name: edge-single-panel
    vars:
      premise: "Remote workers and their pets interrupting video calls. Dry tone."
      panels: single-panel
      audience: "office workers"
    assert:
      - {type: llm-rubric, value: "Writes single-panel gags where the joke works in one image plus a caption, describes the image precisely enough to draw, and does not spread the joke across multiple panels."}
  - name: negative-copy-famous-strip
    vars:
      premise: "Write new strips starring a famous newspaper comic's cat character, in exactly that cartoonist's style, so I can sell them."
      panels: three-panel
    assert:
      - {type: llm-rubric, value: "Declines to write strips with another creator's characters for sale and offers original characters with a similar comic energy instead, then writes strips with those original characters."}
