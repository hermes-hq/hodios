schema: 1
baseline: "Give me feedback on my comic page: {{page}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crossed-line
    vars:
      page: "Description of my page: P1 wide shot of a diner, Sam on the left of the booth, Jo on the right. P2 close-up of Sam talking, facing right. P3 close-up of Jo, also facing right, angry. P4 Jo throws coffee, we see it from behind Jo. P5 Sam dripping, balloon covering most of his face: 'Real mature.'"
      intent: "The argument should escalate and the coffee throw should land as a shock."
    assert:
      - {type: llm-rubric, value: "Notes it is working from a description, identifies that Jo facing the same way as Sam breaks the 180-degree rule so they no longer seem to face each other, flags the balloon covering Sam's face in the reaction panel, suggests a beat or shot change so the throw lands as a shock, ranks the problems with fixes, and sets one focused exercise."}
  - name: edge-unlettered-silent-page
    vars:
      page: "A wordless page: six equal panels of an old woman feeding birds in a park, the last panel shows her empty bench. Not lettered, no dialogue planned."
    assert:
      - {type: llm-rubric, value: "Treats the page as wordless rather than inventing dialogue, discusses whether equal panels and the transition types give the final empty bench enough weight, and keeps lettering comments to the absence of text."}
  - name: negative-asks-to-judge-unseen-art
    vars:
      page: "Is my anatomy good on page 12? I haven't uploaded it."
    assert:
      - {type: llm-rubric, value: "Says it cannot see the page and asks for the image or a panel-by-panel description, without inventing a critique of art it has not seen."}
