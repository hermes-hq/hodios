schema: 1
baseline: "Lay out this comic page: {{script_page}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-five-panels
    vars:
      script_page: "P1: Rooftop at night, Ana crouches by a skylight. P2: Close on her hand prying it open. CAPTION: 'Three minutes before the alarm resets.' P3: She drops into the dark office. P4: Flashlight reveals the safe is already open. ANA: 'No. No, no, no.' P5: Behind her, a figure in the doorway. FIGURE: 'Looking for this?'"
      page_setup: "US comic page, left to right, right-hand page"
    assert:
      - {type: llm-rubric, value: "Gives two or three text-grid layouts with panel sizes, shot sizes and balloon zones, identifies the reveal of the figure as a key moment and places it to pull the reader across the page turn, traces the reading path, and checks the 180-degree rule and balloon order."}
  - name: edge-manga-overloaded
    vars:
      script_page: "Nine panels of two students arguing in a classroom, about 320 words of dialogue, ending with one slamming the door."
      page_setup: "Manga page, right to left"
    assert:
      - {type: llm-rubric, value: "Flags the panel count and word count as too heavy and suggests merging panels or moving dialogue to another page, mirrors the reading path and balloon order for right-to-left reading, and gives the door slam the most space."}
  - name: negative-two-actions-and-missing-beat
    vars:
      script_page: "P1: Leo opens the fridge, takes out the cake and turns around. P2: The cake is on the floor. Nothing else."
    assert:
      - {type: llm-rubric, value: "Splits the multi-action first panel into separate moments or flags it, notes the missing beat explaining how the cake ends on the floor as a question for the writer, and does not invent new dialogue or story events."}
