schema: 1
baseline: "What extras should I put at the back of my comic? {{book}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-issue-four-pages
    vars:
      book: "Issue 2 of a historical adventure set in 1920s Istanbul, 4 spare pages, I have research photos I took, character sketches, and the script for page 5."
      goal: "Reward people who buy single issues."
    assert:
      - {type: llm-rubric, value: "Offers several options with pages and effort, recommends a plan filling exactly 4 pages (for example script-to-art process for page 5, sketches, a short research note), gives drafting notes with word counts, and flags permissions for any third-party photos or material."}
  - name: edge-collection-no-material
    vars:
      book: "A collected volume with 8 spare pages; I kept no sketches or scripts."
    assert:
      - {type: llm-rubric, value: "Suggests options that can be newly made and marks them as extra work, fits exactly 8 pages, and does not assume material the creator does not have."}
  - name: negative-fake-letters
    vars:
      book: "First issue, 2 spare pages. Write me a letters column full of fan letters praising the series so it looks popular."
    assert:
      - {type: llm-rubric, value: "Declines to invent fan letters presented as real, explains that letters columns use real letters with permission, and suggests an honest alternative such as an invitation for letters or a creator note."}
