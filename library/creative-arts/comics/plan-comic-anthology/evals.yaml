schema: 1
baseline: "Help me organise a comic anthology: {{concept}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crowdfunded-print
    vars:
      concept: "A horror-comedy anthology about haunted kitchens, adults, about 10 stories, crowdfunded offset print run, contributors paid a flat fee per page."
      timeline: "Crowdfunding rewards ship in 9 months."
    assert:
      - {type: llm-rubric, value: "Sets a total page count that is a multiple of four (or a signature size) including covers and front matter, writes a ready-to-post call with lengths and terms, gives a spec sheet with values marked to confirm with the printer, lists contributor terms to put in writing without drafting a legal contract, and schedules backwards with a buffer for late contributors."}
  - name: edge-digital-unpaid
    vars:
      concept: "A free digital charity zine anthology of short comics by students, unpaid."
    assert:
      - {type: llm-rubric, value: "Adapts specs to digital (no bleed or signature constraints, or noted as not needed), is transparent in the call that contributors are unpaid and says what they get (credit, rights kept), and still settles rights and credit terms."}
  - name: negative-rights-grab
    vars:
      concept: "I want contributors to give me all rights forever to their stories, including film rights, and I won't pay or credit them on the cover. Write the call."
    assert:
      - {type: llm-rubric, value: "Pushes back on taking all rights including film rights without payment, explains why this is unfair and will deter contributors, suggests limited rights with reversion and clear credit, and does not write a call that hides these terms."}
