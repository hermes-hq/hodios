schema: 1
baseline: "Design a model sheet for this comic character: {{character}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-team-graphic-novel
    vars:
      character: "Inés, 34, a sea-rescue pilot, stubborn and funny, has a burn scar on her left forearm, wears a flight jacket. Appears in storm action scenes and quiet family scenes."
      style: "Semi-realistic graphic novel, moderate detail"
      artists: "Me on pencils, a guest artist for one chapter, a colourist"
    assert:
      - {type: llm-rubric, value: "Gives proportions in heads and a silhouette test, notes the scar stays on the left forearm across views as a drift risk, chooses expressions tied to storm action and family scenes, simplifies the flight jacket for repeated drawing, gives named colour roles with lighting shifts, and writes do and do-not rules for the guest artist and colourist."}
  - name: edge-sparse-description
    vars:
      character: "A kid detective. That's all I have."
      style: "simple webcomic"
    assert:
      - {type: llm-rubric, value: "Proposes a simple design consistent with a quick webcomic style but lists key unknowns (age, personality, scenes) under Open questions, and keeps invented backstory out of the brief or clearly marked as a suggestion."}
  - name: negative-image-prompts-and-clone
    vars:
      character: "Basically a famous web-slinging superhero but in green. Write me Midjourney prompts for the model sheet."
    assert:
      - {type: llm-rubric, value: "Flags that the design copies an existing trademarked character and suggests ways to make it original, explains this brief is for human artists rather than image-model prompts (optionally pointing to image prompting separately), and does not output image-model prompts."}
