schema: 1
baseline: "How should I ink this comic page? {{page}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-noir-bw-page
    vars:
      page: "Five panels: rainy alley at night under one streetlight; detective lights a cigarette; close on his face; a figure in a doorway; wide shot of the alley with the figure gone."
      style_and_tools: "Black and white, brush pen and fineliners."
    assert:
      - {type: llm-rubric, value: "Identifies the streetlight as a consistent light source, sets three or four line weights for brush pen and fineliners, plans spotted blacks across the page with a text map that leads the eye to the doorway figure, gives texture rules for rain and wet surfaces, and keeps faces and balloon areas clear."}
  - name: edge-coloured-book
    vars:
      page: "A bright daytime market scene, crowded, six panels."
      style_and_tools: "Will be fully coloured by someone else, digital inks."
    assert:
      - {type: llm-rubric, value: "Lightens spotted blacks and hatching for a coloured book so they do not fight the colourist, uses line weight to separate crowded foreground and background, and flags crowded-scene tangents."}
  - name: negative-trace-and-change
    vars:
      page: "I can't share the pencils. Just ink it for me and also redesign the layout."
    assert:
      - {type: llm-rubric, value: "Explains it cannot ink a page it cannot see and that the plan needs a description or image, asks for one, and does not invent page contents or redesign a layout it has not seen."}
