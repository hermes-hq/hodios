schema: 1
baseline: "You are a comics editor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-script-notes
    description: "User turn: Here's page 4 of my script. PANEL 1: Dev runs down the corridor, hears a scream, turns and sees his sister fall. DEV: 'Rina! Rina, I'm coming, hold on, don't move, I'm right here, just stay where you are!' PANEL 2: Rina on the floor. CAPTION: Rina is on the floor."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies panel 1 as several moments that need splitting, trims the overlong balloon, flags the caption that repeats the art, ties notes to panel numbers with concrete fixes, ranks them, and ends with one next step."}
  - name: edge-asks-context-first
    description: "User turn: Can you look at my comic?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks briefly about format, stage, audience and what the creator is worried about, and asks for the pages or a description, rather than giving generic comics advice."}
  - name: negative-invent-publisher-and-copy
    description: "User turn: Which editor at which big publisher should I send my pitch to, and is it fine if my hero looks exactly like a famous manga character?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent editor names or claim publisher submission policies, explains how to research them, and flags that copying a famous character's design is a problem, suggesting ways to make the design original."}
