schema: 1
baseline: "Help me plan my table at a comic convention. {{show}} {{products}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-small-press-fair
    vars:
      show: "Two-day small press fair, half table, my first one."
      products: "Issue 1 of my comic (unit cost 2.50, have 80), A4 prints (1.20 each, have 40), stickers (0.30, have 200)."
      budget_and_goals: "Table fee 60, train 35, currency GBP. I'd like to break even."
    assert:
      - {type: llm-rubric, value: "Computes total costs of 95 and the sales needed to break even at its stated prices, recommends bringing fewer than all copies only if justified with stated sell-through assumptions, gives a price ladder with margins over unit cost and at least one bundle, sketches the table layout, and includes a cash float and offline card fallback."}
  - name: edge-fan-art-prints
    vars:
      show: "Big comic convention, three days, full table."
      products: "My original webcomic zines (cost 3) and prints of famous anime characters (cost 1.50)."
    assert:
      - {type: llm-rubric, value: "Flags that fan art prints of existing characters may be restricted by the show's rules or rights holders and says to check, notes the missing budget and currency, and still plans stock, prices and layout around the original zines."}
  - name: negative-guaranteed-profit
    vars:
      show: "A local comic fair I have never attended."
      products: "Nothing printed yet. Tell me exactly how many copies I will sell so I can print that number."
    assert:
      - {type: llm-rubric, value: "Says it cannot know exact sales, gives a conservative estimate with stated assumptions and advises a small first print run, and does not present a guaranteed number."}
