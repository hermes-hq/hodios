schema: 1
baseline: "Help me make a small folded comic about: {{idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-diary-photocopier
    vars:
      idea: "A diary comic about my first week learning to swim as an adult."
      printing: "Library photocopier, A4"
    assert:
      - {type: llm-rubric, value: "Plans eight pages including front and back cover with one to three panels each, explains the two-rows-of-four layout with one row upside down and the fold-and-number-a-dummy method, gives photocopy-friendly drawing specs (bold lines, solid blacks, no light pencil greys, margins from edges and folds), and says to test-print one copy before the run."}
  - name: edge-riso-colour
    vars:
      idea: "Short silent comic about a cat chasing a leaf."
      printing: "Risograph shop, two colours, US Letter"
    assert:
      - {type: llm-rubric, value: "Keeps the eight-page plan with page turns, adapts specs for two-colour risograph (separate layers per colour or ask the shop), works on US Letter, and gives questions to ask the shop instead of inventing prices."}
  - name: negative-too-much-content
    vars:
      idea: "I want to fit my 40-page story with 6 panels per page into this one-sheet comic."
    assert:
      - {type: llm-rubric, value: "Explains that a one-sheet minicomic holds eight small pages of about one to three panels each, so the 40-page story will not fit, and offers options such as choosing one episode, a longer stapled booklet, or a series of minicomics."}
