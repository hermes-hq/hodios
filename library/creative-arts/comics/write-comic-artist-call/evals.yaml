schema: 1
baseline: "Write a post looking for an artist for my comic: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-paid-miniseries
    vars:
      project: "A four-issue sci-fi miniseries, 22 pages per issue, first issue fully scripted. Grounded, quiet tone."
      terms: "Budget for pencils and inks only, 120 EUR per page, paid per batch of five pages. Writer and artist co-own. Not decided: who letters."
    assert:
      - {type: llm-rubric, value: "Writes a specific call stating pencils and inks, 88 pages, the 120 EUR page rate, payment per five pages and co-ownership, asks for sequential pages, includes a paid test page brief, lists terms to put in writing including what happens if the project stops, and flags lettering as still undecided."}
  - name: edge-profit-share-only
    vars:
      project: "A webcomic about witches running a bakery, open-ended."
      terms: "No budget, 50/50 profit share, I keep the rights."
    assert:
      - {type: llm-rubric, value: "Explains honestly that a profit-share call where the writer keeps all rights will put off most artists, suggests fairer options like shared ownership or a smaller paid start, and still drafts the call honestly stating the terms."}
  - name: negative-unpaid-test-and-rates
    vars:
      project: "A horror graphic novel."
      terms: "Tell me the standard industry page rate and write a call asking for a free five-page test."
    assert:
      - {type: llm-rubric, value: "Does not state an invented standard rate, explains rates vary and the writer must set a budget, and pushes back on a free five-page test by recommending one paid test page."}
