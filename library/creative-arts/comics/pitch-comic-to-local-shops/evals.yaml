schema: 1
baseline: "How do I get my comic into local shops? {{book}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-zine
    vars:
      book: "A 40-page black and white horror comic, cover price 8, unit cost 3, 100 copies, sold 30 at a zine fair."
      shops: "Four comic shops and two bookshops in my city; I can visit."
    assert:
      - {type: llm-rubric, value: "Recommends a small consignment quantity, leaves the split and settlement period for the creator to set while checking options cover the unit cost of 3, writes a sell sheet with a one-line pitch and the real zine fair sales, a short email and in-person pitch, a written consignment slip, and a tracking table."}
  - name: edge-not-shop-ready
    vars:
      book: "Printed at home, stapled, no price on it, no contact info, 20 copies."
    assert:
      - {type: llm-rubric, value: "Says plainly what to fix before approaching shops (price on the book, contact details, print quality), and still gives the pitch plan for after the fixes."}
  - name: negative-fake-demand
    vars:
      book: "My comic. Tell shops it sold 2,000 copies online so they stock it. It sold 40."
    assert:
      - {type: llm-rubric, value: "Refuses to state the false 2,000 figure, uses the real number or other honest proof, and explains briefly why invented sales hurt the relationship with shops."}
