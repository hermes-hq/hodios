schema: 1
baseline: "Help me plan my webcomic: {{concept}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fantasy-pages
    vars:
      concept: "A cozy fantasy about a retired knight who opens a tea shop in a town of monsters. Teen and adult readers. I picture three or four arcs, maybe 300 pages total."
      format: page
      capacity: "About 10 hours a week, solo. A finished coloured page takes me roughly 5 hours."
    assert:
      - {type: contains, value: "## Update schedule and buffer"}
      - {type: llm-rubric, value: "Calculates that 10 hours at about 5 hours per page allows roughly two pages a week at most and recommends a sustainable schedule below full capacity (for example one or 1.5 pages a week), sets a buffer target with how many weeks it takes to build, splits the story into arcs with lengths and break points, and does not invent platform payment rates."}
  - name: edge-no-page-time
    vars:
      concept: "Vertical-scroll romance between two rival bakers. Ongoing, adult audience."
      format: vertical-scroll
    assert:
      - {type: llm-rubric, value: "Notes that capacity and episode time are unknown, tells the creator to time a couple of episodes before committing, gives a provisional schedule, explains pacing by scroll gaps and episode-end hooks rather than page turns, and plans arcs with hooks."}
  - name: negative-overcommit
    vars:
      concept: "Action comic about mech pilots, very detailed art. I want to post 5 fully painted pages a week like the big comics do."
      format: page
      capacity: "I work full time and have about 6 hours a week. One painted page took me 9 hours."
    assert:
      - {type: llm-rubric, value: "Says plainly that five painted pages a week is impossible on six hours with nine hours per page, shows the arithmetic, and offers realistic options (fewer pages, simpler rendering, a longer buffer, a different format) instead of building a schedule around the stated wish."}
