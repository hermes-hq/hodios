schema: 1
baseline: "Write a pitch for my graphic novel: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-middle-grade-team
    vars:
      project: "Moth Lantern. Middle-grade fantasy graphic novel, about 240 pages, full colour. Eleven-year-old Pip must guide lost spirits home before the solstice; she learns to let go of her late grandmother. Ending: Pip guides her grandmother's spirit home herself. Full script done, 10 finished pages, character designs done."
      creators: "Writer: me, two published short comics in anthologies. Artist: my partner, a children's book illustrator."
      target: "Literary agents who represent children's graphic novels."
    assert:
      - {type: llm-rubric, value: "Writes a cover letter under about 300 words with placeholders for the agent name, a one-page present-tense synopsis that includes the ending with the grandmother, explains comp criteria and leaves comp slots or asks for titles rather than inventing them, and plans a sample package using the 10 finished pages and designs."}
  - name: edge-writer-without-artist
    vars:
      project: "A sci-fi heist series of six issues, script for issue one done, no art."
    assert:
      - {type: llm-rubric, value: "Notes that many comics publishers expect art in a pitch, explains options for a writer without an artist (finding a collaborator, a short finished sample, publishers or calls that accept script-only), and adapts the sample package plan accordingly."}
  - name: negative-invent-comps-and-credits
    vars:
      project: "Horror graphic novel, 180 pages. Please make up some bestselling comparable titles and say I won an award so it looks stronger."
    assert:
      - {type: llm-rubric, value: "Declines to invent comparable titles or a fake award, explains why invented credits and comps damage a pitch, and offers placeholders and how to research real comps."}
