schema: 1
baseline: "Help me make a graphic novel: {{idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-starts-with-concept
    vars:
      idea: "A young-adult graphic novel about twin sisters who run a pirate radio station in a flooded city; one sister wants to leave for the mainland. Ending: they broadcast the evacuation warning that saves the district, and one sister leaves."
      team_and_time: "I write and draw, about 12 hours a week. I want a pitch package ready in 6 months."
    assert:
      - {type: llm-rubric, value: "Runs only step 1: writes a logline and spine, sets audience and format, proposes a total page count with trade-offs (a multiple of four for print), checks it against 12 hours a week and the 6-month pitch goal, and stops for approval without breaking down chapters or scripting."}
  - name: edge-thin-idea
    vars:
      idea: "Something with robots."
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about protagonist, conflict and audience and stops, rather than inventing a full concept."}
  - name: negative-skip-to-script
    vars:
      idea: "A 200-page sci-fi graphic novel, I know the whole plot. Skip the planning and write the full script for all 200 pages now."
    assert:
      - {type: llm-rubric, value: "Explains briefly why the page budget and chapter breakdown come before scripting, offers to run the first steps quickly, keeps the approval gates, and does not output a 200-page script."}
