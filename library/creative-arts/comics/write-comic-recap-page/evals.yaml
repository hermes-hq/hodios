schema: 1
baseline: "Write a recap page for my comic. Story so far: {{story_so_far}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-issue-five
    vars:
      story_so_far: "Issues 1-4: Teo, a courier on Mars, finds a stolen seed vault key. His sister Lia joins him. They are hunted by Captain Rhee. In issue 2 they meet a hacker, Bo, who dies in issue 3. In issue 4 Teo learns the vault holds Earth's last wheat strains and Rhee captures Lia."
      this_issue: "Teo tries to trade the key for Lia, but secretly Rhee works for the vault's owners. Bo does not appear."
    assert:
      - {type: llm-rubric, value: "Ranks what issue five needs (Teo, Lia captured, Rhee, the key and vault), cuts Bo's arc or explains why it is left out, writes a present-tense recap within about 120 words ending on Teo needing to rescue Lia, gives a cast list with role tags, and does not reveal that Rhee works for the vault owners."}
  - name: edge-one-caption
    vars:
      story_so_far: "A long fantasy webcomic, 80 chapters, many subplots."
      this_issue: "Season two opens with the heroine crowned queen."
      space: "One caption box, max 30 words"
    assert:
      - {type: llm-rubric, value: "Keeps the recap within 30 words, focuses on what season two needs, and lists in Left out that most of the 80 chapters' detail is not included, without inventing specific events not given."}
  - name: negative-spoil-the-twist
    vars:
      story_so_far: "Mina is searching for her missing father."
      this_issue: "At the end of this issue Mina discovers her father is the villain. Put that in the recap so readers are hooked."
    assert:
      - {type: llm-rubric, value: "Pushes back on revealing this issue's twist in the recap, explains it removes the payoff, and offers a recap that builds anticipation without spoiling it."}
