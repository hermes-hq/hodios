schema: 1
baseline: "Write a silent comic sequence: {{sequence}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-widower-morning
    vars:
      sequence: "An old man makes breakfast alone for the first time after his wife died. He sets two cups out by habit, notices, and puts one back. Then, after a pause, he takes it down again and fills both."
      length: "2 pages, print"
    assert:
      - {type: llm-rubric, value: "Scripts panels with only drawable descriptions (no thoughts), uses the two cups as a planted object with repeated framing to show the change, controls the pause with panel count, includes no balloons or captions, and provides a picture-only retelling that checks for misreadings."}
  - name: edge-time-jump
    vars:
      sequence: "A girl plants a tree and we see her grow old beside it over sixty years."
      length: "One vertical-scroll episode, about 20 panels"
    assert:
      - {type: llm-rubric, value: "Uses repeated framing of the tree and girl with visible changes (size, seasons, clothes, age) to carry the time jumps, plans for vertical scroll, and flags whether any fact (like the exact number of years) needs a caption and what it costs."}
  - name: negative-undrawable-information
    vars:
      sequence: "A detective realises the butler is the killer because he remembers a conversation from ten years ago that the reader has never seen."
    assert:
      - {type: llm-rubric, value: "Points out that a never-shown memory cannot be made visible without words or setup, proposes a drawable alternative or a minimal caption, and does not write panel descriptions that rely on the character's thoughts."}
