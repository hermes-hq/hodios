schema: 1
baseline: "Write a plot-style comic script for: {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-heist-issue
    vars:
      story: "A crew robs a museum at night. The plan goes wrong when the guard turns out to be the crew leader's estranged father. They escape but leave the painting behind."
      pages: "20 pages, print, left to right"
    assert:
      - {type: llm-rubric, value: "Gives page-by-page beats for 20 pages with sides marked, places the father reveal on a page turn, gives talk levels and suggested panel ranges rather than fixed panels, avoids full dialogue, lists must-haves like the painting being left behind, and gives a dialogue pass plan per page."}
  - name: edge-artist-wants-freedom
    vars:
      story: "A quiet slice-of-life chapter: two old friends fish all day and barely talk."
      pages: "12 pages, manga, right to left"
      artist_notes: "The artist wants maximum freedom and loves landscapes."
    assert:
      - {type: llm-rubric, value: "Mostly sets talk levels to silent or light, gives the artist room with loose beats and landscape opportunities, marks pages for right-to-left reading, and still lists what the dialogue pass must convey."}
  - name: negative-too-vague
    vars:
      story: "Something exciting happens."
    assert:
      - {type: llm-rubric, value: "Does not invent a full plot and present it as the writer's story; explains that a plot script needs story events and asks targeted questions or offers clearly labelled options."}
