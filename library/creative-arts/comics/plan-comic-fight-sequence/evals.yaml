schema: 1
baseline: "Plan a comic fight scene: {{fight}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-brawl
    vars:
      fight: "Jun, a retired boxer, fights two burglars in a small restaurant kitchen at night to protect his daughter hiding in the walk-in fridge. He is older and slower but knows the room. He wins but gets cut."
      page_budget: "4 pages, print, left to right"
    assert:
      - {type: llm-rubric, value: "States what each side wants and a clear turn, gives a text map of the kitchen marking props like knives, pans or the fridge before they are used, lists beats as cause and effect with advantage, fits four pages with one impact panel per page and a reaction beat at the end, and keeps Jun's cut and win as given."}
  - name: edge-vertical-scroll
    vars:
      fight: "Two rival mages duel on a rooftop in the rain; the younger wins by using the water."
      page_budget: "About 40 panels, vertical-scroll webcomic"
    assert:
      - {type: llm-rubric, value: "Plans for vertical scroll with panel ranges and long scroll gaps instead of page turns, sets up the rain and water early as the payoff, and keeps each mage on a consistent side of frame."}
  - name: negative-too-many-pages-of-moves
    vars:
      fight: "A 30-move kung fu fight between a monk and an assassin, every move listed, with no reason for the fight given."
      page_budget: "2 pages"
    assert:
      - {type: llm-rubric, value: "Says 30 moves cannot fit two pages and recommends cutting to a few cause-and-effect beats, asks for or flags the missing stakes rather than inventing a backstory as fact, and does not cram multiple moves into panels."}
