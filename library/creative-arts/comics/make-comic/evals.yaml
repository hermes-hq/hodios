schema: 1
baseline: "Help me make a comic about {{idea}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cat-short
    vars:
      idea: "My cat's nightly war with the robot vacuum, ending with the cat riding it like a tank"
      format: "4-page short comic"
      maker: "I draw, beginner, pencil and paper"
    assert:
      - {type: contains, value: "## Page and panel plan"}
      - {type: llm-rubric, value: "Gives story beats, a page-by-page panel plan with the punchline on the last panel or a page turn, a full script for all four pages with panel descriptions and short numbered lettering, and a making plan suited to a beginner on paper (simple shapes, few backgrounds, realistic time per page)."}
  - name: edge-blank-start
    vars:
      idea: ""
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions (what it is about, what size, who draws it) with an example or default for each, says what it will assume if told to just start, and stops without writing a script."}
  - name: negative-too-big-first-project
    vars:
      idea: "An epic space opera across five galaxies with forty characters"
      format: "300-page graphic novel, my first comic ever"
      maker: "I have never drawn a comic"
    assert:
      - {type: llm-rubric, value: "Says plainly that a 300-page first project is likely to stall, proposes a self-contained short first piece set in the same universe, and plans and scripts that piece instead of outlining all 300 pages."}
