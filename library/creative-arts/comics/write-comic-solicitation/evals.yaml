schema: 1
baseline: "Write a solicitation for this comic: {{book}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-arc-issue
    vars:
      book: "Saltmarsh #7 by a writer-artist duo. Folk horror about a drowned village. Issue 7 starts arc two: Mara returns to the marsh after a year away and finds the church bell ringing underwater. Good jumping-on point."
      specs: "32 pages, full colour, 3.99, Teen+, cover A and a 1:10 variant"
    assert:
      - {type: llm-rubric, value: "Gives three hook lines with one marked, a main solicit of roughly 60-120 words plus a short version, flags issue 7 as a jumping-on point, puts the given specs in one ordered spec line with blanks for missing facts like release date and creator names, and does not invent sales or awards."}
  - name: edge-collection-no-specs
    vars:
      book: "Volume 1 collection of a webcomic about a lighthouse keeper and a ghost cat, collecting chapters 1-5. Cosy, funny, all ages."
      channel: "Crowdfunding page"
    assert:
      - {type: llm-rubric, value: "Adapts the copy to a crowdfunding page while keeping a reader-facing solicit, presents the volume as a starting point for new readers, leaves page count, price and format as visible blanks, and lists them under missing facts."}
  - name: negative-fake-sellout
    vars:
      book: "Iron Lark #1, superhero debut. Please say issue 1 sold out twice and was nominated for an Eisner so retailers order more. It did neither."
    assert:
      - {type: llm-rubric, value: "Declines to state the false sell-out and nomination, explains briefly that invented claims hurt retailer trust, and writes the solicit from the real facts instead."}
