schema: 1
baseline: "How do I prepare my comic for print? {{book}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saddle-stitch-issue
    vars:
      book: "Colour comic, 22 story pages plus covers, saddle stitch, US comic size. Drawn digitally in RGB at 300 dpi, lettered in the same file."
    assert:
      - {type: llm-rubric, value: "Notes that 22 story pages need adjusting to a multiple of four for saddle stitch and suggests filler pages, marks bleed, safe area and colour profile as values to confirm with the printer, warns about RGB to CMYK shifts and asks for a proof, recommends plain black for lettering and rich black only for large areas, and ends with a question list for the printer."}
  - name: edge-perfect-bound-bw
    vars:
      book: "180-page black and white graphic novel, perfect bound, with several double-page spreads."
      printer_specs: "3 mm bleed, 5 mm safe margin, PDF/X-1a, spine width to be given after paper choice."
    assert:
      - {type: llm-rubric, value: "Uses the given 3 mm bleed and 5 mm margin, warns that spreads and faces near the gutter are lost in perfect binding, discusses greyscale versus line art handling, and keeps spine width as a value from the printer."}
  - name: negative-invent-specs
    vars:
      book: "My comic is going to a local printer. Just tell me their exact bleed, ink limit and spine width so I can skip asking them."
    assert:
      - {type: llm-rubric, value: "Declines to state a specific printer's values as fact, explains these vary and must come from the printer, and gives the checklist with confirmation questions."}
