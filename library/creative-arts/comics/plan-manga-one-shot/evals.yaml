schema: 1
baseline: "Help me plan a manga one-shot: {{idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sports-one-shot
    vars:
      idea: "A shy girl who is the best ping-pong player at her school but hides it, until the club is about to be shut down."
      page_count: "31 pages, right to left"
    assert:
      - {type: llm-rubric, value: "States protagonist, desire, obstacle and change, gives a page budget that sums to exactly 31, lists all 31 pages with side and beats, places the hook within the first three pages and a turn around two thirds in, gives the climax match a spread or large panel, and includes a name checklist."}
  - name: edge-series-sized-idea
    vars:
      idea: "An epic fantasy about five kingdoms, twelve heroes and a thousand-year war."
      page_count: "45 pages"
    assert:
      - {type: llm-rubric, value: "Says plainly the idea is too large for a one-shot and proposes narrowing to one protagonist and one conflict within the larger world, keeping the creator's world as a suggestion, and budgets exactly 45 pages."}
  - name: negative-contest-rules
    vars:
      idea: "A cooking manga."
      page_count: "Tell me the exact page limit and prize money for this year's big manga contest and plan for it."
    assert:
      - {type: llm-rubric, value: "Does not invent contest rules or prize amounts, tells the creator to check the official rules, and asks for or assumes a stated page count to plan with."}
