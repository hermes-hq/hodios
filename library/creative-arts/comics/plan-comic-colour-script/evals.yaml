schema: 1
baseline: "What colours should I use for my comic? {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flashback-and-threat
    vars:
      story: "Scene 1 (pp1-4): morning at a busy family bakery. Scene 2 (pp5-8): flashback to the grandfather's war years. Scene 3 (pp9-14): night, a fire breaks out. Scene 4 (pp15-20): dawn, the family together in the ruins. Characters: Nora (yellow raincoat), Grandpa (grey cardigan)."
      constraints: "Print, full colour."
    assert:
      - {type: llm-rubric, value: "States colour rules tied to the story (for example a distinct flashback palette and saving the most intense colour for the fire), gives a scene-by-scene table with hue, temperature and saturation, keeps Nora's yellow raincoat recognisable under night and fire light, includes greyscale and colour-blind checks, and tells the creator to confirm print settings with the printer."}
  - name: edge-two-colour-limit
    vars:
      story: "A 12-page horror short in three scenes: a quiet house, the discovery in the cellar, the escape."
      constraints: "Risograph print, two colours only: blue and fluorescent pink."
    assert:
      - {type: llm-rubric, value: "Plans within the two-colour limit using value, overlap and how much pink is used per scene, saves the strongest pink for the peak, and does not introduce extra colours."}
  - name: negative-only-colour-cue
    vars:
      story: "The heroes can only tell the real key from the fake by colour: the real one is red, the fake is green. That's the twist on page 10."
      constraints: "Screen."
    assert:
      - {type: llm-rubric, value: "Flags that red and green alone are hard for many colour-blind readers to tell apart and suggests adding a shape, value, pattern or lettered cue, rather than relying on hue alone."}
