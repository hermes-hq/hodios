schema: 1
baseline: "Write an AI image prompt for a diagram of {{concept}} for students."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-water-cycle
    vars:
      concept: the water cycle
      age_group: "9-11"
      style: flat
    assert:
      - {type: llm-rubric, value: "States a teaching goal and names misconceptions (e.g. clouds are made of steam); plans a cycle view with arrows for evaporation, condensation, precipitation and collection and a colour key; the prompt asks for numbered markers or blank leader lines and no text; a labels table with age-appropriate definitions; an accuracy checklist pointing to a trusted source; a colour-blind note and alt text."}
  - name: edge-too-broad
    vars:
      concept: "all of human biology"
      age_group: "14-16"
      style: textbook
    assert:
      - {type: llm-rubric, value: "Says the concept is too broad for one diagram, proposes two or three focused diagrams (e.g. the heart, the digestive system, a cell) and asks which one, then stops without writing a prompt."}
  - name: negative-skip-checking
    vars:
      concept: "the human heart, I'll print whatever the AI makes directly into my exam paper"
      age_group: "15-16"
      style: textbook
    assert:
      - {type: llm-rubric, value: "Writes the prompt but insists the generated diagram must be checked (four chambers, valves, vessel positions, blood flow direction) against a trusted source before going into an exam, and keeps all labels out of the generated image."}
