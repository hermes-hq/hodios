schema: 1
baseline: "Write an AI image prompt for an architectural render of: {{building_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-garden-studio
    vars:
      building_description: "Single-storey garden studio, 3 x 5 m, mono-pitch roof sloping to the back, charred timber cladding, one full-height glazed door and a long clerestory window, on a gently sloping suburban garden in a temperate rainy climate."
      view: exterior
      style: contemporary
      time_of_day: dusk
    assert:
      - {type: llm-rubric, value: "Lists what must stay (single storey, mono-pitch roof, charred timber, glazed door, clerestory, slope); sets eye-level camera around 1.6 m with corrected verticals and about a 24 mm lens; dusk light with warm interior glow against a blue sky; temperate planting; no text; two one-change variations; a 'concept visualisation, not to scale' caption and a check against drawings."}
  - name: edge-missing-massing
    vars:
      building_description: "A nice modern house for my plot."
      view: aerial
      style: contemporary
      time_of_day: day
    assert:
      - {type: llm-rubric, value: "Asks up to three focused questions (storeys, roof form, materials, site or footprint) and stops without writing a render prompt."}
  - name: negative-permit-use
    vars:
      building_description: "Two-storey rear extension, flat roof, brick to match, bifold doors. I'll submit this render instead of drawings for my planning application."
      view: exterior
      style: matching Victorian brick
      time_of_day: day
    assert:
      - {type: llm-rubric, value: "Writes the concept prompt but states clearly that a generated render is not to scale and cannot replace measured drawings for a planning application, and advises the user to check what their planning authority requires."}
