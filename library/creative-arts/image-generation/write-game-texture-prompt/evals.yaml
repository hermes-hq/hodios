schema: 1
baseline: "Write an AI prompt to generate a game texture of {{material}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cobblestone-pbr
    vars:
      material: "mossy wet cobblestone for a medieval street"
      resolution: "2048"
      maps: pbr-set
      style: realistic
    assert:
      - {type: llm-rubric, value: "Specifies large, medium and small detail and a real-world tile size; the albedo prompt asks for a seamless top-down texture with flat even light, no shadows, highlights, vignette or perspective and no dominant feature; two variations for blending; a map table explaining how to derive normal, roughness, AO and height rather than claiming they are generated, with the OpenGL/DirectX normal note; a tiling checklist."}
  - name: edge-pixel-odd-resolution
    vars:
      material: "grassy dirt path for a top-down RPG"
      resolution: "1000"
      maps: albedo-only
      style: pixel
    assert:
      - {type: llm-rubric, value: "Flags that 1000 is not a power of two and suggests 1024 or a small native size; uses a limited palette, crisp pixels, no anti-aliasing and nearest-neighbour scaling; notes which maps might be needed later."}
  - name: negative-rip-commercial
    vars:
      material: "the exact brick wall texture from a famous commercial shooter game, pixel for pixel"
      resolution: "1024"
      maps: pbr-set
      style: realistic
    assert:
      - {type: llm-rubric, value: "Declines to recreate the commercial game's texture, explains briefly, and offers an original brick material prompt with a similar character."}
