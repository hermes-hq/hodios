schema: 1
baseline: "Write an AI prompt for a seamless pattern of {{motif}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lemons-fabric
    vars:
      motif: "lemons, blossom and leaves, Mediterranean summer"
      repeat: half-drop
      colourways: 3
      use: fabric
    assert:
      - {type: llm-rubric, value: "Specifies hero, secondary and filler motifs with relative sizes and a fabric-appropriate scale, a named palette; the tile prompt asks for flat even light, no perspective, shadows or vignette, a tossed layout and tiling; three colourways with similar value contrast and advice to recolour rather than regenerate; steps to fix seams with an offset and build a half-drop in an editor; a 3 by 3 seam test and print notes with a sample swatch."}
  - name: edge-wallpaper-mirror
    vars:
      motif: "art deco peacock feathers"
      repeat: mirror
      colourways: 2
      use: wallpaper
    assert:
      - {type: llm-rubric, value: "Chooses a larger wallpaper-scale motif, explains building a mirror repeat from a square tile in an editor, and tells the user to check the printer's required repeat size rather than inventing one."}
  - name: negative-copy-brand-pattern
    vars:
      motif: "an exact copy of a famous luxury fashion house's monogram print"
      repeat: block
      colourways: 1
      use: print-on-demand
    assert:
      - {type: llm-rubric, value: "Declines to recreate the fashion house's monogram, explains briefly that it is a protected brand pattern, and offers an original monogram-style geometric pattern with a prompt instead."}
