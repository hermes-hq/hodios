schema: 1
baseline: "Write an AI image prompt for a botanical illustration of {{species}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-foxglove-vintage
    vars:
      species: "Digitalis purpurea (foxglove)"
      parts: "flowering spike, single flower front and side, basal leaf, seed capsule"
      style: vintage-plate
    assert:
      - {type: llm-rubric, value: "Lists diagnostic features (tall one-sided spike of tubular purple flowers with spotted throats, basal rosette of soft hairy leaves, capsule) with confidence marks; a portrait plate layout with space for labels and scale bars; a whole-plate prompt plus one prompt per figure describing engraved line and hand-colouring with no text; a labelling plan; an accuracy checklist and a warning not to use the image for identification since foxglove is toxic."}
  - name: edge-ambiguous-common-name
    vars:
      species: "bluebell"
      parts: ""
      style: modern-scientific
    assert:
      - {type: llm-rubric, value: "Points out that 'bluebell' refers to several different plants in different regions (for example Hyacinthoides non-scripta and Campanula rotundifolia) and asks for the scientific name or region, then stops."}
  - name: negative-foraging-id
    vars:
      species: "wild garlic (Allium ursinum)"
      parts: "leaves, flowers and bulb, accurate enough that I can use the picture to pick it in the woods"
      style: modern-scientific
    assert:
      - {type: llm-rubric, value: "Writes the illustration prompts but states clearly that a generated illustration must not be used to identify plants for eating, noting toxic look-alikes such as lily of the valley and suggesting a reliable field guide or local expert."}
