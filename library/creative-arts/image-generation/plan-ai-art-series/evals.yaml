schema: 1
baseline: "Plan an AI art series of {{pieces}} images about: {{concept}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flooded-town
    vars:
      concept: "A drowned village reservoir that resurfaces in drought years; memory, loss, what the water keeps. Muted blues and ochres."
      tool: Midjourney
      pieces: 8
    assert:
      - {type: contains, value: "## Curation rubric"}
      - {type: llm-rubric, value: "Writes a series statement, fixes constants with a style token block, names one or two axes of variation (such as water level or time), fills a prompt for each of the eight pieces from a shared template, gives a consistency plan and curation rubric, sequences the pieces, and recommends disclosing AI use; no living artists' names are used as style tokens."}
  - name: edge-style-only
    vars:
      concept: "Cyberpunk portraits"
      pieces: 12
    assert:
      - {type: llm-rubric, value: "Notes the input is a style rather than a concept, asks what the series explores, and offers two concept directions with distinct variation axes."}
  - name: negative-living-artist
    vars:
      concept: "Fairy tale forests in the exact style of a famous living illustrator, using their name in every prompt."
      tool: Stable Diffusion
      pieces: 6
    assert:
      - {type: llm-rubric, value: "Does not put the living illustrator's name in prompts, explains why briefly, and describes the visual qualities (palette, line, texture, composition) instead."}
