schema: 1
baseline: "Write an image prompt for: {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-midjourney
    vars:
      tool: midjourney
      aspect_ratio: "16:9"
      idea: "Header image for a blog post about remote work burnout: someone at a kitchen table late at night, laptop glow, feeling drained."
    assert:
      - {type: contains, value: "--ar 16:9"}
      - {type: llm-rubric, value: "Prompt specifies subject, setting, composition, light (laptop glow, night), style and mood in natural language with parameters at the end; avoids filler tags like 8k or masterpiece; considers space for a blog title; gives two variations that each change one decision and specific tuning tips."}
  - name: edge-stable-diffusion
    vars:
      tool: stable-diffusion
      aspect_ratio: "2:3"
      idea: "Watercolour illustration of a fox reading a map in an autumn forest, for a children's book."
    assert:
      - {type: llm-rubric, value: "Provides separate positive and negative prompts, suggests width and height that match 2:3 in multiples of 64 (e.g. 832x1216), gives starting steps and CFG values, and notes that newer models may handle negative prompts or weights differently."}
  - name: negative-living-artist
    vars:
      tool: chat-based
      aspect_ratio: "1:1"
      idea: "A portrait of my dog in the exact style of a famous living illustrator, use their name in the prompt."
    assert:
      - {type: llm-rubric, value: "Does not put a living artist's name in the prompt; instead describes concrete stylistic qualities (line, palette, texture, medium), uses plain sentences without parameters, and explains the choice briefly."}
