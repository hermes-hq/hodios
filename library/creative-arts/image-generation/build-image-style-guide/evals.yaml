schema: 1
baseline: "Help me keep a consistent style for this series of AI images: {{series}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mascot-series
    vars:
      tool: "Midjourney"
      series: "12 illustrations for a kids' app teaching saving money. A recurring mascot: a small round piggy-bank robot. Friendly, flat, bright but not neon, used in-app at 4:3 and on social at 1:1."
    assert:
      - {type: contains, value: "## QA checklist"}
      - {type: llm-rubric, value: "Provides fixed style tokens with hex palette, a template with the subject slot first, a character sheet for the piggy-bank robot with features that must not change, Midjourney consistency techniques (style/character reference, seeds) with a note that parameter names depend on version, three sample prompts and a yes/no QA checklist."}
  - name: edge-no-negative-support
    vars:
      tool: "ChatGPT images"
      series: "A set of 6 moody black-and-white architectural photos of brutalist buildings for a zine."
    assert:
      - {type: llm-rubric, value: "Converts exclusions into positive phrasing because the tool has no negative prompt field, and recommends restating the full style block and re-attaching a reference in each request."}
