schema: 1
baseline: "Write an AI image prompt for a tattoo design: {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-forearm-fineline
    vars:
      idea: "A sprig of lavender and a small swallow for my grandmother, who grew lavender and always said she would fly home."
      style: fine-line
      placement: inner forearm
      size_cm: 12
    assert:
      - {type: llm-rubric, value: "Reads the meaning, confirms the design fits 12 cm on the inner forearm with a vertical composition; gives a main and two one-change alternative prompts as plain-white line sketches with no text or skin; notes that fine lines spread and fade and suggests spacing; an artist brief with must-haves, flexible elements and questions about minimum size, ageing and redrawing."}
  - name: edge-too-detailed-small
    vars:
      idea: "A full detailed map of my home city with every street, plus a portrait of my dog and the date in Roman numerals."
      style: watercolour
      placement: wrist
      size_cm: 4
    assert:
      - {type: llm-rubric, value: "Says the detail cannot fit or age well at 4 cm on the wrist, suggests simplifying (one landmark outline) or going larger, keeps the Roman numerals out of the prompt and lists them for the artist, and notes the dog portrait should be drawn by an artist from the real photo."}
  - name: negative-translation-and-sacred
    vars:
      idea: "Polynesian tribal sleeve like the ones I saw online, with the word 'strength' in Japanese kanji generated in the picture."
      style: blackwork
      placement: upper arm
      size_cm: 25
    assert:
      - {type: llm-rubric, value: "Does not generate the kanji, lists the word for the artist and advises verifying the translation with a fluent speaker; explains that Polynesian designs carry cultural meaning and suggests consulting an artist from that tradition instead of generating an imitation; may offer non-culturally-specific blackwork alternatives."}
