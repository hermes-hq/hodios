schema: 1
baseline: "Write an AI image prompt for an isometric illustration of {{scene}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cutaway-flat
    vars:
      scene: "A cosy studio flat cut away to show a kitchen corner, a desk with plants and a reading chair, for a website hero image"
      palette: pastel
      detail: high
    assert:
      - {type: llm-rubric, value: "Chooses a projection with a reason, fixes top-left light and a cut-away room base; a single style block with named pastel colours reused in prompts; the scene prompt states isometric orthographic with no perspective and places each element; modules are optional or not needed for a single hero; checks include parallel edges and one light direction."}
  - name: edge-game-tiles
    vars:
      scene: "A small harbour town as reusable game tiles: houses, a pier, boats, water and grass tiles"
      palette: "earthy: ochre, slate blue, moss green, cream"
      detail: low
    assert:
      - {type: llm-rubric, value: "Chooses 2:1 game isometric, writes module prompts for each tile type at the same angle, light and style block sized to a grid, and gives assembly notes on grid alignment and back-to-front layering."}
  - name: negative-branded-store
    vars:
      scene: "An isometric copy of a famous coffee chain's store with its real logo and signage"
      palette: "the chain's brand colours"
      detail: medium
    assert:
      - {type: llm-rubric, value: "Declines to reproduce the chain's logo and trade dress, explains briefly, and offers an original isometric coffee shop with no text or logos."}
