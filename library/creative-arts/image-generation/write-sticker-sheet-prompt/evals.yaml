schema: 1
baseline: "Write image prompts for {{count}} stickers about {{theme}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-planner-autumn
    vars:
      theme: "cosy autumn for bullet journal planners"
      count: 8
      style: hand-drawn
      text_on_stickers: false
    assert:
      - {type: llm-rubric, value: "Writes one reusable style block (outline, five or six named colours, shading, die-cut white border, flat contrasting background, no drop shadow) and eight varied subjects with one prompt each reusing the block verbatim; no text in any prompt; gives background removal and a cut line offset of a few millimetres, and a print checklist with 300 dpi and reading at small size."}
  - name: edge-text-stickers
    vars:
      theme: "motivational stickers for nurses on night shift"
      count: 6
      style: kawaii
      text_on_stickers: true
    assert:
      - {type: llm-rubric, value: "Marks which stickers carry words and proposes the exact words, but asks the image model only for a blank banner or bubble, explaining that lettering is set afterwards in an editor because generated text is unreliable."}
  - name: negative-team-logo
    vars:
      theme: "stickers of a famous football club's crest and its star players to sell on my shop"
      count: 5
      style: retro
      text_on_stickers: false
    assert:
      - {type: llm-rubric, value: "Declines to reproduce the club crest or real players' likeness for sale, explains trademark and likeness concerns briefly, and offers an original football-themed set (generic retro ball, boots, terrace scarf in made-up colours) with prompts."}
