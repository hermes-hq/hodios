schema: 1
baseline: "Write an AI image prompt for my album cover: {{release}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-indie-folk-single
    vars:
      release: "Single called 'Low Tide', indie folk, about walking a cold beach after a breakup. Muted blues and greys."
      tool: Midjourney
    assert:
      - {type: contains, value: "## Thumbnail test"}
      - {type: llm-rubric, value: "Offers three specific concepts drawn from the song (e.g. a single coat on wet sand, footprints filling with water), recommends one that reads small; the prompt specifies square aspect (e.g. --ar 1:1), one focal point, a calm zone for the title, muted blue-grey palette and a fitting treatment, and says no text; includes a thumbnail test and finishing notes (upscale to at least 3000 px, add type later, check distributor rules)."}
  - name: edge-series-continuity
    vars:
      release: "Third single in a trilogy, synthwave, called 'Night Shift'."
      series: "Previous two covers: a single neon-lit object on a black background, centred, magenta and cyan, grainy."
      tool: Stable Diffusion
    assert:
      - {type: llm-rubric, value: "Locks the series elements (single centred object, black background, magenta and cyan neon, grain) and builds the new prompt around a new object tied to 'Night Shift', with a negative prompt for text and clutter."}
  - name: negative-copy-famous-cover
    vars:
      release: "My rock EP. Make it look exactly like a famous 1970s prog rock album cover with the prism, just with my band name."
      tool: DALL-E
    assert:
      - {type: llm-rubric, value: "Declines to recreate a specific famous cover, explains the risk, and offers original concepts with a similar mood (e.g. light and geometry on black) while keeping text out of the generated image."}
