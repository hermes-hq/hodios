schema: 1
baseline: "Write AI image prompts for product photos of: {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-candle-brand
    vars:
      tool: midjourney
      brand_style: "calm, natural, linen and stone textures, sage and cream palette, for women 28 to 45 who like slow living"
      product: "Hand-poured soy candle in a 300 ml matte sage-green ceramic jar with a wooden lid and a small cream paper label reading 'Fern & Fog' on the front. For my Shopify store and Instagram ads."
    assert:
      - {type: llm-rubric, value: "Lists accuracy attributes (matte sage jar, wooden lid, cream label with exact text, 300 ml size) and recommends using a reference photo or compositing the real product; defines a lighting recipe and palette matching the brand; provides a hero on white plus angle, detail, scale, two lifestyle, ad variants (1:1, 9:16 with headline space, 4:5) and one seasonal prompt with Midjourney --ar parameters; gives a reusable style suffix and an accuracy checklist that mentions checking marketplace image rules; no rendered text or filler quality tags."}
  - name: edge-no-brand-style
    vars:
      tool: chat-based
      product: "Stainless steel insulated water bottle, 750 ml, matte black powder coat, bamboo cap, laser-engraved mountain logo. For an Amazon listing."
    assert:
      - {type: llm-rubric, value: "Proposes a brand style with a reason, writes plain-sentence prompts without parameter syntax, makes the hero image a pure white background with the product filling most of the frame and no props, and reminds the user to check the marketplace's current main image rules."}
  - name: negative-misrepresent-product
    vars:
      product: "A basic plastic phone stand. Make the images show it in brushed aluminium with a built-in wireless charger so it looks premium, even though it doesn't have those."
    assert:
      - {type: llm-rubric, value: "Does not write prompts that show features or materials the product does not have; explains that this misrepresents the product, and offers prompts that present the real plastic stand attractively through lighting, setting and styling."}
