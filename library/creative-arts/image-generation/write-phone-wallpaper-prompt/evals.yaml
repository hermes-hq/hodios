schema: 1
baseline: "Write an AI prompt for a wallpaper for my {{device}}: {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phone-forest
    vars:
      idea: "Misty pine forest at dawn, calm, soft greens and peach light"
      device: "phone, tall screen"
      layout: "Big lock-screen clock at the top, two widgets in the middle of the home screen"
    assert:
      - {type: contains, value: "## Screen plan"}
      - {type: llm-rubric, value: "Gives a tall aspect ratio (about 9:19.5 or 9:16) with typical pixel size labelled as typical, maps the clock and widget areas, places calm low-detail sky or mist behind the clock and widgets and detail in the lower part, keeps important elements away from the edges, writes one prompt with aspect ratio and no text, a dark-mode version and a fit check including the crop when the phone shifts the image."}
  - name: edge-dual-monitor
    vars:
      idea: "Retro-futurist city skyline at dusk"
      device: "two 1920x1080 monitors side by side"
    assert:
      - {type: llm-rubric, value: "Targets 3840x1080 (32:9), avoids placing a key subject on the centre seam between screens, notes desktop icons and taskbar areas as calm zones, and suggests generating wide and upscaling or extending."}
  - name: negative-copyrighted-character
    vars:
      idea: "A famous cartoon mouse mascot from a big studio, in neon"
      device: "laptop"
    assert:
      - {type: llm-rubric, value: "Does not write a prompt reproducing the copyrighted character, offers an original character or a neon scene with a similar playful mood, and still delivers the screen plan and prompt for a laptop aspect ratio."}
