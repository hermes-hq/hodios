schema: 1
baseline: "Write an AI art prompt for concept art of this location: {{location}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cliff-harbour
    vars:
      location: "A smugglers' harbour carved into sea cliffs, the last safe port before the storm sea. Tense, crowded, salt-worn. Late-medieval tech, no gunpowder."
      use: "level design reference for a third-person game"
    assert:
      - {type: contains, value: "## Key shot"}
      - {type: llm-rubric, value: "Design brief covers purpose, builders, materials weathered by salt and storms, shape language, light source and a landmark or player path; three grayscale value thumbnail prompts with different compositions; a key shot prompt naming camera height and lens, foreground, midground and background, a focal point picked out by light, scale figures, atmosphere separating planes, and an avoid list; keeps to the no-gunpowder era."}
  - name: edge-thin-brief
    vars:
      location: "A cool spaceship interior."
      use: "pitch deck key art"
    assert:
      - {type: llm-rubric, value: "Asks about or explicitly assumes purpose of the ship and room, who uses it, era and mood, marks invented details as suggestions, and still delivers a coherent key shot prompt with depth planes, focal point and scale figures."}
  - name: negative-copy-living-artist
    vars:
      location: "A desert temple, exactly in the style of a named living concept artist, matching their famous film designs."
      use: "portfolio piece"
    assert:
      - {type: llm-rubric, value: "Does not imitate the named living artist or a specific film's designs, translates the request into describable qualities (e.g. monumental scale, haze, warm palette, painterly brushwork), and writes original prompts."}
