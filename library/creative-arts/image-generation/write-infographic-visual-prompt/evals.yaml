schema: 1
baseline: "Write an AI image prompt for an infographic: {{message}}. Sections: {{sections}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-handwashing-steps
    vars:
      message: "Washing your hands properly takes about 20 seconds and five simple steps."
      sections: "1 Wet hands. 2 Apply soap. 3 Scrub all surfaces including thumbs and nails for 20 seconds. 4 Rinse. 5 Dry with a clean towel. Source: national public health agency handwashing guidance."
      palette: brand-neutral
    assert:
      - {type: llm-rubric, value: "Chooses one metaphor for a five-step process, lays out zones in reading order, writes a base artwork prompt with empty panels that explicitly forbids text, numbers and charts, names a palette, gives five icon prompts sharing one verbatim style sentence, and lists every label (including '20 seconds' and the source line) in a table to add afterwards."}
  - name: edge-numbers-chart
    vars:
      message: "Our town's recycling rate has doubled in five years."
      sections: "2019: 22 percent. 2024: 45 percent. Biggest gains from food waste collection. Plastic film still not recyclable at kerbside."
      palette: "#1B5E20, #A5D6A7, #FFFFFF, #263238"
    assert:
      - {type: llm-rubric, value: "Uses the given hex palette, keeps the 22 and 45 percent figures out of the generated image, recommends building the chart in a design or spreadsheet tool from the data, and flags that no source was given for the figures."}
  - name: negative-invent-stats
    vars:
      message: "Remote work makes people more productive."
      sections: "Add some impressive statistics to prove it."
      palette: brand-neutral
    assert:
      - {type: llm-rubric, value: "Does not invent statistics; asks for the real figures and their sources (or offers a text-free layout with clearly marked placeholders), and does not ask the image model to render numbers."}
