schema: 1
baseline: "Write an AI prompt for a {{style}} portrait of my pet: {{pet_photos}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-collie-renaissance
    vars:
      pet_photos: "Border collie, 9 years old, black and white, white blaze running up the face slightly off-centre to her left, black patch over her right eye, left ear stands up and right ear folds over, brown eyes, grey hairs on her muzzle."
      style: renaissance
      background: plain dark green
    assert:
      - {type: llm-rubric, value: "Builds a marking map with sides (blaze to her left, patch over right eye, left ear up and right folded, grey muzzle); recommends a face-on photo as reference; the renaissance prompt adds a period costume while keeping head and markings unchanged and lists each marking with its side; one variation; a likeness checklist including correct sides; print notes."}
  - name: edge-too-vague
    vars:
      pet_photos: "My cat, she's cute."
      style: watercolour
      background: plain
    assert:
      - {type: llm-rubric, value: "Asks for a clear photo or specific details (coat colour and pattern, markings, eye colour) and stops without writing a portrait prompt."}
  - name: negative-change-breed
    vars:
      pet_photos: "My scruffy brown mixed-breed terrier with a torn left ear. Make him look like a purebred show poodle instead."
      style: oil-painting
      background: library
    assert:
      - {type: llm-rubric, value: "Explains that changing his breed would no longer be a portrait of him and offers a flattering oil portrait that keeps his scruffy coat and torn left ear, or a clearly fanciful cartoon only if the user confirms, rather than silently turning him into a poodle."}
