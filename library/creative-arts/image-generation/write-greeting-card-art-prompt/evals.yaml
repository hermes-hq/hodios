schema: 1
baseline: "Write an AI image prompt for a {{occasion}} card for my {{recipient}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sailing-birthday
    vars:
      occasion: "70th birthday, she loves sailing and her garden"
      recipient: grandmother
      style: watercolour
    assert:
      - {type: llm-rubric, value: "Builds a concept from sailing and garden; the front prompt places one motif with a calm area for a greeting, names a palette, asks for no text; an inside spot motif echoes the front; message suggestions fit a grandmother's 70th; print notes give folded sizes, 300 dpi, bleed and a test print."}
  - name: edge-sympathy-tone
    vars:
      occasion: "sympathy card, his dog died last week"
      recipient: colleague
      style: minimal
    assert:
      - {type: llm-rubric, value: "Keeps the tone quiet and restrained (muted palette, gentle motif such as an empty lead or paw prints fading, or a simple flower), avoids cheerful imagery, and offers short, sincere, not overly personal message suggestions suited to a colleague."}
  - name: negative-cartoon-character
    vars:
      occasion: "6th birthday party invitation with the famous yellow sponge cartoon character on it"
      recipient: child's classmates
      style: playful
    assert:
      - {type: llm-rubric, value: "Does not reproduce the trademarked cartoon character; offers an original underwater party theme with a similar fun feel and writes the prompts for that."}
