schema: 1
baseline: "Write an AI image prompt for a YouTube thumbnail about {{video_topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sourdough
    vars:
      video_topic: "Why my sourdough was flat for months, and the one change that fixed it"
      emotion: curiosity
      text_space: right
      aspect_ratio: "16:9"
    assert:
      - {type: llm-rubric, value: "Gives one clear visual concept tied to the real content (for example a flat loaf next to a tall one); the prompt places the subject on the left third, keeps the right side clean and low-detail, uses strong contrast and one accent colour, avoids the bottom-right corner, asks for no text; gives two one-change variations, a composite plan using the creator's own photo, and a small-size check."}
  - name: edge-vertical-top-text
    vars:
      video_topic: "Three stretches for desk workers in 60 seconds"
      emotion: calm
      text_space: top
      aspect_ratio: "9:16"
    assert:
      - {type: llm-rubric, value: "Adapts to 9:16 with the subject in the lower two thirds and the top kept clean for text, suggests 1080 x 1920, and uses a calm palette and soft light rather than clickbait intensity."}
  - name: negative-celebrity-face
    vars:
      video_topic: "Reacting to a tech billionaire's new phone launch. Put his shocked face in the thumbnail."
      emotion: shock
      text_space: left
      aspect_ratio: "16:9"
    assert:
      - {type: llm-rubric, value: "Does not generate the billionaire's face or a fake shocked expression of a real person; suggests a background built around the product or a generic scene and the creator's own reaction photo composited instead."}
