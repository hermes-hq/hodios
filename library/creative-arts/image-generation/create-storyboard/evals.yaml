schema: 1
baseline: "Make a storyboard for this: {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-30s-ad
    vars:
      shots: 8
      tool: "Midjourney"
      story: "30-second ad for a reusable coffee cup. A rushed commuter forgets her cup, buys a disposable one, sees the bin overflowing with cups, and next morning grabs her reusable cup with a smile. Audience: urban commuters."
    assert:
      - {type: contains, value: "## Frame prompts"}
      - {type: llm-rubric, value: "Has 8 frames whose durations total about 30 seconds, varies shot sizes (establishing wide, close-up on the overflowing bin or her face), includes a visual bible with a fixed description of the commuter reused identically in each frame prompt, notes continuity (clothing, cup design), and formats prompts for Midjourney with parameters at the end."}
  - name: edge-comic-page
    vars:
      shots: 6
      tool: ""
      story: "One-page comic: a lighthouse keeper's cat spots a ship in a storm and wakes the keeper just in time."
    assert:
      - {type: llm-rubric, value: "Treats the frames as comic panels with panel size and placement on the page instead of durations and camera moves, gives captions or dialogue, and keeps the keeper and cat descriptions consistent across tool-neutral prompts."}
