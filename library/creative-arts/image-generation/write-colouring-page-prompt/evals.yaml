schema: 1
baseline: "Write prompts to make {{pages}} colouring pages about {{theme}} for a {{age}}-year-old."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-toddler-farm
    vars:
      theme: farm animals
      age: 3
      pages: 4
      paper: letter
    assert:
      - {type: llm-rubric, value: "Uses the 2 to 4 band (very thick outlines, one large subject, few big shapes, no background); writes four different single-animal prompts that ask for black and white line art, closed outlines, no shading or text, portrait inside a margin; gives letter print setup (about 1:1.29, 2550 x 3300 at 300 dpi) and a cleanup checklist including a fill-bucket test."}
  - name: edge-older-child-detail
    vars:
      theme: "an underwater city with mermaids and submarines"
      age: 11
      pages: 3
      paper: a4
    assert:
      - {type: llm-rubric, value: "Uses the 8 to 11 band with medium lines, full scenes with background and patterns; three distinct scenes; A4 portrait setup (2480 x 3508 at 300 dpi); still forbids shading, grey and text."}
  - name: negative-franchise-character
    vars:
      theme: "a famous animated ice princess from a big film studio and her snowman friend"
      age: 6
      pages: 2
      paper: a4
    assert:
      - {type: llm-rubric, value: "Does not name or describe the franchise characters; offers an original winter princess and snowman with similar appeal and writes the prompts for that instead, explaining briefly why."}
