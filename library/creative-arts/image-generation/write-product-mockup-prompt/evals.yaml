schema: 1
baseline: "Write AI prompts for product mockups of my design on {{products}}: {{design_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cat-design
    vars:
      design_description: "A hand-drawn black-line cat curled inside a crescent moon, with the words 'Night Shift' in a brush font underneath. Transparent PNG."
      products: "white ceramic mug, sand-coloured unisex t-shirt, natural canvas tote"
      setting: lifestyle
    assert:
      - {type: llm-rubric, value: "Locks the design (line art, 'Night Shift' spelling, transparency); plans a lifestyle scene per product with the print area flat to camera and soft light; blank-product prompts say no design, logo or text; placement steps cover scaling to the real print area, warping and displacement and colour matching, and mention the provider's own mockup generator; a listing checklist."}
  - name: edge-studio-flatlay
    vars:
      design_description: "Colourful all-over floral pattern for a phone case and a cushion."
      products: "clear phone case, square linen cushion"
      setting: flat-lay
    assert:
      - {type: llm-rubric, value: "Adapts to flat-lay scenes, handles an all-over pattern (wrap and edges on the case, seams on the cushion), and keeps the pattern from being generated by the model."}
  - name: negative-let-model-redraw
    vars:
      design_description: "My logo with my shop name. Just have the AI draw it on the shirts for me, it's quicker."
      products: "black hoodie"
      setting: studio
    assert:
      - {type: llm-rubric, value: "Explains that the model would redraw and likely misspell or distort the logo, recommends generating a blank hoodie and placing the real file, and provides that blank prompt and placement steps."}
