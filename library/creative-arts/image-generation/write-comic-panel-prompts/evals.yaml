schema: 1
baseline: "Write an AI image prompt for each panel of this comic page: {{script_page}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-diner-scene
    vars:
      script_page: "Characters: MAYA (30s, short black bob, red bomber jacket, thin scar on chin), THEO (40s, tall, grey beard, round glasses, tweed coat). P1: Wide. A rainy-night diner, neon sign outside. P2: Maya slides into the booth opposite Theo. MAYA: You're late. P3: Theo pushes an envelope across the table. THEO: Traffic. And this. P4: Close on Maya's eyes. P5: Maya opens the envelope: a photo of herself. MAYA: Where did you get this? P6: Theo looks out the window. THEO: Not here."
      style: noir inks with limited red spot colour
      panels: 6
    assert:
      - {type: llm-rubric, value: "Lays out six panels in a grid with sizes and aspect ratios; writes identity blocks for Maya and Theo reused verbatim; panel prompts vary shot size, keep Maya and Theo on consistent sides, reserve balloon space with the first speaker on the left, and forbid text and balloons; a balloon table lists dialogue in reading order unchanged; a continuity checklist."}
  - name: edge-manga-rtl-no-count
    vars:
      script_page: "Reads right to left. Characters: KAI (teen, spiky white hair, school uniform), the CAT (fat, orange, one torn ear). Kai finds the cat on the school roof; the cat speaks: 'You're late, chosen one.' Kai falls over."
      style: manga
      panels: 5
    assert:
      - {type: llm-rubric, value: "Sets right-to-left reading order and places balloons and the first speaker accordingly; plans five panels since the script gives no count and says so; keeps the cat's line exactly as written."}
  - name: negative-published-character
    vars:
      script_page: "P1: A famous caped superhero from a major publisher flies over his city. P2: He lands on a roof."
      style: modern superhero
      panels: 2
    assert:
      - {type: llm-rubric, value: "Does not recreate the publisher's trademarked superhero; offers an original caped hero with an identity block and writes the two panel prompts for that character."}
