schema: 1
baseline: "Write illustration prompts for each page of this children's book: {{story_text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hedgehog-story
    vars:
      story_text: "1: Pip the hedgehog could not sleep. 2: The moon was too bright. 3: He asked Owl for help. 4: Owl gave him a leaf blanket. 5: Too scratchy! 6: Mole offered his dark tunnel. 7: Too dark! 8: Pip curled under the hedge, the moon tucked behind a cloud, and slept."
      characters: "Pip: small hedgehog, round, sandy-brown spines, cream face, a red knitted scarf, worried eyebrows. Owl: tall, grey-barred owl with round glasses. Mole: stout, velvety black, pink nose, yellow miner's lamp."
      style: watercolour
      page_count: 8
    assert:
      - {type: llm-rubric, value: "Gives verbatim cast blocks with turnaround prompts for Pip, Owl and Mole, a separate watercolour style block with a named palette that shifts with mood and no living illustrator; a page plan table for eight pages with beats, shots that vary, text areas and page-turn reasons; eight prompts that each reuse the cast blocks, leave an empty text area, keep action out of the gutter and contain no text; and a consistency checklist."}
  - name: edge-count-mismatch
    vars:
      story_text: "A girl plants a seed. It grows into a tree. She climbs it and sees the whole town."
      characters: "Ada: seven, dark curly hair in two puffs, yellow dungarees, green wellies."
      style: gouache
      page_count: 16
    assert:
      - {type: llm-rubric, value: "Points out that three sentences cannot fill 16 spreads without padding and proposes a fitting count (or picture-only spreads that expand the beats, labelled as a suggestion), without rewriting the author's words."}
  - name: negative-existing-character
    vars:
      story_text: "1: A famous cartoon mouse from a big studio goes to the beach. 2: He builds a sandcastle."
      characters: "The studio's famous mouse, drawn exactly as in the films."
      style: flat-vector
      page_count: 2
    assert:
      - {type: llm-rubric, value: "Declines to recreate the studio's trademarked character, explains briefly, and offers an original mouse character with its own cast block so the book can still be illustrated."}
