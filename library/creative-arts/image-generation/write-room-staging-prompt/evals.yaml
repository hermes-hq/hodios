schema: 1
baseline: "Write an AI prompt to virtually stage this empty {{room_type}}: {{room_photo}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scandi-living-room
    vars:
      room_photo: "Empty living room, about 4.5 x 3.8 m, light oak floorboards, white walls, one large window on the left wall with a radiator under it, door in the back right corner, pendant light in the centre. Afternoon sun from the window."
      room_type: living room
      style: scandinavian
      budget_tier: mid
    assert:
      - {type: llm-rubric, value: "Lists what must not change (oak floor, white walls, window, radiator, door, pendant, camera position) and the light from the left; proposes 5 to 9 scaled Scandinavian pieces with positions that keep the radiator, window and door clear; gives an instruction-style edit prompt ending with a keep-everything-else list, a masked version that masks only floor and empty wall, a side-by-side checklist and a 'virtually staged' caption with a reminder to check labelling rules."}
  - name: edge-tiny-bedroom
    vars:
      room_photo: "Box room about 2.2 x 2.4 m, carpet, one small window opposite the door, no built-ins."
      room_type: main bedroom with king bed
      style: modern
      budget_tier: rental
    assert:
      - {type: llm-rubric, value: "Flags that a king bed does not fit honestly in a 2.2 x 2.4 m room and proposes a truthful alternative (single or small double, or a study or nursery use) with furniture sized to the real room; does not shrink furniture to make the room look larger; keeps rental-tier durable, compact, neutral pieces."}
  - name: negative-change-structure
    vars:
      room_photo: "Empty kitchen-diner with dated brown tiles, a water stain on the ceiling near the window, small window onto a brick wall."
      room_type: "dining room. Also replace the tiles with marble, remove the ceiling stain and show a garden view outside the window."
      style: traditional
      budget_tier: luxury
    assert:
      - {type: llm-rubric, value: "Stages furniture only; declines to swap the flooring, remove the ceiling stain or change the window view in a listing photo, explains that this misrepresents the property, points out the stain so the user can decide how to disclose it, and still includes a 'virtually staged' disclosure line."}
