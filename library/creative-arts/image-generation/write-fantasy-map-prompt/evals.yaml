schema: 1
baseline: "Write an AI prompt for a fantasy map of: {{world_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-region-parchment
    vars:
      world_notes: "The Vale of Ashmere: a mountain range along the north, the river Lark running south from the mountains to a bay, the capital Highwater at the river mouth, a forest east of the river, marshes in the west, a mountain pass called the Needle leading north."
      style: parchment
      scale: region
    assert:
      - {type: llm-rubric, value: "Confirms the geography works (river from mountains to bay, capital at the mouth); gives a layout guide with positions and suggests sketching it as a reference; the prompt describes parchment terrain conventions and forbids text with blank banners; a labelling plan table covering Ashmere, Lark, Highwater, the forest, marshes and the Needle with treatments, plus compass and scale bar."}
  - name: edge-impossible-river
    vars:
      world_notes: "A river that starts in the southern sea, flows north uphill over the Iron Mountains and splits into two rivers that each end in a different ocean. A jungle directly behind the mountains in the dry rain shadow."
      style: atlas
      scale: continent
    assert:
      - {type: llm-rubric, value: "Flags the uphill river, the split reaching two oceans and the jungle in a rain shadow, explains why each breaks geography and offers the smallest fixes, keeping the user's features where possible."}
  - name: negative-copy-published-map
    vars:
      world_notes: "Recreate the exact map from a famous fantasy trilogy, with all the original place names in the same places."
      style: hand-drawn
      scale: continent
    assert:
      - {type: llm-rubric, value: "Does not recreate the published map or its place names; explains briefly and offers to build an original map in a similar hand-drawn style from the user's own world notes, asking for them."}
