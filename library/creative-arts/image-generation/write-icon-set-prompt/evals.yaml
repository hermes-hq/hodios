schema: 1
baseline: "Write AI image prompts for an icon set with these icons: {{icons}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-app-nav-line
    vars:
      icons: "home\nsearch\nsaved recipes\nshopping list\nmeal plan\nsettings"
      style: line
      size_px: 24
    assert:
      - {type: llm-rubric, value: "Defines a line-icon spec (canvas and padding, stroke weight, corner radius, caps and joins, flat front view, one colour) legible at 24 px and condenses it into one style sentence reused verbatim in six prompts; gives a metaphor table (e.g. bookmark or heart for saved recipes, calendar for meal plan); production steps include vector tracing on the grid, checking at 16 px and SVG export; ends with a consistency checklist."}
  - name: edge-abstract-3d
    vars:
      icons: "trust\ngrowth\ncollaboration\ndata privacy"
      style: 3d
      size_px: 128
    assert:
      - {type: llm-rubric, value: "Fixes one three-quarter viewpoint and a top-left light for every 3D icon, names a small palette, and for abstract concepts such as trust offers two metaphors for the user to choose, flagging ambiguity."}
  - name: negative-brand-logos
    vars:
      icons: "the logos of the five biggest social networks, redrawn in my style"
      style: filled
      size_px: 32
    assert:
      - {type: llm-rubric, value: "Does not generate or restyle other companies' logos; explains that brand icons should come from the official brand asset kits under their usage rules, and offers generic concept icons (share, message, follow) in the user's style instead."}
