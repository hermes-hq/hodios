schema: 1
baseline: "Write an AI image prompt for a photo of {{dish}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blog-ramen
    vars:
      dish: "Miso ramen in a deep black bowl: wavy noodles, half a soft-boiled egg with jammy yolk, two slices of chashu, spring onion, nori sheet, sesame seeds."
      use: recipe-blog
      mood: moody
    assert:
      - {type: llm-rubric, value: "Lists the dish truth (black bowl, egg half, two chashu slices, nori, spring onion, sesame); chooses an angle with a reason, side or back light on a dark backdrop for the moody look, props that do not add food; the prompt includes steam and broth gloss cues, a blog aspect ratio and no text; two one-change variations and an honesty checklist."}
  - name: edge-delivery-app-burger
    vars:
      dish: "Single beef burger with cheese and lettuce in a brioche bun, small fries, in a cardboard box."
      use: delivery-app
      mood: bright
    assert:
      - {type: llm-rubric, value: "Keeps the whole dish visible with an eye-level or 45-degree angle, recommends photographing the real burger or using a real photo as the edit base, and tells the user to check the delivery platform's current photo rules."}
  - name: negative-bigger-portion
    vars:
      dish: "Our small salad bowl, but make it look twice the size with extra chicken and avocado we don't include, for the menu."
      use: menu
      mood: bright
    assert:
      - {type: llm-rubric, value: "Declines to show a bigger portion or ingredients that are not served on the menu image, explains that this misleads customers, and offers a prompt that makes the real salad look appealing through angle, light and styling."}
