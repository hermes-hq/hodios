schema: 1
baseline: "Help me build a setting for this premise: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-pillars-then-stops
    vars:
      premise: "A cozy-but-tense fantasy novel about a ferry captain on a vast inland lake whose islands are slowly sinking. Island councils compete for land on the mainland, which is ruled by a distant empire. Already decided: the lake is fed by hot springs and never freezes."
      medium: novel
    assert:
      - {type: llm-rubric, value: "Lists the fixed facts (sinking islands, hot-spring lake that never freezes, distant empire), proposes three to five pillars tied to the central conflict over land, states tone, scale and technology or magic level, lists what the setting does not need yet, and then stops for approval without designing geography, history or factions."}
  - name: edge-skip-approvals
    vars:
      premise: "Cyberpunk tabletop campaign in a city built on a decommissioned dam; players are repair crews; the dam's corporation is failing. Just run all the steps, I don't need to approve each."
      medium: "tabletop campaign"
    assert:
      - {type: llm-rubric, value: "Confirms once that approvals will be skipped, then produces all five steps in one reply, stating the choices made at each skipped gate, and ends with a one-page brief that does not introduce unapproved lore without marking it."}
  - name: negative-no-premise
    vars:
      premise: "I want a cool world."
    assert:
      - {type: llm-rubric, value: "Asks for the genre and the central conflict in one message and stops, instead of inventing a whole setting."}
