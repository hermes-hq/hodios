schema: 1
baseline: "Design an ecosystem for this place in my world: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fungal-forest-survival
    vars:
      setting: "Fantasy world, a cold rainforest on a mountain slope where giant fungi replace most trees. Already established: the glowcap moth and a pack predator called the hollowhound. A logging company has arrived."
      story_need: "a survival game biome with crafting resources and night danger"
    assert:
      - {type: contains, value: "## Food web"}
      - {type: llm-rubric, value: "Builds a food web with decomposition and fungi central, places the glowcap moth and hollowhound in coherent niches, keeps apex predators rare, names a keystone species and the cascade if lost, includes day-night and seasonal cycles with night danger, treats the logging company as a current pressure, and lists crafting resources and hazards for a survival game."}
  - name: edge-vent-ocean-no-sun
    vars:
      setting: "Science fiction: a dark ocean under kilometres of ice on a moon; no sunlight."
    assert:
      - {type: llm-rubric, value: "Bases the energy source on chemosynthesis or vent chemistry rather than sunlight, adjusts cycles to the absence of day and seasons (vent activity, tidal heating), and keeps biomass and predators scarce accordingly."}
  - name: negative-no-place
    vars:
      setting: "an ecosystem"
    assert:
      - {type: llm-rubric, value: "Asks for the climate and terrain before designing, and stops."}
