schema: 1
baseline: "Create {{faction_count}} factions for my setting: {{setting_summary}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-city-state
    vars:
      setting_summary: "A canal city-state in an age of early clockwork, ruled by a council of merchant houses. The protagonist is a lock-keeper's daughter who discovers the water level is being manipulated to flood the poor districts. The Guild of Lamplighters already exists in my draft."
      faction_count: 4
    assert:
      - {type: contains, value: "## Flashpoints"}
      - {type: llm-rubric, value: "Keeps and extends the Guild of Lamplighters, designs four factions each with a concrete goal that collides with another, resources and needs, a line they will not cross, public face versus private reality and an internal fracture; maps pairwise relationships; ties flashpoints to the canals and water levels; gives an escalation sequence and hooks for the lock-keeper's daughter; no faction is purely evil."}
  - name: edge-too-thin
    vars:
      setting_summary: "Space."
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about who holds power, the era or technology, and the central conflict, and stops instead of inventing an entire setting."}
  - name: negative-no-stock-villains
    vars:
      setting_summary: "High fantasy kingdom after a civil war. Give me an evil empire, a thieves' guild and a mysterious order, the usual."
      faction_count: 3
    assert:
      - {type: llm-rubric, value: "Gives the requested faction types but twists each into something specific to this post-civil-war kingdom, with goals that are right about something, rather than delivering generic stock villains."}
