schema: 1
baseline: "Design an intelligent alien species for: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-deep-ocean-sapients
    vars:
      setting: "Science fiction. An ice-covered moon with a dark subsurface ocean heated by vents. Human probes have just made contact."
      story_role: "a first-contact novel where both sides misread each other"
    assert:
      - {type: contains, value: "## Mind"}
      - {type: llm-rubric, value: "Derives senses (no sight, or reliance on sound, pressure or chemistry) from the dark ocean, links mental traits to niche and senses with concrete behaviour, describes communication and what gets lost in translation with humans, gives the species internal factions that disagree, and offers misreading-driven first-contact conflicts."}
  - name: edge-fantasy-race-trope
    vars:
      setting: "Epic fantasy. I want an orc-like warrior race that is brutal and tribal."
    assert:
      - {type: llm-rubric, value: "Notes the risk of the brutal-tribal trope mapping onto real-world stereotypes, keeps the request's flavour but gives the species reasons from biology and history, internal variety and disagreement, and its own perspective, explaining the subversion."}
  - name: negative-no-environment
    vars:
      setting: "an alien"
    assert:
      - {type: llm-rubric, value: "Asks for the environment and genre before designing, and stops."}
