schema: 1
baseline: "How should I reveal my worldbuilding in this story? Lore: {{lore}} Structure: {{structure}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-novel-memory-magic
    vars:
      lore: |
        Magic is paid for with memories. The Archive buys memories from the poor. The ruling family has erased the memory of a massacre 30 years ago from the whole city. The protagonist's mother sold her memories of her daughter. There are 7 schools of memory-craft with different techniques. The city was founded by refugees from a drowned continent.
      structure: "Novel, 24 chapters in three acts. Act 1: protagonist, a courier, steals a memory vial. Act 2: she is hunted and joins rebels. Act 3: she restores the massacre memory to the city."
      medium: novel
    assert:
      - {type: contains, value: "## Reveal map"}
      - {type: llm-rubric, value: "Puts memory-as-payment in the opening, places the massacre erasure and the mother's sale as later reveals tied to specific chapters and triggers, treats the seven schools and drowned-continent origin as background or cuts, flags info-dump risks, lists mysteries with payoffs, and limits new lore per section."}
  - name: edge-game-skippable-text
    vars:
      lore: "A dying sun; the empire burns its own colonies to fuel the capital; the player character was born on a colony the empire burned; ancient machines below the surface may relight the sun."
      structure: "Action game, 8 levels, linear, with optional collectible logs."
      medium: game
    assert:
      - {type: llm-rubric, value: "Distinguishes critical-path lore delivered through level design, events and short lines from deep lore placed in optional logs, and warns that players skip text so the empire's crime must be shown on the main path."}
  - name: negative-no-structure
    vars:
      lore: "Elves and dwarves have hated each other for a thousand years over a stolen crown."
      structure: "not sure yet"
      medium: novel
    assert:
      - {type: llm-rubric, value: "Asks for the story's structure (outline, chapters or plot beats) since reveals cannot be placed without it, and stops."}
