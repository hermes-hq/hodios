schema: 1
baseline: "Design the geography for my fantasy world: {{world_premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-continent
    vars:
      scale: continent
      world_premise: "Low-magic, late-medieval fantasy novel series. Two rival kingdoms, a seafaring republic of merchants and a nomadic horse people. Must include a great desert, a mountain range called the Teeth, and an inland sea. The central conflict is over a single pass through the mountains."
    assert:
      - {type: llm-rubric, value: "States assumptions (latitude, scale, Earth-like physics); explains the Teeth with a plate collision and places the desert in a rain shadow or a subtropical high-pressure zone with reasons; rivers flow from high ground and merge without splitting except at deltas; the inland sea is explained (rift, closed basin); places the kingdoms, republic and nomads where geography supports their ways of life; makes the pass a chokepoint with resource and trade reasons; gives at least five geography-rooted hooks, a map description with compass positions and distances, and a sanity check."}
  - name: edge-magic-rule
    vars:
      scale: "a region the size of France"
      world_premise: "Floating islands drift above a ruined lowland; the islands are held up by a mineral that repels the earth. Airships are the main transport. Steampunk adventure campaign."
    assert:
      - {type: llm-rubric, value: "States the floating mineral as an explicit rule and works out its consequences (drift patterns with prevailing winds, rain and rivers falling from islands, shadowed land below, mining and trade of the mineral, mooring points as chokepoints) while keeping the rest physically plausible, and flags these as deliberate exceptions in the sanity check."}
  - name: negative-impossible-river
    vars:
      scale: "single island"
      world_premise: "I want a river that starts at the sea on one coast, runs uphill over the central volcano and splits into three rivers that reach three different coasts. No magic in this world."
    assert:
      - {type: llm-rubric, value: "Explains that without magic a river cannot run uphill or split into three separate rivers reaching different coasts, offers plausible alternatives (several rivers radiating from the volcano, a delta, a canal built by people) or a magic or engineering rule if the author wants one, and builds the geography on the chosen option."}
