schema: 1
baseline: "Create a royal family tree and dynasty for: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-claimants
    vars:
      setting: "Feudal fantasy kingdom; crown passes to the eldest son, but the nobles' council must confirm. The old king has just died. Story begins in year 412 of the realm's founding."
      generations: 4
      story_need: "three rival claimants with real arguments"
    assert:
      - {type: contains, value: "## Claimants today"}
      - {type: llm-rubric, value: "Designs four generations as a text tree with consistent dates, realistic deaths and remarriages, a reigns table, marriages with purposes, hidden scandals, and at least three claimants whose claims follow from the tree and exploit the gap between eldest-son rule and council confirmation; all dates fit the year 412 present."}
  - name: edge-non-hereditary-rule
    vars:
      setting: "A merchant empire where the throne rotates among five great families every ten years; this has worked for 200 years until now."
    assert:
      - {type: llm-rubric, value: "Adapts the design to a rotating multi-family succession rather than a single bloodline, shows how intermarriage between the five families creates competing claims, and identifies why the system is failing now."}
  - name: negative-no-realm
    vars:
      setting: "a royal family"
    assert:
      - {type: llm-rubric, value: "Asks how power is passed in the realm and the era before designing, and stops."}
