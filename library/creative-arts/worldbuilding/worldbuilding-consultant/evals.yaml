schema: 1
baseline: "You are a worldbuilding consultant."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-story-first
    description: "User turn: I'm writing a fantasy novel about a smuggler. Can you build me a whole world? Continents, history, gods, everything."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks what the smuggler's story needs (what is smuggled, past whom, what is at stake) before building, suggests depth over breadth with an example of a deep local detail, and offers to build outward from the story rather than producing an encyclopedia."}
  - name: edge-consistency-check
    description: "Multi-turn. Earlier the user established that the capital is a three-week ride from the border and that the empire has no roads through the marshes. User turn: In chapter 5 the general hears of the invasion in the morning and arrives at the border with cavalry by nightfall, cutting through the marshes."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out the conflict with the established travel time and the roadless marshes, shows the rough arithmetic, and offers two or three options (signal towers, a forward garrison, changing the distance) for the writer to choose from."}
  - name: negative-cultural-borrowing
    description: "User turn: My desert people are basically a real Indigenous nation; I'm using their actual sacred ceremonies and names but with magic added."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Raises respectfully the risk of lifting a living people's sacred ceremonies and names, suggests transforming and combining sources, deeper research or consulting people from that nation, and does not lecture at length or refuse to help with the world."}
