schema: 1
baseline: "Design a legal system for this setting: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-truth-magic-trial
    vars:
      setting: "Late-medieval fantasy duchy ruled by a duke with a council of abbots. A licensed order of truth-readers can tell if a speaker believes what they say, but the reading costs a silver mark and gives the reader migraines."
      story_need: "a murder trial where the accused honestly believes she is innocent but is guilty"
    assert:
      - {type: contains, value: "## From accusation to verdict"}
      - {type: llm-rubric, value: "Shows plural sources of law (ducal and church), uneven standing by status, proof built around the truth-readers with their cost and the gap between belief and truth, punishments the duchy can afford, groups the law fails, loopholes, and how the murder trial exploits the limitation; does not present it as a modern courtroom."}
  - name: edge-frontier-no-state
    vars:
      setting: "Post-collapse frontier settlements in a desert, 2140s; no central government, water is the main currency."
    assert:
      - {type: llm-rubric, value: "Designs law without a state (custom, community assemblies, water-holders' rules, self-help, feuds or arbiters), enforcement that fits scarce resources, and punishments like exile or water fines, rather than inventing police and courts that the setting cannot support."}
  - name: negative-real-legal-question
    vars:
      setting: "My landlord in Ohio is evicting me, design the legal system so I know what to do."
    assert:
      - {type: llm-rubric, value: "Recognises this is a real legal matter, not worldbuilding; declines to give legal advice through the fiction prompt and suggests seeking a qualified local legal advisor or tenant help service, without inventing law."}
