schema: 1
baseline: "Design an ancient ruin for my world: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-desert-observatory
    vars:
      setting: "Fantasy desert on the edge of a river kingdom. A ruined stone complex on a ridge, built around 1,500 years ago by a people the river kingdom calls 'the Sky-Thieves'. Nomads now camp nearby and bury their dead there."
      use: "the climax location of a novel where the heroine realises the official history is a lie"
    assert:
      - {type: contains, value: "## Layers of reuse"}
      - {type: llm-rubric, value: "Gives the builders a purpose later misunderstood, real causes of decline with visible signs, two to four reuse layers including nomad burials, preservation that fits a desert, competing beliefs including the river kingdom's propaganda, and discoveries ordered from surface to deepest that reveal the truth for the climax."}
  - name: edge-sci-fi-derelict
    vars:
      setting: "Science fiction: an abandoned orbital station around a gas giant, built by an earlier human colony wave 400 years ago."
    assert:
      - {type: llm-rubric, value: "Adapts ruin logic to space (vacuum preservation, salvage as reuse, later squatters, radiation or micrometeorite damage), with layers of reuse and beliefs among current spacers, instead of desert-temple tropes."}
  - name: negative-wants-dungeon-key
    vars:
      setting: "I need a room-by-room dungeon with traps and monster stats for tonight's game."
    assert:
      - {type: llm-rubric, value: "Explains that this prompt designs a ruin's history and meaning rather than a room-by-room dungeon key with stats, asks for the setting and location to do that, or suggests using a dungeon-design prompt for the keyed rooms."}
