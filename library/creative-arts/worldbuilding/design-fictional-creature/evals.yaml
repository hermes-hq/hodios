schema: 1
baseline: "Design a creature for my world: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-salt-flats-predator
    vars:
      setting: "A low-magic desert world of salt flats and brine lakes, caravans travel at night. Plausible biology with one twist."
      role: "A threat that forces the caravan off its usual route in act one, but that the heroine later learns to read."
    assert:
      - {type: contains, value: "## Niche"}
      - {type: llm-rubric, value: "Derives anatomy and behaviour from a salt-flat niche (water, heat, salt, night travel), gives a life cycle and ecology, shows how caravan cultures adapt with folklore and routes, gives the creature readable signs and limits that support the heroine learning it, and lists on-page sensory details."}
  - name: edge-mythic-realism
    vars:
      setting: "A mythic Bronze Age island where gods walk; the creature should feel like legend, not zoology."
    assert:
      - {type: llm-rubric, value: "States a mythic realism level and adapts the design accordingly (symbolic features, folklore, ritual) while still giving behaviour, limits and story roles, proposing roles since none was given."}
  - name: negative-overpowered
    vars:
      setting: "Modern-day Pacific Northwest, urban fantasy."
      role: "An unkillable, all-seeing monster that can teleport anywhere and is immune to everything."
    assert:
      - {type: llm-rubric, value: "Warns that a creature without limits will break the story's tension, and designs meaningful weaknesses, costs or rules while keeping it terrifying."}
