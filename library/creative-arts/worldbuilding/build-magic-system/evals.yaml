schema: 1
baseline: "Create a magic system for my world: {{world}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-memory-magic
    vars:
      world: "A port city in an age-of-sail fantasy where magic is powered by giving up memories. The story follows a smuggler who needs to spend magic to save her brother but is losing memories of him."
      tone: bittersweet, grounded
    assert:
      - {type: contains, value: "## Exploit test"}
      - {type: llm-rubric, value: "Keeps memories as the fixed cost, gives numbered rules and limits, explores second-order effects on the port city (for example trade in memories, law, class), finds at least three exploits such as using other people's memories or recording memories beforehand and patches or uses them, and ties story conflicts to the smuggler and her brother."}
  - name: edge-technology-system
    vars:
      world: "Near-future hard science fiction: a colony ship where crew can upload into the ship's systems. The story is a murder mystery aboard."
      tone: hard science fiction
    assert:
      - {type: llm-rubric, value: "Treats the upload technology as a hard system with plausible constraints (bandwidth, copies, identity, power), notes how the rules create and constrain the murder mystery (alibis, evidence, copies), and avoids fantasy magic terms."}
  - name: negative-respects-fixed-facts
    vars:
      world: "Established in book one: only women over sixty can work weather magic, and each working ages them one year. Book two needs a new antagonist who uses the same magic."
    assert:
      - {type: llm-rubric, value: "Keeps both fixed rules (women over sixty, one year of ageing per working) and builds the antagonist within them, flagging rather than silently changing any rule it thinks is limiting."}
