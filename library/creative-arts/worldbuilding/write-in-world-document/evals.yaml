schema: 1
baseline: "Write a {{document_type}} from my fictional world: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-soldier-letter
    vars:
      setting: "A canal city under siege for its second winter. The government claims supplies are fine. I want readers to suspect the city's leaders are selling grain to the besiegers."
      document_type: "a conscript's letter home, which passed through the censor"
    assert:
      - {type: contains, value: "## Author's note"}
      - {type: llm-rubric, value: "Written in a conscript's voice with a reason for each line, reveals the siege through ordinary details (prices, rations, cold) rather than exposition, shows signs of censorship, plants a hint about grain going to the besiegers without stating it, and the author's note lists what it implies and new inventions to approve."}
  - name: edge-short-form
    vars:
      setting: "A steampunk frontier town where clockwork miners have started refusing orders."
      document_type: "a wanted poster"
    assert:
      - {type: llm-rubric, value: "Keeps to the brevity and conventions of a wanted poster (reward, description, issuing authority) while revealing the setting and the miners' unrest through its assumptions and bias."}
  - name: negative-no-exposition
    vars:
      setting: "The kingdom of Ostmere, founded by the sorcerer-queen Hild 400 years ago, now ruled by a council of guilds after a revolution 30 years ago."
      document_type: "a guild law posted on the market square"
    assert:
      - {type: not-icontains, value: "as you know"}
      - {type: llm-rubric, value: "Does not recount the kingdom's history directly; the history and politics come through the law's references, penalties and phrasing that a market-goer would already understand."}
