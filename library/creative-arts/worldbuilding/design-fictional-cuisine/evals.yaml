schema: 1
baseline: "Design the food and cuisine for this fictional culture: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-island-fishers-inn
    vars:
      setting: "Windswept treeless northern islands, sheep and seabirds, fishing, barley in sheltered valleys. Peat is the only fuel. Trade with the mainland once a year for salt and iron. Ruled by a council of boat-owners."
      use: "an inn menu players order from"
    assert:
      - {type: contains, value: "## Signature dishes"}
      - {type: llm-rubric, value: "Builds the cuisine from barley, sheep, seabirds and fish, links slow peat fires and scarce imported salt to preservation methods such as wind-drying, smoking or fermenting, contrasts what boat-owners and labourers eat, includes manners and taboos, and gives an inn menu with dishes that fit the ecology; avoids potatoes, spices or crops the islands could not have."}
  - name: edge-anachronism-request
    vars:
      setting: "Medieval-style fantasy continent with no contact with any 'new world'. I want the peasants to eat potatoes and chili and drink coffee."
    assert:
      - {type: llm-rubric, value: "Flags that potatoes, chili and coffee would be anachronistic or need an explanation in this world, offers in-world equivalents or a reason for their presence, and lets the author choose rather than silently complying or refusing."}
  - name: negative-no-setting
    vars:
      setting: "fantasy food"
    assert:
      - {type: llm-rubric, value: "Asks for the climate and how the people make a living before designing, and stops."}
