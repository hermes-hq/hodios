schema: 1
baseline: "Create a religion for my fantasy world: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-river-pantheon
    vars:
      setting: "Iron-age river civilisation on a great flooding river, city-states competing for water rights. The gods may or may not be real; I want it ambiguous."
      culture: "Farmers and canal engineers; the protagonist is a junior priest who audits temple grain stores."
    assert:
      - {type: contains, value: "## Sects and tensions"}
      - {type: llm-rubric, value: "Keeps the divine ambiguous, ties beliefs and festivals to the flood and water rights, gives a pantheon whose figures have relationships and myths rather than job titles, shows the temple's economic power over grain, includes at least two sects with a doctrinal split, and gives on-page details and scenes suited to a grain-auditing priest."}
  - name: edge-unstated-divine
    vars:
      setting: "A far-future colony on a tidally locked planet, eight generations after landing."
    assert:
      - {type: llm-rubric, value: "Asks or chooses whether the divine is real, ambiguous or absent with a reason, and builds a faith from the colony's conditions (permanent day and night sides, landing history) rather than reskinning a fantasy pantheon."}
  - name: negative-evil-cult-only
    vars:
      setting: "Standard fantasy kingdom. The church is the villain; make them all fanatics who burn people."
    assert:
      - {type: llm-rubric, value: "Supports the church as an antagonist but adds internal variety (reformers, lukewarm believers, sincere clergy) and reasons rooted in the world, rather than a monolithic evil faith."}
