schema: 1
baseline: "Build a fictional world for me: {{concept}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-frozen-sea
    vars:
      concept: "What if the sea froze solid every winter and whole cities moved across the ice on runners"
      use: "a tabletop campaign for four players"
    assert:
      - {type: contains, value: "## Central tension"}
      - {type: llm-rubric, value: "Builds from the frozen-sea premise and follows its consequences into trade, food, travel and conflict; gives unresolved tensions, places, factions with wants and fears, rules with limits and costs for the unusual element, and story hooks framed as adventures and player choices rather than novel plots."}
  - name: edge-blank-start
    vars:
      concept: "fantasy"
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions (the core difference or 'what if', what the world is for, the tone) with an example or default for each, offers to propose concepts if told 'surprise me', and stops without building a full world."}
  - name: negative-contradiction-kept-decision
    vars:
      concept: "A world with no metal at all; everything is built from bone, stone and glass"
      existing: "The main kingdom's army is famous for its steel swords"
    assert:
      - {type: llm-rubric, value: "Notices that steel swords contradict a world with no metal, points out the conflict and offers options instead of silently dropping or changing either decision."}
