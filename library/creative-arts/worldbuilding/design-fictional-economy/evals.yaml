schema: 1
baseline: "Design the economy for {{scale}} in this setting: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-salt-kingdom-price-list
    vars:
      setting: "Bronze-age-inspired fantasy kingdom on a dry coast. Salt pans and olive groves; the king controls the only copper mine. Priestesses of the sea goddess keep the grain stores. Minor weather magic exists but exhausts the caster for days."
      scale: "the kingdom"
      story_need: "a price list players can shop from and a reason for unrest"
    assert:
      - {type: contains, value: "## Prices and wages"}
      - {type: llm-rubric, value: "Builds the economy from salt, olives, copper and temple grain stores; prices are expressed against an unskilled daily wage in one consistent unit with reasons for outliers; shows who captures the surplus (crown copper monopoly, temple granaries); accounts for weather magic's cost; lists tensions with winners and losers tied to unrest."}
  - name: edge-space-federation-scale
    vars:
      setting: "Hard science fiction, no faster-than-light travel; colonies in the asteroid belt trade with Mars and Earth. Light-lag makes real-time banking impossible."
      scale: "an interplanetary trade network"
    assert:
      - {type: llm-rubric, value: "Adapts money and credit to light-lag (local currencies, delayed settlement, trusted ledgers or escrow) rather than coins, treats transport cost and orbital windows as the main driver of prices, and keeps consistent with no faster-than-light travel."}
  - name: negative-no-setting
    vars:
      setting: "an economy for my world"
      scale: "a country"
    assert:
      - {type: llm-rubric, value: "Asks for the era, technology or magic level and basic setting facts before designing, and stops instead of inventing a full economy."}
