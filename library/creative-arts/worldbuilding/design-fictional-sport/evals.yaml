schema: 1
baseline: "Invent a sport for my fictional world: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-canal-city-tournament
    vars:
      setting: "Canal city in a low-magic Renaissance-like world; boat guilds dominate, and the poor live on houseboats. Minor wind charms are cheap and common."
      story_need: "a tournament arc where a houseboat kid joins a guild team"
    assert:
      - {type: contains, value: "## Rules"}
      - {type: llm-rubric, value: "Designs a water or boat-based sport rooted in canal life with numbered playable rules, scoring that allows comebacks, positions including one suited to an underdog, a rule on wind charms, guild money and class tensions, and advice for writing an earned climactic win in the tournament arc."}
  - name: edge-zero-gravity
    vars:
      setting: "Space station habitat with a zero-gravity central hub; crews of miners have little free time."
    assert:
      - {type: llm-rubric, value: "Builds rules and movement around zero gravity and the hub's space, keeps matches short to fit limited free time, and checks for a dominant strategy."}
  - name: negative-no-setting
    vars:
      setting: "a sport"
    assert:
      - {type: llm-rubric, value: "Asks about the society and its technology or magic before designing, and stops."}
