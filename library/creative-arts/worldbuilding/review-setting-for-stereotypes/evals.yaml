schema: 1
baseline: "Check my fantasy setting for stereotypes: {{lore}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-desert-raiders
    vars:
      lore: |
        The Kingdom of Aldmere: fair-haired farmers, just laws, the heroes' homeland.
        The Sand Tribes of the south: dark-skinned desert raiders in turbans who worship a fire demon, kidnap women and sell them in their bazaars. Their leaders are called sultans.
        The Elves of the forest: wise, ancient and in harmony with nature.
      audience: "commercial video game sold worldwide"
    assert:
      - {type: contains, value: "## Revision options"}
      - {type: llm-rubric, value: "Identifies the Sand Tribes as drawing on real Middle Eastern and North African markers (turbans, sultans, bazaars, darker skin) paired with uniformly villainous traits, notes the moral geography of a fair-haired just north versus a dark-skinned barbaric south, rates it likely harmful, offers revisions that keep a desert culture but give it variety and perspective, and recommends sensitivity readers; points to the text for each concern."}
  - name: edge-legitimate-inspiration
    vars:
      lore: "The Hesk are a seafaring people inspired by Polynesian wayfinding: they navigate by stars and swells, argue fiercely about whether to settle or keep voyaging, and have rival schools of navigators and a merchant class that resents them."
    assert:
      - {type: llm-rubric, value: "Recognises the inspiration is handled with internal variety and agency, does not flag the culture just for being inspired by a real one, mentions only minor or specific considerations (such as naming or sacred practices) if any, and suggests a sensitivity reader question without manufacturing problems."}
  - name: negative-nothing-in-scope
    vars:
      lore: "The magic system runs on crystals that store sunlight; overuse cracks them."
    assert:
      - {type: llm-rubric, value: "States that the text contains no peoples, cultures or species to review for stereotypes and stops, without inventing concerns."}
