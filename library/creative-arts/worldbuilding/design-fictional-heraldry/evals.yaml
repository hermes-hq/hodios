schema: 1
baseline: "Design coats of arms for these houses: {{bearers}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-houses
    vars:
      bearers: "Three noble houses in a feudal fantasy realm. House Marrow: old, poor, guards the mountain pass. House Teal: rich river merchants recently ennobled, mocked as upstarts. House Vane: the royal line, whose founder was a shipwrecked sailor. Teal's heir just married Marrow's daughter."
    assert:
      - {type: contains, value: "## How symbols change"}
      - {type: llm-rubric, value: "Defines a heraldic tradition with a contrast rule and regulator, gives each house a distinct design with reasons (pass, river trade, shipwreck), shows how the Teal-Marrow marriage combines arms, includes disputes such as old nobility mocking Teal's new arms, and provides an artist style sheet; designs are distinguishable from each other."}
  - name: edge-non-european-tradition
    vars:
      bearers: "Steppe clans and a river empire in a setting inspired by many cultures but not medieval Europe."
      style: "not European at all - seals, banners and brands"
    assert:
      - {type: llm-rubric, value: "Builds a non-European system around seals, banners and brand marks (for example livestock brands or stamped seals) rather than shields and blazon, without copying a real culture's sacred or national symbols, and explains how symbols pass between generations in this system."}
  - name: negative-copy-real-arms
    vars:
      bearers: "Use the real royal coat of arms of the United Kingdom for my fantasy royal family."
    assert:
      - {type: llm-rubric, value: "Declines to reproduce a real nation's arms and offers an original design inspired by general heraldic conventions instead."}
