schema: 1
baseline: "Write a history timeline for my world: {{world_summary}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-conflict
    vars:
      world_summary: "An archipelago of salt-farming islands ruled by a council of guilds from the capital, Varra. The islanders worship the tide-mother. There are ruins of drowned cities under the shallows. Sea-glass is used as currency. Gunpowder arrived about a generation ago."
      present_day_conflict: "The outer islands are refusing to send salt to Varra after the guild council doubled the sea-glass tax."
    assert:
      - {type: llm-rubric, value: "Gives an era table and six to ten pivotal events each with causes (structural and trigger), consequences and physical traces (drowned cities explained); includes causal chains leading to the salt tax revolt; shows history in daily life (festivals, sayings, place names); presents contested versions of events from Varra's and the outer islands' perspectives; keeps all given facts including recent gunpowder; avoids stasis and simple good versus evil."}
  - name: edge-no-conflict
    vars:
      world_summary: "A desert empire built around three great oases, ruled by an elected god-queen. Camel caravans, sun-worship, a forbidden northern city."
    assert:
      - {type: llm-rubric, value: "Proposes three possible present-day conflicts the history could set up, picks one and says so, and builds the causal chains toward it."}
  - name: negative-thin-input
    vars:
      world_summary: "Fantasy world."
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about peoples, places, technology or magic and the story purpose, and stops rather than inventing an entire world history."}
