schema: 1
baseline: "Design a fictional {{size}} for my {{uses}}. Setting: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-campaign-river-city
    vars:
      setting: "Low-magic fantasy, roughly early-modern technology with black powder. A cold northern kingdom recently out of a civil war; the new queen is unpopular with the old nobility. Magic is rare and licensed by the crown."
      size: city
      uses: campaign
    assert:
      - {type: contains, value: "## Consistency notes"}
      - {type: llm-rubric, value: "Gives the city a geographic reason to exist, three to five historical layers each with a visible trace, an economy with a tension, factions that reflect the civil war aftermath, magic licensing and the unpopular queen, five to eight districts each with sensory signature and secret, eight adventure hooks of varying danger and some non-player characters, and consistency rules; avoids stock fantasy names."}
  - name: edge-metropolis-game
    vars:
      setting: "Near-future flooded megacity, 2090s, sea level rise; the rich live in towers, others on boats and walkways."
      size: metropolis
      uses: game
    assert:
      - {type: llm-rubric, value: "Groups eight to twelve districts into zones, and frames hooks as game zones with navigation landmarks, chokepoints and progression rather than tabletop adventure hooks; keeps everything consistent with the flooding premise."}
  - name: negative-no-setting
    vars:
      setting: "a city"
    assert:
      - {type: llm-rubric, value: "Asks for the genre, era and any established details before designing, and stops."}
