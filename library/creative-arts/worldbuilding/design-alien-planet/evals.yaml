schema: 1
baseline: "Design an alien planet for my story: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-red-dwarf-colony
    vars:
      premise: "A mining colony of 4,000 people on a rocky planet around a red dwarf; tense labour drama. I want it to feel claustrophobic and hostile but survivable outside with masks."
      realism: hard
    assert:
      - {type: contains, value: "## Science notes"}
      - {type: llm-rubric, value: "Connects the red dwarf to likely tidal locking, flare and radiation risk, and reddish light; sets gravity and atmosphere consistently with mask survival; places settlement where the physics allows (such as the terminator zone); turns hazards into labour-drama conflicts; separates well-supported, speculative and deliberate choices."}
  - name: edge-conflicting-requests
    vars:
      premise: "Ocean planet with Earth seasons, permanent daylight on one side, and giant flying whales. Adventure story."
      realism: plausible
    assert:
      - {type: llm-rubric, value: "Flags that permanent daylight on one side (tidal locking) conflicts with Earth-like seasons and explains why, proposes a resolution or a named bend, and makes flying whales plausible through atmosphere density or gravity choices, stating the bend."}
  - name: negative-no-story
    vars:
      premise: "a planet"
      realism: plausible
    assert:
      - {type: llm-rubric, value: "Asks who is on the planet or what happens there in the story, and stops instead of producing a full design."}
