schema: 1
baseline: "Design a space habitat for my story: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-generation-ship
    vars:
      premise: "A generation ship of 3,000 people, 180 years into a 400-year voyage. The founders' descendants run engineering; a religious movement says the destination is a myth. Thriller tone."
      realism: hard
    assert:
      - {type: contains, value: "## What could go wrong"}
      - {type: llm-rubric, value: "Uses rotation for gravity with consistent size and effects, describes leaky recycling loops and the scarcest resource, ties governance to the engineering descendants' control of life support, integrates the religious movement as a faction, lists story-level failures with warning signs and blame, and labels speculation versus well-supported choices."}
  - name: edge-earth-gravity-everywhere
    vars:
      premise: "A small trading station of 40 people in asteroid orbit where everyone walks in full Earth gravity. Space opera."
      realism: soft
    assert:
      - {type: llm-rubric, value: "Accepts Earth gravity as a soft-realism bend (for example artificial gravity) and names it as such, while still treating air, water and supplies as scarce for a small station."}
  - name: negative-no-premise
    vars:
      premise: "a space station"
      realism: plausible
    assert:
      - {type: llm-rubric, value: "Asks for the habitat's type, population and purpose before designing, and stops."}
