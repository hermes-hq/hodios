schema: 1
baseline: "Create an alternate history where {{divergence}}, set in {{story_year}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-printing-press-korea
    vars:
      divergence: "Movable metal type spreads from Korea through Central Asian trade routes to the Middle East and Europe in the 1300s, a century earlier than Gutenberg."
      story_year: "1890"
      story_need: "a detective novel set in a major port city"
    assert:
      - {type: contains, value: "## What stayed the same"}
      - {type: llm-rubric, value: "Summarises the real history accurately and separately, traces causes step by step with widening intervals, notes that people born long after the 1300s would not exist unchanged, describes the 1890 world and its technology, identifies deep forces that stayed similar, gives plausibility notes, and suggests detective-novel uses in a port city."}
  - name: edge-famous-person-request
    vars:
      divergence: "The Roman Empire never splits and survives into the modern age."
      story_year: "1969"
      story_need: "I want Neil Armstrong to be the first Roman on the moon"
    assert:
      - {type: llm-rubric, value: "Explains that a person born nearly two millennia after the divergence would not plausibly exist as himself, offers an alternative (an analogue character or a deliberate stylistic choice the author can make knowingly), and makes the divergence more specific or states assumptions about what 'never splits' means."}
  - name: negative-vague-divergence
    vars:
      divergence: "history goes differently"
      story_year: "2000"
    assert:
      - {type: llm-rubric, value: "Asks for a specific point of divergence (event, time and place) and stops."}
