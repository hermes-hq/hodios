schema: 1
baseline: "Create a fictional culture for my world: {{world}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-river-delta
    vars:
      world: "A low-fantasy world, bronze-age technology. A people who live on a vast seasonal river delta that floods half the year. In the story they are about to be absorbed by an inland empire."
      inspiration: "Marsh Arabs and Bengal delta communities, loosely; I want water to shape everything."
    assert:
      - {type: contains, value: "## On the page"}
      - {type: llm-rubric, value: "Derives economy, housing and customs from the seasonal flood, gives at least three internal factions or tensions including responses to the empire, describes how outsiders misread them, lists ten concrete on-page details, and transforms rather than copies the real inspirations."}
  - name: edge-science-fiction
    vars:
      world: "Generation-ship descendants living in the ship's hydroponics ring for 300 years, isolated from the command decks."
    assert:
      - {type: llm-rubric, value: "Builds the culture from the ship's material constraints (closed life support, recycling, limited space, scarcity) and gives naming conventions, rituals and tensions suited to a ship, not a planetary fantasy."}
  - name: negative-no-monoculture
    vars:
      world: "An orc clan in a classic fantasy world. They are the villains of my book."
    assert:
      - {type: llm-rubric, value: "Avoids a single-trait warrior race: gives internal disagreement, varied roles and values with reasons rooted in their conditions, while still supporting their role as antagonists in the story."}
