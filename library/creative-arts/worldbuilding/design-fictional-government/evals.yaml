schema: 1
baseline: "Design a government for this setting: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-merchant-republic-crisis
    vars:
      setting: "Renaissance-like island city-state of about 120,000 people, rich from spice trade, with a mercenary navy. A plague five years ago killed many of the old families."
      form: "merchant republic"
      story_need: "a conspiracy the protagonist uncovers in the council"
    assert:
      - {type: contains, value: "## How a decision gets made"}
      - {type: llm-rubric, value: "Designs a merchant republic with a coalition behind it (great trading houses, mercenary navy), a legitimacy story and who doubts it, offices and how people enter them, a realistic decision traced step by step, plague-driven fault lines, and conspiracy openings in the council; every institution has its own interests."}
  - name: edge-implausible-form
    vars:
      setting: "Iron-age tribes spread over a mountain range, no writing, travel between valleys takes days."
      form: "centralised bureaucratic empire with daily census reports"
    assert:
      - {type: llm-rubric, value: "Points out that a centralised daily census is implausible without writing and with days of travel, adjusts the form (for example a confederation, chiefdom or tributary arrangement) and explains why, while keeping as much of the request as fits."}
  - name: negative-too-thin
    vars:
      setting: "a kingdom"
    assert:
      - {type: llm-rubric, value: "Asks for the era, size and basic facts of the state before designing, and stops."}
