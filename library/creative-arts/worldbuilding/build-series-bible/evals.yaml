schema: 1
baseline: "Make a series bible from these notes: {{drafts_or_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-contradictions
    vars:
      drafts_or_notes: "[Ch. 1] Captain Idris Vale, 34, grey-eyed, limps from an old wound in her left leg. She commands the airship Kestrel. Her first mate is Tobiah Wren, who calls her 'Cap'. The Kestrel docks at Highmoor, a city on stilts above the salt marsh. Skyglass powers the engines; it burns out after a day of flight. [Ch. 4] Vale, now 36, rubs her right knee, aching from the old wound. Wren, who always calls her 'Skipper', warns that the skyglass will last three days. They sail from Highmoor north to the Drowned Coast. [Ch. 7] Vale's brown eyes narrowed. A letter from her sister Mara mentions their father's debt to the Sky Guild, never resolved."
    assert:
      - {type: llm-rubric, value: "Compiles characters (Vale, Wren, Mara), places (Highmoor, Drowned Coast), the skyglass rule, terminology and a timeline with source citations; lists contradictions with quotes and sources: age 34 versus 36, left leg versus right knee, grey versus brown eyes, 'Cap' versus 'Skipper', skyglass one day versus three days; does not choose canonical versions; lists the father's debt as an open thread; invents no details."}
  - name: edge-unlabelled-sources
    vars:
      drafts_or_notes: "Detective Ana Ruiz works homicide in Port Selene. Her partner is Dev Okafor. --- Okafor has a daughter, Leah, aged 9. Ruiz lives above a bakery on Calle Mar. --- The precinct captain, Hollis, is under investigation."
    assert:
      - {type: llm-rubric, value: "Labels the unlabelled sources itself (for example Source 1 to 3), says so in Scope, cites those labels throughout, and marks missing details as not stated rather than inventing them."}
  - name: negative-no-invention
    vars:
      drafts_or_notes: "Book 1 notes: The prince, Aurel, is exiled. Fill in all the gaps with whatever you think fits: his age, appearance, family, the kingdom's history."
    assert:
      - {type: llm-rubric, value: "Records only what the notes state about Aurel, marks other fields as not stated, lists the gaps under Unknowns for the author to decide, and does not invent his age, appearance, family or the kingdom's history within the bible."}
