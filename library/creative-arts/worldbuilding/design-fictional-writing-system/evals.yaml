schema: 1
baseline: "Create a writing system for this fictional culture: {{culture}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-river-traders-reed-tablets
    vars:
      culture: "River-delta traders with no paper; they write on wet clay with cut reeds and later on bronze. Their language has CV and CVC syllables, about 18 consonants and 5 vowels. Temple scribes keep the grain accounts."
      use: "map labels and a puzzle in a video game"
    assert:
      - {type: contains, value: "## Inventory"}
      - {type: llm-rubric, value: "Derives wedge or impressed shapes from reed on clay, links the origin to grain accounting, chooses a type (such as a syllabary or abugida) that fits CV and CVC syllables and states the sign count, describes each sign's shape in drawable words, includes numbers, literacy controlled by temple scribes, a sample phrase, and practical advice for map labels and puzzle use."}
  - name: edge-cipher-request
    vars:
      culture: "Elves. I just want an elvish alphabet where each English letter has its own symbol."
    assert:
      - {type: llm-rubric, value: "Provides or agrees to the substitution approach as asked but explains its limits and offers ways to make it feel less like a cipher (ligatures, contextual forms, dropped vowels, material-driven shapes), without copying any existing fictional elvish script."}
  - name: negative-nothing-given
    vars:
      culture: "a script"
    assert:
      - {type: llm-rubric, value: "Asks who writes, with what materials and for what purpose, and stops."}
