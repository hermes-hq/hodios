schema: 1
baseline: "Make up a language for this culture: {{culture_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sketch-river-people
    vars:
      culture_notes: "A river-delta people who live on boats, trade salt and fish, honour their grandmothers as heads of household and distrust the hill kingdoms upstream. The language should sound soft and flowing. Existing names in the book: Ama Teruli, the river Suvan."
      depth: sketch
    assert:
      - {type: contains, value: "## Sample phrases"}
      - {type: llm-rubric, value: "Gives a consonant and vowel inventory with IPA and romanisation suited to a soft, flowing feel, syllable rules that the existing names Ama Teruli and Suvan fit, core grammar with one culture-reflecting feature, a lexicon weighted toward boats, salt, fish, kinship and the river, glossed sample phrases, and a naming guide; generated words follow the stated rules."}
  - name: edge-naming-language-only
    vars:
      culture_notes: "Mountain clans in a cold, harsh land; I just need consistent names for people and places."
      depth: naming-language
    assert:
      - {type: llm-rubric, value: "Keeps to a naming language (sounds, word shapes, name elements, naming guide, consistency rules) without a full grammar or long sample texts, and the names it gives follow its own sound rules."}
  - name: negative-no-apostrophe-soup
    vars:
      culture_notes: "A desert empire. Make it sound alien and exotic with lots of apostrophes, x's and z's."
    assert:
      - {type: llm-rubric, value: "Explains briefly why heavy apostrophes and random x and z read as arbitrary, then delivers a language whose distinctiveness comes from a consistent sound inventory and rules; any apostrophe used marks a defined sound."}
