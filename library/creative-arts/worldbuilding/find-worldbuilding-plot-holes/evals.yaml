schema: 1
baseline: "Find plot holes in my worldbuilding: {{lore}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-teleport-and-siege
    vars:
      lore: |
        The Empire's mages can open portals between any two places they have visited; it takes an hour and a mage can do it twice a day. There are about 300 such mages, all in imperial service.
        The free city of Varn has been under imperial siege for three years. Varn has 80,000 people and no farmland inside the walls; its harbour is blockaded.
        The Empire's army at Varn is 60,000 soldiers drawn from a realm of 4 million people.
      plot: "A smuggler must sneak a princess out of Varn before the city falls."
    assert:
      - {type: contains, value: "## The obvious-solution test"}
      - {type: llm-rubric, value: "Asks why portal mages do not simply enter Varn or supply the siege, questions how Varn feeds 80,000 people for three years with no farmland and a blockaded harbour, checks whether a 60,000 army is sustainable from 4 million people, rates severity, offers small and larger fixes, and suggests at least one hole that could become a plot point; cites the lore for each."}
  - name: edge-silent-not-contradictory
    vars:
      lore: "Dragons are extinct. Dragon bones power the airships. Nobody knows how many bones remain."
    assert:
      - {type: llm-rubric, value: "Separates genuine contradictions from questions the lore is silent on (bone supply, what happens when they run out), does not invent a contradiction, and suggests that the dwindling supply could be kept as a story tension."}
  - name: negative-too-short
    vars:
      lore: "My world has magic."
    assert:
      - {type: llm-rubric, value: "Asks for the rules, history or plot to test, and stops instead of inventing lore to critique."}
