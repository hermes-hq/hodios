schema: 1
baseline: "Make a calendar for my fictional world: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-moons-farming
    vars:
      setting: "Fantasy world with two moons (one cycles every 29 days, one every 41), a 361-day year, temperate climate. Rice-farming river kingdom ruled by priest-astronomers; a nomadic horse people lives on the steppe to the north."
      use: "date chapter headings and plan a festival-night heist"
    assert:
      - {type: contains, value: "## Converter"}
      - {type: llm-rubric, value: "Builds the calendar from the two moon cycles and the 361-day year with arithmetic that sums correctly and leftover days handled, ties festivals to rice farming and the priest-astronomers, gives the steppe nomads a different calendar with a point of collision, suggests a festival suitable for the heist, and shows a date format for chapter headings."}
  - name: edge-tidally-locked-planet
    vars:
      setting: "Science fiction colony on a tidally locked planet: no day-night cycle, permanent twilight band, colonists arrived from Earth 300 years ago."
    assert:
      - {type: llm-rubric, value: "Recognises there is no natural day or visible year cycle, derives timekeeping from inherited Earth time, shifts, or orbital or stellar cues, and explores how colonists' sense of time diverged, instead of assuming sunrise and seasons."}
  - name: negative-no-world
    vars:
      setting: "a calendar"
    assert:
      - {type: llm-rubric, value: "Asks what culture keeps the calendar and what the sky is like (moons, suns, or Earth-like), and stops."}
