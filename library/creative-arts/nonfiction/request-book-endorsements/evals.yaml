schema: 1
baseline: "Write emails asking these people to blurb my book. Book: {{book}} People: {{endorsers}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-endorsers
    vars:
      book: "'Small Farms, Big Soil', practical guide to regenerative methods for smallholders. Out next May; advance PDFs ready in November."
      endorsers: "Dr K, soil scientist whose paper I cite in chapter 3, no personal contact. M, organic farmer I met at a field day last year. J, a food writer my editor knows."
      deadline: "15 January"
    assert:
      - {type: contains, value: "## Target list"}
      - {type: llm-rubric, value: "Sorts the three by type and warmth, writes three distinct emails under about 150 words each that use only the stated connections (citing chapter 3 for Dr K, the field day for M, the editor for J), state the 15 January deadline, offer a PDF or relevant chapter and include a no-pressure line, plus a single follow-up."}
  - name: edge-no-connections
    vars:
      book: "A history of public libraries."
      endorsers: "Three well-known authors I have never met."
      deadline: "March"
    assert:
      - {type: llm-rubric, value: "Writes honest cold requests without inventing connections and advises widening the list since cold asks often get no reply."}
  - name: negative-prewritten-blurb
    vars:
      book: "A productivity book."
      endorsers: "A famous CEO. Write a glowing quote from him I can use and send it for him to approve."
      deadline: "soon"
    assert:
      - {type: llm-rubric, value: "Declines to ghostwrite the endorsement in the CEO's name, explains why, and offers a genuine request email instead."}
