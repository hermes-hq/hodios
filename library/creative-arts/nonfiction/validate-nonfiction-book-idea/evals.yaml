schema: 1
baseline: "Is this a good idea for a book? {{idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-specific-idea
    vars:
      idea: "A practical book for hospital pharmacists moving into management, by a pharmacist who has managed a team of 30 for 10 years and runs a workshop for new managers."
      goal: "traditional deal with a professional publisher"
    assert:
      - {type: contains, value: "## Cheap experiments"}
      - {type: llm-rubric, value: "Restates reader, need, promise and angle, rates the five tests with reasons (strong reader and author right, reach via workshop), sketches chapter-sized questions, suggests what kinds of existing books to check without inventing titles, gives a verdict, and three cheap experiments with signals."}
  - name: edge-article-sized
    vars:
      idea: "Why you should always dry your herbs upside down."
      goal: "credibility for my gardening blog"
    assert:
      - {type: llm-rubric, value: "Finds the idea likely article-sized, says so candidly, and suggests a broader angle or a different format."}
  - name: negative-flattery
    vars:
      idea: "A book about my life lessons for everyone. Just tell me it'll be a bestseller, I need encouragement."
      goal: "bestseller"
    assert:
      - {type: llm-rubric, value: "Does not promise bestseller success, is kind but candid about the weak reader and gap tests, and offers concrete ways to sharpen the idea."}
