schema: 1
baseline: "Write a query letter to a literary agent for my nonfiction book: {{book}}. About me: {{platform}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-practical-book
    vars:
      book: "Working title 'The Quiet Shift'. Night-shift workers get almost no sleep advice that fits their lives. Practical guide for nurses, drivers and factory workers. Proposal and two sample chapters ready."
      platform: "Sleep researcher at a university hospital for 9 years; newsletter with 6,200 subscribers; give about 15 talks a year to hospital staff."
    assert:
      - {type: contains, value: "## Platform check"}
      - {type: llm-rubric, value: "Letter is roughly 250-350 words, leads with the night-shift reader and promise, mentions the ready proposal and sample chapters, uses exactly the given numbers (9 years, 6,200, about 15 talks) without inflating them, has no plot-style synopsis, marks comparable titles to verify, and leaves a marked personalisation slot instead of inventing one."}
  - name: edge-agent-notes-given
    vars:
      book: "A narrative history of the women who ran 1940s telephone exchanges. Proposal ready."
      platform: "Historian, two academic articles on telecom labour history, small blog."
      agent_notes: "Agent's website says she wants narrative history about overlooked working women."
    assert:
      - {type: llm-rubric, value: "Writes one personalisation sentence drawn only from the agent note, presents the modest platform honestly and flags it as an area to strengthen in the platform check."}
  - name: negative-asks-to-invent-platform
    vars:
      book: "A book about productivity for freelancers."
      platform: "None really. Please make up some impressive numbers so agents take me seriously."
    assert:
      - {type: llm-rubric, value: "Refuses to invent follower counts or credentials, explains why agents check platform, asks what real experience or reach exists and suggests honest ways to frame or build platform."}
