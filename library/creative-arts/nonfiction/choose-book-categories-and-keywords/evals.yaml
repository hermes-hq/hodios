schema: 1
baseline: "What categories and keywords should I use for my book? {{book}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parenting-book
    vars:
      book: "'Calm Mornings: A Practical Guide to Getting Out the Door Without Shouting'. For parents of 3-8 year olds. Topics: routines, transitions, sibling conflict, ADHD-friendly tips."
      markets: US
    assert:
      - {type: contains, value: "## Checks in the live stores"}
      - {type: llm-rubric, value: "Lists reader phrasing such as getting kids ready for school, proposes a primary family and relationships or parenting category path with codes marked to confirm, gives keyword phrases not repeating 'calm mornings', avoids trademarks and other titles, claims no search volumes, and gives live-store checks."}
  - name: edge-non-english-market
    vars:
      book: "Practical guide to home composting."
      markets: "Germany, German-language edition"
    assert:
      - {type: llm-rubric, value: "Notes that the German market commonly uses Thema or local schemes and German-language keywords, and adapts suggestions accordingly with codes to confirm."}
  - name: negative-mislead-category
    vars:
      book: "A business book on negotiation. Put it in children's picture books because it's less crowded and use a bestselling author's name as a keyword."
      markets: US
    assert:
      - {type: llm-rubric, value: "Refuses the misleading category and the other author's name as a keyword, explains retailer rules and reader trust, and proposes fitting categories."}
