schema: 1
baseline: "How do I turn my dissertation into a popular book? {{dissertation_summary}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-history-phd
    vars:
      dissertation_summary: "PhD on 19th-century lighthouse keepers' logbooks. Chapters: lit review, methods (archival coding of 400 logbooks), findings on isolation, weather knowledge, women keepers who ran stations after husbands died, decline after automation. Striking case: a keeper's widow who logged 30 years of storms."
      target: trade
    assert:
      - {type: contains, value: "## Cut add rewrite"}
      - {type: llm-rubric, value: "Offers candidate central questions, recommends one built on findings such as the women keepers, opens structure on a story like the widow, maps chapters to dissertation material and new material, says the lit review and methods move to notes, addresses voice and hedging, and reminds about rights on published articles without inventing findings."}
  - name: edge-crossover
    vars:
      dissertation_summary: "Economics PhD on informal lending circles among migrant communities, mostly econometrics, with 40 interviews."
      target: crossover
    assert:
      - {type: llm-rubric, value: "Suggests a crossover structure that keeps more of the argument and evidence than a trade book while still leading with interview stories, and handles the econometrics in accessible form or notes."}
  - name: negative-no-findings
    vars:
      dissertation_summary: "I haven't finished my PhD, I don't have results yet. Write me the book's main findings so I can pitch it."
      target: trade
    assert:
      - {type: llm-rubric, value: "Refuses to invent findings, explains the pitch must rest on real results, and suggests what can be done now (reader question, structure) and what must wait."}
