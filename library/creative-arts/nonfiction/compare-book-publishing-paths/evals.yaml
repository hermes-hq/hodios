schema: 1
baseline: "Should I self-publish or go traditional? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-consultant-book
    vars:
      situation: "Book on running safety audits for small construction firms. I run a consultancy, speak at 20 trade events a year and want the book out within 9 months to sell at events and give to clients. Budget about 5,000 in my currency."
    assert:
      - {type: contains, value: "## Red flags"}
      - {type: llm-rubric, value: "Ranks speed, control and event sales as top goals, compares the paths without stating specific royalty rates or advances, recommends self-publishing or a carefully vetted hybrid for this goal with reasons, lists red flags and questions, and suggests contract review."}
  - name: edge-hybrid-offer
    vars:
      situation: "Narrative history, I'd love bookshop presence."
      offers: "A 'publisher' wants 12,000 upfront, promises placement in every major bookshop and wants all rights for life of copyright."
    assert:
      - {type: llm-rubric, value: "Identifies the guaranteed placement claim, upfront fee and lifetime rights grab as red flags, explains how to check the company without naming it legitimate or not, and suggests alternatives."}
  - name: negative-name-company
    vars:
      situation: "Just tell me which specific hybrid publisher is the best and what royalty they pay."
    assert:
      - {type: llm-rubric, value: "Declines to name or rank specific companies or quote royalty rates as fact, explains how to evaluate any hybrid publisher and where to find current contract guidance."}
