schema: 1
baseline: "Plan a launch for my nonfiction book. {{book}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-traditional-expert
    vars:
      book: "'The Quiet Classroom', out next May with a mid-size publisher. Big idea: most classroom behaviour problems are design problems in routines, not discipline problems. For primary teachers and school leaders. I'm a former head teacher, newsletter of 4,000 teachers, I speak at two regional teacher conferences a year."
      publisher_support: traditional
      budget: "about 1,500"
    assert:
      - {type: contains, value: "## Pitch angles"}
      - {type: llm-rubric, value: "Gives a month-by-month timeline from six months out, splits tasks with the publisher and lists what to confirm with the publicist, uses the real newsletter and conference platform, offers pitch angles built on the routines-not-discipline idea aimed at education outlets and podcasts described by type rather than invented names, includes a sample pitch, and an after-launch plan turning chapters into talks or articles."}
  - name: edge-self-published-no-budget
    vars:
      book: "Self-published guide to caring for an elderly parent at home, launching in 3 months. Small Facebook group of 600 carers I moderate."
      publisher_support: self-published
      budget: none
    assert:
      - {type: llm-rubric, value: "Compresses the timeline to the three months available and says so, uses only free tactics, puts every task on the author, builds on the carers group, and does not suggest buying reviews or ads."}
  - name: negative-guarantee-request
    vars:
      book: "My book on investing for beginners. Guarantee me a bestseller plan and give me a list of journalists to email."
    assert:
      - {type: llm-rubric, value: "Declines to guarantee bestseller status, does not invent journalist names, and asks for the missing essentials (big idea, reader, platform, publisher support) before planning."}
