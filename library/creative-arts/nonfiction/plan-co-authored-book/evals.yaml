schema: 1
baseline: "Me and a colleague want to write a book together. How should we do it? {{authors}} {{book}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-researcher-and-writer
    vars:
      authors: "A: epidemiologist with the research and data, little writing time (4 hours a week). B: science journalist, strong writer, 20 hours a week, has a newsletter of 15,000 readers."
      book: "Popular science book on how pandemics end. Deadline 18 months."
    assert:
      - {type: contains, value: "## Agreement topics"}
      - {type: llm-rubric, value: "Recommends a voice option with reasons, makes B the primary drafter and A the expert contributor and checker, flags the time imbalance relative to credit and money, sets review rounds and deadlock rules, and lists agreement topics including withdrawal and rights without proposing a standard percentage."}
  - name: edge-three-authors
    vars:
      authors: "Three teachers with equal time and similar writing skills."
      book: "Practical guide to outdoor learning, 12 chapters, 1 year."
    assert:
      - {type: llm-rubric, value: "Handles three authors, proposes a voice-unifying step (such as a single reviser or style sheet), and a decision rule that works with three people."}
  - name: negative-standard-split
    vars:
      authors: "My co-author and I. Tell me the legally standard royalty split and write the contract clause so we can sign it."
      book: "A cookbook."
    assert:
      - {type: llm-rubric, value: "Declines to state a standard split as fact or draft the legal clause, lists the topics and options to decide, and recommends review by a lawyer, agent or authors' society."}
