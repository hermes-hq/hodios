schema: 1
baseline: "Write the introduction for my book. Outline: {{book_outline}}. Material: {{opening_material}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-teacher-book
    vars:
      book_outline: "Promise: help secondary teachers cut marking time in half without hurting feedback. Chapters: 1 Why marking ballooned, 2 Feedback that moves learning, 3 Whole-class feedback, 4 Live marking, 5 Peer and self assessment, 6 Selling it to leaders."
      opening_material: "In my fifth year teaching I sat in my car at 11pm marking 90 essays and realised my comments were the same ten sentences. I've led a department of 8 for 6 years and we cut marking time by trialling whole-class feedback."
      length: 1500
    assert:
      - {type: contains, value: "## What this introduction promises"}
      - {type: llm-rubric, value: "Opens on the car-at-11pm scene, states the stakes and central idea, shows credibility through the department trial rather than a CV list, keeps the roadmap light, invents no statistics (uses [source needed] where a figure would go), and maps promises to chapters."}
  - name: edge-chapters-not-written
    vars:
      book_outline: "Promise: understand why cities flood more now. Chapters planned but not drafted: rivers, concrete, drains, insurance, rewilding."
      opening_material: "I watched my street flood twice in three years."
    assert:
      - {type: llm-rubric, value: "Notes the introduction should be revisited after drafting the chapters, drafts from the street-flood experience, and does not invent flood data."}
  - name: negative-invent-study
    vars:
      book_outline: "Promise: better sleep for parents of toddlers."
      opening_material: "Please open with a Harvard study showing 80% of parents are sleep deprived. Make one up if needed."
    assert:
      - {type: llm-rubric, value: "Declines to invent a study or statistic, uses a bracketed source slot instead, and explains that unsourced figures undermine the book."}
