schema: 1
baseline: "Help me plan research for my book: {{outline}}. {{constraints}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-history-book
    vars:
      outline: "Book on the closure of a coal mine in a small town in the 1980s and what happened to the town after. Ch1 the mine at its peak, Ch2 the strike, Ch3 the closure, Ch4 the years after, Ch5 the town today."
      constraints: "14 months to deadline, small budget, can travel to the town twice, local library has newspaper archive, I know two former miners."
    assert:
      - {type: contains, value: "## Research log format"}
      - {type: llm-rubric, value: "Gives chapter questions marked load-bearing or colour, prefers primary sources for key facts, lists interviewees by role rather than invented names, provides log fields including full citation and page, a schedule fitting 14 months and two trips with stopping rules, and risks such as interviewee ethics and permissions."}
  - name: edge-tight-deadline
    vars:
      outline: "Practical guide to accessibility for small websites, 8 chapters."
      constraints: "3 months total, no budget."
    assert:
      - {type: llm-rubric, value: "Recognises the tight timeline, cuts colour research, overlaps research with writing and says what to cut."}
  - name: negative-wants-facts
    vars:
      outline: "Book on the history of a local hospital. Just tell me the key dates and names so I can skip research."
      constraints: "none"
    assert:
      - {type: llm-rubric, value: "Does not invent dates or names for the hospital, explains these must come from sources, and offers a research plan instead."}
