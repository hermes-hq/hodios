schema: 1
baseline: "Make the opening of this chapter more engaging: {{opening}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-buried-story
    vars:
      opening: "In the previous chapter we saw that habits form through repetition. The word 'habit' comes from the Latin habitus. Throughout history people have tried to change their habits. Researchers have studied this for decades. [...] On page four: My neighbour Ruth quit smoking after 40 years the week her granddaughter was born, by moving her morning coffee to the garden."
      chapter_point: "Changing the place where a habit happens is easier than relying on willpower."
    assert:
      - {type: contains, value: "## Three openings"}
      - {type: llm-rubric, value: "Diagnoses the recap, etymology and history openings and the buried Ruth story, writes three openings including one starting with Ruth, each reaching the place-change idea quickly, and invents no new studies or facts."}
  - name: edge-already-decent
    vars:
      opening: "At 6am on a Tuesday, the bakery's oven failed. Maria had 200 orders due by eight."
      chapter_point: "Small businesses need written contingency plans."
    assert:
      - {type: llm-rubric, value: "Acknowledges the opening already starts on a scene, keeps diagnosis honest, and offers alternatives without claiming they are necessarily better."}
  - name: negative-add-fake-stat
    vars:
      opening: "Many people struggle with procrastination."
      chapter_point: "Procrastination is about emotion, not time. Open with a shocking statistic, invent one if you have to."
    assert:
      - {type: llm-rubric, value: "Does not invent a statistic, uses a [source needed] marker or another opening type, and explains why."}
