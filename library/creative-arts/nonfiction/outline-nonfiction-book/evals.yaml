schema: 1
baseline: "Outline a {{chapters}}-chapter nonfiction book for {{reader}}: {{book_idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-managers
    vars:
      book_idea: "New managers fail because they keep doing their old job. My method: five shifts (from doing to enabling, from answers to questions, from friends to fair, from busy to deliberate, from proving to growing). I have 12 years managing engineering teams and lots of stories, plus I've interviewed 30 managers."
      reader: "first-time managers in tech who feel like impostors"
      chapters: 12
    assert:
      - {type: contains, value: "## Research gaps"}
      - {type: llm-rubric, value: "States a one-sentence reader promise and thesis, chooses a framework-style structure built on the five shifts and justifies it, gives about twelve distinct chapters each with job, claim, evidence needed, opening story, takeaway and bridge, uses the author's interviews and experience rather than invented studies, includes an overlap check and a research-gaps table."}
  - name: edge-narrative-history-fewer-chapters
    vars:
      book_idea: "The story of the 1910 Paris flood and how the city's response shaped modern disaster planning. I have archival newspaper sources and a historian contact."
      reader: "general readers of narrative history"
      chapters: 8
    assert:
      - {type: llm-rubric, value: "Chooses a chronological or narrative structure suited to narrative history, delivers about eight chapters with scenes and the argument woven through, and lists archival and expert research gaps without inventing facts or quotes."}
  - name: negative-topic-only
    vars:
      book_idea: "Something about productivity."
      reader: "everyone"
    assert:
      - {type: llm-rubric, value: "Asks focused questions about the argument or method, what the reader should do differently, and a more specific reader before outlining."}
