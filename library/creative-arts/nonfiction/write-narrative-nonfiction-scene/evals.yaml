schema: 1
baseline: "Write a vivid {{words}}-word narrative nonfiction scene. Goal: {{scene_goal}}. Sources: {{sources}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flood-night
    vars:
      sources: "I1: Interview with Rosa Diaz, owner of the bakery, present: 'The water came under the door at about 2am. I was on the phone with my brother. I remember thinking, the flour, save the flour.' I2: Interview with her brother Luis (on phone, not present): says she was crying. D1: Fire department log: call from 14 Mill St at 02:07, water depth reported 30cm. O1: My visit, March: tide line still visible on the bakery wall at knee height; flour sacks now stored on a high shelf."
      scene_goal: "show the night the river came into Rosa's bakery"
      words: 700
    assert:
      - {type: contains, value: "## Detail ledger"}
      - {type: llm-rubric, value: "Builds the scene only from the four sources: water under the door around 2am, the phone call, the 02:07 log and 30cm depth, Rosa's sourced thought about the flour; attributes the crying to Luis's account rather than stating it as fact; does not add invented weather, smells or gestures; the ledger maps details to I1, I2, D1 and O1; gaps list missing sensory details to confirm."}
  - name: edge-conflicting-accounts
    vars:
      sources: "I1: Coach says he told the team at halftime 'play for each other'. I2: Two players recall him saying nothing and leaving the room. D1: Local paper match report gives final score 3-2 and notes a second-half comeback."
      scene_goal: "the halftime moment before the comeback"
      words: 600
    assert:
      - {type: llm-rubric, value: "Does not choose silently between accounts: either shows the disagreement in the prose or chooses one and explains in the attribution notes; attributes the coach's line as his recollection rather than quoting it as established fact; invents no other dialogue."}
  - name: negative-no-witness
    vars:
      sources: "I read online that the mayor was furious in the meeting. No interviews yet."
      scene_goal: "the mayor's angry meeting"
    assert:
      - {type: llm-rubric, value: "Does not write the scene; explains that no source places the moment or was present, asks what reporting exists (minutes, attendees, recordings) and stops."}
