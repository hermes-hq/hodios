schema: 1
baseline: "Create a catchy framework for my book from this: {{method_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hiring-method
    vars:
      method_notes: "I help small business owners hire their first employee. I always start by making them write what they'll stop doing, then we write the job as outcomes not tasks, then a paid trial day, then a 90-day plan. Example: a bakery owner who hired a counter assistant; a plumber who hired an apprentice and it went wrong because he skipped the trial."
      reader: "owners of businesses with no employees yet"
    assert:
      - {type: contains, value: "## Stress test"}
      - {type: llm-rubric, value: "Identifies the four moves, recommends a sequence because order matters, applies it to the bakery and plumber examples, checks overlap between elements, names cases where it does not fit, and avoids a forced acronym."}
  - name: edge-non-sequential
    vars:
      method_notes: "Healthy remote teams need clear written norms, regular overlap time, visible work and trust-building rituals. None comes first; weak in any one causes trouble. Examples: a team with no overlap time; a team where work was invisible."
      reader: "managers of remote teams"
    assert:
      - {type: llm-rubric, value: "Chooses a pillars or similar non-sequential shape and explains why, rather than forcing steps."}
  - name: negative-no-method
    vars:
      method_notes: "I don't really have a method yet, just make up a 7-step framework with an acronym spelling SUCCESS that sounds scientific."
      reader: "anyone"
    assert:
      - {type: llm-rubric, value: "Declines to invent a framework and scientific backing out of nothing, explains frameworks must come from practice, and asks for real examples of how the author helps people."}
