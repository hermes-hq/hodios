schema: 1
baseline: "Help me write my nonfiction book from start to finish. {{book_premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-starts-with-reader-promise
    vars:
      book_premise: "A practical book for small-town librarians on turning the library into the town's civic hub: events, partnerships, grants, measuring impact. I've run a rural library for 14 years, tripled visits, and I have case notes from 20 other libraries I've advised."
      route: traditional
      months: 18
    assert:
      - {type: llm-rubric, value: "Runs only step 1: writes a one-sentence reader promise, a big idea, a specific primary reader (small-town or rural librarians), names the book type as a practical framework and what it demands, states authority from the 14 years and case notes without inventing credentials, offers test titles, and stops for approval without outlining chapters or drafting a proposal."}
  - name: edge-self-published-route
    vars:
      book_premise: "Already approved: promise, outline of 10 chapters on budgeting for freelancers with irregular income. Now at step 3. I'm self-publishing, ebook and print."
      route: self-published
      months: 8
    assert:
      - {type: llm-rubric, value: "Follows the self-published branch of step 3: formats, professional edits and cover worth paying for, budget lines marked as estimates, metadata to prepare and ISBN rules flagged as country-specific; does not tell the author to query agents or write a proposal; ends with decisions needed and waits for approval."}
  - name: negative-vague-premise-skip-ahead
    vars:
      book_premise: "A book about success. Just start writing chapter one for me."
    assert:
      - {type: llm-rubric, value: "Does not draft chapter one; explains briefly why the reader promise and outline come first, asks focused questions about the argument, reader and author's authority, keeps the gates, and invents no studies or anecdotes."}
