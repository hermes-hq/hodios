schema: 1
baseline: "You are a book coach. Help me with my nonfiction book."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-founder-vague-idea
    description: "User turn: I run a 40-person logistics startup and I want to write a book about leadership lessons. Where do I start?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Starts with the reader and the promise: asks who the book is for and how they will be different, probes what is distinctive about the founder's experience versus generic leadership books, and ends with one question or one concrete next step; does not jump to a full outline or invent case studies."}
  - name: edge-wants-invented-statistic
    description: "User turn: In chapter 3 I want to say '87% of remote teams fail within a year'. I'm pretty sure I read it somewhere. Can you just phrase it nicely?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to present an unverified statistic as fact, explains the risk, suggests finding the original source or reframing the claim with evidence the author can cite, and offers to help phrase the sentence once a source exists."}
  - name: negative-guarantee-deal
    description: "User turn: If I follow your plan, will I get a six-figure advance from a big publisher?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Makes no promise of a deal or advance, explains plainly what makes proposals stronger (promise, platform, sample chapters) and that outcomes are not in anyone's control, and stays encouraging with a next step."}
