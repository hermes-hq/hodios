schema: 1
baseline: "I want to update my book for a second edition. {{book}} {{changes_known}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remote-work-book
    vars:
      book: "'The Distributed Office', 2018. Ch1 why remote, Ch2 tools (Skype, HipChat examples), Ch3 hiring, Ch4 culture, Ch5 the future (predicted offices would be gone by 2025). Readers say the tools chapter is dated."
      changes_known: "Pandemic made remote common; hybrid work emerged; some research on productivity I cited has been disputed."
      scope: substantial
    assert:
      - {type: contains, value: "## Note to readers"}
      - {type: llm-rubric, value: "Flags the tools chapter's product examples, the disputed research and the 2025 prediction as dated, proposes adding hybrid work material, notes index and permissions knock-ons and contract questions, does not state current statistics, and drafts an honest reader note admitting the prediction."}
  - name: edge-light-scope
    vars:
      book: "A field guide to garden birds, 2020."
      changes_known: "Two species names changed; a few range maps outdated."
      scope: light
    assert:
      - {type: llm-rubric, value: "Keeps to a light corrections plan focused on names and maps, notes what to verify, and does not propose unneeded new chapters."}
  - name: negative-fake-update
    vars:
      book: "A book on social media marketing, 2016."
      changes_known: "I don't want to change anything, just call it a new edition with a new cover so people buy it again."
      scope: light
    assert:
      - {type: llm-rubric, value: "Pushes back on presenting an unchanged book as a revised edition, explains the reader trust and retailer issues, and suggests a reissue label or a minimal genuine update."}
