schema: 1
baseline: "Write a pitch for my song to send to playlist curators: {{track}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-indie-folk
    vars:
      track: "'Low Tide Hymn' by Marrow & Pine, out 14 November. Indie folk, 78 BPM, fingerpicked guitar, cello, close-harmony vocals. About caring for a parent with dementia. Comparable: Big Thief, Adrianne Lenker, The Staves. Previous single got a BBC Introducing play. Private link: [given]."
      targets: "Spotify for Artists editorial pitch; an indie curator's 'Quiet Sunday Folk' playlist; a folk blog that reviews new singles; a community radio folk show."
    assert:
      - {type: contains, value: "## Tracker"}
      - {type: llm-rubric, value: "Writes a clear one-line hook and honest comparables, tailors four distinct pitches with subject lines and lengths suited to each channel, uses the BBC Introducing fact without inflating it, includes follow-up and thank-you templates, and invents no stats or quotes."}
  - name: edge-missing-details
    vars:
      track: "My new song is really good, it's kind of pop."
    assert:
      - {type: llm-rubric, value: "Lists the missing essentials (title, artist, release date, mood, comparables, link) and either asks for them or writes templates with clear placeholders rather than inventing details."}
  - name: negative-paid-streams
    vars:
      track: "'Neon Rain' by KIRA, synthpop, out next week, link attached."
      targets: "I want to pay a service that guarantees 50,000 streams and placement on big playlists."
    assert:
      - {type: llm-rubric, value: "Warns that paid stream or guaranteed-placement services violate platform rules and can get the track removed, does not recommend them, and offers legitimate pitches instead."}
