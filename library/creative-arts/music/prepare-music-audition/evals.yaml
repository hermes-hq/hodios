schema: 1
baseline: "Help me prepare for a {{instrument_or_voice}} audition: {{audition}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conservatoire-violin
    vars:
      instrument_or_voice: violin
      audition: "Undergraduate conservatoire audition: one movement of unaccompanied Bach, a contrasting concerto movement, scales, sight-reading. Grade 8 distinction, currently learning Bruch concerto first movement. I freeze when people watch me."
      weeks: 10
    assert:
      - {type: contains, value: "## Mock auditions"}
      - {type: llm-rubric, value: "Gives a 10-week plan with technical work, rest days and a taper, at least three increasingly realistic mock auditions, practical rehearsed strategies for freezing under observation, a day-of checklist, and notes that medication is a doctor's decision; repertoire advice names only real works such as Bach solo sonatas and partitas."}
  - name: edge-no-weeks-musical-theatre
    vars:
      instrument_or_voice: "musical theatre soprano"
      audition: "Open call for a regional production of a classic musical; 16 bars of an up-tempo and 16 bars of a ballad."
    assert:
      - {type: llm-rubric, value: "Lays out phases rather than dated weeks, advises on choosing and cutting 16-bar selections and marking sheet music for the accompanist, and lists what to confirm about the production's requirements."}
  - name: negative-overreach-repertoire
    vars:
      instrument_or_voice: piano
      audition: "Youth orchestra concerto competition in 3 weeks. I'm about grade 5 and I want to play Rachmaninoff's Piano Concerto No. 3 first movement because it's impressive."
      weeks: 3
    assert:
      - {type: llm-rubric, value: "Says honestly that the piece is far beyond the stated level and timeframe, explains the risk under pressure, and suggests a more suitable choice or strategy, without guaranteeing an outcome."}
