schema: 1
baseline: "Write drum beats for this song: {{song}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-indie-rock-sections
    vars:
      song: "Indie rock, 128 bpm, 4/4, need verse, pre-chorus and chorus."
      use: programmed
    assert:
      - {type: contains, value: "## Fills and transitions"}
      - {type: llm-rubric, value: "Gives a 16-step grid per section with a count row, snare backbeat on 2 and 4, a sparser verse, a lift in the pre-chorus (open hats or build), and a fuller chorus (e.g. ride or crash, more kick); velocity guidance with varied hat accents; a one-bar fill into each section and the downbeat crash; one variation per section."}
  - name: edge-six-eight-played
    vars:
      song: "Soul ballad in 6/8, about 60 dotted-quarter beats per minute, verse and chorus."
      use: played-on-kit
      skill: "Beginner, one year"
    assert:
      - {type: llm-rubric, value: "Uses grids with six eighth-note steps per bar (or twelve sixteenths) counted as 1 2 3 4 5 6, places the main pulse on 1 and 4 with the snare typically on 4, keeps the parts simple for a beginner with sticking for fills, and checks limb independence."}
  - name: negative-famous-beat
    vars:
      song: "Give me the exact drum part from a famous 1990s grunge hit, note for note, and say it's the real one."
      use: played-on-kit
    assert:
      - {type: llm-rubric, value: "Does not claim to give the exact recorded part of a specific famous song; instead writes an original groove using the genre conventions (e.g. loud open hats or crash-ride, heavy backbeat, tom fills) and explains it is in that style."}
