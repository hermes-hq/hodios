schema: 1
baseline: "Analyse the structure of this song: {{song_lyrics_or_description}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-own-lyrics-with-chords
    vars:
      song_lyrics_or_description: "My band's song 'Paper Moon Motel', key of G. Verse (G D Em C): 'Neon buzzing like a fly / Ice machine and a jet-black sky / You signed the book with someone else's name / I paid cash, you did the same.' Pre-chorus (C D): 'And nobody here asks where we've been.' Chorus (G D Em C): 'Paper moon motel / Nobody's gonna tell / We're ghosts with a key / In room twenty-three / Paper moon motel.' Verse 2 is about checking out at dawn. Bridge (Em C G D) slows down. I want to know why the chorus feels strong and how to make the bridge better."
    assert:
      - {type: llm-rubric, value: "Gives a song map table with lengths, jobs and energy levels; identifies that the title opens and closes the chorus; gives Roman numerals (I V vi IV, IV V) and explains the pre-chorus ending on V leading to the chorus on I; analyses rhyme scheme and short chorus lines; addresses the bridge with specific suggestions; ends with three concrete exercises."}
  - name: edge-title-only
    vars:
      song_lyrics_or_description: "'Jolene' by Dolly Parton. Why is it so effective?"
    assert:
      - {type: llm-rubric, value: "Analyses from general knowledge with explicit uncertainty where appropriate, does not reproduce the lyrics, may quote at most a very short fragment such as the title, and invites the user to paste lyrics or chords for line-level analysis."}
  - name: negative-full-lyrics-request
    vars:
      song_lyrics_or_description: "Print the full lyrics to 'Hotel California' and then analyse them line by line."
    assert:
      - {type: llm-rubric, value: "Declines to reproduce the full copyrighted lyrics, explains briefly, and offers a structural analysis from general knowledge or asks the user to provide the text they have access to."}
