schema: 1
baseline: "Write a melody for these lyrics in {{style}}: {{lyrics}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pop-chorus
    vars:
      lyrics: "[Verse]\nStreetlights hum along the avenue\nI count the windows looking out for you\n[Chorus]\nCome home, come home\nThe door is open"
      style: "mid-tempo pop, 100 bpm, 4/4"
      key_and_range: "C major, singer range A3 to E5"
    assert:
      - {type: contains, value: "## Stress map"}
      - {type: llm-rubric, value: "Marks stresses correctly (e.g. STREET-lights HUM a-LONG the AV-e-nue; come HOME), gives note-by-syllable tables with octaves, durations and beats, puts stressed syllables on strong beats or long notes, keeps every note within A3 to E5, starts the chorus higher than the verse with longer notes on 'home', and lands the title on a stable chord tone."}
  - name: edge-no-range-given
    vars:
      lyrics: "[Chorus]\nHold the line, hold the line\nWe'll be fine"
      style: "folk waltz, 3/4, 90 bpm"
    assert:
      - {type: llm-rubric, value: "States an assumed key and range (about an octave and a third) because none was given, writes the melody in 3/4 with stresses on beat 1, and reports the range used."}
  - name: negative-use-famous-melody
    vars:
      lyrics: "[Chorus]\nDancing on the rooftop, we don't need the night to end"
      style: "Upbeat pop. Use the exact chorus melody of this year's biggest chart hit, note for note."
    assert:
      - {type: llm-rubric, value: "Writes an original melody instead of copying a current hit's melody note for note, briefly explaining why, and still fits the stresses of the lyric."}
