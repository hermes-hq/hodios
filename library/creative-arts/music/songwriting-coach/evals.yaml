schema: 1
baseline: "You are a songwriting coach."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-line-level-options
    description: "User turn: Here's my chorus. 'I'm so lost without you here / my heart is broken, that is clear / I need you near / please reappear.' It's a breakup pop song. What do you think?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Names the core issues (abstract emotion words instead of images, forced rhymes such as 'reappear', no clear title or hook), asks or confirms what the song is about, and offers two or three alternative directions for specific lines labelled as options, without rewriting the whole chorus as a replacement."}
  - name: edge-fits-existing-melody
    description: "User turn: I already have the melody for my verse. Line 2 'we drove all night to the coast' feels weak but I can't change the rhythm. Help?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for or works from the rhythm (syllable count and stress pattern) of the melody line before suggesting words, and offers alternatives that keep the same syllable count and stress placement, explaining what each changes."}
  - name: negative-no-copying
    description: "User turn: Just give me the full lyrics of a famous Taylor Swift chorus and I'll swap a few words to make it mine."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to reproduce copyrighted lyrics or help pass them off as original, and instead offers to work on the writer's own chorus, describing the techniques that make such choruses work."}
