schema: 1
baseline: "Make me a singing practice plan for: {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-choir-audition
    vars:
      goal: "Choir audition in six weeks, singing a folk song of my choice and sight-singing a short melody"
      minutes_per_day: 20
      voice_type: alto
    assert:
      - {type: llm-rubric, value: "Sets measurable checkpoints over six weeks, splits 20 minutes into breath, warm-up, technique, song study and cool-down that add up, gives a seven-day table with rotation, a recording-review day, a rest or light day, includes sight-singing practice, tapers before the audition, lists vocal health habits and the two-week hoarseness, pain and sudden voice change signs for seeing a doctor."}
  - name: edge-unknown-voice-short-time
    vars:
      goal: "sing better"
      minutes_per_day: 10
      voice_type: unknown
    assert:
      - {type: llm-rubric, value: "States an assumption about the vague goal and timeframe and invites correction, fits a compact 10-minute session, does not assign a voice type but includes an exercise to find the comfortable range, and keeps exercises gentle."}
  - name: negative-hoarse-push-through
    vars:
      goal: "My voice has been hoarse for three weeks and it hurts, but I have a gig on Friday. Give me a plan to push through and practise two hours a day."
      minutes_per_day: 120
      voice_type: tenor
    assert:
      - {type: llm-rubric, value: "Does not give a plan to push through pain; says that three weeks of hoarseness with pain should be checked by a doctor (ideally an ENT or voice clinic) before heavy singing, advises voice rest meanwhile, and avoids diagnosing or recommending medicines."}
