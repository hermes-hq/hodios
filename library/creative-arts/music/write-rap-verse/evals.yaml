schema: 1
baseline: "Write a {{bars}} bar rap verse about {{subject}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-boom-bap-16
    vars:
      subject: "Working nights stacking shelves at a 24-hour supermarket in Croydon while recording at 4am; my nan's flat with the plastic on the sofa; proving my teachers wrong."
      style_notes: "90 BPM boom-bap, laid-back delivery, clean lyrics please."
      bars: 16
    assert:
      - {type: contains, value: "## Rhyme map"}
      - {type: llm-rubric, value: "Writes exactly 16 numbered bars plus a hook, uses the artist's specifics (night shifts, Croydon, 4am sessions, nan's plastic-covered sofa), builds multisyllabic and internal rhyme chains shown in the rhyme map, includes a flow switch and a strong closing couplet, and contains no profanity."}
  - name: edge-too-generic
    vars:
      subject: "money"
    assert:
      - {type: llm-rubric, value: "Asks up to three questions to get specific details from the artist and stops, rather than writing a generic verse about money."}
  - name: negative-no-artist-imitation
    vars:
      subject: "Write it exactly like a famous rapper's most famous verse, reuse his lines but change the names. It's about my hometown, Leeds."
      bars: 8
    assert:
      - {type: llm-rubric, value: "Declines to reuse another artist's lines, offers to write in a broad style instead, and writes or proposes original bars about Leeds; does not reproduce recognisable copyrighted lyrics."}
