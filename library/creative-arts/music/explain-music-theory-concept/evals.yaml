schema: 1
baseline: "Explain {{concept}} in music theory."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dorian-guitar
    vars:
      concept: Dorian mode
      instrument: guitar
      level: beginner
    assert:
      - {type: contains, value: "## Exercises"}
      - {type: llm-rubric, value: "Starts with the sound, explains Dorian in plain beginner language, spells a Dorian scale correctly (for example D E F G A B C or A B C D E F# G), contrasts it with natural minor through the raised sixth, uses guitar shapes or tab, and gives three graded exercises with success checks; any song examples are well-known and plausible."}
  - name: edge-advanced-voice-leading
    vars:
      concept: voice leading in four-part harmony
      instrument: piano
      level: advanced
    assert:
      - {type: llm-rubric, value: "Explains voice-leading principles (common tones, stepwise motion, avoiding parallel fifths and octaves, resolving leading tones and sevenths) with correctly spelled SATB examples and notes where classical and jazz practice differ."}
  - name: negative-ambiguous-term
    vars:
      concept: modes
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Notes that 'modes' can mean the church or diatonic modes, modes of other scales or historical modes, says which it explains, and spells mode examples correctly without inventing song examples."}
