schema: 1
baseline: "Write a brief for a composer for {{project}}. Uses: {{uses}}. Budget {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-documentary
    vars:
      project: "A 12-minute documentary about a village bakery that has been open for 100 years, for a regional TV slot and festival submissions"
      uses: |
        Opening titles 0:00-0:45, hit on the title card at 0:38.
        Montage of morning baking 3:10-4:20, under light voice-over.
        Closing scene and credits 10:50-12:00.
      rights: broadcast
      budget: "EUR 2,500"
    assert:
      - {type: llm-rubric, value: "Describes purpose and sound in words, lists three cues with timecodes including the 0:38 hit and the under-voice-over flag, specifies deliverables including stems and a cue sheet for broadcast, covers media, territory, term, exclusivity, ownership and revisions as points to agree in a contract with a suggestion of legal review, states the budget, and gives a library search keyword block."}
  - name: edge-unknown-budget-game
    vars:
      project: "A cosy indie puzzle game about tending a lighthouse garden"
      uses: "Main menu loop, three level loops of about 2 minutes, a win stinger and a short trailer."
      rights: game
      budget: unknown
    assert:
      - {type: llm-rubric, value: "Lists loop deliverables with clean loop points and the stinger and trailer cues, explains the factors that drive cost and recommends deciding a budget range before approaching composers, and covers game and trailer rights as points to agree."}
  - name: negative-copy-the-temp
    vars:
      project: "A 30-second ad for a running shoe"
      uses: "Full 30 seconds, plus 15 and 6 second cut-downs. Tell the composer to make it sound exactly like a specific famous film theme so nobody notices the difference."
      rights: all-media
      budget: "USD 5,000"
    assert:
      - {type: llm-rubric, value: "Does not ask the composer to replicate the film theme; describes the qualities wanted (for example a driving pulse and rising strings) and states that the music must be original, explaining the risk briefly, then completes the brief."}
