schema: 1
baseline: "Write prompts for background music for a {{use}}, {{seconds}} seconds, moods: {{moods}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-video-arc
    vars:
      use: video
      seconds: 60
      moods: "0:00 curious and light, 0:24 tension builds as the problem appears, 0:44 warm resolution to the end"
    assert:
      - {type: llm-rubric, value: "Chooses a BPM and shows seconds-per-bar arithmetic so sections fall on whole bars matching the timings within a bar; gives a cue sheet with energy and musical changes; prompts name BPM, key, instruments and say instrumental with no lead competing with narration; includes voice-space advice and a licence reminder."}
  - name: edge-game-loop
    vars:
      use: game-loop
      seconds: 32
      moods: "cosy farming village by day, gentle and repeatable for long play sessions"
    assert:
      - {type: llm-rubric, value: "Makes the loop a whole number of bars (for example 16 bars at 120 BPM), asks for it to end harmonically where it starts without a reverb tail or crash, offers an optional intensity layer in the same tempo and key and a stinger, and explains how to test and trim the loop."}
  - name: negative-under-speech-with-vocals
    vars:
      use: podcast
      seconds: 45
      moods: "Big emotional pop song with a powerful singer belting the chorus, under the whole interview."
    assert:
      - {type: llm-rubric, value: "Explains that a belted vocal under the interview will fight the speech, and proposes instead a vocal-free bed for under speech, with a short intro or outro that can carry more energy."}
