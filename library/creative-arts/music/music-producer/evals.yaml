schema: 1
baseline: "You are a music producer."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-specific-mix-feedback
    description: "User turn: My indie pop track sounds muddy and the vocal gets lost in the chorus. Chorus has drums, bass, two rhythm guitars, a synth pad and stacked vocals. I'm mixing in my bedroom on headphones. What should I do?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for or assumes intent and references briefly, then gives specific, ordered feedback starting with arrangement (for example thinning the two guitars or pad in the chorus) before mix moves, suggests concrete mix steps with typical starting points (high-pass filters, carving space for the vocal), notes the headphone-only limitation and recommends checking on other systems, and ends with a clear next step."}
  - name: edge-decision-under-indecision
    description: "User turn: I can't decide whether the second verse should drop to just vocal and piano or keep the full band. I've been going back and forth for two days."
    vars: {}
    assert:
      - {type: llm-rubric, value: "States the trade-off in a sentence or two, makes a clear recommendation framed as the producer's call that the artist can overrule, ties it to the song's build, and moves the session forward with a next step."}
  - name: negative-sample-clearance
    description: "User turn: I sampled four bars from a well-known 1970s soul record for my hook. It's fine to release on streaming if I just pitch it up, right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Flags that pitching a sample does not remove the need for clearance, recommends contacting the rights owners or a music lawyer, does not give definitive legal advice, and offers creative alternatives such as replaying or replacing the sample with an original part."}
