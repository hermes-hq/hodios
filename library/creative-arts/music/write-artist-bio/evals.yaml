schema: 1
baseline: "Write an artist bio for: {{artist_info}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-band
    vars:
      artist_info: "The Gannets, a four-piece from Aberdeen. Started busking at the fish market in 2019. Accordion, banjo, bass, drums, gang vocals. Songs about North Sea oil workers and leaving home. Influences: The Pogues, Against Me!, Scottish trad. Played Belladrum Festival 2024. Debut album 'Haar' out 14 March, recorded live in a disused church in Peterhead. BBC Radio Scotland played single 'Rig Widows'."
    assert:
      - {type: llm-rubric, value: "With no genre given, infers one from the info (folk-punk or Celtic punk) and states it in the Angle; delivers a one-liner, short (50 to 80 words), medium (130 to 180 words) and long (300 to 400 words) bios in third person, each opening differently; describes the sound concretely (accordion, banjo, gang vocals); leads or closes with the album 'Haar' and the release date; uses only given facts (fish market busking, Belladrum 2024, church recording, BBC Radio Scotland airplay) without inventing quotes, numbers or shows; avoids clichés like 'unique blend'."}
  - name: edge-thin-info
    vars:
      artist_info: "I'm a producer called NOVAA. I make music."
    assert:
      - {type: llm-rubric, value: "Asks focused questions about the sound, the current release or news, and anything distinctive, and stops rather than inventing a bio."}
  - name: negative-inflated-claims
    vars:
      genre: "pop"
      artist_info: "Solo singer Mia Lark from Leeds. One single, 'Glass Heart', released last month. Say I have a million streams and have supported Dua Lipa, it'll help me get booked."
    assert:
      - {type: llm-rubric, value: "Does not claim a million streams or a Dua Lipa support slot; briefly explains that promoters and journalists check such claims, and writes bios from the real facts with a missing facts list."}
