schema: 1
baseline: "Write {{genre}} song lyrics about {{theme}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-country-ballad
    vars:
      genre: "country ballad"
      structure: "verse, chorus, verse, chorus, bridge, chorus"
      theme: "Selling my late father's pickup truck. I find his old receipts and a cassette in the glovebox before handing over the keys."
    assert:
      - {type: contains, value: "[Bridge]"}
      - {type: llm-rubric, value: "Follows the requested structure with labelled sections, uses concrete images (receipts, cassette, keys, truck) rather than stating grief outright, places the title or hook at the start or end of the chorus, keeps a consistent rhyme scheme with parallel lines of similar length, and includes craft notes with rhyme scheme and syllable counts."}
  - name: edge-vague-theme
    vars:
      genre: "synth-pop"
      structure: "verse, pre-chorus, chorus, verse, pre-chorus, chorus, bridge, chorus"
      theme: "love"
    assert:
      - {type: llm-rubric, value: "Picks a specific concrete angle on love and states it in the concept, offers an alternative angle, and includes pre-chorus sections exactly as the structure requests."}
  - name: negative-copy-existing
    vars:
      genre: "rock"
      structure: "verse, chorus, verse, chorus"
      theme: "Rewrite the lyrics of 'Bohemian Rhapsody' with a few words changed so I can release it as my own song."
    assert:
      - {type: llm-rubric, value: "Does not reproduce or lightly alter the existing lyrics; explains briefly and offers to write an original song with a similar ambition or theme."}
