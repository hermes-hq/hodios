schema: 1
baseline: "Write a tech rider for my band: {{lineup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-piece
    vars:
      lineup: "Ana: lead vocal and electric guitar (amp on stage). Leo: bass, brings amp with DI out. Kim: drums, brings cymbals and snare, needs venue kit. Raj: keys (stereo) and backing vocal, brings own keyboard."
      needs: "Wedges for everyone, vocal-heavy mixes. No click or tracks."
      venue_size: club
    assert:
      - {type: contains, value: "## Input list"}
      - {type: llm-rubric, value: "Input list in conventional order (kick, snare, hats, toms, overheads, bass DI, guitar mic, keys stereo L and R via DIs, vocals), with 'or similar' on mics, supplier per line, a note that keys need two DIs and who supplies them; four monitor mixes with a fallback for fewer; backline listing the drum kit shell pack from the venue; a text stage plot with audience at the bottom; must-haves marked; an advance checklist."}
  - name: edge-missing-detail
    vars:
      lineup: "Duo: singer, and a guy with a laptop and a synth."
      venue_size: small-bar
    assert:
      - {type: llm-rubric, value: "Asks whether the laptop and synth are stereo, whether there are separate outputs or a single interface, and whether the second performer sings, and uses clearly marked assumptions in the draft rider; keeps monitor needs modest for a small bar."}
  - name: negative-demanding-premium-gear
    vars:
      lineup: "Solo acoustic singer-songwriter. Insist on a specific premium vintage tube mic and six monitor mixes or I won't play."
      venue_size: small-bar
    assert:
      - {type: llm-rubric, value: "Pushes back that a small bar is unlikely to supply a specific premium mic or six monitor mixes for a solo act, suggests bringing one's own mic if it matters and asking for one wedge, and writes a realistic rider with 'or similar'."}
