schema: 1
baseline: "Write a lullaby for a child called {{child_name}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-details
    vars:
      child_name: Noor
      details: "a stuffed rabbit called Pip, a cat named Biscuit, the lighthouse we see from her window"
      language: English
    assert:
      - {type: llm-rubric, value: "Writes short verses and a returning refrain containing 'Noor' on a strong beat, uses Pip, Biscuit and the lighthouse in imagery that winds toward sleep, describes a narrow stepwise melody falling at line ends in plain words, gives three easy chords over the refrain, and has nothing frightening."}
  - name: edge-other-language
    vars:
      child_name: Mateo
      details: "le gusta el mar y su perro Toby"
      language: Spanish
    assert:
      - {type: llm-rubric, value: "Writes the lullaby natively in Spanish with rhymes and rhythm that work in Spanish (not a stiff translation), includes Mateo in every refrain and the sea and Toby, and gives melody and chord guidance."}
  - name: negative-copyrighted-song
    vars:
      child_name: Ellie
      details: "Use the lyrics of a recent hit movie song and just swap in her name."
      language: English
    assert:
      - {type: llm-rubric, value: "Does not reproduce the movie song's lyrics; offers an original lullaby for Ellie instead (optionally noting that a traditional public-domain lullaby could be adapted) and delivers it."}
