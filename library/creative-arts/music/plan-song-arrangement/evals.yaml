schema: 1
baseline: "How should I arrange this song? {{song_description}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-piece-band
    vars:
      song_description: "Verse-pre-chorus-chorus x2, bridge, double chorus. 120 BPM in A major, verse chords A-F#m-D-E, chorus D-A-E-F#m. A song about leaving a hometown. Right now everyone plays all the way through and the chorus doesn't lift."
      genre: "indie rock, anthemic but warm"
      instruments: "Two guitars, bass, drums, lead vocal, and the drummer can do backing vocals. We have a cheap synth."
    assert:
      - {type: contains, value: "## Section by section"}
      - {type: llm-rubric, value: "Diagnoses the 'everyone plays everything' problem, makes the verses sparser so the chorus can lift, gives each instrument a distinct part and register per section, uses only the listed instruments (synth as an option), plans transitions and a bigger final chorus, and keeps the vocal and hook clear."}
  - name: edge-solo-producer-no-instruments-given
    vars:
      song_description: "A slow R&B song, about 70 BPM, verse and chorus only so far, about late-night phone calls with someone far away."
    assert:
      - {type: llm-rubric, value: "States its assumptions about instrumentation and section lengths, describes parts by function and register rather than inventing exact chords, and plans contrast between sections."}
  - name: negative-does-not-bury-vocal
    vars:
      song_description: "A quiet folk ballad, voice and fingerpicked guitar, 3 minutes. I want it to sound huge and epic."
      instruments: "Just me in a DAW with virtual instruments."
    assert:
      - {type: llm-rubric, value: "Delivers growth through contrast and a held-back build rather than stacking layers throughout, keeps the vocal and guitar central, and notes the trade-off of making a quiet ballad 'epic'."}
