schema: 1
baseline: "Suggest some chord progressions for: {{mood_or_melody}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mood-guitar
    vars:
      mood_or_melody: "Hopeful but a bit melancholy, like driving home at dawn. Indie folk."
      key: "G major"
      instrument: "guitar"
    assert:
      - {type: contains, value: "## Theory"}
      - {type: llm-rubric, value: "Gives 3-4 contrasting progressions in G major with Roman numerals and correctly spelled chords (e.g. Em = E G B, C = C E G, Cm = C Eb G if borrowed), guitar shapes as fret numbers (e.g. 320003 for G), and explains functions and the specific device producing the melancholy (such as vi, borrowed iv or a suspended chord)."}
  - name: edge-melody-harmonisation
    vars:
      mood_or_melody: "Melody in 4/4, one bar per group: | C D E F | G G G - | A F C A | G - - - |"
      key: "C major"
      instrument: "piano"
    assert:
      - {type: llm-rubric, value: "Identifies strong-beat notes per bar and chooses chords containing them (e.g. bar 2 G sustained fits C or G or Em; bar 3 starting on A fits F or Am; bar 4 G fits C or G), spells chords correctly, gives piano voicings with register and smooth voice leading, and flags any non-chord tones as passing or tensions."}
  - name: negative-wrong-spelling-trap
    vars:
      mood_or_melody: "Dark and dramatic, film score feel."
      key: "F minor"
      instrument: "piano"
    assert:
      - {type: llm-rubric, value: "Uses flat-key spelling consistent with F minor (Ab, Bb, Db, Eb; e.g. Db major = Db F Ab, C major or C7 as the dominant with E natural from harmonic minor), with no sharps mistakenly used for these notes, and explains the dramatic devices (e.g. bVI, harmonic-minor dominant, Neapolitan)."}
