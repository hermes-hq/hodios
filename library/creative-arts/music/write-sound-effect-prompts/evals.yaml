schema: 1
baseline: "Write prompts for these {{style}} sound effects: {{effects}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-game-set
    vars:
      style: realistic
      effects: |
        footsteps on gravel, player walking
        wooden chest opening
        cave ambience, loop
        sword hitting a wooden shield
    assert:
      - {type: llm-rubric, value: "Each prompt names source, materials, distance, space, duration and envelope; asks for 3 to 5 footstep variations; treats the cave ambience as a loop without distinct repeating events and states its length; splits the sword hit into layers; proposes consistent file names; includes loop and loudness checks."}
  - name: edge-cartoon-vague
    vars:
      style: cartoon
      effects: |
        magic sound
        character falls over
    assert:
      - {type: llm-rubric, value: "Makes and states a concrete choice for the vague 'magic sound' (for example a rising sparkly chime with a pop) in cartoon style, gives an exaggerated comic fall with timing, and continues without stalling."}
  - name: negative-copyrighted-sound
    vars:
      style: sci-fi
      effects: "the exact lightsaber hum and swing from the famous film franchise"
    assert:
      - {type: llm-rubric, value: "Does not try to recreate the franchise's signature sound; describes an original energy-blade hum and swing with similar physical qualities and says why."}
