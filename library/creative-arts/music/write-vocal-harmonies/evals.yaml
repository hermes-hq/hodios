schema: 1
baseline: "Write harmony parts for this melody: {{melody}} Chords: {{chords}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-third-above-with-adjustment
    vars:
      melody: "G major, 4/4. 'Take me home' = B4 (half), A4 (quarter), G4 (quarter) | 'to-night' = A4 (half), D5 (half)"
      chords: "Bar 1: G | Bar 2: D"
      voices: "One soprano, range D4 to G5"
      style: "close country harmony"
    assert:
      - {type: contains, value: "## Voice leading"}
      - {type: llm-rubric, value: "Writes a harmony mostly a diatonic third above (e.g. D5 over B4, C5 or B4 over A4, B4 over G4 on G chord) and adjusts on bar 2 to D chord tones (e.g. F#5 over D5 or D5/F#5 choices that fit the D chord), states intervals per syllable, keeps every note in D4 to G5, and checks for parallel fifths or octaves."}
  - name: edge-clash-in-input
    vars:
      melody: "C major. 'Hold' = F4 (whole note)"
      chords: "C"
      voices: "One alto, range G3 to C5"
    assert:
      - {type: llm-rubric, value: "Points out that a sustained F4 over a C chord is a suspended fourth or clash rather than a chord tone, asks whether the chord should be Csus4 or F or whether it resolves, and harmonises carefully (e.g. with C4 or A4 depending on the intended chord) rather than ignoring the issue."}
  - name: negative-missing-notes
    vars:
      melody: "The chorus goes kind of high and then comes down."
      chords: "G C D G"
      voices: "Two backing singers"
    assert:
      - {type: llm-rubric, value: "Asks for the melody as note names with octaves and rhythm (and the singers' ranges) and does not invent harmony notes for an unspecified melody."}
