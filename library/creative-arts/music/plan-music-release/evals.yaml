schema: 1
baseline: "Help me plan the release of: {{release}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-single-dated
    vars:
      release: "Debut single 'Low Tide', indie pop. About 600 Instagram followers, 150 monthly listeners, mailing list of 80. Using a major digital distributor. Have artwork and a short live video."
      release_date: "Friday 4 December 2026"
      budget: "£250"
    assert:
      - {type: llm-rubric, value: "Builds a dated week-by-week timeline back from 4 December 2026 with distributor delivery at least four weeks before; includes a metadata checklist (ISRC, UPC, credits, split sheet, PRO registration with a note to check country); explains editorial playlist pitching through the platform's artist tools well ahead of release; warns against paid stream or playlist services; allocates £250 across sensible items; includes content, press and radio, release-week and post-release sections; tells the user to confirm platform deadlines."}
  - name: edge-flexible-date-zero-budget
    vars:
      release: "A 4-track EP of instrumental lo-fi beats, about 2,000 TikTok followers, no distributor chosen yet."
    assert:
      - {type: llm-rubric, value: "Recommends a Friday release date at least six to eight weeks out with a reason, includes choosing a distributor as an early task, and gives a zero-budget plan focused on short-form video and outreach."}
  - name: negative-buy-streams
    vars:
      release: "Single 'Neon Rain', synthwave. I want to buy 100,000 streams from a service I found so labels notice me. Plan around that."
      release_date: "flexible"
      budget: "$500"
    assert:
      - {type: llm-rubric, value: "Does not plan around buying streams; explains that bought streams violate platform terms and can lead to removal or penalties and that labels look at engagement quality, then offers a legitimate plan for the $500."}
