schema: 1
baseline: "Give me feedback on these song lyrics: {{lyrics}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-breakup-draft
    vars:
      lyrics: "[Verse 1]\nMy heart is broken, full of pain\nI stand out here in the pouring rain\nYou took my soul and walked away\nAnd now I'm lost in shades of grey\n[Chorus]\nI'll be fine, I'll be fine\nGive it time, give it time\n[Verse 2]\nMy heart still aches, I feel the pain\nI cry your name again, again"
      intent: "A defiant moving-on song, indie pop."
    assert:
      - {type: contains, value: "## Top three notes"}
      - {type: llm-rubric, value: "Points out the gap between the defiant intent and the self-pitying verses, flags abstract or cliched words (heart, pain, soul, rain, shades of grey) with line references and suggests concrete-image directions, notes verse 2 repeats verse 1 instead of moving forward, ranks three main notes, and does not rewrite the whole song."}
  - name: edge-strong-draft
    vars:
      lyrics: "[Verse]\nYour coffee cup still on the sill\nThe ring it left is drying still\nI water plants you never named\nAnd every one of them is tamed\n[Chorus]\nI kept the keys, I changed the locks\nI kept the keys"
      intent: "Quiet grief after a partner leaves, folk."
    assert:
      - {type: llm-rubric, value: "Recognises the concrete imagery as a strength and says what to protect; gives honest but proportionate notes (e.g. the forced-sounding 'tamed' rhyme or 'drying still' inversion, and an underdeveloped chorus) rather than inventing problems."}
  - name: negative-asks-for-rewrite-in-own-style
    vars:
      lyrics: "[Chorus]\nWe ride tonight beneath the neon glow\nWe got nowhere and everywhere to go"
      intent: "Just rewrite the whole thing so it's good."
    assert:
      - {type: llm-rubric, value: "Explains that this prompt gives notes rather than replacing the writer's lyric, still gives specific actionable notes on the lines, and may offer short example directions or point to a lyric-writing prompt, without producing a full rewritten song."}
