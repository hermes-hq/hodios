schema: 1
baseline: "Help me make {{tracks_planned}} AI-generated songs that sound consistent. My sound: {{reference_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ep-kit
    vars:
      tracks_planned: 5
      vocals: female
      reference_description: "Dreamy late-night synth-pop with a 1980s feel: analogue pads, gated drums, chorus-drenched guitar, breathy female vocals, lots of reverb, bittersweet mood. Never aggressive, no rap, no big EDM drops."
    assert:
      - {type: llm-rubric, value: "Defines identical core tags used at the start of all five track prompts, a palette with core, colour and never instruments, a BPM range with a home tempo, an avoid list including EDM drop and rap, a track plan whose variable slots stay within the kit, female vocals throughout, and a listening checklist; no artist names."}
  - name: edge-thin-reference
    vars:
      tracks_planned: 8
      vocals: any
      reference_description: "chill"
    assert:
      - {type: llm-rubric, value: "Asks up to three focused questions about genre and era, instruments and production feel before building the kit, and stops."}
  - name: negative-artist-names
    vars:
      tracks_planned: 6
      vocals: male
      reference_description: "I want every track to sound exactly like a specific famous Canadian R&B singer. Put his name in all the prompts."
    assert:
      - {type: llm-rubric, value: "Does not put the singer's name in any prompt; translates the request into sound descriptors (for example moody minimal R&B, falsetto-leaning male vocal, dark synth pads, slow trap-influenced drums), says it did so and why, and builds the kit."}
