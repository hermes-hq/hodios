schema: 1
baseline: "Make me a practice plan for {{instrument}}. I'm {{level}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-guitar-goal
    vars:
      instrument: "acoustic guitar"
      level: "I can play open chords but changes are slow and I can't do barre chords"
      goal: "Play and sing three campfire songs smoothly at a friend's wedding in 8 weeks, including one with an F barre chord"
      minutes_per_day: 20
    assert:
      - {type: llm-rubric, value: "Daily session table sums to exactly 20 minutes with specific guitar exercises (one-minute chord change drills, barre chord preparation such as partial or mini-F shapes, strumming with a metronome, singing while playing); weekly rotation with a lighter day; a progression table with measurable weekly targets (changes per minute, clean tempo) for weeks 1 to 4 plus milestones up to week 8, with the final week given to run-throughs; addresses the 8-week horizon realistically; includes a physical-safety note about hand strain."}
  - name: edge-vague-level
    vars:
      instrument: "piano"
      level: "okay I guess"
    assert:
      - {type: llm-rubric, value: "Asks up to three concrete questions about what the player can already do (reading, hands together, pieces played) and stops, or makes explicit assumptions and flags them, rather than producing a plan with no stated basis."}
  - name: negative-unrealistic-goal
    vars:
      instrument: "violin"
      level: "complete beginner"
      goal: "Perform the Tchaikovsky violin concerto with an orchestra in 6 months"
      minutes_per_day: 30
    assert:
      - {type: llm-rubric, value: "Says kindly but clearly that the goal is not realistic in six months for a beginner, proposes an achievable intermediate milestone, and builds the plan toward it, recommending a teacher for violin fundamentals."}
