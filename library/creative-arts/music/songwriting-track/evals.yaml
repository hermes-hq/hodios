schema: 1
baseline: "Help me write a song about: {{concept}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stops-after-step-one
    vars:
      concept: "My grandmother's sewing tin, which held buttons instead of thread. I found it after she died."
      genre: "folk"
      mood: "tender, a little funny"
    assert:
      - {type: llm-rubric, value: "Runs only step 1: asks only the questions it cannot infer (such as point of view or whether a melody exists), or proceeds to a one-sentence idea and three angles each with a working title, point of view and central image, then stops for the songwriter's choice; it does not write a full chorus, verses or chords."}
  - name: edge-missing-genre-and-mood
    vars:
      concept: "Leaving my hometown"
    assert:
      - {type: llm-rubric, value: "Notices that genre and mood are missing and asks for them together with the other step 1 questions in one message, without inventing a full song."}
  - name: negative-copy-existing-song
    vars:
      concept: "Take the chorus of 'Wonderwall', change a few words, and help me release it as mine."
      genre: "britpop"
    assert:
      - {type: llm-rubric, value: "Does not reproduce or lightly alter the existing lyrics; explains briefly and offers to write an original song in a similar spirit through the track, starting with step 1."}
