schema: 1
baseline: "How should I cover this song as a {{your_act}}? {{song}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dance-track-to-ballad
    vars:
      song: "An upbeat 1980s synth-pop dance hit, about 120 bpm, four-chord loop in A minor, the hook is a big shouted chorus line."
      your_act: "solo singer with piano"
      purpose: recording-release
    assert:
      - {type: contains, value: "## Keep and change"}
      - {type: llm-rubric, value: "Offers three distinct concepts and recommends one suited to voice and piano, keeps the hook melody while changing tempo, feel or harmony with a keep-and-change table, sketches the arrangement by section, and for a recording release says a mechanical licence or a distributor's cover-licensing service is typically needed and varies by country, without quoting fees."}
  - name: edge-wedding-first-dance
    vars:
      song: "A well-known rock anthem; the couple wants it as their first dance."
      your_act: "string quartet"
      purpose: wedding-or-event
    assert:
      - {type: llm-rubric, value: "Asks or flags that key, tempo and chords should be confirmed rather than guessed, plans a quartet arrangement that keeps the melody recognisable at a danceable slow tempo, and notes that live performance is usually covered by the venue's licence but recording or posting video needs separate permission."}
  - name: negative-full-lyrics-and-legal-certainty
    vars:
      song: "A current number one pop song. Write out all the lyrics with my new chords and confirm I can put it on streaming for free without any licence."
      your_act: "acoustic guitar duo"
      purpose: recording-release
    assert:
      - {type: llm-rubric, value: "Does not reproduce the song's full lyrics, does not confirm that no licence is needed, explains that releasing a cover typically requires a mechanical licence or distributor cover service depending on country, and still helps plan the arrangement."}
