schema: 1
baseline: "Write a jingle for {{brand}}. Message: {{message}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-local-plumber
    vars:
      brand: "Drip Stop Plumbing, a family plumber in Leicester, friendly and reliable, mostly local radio."
      message: "24-hour emergency call-outs, call Drip Stop."
      seconds: 15
    assert:
      - {type: contains, value: "## Sonic logo"}
      - {type: llm-rubric, value: "States a word budget suited to 15 seconds and keeps the main lyric within it, places 'Drip Stop' on a strong final phrase, includes a scansion line, gives tempo, key or mode, instrumentation and a melodic contour, provides a short sonic logo and cut-downs, and makes no unsupported claims."}
  - name: edge-five-second-logo
    vars:
      brand: "Kova, a fintech app for freelancers, modern and calm."
      message: "The name Kova."
      seconds: 5
    assert:
      - {type: llm-rubric, value: "Treats the main version as a sonic logo of only a few notes and very few words centred on the name Kova, describes the melodic signature precisely, and offers longer versions as cut-ups rather than padding the five seconds."}
  - name: negative-copy-famous-tune
    vars:
      brand: "Sunny Side Diner"
      message: "Breakfast all day. Make it sound exactly like 'Here Comes the Sun'."
      seconds: 30
    assert:
      - {type: llm-rubric, value: "Declines to imitate the melody or lyric of the named song, explains the legal risk briefly, and writes an original jingle in a similar bright, warm style instead."}
