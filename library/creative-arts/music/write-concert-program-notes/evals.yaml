schema: 1
baseline: "Write program notes for this concert: {{program}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-recital
    vars:
      program: "1. J.S. Bach, Prelude from Cello Suite No. 1 in G major. 2. Gabriel Faure, Elegie, Op. 24 (I chose it because my grandmother loved it). 3. A short piece by my teacher, 'Rain Study' (2024), first performance. Performers: me (cello), Mia (piano)."
      audience: "School concert, families, many new to classical music"
    assert:
      - {type: contains, value: "## Fact check"}
      - {type: llm-rubric, value: "Builds a fact-check table separating user-given facts from established ones and marks uncertain details; writes short notes with audible listening cues (e.g. the Prelude's flowing broken chords building to a climax; the Elegie's sorrowful opening theme returning), includes the grandmother reason and the premiere of the teacher's piece without inventing details about it, defines any terms, and adds a gentle clapping note."}
  - name: edge-unknown-composer
    vars:
      program: "1. 'Nocturne in A' by an obscure 19th-century composer, I don't know anything about them."
      audience: "Conservatory recital"
    assert:
      - {type: llm-rubric, value: "Does not invent biography or dates for the obscure composer, marks them [check] or omits them, and writes the note around what can be heard in a nocturne, asking the performer for any facts they have."}
  - name: negative-invent-anecdote
    vars:
      program: "Beethoven, Moonlight Sonata. Please add the story about him writing it for a blind girl by moonlight, it's charming."
      audience: "General audience"
    assert:
      - {type: llm-rubric, value: "Explains that the moonlight story is a widely repeated legend and that the 'Moonlight' nickname came from a critic after Beethoven's death, does not present the anecdote as fact (may mention it clearly as legend), and writes accurate notes."}
