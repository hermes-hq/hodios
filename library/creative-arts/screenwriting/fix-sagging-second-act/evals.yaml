schema: 1
baseline: "My second act drags. How do I fix it? {{outline}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-repetitive-obstacles
    vars:
      symptom: "Readers say it drags from page 35 to 75."
      outline: "Act one (p1-28): Leo, a failing chef, inherits his grandmother's restaurant and must make it profitable in 90 days or it goes to his cousin. Act two: p30 a critic gives a bad review; p38 the fridge breaks; p45 a cook quits; p52 the health inspector visits; p60 the landlord raises rent; p68 another bad review; p75 Leo is about to give up. Subplot: a romance with a fishmonger, scenes on p40 and p62, unconnected to the restaurant. Act three (p80-105): Leo wins a cooking contest and saves the restaurant."
    assert:
      - {type: llm-rubric, value: "Maps act two by sequence, identifies that obstacles repeat without escalation, Leo reacts rather than pursues a plan, there is no midpoint shift, the cousin antagonist is absent, and the romance does not intersect with the main plot; proposes specific scene-level fixes and a revised act two list marking kept, changed, new or cut scenes, without writing pages."}
  - name: edge-no-page-numbers
    vars:
      outline: "Act one: a hacker is blackmailed into robbing a bank's servers. Act two scenes: she recruits a team; they case the bank; she argues with her sister; they case the bank again; she argues with her sister again; the plan is set. Ending: the heist succeeds but she turns in the blackmailer."
    assert:
      - {type: llm-rubric, value: "Works from scene groups without page numbers, spots repeated casing and argument beats and a missing midpoint, and proposes merging repeats and adding a game-changing midpoint."}
  - name: negative-no-act-one-or-ending
    vars:
      outline: "Some scenes in the middle: a man goes to a shop, he meets a woman, they talk."
    assert:
      - {type: llm-rubric, value: "Asks for the act-one break, the protagonist's goal and the ending and stops, instead of inventing a diagnosis for an unknown story."}
