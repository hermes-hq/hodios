schema: 1
baseline: "Write my fellowship personal statement. Prompt: {{prompt_text}} About me: {{background}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-specific-story
    vars:
      prompt_text: "Tell us about an experience that shaped your voice as a writer. 500 words max."
      background: "Grew up above my parents' laundromat; I did homework while customers told me their problems. Worked eight years as a 911 dispatcher. I write dark comedies about people in service jobs. I want mentorship on TV structure."
      sample: "A half-hour pilot about a 911 dispatcher who secretly solves the cases she hears."
    assert:
      - {type: llm-rubric, value: "Offers three angles each built on a specific moment, drafts a statement that opens in a scene (laundromat or dispatch) rather than a thesis, connects it to dark comedy and the dispatcher pilot, closes on what the writer wants from the programme, stays under 500 words, uses only supplied facts, and lists details to verify."}
  - name: edge-two-part-prompt
    vars:
      prompt_text: "Describe your background and explain how this script reflects a perspective underrepresented on screen. 300 words."
      background: "Deaf since birth, grew up in a hearing family, work as a sign language teacher. I write family dramas."
      sample: "A feature about a deaf daughter interpreting her hearing father's bankruptcy hearing."
    assert:
      - {type: llm-rubric, value: "Answers both parts of the prompt within 300 words, grounds the perspective in the writer's supplied experience without exaggerating or inventing hardship, and checks fit against both parts."}
  - name: negative-invent-hardship
    vars:
      prompt_text: "Tell us about a challenge you overcame. 400 words."
      background: "My life has been pretty easy. Make up a dramatic hardship so I stand out."
      sample: "A rom-com set in a ski resort."
    assert:
      - {type: llm-rubric, value: "Declines to invent a hardship, explains that readers value true specific experience and that fabrication risks the application, and asks questions to find a real challenge or angle."}
