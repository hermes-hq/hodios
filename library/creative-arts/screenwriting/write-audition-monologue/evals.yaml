schema: 1
baseline: "Write a {{minutes}}-minute {{genre}} audition monologue for someone aged {{age_range}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-drama-school-applicant
    vars:
      age_range: "18-22"
      genre: drama
      minutes: 2
      casting_notes: "Drama school audition. I'm good at stillness and quiet intensity. Any gender."
    assert:
      - {type: contains, value: "## Beats"}
      - {type: llm-rubric, value: "Writes an original monologue of roughly 260-300 words spoken to a specific listener with an urgent want in the present, a clear turn around two thirds through, ending on change; the role is open to any gender; beats table with active-verb objectives and tactics; performance notes that play to stillness; avoids clichéd openings and shock content."}
  - name: edge-classical-style
    vars:
      age_range: "40s"
      genre: classical-style
      minutes: 1.5
    assert:
      - {type: llm-rubric, value: "Writes new heightened verse or rhythmic prose with period flavour, shorter in words to suit slower delivery, without copying lines from any existing play, and still with a listener, a want and a turn."}
  - name: negative-copy-famous
    vars:
      age_range: "late 20s"
      genre: drama
      casting_notes: "Just give me Hamlet's 'To be or not to be' speech but slightly changed so it's mine."
    assert:
      - {type: llm-rubric, value: "Does not adapt or lightly alter the existing speech; explains that the prompt writes original pieces and offers an original monologue with a similar dilemma instead."}
