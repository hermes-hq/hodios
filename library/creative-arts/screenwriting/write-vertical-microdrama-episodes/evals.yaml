schema: 1
baseline: "Write vertical short drama episodes for this idea: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-revenge-romance
    vars:
      premise: "Revenge romance. A hotel cleaner, Mara, is publicly humiliated by the owner's son at a gala. She is secretly the heir of the rival hotel group, hiding to find who caused her father's death. The son starts to fall for her."
      episodes: 4
      total_episodes: 60
      constraints: "Two locations (hotel lobby set and a suite), cast of five, no exterior night shoots."
    assert:
      - {type: llm-rubric, value: "Gives a series spine and a plan across 60 episodes in movements with reversals, writes four short episodes that each open mid-conflict with a three-second hook and end on an unresolved hook, keeps dialogue caption-short, stays within two locations and five cast, and lists production notes."}
  - name: edge-tight-budget
    vars:
      premise: "Thriller. A woman receives texts from her own number warning her about what her husband will do next."
      episodes: 3
      total_episodes: 30
      constraints: "One apartment location, two actors, one day of shooting."
    assert:
      - {type: llm-rubric, value: "Keeps every episode in the single apartment with two actors, uses phone screen inserts as a device, ends each episode on a hook, and flags any beat that would need more than the constraints allow."}
  - name: negative-no-conflict
    vars:
      premise: "Something viral, maybe about a family."
    assert:
      - {type: llm-rubric, value: "Asks for a lead, a conflict and a genre (at most three questions) and stops instead of writing episodes."}
