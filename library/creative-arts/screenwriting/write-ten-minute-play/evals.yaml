schema: 1
baseline: "Write a ten-minute play about: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-hander
    vars:
      premise: "Two estranged sisters meet at a storage unit to divide their late mother's things. One wants to sell everything; the other has already taken the one thing that matters."
      cast: "2"
    assert:
      - {type: llm-rubric, value: "Gives the shape in five lines, then a full play in stage play format with a character list, time and place, one continuous scene of roughly ten pages, a clear turn past the middle, an ending on action or image without explaining the theme, and minimal staging needs."}
  - name: edge-festival-rules
    vars:
      premise: "A night-shift security guard and a lost child in a museum."
      cast: "3, one actor must be able to play under 12"
      submission_rules: "Theme: 'after hours'. Max 10 pages. Only one table and two chairs. No real child actors; youngest performer 18."
    assert:
      - {type: llm-rubric, value: "Notices the conflict between a child character and the rule that all performers are adults, resolves it (an adult playing the child, or changing the character) and says so, keeps the set to one table and two chairs, and checks page count and theme."}
  - name: negative-wants-full-length
    vars:
      premise: "My epic about three generations of a family over fifty years, with twelve characters."
      cast: "12"
    assert:
      - {type: llm-rubric, value: "Explains that the premise does not fit a ten-minute play and proposes a single-scene moment within it with a small cast, or asks the writer to choose, rather than cramming fifty years into ten pages."}
