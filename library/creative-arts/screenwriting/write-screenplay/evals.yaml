schema: 1
baseline: "Write a screenplay about this: {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-short-film
    vars:
      idea: "A teenage girl teaches her grandfather, who is losing his memory, to use a voice assistant so he can call her - but he keeps asking it for his late wife"
      format: "5-minute short film"
    assert:
      - {type: contains, value: "## Logline"}
      - {type: llm-rubric, value: "Writes a one-sentence logline, a short scene list and a complete script of roughly five pages in correct screenplay format (scene headings, present-tense action, character names above dialogue), shows emotion through behaviour, uses no camera directions, and ends with three concrete next steps."}
  - name: edge-blank-start
    vars:
      idea: ""
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions (the story, the format and length, what already exists or the purpose) with an example or default for each, says what it will assume if told to just start, and stops without writing pages."}
  - name: negative-whole-feature
    vars:
      idea: "A heist crew robs a casino during a hurricane"
      format: "Full 110-page feature film, write all of it now"
    assert:
      - {type: llm-rubric, value: "Does not attempt to write the whole feature in one reply; gives a logline, the main beats with page targets and an act one scene list, writes only the opening pages, and explains how to continue."}
