schema: 1
baseline: "Write a film treatment for: {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feature
    vars:
      length: "3 pages"
      story: "Feature, drama-thriller. In 1970s Glasgow, Jean, a cleaner at a shipyard, overhears that management is faking safety reports. Her son works on the dangerous slipway. She gathers evidence at night, is caught, and is offered money to stay quiet. She refuses, the union turns on her, and her son is injured in an accident she predicted. In the end she testifies at the inquiry, the yard is forced to change, but she loses her job and her son's trust until the final scene, when he stands beside her outside the court."
    assert:
      - {type: llm-rubric, value: "Present tense prose with title, logline, tone and world, main characters introduced in capitals with ages, story in three acts with a midpoint turn, and a clearly stated ending including the inquiry and the reconciliation; no camera directions or screenplay format; roughly 1,200 to 1,500 words; lists any choices made."}
  - name: edge-series
    vars:
      length: "5 pages"
      story: "A series. Two rival funeral home families in a small Louisiana town are forced to merge after a hurricane destroys one home. Dark comedy. Season one ends with the matriarch's death and a fight over who buries her."
    assert:
      - {type: llm-rubric, value: "Recognises a series and delivers a series engine, characters with season arcs, the pilot in present tense, the season one arc ending with the matriarch's death and the burial fight, and future seasons, in a darkly comic tone."}
  - name: negative-no-ending
    vars:
      story: "A feature about a chess prodigy who goes missing during a tournament in Reykjavik. I don't want to reveal the ending, keep it mysterious."
    assert:
      - {type: llm-rubric, value: "Explains that treatments for producers must reveal the ending, and asks for the ending (or offers ending options to choose from) rather than writing a treatment that hides it."}
