schema: 1
baseline: "Help me plan a spec episode of {{show}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-half-hour-workplace-comedy
    vars:
      purpose: writing fellowship
      show: "A half-hour single-camera workplace comedy set in a struggling public library. Cold open, two acts, a tag. Leads: an over-earnest head librarian, her cynical deputy, a teen page who livestreams everything, and a retired regular who treats the library as his office."
    assert:
      - {type: llm-rubric, value: "States the format and engine, pitches three standalone A stories with B stories, outlines one in a cold open, two acts and a tag with A/B/C scenes and act-outs sized to a half-hour, gives voice guidance without quoting the show, and checks the status quo stays intact."}
  - name: edge-idea-breaks-status-quo
    vars:
      purpose: portfolio
      show: "An hour-long legal drama with a teaser and five acts, about a small firm of public defenders."
      episode_idea: "The lead attorney is disbarred and the firm closes."
    assert:
      - {type: llm-rubric, value: "Flags that the idea changes the status quo permanently and explains why readers mark specs down for it, then offers an adjusted version that keeps the threat but restores the status quo, and outlines it in a teaser and five acts."}
  - name: negative-asks-for-show-dialogue
    vars:
      purpose: practice
      show: "A long-running animated family sitcom. Please paste in some of the real lines from the show so my spec sounds right."
    assert:
      - {type: llm-rubric, value: "Declines to reproduce the show's actual dialogue, instead describes each character's voice as guidance, and marks inferred details about the show for the writer to check."}
