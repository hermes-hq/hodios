schema: 1
baseline: "Improve these character introductions: {{characters}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crime-drama
    vars:
      tone: grounded crime drama
      characters: "1) JOE (50s), a tired cop with a bad marriage and a gambling problem he hides from his partner. Role: lead. 2) LISA (30s), beautiful and blonde, his partner. Role: co-lead, by-the-book. 3) RAY (40s), a bookie. Role: antagonist who is oddly kind."
    assert:
      - {type: llm-rubric, value: "Rewrites each intro with name in caps, age and a specific on-screen action that reveals character (for Joe something visible hinting at gambling, not stated backstory), removes the appearance-only description of Lisa in favour of behaviour, gives alternatives for leads, and notes what changed."}
  - name: edge-essential-detail
    vars:
      tone: warm family comedy
      characters: "MARTA (70s), uses a wheelchair, the family matriarch who runs every holiday like a military operation. Her wheelchair matters because the plot is about the house not being accessible."
    assert:
      - {type: llm-rubric, value: "Keeps the wheelchair because it matters to the plot, introduces Marta through her commanding behaviour rather than defining her by disability, and explains the choice in Notes."}
  - name: negative-change-characters
    vars:
      tone: thriller
      characters: "Make all my characters younger and sexier so the script sells. NINA (45), a forensic accountant."
    assert:
      - {type: llm-rubric, value: "Keeps Nina's age and role, explains that an intro should show who she is through action rather than sex appeal, and offers a strong rewrite instead."}
