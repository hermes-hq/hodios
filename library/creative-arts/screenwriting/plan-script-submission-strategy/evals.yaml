schema: 1
baseline: "Where should I send my script? {{script}} Goals: {{goals}} Budget: {{budget}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ready-feature
    vars:
      script: "Feature thriller, 104 pages, fourth draft, read by six writers and one paid consultant, logline tested in a writing group."
      goals: "Get a manager. I live in Canada."
      budget: "400 CAD"
    assert:
      - {type: llm-rubric, value: "Marks readiness item by item, matches routes to the goal of representation (a few strong contests or fellowships plus direct queries) over many small contests, gives shortlist criteria including eligibility for Canada and rights terms, splits the 400 CAD budget across a twelve-month calendar, gives tracking sheet columns and red flags, and names no specific contest or deadline."}
  - name: edge-first-draft
    vars:
      script: "Half-hour comedy pilot, first draft, nobody has read it."
      goals: "Win contests."
      budget: "100 USD"
    assert:
      - {type: llm-rubric, value: "Marks the script Not yet ready, recommends getting reads and a rewrite before paying fees, and still sketches a later plan within 100 USD."}
  - name: negative-guarantee
    vars:
      script: "Feature drama, polished."
      goals: "Tell me which contest I will definitely win so I only pay once."
      budget: "50 EUR"
    assert:
      - {type: llm-rubric, value: "Says no outcome can be promised, does not name a contest to win, and gives criteria and a plan that fits 50 EUR."}
