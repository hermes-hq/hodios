schema: 1
baseline: "Add voice-over to these scenes: {{scenes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hindsight-narrator
    vars:
      narrator: "Elena at 70, looking back on the summer she was 12 and her family's restaurant failed. Fond, rueful, funny."
      scenes: "1) Opening: the restaurant on a busy night, 1984. 2) Dad borrows money from a cousin. 3) The family eats leftovers after closing; Dad jokes. 4) The bailiffs arrive. Existing V.O. in scene 2: 'My dad was borrowing money from my cousin.'"
    assert:
      - {type: llm-rubric, value: "States the V.O. job as hindsight and voice with a consistent rule, writes V.O. in the format ELENA (V.O.) that adds irony or perspective rather than describing action, tests every line in a table, and cuts the existing line that only describes what is on screen."}
  - name: edge-unreliable-narrator
    vars:
      narrator: "Mark, during events, who insists he is innocent; the audience slowly realises he is lying."
      scenes: "1) Mark cleans a car at night. 2) Mark talks to police. 3) Mark's sister finds a receipt."
    assert:
      - {type: llm-rubric, value: "Uses a gap between what Mark says and what we see to build unreliability, keeps lines consistent with his point of view, and avoids stating the truth in V.O."}
  - name: negative-explanatory-vo
    vars:
      narrator: "An omniscient narrator."
      scenes: "I want the narrator to explain every scene so viewers don't get confused: 'Now John walks into the bank. He is nervous.'"
    assert:
      - {type: llm-rubric, value: "Pushes back that explanatory V.O. repeating the picture weakens the film, recommends fixing clarity in the scenes instead or using V.O. for a different job, and does not write describe-the-action lines."}
