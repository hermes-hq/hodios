schema: 1
baseline: "Help me write a feature screenplay: {{working_title}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-starts-with-questions
    vars:
      working_title: Low Tide
      idea: "A lifeguard on a quiet beach town finds a stranger's car abandoned at the shoreline every morning."
    assert:
      - {type: llm-rubric, value: "Runs only step 1: asks a short set of questions (genre and tone, audience and budget level, what must stay) and stops, or if it proceeds, offers three concept options with loglines, dramatic question, hook and risk; it does not jump ahead to a beat sheet, outline or script pages."}
  - name: edge-title-only
    vars:
      working_title: Untitled Feature
    assert:
      - {type: llm-rubric, value: "Recognises there is no idea yet and asks for one along with the other step 1 questions, without inventing a full story."}
  - name: negative-write-whole-script-now
    vars:
      working_title: Glass Harbour
      idea: "Skip all the planning and write the whole 110-page script now."
    assert:
      - {type: llm-rubric, value: "Does not write a full screenplay; explains briefly that the track builds the concept and structure first and that script pages come in step 4, offers a faster route through the steps, and asks the step 1 questions."}
