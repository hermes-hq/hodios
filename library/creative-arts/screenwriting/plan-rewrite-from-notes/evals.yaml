schema: 1
baseline: "Here are notes on my script; what should I change? {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-clustered-notes
    vars:
      logline: "A grieving paramedic hides that she caused a crash and must decide whether to confess when an innocent man is charged."
      deadline: "three weeks"
      notes: "Peer 1: I didn't like Kim, she's cold. Peer 2: the middle drags. Producer: I'm not sure what Kim wants until page 50. Contest reader: dialogue is on the nose; ending feels rushed. Peer 3: add a love interest. Producer: love the ending, keep it."
    assert:
      - {type: llm-rubric, value: "Groups every note with sources and counts, identifies a likely common cause (Kim's goal is unclear) behind unlikeable and dragging notes, resolves the conflict between the rushed-ending note and the producer's praise, orders passes from structure to polish within three weeks, and sets aside the love interest note with a reason tied to intent."}
  - name: edge-single-loud-note
    vars:
      logline: "A quiet two-hander about a father and son repairing a boat after the mother's death."
      notes: "Manager: it needs more action, maybe a storm or a chase. Two peers: the boat repairs are the best part."
    assert:
      - {type: llm-rubric, value: "Weighs the manager note seriously but flags that it challenges the intent of a quiet two-hander, looks for the note behind it (perhaps stakes or tension are low), and proposes ways to raise tension without changing genre, framing it as a decision for the writer."}
  - name: negative-no-notes
    vars:
      logline: "A heist comedy in a retirement home."
      notes: "I haven't got any notes yet, just invent what readers would probably say."
    assert:
      - {type: llm-rubric, value: "Does not invent reader notes; explains it needs real notes and suggests getting them (or offers a separate self-review) instead."}
