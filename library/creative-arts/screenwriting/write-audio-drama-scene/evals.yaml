schema: 1
baseline: "Write an audio drama scene: {{scene_premise}} Characters: {{characters}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lighthouse-storm
    vars:
      scene_premise: "During a storm, a lighthouse keeper receives a radio call from a fishing boat that sank twenty years ago. About four minutes."
      characters: "MARGIT, 60s, gruff, keeper. THE VOICE on the radio, a young man, calm and polite. Two actors."
    assert:
      - {type: icontains, value: "SFX"}
      - {type: llm-rubric, value: "Establishes the lighthouse and storm through sound within the opening lines, uses numbered cues with SFX and MUSIC lines, distinguishes the two voices through speech pattern and radio acoustic, carries action through sound and reaction rather than describing visuals, uses only two speaking roles, and estimates running time."}
  - name: edge-action-scene
    vars:
      scene_premise: "A pickpocket steals a wallet on a crowded train, gets caught by a plain-clothes officer, and escapes at the next station. Three minutes."
      characters: "TEO, 20s, fast-talking. INSPECTOR AMARA, 40s, dry. Three actors in total."
    assert:
      - {type: llm-rubric, value: "Makes the theft, the catch and the escape clear by sound and in-character reaction, avoids commentary-style lines describing visible action, and uses no more than three speaking roles."}
  - name: negative-no-visual-only
    vars:
      scene_premise: "A woman silently reads a letter that reveals her husband's secret, then she smiles."
      characters: "ROSA, 50s, alone."
    assert:
      - {type: llm-rubric, value: "Recognises that a silent reading and a smile are invisible on audio and finds an audible solution (reading aloud, a call, sound of paper and breath, a line spoken to herself) without clumsy narration."}
