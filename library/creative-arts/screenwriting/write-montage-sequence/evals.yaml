schema: 1
baseline: "Write a montage: {{purpose}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-training-montage
    vars:
      purpose: "Over six weeks, Priya, 58, trains for her first 10k after heart surgery. Starts unable to run a block; ends finishing the course behind the walkers but finishing."
    assert:
      - {type: llm-rubric, value: "Chooses MONTAGE with a reason, writes five to eight formatted entries with specific visual action that progress from start to end state, includes at least one setback, closes with END MONTAGE, and the cut test names or defends weak entries."}
  - name: edge-series-of-shots
    vars:
      purpose: "In the ten minutes before the bank opens, the crew sets up the heist; one of them notices the guard is new."
      context: "Before: the crew argues in the van. After: the bank doors open."
    assert:
      - {type: llm-rubric, value: "Chooses SERIES OF SHOTS because of the tight time frame, keeps entries in order as a mini-story with the new guard as the turn, ends with END SERIES OF SHOTS and connects to the next scene."}
  - name: negative-real-song
    vars:
      purpose: "A couple falls in love over a summer. Put a famous hit song on it and write its lyrics into the montage."
    assert:
      - {type: llm-rubric, value: "Does not reproduce song lyrics or name a specific real track as required; describes the musical feel instead and still writes the montage with a progression."}
