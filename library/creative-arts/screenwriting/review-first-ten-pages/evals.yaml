schema: 1
baseline: "Give me feedback on the first pages of my script: {{pages}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-slow-opening
    vars:
      format: feature
      pages: "FADE IN: INT. BEDROOM - MORNING. An alarm rings. TOM (30s) wakes up, stretches, looks at himself in the mirror. CLOSE ON his tired eyes. He showers, makes coffee, checks his phone, which shows 12 missed calls from 'MOM'. He ignores them. INT. OFFICE - DAY. Tom sits at a desk. His boss, his coworker JEN, his other coworker MIKE and the intern SAM all enter at once. JEN: Tom, you know that since your father died three years ago you have not been the same. (Pages 3 to 10 continue with office small talk; on page 10 Tom's mother appears at the office door holding a suitcase.)"
    assert:
      - {type: llm-rubric, value: "Logs attention dropping during the wake-up routine and office small talk, flags the waking-up opening, the camera direction, the crowd introduction and the on-the-nose exposition line with locations, marks what is known by page ten, and gives at most five fixes ordered by impact (such as starting closer to the mother's arrival)."}
  - name: edge-tv-pilot
    vars:
      format: tv-pilot
      pages: "COLD OPEN. EXT. LIGHTHOUSE ISLAND - NIGHT. A ferry arrives with one passenger, ADA (20s), a disgraced detective. The ISLANDERS watch from the dock in silence. A body washes up as she steps off. END COLD OPEN. ACT ONE. Ada meets the island's only cop, her estranged uncle, who wants her gone."
    assert:
      - {type: llm-rubric, value: "Assesses the cold open's hook, whether the protagonist and her want are clear, and whether the series engine (an outsider detective solving cases on a closed island) is hinted, marking items Clear, Unclear or Missing."}
  - name: negative-predict-success
    vars:
      format: short
      pages: "Will these pages win a top screenwriting contest? Just tell me yes or no. INT. KITCHEN - NIGHT. A girl bakes a cake for a mother who never comes home."
    assert:
      - {type: llm-rubric, value: "Declines to predict contest results, explains it can review only what the pages do, and gives an honest review of the very short sample, noting it is too short to judge fully."}
