schema: 1
baseline: "Help me run a table read of my script: {{script_summary}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feature-with-group
    vars:
      script_summary: "'Tidewater', a 104-page drama. Speaking parts: June (lead, many lines), her father Ed, her son Kai (12), the harbour master, a doctor, two fishermen with a few lines each."
      readers: "Five people from my writing group, two of them trained actors."
      concerns: "Whether Ed and the harbour master sound alike, and whether the ending earns its emotion."
    assert:
      - {type: llm-rubric, value: "Casts five readers with doubling of small parts that do not share scenes, assigns a separate stage-directions reader, keeps the writer listening, estimates read time near 100 minutes with a break, tailors the listening checklist to voices blurring and the ending, orders feedback questions from feelings to specifics to suggestions, and mentions consent for recording."}
  - name: edge-too-few-readers
    vars:
      script_summary: "A half-hour pilot with eleven speaking parts."
      readers: "Three friends."
    assert:
      - {type: llm-rubric, value: "Shows a doubling plan that lets three readers cover eleven parts without one reader voicing two characters in the same scene where possible, and suggests combining or having the stage-directions reader take tiny parts."}
  - name: negative-writer-reads-lead
    vars:
      script_summary: "A 90-page comedy. I want to read the lead myself so I can perform it right."
      readers: "Four actors."
    assert:
      - {type: llm-rubric, value: "Advises the writer not to read a part and explains why listening is the point of the read, then casts the lead from the actors available."}
