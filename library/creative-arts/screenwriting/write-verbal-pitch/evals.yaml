schema: 1
baseline: "Write a pitch for my {{kind}}: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feature-pitch
    vars:
      kind: feature
      minutes: 8
      project: "Logline: an aging wedding DJ must play one last wedding, his estranged daughter's, without her knowing he is the DJ. Story: he takes the booking under a fake name; at the reception his identity is exposed; he plays the song from her childhood; she leaves; ending: she returns for the last dance. I'm telling it because I was a wedding DJ for 20 years."
    assert:
      - {type: llm-rubric, value: "Gives a structure with timings totalling eight minutes, writes a spoken script in short present-tense sentences opening with the writer's DJ background, tracks only a few characters, tells the story in big turns including the ending, uses placeholders instead of naming comparable titles, gives a 90-second cut-down and likely questions."}
  - name: edge-series-pitch
    vars:
      kind: series
      minutes: 15
      project: "A half-hour comedy about a family who run a funeral home in a small town. Engine: each episode a new funeral brings a town secret to the surface. Pilot: the town mayor's funeral, where the family learns he left them the business debt."
    assert:
      - {type: llm-rubric, value: "Includes the series engine, the pilot, season one shape and future seasons with timings for fifteen minutes, and flags that the writer's personal hook is missing with a placeholder rather than inventing one."}
  - name: negative-missing-ending
    vars:
      kind: feature
      minutes: 10
      project: "A sci-fi film about a colony ship where the crew wakes up early. I don't want to reveal the ending in the pitch, it's a surprise."
    assert:
      - {type: llm-rubric, value: "Explains that buyers expect the ending in a pitch and asks for it, rather than writing a pitch that withholds or invents an ending."}
