schema: 1
baseline: "Develop a TV show idea: {{idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hour-drama
    vars:
      idea: "A disgraced emergency-room doctor becomes the only physician on a remote Scottish island, where everyone knows everyone's secrets and she is hiding hers."
      format: hour
    assert:
      - {type: contains, value: "## Series engine"}
      - {type: contains, value: "## Episode ideas"}
      - {type: llm-rubric, value: "Defines a renewing engine (islanders bringing medical and personal crises, the doctor's secret under pressure), builds an ensemble whose wants collide, arcs season one with a midseason turn and a season-two hook, and pitches episode ideas that each arise from the engine; comparables are real titles with what to borrow."}
  - name: edge-limited-series-ending
    vars:
      idea: "The true-crime-style story of a 1990s lottery syndicate in a Welsh mining town that won and then fell apart."
      format: limited
    assert:
      - {type: llm-rubric, value: "Treats it as a limited series with a defined ending rather than a renewing engine, gives each episode a chapter-like turn, and if the idea is drawn from real events or people, notes consent or life-rights questions without giving legal advice."}
  - name: negative-no-invented-facts
    vars:
      idea: "A half-hour comedy about a failing escape-room business run by three siblings."
      format: half-hour
    assert:
      - {type: llm-rubric, value: "Uses half-hour comedy conventions with mostly standalone episodes, and does not invent ratings, viewer numbers or claims about network deals; comparables named are real, widely known comedies."}
