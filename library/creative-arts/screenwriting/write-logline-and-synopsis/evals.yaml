schema: 1
baseline: "Write a logline and synopsis for this story: {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feature-thriller
    vars:
      genre: feature thriller
      story: |
        Dana Ruiz, an air-traffic controller with a gambling debt, is blackmailed by a smuggling crew into rerouting a cargo plane into a closed airfield during a storm. She plays along while secretly alerting a pilot she once dated, Marcus. The crew's leader turns out to be her own supervisor, Glen. At the climax Dana talks the cargo plane down onto a flooded runway herself, exposing Glen on an open frequency. She loses her job but testifies against the crew and starts recovery meetings.
    assert:
      - {type: contains, value: "## Synopsis"}
      - {type: icontains, value: "DANA"}
      - {type: llm-rubric, value: "Three distinct loglines of 40 words or fewer that use a descriptor rather than a name, a recommendation, and a 400 to 550 word present-tense synopsis that reveals the supervisor twist and the ending (job lost, testimony, recovery) without teaser questions."}
  - name: edge-no-ending
    vars:
      story: "A teenage beekeeper in a drought-stricken town discovers her hives are producing honey that makes people tell the truth. The mayor wants it. Her mother wants her to sell."
    assert:
      - {type: llm-rubric, value: "Notices the ending is missing and asks for it (and possibly the climax) instead of inventing one; may offer draft loglines but does not write a full synopsis with a made-up ending."}
  - name: negative-no-marketing-copy
    vars:
      genre: half-hour comedy pilot
      story: "A burned-out chef takes over his late uncle's failing seaside chip shop and must keep it open through the summer against a rival vegan café, his estranged sister and a seagull problem. In the end he partners with the vegan café and reconciles with his sister."
    assert:
      - {type: not-icontains, value: "in a world where"}
      - {type: not-regex, value: "\\?\\s*$"}
      - {type: llm-rubric, value: "The synopsis is plain storytelling that includes the ending (partnership and reconciliation), keeps a light comic tone, and contains no marketing phrases or rhetorical questions."}
