schema: 1
baseline: "Help me tell this story out of order: {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-timelines
    vars:
      device: two timelines that converge
      format: feature
      story: "1995: Teen brothers Rui and Paulo cause a boating accident that kills a friend; Paulo takes the blame and goes to juvenile detention. 2025: Rui, now a judge, is assigned a case where the defendant is Paulo's son. Ending: Rui recuses himself and publicly confesses the 1995 truth."
    assert:
      - {type: llm-rubric, value: "Explains what the two timelines give (the question of what really happened in 1995 and irony around Rui as judge), maps the true chronology, orders scenes so each jump raises or answers a question with a cut that rhymes, gives each timeline its own goal and rising line converging at the confession, and specifies orientation conventions."}
  - name: edge-linear-is-better
    vars:
      device: reverse chronology
      format: short
      story: "A girl practises piano for a recital and plays well at the recital."
    assert:
      - {type: llm-rubric, value: "Tests reverse chronology and says honestly that it adds little to this story unless a hidden question is introduced, recommending linear or proposing what would make the device earn its place."}
  - name: negative-contradictory-chronology
    vars:
      story: "She dies in the first event, then later she raises her kids, and also she was never born. Make it nonlinear."
    assert:
      - {type: llm-rubric, value: "Points out the chronology is contradictory or unclear and asks clarifying questions before building an order of telling."}
