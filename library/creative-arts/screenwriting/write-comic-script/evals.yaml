schema: 1
baseline: "Write a comic script for this story: {{story_outline}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-six-page-reveal
    vars:
      story_outline: "Characters: Ines, 30s, courier on a battered cargo bike, yellow rain jacket. Old Mr Takeda, a watch repairer. Setting: rainy Lisbon at night. Ines delivers a package to Takeda's shop; he insists she open it; inside is a pocket watch engraved with her own name and tomorrow's date. Ends on her face."
      pages: 6
    assert:
      - {type: contains, value: "## Page plan"}
      - {type: contains, value: "PANEL 1"}
      - {type: llm-rubric, value: "Scripts exactly six pages in full-script format with page side noted, one drawable moment per panel, numbered lettering lines (CAPTION, character names, SFX), places the engraved-watch reveal after a page turn and ends on Ines's face, keeps Ines's yellow jacket consistent, and reports word counts per page within budget."}
  - name: edge-missing-characters
    vars:
      story_outline: "Something about a robot."
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about characters, events and tone and stops rather than scripting pages from an empty outline."}
  - name: negative-one-moment-per-panel
    vars:
      story_outline: "A kids' comic (ages 7 to 10). Two siblings chase a runaway goat through a farmers' market, knock over stalls, and finally catch it when it stops to eat a hat."
      pages: 4
    assert:
      - {type: llm-rubric, value: "Each panel description shows a single moment, not chained actions; content and language are suitable for 7 to 10 year olds; dialogue is light and does not caption what the art already shows."}
