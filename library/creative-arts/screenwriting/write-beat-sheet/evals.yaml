schema: 1
baseline: "Write a beat sheet for this {{format}}: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feature-save-the-cat
    vars:
      format: feature
      structure: auto
      premise: "A disgraced sommelier, Claire, who lost her sense of smell after a car crash, is hired by a dying vineyard owner to identify which of his three children poisoned him. She must solve it before the harvest, and before anyone learns she can no longer smell. Ending: she solves it through memory and observation, admits her loss publicly, and stays to run the vineyard."
    assert:
      - {type: llm-rubric, value: "Uses Save the Cat with page targets scaled to a feature (catalyst around page 12, midpoint around 55, all is lost around 75); every beat names a specific scene with what changes; the A story (the poisoning) and B story (her hidden loss) are distinguished and intersect; structure checks flag or confirm protagonist agency at key beats; no dialogue or screenplay pages."}
  - name: edge-half-hour-tv
    vars:
      format: tv-episode
      structure: auto
      premise: "Half-hour single-camera comedy pilot. A burned-out ER nurse takes a job as the only medic on a luxury cruise ship staffed by misfits. In the pilot, she has to keep a celebrity guest's food poisoning secret while the captain tries to fire her."
    assert:
      - {type: llm-rubric, value: "Uses a cold open plus two or three acts and a tag with page ranges suited to a half-hour episode (roughly 25 to 35 pages), ends acts on a question or reversal, and comments on the series engine for future episodes."}
  - name: negative-missing-protagonist
    vars:
      format: feature
      premise: "A movie about climate change."
    assert:
      - {type: llm-rubric, value: "Asks for a protagonist, a goal and an opposing force (and possibly genre) and stops instead of inventing a whole story and beat sheet."}
