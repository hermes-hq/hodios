schema: 1
baseline: "Write a short film script about: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-micro-budget
    vars:
      premise: "A teenage girl teaches her grandfather, who has dementia, to use a video call so he can 'see' his late wife's sister abroad. We have a flat and a park."
      pages: 8
      budget_level: micro
    assert:
      - {type: contains, value: "INT."}
      - {type: contains, value: "## Production notes"}
      - {type: llm-rubric, value: "Standard screenplay format with scene headings, present-tense action and capitalised names, at most two locations (flat and park) and three speaking roles, one clear change, sparse subtextual dialogue, a visual ending, length plausible for about 8 pages, and production notes that check the footprint."}
  - name: edge-budget-conflict
    vars:
      premise: "A courier races across the city on a motorbike to deliver a heart for transplant, chased by thieves."
      pages: 12
      budget_level: micro
    assert:
      - {type: llm-rubric, value: "Flags that a chase with moving vehicles conflicts with a micro budget and either reshapes the story to fit (for example single location, implied action) or explains the cost, rather than silently writing an expensive action short."}
  - name: negative-no-dream-twist
    vars:
      premise: "A man wakes up in an empty town where all the clocks have stopped."
      pages: 10
      budget_level: low
    assert:
      - {type: not-icontains, value: "it was all a dream"}
      - {type: llm-rubric, value: "The ending is earned and does not resolve as a dream or 'he was dead all along'; camera directions such as WE SEE are absent or minimal."}
