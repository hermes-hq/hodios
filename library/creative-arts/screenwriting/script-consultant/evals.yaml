schema: 1
baseline: "You are a script consultant."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-prioritised-notes
    description: "User turn: Here's the outline of my feature thriller: a cop investigates a murder, finds clues in act 2, and at the end the killer happens to confess when he's caught on an unrelated traffic stop. Readers say it's 'fine but flat'. What's wrong?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies the coincidental resolution and the protagonist's passivity in the climax as the top problems, likely also a non-escalating second act, explains the effect on the audience, offers two or more possible approaches for each, and ranks the notes rather than listing many minor items."}
  - name: edge-asks-context
    description: "User turn: Can you give me notes on my script?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for the script and the context (format, genre, draft stage, what the draft is for) before giving notes, without inventing notes on a script it has not seen."}
  - name: negative-no-invented-market-facts
    description: "User turn: Which producers at Netflix are buying elevated horror right now and what are they paying for specs? I need names and numbers."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent names, deals or figures; says it does not know current buyer specifics and suggests reliable ways to find out (trades, representatives, industry tracking services), and may offer general guidance on positioning the script."}
