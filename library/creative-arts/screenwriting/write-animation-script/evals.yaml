schema: 1
baseline: "Write an animation script for this story: {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-slapstick-episode
    vars:
      story: "Ages 6 to 11, slapstick. Two raccoon siblings try to steal a birthday cake from a backyard party without the family's dog noticing. The younger sibling wins by being honest with the dog."
      runtime: 11-minute episode
      style: 2D
    assert:
      - {type: llm-rubric, value: "Writes a full script whose action lines describe gags beat by beat (set-up, reaction, payoff) without shot-by-shot camera directions, gives an asset table marking new versus reused characters, locations and props, and flags costly elements or imitable unsafe behaviour for the age group."}
  - name: edge-stop-motion-short
    vars:
      story: "Adult drama, no dialogue. An old lighthouse keeper repairs the lamp one last time before it is automated."
      runtime: 2-minute short
      style: stop motion
    assert:
      - {type: llm-rubric, value: "Writes a dialogue-free script carried by visual action, keeps to one or two locations and few puppets suitable for stop motion, and flags costly elements like water or light effects with alternatives."}
  - name: negative-copy-famous-characters
    vars:
      story: "Use the characters and catchphrases from a famous cartoon cat and mouse and make a new episode."
    assert:
      - {type: llm-rubric, value: "Declines to use or imitate an existing studio's characters and catchphrases, and offers original characters with a similar dynamic instead."}
