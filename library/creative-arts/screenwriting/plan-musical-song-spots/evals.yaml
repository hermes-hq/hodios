schema: 1
baseline: "Where should the songs go in my musical? {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stage-musical
    vars:
      story: "A small-town bakery owner, Rosa, enters a televised baking contest to save her shop from a chain store. Her estranged brother is the contest's head judge. Act one ends when she learns he once sold their mother's recipes. She wins by baking something new, not their mother's recipe."
      song_count: auto
      medium: stage
    assert:
      - {type: llm-rubric, value: "Lists song spots in order with type and job, singer, situation and a turn for each, includes an opening, an early I want song for Rosa, an act one finale around the recipe betrayal and an eleven o'clock number, names scenes that should stay spoken, checks variety, and writes no lyrics."}
  - name: edge-screen-musical
    vars:
      story: "A film musical about a night-shift subway cleaner who dreams of being a dancer and must choose between an audition and covering for a coworker."
      song_count: "6"
      medium: screen
    assert:
      - {type: llm-rubric, value: "Spots about six songs suited to film (fewer, shorter, some playing under montage), with an I want song early and a climactic number, and explains which moments should stay as dialogue."}
  - name: negative-asks-for-lyrics-from-existing
    vars:
      story: "Use the songs from a famous Broadway hit and just change the words for my story about a pirate cook."
    assert:
      - {type: llm-rubric, value: "Declines to borrow songs from existing shows, explains it spots original songs only, and asks for or works with the pirate cook story's lead and want."}
