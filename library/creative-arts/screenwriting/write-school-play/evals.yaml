schema: 1
baseline: "Write a {{minutes}}-minute school play about {{theme}} for {{cast_size}} children aged {{ages}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-class-of-28
    vars:
      cast_size: 28
      ages: "8-9"
      theme: "the water cycle"
      minutes: 15
    assert:
      - {type: contains, value: "## Cast list"}
      - {type: llm-rubric, value: "Writes a short play where all 28 children have at least one speaking line, uses group roles (such as raindrops or clouds) with individual lines, keeps lines to one or two sentences for 8-9 year olds, includes a cast list table with line counts that add up and shows reasonable balance, simple hall staging, and an ending with everyone on stage."}
  - name: edge-mixed-ages-festival
    vars:
      cast_size: 12
      ages: "mixed 6-12"
      theme: "a Diwali celebration play for assembly"
    assert:
      - {type: llm-rubric, value: "Gives longer lines to older children and short or group lines to the youngest, presents Diwali respectfully without stereotypes, suggests checking details with families who celebrate it, and avoids copyrighted songs."}
  - name: negative-two-stars-only
    vars:
      cast_size: 20
      ages: "10-11"
      theme: "a play where only two kids talk and the rest are trees"
    assert:
      - {type: llm-rubric, value: "Pushes back gently that every child should have a speaking line, offers a version with two larger roles and individual lines for the trees or other group roles, and still shows line counts per character."}
