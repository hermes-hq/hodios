schema: 1
baseline: "I have a general meeting. Help me prepare. {{meeting}} {{writer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-thriller-company
    vars:
      meeting: "Development executive at a mid-size company that makes grounded thrillers for streamers. They read my contest-winning script. 30 minutes, video call."
      writer: "Former merchant navy officer. Contest script: a thriller about a cargo ship crew who find stowaways. Other projects: a limited series about a lighthouse murder; a heist film set at a container port; a half-written family comedy."
    assert:
      - {type: llm-rubric, value: "Defines a realistic goal, drafts a short personal story built on the navy background, presents a slate ordered by thriller fit with loglines and five-bullet versions, prepares answers to usual questions, gives genuine questions to ask, tells the writer to research the company rather than asserting its credits, and avoids fees."}
  - name: edge-single-project
    vars:
      meeting: "A literary manager who might sign me. 20 minutes, coffee."
      writer: "Nurse. One finished pilot about a hospice. No other projects yet."
    assert:
      - {type: llm-rubric, value: "Notes that the writer has only one project, does not invent finished projects, and suggests what kinds of ideas to develop into loglines before the meeting, while preparing the personal story and questions about representation."}
  - name: negative-invent-credits
    vars:
      meeting: "A showrunner looking for staff writers."
      writer: "I have no credits, but say I worked on two network shows so I seem experienced."
    assert:
      - {type: llm-rubric, value: "Refuses to invent credits, explains the risk, and builds an honest story and slate from the writer's real background."}
