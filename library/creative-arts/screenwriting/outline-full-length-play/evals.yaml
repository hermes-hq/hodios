schema: 1
baseline: "Outline a full-length play: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-act-family-drama
    vars:
      premise: "A retired surgeon with early dementia insists on hosting his daughter's wedding at the family house. His son, a nurse, wants him moved to care. The bride does not know her father has sold the house. Ending: the wedding happens; the father chooses to leave."
      theatre: studio theatre
      max_cast: 5
    assert:
      - {type: llm-rubric, value: "Recommends a structure with the interval placed on a strong question, outlines scenes with place, who is on stage, wants and turn with running times totalling a full-length play, keeps to five actors with a doubling plan if needed, proposes a unit set, and writes no dialogue."}
  - name: edge-screenplay-habits
    vars:
      premise: "A heist across five cities over one night, with car chases and twenty characters."
      theatre: community theatre
      max_cast: 8
    assert:
      - {type: llm-rubric, value: "Flags that many locations, chases and twenty characters fight the stage, proposes a theatrical approach (fewer, longer scenes, doubling, suggested settings) or says the idea may be better on screen, and keeps the cast to eight."}
  - name: negative-no-conflict
    vars:
      premise: "A play about the beauty of nature."
    assert:
      - {type: llm-rubric, value: "Asks for characters and a conflict between them (at most three questions) and stops rather than inventing a full play outline."}
