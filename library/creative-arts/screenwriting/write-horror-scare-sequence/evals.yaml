schema: 1
baseline: "Write a scary scene: {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-supernatural-dread
    vars:
      situation: "Act two. A widow, Ines, has learned the presence in her farmhouse only moves when lights are off. Tonight the power fails while her son sleeps upstairs. The audience saw the presence enter his room earlier; Ines did not."
      subgenre: supernatural
      intensity: no gore
    assert:
      - {type: llm-rubric, value: "Uses the dramatic irony that the audience knows the presence is in the son's room, honours the lights-off rule, builds unease and escalation with sound and light, includes a false release before the real payoff, writes the sequence with short paced action lines, and keeps it gore-free."}
  - name: edge-found-footage
    vars:
      situation: "Found footage. Three friends film inside an abandoned school; only the camera's night vision shows the figure behind them."
      subgenre: found footage
      intensity: "PG-13 feel"
    assert:
      - {type: llm-rubric, value: "Keeps everything motivated by what the in-story camera sees, uses the night-vision as the device for the audience knowing more than the characters, and avoids a cheap fake scare without a real payoff."}
  - name: negative-cheap-jump-scares
    vars:
      situation: "Just give me ten jump scares in a row in a hallway, no story needed."
    assert:
      - {type: llm-rubric, value: "Pushes back that unbuilt, stacked jump scares lose their effect, asks for or proposes the character and threat context, and offers a sequence with build-up instead."}
