schema: 1
baseline: "How do I set up a home photo studio in {{space}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spare-room
    vars:
      space: "Spare bedroom 3.5 m by 3 m, ceiling 2.4 m, white walls, one window, has to be packed away for guests."
      goals_and_budget: "Headshots and half-length portraits for local clients, maybe full-length. About 600 euros. I have a mirrorless with 50mm and 85mm."
    assert:
      - {type: llm-rubric, value: "Does the distance arithmetic, concludes headshots and half-length fit but full-length is tight or does not fit with the 85mm, gives a text layout, recommends one light first with a modifier sized to the room, uses rough euro bands labelled to check, and covers packing away and stand safety."}
  - name: edge-garage-video
    vars:
      space: "Single garage 5 m by 2.8 m, 2.2 m ceiling, grey concrete walls."
      goals_and_budget: "Product photos for my candle shop and talking-head videos. Budget 300 pounds, I have a phone and an old DSLR."
    assert:
      - {type: llm-rubric, value: "Recommends continuous light because of video, addresses the low ceiling and grey walls, and gives a product setup and a talking-head setup within the budget."}
  - name: negative-too-small
    vars:
      space: "A 1.5 m by 2 m box room"
      goals_and_budget: "Full-length fashion portraits of groups of four with a 70-200mm"
    assert:
      - {type: llm-rubric, value: "Shows that the space cannot fit full-length groups with a 70-200mm, says so plainly, and offers realistic alternatives such as headshots, a wider lens or renting a studio."}
