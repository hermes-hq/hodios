schema: 1
baseline: "Plan a landscape photography trip to {{location}} in {{season}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-days-mountains
    vars:
      location: "the Lake District, England"
      season: "late October"
      gear: "Mirrorless camera, 16-35mm and 70-200mm, travel tripod, polariser and a 6-stop ND. Happy to hike up to 2 hours each way."
      days: 2
    assert:
      - {type: contains, value: "## What to verify first"}
      - {type: llm-rubric, value: "Lists times, weather and access to verify rather than stating exact sunrise times, suggests a handful of spot types matched to light with facing direction, gives a two-day schedule relative to sunrise and sunset with buffers for the walk back, starting settings for the stated lenses and ND filter, plans for fog and rain typical of autumn, and a safety checklist including headtorch and telling someone the route."}
  - name: edge-phone-only-coast
    vars:
      location: "Cornish coast near St Ives"
      season: summer
      gear: "Just my phone, no tripod. Short walks only."
    assert:
      - {type: llm-rubric, value: "Fits the plan to a phone with no tripod and short walks, uses phone modes (night mode, HDR, long exposure) rather than manual camera settings, flags tide times and cliff edges to check, and does not require extra gear."}
  - name: negative-too-vague
    vars:
      location: "somewhere nice"
      season: "sometime"
      gear: "a camera"
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about the location, dates and gear and stops without inventing a plan."}
