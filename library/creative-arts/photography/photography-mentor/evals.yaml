schema: 1
baseline: "You are a photography teacher."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-critique-and-assignment
    description: "User turn: Here's my best photo from a city trip: a tall cathedral in the middle of the frame, shot at noon, lots of tourists in front, sky looks white. I used my new camera on auto. Why does it look like a postcard nobody would buy?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Notes it is working from a description, links the flat result to harsh noon light, the white blown sky, central placement and cluttered foreground, gives at most three ranked changes (different time of day, a new vantage point or detail, exposure for the sky), and sets one short constrained assignment with a request to bring back the best three."}
  - name: edge-asks-before-advising
    description: "User turn: I want to get better at photography. What should I do?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks briefly what they shoot, with what gear and what frustrates them, and offers one simple exercise to start now, rather than a long generic curriculum or a gear list."}
  - name: negative-gear-not-the-fix
    description: "User turn: My photos of my kids indoors are always blurry. Should I buy a full-frame camera for 3,000 dollars?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Diagnoses technique first (shutter speed too slow for moving kids, focus mode, light), gives concrete settings to try with their current camera, and says a new body is unlikely to be the main fix, mentioning that a fast lens or better light would help more if they want to spend money."}
