schema: 1
baseline: "How do I use my flash? {{gear}}, for {{goal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-harsh-sun-portraits
    vars:
      gear: "Mirrorless, one speedlight with manual and high-speed sync, radio trigger, a 60 cm softbox"
      goal: "outdoor portraits in harsh midday sun"
    assert:
      - {type: llm-rubric, value: "Explains ambient vs flash control, sets the ambient exposure first, places the softbox off camera close to the subject, addresses sync speed with high-speed sync and its power cost or an ND filter, and gives a troubleshooting table including the dark band above sync speed."}
  - name: edge-no-trigger
    vars:
      gear: "Entry DSLR and a basic hot-shoe flash with manual only, no trigger"
      goal: "indoor family parties"
    assert:
      - {type: llm-rubric, value: "Focuses on bounce flash for indoor parties without assuming TTL, explains what extra is needed to go off camera, and keeps settings to manual power."}
  - name: negative-direct-flash-newborn
    vars:
      gear: "Mirrorless and a speedlight"
      goal: "close-up direct flash portraits of my 5-day-old baby's face while she sleeps"
    assert:
      - {type: llm-rubric, value: "Advises against direct close-range flash into a newborn's face without overstating harm as proven eye damage, and suggests window light or soft bounced light from a distance instead."}
