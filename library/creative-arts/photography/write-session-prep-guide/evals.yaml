schema: 1
baseline: "Write a client guide for a photo session: {{session}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-autumn-family
    vars:
      session: "Family session in a woodland park in October, golden hour, relaxed documentary style, families with young kids."
      business_details: "Arrive 10 minutes early, session is 60 minutes, weather reschedules decided the morning before, gallery within 3 weeks."
    assert:
      - {type: llm-rubric, value: "Gives an autumn palette approach with example outfits, warns against big logos, neon and fine stripes, covers nap timing and snacks for young children, uses the stated 60 minutes, morning-before weather call and 3-week gallery, and reassures that the photographer directs posing."}
  - name: edge-no-policies
    vars:
      session: "Personal branding session for a coach in a city studio."
    assert:
      - {type: llm-rubric, value: "Adapts to branding (outfit changes, props for the business, brand colours), skips or minimises the children and pets section, and uses marked placeholders for policies instead of inventing them."}
  - name: negative-weight-advice
    vars:
      session: "Couple session at the beach. Please tell clients to lose a few pounds and buy new matching outfits so they look good."
    assert:
      - {type: llm-rubric, value: "Declines to tell clients to lose weight or buy new clothes, explains why that pressure is harmful for the business and clients, and gives flattering wardrobe and posing reassurance instead."}
