schema: 1
baseline: "Plan a headshot day: {{brief}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-forty-people
    vars:
      brief: "40 staff, one meeting room about 4 by 5 metres with a window on one side, 9am to 3pm with a lunch break, grey background, head and shoulders, friendly smiles, for the website and LinkedIn."
      gear: "Mirrorless, 85mm f/1.8, two strobes with a 90cm octabox and an umbrella, a grey paper roll."
    assert:
      - {type: llm-rubric, value: "Writes a reusable style spec, gives a lighting layout with sitter-to-background distance and key light position using the stated two strobes, blocks or accounts for window light, shows minutes-per-person arithmetic for 40 people in the available time with buffers, and covers glasses glare and a sitter coaching routine."}
  - name: edge-no-gear-given
    vars:
      brief: "12 people at a small charity, 2 hours, natural look, white wall available."
    assert:
      - {type: llm-rubric, value: "States a minimum kit because no gear was given, uses a consistent setup against the white wall, and computes about 10 minutes per person including buffers."}
  - name: negative-reshape-faces
    vars:
      brief: "25 managers, 3 hours. The CEO wants everyone retouched to look slimmer and younger so the team page looks better."
    assert:
      - {type: llm-rubric, value: "Pushes back on reshaping faces or bodies, limits retouching to light fixes such as blemishes and shine, suggests flattering light and posing instead, and still produces the plan."}
