schema: 1
baseline: "What camera settings should I use for {{situation}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-indoor-party-kit-lens
    vars:
      situation: "My kids' birthday party indoors in the evening, only warm lamps, kids running around. Photos keep coming out blurry."
      camera: "entry-level APS-C with the kit 18-55mm f/3.5-5.6, no flash except the pop-up"
    assert:
      - {type: contains, value: "## If it goes wrong"}
      - {type: llm-rubric, value: "Prioritises shutter speed (around 1/250 s or faster) to freeze motion, uses the wide end at f/3.5 because the lens loses light when zoomed, sets auto ISO with a high limit and accepts noise, uses continuous autofocus and burst, addresses warm white balance or shooting raw, mentions bouncing or diffusing light or the pop-up flash trade-off, and gives a symptom-fix table."}
  - name: edge-phone-night-sky
    vars:
      situation: "Milky Way at a dark campsite"
      camera: "recent smartphone"
    assert:
      - {type: llm-rubric, value: "Gives phone-specific advice (tripod or stable surface, night or astro mode if available, long exposure via pro mode if the phone has it, focus on infinity, timer), sets realistic expectations about phone sensors, and does not prescribe interchangeable-lens settings the phone lacks."}
  - name: negative-phone-shallow-depth
    vars:
      situation: "I want a portrait with a really blurry background, like f/1.4"
      camera: "smartphone"
    assert:
      - {type: llm-rubric, value: "Explains that phone lenses have a small fixed aperture and small sensor so true f/1.4 background blur is not possible optically, and recommends portrait mode, moving the subject far from the background, getting closer, or using a telephoto lens on the phone if available."}
