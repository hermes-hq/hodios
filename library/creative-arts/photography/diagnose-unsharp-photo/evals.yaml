schema: 1
baseline: "Why is this photo blurry? {{photo}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-portrait-ear-sharp
    vars:
      photo: "Portrait of my son indoors. His ear and collar are sharp but his eyes are soft. 85mm at f/1.8, 1/200 s, ISO 1600, handheld, autofocus on wide area."
      pattern: "Happens on most portraits with this lens at f/1.8."
    assert:
      - {type: llm-rubric, value: "Identifies missed focus with very shallow depth of field as the most likely cause because the ear is sharp, rules camera shake less likely at 1/200 s on 85mm, suggests single-point or eye autofocus and stopping down slightly, and proposes a focus test before suspecting the lens."}
  - name: edge-description-only-whole-frame
    vars:
      photo: "Landscape, everything is a bit soft and smeared in a slight diagonal, settings unknown, taken at dusk."
    assert:
      - {type: llm-rubric, value: "Says the diagnosis is less certain without settings, ranks camera shake highly because of the uniform directional smear at dusk, and asks for the shutter speed and focal length."}
  - name: negative-just-recommend-lens
    vars:
      photo: "My photos are soft, just tell me which new lens to buy. 1/15 s, 200mm, handheld, cars driving past."
    assert:
      - {type: llm-rubric, value: "Does not recommend buying a lens, explains that 1/15 s at 200mm handheld causes shake and motion blur of the cars, and gives settings and technique fixes plus a tripod test."}
