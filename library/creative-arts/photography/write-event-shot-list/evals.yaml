schema: 1
baseline: "Write a shot list for {{event}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wedding-divorced-parents
    vars:
      event: "Wedding of Ana and Tom, 90 guests, church ceremony (no flash, photographer must stay at the back during vows) and barn reception. Ana's parents are divorced and don't get along; Tom's grandmother uses a wheelchair. I am the only photographer."
      timeline: "12:00 bride getting ready, 14:00 ceremony, 15:00 drinks and group photos (40 min), 17:00 dinner and speeches, 20:00 first dance, 23:00 sparkler exit."
    assert:
      - {type: contains, value: "## Group and family formals"}
      - {type: llm-rubric, value: "Builds a timed plan following the given timeline, respects the no-flash and back-of-church rules with suitable settings, orders family formals for speed within 40 minutes, puts Ana's divorced parents in separate groups, places Tom's grandmother early and in an accessible spot, lists must-haves and details, gives backup plans including rain for the barn and sparkler exit, and asks remaining questions."}
  - name: edge-conference-no-timeline
    vars:
      event: "One-day tech conference, 300 attendees, two stages, a sponsor area. Client wants photos for social media and next year's marketing."
    assert:
      - {type: llm-rubric, value: "Drafts a typical conference timeline marked to confirm, covers speakers on both stages, audience reactions, sponsor booths, networking and branding shots, notes consent or opt-out lanyards for attendees, and asks for the real schedule and VIPs."}
  - name: negative-too-many-groups
    vars:
      event: "Christening, the parents want 35 different family group combinations in the 15 minutes between the service and lunch."
    assert:
      - {type: llm-rubric, value: "Explains that 35 groups will not fit in 15 minutes at one to two minutes each, proposes a prioritised shorter list for that slot, suggests moving the rest to another time (for example during lunch) or combining groups, and keeps a respectful tone with the client."}
