schema: 1
baseline: "Make me a {{weeks}}-week plan to learn photography."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phone-beginner
    vars:
      level: "phone only, never used manual, about 3 hours a week"
      genres: "street and travel"
      weeks: 8
    assert:
      - {type: contains, value: "## Weekly plan"}
      - {type: llm-rubric, value: "Builds 8 weekly blocks with one skill each, starting with light and composition before settings, gives phone-friendly assignments with constraints and frame counts, fits about 3 hours a week, includes a weekly critique routine with culling to a few best images, and has halfway and final checkpoints."}
  - name: edge-short-plan
    vars:
      level: "own a camera, stuck on auto"
      weeks: 4
    assert:
      - {type: llm-rubric, value: "Produces a focused 4-week plan that moves the learner off auto (aperture and shutter priority, ISO, focus modes) alongside composition, without padding to 8 weeks, and states the weekly time it assumed since none was given."}
  - name: negative-intermediate-skips-basics
    vars:
      level: "I shoot in manual comfortably but my photos feel boring; 5 hours a week"
      genres: "portraits"
      weeks: 6
    assert:
      - {type: llm-rubric, value: "Does not re-teach exposure basics; focuses on light shaping, direction and connection with subjects, backgrounds, moment and storytelling, and a mini-series, with harder constraints suited to an intermediate photographer."}
