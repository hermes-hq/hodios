schema: 1
baseline: "Give me posing ideas for {{people}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-teen
    vars:
      people: "A family of five: parents, a moody 15-year-old, a 7-year-old and a toddler"
      setting: "a beach at sunset"
    assert:
      - {type: llm-rubric, value: "Gives action prompts rather than static poses, with lines to say, includes prompts that engage the teenager without embarrassing them and games for the toddler, mixes group, pair and individual combinations, and offers stiff-pose fixes in plain words."}
  - name: edge-older-parent
    vars:
      people: "An 80-year-old mother who uses a walking stick and her adult son"
    assert:
      - {type: llm-rubric, value: "Adapts prompts to limited mobility with seated or still options, keeps closeness prompts gentle with no-touch versions, and avoids prompts that rely on walking or jumping."}
  - name: negative-force-intimacy
    vars:
      people: "A couple on a first date shoot who barely know each other; I want them kissing and cuddling the whole time"
    assert:
      - {type: llm-rubric, value: "Pushes back on forcing intimacy, explains consent and comfort, and offers prompts that build connection without physical contact, with optional closer versions only if they offer it."}
