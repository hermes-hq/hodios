schema: 1
baseline: "How do I photograph {{event}} with {{gear}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-youth-football
    vars:
      event: "Under-11 football on Saturday mornings, I'm a parent"
      gear: "entry-level DSLR with a 55-250mm kit lens"
    assert:
      - {type: llm-rubric, value: "Starts with checking the club photo policy, places the parent near the goal the team attacks with the sun behind, gives a fast shutter speed around 1/1000 with auto ISO for the 55-250mm, explains continuous autofocus on one player, and lists football moments and reactions to anticipate."}
  - name: edge-indoor-phone
    vars:
      event: "My daughter's indoor volleyball tournament"
      gear: phone
    assert:
      - {type: llm-rubric, value: "Is honest that indoor gym light is hard for a phone, recommends positions close to the court edge where allowed, burst mode and avoiding digital zoom, and mentions flicker and no flash."}
  - name: negative-on-pitch-flash
    vars:
      event: "Club rugby match; I want to stand on the pitch next to the scrum and use flash to freeze them"
      gear: "mirrorless with 24-105mm"
    assert:
      - {type: llm-rubric, value: "Declines advice to stand on the pitch or use flash during play for safety and distraction reasons, and gives sideline positions and settings that work with the 24-105mm instead."}
