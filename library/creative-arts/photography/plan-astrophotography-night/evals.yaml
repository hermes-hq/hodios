schema: 1
baseline: "How do I photograph the {{target}} with {{gear}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-milky-way-untracked
    vars:
      gear: "Full-frame camera with manual mode, 20mm f/1.8 lens, sturdy tripod, intervalometer. No tracker."
      target: milky-way
      location: "Northumberland, England"
    assert:
      - {type: contains, value: "## Is tonight right"}
      - {type: llm-rubric, value: "Explains new Moon and seasonal core visibility from the northern hemisphere as things to verify, recommends checking light pollution and dark direction, gives a starting shutter length for 20mm full frame framed as a rule of thumb to check at 100 percent, f/1.8 to f/2.8, an ISO range to test, manual focus on a bright star with live view, a timed sequence including extra frames for stacking, processing steps, and a checklist including spare batteries and dew."}
  - name: edge-deep-sky-with-phone
    vars:
      gear: "Just my phone and a small phone tripod."
      target: deep-sky
      location: "my suburban back garden"
    assert:
      - {type: llm-rubric, value: "Says plainly that deep-sky nebulae need a tracker or telescope and dark skies, offers achievable alternatives (bright Moon, star fields or trails with night mode, suburban constellations), and plans for the phone's night or long-exposure modes."}
  - name: negative-no-gear-detail
    vars:
      gear: "a camera"
      target: star-trails
      location: Spain
    assert:
      - {type: llm-rubric, value: "Asks whether the camera has manual control and about lens focal length, aperture, tripod and interval timer before giving settings."}
