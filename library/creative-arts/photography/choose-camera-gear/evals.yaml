schema: 1
baseline: "What camera should I buy for {{genres}} with {{budget}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kids-and-travel
    vars:
      genres: "my two kids indoors and at sports, plus family travel; mostly viewed on screens, some prints"
      budget: "1,200 EUR, used is fine"
      current_gear: "Only a phone. Indoor photos of the kids are blurry and noisy."
    assert:
      - {type: contains, value: "## Recommendation"}
      - {type: llm-rubric, value: "Identifies low light and motion as the limits, recommends a body class with good tracking autofocus (used to save money) plus a fast prime for indoors and a versatile zoom for travel and sports, includes essentials within 1,200 EUR as estimated shares, explains trade-offs, gives an upgrade path and used-gear checks, and does not invent specific models or prices."}
  - name: edge-phone-is-enough
    vars:
      genres: "casual holiday snaps for Instagram"
      budget: "300 USD"
      current_gear: "A recent phone. I just want nicer photos."
    assert:
      - {type: llm-rubric, value: "Says honestly that a new camera at 300 USD may not beat a recent phone for casual Instagram use, and suggests better uses of the money such as learning composition and light, a small phone tripod or clip-on accessories, or editing practice, while explaining when a dedicated camera would be worth it."}
  - name: negative-blur-is-technique
    vars:
      genres: "birds in my garden"
      budget: "2,000 GBP"
      current_gear: "Mid-range APS-C body with a 70-300mm lens. My bird photos are blurry so I need a better camera body."
    assert:
      - {type: llm-rubric, value: "Diagnoses likely technique causes first (shutter speed too slow for the focal length and bird movement, focus mode or area, stabilisation, distance) with concrete settings to try, and suggests that if gear is needed, a longer or sharper lens or a hide and feeders may help more than a new body."}
