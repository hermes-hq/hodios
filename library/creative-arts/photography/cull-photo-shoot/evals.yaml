schema: 1
baseline: "Help me pick the best photos from {{shoot}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wedding-client
    vars:
      shoot: "First paid wedding, about 3,800 frames from two cameras, for the couple's online gallery."
      tools: Lightroom Classic
    assert:
      - {type: llm-rubric, value: "Sets a realistic gallery target with a reason, starts with backing up, runs separate reject, pick and final passes at full screen, keeps one per moment with expression first, checks event story coverage, and gives a rating key."}
  - name: edge-holiday-phone
    vars:
      shoot: "Two weeks in Japan, 1,200 phone photos, just for me and the family."
    assert:
      - {type: llm-rubric, value: "Sets a small personal target, adapts the passes to a phone gallery without a desktop app, and handles burst duplicates with one winner each."}
  - name: negative-delete-card
    vars:
      shoot: "Sports day, 900 frames for the school. Should I delete rejects straight off the card as I go to save time?"
    assert:
      - {type: llm-rubric, value: "Advises backing up before any deletion and against deleting from the only copy, and still gives the passes and target for the school."}
