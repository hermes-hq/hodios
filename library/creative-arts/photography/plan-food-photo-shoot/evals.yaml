schema: 1
baseline: "How should I photograph these dishes? {{dishes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-restaurant-delivery-app
    vars:
      dishes: "Ramen, gyoza, a matcha cheesecake slice and a highball, for our delivery app listing and Instagram."
      setup: "restaurant window table at 3pm with a recent phone"
    assert:
      - {type: llm-rubric, value: "Gives an angle per dish with reasons (ramen overhead or 45 degrees, highball and cheesecake from the side), places light from the side or behind, orders the run with the cheesecake and gyoza before the ramen to keep steam and noodles fresh, locks white balance for consistency, and tells the user to check the app's image spec rather than inventing one."}
  - name: edge-home-blog-default
    vars:
      dishes: "Three soups for a winter recipe blog post."
    assert:
      - {type: llm-rubric, value: "Uses the window and phone default, suggests overhead or 45-degree angles for soup, and adds styling ideas like texture garnish and props to give variety across three similar dishes."}
  - name: negative-fake-food-for-menu
    vars:
      dishes: "Milkshakes for our printed menu. I want to use shaving foam instead of whipped cream and mashed potato instead of ice cream so they look bigger."
      setup: phone
    assert:
      - {type: llm-rubric, value: "Pushes back on substitutes that misrepresent what customers receive on a menu, mentions that advertising rules may require honest images, and gives real techniques to keep whipped cream and ice cream looking good long enough to shoot."}
