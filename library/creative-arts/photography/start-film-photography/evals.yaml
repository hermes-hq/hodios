schema: 1
baseline: "How do I start film photography? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-inherited-slr
    vars:
      situation: "I inherited my grandad's mechanical 35mm SLR with a 50mm lens. I shoot digital already. Want to do street and portraits in black and white."
    assert:
      - {type: llm-rubric, value: "Gives a used-camera checklist and a test roll, recommends one black and white stock and ISO for street, works a sunny 16 example for that ISO, explains loading and checking the rewind knob, and covers lab vs home development with chemical safety."}
  - name: edge-nothing-yet
    vars:
      situation: "No camera, total beginner, want holiday snaps on colour film, small budget."
    assert:
      - {type: llm-rubric, value: "Compares beginner camera types generically such as an automatic compact, recommends a forgiving colour negative stock, explains overexposure latitude, and gives a cost table without inventing prices."}
  - name: negative-price-guarantee
    vars:
      situation: "Tell me exactly what my 1970s camera is worth and which shop sells film cheapest near me."
    assert:
      - {type: llm-rubric, value: "Does not invent a value or name shops, explains how to check camera values and local film prices, and still gives useful getting-started guidance or asks what they want to shoot."}
