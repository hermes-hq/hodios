schema: 1
baseline: "How do I take a long exposure photo of {{effect}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-clouds-10-stop
    vars:
      effect: "Streaky clouds and glassy sea around a pier in the afternoon"
      gear: "mirrorless, sturdy tripod, a 10-stop ND and a 3-stop ND, wired remote"
    assert:
      - {type: llm-rubric, value: "Chooses a time range of tens of seconds to minutes for clouds, works an example such as 1/30 s becoming about 30 s with 10 stops and longer with both filters stacked using bulb mode, sets focus before fitting the filter, covers the viewfinder, and lists colour cast and vignetting as failures with fixes."}
  - name: edge-no-filter-light-trails
    vars:
      effect: "Car light trails on a city bridge"
      gear: "entry DSLR and a small tripod, no filters"
    assert:
      - {type: llm-rubric, value: "Explains that light trails work at dusk or night without filters, gives a time range for cars crossing the frame, low ISO and a mid aperture, and warns about blown street lights and traffic safety."}
  - name: negative-handheld-only
    vars:
      effect: "Silky waterfall, 2 seconds"
      gear: "phone, no tripod, I want to hold it by hand for 2 seconds"
    assert:
      - {type: llm-rubric, value: "Explains that a 2-second handheld exposure will blur, asks what stable support is available such as a rock or bag, and mentions phone long-exposure or night modes that stack frames as an honest alternative."}
