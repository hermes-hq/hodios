schema: 1
baseline: "Help me make a photo book: {{photos_overview}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-year
    vars:
      photos_overview: "About 4,000 phone photos from 2025: the baby's first year, a beach holiday in Spain, a camping trip, both kids' birthdays, Christmas, and lots of everyday stuff. For our family and the grandparents. Needed by mid-December."
      period: "2025"
      pages: 40
    assert:
      - {type: contains, value: "## Page plan"}
      - {type: llm-rubric, value: "Gives a staged selection funnel down to roughly 60 to 120 photos with time estimates, chapters adding up to 40 pages, a spread-by-spread plan with varied layouts and strong chapter openers, a caption style with examples using placeholders rather than invented facts, print checks including resolution at print size, and a timeline counting back from mid-December with production and shipping margin."}
  - name: edge-grandparent-life
    vars:
      photos_overview: "Scanned prints and slides of Grandma from the 1940s to now, about 300 images, plus recent phone photos. For her 90th birthday party."
      period: "Grandma's 90 years"
      pages: 24
    assert:
      - {type: llm-rubric, value: "Organises chapters by life stages within 24 pages, advises on scan quality and resolution for old prints, suggests gathering memories from relatives for captions, does not invent dates or stories, and fits a timeline to the birthday."}
  - name: negative-low-res-big-print
    vars:
      photos_overview: "Mostly photos people sent me on WhatsApp from our wedding; I want every one printed full-page in a large lay-flat book."
      pages: 30
    assert:
      - {type: llm-rubric, value: "Warns that messaging-app copies are compressed and often too low resolution for full-page large prints, recommends asking guests for the original files, and suggests keeping low-resolution images small in grids if originals are unavailable."}
