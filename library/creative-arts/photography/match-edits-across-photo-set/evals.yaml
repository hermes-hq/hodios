schema: 1
baseline: "How do I make my photos look consistent? {{set}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wedding-mixed-light
    vars:
      set: "Wedding gallery of 500 images: church with tungsten and window light, outdoor shade portraits, sunset couple shots, and a reception with DJ lights. I want warm, soft, slightly faded."
      app: Lightroom Classic
    assert:
      - {type: llm-rubric, value: "Translates the warm faded look into concrete targets, keeps white balance and exposure out of the shared preset, groups by lighting scene with a reference image each, syncs within groups, checks skin tones side by side across scenes including DJ light colour casts, and ends with a grid consistency check."}
  - name: edge-phone-feed
    vars:
      set: "Instagram grid for my bakery, 30 photos from different times of day."
      app: "a phone editor"
    assert:
      - {type: llm-rubric, value: "Adapts to a phone editor by copying and pasting edits or saved looks, matches warmth and brightness by time of day, keeps product colours accurate, and reviews the grid as a whole."}
  - name: negative-one-preset-fixes-all
    vars:
      set: "Travel series from snow, desert and night markets. I just want one preset I can click on all 200 and be done."
      app: Lightroom mobile
    assert:
      - {type: llm-rubric, value: "Explains honestly that one preset alone will not match photos from such different light, and gives a short scene-by-scene correction step before applying the shared look."}
