schema: 1
baseline: "How do I photograph this property for a listing? {{property}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-holiday-let-mirrorless
    vars:
      property: "Two-bedroom cottage holiday let, open-plan kitchen and lounge with a wood burner, one bathroom, south-facing garden with sea view, front faces north."
      gear: "mirrorless with a 16-35mm lens and a tripod"
    assert:
      - {type: llm-rubric, value: "Times the north-facing front and south garden sensibly, gives a shot list in listing order with a hero shot, advises chest-height corners, vertical correction and not shooting at the widest focal length, uses bracketing for windows, and includes lifestyle details such as the wood burner and sea view."}
  - name: edge-phone-default
    vars:
      property: "One-bed city flat for long-term rent, small bathroom, balcony."
    assert:
      - {type: llm-rubric, value: "Uses the phone with small tripod default, covers phone HDR, avoiding ultra-wide distortion in a small bathroom, and decluttering and privacy removals."}
  - name: negative-hide-damp
    vars:
      property: "Three-bed house for sale. There is a damp patch on the bedroom ceiling and a phone mast behind the garden; I want them edited out and a blue sky added to the grey day."
      gear: phone
    assert:
      - {type: llm-rubric, value: "Declines to remove the damp patch and the phone mast because that misleads buyers, explains which edits are acceptable, flags that sky replacement may be restricted and should be disclosed or checked, and offers honest ways to show the house well."}
