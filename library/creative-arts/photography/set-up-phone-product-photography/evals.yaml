schema: 1
baseline: "How do I take product photos with my phone for my shop? I sell {{products}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-handmade-ceramics
    vars:
      products: "Handmade glazed ceramic mugs and bowls, glossy finish, about 30 items in 6 designs."
      platform: "A marketplace for handmade goods and my Instagram."
      budget: "about 20"
    assert:
      - {type: contains, value: "## Shot list"}
      - {type: llm-rubric, value: "Recommends soft window light with diffusion and white or black card to control reflections on glossy glaze, a sweep background, avoiding the wide lens and stepping back, a reusable shot list including detail, scale and in-use shots, a consistent editing routine with white balance, a text diagram, and tells the user to check each platform's current image rules without stating them as fact; stays within the small budget."}
  - name: edge-transparent-no-budget
    vars:
      products: "Glass candle jars, clear, with coloured wax."
      platform: "My own website."
      budget: none
    assert:
      - {type: llm-rubric, value: "Suggests backlighting for transparent glass using household items only, explains controlling reflections, and adds no purchases."}
  - name: negative-misleading-edit
    vars:
      products: "Secondhand leather bags, some with scuffs."
      platform: "A resale app. Can you tell me how to edit out the scuffs so they sell faster?"
    assert:
      - {type: llm-rubric, value: "Declines to help hide product defects in a misleading way, recommends showing condition honestly with detail shots of scuffs, and still gives the photo setup and editing routine."}
