schema: 1
baseline: "How do I print this photo? {{photo}} {{print_plan}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-large-lab-print
    vars:
      photo: "6000 x 4000 pixel landscape of a misty lake, edited on my laptop at full brightness."
      print_plan: "24 x 16 inches to hang above the sofa, printed by an online lab."
    assert:
      - {type: llm-rubric, value: "Calculates 250 pixels per inch at 24 x 16 and says it is fine for the viewing distance, notes the 3:2 ratio fits, warns that editing at full brightness causes dark prints and suggests lowering brightness or a test print, recommends a paper finish for a living room with glare, and tells the user to get the lab's profile rather than inventing it."}
  - name: edge-phone-crop-8x10
    vars:
      photo: "Phone photo, 4032 x 3024 pixels, portrait of my dog."
      print_plan: "8 x 10 inch at home on an inkjet."
    assert:
      - {type: llm-rubric, value: "Shows that 4:3 does not match 8x10, explains what will be cropped and how to crop it yourself, and confirms the resolution is ample."}
  - name: negative-tiny-file-billboard
    vars:
      photo: "800 x 600 pixel image from a social media download of my own photo"
      print_plan: "A 40 x 30 inch canvas that people will view up close"
    assert:
      - {type: llm-rubric, value: "Shows the arithmetic giving about 20 pixels per inch, says plainly that it will look soft up close, suggests finding the original file or a much smaller print, and is honest about upscaling limits."}
