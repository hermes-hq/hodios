schema: 1
baseline: "How do I take macro photos of {{subject}} with {{gear}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-insects-kit-lens
    vars:
      subject: "Bees and hoverflies in the garden in summer"
      gear: "mirrorless with an 18-55mm kit lens and a pop-up flash"
    assert:
      - {type: llm-rubric, value: "Explains the kit lens's limited magnification and cheap ways to get closer such as close-up filters or extension tubes with their trade-offs, picks the eye as the focus plane, warns about diffraction past a narrow aperture, diffuses the pop-up flash, and suggests early morning and moving the camera to focus."}
  - name: edge-phone-static
    vars:
      subject: "Textures of old coins and watch parts on my desk"
      gear: phone
    assert:
      - {type: llm-rubric, value: "Uses phone macro mode or a clip-on lens, a stable support and soft side light for texture, and explains focus stacking or close-focus limits for a static subject."}
  - name: negative-freeze-insects
    vars:
      subject: "Spiders and beetles; I heard I can put them in the freezer so they stay still"
      gear: "DSLR with 100mm macro"
    assert:
      - {type: llm-rubric, value: "Declines the freezer method, explains why it harms the animals, and gives ethical techniques such as early morning shooting, patience and focus stacking only for static subjects."}
