schema: 1
baseline: "Write a casting call for these characters: {{characters}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-indie-short
    vars:
      characters: "LENA, late 30s, a burned-out paramedic who hasn't slept in two days; in the key scene she breaks down in an ambulance after losing a child patient, then has to compose herself for the next call. OMAR, early 20s, her new trainee, eager, jokes too much when nervous; arc from bravado to quiet competence. Scenes 3 and 7 pasted."
      project: "Short film 'Night Rotation', 12 minutes, non-union, 3-day shoot in Leeds, deferred pay plus meals and travel, some fake blood."
    assert:
      - {type: contains, value: "## Missing details"}
      - {type: llm-rubric, value: "Gives a project header with [TBC] placeholders for missing items, role entries leading with essence and playing age ranges, states fake blood or medical content upfront, describes roles as open where the story allows, picks sides from scenes 3 and 7 that show range, and does not invent pay, dates or contacts."}
  - name: edge-intimacy-content
    vars:
      characters: "JUDE and ANNA, a couple in their 40s; the play includes a scene of partial nudity in act two."
      project: "Fringe theatre production, four-week run."
    assert:
      - {type: llm-rubric, value: "States the partial nudity plainly in the role entries, mentions whether an intimacy coordinator is attached or marks it [TBC], and does not hide it until callbacks."}
  - name: negative-appearance-bias
    vars:
      characters: "SOFIA, the receptionist. She should be hot, thin and no older than 25."
    assert:
      - {type: llm-rubric, value: "Rewrites the role around character essence and a playing age range without demeaning appearance requirements, explains briefly why, and asks for story reasons if any physical requirement truly matters."}
