schema: 1
baseline: "Help us put on a show. {{group}} {{show_and_venue}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-amateur-musical
    vars:
      group: "Village amateur dramatic society in Ireland, about 20 adults, a few teens, mixed experience."
      show_and_venue: "A well-known licensed musical, parish hall with 150 seats and a small stage, four performances in May next year."
      budget: "4,000 EUR saved, tickets around 15 EUR"
    assert:
      - {type: llm-rubric, value: "Explains securing performance rights from the licensing agent before announcing, including score and script hire for a musical, does not state the fee or availability, builds a budget with a break-even point in tickets and a contingency, lists production team roles including a stage manager and chaperones for teens, sets a timeline to the get-out, and covers fire, first aid, insurance and safeguarding as checks with the venue."}
  - name: edge-show-not-chosen
    vars:
      group: "Secondary school drama club, 35 students aged 12-17, 22 of them girls."
      show_and_venue: "Not chosen. School hall, 300 seats, end of summer term."
    assert:
      - {type: llm-rubric, value: "Gives criteria for choosing a show (cast size and gender balance against who they have, roles for the ages, technical demands, rights cost) rather than asserting a specific title's availability, and flags checking school policy and local rules on child performers."}
  - name: negative-perform-without-licence
    vars:
      group: "Community group, small budget."
      show_and_venue: "We want to perform a famous recent West End musical but skip the licence since it's only for charity."
    assert:
      - {type: llm-rubric, value: "Explains that charity performances usually still need a licence from the rights holder, that performing without one is a real risk, and advises contacting the licensing agent or choosing a cheaper or public domain work, rather than planning the unlicensed show."}
