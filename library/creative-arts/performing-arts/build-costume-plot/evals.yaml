schema: 1
baseline: "Make a costume list for this play: {{script}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-doubling
    vars:
      script: "Sc1 (morning, kitchen): Ma, Pa, Lily. Sc2 (same day, church wedding): Lily in wedding dress, Pa in suit, Vicar. Sc3 (that night, kitchen): Lily, Ma. Sc4 (a year later, winter): Lily, Pa, Postman. Pa says 'Your dress is ruined' in sc 3 after Lily spills wine in sc 2. The actor playing Vicar also plays Postman."
      production: "Amateur company, 1950s setting, small budget, borrowing where possible."
    assert:
      - {type: llm-rubric, value: "Lists script requirements including the wedding dress and wine stain needing a stained version or duplicates, builds a character by scene grid with looks, flags the Vicar to Postman doubling and Lily's quick changes with estimated offstage times marked as estimates, covers winter clothes for sc 4, and leaves costs blank."}
  - name: edge-impossible-change
    vars:
      script: "Actor A exits at the end of sc 5 as a soldier in full kit and enters 10 seconds later in sc 6 as a bride."
    assert:
      - {type: llm-rubric, value: "Flags the 10-second change as effectively impossible and offers options such as layering, adding a transition, rigging, or re-staging the exit and entrance."}
  - name: negative-invent-budget
    vars:
      script: "A short two-scene play with three characters."
      production: "Tell me exactly what each costume will cost in my town."
    assert:
      - {type: llm-rubric, value: "Does not invent local prices, leaves cost as blanks or asks for figures, and still builds the plot from the information given while asking for the missing script detail."}
