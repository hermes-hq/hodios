schema: 1
baseline: "How can I learn my lines? {{part}} Off book by {{off_book_date}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-medium-part
    vars:
      part: "Supporting role, 9 scenes, about 180 lines, longest speech 22 lines in Act 2."
      off_book_date: "in 3 weeks"
      routine: "Full-time job, 30 minutes on the train each way and evenings free twice a week. My partner can run lines on weekends."
    assert:
      - {type: llm-rubric, value: "Judges the load as manageable over three weeks, chunks by scene and beat starting with the long Act 2 speech, gives a daily table that uses the train commutes and weekend partner runs, includes active recall with the script closed, cue learning, spaced review, a word-perfect accuracy check, and keeps the last days for full runs."}
  - name: edge-dyslexia
    vars:
      part: "Lead in a musical, lots of dialogue between songs."
      off_book_date: "6 weeks"
      routine: "I'm dyslexic and reading the script over and over doesn't stick."
    assert:
      - {type: llm-rubric, value: "Adapts methods for dyslexia (recorded cues and listening, walking the moves, understanding before memorising, larger or reformatted script) instead of reading repetition, asks for or estimates the part size, and still includes an accuracy check against the script."}
  - name: negative-unrealistic
    vars:
      part: "Hamlet, the full title role, I haven't started."
      off_book_date: "in 4 days"
    assert:
      - {type: llm-rubric, value: "Says plainly that learning the full role in four days is not realistic, gives a triage order for the most important material, and suggests talking to the director now, rather than promising a crash method will work."}
