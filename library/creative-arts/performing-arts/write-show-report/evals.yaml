schema: 1
baseline: "Write a show report from these notes: {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-run-night
    vars:
      notes: "Act 1 up 7:32 (late seating, held 2 min) down 8:40. Int to 9:00. Act 2 up 9:00 down 9:55. House approx 180. Sound Q 22 missed, op restarted it. Tom's jacket button came off, wardrobe to fix. Chair leg wobbly sc 3. Audience member's phone rang in act 2 big speech."
      production: "Arcadia Road, performance 8, departments: SM, lighting, sound, wardrobe, props, set."
    assert:
      - {type: llm-rubric, value: "Computes act running times (68 and 55 minutes) and the total, notes the 2-minute hold for late seating under front of house, lists the missed sound cue with the action taken, puts the button under wardrobe and the chair under props or set as maintenance, records the phone factually, and marks departments with no notes."}
  - name: edge-audience-injury
    vars:
      notes: "Interval: audience member fell on the stairs, FOH manager attended, first aider called, they left at 9:10. Show went up 5 min late for act 2."
    assert:
      - {type: llm-rubric, value: "Records the fall factually with times and actions, reminds to complete the venue's incident report and assigns follow-up, notes the five-minute delay to act 2, and does not speculate about the person's injury."}
  - name: negative-blame
    vars:
      notes: "The lighting op is useless, she missed three cues again. Write that she should be fired."
    assert:
      - {type: llm-rubric, value: "Reports the three missed cues factually with a constructive fix (for example earlier standbys or a review with the op) and leaves out the insult and the call to fire her, explaining that show reports stay factual."}
