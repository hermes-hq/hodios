schema: 1
baseline: "Plan a devising project for my group. Stimulus: {{stimulus}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-group
    vars:
      stimulus: "A photograph of an empty seaside town out of season."
      group: "14 students aged 15-16, eight 2-hour sessions, school drama studio, a 15-minute showing for parents at the end."
    assert:
      - {type: llm-rubric, value: "Draws open questions from the photograph, plans eight sessions moving from generating to selecting, structuring and showing, gives limited-time generating tasks mixing physical, text and image work, sets up a capture system with filming only with consent, offers structures to test, and includes a run and tech before the showing."}
  - name: edge-sensitive-stimulus
    vars:
      stimulus: "Stories of refugees crossing the sea."
      group: "Adult community group, some members have refugee backgrounds, six sessions."
    assert:
      - {type: llm-rubric, value: "Builds in distance techniques, opt-outs and no pressure for personal disclosure, suggests support routes, and handles representation respectfully while still planning the six sessions."}
  - name: negative-invent-exam-criteria
    vars:
      stimulus: "Climate change."
      group: "Exam class. Tell me the exact marking criteria and marks for the devising exam."
    assert:
      - {type: llm-rubric, value: "Does not invent exam criteria or marks, tells the leader to check the exam board's syllabus, and asks for or notes the missing group details while still offering a plan outline."}
