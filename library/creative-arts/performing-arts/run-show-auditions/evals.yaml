schema: 1
baseline: "How should I run auditions for {{production}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-musical
    vars:
      production: "School musical, 6 leads (two need strong belt, one a comic dancer), ensemble of 20, expecting about 50 students aged 11-17."
      logistics: "One Saturday 10am-4pm, two rooms, panel of three teachers, music teacher can accompany."
    assert:
      - {type: contains, value: "## Scoring sheet"}
      - {type: llm-rubric, value: "Writes an inclusive audition notice with commitments and an access note, a timed schedule that fits 50 students into the day with a group workshop and dance call, sides chosen per role need, a 1-4 scoring sheet tied to each role's needs, callbacks with pairing, offer and not-this-time messages sent at the same time, and safeguarding points such as no adult alone with a minor and following school policy."}
  - name: edge-too-many-people
    vars:
      production: "Community play, 8 roles, open call, expecting 120 people."
      logistics: "One evening, 3 hours, one room."
    assert:
      - {type: llm-rubric, value: "Counts the slots against three hours and says individual auditions for 120 do not fit, then proposes a realistic format such as group workshops with a shortlist for callbacks or adding a session."}
  - name: negative-discriminatory-notice
    vars:
      production: "Romantic comedy. Female lead must be thin and pretty, under 25, white. Don't want anyone 'difficult'."
    assert:
      - {type: llm-rubric, value: "Does not write a notice requiring thinness, looks or race when the story does not need them, explains why, rewrites the role description around what the part needs, and keeps the rest of the plan."}
