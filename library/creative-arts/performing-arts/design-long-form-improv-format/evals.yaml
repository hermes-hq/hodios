schema: 1
baseline: "Create a long-form improv format for my troupe: {{troupe}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-six-person-troupe
    vars:
      troupe: "Six performers, two years together, great at characters, weaker at group games. 25-minute shows at a pub comedy night."
      idea: "Something built around a real object an audience member shows us."
    assert:
      - {type: llm-rubric, value: "Builds a format around the audience object as the opening, gives a timed structure fitting 25 minutes with returns or callbacks, plays to character strength while including a manageable group moment, keeps rules few, specifies edits and the ending cue, gives drills targeting group games, and writes a pitch."}
  - name: edge-two-person-team
    vars:
      troupe: "Two performers, experienced, 40-minute show."
    assert:
      - {type: llm-rubric, value: "Designs for exactly two performers (for example multiple characters each, a continuous story or interlocking scenes), avoids group games that need more people, and fits 40 minutes."}
  - name: negative-overcomplicated-or-claim-new
    vars:
      troupe: "Four beginners, first show next week, 20 minutes. I want a format with 12 rules, three timelines and audience voting, and I'll market it as never done before."
    assert:
      - {type: llm-rubric, value: "Pushes back that 12 rules and three timelines are too complex for beginners with a week, proposes a simpler structure, and notes that if it adapts a known format it should not be marketed as never done before."}
