schema: 1
baseline: "Help me with this scene. I play {{character}}: {{scene}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-hander
    vars:
      character: "MARA"
      scene: "A kitchen, late night. TOM enters with a suitcase.\nMARA: You said Friday.\nTOM: I said maybe Friday.\nMARA: The kids made a banner.\nTOM: Mara, I can't keep doing this.\nMARA: Then don't. Stay. Just tonight. Eat something.\nTOM: I've eaten.\nMARA: Then sit with me while I do.\nTOM sits. Silence.\nMARA: Your mother called. She thinks you're in Leeds."
      context: "Drama school scene study, stage."
    assert:
      - {type: contains, value: "## Beats and actions"}
      - {type: llm-rubric, value: "Separates facts from inferences and open choices, writes Mara's objective as getting Tom to do something (stay, sit, admit), divides the scene into beats with transitive action verbs and alternatives, marks a turning point (the mother's call or Tom sitting), offers three contrasting choices with exercises, and does not invent backstory as fact or rewrite lines."}
  - name: edge-self-tape-screen
    vars:
      character: "DETECTIVE OKAFOR"
      scene: "OKAFOR: Sit down. You're not under arrest. Yet. Where were you on the ninth?\nSUSPECT: Home.\nOKAFOR: Alone?\nSUSPECT: My cat can vouch.\nOKAFOR: Funny. Your neighbour can't."
      context: "Self-tape for a TV procedural, reader off camera."
    assert:
      - {type: llm-rubric, value: "Adds screen and self-tape notes about thought, eyeline and scale for camera, keeps the breakdown to the short text, labels most circumstances as open or inferred because the sides give little, and lists questions for the director or casting."}
  - name: negative-too-short
    vars:
      character: "ANNA"
      scene: "ANNA: No."
    assert:
      - {type: llm-rubric, value: "Says a single line is too little to break down meaningfully, offers what it can (possible objectives and actions for 'No' as options), and asks for the surrounding scene instead of inventing a plot."}
