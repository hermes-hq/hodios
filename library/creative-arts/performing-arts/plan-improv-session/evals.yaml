schema: 1
baseline: "Plan a {{minutes}}-minute improv session for {{group}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nervous-engineers
    vars:
      group: "8 software engineers at a team offsite; most are nervous about performing; goal is trust and fun."
      minutes: 60
    assert:
      - {type: contains, value: "## Run sheet"}
      - {type: llm-rubric, value: "Sets a trust-and-fun goal, starts with everyone-at-once warm-ups and avoids solo performing early, sequences games toward light scene work, gives setup, side-coaching lines, variations and timings per activity, includes opt-out and consent rules, and timings sum to about 60 minutes."}
  - name: edge-troupe-long-form
    vars:
      group: "A performing troupe of 6 experienced improvisers rehearsing long-form, struggling to find the game of the scene."
      minutes: 90
    assert:
      - {type: llm-rubric, value: "Pitches the session at experienced performers with a goal around finding and heightening the game, uses scene-work exercises with specific coaching notes rather than icebreakers, and fits 90 minutes."}
  - name: negative-no-group-info
    vars:
      group: "some people"
    assert:
      - {type: llm-rubric, value: "Asks for the group's size and experience level (and ideally purpose) before planning the session."}
