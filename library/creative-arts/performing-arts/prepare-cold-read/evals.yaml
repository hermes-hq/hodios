schema: 1
baseline: "Help me prepare to read this scene: {{sides}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-hander
    vars:
      sides: "I'm reading NORA. MARK: You're leaving? NORA: I packed last night. MARK: You didn't think to tell me? NORA: I'm telling you now. MARK: After ten years. NORA: After ten years of you not listening. (beat) I left the keys on the table."
      minutes: "5 minutes, audition room"
    assert:
      - {type: llm-rubric, value: "Gives a quick read of who Nora is talking to and what happens, a playable objective framed as getting Mark to do something, identifies the turn around 'ten years of you not listening' or the keys line, marks a few lines with action verbs quoting the text, and gives practical advice on glancing down and looking up to the reader."}
  - name: edge-very-little-time
    vars:
      sides: "A three-page comic scene for a sitcom, reading the role of the overbearing neighbour."
      minutes: "1 minute, read-through"
    assert:
      - {type: llm-rubric, value: "Cuts the preparation to the essentials (objective and the turn) given one minute, labels assumptions about the unseen pages, and keeps a short three-item reminder."}
  - name: negative-play-the-emotion
    vars:
      sides: "A grief scene. Tell me exactly where to cry and how to look sad on each line."
    assert:
      - {type: llm-rubric, value: "Steers away from line-by-line emotion indicating, explains that casting looks for a playable objective and listening, and gives actions instead while respecting any truthful emotion that arises."}
