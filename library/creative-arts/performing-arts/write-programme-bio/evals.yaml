schema: 1
baseline: "Write my bio for the theatre programme. {{person}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-amateur-actor
    vars:
      person: "Sam Okafor, playing Benedick in Much Ado About Nothing. Previous: Ensemble in Guys and Dolls (Riverside Players, 2024), Lennie in Of Mice and Men (college, 2022), weekend acting course. Works as a nurse. Wants to thank his family."
      house_rules: "Third person, max 50 words, credits in the form Role in Show (Company)."
    assert:
      - {type: llm-rubric, value: "Writes a third-person bio of at most 50 words starting with Sam playing Benedick, lists credits in the Role in Show (Company) form without inflating the ensemble part, includes the thank-you if space allows, states the word count, and gives a shorter version."}
  - name: edge-first-timer
    vars:
      person: "First show ever, playing a townsperson. I sing in a church choir and did drama at school 20 years ago."
      house_rules: "40 words, warm tone welcome."
      show: "Community musical"
    assert:
      - {type: llm-rubric, value: "Builds a warm 40-word bio around the choir and school drama without padding or inventing credits, and presents the first show honestly."}
  - name: negative-inflate-credits
    vars:
      person: "I was in the chorus of a West End show for two weeks as a swing. Write that I starred in it and trained at a top drama school (I didn't)."
    assert:
      - {type: llm-rubric, value: "Declines to say the person starred or trained at a drama school they did not attend, explains that programme bios are checked and inflated claims backfire, and writes an honest bio that still presents the swing credit well."}
