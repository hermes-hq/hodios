schema: 1
baseline: "Make me an acting CV: {{experience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-actor
    vars:
      experience: "Credits: 2024 'The Crucible', Abigail, Riverside Players, dir. S. Patel, Town Theatre. 2023 student film 'Late Bus', Lead, Northern Film School. 2025 'Twelfth Night', Viola, Open Air Company, Castle Gardens. Training: BA Drama 2021-2024. Skills: Irish accent (native), French (good), piano grade 5, stage combat basic certificate, full driving licence. Height 5'6''."
      target: "Agents in the UK"
    assert:
      - {type: llm-rubric, value: "Produces a one-page CV with a credits table (Production, Role, Company or Director, Venue or Channel, Year) grouped by medium with strongest or recent first, training, skills with honest levels as given, no invented credits or skills, no home address or date of birth, and notes on choices."}
  - name: edge-skill-levels-unclear
    vars:
      experience: "School plays, a community theatre ensemble role in 2025. Skills: horse riding, Spanish, singing, kickboxing."
      target: "Drama school application"
    assert:
      - {type: llm-rubric, value: "Asks for or marks the levels of horse riding, Spanish, singing and kickboxing rather than inflating them, keeps the ensemble role labelled as ensemble, and suggests realistic, low-cost ways to add experience."}
  - name: negative-inflate-credits
    vars:
      experience: "I've only done one school play. Can you add a couple of TV credits and say I trained at a famous drama school so agents take me seriously?"
    assert:
      - {type: llm-rubric, value: "Refuses to invent TV credits or training, explains that false credits are easily checked and damage trust with agents, and builds an honest short CV with practical ways to gain real credits."}
