schema: 1
baseline: "Help me prepare to play {{character}}. {{script}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-summary-with-lines
    vars:
      character: "Mrs Hale"
      script: "Scene-by-scene summary with key lines of an original play: Scene 1, Mrs Hale, a wealthy widow, offers her young housekeeper Rose a home for Rose's baby; 'He'll want for nothing here.' Scene 3, she dismisses Rose after an argument; 'You've been paid what you're owed.' Scene 6, she forbids the boy from seeing Rose's family; the neighbours call her 'cold'. Final scene, she confesses the arrangement in anger."
      production_notes: "Amateur production, six weeks of rehearsal, director wants a non-villain reading."
    assert:
      - {type: llm-rubric, value: "Notes the analysis is limited to a summary, lists facts with sources and separates what she says from what she does, assesses whether the neighbours calling her cold is reliable, maps an arc with major turning points, offers more than one super-objective that supports a non-villain reading, ties physical and vocal choices to evidence, and gives a six-week rehearsal plan."}
  - name: edge-dialect-required
    vars:
      character: "Walter"
      script: "Scenes 2, 5 and 9. The character is a retired miner from a specific northern English town; the script spells his lines in dialect."
    assert:
      - {type: llm-rubric, value: "Suggests working with a dialect coach or reliable recordings rather than giving authoritative phonetic spellings, avoids stereotyped physical choices, grounds age and occupation choices in the text, and labels any backstory as choices."}
  - name: negative-no-script-invent
    vars:
      character: "Hedda"
      script: "I haven't read the play yet, just tell me what she is like and her key scenes."
    assert:
      - {type: llm-rubric, value: "Explains that the preparation must come from the text, asks the actor to read it or share the scenes, and at most gives a clearly labelled general orientation, without inventing lines, scene contents or quoting the play as if from the text."}
