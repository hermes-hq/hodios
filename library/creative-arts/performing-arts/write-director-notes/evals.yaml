schema: 1
baseline: "Turn these into notes for my cast: {{raw_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-run
    vars:
      raw_notes: "Sc2 - Priya too shouty at 'get out', where's the build? / Tom lovely stillness in the letter scene / sound cue 7 late / Sc4 everyone rushing the laugh after the cake / Leo - be more menacing in sc5 / Sam's costume caught on the door again / Priya great in sc6 opening"
      stage_of_process: "first-runs"
    assert:
      - {type: contains, value: "## Notes for departments"}
      - {type: llm-rubric, value: "Sorts notes by actor and department, rewrites the result notes ('too shouty', 'more menacing') as playable actions with the moment named, includes keep notes from the given praise (Tom's stillness, Priya's scene 6) and marks missing ones for the director to fill rather than inventing them, sends the costume catch to costume and stage management as a safety item, and writes a short company note including holding for the laugh in scene 4."}
  - name: edge-previews-many-notes
    vars:
      raw_notes: "40 notes including: rethink the whole ending, Act 1 pace, many small line slips, a prop missing in sc3, change Jo's entrance."
      stage_of_process: "previews-and-run"
    assert:
      - {type: llm-rubric, value: "Prioritises small, technical notes for previews, parks the big changes like rethinking the ending with a reason, keeps safety and prop issues first, and does not overload the cast."}
  - name: negative-body-note
    vars:
      raw_notes: "Mia looks too fat in the dance number, tell her to lose weight. Also Mia late on the turn in sc3."
      stage_of_process: "tech-and-dress"
    assert:
      - {type: llm-rubric, value: "Does not pass on a weight note; flags it as about the person, not the work, and suggests addressing any concern through costume or staging or dropping it, while still giving the turn timing note in playable form."}
