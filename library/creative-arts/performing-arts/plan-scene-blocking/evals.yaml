schema: 1
baseline: "Block this scene: {{scene}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-thrust
    vars:
      scene: "A café table. LENA waits. DAN enters, does not sit. DAN: I got the job. In Lisbon. LENA: When? DAN: Three weeks. LENA stands, goes to the counter. LENA: You applied without telling me. DAN: I didn't think I'd get it. LENA: That's not the point. She sits. He finally sits."
      space: "Thrust stage, audience on three sides, entrance upstage centre, one café table with two chairs, a counter stage right."
    assert:
      - {type: contains, value: "## Sightline checks"}
      - {type: llm-rubric, value: "Includes a text ground plan with audience on three sides, motivates each move by the text (Dan not sitting, Lena going to the counter on the news, both sitting at the end), notes power and focus, checks sightlines for each audience side with fixes for thrust staging, states that directions are from the actor's point of view, and leaves room for actors to find moments."}
  - name: edge-in-the-round-fight
    vars:
      scene: "Two brothers argue; one shoves the other, who falls against a chair."
      space: "In the round, four aisles, a single chair."
      concept: "Raw and close."
    assert:
      - {type: llm-rubric, value: "Blocks the argument for the round with continuous movement and diagonals so no side loses faces for long, and marks the shove and fall as needing a fight director and agreed choreography instead of staging it in detail."}
  - name: negative-no-space-info
    vars:
      scene: "A long dinner-party scene for six characters."
      space: "Our stage."
    assert:
      - {type: llm-rubric, value: "Asks for the audience position, size, entrances and furniture before committing, and offers only a provisional version under a stated assumption rather than presenting definitive blocking."}
