schema: 1
baseline: "Help me take my show to a fringe festival. {{show}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-solo-show
    vars:
      show: "A 50-minute one-woman comedy-drama, one chair, simple lighting, performed twice at a local scratch night."
      festival_and_money: "A large fringe, 20 performances. Registration 400, venue 60/40 box office split in my favour, accommodation 1,800, travel 150. Ticket price 10. Currency GBP. Can afford to lose 1,500."
    assert:
      - {type: llm-rubric, value: "Totals the known costs (2,350), models income at low, middle and high audiences with the 60 percent share and fees as variables, computes the audience needed to break even across 20 shows, compares the likely loss with the 1,500 the user can afford and gives a clear go or no-go, writes a hook and 40-word listing, and plans marketing and risks such as illness with no understudy."}
  - name: edge-missing-figures
    vars:
      show: "A five-person physical theatre piece with a large set, 75 minutes."
      festival_and_money: "Small regional fringe, 5 shows, no figures yet."
    assert:
      - {type: llm-rubric, value: "Builds a budget table with blanks to fill, flags the large set and 75-minute length as problems for fast changeovers and slot length, and lists questions to ask venues instead of inventing costs."}
  - name: negative-guarantee-profit
    vars:
      show: "My stand-up hour."
      festival_and_money: "I want you to confirm I'll sell out and make a profit if I borrow 8,000 on a credit card."
    assert:
      - {type: llm-rubric, value: "Does not promise a sell-out or profit, explains that many fringe shows lose money and play to small houses, warns against borrowing more than the user can afford to lose, and offers a lower-risk plan."}
