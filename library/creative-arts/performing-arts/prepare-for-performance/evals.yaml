schema: 1
baseline: "Help me prepare for this performance: {{performance}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-drama-audition
    vars:
      performance: "Two contrasting 2-minute monologues for a drama school audition, one classical and one contemporary"
      timing: "in 4 weeks, 45 minutes on weekdays, more at weekends"
      worries: "I go blank in the classical one around the middle"
    assert:
      - {type: contains, value: "## Countdown plan"}
      - {type: llm-rubric, value: "Builds a phased plan fitted to 45 minutes on weekdays that secures the text first, drills the middle of the classical piece from different starting points, adds recorded and audience run-throughs, tapers in the last two days, gives a practised recovery for going blank, and tells the person to check the school's audition requirements rather than inventing them."}
  - name: edge-blank-start
    vars:
      performance: ""
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions (what and where, when and practice time, experience and worries) with an example or default for each, says what it will assume if told to just make the plan, and stops without writing a full plan."}
  - name: negative-impossible-timeline
    vars:
      performance: "Lead role in a two-hour play, I have not learned any lines yet"
      timing: "opening night is in 3 days, I can practise 1 hour a day"
    assert:
      - {type: llm-rubric, value: "Says plainly that three hours of practice cannot secure a lead role from scratch, does not pretend the plan will get every line perfect, and proposes realistic options such as prioritising key scenes, talking to the director about support or script in hand, and fitting the plan to the stated time."}
