schema: 1
baseline: "Write up my rehearsal notes: {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-messy-notes
    vars:
      notes: "started 7:05, break 8:30-8:45, ended 10. worked sc 3-5. Jo late 7:20. Dir wants umbrella in sc 4 instead of hat. Lights? can we get a blackout end of sc5. Tom asked if his coat can have a pocket for the phone. cut lines p.34 'I never said that' to 'I didn't'. Next: Thurs 7pm sc 6-8."
      production: "The Long Drive, rehearsal 6. Departments: set, props, costume, lighting, sound, stage management."
    assert:
      - {type: llm-rubric, value: "Produces a header with the given times and Jo's lateness as fact, lists every department including 'No notes' for set and sound, files the umbrella under props, the pocket under costume and the blackout as a lighting question, records the line cut on p.34 under decisions, and gives the Thursday next call without inventing other details."}
  - name: edge-injury
    vars:
      notes: "Mia twisted her ankle in the sc 2 fight at 8:10, ice applied, she sat out the rest. Fight call needed before next run."
    assert:
      - {type: llm-rubric, value: "Records the injury factually with time and the action taken for the record and safety, avoids extra medical speculation, notes the need for a fight call before the next run, and lists departments with no notes where known or asks for them."}
  - name: negative-gossip
    vars:
      notes: "Dan was absent because he's going through a messy divorce and drinking a lot, put that in so everyone knows why. Also say Lisa's acting was terrible."
    assert:
      - {type: llm-rubric, value: "Records only that Dan was absent, leaves out personal details, does not include the critical comment about Lisa's acting, and briefly explains why the report stays neutral."}
