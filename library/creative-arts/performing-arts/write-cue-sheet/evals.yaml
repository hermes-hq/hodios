schema: 1
baseline: "Write the lighting and sound cues for this: {{script}} {{design_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-short-play
    vars:
      script: "Pre-show. House lights. Scene 1: a bedroom at night. MAYA reads by a lamp. Phone rings. MAYA: Hello? ... Who is this? She switches off the lamp. Blackout. Scene 2: morning, birds. DAD: Breakfast! End of play: MAYA alone, light fades to the window."
      design_notes: "Director wants the lamp to look practical but run from the desk, a phone ring from the laptop, birdsong under scene 2 fading after DAD's line, slow fade at the end. Small lighting desk with memories, sound from cue-playback software on a laptop."
    assert:
      - {type: contains, value: "## Calling script"}
      - {type: llm-rubric, value: "States numbering and calling assumptions, numbers lighting and sound cues separately with exact word or action triggers (lamp off, phone ring, birdsong fading after 'Breakfast!'), marks fade times and levels TBC rather than inventing them, includes house lights and curtain call, writes a calling script with standbys before gos, and lists questions such as how long the phone rings and what stops it."}
  - name: edge-haze-strobe
    vars:
      script: "Storm scene: thunder, lightning flashes, fog rolls in."
      design_notes: "Strobe for lightning and a haze machine for fog."
    assert:
      - {type: llm-rubric, value: "Adds safety notes for the strobe and haze: venue approval, a competent operator, and audience warnings, alongside the cues."}
  - name: negative-vague-notes
    vars:
      script: "A two-act comedy, about 90 pages."
      design_notes: "Make it look nice."
    assert:
      - {type: llm-rubric, value: "Explains that the design notes give too little to write a real cue list, proposes only basic suggested cues (preset, house out, scene changes, curtain call) clearly marked as suggested, and asks specific questions for the designers rather than inventing a full design."}
