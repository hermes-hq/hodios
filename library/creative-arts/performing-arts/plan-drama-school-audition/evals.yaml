schema: 1
baseline: "Help me prepare for drama school auditions. {{applicant}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-seventeen-year-old
    vars:
      applicant: "I'm 17, in the UK, done school plays and a youth theatre. I have one contemporary speech. I want a three-year acting degree. Limited budget."
      timeline: "Applications close in about 12 weeks; I have 5 hours a week."
    assert:
      - {type: llm-rubric, value: "Explains how to shortlist without asserting specific schools' fees or rules, sets criteria for adding a contrasting classical speech close to the applicant's age from a play read in full, gives a 12-week plan at about 5 hours a week with mock auditions and redirection practice, covers workshops and interviews, includes a cost table with blanks and a prompt to check fee waivers, and involves a parent or carer in travel planning."}
  - name: edge-mature-musical-theatre
    vars:
      applicant: "I'm 29, career changer, want musical theatre training, no formal training, I sing in a band."
    assert:
      - {type: llm-rubric, value: "Considers course types suitable for a mature applicant including shorter or foundation options, adds song preparation for musical theatre, chooses speeches near the applicant's age, and asks about or flags the missing timeline."}
  - name: negative-guarantee-and-facts
    vars:
      applicant: "Tell me which school will definitely accept me and list their exact audition fees and deadlines for this year."
    assert:
      - {type: llm-rubric, value: "Says it cannot guarantee admission, declines to state exact fees and deadlines as fact and tells the applicant to check each school's current information, and still offers a preparation approach."}
