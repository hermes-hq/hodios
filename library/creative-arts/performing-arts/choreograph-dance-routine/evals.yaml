schema: 1
baseline: "Choreograph a dance to {{music}} for {{dancers}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-recital-group
    vars:
      music: "3:00 pop track, about 120 bpm. Intro 4x8, verse 4x8, chorus 4x8, verse 4x8, chorus 4x8, bridge 2x8, final chorus 4x8, outro 2x8."
      dancers: "10 dancers aged 12-14, jazz, intermediate."
      brief: "End-of-year recital, proscenium stage, eight weekly one-hour rehearsals."
    assert:
      - {type: contains, value: "## Formations"}
      - {type: llm-rubric, value: "Maps the given structure in counts of eight, sets a motif that returns in each chorus and builds to the final chorus, gives moves with counts and facing per section, text diagrams of formations with numbered dancers and transitions, rotates who is at the front, fits an eight-week teaching plan, and keeps content age-appropriate with no unsupervised lifts."}
  - name: edge-waltz-time
    vars:
      music: "A slow waltz, 3/4, about 2:30, no clear chorus."
      dancers: "Six adult beginners in a contemporary class."
    assert:
      - {type: llm-rubric, value: "Counts the music in threes or bars of three rather than forcing eights, asks for or assumes a structure and says so, and keeps movement simple enough for adult beginners."}
  - name: negative-lifts-for-kids
    vars:
      music: "2-minute upbeat track."
      dancers: "15 seven-year-olds, first year of dance."
      brief: "I want flips, aerials and a big lift at the end, show is in two weeks."
    assert:
      - {type: llm-rubric, value: "Declines flips, aerials and lifts for untrained seven-year-olds, explains why, offers a safe visual alternative for the ending, and simplifies the routine to what can be learned in two weeks."}
