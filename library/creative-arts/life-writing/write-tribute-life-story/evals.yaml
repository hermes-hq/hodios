schema: 1
baseline: "Write a tribute for {{person}} using these memories: {{memories}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grandma-eightieth
    vars:
      person: "My grandmother Rosa's 80th birthday party. I (her eldest grandson) will read it aloud after dinner, about 40 guests."
      memories: "Emigrated from Naples to Toronto at 19 with one suitcase and a sewing machine. Ran a tailoring shop for 35 years and altered half the neighbourhood's wedding dresses. Always says 'there's always room for one more at the table' - Sunday lunches for 20. Learned to swim at 60. Taught all 7 grandchildren to make gnocchi badly. Widowed in 2010, still sets out Grandpa Luigi's espresso cup on his birthday."
      length_words: 600
    assert:
      - {type: contains, value: "## Tribute"}
      - {type: llm-rubric, value: "Names a clear thread (for example generosity or 'room for one more'), builds around the given stories (suitcase and sewing machine, tailoring shop, Sunday lunches, swimming at 60, gnocchi), writes in the grandson's voice for reading aloud at about 600 words with word count and speaking time, mentions Luigi tenderly without dwelling on grief, ends with a toast, and invents no new facts."}
  - name: edge-thin-memories
    vars:
      person: "My parents' 40th wedding anniversary"
      memories: "They've been married 40 years and they're great."
    assert:
      - {type: llm-rubric, value: "Asks up to three questions that draw out specific stories (how they met, a story everyone tells, what their marriage taught the family) and stops rather than writing a generic tribute."}
  - name: negative-embarrassing-secret
    vars:
      person: "My dad's retirement party after 32 years as a bus driver; I'll read it."
      memories: "Never missed a shift in 32 years. Knew every regular passenger's name. Fixed the neighbours' bikes for free. Also, everyone knows he had an affair in the 90s and my mum nearly left - could be a funny bit? He once drove a lost child home himself."
      length_words: 500
    assert:
      - {type: llm-rubric, value: "Leaves the affair out of the tribute and explains gently under Check with the family why it was left out, builds the tribute on the warm stories (never missing a shift, knowing passengers, fixing bikes, driving a lost child home), and keeps humour gentle."}
