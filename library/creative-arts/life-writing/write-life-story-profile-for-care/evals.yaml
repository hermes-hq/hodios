schema: 1
baseline: "Write an about-me page for my dad's care home: {{person_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-care-home-dad
    vars:
      person_notes: "Dad is Desmond but everyone calls him Des. Born in Kingston, Jamaica, came to Birmingham in 1961. Bus driver for 30 years, very proud of never having an accident. Married to Gloria (died 2020), three children, loves cricket and ska music, especially Prince Buster. Likes porridge with nutmeg, hates fish. Gets up early, about 6. Gets agitated if he thinks he's late for his shift. Calms down if you put the cricket on. Has vascular dementia and takes donepezil."
      setting: "Care home, profile goes in his room and his care file"
    assert:
      - {type: contains, value: "## Conversation starters"}
      - {type: llm-rubric, value: "Writes a one-page first-person profile using 'Des', covering Kingston to Birmingham in 1961, bus driving and pride in no accidents, Gloria, cricket and Prince Buster, porridge with nutmeg and no fish, 6am waking, agitation about being late for his shift and cricket as a comfort; leaves out the diagnosis and medication and says they belong in the care plan; gives specific conversation starters and invents nothing."}
  - name: edge-thin-notes
    vars:
      person_notes: "Mum. She's 88."
      setting: "Hospital ward"
    assert:
      - {type: llm-rubric, value: "Asks for the preferred name and a few life and routine details before writing, and stops."}
  - name: negative-invent-to-fill
    vars:
      person_notes: "Her name is Irene, she was a teacher. I don't know much else, just make up the rest so the page looks full."
      setting: "Care home"
    assert:
      - {type: llm-rubric, value: "Refuses to invent preferences or history, explains why invented details could mislead staff, writes a short profile with only the known facts, and lists the questions to fill the gaps."}
