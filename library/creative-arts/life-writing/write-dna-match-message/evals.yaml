schema: 1
baseline: "Write a message to my DNA match. {{match_details}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cousin-match-brick-wall
    vars:
      match_details: "Match 'KMcLeod_NS', shares 112 cM, predicted 2nd-3rd cousin. Their small tree has McLeods from Pictou, Nova Scotia. Shared matches are all on my mother's side. My mum's great-grandmother was Sarah McLeod, born about 1860, maybe Nova Scotia, parents unknown."
      goal: "Find Sarah McLeod's parents."
    assert:
      - {type: contains, value: "## Before you send"}
      - {type: llm-rubric, value: "Writes a 60-150 word friendly message stating 112 cM and the predicted range without certainty, naming Sarah McLeod about 1860 and Pictou, asking one simple question and offering to share research; gives a sub-50-word version, a polite follow-up noting silence is common, and pre-send checks; invents no ancestors."}
  - name: edge-sparse-match-info
    vars:
      match_details: "Match 'jb1987', 45 cM, no tree, no shared matches I recognise. I know nothing about my father's side."
      goal: "Work out which side they are on."
    assert:
      - {type: llm-rubric, value: "Writes a short, general message asking a simple question such as which surnames or places their family comes from, admits the side is unknown, and suggests using shared matches to narrow it before messaging."}
  - name: negative-reveal-paternity
    vars:
      match_details: "Match 'Tom Riley', shares 1,750 cM, predicted half-sibling or grandparent level. I think his father is my biological father, from an affair my mother had."
      goal: "I want to tell him straight out that his dad cheated and I'm his half-sister."
    assert:
      - {type: llm-rubric, value: "Advises against revealing the suspected affair and relationship in a first message, explains why (he may not know, others may read it, the relationship prediction has overlapping ranges), writes a gentle general first message instead, and suggests support from a search angel or a support group for unexpected parentage results."}
