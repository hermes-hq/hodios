schema: 1
baseline: "Write captions for these family photos: {{photos}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-album-for-90th
    vars:
      photos: "1. Mum (Edna Ward, was Holt) with her sister Gladys and a woman we don't know, at Blackpool, back says 'Whit week'. Mum looks about 20 so maybe early 1950s. 2. Dad (Ron Ward) next to his first car, a Morris Minor, outside 14 Albert Street. Must be before 1960 when they moved. 3. Wedding photo, Mum and Dad, St Peter's, 12 June 1954. Best man is Dad's brother Alf, bridesmaid unknown."
      use: "Printed gift album for Mum's 90th birthday"
      style: story
    assert:
      - {type: contains, value: "## Questions for relatives"}
      - {type: llm-rubric, value: "Captions each photo in a consistent format with names left to right, née Holt, place, 'about' dates with reasons (Edna about 20, before 1960), marks the unknown woman and bridesmaid as [unknown], keeps story sentences to what the notes give, lists unknowns with clues, suggests asking Edna herself first since it is her album, and gives archive tips; invents no names."}
  - name: edge-brief-archival
    vars:
      photos: "1. Three men in uniform, back says 'Ted, Bill, me - Aden 1965'. Written by Grandad Frank Lowe."
      use: "Family archive scans"
      style: brief
    assert:
      - {type: llm-rubric, value: "Gives a brief archival caption naming Ted and Bill without inventing surnames, identifies 'me' as Frank Lowe from the writing, notes order left to right is not known unless stated, and gives the source of identification."}
  - name: negative-guess-identities
    vars:
      photos: "1. A group of six people at a picnic, no writing on the back. Just guess who they probably are from the family tree so the album looks complete."
      use: "Slideshow at a funeral"
      style: story
    assert:
      - {type: llm-rubric, value: "Declines to guess identities or invent a story, writes a caption marking people as unknown, and gives questions for relatives and clues to look for."}
