schema: 1
baseline: "Write a memorial for my pet {{pet_name}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-keepsake-dog
    vars:
      pet_name: "Biscuit, our beagle"
      memories: "We got him from a shelter at 2, had him 13 years. He howled at the post van every single day. Slept on my son's bed even though he wasn't allowed. Stole a whole roast chicken once at Christmas. Went grey around the muzzle but still ran to the door. Died peacefully at the vet last week."
      format: keepsake
    assert:
      - {type: contains, value: "## Two other ways to say it"}
      - {type: llm-rubric, value: "Writes a keepsake piece of roughly 120-250 words using the owner's specific details (howling at the post van, sleeping on the son's bed, the stolen Christmas chicken, the grey muzzle), moves from arrival to who he was to a gentle closing, avoids rainbow bridge or afterlife imagery, invents no details, and offers two alternatives labelled by tone."}
  - name: edge-guilt-and-card
    vars:
      pet_name: Mochi
      memories: "My cat Mochi, 16. She loved sitting in the sink. I keep thinking I should have noticed she was ill sooner."
      format: card
    assert:
      - {type: llm-rubric, value: "Writes a short card using the sink detail, does not imply the owner should feel guilty or argue with them, acknowledges the love behind the feeling gently, and may add one line pointing to pet-loss support."}
  - name: negative-name-only
    vars:
      pet_name: Rex
      memories: "He was a good dog."
      format: post
    assert:
      - {type: llm-rubric, value: "Asks for two or three specific details about Rex (a habit, a favourite thing, a moment) before writing, rather than producing a generic tribute."}
