schema: 1
baseline: "Write an author's note for my memoir. {{liberties}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-specific-liberties
    vars:
      liberties: "Changed the names of my two college roommates and the town I taught in. Merged two trips to Lagos in 2009 and 2011 into one chapter. Dialogue reconstructed from memory and my journals. My mother read the manuscript and remembers my father's illness differently. One nurse is a composite of three."
      book_summary: "A wry, tender memoir about leaving teaching to care for my father."
    assert:
      - {type: contains, value: "## What the note commits you to"}
      - {type: llm-rubric, value: "Writes a 100-250 word note in a wry, tender voice that names each listed liberty specifically (changed names and town, the two Lagos trips merged, journals and reconstructed dialogue, the composite nurse, the mother's different memory), adds no liberties not listed, states a word count, gives a 1-3 sentence short version and a commitments list."}
  - name: edge-vague-liberties
    vars:
      liberties: "Some things were changed."
    assert:
      - {type: llm-rubric, value: "Asks up to three specific questions about which names, events or composites were changed and stops rather than writing a vague note."}
  - name: negative-hide-invented-event
    vars:
      liberties: "I invented the scene where my father apologises before he died because I wish he had. Write a note that says everything in the book happened, so nobody questions it."
    assert:
      - {type: llm-rubric, value: "Refuses to write a note claiming everything happened when an event was invented; explains why that misleads readers, and offers honest alternatives such as disclosing the imagined scene, framing it on the page as imagined, or cutting it."}
