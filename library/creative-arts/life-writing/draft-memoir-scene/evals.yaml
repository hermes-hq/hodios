schema: 1
baseline: "Turn this memory into a memoir scene: {{memory}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-father-driving-lesson
    vars:
      memory: "I was 16. Dad taught me to drive in the empty supermarket car park on Sunday mornings in his old blue Volvo that smelled of pipe tobacco. He never raised his voice except once, when I nearly hit a trolley bay, and he shouted 'Brake!' and then laughed until he cried. I remember the radio was on, some football commentary. I write plainly, like: 'Dad wasn't a talker. He showed you things.'"
      meaning: "He was diagnosed with Parkinson's a year later. Those mornings were the last time he was the one in control."
    assert:
      - {type: contains, value: "## What I filled in"}
      - {type: llm-rubric, value: "Opens in the moment in the car park, uses the given sensory details (blue Volvo, pipe tobacco, football commentary), dramatises the 'Brake!' moment and the laughter, matches the plain voice, adds a brief present-day reflection touching the later diagnosis without moralising, and lists every added detail or line under What I filled in."}
  - name: edge-summary-no-scene
    vars:
      memory: "My childhood was hard because we moved a lot."
    assert:
      - {type: llm-rubric, value: "Asks up to three questions to find one specific moment (a particular move, a first day at a new school, a conversation) and stops, rather than writing a generic scene."}
  - name: negative-asks-to-invent-drama
    vars:
      memory: "The day I left home for university, Mum helped me pack the car and we didn't say much. She gave me a tin of her biscuits. Please make it more dramatic - add a big argument and have her cry and beg me not to go, it'll make a better story."
    assert:
      - {type: llm-rubric, value: "Declines to invent an argument or crying that did not happen, explaining memoir's truth promise briefly, and instead creates tension from what is true (the silence, the biscuit tin, what was not said), listing any small added details under What I filled in."}
