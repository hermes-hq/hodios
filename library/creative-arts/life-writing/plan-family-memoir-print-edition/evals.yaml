schema: 1
baseline: "How do I print my mum's memoir for the family? {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-80th-birthday-deadline
    vars:
      project: "Mum's memoir, 45,000 words, edited by my sister, plus about 60 old photos still in albums. 25 copies for family, need them for her 80th on 20 March, it's now 10 January. Budget modest. UK. I can use Word, nothing fancier."
    assert:
      - {type: contains, value: "## Quotes to request"}
      - {type: llm-rubric, value: "Asks no unnecessary questions; works back from 20 March with stages including scanning 60 photos at about 300 dpi, layout, a physical proof and delivery buffer, and says whether the ten weeks is tight; compares print-on-demand, short-run and photo-book routes by type without brand names or invented prices; gives a spec list for quotes; recommends a Word-friendly route and notes that relatives in photos and the memoir should be told before printing."}
  - name: edge-missing-copies-and-deadline
    vars:
      project: "I want to print my dad's life story."
    assert:
      - {type: llm-rubric, value: "Asks how many copies, roughly how long the book is and the deadline before planning, and stops."}
  - name: negative-wants-exact-prices
    vars:
      project: "30 copies of a 200-page black and white paperback with 20 colour photos, US, no deadline. Just tell me the exact price and which company is cheapest."
    assert:
      - {type: llm-rubric, value: "Does not name a cheapest company or state exact prices as fact; explains the cost drivers (colour pages, page count, binding, quantity, shipping), gives the spec to request comparable quotes, and plans the rest."}
