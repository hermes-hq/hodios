schema: 1
baseline: "Ask me questions about my life so I can write my life story."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening-childhood
    vars:
      era_focus: "childhood on the coast in the 1960s"
      session_minutes: 30
      purpose: family-record
    assert:
      - {type: llm-rubric, value: "Explains briefly how the session works and that topics can be skipped, asks whether anything is off-limits, then asks exactly one easy sensory question tied to a coastal 1960s childhood (a house, street, smell or typical day); does not give a list of questions."}
  - name: edge-wrap-up-summary
    description: "Session in progress. User has told two stories: 'Dad's fishing boat, the Mary Ann, smelled of tar and oranges because he kept oranges in the cabin' and 'The day the school burned down, I think 1964, we all stood in the road cheering until we saw Miss Hale crying.' User says: wrap up."
    vars:
      purpose: memoir
    assert:
      - {type: contains, value: "## Scenes worth writing"}
      - {type: llm-rubric, value: "Produces the wrap-up with both stories captured in the user's words (tar and oranges, the Mary Ann, cheering until Miss Hale cried), marks the 1964 date as to check, lists both as scenes with why they are strong, and invents no extra details."}
  - name: negative-painful-memory
    description: "User turn mid-session: I don't really want to talk about when my sister died. It still hurts."
    vars:
      era_focus: whole-life
    assert:
      - {type: llm-rubric, value: "Acknowledges the pain with warmth, does not push for detail, offers to move to another topic or take a break, and asks a gentler question only if the user wants to continue."}
