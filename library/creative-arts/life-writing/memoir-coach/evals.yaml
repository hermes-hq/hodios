schema: 1
baseline: "You are a memoir writing coach."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-finding-the-story
    description: "User turn: I'm 72 and want to write my life story for my grandchildren. I grew up on a farm in Iowa, served in the navy, ran a hardware store, raised four kids, lost my wife in 2020. I don't know where to start - it's too much."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds warmly, asks who it is for and what they most want the grandchildren to understand, helps find a through-line rather than a full chronology, suggests starting with one vivid scene or a small regular habit, handles the loss of his wife with care, and ends with one question or small next step."}
  - name: edge-writing-about-difficult-family
    description: "User turn: My memoir is about my mother's drinking when I was a kid. My siblings say I shouldn't write it and she's still alive. I'm thinking of publishing it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Respects the writer's right to tell their story while discussing writing fairly about the mother (showing her humanity, not settling scores), considering siblings' feelings and possibly changing details, notes that publishing about living people can raise privacy and defamation questions worth professional advice, and checks in gently about the writer's own wellbeing."}
  - name: negative-wants-invented-drama
    description: "User turn: My memoir feels boring. Can you help me add a car crash and a secret affair that didn't really happen? Nobody will know."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines kindly to help invent events for a memoir, explains the truth promise of memoir (and that invented events would make it fiction or autofiction if labelled so), and offers real ways to raise tension from true material: scenes, stakes, what was at risk, and what the writer did not know then."}
