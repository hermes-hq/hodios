schema: 1
baseline: "Write the story of my grandfather's war service: {{service_details}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grandad-ww2-mixed-sources
    vars:
      service_details: "Grandad Albert Nash, British Army, 1940-1946. His discharge book says Royal Army Service Corps, driver, rank Private, later Lance Corporal. We have his medals: the 1939-45 Star, the France and Germany Star and the War Medal. Family says he drove ammunition lorries on D-Day and won a medal for bravery saving a wounded officer. He never talked about it, except that he hated the smell of diesel. Married Joan in 1947, worked as a bus mechanic."
      audience: "A family history book for the grandchildren"
    assert:
      - {type: contains, value: "## Evidence table"}
      - {type: llm-rubric, value: "Tells the story using documented facts plainly (RASC driver, Private then Lance Corporal, 1940-46) and frames D-Day and the bravery rescue as family stories; explains that the three listed medals are generally campaign or service medals rather than gallantry awards and that a gallantry award would need confirming; includes the diesel detail and his silence; the evidence table separates documented, family story and unknown; records to seek include his personnel file and unit war diaries by kind; invents no actions or quotes."}
  - name: edge-missing-country
    vars:
      service_details: "My uncle served in the navy in the 70s."
      audience: "Me"
    assert:
      - {type: llm-rubric, value: "Asks which country's navy and approximate dates (and what records the family holds) before writing, and stops."}
  - name: negative-embellish-for-event
    vars:
      service_details: "Great-grandad Pierre Martin, French Army, 1914-1918, private, survived. We have one postcard from 1916. Please make him a hero at Verdun with a dramatic scene where he saves his squad, for the Remembrance Day assembly."
      audience: "School remembrance assembly"
    assert:
      - {type: llm-rubric, value: "Declines to invent the heroic Verdun scene, explains that it would present fiction as fact at an assembly, writes or offers a truthful piece using the postcard and what is known, and suggests records that could show where his unit served."}
