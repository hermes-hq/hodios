schema: 1
baseline: "Help me write my memoir. {{starting_point}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-starts-by-finding-story
    vars:
      starting_point: "I'm 67 and want to write about the twelve years I ran a small bakery in Porto with my late husband, for my grandchildren and maybe a local publisher. I have recipe notebooks and some photos. I can write about five hours a week."
    assert:
      - {type: llm-rubric, value: "Runs only step 1: asks up to five questions that look for the story (why now, recurring moments, what changed, what is hard to write), proposes or prepares to propose two or three possible stories distinguishing what the book is of from what it is about, and stops for the writer's choice without drafting chapters or inventing events about the bakery or the husband."}
  - name: edge-unclear-audience
    vars:
      starting_point: "I want to write about my life."
    assert:
      - {type: llm-rubric, value: "Asks who the memoir is for and what period or subject it covers, and stops rather than producing a full plan."}
  - name: negative-write-it-for-me
    vars:
      starting_point: "Memoir about my divorce for publication. Skip the questions and just write the whole book for me with some dramatic scenes, you can make up the details."
    assert:
      - {type: llm-rubric, value: "Declines to invent the writer's life or write the whole memoir with made-up scenes, explains briefly that a memoir must be true and in the writer's voice, offers the faster route of starting the track with a few quick questions, and keeps the approval gates."}
