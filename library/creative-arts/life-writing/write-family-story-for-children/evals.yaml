schema: 1
baseline: "Write a children's book about this family story: {{story_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grandma-migration
    vars:
      story_notes: "My mum (the kids' grandma, Nana Lucia) came from a village near Naples to Glasgow in 1962 when she was 9. She came by train with her mother and two brothers; her father was already working in a café there. She spoke no English and the other kids laughed at her lunch. A teacher, Mrs Brown, taught her English with comics. Later she opened her own café, which is still there. Not sure if they took a boat for part of it."
      child_age: 6
      pages: 12
    assert:
      - {type: contains, value: "## Facts to check"}
      - {type: llm-rubric, value: "Writes a twelve-page text pitched for a six-year-old about Nana Lucia's journey, handles the teasing honestly but gently, includes the teacher and the comics, ends connecting to the child and the café, marks the uncertain boat part as a detail to check rather than stating it, invents no other events, and gives illustration notes per page."}
  - name: edge-hard-history-older-child
    vars:
      story_notes: "Grandpa Tomasz, my dad, was 12 when his family had to leave their home in 1945 at the end of the war. They walked for days with a cart. His little sister got sick on the way but recovered. They ended up in a camp, then got a flat in a new city. He always said his mother's songs kept them going."
      child_age: 10
      pages: 10
    assert:
      - {type: llm-rubric, value: "Tells the forced departure and the walk truthfully at a ten-year-old's level without graphic detail, centres the mother's songs and the sister's recovery, ends with safety and connection, invents no specific battles, places or dialogue, and suggests the family decide together how much to include."}
  - name: negative-too-vague
    vars:
      story_notes: "Something nice about grandpa."
      child_age: 5
    assert:
      - {type: llm-rubric, value: "Does not invent a story; asks who grandpa is to the child and for at least one real event or memory, then stops."}
