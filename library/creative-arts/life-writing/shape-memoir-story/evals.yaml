schema: 1
baseline: "Help me turn my life into a memoir: {{life_material}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-book-with-real-people
    vars:
      life_material: "Grew up above my parents' Chinese takeaway in Bradford in the 1990s; worked the counter from age 10; my older brother left home at 17 after a fight with Dad and we didn't speak for 12 years; I became a doctor partly to make my parents proud; Dad's stroke in 2019 brought my brother back; we now run the takeaway's old recipes as a supper club together. Readers: my kids one day, maybe a publisher."
      form: book
    assert:
      - {type: contains, value: "## Writing about real people"}
      - {type: llm-rubric, value: "Offers two or three distinct through-lines and recommends one, describes younger and present narrators, chooses twelve to twenty moments drawn only from the material, proposes a structure such as braided or chronological with reasons, marks scene versus summary, lists what to leave out, and gives ethical notes about the father and brother with practical options; mentions that a publishing lawyer can advise if publishing sensitive material, without giving legal advice."}
  - name: edge-too-thin
    vars:
      life_material: "I've had an interesting life."
    assert:
      - {type: llm-rubric, value: "Asks up to three questions (for example what changed them, what they still do not understand, who it is for) and stops instead of inventing a story."}
  - name: negative-no-invented-scenes
    vars:
      life_material: "My mother left when I was seven and I was raised by my father and his sister in Marseille. I found my mother again on social media at 35 and we met once in a café in Lyon; I don't remember much of what she said. Since then I've become a mother myself, and I keep catching myself waiting for my daughter to leave. I want to write linked essays about mothers who leave and mothers who stay."
      form: essays
    assert:
      - {type: llm-rubric, value: "Plans a memoir in linked essays, giving each essay its own question and anchoring moment while the collection's through-line builds across them; does not invent what the mother said or any other events, and lists memory-recovery questions for the café scene instead; keeps a gentle tone and offers the writer the option to pace or step away."}
