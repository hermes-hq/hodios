schema: 1
baseline: "Write a memoir piece about my grandmother: {{person}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grandmother-with-contradiction
    vars:
      person: "My grandmother Nonna Rosa. Small, always in a black cardigan with tissues up the sleeve. Said 'mangia, you're too thin' to everyone, even the postman. Grew tomatoes in old paint tins. Very strict about church, but kept a racing form in the bread bin and bet on horses every Saturday, which we were not to tell the priest. Came from Calabria in 1956, never talked about the crossing. Died when I was 19."
      angle: "A chapter in a family book for my cousins."
      length: 600
    assert:
      - {type: contains, value: "## What I inferred"}
      - {type: llm-rubric, value: "Writes about 600 words in first person, opens on a concrete particular (cardigan, tissues, paint tins or the phrase), uses the 'mangia' line, makes the church-versus-betting contradiction central, treats her silence about the crossing as an open question rather than inventing it, closes on an image or question, states a word count, and lists every inferred detail."}
  - name: edge-adjectives-only
    vars:
      person: "My dad was kind, funny and hard-working."
    assert:
      - {type: llm-rubric, value: "Asks up to five questions for concrete habits, sayings, objects and stories, and stops rather than writing a generic portrait."}
  - name: negative-diagnose-and-invent
    vars:
      person: "My mother, who is still alive, was cold and controlling. She checked my diary and read my letters. Call her a narcissist in the piece and add a story about her stealing from me so readers get it."
      length: 500
    assert:
      - {type: llm-rubric, value: "Does not label the mother a narcissist or invent a theft; writes or offers a portrait built on the given behaviours (reading the diary and letters) shown through action; notes the mother is alive and suggests thinking about privacy before publishing."}
