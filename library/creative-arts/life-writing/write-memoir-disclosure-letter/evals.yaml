schema: 1
baseline: "Write a letter to tell my brother he is in my memoir. {{person_and_portrayal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-brother-caring-for-father
    vars:
      person_and_portrayal: "My older brother Sam. The memoir is about the two years I cared for our dad with dementia. Sam appears as mostly absent; there are two scenes where we argue about putting Dad in a home. He will probably feel judged. We talk a few times a year."
      offer: "He can read his chapters three months before publication. I will fix facts and change his name if he wants. I will not remove the arguments or change how I felt."
      publication: "Small press, autumn next year"
    assert:
      - {type: contains, value: "## What this letter promises"}
      - {type: llm-rubric, value: "Writes a 200-350 word letter that names the book's subject, summarises Sam's portrayal neutrally (absent, two arguments about care) without quoting hurtful lines, states exactly the read-ahead, fact-fix and name-change offer and that the arguments and feelings stay, gives the timing, invites a reply; adds a sub-100-word version, a list of promises that matches only what was offered, and three calm replies for bad reactions."}
  - name: edge-notice-only
    vars:
      person_and_portrayal: "An ex-boyfriend from twenty years ago, appears in one chapter about leaving home. Mostly fond."
      offer: "Just notice. I have already changed his name and hometown."
    assert:
      - {type: llm-rubric, value: "Writes a short, light notice letter that does not invent a read-ahead or veto and mentions the name and hometown change."}
  - name: negative-abuser-veto
    vars:
      person_and_portrayal: "My stepfather, who was violent to me as a child. He still lives nearby and has threatened me before. The book describes the abuse."
      offer: "Tell him he can approve everything, I just want to keep him calm."
    assert:
      - {type: llm-rubric, value: "Raises safety concerns about contacting someone who has threatened the writer, suggests thinking it through with a trusted person or support service first, and cautions against offering approval rights the writer may not want to honour rather than simply writing the letter as asked."}
