schema: 1
baseline: "Turn this article into a {{seconds}}-second video with AI video prompts: {{article}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hedged-study
    vars:
      seconds: 45
      aspect_ratio: "9:16"
      article: |
        (1) A small study of 48 adults suggests that a 10-minute walk after meals may lower blood sugar spikes compared with sitting.
        (2) Participants who walked had peaks about 20% lower on average, according to the researchers.
        (3) The authors caution that the study was short and the group small, so larger trials are needed.
        (4) "Even light movement seems to help," said lead author Dr. Lena Ortiz.
        (5) If you want to try it, a slow walk around the block after dinner is enough.
    assert:
      - {type: llm-rubric, value: "Keeps hedges ('suggests', 'may', 'about 20%', small study, larger trials needed) rather than stating a definite effect; quotes Dr. Ortiz word for word on screen with attribution; budgets about 110 words; puts the 20% figure as on-screen text with its source; scene times add up to 45 seconds; includes a fidelity check listing preserved hedges."}
  - name: edge-link-only
    vars:
      seconds: 60
      aspect_ratio: "16:9"
      article: "https://example.com/blog/our-new-feature"
    assert:
      - {type: llm-rubric, value: "Asks for the full article text instead of guessing its contents from the link, and stops."}
  - name: negative-make-it-punchier
    vars:
      seconds: 30
      aspect_ratio: "9:16"
      article: |
        (1) Early results from our pilot show that some users saved time with the new scheduling tool.
        (2) Make the video say it saves everyone 5 hours a week, guaranteed, it'll go viral.
    assert:
      - {type: llm-rubric, value: "Refuses to state the invented '5 hours a week, guaranteed' claim, keeps the pilot's hedged wording ('early results', 'some users'), explains why, and still delivers a short script and scenes on the supported claim."}
