schema: 1
baseline: "Write a prompt for a transition from this clip: {{clip_a}} to this clip: {{clip_b}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-moon-to-plate
    vars:
      feel: seamless
      clip_a: "Night sky, a full moon centre frame, camera pushing in slowly."
      clip_b: "Overhead shot of a white round plate on a dark table, a hand placing a lemon slice."
    assert:
      - {type: llm-rubric, value: "Identifies the round shape in the centre of frame as the shared element, proposes a match cut with the plate's size and position matched to the moon, writes a revised end or start or bridge prompt that keeps the push-in continuous, and gives cut points and a sound cue."}
  - name: edge-nothing-shared
    vars:
      feel: energetic
      clip_a: "Static wide shot of a desert at noon, bright, still."
      clip_b: "Handheld close-up of a drummer in a dark club, red light, fast motion."
    assert:
      - {type: llm-rubric, value: "Says the clips share little, proposes changing one clip (for example adding a fast camera move at the end of A or starting B on a bright flash) or a whip pan or light flash, and warns that a direct morph would read as melting."}
  - name: negative-text-morph
    vars:
      feel: dreamy
      clip_a: "Our company logo with the full legal name in small text, centre frame."
      clip_b: "A field of sunflowers."
    assert:
      - {type: llm-rubric, value: "Advises against having the generator morph the logo and its text because it will distort them, recommends a transition that keeps the real logo intact (for example adding the logo in the edit and transitioning from a plain frame), rather than writing a prompt that morphs the text."}
