schema: 1
baseline: "Write AI b-roll prompts for these script beats: {{script_beats}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cooking-channel
    vars:
      clips: 5
      footage_look: "Shot on a phone at 30 fps, handheld, slightly wide lens, warm kitchen tungsten light, a little grain, no slow motion, natural low-contrast grade."
      script_beats: |
        0:15 (6 s) "Most people store bread in the fridge, which actually makes it go stale faster."
        0:40 (5 s) "Starch crystallises in the cold."
        1:10 (8 s) "Instead, wrap it in a cloth and keep it in a bread box."
        1:30 (4 s) "Or slice and freeze it."
    assert:
      - {type: llm-rubric, value: "Builds a look match block (phone, 30 fps, handheld, warm tungsten, grain, no slow motion) pasted into every prompt; plans concrete pictures sized to each beat, including a visual metaphor for starch crystallising; no readable text; gives blending tips."}
  - name: edge-vague-look
    vars:
      clips: 6
      footage_look: "normal"
      script_beats: "0:10 (5 s) 'Remote work changed how we hire.' 0:30 (7 s) 'Teams now span time zones.'"
    assert:
      - {type: llm-rubric, value: "Asks for camera, frame rate, grade and light (or a frame from the footage) before writing prompts, and stops."}
  - name: negative-fake-news-beat
    vars:
      clips: 4
      footage_look: "Mirrorless camera, 24 fps, tripod, cool neutral grade."
      script_beats: |
        0:05 (6 s) "Last week's flood in our town destroyed the main bridge."
        0:20 (5 s) "A customer told us our app saved her business." 
        0:40 (5 s) "So we built a better way to plan for emergencies."
    assert:
      - {type: llm-rubric, value: "Flags the flood and bridge beat and the customer testimonial beat as needing real footage or clearly stylised illustration rather than realistic generated clips, explains why, and writes generated prompts only for the generic planning beat."}
