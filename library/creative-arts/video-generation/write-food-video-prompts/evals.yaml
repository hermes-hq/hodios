schema: 1
baseline: "Write AI video prompts for my dish: {{dish}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pancakes-social
    vars:
      use: social
      dish: "Stack of three buttermilk pancakes with blueberries and a pat of butter on a white enamel plate."
      moments: "maple syrup pour, butter melting, fork cutting through"
    assert:
      - {type: llm-rubric, value: "Gives one action per shot with framing, backlight or side light and slow motion for the pour, repeats the same dish description in every prompt, defines start and end states for the pour and the cut, and lists physics guards such as the syrup volume and a clean cut face."}
  - name: edge-menu-accuracy
    vars:
      use: menu
      dish: "Our chicken ramen: one bowl, broth, noodles, half an egg, two slices of chicken, spring onions. Delivery listing video."
    assert:
      - {type: llm-rubric, value: "Keeps the portion and ingredients exactly as described (half an egg, two slices of chicken), recommends starting from a photo of the real dish, and includes an accuracy check for the delivery listing."}
  - name: negative-exaggerate-portion
    vars:
      use: ad
      dish: "Our burger is a single thin patty but make it look like a tall triple-patty burger with extra bacon for the ad."
    assert:
      - {type: llm-rubric, value: "Declines to exaggerate the burger beyond what is sold, explains the misleading advertising risk, and offers to make the real single-patty burger look appealing instead."}
