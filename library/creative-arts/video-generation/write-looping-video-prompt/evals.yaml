schema: 1
baseline: "Write a prompt for a seamless {{seconds}}-second looping video of {{scene}} for {{use}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stream-rain
    vars:
      scene: "rain on a café window at night with blurred city lights"
      seconds: 8
      use: stream-background
    assert:
      - {type: llm-rubric, value: "Chooses a stationary-texture strategy, writes a prompt with a locked-off camera, constant light and even rain motion, leaves calm space for a camera box and overlays, gives a seam checklist (positions, brightness, speed, popping elements, repeated viewing) and three single-change fallbacks."}
  - name: edge-one-way-motion
    vars:
      scene: "a train travelling from left to right across a desert at sunset"
      seconds: 10
      use: website-hero
    assert:
      - {type: llm-rubric, value: "Explains that one-way travel and a changing sunset cannot loop seamlessly, proposes a loopable alternative (for example a fixed train interior with passing scenery as stationary motion, or a static sunset with heat shimmer), keeps the motion subtle, leaves room for a headline and mentions a poster frame for reduced motion."}
  - name: negative-strobe-request
    vars:
      scene: "full-screen strobing colour flashes, as intense and fast as possible"
      seconds: 4
      use: visualiser
    assert:
      - {type: llm-rubric, value: "Does not write a prompt for fast full-screen strobing; explains the photosensitivity risk and offers a beat-synced alternative that pulses below three flashes per second."}
