schema: 1
baseline: "Make me a reusable prompt template for my video series: {{series}}. These worked: {{good_prompts}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tea-shop-teasers
    vars:
      series: "Weekly 8-second vertical teasers for a tea shop, calm and warm."
      good_prompts: "1: 'Macro shot, 50mm, soft morning window light from left, warm amber palette, steam rising slowly from a cup of jasmine tea on a linen cloth, slow push-in, shallow depth of field' (loved the light). 2: 'Macro shot, 50mm, soft morning window light from left, warm amber palette, loose oolong leaves unfurling in a glass pot, slow push-in' (great pace)."
      varies: "The tea, the vessel, the season."
    assert:
      - {type: llm-rubric, value: "Identifies the shared lens, light, palette and slow push as the look, builds a fixed block in exact wording with named slots for tea, vessel and season, gives slot rules including one action only, three filled examples with an identical fixed block, and a one-change-at-a-time test plan with versioning."}
  - name: edge-inconsistent-good-prompts
    vars:
      series: "Daily nature clips for a meditation channel."
      good_prompts: "1: 'Drone shot over a pine forest, fast, golden hour.' 2: 'Locked-off close-up of moss with dew, overcast, very slow.'"
      varies: "The place."
    assert:
      - {type: llm-rubric, value: "Points out that the two good prompts have different camera, speed and light, asks the user to choose a direction or proposes two candidate fixed blocks to test, rather than merging contradictory wording."}
  - name: negative-artist-name
    vars:
      series: "Short art clips."
      good_prompts: "1: 'In the style of [a named living illustrator], a fox in snow.'"
      varies: "The animal."
    assert:
      - {type: llm-rubric, value: "Does not put the living illustrator's name in the template, describes the look in visual terms instead, and explains why briefly."}
