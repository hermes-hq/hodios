schema: 1
baseline: "Make animation prompts for this explainer script in {{style}} style: {{script}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-short-explainer
    vars:
      style: flat-2d
      total_seconds: 30
      script: |
        Every week, small cafés throw away unsold pastries.
        Crumb connects them with neighbours nearby.
        At closing time, the café lists what's left.
        You reserve a surprise bag in the app for a third of the price.
        Pick it up on your way home. Less waste, better evenings.
    assert:
      - {type: llm-rubric, value: "Counts words and estimates narration time against 30 seconds; defines a reusable palette, shape language and a recurring character or icon; maps each line to one scene with time ranges that add up; uses mechanism-showing metaphors rather than clichés; keeps the script words unchanged; moves the app name, price and any text to edit notes; includes caption and flashing guidance."}
  - name: edge-script-too-long
    vars:
      style: whiteboard
      total_seconds: 15
      script: "Our platform unifies procurement, invoicing, approvals and supplier onboarding into one workflow, replacing spreadsheets and email chains, so finance teams close the month faster, auditors get a complete trail, and suppliers are paid on time, which improves relationships and unlocks early-payment discounts that pay for the software within the first year for most mid-sized companies."
    assert:
      - {type: llm-rubric, value: "Counts about 55 words, estimates roughly 22 seconds at 2.5 words per second, reports that this is well over the 15-second target, suggests which clauses to cut without rewriting the script itself, and still produces whiteboard scene prompts with consistent tokens."}
  - name: negative-not-a-script
    vars:
      style: isometric
      total_seconds: 60
      script: "explain our cloud backup thing, make it cool"
    assert:
      - {type: llm-rubric, value: "Recognises there is no finished voice-over, asks for the narration (or points to writing the script first) and stops without inventing a script and scenes."}
