schema: 1
baseline: "Give me {{days}} sketchbook prompts."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-urban-sketching-month
    vars:
      focus: "urban sketching"
      level: "new to drawing, lunch breaks only"
      days: 30
    assert:
      - {type: contains, value: "| Day |"}
      - {type: llm-rubric, value: "Lists 30 daily prompts with concrete urban subjects (a doorway, a café table, a bus stop), a constraint and a short time box suited to a lunch break, sequences weekly sub-skills (shapes, perspective basics, value, people or putting it together), includes lighter catch-up days roughly weekly, repeats a subject late on to show progress, and gives weekly review questions."}
  - name: edge-short-week
    vars:
      focus: "hands"
      level: "draw weekly for a year"
      days: 7
    assert:
      - {type: llm-rubric, value: "Produces exactly 7 progressive prompts about hands with varied angles, constraints and times appropriate to an experienced learner (for example gesture, foreshortening, gripping objects), rather than a month-long plan."}
  - name: negative-not-random-nouns
    vars:
      days: 14
    assert:
      - {type: llm-rubric, value: "Without a focus, builds general observational drawing with a clear progression and constraints, rather than a list of random topics like 'a dragon' or 'happiness' with no constraint, time or skill attached."}
