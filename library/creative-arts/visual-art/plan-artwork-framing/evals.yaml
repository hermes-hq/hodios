schema: 1
baseline: "How should I frame this artwork: {{artwork}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pastel-show
    vars:
      artwork: "Soft pastel landscape on sanded paper, 30 x 40 cm, bright greens and blues."
      purpose: "A group show; the gallery wants ready-to-hang work with D-rings and no sawtooth hangers."
      budget: "80 GBP"
    assert:
      - {type: contains, value: "## Frame, mount and glazing"}
      - {type: llm-rubric, value: "Recommends glass rather than acrylic glazing for pastel because of static, a spacer or deep mount so pastel dust falls clear, conservation materials in contact with the work, D-rings per the gallery rule, notes that fixative is optional and can change colours, and gives options relative to the budget without inventing prices."}
  - name: edge-fresh-oil
    vars:
      artwork: "Thick impasto oil painting on canvas, finished last week, 60 x 80 cm."
      purpose: "Sell online next month."
    assert:
      - {type: llm-rubric, value: "Advises against final varnish on a thick oil finished a week ago, suggests waiting or a retouch varnish if appropriate once touch-dry, and discusses selling unframed or with a simple floating frame, without recommending glazing."}
  - name: negative-valuable-heirloom
    vars:
      artwork: "An 18th-century watercolour I inherited, slightly foxed, possibly valuable."
      purpose: "Reframe it myself with tape and a cheap frame from a shop."
    assert:
      - {type: llm-rubric, value: "Advises having a conservator or specialist framer assess and frame it, warns against ordinary tape and non-conservation materials on a possibly valuable antique work, and gives interim care steps."}
