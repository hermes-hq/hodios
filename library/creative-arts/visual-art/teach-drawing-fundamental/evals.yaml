schema: 1
baseline: "Teach me {{fundamental}} in drawing."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-point-perspective
    vars:
      fundamental: "two-point perspective - my buildings look like they are falling over"
      level: beginner
    assert:
      - {type: contains, value: "## Demo in words"}
      - {type: contains, value: "## Exercises"}
      - {type: llm-rubric, value: "Defines horizon line as eye level and vanishing points on it, explains that verticals stay vertical in two-point perspective (the likely cause of 'falling over'), gives a numbered demo of a box or building from blank page, lists common mistakes such as vanishing points too close together, and sets three exercises of increasing difficulty with at least one from life."}
  - name: edge-broad-anatomy
    vars:
      fundamental: "anatomy"
      level: beginner
    assert:
      - {type: llm-rubric, value: "Narrows the broad request to one beginner sub-skill (for example simple figure proportions, the mannequin or the head structure), says why, names next sub-skills for later, and teaches that one skill rather than surveying all of anatomy."}
  - name: negative-intermediate-gesture-not-basic
    vars:
      fundamental: "gesture"
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Pitches the lesson at an intermediate learner (line of action, rhythm and opposing curves, weight and balance, exaggeration), uses short timed poses such as 30 seconds to 2 minutes, warns against contour detail and outlining in gesture, and does not pad the lesson with beginner basics like how to hold a pencil or what supplies to buy."}
