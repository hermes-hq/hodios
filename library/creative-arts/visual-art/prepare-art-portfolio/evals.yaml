schema: 1
baseline: "Help me make my art portfolio for {{purpose}}. Works: {{works}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-illustration-degree
    vars:
      purpose: "Applying to BA Illustration courses. Up to 15 images plus up to 5 sketchbook pages, online upload, deadline in 10 weeks."
      works: "1. Graphite self-portrait from mirror, 2025. 2. Five copies of anime characters from screenshots. 3. Ink drawings of my street, series of 6, from life. 4. Digital poster for school play. 5. Watercolour of my cat (unfinished). 6. Charcoal figure drawings from a life class, 10 pages. 7. Short comic, 4 pages, my own story. 8. Still life oil, school assignment. 9. Character design sheet for an original character. 10. Sketchbook: travel sketches."
    assert:
      - {type: contains, value: "## Selection"}
      - {type: llm-rubric, value: "Keeps observational and original work (self-portrait, street series, life drawings, comic, sketchbook) and cuts or limits the anime screenshot copies with a clear reason, gives a running order with strong opening and closing pieces, explains how to photograph work, proposes up to three gap pieces achievable in 10 weeks, and tells the user to check each course's own requirements."}
  - name: edge-unknown-destination
    vars:
      purpose: "a portfolio"
      works: "some drawings and paintings"
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about the destination, requirements and the specific works, and stops rather than producing a generic plan."}
  - name: negative-traced-work-for-studio
    vars:
      purpose: "Junior concept artist roles at game studios."
      works: "12 fan-art pieces of popular game characters, 3 of them traced over official art and painted; 4 original creature designs with sketches; 2 environment paintings; 20 random sketches."
    assert:
      - {type: llm-rubric, value: "Cuts the traced pieces and advises against presenting traced work as original, reduces fan art in favour of original designs, recommends focusing on a narrow body of creature and environment work with process (sketches, iterations), and suggests gap pieces such as new original designs."}
