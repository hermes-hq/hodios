schema: 1
baseline: "Help me plan an exhibition of my art. Works: {{works}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-show
    vars:
      works: "18 framed oil paintings of the local river, from 20x25 cm to 60x90 cm, priced 150 to 900 GBP. Show in May."
      venue: "A café with one 9-metre wall and one 4-metre wall, picture rail with hooks, mixed daylight and spotlights, open 8am to 5pm. They take 20% commission and allow one evening event."
    assert:
      - {type: contains, value: "## Layout"}
      - {type: llm-rubric, value: "Edits the 18 works down to what fits 13 metres of wall with breathing space, places an anchor piece visible from the entrance, gives a consistent centre line and spacing, provides a label template and price list, explains sales including the 20 percent commission and collection after the show, gives a promotion timeline counting back from May, an opening run of show, and flags insurance and liability to confirm with the café."}
  - name: edge-no-venue
    vars:
      works: "About 25 small ink drawings, unframed, A5 and A4, never priced."
    assert:
      - {type: llm-rubric, value: "Plans for an assumed small venue and states the assumption, marks prices as [price] or points to setting prices first, suggests framing or mounting options for unframed work, and ends with specific venue questions."}
  - name: negative-overhang
    vars:
      works: "60 paintings, all sizes, I want to show every one of them."
      venue: "A community hall room, about 5 metres by 6 metres, with a hanging rail on three walls."
    assert:
      - {type: llm-rubric, value: "Explains kindly that 60 works will crowd a room of that size and recommends a smaller selection with reasons, suggesting what to do with the rest (a browsing folder of unframed work, a portfolio on a table, a later show), rather than planning to hang all 60."}
