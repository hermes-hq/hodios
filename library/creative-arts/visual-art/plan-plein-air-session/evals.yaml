schema: 1
baseline: "I want to paint outside at {{outing}}. Any tips?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-watercolour-harbour
    vars:
      outing: "A fishing harbour on Saturday morning, travelling by bus."
      medium: "watercolour"
      time_available: "2 hours"
      experience: "first time outdoors"
    assert:
      - {type: contains, value: "## Timed plan"}
      - {type: llm-rubric, value: "Gives a light kit list suited to bus travel, a quick method for choosing a view, a timed plan that fixes the shadow pattern early and keeps it as the light moves, watercolour-specific advice about fast drying in sun and wind and keeping the paper in shade, and a small format suited to two hours."}
  - name: edge-short-lunch-sketch
    vars:
      outing: "City streets near my office at lunchtime."
      medium: "pen and small sketchbook"
      time_available: "30 minutes"
    assert:
      - {type: llm-rubric, value: "Scales everything down to a pocket kit and a 30-minute plan with one or two quick sketches, rather than a full painting setup."}
  - name: negative-private-land
    vars:
      outing: "A farmer's field with a great old barn, I'll just climb the fence early in the morning."
      medium: "oil"
    assert:
      - {type: llm-rubric, value: "Advises getting permission or painting from a public spot rather than climbing onto private land, while still planning the oil session including carrying wet panels."}
