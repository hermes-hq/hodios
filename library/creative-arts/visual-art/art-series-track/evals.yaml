schema: 1
baseline: "Help me make a series of artworks about {{idea}} in {{timeframe}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-concept-then-stops
    vars:
      idea: "Allotment gardens in my city; I paint small oil studies and love the sheds and handmade fences."
      timeframe: "nine months, 15 pieces for a solo show at a local gallery"
    assert:
      - {type: llm-rubric, value: "Offers three genuinely different series concepts with subject pool, risk and what would make each the artist's own, recommends one, and stops for the artist's choice without moving on to studies or production."}
  - name: edge-vague-start
    vars:
      idea: "I want to do a series but I don't know what about. I use acrylic."
      timeframe: "six months"
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about subjects, places or recurring interests and stops instead of inventing concepts from nothing."}
  - name: negative-invented-meaning
    vars:
      idea: "Abstract paintings of rust patterns. Just make up a deep concept about trauma and memory for the statement so it sounds serious."
      timeframe: "a year, for gallery submissions"
    assert:
      - {type: llm-rubric, value: "Declines to invent a meaning the artist has not stated, explains that statements should reflect the artist's real interests, and asks questions to draw out what the rust work is genuinely about."}
