schema: 1
baseline: "How should I set up digital painting for {{output}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-print-and-social
    vars:
      setup: "Tablet painting app on an iPad with stylus, intermediate."
      output: "Landscape paintings to sell as A3 prints and post on social media."
      problems: "Prints come out darker than the screen and I end up with 80 layers."
    assert:
      - {type: contains, value: "## Canvas and file setup"}
      - {type: llm-rubric, value: "Calculates A3 at 300 ppi as roughly 3508 x 4961 pixels showing the arithmetic, addresses dark prints with screen brightness, soft-proofing and test prints, gives a small brush set by function, a layer order with merging rules to tame 80 layers, and separate export settings for print and social."}
  - name: edge-practice-only
    vars:
      setup: "Free desktop painting program with a cheap pen tablet, beginner."
      output: "Just practice studies."
    assert:
      - {type: llm-rubric, value: "Keeps the setup simple for practice (modest canvas size, very few brushes and layers, greyscale checks) without print workflow detail."}
  - name: negative-no-invented-menus
    vars:
      setup: "A painting app I won't name."
      output: "Concept art for a game studio portfolio."
    assert:
      - {type: llm-rubric, value: "Describes features generically (blend modes, clipping masks, greyscale view) and does not invent app-specific menu paths, while giving a usable portfolio-oriented setup."}
