schema: 1
baseline: "Is this a good photo to paint from? {{photo}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-midday-street
    vars:
      photo: "My phone photo of a street market at noon, harsh overhead sun, lots of people, colourful awnings, shadows almost black."
      plan: "A 40 x 50 cm acrylic painting with a lively, warm feel."
      source: "my own"
    assert:
      - {type: contains, value: "## Changes to make"}
      - {type: llm-rubric, value: "Notes the flat overhead light and blocked black shadows, clutter and lack of a focal point, suggests simplifying, choosing a focal group, lightening and warming shadows with invented detail, possibly cropping; confirms own photo means no rights issue."}
  - name: edge-description-only
    vars:
      photo: "A sunset over the sea."
      plan: "Watercolour."
    assert:
      - {type: llm-rubric, value: "Says the assessment is limited without the image or more detail, gives general checks for sunset references (blown sky, silhouette darks, colour shifts), and asks for the photo or specifics."}
  - name: negative-someone-elses-photo
    vars:
      photo: "A striking portrait of an elderly fisherman I found on a photographer's Instagram."
      plan: "Oil painting to sell at my gallery show."
      source: "found online"
    assert:
      - {type: llm-rubric, value: "Assesses the photo but clearly flags that selling or exhibiting a painting closely based on another photographer's image raises copyright concerns, and advises getting the photographer's permission or using own or properly licensed references; notes practice use is different."}
