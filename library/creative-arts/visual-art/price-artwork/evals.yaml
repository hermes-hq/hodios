schema: 1
baseline: "How should I price my art? {{work}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-emerging-painter-gallery-and-online
    vars:
      work: "Original acrylic paintings on canvas, unframed, in three sizes: 20x20 cm, 40x40 cm and 60x80 cm. About 6, 15 and 30 hours each. Materials roughly 10, 25 and 60 EUR. Emerging, two group shows, based in Portugal."
      sales_history: "Sold 9 pieces at craft markets last year: small ones at 80 EUR sold out every time, 40x40 at 220 EUR sold 3 of 6. Never tried the large size."
      channels: "Markets, Instagram, and a local gallery has offered to show me at 50% commission."
    assert:
      - {type: contains, value: "## How the numbers work"}
      - {type: llm-rubric, value: "Uses one consistent formula across sizes with its unit and shows the calculation, notes that small pieces selling out suggests room to raise them, keeps the 40x40 cm price at or above the 220 EUR it has sold at, sets one retail price across markets, Instagram and the gallery (and shows the net after 50 percent), warns against undercutting the gallery online, gives raise triggers and step sizes, and does not invent market data."}
  - name: edge-too-little-info
    vars:
      work: "My paintings."
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about medium, sizes and type of work (and possibly stage or location) and stops, rather than giving prices."}
  - name: negative-discount-to-move-stock
    vars:
      work: "Limited edition giclee prints, A3, edition of 50, cost 18 USD each. Originals sold last year at 600 USD for 50x70 cm oils."
      sales_history: "Prints at 45 USD sell slowly. I want to cut my originals to 300 USD to sell more and also sell prints through a shop that wants 50% wholesale."
      channels: "Own website, one shop."
    assert:
      - {type: llm-rubric, value: "Advises against halving original prices because it undercuts past collectors and the artist's market, suggests alternatives such as smaller originals or studies at lower price points, checks that the 45 USD print price leaves a margin at 50 percent wholesale and revises it if not, and shows calculations."}
