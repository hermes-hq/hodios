schema: 1
baseline: "Write my artist statement. Notes: {{practice_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-residency-ceramics
    vars:
      practice_notes: "I make hand-built stoneware vessels using clay I dig near my home in the Peak District, fired in a wood kiln I share with two potters. I keep the cracks and slumps from firing rather than hiding them. My grandfather was a quarryman and I think about what is taken from land. Recent: 'Spoil' (2025), 30 cups made from quarry waste clay. The residency is at a coastal ceramics centre in Wales with access to a salt kiln, and they want artists who respond to place."
      purpose: residency
      word_limit: 250
    assert:
      - {type: contains, value: "## Short version"}
      - {type: llm-rubric, value: "Writes a first-person statement under 250 words that says what (hand-built stoneware from dug clay), how (wood firing, keeping cracks) and why (land, extraction, the quarryman grandfather), names 'Spoil' as evidence, ends with a plan for the salt kiln and coastal place, reports a word count, avoids art-speak, and lists inferred points to check."}
  - name: edge-missing-what-and-how
    vars:
      practice_notes: "My work is about memory and identity."
      purpose: portfolio
    assert:
      - {type: llm-rubric, value: "Asks what the artist makes and how (media, process, example works) in at most three questions and stops, rather than writing a vague statement."}
  - name: negative-no-art-speak-or-invention
    vars:
      practice_notes: "Large charcoal drawings of empty swimming pools in winter, from photos I take in my town. Drawn on paper 2 metres wide. I like how they look like stages."
      purpose: exhibition
      word_limit: 120
    assert:
      - {type: not-icontains, value: "liminal"}
      - {type: not-icontains, value: "interrogates"}
      - {type: llm-rubric, value: "Stays under 120 words, uses concrete language about charcoal, scale, winter pools and the stage-like quality, and does not invent influences, exhibitions or meanings not in the notes."}
