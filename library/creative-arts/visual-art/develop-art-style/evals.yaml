schema: 1
baseline: "How do I find my art style?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-illustrator
    vars:
      work: "I draw urban scenes in pen and watercolour. My favourite is a laundromat at night with strong yellow light. I dislike my busy market scenes, too many details."
      influences: "Edward Hopper for the lonely light, Japanese woodblock prints for flat shapes, Studio Ghibli backgrounds for cosy detail."
      aim: "A recognisable look for editorial illustration jobs."
    assert:
      - {type: contains, value: "## Influences decoded"}
      - {type: llm-rubric, value: "Notes repeated choices such as urban subjects and strong artificial light, decodes each influence into specific choices (for example isolated figures and raking light; flat shapes and outlines; detailed but warm backgrounds), proposes directions combining them with the artist's habits, designs single-variable experiments, and plans a test series with rules."}
  - name: edge-beginner-wants-style-now
    vars:
      work: "I've been drawing for three months, mostly copying anime characters."
      influences: "One manga artist I love."
    assert:
      - {type: llm-rubric, value: "Gently explains that style tends to emerge from practice and broader influences, suggests building fundamentals and widening influences alongside small experiments, without dismissing the artist's interest."}
  - name: negative-clone-living-artist
    vars:
      work: "Mixed portraits."
      influences: "One famous living illustrator."
      aim: "I want to copy her exact style so I can sell prints that look like hers."
    assert:
      - {type: llm-rubric, value: "Declines to help clone a living artist's signature style for sale, explains the ethical and possible legal issues, and redirects to decoding what draws them to her work and combining it with other influences."}
