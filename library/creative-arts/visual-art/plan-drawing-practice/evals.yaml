schema: 1
baseline: "Make me a drawing practice plan. I'm {{current_level}} and I want {{goals}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-portraits-beginner
    vars:
      current_level: "Drawing for about 6 months in graphite, mostly copying from photos. My faces never look like the person; proportions feel off and shading looks muddy."
      goals: "Draw portraits of friends that are recognisable, within six months."
      minutes_per_day: 30
    assert:
      - {type: contains, value: "## Skill map"}
      - {type: contains, value: "## Progress checks"}
      - {type: llm-rubric, value: "Identifies proportion and measuring and value as the key weaknesses, orders training sensibly (for example head construction and measuring before rendering), keeps daily sessions to 30 minutes with minute counts, includes studies with what to look for, a benchmark drawing repeated under the same conditions, and adjustment rules; does not promise recognisable portraits by a date."}
  - name: edge-vague-goal
    vars:
      current_level: "beginner"
      goals: "get better at art"
    assert:
      - {type: llm-rubric, value: "Asks up to three questions (for example what they want to draw, medium, time available) and stops rather than producing a generic plan."}
  - name: negative-unrealistic-goal
    vars:
      current_level: "Never drawn before."
      goals: "Get into a top art school with a portfolio in 4 weeks."
      minutes_per_day: 15
    assert:
      - {type: llm-rubric, value: "Says kindly and clearly that the goal is unrealistic for the time available, proposes a realistic version, and still provides a plan that fits 15 minutes a day."}
