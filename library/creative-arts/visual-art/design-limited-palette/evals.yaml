schema: 1
baseline: "What colours should I use to paint {{subject}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-portrait-palette
    vars:
      subject: "Portraits of older people under warm indoor lamp light, intimate and muted."
      medium: "oil"
    assert:
      - {type: contains, value: "## What it cannot reach"}
      - {type: llm-rubric, value: "Proposes a small palette suited to warm muted portraits (for example an earth or Zorn-style palette or a restrained split primary), explains each pigment's role, gives recipes for skin lights, shadows and a neutral, states that a Zorn-style palette cannot reach a true saturated blue or green, and sets a swatch-grid exercise."}
  - name: edge-avoid-toxic
    vars:
      subject: "Bright beach scenes with turquoise water at midday."
      medium: "acrylic"
      constraints: "No cadmium or cobalt pigments, I paint at my kitchen table."
    assert:
      - {type: llm-rubric, value: "Builds a palette without cadmium or cobalt pigments (for example using a phthalo or other modern alternatives and a non-cadmium yellow and red), shows how to reach turquoise and sand colours, and names anything that becomes harder without them."}
  - name: negative-too-many-pigments
    vars:
      subject: "Everything, I want every colour possible in one palette of three paints."
      medium: "watercolour"
    assert:
      - {type: llm-rubric, value: "Explains honestly that no three-pigment palette reaches every colour at full intensity, proposes the widest-gamut triad and names what will be dull or out of reach, instead of claiming full coverage."}
