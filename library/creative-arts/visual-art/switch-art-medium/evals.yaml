schema: 1
baseline: "How do I switch from {{from_medium}} to {{to_medium}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-digital-to-watercolour
    vars:
      from_medium: "Three years of digital painting in Procreate, mostly character art."
      to_medium: "watercolour"
      context: "I want to paint in a sketchbook while travelling."
    assert:
      - {type: contains, value: "## What is different"}
      - {type: llm-rubric, value: "Names specific differences such as no undo or layers, planning light to dark and saving whites, controlling water and timing, transparency and drying lighter; proposes a small travel kit, week-by-week bridging exercises like wash and value drills, and a first project suited to watercolour."}
  - name: edge-no-solvents
    vars:
      from_medium: "acrylic"
      to_medium: "oil"
      context: "I live in a small flat and cannot use solvents."
    assert:
      - {type: llm-rubric, value: "Addresses the no-solvents limit with water-mixable oils or solvent-free cleaning with oil and soap, and explains slower drying and fat over lean for an acrylic painter."}
  - name: negative-generic
    vars:
      from_medium: "graphite"
      to_medium: "soft pastel"
    assert:
      - {type: llm-rubric, value: "Gives pastel-specific guidance (layering limits and tooth of the paper, working dark to light or broad to fine, dust safety, fixing and framing behind glass) rather than generic painting advice."}
