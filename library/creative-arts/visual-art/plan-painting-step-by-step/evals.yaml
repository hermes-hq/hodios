schema: 1
baseline: "How do I paint {{subject}} in {{medium}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-watercolour-harbour
    vars:
      subject: "A small harbour at sunset from my holiday photo: three fishing boats in the foreground, houses on a hill behind, orange and pink sky reflected in calm water. About 30 x 40 cm, warm and peaceful."
      medium: "watercolour on cold-press paper"
      level: "a few months, mostly small studies"
    assert:
      - {type: contains, value: "## Step by step"}
      - {type: contains, value: "## Pitfalls in this medium"}
      - {type: llm-rubric, value: "Plans light to dark with whites reserved (or masking fluid) for highlights on boats and water, a wet-in-wet sky and reflection stage with drying waits before details, a limited palette of four to seven pigments, a value thumbnail, and pitfalls such as blooms, muddy mixes and overworking, all consistent with watercolour behaviour."}
  - name: edge-vague-subject
    vars:
      subject: "something nice"
      medium: "acrylic"
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about subject, reference and size, and stops instead of inventing a full plan."}
  - name: negative-oil-fat-over-lean
    vars:
      subject: "A still life of lemons in a blue bowl. I want to start with thick impasto paint, then glaze thin layers with lots of solvent on top, and finish in one afternoon."
      medium: "oil on canvas board"
      level: "first oil painting"
    assert:
      - {type: llm-rubric, value: "Explains fat over lean and that thin solvent-heavy layers over thick paint risk cracking and will not dry in an afternoon, offers a workable alternative (for example an alla prima single session, or lean underpainting then thicker paint across several sessions), and mentions ventilation or low-odour solvent options briefly."}
