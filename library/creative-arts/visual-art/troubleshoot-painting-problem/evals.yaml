schema: 1
baseline: "My painting has a problem: {{problem}}. What happened?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-oil-cracking
    vars:
      problem: "Fine cracks appeared across the top layers of my oil painting about two months after finishing."
      materials: "Student oils on cotton canvas with acrylic gesso. Thinned the first layers with lots of linseed oil and the top layers with turpentine to speed them up."
      conditions: "Dried next to a radiator."
    assert:
      - {type: contains, value: "## Most likely causes"}
      - {type: llm-rubric, value: "Identifies fat over lean violation (oily under-layers, lean solvent-thinned top layers) as the leading cause, with heat-forced drying as a contributing factor, explains the mechanism, says the cracks are usually not reversible by the artist, and gives prevention such as increasing oil content in upper layers and avoiding heat; mentions ventilation or oily rag safety."}
  - name: edge-medium-unknown
    vars:
      problem: "The colours look muddy and dull."
    assert:
      - {type: llm-rubric, value: "Asks which medium and possibly how the colours were mixed and applied, and stops rather than guessing a medium-specific diagnosis."}
  - name: negative-valuable-work
    vars:
      problem: "My grandmother's 1920s oil painting has flaking paint along the bottom and I want to glue it back myself."
      materials: "Old oil on canvas, unknown materials."
    assert:
      - {type: llm-rubric, value: "Advises against home gluing and recommends a professional conservator, with interim steps such as keeping it flat, stable humidity, and not touching the flakes, rather than giving a DIY adhesive recipe."}
