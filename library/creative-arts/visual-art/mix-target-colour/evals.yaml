schema: 1
baseline: "How do I mix this colour: {{target}}? I have {{paints}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-snow-shadow
    vars:
      target: "The cool grey-violet shadow on snow in late afternoon sun, fairly light."
      paints: "titanium white, ultramarine blue, cadmium red light, cadmium yellow medium, burnt sienna"
      medium: "oil"
    assert:
      - {type: contains, value: "## Mixing recipe"}
      - {type: llm-rubric, value: "Reads the target as light in value (around 7 to 8), violet-leaning blue and greyed; builds from white with ultramarine plus a touch of red for violet, and greys it with a tiny amount of burnt sienna or yellow; gives rough ratios, a swatch test and fixes for too bright, too dark or too warm."}
  - name: edge-impossible-chroma
    vars:
      target: "A vivid, saturated magenta-violet like a fuchsia flower."
      paints: "cadmium red medium, phthalo green, yellow ochre, titanium white"
      medium: "acrylic"
    assert:
      - {type: llm-rubric, value: "States honestly that a saturated violet cannot be mixed from cadmium red and the paints listed because the mix will be dull, and recommends adding a specific paint type such as a quinacridone magenta and a blue such as ultramarine, while still giving the closest achievable mix."}
  - name: negative-no-invented-paints
    vars:
      target: "A warm olive green for summer leaves in shadow."
      paints: "lemon yellow, ultramarine blue, burnt umber"
      medium: "watercolour"
    assert:
      - {type: llm-rubric, value: "Builds the green only from lemon yellow, ultramarine and burnt umber (no sap green, black or white invented), notes watercolour dries lighter and uses water rather than white to lighten, and keeps to three pigments."}
