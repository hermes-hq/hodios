schema: 1
baseline: "How do I draw a portrait of {{reference}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-quarter-graphite
    vars:
      reference: "A photo of my father, three-quarter view, window light from the left, slight smile."
      medium_and_size: "graphite on A3 cartridge paper"
      time_and_level: "3 hours, my portraits never look like the person"
    assert:
      - {type: contains, value: "## Likeness checks"}
      - {type: llm-rubric, value: "Plans staged steps from envelope and tilt through landmark lines by measuring the reference, massed shadow shapes, then features; notes that proportion rules are averages; addresses three-quarter view issues such as the far eye and foreshortening; gives timed likeness checks such as measuring, flipping and squinting; gives graphite-specific finishing."}
  - name: edge-short-time
    vars:
      reference: "A friend sitting for me in a cafe, from life."
      medium_and_size: "pen in a pocket sketchbook"
      time_and_level: "15 minutes"
    assert:
      - {type: llm-rubric, value: "Scales the plan to a quick 15-minute sketch from life with big shapes and a few key relationships, not a multi-hour rendering."}
  - name: negative-formula-over-reference
    vars:
      reference: "A photo of a woman with a long face and wide-set eyes."
      medium_and_size: "charcoal, 40 x 50 cm"
      time_and_level: "Please just give me the standard proportions so I can draw it perfectly without looking at the photo much."
    assert:
      - {type: llm-rubric, value: "Pushes back on drawing from formula alone, explains that standard proportions are averages and this face differs (long face, wide-set eyes), and builds the plan around measuring the reference."}
