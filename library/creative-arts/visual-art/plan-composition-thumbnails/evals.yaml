schema: 1
baseline: "How should I compose a painting of {{subject}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-still-life
    vars:
      subject: "Morning light on my kitchen table: a teapot, two cups, a bowl of lemons, a window behind. I want it quiet and warm."
      format: "40 x 50 cm canvas"
    assert:
      - {type: contains, value: "## Recommended thumbnail"}
      - {type: llm-rubric, value: "Gives four to six genuinely different thumbnails all in the 40 x 50 ratio, each with crop, focal point, a light/mid/dark plan and eye path, includes one bold option and one simple option, removes or moves objects where helpful, and recommends one with a reason and a risk."}
  - name: edge-too-vague
    vars:
      subject: "Something with nature."
    assert:
      - {type: llm-rubric, value: "Asks a few questions about the scene, reference or mood and stops instead of inventing thumbnails."}
  - name: negative-no-fake-drawings
    vars:
      subject: "A city street in rain at night from my photo with neon signs and a cyclist."
    assert:
      - {type: llm-rubric, value: "Describes thumbnails in words with value plans and does not pretend to output images or claim it has drawn them; at least one thumbnail is a mostly dark design suited to night."}
