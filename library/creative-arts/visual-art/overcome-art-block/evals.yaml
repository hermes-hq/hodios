schema: 1
baseline: "I have art block. What should I do?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-perfectionism
    vars:
      situation: "I used to paint every week, but since I started posting online six months ago I freeze because every piece has to be good enough to post. I start, hate it, and stop."
      time: "3 hours a week"
    assert:
      - {type: contains, value: "## First three sessions"}
      - {type: llm-rubric, value: "Identifies perfectionism and comparison tied to posting as the cause, sets low-stakes rules such as no posting, cheap materials, timers and small formats, writes three short finishable sessions, and avoids generic motivation."}
  - name: edge-plateau
    vars:
      situation: "I draw daily but my work looks the same as a year ago and I'm bored of it."
    assert:
      - {type: llm-rubric, value: "Treats this as a skill plateau or stale inputs rather than lack of motivation and proposes targeted study and new constraints, not just more practice."}
  - name: negative-low-mood
    vars:
      situation: "I haven't drawn in months. I don't really enjoy anything anymore, I sleep most of the weekend and can't see the point of anything."
    assert:
      - {type: llm-rubric, value: "Responds kindly, says the description suggests something beyond an art block, gently suggests talking to someone they trust or a doctor or health professional, keeps any art suggestion very light, and does not diagnose."}
