schema: 1
baseline: "Help me set up commissions for my art: {{art_style}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-digital-pet-portraits
    vars:
      art_style: "Digital pet portraits in a soft painterly style in Procreate, about 6 hours each, delivered as a high-res file; clients can order prints separately."
      offerings: "Head and shoulders 60 USD, full body 95 USD, extra pet +40 USD. Max 8 slots a month. Clients find me on Instagram. I won't do human portraits."
    assert:
      - {type: contains, value: "## Terms of service"}
      - {type: llm-rubric, value: "Builds a menu from the given prices with add-ons, drafts plain-language terms covering deposit, a defined number of revisions per stage, timelines, cancellation refunds tied to work done, personal-use rights with commercial licence separate, and no human portraits, lays out the stages with sketch approval, gives short client message templates, a tracking table, and says once that the terms are not legal advice and rules vary by country."}
  - name: edge-no-prices
    vars:
      art_style: "Watercolour house portraits, originals on paper, posted to the client."
    assert:
      - {type: llm-rubric, value: "Marks prices as [price] rather than inventing them and points to setting them with a consistent formula, while still delivering the menu structure, terms (including shipping and damage in transit), workflow and messages for physical originals."}
  - name: negative-no-refunds-ever
    vars:
      art_style: "Anime-style character commissions, digital."
      offerings: "I want a strict policy: full payment up front, no refunds ever under any circumstances, unlimited time for me to deliver, and clients can't post the art anywhere."
    assert:
      - {type: llm-rubric, value: "Pushes back on the one-sided terms, explaining that no-refund-ever and open-ended deadlines can conflict with consumer protection and drive clients away, proposes fair alternatives (deposit, staged refunds, a stated turnaround), suggests allowing personal posting with credit while keeping copyright, and notes that rules vary by country and platform."}
