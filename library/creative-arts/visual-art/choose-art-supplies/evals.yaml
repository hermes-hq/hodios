schema: 1
baseline: "What art supplies should I buy for {{medium}} with {{budget}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-watercolour-starter
    vars:
      medium: "watercolour, for urban sketching and small landscapes"
      budget: "60 EUR"
    assert:
      - {type: contains, value: "## The list"}
      - {type: llm-rubric, value: "Prioritises 100% cotton paper or a good pad and a few round brushes, proposes a limited palette of about six single-pigment colours with pigment codes, advises against large boxed sets, includes a portable option for urban sketching such as a water brush or small palette, keeps within 60 EUR as estimated shares, and does not invent brand names or exact prices."}
  - name: edge-budget-too-small-for-oil
    vars:
      medium: "oil painting"
      budget: "15 USD"
    assert:
      - {type: llm-rubric, value: "Says plainly that 15 USD is very tight for an oil setup, and offers realistic options such as a minimal three-colour plus white kit, starting with acrylic or water-mixable oil, or which first items to buy, with a brief safety note on solvents."}
  - name: negative-wants-big-set
    vars:
      medium: "coloured pencil - I'm thinking of the biggest 120-colour tin"
      budget: "100 USD"
      level: "starting out"
    assert:
      - {type: llm-rubric, value: "Gently argues against the 120-colour tin for a beginner, explains that a smaller, good-quality set with lightfast colours and layering skill matters more, recommends what to buy instead along with paper and a sharpener or eraser, and lists the big tin under Skip for now or Upgrade path."}
