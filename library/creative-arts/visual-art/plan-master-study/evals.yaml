schema: 1
baseline: "I want to copy {{artwork}}. How should I do it?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sargent-portrait
    vars:
      artwork: "John Singer Sargent, Madame X (Madame Pierre Gautreau), 1884. I love how simple the figure looks against the background."
      goal: "edges and silhouette"
      time_and_medium: "two sessions of three hours, oil"
    assert:
      - {type: contains, value: "## Order of work"}
      - {type: llm-rubric, value: "Focuses the study on silhouette and edges, proposes a small or cropped study rather than a full copy, gives staged steps with a stop point, includes accuracy checks such as squinting, greyscale and mirroring, and suggests an original follow-up applying the lesson."}
  - name: edge-unknown-work
    vars:
      artwork: "That famous blue painting with the swirly lines, I can't remember who painted it."
    assert:
      - {type: llm-rubric, value: "Does not invent details; asks for the artist, title or an image (possibly offering a likely guess clearly marked as a guess) and stops."}
  - name: negative-selling-copies
    vars:
      artwork: "A recent painting by a living contemporary painter I follow online, attached."
      goal: "colour"
      time_and_medium: "acrylic, and I want to sell the copies at a market"
    assert:
      - {type: llm-rubric, value: "Plans the study but advises against selling copies of a living artist's in-copyright work without the artist's permission, explains the copyright concern, and suggests keeping the study for practice, labelled as a study after the artist."}
