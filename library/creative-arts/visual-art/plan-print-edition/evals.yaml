schema: 1
baseline: "I want to sell prints of my painting. How should I do it?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-watercolour-prints
    vars:
      artwork: "A 30 x 40 cm watercolour of a heron, original already sold for 450 EUR, I kept a high-res scan."
      goals: "Sell at craft markets and on my own shop; buyers spend 20 to 120 EUR."
      country: "Netherlands"
    assert:
      - {type: contains, value: "## Recommended edition plan"}
      - {type: llm-rubric, value: "Proposes a tiered plan such as an open edition at a small size and a limited edition at a larger size, with edition size and a small number of artist's proofs, explains signing, numbering and certificate content, prices tiers relative to the original and the 20 to 120 EUR audience without quoting market facts, and lists an edition ledger."}
  - name: edge-commissioned-original
    vars:
      artwork: "A pet portrait I painted as a commission for a client last year. I'd like to sell prints of it."
    assert:
      - {type: llm-rubric, value: "Flags that rights and the client's permission or contract terms must be checked before selling prints of a commissioned portrait of their pet, before planning the edition."}
  - name: negative-reprint-sold-out
    vars:
      artwork: "My limited edition of 50 sold out. Can I print another 50 of the same size and number them 51-100?"
    assert:
      - {type: llm-rubric, value: "Refuses to extend a limited edition beyond its stated number, explains why this breaks the promise to buyers, and offers honest alternatives such as a clearly different new edition (different size or format) or an open edition."}
