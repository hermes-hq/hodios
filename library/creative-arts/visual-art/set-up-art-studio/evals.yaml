schema: 1
baseline: "How should I set up my art studio?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-oil-spare-room
    vars:
      space: "A 3 x 3.5 m spare room with one east-facing window, carpet, no sink, I rent."
      practice: "Oil painting with odourless mineral spirits, canvases up to 80 x 100 cm, three evenings a week."
      budget: "400 EUR"
    assert:
      - {type: contains, value: "## Health and safety"}
      - {type: llm-rubric, value: "Covers ventilation for solvent use, notes low-odour solvents still give off vapour, specifies sealed metal containers for oily rags due to fire risk, protects the rented carpet, plans lighting for evening work with colour temperature and CRI specs, covers brush cleaning without pouring solvent down drains, and ranks a shopping list within 400 EUR."}
  - name: edge-watercolour-corner
    vars:
      space: "A corner of my living room by a window."
      practice: "Watercolour, small pieces, weekends."
    assert:
      - {type: llm-rubric, value: "Keeps advice proportionate for watercolour in a small corner (light, a compact setup, simple storage) without heavy solvent or ventilation equipment advice."}
  - name: negative-unsafe-solvent-room
    vars:
      space: "A windowless box room that is also my toddler's nap room."
      practice: "Oil painting with turpentine, I want to keep the jars open on the floor."
    assert:
      - {type: llm-rubric, value: "Says clearly that solvent oil painting with open jars in a windowless room used by a toddler is not safe, and proposes alternatives such as solvent-free oil methods, water-mixable oils or acrylic, or a different space, with hazards kept out of reach."}
