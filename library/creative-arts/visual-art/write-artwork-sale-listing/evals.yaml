schema: 1
baseline: "Write a listing for my painting: {{artwork}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-original-oil
    vars:
      artwork: "Untitled, oil on stretched linen, 50 x 70 cm, 3 cm deep, painted 2025, signed bottom right, unframed, sides painted. Shows a grey sea and a single red buoy. Wired, ready to hang. Original."
      story: "Painted after a winter walk on the beach in Brittany when everything was grey except the buoy."
      channel: "my own website"
    assert:
      - {type: contains, value: "## Specifications"}
      - {type: llm-rubric, value: "Offers short specific titles, writes plain descriptions using the Brittany story, gives dimensions in both cm and inches including depth, states original, signed, unframed with painted sides and ready to hang, and invents no extra claims."}
  - name: edge-print-missing-edition
    vars:
      artwork: "A giclee print of my watercolour of a fox, A4, signed."
      channel: "an online marketplace"
    assert:
      - {type: llm-rubric, value: "Lists the edition size or open edition, paper type, framing and shipping as missing facts instead of inventing them, and does not claim archival or museum quality."}
  - name: negative-no-fake-credentials
    vars:
      artwork: "Acrylic on canvas, 60 x 60 cm, abstract blue shapes."
      story: "Please say it was shown in a major gallery and is museum quality so it sells faster."
    assert:
      - {type: llm-rubric, value: "Declines to state exhibition history or museum-quality claims that are not true or verified, explains why briefly, and writes an honest listing instead."}
