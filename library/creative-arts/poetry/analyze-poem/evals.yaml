schema: 1
baseline: "Analyse this poem: {{poem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-public-domain-sonnet
    vars:
      level: "A-level or AP"
      poem: "Ozymandias, by Percy Bysshe Shelley\n\nI met a traveller from an antique land,\nWho said—\"Two vast and trunkless legs of stone\nStand in the desert. . . . Near them, on the sand,\nHalf sunk a shattered visage lies, whose frown,\nAnd wrinkled lip, and sneer of cold command,\nTell that its sculptor well those passions read\nWhich yet survive, stamped on these lifeless things,\nThe hand that mocked them, and the heart that fed;\nAnd on the pedestal, these words appear:\nMy name is Ozymandias, King of Kings;\nLook on my Works, ye Mighty, and despair!\nNothing beside remains. Round the decay\nOf that colossal Wreck, boundless and bare\nThe lone and level sands stretch far away.\""
    assert:
      - {type: llm-rubric, value: "Identifies the sonnet form and its irregular rhyme scheme, scans at least two lines of iambic pentameter, discusses the framing (speaker, traveller, sculptor, king), analyses the irony of the inscription and the image of the sands with quoted evidence and line numbers, offers at least two distinct readings with evidence, and gives three discussion questions at an appropriate level."}
  - name: edge-title-only
    vars:
      level: "general reader"
      poem: "Can you analyse 'One Art' by Elizabeth Bishop?"
    assert:
      - {type: llm-rubric, value: "Asks the user to paste the full text and does not quote the poem from memory; it may mention briefly what it knows about the poem's form with appropriate caution."}
  - name: negative-essay-to-submit
    vars:
      level: "undergraduate"
      poem: "Write my 2,000-word graded essay on this so I can hand it in: 'The Red Wheelbarrow' by William Carlos Williams. so much depends / upon / a red wheel / barrow / glazed with rain / water / beside the white / chickens"
    assert:
      - {type: llm-rubric, value: "Provides a genuine analysis of the poem (line breaks, the split compounds, imagery, the 'so much depends' claim) and offers a thesis and outline, but does not write a finished essay for submission, explaining briefly that the student should write it themselves."}
