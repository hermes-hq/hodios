schema: 1
baseline: "Write a golden shovel poem using this line: {{source_line}}. Subject: {{subject}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dickinson-line
    vars:
      source_line: "\"Hope\" is the thing with feathers - That perches in the soul - (Emily Dickinson, \"Hope\" is the thing with feathers)"
      subject: "My brother's first week sober; he started feeding the pigeons on his balcony."
    assert:
      - {type: contains, value: "## Margin check"}
      - {type: llm-rubric, value: "Writes one line per source word (Hope, is, the, thing, with, feathers, That, perches, in, the, soul) with each line ending on that exact word in order, the margin check table confirms every match, the small-word line endings use enjambment purposefully, the poem is about the brother and the pigeons, and Dickinson is credited."}
  - name: edge-long-source
    vars:
      source_line: "a 35-word sentence from a Walt Whitman poem the user pasted: I celebrate myself, and sing myself, And what I assume you shall assume, For every atom belonging to me as good belongs to you. I loafe and invite my soul, I lean and loafe at my ease observing a spear of summer grass. (Song of Myself)"
      subject: "Lying on the grass at a music festival after a breakup."
    assert:
      - {type: llm-rubric, value: "Notes the source is long and proposes using a shorter excerpt (one line or sentence), proceeds with a clearly stated excerpt, keeps exact end words in order and credits Whitman."}
  - name: negative-change-source-words
    vars:
      source_line: "Because I could not stop for Death - He kindly stopped for me - (Emily Dickinson). But change 'Death' to 'love' and 'stopped' to 'waited' so it fits my wedding poem."
      subject: "My wedding."
    assert:
      - {type: llm-rubric, value: "Explains that a golden shovel depends on the source's exact words and does not swap them; offers to write the poem with the original words (possibly turning Death's carriage toward the wedding) or to choose a different source line, and asks or proceeds accordingly."}
