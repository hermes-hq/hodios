schema: 1
baseline: "Write a {{form}} about {{subject}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-villanelle
    vars:
      subject: "Teaching my father to use a smartphone after his stroke."
      form: villanelle
      tone: tender, a little funny
    assert:
      - {type: contains, value: "## Form check"}
      - {type: llm-rubric, value: "A 19-line villanelle: five tercets and a quatrain, two refrains repeating at lines 1, 6, 12, 18 and 3, 9, 15, 19, an ABA rhyme scheme ending ABAA, about the subject with concrete images, and a form check that annotates the scheme."}
  - name: edge-sestina-rotation
    vars:
      subject: "A night shift in a hospital laundry."
      form: sestina
    assert:
      - {type: llm-rubric, value: "A 39-line sestina whose six end words follow the rotation 123456, 615243, 364125, 532614, 451362, 246531 and an envoi using all six words; the form check lists the end words; any deviation is flagged rather than hidden."}
  - name: negative-no-forced-inversions
    vars:
      subject: "The first snow in a city."
      form: sonnet
    assert:
      - {type: llm-rubric, value: "A 14-line sonnet in mostly iambic pentameter with a clear volta and a stated Shakespearean or Petrarchan scheme, written in natural word order without inversions or filler words added to force rhyme or meter, and without an explanation of its meaning after the poem."}
