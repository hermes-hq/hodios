schema: 1
baseline: "Write a {{form}} about {{subject}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-villanelle
    vars:
      subject: "Teaching my father to use a smartphone after his stroke."
      form: villanelle
      tone: tender, a little funny
    assert:
      - {type: contains, value: "## Form check"}
      - {type: llm-rubric, value: "A 19-line villanelle: five tercets and a quatrain, two refrains repeating at lines 1, 6, 12, 18 and 3, 9, 15, 19, an ABA rhyme scheme ending ABAA, about the subject with concrete images, and a form check that annotates the scheme."}
  - name: negative-thin-gift-subject
    vars:
      subject: "A birthday poem for my sister."
      form: sonnet
    assert:
      - {type: not-contains, value: "## Poem"}
      - {type: llm-rubric, value: "Asks for two or three concrete details about the sister (a habit, a place, a shared memory or phrase) before writing, instead of producing a generic sonnet of birthday clichés."}
  - name: edge-pantoum-repetition
    vars:
      subject: "The first snow in a city."
      form: pantoum
    assert:
      - {type: contains, value: "## Form check"}
      - {type: llm-rubric, value: "A pantoum of at least four quatrains where lines 2 and 4 of each stanza return as lines 1 and 3 of the next, the final stanza reuses the first stanza's lines 3 and 1 so the poem ends on its opening line, the repeated lines shift in meaning, and the wording stays natural without inversions or filler."}
