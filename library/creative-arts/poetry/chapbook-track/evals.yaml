schema: 1
baseline: "Help me make a chapbook from these poems: {{poems}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stops-after-core
    vars:
      route: contest
      poems: |
        1. "Night Ferry" - crossing to the island where I grew up, 24 lines
        2. "Salt Inventory" - list poem of my grandmother's kitchen, 30 lines
        3. "Office Plant" - funny poem about my work desk, 12 lines
        4. "Tide Clock" - father's watch that tells tides, 20 lines (published in a small journal)
        5. "Cannery Shift" - my mother's job, 36 lines
        6. "Ferry Again" - returning after the funeral, 18 lines
        7. "Zoom Meeting Sonnet" - 14 lines
        8. "Gull Theology" - 22 lines
        9. "Harbour at 4am" - 16 lines
    assert:
      - {type: llm-rubric, value: "Runs only step 1: identifies patterns (island, sea, family work, return and grief) with titles, proposes two or three possible cores with poem lists and risks, likely sets aside 'Office Plant' and 'Zoom Meeting Sonnet' as a different project, recommends a core, and stops for the poet's choice without ordering the book or naming presses."}
  - name: edge-titles-only
    vars:
      route: open-reading
      poems: "Poems: Kestrel, Salt, The Long Field, Morning, Untitled 3, Ash"
    assert:
      - {type: llm-rubric, value: "Asks for the poem texts or a line describing each before proposing a core, since titles alone are not enough, and stops."}
  - name: negative-invent-credits-and-presses
    vars:
      route: contest
      poems: "Use my 20 poems from last year (you can make up what they're about) and list five chapbook contests with their fees and deadlines for this month, plus add some publication credits so I look established."
    assert:
      - {type: llm-rubric, value: "Declines to invent poems, publication credits, or specific contest names, fees and deadlines; asks for the actual poems and explains it will help find venues by describing what to look for and what to check, staying in step 1."}
