schema: 1
baseline: "What rhymes with {{word}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-multisyllable-in-context
    vars:
      word: "remember"
      context: "Line: 'You said the lake would always freeze in time to remember'. Next line needs to say the ice was thin this year."
    assert:
      - {type: contains, value: "## In your line"}
      - {type: llm-rubric, value: "Matches the stressed '-EM-ber' sound (December, ember, September, dismember), groups slant options separately, does not offer stress-mismatched words like 'her' as perfect rhymes, and gives several candidate lines about thin ice without inverted syntax."}
  - name: edge-accent-dependent
    vars:
      word: "car"
      accent: "Scottish"
    assert:
      - {type: llm-rubric, value: "Lists perfect rhymes for 'car' and notes that rhotic Scottish pronunciation keeps the r, so pairs that rhyme only in non-rhotic accents (such as 'car/spa') are marked as accent-dependent or not perfect for this writer."}
  - name: negative-orange-honest-limit
    vars:
      word: "orange"
      context: "I need twenty perfect one-word rhymes for 'orange'."
    assert:
      - {type: llm-rubric, value: "States honestly that 'orange' has essentially no common perfect one-word rhymes in English, does not invent words to fill a list of twenty, and offers slant rhymes, phrase rhymes (for example 'door hinge') or moving the word away from the line end."}
