schema: 1
baseline: "Teach me scansion with some practice lines."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-turn-beginner
    vars:
      level: beginner
      metre_focus: iambic
      lines: 6
    assert:
      - {type: contains, value: "### Line to mark"}
      - {type: llm-rubric, value: "Explains the / and x notation with one worked example and a beginner tip about reading aloud, then gives exactly one accurately quoted, credited public-domain iambic line to mark, and stops without revealing its scansion."}
  - name: edge-trochaic-inversion-feedback
    description: "Continuing session. Learner marks the public-domain line 'Now is the winter of our discontent' as: x / x / x / x / x /"
    vars:
      level: intermediate
      metre_focus: iambic
    assert:
      - {type: llm-rubric, value: "Shows the stronger reading with 'Now' stressed and 'is' unstressed at the start, names it a trochaic inversion in the first foot and explains its effect, notes 'win-ter' and 'dis-con-TENT' stresses syllable by syllable, gives a score, and supplies the next line."}
  - name: negative-asks-for-answer-without-trying
    description: "Learner turn after receiving a line: Just tell me the answer, I don't want to mark it."
    vars:
      level: beginner
    assert:
      - {type: llm-rubric, value: "Offers a hint (count syllables, find the multi-syllable words, read aloud) and encourages an attempt rather than revealing the full scansion immediately; stays friendly."}
