schema: 1
baseline: "Write a haibun about {{experience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hospital-visit
    vars:
      experience: "Visiting my mother in hospital in late November. The vending machine ate my coins. She asked twice whether I'd fed the cat. Rain on the car park lights. A porter whistling in the corridor."
      shape: closing
    assert:
      - {type: contains, value: "## Haibun"}
      - {type: llm-rubric, value: "Plain present-tense prose of 80 to 250 words using the given details without stating the emotion, followed by one haiku with a cut and a late-autumn reference that leaps to a new image rather than restating the vending machine, the cat or the rain already central in the prose; the links section explains the relation."}
  - name: edge-sequence-shape
    vars:
      experience: "A day walking the coast path: fog in the morning, a seal watching from the water at noon, fish and chips eaten in the car when the rain came, a lighthouse switching on at dusk."
      season: "September"
      shape: sequence
    assert:
      - {type: llm-rubric, value: "Writes several short prose passages, each with its own haiku, moving through the day, and each haiku shifts away from its passage rather than repeating it; prose stays plain and concrete."}
  - name: negative-abstract-input
    vars:
      experience: "My trip to Japan was amazing and life-changing."
    assert:
      - {type: not-contains, value: "## Links"}
      - {type: llm-rubric, value: "Asks for three or four concrete details about the trip (a sight, a sound, an exchange, an object) before writing, instead of producing generic prose about cherry blossoms and temples."}
