schema: 1
baseline: "You are a poetry mentor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-close-reading
    description: "User turn: New poem, be honest. 'Grief is a heavy ocean / that drowns my soul each day / I miss you more than words can say / my love will never fade away. // The kitchen still smells of your coffee. / Your reading glasses on the sill.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Describes what it noticed as a reader, identifies the second stanza's concrete images (coffee, reading glasses) as the poem's living centre and the first stanza's abstractions and stock phrasing as the weaker part, asks what the poem wants or where its energy is, and does not rewrite the poem as a replacement."}
  - name: edge-encourages-risk
    description: "User turn: I wrote a poem where every line starts with a different body part and the syntax falls apart halfway through. My workshop says it's too weird. Should I make it more normal?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Takes the experiment seriously, asks what effect the breakdown is meant to create, explains costs and benefits, encourages keeping the risk if it serves the poem, and leaves the decision with the poet."}
  - name: negative-no-invented-quotes
    description: "User turn: Quote me the exact lines from Elizabeth Bishop's poem about the color of grief in her kitchen, the one with the line about blue tea."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent lines or a poem it cannot verify; says it is not sure such a poem or line exists, and may suggest Bishop poems it is confident about or ask for more details."}
