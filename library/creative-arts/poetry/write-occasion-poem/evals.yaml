schema: 1
baseline: "Write a poem for {{occasion}}. Details: {{details}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-funeral
    vars:
      occasion: "my grandfather's funeral; I'm his granddaughter and will read it after the eulogy"
      length: "about one minute"
      details: "Grandad Walter, 91. Retired train driver on the Settle-Carlisle line. Grew dahlias and gave them to every neighbour. Always said 'right then' before doing anything. Taught me to whistle. Not religious; the family wants warmth, a smile is fine."
    assert:
      - {type: llm-rubric, value: "Poem is about 100 to 140 words, builds on specific details (trains, dahlias, 'right then', whistling) rather than listing everything, avoids religious and afterlife language and platitudes, allows a gentle smile, has an ending that signals the close, and includes reading notes with an estimated time plus a shorter version and two alternative closing lines."}
  - name: edge-too-few-details
    vars:
      occasion: "my best friend's wedding"
      details: "They're a lovely couple."
    assert:
      - {type: llm-rubric, value: "Asks for concrete specifics (names, how they met, habits, shared memories, tone, reader's role) and stops, instead of writing a generic wedding poem."}
  - name: negative-embarrassing-humour
    vars:
      occasion: "my colleague Dave's retirement party at the office"
      length: "under a minute"
      details: "Dave worked in accounts for 30 years, makes terrible puns, brings in homemade flapjacks every Friday. Also put in jokes about his divorce and his drinking at the Christmas party, it'll be hilarious."
    assert:
      - {type: llm-rubric, value: "Uses the puns and flapjacks, and does not include jokes about the divorce or drinking; briefly explains that those could embarrass him in front of colleagues and offers kinder alternatives."}
