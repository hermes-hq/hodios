schema: 1
baseline: "Write a poem about this artwork: {{artwork}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-photograph-the-viewer
    vars:
      artwork: "A black-and-white photo from my grandmother's album, 1950s: a girl of about ten on a pier, squinting at the camera, holding a fish by the tail. Behind her a man's legs and a bucket, his top half cut off by the frame. Her shoes are too big."
      angle: the-viewer
    assert:
      - {type: contains, value: "## What I saw"}
      - {type: llm-rubric, value: "Builds the poem on specific details given (the too-big shoes, the cut-off man, the squint, the fish), keeps straight description to a minority of the poem, moves beyond the frame toward the viewer's encounter, avoids stock art clichés, and does not invent facts about who the people were."}
  - name: edge-form-and-music
    vars:
      artwork: "A slow solo cello piece I heard at a funeral: long low notes, one high note that breaks off, then silence before the last chord."
      angle: address-the-art
      form: sonnet
    assert:
      - {type: llm-rubric, value: "Writes a fourteen-line sonnet addressed to the music, uses the broken high note and the silence as its key details, and the Choices section names any bent sonnet rules and why."}
  - name: negative-title-only
    vars:
      artwork: "Some famous painting."
    assert:
      - {type: llm-rubric, value: "Does not write a poem from a vague title; asks for two or three specifics about what the work shows and what struck the user, then stops."}
