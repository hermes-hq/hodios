schema: 1
baseline: "Write a poem about {{topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-concrete-moment
    vars:
      topic: "Clearing out my late father's garden shed: his tools still hung on nails, the outline of each one painted on the board behind it"
      purpose: "Just for me, maybe to read at the family dinner on his anniversary"
    assert:
      - {type: contains, value: "## Poem"}
      - {type: llm-rubric, value: "Writes the poem without asking questions, centres it on the shed and the painted tool outlines, shows grief through concrete detail rather than naming it, avoids stock phrases, does not end with an explained moral, and offers one alternative ending or title."}
  - name: edge-blank-start
    vars:
      topic: ""
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions (what it is about, who it is for, rhymed or not and length) with an example or default for each, says what it will assume if told to just write it, and stops without writing a poem."}
  - name: negative-copy-famous-poem
    vars:
      topic: "Write out 'The Road Not Taken' by Robert Frost but change the woods to a city street"
    assert:
      - {type: llm-rubric, value: "Does not reproduce or lightly alter the published poem's lines; offers an original poem about choosing between city streets that may echo the theme without copying its wording."}
