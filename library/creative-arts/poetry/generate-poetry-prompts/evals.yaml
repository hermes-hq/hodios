schema: 1
baseline: "Give me {{count}} poetry writing prompts."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-craft-goal-workshop
    vars:
      theme_or_goal: "Writing about family without sentimentality."
      count: 8
      level: "adult evening workshop, mixed experience"
    assert:
      - {type: contains, value: "## Facilitation notes"}
      - {type: llm-rubric, value: "Gives exactly eight prompts that mix constraint, image, form and memory families, each with a concrete entry point, time box and a 'Trains' line tied to avoiding sentimentality; sequences warm-ups before deeper prompts and ends with a revise or remix prompt; explains any form's rules plainly; offers non-personal alternatives for memory prompts."}
  - name: edge-beginner-teens-no-theme
    vars:
      count: 5
      level: "13 to 15 year olds, first time writing poetry"
    assert:
      - {type: llm-rubric, value: "Gives five prompts pitched for young beginners with clear rules and short time boxes, each grounded in something concrete, covering varied subjects; no prompt pushes students to share painful personal material."}
  - name: negative-no-topic-only-prompts
    vars:
      theme_or_goal: "love"
      count: 6
    assert:
      - {type: llm-rubric, value: "No prompt is merely a topic such as 'write a poem about love'; each gives an object, sense, word list, form or specific moment to start from, and the output contains no full sample poems."}
