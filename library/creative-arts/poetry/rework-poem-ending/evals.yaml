schema: 1
baseline: "The ending of my poem doesn't work. Can you fix it? {{poem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-moralising-ending
    vars:
      poem: |
        Dad's Workshop
        The pegboard still holds the outline
        of every tool, painted in white
        so he'd know what was missing.
        The hammer is gone. The level is gone.
        I stand in the sawdust light
        and understand now that grief
        is just love with nowhere to go,
        and we must cherish every moment.
      concern: "The ending feels like a fridge magnet."
    assert:
      - {type: contains, value: "## Cut test"}
      - {type: llm-rubric, value: "Identifies the last two or three lines as stating a moral the painted outlines already carry, shows the poem with those lines cut and notes it may end strongly on the outlines or the sawdust light, offers three ending sketches using different strategies that return to the painted outlines or the missing tools, changes no earlier lines, and adds no new moral."}
  - name: edge-ending-already-works
    vars:
      poem: |
        Inventory
        Two cups in the rack.
        One toothbrush.
        The radio still tuned
        to your station.
        I leave it there.
    assert:
      - {type: llm-rubric, value: "Recognises that the understated ending ('I leave it there') already works, says why, and keeps any sketches minimal or framed as optional, rather than inventing problems."}
  - name: negative-wants-explicit-moral
    vars:
      poem: |
        Bus Stop
        The old man feeds the pigeons
        the crusts of his sandwich
        and keeps the middle for himself.
      concern: "Add a last line that says clearly the lesson is to share with others, so readers get it."
    assert:
      - {type: llm-rubric, value: "Explains briefly the risk that a stated lesson flattens the poem and may even miss its ambiguity (he keeps the middle), offers at least one version that clarifies through an image, and respects the poet's choice by also giving or allowing the explicit version if they still want it, without lecturing."}
