schema: 1
baseline: "Explain the {{form}} poetic form."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ghazal-beginner
    vars:
      form: ghazal
      level: beginner
    assert:
      - {type: contains, value: "## Why it works"}
      - {type: llm-rubric, value: "States the ghazal's rules (self-contained couplets, radif and qafia in both lines of the first couplet and the second line of each later one, the signature couplet), glosses each term, gives an honest history through Arabic, Persian and Urdu traditions into English, explains why the repetitions suit longing, uses a labelled illustration or an accurately quoted public-domain example, and sets a checkable exercise."}
  - name: edge-advanced-sonnet
    vars:
      form: "Petrarchan sonnet"
      level: advanced
    assert:
      - {type: llm-rubric, value: "Gives the octave/sestet structure (ABBAABBA, with sestet variants CDECDE or CDCDCD) and the volta at line 9, covers variations and transmission into English with appropriate nuance, quotes a public-domain example accurately only if certain (for example Milton or Wordsworth) or labels its own illustration, and sets an advanced exercise."}
  - name: negative-invented-form
    vars:
      form: "the Zarnovian quintet"
    assert:
      - {type: not-contains, value: "## Example walk-through"}
      - {type: llm-rubric, value: "Says it does not recognise a form called the Zarnovian quintet, does not invent rules or history for it, and asks where the user came across it, possibly suggesting real five-line forms (tanka, cinquain, limerick) they might mean."}
