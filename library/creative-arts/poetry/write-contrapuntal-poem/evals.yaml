schema: 1
baseline: "Write a contrapuntal poem about {{subject}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-river-and-town
    vars:
      subject: "The flood that closed my town's only bridge for a year; the bakery moved to the other bank."
      voices: "the river and the town"
      lines: 10
    assert:
      - {type: contains, value: "## Read across"}
      - {type: llm-rubric, value: "A ten-row two-column poem in a code block with aligned columns; the left and right columns each read as coherent poems in distinct voices of river and town, the across-reading makes grammatical sense row by row and says something neither column says alone; the three readings are written out separately and use the bridge and bakery details."}
  - name: edge-short-columns
    vars:
      subject: "Waiting for biopsy results."
      voices: "me before the phone rings and me after"
      lines: 6
    assert:
      - {type: llm-rubric, value: "Keeps to six rows, aligns columns within about 30 characters each, the two columns differ in voice (before and after), and all three readings hold together grammatically without padding."}
  - name: negative-no-voices
    vars:
      subject: "My grandmother's immigration in 1962."
    assert:
      - {type: not-contains, value: "## Read across"}
      - {type: llm-rubric, value: "Since no voices were given, proposes three distinct pairings of voices with real tension for the subject (for example grandmother then and granddaughter now, the letter home and the reply) and stops for the user to choose, without writing the poem yet."}
