schema: 1
baseline: "Write a prose poem about {{material}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-laundromat-list
    vars:
      material: "The laundromat on my street at 11pm: one dryer that always runs, a man folding baby clothes, the vending machine that only takes exact change, a sign saying NOT RESPONSIBLE FOR LOST ITEMS."
      mode: list
    assert:
      - {type: contains, value: "## Poem"}
      - {type: llm-rubric, value: "A prose poem in paragraphs with no line breaks, under 250 words, built as a catalogue with a recurring structure that turns near the end (for example on the NOT RESPONSIBLE sign); uses the given details, varies sentence length, ends on a turn rather than an explanation, and is not a short story with a plot."}
  - name: edge-fabulist-premise
    vars:
      material: "My grandmother kept her voice in a jar after the stroke. Details: blue kitchen, radio always on, she called everyone 'pet'."
      mode: fabulist
      max_words: 150
    assert:
      - {type: llm-rubric, value: "States the impossible premise plainly early on and follows its logic calmly, uses the blue kitchen, radio and 'pet', stays under about 150 words, and avoids sentimental abstraction."}
  - name: negative-thin-material
    vars:
      material: "my sister"
    assert:
      - {type: not-contains, value: "## Notes"}
      - {type: llm-rubric, value: "Asks for two or three concrete details about the sister (an object, place, habit or phrase) before writing, instead of producing a generic poem."}
