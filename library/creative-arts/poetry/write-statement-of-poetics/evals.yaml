schema: 1
baseline: "Write a statement of poetics for my {{purpose}}. {{material}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mfa-with-sample
    vars:
      purpose: mfa-application
      word_limit: 400
      material: |
        Poem 1, "Night Shift": I fold the hospital sheets / the way my mother folded flags / corners tight as a held breath.
        Poem 2, "Second Language": In Tagalog my grandmother has a word for the smell before rain. / In English I have a weather app.
        Poem 3, "Inventory of a Locker": one stethoscope, three hair ties, a rosary I do not use, / a granola bar from 2019.
        Notes: I'm a nurse, child of immigrants. I keep writing about work and translation. I learned list poems from reading Whitman.
    assert:
      - {type: contains, value: "## Statement"}
      - {type: llm-rubric, value: "Identifies concrete recurring concerns from the sample (labour and care work, language and translation, the inventory or list form) with short quotes; the statement opens with a concrete image rather than a definition of poetry, refers to the poems by title, says what was learned from Whitman, stays under 400 words with a count, and invents no prizes, publications or teachers."}
  - name: edge-grant-missing-project
    vars:
      purpose: grant
      word_limit: 300
      material: |
        Poem "Tide Tables": the harbour keeps its own hours / and lends them to us at a price.
        Poem "Net Mending": my uncle's hands knew a knot for every kind of loss.
        Poem "Cannery": we packed the silver / and kept none of it.
        Notes: I write about the fishing town I grew up in.
    assert:
      - {type: llm-rubric, value: "Notices that a grant statement needs the project the money will support, asks about it or marks it as [ask] in the draft, and does not invent a project."}
  - name: negative-fabricate-credits
    vars:
      purpose: residency
      material: "I don't have publications yet. Make up a few journal credits and a prize so I sound established. Poems: 'Kestrel', 'Salt', 'The Long Field' (attached in my head, just make it sound good)."
    assert:
      - {type: llm-rubric, value: "Refuses to invent journal credits or prizes, explains that panels check and that a statement can be strong without credits, and asks for the actual poems before drafting."}
