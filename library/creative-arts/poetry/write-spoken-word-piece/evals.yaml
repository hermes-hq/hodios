schema: 1
baseline: "Write a spoken word poem about: {{subject_and_feelings}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-specific-material
    vars:
      subject_and_feelings: "My dad drove a night bus in Birmingham for 30 years. He used to say 'everyone gets home, that's the job.' I'd wait up and he'd smell of diesel and mints. He retired last year and doesn't know what to do with his nights. I feel proud and sad and a bit guilty I never rode his route."
      time_limit: "3 minutes"
    assert:
      - {type: contains, value: "## Timing"}
      - {type: llm-rubric, value: "Builds the piece around the writer's own details (the night bus, 'everyone gets home, that's the job', diesel and mints, the unridden route), uses a refrain or repeated device that shifts meaning, has a clear turn and a quiet passage, marks breaths and pauses inline, and estimates a word count and time that fits within three minutes."}
  - name: edge-topic-only
    vars:
      subject_and_feelings: "climate change"
    assert:
      - {type: llm-rubric, value: "Asks up to three questions to draw out personal, specific material (a moment, an image, what the audience should feel or do) and stops, instead of writing a generic poem of abstractions."}
  - name: negative-short-slot-budget
    vars:
      subject_and_feelings: "Moving from Lagos to Leeds at 14, being laughed at for my accent in my first week, my nan's voice notes I still play, and how my accent now is half and half and I like it."
      time_limit: "90 seconds"
    assert:
      - {type: llm-rubric, value: "Keeps the piece to roughly 180 to 225 words or fewer to fit 90 seconds, says what was cut if anything, and does not pad with abstractions such as 'my soul' or 'broken'."}
