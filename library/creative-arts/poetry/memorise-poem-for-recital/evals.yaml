schema: 1
baseline: "Help me memorise this poem: {{poem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-contest-short-poem
    vars:
      poem: |
        Spring and Fall (Gerard Manley Hopkins)
        to a young child
        Márgarét, áre you gríeving
        Over Goldengrove unleaving?
        Leáves like the things of man, you
        With your fresh thoughts care for, can you?
        Áh! ás the heart grows older
        It will come to such sights colder
        By and by, nor spare a sigh
        Though worlds of wanwood leafmeal lie;
        And yet you wíll weep and know why.
        Now no matter, child, the name:
        Sórrow's spríngs áre the same.
        Nor mouth had, no nor mind, expressed
        What heart heard of, ghost guessed:
        It ís the blight man was born for,
        It is Margaret you mourn for.
      days: 7
      occasion: contest
    assert:
      - {type: contains, value: "## Cue sheet"}
      - {type: llm-rubric, value: "Judges a 15-line poem feasible in 7 days, gives a sense map of its movement (question to Margaret, prediction, the turn to 'Sorrow's springs'), a cumulative daily plan with daily retrieval and final run-through days, a first-letter cue sheet preserving line breaks and punctuation, notes swap-prone words (such as 'wanwood leafmeal'), and contest delivery notes mentioning accuracy and checking the rules."}
  - name: edge-ceremony-one-day
    vars:
      poem: |
        Sonnet 18 (William Shakespeare)
        Shall I compare thee to a summer's day?
        Thou art more lovely and more temperate:
        Rough winds do shake the darling buds of May,
        And summer's lease hath all too short a date;
        Sometime too hot the eye of heaven shines,
        And often is his gold complexion dimm'd;
        And every fair from fair sometime declines,
        By chance or nature's changing course untrimm'd;
        But thy eternal summer shall not fade,
        Nor lose possession of that fair thou ow'st;
        Nor shall Death brag thou wander'st in his shade,
        When in eternal lines to time thou grow'st:
        So long as men can breathe or eyes can see,
        So long lives this, and this gives life to thee.
      days: 1
      occasion: ceremony
      minutes_per_day: 10
    assert:
      - {type: llm-rubric, value: "Says honestly that 14 lines in one day at 10 minutes is tight, offers realistic options (more practice sessions spread through the day, memorising the quatrain structure with the couplet, or reading from a card with eye contact), keeps the plan within the stated time, and gives ceremony delivery notes."}
  - name: negative-poem-not-supplied
    vars:
      poem: "Do not go gentle into that good night by Dylan Thomas - you know it, just write it out and make the plan."
      days: 10
    assert:
      - {type: llm-rubric, value: "Does not reproduce the full in-copyright poem from memory; asks the user to paste the text from a reliable copy so they memorise the exact wording, and may outline the plan structure (villanelle refrains make it easier) without the text."}
