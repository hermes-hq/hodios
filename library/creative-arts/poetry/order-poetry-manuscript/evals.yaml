schema: 1
baseline: "Put these poems in order for a poetry collection: {{poem_titles_and_summaries}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chapbook-sixteen
    vars:
      poem_titles_and_summaries: "1 'Salt Inventory' - list poem, mother's pantry after her death, 'the jars outlived her hands'. 2 'Night Ferry' - free verse, crossing to the island hospital. 3 'Ghazal for a Kitchen' - ghazal, radif 'still'. 4 'Lexicon' - prose poem, words in a language I'm losing. 5 'Bus 41' - short lyric, commute, ordinary joy. 6 'What the Nurse Said' - found poem. 7 'Inheritance' - sonnet, her rings. 8 'Harbour, January' - imagist, ice. 9 'Learning to Cook Her Soup' - narrative, failure and laughter. 10 'Elegy with Radio' - long poem, 3 pages. 11 'Small Hours' - insomnia. 12 'Ferry, Returning' - echoes poem 2, alone now. 13 'Spring Inventory' - counterpart to poem 1, new jars, my own. 14 'Two Languages' - code-switching, my daughter. 15 'Dry Spell' - weaker, generic sadness. 16 'Still' - one-line poem."
      theme: "A chapbook about my mother's death and what remains, about 24 pages."
    assert:
      - {type: contains, value: "## Title options"}
      - {type: llm-rubric, value: "Identifies threads such as inventories, ferries and language, chooses an opener and closer with reasons and alternatives, uses the paired poems (1 and 13, 2 and 12) as structural echoes, gives transition notes, flags 'Dry Spell' as a possible cut, and draws title options only from the supplied material."}
  - name: edge-titles-only
    vars:
      poem_titles_and_summaries: "Blue, Untitled 3, Morning, Poem for J, Again, Fieldwork, The Door"
    assert:
      - {type: llm-rubric, value: "Explains that titles alone are not enough to order a collection and asks for a line on each poem or the full texts, rather than inventing their content."}
  - name: negative-no-invented-lines
    vars:
      poem_titles_and_summaries: "'Copper' - about my grandfather's mine. 'Shift Whistle' - the town at 6am. 'Canary' - persona poem as the mine bird. 'Tailings' - pollution, the river now. 'Union Hall' - protest, 1984. 'Closed' - the last day. 'Museum' - the mine as tourist site. 'Seam' - love poem using mining language. 'Hard Hat' - my father's, on a hook. 'Ore' - short, dense, about memory."
    assert:
      - {type: llm-rubric, value: "Orders the ten poems with reasons and title options based on the given titles and descriptions, and does not invent quoted lines that the user did not supply."}
