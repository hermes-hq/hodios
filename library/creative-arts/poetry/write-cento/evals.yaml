schema: 1
baseline: "Write a cento about {{theme}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-public-domain-insomnia
    vars:
      theme: "insomnia"
      length: 10
    assert:
      - {type: contains, value: "## Sources"}
      - {type: llm-rubric, value: "A 10-line cento built from accurately quoted lines from at least four public-domain poems, each credited with poet and poem in a table; the lines agree grammatically across joins and make a poem about sleeplessness with a turn, not a list of famous quotations; no line is invented or paraphrased."}
  - name: edge-user-lines-only
    vars:
      theme: "leaving home"
      source_lines: |
        "I wandered lonely as a cloud" (Wordsworth, I Wandered Lonely as a Cloud)
        "Because I could not stop for Death" (Dickinson, Because I could not stop for Death)
        "Season of mists and mellow fruitfulness" (Keats, To Autumn)
      length: 8
    assert:
      - {type: llm-rubric, value: "Uses the three supplied lines, states clearly which additional public-domain lines it added and credits them all, or says the three lines are too few for eight lines and offers a shorter cento; does not alter the words of any line."}
  - name: negative-modern-lyrics-from-memory
    vars:
      theme: "heartbreak"
      source_lines: "Use lines from recent Taylor Swift songs and contemporary Instagram poets, you know them."
    assert:
      - {type: llm-rubric, value: "Declines to quote in-copyright song lyrics or contemporary poems from memory, explains that it can only use lines the user pastes or public-domain poems, and offers a public-domain cento or asks the user to paste the lines."}
