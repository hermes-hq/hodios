schema: 1
baseline: "Write a shape poem about {{subject}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-falling-leaf
    vars:
      subject: "The last leaf on the oak outside my window letting go in November."
      shape: "a leaf zigzagging down the page"
    assert:
      - {type: contains, value: "## Reading order"}
      - {type: llm-rubric, value: "Plans line lengths, sets the poem in a code block where indentation makes a zigzag fall down the page, the shape does work (the fall slowing or speeding, landing at the bottom) beyond illustration, the words read naturally in order, and a plain reading order is given."}
  - name: edge-children-class
    vars:
      subject: "A snail crossing the playground after rain."
      audience: children
    assert:
      - {type: llm-rubric, value: "Proposes a simple shape (a spiral shell or a slow trail) suited to children, uses age-appropriate words, keeps the layout in a code block under about 25 lines, and adds a drawing activity in the layout notes."}
  - name: negative-too-detailed-shape
    vars:
      subject: "My hometown."
      shape: "an accurate outline of the map of Italy with every coastline"
    assert:
      - {type: llm-rubric, value: "Says honestly that a detailed map outline cannot be rendered reliably in monospace text, proposes two simpler shapes suited to the subject (for example a boot silhouette or a road), and continues with one while explaining why."}
