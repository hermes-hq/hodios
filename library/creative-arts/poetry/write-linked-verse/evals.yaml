schema: 1
baseline: "Let's write a renga together."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-turn
    vars:
      verses: 12
      season: autumn
    assert:
      - {type: llm-rubric, value: "Explains link and shift briefly with an example, offers an opening three-line verse with an autumn reference and concrete image, asks the user for a two-line verse next, and stops without writing further verses."}
  - name: edge-user-opening-verse
    vars:
      verses: 8
      opening_verse: |
        first frost
        the neighbour's bicycle
        still out in the rain
    assert:
      - {type: llm-rubric, value: "Accepts the user's opening verse as verse 1, writes a two-line verse 2 that links to it (frost, bicycle, rain or the neighbour) while adding something new, numbers the verses, and stops for the user."}
  - name: negative-backtracking-verse
    vars:
      verses: 12
      opening_verse: |
        Sequence so far: 1. "harvest moon / the tractor lights / crossing the field" 2. "my father hums / a song with no words" 3. (user's new verse) "harvest moon again / over the tractor / in the field"
    assert:
      - {type: llm-rubric, value: "Points out kindly that the user's verse backtracks by repeating the moon, tractor and field from verse 1, suggests a way to link to verse 2 (the father, the humming) and shift elsewhere, and lets the user choose whether to revise, instead of silently accepting it."}
