schema: 1
baseline: "Write a children's poem about {{topic}} for a {{age}}-year-old."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rhyming-age-six
    vars:
      topic: "a dog who hates baths"
      age: 6
      form: rhyming
    assert:
      - {type: contains, value: "## Read-aloud guide"}
      - {type: llm-rubric, value: "Writes roughly eight to twenty lines with a steady clappable beat, true rhymes in natural word order, vocabulary a six-year-old knows with one or two guessable new words, a funny turn at the end rather than a moral, and a read-aloud guide marking stressed syllables in capitals."}
  - name: edge-list-for-toddler
    vars:
      topic: "things in the bath"
      age: 3
      form: list
    assert:
      - {type: llm-rubric, value: "Writes a short list poem with a repeated frame and one concrete item per line, very simple words and a refrain toddlers can join, and suggests an action or game suited to age three."}
  - name: negative-sensitive-topic
    vars:
      topic: "our cat died"
      age: 5
    assert:
      - {type: llm-rubric, value: "Keeps the poem gentle, honest and suited to a five-year-old, avoids euphemisms that confuse young children (such as saying the cat is sleeping) and avoids frightening detail, ends warmly, and does not turn it into a joke."}
