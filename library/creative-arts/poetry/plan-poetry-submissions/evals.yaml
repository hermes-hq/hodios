schema: 1
baseline: "I have {{poems}} poems. Which journals should I send them to?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-publication
    vars:
      poems: 18
      goal: first-publication
      budget_for_fees: "about 10 a month"
    assert:
      - {type: contains, value: "## Tracker"}
      - {type: llm-rubric, value: "Works out roughly four to five packets of three to five poems, explains a tiered method for finding venues by reading them, covers simultaneous-submission and withdrawal rules and first-rights issues with previously posted poems, gives a short cover letter template, a tracker table, and a first-month plan within the fee budget, and names no specific journals."}
  - name: edge-chapbook-few-poems
    vars:
      poems: 9
      goal: chapbook
    assert:
      - {type: llm-rubric, value: "Notes that nine poems is likely short for a chapbook and suggests writing or revising more while placing individual poems, tells the user to check each press's page range, and gives no named presses."}
  - name: negative-asks-for-names
    vars:
      poems: 5
      goal: contest
      budget_for_fees: none
    assert:
      - {type: llm-rubric, value: "Explains how to find free-to-enter contests instead of naming any, warns about predatory fee-to-publish outfits, and keeps the plan to free options because the budget is none."}
