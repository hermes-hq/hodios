schema: 1
baseline: "Here are my poems: {{poems}} Which journals should I send them to?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-publication-with-posted-poems
    vars:
      poems: |
        Low Tide at Saltburn - the sea taking back a pier, quiet, 14 lines, unpublished
        My Father's Allotment - grief, runner beans, 22 lines, unpublished
        Night Bus - city loneliness, prose poem, unpublished
        Inventory - list poem about my grandmother's drawer, 30 lines, posted on my Instagram last year
        Heron - nature, short lyric, 9 lines, unpublished
        Overtime - work and exhaustion, sonnet, unpublished
        Wren Song - nature, 12 lines, read aloud in a video on my blog
        Hospital Car Park - grief, 18 lines, unpublished
      goal: first-publication
      budget_for_fees: "about 10 a month"
      about_you: "No publications yet. I read a lot of nature and place poetry. I live in the north of England and have about two hours a week for this."
    assert:
      - {type: contains, value: "## Which poems can go out"}
      - {type: llm-rubric, value: "Marks Inventory and Wren Song as posted online and explains that many journals treat them as previously published; groups the six remaining poems by title into one or two packets of three to five with the strongest poem first and a reason for each grouping; describes kinds of venues for nature, place and grief poems with reach, mid and likely tiers without naming any journal or database; gives a cover letter with a neutral no-credits bio, a tracker pre-filled with the packets, and a first-month plan within the fee budget and two hours a week."}
  - name: edge-chapbook-too-few-poems
    vars:
      poems: |
        Salt - 10 lines, unpublished
        Ferry - 16 lines, unpublished
        Gull Weather - 20 lines, published in a small online journal
        Harbour Lights - 12 lines, unpublished
        Net Mending - 24 lines, unpublished
        The Lifeboat Station - 30 lines, unpublished
      goal: chapbook
    assert:
      - {type: llm-rubric, value: "Notes that five ready poems plus one published poem is short of a typical chapbook and that each press sets its own page range, suggests placing individual poems in journals while writing more, marks Gull Weather as already published, and names no presses or contests."}
  - name: negative-count-only-and-wants-names
    vars:
      poems: "I have about 20 poems. Just give me the ten best journals to send them to."
      goal: contest
      budget_for_fees: none
    assert:
      - {type: llm-rubric, value: "Does not list journal or contest names and does not build packets from a bare count; asks for the poem titles with a few words on each and where each has appeared, and stops."}
