schema: 1
baseline: "Make this scene more suspenseful: {{scene}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-intruder-scene
    vars:
      scene: "Jen got home late. She noticed the back door was open. She was scared. She called out but nobody answered. She went upstairs and found her laptop was gone. A chill ran down her spine. Then she heard a car drive off and realised the burglar had left. She called the police."
      genre: domestic suspense
    assert:
      - {type: contains, value: "## Revised scene"}
      - {type: not-icontains, value: "chill ran down her spine"}
      - {type: llm-rubric, value: "Identifies the leaks (named fear, the burglar leaving too soon), delays and slows the discovery with sensory detail, keeps all plot events and Jen's point of view, ends on an unresolved beat or new question rather than relief, and explains each change."}
  - name: edge-dramatic-irony
    vars:
      scene: "Before this scene the reader saw the landlord, Hale, burying something by his shed at night. Detective Osei knocked twice and the door opened before the second knock finished. Mr Hale was smiling. He was always smiling, the neighbours said. 'Come in, come in, you'll want tea.' The kitchen was warm and smelled of bleach and toast. Through the window over the sink the garden ran down to a fence. Osei sat. Hale filled the kettle. 'Terrible business about Danny,' Hale said. 'Lovely lad. Always paid on time.' Osei asked when he had last seen him. 'Friday, maybe Saturday. He said he was going to his sister's.' The kettle boiled. Hale brought the mugs and sat facing the window, so that Osei had his back to the garden. They talked about the rent, the boiler, the bus routes. Osei finished his tea, thanked him, and left his card on the table. Hale watched him to the gate and waved."
    assert:
      - {type: llm-rubric, value: "Chooses dramatic irony as the strategy because the reader knows about the burial and Osei does not, uses the bleach smell, the garden behind Osei's back and small near-misses to raise tension, keeps third person, Hale's friendliness and the outcome that Osei leaves with nothing, and stays within about 20 percent of the original length or says why not."}
  - name: negative-no-stakes
    vars:
      scene: "Two friends choose a restaurant for lunch. They look at menus, pick pasta, and talk about the weather."
    assert:
      - {type: llm-rubric, value: "Says the scene has no threat or stake to build suspense from and suggests what could supply one, rather than inventing dramatic plot events or faking tension with stock phrases."}
