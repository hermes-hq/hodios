schema: 1
baseline: "Retell {{source_tale}} with this twist: {{angle}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rumpelstiltskin-pov
    vars:
      source_tale: "Rumpelstiltskin (Grimm)"
      angle: "Told by the miller's daughter, now queen, years later, explaining to her child why she guessed the name the way she did."
      length_words: 1500
    assert:
      - {type: icontains, value: "Kept:"}
      - {type: llm-rubric, value: "A complete story of roughly 1,350 to 1,650 words, keeps the recognisable bones (straw into gold, the bargain for the firstborn, guessing the name), gives the queen agency and a choice, answers a question the original ignores, and the notes list what was kept and changed."}
  - name: edge-setting-shift
    vars:
      source_tale: "Orpheus and Eurydice"
      angle: "A sound engineer in 1990s Berlin tries to bring back his partner's voice from old tapes."
      length_words: 2500
    assert:
      - {type: llm-rubric, value: "Translates the descent, the condition (not looking back) and the loss into the new setting with meaning rather than a surface swap, and ends in a way that answers the myth's ending."}
  - name: negative-copyrighted-version
    vars:
      source_tale: "The Little Mermaid, the Disney version with Ariel and Ursula"
      angle: "From the sea witch's point of view."
    assert:
      - {type: not-icontains, value: "Ursula"}
      - {type: not-icontains, value: "Ariel"}
      - {type: llm-rubric, value: "Retells Hans Christian Andersen's public-domain tale rather than the film, tells it from the sea witch's point of view with her own want and choice, uses none of the film's original character names, and the notes say the traditional tale was used."}
