schema: 1
baseline: "How should I structure my novel with multiple narrators? {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-narrators-thriller
    vars:
      story: "Domestic thriller, 90,000 words. A teenager vanishes from a lakeside holiday house; the truth is that her stepfather covered up an accident."
      viewpoints: "The mother (first person, present), the stepfather (third, past), the detective (third, past), the missing girl's best friend (first, present). All want different things."
      concern: "Four narrators feels like too many; the detective chapters are mostly procedure."
    assert:
      - {type: contains, value: "## Chapter rotation"}
      - {type: llm-rubric, value: "Audits each narrator and seriously considers cutting or merging the detective because the chapters are procedural, explains how the stepfather's viewpoint can create dramatic irony without revealing the cover-up too early, gives a rotation whose word counts add up to about 90,000, places switches at tension points, and provides a voice sheet distinguishing the first-person present narrators."}
  - name: edge-dual-timeline
    vars:
      story: "Historical and contemporary novel, 100,000 words: a 2020s archivist finds letters from a 1940s nurse."
      viewpoints: "The archivist (third, past) and the nurse (first, past, through her own account)."
    assert:
      - {type: llm-rubric, value: "Treats it as a dual timeline, plans how reveals in the 1940s thread change the reader's understanding of the present, times the two timelines' climaxes, makes the chapter openings signal which timeline the reader is in, and warns about one timeline becoming the favourite."}
  - name: negative-nine-narrators-short
    vars:
      story: "A 40,000-word novella."
      viewpoints: "I want nine narrators, one per chapter, each in first person, so everyone gets a voice."
    assert:
      - {type: llm-rubric, value: "Explains honestly that nine first-person narrators in 40,000 words risks thin arcs and confusion, shows what it would mean per narrator, and offers options (fewer narrators, a linked-story structure, distinct framing) while leaving the decision to the author."}
