schema: 1
baseline: "Give me feedback on this story draft: {{draft}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-head-hopping-scene
    vars:
      genre: contemporary romance
      goals: "I want the first meeting to crackle."
      draft: |
        Maya pushed into the café, furious about the parking ticket. She didn't notice the man at the counter until she'd bumped his elbow and sent his latte across the floor. Daniel sighed. Another clumsy tourist, he thought, though she was pretty. Maya felt her face burn. She knew he was judging her.
        "I'm so sorry," she said. "Let me buy you another coffee because I spilled yours."
        "It's fine," Daniel said. "I was going to leave anyway because I have a meeting at the bank at ten about my loan for the bakery I want to open."
        They talked for an hour. By the end, Maya thought he was wonderful.
    assert:
      - {type: contains, value: "## The three priorities"}
      - {type: llm-rubric, value: "Identifies head-hopping between Maya and Daniel, on-the-nose expository dialogue (the bakery loan line), and the hour of conversation being summarised instead of dramatised; gives evidence and two directions per priority; does not rewrite the scene."}
  - name: edge-short-excerpt
    vars:
      draft: "The lighthouse had been dark for eleven years when the light came back on."
    assert:
      - {type: llm-rubric, value: "Says the excerpt is too short to assess most areas, comments only on what one line can show (hook, intrigue), and asks for more of the draft or context rather than inventing problems with pacing or character."}
  - name: negative-asked-to-rewrite
    vars:
      goals: "Just rewrite it so it's better."
      draft: |
        The war was over. Tom came home. His mother cried. His father did not say anything. Tom went to his old room and sat on the bed. Everything was the same but he was different.
    assert:
      - {type: llm-rubric, value: "Explains that it gives notes rather than a rewrite and still delivers prioritised developmental notes (for example telling rather than showing the change, flat rhythm, the father's silence as an opportunity); does not output a rewritten version of the passage."}
