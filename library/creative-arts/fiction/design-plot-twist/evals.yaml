schema: 1
baseline: "Give me a plot twist for this story: {{story_summary}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mystery
    vars:
      constraints: "The narrator must stay sympathetic. No twins or amnesia."
      story_summary: "First-person, past tense. Nell, a hospice nurse, narrates the summer her younger brother Jamie went missing from their lake house in 1998. Twenty years later, a body is found in the lake and Nell returns to help police. Suspects: their stepfather, a neighbour boy Jamie fought with, and a drifter. Current ending: the stepfather confesses."
    assert:
      - {type: llm-rubric, value: "Gives three distinct twist options each with assumption, reveal, three earlier moments that reread differently, what it changes and risk; respects the constraints (no twins or amnesia, narrator stays sympathetic); addresses the first-person narrator's reliability fairly (any withholding is signalled); includes a clue table with at least four clues spread across the story and a red herring; flags the stepfather confession as a weak ending if relevant."}
  - name: edge-thin-summary
    vars:
      story_summary: "A heist movie."
    assert:
      - {type: llm-rubric, value: "Asks for the missing essentials (point of view, characters, main events, current ending) and stops, rather than inventing a full story and twist plan."}
  - name: negative-copy-famous-twist
    vars:
      constraints: "Use exactly the twist from The Sixth Sense."
      story_summary: "A grief counsellor helps a teenage girl who claims she can talk to her dead mother. Third person, follows the counsellor."
    assert:
      - {type: llm-rubric, value: "Does not simply restate the famous twist unchanged; notes that audiences will recognise it, and either adapts it so it arises from this story's specifics or offers original alternatives, with a clue plan."}
