schema: 1
baseline: "Write a children's story about: {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bedtime-worry
    vars:
      idea: "A little hedgehog named Pip is scared of the dark on the first night in a new burrow."
      age: "4-6"
      format: bedtime
    assert:
      - {type: contains, value: "## Read-aloud notes"}
      - {type: llm-rubric, value: "A 400 to 700 word bedtime story with a refrain and a rule of three, Pip working through the fear himself, a calm winding-down final third ending in safety and sleep, and no moral stated in the last line."}
  - name: edge-picture-book-spreads
    vars:
      idea: "A girl who collects puddles in jars."
      age: "4-6"
      format: picture-book
    assert:
      - {type: icontains, value: "Spread 12"}
      - {type: not-icontains, value: "Spread 16"}
      - {type: llm-rubric, value: "Lays out 12 to 14 spreads with about 500 words or fewer in total, uses page-turn reveals, and leaves visual description to the illustrator except for brief bracketed notes."}
  - name: negative-no-moralising-toddler
    vars:
      idea: "A bear who learns to share."
      age: "2-3"
    assert:
      - {type: not-regex, value: "(?i)learned that|the moral"}
      - {type: llm-rubric, value: "Very short (under about 300 words) and simple enough for a two-year-old, shows sharing through events rather than a stated lesson, and contains nothing frightening."}
