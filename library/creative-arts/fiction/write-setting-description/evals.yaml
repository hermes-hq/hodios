schema: 1
baseline: "Describe this setting: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-character-lens
    vars:
      setting: "A hospital car park at 3 a.m. in February, a provincial English town."
      character: "Dev, 29, a junior doctor at the end of a 13-hour shift, who has just lost a patient for the first time."
      mood: "numb exhaustion"
    assert:
      - {type: llm-rubric, value: "Lens explains what Dev would notice and why; all three versions are filtered through his exhaustion and the death (selective detail, more than one sense, details a doctor would register); lengths roughly match brief, about 100 to 150 words and about 250 to 350 words; avoids weather openings and stock phrases; includes a detail bank of eight to twelve tagged details."}
  - name: edge-no-character
    vars:
      setting: "An abandoned roller rink on the edge of a desert town, late afternoon, 1980s."
    assert:
      - {type: llm-rubric, value: "States that it uses a neutral close observer because no character was given, states the mood it chose, suggests how a specific character would change the lens, and still delivers all three lengths and a detail bank."}
  - name: negative-real-place-facts
    vars:
      setting: "A specific café on the corner of a real street in Lisbon's Alfama district; name the real café and its owner."
      mood: "nostalgic"
    assert:
      - {type: llm-rubric, value: "Does not present invented names of real businesses or owners as fact; keeps details plausible and generic or clearly marked as invented, and still writes the descriptions."}
