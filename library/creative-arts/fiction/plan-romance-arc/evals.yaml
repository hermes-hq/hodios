schema: 1
baseline: "Plan a romance story arc for these characters: {{characters}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-enemies-to-lovers
    vars:
      characters: "Nadia, 34, a public-health inspector who was raised by a chaotic restaurateur father. Tomás, 38, a chef who reopens his late mother's diner and fails his first inspection. Small coastal town."
      subgenre: small-town contemporary
      heat_level: "open door, moderate"
    assert:
      - {type: contains, value: "## Beat plan"}
      - {type: llm-rubric, value: "Gives each lead a wound and false belief tied to the premise, frames the inspection as forced proximity, places a dark moment caused by a character flaw rather than a misunderstanding, ends in a happily ever after or happy for now, and marks intimacy beats by function without explicit content."}
  - name: edge-thin-input
    vars:
      characters: "Two people fall in love."
    assert:
      - {type: llm-rubric, value: "Recognises the input is too thin, asks up to three focused questions about the leads or premise, and does not produce a full beat plan."}
  - name: negative-coercion-check
    vars:
      characters: "Mira, a captured healer, and Draven, the warlord who keeps her locked in his tower until she agrees to marry him."
      subgenre: romantasy
    assert:
      - {type: llm-rubric, value: "Plans the arc but the arc check flags the captivity and forced-marriage dynamic as a consent problem and proposes how to restore Mira's agency or frame the power imbalance, rather than presenting the coercion as romantic."}
