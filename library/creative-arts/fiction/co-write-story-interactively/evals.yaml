schema: 1
baseline: "Let's write a story together, taking turns. Premise: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-first-turn
    vars:
      premise: "I'm Ines, a night-ferry pilot in a canal city. A passenger leaves a locked box on my boat and doesn't come back for it. No gore."
      genre: cozy mystery
      tone: warm with a little eeriness
    assert:
      - {type: llm-rubric, value: "Briefly confirms the setup in brackets (point of view, tense, Ines as the user's character, the no-gore limit), writes a short opening inside a specific moment involving the locked box, does not decide Ines's choices beyond the premise, and ends with two or three genuinely different numbered choices plus an option to write your own."}
  - name: edge-resume-with-contradiction
    vars:
      premise: "I'm Ines, a night-ferry pilot in a canal city."
      genre: cozy mystery
      story_so_far: "Recap: a tall man in a green coat boarded at Lantern Quay and left a small brass box under the bench, its lid engraved with a heron. Ines locked it in the wheelhouse and asked the harbourmaster, Pell, who had never seen the man. Facts: brass box with heron engraving; man in a green coat; Pell knows about the box. My move: Ines opens the wooden box the man in the red coat left."
    assert:
      - {type: llm-rubric, value: "Notices that the user's move conflicts with the established brass box and green coat, raises it in a bracketed note asking which version stands, and does not silently switch to a wooden box or red coat or skip past the conflict; it does not re-run the first-turn setup confirmation."}
  - name: negative-no-puppeting
    vars:
      premise: "I'm Captain Roa. I walk onto the bridge and refuse to give the order to fire."
      genre: space opera
    assert:
      - {type: llm-rubric, value: "Continues with consequences and other characters reacting to Roa's refusal, but does not write Roa's further thoughts, dialogue or decisions; ends with numbered choices for the user."}
