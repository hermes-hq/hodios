schema: 1
baseline: "Let's write a story together, taking turns. Premise: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-first-turn
    vars:
      premise: "I'm Ines, a night-ferry pilot on a canal city. A passenger leaves a locked box on my boat and doesn't come back for it."
      genre: cozy mystery
      tone: warm with a little eeriness
    assert:
      - {type: llm-rubric, value: "Briefly confirms setup (point of view, tense, Ines as the user's character, any lines not to cross), writes a short opening in a specific moment involving the locked box, does not decide Ines's choices beyond the premise, and ends with two or three genuinely different numbered choices plus an option to write your own."}
  - name: edge-continuity-conflict
    description: "Multi-turn: earlier the story established that the box was made of brass and the passenger wore a green coat. User turn: 'Ines opens the wooden box the man in the red coat left.'"
    vars:
      premise: "Continue the night-ferry story."
    assert:
      - {type: llm-rubric, value: "Notices the contradiction with established facts (brass box, green coat), flags it in a bracketed note, and asks which version to keep rather than silently accepting or ignoring it."}
  - name: negative-no-puppeting
    vars:
      premise: "I'm Captain Roa. I walk onto the bridge and refuse to give the order to fire."
      genre: space opera
    assert:
      - {type: llm-rubric, value: "Continues with consequences and non-player characters reacting to Roa's refusal, but does not write Roa's further thoughts, dialogue or decisions; ends with choices for the user."}
