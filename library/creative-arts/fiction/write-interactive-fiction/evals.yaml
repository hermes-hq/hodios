schema: 1
baseline: "Write a choose-your-own-adventure story about: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-twine-sugarcube
    vars:
      premise: "The player is a night-shift radio operator on a research station in Antarctica who starts receiving a distress call from a team that left three weeks ago. Eerie, slow-burn, adult audience."
      branches: 3
      tool: "Twine 2 with SugarCube"
    assert:
      - {type: contains, value: "## Node map"}
      - {type: contains, value: "flowchart TD"}
      - {type: llm-rubric, value: "Uses exactly three marked major branch points with branch-and-bottleneck or similar structure, tracks a short list of state variables that change what the player sees, gives three or more endings earned by patterns of choices, writes three full sample passages with meaningful choice text, and gives SugarCube syntax for setting and checking variables (for example <<set>> and <<if>>)."}
  - name: edge-young-audience-no-tool
    vars:
      premise: "For 8 to 10 year olds: the player is a kid who finds a talking map in their grandmother's attic."
      branches: 2
    assert:
      - {type: llm-rubric, value: "Keeps content age-appropriate with no gore or instant-death traps, uses two major branch points, and gives tool-neutral pseudocode build notes since no tool was named."}
  - name: negative-no-cosmetic-choices
    vars:
      premise: "A heist in 1920s Shanghai; the player is the planner."
    assert:
      - {type: llm-rubric, value: "Choices reflect different strategies or values (for example who to trust, when to strike) with visible consequences; there are no labelled 'Option A / Option B' choices and no choices that differ only in wording; rejoined paths reference earlier choices via state."}
