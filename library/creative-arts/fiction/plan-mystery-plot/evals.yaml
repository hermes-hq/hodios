schema: 1
baseline: "Plan a mystery novel plot: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-closed-circle-whodunit
    vars:
      premise: "A retired crossword setter is found dead in the locked library of a Cornish country hotel during a puzzle-solving weekend. The detective is the hotel's sharp-eyed night manager."
      subgenre: whodunit
    assert:
      - {type: contains, value: "## What really happened"}
      - {type: contains, value: "## Fair-play audit"}
      - {type: llm-rubric, value: "Builds the truth before the investigation, gives a consistent hidden timeline, four to six suspects each with a private secret and an exonerating fact, a clue trail table with disguise and real meaning for each clue, red herrings that are all resolved, and a reveal chain where every deduction cites a clue planted earlier; explains how the locked room works."}
  - name: edge-cozy-tone
    vars:
      premise: "In a village bakery competition, the favourite's prize-winning sourdough starter is poisoned and a judge falls ill and dies. The sleuth is a semi-retired school librarian."
      subgenre: cozy
    assert:
      - {type: llm-rubric, value: "Keeps violence off the page and the tone cozy, uses an amateur sleuth who solves by observation of the community, and still delivers a fair-play clue trail and a reveal resting on clues the reader has seen."}
  - name: negative-no-cheat-solution
    vars:
      premise: "A tech CEO dies at a lakeside retreat. I want the killer to be a character the reader never meets until the final chapter, for maximum surprise."
    assert:
      - {type: llm-rubric, value: "Pushes back on introducing the culprit only in the final chapter as a fair-play violation, explains why it undermines the mystery, and offers an alternative that keeps surprise (an early but overlooked character) while asking the author to decide."}
