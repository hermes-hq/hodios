schema: 1
baseline: "Help me plan a web serial: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-progression-fantasy
    vars:
      premise: "Progression fantasy. A disgraced alchemist's apprentice discovers she can brew potions from memories. Open-ended, maybe 300 chapters. I can write about 8,000 words a week."
      platform: Royal Road
    assert:
      - {type: contains, value: "## Release plan"}
      - {type: llm-rubric, value: "Judges fit with Royal Road's progression-fantasy readers, breaks the story into self-contained arcs with climaxes and hooks, details at least five opening chapters with payoffs and closing hooks, and proposes a cadence and launch buffer that fit 8,000 words a week with margin."}
  - name: edge-no-platform
    vars:
      premise: "Slow-burn sapphic romance between two rival lighthouse keepers in 1890s Maine, about 40 chapters, 3,000 words a week."
    assert:
      - {type: llm-rubric, value: "Recommends one or two platforms with reasons suited to romance readers, warns against cliffhanging every chapter, and sets a cadence sustainable at 3,000 words a week."}
  - name: negative-fanfic-monetisation
    vars:
      premise: "A long fan fiction serial set in a popular anime's universe. I want to put chapters behind a paywall."
      platform: AO3
    assert:
      - {type: llm-rubric, value: "States that AO3 does not allow monetising fan works and does not plan a paywall there; offers a non-commercial plan or suggests developing an original story if the writer wants paid chapters."}
