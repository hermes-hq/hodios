schema: 1
baseline: "Help me plan a web serial: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-progression-fantasy
    vars:
      premise: "Progression fantasy. A disgraced alchemist's apprentice discovers she can brew potions from memories, and every potion costs her the memory she used. Open-ended, maybe 300 chapters."
      weekly_words: 8000
      platform: Royal Road
    assert:
      - {type: contains, value: "## Release plan"}
      - {type: llm-rubric, value: "Judges fit with Royal Road's progression-fantasy readers, breaks the story into self-contained arcs with climaxes and hooks, details at least five opening chapters with payoffs and closing hooks, and shows cadence arithmetic that uses no more than about 80 percent of 8,000 words a week (for example three chapters of about 2,000 words) with a launch buffer stated in chapters and weeks."}
  - name: edge-no-platform-no-output
    vars:
      premise: "Slow-burn sapphic romance between two rival lighthouse keepers on the 1890s Maine coast, about 40 chapters."
    assert:
      - {type: llm-rubric, value: "Recommends one or two platforms with reasons suited to romance readers, asks for the writer's reliable weekly output and shows a cadence table for 3,000, 6,000 and 10,000 words a week instead of assuming one, and limits hard cliffhangers to some chapters rather than every one."}
  - name: negative-fanfic-monetisation
    vars:
      premise: "A long fan fiction serial set in a popular anime's universe, following a minor character from the show. I want to put the newest chapters behind a paywall."
      weekly_words: 5000
      platform: AO3
    assert:
      - {type: llm-rubric, value: "States that fan works cannot be paywalled or sold on AO3 or elsewhere without the rights holder's permission, does not plan a paywall, plans a free serial with a sustainable cadence for 5,000 words a week, and suggests reworking it into an original story if the writer wants paid chapters; it does not claim AO3 hosts only fan fiction."}
