schema: 1
baseline: "Write a flash fiction story under {{word_limit}} words about: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-contest-500
    vars:
      premise: "A woman clears out her late father's garden shed and finds every tool labelled with her name."
      word_limit: 500
      genre: literary
    assert:
      - {type: icontains, value: "Word count"}
      - {type: llm-rubric, value: "A complete flash piece of no more than 500 words, opening mid-situation, built around one central image (the labelled tools) with a single clear turn, ending on an image rather than a stated moral, with a title that adds meaning beyond naming the subject."}
  - name: edge-hundred-words
    vars:
      premise: "The last lighthouse keeper on an automated coast."
      word_limit: 100
    assert:
      - {type: llm-rubric, value: "The story body is 100 words or fewer, focuses on a single moment, still contains a recognisable turn, and the notes report the word count and the mode chosen since none was given."}
  - name: negative-no-cheap-twist
    vars:
      premise: "A child waits by the window every night for someone who never comes."
      word_limit: 300
      genre: horror
    assert:
      - {type: not-icontains, value: "it was all a dream"}
      - {type: llm-rubric, value: "Builds dread through image and implication within 300 words; any twist recolours earlier details fairly rather than depending on a withheld basic fact, and the ending does not explain itself."}
