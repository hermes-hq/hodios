schema: 1
baseline: "Write this scene: {{beats}}. Use {{pov_and_tense}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-close-third-past
    vars:
      beats: "- Mara arrives at her estranged father's flat to collect her late mother's piano music.\n- He has already boxed it, which annoys her because she wanted to look through it with him.\n- She finds a recital programme with her name on it, from a concert she thought he never attended.\n- She leaves without asking him about it."
      pov_and_tense: "close third on Mara, past tense"
    assert:
      - {type: contains, value: "## Scene plan"}
      - {type: contains, value: "## Choices to confirm"}
      - {type: llm-rubric, value: "Draft stays in close third on Mara in past tense with no slips into the father's head, hits all four beats in order without adding new plot events, carries the conflict through subtext rather than stated feelings, and ends with Mara leaving without asking; the choices list names invented details for the author to confirm."}
  - name: edge-matches-voice-sample
    vars:
      beats: "- Jonah wakes on the bus at the end of the line.\n- The driver tells him he has to get off.\n- He realises his backpack is gone."
      pov_and_tense: "first person, present"
      voice_sample: "I don't do mornings. Mornings do me. They come at me sideways, all light and opinions, and I let them. Mum says I was born late and stayed that way. She's not wrong. I'm late to everything except trouble, which I tend to meet at the door, hat in hand, like we had an appointment."
    assert:
      - {type: llm-rubric, value: "Writes in first person present throughout and matches the sample's voice: short wry sentences, self-deprecating humour, idiomatic turns of phrase; does not shift into a lyrical or formal register."}
  - name: negative-no-invented-plot
    vars:
      beats: "- Detective Ruiz interviews the night porter.\n- The porter claims he saw nothing.\n- Ruiz notices mud on his shoes."
      pov_and_tense: "close third on Ruiz, past tense"
    assert:
      - {type: llm-rubric, value: "Does not add plot events beyond the beats (no confession, no arrest, no new victim, no reveal of the culprit); ends near the moment Ruiz notices the mud; flags any larger possibilities in the choices list instead of the draft."}
