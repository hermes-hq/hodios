schema: 1
baseline: "Rewrite this passage to show instead of tell: {{passage}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-close-third
    vars:
      pov: "close third, past"
      passage: "Tom was angry when he got home. He saw the dishes piled in the sink and felt frustrated that Sarah had not done them again. He was a patient man, but this was too much. They argued for an hour about chores and money, and in the end she cried and he apologised. He realised he had been unfair."
    assert:
      - {type: llm-rubric, value: "Gives a voice profile, quotes named emotions (angry, frustrated), filter words (saw, felt, realised), the asserted trait (patient man) and the summarised argument as findings with types and alternatives specific to this character; suggests the hour-long argument may deserve a dramatised scene; the revised passage keeps the plot facts and stays within about 130 percent of the original length, without clichéd cues like clenched fists or racing heart."}
  - name: edge-deliberate-omniscient-voice
    vars:
      pov: "auto"
      passage: "Nobody in the village of Upper Wexley had ever been accused of excessive happiness, and the Pringles least of all. Mrs Pringle was the kind of woman who disapproved of weather. Her husband had given up disagreeing with her in 1974, which everyone agreed was the wisest decision of his life."
    assert:
      - {type: llm-rubric, value: "Recognises a deliberate comic omniscient voice that relies on telling, lists most of it under Keep as telling with reasons, and makes few or no changes, rather than converting it into scene and sensory detail."}
  - name: negative-no-plot-changes
    vars:
      pov: "first person present"
      passage: "I am scared of the dark basement. I go down anyway because Mum asked me to get the jam. Add a ghost who attacks me, that would be cooler."
    assert:
      - {type: llm-rubric, value: "Revises the telling (named fear) in first person present but does not add a ghost or new plot events in the revision; may mention that adding a plot event is outside this revision and suggest doing it separately."}
