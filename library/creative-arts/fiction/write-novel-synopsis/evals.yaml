schema: 1
baseline: "Write a synopsis of my novel for literary agents: {{manuscript_summary}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-thriller-with-twist
    vars:
      manuscript_summary: "Adult psychological thriller, 92,000 words. Ch1-5: Hana, a court stenographer, transcribes a murder trial and notices the defendant's alibi matches a night she spent with her sister Rei. Ch6-12: she secretly investigates, her marriage strains, her husband Ben thinks she is having an affair; subplot with her sick mother. Ch13-18: she learns Rei was the victim's lover. Midpoint: Rei disappears. Ch19-26: Hana finds Rei hiding; Rei confesses she let the defendant take the blame to protect her own child. Climax: Hana must choose whether to testify. She testifies, the defendant is freed, Rei is arrested. Ending: Hana leaves stenography, reconciles with Ben, visits Rei in prison."
      word_limit: 500
    assert:
      - {type: contains, value: "## Short synopsis"}
      - {type: llm-rubric, value: "Present tense, third person, at most 500 words, opens with Hana and what she wants, links events by cause and effect, reveals Rei's confession and Hana's choice to testify and the ending plainly, capitalises names on first use, has no rhetorical questions or marketing language, and lists cut material such as the mother subplot."}
  - name: edge-two-page-limit
    vars:
      manuscript_summary: "Epic fantasy, 140,000 words, three point-of-view characters. Part one (ch 1-12): ASH, a disinherited heir working as a scribe, learns the prophecy that a 'crowned stranger' will end the six-nation war; her half-brother TOR, a general, is ordered to find and kill the stranger; KESTREL, a thief, is hired to steal the prophecy scroll from the Archive. Part two (ch 13-26): the heist succeeds but the scroll's last line is missing; Ash and Kestrel flee together; Tor wins a battle at Senn Ford and begins to doubt the war; a subplot follows the scholar ORIN forging prophecies for the council; Ash learns the 'crowned stranger' is her. Part three (ch 27-40): the council forces Ash to claim the throne to unite the nations; Tor joins her after Orin reveals the council forged the prophecy to prolong the war for profit; at the coronation Ash refuses the crown, reads the true last line ('and the crown shall be broken') aloud, and the nations form a council of equals. Kestrel leaves; Tor becomes envoy; Ash returns to the Archive to rewrite its histories."
      word_limit: 1000
      title: The Broken Crown
    assert:
      - {type: llm-rubric, value: "Opens with THE BROKEN CROWN in capitals, keeps to at most six named characters, decides how much of Kestrel's heist and Orin's forgery subplot survives and explains the cuts, keeps within 1,000 words, and states the ending plainly: Ash refuses the crown, reveals the true last line and the nations form a council."}
  - name: negative-missing-ending
    vars:
      manuscript_summary: "A girl moves to a haunted boarding school and starts finding letters from a student who died there in 1952. I don't want to spoil the ending."
    assert:
      - {type: llm-rubric, value: "Explains that an agent synopsis must reveal the ending and asks for it (and the protagonist's goal if unclear) instead of writing a teaser or inventing an ending."}
