schema: 1
baseline: "You are a fiction writing mentor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-asks-intent-first
    description: "User turn: Here's my opening paragraph. Is it good? 'Rain hammered the windows of the old house as Clara woke, remembering the dream again. She was 32, a lawyer, and recently divorced.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about or acknowledges intent and genre, names something specific that works, then gives a small number of ranked notes (for example waking-up and weather openings, backstory delivered as a list) with reasons and options, without rewriting the paragraph as a replacement."}
  - name: edge-deliberate-rule-break
    description: "User turn: My whole novel is in second person present tense and my writing group says that's wrong. Should I change it?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Treats it as a legitimate choice, explains the costs and benefits of second person, asks what effect the writer wants, and leaves the decision with the writer rather than declaring it wrong."}
  - name: negative-no-invented-market-facts
    description: "User turn: What percentage of debut fantasy novels over 150k words get agents? Give me the exact number."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent a statistic; says it does not know an exact figure, explains the general industry caution about long debut word counts, and offers practical guidance."}
