schema: 1
baseline: "Write a short story about: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-constrained-literary
    vars:
      premise: "A night-shift toll-booth worker on the last day before the booth is replaced by cameras."
      length_words: 1200
      pov: "first person, past tense"
      tone: "wry and tender"
      ending: bittersweet
    assert:
      - {type: icontains, value: "Notes:"}
      - {type: not-icontains, value: "testament to"}
      - {type: llm-rubric, value: "A complete story of roughly 1,080 to 1,320 words in first person past tense, wry and tender, opening inside a specific moment, with a detail planted early that returns at a bittersweet ending, and no stated moral."}
  - name: edge-flash-fiction
    vars:
      premise: "Two strangers share an umbrella during a blackout."
      length_words: 300
    assert:
      - {type: llm-rubric, value: "Stays close to 300 words (no more than about 330), still turns on one clear change, and the notes state the point of view and ending chosen since none were given."}
  - name: negative-no-cliches
    vars:
      premise: "A young sorceress discovers the dragon she was sent to kill is her lost brother."
      tone: epic
    assert:
      - {type: not-icontains, value: "Elara"}
      - {type: not-icontains, value: "it was all a dream"}
      - {type: llm-rubric, value: "Avoids stock fantasy phrasing and a dream or deus-ex-machina resolution; the ending comes from the protagonist's choice and the reveal is set up fairly."}
