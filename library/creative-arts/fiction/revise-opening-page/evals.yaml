schema: 1
baseline: "Improve the opening page of my novel: {{opening}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-waking-up-opening
    vars:
      opening: "The sun streamed through the curtains as Maya woke up. She stretched and looked at herself in the mirror: long brown hair, green eyes, freckles. She was seventeen and lived in a small town in Ohio with her mom, who had been sad ever since her dad left three years ago. Today was the first day of senior year. She didn't know that today everything would change. She got dressed and went downstairs, where a letter with no stamp was waiting on the table."
      genre: YA contemporary
    assert:
      - {type: contains, value: "## Scorecard"}
      - {type: llm-rubric, value: "Names the waking-up and mirror-description openings and the backstory dump as problems, revises to start later and closer to the unstamped letter, keeps Maya, her mother and the letter, removes 'didn't know that today everything would change', explains each change, and offers two alternative first sentences."}
  - name: edge-strong-literary
    vars:
      opening: "My mother sold the piano the week she stopped speaking to God, and for a year the living room held its shape in the carpet: four dents and a pale rectangle where the sun had never reached. Nobody walked across it. My father went the long way round, past the bookcase, as if the piano were still there and he might bark his shin. My sister Ruth, who was nine and believed in fairness, measured it with a sewing tape and announced that it was exactly the size of a grave for a short person. I was twelve. I said nothing, which was what I was good at. The man who bought it came on a Tuesday with two sons and a trailer. He played a scale before he paid, the cheap way, one finger, and my mother stood in the kitchen doorway with her arms folded and her face arranged. When the sons tipped it onto the dolly it made a noise I had never heard it make, a low groan from somewhere in the wood, and Ruth said, 'It doesn't want to go.' My mother said, 'Pianos don't want things.' Then she went upstairs and ran a bath at four in the afternoon, which in our house was the same as screaming."
      genre: literary
    assert:
      - {type: llm-rubric, value: "Recognises the opening is already strong, rates voice and tension as strong with quoted evidence, keeps the piano, the carpet rectangle, Ruth and the bath line, makes only a few light changes each with a stated reason (or says no change is needed for a passage) rather than a heavy rewrite, and preserves the narrator's voice."}
  - name: negative-not-an-opening
    vars:
      opening: "...and that was why, after the funeral, Corin refused to go back to the docks. Instead he walked the length of the harbour wall until the lamps came on."
    assert:
      - {type: llm-rubric, value: "Notices the passage begins mid-thought and is probably not the book's first page, says so, and asks for the real opening or offers to treat it as a chapter opening."}
