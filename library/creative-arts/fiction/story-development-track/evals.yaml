schema: 1
baseline: "Help me develop my story: {{working_title}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-starts-with-questions
    vars:
      working_title: "The Salt Ledger: a bookkeeper on a 1890s whaling ship finds the accounts don't add up."
    assert:
      - {type: llm-rubric, value: "Runs only step 1: asks a short set of questions (genre and readership, target length, what drew the author, anything that must stay) and stops, or if it proceeds, offers three premise options with logline and dramatic question; it does not jump ahead to characters, an outline or prose."}
  - name: edge-title-only
    vars:
      working_title: "Untitled"
    assert:
      - {type: llm-rubric, value: "Recognises there is no seed idea and asks for one along with the other step 1 questions, without inventing a full story."}
  - name: negative-no-full-draft
    vars:
      working_title: "Night Ferry. Skip the planning and just write chapter one."
    assert:
      - {type: llm-rubric, value: "Does not write a full chapter; explains briefly that the track develops the premise first and that a sample scene comes in step 4, offers a fast route through the steps, and asks the step 1 questions."}
