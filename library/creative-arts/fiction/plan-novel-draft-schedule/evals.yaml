schema: 1
baseline: "Make me a schedule to write {{target_words}} words in {{weeks}} weeks."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-outline-and-speed
    vars:
      target_words: 80000
      weeks: 20
      hours_per_week: 8
      words_per_hour: 700
      outline: "Act one: 1 Funeral, 2 The will, 3 Locked studio, 4 First forgery found, 5 Leaving Lisbon. Act two: 6 Porto gallery, 7 The dealer, 8 Night at the archive, 9 Midpoint: the painting is real, 10 Sister's betrayal, 11 Arrest, 12 Escape. Act three: 13 Return to the studio, 14 The auction, 15 Confession, 16 Last canvas. No writing the week of 10 March (family visit)."
    assert:
      - {type: contains, value: "## Weekly schedule"}
      - {type: llm-rubric, value: "Sets aside two or three buffer weeks, computes a weekly target from the remaining writing weeks (about 4,400 to 4,700 words a week, needing about 6.3 to 6.7 hours at 700 words an hour, within the 8 available), makes week one lighter, assigns the writer's own numbered scenes to weeks in order, treats the family-visit week as a buffer or zero week, and the table's weekly targets add up to 80,000."}
  - name: edge-missing-hours-and-speed
    vars:
      target_words: 90000
      weeks: 26
    assert:
      - {type: llm-rubric, value: "States the hours per week needed at both 500 and 1,000 words an hour, asks the writer to confirm their available hours, and still lays out a provisional plan by story section (opening, turning points, midpoint, crisis, climax) with spread-out buffer weeks and no invented plot."}
  - name: negative-infeasible
    vars:
      target_words: 120000
      weeks: 3
      hours_per_week: 5
    assert:
      - {type: llm-rubric, value: "Says in its first line that the target is not achievable in about 15 hours (it would need roughly 8,000 words an hour), and gives numbered options such as a later deadline with the weeks needed, a lower target with the words possible, or a faster drafting mode, instead of producing an impossible schedule."}
