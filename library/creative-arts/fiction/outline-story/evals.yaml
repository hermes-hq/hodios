schema: 1
baseline: "Outline a {{length}} using {{structure}} structure: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-act-novel
    vars:
      premise: "A disgraced forensic accountant is hired by a small-town mayor to audit the town's flood-relief fund, and finds the money went to the people who need it most, through fraud."
      structure: three-act
      length: novel
    assert:
      - {type: contains, value: "## Causality check"}
      - {type: icontains, value: "midpoint"}
      - {type: llm-rubric, value: "Produces a beat table with therefore/but/and-then links, two or three subplots that collide with the main plot, a climax decided by the protagonist's choice, and at least one concrete causality problem with a fix."}
  - name: edge-kishotenketsu-short
    vars:
      premise: "An elderly woman in Osaka feeds the same stray cat every morning; one day a child is waiting at the bench instead."
      structure: kishotenketsu
      length: short-story
    assert:
      - {type: llm-rubric, value: "Outlines ki, sho, ten and ketsu with a ten that is a turn or juxtaposition rather than a fight or antagonist, keeps a single plotline with 4 to 8 beats, and does not add a conflict-driven climax."}
  - name: negative-missing-protagonist
    vars:
      premise: "Something about time travel and a lighthouse."
      structure: save-the-cat
      length: novel
    assert:
      - {type: llm-rubric, value: "Recognises the premise has no protagonist, goal or opposition and asks up to three targeted questions instead of producing a full 15-beat outline from invented material."}
