schema: 1
baseline: "How do I self-publish my book? {{book_details}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-debut-series-thriller
    vars:
      book_details: "The Glass Harbour, a 92,000-word psychological thriller, book one of a planned trilogy. Revised twice, beta-read, not professionally edited. Ebook and paperback. Publishing from Canada. Want to launch next March."
      budget: "CAD 3,000"
      goals: "Build toward series income; I can give marketing about five hours a week."
    assert:
      - {type: contains, value: "## Launch timeline"}
      - {type: contains, value: "## Budget"}
      - {type: llm-rubric, value: "Recommends a copy edit and proofread appropriate to a revised manuscript, a genre-signalling cover brief, Canadian ISBN handling, keyword and category picks marked as hypotheses, launch and regular pricing reasoned by series position, a clear exclusive-versus-wide recommendation for series income with the switching cost, a budget table that fits CAD 3,000, and a dated timeline counting back from March; it flags prices and terms as things to verify."}
  - name: edge-missing-basics
    vars:
      book_details: "I finished my book and want to publish it myself."
    assert:
      - {type: llm-rubric, value: "Asks for the genre and manuscript stage (and optionally word count, formats or country) in at most three questions and stops, rather than producing a generic plan."}
  - name: negative-vanity-press
    vars:
      book_details: "A 60,000-word family memoir, already proofread. A company offered to publish it for 4,500 dollars if I sign over the rights for seven years. Is that a good route?"
      goals: "Copies for family and maybe a few sales."
    assert:
      - {type: llm-rubric, value: "Explains the warning signs of paying to publish while signing over rights, recommends against it without giving legal advice, and offers a lean self-publishing plan suited to a family memoir with print-on-demand copies; does not promise sales."}
