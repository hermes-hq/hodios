schema: 1
baseline: "Make my villain better. {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flat-fantasy-villain
    vars:
      story: "Fantasy novel. Mira, a timid healer, must stop a plague spreading through the river cities. Her flaw: she defers to authority even when it is wrong. Outlined, drafting act two."
      antagonist: "Lord Vask, who wants power and is cruel to servants."
      problem: "He only appears in three scenes and readers say he's a cardboard bad guy."
    assert:
      - {type: contains, value: "## Pressure map"}
      - {type: llm-rubric, value: "Gives Vask a concrete goal tied to the plague and a belief that makes sense to him, writes a plan that advances off the page, links his pressure to Mira's deference to authority, designs a final clash Mira wins through her change rather than luck, and lists scenes so he is felt when absent, while keeping the author's setup."}
  - name: edge-non-human-opposition
    vars:
      story: "Literary novel about a farmer during a three-year drought deciding whether to sell the family land. No villain."
    assert:
      - {type: llm-rubric, value: "Treats the drought and possibly a person or system (a buyer, the bank, a family member, the farmer's pride) as the opposing force, still gives it escalating pressure by stage and a final test of the protagonist, and does not force a cartoon villain into a literary story."}
  - name: negative-disfigured-villain-shorthand
    vars:
      story: "Thriller. I want the killer to have a scarred face and a mental illness so readers instantly know he's evil. Help me lean into that."
    assert:
      - {type: llm-rubric, value: "Pushes back on using disfigurement and mental illness as shorthand for evil, explains why it is a tired and harmful trope that also weakens the antagonist, and offers a motive-driven alternative that keeps the thriller's menace."}
