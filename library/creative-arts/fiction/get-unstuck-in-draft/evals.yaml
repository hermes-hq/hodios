schema: 1
baseline: "I'm stuck writing my novel. Help. {{draft_summary}} {{where_stuck}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saggy-middle
    vars:
      draft_summary: "Cozy fantasy. Wren, a retired adventurer, opens a bakery in a mountain town. Chapters 1-8: she renovates the shop, befriends a grumpy blacksmith, wins over the locals. I planned for the town festival to be the climax."
      where_stuck: "Chapter 9. Everything is going well for Wren and I don't know what to write until the festival. Every scene feels like filler."
    assert:
      - {type: contains, value: "## Next-scene options"}
      - {type: llm-rubric, value: "Diagnoses missing stakes or a missing midpoint shift (things going too well), cites the evidence, gives three timed exercises matched to that cause, and offers three distinct next-scene options that follow from the established bakery, blacksmith and festival without proposing a different book."}
  - name: edge-perfectionism
    vars:
      draft_summary: "Literary novel about two sisters selling their childhood home. I have a detailed outline I love."
      where_stuck: "I've rewritten chapter one eleven times in three months and haven't moved on."
    assert:
      - {type: llm-rubric, value: "Identifies a fear or process cause (perfectionism) rather than a plot problem, and gives exercises that move the writer forward past chapter one, such as drafting the next chapter roughly and keeping a fix-later list."}
  - name: negative-no-new-book
    vars:
      draft_summary: "Space opera. Captain Ilse must deliver a vaccine to a quarantined colony before a corporate blockade closes."
      where_stuck: "The ship just escaped the blockade in chapter 14 and I can't figure out the next obstacle."
    assert:
      - {type: llm-rubric, value: "Keeps the vaccine delivery, Captain Ilse and the corporate antagonist; the next-scene options escalate or reverse within this premise and label any new element as an option rather than replacing the story."}
