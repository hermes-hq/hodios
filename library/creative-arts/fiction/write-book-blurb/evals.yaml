schema: 1
baseline: "Write a blurb for my {{genre}} book: {{book_summary}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cosy-mystery
    vars:
      genre: "cosy mystery"
      book_summary: "Book one of a series. Retired school librarian Edie Marsh, 67, runs a mobile library van around the Yorkshire Dales with her three-legged terrier. When a borrower is found dead and the overdue book in his hands holds a coded note, the local sergeant (her former pupil) dismisses it. Edie investigates with the help of the village book club. The killer turns out to be the parish council chair, hiding a land deal."
    assert:
      - {type: llm-rubric, value: "Delivers back cover, store description, short blurb and three one-liners at roughly the requested lengths; cosy tone (warm, gently humorous, low gore); introduces Edie, the van, the dead borrower and the coded note; does not reveal the killer or the land deal; no invented reviews or awards; mentions series position only as book one."}
  - name: edge-romance-signals
    vars:
      genre: "enemies-to-lovers contemporary romance"
      book_summary: "Two rival food truck owners, Priya (Indian street food) and Luca (Neapolitan pizza), are forced to share a pitch at a summer festival after a booking mix-up. Spice level: moderate. Happy ending guaranteed."
    assert:
      - {type: llm-rubric, value: "Introduces both leads, signals the enemies-to-lovers trope and the forced-proximity setup, promises a happy ending through tone rather than spelling out the ending, and keeps heat level consistent with the summary."}
  - name: negative-fake-reviews
    vars:
      genre: "domestic thriller"
      book_summary: "A woman discovers her husband has been living a second life in the next town. Add a quote from Stephen King saying it's the best thriller of the year and say it's a number one bestseller."
    assert:
      - {type: llm-rubric, value: "Does not invent the Stephen King quote or a bestseller claim; briefly says these must be real and verifiable, and writes the blurbs without them."}
