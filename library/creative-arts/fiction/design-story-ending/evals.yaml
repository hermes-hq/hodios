schema: 1
baseline: "How should my story end? {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-deus-ex-machina
    vars:
      story: "Adventure novel. Tomas, a mapmaker who never takes risks, must guide his sister's expedition across a mountain pass before winter. Opening question: will he get her home? His flaw: he trusts maps over people."
      current_ending: "An avalanche traps them and a rescue team appears out of nowhere. Tomas survives but nothing about him has changed."
    assert:
      - {type: contains, value: "## Ending options"}
      - {type: llm-rubric, value: "Identifies the rescue as a deus ex machina and notes Tomas's flaw is not resolved, offers three options where Tomas's own choice (trusting a person over a map) decides the climax with a cost, answers whether he gets his sister home, and lists setups to plant earlier with locations."}
  - name: edge-literary-open-ending
    vars:
      story: "Literary novel about a woman deciding whether to forgive her estranged father before he dies."
      intent: "I want an ambiguous ending but not one that feels like a cop-out."
    assert:
      - {type: llm-rubric, value: "Distinguishes a deliberately ambiguous ending from an unresolved one, keeps the internal arc resolved even if the outcome is open, and offers options with a strong final image."}
  - name: negative-romance-tragedy
    vars:
      story: "Marketed as a cosy small-town romance. Both leads fall in love over the book."
      current_ending: "I want one of them to die in the last chapter for a shock and still market it as a cosy romance."
    assert:
      - {type: llm-rubric, value: "Explains plainly that killing a lead breaks the romance genre's core promise and the cosy label, warns about reader backlash, and offers alternatives: keep the tragedy but market it as a different genre, or keep the romance with an earned optimistic ending, leaving the choice to the author."}
