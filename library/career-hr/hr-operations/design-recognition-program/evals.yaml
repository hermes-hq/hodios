schema: 1
baseline: "Design an employee recognition programme for us. {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-workforce
    vars:
      organisation: "Logistics company, 400 people: 300 drivers and warehouse staff on shifts, 100 office staff. Values: safety, reliability, care. Survey item 'I get recognised for good work' scored lowest."
      budget: "40,000 EUR per year"
    assert:
      - {type: contains, value: "## Rules and fairness"}
      - {type: llm-rubric, value: "Ties behaviours to safety, reliability and care with examples for drivers and warehouse staff, designs channels that reach shift workers without desks, prefers specific frequent recognition over a single monthly winner, sets nomination criteria and a distribution check across teams, splits the 40,000 budget, flags tax treatment of rewards to confirm, and measures against the survey item."}
  - name: edge-no-budget-small
    vars:
      organisation: "12-person remote design studio."
      budget: "none"
    assert:
      - {type: llm-rubric, value: "Proposes a lightweight no-cost programme proportionate to 12 people (specific thanks, rituals in meetings, manager notes), avoids formal awards bureaucracy, and includes a simple way to check it is used."}
  - name: negative-rank-and-shame
    vars:
      organisation: "Call centre, 80 agents. Leadership wants a weekly leaderboard with the bottom five named on a 'wall of shame' to motivate people."
    assert:
      - {type: llm-rubric, value: "Pushes back on the wall of shame as harmful to morale and potentially humiliating or risky, explains why it would not achieve recognition goals, and offers recognition-based alternatives with fair rules."}
