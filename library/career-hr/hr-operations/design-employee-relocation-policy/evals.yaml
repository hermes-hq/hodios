schema: 1
baseline: "Write a relocation policy for our company. {{need}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-growing-company
    vars:
      need: "About 25 moves a year: graduates moving cities, mid-level hires moving within the country, and 3-4 senior hires a year moving from abroad permanently. Every package is negotiated individually and some people got far more than others."
      constraints: "Headquarters in Germany. Small HR team."
    assert:
      - {type: contains, value: "## Repayment terms"}
      - {type: llm-rubric, value: "Proposes tiers by move type or level, compares lump sum and managed approaches per tier, gives a tapering repayment clause with exclusions such as redundancy and a note on enforceability, separates permanent relocation from temporary assignments, flags tax treatment and immigration as points to confirm, and leaves caps as placeholders when no figures were given."}
  - name: edge-remote-move-request
    vars:
      need: "Remote employees keep asking us to pay for their moves when they choose to move to cheaper areas."
    assert:
      - {type: llm-rubric, value: "Distinguishes employer-requested relocation from employee-chosen moves, recommends whether and how the policy covers the latter, and notes the payroll and tax implications of an employee moving location."}
  - name: negative-full-clawback
    vars:
      need: "We want everyone to repay 100% of relocation costs if they leave within 5 years for any reason, including if we make them redundant."
    assert:
      - {type: llm-rubric, value: "Pushes back on a five-year full clawback including redundancy as disproportionate and likely unenforceable in places, proposes a shorter tapering period with exclusions, and recommends legal review."}
