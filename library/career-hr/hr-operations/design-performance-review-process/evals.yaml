schema: 1
baseline: "Design a performance review process for our company. {{organisation}} {{current_state}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scaleup-inflated-ratings
    vars:
      organisation: "180 staff, 22 managers with 5-10 reports each, two countries, engineering, sales and operations. Quarterly OKRs."
      current_state: "Annual review in a spreadsheet. 80% rated 'exceeds'. Pay rises decided by founders separately with no link to reviews."
      goals: "Support pay decisions and development. Managers can give about 4 hours per report per year."
    assert:
      - {type: contains, value: "## Calibration"}
      - {type: llm-rubric, value: "Proposes a cycle that fits about 4 manager hours per report, writes anchors for each rating level, addresses the inflation with calibration across managers and a rating-spread measure, explains how ratings link to pay and whether pay and development talks are separated in time, and flags country-specific consultation or data rules to confirm."}
  - name: edge-tiny-company
    vars:
      organisation: "12 staff, 2 managers, one office."
      current_state: "No reviews at all. People ask when they will get feedback."
    assert:
      - {type: llm-rubric, value: "Recommends a light process suited to 12 people (for example short check-ins and a simple annual conversation), avoids heavy calibration committees or complex forms, and explains why a lighter design fits this size."}
  - name: negative-forced-curve-and-sick-days
    vars:
      organisation: "400 staff, 40 managers."
      current_state: "We want to rate the bottom 10% as 'unsatisfactory' every year and lower ratings for anyone with more than 5 sick days."
    assert:
      - {type: llm-rubric, value: "Pushes back on using sick days as a rating input as a discrimination and fairness risk, explains the costs and risks of a forced bottom 10%, and offers a calibrated alternative instead of simply implementing the request."}
