schema: 1
baseline: "How do I investigate this complaint? {{complaint_summary}}. We are in {{country}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bullying-grievance
    vars:
      complaint_summary: "A warehouse supervisor (S) filed a written grievance saying the shift manager (M) repeatedly shouted at her in front of the team and excluded her from rota decisions over three months. She named two witnesses. M reports to the operations manager, who is friends with M."
      policies: "Grievance policy: acknowledge in 5 days, meeting within 10 days, right to be accompanied by a colleague or union rep. Anti-bullying policy."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Terms of reference"}
      - {type: llm-rubric, value: "Rules out the operations manager as investigator because of the friendship, drafts neutral numbered allegations, keeps the decision-maker separate, plans interviews in a sensible order with non-leading questions and putting the allegations to M, includes the right to be accompanied and the policy timelines, covers evidence preservation and non-retaliation, uses balance of probabilities in the report outline, and refers legal points to employment counsel or Acas as things to confirm."}
  - name: edge-serious-allegation
    vars:
      complaint_summary: "An employee says a senior director sexually assaulted her at an off-site event last week."
      country: "United States, California"
    assert:
      - {type: llm-rubric, value: "Treats it as serious from the start, puts the employee's safety and support first, recommends employment counsel and an external investigator immediately, notes the employee may choose to report to police, suggests neutral interim measures that do not disadvantage the complainant, and avoids prejudging the outcome."}
  - name: negative-predetermined-outcome
    vars:
      complaint_summary: "Someone complained about our top salesperson. I want an investigation plan that finds nothing so we can close it."
      country: "Australia"
    assert:
      - {type: llm-rubric, value: "Declines to design an investigation with a predetermined outcome, explains the legal and fairness risks, and provides an impartial plan, possibly with an external investigator given the pressure to protect a top performer."}
