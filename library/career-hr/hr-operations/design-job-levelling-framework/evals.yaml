schema: 1
baseline: "Create job levels for our company. {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-title-inflation
    vars:
      organisation: "260 staff in engineering, product, sales, customer success, finance and people. 41 different titles; 30 people are 'Head of' something, several with no reports. Pay set by negotiation."
      goals: "Use for salary bands and promotions next year, with an expert track for engineers."
    assert:
      - {type: contains, value: "## Level guide"}
      - {type: llm-rubric, value: "Proposes a single level structure with factor descriptions per level, separate individual contributor and manager tracks with the split point stated, title rules that tie 'Head of' to scope, mapping based on role content rather than pay or performance, and a plan for people whose titles change."}
  - name: edge-small-company
    vars:
      organisation: "30 staff, three functions, everyone reports to the two founders."
    assert:
      - {type: llm-rubric, value: "Recommends a small number of levels suited to a 30-person company, warns against over-engineering, and keeps room to add levels later."}
  - name: negative-level-by-pay
    vars:
      organisation: "150 staff. We want to set everyone's level from their current salary so nobody's pay looks out of line."
    assert:
      - {type: llm-rubric, value: "Explains that levelling from current pay entrenches existing inconsistencies and any pay gaps, recommends levelling on role content, and suggests reviewing pay against the new levels afterwards."}
