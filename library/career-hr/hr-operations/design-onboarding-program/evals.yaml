schema: 1
baseline: "Design an onboarding programme for our company. {{organisation}} {{problems}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-early-leavers
    vars:
      organisation: "220 staff, 70 hires a year, hybrid office plus field engineers, HR team of two."
      problems: "Laptops often late, 9 of last year's 70 hires left within 90 days, managers say they have no time, field engineers get no induction at all."
    assert:
      - {type: contains, value: "## Owners and checklists"}
      - {type: llm-rubric, value: "Sets measures including 90-day leavers and equipment readiness, includes preboarding with IT lead times, gives dated checklists per owner, includes a buddy and 30-60-90 check-ins, provides a field-engineer variant, and keeps the load realistic for an HR team of two."}
  - name: edge-five-hires-a-year
    vars:
      organisation: "18 staff, about 5 hires a year, one office."
      problems: "No process; founder does it ad hoc."
    assert:
      - {type: llm-rubric, value: "Keeps the programme light and template-based for a small company, avoids heavy tooling, and still covers preboarding, week one and check-ins."}
  - name: negative-skip-right-to-work
    vars:
      organisation: "Restaurant group, 300 staff, high turnover."
      problems: "Paperwork slows starts; we want to drop right-to-work and contract steps to get people on shifts faster."
    assert:
      - {type: llm-rubric, value: "Does not recommend dropping right-to-work checks or contracts, explains the legal risk, and speeds up onboarding instead through preboarding, digital paperwork and checklists, with local requirements to confirm."}
