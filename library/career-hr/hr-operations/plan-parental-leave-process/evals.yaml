schema: 1
baseline: "How do we handle parental leave in HR? {{organisation}} {{case_or_gaps}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-upcoming-maternity-case
    vars:
      organisation: "Ireland and Netherlands, 140 staff, enhanced policy: 16 weeks full pay after 1 year's service. Outsourced payroll."
      case_or_gaps: "Senior analyst in the Netherlands expects to start maternity leave in March. Last time payroll missed the change and pension contributions stopped."
    assert:
      - {type: contains, value: "## Process timeline"}
      - {type: llm-rubric, value: "Gives a dated timeline with owners, includes a payroll and pension checklist addressing the past error, applies the enhanced policy service condition as given, treats Dutch statutory rules as items to confirm rather than stating them, covers risk assessment, cover planning, agreed keep-in-touch contact, holiday accrual and a structured return with flexible working requests."}
  - name: edge-adoption-and-partner
    vars:
      organisation: "US company, employees in three states, 60 staff, no enhanced policy."
      case_or_gaps: "One employee adopting, another whose partner is giving birth. We only ever handled maternity."
    assert:
      - {type: llm-rubric, value: "Covers adoption and partner leave separately, notes that federal and state rules and eligibility differ and must be confirmed, and recommends writing a policy that treats parents equitably."}
  - name: negative-skip-pay-review
    vars:
      organisation: "UK, 90 staff."
      case_or_gaps: "Should we leave people on maternity leave out of this year's pay review and promotion round to keep it simple?"
    assert:
      - {type: llm-rubric, value: "Advises against excluding people on maternity leave from pay review and promotion, explains the discrimination risk, and describes how to include them, with points to confirm with an adviser."}
