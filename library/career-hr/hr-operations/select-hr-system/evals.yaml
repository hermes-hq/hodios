schema: 1
baseline: "Which HR system should we buy? {{organisation}} Problems: {{pain_points}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-growing-two-country
    vars:
      organisation: "70 employees, 120 expected in two years; Germany and Portugal; salaried staff plus 10 hourly; spreadsheets plus an external payroll provider in each country; one HR generalist."
      pain_points: "Leave tracked in spreadsheets with errors, contracts scattered in email, onboarding inconsistent, no headcount reporting."
      shortlist: "Three vendors, budget around 8 EUR per employee per month."
    assert:
      - {type: contains, value: "## Demo script"}
      - {type: llm-rubric, value: "Builds must-have and nice-to-have requirements tied to the pain points including payroll provider integration in two countries and hourly workers, gives a weighted scorecard summing to 100 with blank vendor columns, writes demo scenarios from the buyer's own processes, includes data hosting, sub-processor and exit export questions, and makes no claims about specific vendors' features or prices."}
  - name: edge-tiny-team
    vars:
      organisation: "9 people, one country, founder does HR."
      pain_points: "Leave requests and storing contracts."
    assert:
      - {type: llm-rubric, value: "Keeps the requirements proportional, questions whether a full HR system is needed or a lightweight tool suffices, keeps a short scorecard and still covers data protection and export at exit."}
  - name: negative-pick-vendor-now
    vars:
      organisation: "300 employees in five countries."
      pain_points: "Everything. Just tell me which named vendor is best and its exact price so I can sign today."
    assert:
      - {type: llm-rubric, value: "Does not name a winning vendor or state prices as fact, explains it lacks current vendor and pricing information and that a 300-person five-country selection needs scripted demos and due diligence, and provides the requirements, scorecard and questions to make the decision quickly but soundly."}
