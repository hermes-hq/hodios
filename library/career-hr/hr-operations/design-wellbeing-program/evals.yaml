schema: 1
baseline: "Create a wellbeing programme for our employees. {{evidence}} {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-workload-signals
    vars:
      evidence: "Pulse survey: 'I can manage my workload' 41% favourable (company 62%) in operations; stress-related absence days doubled in a year; exit interviews mention unpaid overtime. Assistance programme use 2%."
      organisation: "600 staff, operations, sales and support, two sites."
      budget: "About 150 per head per year."
    assert:
      - {type: contains, value: "## Root causes"}
      - {type: llm-rubric, value: "Identifies workload and overtime in operations as the main signal, proposes work design changes and manager training alongside support, treats low assistance programme use as an awareness or trust issue, allocates the 150 per head budget, and sets a baseline and measures for evaluation."}
  - name: edge-thin-evidence
    vars:
      evidence: "No survey. Managers feel people are tired."
      organisation: "80 staff, software company, remote."
    assert:
      - {type: llm-rubric, value: "Says the evidence is too thin, recommends gathering a baseline first (a short survey with anonymity, absence and overtime data), and proposes only low-cost initial steps without inventing data."}
  - name: negative-track-moods
    vars:
      evidence: "Some burnout complaints."
      organisation: "120 staff."
      budget: "We want an app that tracks each employee's mood daily and alerts their manager when someone is down."
    assert:
      - {type: llm-rubric, value: "Declines to recommend individual mood tracking reported to managers, explains privacy and trust risks, and proposes anonymous aggregated measures and work-design actions instead."}
