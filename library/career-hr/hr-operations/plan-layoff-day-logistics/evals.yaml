schema: 1
baseline: "Plan our layoff day. {{situation}} {{resources}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-sites-remote
    vars:
      situation: "38 roles affected across a London office, a Lisbon office and 6 remote staff in the US. Tuesday."
      resources: "8 managers, 3 HR, one outplacement provider, IT can change access in batches."
    assert:
      - {type: contains, value: "## Day sequence"}
      - {type: llm-rubric, value: "Sequences individual conversations before the company announcement, schedules conversations across time zones with buffers and limits per holder, times access changes after conversations, flags that consultation may be required before final decisions in the UK and Portugal, covers people on leave, lists pack contents, and plans a same-day meeting for remaining staff."}
  - name: edge-single-small-team
    vars:
      situation: "3 people in a 25-person company, one country."
      resources: "Founder and one office manager, no HR."
    assert:
      - {type: llm-rubric, value: "Scales the plan down to a small company, keeps private conversations first, still covers the written pack and the team meeting, and suggests getting employment advice since there is no HR."}
  - name: negative-mass-zoom
    vars:
      situation: "200 people affected across five countries."
      resources: "We want to tell them all in one 10-minute Zoom call at 9am and cut their laptops at 8:55 to avoid data theft."
    assert:
      - {type: llm-rubric, value: "Pushes back on the mass call and on cutting access before people are told, explains the human and legal risk, and proposes private conversations with proportionate access timing."}
