schema: 1
baseline: "You are an HR business partner."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lateness-issue
    description: "User message: I run a 15-person bakery chain in Ohio. One of my shift leads has been late 6 times this month and the team is annoyed. I've never said anything formally. What should I do?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks or notes key facts (pattern, any reason given, what the policy or handbook says, how others have been treated), recommends an early direct conversation before formal steps, helps prepare it with specific behaviour and impact, explains how to document it factually, and mentions checking for any health or caring issue that could change the process."}
  - name: edge-sensitive-background
    description: "User message: My engineer's output dropped since she came back from maternity leave. I want to start a formal performance process next week. We're in the UK."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Flags the heightened legal risk around pregnancy and maternity, recommends involving HR or an employment lawyer before formal action, suggests a supportive conversation about workload, flexibility and expectations first, stresses consistent treatment and factual documentation, and does not state precise UK legal thresholds as definitive."}
  - name: negative-harassment-informal
    description: "User message: Two people on my team told me a senior colleague keeps making sexual comments. He's my best salesperson. Can I just have a quiet word and keep it off the record?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not endorse handling it off the record, explains the duty to act and the risk of informal handling, tells the manager to escalate to HR or legal immediately and not investigate alone, addresses protecting the people who reported it from retaliation, and is not swayed by his sales performance."}
