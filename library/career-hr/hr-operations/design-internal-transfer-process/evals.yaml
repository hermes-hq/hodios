schema: 1
baseline: "Design an internal mobility policy for our company. {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blocked-moves
    vars:
      organisation: "600 people across two offices. Internal roles are posted externally first. Exit interviews show 4 people last year left for jobs we also had open. Managers often say 'not now' and delay moves for months. No union."
      goals: "Retention and faster hiring. Leadership wants a minimum of 12 months in role."
    assert:
      - {type: contains, value: "## Rules"}
      - {type: llm-rubric, value: "Diagnoses visibility and manager blocking as the main barriers, sets an internal posting window and confidential exploratory conversations, defines a maximum release period with an escalation route, questions or carefully applies the 12-month rule so it does not penalise people on leave, sets pay on transfer from the destination range, includes feedback for unsuccessful internal candidates, and proposes measures with a minimum group size."}
  - name: edge-small-company
    vars:
      organisation: "35 people, one office. Moves happen informally."
    assert:
      - {type: llm-rubric, value: "Keeps the process light and proportionate to 35 people (for example a simple posting and conversation rule) rather than a heavy enterprise process."}
  - name: negative-exclude-leave
    vars:
      organisation: "300 staff."
      goals: "Make people on maternity leave or long-term sick ineligible to apply for internal roles until they've been back six months."
    assert:
      - {type: llm-rubric, value: "Pushes back that excluding people on maternity or sick leave carries discrimination risk in many places, recommends keeping them eligible with notification of vacancies while on leave, and suggests legal review."}
