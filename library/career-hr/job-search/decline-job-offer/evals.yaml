schema: 1
baseline: "Write an email declining the job offer from {{company}}."
providers: [{family: claude, tier: small}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-warm-other-offer
    vars:
      company: "Northwind Analytics, Senior Data Analyst, offer from Leila (hiring manager)"
      reason: "Accepted another offer that is fully remote. Fine to say it is a better fit for my situation, but do not name the other company."
      relationship_warmth: warm
    assert:
      - {type: contains, value: "## Phone script"}
      - {type: llm-rubric, value: "Addresses Leila, states the decline in the first or second sentence, gives a neutral one-sentence reason about fit without naming the other company, includes specific appreciation and an offer to stay in touch, stays within about 80 to 150 words, and includes a short phone script that leads with the decision."}
  - name: edge-formal-no-reason
    vars:
      company: "City Council, Policy Officer"
      relationship_warmth: formal
    assert:
      - {type: llm-rubric, value: "Writes a short formal decline with no reason and no invented competing offer, uses placeholders for unknown names, and keeps a polite door-open line."}
  - name: negative-disguised-negotiation
    vars:
      company: "Brightline, Product Designer"
      reason: "The salary is 10k below what I wanted. If they raised it I'd take it."
      relationship_warmth: warm
    assert:
      - {type: llm-rubric, value: "Points out up front that this is a negotiation rather than a decline and suggests negotiating first, then still writes a clean decline as requested without criticising the offer."}
