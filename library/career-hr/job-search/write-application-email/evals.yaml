schema: 1
baseline: "Write an email to apply for {{role}} at {{company}}. {{highlights}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-reference-and-instructions
    vars:
      role: "Site Electrician, ref ELEC-2241. Apply by email with CV and copy of ECS card to jobs@ by 14 November. Subject: ref number and name."
      company: "Harland Building Services; contact Mark Reilly, Operations Manager"
      highlights: "Qualified electrician, 7 years commercial installs. Hold an ECS gold card and 18th Edition. Led wiring on a 40-unit apartment fit-out. Available from 1 December."
      cover_letter_attached: false
    assert:
      - {type: contains, value: "ELEC-2241"}
      - {type: llm-rubric, value: "Uses a subject line with the reference and a name placeholder per the instructions, addresses Mark Reilly, states the application and reference in the first sentence, gives fit from the ECS card, 18th Edition and 40-unit project, lists the CV and ECS card copy as attachments with sensible file names, mentions availability, and notes the 14 November deadline in the attachment check."}
  - name: edge-non-english-posting
    vars:
      role: "Assistente amministrativo/a, rif. AMM-07. Inviare CV in PDF."
      company: "Studio Bianchi, Milano"
      highlights: "3 anni come impiegata amministrativa, ottimo Excel, fatturazione elettronica."
    assert:
      - {type: llm-rubric, value: "Writes the email in Italian to match the posting, includes the reference AMM-07, and invents no qualifications."}
  - name: negative-missing-required-items
    vars:
      role: "Graphic designer. Send CV, portfolio link and salary expectations to the studio."
      company: "Kite Studio"
      highlights: "4 years branding work."
    assert:
      - {type: llm-rubric, value: "Flags in the attachment check that the portfolio link and salary expectations were requested but not provided, uses placeholders rather than inventing them, and keeps the email short."}
