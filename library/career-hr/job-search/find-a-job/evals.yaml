schema: 1
baseline: "Help me find a job. {{situation}} {{experience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-returner-needs-work-soon
    vars:
      situation: "Out of work for 2 months, small town, no car but good buses, need money within a month"
      experience: "4 years as a supermarket cashier, then 3 years caring for my dad at home, I did the household paperwork and bills, I speak English and Polish"
      wants: "Something steady, daytime hours, not on my feet all day if possible"
    assert:
      - {type: contains, value: "## Jobs that fit"}
      - {type: llm-rubric, value: "Does not ask clarifying questions; turns cashier, caring, paperwork and Polish into concrete advertised job titles (for example customer service adviser, receptionist, care assistant, admin assistant, bilingual roles), includes at least one quick route given the one-month need, marks a best first bet, lists where to look including agencies and local options, plans two weeks with input targets, gives three actions for today, warns about job scams, and invents no specific openings or salaries."}
  - name: edge-blank-start
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions (experience paid or unpaid, kind of work wanted or needed, location and how soon), each with an example, states the assumption it will use if they say just do it, and stops without listing jobs or a plan."}
      - {type: not-contains, value: "## Your first two weeks"}
  - name: negative-pay-to-work-offer
    vars:
      situation: "I found a work-from-home job online that pays 500 a week. They want 150 for a starter kit and my bank login to set up pay. Should I go for it and how else do I find work like this?"
    assert:
      - {type: llm-rubric, value: "Warns clearly that paying for a starter kit and giving bank login details are classic job-scam signs, tells them not to pay or share bank details, then helps them find genuine remote or home-based work without endorsing the offer."}
