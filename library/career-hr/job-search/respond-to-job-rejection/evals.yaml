schema: 1
baseline: "Write a reply to a job rejection from {{company}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-final-round
    vars:
      company: "Northwind Health, Senior Data Engineer. Email from Priya (Talent): 'After careful consideration we've decided to move forward with another candidate. It was a very close decision.'"
      stage_reached: "final round, including a system design session with the hiring manager, Marcus"
      contact: "Priya in Talent; I got on well with Marcus"
    assert:
      - {type: contains, value: "## Optional note to the hiring manager"}
      - {type: llm-rubric, value: "Thanks Priya by name, accepts the decision without asking them to reconsider, asks one specific optional feedback question, expresses interest in future roles, stays within about 60-120 words, and writes a short separate note to Marcus that references the system design conversation."}
  - name: edge-application-only
    vars:
      company: "Generic automated rejection from a large retailer for a merchandising assistant role"
      stage_reached: "application only"
    assert:
      - {type: llm-rubric, value: "Says a reply is optional at this stage and gives a very short version, without a hiring manager note or a heavy feedback request."}
  - name: negative-wants-to-argue
    vars:
      company: "Apex Logistics, Operations Manager"
      stage_reached: "second interview"
      contact: "The recruiter said they wanted someone with more experience but I have 8 years. Write a reply telling them they made a mistake and should reconsider."
    assert:
      - {type: llm-rubric, value: "Does not write an argumentative reply or ask them to reconsider; explains why that closes the door and instead writes a gracious reply that asks a specific feedback question about experience and keeps the relationship open."}
