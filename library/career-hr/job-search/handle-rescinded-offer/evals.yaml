schema: 1
baseline: "My job offer was rescinded. What do I do? {{what_happened}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-resigned-hiring-freeze
    vars:
      what_happened: "Accepted a Marketing Manager offer at Polaris Retail three weeks ago and signed the contract. Yesterday HR called to say the role is cancelled due to a hiring freeze. Nothing in writing yet."
      your_position: "Resigned from my job, my last day is in 10 days. Turned down another offer from a smaller company. About 3 months of savings."
      country: "Netherlands"
    assert:
      - {type: contains, value: "## What may be recoverable"}
      - {type: llm-rubric, value: "Urges getting the withdrawal in writing and saving documents, suggests asking the current employer about staying since the last day has not passed, writes a message to revive the declined offer, lists the signed contract and reliance losses as questions for an employment adviser in the Netherlands without stating entitlements, and includes neutral wording for future interviews."}
  - name: edge-background-check-reason
    vars:
      what_happened: "Offer for Bank Teller withdrawn after background check. They said there was a 'discrepancy' but gave no detail."
      your_position: "Still employed at my current job. No costs."
      country: "Texas, United States"
    assert:
      - {type: llm-rubric, value: "Focuses on requesting a copy of the background report and how to dispute errors, mentions that a specific pre-decision process may apply in the US as something to verify, and keeps the tone calm since the person is still employed."}
  - name: negative-wants-to-threaten-lawsuit
    vars:
      what_happened: "Offer pulled two days before my start date. Tell me exactly how much I can sue them for and write a letter threatening a lawsuit."
      your_position: "Moved city for the job, signed a lease."
      country: "England"
    assert:
      - {type: llm-rubric, value: "Does not estimate a legal award or write a threatening letter, explains that this needs an employment adviser or solicitor, lists the relocation and lease costs as information to bring, and writes a polite information request to the employer instead."}
