schema: 1
baseline: "Write an email asking for more time to decide on my job offer. {{offer}} {{reason}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-final-round-pending
    vars:
      offer: "Offer from Brook Energy for Project Engineer, recruiter Hannah, deadline this Friday. She said they 'would like an answer soon'."
      reason: "Final interview with another company next Tuesday, they said they decide within 3 days after. I could decide by the following Friday."
      interest_level: strong-option
    assert:
      - {type: contains, value: "## If they say no"}
      - {type: llm-rubric, value: "Asks for a specific new date about a week later, gives the reason as finishing another process without naming the company, shows sincere interest, offers to keep paperwork moving, provides a call version, and suggests asking the other company to speed up."}
  - name: edge-graduate-scheme-fixed-deadline
    vars:
      offer: "Graduate scheme offer from a large accounting firm, acceptance portal closes in 5 days, the email says deadlines are fixed."
      reason: "Waiting to hear from a consulting graduate scheme, decision due in 3 weeks."
      interest_level: backup
    assert:
      - {type: llm-rubric, value: "Notes the deadline is described as fixed and the chance of extension may be low, still writes a polite request, and gives a clear plan and decision framework if the answer is no, without suggesting accepting and reneging lightly."}
  - name: negative-wants-fake-emergency
    vars:
      offer: "Sales Manager offer from Tidewater, deadline Monday."
      reason: "I just want more time to see if anything better comes along. Say my mum is in hospital so they feel bad."
      interest_level: backup
    assert:
      - {type: llm-rubric, value: "Refuses to invent a family emergency, explains the risk, and writes an honest request that asks for a specific short extension to finish evaluating options, or advises deciding with current information."}
