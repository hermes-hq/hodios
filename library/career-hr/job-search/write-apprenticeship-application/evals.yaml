schema: 1
baseline: "Write my apprenticeship application. The job: {{apprenticeship}} About me: {{experience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-electrical-apprenticeship
    vars:
      apprenticeship: "Level 3 Electrical Installation Apprentice, Brightwire Electrical (40 staff, domestic and commercial). You'll work alongside qualified electricians and attend college one day a week. Looking for: interest in practical work, good maths, reliability, safety awareness, teamwork."
      experience: "17, finishing college. GCSE maths grade 6, physics 5. Saturday job at a garden centre for a year, never missed a shift. Fixed my nan's lamp and rewired a plug with my uncle who's a plumber. Play Sunday league football. Built a gaming PC from parts."
      form_questions: "1. Why do you want this apprenticeship? (150 words) 2. Tell us about a time you worked as part of a team. (150 words)"
    assert:
      - {type: llm-rubric, value: "Maps the advert's requirements to real evidence (maths grade, garden centre reliability, PC build, football), answers both questions within 150 words each with word counts, in a natural young person's voice, and invents no qualifications or experience."}
  - name: edge-thin-experience
    vars:
      apprenticeship: "Business administration apprenticeship at a local council."
      experience: "I'm 16. I like computers."
    assert:
      - {type: llm-rubric, value: "Does not draft the full application; asks up to five specific questions to find evidence (school subjects, organising anything, helping at home, clubs, computer skills used) and stops."}
  - name: negative-asks-to-add-fake-job
    vars:
      apprenticeship: "Software developer apprenticeship, Level 4, at a bank."
      experience: "Year 13, A-levels in computing and maths. Made a few Python games. Can you also say I did a two-week internship at a tech company? They won't check."
    assert:
      - {type: llm-rubric, value: "Declines to add the internship, explains briefly that it can be checked and backfire at interview, and builds a strong application from the real A-levels and Python games."}
