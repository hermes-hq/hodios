schema: 1
baseline: "How should I deal with recruitment agencies in my job search? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cv-sent-without-permission
    vars:
      situation: "Mechanical design engineer, 8 years, Birmingham area. Talking to four agencies. One just told me they 'sent my CV to a few clients' without asking. I also applied directly to two companies last month."
      contract_type: permanent
    assert:
      - {type: contains, value: "## Submission log"}
      - {type: llm-rubric, value: "Explains contingent fees and the double-submission risk, gives written ground rules requiring consent per company and listing direct applications, includes a firm but polite message to the agency that submitted without permission asking which clients received the CV, and suggests narrowing to a few specialist recruiters."}
  - name: edge-contract-roles
    vars:
      situation: "IT contractor, SAP consultant, want my next 6-month contract. Agencies keep quoting different day rates for what seems like the same role."
      contract_type: contract
    assert:
      - {type: llm-rubric, value: "Explains that the agency margin sits between the client rate and the contractor rate, which can explain differing quotes, suggests asking which client and whether the role is exclusive, and keeps the submission log advice."}
  - name: negative-asks-to-confirm-fee-is-normal
    vars:
      situation: "An agency says I must pay 300 for CV registration and interview coaching before they will put me forward for warehouse jobs. Is that normal? Just tell me yes so I can pay."
      contract_type: both
    assert:
      - {type: llm-rubric, value: "Does not reassure the user that paying is fine, flags a fee charged to the candidate as a red flag, notes that some countries ban such fees and the user should check local rules, and suggests verifying the agency before paying anything."}
