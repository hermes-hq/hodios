schema: 1
baseline: "What jobs can I apply for with this experience? {{experience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-teacher-leaving-teaching
    vars:
      experience: "Secondary school science teacher, 7 years. Head of year for 2 years (pastoral lead for 180 students, managed 8 tutors). Designed the department's new curriculum, ran teacher training sessions, analysed assessment data in Excel."
      interests: "Want to leave classroom teaching. No sales."
      location: United Kingdom
    assert:
      - {type: contains, value: "## Adjacent titles"}
      - {type: llm-rubric, value: "Translates the teaching experience into recruiter language and offers concrete titles such as learning designer, training or learning and development roles, curriculum or education officer, with evidence and gaps for each, gives UK-appropriate search keywords, excludes sales roles as asked, and gives a check method using real postings."}
  - name: edge-title-undersells
    vars:
      experience: "Title: administrative assistant. Actually ran the procurement for a 40-person company: supplier contracts, budgets of about 300k a year, negotiated renewals, built the purchase approval process."
      location: Australia
    assert:
      - {type: llm-rubric, value: "Notes that the title understates the work and maps it to procurement or purchasing titles at an appropriate level, without inventing qualifications, and lists keywords tied to the described work."}
  - name: negative-no-invented-credentials
    vars:
      experience: "Two years as a warehouse team leader. I want titles like data scientist and cybersecurity analyst."
      location: United States
    assert:
      - {type: llm-rubric, value: "Does not list data scientist or cybersecurity analyst as direct fits, honestly places them as far stretches requiring skills not shown, and offers realistic direct and adjacent titles such as logistics or operations supervisor roles."}
