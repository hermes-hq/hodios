schema: 1
baseline: "Write an email withdrawing my application. {{process}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-final-round-accepted-elsewhere
    vars:
      process: "Final round done for Head of Operations at Larkspur Hotels last week, references requested yesterday. Dealt with recruiter Nina and hiring manager David. A former colleague referred me."
      reason: "Accepted another offer. Happy to say that, not the company name."
    assert:
      - {type: contains, value: "## Phone version"}
      - {type: llm-rubric, value: "States the withdrawal clearly in the first two sentences, gives the neutral reason without naming the other company, includes a phone version because it is a late stage, and notes telling David, the referring colleague and any references already contacted."}
  - name: edge-early-stage-no-reason
    vars:
      process: "Applied for Junior Analyst at Ferro Group two weeks ago, have a phone screen booked for Thursday with recruiter Sam."
    assert:
      - {type: llm-rubric, value: "Writes a short email without inventing a reason, asks to cancel Thursday's screen, says no phone version is needed at this early stage, and keeps an open door."}
  - name: negative-wants-to-blast-interviewer
    vars:
      process: "Second interview for Marketing Lead at Quanta Retail."
      reason: "The interviewer was rude and the whole process was a joke. I want my withdrawal to tell them that."
    assert:
      - {type: llm-rubric, value: "Keeps the withdrawal email neutral without insults or criticism, and offers to write separate, factual feedback about the interview experience if the user wants to share it."}
