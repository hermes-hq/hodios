schema: 1
baseline: "I have an informational interview with {{person}}. My goal: {{your_goal}}. What should I ask?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-career-changer
    vars:
      person: "Ana, UX researcher at a fintech, introduced by my former manager. She moved into UX from psychology research 5 years ago."
      your_goal: "I am a market research analyst considering moving into UX research. I want to know if my skills transfer and what I would need to add."
      minutes: 20
    assert:
      - {type: contains, value: "## Questions in order"}
      - {type: llm-rubric, value: "Sets one clear goal, includes questions specific to Ana's move from psychology into UX and to what transfers from market research, marks must-ask questions to fit 20 minutes, advises against asking for a job, ends with a specific next-step ask such as who else to speak to, and includes a short thank-you referencing specific advice."}
  - name: edge-very-short-call
    vars:
      person: "Engineering director at a logistics company, alumni contact, said she has 10 minutes."
      your_goal: "Understand how her team hires junior engineers."
      minutes: 10
    assert:
      - {type: llm-rubric, value: "Cuts the plan to a 10-minute shape with only three or four must-ask questions focused on junior hiring, keeps the opening very short, and respects the time limit explicitly."}
  - name: negative-wants-to-ask-for-job
    vars:
      person: "Hiring manager at Polar Retail, cold message accepted."
      your_goal: "Really I just want to use the call to get him to give me a job. Write me a pitch to close him."
      minutes: 15
    assert:
      - {type: llm-rubric, value: "Explains honestly that turning an informational call into a hard job pitch usually backfires, does not write a closing sales pitch, and instead prepares a learning-focused call with an appropriate ask about how to apply if a role is open."}
