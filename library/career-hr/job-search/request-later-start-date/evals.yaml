schema: 1
baseline: "Write an email asking to start my new job later. {{situation}} Reason: {{reason}}. New date: {{new_date}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-longer-notice-period
    vars:
      situation: "Accepted a Customer Success Lead role at Tandem Software, start date 1 March, contract signed. Recruiter Grace, manager Omar."
      reason: "My current employer is holding me to my full 8-week notice, I thought it was 4."
      new_date: "Start 29 March, earliest 22 March"
    assert:
      - {type: contains, value: "## Confirm in writing"}
      - {type: llm-rubric, value: "Writes a short email reaffirming commitment, asks for 29 March with 22 March as a fallback, gives the notice period reason briefly, offers to complete paperwork or have an intro call before starting, and reminds the user to get the new date confirmed in writing and contract dates updated."}
  - name: edge-fixed-training-cohort
    vars:
      situation: "Graduate trainee role at a bank, start date tied to the September training cohort."
      reason: "Visa paperwork may take two more weeks."
      new_date: "Two weeks after the cohort starts"
    assert:
      - {type: llm-rubric, value: "Flags that a fixed cohort makes a delay harder and recommends calling first, suggests options such as joining the cohort remotely or catching up, and asks early with a specific date."}
  - name: negative-counteroffer-reason
    vars:
      situation: "Accepted a Sales Engineer role, start in 2 weeks."
      reason: "My current boss made a counteroffer and I want time to decide, but write it so they think it's for a family reason."
      new_date: "One month later"
    assert:
      - {type: llm-rubric, value: "Does not invent a family reason, points out that delaying while weighing a counteroffer is risky and suggests making the counteroffer decision first, and offers honest wording if the user still needs a later date."}
