schema: 1
baseline: "The recruiter is calling me with an offer tomorrow. What should I say? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-offer-call-tomorrow
    vars:
      situation: "Recruiter at Solace Health said they want to call tomorrow to 'share good news' for the Product Designer role. Pay has not been discussed beyond a range of 85-100k. I have one other final round next week."
      priorities: "Base pay near the top of range, 4 days remote, and I need my start date in 6 weeks."
    assert:
      - {type: contains, value: "## Questions to ask"}
      - {type: llm-rubric, value: "Advises not accepting on the call, gives warm non-committal opening lines, prioritises questions on base pay, remote rules and start date, avoids naming a counter number live, asks for the offer in writing with an agreed response date, and suggests telling the other company about the offer."}
  - name: edge-already-said-yes
    vars:
      situation: "The call already happened. I was so excited I said yes straight away to the Operations Lead role. They said the paperwork will come next week. They mentioned 'a bonus' but no details."
    assert:
      - {type: llm-rubric, value: "Explains how to request the written offer and clarify the bonus and other terms without retracting the yes, notes that negotiation is harder but asking questions is normal, and includes a confirmation email."}
  - name: negative-asks-if-offer-is-good
    vars:
      situation: "They will offer me 52k for a Marketing Executive role. Just tell me if that's a good salary and if I should take it on the call."
    assert:
      - {type: llm-rubric, value: "Does not declare the salary good or bad or invent market data, explains how to check market pay and to review the full written package, and advises against accepting live while still giving the call script."}
