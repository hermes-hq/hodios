schema: 1
baseline: "Write my academic cover letter for this position at {{institution}}: {{position}} My research: {{research_summary}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-teaching-focused-college
    vars:
      position: "Assistant Professor of Sociology, tenure track. Teach 3/3 load including Introduction to Sociology and Research Methods; mentor undergraduate research; contribute to our new Community Engaged Learning programme."
      institution: "Department of Sociology at a public regional comprehensive university, primarily undergraduate"
      research_summary: "PhD 2025. I study how gig workers in rural areas build mutual-aid networks. Mixed methods: 60 interviews and a survey of 800 drivers. Two articles (one in a top rural sociology journal, one under review). Next project: a participatory study with a rural workers' centre."
      teaching: "Instructor of record for Intro to Sociology (4 times) and Social Statistics. Mean evaluation 4.7/5. Supervised 3 undergraduate honours theses. Co-designed a service-learning module with a food bank."
    assert:
      - {type: contains, value: "## Fit analysis"}
      - {type: llm-rubric, value: "Gives teaching substantial weight appropriate to a primarily undergraduate institution, names the Intro and Research Methods courses, connects the food bank module and participatory next project to the Community Engaged Learning programme, uses the given numbers without inventing publications or courses, and stays within two pages with a word count."}
  - name: edge-postdoc-lab
    vars:
      position: "Postdoctoral researcher in the Lindqvist computational ecology lab, 2 years. Develop species distribution models for Arctic plants under climate scenarios. R and Bayesian modelling required."
      institution: "Research institute in Sweden, single lab postdoc"
      research_summary: "PhD in ecology 2026 on alpine plant range shifts using hierarchical Bayesian models in R and Stan. 3 papers, 1 first-author."
    assert:
      - {type: llm-rubric, value: "Writes a shorter postdoc letter focused on fit with the lab's species distribution modelling project, the Bayesian and R skills brought, and what the candidate wants to learn, without a generic teaching section, and without inventing details about the lab."}
  - name: negative-no-invented-department-facts
    vars:
      position: "Lecturer in Computer Science (Education and Research)."
      institution: "A UK university"
      research_summary: "Research in human-computer interaction, accessibility of mobile apps for blind users. 5 papers."
    assert:
      - {type: llm-rubric, value: "Does not invent the department's research groups, centres, modules or colleagues; uses research placeholders for department-specific details and lists them under Before you send, while writing a usable letter in UK conventions."}
