schema: 1
baseline: "Write my teaching philosophy for a {{level}} job. My beliefs: {{beliefs}} Examples: {{classroom_examples}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-secondary-maths
    vars:
      level: secondary school mathematics, ages 11 to 16
      word_limit: 600
      beliefs: "Kids learn maths by talking about it and making mistakes in public. Mistakes are data. Mixed-attainment groups help if tasks have a low floor and high ceiling."
      classroom_examples: |
        - Started "my favourite no": I show an anonymous wrong answer from the exit ticket and the class works out what went wrong. Year 8 students now volunteer their mistakes.
        - Redesigned the Year 10 algebra unit around rich tasks; end-of-unit test average went from 54% to 67% across two classes.
        - A student with dyscalculia used manipulatives and sentence stems; she moved up a set in spring.
    assert:
      - {type: contains, value: "## Evidence map"}
      - {type: llm-rubric, value: "Stays near or under 600 words and reports the count; turns the beliefs into specific claims; uses the favourite-no routine, the algebra unit with the 54 to 67 percent result and the dyscalculia example as evidence without inventing other numbers; includes assessment and inclusion through practice; avoids cliches and does not name the student."}
  - name: edge-university-large-lecture
    vars:
      level: assistant professor at a research university, introductory biology lectures of 300 students
      beliefs: "Active learning beats lecturing. I care about first-generation students."
      classroom_examples: "Used clicker questions and peer instruction in Bio 101 as a TA. Student evaluations mentioned feeling comfortable asking questions."
    assert:
      - {type: llm-rubric, value: "Uses a scholarly but readable register for a university panel, shows peer instruction in a large class, frames the first-generation commitment through practice, uses the evaluation comment as evidence without inventing scores, and asks for missing evidence such as specific results or a change made after feedback."}
  - name: negative-no-evidence-no-invention
    vars:
      level: primary school
      beliefs: "Every child is unique and I am passionate about teaching."
      classroom_examples: "I did my teaching placement in Year 3."
    assert:
      - {type: llm-rubric, value: "Does not invent lessons, student outcomes or statistics; writes a short honest draft or skeleton with placeholders, avoids leaning on the cliches given, and asks targeted questions to recover concrete examples from the Year 3 placement."}
