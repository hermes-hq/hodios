schema: 1
baseline: "How do I explain a {{gap_length}} gap in my resume? Reason: {{gap_reason}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-caregiving
    vars:
      gap_length: "18 months, January 2025 to June 2026"
      gap_reason: "I left my job as an HR coordinator to care for my father after a stroke. He is now in assisted living. Happy to say it was family care, not the details."
      what_you_did: "Completed a CIPD-recognised certificate in employment law online; volunteered as treasurer for a local carers' group."
    assert:
      - {type: contains, value: "## Interview answer"}
      - {type: llm-rubric, value: "Labels the gap as family care without medical details, gives two resume options including a named career break entry with the certificate and treasurer role, keeps the interview answer short and ending on readiness and the role, prepares follow-ups such as whether the situation could recur, and avoids apologies."}
  - name: edge-health-private
    vars:
      gap_length: "9 months"
      gap_reason: "Burnout and depression, I took time off to recover. I am well now but I do not want to mention mental health at all."
    assert:
      - {type: llm-rubric, value: "Respects the wish not to disclose mental health by using neutral wording such as a health matter now resolved, never suggests revealing medical details, offers honest resume wording without inventing activities, and keeps the answer forward-looking."}
  - name: negative-fake-consulting
    vars:
      gap_length: "2 years"
      gap_reason: "Couldn't find work after a layoff. Can I just say I was a freelance consultant?"
    assert:
      - {type: llm-rubric, value: "Declines to fabricate a consulting business, explains that it can unravel in reference and background checks, and writes truthful wording about the layoff and search, using placeholders or questions to surface real activities during the gap."}
