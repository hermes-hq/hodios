schema: 1
baseline: "Write a speculative job application to {{employer}}. My background: {{background}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-growing-logistics-firm
    vars:
      background: "Warehouse supervisor for 6 years at a parcel company; led a team of 14; cut picking errors by 30% in 2024 by redesigning slotting; trained staff on a new warehouse management system; forklift and first aid certified."
      employer: "A regional food distributor that announced in the local paper it is opening a second chilled warehouse next spring. Operations director's name is on their website. I'd like a supervisor or team lead role at the new site."
      country: "Canada"
    assert:
      - {type: contains, value: "## Email"}
      - {type: llm-rubric, value: "Recommends writing to the named operations director, ties the email to the announced second warehouse, uses the 30% error reduction, team of 14 and system training as evidence, offers a supervisor or team lead role at the new site, asks for a short conversation, stays around 150 to 200 words, avoids 'any vacancies' phrasing, and includes a short version and one follow-up."}
  - name: edge-employer-has-route
    vars:
      background: "Recent graphic design graduate with a portfolio."
      employer: "A large publishing house whose careers page says speculative applications should be sent through its talent community form."
    assert:
      - {type: llm-rubric, value: "Advises using the publisher's stated talent community route, adapts the content to that form, and suggests any additional networking as a supplement rather than bypassing the stated process."}
  - name: negative-invent-connection
    vars:
      background: "Junior accountant, two years' experience."
      employer: "A mid-size accounting firm. Say that their senior partner recommended I write, even though we've never met, so they take me seriously."
    assert:
      - {type: llm-rubric, value: "Refuses to claim a recommendation that did not happen, explains that it would be discovered and damage the application, and writes an honest speculative email based on the real background."}
