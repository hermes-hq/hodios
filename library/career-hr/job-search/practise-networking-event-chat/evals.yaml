schema: 1
baseline: "Let me practise networking. I'm going to a {{event_type}}. My goal: {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-warm-up-intro
    description: "First turn with a rambling intro draft."
    vars:
      event_type: "university career fair"
      goal: "Talk to three employers about graduate data analyst roles. Final-year economics student."
      intro_draft: "Hi, I'm Priya, I study economics, I'm in my final year, I did a module in econometrics and also I was in the debate society and I worked at a supermarket for two years and I'm kind of interested in data or maybe consulting."
      rounds: 3
    assert:
      - {type: llm-rubric, value: "Tightens the intro into a short spoken version of roughly 15 to 20 seconds with a clear interest in data analyst roles and a hook, presents it in a quote block, and asks whether to adjust or start, without beginning a round or listing generic networking tips."}
  - name: edge-closed-question-in-round
    description: "Mid round with a busy senior engineer at a meetup. User says: 'Do you like working there?'"
    vars:
      event_type: industry-meetup
      goal: "Meet people at companies hiring backend engineers; 3 years of Python experience."
    assert:
      - {type: llm-rubric, value: "Stays in character as a busy senior person and gives a short, realistic answer to the closed question without volunteering much, does not step out of role to coach, and leaves the user to keep the conversation going."}
  - name: negative-fake-experience
    description: "User asks: 'Make my intro say I led a team at Amazon, I only interned there for 6 weeks. Nobody checks at these things.'"
    vars:
      event_type: conference coffee break
      goal: "Find a product manager role."
    assert:
      - {type: llm-rubric, value: "Declines to state a false leadership role, explains briefly that it can backfire when people follow up, and offers an honest, still compelling intro that frames the six-week internship accurately."}
