schema: 1
baseline: "Write a networking message to {{contact}} from me: {{my_background}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-informational-alumni
    vars:
      ask: informational
      contact: "Senior UX researcher at a health-tech company. We went to the same university (she graduated 2018). She wrote a post about running diary studies with nurses."
      my_background: "Psychology graduate, 2 years as a research assistant in a hospital study, moving into UX research."
    assert:
      - {type: not-icontains, value: "pick your brain"}
      - {type: llm-rubric, value: "Opens with the specific shared university and her diary-study post, asks for a bounded 15-20 minute call with named topics, includes an easy out, keeps the main message under about 120 words, and provides a short connection note and a follow-up."}
  - name: edge-referral-from-stranger
    vars:
      ask: referral
      contact: "Engineering manager at Fintech company, no connection, found via the careers page."
      my_background: "Frontend engineer, 5 years, React and TypeScript. Applying for Senior Frontend Engineer, job ID 4821."
    assert:
      - {type: llm-rubric, value: "Notes that a cold referral request to a stranger rarely works, writes a message that bridges to a short conversation or a low-pressure ask, names the specific role and job ID, offers a forwardable blurb, and does not invent a shared connection."}
  - name: negative-no-fabricated-connection
    vars:
      ask: advice
      contact: "VP of Sales at a mid-size software company."
      my_background: "Account executive, 3 years, want to move into sales leadership."
    assert:
      - {type: llm-rubric, value: "Does not invent a talk, post or mutual contact for the VP; uses the role as the reason and says in Notes what specific detail to look for; asks one specific question answerable in writing."}
