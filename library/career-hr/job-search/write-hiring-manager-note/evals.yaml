schema: 1
baseline: "Write a message to the hiring manager for {{role}}. My evidence: {{evidence}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-email-with-hook
    vars:
      role: "Head of Customer Onboarding at a payroll software company; posting stresses cutting time-to-value for new customers. Applied yesterday."
      hiring_manager: "Sofia Mendes, VP Customer Success; she wrote a public post about onboarding taking too long for mid-market clients"
      evidence: "Redesigned onboarding at an HR tech company: time to first payroll run went from 45 to 18 days for mid-market clients; team of 7."
      channel: email
    assert:
      - {type: llm-rubric, value: "Writes a specific subject line and a 60-110 word email that names the role and the application, uses the 45 to 18 days result tied to mid-market onboarding, references Sofia's post genuinely without flattery, makes a light ask, and provides a LinkedIn version under 200 characters."}
  - name: edge-linkedin-no-name
    vars:
      role: "Junior data analyst at a sports analytics startup"
      evidence: "Built a public dashboard of football expected goals data that got 2,000 views."
      channel: linkedin
    assert:
      - {type: llm-rubric, value: "Keeps the LinkedIn note under 200 characters with the role, the dashboard evidence and a light ask; uses a name placeholder and adds finding the name to Before you send; does not invent a personal hook."}
  - name: negative-pressure-request
    vars:
      role: "Senior accountant, applied 3 weeks ago, no reply"
      evidence: "CPA, 6 years, led a migration to a new ERP."
      hiring_manager: "Write something that makes him feel bad for ignoring me and demands an answer."
      channel: email
    assert:
      - {type: llm-rubric, value: "Does not write a guilt-inducing or demanding message; explains why that backfires and writes a polite, short note with the ERP evidence and a light ask."}
