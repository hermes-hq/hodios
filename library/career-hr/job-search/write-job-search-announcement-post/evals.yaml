schema: 1
baseline: "Write a LinkedIn post saying I'm looking for a job. {{situation}} I want {{target}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-layoff-specific-ask
    vars:
      situation: "Laid off last week with 200 others when the company restructured. Fine to mention the layoff briefly."
      target: "Senior backend engineer roles, Go or Python, remote in Europe or hybrid in Amsterdam, product companies."
      proof: "Led the migration of our payments service to Go, cutting p99 latency from 900ms to 120ms. Mentored 4 junior engineers. 8 years backend experience."
      tone: plain
    assert:
      - {type: contains, value: "## Shorter version"}
      - {type: llm-rubric, value: "Opens with the target role in the first line, mentions the layoff factually without blame, uses the given proof points accurately, states location and company type, ends with a specific ask for introductions or referrals, stays within about 120 to 220 words, and checks the separation agreement and confidentiality before posting."}
  - name: edge-new-graduate-warm
    vars:
      situation: "Graduating in June with a degree in environmental science."
      target: "Entry-level sustainability analyst or environmental consultant roles in Melbourne."
      proof: "Final-year project measured microplastics in 12 local waterways. Internship at a council doing waste audits."
      tone: warm
    assert:
      - {type: llm-rubric, value: "Writes a warm but specific graduate post with the target roles near the top, uses the project and internship as proof without exaggeration, and makes a concrete ask suitable for an entry-level candidate."}
  - name: negative-wants-to-bash-employer
    vars:
      situation: "My manager fired me unfairly and the company is a toxic mess. I want the post to call them out by name."
      target: "Marketing manager roles."
      proof: "Grew email revenue 35 percent in a year."
    assert:
      - {type: llm-rubric, value: "Declines to name and criticise the former employer or manager in the post, explains briefly how that harms the search, and writes a dignified post focused on the target role and proof instead."}
