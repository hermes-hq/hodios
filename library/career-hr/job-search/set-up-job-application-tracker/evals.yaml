schema: 1
baseline: "Make me a job application tracker in a {{tool}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spreadsheet
    vars:
      tool: spreadsheet
      applications_per_week: 10
      search_context: "Junior UX designer roles, also doing two coffee chats a week, about 12 hours a week for the search."
    assert:
      - {type: contains, value: "## Build it"}
      - {type: llm-rubric, value: "Defines stages with exit rules including No response, lists columns with a source field, gives a header row and formulas for a follow-up-due flag, counts per stage and response rate by source whose column references match the header row, adds follow-up timing rules, splits ten applications plus coffee chats into weekly actions with a sanity check against 12 hours, and gives a weekly review routine."}
  - name: edge-notion-high-volume
    vars:
      tool: notion
      applications_per_week: 60
      search_context: "Two hours a week available."
    assert:
      - {type: llm-rubric, value: "Gives Notion database properties, a follow-up formula property and three views, and flags that 60 applications in two hours a week is unrealistic to do well, suggesting a lower target or fewer, better-targeted applications."}
  - name: negative-paper-no-formulas
    vars:
      tool: paper
      applications_per_week: 5
    assert:
      - {type: llm-rubric, value: "Provides a notebook layout, symbols for stages and a weekly tally table, and does not give spreadsheet formulas or Notion properties as the main build."}
