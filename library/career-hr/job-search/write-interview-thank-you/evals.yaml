schema: 1
baseline: "Write a thank-you email after my interview. Notes: {{interview_notes}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-repair-weak-answer
    vars:
      interviewer: "Priya Shah, Head of Product"
      interview_notes: "Second-round interview for Product Analyst at a meal-kit company. Priya said churn after the third box is their biggest problem. I talked about my cohort analysis at my current job that found onboarding emails cut early churn by 8%. I fumbled the SQL window-functions question and said I'd 'have to look it up'. Next step: take-home exercise next week."
    assert:
      - {type: contains, value: "## Subject line"}
      - {type: llm-rubric, value: "Under about 150 words, references the third-box churn problem early, links it to the 8% cohort analysis, adds a brief confident clarification on window functions without apologising or inventing skills, mentions the take-home next step, and contains no generic filler."}
  - name: edge-panel-three-people
    vars:
      interview_notes: "Panel interview for a nurse educator role. Met Tom (ward manager) who asked about training night staff; Aisha (practice development) who talked about the new simulation lab; and Ben (HR) who explained the rotation schedule."
    assert:
      - {type: llm-rubric, value: "Writes three distinct notes, one per person, each referencing a different moment from the notes, without copying the same body text across them."}
  - name: negative-no-details
    vars:
      interview_notes: "Had an interview today. It went fine."
    assert:
      - {type: llm-rubric, value: "Asks for at least one specific moment and the role or interviewer, does not invent conversation details, and may offer a draft with clearly marked placeholders."}
