schema: 1
baseline: "Make me a job search plan. I want to be a {{goal_role}}. {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stalled-search
    vars:
      goal_role: Product marketing manager, B2B SaaS, remote US
      hours_per_week: 12
      situation: "Laid off 2 months ago, 4 years in content marketing at a SaaS company. Sent about 70 applications through job boards, got 3 recruiter screens and no further interviews. 5 months of savings. US citizen."
    assert:
      - {type: contains, value: "## Pipeline tracker"}
      - {type: llm-rubric, value: "Diagnoses low application-to-screen conversion and a screen-to-interview drop rather than prescribing more volume, shifts hours toward referrals and outreach, gives weekly input targets that fit 12 hours, labels conversion rates as assumptions, and addresses positioning from content marketing to product marketing."}
  - name: edge-very-few-hours
    vars:
      goal_role: Staff nurse in a pediatric unit
      hours_per_week: 3
      situation: "Currently an adult ward nurse, employed, want to move within 6 months, same city."
    assert:
      - {type: llm-rubric, value: "Sizes the weekly rhythm to about 3 hours, prioritises internal transfers and networking with pediatric staff over volume, and notes any credential or experience questions to check rather than inventing requirements."}
  - name: negative-no-invented-market-data
    vars:
      goal_role: Data scientist
      hours_per_week: 10
      situation: "Just finished a master's degree."
    assert:
      - {type: llm-rubric, value: "Does not state specific invented statistics about the job market or salaries as facts, lists open questions such as location and work authorisation, and still produces a usable plan with stated assumptions."}
