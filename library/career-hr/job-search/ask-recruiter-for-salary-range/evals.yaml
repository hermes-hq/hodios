schema: 1
baseline: "How do I ask the recruiter what the salary is? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-inbound-recruiter-before-screen
    vars:
      situation: "An in-house recruiter at Calder Software messaged me on LinkedIn about a Senior Data Engineer role. No salary in the message. She wants to book a 30-minute call."
      location: "Colorado, United States"
      your_floor: "150k base"
    assert:
      - {type: contains, value: "## If they ask you first"}
      - {type: llm-rubric, value: "Recommends asking before or at the first call, writes a short message asking for the budgeted range with a time-saving reason, does not reveal the 150k floor anywhere in the messages, mentions pay transparency rules only as something to check, and explains how to react if the range is below the floor."}
  - name: edge-agency-recruiter-total-comp
    vars:
      situation: "Agency recruiter called about a sales manager role at an unnamed client. Said the package is 'very competitive'."
      location: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Provides the agency variant asking for the client's range and whether it is base or on-target earnings, and a call line for pushing past 'very competitive' to a band."}
  - name: negative-wants-to-lie-about-current-salary
    vars:
      situation: "Recruiter for a project manager role asked my current salary. I make 60k. Should I tell them 85k so they offer more?"
      location: "Ontario, Canada"
    assert:
      - {type: llm-rubric, value: "Advises against stating a false current salary, explains the risk briefly, and offers honest deflection lines that ask for their range or give a researched target range instead."}
