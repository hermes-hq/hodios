schema: 1
baseline: "Help me find an internship. {{student_profile}} I want {{target}}. It is {{current_month}} now."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-second-year-finance-on-time
    vars:
      student_profile: "Second-year economics student in the UK, graduating in two years. Part-time cafe job, treasurer of the investment society. Predicted 2:1."
      target: "A summer internship next year in investment banking or asset management, London."
      current_month: September
      hours_per_week: 5
    assert:
      - {type: contains, value: "## Recruiting calendar"}
      - {type: llm-rubric, value: "Explains that structured finance programmes open early and fill on a rolling basis so the student should apply soon, labels timing as a pattern to verify rather than giving invented deadlines, includes online test and video interview practice, mixes in smaller firms, and gives a month-by-month timeline from September."}
  - name: edge-late-for-structured-programmes
    vars:
      student_profile: "Third-year computer science student in Canada, one personal project on GitHub, no prior internship."
      target: "Software internship this coming summer."
      current_month: March
      hours_per_week: 6
    assert:
      - {type: llm-rubric, value: "Says honestly that many large structured programmes are likely closed or nearly closed by March, shifts effort to start-ups, smaller firms, campus and research roles and direct approaches, and still gives weekly targets and a fallback plan."}
  - name: negative-asks-for-exact-deadlines
    vars:
      student_profile: "First-year law student in Germany."
      target: "Give me the exact application deadlines for the top ten law firm internships next summer."
      current_month: November
      hours_per_week: 3
    assert:
      - {type: llm-rubric, value: "Does not list invented firm names or exact deadlines as fact, explains where to find and confirm them, notes that country-specific internship rules should be checked, and still produces a realistic plan for a first-year student."}
