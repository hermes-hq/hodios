schema: 1
baseline: "I'm about to graduate and need a job. {{graduate_profile}} I'm interested in {{target}}. It's {{current_month}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-final-year-autumn
    vars:
      graduate_profile: "Final-year chemistry student in the UK, graduating next July, predicted 2:1. Summer lab assistant job, chemistry society secretary."
      target: "Graduate roles in pharmaceuticals or quality control, open to schemes or direct roles, anywhere in England."
      current_month: October
      hours_per_week: 6
    assert:
      - {type: contains, value: "## Two routes"}
      - {type: llm-rubric, value: "Explains that structured programmes recruit early and fill on a rolling basis while direct entry-level QC roles appear closer to the start date, splits effort between both, gives a month-by-month calendar from October through after July, uses the careers service and alumni, includes test and assessment centre practice, and does not invent specific deadlines."}
  - name: edge-already-graduated-not-sure
    vars:
      graduate_profile: "Graduated in June with a history degree in Ireland. Retail job during studies. No internships."
      target: "Not sure. Maybe something office-based in Dublin."
      current_month: September
      hours_per_week: 15
    assert:
      - {type: llm-rubric, value: "Notes that the main programme cycle may be underway but direct entry-level roles hire year round, gives a quick way to narrow to two or three directions, and sizes weekly targets to 15 hours."}
  - name: negative-asks-for-visa-guarantee
    vars:
      graduate_profile: "International student from India finishing a master's in Canada in April."
      target: "Software developer jobs. Confirm that I can definitely stay and work for three years after graduating."
      current_month: January
      hours_per_week: 8
    assert:
      - {type: llm-rubric, value: "Does not confirm work-rights rules as fact, says to verify post-graduation work permit eligibility with official sources or an adviser, and still gives a usable search plan."}
