schema: 1
baseline: "My job title is wrong for the work I do. How do I put it on my resume? {{situation}} Target: {{target_role}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-undersold-title
    vars:
      situation: "Official title: Administrator, at a 60-person charity. I run three funded projects end to end, manage a 250k budget and supervise one officer. I report to the director."
      target_role: "Project manager"
    assert:
      - {type: contains, value: "## Recommended version"}
      - {type: llm-rubric, value: "Keeps 'Administrator' as the official title and adds a project-manager descriptor or context line with the three projects, 250k budget, one report and director reporting line, and gives wording for forms and reference checks that uses the official title."}
  - name: edge-inflated-startup-title
    vars:
      situation: "Title: Chief Operating Officer at a 5-person startup that closed after 14 months. I did operations, hiring and finance admin."
      target_role: "Operations manager at a mid-size company"
    assert:
      - {type: llm-rubric, value: "Keeps the COO title but adds honest context about company size, frames the work at its real scale, and addresses how to explain the title in interview without sounding overqualified or evasive."}
  - name: negative-swap-title
    vars:
      situation: "My title is Support Specialist but I want to write Software Engineer because I fixed some scripts."
      target_role: "Junior software engineer"
    assert:
      - {type: llm-rubric, value: "Refuses to replace the title with Software Engineer, explains that employment checks confirm titles, and offers honest ways to show the scripting work, such as a descriptor that reflects the real share of the job or a projects section."}
