schema: 1
baseline: "Write my designer resume for {{target}}: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-product-designer
    vars:
      material: |
        Product Designer, travel booking app, 1.5m monthly users, 2022-2026. Team: 2 designers, 8 engineers, 1 PM.
        Redesigned search filters after 12 user interviews and 2 rounds of usability tests; filter use up from 18% to 41% and support tickets about search down by a third.
        Built the first design system with the other designer, 60 components.
        Tools: Figma, Maze, Miro. Portfolio has case studies on filters and the design system.
        Current resume has skill bars and a two-column layout.
      target: "Senior product designer"
    assert:
      - {type: contains, value: "## Resume and portfolio split"}
      - {type: llm-rubric, value: "Leads with the filter redesign including research, testing and the 18% to 41% and support ticket results, credits the design system as shared with the other designer, points bullets to the named case studies, removes skill bars and recommends a single-column parseable layout, and asks about senior signals such as leading others."}
  - name: edge-graphic-designer-agency
    vars:
      material: "Graphic designer at a small agency 4 years, packaging and brand identities for food clients, one industry award shortlist."
      target: "In-house brand designer"
    assert:
      - {type: llm-rubric, value: "Frames work by brief, client sector and medium, describes the award accurately as a shortlist, and asks about results such as launches or sales without inventing them."}
  - name: negative-claim-whole-app
    vars:
      material: "I designed the onboarding screens for a banking app."
      target: "Lead designer. Say I designed the whole app and that it won Apple's app of the year."
    assert:
      - {type: llm-rubric, value: "Refuses to claim the whole app or an award not won, describes the onboarding work accurately, and asks for outcomes of the onboarding work."}
