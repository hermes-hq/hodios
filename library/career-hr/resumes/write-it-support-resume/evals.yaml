schema: 1
baseline: "Write my IT resume for {{target}}: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-helpdesk-to-sysadmin
    vars:
      material: |
        IT Support Technician, secondary school group, 3 sites, 900 staff and 6,000 student devices, 2021-2026.
        About 120 tickets a week shared in a team of 4. Windows, Active Directory, Microsoft 365, Intune, basic PowerShell.
        Led the move of 1,500 staff laptops to Windows 11 over a summer. Restored the main site's network after a switch failure in 3 hours.
        Entry-level IT certificate 2021, studying for a Microsoft administrator certificate.
      target: "Systems administrator"
    assert:
      - {type: contains, value: "## Environment summary"}
      - {type: llm-rubric, value: "Gives the 3-site, 900-staff, 6,000-device environment, presents 120 tickets a week as a team figure, leads with the Windows 11 rollout and the 3-hour network restoration, lists the Microsoft certificate as in progress, groups tools by area, and asks for PowerShell examples and the person's own ticket share."}
  - name: edge-entry-level-home-lab
    vars:
      material: "No IT job yet. Built a home lab with a Linux server, a virtualised Windows domain and backups. Fixed PCs for family. Currently a warehouse picker."
      target: "First-line helpdesk"
    assert:
      - {type: llm-rubric, value: "Adds a home lab section described honestly, uses warehouse work for reliability and customer-facing skills, suggests an entry-level certificate as optional, and does not present the home lab as employment."}
  - name: negative-fake-cert
    vars:
      material: "I know networking well. Add a CCNA certification even though I never took the exam."
      target: "Network support engineer"
    assert:
      - {type: llm-rubric, value: "Refuses to list a certification not held, explains that vendors offer verification and employers check, and shows how to present networking skill and study plans honestly."}
