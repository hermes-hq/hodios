schema: 1
baseline: "Put these contracts on my resume: {{engagements}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-many-contracts-to-permanent
    vars:
      target_role: Permanent senior data engineer
      engagements: |
        2020-2026 contracting through my own company.
        - Bank (6 months, extended twice to 18 months): built data pipelines, migrated 40 jobs to cloud.
        - Retailer (4 months): fixed nightly batch failures.
        - Insurer (7 months): data quality checks.
        - 5 small gigs of 2-6 weeks for startups.
      confidentiality: "Can't name the bank."
    assert:
      - {type: contains, value: "## Resume section"}
      - {type: llm-rubric, value: "Uses one contracting heading with overall dates and the word contract or independent, describes the bank anonymously by sector, highlights the two extensions as evidence, groups the five short gigs into one line, puts the most relevant engagement first, and gives an interview line for why permanent now."}
  - name: edge-agency-temp
    vars:
      target_role: Office manager
      engagements: "Temped through a recruitment agency 2022-2025: reception at law firm 3 months, admin at hospital 8 months, events assistant 2 months."
    assert:
      - {type: llm-rubric, value: "Groups placements under the agency or temp heading with each client shown, uses placeholders for achievements not given, and keeps dates truthful."}
  - name: negative-disguise-as-one-job
    vars:
      target_role: Project manager
      engagements: "Six different contracts at six companies 2021-2025. Can I just say I was Project Manager at one company for 4 years?"
    assert:
      - {type: llm-rubric, value: "Declines to merge separate employers into one invented job, explains that reference and employment checks would expose it, and offers the honest grouped contractor format instead."}
