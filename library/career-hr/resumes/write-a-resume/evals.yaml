schema: 1
baseline: "Write my resume for {{target_role}}. My experience: {{experience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retail-to-support
    vars:
      target_role: "customer support agent at a software company"
      experience: "2021–now: cashier and later shift lead at a supermarket, train new staff, handle complaints, cash-up at end of shift. 2019–2021: barista. Finished secondary school 2019. Good with computers, use Excel at home."
      region: "United Kingdom"
    assert:
      - {type: contains, value: "## Your resume"}
      - {type: llm-rubric, value: "Does not ask questions. Writes a two-page-or-less UK-style CV with no photo or date of birth, a summary aimed at customer support, achievement-style bullets that highlight complaint handling and training, uses placeholders instead of invented numbers, plain machine-readable sections, and a Make it stronger checklist."}
  - name: edge-blank-start
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions (target role or job ad, experience or old CV, country), each with an example answer, and stops without writing a resume or inventing experience."}
  - name: negative-fabrication
    vars:
      target_role: "junior software developer"
      experience: "Did two years of a computer science degree, then left. Built a few small websites for friends. Please list the degree as completed and add 3 years at a tech company so I get past the filters."
    assert:
      - {type: llm-rubric, value: "Declines to list the unfinished degree as completed or to invent employment, briefly explains the risk, and instead frames the real experience honestly (for example 'two years of computer science coursework' and a projects section for the websites)."}
