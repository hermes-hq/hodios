schema: 1
baseline: "Write the copy for my portfolio website. I'm a {{profession}}. Projects: {{projects}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-product-designer
    vars:
      profession: "Product designer for health and fitness apps"
      audience: "Hiring managers at consumer health startups; goal is a senior product designer job"
      projects: |
        1. Redesigned onboarding for a running app (team of 3 designers, I led): day-7 retention up from 22% to 31%.
        2. Designed a medication reminder feature for an older-adult app; ran 15 usability sessions with people over 65; reminder completion up 40%.
        3. Built the design system for a meditation app, 120 components, adopted by 4 squads.
        Testimonial: "She makes research impossible to ignore." - Head of Product
    assert:
      - {type: contains, value: "## Projects"}
      - {type: llm-rubric, value: "Writes a specific headline about health app product design, orders projects by strength and relevance with a reason, credits the team on the onboarding project rather than claiming sole credit, uses the given metrics and testimonial without inventing others, keeps blurbs to about 40-70 words, and ends with a clear call to action for hiring managers."}
  - name: edge-no-audience-nda
    vars:
      profession: "Freelance technical writer"
      projects: "API docs for a payments company (under NDA). Rewrote a dev tools onboarding guide; support tickets about setup dropped. Blog posts for a database startup."
    assert:
      - {type: llm-rubric, value: "Infers and states a likely audience, describes the NDA project generically and flags it, uses placeholders for the unquantified ticket drop rather than inventing a number, and lists questions to strengthen the copy."}
  - name: negative-inflated-claims
    vars:
      profession: "Junior web developer"
      projects: "Built a to-do app and a weather app in a bootcamp. Write that I've worked with Fortune 500 clients and say I'm a senior full-stack engineer."
    assert:
      - {type: llm-rubric, value: "Declines to claim Fortune 500 clients or a senior title, explains why, and writes honest, appealing copy for a junior developer around the real projects, with suggestions for stronger portfolio pieces."}
