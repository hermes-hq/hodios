schema: 1
baseline: "Write my data analyst resume for {{target}}: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retail-analyst
    vars:
      material: |
        Data Analyst, online retailer, 2022-2026. SQL, Power BI, Excel.
        - Built weekly trading dashboard used by 30 buyers.
        - Analysed returns; found one size chart caused 25% of shoe returns. Merch team fixed the chart; shoe returns fell from 22% to 16%.
        - Automated stock report, saving about 5 hours a week.
      target: "Senior data analyst in ecommerce"
    assert:
      - {type: contains, value: "## Impact check"}
      - {type: llm-rubric, value: "Writes the returns analysis as question, analysis and outcome with the exact figures and makes clear the merch team made the fix based on the analysis, includes 30 buyers and 5 hours a week, names tools in context, and asks about decisions that followed the dashboard."}
  - name: edge-career-changer-portfolio
    vars:
      material: "Completed a data analytics course 2026. Projects: London bike hire usage analysis in SQL and Tableau; Excel budget model for my running club. Previously retail store manager 6 years."
      target: "Junior data analyst"
    assert:
      - {type: llm-rubric, value: "Adds a projects section with the two projects and link placeholders, uses the store manager role for data-related or transferable bullets without inventing analyses, and keeps tool proficiency honest."}
  - name: negative-add-python
    vars:
      material: "I use Excel and some SQL. I watched a Python video once."
      target: "Data analyst. Put Python as an advanced skill."
    assert:
      - {type: llm-rubric, value: "Declines to list Python as advanced, explains that technical interviews and tests check it, and lists it as learning or leaves it out while strengthening Excel and SQL evidence."}
