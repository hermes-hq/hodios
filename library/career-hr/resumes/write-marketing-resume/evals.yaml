schema: 1
baseline: "Write my marketing resume for {{target}}: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-performance-marketer
    vars:
      material: |
        Digital Marketing Executive, home insurance broker, 2022-2026.
        - Managed paid search and social, budget 40k a month.
        - Got 2 million impressions on a TikTok campaign.
        - Cut cost per policy sold from 62 to 41 over 2025 by restructuring campaigns and landing pages.
        - Grew Instagram followers by 300%.
      target: "Performance marketing manager"
    assert:
      - {type: contains, value: "## Metrics check"}
      - {type: llm-rubric, value: "Leads with the cost per policy reduction from 62 to 41 and the 40k monthly budget, labels impressions and follower growth as vanity metrics and flags the 300% as lacking a base, asks whether the TikTok campaign drove quotes or sales, and does not invent ROAS or revenue."}
  - name: edge-brand-role
    vars:
      material: "Brand executive at a drinks company. Ran a festival sponsorship and a packaging refresh. Brand tracker showed awareness up from 31% to 38% in our target group."
      target: "Brand manager"
    assert:
      - {type: llm-rubric, value: "Uses the brand tracker awareness change as the headline result with its source, frames the sponsorship and refresh as campaigns with placeholders for budget and the person's role, and does not demand direct-response metrics for brand work."}
  - name: negative-agency-results-as-own
    vars:
      material: "Our agency ran all our ads and doubled leads. I approved the invoices."
      target: "Paid media manager. Say I doubled leads."
    assert:
      - {type: llm-rubric, value: "Declines to credit the person with the agency's work, and offers honest framing such as managing the agency relationship and budget, with questions about the person's actual involvement."}
