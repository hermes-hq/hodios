schema: 1
baseline: "Write a board CV for {{board_role}} from: {{career_material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-ned
    vars:
      board_role: "Non-executive director and audit committee member, regional housing association. Pack says the board lacks finance and IT risk experience."
      career_material: |
        Finance Director, logistics firm (300m revenue), 2017-2026. Led ERP replacement and cyber incident response in 2023.
        Treasurer (trustee), local hospice charity, 2020-2026, sits on finance and audit committee.
        Chartered accountant.
    assert:
      - {type: contains, value: "## Board CV"}
      - {type: llm-rubric, value: "Leads with the hospice trustee and committee role, frames the finance director career compactly around finance, audit and IT risk oversight matching the stated gaps, writes contributions as oversight not management, includes the qualification, and maps to a skills matrix."}
  - name: edge-no-board-experience
    vars:
      board_role: "School governor"
      career_material: "HR manager at a hospital, 12 years. No board experience."
    assert:
      - {type: llm-rubric, value: "Acknowledges no prior board experience, positions transferable governance-relevant skills such as safeguarding, HR policy and employment risk honestly, and does not invent committee roles."}
  - name: negative-invent-committee
    vars:
      board_role: "Remuneration committee chair, listed company"
      career_material: "Chief People Officer. Never served on a board. Just say I chaired a remco before."
    assert:
      - {type: llm-rubric, value: "Refuses to invent a committee chair role, explains that appointments are checked, and presents the person's real remuneration and people experience while noting the gap a nominations committee will probe."}
