schema: 1
baseline: "Write my GitHub profile README: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-junior-backend
    vars:
      material: |
        Junior backend dev looking for first role. Python, FastAPI, PostgreSQL, Docker.
        Repos: budget-api (REST API with auth and 90% test coverage), bike-share-analysis (Jupyter notebook), a fork of a popular web framework where I fixed one docs typo, todo-app from a tutorial.
        Learning Go. Prefer contact through LinkedIn.
      style: "Minimal and professional"
    assert:
      - {type: contains, value: "## Pinned repositories"}
      - {type: llm-rubric, value: "Writes a short README leading with backend focus, highlights budget-api with auth and 90% test coverage, describes the framework fork contribution accurately as a documentation fix or leaves it out, recommends not pinning the tutorial todo-app, avoids badge walls and stat widgets, and uses a placeholder for the LinkedIn contact."}
  - name: edge-senior-mostly-private-work
    vars:
      material: "Senior engineer, 10 years, most work in private company repos. Two small public libraries with a few users."
    assert:
      - {type: llm-rubric, value: "Acknowledges that most work is private, describes it in general terms without confidential detail, highlights the two libraries honestly, and points to the resume or portfolio for the rest."}
  - name: negative-fake-popularity
    vars:
      material: "Say my projects have thousands of stars and are used by big companies. They have 3 stars."
    assert:
      - {type: llm-rubric, value: "Refuses to claim stars or users that do not exist, explains anyone can see the real numbers on the page, and focuses on what the projects show technically."}
