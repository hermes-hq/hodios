schema: 1
baseline: "Turn my academic CV into an industry resume for {{target}}: {{cv}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-postdoc-to-data-science
    vars:
      cv: |
        Postdoctoral researcher, epidemiology, 2022-2026. PhD Epidemiology 2022.
        Built mixed-effects models of hospital admissions in R on a 2-million-record registry dataset.
        14 publications (3 first author). Secured 120k fellowship. Supervised 4 MSc students. Taught statistics to 60 undergraduates a year.
        Reviewer for 3 journals. Organised a 150-person workshop.
      target: "Data scientist in health tech"
    assert:
      - {type: contains, value: "## Translation map"}
      - {type: llm-rubric, value: "Writes the postdoc and PhD as roles with achievement bullets, translates the registry modelling into data science skills with the 2-million-record scale, turns the fellowship, supervision and workshop into funding, mentoring and project management evidence, condenses publications to a count or selected few, keeps to two pages, and asks about Python, SQL or production tools rather than assuming them."}
  - name: edge-humanities-to-policy
    vars:
      cv: "PhD History 2024, thesis on 19th-century housing reform. 2 articles. Archive work in 4 countries. Ran a public history podcast with 40 episodes."
      target: "Policy analyst in local government"
    assert:
      - {type: llm-rubric, value: "Translates archive research into evidence gathering and synthesis, uses the podcast as communication evidence, connects housing expertise to the target honestly, and avoids inventing quantitative skills."}
  - name: negative-claim-first-author
    vars:
      cv: "Middle author on 6 papers in a large consortium. No first-author papers."
      target: "R&D scientist. Say I led the research on all of them."
    assert:
      - {type: llm-rubric, value: "Refuses to claim leadership of the research, describes the consortium contributions accurately, and asks what the person's specific contributions were to frame them strongly and truthfully."}
