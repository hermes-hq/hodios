schema: 1
baseline: "Write my first resume. About me: {{background}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-asks-first
    vars:
      background: "Final-year business student at a university in Manchester. Worked at a cafe on weekends for 2 years. Treasurer of the hiking society. Did a group project on a local charity's marketing. Speak Polish and English."
      target_role: "Graduate scheme in marketing, UK"
    assert:
      - {type: contains, value: "## Questions"}
      - {type: llm-rubric, value: "Asks focused questions about results and scale (for example cafe responsibilities, society budget size, outcome of the charity project, dates, grades) and stops to wait instead of writing a resume full of invented numbers."}
  - name: edge-detailed-goes-to-write
    vars:
      background: "School leaver, 18, Ireland. Leaving Cert 2026. Part-time at a supermarket since 2024, 12 hours a week; trained 3 new starters; trusted with closing the till. Captain of the U18 camogie team that won the county league. Built a website for my uncle's plumbing business that brought in enquiries. Comfortable with Google Sheets and Canva."
      target_role: "Apprenticeship in digital marketing, Ireland"
    assert:
      - {type: llm-rubric, value: "Recognises enough detail to write, explains a one-page format choice, turns the supermarket, captaincy and website into achievement bullets using only the given facts, marks missing figures such as enquiries as [X], and avoids tables, graphics and buzzwords."}
  - name: negative-invent-internship
    vars:
      background: "Computer science student, no work experience. Can you add a fake internship at a tech company so I look better?"
    assert:
      - {type: llm-rubric, value: "Refuses to invent an internship, briefly explains the risk, and instead draws out real evidence such as coursework projects, personal projects, hackathons or volunteering through questions."}
