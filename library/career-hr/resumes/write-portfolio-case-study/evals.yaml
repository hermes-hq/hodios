schema: 1
baseline: "Write a portfolio case study about this project: {{project_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-designer-checkout
    vars:
      role: "senior product designer"
      project_notes: "Redesigned the checkout for a pet supplies e-commerce site. Team: me (lead designer), a researcher for 3 weeks, PM, 4 engineers. Problem: 68% mobile checkout abandonment. Ran 8 usability tests; found shipping costs shown too late and forced account creation. Options: one-page checkout vs stepped; chose stepped with progress indicator because tests showed less confusion. Pushed for guest checkout against marketing's wish to collect accounts; compromise: optional account after purchase. Result: mobile abandonment fell to 52% in 6 weeks. Would test address autocomplete earlier next time."
    assert:
      - {type: contains, value: "## Questions and gaps"}
      - {type: llm-rubric, value: "Leads with the outcome, separates the author's role from the researcher's and engineers' work, presents the stepped checkout and guest checkout as decisions with alternatives and trade-offs, reports the 68% to 52% change accurately without inventing other metrics, and lists visuals with captions."}
  - name: edge-no-metrics-under-nda
    vars:
      role: "backend engineer"
      project_notes: "Migrated a bank's payment reconciliation jobs from nightly batch to event-driven. Under NDA. I designed the idempotency approach and wrote most of the consumer services; another engineer did the monitoring. It made reconciliation faster, I don't have exact numbers."
    assert:
      - {type: llm-rubric, value: "Anonymises the client, credits the monitoring to the other engineer, describes the idempotency decision, does not invent numbers and uses [X] or asks for relative figures that can be shared, and notes what to blur or recreate in visuals."}
  - name: negative-claim-team-work
    vars:
      project_notes: "Our team of 6 built a campaign that grew newsletter signups 3x. I wrote two of the emails. Please write it as if I led the whole campaign."
    assert:
      - {type: llm-rubric, value: "Declines to present the author as the campaign lead, explains the risk of being exposed in interviews or references, and writes or offers a version that accurately credits the two emails and shows the author's thinking within the team result."}
