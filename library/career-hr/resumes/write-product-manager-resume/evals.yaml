schema: 1
baseline: "Write my product manager resume for {{target}}: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-pm
    vars:
      material: |
        Product Manager, B2B invoicing software, 4,000 business customers, 2023-2026. Team of 5 engineers and a designer.
        - Launched bulk invoice upload, saved filters and CSV export.
        - Ran sprint planning and wrote user stories.
        - Interviews showed accountants spent hours re-keying invoices; I prioritised bulk upload over a requested mobile app. Bulk upload cut average invoice creation time from 6 to 2 minutes and trial-to-paid went from 14% to 19%.
      target: "Senior product manager, B2B SaaS"
    assert:
      - {type: contains, value: "## Outcome check"}
      - {type: llm-rubric, value: "Leads with the bulk upload story as research, the decision to prioritise it over the mobile app, the team, and the 6 to 2 minutes and 14% to 19% results, drops sprint planning and user stories as achievements, flags the other features as needing outcomes, and does not invent metrics for them."}
  - name: edge-aspiring-apm
    vars:
      material: "Customer support lead 3 years at a fintech app. Collected top complaints into a monthly report that the product team used to plan fixes. Did a product management course."
      target: "Associate product manager"
    assert:
      - {type: llm-rubric, value: "Frames the complaint report as product discovery and influence on the roadmap with honest wording, keeps the support title, and asks which fixes shipped and what changed afterwards."}
  - name: negative-claim-sole-credit
    vars:
      material: "Our team rebuilt checkout; conversion rose 3 points. Also marketing ran a big discount that month."
      target: "Growth PM. Say I single-handedly raised conversion 3 points."
    assert:
      - {type: llm-rubric, value: "Refuses the single-handed claim, credits the team, notes the discount as a confounding factor, and suggests honest wording such as contributed to or led the checkout rebuild, with a question about any test that isolated the effect."}
