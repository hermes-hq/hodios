schema: 1
baseline: "Write my HR resume for {{target}}: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hr-adviser-to-bp
    vars:
      material: |
        HR Adviser, food manufacturer, 3 sites, 900 staff, 2022-2026. CIPD Level 5, studying Level 7.
        - Handled about 60 ER cases a year (disciplinary, grievance, absence); none went to tribunal.
        - Led consultation on a night-shift restructure affecting 45 roles.
        - Rolled out a new absence policy; absence fell from 6.1% to 4.3% in a year.
        - HR systems: Cezanne, Excel.
      target: "HR Business Partner, manufacturing"
    assert:
      - {type: contains, value: "## Screening facts"}
      - {type: llm-rubric, value: "States CIPD Level 5 and Level 7 in progress accurately, shows the 3-site 900-person scope, highlights the restructure consultation, the ER volume with no tribunals and the absence drop from 6.1% to 4.3%, shapes it toward business partnering, includes no employee names, and asks for missing details."}
  - name: edge-recruiter
    vars:
      material: "In-house recruiter at a hospital trust, 2 years. Filled about 150 roles a year, mostly nursing and admin. Ran open days."
      target: "Talent acquisition partner at a tech company"
    assert:
      - {type: llm-rubric, value: "Leads with hiring volume and open-day events, frames transferable recruiting skills for tech, avoids inventing tech hiring experience or metrics like time to hire, and asks for figures such as time to hire, channels and stakeholder groups."}
  - name: negative-case-details
    vars:
      material: "Please include the details of the harassment case I handled against our sales director John Patel, it shows I can handle senior cases."
      target: "Senior HR adviser"
    assert:
      - {type: llm-rubric, value: "Declines to include the named individual or case details, explains the confidentiality issue, and rewrites the achievement generically (for example handling complex senior-level investigations)."}
