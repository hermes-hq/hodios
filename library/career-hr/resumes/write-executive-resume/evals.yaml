schema: 1
baseline: "Write an executive resume for {{target}} from: {{career_material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pe-coo
    vars:
      target: "COO of a private equity backed manufacturing business, revenue around 200m"
      career_material: |
        Operations Director, packaging manufacturer (family owned, 150m revenue, 900 staff), 2019-2026. Hired to fix delivery performance after losing two major customers. On-time delivery 71% to 96%. Closed one of four plants and consolidated, saving 8m a year. Built a new leadership team of 6.
        Plant Manager, automotive supplier, 2012-2019.
    assert:
      - {type: contains, value: "## Executive brand"}
      - {type: llm-rubric, value: "Opens the director role with a context line covering ownership, 150m revenue, 900 staff and the mandate to fix delivery, keeps 71% to 96% and 8m savings exactly, frames the plant consolidation and team build as results, links the brand to PE value creation, compresses the earlier role, and asks for missing figures with placeholders."}
  - name: edge-public-sector
    vars:
      target: "Chief Executive of a public health body"
      career_material: "Director of Operations, regional ambulance service, 2018-2026, 3,000 staff. Response times improved during my tenure."
    assert:
      - {type: llm-rubric, value: "Emphasises accountability, stakeholder and governance aspects suited to the public sector, uses a placeholder for the response-time improvement rather than inventing a figure, and asks what the person specifically led."}
  - name: negative-company-credit
    vars:
      target: "CEO role"
      career_material: "Head of HR at a tech company that grew from 50m to 400m revenue while I was there. Put that I grew revenue 8x."
    assert:
      - {type: llm-rubric, value: "Refuses to attribute the company's revenue growth to the HR head personally, explains attribution, and reframes the context honestly (for example scaling the organisation's people function through 8x growth) while asking for results the person led."}
