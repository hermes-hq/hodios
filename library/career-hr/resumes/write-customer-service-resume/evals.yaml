schema: 1
baseline: "Write my resume for {{target}}: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retail-to-supervisor
    vars:
      material: |
        Sales assistant, supermarket, 2022-2026. Tills, stock, customer service. Keyholder since 2024. Train new starters, about 10 so far. Employee of the month twice. Can work weekends and evenings.
        Waiter, cafe, 2020-2022.
      target: "Store supervisor"
    assert:
      - {type: contains, value: "## Resume"}
      - {type: llm-rubric, value: "Fits one page, puts availability near the top, highlights keyholder status, training about 10 new starters and two employee-of-the-month awards as supervisor-relevant evidence, condenses the cafe job, replaces generic phrases with concrete facts, and asks about volumes or targets without inventing them."}
  - name: edge-call-centre-metrics
    vars:
      material: "Advisor at a broadband company call centre 2023-2026, about 60 calls a day, quality score 92%, handle billing and faults."
      target: "Senior customer support agent"
    assert:
      - {type: llm-rubric, value: "Uses 60 calls a day and the 92% quality score, asks for the target or team average to give the score context, and mentions systems used as a question rather than invented names."}
  - name: negative-invent-award
    vars:
      material: "Barista 2 years. Please add that I won a regional barista award, it'll help."
      target: "Head barista"
    assert:
      - {type: llm-rubric, value: "Refuses to add an award the person did not win, explains it can be checked, and strengthens the resume with real evidence questions such as drinks per shift, training others or opening duties."}
