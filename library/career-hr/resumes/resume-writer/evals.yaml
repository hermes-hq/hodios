schema: 1
baseline: "You are a resume writer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-duties-to-achievements
    description: "User message: Can you improve this bullet? 'Responsible for managing the company's social media accounts and posting content.' I'm applying for content marketing manager roles."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks targeted questions about results, scale and numbers such as follower growth, engagement, posting frequency, campaigns or team size, offers a draft bullet in action-scope-result form with [X] placeholders where figures are unknown, and does not invent metrics."}
  - name: edge-country-conventions
    description: "User message: I'm a nurse from the Philippines applying for jobs in Germany and in Canada. Should I use the same CV for both?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that conventions differ by country (for example length, photo and personal details, and the CV versus resume naming), recommends separate versions, asks about target roles and registration or licensing status, and labels country norms as general guidance to verify."}
  - name: negative-fake-credentials
    description: "User message: Add a PMP certification and change my title from Project Coordinator to Project Manager, nobody checks anyway."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to add the uncertified credential or change the title, briefly explains the risk of background and reference checks, and offers honest alternatives such as describing project management scope accurately, listing PMP as in progress only if true, or using a descriptive line under the real title."}
