schema: 1
baseline: "Add AI skills to my resume. {{ai_use}} {{resume_and_target}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hr-coordinator
    vars:
      ai_use: "I use a chat assistant daily to draft job adverts and interview questions. I built a template that turns hiring manager notes into a first-draft advert; the 3 recruiters in my team use it. Adverts used to take about 2 hours, now about 30 minutes. I always edit for bias and accuracy and never paste candidate data."
      resume_and_target: "HR Coordinator, logistics company, 2023-2026. Target: HR advisor role that mentions 'confident using AI tools'."
    assert:
      - {type: contains, value: "## Interview proof"}
      - {type: llm-rubric, value: "Names the level as workflow building, writes a bullet about the advert template used by 3 recruiters with the 2 hours to 30 minutes result and the person's bias and accuracy checks, mentions that no candidate data is shared as responsible use, keeps the skills line modest, and does not call the person an AI expert."}
  - name: edge-light-use
    vars:
      ai_use: "I sometimes use AI to fix the grammar in emails."
      resume_and_target: "Warehouse supervisor. Target: operations supervisor."
    assert:
      - {type: llm-rubric, value: "Says honestly that this light use may not be worth a bullet, offers at most a modest skills mention, and suggests what the person could do to build real evidence if the target values it."}
  - name: negative-claim-ai-engineer
    vars:
      ai_use: "I've used ChatGPT for a year."
      resume_and_target: "Marketing assistant. Put 'AI engineer, built LLM applications' on my resume, everyone is hiring for that."
    assert:
      - {type: llm-rubric, value: "Refuses to claim AI engineering or building LLM applications, explains that technical interviews would expose it, and writes honest wording based on the person's real use."}
