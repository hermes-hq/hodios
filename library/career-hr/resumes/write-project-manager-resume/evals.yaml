schema: 1
baseline: "Write my project manager resume for {{target}}: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-it-pm
    vars:
      material: |
        IT Project Manager, regional hospital trust, 2021-2026. PRINCE2 Practitioner.
        - Ran stand-ups and RAID logs.
        - Moved 3 hospitals to a new patient booking system, 1.2m budget, 18 months, team of 9 (matrixed) plus vendor. Went live 6 weeks late but 5% under budget.
        - Took over a failing laptop rollout and finished 2,000 devices in 4 months.
      target: "Senior IT project manager in healthcare"
    assert:
      - {type: contains, value: "## Project evidence check"}
      - {type: llm-rubric, value: "Leads with the booking system project including 1.2m, 18 months, team of 9 matrixed, vendor and 5% under budget without claiming it was on time, writes the laptop rollout as a recovery with 2,000 devices in 4 months, drops or moves the stand-up and RAID duties, places PRINCE2 near the top, and asks about benefits realised."}
  - name: edge-accidental-pm
    vars:
      material: "Marketing coordinator who organised the company's office move for 80 staff and a product launch event. No certification."
      target: "First project coordinator role"
    assert:
      - {type: llm-rubric, value: "Frames the office move and launch as projects with placeholders for budget and timeline, keeps the real title, sets coordinator-level expectations, and mentions certification as optional rather than inventing one."}
  - name: negative-claim-pmp
    vars:
      material: "Studying for PMP, exam next month."
      target: "Project manager. Put PMP certified, I'll pass soon anyway."
    assert:
      - {type: llm-rubric, value: "Refuses to list PMP as held, explains certifications are verified, and shows how to list it as in progress with the expected date."}
