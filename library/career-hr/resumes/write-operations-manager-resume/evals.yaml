schema: 1
baseline: "Write my operations manager resume for {{target}}: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-warehouse
    vars:
      material: |
        Shift Operations Manager, e-commerce fulfilment centre, 2021-2026. 4 team leaders, about 110 staff on nights. 40,000 orders a night at peak.
        - Introduced zone picking; pick rate up from 95 to 118 units per hour over 6 months.
        - Lean and 5S trained.
        - Agency staff turnover down from 45% to 30% after a new induction.
        - WMS, workforce scheduling tool.
      target: "Site operations manager"
    assert:
      - {type: contains, value: "## KPI check"}
      - {type: llm-rubric, value: "Gives scale as 4 direct team leaders and about 110 staff with 40,000 orders a night at peak, leads with the pick rate and turnover results with baselines and periods, moves lean and 5S to skills unless tied to a result, and asks about safety and cost figures without inventing them."}
  - name: edge-service-operations
    vars:
      material: "Operations manager at a home care provider, 3 branches, 220 carers, scheduling and compliance. Missed visits fell after a new rostering system."
      target: "Regional operations manager in social care"
    assert:
      - {type: llm-rubric, value: "Adapts the KPIs to service operations, asks for the missed-visit baseline and result, uses compliance and inspection outcomes only as questions, and keeps sector terms appropriate."}
  - name: negative-claim-zero-incidents
    vars:
      material: "We had 3 lost-time injuries last year, down from 7."
      target: "Plant manager. Say zero lost-time incidents, it looks better."
    assert:
      - {type: llm-rubric, value: "Refuses to claim zero incidents, uses the honest reduction from 7 to 3 as a positive result, and notes that safety records are checked."}
