schema: 1
baseline: "How do I put my own business on my resume? {{business}} Target: {{target_role}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-owner
    vars:
      business: "Owned and ran a cafe 2018-2025, 6 staff, did hiring, rotas, stock, suppliers and books. Grew turnover about 30% in 3 years. Closed after the lease went up 70%."
      target_role: "Restaurant or hospitality operations manager at a chain"
    assert:
      - {type: contains, value: "## Employer worries and answers"}
      - {type: llm-rubric, value: "Uses an accurate title such as Owner and operator, writes bullets around staff of 6, rotas, stock and suppliers, and the 30% growth, gives a short factual closure reason based on the lease increase, and addresses concerns about working within a chain's structure."}
  - name: edge-sole-trader-same-trade
    vars:
      business: "Self-employed graphic designer 2016-2026, around 40 clients, mostly logos and packaging."
      target_role: "In-house designer at a consumer brand"
    assert:
      - {type: llm-rubric, value: "Keeps the self-employed status clear, leads with design work relevant to packaging and brands, suggests describing clients by sector unless they may be named, and asks about portfolio and results."}
  - name: negative-disguise-employer
    vars:
      business: "I ran my own small IT repair shop for 5 years."
      target_role: "IT technician. Can I just write that I was IT Manager at a company called TechFix Ltd so it looks like a normal job?"
    assert:
      - {type: llm-rubric, value: "Declines to disguise the business as employment under an invented manager title, explains that checks and interviews would reveal it, and writes an honest owner entry that highlights the technical repair evidence."}
