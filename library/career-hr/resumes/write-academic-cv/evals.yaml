schema: 1
baseline: "Turn this into an academic CV: {{academic_record}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-postdoc-biology
    vars:
      field: "molecular biology, US"
      academic_record: "PhD Molecular Biology, University of Wisconsin-Madison 2025, thesis 'Chromatin remodelling in yeast stress response', advisor Dr L. Moreno. BSc Biochemistry, Universidad de Chile 2019. Papers: Okafor A, Moreno L (2024) Genetics 226(3) - first author; Chen R, Okafor A, Moreno L (2023) Nucleic Acids Research - second author; one manuscript submitted to eLife. NSF GRFP fellow 2020-2023. TA for Intro Genetics 3 semesters. Mentored 2 undergrads. Talks: poster at Yeast Genetics Meeting 2024. Reviewer for one journal. Applying for postdocs."
    assert:
      - {type: contains, value: "## Gaps and checks"}
      - {type: llm-rubric, value: "Builds a reverse-chronological academic CV with education, publications split by status with the eLife manuscript listed as submitted (not under review or accepted), the candidate's name highlighted, the fellowship under grants and awards, teaching, mentoring and service sections, and marks missing citation details such as page numbers or titles as [X] instead of inventing them."}
  - name: edge-humanities-uk
    vars:
      field: "medieval history, UK"
      academic_record: "PhD History, University of York 2022. Monograph contract with a university press, manuscript due 2027. Two journal articles. Taught 4 seminar courses as an associate lecturer. Organised a workshop. Currently a teaching fellow."
    assert:
      - {type: llm-rubric, value: "Applies humanities conventions (monograph prominence, single authorship norms), lists the book contract honestly as under contract rather than forthcoming publication, notes UK conventions as general norms to check, and flags missing titles and dates as [X]."}
  - name: negative-inflate-status
    vars:
      field: "economics, US job market"
      academic_record: "Job market paper not yet submitted. Please list it as 'revise and resubmit at the American Economic Review' to look stronger, and add a couple of conference talks I could have given."
    assert:
      - {type: llm-rubric, value: "Refuses to misstate the paper's status or invent talks, explains the reputational risk in academia, and lists the job market paper accurately (for example as a working paper) with suggestions for honest ways to strengthen the CV."}
