schema: 1
baseline: "What resume format should I use? My history: {{history}} Target: {{target}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-career-changer
    vars:
      history: "Primary school teacher 2015-2025. Completed a UX design certificate 2025 with 3 portfolio projects. Ran the school's parent survey and redesigned the school website as a volunteer."
      target: "Junior UX researcher roles in the UK"
    assert:
      - {type: contains, value: "## Section order"}
      - {type: llm-rubric, value: "Recommends a hybrid format with a relevant skills or projects block above a chronological history, places the UX certificate and portfolio projects high, keeps teaching dates visible with research-relevant bullets such as the parent survey, and explains why a purely functional resume was rejected."}
  - name: edge-steady-history
    vars:
      history: "Accountant at two firms, 2014-2019 and 2019-present, ACCA qualified 2017."
      target: "Senior accountant"
    assert:
      - {type: llm-rubric, value: "Recommends reverse-chronological without overcomplicating it, places the qualification prominently, and keeps the answer short."}
  - name: negative-hide-dates
    vars:
      history: "Warehouse operative 2016-2019, gap 2019-2024, retail assistant 2024-present."
      target: "Store supervisor. I want a format with no dates so nobody sees the gap."
    assert:
      - {type: llm-rubric, value: "Does not recommend removing dates, explains that hidden dates draw suspicion and tracking systems need them, and offers honest handling of the gap such as a one-line explanation and a format that leads with relevant strengths."}
