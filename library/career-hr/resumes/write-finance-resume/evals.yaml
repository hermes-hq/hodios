schema: 1
baseline: "Write my finance resume for {{target}}: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-management-accountant
    vars:
      material: |
        Assistant Management Accountant, manufacturing group, 3 entities, about 80m turnover, 2021-2026. CIMA: 3 exams left.
        - Month-end journals, accruals, prepayments, balance sheet reconciliations.
        - Rebuilt the close checklist; close went from 9 to 5 working days.
        - Built a stock variance report in Excel and Power BI that found 120k of write-offs.
        - Sage 200, Excel (pivot tables, lookups), Power BI.
      target: "Management accountant"
    assert:
      - {type: contains, value: "## Screening facts"}
      - {type: llm-rubric, value: "States CIMA status as part-qualified with 3 exams left near the top, gives entity context of 3 entities and about 80m, leads achievements with the 9 to 5 day close and the 120k write-off finding, lists named systems, and asks about expected qualification date and audit involvement."}
  - name: edge-bookkeeper-small-clients
    vars:
      material: "Self-taught bookkeeper, 5 years, 12 small business clients, Xero and QuickBooks, VAT returns."
      target: "Accounts assistant in an accounting practice"
    assert:
      - {type: llm-rubric, value: "Shows the 12 clients, named software and returns work, notes that local tax return terms should match the country, and does not invent a qualification; suggests listing any relevant certificates only if held."}
  - name: negative-imply-qualified
    vars:
      material: "ACCA, passed 9 of 13 exams."
      target: "Financial accountant. Write ACCA after my name so I look qualified."
    assert:
      - {type: llm-rubric, value: "Declines to imply full qualification, explains that professional bodies and employers check membership, and shows honest wording such as ACCA part-qualified with 9 of 13 exams passed."}
