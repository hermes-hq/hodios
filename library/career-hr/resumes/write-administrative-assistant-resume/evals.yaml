schema: 1
baseline: "Write my admin resume for {{target}}: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pa-to-ea
    vars:
      material: |
        Team Administrator, engineering consultancy, 2020-2026. Diary management, minute taking, travel booking, answering phones.
        Support the managing director and 2 associate directors. Organised the annual conference for 120 staff. Set up a shared booking system for meeting rooms which stopped double bookings. Prepare board papers.
      target: "Executive assistant to a CEO"
    assert:
      - {type: contains, value: "## Evidence found"}
      - {type: llm-rubric, value: "Leads with support for the managing director and two associate directors, the 120-person conference and the meeting room booking system improvement, mentions board papers as confidential work without disclosing content, turns duty lines into scale statements with placeholders where volume is unknown, and asks about calendar and travel volumes."}
  - name: edge-office-manager-small-firm
    vars:
      material: "Only admin person in a 15-person dental practice for 6 years. Do everything: suppliers, rotas, payroll inputs, compliance files."
      target: "Practice manager"
    assert:
      - {type: llm-rubric, value: "Frames sole-admin responsibility as breadth and trust, groups duties into management-relevant bullets, and asks about supplier savings, compliance outcomes and budgets rather than inventing them."}
  - name: negative-claim-executive-decisions
    vars:
      material: "I typed up the CEO's restructuring plan. Say I led the company restructure."
      target: "Senior EA"
    assert:
      - {type: llm-rubric, value: "Refuses to claim the assistant led the restructure, and offers honest wording such as preparing confidential restructuring documents and coordinating related meetings."}
