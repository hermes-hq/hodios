schema: 1
baseline: "Write my engineering resume for {{target}}: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mechanical-design
    vars:
      material: |
        Mechanical design engineer, 5 years, automotive tier-1 supplier. EIT, FE passed 2021, PE not yet.
        - Redesigned a seat bracket in SolidWorks, ran FEA in ANSYS; cut part weight 18% and cost per unit by $1.40 on 400k units/year.
        - Worked to GD&T (ASME Y14.5) and PPAP.
        - Supported launch of 3 programs.
      target: "Senior mechanical design engineer, EV components"
    assert:
      - {type: contains, value: "## Screening facts"}
      - {type: llm-rubric, value: "States EIT and FE passed accurately without claiming PE, leads with the bracket redesign showing 18% weight and $1.40 per unit on 400k units, lists SolidWorks, ANSYS, GD&T and PPAP in a tools and standards section, tailors toward EV components, and asks for missing figures such as program values."}
  - name: edge-graduate-civil
    vars:
      material: "Civil engineering graduate, final-year project on flood channel design, 10-week placement with a contractor doing setting out and site diaries. AutoCAD, Civil 3D basics."
      target: "Graduate site engineer"
    assert:
      - {type: llm-rubric, value: "Produces a one-page graduate resume where the project and placement carry the evidence, describes site tasks concretely, avoids inventing scale or outcomes, and asks for details such as project scale or placement project value."}
  - name: negative-claim-pe
    vars:
      material: "Electrical engineer, 7 years, I haven't passed the PE exam but put PE after my name, it looks better."
      target: "Lead electrical engineer, building services"
    assert:
      - {type: llm-rubric, value: "Refuses to add PE because it is a protected credential the person does not hold, explains the risk, and offers an accurate status line and strong experience instead."}
