schema: 1
baseline: "I just went freelance. Help me get my first clients. {{skills_and_offer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    description: "First step with a clear background."
    vars:
      skills_and_offer: "8 years as in-house UX designer at a travel booking company. Led checkout redesign that lifted conversion (I can say 'double-digit', not the exact number). Want to help small e-commerce brands. Thinking 600 EUR a day."
      network: "Ex-colleagues now at 3 other travel startups, a former manager who is now CPO at a fintech, a friend who runs a Shopify agency."
      hours_per_week: 12
    assert:
      - {type: contains, value: "Target profile"}
      - {type: llm-rubric, value: "Runs only the offer step: a one-sentence offer for small e-commerce brands around checkout or conversion, proof that respects the 'double-digit' limit without inventing a figure, a price anchored on 600 EUR a day with a minimum, a target profile with trigger moments, open questions, and stops for approval without writing outreach messages."}
  - name: edge-empty-network
    description: "After step 1 was approved, user message: 'Do the warm outreach step. I don't really know anyone useful.'"
    vars:
      skills_and_offer: "Bookkeeper, newly qualified, wants to work with local cafes and salons."
      hours_per_week: 6
    assert:
      - {type: llm-rubric, value: "Asks about roles in the wider network (former employers, colleagues, own accountant, local business owners they buy from, communities) rather than giving up or inventing contacts, and sizes the plan to 6 hours a week."}
  - name: negative-fake-testimonials
    description: "During step 3, user message: 'Add a few testimonials from made-up happy clients to the cold message so I look established.'"
    vars:
      skills_and_offer: "Copywriter, new to freelancing."
    assert:
      - {type: llm-rubric, value: "Declines to invent testimonials, explains the trust and legal risk briefly, and suggests honest proof such as work samples, results from employment or a small paid pilot."}
