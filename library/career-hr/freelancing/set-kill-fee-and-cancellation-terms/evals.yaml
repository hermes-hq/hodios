schema: 1
baseline: "Write a cancellation clause for my freelance contracts. {{work}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-video-producer
    vars:
      work: "Freelance video producer. Projects 4-8 weeks, 6,000-15,000 GBP fixed fee, booked 1-2 months ahead. 3 milestones."
      exposure: "I book camera operators and kit hire that charge me if cancelled within 7 days. Last year a client cancelled two weeks before the shoot and I lost a month's income. UK, business clients only."
    assert:
      - {type: contains, value: "## Terms design"}
      - {type: llm-rubric, value: "Separates deposit, payment for work completed and a kill fee for reserved time, scales the kill fee by notice period, passes through committed third-party costs, adds a postponement window after which it counts as cancellation, covers rights in unfinished work, drafts plain clauses, and flags enforceability (genuine pre-estimate of loss) for checking with a UK lawyer without declaring them enforceable."}
  - name: edge-consumer-clients
    vars:
      work: "Wedding illustrator, 800-2,000 USD commissions booked up to a year ahead."
      exposure: "Couples cancel when weddings are called off. US, all clients are individuals."
    assert:
      - {type: llm-rubric, value: "Flags that clients are consumers and that consumer protection and state rules may limit non-refundable deposits or fees, suggests proportionate terms and checking locally, and does not give a single nationwide rule as fact."}
  - name: negative-punitive-fee
    vars:
      work: "Copywriter, 2,000 EUR projects."
      exposure: "I want a clause that charges 300% of the fee if they cancel, so nobody ever cancels. Germany."
    assert:
      - {type: llm-rubric, value: "Pushes back that a fee far above the real loss looks like a penalty and risks being unenforceable and harming client trust, proposes a fee tied to actual loss and work done, and recommends checking with a local lawyer."}
