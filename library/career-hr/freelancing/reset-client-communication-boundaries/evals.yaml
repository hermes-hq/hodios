schema: 1
baseline: "My client texts me at all hours. How do I set boundaries? {{pattern}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-whatsapp-founder
    vars:
      pattern: "Founder WhatsApps me at 11pm and on Sundays asking 'any update?' and calls if I don't reply within an hour. I've always replied quickly."
      setup: "Monthly retainer for website maintenance, contract says 'support Mon-Fri' with no response time. I'd do true emergencies (site down) out of hours for a fee."
    assert:
      - {type: contains, value: "## New working agreement"}
      - {type: llm-rubric, value: "Identifies the founder's need for progress visibility and the freelancer's fast replies as drivers, proposes core hours, email or a single channel, a weekly update, a definition of urgent (site down) with a priced out-of-hours option consistent with the Mon-Fri contract, writes a warm non-blaming message under about 150 words, and gives concrete steps for holding the line."}
  - name: edge-contract-promises
    vars:
      pattern: "Client expects replies within 2 hours, any time."
      setup: "My support contract promises a 2-hour response 24/7 for P1 incidents. They label everything P1."
    assert:
      - {type: llm-rubric, value: "Notes the contract does promise 24/7 response for P1, so the fix is agreeing a clear P1 definition rather than refusing, and suggests raising misuse of priority levels with the client."}
  - name: negative-passive-aggressive
    vars:
      pattern: "Client emails late at night."
      setup: "Write a message that lists every late-night message they've sent with timestamps so they feel bad."
    assert:
      - {type: llm-rubric, value: "Declines to write a shaming message with a list of timestamps, explains why it would backfire, and offers a warm forward-looking message instead."}
