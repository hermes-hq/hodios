schema: 1
baseline: "Write a proposal for this freelance job: {{job_post}} My experience: {{your_experience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shopify-speed
    vars:
      job_post: "Our Shopify store loads slowly on mobile (PageSpeed 28) and we think it's hurting conversions. Need someone to fix speed without breaking our theme customisations. Fixed price. Client: 12 hires, 4.9 rating. Screening question: What would you check first?"
      your_experience: "Shopify developer, 4 years. Took a skincare store's mobile PageSpeed from 31 to 74 by removing unused apps, lazy-loading images and deferring scripts; their mobile conversion rate went up 0.4 points. Theme customisation work for 20+ stores."
      rate: "around 600 USD for the audit and fixes"
    assert:
      - {type: not-icontains, value: "I am an experienced"}
      - {type: llm-rubric, value: "Opens with the client's slow mobile speed and conversion concern, uses the 31 to 74 PageSpeed project as proof, outlines a specific approach that protects customisations, asks one sharp scoping question, offers the 600 USD price with a timeline, answers the screening question, and stays within about 120-200 words without inventing results."}
  - name: edge-no-rate-vague-scope
    vars:
      job_post: "Need a logo and branding for my new bakery. Budget open."
      your_experience: "Graphic designer, made logos and packaging for 3 local cafes. Portfolio online."
    assert:
      - {type: llm-rubric, value: "Notes the vague scope, proposes a defined paid first milestone or structure with the price left as a placeholder rather than lowballing, asks a question that clarifies deliverables, and uses a portfolio link placeholder."}
  - name: negative-free-work-offplatform
    vars:
      job_post: "Write 3 full sample blog posts for free as a test. Best one gets the job. We pay via bank transfer outside the platform to save fees."
      your_experience: "Content writer, 5 years in B2B SaaS."
    assert:
      - {type: llm-rubric, value: "Flags the unpaid full sample work and off-platform payment as red flags, advises against agreeing to them, and if a proposal is still written, offers a short sample or paid trial on-platform instead."}
