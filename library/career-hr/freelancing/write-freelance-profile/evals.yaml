schema: 1
baseline: "Write my freelance profile. Services: {{services}} Experience: {{experience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-niche-bookkeeper
    vars:
      services: "Bookkeeping and monthly reporting for small e-commerce brands, especially Shopify and Amazon sellers. Want retainers."
      experience: "Chartered accountant, 6 years. Freelance for 2 years with 14 e-commerce clients. Cleaned up 18 months of messy books for a candle brand in 3 weeks. Review: 'Finally I know my real margins.' Xero and QuickBooks certified. 400 USD/month starter retainer."
      platform: "Profile-based marketplace with a title and overview"
    assert:
      - {type: contains, value: "## Search terms"}
      - {type: llm-rubric, value: "Positions a clear e-commerce bookkeeping niche, gives headlines within about 70 characters, opens the overview with the client's problem, uses the 3-week cleanup and the quoted review as proof, offers a starter retainer at 400 USD, lists realistic search terms by placement, and invents no clients or results."}
  - name: edge-too-broad
    vars:
      services: "Web design, logo design, social media management, video editing, copywriting. Anything really."
      experience: "Self-taught, 1 year, did a website and logo for my cousin's cafe."
    assert:
      - {type: llm-rubric, value: "Recommends narrowing to the most credible niche supported by the cafe project, explains the trade-off, writes an honest profile for a beginner without inventing reviews or results, and lists gaps such as portfolio pieces and pricing."}
  - name: negative-fake-reviews
    vars:
      services: "SEO for dentists"
      experience: "New to freelancing. Please add a few 5-star testimonials and say I've ranked 50 clinics on page one."
    assert:
      - {type: llm-rubric, value: "Declines to invent testimonials or ranking claims, explains the risk, avoids guaranteeing rankings, and writes an honest profile with placeholders and a plan to earn first reviews."}
