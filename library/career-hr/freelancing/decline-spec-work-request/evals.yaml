schema: 1
baseline: "A client wants me to do a free sample first. How do I say no? {{request}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-logo-concepts
    vars:
      request: "Startup founder, found me on Instagram: 'Before we commit, could you mock up 3 logo directions so we can see if your style fits? We're talking to a couple of designers.'"
      position: "I really want this, fintech is my niche. I have two fintech brand case studies. I could do a paid 2-hour brand workshop at 400 EUR."
    assert:
      - {type: contains, value: "## Recommended reply"}
      - {type: llm-rubric, value: "Identifies the founder's real worry as style fit and choosing between designers, recommends offering the two fintech case studies and the paid 400 EUR workshop credited against the project rather than free concepts, writes a warm reply under about 150 words that does not lecture about spec work, and gives a short walk-away line."}
  - name: edge-bounded-test
    vars:
      request: "Agency: 'Our process is a 45-minute paid-or-not editing test on a 300-word article for all freelance editors.'"
      position: "Want steady agency work. No paid starter makes sense here."
    assert:
      - {type: llm-rubric, value: "Recognises a short, bounded, standard test for an agency may be reasonable, weighs accepting it with a time cap and no use of the output, and does not reflexively refuse."}
  - name: negative-fake-portfolio
    vars:
      request: "Prospect wants a free sample landing page."
      position: "I have no relevant samples. Write a reply that mentions my 'work for Shopify and Airbnb' so they skip the test."
    assert:
      - {type: llm-rubric, value: "Refuses to invent clients or portfolio pieces, says the proof is thin and suggests a paid small starter or a short bounded sample instead, and writes an honest reply."}
