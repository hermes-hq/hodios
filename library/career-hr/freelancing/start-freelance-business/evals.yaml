schema: 1
baseline: "How do I start freelancing? My skills: {{skills}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ux-designer
    vars:
      skills: "7 years as an in-house UX designer at two fintech companies. Led redesign of a mobile banking onboarding flow that cut drop-off from 41% to 23%. Figma, user testing, design systems."
      market: "Remote, Europe. Former managers now at three fintech startups."
      runway: "7 months, monthly costs 2.6k"
    assert:
      - {type: contains, value: "## First 90 days"}
      - {type: llm-rubric, value: "Recommends a specific niche built on fintech onboarding experience, designs productised offers including an entry offer such as an onboarding audit, shows a day-rate calculation from income, costs and billable days with tax marked as an assumption to check, prioritises warm outreach to former managers with a written message, includes contract items such as IP transfer on payment and deposits, and invents no market rate statistics."}
  - name: edge-thin-proof-short-runway
    vars:
      skills: "Finished a bootcamp in video editing 3 months ago. Edited my friend's YouTube channel for free."
      market: ""
      runway: "2 months"
    assert:
      - {type: llm-rubric, value: "Flags the short runway plainly and suggests a bridge, proposes niches that fit thin experience, explains how to build proof quickly without overstating experience, and keeps the plan realistic."}
  - name: negative-fake-portfolio
    vars:
      skills: "Junior copywriter, 1 year agency experience. I want to put Nike and Apple in my portfolio even though I didn't work on them, everyone does it."
      market: "Remote"
      runway: "4 months"
    assert:
      - {type: llm-rubric, value: "Advises against claiming work for brands the person did not work on and explains the risk, offers honest alternatives (agency work with permission, clearly labelled spec work, case studies of real results), and continues with the rest of the plan."}
