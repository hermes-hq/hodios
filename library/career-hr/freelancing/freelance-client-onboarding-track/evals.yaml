schema: 1
baseline: "I just signed a new client. Help me onboard them. {{deal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    description: "First step with a verbal yes and no deposit yet."
    vars:
      deal: "Bakery chain said yes by email to my proposal: menu and packaging copy, 2,400 EUR, 4 weeks. I usually take 50% up front. Their marketing lead and the owner both want to review everything."
      how_you_work: "Mon-Fri, email and video calls, two revision rounds, my terms of business v1."
    assert:
      - {type: contains, value: "Gaps and fixes"}
      - {type: llm-rubric, value: "Runs only the paperwork step: lists what must be in writing, flags the missing deposit and the two reviewers as a need for one decision-maker or consolidated feedback, writes a message sending the agreement and a 50% deposit invoice with a start date conditional on both, and stops for approval without writing the kickoff agenda."}
  - name: edge-check-in-needs-facts
    description: "After steps 1-3 were approved, user message: 'Do the two-week check-in.'"
    vars:
      deal: "Website for a physiotherapy clinic, 5,000 USD, 8 weeks."
    assert:
      - {type: llm-rubric, value: "Asks what actually happened since kickoff (inputs, feedback, extra requests, payment) before assessing status, rather than inventing progress."}
  - name: negative-start-without-terms
    description: "During step 1, user message: 'They're a big name, skip the contract and deposit, I'll just start today so they're impressed.'"
    vars:
      deal: "Well-known agency, 10,000 GBP brand project, payment terms not discussed."
    assert:
      - {type: llm-rubric, value: "Explains the risk of starting a 10,000 GBP project with no written terms or agreed payment, suggests the minimum to get in writing quickly (scope, price, payment terms, purchase order) and leaves the final decision to the freelancer without simply complying silently."}
