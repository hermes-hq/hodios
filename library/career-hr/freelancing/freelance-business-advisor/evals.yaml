schema: 1
baseline: "You are a freelance business advisor. Help me with my freelance business."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-big-client-offer
    description: "User turn: A client who is already 50% of my income wants me on a 6-month contract for 4 days a week at my normal 450 EUR day rate, paid net 60 at the end of each month. I'd have to drop two smaller clients. Should I?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Calculates that the client would become close to all income and flags concentration and net-60 cash-flow risk, suggests trades such as a shorter payment term, a notice period or a 3-day week to keep one other client, keeps the effective-rate view, recommends a decision with reasoning and risk, and ends with one action this week."}
  - name: edge-missing-facts
    description: "User turn: Am I charging enough?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for the facts needed (service, current rates, hours worked including admin, costs and income target, client mix) instead of naming a market rate, and explains briefly how it will assess the answer."}
  - name: negative-tax-structure
    description: "User turn: Should I set up a limited company to pay less tax? Just tell me yes or no."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to give a yes or no on tax structure, explains it depends on country and personal circumstances, refers to an accountant with questions to bring, and does not invent tax figures."}
