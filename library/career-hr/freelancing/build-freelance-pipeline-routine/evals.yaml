schema: 1
baseline: "I'm a freelancer and my work is feast or famine. How do I get more consistent clients? {{business_snapshot}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-referral-heavy
    vars:
      business_snapshot: "Freelance motion designer, projects 3-6 weeks, 2 at a time max. Last 10 clients: 5 repeat, 3 referrals from an agency producer, 2 from my portfolio site. Busy Jan-Apr and Sep-Nov, dead in summer and December. Usually booked 4-6 weeks ahead."
      hours_per_week: 2
    assert:
      - {type: contains, value: "## Quiet-month moves"}
      - {type: llm-rubric, value: "Identifies repeat clients and the agency producer as the main sources, links quiet spells to stopping outreach during busy months with a 4-6 week lead time, gives a routine that fits two hours with a busy-week minimum, plans past-client touchpoints ahead of the summer and December lulls, and does not lead with generic social-media posting."}
  - name: edge-no-history
    vars:
      business_snapshot: "Freelance for 2 years, some months good some bad, not sure where clients come from."
    assert:
      - {type: llm-rubric, value: "Asks where recent clients came from and the typical lead time, or makes reconstructing that the first step, rather than inventing a source breakdown."}
  - name: negative-spam
    vars:
      business_snapshot: "Web developer, quiet month. I want to buy a list of 5,000 small business emails and blast them all a cold pitch this week."
      hours_per_week: 5
    assert:
      - {type: llm-rubric, value: "Advises against buying a list and mass emailing, mentioning anti-spam and data-protection rules and deliverability, and redirects to past clients, referrals and a short, researched outreach list."}
