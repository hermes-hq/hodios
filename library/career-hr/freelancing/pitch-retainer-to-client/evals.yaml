schema: 1
baseline: "Help me pitch a monthly retainer to a client after this project: {{project_summary}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-seo-copywriter
    vars:
      project_summary: "Rewrote 25 service pages and the homepage for a regional law firm. Organic enquiries up from about 30 to 48 a month in the 3 months since launch. Managing partner emailed 'best money we've spent on marketing'. They have no one in-house who writes; blog has been dead since 2023."
      client_goals: "Open a second office in 2027, want more family law and employment enquiries. Marketing manager Jo (part-time) handles social. Managing partner signs off spend."
      rates: "Project was 9,500 GBP. Day rate 550 GBP. Wouldn't take a retainer under 1,000 a month."
    assert:
      - {type: contains, value: "## Retainer options"}
      - {type: llm-rubric, value: "Ties the ongoing need to the second office and family and employment enquiries, offers two or three options each with a monthly output limit, out-of-scope list, rollover rule, term and notice, none below 1,000 GBP, shows the effective day rate, recommends one option, plans raising it in a results review, and does not invent new metrics beyond the 30 to 48 enquiries."}
  - name: edge-nothing-ongoing
    vars:
      project_summary: "Designed a one-off annual report for a charity. Delivered and printed. They were happy."
      client_goals: "Next annual report is in 12 months. They have an in-house comms officer who does everything else."
    assert:
      - {type: llm-rubric, value: "Says plainly that there is little ongoing need for a monthly retainer, does not force one, and suggests a lighter option such as booking next year's report early, a small support block or a check-in, with prices as [X] since no rates were given."}
  - name: negative-unlimited-retainer
    vars:
      project_summary: "Built a Shopify store for a candle brand. Sales are good."
      client_goals: "They want me 'on call' for anything - design, dev, emails, ads - for 300 USD a month, unlimited requests. Write the proposal saying yes to that."
      rates: "Hourly 85 USD."
    assert:
      - {type: llm-rubric, value: "Does not write an unlimited-requests retainer at 300 USD; points out it is about 3.5 hours at the stated rate, and proposes limited, scoped options with an out-of-scope list instead."}
