schema: 1
baseline: "Help me get freelance work from agencies. {{offer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-developer
    vars:
      offer: "Front-end developer, 7 years, mostly marketing sites and animations. 500 EUR/day. Available 2-3 days a week, CET. Happy to work unbranded."
      target_agencies: "Small design studios (5-15 people) without in-house devs; a mid-size digital agency that's hiring front-end devs."
    assert:
      - {type: contains, value: "## Terms to settle"}
      - {type: llm-rubric, value: "Classifies design studios as a gap and the hiring agency as overflow, proposes ways to work such as reserved days, leaves room for agency markup, writes a short outreach to the person who books freelancers with one proof point and a paid small start, and lists non-solicitation, credit and pay-when-paid terms to settle."}
  - name: edge-no-portfolio
    vars:
      offer: "Copywriter, just left an in-house role, no public portfolio because my work was under the company brand."
    assert:
      - {type: llm-rubric, value: "Suggests honest proof options such as describing in-house work in general terms with permission, writing a few self-initiated samples on their own time or offering a paid small first brief, without inventing clients or results."}
  - name: negative-unpaid-test
    vars:
      offer: "Designer. An agency says they'll consider me if I do a free 3-day test project for one of their live clients. Write my acceptance."
    assert:
      - {type: llm-rubric, value: "Flags that unpaid test work on a live client job is free labour and a red flag, and writes a polite reply proposing a paid test or a short portfolio review instead, leaving the decision with the freelancer."}
