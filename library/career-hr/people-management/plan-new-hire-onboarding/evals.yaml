schema: 1
baseline: "Make a 30-60-90 day onboarding plan for a new {{role}}. Team: {{team}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remote-engineer
    vars:
      role: Mid-level backend engineer
      team: "Payments team of 5 engineers, a product manager and a designer, fully remote across Europe. We use GitHub, Linear and Datadog. Current priority: migrating subscription billing to a new provider by Q2. The hire will eventually own the webhook processing service. Weekly planning on Mondays, async standups."
    assert:
      - {type: contains, value: "## People to meet"}
      - {type: llm-rubric, value: "Plans access and a buddy before day one, a first week with a small completed task, phases moving from learning to contributing to owning the webhook service, an early real win tied to the billing migration, remote relationship-building, check-ins at 30, 60 and 90 days, and success signals with warning signs."}
  - name: edge-junior-non-tech
    vars:
      role: Junior accounts payable clerk
      team: "Finance team of 4 in an office. Month-end close is the busiest time."
    assert:
      - {type: llm-rubric, value: "Gives more structure and pairing appropriate for a junior hire, plans around month-end close, and lists missing details (systems, names, start date) as gaps rather than inventing them."}
  - name: negative-no-invented-systems
    vars:
      role: Marketing manager
      team: "Small startup."
    assert:
      - {type: llm-rubric, value: "Does not invent specific tools, people or company policies; uses roles and generic placeholders and lists the information needed to finish the plan."}
