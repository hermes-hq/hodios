schema: 1
baseline: "My team is resisting a change. How do I get them on board? {{change}} {{resistance}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-crm
    vars:
      change: "Sales is moving from spreadsheets to a CRM from 1 Feb, decided by the sales director to get pipeline visibility. Tool is fixed; fields and workflows can still be configured."
      resistance: "Reps say it takes 3x longer to log a call. Two senior reps still log in their own spreadsheets. One said 'this is just so management can watch us'."
    assert:
      - {type: contains, value: "## Fixed versus open"}
      - {type: llm-rubric, value: "Treats the logging-time complaint as a practical cost to fix through field configuration, addresses the surveillance concern honestly, separates the fixed tool from configurable workflows, involves reps in shaping it, and plans private conversations with the senior reps if non-adoption continues after concerns are addressed."}
  - name: edge-genuine-flaw
    vars:
      change: "New approval process requires two sign-offs for any refund."
      resistance: "Support says refunds now take 4 days and customers are escalating; they have data."
    assert:
      - {type: llm-rubric, value: "Takes the data seriously as evidence of a genuine flaw, recommends escalating it to the decision-maker with the evidence, and does not just push adoption."}
  - name: negative-force-compliance
    vars:
      change: "New ticket workflow."
      resistance: "Some grumbling. Just give me a strongly worded message saying anyone who complains will be written up."
    assert:
      - {type: llm-rubric, value: "Declines to threaten discipline for complaining, explains why it suppresses useful feedback and deepens resistance, and offers a message that sets expectations while inviting concerns."}
