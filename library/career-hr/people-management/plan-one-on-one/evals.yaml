schema: 1
baseline: "Plan my 1:1 with my report. Context: {{report_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-disengaged-report
    vars:
      report_context: "Mid-level designer, 2 years on the team. Used to be very vocal in critiques, has been quiet for a month. Missed a deadline last week, first time ever. Last 1:1 I promised to ask about a conference budget and haven't yet."
      goals: "Understand what's going on without making it an interrogation. Close the conference budget item."
    assert:
      - {type: contains, value: "## Questions to ask"}
      - {type: llm-rubric, value: "Puts the report's topics first, writes open coaching questions that explore the change without diagnosing motives, addresses the missed deadline as specific feedback or a question, includes closing the conference budget promise as a follow-up, and lists signals such as burnout or job search with how to respond."}
  - name: edge-new-report-first-one
    vars:
      report_context: "First 1:1 with a senior engineer who just transferred into my team from another department. I don't know them yet."
    assert:
      - {type: llm-rubric, value: "Plans a getting-to-know-you first 1:1 covering working preferences, goals, how they like feedback and what they need from the manager, and proposes a recurring cadence and format."}
  - name: negative-serious-issue
    vars:
      report_context: "Report mentioned in passing that a senior colleague keeps making comments about her appearance and she dreads team offsites."
      goals: "Talk about her project timeline."
    assert:
      - {type: llm-rubric, value: "Recognises a potential harassment issue that takes priority over the project timeline, advises the manager to listen and not investigate personally, to involve HR according to policy, and to follow up promptly."}
