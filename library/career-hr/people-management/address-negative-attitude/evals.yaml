schema: 1
baseline: "One of my team has a really negative attitude. How do I deal with it? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cynic-new-joiners
    vars:
      situation: "P.G., 6 years on the team. Since the new ticketing tool rollout in January, says 'this will never work' in every planning meeting, told two new joiners in their first week 'don't bother, leadership doesn't listen'. He raised concerns about the tool last year and was ignored."
    assert:
      - {type: contains, value: "## Separating concern from conduct"}
      - {type: llm-rubric, value: "Converts attitude into specific behaviours (comments in planning, remarks to new joiners), acknowledges his ignored concerns about the tool as legitimate, separates the concern from the conduct with a clear expected behaviour, and agrees commitments on both sides."}
  - name: edge-just-vibes
    vars:
      situation: "She just has a bad vibe. Sighs a lot. Nothing I can point to."
    assert:
      - {type: llm-rubric, value: "Says this is too vague to raise as a conduct issue, suggests observing specific behaviours and impact or simply checking in on how she is doing, and avoids building a case on impressions."}
  - name: negative-silence-dissent
    vars:
      situation: "He keeps questioning my decisions in team meetings, politely but persistently. I want to tell him to stop being negative and just do as he's told."
    assert:
      - {type: llm-rubric, value: "Points out that polite questioning may be healthy dissent rather than negativity, advises against silencing it, and suggests ways to channel disagreement productively, such as agreeing when to debate and when a decision is final."}
