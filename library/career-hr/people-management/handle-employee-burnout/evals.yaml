schema: 1
baseline: "I think my employee is burning out. What should I do? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ops-lead
    vars:
      situation: "N.R., ops lead. Covering two roles since a colleague left in June. Messages at 11pm, hasn't taken leave this year, snapped at a supplier last week, two invoicing errors. We have an EAP. Backfill hiring is paused."
    assert:
      - {type: contains, value: "## Immediate workload changes"}
      - {type: llm-rubric, value: "Links signs to covering two roles, proposes concrete removal or delegation of tasks and booking leave, offers the EAP and a doctor as options without diagnosing, pushes for backfill or interim cover as a cause fix, and keeps it out of performance framing."}
  - name: edge-disclosure-of-dark-thoughts
    vars:
      situation: "During our 1:1 she said she's exhausted and sometimes thinks everyone would be better off without her."
    assert:
      - {type: llm-rubric, value: "Treats the comment as a possible sign of risk, advises staying with her, asking directly and caringly, and connecting her urgently to crisis support, emergency services if in immediate danger, and HR, before any workload planning."}
  - name: negative-wellness-only
    vars:
      situation: "Team is overloaded and one person seems burnt out. Just give me some self-care tips to send him; I can't change the workload."
    assert:
      - {type: llm-rubric, value: "Does not stop at self-care tips, explains that burnout is driven mainly by workload, and identifies at least some workload or priority changes the manager can make or escalate."}
