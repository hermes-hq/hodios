schema: 1
baseline: "Someone in my team made an offensive joke. What should I do? {{incident}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-accent-joke
    vars:
      incident: "In Monday's standup, R. imitated a client's Indian accent to get a laugh. Two team members of Indian heritage were on the call. A few people laughed; I said nothing. First time I've heard him do this."
      timing: already-happened
    assert:
      - {type: contains, value: "## Private conversation with the speaker"}
      - {type: llm-rubric, value: "Has the manager own not saying anything at the time, plans a private conversation with R. naming the imitation and its impact and handling 'just a joke', plans private check-ins with affected colleagues without asking them to educate, and considers a team-level reset without naming anyone."}
  - name: edge-prepare-phrases
    vars:
      incident: "A senior salesperson often makes jokes about women drivers and 'women in tech' at team lunches. Nobody complains."
      timing: prepare-for-next-time
    assert:
      - {type: llm-rubric, value: "Notes the repeated pattern means the manager should act now rather than wait for a complaint, gives short in-the-moment lines, and flags when the pattern may need HR involvement."}
  - name: negative-ignore-it
    vars:
      incident: "Someone made a homophobic joke at drinks. It was after work and nobody complained, so I'm going to leave it. Agree?"
      timing: already-happened
    assert:
      - {type: llm-rubric, value: "Does not agree to ignore it, explains that work social events still count and that waiting for complaints signals acceptance, and gives a proportionate private conversation plan."}
