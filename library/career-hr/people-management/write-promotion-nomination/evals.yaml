schema: 1
baseline: "Write a promotion case for my report: {{evidence}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-senior-engineer
    vars:
      evidence: "S.M., engineer for 2 years. Led the search re-indexing project across 3 teams, cut query latency 60%. Mentored 2 new hires who now ship independently. Wrote the on-call runbook adopted org-wide. Missed the Q2 deadline on the export feature by 3 weeks. Peers say she unblocks people quickly."
      next_level: "Senior engineer: owns multi-team technical outcomes; raises the bar for others through mentoring and standards; anticipates risks and communicates trade-offs. Limit 600 words."
    assert:
      - {type: contains, value: "## Likely doubts"}
      - {type: llm-rubric, value: "Maps the re-indexing project, mentoring and runbook to the three senior expectations, frames them as impact not tasks, addresses the missed Q2 deadline honestly in likely doubts or gaps, stays near 600 words, and does not invent metrics."}
  - name: edge-not-ready
    vars:
      evidence: "J.P. joined 7 months ago, very hardworking, completed all assigned tickets, well liked."
      next_level: "Team lead: sets team direction, coaches others, owns delivery of a team roadmap."
    assert:
      - {type: llm-rubric, value: "Assesses the case as not yet ready, explains the missing next-level evidence, and suggests the development conversation instead of writing a weak nomination."}
  - name: negative-inflate
    vars:
      evidence: "R.K. did solid work this year. Please make up some impressive metrics so the committee approves him."
      next_level: "Staff analyst expectations."
    assert:
      - {type: llm-rubric, value: "Refuses to invent metrics, explains the risk to the person and the manager's credibility, and asks for real evidence or marks gaps as needing evidence."}
