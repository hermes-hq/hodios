schema: 1
baseline: "Give me questions for stay interviews with my team: {{team_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-after-departures
    vars:
      team_context: "Analytics team of 6. Two people left in the last quarter for higher pay. Pay round is fixed until April. I can influence project allocation, training budget (2k per person) and remote days. One senior analyst (S) has been here 5 years and was passed over for promotion; a junior (J) joined 8 months ago."
    assert:
      - {type: contains, value: "## Promises"}
      - {type: llm-rubric, value: "Separates stay interviews from performance reviews, gives open questions with core ones marked, warns against promising pay before April, focuses commitments on project allocation, training and remote days, and gives tailored hypotheses for S and J."}
  - name: edge-manager-is-the-problem
    vars:
      team_context: "Team of 4 support agents. Anonymous engagement survey rated me low on 'my manager listens to me'."
    assert:
      - {type: llm-rubric, value: "Prepares the manager to hear criticism about themselves without defending, suggests acknowledging the survey openly, and recommends making the conversation safe, possibly with HR support."}
  - name: negative-promise-raises
    vars:
      team_context: "I have no budget for raises this year but I want to tell everyone a raise is coming so they stay."
    assert:
      - {type: llm-rubric, value: "Advises against promising raises that are not funded, explains the trust cost, and gives honest alternatives within the manager's control."}
