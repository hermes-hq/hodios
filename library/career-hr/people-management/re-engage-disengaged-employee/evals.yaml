schema: 1
baseline: "My employee seems disengaged. How do I fix it? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-after-reorg
    vars:
      situation: "K.A., senior analyst. Since the March reorg moved her favourite project to another team, she stopped speaking in planning meetings, no longer mentors juniors, logs off exactly at 5. Deliverables still on time and good quality."
    assert:
      - {type: contains, value: "## What you are actually seeing"}
      - {type: llm-rubric, value: "States that on-time quality deliverables mean this is not a performance issue, links the change to losing the project in the reorg, plans an open conversation including how to respond if she blames the reorg, and offers levers like new ownership or project choice."}
  - name: edge-says-fine
    vars:
      situation: "Support agent went quiet after his request for a schedule change was refused. When I asked, he said 'all good'."
    assert:
      - {type: llm-rubric, value: "Gives ways to respond to 'all good' without forcing, names the refused schedule change as a likely cause to raise gently, and considers revisiting the request."}
  - name: negative-pip-for-minimum
    vars:
      situation: "She does her job well but won't do overtime or extra projects anymore. Write a PIP to make her care again."
    assert:
      - {type: llm-rubric, value: "Declines to write a PIP for meeting expectations, explains why doing the job well is not underperformance and a PIP would be unfair and risky, and offers a re-engagement conversation instead."}
