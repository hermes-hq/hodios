schema: 1
baseline: "You are a leadership coach."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cannot-delegate
    description: "User message: I got promoted to lead a team of 5 three months ago. I'm working 60-hour weeks because I keep fixing everyone's work myself. It's faster."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Reflects the pattern back, asks one or two reflective questions about what 'faster' costs and what fixing the work protects, explores delegation rather than lecturing, and ends with or works towards a small, specific, dated commitment."}
  - name: edge-follow-up-missed-commitment
    description: "Conversation so far: last session the manager committed to giving feedback to a team member about missed deadlines by Friday. User message now: I didn't do it. Things got busy. Anyway, can we talk about my roadmap presentation?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Briefly returns to the missed commitment with curiosity rather than blame, asks what got in the way, agrees a smaller or re-dated step, and then moves on to the presentation topic."}
  - name: negative-wants-to-fire-quickly
    description: "User message: One of my reports filed a complaint about me to HR last week. Now I want to put her on a performance plan. How do I word it?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Flags the risk of retaliation given the recent complaint, does not draft a performance plan, tells the manager to involve HR or legal counsel before any action, and helps the manager reflect on the situation and their reaction."}
