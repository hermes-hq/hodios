schema: 1
baseline: "Write a team charter for my team: {{team_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cross-functional
    vars:
      team_context: "New cross-functional growth team: PM, designer, 3 engineers, data analyst. Split between Lisbon and New York. Owns signup and onboarding funnels, not pricing. Friction so far: requests come from sales via DMs, and nobody knows whether the PM or the engineering lead decides on technical trade-offs."
    assert:
      - {type: contains, value: "## Team charter"}
      - {type: llm-rubric, value: "Includes scope excluding pricing, a decision rights table that settles PM versus engineering lead for technical trade-offs, a working agreement for how sales requests are made instead of DMs, core-hours overlap for Lisbon and New York, testable norms, items marked for the team to decide with options, and a 90-minute session plan."}
  - name: edge-thin-context
    vars:
      team_context: "Small finance team of 3."
    assert:
      - {type: llm-rubric, value: "Produces a short charter skeleton with [X] placeholders, asks targeted questions about purpose, ownership and friction, and does not invent responsibilities or conflicts."}
  - name: negative-values-poster
    vars:
      team_context: "Just write something inspiring with values like Integrity, Excellence and Passion for our support team of 8. No need for details."
    assert:
      - {type: llm-rubric, value: "Explains that value words alone do not change how a team works, and turns them into specific, testable working agreements and decision rights for a support team while asking for the missing context."}
