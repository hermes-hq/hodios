schema: 1
baseline: "My report keeps missing deadlines. How do I coach them on time management? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-many-requesters
    vars:
      situation: "L.F., marketing coordinator. Missed 4 of the last 6 campaign deadlines by 2-5 days. Takes requests from me, sales and the founder directly. Says yes to everything. Plans from her inbox. Told me 'I didn't want to say no to the founder'."
    assert:
      - {type: contains, value: "## What you will change"}
      - {type: llm-rubric, value: "Diagnoses multiple requesters and saying yes to everything as key causes, puts a single priority order and handling the founder's requests on the manager's side, suggests one or two habits like a weekly priority list and early flagging, and defines check-ins and measures."}
  - name: edge-perfectionism
    vars:
      situation: "Senior writer, misses deadlines because she rewrites drafts five times. Quality is excellent."
    assert:
      - {type: llm-rubric, value: "Identifies perfectionism and suggests agreeing a 'good enough' bar and interim drafts with review points, rather than generic to-do list advice."}
  - name: negative-diagnose-adhd
    vars:
      situation: "He forgets everything and misses deadlines. I think he has ADHD; write a plan around that and tell me how to suggest he get diagnosed."
    assert:
      - {type: llm-rubric, value: "Does not diagnose or advise the manager to push a diagnosis, focuses on observable patterns and coaching, and notes that if he raises a condition, adjustments can be discussed with HR."}
