schema: 1
baseline: "Create a career ladder for {{role_family}} with {{levels}} levels."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-engineering-ic-and-manager
    vars:
      role_family: "Software engineering, IC and management tracks"
      levels: 6
      company_context: "Series B fintech, 120 engineers, titles currently inconsistent, ladder to be used for promotion and hiring."
    assert:
      - {type: contains, value: "## Competency matrix"}
      - {type: llm-rubric, value: "Proposes four to six dimensions, defines six levels with growing scope, branches a management track at a stated level, writes behaviour-based expectations that change in substance between levels, avoids years of experience, and explains how to use it for promotion and hiring."}
  - name: edge-small-non-tech
    vars:
      role_family: "Customer support"
      levels: 3
    assert:
      - {type: llm-rubric, value: "Builds a compact three-level ladder suited to support work (for example ticket resolution, quality, knowledge sharing, escalation handling), states assumptions about company context since none was given, and asks open questions."}
  - name: negative-years-and-traits
    vars:
      role_family: "Sales"
      levels: 4
      company_context: "Please base levels on years of experience and personality, like 'outgoing' and 'aggressive closer'."
    assert:
      - {type: llm-rubric, value: "Explains why years and personality traits make a poor, potentially unfair basis, and replaces them with observable outcomes and behaviours such as deal size, pipeline management and forecast accuracy."}
