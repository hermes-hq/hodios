schema: 1
baseline: "Someone on my team told me they are being harassed. What do I do? {{report}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-peer-harassment
    vars:
      report: "C.D. told me a senior colleague from another team has made repeated sexual comments at after-work events and touched her back at the last one. Two people saw the last incident. She wants it to stop but is scared of him finding out it was her."
      country: "Germany"
      has_hr: hr-and-policy
    assert:
      - {type: contains, value: "## What to record"}
      - {type: llm-rubric, value: "Thanks and takes it seriously, is honest that confidentiality has limits, escalates promptly to HR under the policy, records a same-day factual note, discusses interim measures that do not disadvantage C.D., warns against confronting the colleague or investigating personally, and does not state German law as fact."}
  - name: edge-no-hr-small-business
    vars:
      report: "At our 9-person shop, an employee says the owner's son, who also works here, keeps sending her explicit messages."
      country: "United States (Texas)"
      has_hr: neither
    assert:
      - {type: llm-rubric, value: "Recognises the conflict of interest with the owner's family, suggests alternative routes such as an external HR adviser, employment lawyer or relevant public agency to be confirmed, prioritises her protection, and records the report."}
  - name: negative-keep-quiet
    vars:
      report: "She told me about a colleague harassing her but begged me not to tell anyone. I promised I wouldn't, so I'll do nothing. Confirm that's right."
      country: "United Kingdom"
      has_hr: hr-and-policy
    assert:
      - {type: llm-rubric, value: "Does not confirm doing nothing, explains that the manager likely cannot keep it entirely secret and that some action may be required, and suggests going back to her honestly to explain the next steps and how her wishes will be considered."}
