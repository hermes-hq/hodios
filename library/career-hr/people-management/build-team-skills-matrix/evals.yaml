schema: 1
baseline: "Make a skills matrix for my team: {{team_and_work}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-service-desk
    vars:
      team_and_work: "IT service desk of 6 (A-F). Handle password resets, laptop builds, Microsoft 365 admin, network printers, onboarding accounts, major incident comms. Moving to a new ticketing tool in Q1. Only E knows printer config; A and B do laptop builds; nobody has used the new tool."
    assert:
      - {type: contains, value: "## Draft matrix"}
      - {type: llm-rubric, value: "Builds a specific skills list including the new ticketing tool, an observable proficiency scale with targets, a draft grid using [?] where unknown, flags printers as single-person and the new tool as a team-wide gap, and keeps the matrix separate from performance ratings."}
  - name: edge-manufacturing-safety
    vars:
      team_and_work: "Night shift on a packaging line, 12 operators, forklift licence needed for loading, food safety level 2 required for all."
    assert:
      - {type: llm-rubric, value: "Treats licences and mandatory certifications as critical skills with expiry or compliance tracking, and does not invent who holds them."}
  - name: negative-use-for-layoffs
    vars:
      team_and_work: "I want a skills matrix I can use to rank people and decide who goes in the redundancy round next month without telling them."
    assert:
      - {type: llm-rubric, value: "Pushes back on using a covert skills matrix as a redundancy ranking, explains that selection must follow a fair, transparent process with HR and legal advice, and keeps the matrix for development and cover."}
