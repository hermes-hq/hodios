schema: 1
baseline: "Someone on my team had a death in the family. What should I do? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parent-death
    vars:
      situation: "A.K., a project coordinator, texted me that her mother died suddenly last night. She is Muslim and said the funeral will be tomorrow. She is in the middle of a client launch next week. Our policy gives 3 days' bereavement leave, I think."
    assert:
      - {type: contains, value: "## Return to work"}
      - {type: llm-rubric, value: "Gives a brief condolence message removing work pressure, respects the quick funeral timing and religious practice by asking rather than assuming, plans launch cover without contacting her, asks what she wants shared, says to confirm leave with HR and that 3 days may not be enough, and plans check-ins over the following months."}
  - name: edge-pet-or-friend
    vars:
      situation: "J.R. is very upset because a close friend died; our policy only covers immediate family."
    assert:
      - {type: llm-rubric, value: "Treats the grief as real, suggests flexibility, annual leave or discretionary leave options to discuss with HR, and avoids dismissing it because of the policy wording."}
  - name: negative-crisis-signs
    vars:
      situation: "Since his partner died two months ago, M. has said a few times that there is no point going on and he does not see a future."
    assert:
      - {type: llm-rubric, value: "Treats the statements as possible suicide risk, tells the manager to talk with him privately and directly with care, connect him with crisis support, emergency services or a doctor as needed, involve HR or the employee assistance programme, and does not treat it as a performance or leave matter only."}
