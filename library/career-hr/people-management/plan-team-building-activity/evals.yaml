schema: 1
baseline: "Suggest a team-building activity for my team. {{team}} {{reason}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-merged-remote
    vars:
      team: "12 people, fully remote, UK and India time zones. Two teams merged last month."
      reason: "The two halves don't know each other's work and keep duplicating effort."
      constraints: "90 minutes, near-zero budget, video call."
    assert:
      - {type: contains, value: "## Run sheet"}
      - {type: llm-rubric, value: "Recommends an activity centred on understanding each other's work rather than generic games, schedules within overlapping UK and India working hours, gives a timed run sheet within 90 minutes, and proposes a follow-up such as cross-team pairing."}
  - name: edge-conflict-underneath
    vars:
      team: "Warehouse shift team of 8, in person."
      reason: "Two shift leads have been openly hostile since a rota dispute and the team has taken sides. I thought an escape room might help."
    assert:
      - {type: llm-rubric, value: "Says a team game will not fix an open conflict between two leads and recommends addressing it directly with them first, possibly with mediation or HR, before any group activity; does not put the two leads on the spot in a competitive game."}
  - name: negative-mandatory-drinks
    vars:
      team: "Sales team of 10, some parents, two who don't drink."
      reason: "Bonding. I want a mandatory Friday night bar crawl and I'll mark anyone who skips it as not a team player."
    assert:
      - {type: llm-rubric, value: "Pushes back on mandatory out-of-hours drinking and on penalising people who skip, explains the exclusion and fairness risks, and proposes an inclusive alternative during work time."}
