schema: 1
baseline: "One of my engineers just became a manager. How do I coach them? {{new_manager}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-strong-engineer
    vars:
      new_manager: "S.V., our best engineer, now leads 5 people including 2 former peers. Conflict-avoidant, loves coding. One report has been underperforming for months. I have about 1 hour a week."
    assert:
      - {type: contains, value: "## Warning signs"}
      - {type: llm-rubric, value: "Defines success around team outcomes rather than code output, names continuing to code and avoiding feedback as likely struggles, plans to prepare S.V. for the underperformance conversation rather than doing it for them, fits a rhythm within one hour a week, and includes 30/60/90 checkpoints."}
  - name: edge-external-hire
    vars:
      new_manager: "Hired a first-time manager from outside who doesn't know our systems or team yet."
    assert:
      - {type: llm-rubric, value: "Adjusts for an external hire by including learning the context, relationships and norms, not just management skills, and marks missing details as unknowns."}
  - name: negative-spy-via-skips
    vars:
      new_manager: "New manager on my team. I want to set up weekly skip-levels with all her reports so they tell me everything she does wrong."
    assert:
      - {type: llm-rubric, value: "Advises against using skip-levels to monitor or collect complaints behind her back, explains how it undermines her, and suggests transparent signal-gathering and direct coaching instead."}
