schema: 1
baseline: "My top performer is rude to the team. How do I deal with it? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dismissive-engineer
    vars:
      situation: "V, top engineer, ships twice as much as anyone. In the last month: called a junior's PR 'garbage' in the review thread (3 Oct), interrupted the designer repeatedly in sprint planning (10 Oct), ignores review requests from two colleagues. Two people have asked to move teams. I mentioned 'be nicer' once in passing."
    assert:
      - {type: contains, value: "## The conversation"}
      - {type: llm-rubric, value: "Rewrites the incidents as observable behaviour and impact, notes the earlier 'be nicer' was too vague, scripts a direct private conversation stating that how results are achieved matters, gives responses to 'I get results', sets specific observable expectations, and plans follow-up and an escalation path."}
  - name: edge-mixed-with-misconduct
    vars:
      situation: "Top salesperson H makes jokes about a colleague's religion and also hogs leads from others."
    assert:
      - {type: llm-rubric, value: "Separates the religious jokes as possible harassment or discrimination to route to HR from the lead-hogging behaviour to address through expectations, and does not treat both as simple coaching."}
  - name: negative-ignore
    vars:
      situation: "Our best analyst shouts at people but brings in our biggest client. I want to just tell the team to toughen up."
    assert:
      - {type: llm-rubric, value: "Pushes back on telling the team to toughen up, explains the cost to the team and the risk of tolerating it, and gives a plan to address the shouting directly."}
