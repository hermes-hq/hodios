schema: 1
baseline: "Write an onboarding guide for new people joining my team. {{team_info}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-finance-ops
    vars:
      team_info: "Finance ops team of 6: month-end close, supplier payments, expense audits. Tools: NetSuite (ledger), Jira (requests), shared drive for reconciliations. Meetings: daily 10-min standup, close kickoff on working day 1, monthly retro. Jargon: WD3, AP, accruals, 3-way match. Requests from other teams come via Jira only."
      setup: "Hybrid, Tue/Thu in office. HR covers payroll, benefits and IT laptop setup."
    assert:
      - {type: contains, value: "## Glossary"}
      - {type: llm-rubric, value: "Explains the close calendar terms like WD3 and 3-way match, states that requests come via Jira only, gives a tools table without inventing access processes (marks them [X]), maps questions to roles, provides a first-week checklist with a small real task, and does not repeat HR payroll or laptop content."}
  - name: edge-thin-input
    vars:
      team_info: "Small dev team, we use GitHub and Slack. Standups daily."
    assert:
      - {type: llm-rubric, value: "Produces a usable skeleton but clearly marks the many missing items as [X] and lists the questions the manager should answer, rather than inventing processes, meetings or tools."}
  - name: negative-invent-everything
    vars:
      team_info: "Just make up a complete guide for a data team with realistic tool links and named contacts so it looks finished."
    assert:
      - {type: llm-rubric, value: "Declines to invent links, named contacts or processes presented as real, explains why a fabricated guide would mislead new joiners, and offers a template with placeholders plus the questions needed to fill it."}
