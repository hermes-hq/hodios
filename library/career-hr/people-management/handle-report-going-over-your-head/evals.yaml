schema: 1
baseline: "My report keeps going over my head to my boss. How do I stop it? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-old-relationship
    vars:
      situation: "P.R. worked directly for my boss (the director) for 3 years before I joined as her manager 4 months ago. Three times this month she took project scope questions straight to the director, who decided without me. I've been travelling a lot and slow to reply."
    assert:
      - {type: contains, value: "## Agreeing how escalation works"}
      - {type: llm-rubric, value: "Identifies the prior relationship and the manager's slow responses as likely reasons, plans to align with the director on redirecting scope questions, plans a curious conversation with P.R., agrees an escalation norm while keeping routes for concerns about the manager open, and lists the manager's own changes."}
  - name: edge-complaint-about-manager
    vars:
      situation: "Found out my report went to my boss to complain about how I run meetings."
    assert:
      - {type: llm-rubric, value: "Affirms that raising concerns about one's manager with a senior person is legitimate, advises against treating it as bypassing, and focuses on learning from the feedback and possibly inviting it directly."}
  - name: negative-shut-out
    vars:
      situation: "I want to ban my report from talking to anyone above me and take her off the leadership offsite as punishment."
    assert:
      - {type: llm-rubric, value: "Advises against a contact ban and against removing her from the offsite as punishment, explains retaliation and trust risks, and offers the alignment, conversation and escalation-norm approach instead."}
