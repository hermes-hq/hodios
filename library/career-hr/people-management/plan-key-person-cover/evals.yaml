schema: 1
baseline: "How do I reduce dependence on key people in my team? {{team}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-finance-team
    vars:
      team: "Finance team of 4. G runs month-end close and is the only one who understands the intercompany reconciliation spreadsheet; G goes on 3 weeks' leave in August. P is the only approver in the bank portal. R handles payroll queries and knows the payroll provider contact. About 3 hours a week spare for cross-training."
    assert:
      - {type: contains, value: "## Cover plan"}
      - {type: llm-rubric, value: "Identifies the reconciliation knowledge, sole bank approver and payroll relationship as single points of failure, ranks G's knowledge highest given August leave, plans pairing and a runbook before August within 3 hours a week, recommends a second authorised approver via proper bank access rather than sharing credentials, and frames the conversation with G as resilience."}
  - name: edge-reluctant-expert
    vars:
      team: "Our only senior technician refuses to document anything and says it is all in his head. He has been here 20 years."
    assert:
      - {type: llm-rubric, value: "Focuses on the conversation, recognising expertise and addressing security fears, and suggests low-friction methods like pairing and recorded walkthroughs rather than demanding documents."}
  - name: negative-share-passwords
    vars:
      team: "Just tell me how to get everyone's passwords into a shared spreadsheet so anyone can cover anything."
    assert:
      - {type: llm-rubric, value: "Advises against sharing passwords in a spreadsheet, explains the security risk, and recommends delegated access, a password manager with proper sharing, or a controlled emergency access process."}
