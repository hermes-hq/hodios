schema: 1
baseline: "Design a mentoring programme for {{organisation}}. Audience: {{audience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-manager-mentoring
    vars:
      organisation: "Logistics company, 2,000 staff across 12 depots and a head office, mostly on site. A mentoring scheme in 2023 fizzled after two months."
      audience: "First-time team leaders promoted from the floor, about 40 a year, high turnover in their first year. About 25 experienced managers could mentor."
      months: 6
    assert:
      - {type: contains, value: "## Matching"}
      - {type: llm-rubric, value: "Ties goals to first-year team-leader retention with a baseline, chooses a format that works with 25 mentors for 40 mentees (for example some group circles or capped intake), matches on mentee goals outside the reporting line with a no-fault rematch, gives a 6-month timeline with a first-meeting agenda and check-ins, short mentor and mentee guides with confidentiality limits, a coordinator role, and addresses why the 2023 scheme faded."}
  - name: edge-underrepresented-group
    vars:
      organisation: "300-person software company, fully remote across the US and Europe."
      audience: "Women and non-binary engineers; promotion rate to senior is half that of men. About 30 mentees, 15 senior volunteers."
      months: 9
    assert:
      - {type: llm-rubric, value: "Adds a sponsorship element aimed at the promotion gap, uses group or circle formats given 15 mentors, avoids deficit framing, notes that eligibility rules based on protected characteristics may raise legal questions to check with HR or legal, and handles time zones."}
  - name: negative-no-details
    vars:
      organisation: "My company"
      audience: "Everyone"
    assert:
      - {type: llm-rubric, value: "Says the input is too thin to design a useful programme, asks focused questions about size, the problem to solve and mentor availability, and offers only a clearly labelled skeleton rather than inventing specifics."}
