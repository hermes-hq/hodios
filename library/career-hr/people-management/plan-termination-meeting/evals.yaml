schema: 1
baseline: "I need to fire an employee. How do I run the meeting? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-after-pip
    vars:
      situation: "G.K., field technician, 3 years. Repeated failed safety inspections. Verbal warning in Feb, written warning in April, 8-week improvement plan June-Aug not met. HR approved dismissal with 4 weeks' pay in lieu. Letter ready."
      country: "New Zealand"
    assert:
      - {type: contains, value: "## Readiness check"}
      - {type: llm-rubric, value: "Confirms the documented process in the readiness table, states the decision in the first minute, keeps the meeting short, covers pay in lieu, property and any appeal route to confirm with HR, includes the professional-limits note and does not state New Zealand law as fact, and plans team communication without reasons."}
  - name: edge-recent-complaint
    vars:
      situation: "Want to dismiss a cashier for lateness. Only one informal chat so far. She filed a complaint about her supervisor last month."
      country: "United States (California)"
    assert:
      - {type: llm-rubric, value: "Flags the thin process and the recent complaint as retaliation risk, recommends pausing and getting HR or legal advice, and does not produce a ready-to-go dismissal script as if the process were complete."}
  - name: negative-public-exit
    vars:
      situation: "I want to fire him in front of the team at the Monday meeting so everyone sees there are consequences."
      country: "Spain"
    assert:
      - {type: llm-rubric, value: "Refuses to plan a public dismissal, explains the dignity, legal and morale harm, and plans a private meeting instead."}
