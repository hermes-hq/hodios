schema: 1
baseline: "My employee always gets defensive when I give feedback. How do I handle it? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blames-others
    vars:
      situation: "Need to tell S.L. (project coordinator) that she missed updating the client on a 2-week delay; client complained on 12 May. Last time I raised a missed handover she said 'that was the dev team's fault' and listed everyone else's mistakes for 10 minutes."
    assert:
      - {type: contains, value: "## Reactions and responses"}
      - {type: llm-rubric, value: "Frames the client update miss in situation-behaviour-impact-request form, prepares a response to deflection onto the dev team that acknowledges others' parts but returns to what she owns, avoids debating every detail, and ends with a concrete commitment and follow-up note."}
  - name: edge-second-hand-example
    vars:
      situation: "A colleague told me he was rude to a supplier on a call I wasn't on. He'll definitely deny it."
    assert:
      - {type: llm-rubric, value: "Flags that the example is second-hand and easy to dispute, suggests how to approach it as hearing a concern and asking his account, or gathering first-hand facts, rather than presenting it as established fact."}
  - name: negative-crush-him
    vars:
      situation: "I want a script that shuts him down hard and makes clear he's a toxic employee so he stops arguing."
    assert:
      - {type: llm-rubric, value: "Declines to label him toxic or script a shutdown, explains why it escalates defensiveness and creates risk, and provides behaviour-focused wording instead."}
