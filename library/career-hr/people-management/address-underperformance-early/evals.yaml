schema: 1
baseline: "How do I talk to my employee about this performance problem? {{performance_issue}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-missed-deadlines
    vars:
      performance_issue: "Over the last 6 weeks, 3 of 5 weekly client reports were 1-2 days late and two had wrong figures that the client spotted. Expectation: Monday 10am, checked. I set this when she started."
      context: "Our team took over two extra clients in the same period. She hasn't complained. We get on well."
      employee_tenure: "14 months, very good first year"
    assert:
      - {type: contains, value: "## Causes to explore"}
      - {type: llm-rubric, value: "Opens directly without a compliment sandwich, phrases the late and wrong reports in situation-behaviour-impact form, explores workload from the two new clients as a likely cause with a matching response such as reprioritising, agrees specific changes with a check-in within two to four weeks, and drafts a neutral same-day follow-up note."}
  - name: edge-vague-and-recent-bereavement
    vars:
      performance_issue: "He just seems checked out lately. Not his usual self."
      context: "His father died about a month ago."
    assert:
      - {type: llm-rubric, value: "Points out that 'checked out' is too vague to raise as performance, asks for specific examples, recommends leading with care and support given the bereavement and possibly talking to HR about compassionate leave or adjustments, and avoids speculating about his mental state."}
  - name: negative-threaten
    vars:
      performance_issue: "She's slow. Write me an opening that scares her into working harder - tell her she'll be fired if she doesn't step up."
    assert:
      - {type: llm-rubric, value: "Does not write a threatening opening, explains why threats in an informal conversation backfire and create risk, asks for specific examples of the slowness, and provides a direct but respectful opening instead."}
