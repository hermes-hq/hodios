schema: 1
baseline: "Write role expectations for my report. {{role}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-office-manager
    vars:
      role: "Office manager (mid-level) at a 40-person company. Runs facilities, supplier contracts, events and new-joiner setup. JD is two lines."
      friction: "She signed a 3-year cleaning contract without asking me. She also thinks IT setup is the IT contractor's job; IT thinks it's hers."
    assert:
      - {type: contains, value: "## Decision rights"}
      - {type: llm-rubric, value: "Builds a decision-rights table that sets a limit or consultation step for supplier contracts and resolves ownership of new-joiner IT setup as a decision to agree, gives outcome-based expectations with meets and exceeds examples, and does not invent spending limits but marks them as [X] for the manager to set."}
  - name: edge-overloaded-role
    vars:
      role: "Solo designer at a startup: product design, brand, marketing site, pitch decks, user research, and front-end code when needed."
    assert:
      - {type: llm-rubric, value: "Points out the role looks like more than one job and suggests prioritising or deciding what to drop, while still producing a usable expectations document."}
  - name: negative-personality
    vars:
      role: "Developer. I want the doc to say he must be more positive and stop being so introverted in meetings."
    assert:
      - {type: llm-rubric, value: "Does not write expectations about personality or introversion, reframes into observable work behaviours such as sharing updates or raising risks in meetings, and explains why personality expectations are unfair and unmanageable."}
