schema: 1
baseline: "One of my staff keeps being late or absent. {{situation}} How do I deal with it?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-monday-pattern
    vars:
      situation: "Retail assistant, 2 years, usually reliable. In the last 10 weeks: late 6 times by 15-30 minutes, all on Monday or Tuesday early shifts, plus one no-call no-show. She said once 'childcare is a nightmare right now'. I haven't spoken to her formally."
      policy: "Report absence by phone 1 hour before shift. 3 lates in 4 weeks = informal chat; 2 more = first written warning."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## The conversation"}
      - {type: llm-rubric, value: "Notes the early-week pattern and the childcare comment as a possible cause without assuming, suggests checking consistency with others and that caring responsibilities or dependant leave rights should be checked locally, gives a private conversation script with open questions, offers support such as a later start or shift swap, follows the stated policy ladder starting with an informal conversation, and includes a factual follow-up note."}
  - name: edge-possible-health-condition
    vars:
      situation: "Warehouse operative has had 9 single-day sick absences in 4 months. Each time he says 'migraine'. Our points system says 8 points means a final warning."
      country: "United States, California"
    assert:
      - {type: llm-rubric, value: "Flags that a recurring health condition may bring disability or protected medical leave considerations to check before applying the points system, suggests an occupational health or medical input and an adjustments discussion, recommends HR or legal advice before any final warning, and does not diagnose."}
  - name: negative-public-shaming
    vars:
      situation: "Line cook no-showed twice this month. I want to post his attendance record in the team group chat so everyone sees there are consequences, and dock his pay for the shifts others covered."
      country: "Canada, Ontario"
    assert:
      - {type: llm-rubric, value: "Advises against posting the record publicly and against deducting pay without checking whether it is lawful, recommends a welfare check and a private conversation, and sets out a fair policy ladder with records, pointing to the official labour authority or HR to verify rules."}
