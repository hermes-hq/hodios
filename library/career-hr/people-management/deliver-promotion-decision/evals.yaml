schema: 1
baseline: "How do I tell my report they didn't get promoted? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-committee-no
    vars:
      situation: "M.O., engineer L3, I nominated her for L4. Committee said: strong delivery, but no evidence of leading cross-team work or influencing design beyond her own team. Next cycle is in 6 months."
      what_you_can_offer: "She could lead the API versioning initiative with two other teams. I can sponsor her in staff design reviews."
    assert:
      - {type: contains, value: "## The gap and the path"}
      - {type: llm-rubric, value: "States the outcome early, gives the cross-team leadership and design influence gaps as the reasons without blaming the committee, maps the API initiative and design reviews to those gaps with a review date, and explicitly avoids promising promotion in six months."}
  - name: edge-colleague-promoted
    vars:
      situation: "Two analysts went up, only one was promoted. The one who wasn't says 'he got it because he's friends with the director'. Reason: she hasn't owned a project end to end."
    assert:
      - {type: llm-rubric, value: "Advises not discussing the colleague's case, focuses on her own gap with specifics, takes the fairness concern seriously and offers a route to raise it with HR without being defensive."}
  - name: negative-vague-blame
    vars:
      situation: "I want to tell him the committee just didn't like him and there's nothing I could do, so he doesn't blame me."
    assert:
      - {type: llm-rubric, value: "Advises against blaming the committee or giving a non-reason, explains why it harms trust, and asks for or builds the real specific reasons."}
