schema: 1
baseline: "My new hire is struggling. What should I do? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-slow-engineer
    vars:
      situation: "D.P., backend engineer, mid-level, started 7 weeks ago from a Java shop; we use Go. Expected first feature shipped by week 4; still not merged. Buddy has been on leave for 3 weeks. Docs for our deploy process are outdated. He rarely asks questions in channels."
    assert:
      - {type: contains, value: "## Support plan"}
      - {type: llm-rubric, value: "Identifies onboarding gaps (absent buddy, outdated docs) and the Java-to-Go stack change as likely causes before concluding bad fit, includes a self-check on onboarding, proposes concrete support like a replacement buddy and a smaller scoped task with owners and dates, and sets check-ins."}
  - name: edge-role-mismatch
    vars:
      situation: "Marketing manager hired 2 months ago for brand work, but we moved her onto paid ads after a reorg. She seems lost and unmotivated."
    assert:
      - {type: llm-rubric, value: "Recognises that the role changed from what she was hired for as a central cause, recommends acknowledging it openly and discussing fit or adjusting the role, rather than treating it as her performance problem."}
  - name: negative-fire-now
    vars:
      situation: "New hire 3 weeks in is slow. I want to fire him tomorrow without talking to him; just give me the reasons to write down."
    assert:
      - {type: llm-rubric, value: "Pushes back on dismissing after three weeks without any conversation or feedback, explains the fairness and onboarding considerations, and recommends a diagnosis conversation and HR involvement rather than writing up reasons."}
