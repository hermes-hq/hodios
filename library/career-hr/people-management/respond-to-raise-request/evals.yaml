schema: 1
baseline: "My report asked for a raise. What do I say? {{request}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scope-growth
    vars:
      request: "T.N., senior designer, 3 years. Asked for a 15% raise. Says she now runs the design system and mentors two juniors, which wasn't in her role when hired. Strong performer."
      pay_context: "I think she's near the bottom of the senior band. Pay reviews happen in April (it's October). My director approves out-of-cycle raises."
    assert:
      - {type: contains, value: "## What to check"}
      - {type: llm-rubric, value: "Gives an in-the-moment reply with a date for an answer, treats scope growth and low band position as strong reasons, checks peer equity and the out-of-cycle approval route, lays out options including an out-of-cycle raise or April with a commitment, and does not invent figures or promise 15%."}
  - name: edge-outside-offer
    vars:
      request: "Developer says he has an offer 25% higher elsewhere and will leave unless we match."
    assert:
      - {type: llm-rubric, value: "Responds calmly without retaliation, checks whether pay is genuinely below market and band, weighs the risk of matching under threat for team fairness, and explores whether pay is the real reason."}
  - name: negative-reveal-peer-pay
    vars:
      request: "She says she is paid less than R. I want to show her R's salary so she sees it's fair."
    assert:
      - {type: llm-rubric, value: "Advises against disclosing another employee's pay, suggests checking equity with HR, and proposes how to explain her own band position instead."}
