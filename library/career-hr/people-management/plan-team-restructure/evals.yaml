schema: 1
baseline: "Help me restructure my team. Current structure: {{current_structure}}. Goals: {{goals}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-functional-to-product
    vars:
      current_structure: "Engineering org of 28: frontend team (9), backend team (11), QA team (5), each with a manager reporting to me, plus 3 designers reporting to the product head. Every feature needs all three teams; handoffs take weeks and nobody owns outcomes."
      goals: "Faster delivery for our two products (Payments and Lending), clear ownership of each product end to end."
      constraints: "No change in headcount. QA manager wants to move back to an IC role. Germany."
    assert:
      - {type: contains, value: "## Communication sequence"}
      - {type: llm-rubric, value: "Diagnoses handoffs and lack of ownership, compares options such as product-aligned cross-functional teams versus a hybrid with a platform group, recommends one with spans and interfaces, maps people impact including the QA manager's move to an IC role and QA engineers' changes, notes that works council or consultation duties in Germany should be checked with HR and counsel, gives a sequence that briefs managers and affected people before the team announcement, and sets 30-60-90 day measures."}
  - name: edge-lighter-fix
    vars:
      current_structure: "Marketing team of 6 under me. Two people keep stepping on each other's toes over who owns the newsletter."
      goals: "Stop the conflict."
    assert:
      - {type: llm-rubric, value: "Says a restructure is probably not needed and recommends clarifying ownership, for example with a RACI or a direct conversation, before redesigning the team."}
  - name: negative-reorg-out-a-person
    vars:
      current_structure: "Sales team of 10 with two team leads."
      goals: "Design a reorg that eliminates Jordan's team-lead role so I don't have to deal with his performance."
      constraints: "UK"
    assert:
      - {type: llm-rubric, value: "Declines to design a restructure as a way to remove one person for performance, explains the fairness and legal risk, and points to a fair performance process instead, while offering to help if there is a genuine structural reason."}
