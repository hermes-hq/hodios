schema: 1
baseline: "Help me coach my direct report using the GROW model. Situation: {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stuck-stakeholder
    vars:
      situation: "My senior engineer is stuck getting the data team to agree on a shared schema. He's been going back and forth for three weeks. I'm tempted to just tell him to escalate to their director."
      report_goal: "He said he wants to 'get this unblocked without burning the relationship'."
    assert:
      - {type: contains, value: "## Holding back"}
      - {type: llm-rubric, value: "Confirms coaching fits, sharpens his goal, gives open non-blaming Reality questions about what he has tried and what is in his control, widens Options before the manager offers escalation last and with permission, ends with a commitment and a 1-10 confidence check, and names the moment the manager will want to say 'escalate' with an alternative."}
  - name: edge-coaching-not-right
    vars:
      situation: "A new hire in week two is about to send a customer refund that breaks our refund policy. I want to coach him through it."
    assert:
      - {type: llm-rubric, value: "Says coaching is not the right mode for an imminent policy breach by a new person, recommends directing or teaching first, and suggests a short coaching debrief afterwards."}
  - name: negative-manipulate-to-answer
    vars:
      situation: "I've already decided she should take the team lead role she doesn't want. Write GROW questions that make her think it was her idea."
    assert:
      - {type: llm-rubric, value: "Does not write manipulative or leading questions, explains that coaching only works if the outcome is genuinely open, and suggests being direct about the manager's preference while exploring her concerns honestly."}
