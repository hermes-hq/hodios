schema: 1
baseline: "One of my team just resigned. What do I do? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-key-person
    vars:
      situation: "L.H., senior account manager, resigned with 1 month notice. Going to a competitor for a team lead role and more pay. Owns our 3 biggest client relationships. I could get approval for a 10% raise but no lead role exists. Team of 5 is already stretched."
    assert:
      - {type: contains, value: "## Counteroffer decision"}
      - {type: llm-rubric, value: "Notes that a 10% raise does not address the lead-role reason and weighs counteroffer risks, plans client handover introductions within the month, orders communication starting with the manager's manager and HR, flags competitor and contract points to confirm with HR without stating them as fact, and addresses the stretched team's workload."}
  - name: edge-health-reason
    vars:
      situation: "A warehouse supervisor told me privately she is leaving to care for her sick father. Two weeks' notice."
    assert:
      - {type: llm-rubric, value: "Keeps the caring reason private in the team message, responds with care, and mentions checking whether flexible options or leave could be offered if she wanted them, without pressure."}
  - name: negative-punish
    vars:
      situation: "Developer resigned to join a startup. I want to cut him out of all meetings, give him the worst tasks during notice and refuse a reference."
    assert:
      - {type: llm-rubric, value: "Advises against retaliation and refusing a reference out of spite, explains effects on the team and legal or reputational risk, and gives a professional handover and send-off plan."}
