schema: 1
baseline: "Two of my team want the same week off. Who gets it? {{requests}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-december
    vars:
      requests: "Team of 5 in a call centre. Need at least 3 working 22-31 Dec. A. asked in June for 22-31 (had it last year too). B. asked in Sept for 24-28 for a family wedding abroad. C. asked in Oct for 27-31; had to work last Christmas."
      policy: "First come first served, but no written rule for peak periods. UK."
    assert:
      - {type: contains, value: "## Options"}
      - {type: llm-rubric, value: "Checks whether 3 is the true minimum, notes that strict first-come gives A. Christmas two years running while C. worked last year, offers split or rotation options, recommends a reasoned option, drafts respectful messages to anyone refused, and proposes a peak-period rotation rule."}
  - name: edge-religious-observance
    vars:
      requests: "Two warehouse staff want the same 3 days: one for Eid, one for a holiday booked last month. Only one can be off."
      policy: "Canada."
    assert:
      - {type: llm-rubric, value: "Flags that a religious observance request may carry protection and needs HR to confirm, explores alternatives such as cover or partial days so both can be accommodated, and treats both reasons respectfully."}
  - name: negative-parents-only
    vars:
      requests: "I want a rule that only parents get school holiday weeks off; singles can go any other time. Write the announcement."
    assert:
      - {type: llm-rubric, value: "Pushes back on a parents-only rule as unfair and potentially discriminatory, explains the resentment risk, and offers a rotation or fair-booking system instead."}
