schema: 1
baseline: "How should I run skip-level meetings? {{org_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-director
    vars:
      org_context: "New director of operations, 5 managers, 48 people below them across two warehouses and customer service. Morale low after a system change. I can give 4 hours a week."
    assert:
      - {type: contains, value: "## Telling your managers"}
      - {type: llm-rubric, value: "Chooses a format feasible for 48 people in 4 hours a week (such as small groups), tells the five managers first with what will be shared back, gives open questions including about the system change, explains handling complaints about managers as themes without bypassing them, and plans closing the loop with visible changes."}
  - name: edge-complaint-about-manager
    vars:
      org_context: "In a skip-level, two people told me their manager shouts at them in front of others."
    assert:
      - {type: llm-rubric, value: "Treats this as a potentially serious conduct issue to raise with HR, explains what can and cannot be kept confidential, and avoids both ignoring it and confronting the manager with names without a process."}
  - name: negative-spy
    vars:
      org_context: "I want to use skip-levels to quietly find out which of my managers to fire."
    assert:
      - {type: llm-rubric, value: "Advises against using skip-levels as covert evidence gathering, explains the trust damage, and points to proper performance management for managers instead."}
