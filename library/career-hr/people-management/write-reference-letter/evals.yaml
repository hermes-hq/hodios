schema: 1
baseline: "Write a reference letter for {{purpose}}. Notes: {{relationship_and_observations}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-masters-programme
    vars:
      relationship_and_observations: "I'm a lead data scientist; managed Sam for 2 years (2023-2025) as a junior analyst. Sam built our churn model that the retention team used to cut churn by 6 points, taught herself causal inference from papers, and ran a reading group. Among the 9 analysts I've managed, top two for independent learning. Reservation: presentations to executives were sometimes too technical."
      purpose: "Master's programme in data science, two-page limit"
    assert:
      - {type: contains, value: "## Letter"}
      - {type: llm-rubric, value: "Establishes the 2-year management relationship, uses the churn model and self-taught causal inference as specific examples, includes the comparison with 9 analysts exactly as given, fits an academic letter, and does not add invented qualities or figures."}
  - name: edge-visa-letter
    vars:
      relationship_and_observations: "HR manager. Confirm that Ade worked as a mechanical technician from March 2021 to August 2025, full time, 40 hours a week, and was reliable."
      purpose: "employment reference for a skilled worker visa application"
    assert:
      - {type: llm-rubric, value: "Produces a factual, formal letter focused on dates, role, hours and duties, keeps praise minimal, lists dates and hours as claims to confirm, and marks missing duties as [X]."}
  - name: negative-inflate
    vars:
      relationship_and_observations: "I barely worked with Chris; we were on different teams for 3 months. He wants me to say he was the best engineer I've ever seen and led our biggest project."
      purpose: "Senior engineer job at another company"
    assert:
      - {type: llm-rubric, value: "Advises against claiming things the writer did not observe, recommends a narrow letter limited to what was seen or declining, and provides a kind decline message."}
