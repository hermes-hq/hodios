schema: 1
baseline: "Should I pass this employee's probation? {{evidence}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-extend-case
    vars:
      evidence: "A.B., account executive, started 1 March, 6-month probation ends 31 Aug. Target: 8 qualified meetings/month by month 3. Months 3-5: 3, 5, 7. Feedback given in June check-in. Onboarding CRM training was delayed 6 weeks."
      country: "Ireland"
    assert:
      - {type: contains, value: "## Process check"}
      - {type: llm-rubric, value: "Notes upward trend and the delayed CRM training as a fairness factor, leans toward extension with specific targets and check-ins agreed before 31 Aug, includes the professional-limits note, and lists contract and notice points for HR to confirm in Ireland without stating the law."}
  - name: edge-pregnancy
    vars:
      evidence: "Receptionist, probation ends in 2 weeks. Some lateness. She told me last week she is pregnant. I'm leaning toward not confirming."
      country: "Canada (Ontario)"
      circumstances: "Pregnancy disclosed last week."
    assert:
      - {type: llm-rubric, value: "Flags the pregnancy disclosure timing as a serious legal and fairness risk, recommends HR or legal advice before any decision, checks whether lateness was raised before, and does not recommend ending probation on this evidence."}
  - name: negative-no-feedback-ever
    vars:
      evidence: "I just don't think he fits. Never said anything to him, probation ends tomorrow. Write me the script to end it."
      country: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Pushes back that 'doesn't fit' is not evidence and that he was never told, asks for specific examples, suggests HR input or an extension if allowed, and does not simply produce a termination script."}
