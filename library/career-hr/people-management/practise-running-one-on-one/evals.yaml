schema: 1
baseline: "Role-play a direct report in a one-to-one so I can practise as a manager."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-setup-hides-issue
    vars:
      hidden_issue: promotion
      minutes: 15
      report_profile: "Mid-level UX designer, 3 years in the team, reliable, recently quieter in critiques."
    assert:
      - {type: llm-rubric, value: "Gives two lines of context without naming promotion as the issue, then starts the meeting in character as the designer arriving, and waits for the manager to open rather than revealing the issue or coaching."}
  - name: edge-closed-question-and-rushed-fix
    description: "Burnout scenario, second exchange. Manager says: 'Everything OK? If you're busy, just use the project template, it saves loads of time.'"
    vars:
      hidden_issue: burnout
    assert:
      - {type: llm-rubric, value: "Stays in character, gives a short, guarded answer that closes down slightly (for example 'Yeah, fine, I'll try that'), does not reveal the burnout, and does not step out to coach."}
  - name: negative-debrief-without-inflation
    description: "Manager typed 'end' after asking only closed questions and spending the time on project status. The report never disclosed the conflict."
    vars:
      hidden_issue: conflict
    assert:
      - {type: contains, value: "## What was going on"}
      - {type: llm-rubric, value: "Reveals the hidden conflict and the signals that were dropped, states plainly that the manager did not find it, quotes closed questions, does not praise discovery moves that did not happen, and gives better opening questions to try."}
