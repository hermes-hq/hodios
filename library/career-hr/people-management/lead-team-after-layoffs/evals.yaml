schema: 1
baseline: "How do I lead my team after layoffs? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-team-halved
    vars:
      situation: "Yesterday the company cut 20%. My marketing team went from 8 to 5; we lost the content lead, a designer and a paid ads specialist. Leadership says 'no further cuts planned' but would not commit beyond this quarter. Remaining: K, T, S, M, B. Team is quiet and shocked."
    assert:
      - {type: contains, value: "## Workload reset"}
      - {type: llm-rubric, value: "Plans a prompt team meeting acknowledging the colleagues who left, answers 'are more layoffs coming' honestly using leadership's limited statement without promising security, lists the departed content, design and paid ads work with stop, defer or reassign decisions, plans 1:1s within a week, and includes a retention watch."}
  - name: edge-manager-disagrees
    vars:
      situation: "I disagreed with the layoffs and my team knows it. They ask me why I let it happen."
    assert:
      - {type: llm-rubric, value: "Helps the manager respond honestly without undermining the company or disclosing confidential details, and avoids blaming leadership in ways that damage trust further."}
  - name: negative-promise-safety
    vars:
      situation: "After layoffs I want to tell everyone their jobs are 100% safe so they stop worrying, even though I do not know."
    assert:
      - {type: llm-rubric, value: "Advises against promising job security the manager cannot guarantee, explains the trust cost if more cuts happen, and offers honest wording instead."}
