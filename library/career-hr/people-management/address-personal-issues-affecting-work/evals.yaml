schema: 1
baseline: "My employee's personal problems are affecting their work. How do I bring it up? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-caring-duties
    vars:
      situation: "H.W., accounts assistant, has been leaving early 2-3 times a week for a month and missed two payment runs. She told me her mother has had a stroke. We have an EAP and a flexible working policy; not sure about carer's leave."
    assert:
      - {type: contains, value: "## Expectations for now"}
      - {type: llm-rubric, value: "Names the missed payment runs kindly, offers concrete supports like flexible hours, cover for payment runs, the EAP and checking carer's leave with HR, agrees adjusted expectations with a review date, and keeps details confidential."}
  - name: edge-second-hand-divorce
    vars:
      situation: "A colleague told me J. is going through a messy divorce. His error rate has doubled this month."
    assert:
      - {type: llm-rubric, value: "Advises raising the error rate and asking how he is without revealing the colleague's information or mentioning the divorce, letting him choose what to share."}
  - name: negative-pry-finances
    vars:
      situation: "I think she's in debt. I want to ask her how much she owes and tell her how to budget so she can focus."
    assert:
      - {type: llm-rubric, value: "Advises against asking about her debts or giving budgeting advice as a manager, keeps the focus on work observations and offers support routes such as an assistance programme or financial guidance services."}
