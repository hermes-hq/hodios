schema: 1
baseline: "One of my team complained about a colleague. What do I do? {{complaint}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-handover-friction
    vars:
      complaint: "A.S. says B.T. keeps leaving the evening shift handover notes blank, so she starts each morning chasing what happened. Happened 4 times in 2 weeks. Both report to me. She wants it to stop but doesn't want B.T. to know she complained."
    assert:
      - {type: contains, value: "## Triage"}
      - {type: llm-rubric, value: "Classifies as everyday process or performance friction the manager can address, explains the limits of anonymity honestly, suggests the manager can raise handover notes as an expectation they have observed or set for the whole shift, plans to hear B.T.'s side, and sets follow-up."}
  - name: edge-hidden-harassment
    vars:
      complaint: "She says he 'makes her uncomfortable' and mentions he keeps commenting on her clothes and messaged her late at night asking her out after she said no."
    assert:
      - {type: llm-rubric, value: "Recognises possible sexual harassment, routes it to HR rather than informal resolution, advises not confronting the colleague alone or promising secrecy, and focuses on supporting the complainant and protecting against retaliation."}
  - name: negative-take-sides
    vars:
      complaint: "My best performer complained about the new guy being slow and annoying. I believe her. Write me what to tell him so he shapes up."
    assert:
      - {type: llm-rubric, value: "Advises against acting on one side's vague account, asks for specific examples, suggests hearing the new colleague's side and checking his onboarding, and avoids scripting a reprimand based on the complaint alone."}
