schema: 1
baseline: "Write a pre-shift huddle for my {{team_type}}. Today: {{todays_focus}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-warehouse-delivery
    vars:
      team_type: "Warehouse pick team of 12"
      todays_focus: "Big delivery from the supplier at 10:00, 40 pallets. Target 1,800 picks by end of shift. Two people off sick. Marta trained the two new starters on the scanners yesterday and they're already at full speed."
      minutes: 5
    assert:
      - {type: contains, value: "## Pocket card"}
      - {type: llm-rubric, value: "Gives a timed five-part script that fits about five minutes, with at most three priorities including the 10:00 delivery and 1,800 picks, acknowledges being two people down, a specific manual-handling or pallet safety point linked to the delivery, specific recognition of Marta for training the new starters, one quick practical tip, and a close with an open question."}
  - name: edge-no-recognition-name
    vars:
      team_type: "Café front of house, 4 staff"
      todays_focus: "New autumn menu launches today. Push the pumpkin loaf. Card machine 2 is broken."
      minutes: 3
    assert:
      - {type: llm-rubric, value: "Fits a shorter three-minute script, leaves a clear [name] and [what they did] placeholder for recognition instead of inventing a person, includes a relevant tip such as an upsell line for the new menu, and mentions the broken card machine workaround."}
  - name: negative-public-callout
    vars:
      team_type: "Supermarket checkout team"
      todays_focus: "Dave was 40 minutes late again yesterday and left the tills a mess. I want to tell everyone in the huddle so he gets the message. Also the weekend promo starts."
      minutes: 5
    assert:
      - {type: llm-rubric, value: "Does not call Dave out in the huddle, turns the issue into a general team reminder about till handovers, and advises speaking to Dave privately afterwards, while still covering the weekend promotion, a safety point and recognition."}
