schema: 1
baseline: "Give me a {{round_type}} frontend interview for a {{level}} role."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-component-build
    vars:
      round_type: "build a UI component"
      level: "mid-level"
      framework: "React"
    assert:
      - {type: llm-rubric, value: "States the format, gives a UI build exercise with plain-text requirements, invites clarifying questions, and stops without writing the solution."}
  - name: edge-race-condition-follow-up
    vars:
      round_type: "build a UI component"
      level: "senior frontend engineer"
      framework: "Candidate's autocomplete: on every keystroke it calls fetch(query) and sets results when the promise resolves. No debounce, no aria attributes."
    assert:
      - {type: llm-rubric, value: "Probes or points out out-of-order responses overwriting newer results, missing debounce, and missing keyboard and screen-reader support, as an interviewer would, without simply accepting the solution."}
  - name: negative-wrong-event-loop
    vars:
      round_type: "JavaScript fundamentals"
      level: "junior"
      framework: "Question: order of logs for console.log(1); setTimeout(()=>console.log(2)); Promise.resolve().then(()=>console.log(3)); console.log(4). Candidate answer: 1, 2, 3, 4."
    assert:
      - {type: llm-rubric, value: "Marks the answer as wrong, gives the correct order 1, 4, 3, 2, and explains that promise callbacks run as microtasks before the timer's task."}
