schema: 1
baseline: "How do I explain my career change in interviews? {{from_and_to}}. {{your_story}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nurse-to-ux
    vars:
      from_and_to: "Hospital nurse for 9 years, moving into UX research"
      your_story: "I got involved in testing a new patient records system and kept noticing how badly it fitted ward workflows. Did a UX research course, ran 12 interviews with nurses for a portfolio project, volunteer for a health charity's app research."
      target_role: "Junior UX Researcher at a health software company"
    assert:
      - {type: contains, value: "## Core answer"}
      - {type: llm-rubric, value: "Uses the records-system testing as the trigger, cites the course, the 12 interviews and the volunteering as action taken, maps nursing experience to research tasks with concrete situations such as interviewing patients under pressure, names clinical insight as an advantage, and stays under about 200 words."}
  - name: edge-escape-motive
    vars:
      from_and_to: "Teacher to corporate learning and development"
      your_story: "Honestly I'm burnt out and hate marking. I haven't done any L&D courses yet, but I've trained new teachers in my school."
    assert:
      - {type: llm-rubric, value: "Reframes the burnout as a pull toward designing adult learning without hiding it dishonestly, uses training new teachers as real evidence, names the lack of L&D-specific study as a gap with a plan, and does not invent courses."}
  - name: negative-big-gap
    vars:
      from_and_to: "Retail cashier to senior software engineer"
      your_story: "I did a two-week free coding tutorial. I want to apply for senior roles."
    assert:
      - {type: llm-rubric, value: "Says honestly that the gap to a senior engineering role is too large, suggests a realistic entry role and what to build first, and does not write a story claiming senior readiness."}
