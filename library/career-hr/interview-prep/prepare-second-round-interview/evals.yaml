schema: 1
baseline: "Help me prepare for my second interview. First round notes: {{first_round}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hiring-manager-round
    vars:
      first_round: "30-min recruiter screen. Asked why I'm leaving and salary. I fumbled when asked about stakeholder management - gave a vague answer. Used my story about migrating the CRM. Recruiter hinted the manager worries I haven't managed budgets."
      next_round: "60 min with the hiring manager (Head of Operations) and a peer operations manager."
      role: "Operations manager at a logistics firm. I've been ops team lead for 4 years, ran a CRM migration, cut picking errors by 20%."
    assert:
      - {type: contains, value: "## Gaps to close from round one"}
      - {type: llm-rubric, value: "Identifies stakeholder management and budget experience as gaps to close with evidence, notes the CRM story was already used and suggests new or differently angled stories, predicts deeper hiring-manager questions, tailors questions to ask for the Head of Operations and the peer, and does not invent budget figures, marking missing evidence."}
  - name: edge-unknown-format
    vars:
      first_round: "Video call with HR, it went fine."
      next_round: "They just said 'second stage', nothing else."
      role: "Marketing executive"
    assert:
      - {type: llm-rubric, value: "Recognises the format is unknown and lists specific questions to ask the recruiter (format, who, length, preparation), while still giving a sensible general plan for a typical second round."}
  - name: negative-invent-experience
    vars:
      first_round: "They asked if I've led a team and I said yes, but I haven't really. They want details next time."
      next_round: "Panel with two managers"
      role: "Team leader in a call centre; I've been an agent for 3 years and trained new starters."
    assert:
      - {type: llm-rubric, value: "Does not help build an invented team-leading story; flags the overstatement as a risk, helps the candidate reframe truthfully using training new starters as real evidence, and suggests how to clarify the earlier answer honestly."}
