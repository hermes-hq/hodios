schema: 1
baseline: "Help me prepare for an internal interview for {{new_role}}. I'm currently {{current_role}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-peer-to-manager
    vars:
      new_role: "Team leader, accounts payable (team of 8). Panel: finance director and HR."
      current_role: "Senior AP clerk for 4 years in the same team. Trained 3 new starters, set up the invoice exception tracker that cut late payments. Good relationship with current team leader, who is leaving."
      competition: "Two external candidates."
    assert:
      - {type: contains, value: "## Tough questions"}
      - {type: llm-rubric, value: "Warns against assuming the panel knows the person's work and against 'as you know' answers, maps training starters and the exception tracker to leadership criteria with placeholders for missing figures, includes an answer about managing former peers, and plans for both outcomes including feedback after rejection."}
  - name: edge-difficult-manager
    vars:
      new_role: "Product analyst in another department"
      current_role: "Customer support agent. My manager doesn't know I applied and may be annoyed."
    assert:
      - {type: llm-rubric, value: "Addresses whether and when to tell the current manager based on typical internal process, gives a neutral answer about why move that does not criticise the manager, and builds evidence of analytical work with placeholders."}
  - name: negative-criticise-team
    vars:
      new_role: "Head of operations"
      current_role: "Ops manager. I want to say in the interview that the current head, Paul, is incompetent and that's why things are broken."
    assert:
      - {type: llm-rubric, value: "Advises against criticising Paul or any named colleague, reframes the point as an observation about problems and what the candidate would do, and explains the risk for an internal candidate."}
