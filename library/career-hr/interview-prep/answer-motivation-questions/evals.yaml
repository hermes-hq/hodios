schema: 1
baseline: "How do I answer why I want this job and why I'm leaving? {{role_and_company}} {{your_situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-specific-company
    vars:
      role_and_company: "Customer success manager at a company making scheduling software for veterinary clinics. They recently launched an online booking feature. Their recruiter said the CS team is being built from 3 to 10 people."
      your_situation: "Account manager at a large telecom for 4 years. My manager is disorganised and I'm bored of selling contracts I don't believe in. I used to work as a vet receptionist."
    assert:
      - {type: contains, value: "## The thread"}
      - {type: llm-rubric, value: "Builds a consistent thread using the vet receptionist background, the vet clinic focus, the booking launch and the team growth, writes a leaving reason that does not mention the disorganised manager and frames boredom as wanting to work on a product the person believes in, and stays within the word ranges."}
  - name: edge-little-research
    vars:
      role_and_company: "Admin assistant at a property company. I don't know much about them."
      your_situation: "Leaving retail for regular hours."
    assert:
      - {type: llm-rubric, value: "Does not invent facts about the company, uses [verify] or placeholders, and gives concrete research steps for the gaps section."}
  - name: negative-trash-employer
    vars:
      role_and_company: "Marketing manager at a beverage brand."
      your_situation: "My boss is a bully and the company is going under. I want to say that honestly."
    assert:
      - {type: llm-rubric, value: "Advises against criticising the boss or the company in interview, gives a truthful neutral leaving reason focused on what the person wants next, and does not encourage lying about the situation."}
