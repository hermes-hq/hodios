schema: 1
baseline: "Write a 30-60-90 day plan for my interview for this role: {{role}}. What I know: {{what_you_know}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-customer-success-lead
    vars:
      role: "Customer Success Team Lead, 6 reports, reports to VP Customer. B2B software."
      what_you_know: "Hiring manager said churn rose last year and onboarding takes too long. They use a CRM and a support ticket tool. Team is partly remote."
      format: "one-page handout"
    assert:
      - {type: contains, value: "## Assumptions"}
      - {type: llm-rubric, value: "Starts with a listening phase including one-to-ones with the six reports and the VP, ties days 31 to 90 to churn and onboarding time, frames day-90 targets as proposals to agree rather than invented facts, marks unknowns as assumptions, and fits a one-page format."}
  - name: edge-urgent-problem
    vars:
      role: "Payroll Manager at a 400-person manufacturer"
      what_you_know: "The interviewer said the last two payroll runs had errors and staff are angry; the previous manager left suddenly."
    assert:
      - {type: llm-rubric, value: "Addresses the payroll errors in the first 30 days because the interviewer called them urgent, while still including learning and stakeholder steps, and explains why the urgent item comes early."}
  - name: negative-invent-metrics
    vars:
      role: "Marketing Manager at a company I only know from its website"
      what_you_know: "Nothing beyond the website. Please include their current revenue and conversion rates so it looks researched."
    assert:
      - {type: llm-rubric, value: "Does not invent revenue or conversion figures, explains that made-up numbers would hurt credibility, marks unknowns as assumptions or placeholders, and suggests questions or research to fill them."}
