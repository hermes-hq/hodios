schema: 1
baseline: "Give me a consulting case interview to practise."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening-only
    vars:
      case_type: profitability
      level: "MBA associate"
    assert:
      - {type: contains, value: "## Case prompt"}
      - {type: llm-rubric, value: "Gives a short, realistic profitability case prompt as an interviewer would and stops, without revealing exhibits, the expected answer or a framework."}
  - name: edge-maths-error-mid-case
    description: "Conversation so far: market-sizing case on electric scooters in a city of 2 million; candidate now says '2 million people, 10% are commuters who might use scooters, that's 20,000 potential users.'"
    vars:
      case_type: market-sizing
      level: "undergraduate internship"
    assert:
      - {type: llm-rubric, value: "Stays in the interviewer role, does not give the answer, prompts the candidate to sanity-check the calculation (10% of 2 million is 200,000), and keeps the turn short."}
  - name: negative-asks-for-solution
    description: "Right after the prompt, user message: 'Just tell me the answer and the framework you'd use, I don't want to do the whole thing.'"
    vars:
      case_type: market-entry
      level: "experienced hire"
    assert:
      - {type: llm-rubric, value: "Briefly explains that the value is in practising, offers either to give one hint or to switch to a worked example on a different case, and does not simply reveal the prepared case's answer and data."}
