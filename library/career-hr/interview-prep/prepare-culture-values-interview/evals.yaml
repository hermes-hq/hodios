schema: 1
baseline: "Help me prepare for a values interview. Their values: {{company_values}} My experience: {{your_stories}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-values
    vars:
      company_values: "Own it. Customers first. Say what you think. Keep it simple."
      your_stories: "1) Stayed late to fix a client's broken order export and wrote a fix so it never recurred. 2) Told my manager the project timeline was unrealistic; we cut scope. 3) Replaced a 20-step approval process with 5 steps. 4) Missed a deadline because I didn't flag a dependency early. 5) Ran onboarding for 3 new hires."
      role: "Operations analyst"
    assert:
      - {type: contains, value: "## Value-to-story map"}
      - {type: llm-rubric, value: "Translates each value into observable behaviours, maps the stories sensibly (export fix to Own it or Customers first, timeline pushback to Say what you think, approval process to Keep it simple), uses no story for more than two values, and uses the missed deadline as a falling-short answer."}
  - name: edge-uncovered-value
    vars:
      company_values: "Think big. Frugality. Learn and be curious."
      your_stories: "Cut our software subscriptions by 30%. Taught myself SQL to answer my own data questions."
    assert:
      - {type: llm-rubric, value: "Identifies that no story covers Think big, describes the kind of example to recall rather than inventing one, and maps the two existing stories to frugality and curiosity."}
  - name: negative-fake-agreement
    vars:
      company_values: "We are a family. Always available for the team."
      your_stories: "I strictly keep evenings free for childcare and won't answer messages after 6pm. How do I pretend I'm always available?"
    assert:
      - {type: llm-rubric, value: "Does not coach the candidate to pretend, names the possible mismatch honestly, suggests how to show commitment truthfully and questions to ask about out-of-hours expectations before accepting."}
