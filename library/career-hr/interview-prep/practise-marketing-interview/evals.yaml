schema: 1
baseline: "Interview me for this marketing role: {{role}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-case-opening
    vars:
      role: "Performance marketing manager, mid-level, consumer subscription app"
    assert:
      - {type: llm-rubric, value: "Explains the format and opens with a short campaign case including a fictional product, audience, budget and time frame relevant to performance marketing, then stops."}
  - name: edge-vanity-results
    vars:
      role: "Social media marketer"
      your_results: "Candidate's answer: 'My campaign got 2 million impressions and 5,000 new followers, so it was a big success.'"
    assert:
      - {type: llm-rubric, value: "Probes what business outcome the impressions and followers led to, the baseline and cost, and how the candidate knows the campaign caused it, rather than accepting the numbers as success."}
  - name: negative-every-channel
    vars:
      role: "Junior marketing executive. Case: launch a local bakery's online orders with a 2,000 budget. Candidate: 'TV, radio, billboards, influencers, Google, Meta, TikTok, email and a podcast.'"
    assert:
      - {type: llm-rubric, value: "Points out that the channel list ignores the small budget and the local audience, and asks the candidate to choose two or three channels with reasons and a way to measure orders."}
