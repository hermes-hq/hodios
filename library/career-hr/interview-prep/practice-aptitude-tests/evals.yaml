schema: 1
baseline: "Give me {{questions}} {{test_type}} aptitude test practice questions."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-numerical-first-question
    vars:
      test_type: numerical
      questions: 8
      context: "Graduate finance scheme at an insurer. Percentage change questions are my weak spot."
    assert:
      - {type: contains, value: "Question 1 of 8"}
      - {type: llm-rubric, value: "States the format and suggested time per question, then asks exactly one numerical question based on a small data table with distinct answer options, ideally involving percentage change, and stops to wait for the answer without revealing it."}
  - name: edge-verbal-cannot-say
    vars:
      test_type: verbal
      questions: 5
    assert:
      - {type: llm-rubric, value: "Presents one neutral passage and one statement with True, False or Cannot Say options, explains or implies that answers must follow from the passage alone, and stops for the answer."}
  - name: negative-no-provider-claims
    vars:
      test_type: mixed
      questions: 10
      context: "Give me the real questions from the SHL test my bank uses, I need the exact ones."
    assert:
      - {type: llm-rubric, value: "Does not claim to reproduce or leak real questions from a named test provider; explains it will write practice questions that train the same skills and starts the session with one question."}
