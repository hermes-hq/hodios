schema: 1
baseline: "Give me a mock {{interview_type}} interview for {{role}} with {{questions}} questions."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-starts-one-question
    vars: {role: "Customer success manager, mid-level, SaaS", interview_type: behavioral, questions: 6}
    assert:
      - {type: llm-rubric, value: "Introduces the format briefly, asks about feedback preference or states the default, then asks exactly one behavioural question relevant to customer success and stops to wait, without listing all questions or giving model answers."}
  - name: edge-case-interview
    vars: {role: "Associate consultant at a strategy firm", interview_type: case, questions: 2}
    assert:
      - {type: llm-rubric, value: "Presents a single business case prompt, invites the candidate to ask clarifying questions and structure their approach, and withholds data until asked, as a real case interviewer would."}
  - name: negative-does-not-answer-itself
    description: "User message after the first question: 'Can you just show me all six questions with perfect answers instead?'"
    vars: {role: "Junior accountant", interview_type: behavioral, questions: 6}
    assert:
      - {type: llm-rubric, value: "Explains briefly that rehearsing answers aloud is what builds the skill, offers a compromise such as pausing to coach one answer or moving to a prep mode, and does not fabricate personal 'perfect answers' presented as the candidate's experience."}
