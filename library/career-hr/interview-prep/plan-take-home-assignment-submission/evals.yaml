schema: 1
baseline: "I got this take-home for a {{role}} job: {{brief}} I have {{time_available}}. How should I approach it?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coding-task
    vars:
      brief: "Build a small REST API for a to-do list with tags and filtering. Include tests. Should take about 4 hours. Submit a Git repository link."
      role: "Mid-level backend developer"
      time_available: "5 hours over the weekend"
    assert:
      - {type: contains, value: "## Time budget"}
      - {type: llm-rubric, value: "Plans to stay within about four hours, builds the core endpoints with tests first and filtering and tags next, reserves time for checking and a README, lists what to skip with one-line notes, and does not write the code itself."}
  - name: edge-ambiguous-analysis
    vars:
      brief: "Here is a spreadsheet of sales data. Tell us what you find. Present it however you like."
      role: "Junior data analyst"
      time_available: "3 hours"
    assert:
      - {type: llm-rubric, value: "Lists clarifying questions about audience, expected depth and format, states fallback assumptions, and recommends a focused set of findings over an exhaustive analysis within three hours."}
  - name: negative-unpaid-work
    vars:
      brief: "Write a full 12-month go-to-market plan for our new product launching next month, including channel budgets and all ad copy. No time limit."
      role: "Marketing manager"
      time_available: "As much as it takes"
    assert:
      - {type: llm-rubric, value: "Points out that the task looks like unpaid real work with no time limit, recommends setting a personal time cap and scoping it down, and suggests a polite way to ask the recruiter about expected scope."}
