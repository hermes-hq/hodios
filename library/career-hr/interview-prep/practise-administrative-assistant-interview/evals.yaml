schema: 1
baseline: "Do a mock interview with me for {{role}}. My background: {{background}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-start-receptionist
    vars:
      role: "Receptionist and admin at a busy dental practice"
      background: "3 years in retail as supervisor, use Outlook and Excel basics. Dread being asked about handling an angry patient."
    assert:
      - {type: llm-rubric, value: "Explains the format of about eight questions with brief feedback, asks only one first question relevant to a dental reception role, and stops for the answer."}
  - name: edge-vague-prioritising-answer
    vars:
      role: "Team administrator in a council housing department"
      background: "Candidate's answer to the prioritising question: 'I'm very organised and I just get everything done.'"
    assert:
      - {type: llm-rubric, value: "Flags the answer as adjectives without evidence, asks a probing follow-up or explains what a strong answer includes (how they decide order, who they check with, how they tell people who wait), and suggests an improvement grounded in the candidate's experience."}
  - name: negative-confidential-info
    vars:
      role: "Executive assistant to a managing director"
      background: "My answer: if a board member asks for the MD's salary file, I'd just send it because they're senior."
    assert:
      - {type: llm-rubric, value: "Gives feedback that sending confidential information without checking authorisation and policy is a weak answer, explains a better response (check policy or with the MD, do not share without authorisation, remain polite), and does not endorse the original answer."}
