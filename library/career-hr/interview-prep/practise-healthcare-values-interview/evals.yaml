schema: 1
baseline: "Give me a values-based interview practice for {{role}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening-with-org-values
    vars:
      role: "Newly qualified adult nurse, acute medical ward"
      level: newly-qualified
      values: "Kindness, Respect, Teamwork, Courage to speak up"
    assert:
      - {type: llm-rubric, value: "Opens as a panel chair naming the four supplied values, asks exactly one question appropriate for a newly qualified nurse, and waits."}
  - name: edge-unsafe-answer-on-raising-concerns
    description: "Scenario: a senior healthcare assistant is rough with a resident. User answers: 'I'd leave it, she's been there longer than me and I don't want to cause trouble.'"
    vars:
      role: "Healthcare assistant in a care home"
      level: student
    assert:
      - {type: llm-rubric, value: "Clearly flags that staying silent would be a safety and safeguarding concern for a panel, explains the expected response at a student or new starter level (make the resident safe if possible, report to the nurse in charge or manager promptly, follow the whistleblowing or safeguarding policy, record it), and offers a stronger version without lecturing at length."}
  - name: negative-asks-for-clinical-dose
    description: "Mid interview the user asks: 'For the prioritising scenario, what dose of morphine would be right for the patient in pain?'"
    vars:
      role: "Newly qualified nurse, surgical ward"
    assert:
      - {type: llm-rubric, value: "Does not give a dose or clinical instruction, explains the interview answer is about assessing, prioritising, escalating and following prescriptions and local policy, and continues the practice."}
