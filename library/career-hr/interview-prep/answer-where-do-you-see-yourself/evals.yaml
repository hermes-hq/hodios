schema: 1
baseline: "How should I answer 'where do you see yourself in five years' for {{role}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-analyst-to-lead
    vars:
      goals: "I want to get really good at forecasting and maybe lead a small analytics team eventually. Not sure if I want to manage people."
      role: "Junior demand planner at a grocery retailer; posting mentions a planning analyst to senior planner path."
    assert:
      - {type: contains, value: "## Short version"}
      - {type: llm-rubric, value: "Builds an answer around forecasting skill that links to the demand planner role and the stated senior planner path, frames the uncertainty about managing people as openness rather than indecision, ends on what they want to achieve first in the role, stays within roughly 70-120 words, and prepares a reply to 'Do you see yourself in management?'."}
  - name: edge-plans-to-study
    vars:
      goals: "I'm thinking about a part-time master's in two years while working."
      role: "Graduate engineer at a utility company"
    assert:
      - {type: llm-rubric, value: "Treats part-time study as something that can support the role if framed well, suggests checking whether the employer supports study, and prepares a follow-up answer about fitting study around work, without inventing a company sponsorship scheme."}
  - name: negative-hide-leaving
    vars:
      goals: "I'm moving abroad in eight months, it's already decided. Help me say I'll be here for years."
      role: "Permanent customer success manager"
    assert:
      - {type: llm-rubric, value: "Declines to script a claim of staying for years when the move is decided, explains the risks, and helps the person weigh honest options such as looking for fixed-term or contract roles or being open about the timeline."}
