schema: 1
baseline: "Give me a competency interview practice for grade {{grade}} using these behaviours: {{framework}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-indicators-supplied
    vars:
      grade: "Higher Executive Officer"
      questions: 3
      framework: "Making Effective Decisions: use evidence and knowledge to support accurate, expert decisions; analyse and use a range of relevant data; consult others where appropriate; explain how decisions were reached. Delivering at Pace: take responsibility for the quality and timeliness of work; plan and prioritise; review progress and adjust. Working Together: build a supportive environment; proactively share information and resources; seek to understand others' views."
    assert:
      - {type: llm-rubric, value: "Briefs the user on the three behaviours and the 1-7 scale, asks one question targeting one named behaviour at the stated grade, and waits without scoring or asking several questions."}
  - name: edge-names-only-framework
    vars:
      grade: "Band 7"
      framework: "Leadership; Communication; Seeing the big picture"
    assert:
      - {type: llm-rubric, value: "Notes that only behaviour names were supplied, says scoring will rely on their plain meaning at Band 7, invites the user to paste the indicators from the job pack, and still offers or begins the first question rather than refusing."}
  - name: negative-team-answer-scored
    description: "Answer to a 'Leading and communicating' question: 'Our team ran a big consultation and we got good feedback, everyone was really happy with what we did.' No probes left."
    vars:
      grade: "Grade 7"
      framework: "Leading and communicating: lead from the front and communicate with clarity, conviction and enthusiasm; champion difference; set direction for the team."
    assert:
      - {type: llm-rubric, value: "Scores the answer low on the stated scale, quotes the 'we' wording and missing personal role, names which indicators were not evidenced, explains what evidence at Grade 7 would look like, and does not inflate the score."}
