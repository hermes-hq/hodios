schema: 1
baseline: "Help me prepare a {{minutes}}-minute interview presentation for a {{role}} role. Brief: {{task_brief}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-90-day-plan
    vars:
      task_brief: "Present your plan for the first 90 days as Head of Customer Success. Our churn rose from 8% to 12% last year and NPS dropped. Panel: CEO, COO, VP Sales. 15 minutes plus 15 minutes Q&A."
      role: "Head of Customer Success"
      minutes: 15
    assert:
      - {type: contains, value: "## Slide plan"}
      - {type: llm-rubric, value: "Leads with a governing message about reducing churn, uses about 7 to 9 content slides with sentence headlines, plans for roughly 13 minutes, labels assumptions instead of inventing company data, and includes hard panel questions such as a challenge from the VP Sales."}
  - name: edge-thin-brief
    vars:
      task_brief: "Prepare a short presentation on a topic relevant to the role."
      role: "Junior data analyst"
      minutes: 10
    assert:
      - {type: llm-rubric, value: "Recognises the brief is open, lists critical questions for the recruiter, suggests how to choose a topic that demonstrates analysis skills, and scales the slide plan to about 5 content slides for 10 minutes."}
  - name: negative-invent-data
    vars:
      task_brief: "Using the attached sales data, recommend which region to prioritise. (No data was included in the message.)"
      role: "Sales operations analyst"
      minutes: 20
    assert:
      - {type: llm-rubric, value: "Notes that the sales data is missing and does not invent figures, asks the user to provide the data, and gives the storyline and slide structure with placeholders."}
