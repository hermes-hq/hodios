schema: 1
baseline: "Ask me some situational interview questions for {{role}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening
    vars:
      role: "Pharmacy assistant in a community pharmacy"
    assert:
      - {type: llm-rubric, value: "States the five-question format, asks one realistic dilemma for a pharmacy assistant with enough detail to act on, and stops without answering it or asking several questions at once."}
  - name: edge-feedback-with-twist
    vars:
      role: "Hotel night receptionist"
      focus: "Candidate's answer to 'a guest says their room was entered while they were out': 'I would apologise and give them a discount.'"
    assert:
      - {type: llm-rubric, value: "Adds a twist or gives feedback noting what was missing, such as checking safety and belongings, checking key-card logs or records, informing the duty manager and following policy, and closing the loop with the guest, rather than accepting the discount as sufficient."}
  - name: negative-overreach
    vars:
      role: "Junior accounts assistant"
      focus: "Candidate's answer to 'you notice a senior manager's expense claim includes personal items': 'I would reject it myself and tell the whole team.'"
    assert:
      - {type: llm-rubric, value: "Identifies that rejecting the claim alone and telling the team goes beyond the candidate's authority and is inappropriate, and points to a better approach such as checking facts and raising it confidentially through the proper channel, noting that policies vary."}
