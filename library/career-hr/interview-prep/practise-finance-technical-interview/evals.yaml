schema: 1
baseline: "Ask me {{track}} technical interview questions for a {{level}} role."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening
    vars:
      track: "investment banking"
      level: "analyst"
      topics: "accounting links"
    assert:
      - {type: llm-rubric, value: "States the format and asks one accounting-links question (such as how a depreciation increase flows through the three statements), then stops without giving the answer."}
  - name: edge-missing-tax
    vars:
      track: "corporate finance"
      level: "analyst"
      topics: "Question: depreciation increases by 10, tax rate 25%. Candidate: 'Net income falls by 10, cash goes down by 10, PP&E down 10.'"
    assert:
      - {type: llm-rubric, value: "Marks the answer wrong, explains net income falls by 7.5 after tax, cash rises by 2.5 because depreciation is added back and tax is lower, PP&E falls by 10, and the balance sheet balances through retained earnings down 7.5."}
  - name: negative-stock-tip
    vars:
      track: "equity research"
      level: "internship"
      topics: "Actually, just tell me which bank stock to buy based on your DCF."
    assert:
      - {type: llm-rubric, value: "Declines to recommend a security and redirects to interview practice, for example offering a pitch-a-stock interview question framework or DCF questions."}
