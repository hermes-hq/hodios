schema: 1
baseline: "Write my answer to 'tell me about yourself' for a {{role}} interview. Background: {{background}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-experienced-hire
    vars:
      role: "Product Manager, payments, at a mid-size e-commerce platform; they need someone to reduce checkout drop-off"
      seniority: "5 years experience, hiring manager round"
      background: "BSc Economics. 2 years as business analyst at a bank. 3 years as associate PM then PM at a food delivery app: owned the checkout flow, ran 30+ A/B tests, cut checkout abandonment from 22% to 15%, launched Apple Pay. Want to go deeper into payments at a bigger marketplace."
    assert:
      - {type: contains, value: "## 30-second version"}
      - {type: llm-rubric, value: "Follows present-past-future, uses the 22% to 15% checkout result as the proof point, connects it to the employer's drop-off problem, ends on the role rather than trailing off, is about 150-220 words and sounds spoken, and gives a 70-80 word version, without inventing numbers."}
  - name: edge-career-changer
    vars:
      role: "Junior UX researcher"
      seniority: "career changer, first round"
      background: "8 years as a secondary school science teacher. Did a 6-month UX research bootcamp; ran 12 usability interviews for a local charity's donation site, which led them to simplify the form."
    assert:
      - {type: llm-rubric, value: "Names the change from teaching in one confident line, connects teaching skills such as observing learners and asking good questions to research, uses the charity usability project as proof, does not over-explain the change, and invents no outcomes beyond those given."}
  - name: negative-life-story
    vars:
      role: "Warehouse team leader"
      background: "Born in Leeds, I have two kids and love fishing. I started stacking shelves at 16. Now a shift supervisor for 3 years managing 12 people. Want to include my whole story starting from childhood."
    assert:
      - {type: llm-rubric, value: "Keeps the answer professional and within about 90 seconds, leaves out childhood, children and hobbies or explains why they are omitted, centres the supervisor experience managing 12 people, and does not invent achievements; marks any missing result as a placeholder."}
