schema: 1
baseline: "Give me a {{platform}} developer interview for a {{level}} role."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-android-opening
    vars:
      platform: "Android with Kotlin and Jetpack Compose"
      level: "mid-level"
      round_type: "platform knowledge"
    assert:
      - {type: llm-rubric, value: "States the format and asks one Android platform question at a mid level, such as about lifecycle, configuration changes or coroutines, then stops without answering it."}
  - name: edge-system-design
    vars:
      platform: "iOS with Swift"
      level: "senior mobile engineer"
      round_type: "Candidate's chat app design: 'Messages are fetched from the server every time the screen opens; if there's no network, show an error.'"
    assert:
      - {type: llm-rubric, value: "Probes offline behaviour, local persistence and sync, sending messages without network, and push notifications, rather than accepting the network-only design."}
  - name: negative-main-thread
    vars:
      platform: "Android with Kotlin"
      level: "junior"
      round_type: "Candidate's answer: 'I'd load the 5 MB JSON from the network on the main thread so the UI updates straight away.'"
    assert:
      - {type: llm-rubric, value: "Marks the approach as wrong, explains that network work on the main thread blocks the UI and is disallowed on Android, and points to background work such as coroutines with a suitable dispatcher while updating state on the main thread."}
