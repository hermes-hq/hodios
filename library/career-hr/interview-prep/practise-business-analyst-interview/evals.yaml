schema: 1
baseline: "Interview me for a business analyst role: {{role}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-elicitation-opening
    vars:
      role: "Business analyst at an insurance company, mid-level"
    assert:
      - {type: llm-rubric, value: "Explains the format and opens an elicitation role-play in character as an insurance stakeholder asking for a specific solution, then stops for the candidate's questions."}
  - name: edge-acceptance-criteria
    vars:
      role: "Junior BA, retail e-commerce"
      focus: "Candidate's user story: 'As a user I want a better checkout so that it's better.' Acceptance criteria: 'Checkout works well.'"
    assert:
      - {type: llm-rubric, value: "Points out the story has no specific user, need or benefit and the acceptance criteria are not testable, and shows an improved story with testable criteria including an edge case."}
  - name: negative-accepts-solution
    vars:
      role: "BA for a hospital trust"
      focus: "Elicitation so far: stakeholder said 'We need a new dashboard.' Candidate: 'Great, which charts and colours would you like?'"
    assert:
      - {type: llm-rubric, value: "Flags that the candidate accepted the requested solution without exploring the underlying problem, users, current process and success measures, and suggests better opening questions."}
