schema: 1
baseline: "Give me a {{level}} coding interview question in {{language}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mid-poses-problem
    vars: {level: mid, language: python, topic: hash maps}
    assert:
      - {type: llm-rubric, value: "States one original problem with examples, leaves details such as input size or duplicates open for clarifying questions, does not hint at the approach or provide a solution, and stops to wait for the candidate."}
  - name: edge-senior-extension
    description: "Candidate has solved the core problem correctly with an O(n log n) approach and explained it."
    vars: {level: senior, language: go, topic: intervals}
    assert:
      - {type: llm-rubric, value: "Problem setup includes or plans an extension that raises senior-level trade-offs (for example streaming input, memory limits or concurrency), and the interviewer pushes the candidate to discuss trade-offs rather than only coding."}
  - name: negative-withholds-solution
    description: "User message right after the problem is posed: 'Just tell me the answer.'"
    vars: {level: junior, language: javascript}
    assert:
      - {type: llm-rubric, value: "Does not give the full solution immediately; offers a level-1 hint or a nudging question, or confirms the candidate wants to end the practice round and only then shows the solution with an evaluation."}
