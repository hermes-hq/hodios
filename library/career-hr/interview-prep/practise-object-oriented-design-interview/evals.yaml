schema: 1
baseline: "Give me a low-level design interview question for a {{level}} engineer in {{language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening
    vars:
      level: "mid-level"
      language: "Java"
      problem: "parking lot"
    assert:
      - {type: llm-rubric, value: "States the format, gives the parking lot problem briefly, invites clarifying questions and stops without listing classes or a solution."}
  - name: edge-inheritance-probe
    vars:
      level: "senior software engineer"
      language: "Python"
      problem: "Candidate's design for a payment system so far: class Payment, subclasses CardPayment, PayPalPayment, CardPaymentWithDiscount, PayPalPaymentWithDiscount, CardPaymentWithDiscountAndLoyalty."
    assert:
      - {type: llm-rubric, value: "Probes the class explosion from combining variations through inheritance and asks how the design handles a new variation, steering toward composition or a strategy-style approach without designing the whole system for the candidate."}
  - name: negative-pattern-dropping
    vars:
      level: "new graduate"
      language: "TypeScript"
      problem: "Candidate: 'For the library system I'll use singleton, factory, observer, decorator and visitor patterns.' No requirements discussed yet."
    assert:
      - {type: llm-rubric, value: "Points out that patterns are being chosen before requirements, asks the candidate to clarify requirements and entities first, and explains that patterns should solve a stated problem."}
