schema: 1
baseline: "Give me a product manager {{question_type}} interview question for a {{level}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-metric-drop-opening
    vars:
      question_type: "diagnose a metric drop"
      level: "senior PM"
      product_area: "a food delivery app"
    assert:
      - {type: llm-rubric, value: "States the format, presents a specific metric drop for a food delivery app, and stops for the candidate to clarify without revealing the cause."}
  - name: edge-data-cut
    vars:
      question_type: "diagnose a metric drop"
      level: "PM"
      product_area: "Scenario so far: daily orders down 10% week on week. Candidate: 'Can I see the drop split by iOS, Android and web?'"
    assert:
      - {type: llm-rubric, value: "Gives realistic invented numbers for the requested platform split only, keeps them consistent with a 10% overall drop, and waits for the candidate's next step."}
  - name: negative-no-goal
    vars:
      question_type: "define success metrics"
      level: "associate PM"
      product_area: "Question: success metrics for a new saved-recipes feature. Candidate answer: 'DAU, MAU, retention, NPS, revenue, clicks, time spent.'"
    assert:
      - {type: llm-rubric, value: "Points out the answer lists metrics without stating the feature's goal or choosing a primary metric, and asks for a goal, a primary metric and guardrails rather than accepting the list."}
