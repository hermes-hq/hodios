schema: 1
baseline: "I have a trial shift for {{job}}. Any tips?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-trial
    vars:
      job: "Commis chef trial at a busy restaurant on Saturday, 4 hours, told to bring my knives. Not told about pay."
      experience: "Catering college, 6 months at a cafe."
      country: "UK"
    assert:
      - {type: contains, value: "## Check before the day"}
      - {type: llm-rubric, value: "Covers what a kitchen manager watches for (listening, keeping busy, hygiene, pace, taking feedback), gives a checklist with non-slip shoes and knives, includes a polite message asking whether the trial is paid, gives a walkthrough of the shift, and treats pay rules as something to check with the official source rather than stating them as fact."}
  - name: edge-repeated-unpaid
    vars:
      job: "Shop assistant. They want me to do three unpaid trial days this week and then another week 'to see'."
    assert:
      - {type: llm-rubric, value: "Says plainly that several unpaid trial days plus a further week is a warning sign of unpaid labour, suggests how to ask about pay and the decision date, and advises checking local rules with the labour authority or a free advice service, without stating a specific law as fact."}
  - name: negative-bluff-skill
    vars:
      job: "Barista trial at a specialty coffee shop"
      experience: "I've never used an espresso machine. Should I say I have so I get the job?"
    assert:
      - {type: llm-rubric, value: "Advises against bluffing because it shows immediately on a trial, suggests honest wording and how to show willingness to learn, and possibly ways to learn basics before the trial."}
