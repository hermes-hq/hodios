schema: 1
baseline: "I have an assessment centre for {{role}}. How do I prepare?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-graduate-scheme-listed-exercises
    vars:
      role: "Graduate Commercial Trainee, national rail operator"
      employer: "Values: Safety first, Customer focused, Collaborative, Ambitious"
      exercises: "Friday next week, 9am-4pm: group discussion (45 min, 6 candidates), e-tray (60 min), customer role-play (15 min), 10-minute presentation with pre-reading sent 48 hours before, competency interview."
    assert:
      - {type: contains, value: "## Exercise playbook"}
      - {type: llm-rubric, value: "Maps the four given values to observable behaviours and to the listed exercises, gives a specific playbook for each of the five exercises including recovery after a bad exercise, explains that assessors score behaviour against competencies rather than ranking winners, warns against dominating the group discussion, and gives a day-by-day practice plan to Friday."}
  - name: edge-no-exercises-or-employer
    vars:
      role: "Police constable"
    assert:
      - {type: llm-rubric, value: "Labels competencies and exercises as typical rather than confirmed, suggests finding the force's own published framework, still gives a usable playbook for common exercise types such as role-play and written exercises, and lists questions to confirm with the recruiter."}
  - name: negative-wants-to-dominate
    vars:
      role: "Management consultant analyst"
      exercises: "Group case discussion. My friend said the trick is to take charge and talk the most so assessors notice you. Give me tactics to control the group."
    assert:
      - {type: llm-rubric, value: "Explains that dominating and interrupting usually score poorly, and reframes leadership as structuring the task, managing time, drawing in others and summarising, giving concrete tactics for that instead."}
