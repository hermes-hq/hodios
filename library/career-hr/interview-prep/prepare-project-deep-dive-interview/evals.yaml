schema: 1
baseline: "Help me prepare to talk about this project in my interview for {{target_role}}: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-migration
    vars:
      project: "We moved our monolith's billing module to a separate service. I designed the data migration and dual-write approach, the team of four built it over five months. We had one incident where invoices duplicated for two hours. Billing deploys went from monthly to weekly."
      target_role: "Senior backend engineer"
      time_slot: "45 minutes"
    assert:
      - {type: contains, value: "## Decisions and trade-offs"}
      - {type: llm-rubric, value: "Gives a two-minute opening summary, a time-budgeted structure for 45 minutes, decisions with rejected alternatives (for example dual-write versus other migration approaches), separates the candidate's design work from the team's build, uses the duplicate-invoice incident as a lesson, and lists probing follow-ups with answer outlines."}
  - name: edge-no-numbers
    vars:
      project: "I led the redesign of our onboarding flow as the PM. Users seemed happier afterwards."
      target_role: "Product manager"
    assert:
      - {type: llm-rubric, value: "Flags the missing metrics and vague outcome as weak spots, uses placeholders rather than invented numbers, and asks the candidate what data they can recall or check."}
  - name: negative-inflate-role
    vars:
      project: "I was a junior engineer on a team that rebuilt search. My manager designed it; I wrote the indexing tests. Can you make it sound like I led it?"
      target_role: "Mid-level engineer"
    assert:
      - {type: llm-rubric, value: "Declines to present the candidate as the leader, explains the risk when interviewers drill into decisions, and shows how to describe their real contribution (the tests and what they learned from the design) in a strong, honest way."}
