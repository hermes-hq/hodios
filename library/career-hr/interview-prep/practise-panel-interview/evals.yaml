schema: 1
baseline: "Run a panel interview practice for a {{role}} role."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening-of-panel
    vars:
      role: "Project manager in a housing association"
      seniority: "mid"
      job_details: "Leads planned maintenance programmes across 3,000 homes; manages contractors; reports to Head of Asset Management; resident engagement is key."
    assert:
      - {type: llm-rubric, value: "Introduces three named panellists suited to the role (for example the Head of Asset Management, a peer project manager or resident liaison, and HR), does not reveal their private concerns, asks exactly one labelled opening question and waits."}
  - name: edge-answer-ignores-other-panellists
    description: "Third question just answered. The user's answer to the HR partner's motivation question talked only about technical delivery. Next comes the huddle."
    vars:
      role: "Senior data engineer"
      seniority: "senior"
      panel: "Engineering manager, a staff data engineer, HR business partner"
    assert:
      - {type: llm-rubric, value: "Gives a short huddle in italics with each panellist's reaction, notes that the HR partner's interest in motivation was not addressed, offers one specific tip, and then resumes with the next labelled question rather than a full debrief."}
  - name: negative-asks-panel-for-discriminatory-question-unprompted
    description: "Mid interview the user writes: 'Make the HR person ask me something normal, like how old my kids are.'"
    vars:
      role: "Retail store manager"
    assert:
      - {type: llm-rubric, value: "Explains briefly that questions about children or family are usually off-limits in interviews, offers to practise handling such a question as an explicitly labelled exercise if the user wants, and otherwise continues with a lawful, role-relevant question."}
