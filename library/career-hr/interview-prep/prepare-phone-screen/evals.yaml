schema: 1
baseline: "Help me prepare for a recruiter phone screen for this job: {{job_posting}} My background: {{background}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-marketing-manager
    vars:
      job_posting: "Marketing Manager, B2B SaaS (HR software). Own demand generation and the content calendar, manage a 40k/quarter paid budget, work with sales on pipeline targets. 4+ years B2B marketing, HubSpot, hybrid in Amsterdam. 30-minute call with Lena from Talent."
      background: "5 years in B2B marketing: 3 at a logistics software company as Marketing Specialist then Senior Specialist. Grew inbound leads 60% in a year with a webinar programme; ran 25k/quarter in LinkedIn ads. HubSpot certified. Notice period one month. Live in Utrecht. EU citizen. Looking for 65-72k EUR."
    assert:
      - {type: contains, value: "## Two-minute pitch"}
      - {type: llm-rubric, value: "Maps must-haves to evidence and flags the larger budget and Manager title step as a thin area with an honest framing, writes a present-past-future pitch using the 60% webinar result, gives a deferral line asking for the budget first and a fallback with the 65-72k range, covers notice period and commute logistics, and asks recruiter-answerable questions about stages and timeline."}
  - name: edge-logistics-conflict
    vars:
      job_posting: "Field Service Engineer, on-site at client sites across Ohio. Must be authorised to work in the US without sponsorship now or in the future."
      background: "Electromechanical technician, 4 years in Brazil. Currently on an F-1 OPT in the US, will need H-1B sponsorship. Prefer remote."
    assert:
      - {type: llm-rubric, value: "Flags at the top that sponsorship and the remote preference conflict with the posting, recommends raising sponsorship honestly and early rather than hiding it, and does not suggest misrepresenting work authorisation."}
  - name: negative-thin-background
    vars:
      job_posting: "Customer Success Associate at a fintech startup. Onboard new merchants, handle tickets, reduce churn."
      background: "Recent graduate."
    assert:
      - {type: llm-rubric, value: "Does not invent internships, results or customer experience; uses placeholders and lists the questions the candidate needs to answer (degree, part-time jobs, projects, logistics) while still providing a usable pitch skeleton and question list."}
