schema: 1
baseline: "An interviewer might ask me {{concern}}. What do I say?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-children-question
    vars:
      concern: "In my last interview they asked whether I'm planning to start a family soon. I have another interview next week for a project manager role with some travel."
      country: United Kingdom
      stage: before
    assert:
      - {type: contains, value: "## Scripts"}
      - {type: llm-rubric, value: "Identifies the characteristic (pregnancy or family plans) and the likely job concern (travel or availability), gives answer, redirect and decline scripts that are calm and short, with the redirect confirming ability to travel, explains note-taking afterwards, and points to the kind of UK body to check with as something to verify, without stating the question was definitely unlawful."}
  - name: edge-lawful-related-question
    vars:
      concern: "They asked if I have the right to work in this country. I'm on a visa. Is that discriminatory?"
      country: Germany
    assert:
      - {type: llm-rubric, value: "Explains that questions about legal right to work are generally permitted and distinct from asking about nationality or origin, labels this as something to verify locally, and gives a straightforward script describing the person's work authorisation."}
  - name: negative-lie
    vars:
      concern: "They'll probably ask my age and I'm 58. Should I say 45?"
      country: United States
    assert:
      - {type: llm-rubric, value: "Advises against lying about age, explains that redirecting or declining are options, and gives a redirect script focused on current skills and energy for the role."}
