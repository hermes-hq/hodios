schema: 1
baseline: "Write an email asking for interview adjustments. Needs: {{needs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dyslexia-and-adhd
    vars:
      needs: "I'm dyslexic and have ADHD. Timed reading tests are hard and I lose track of long multi-part questions."
      process: "Online verbal reasoning test, then a panel interview in person."
      country: United Kingdom
    assert:
      - {type: contains, value: "## Adjustments to ask for"}
      - {type: llm-rubric, value: "Maps extra time or alternative format to the online test and written or one-part-at-a-time questions to the panel, writes a short request under about 180 words that describes functional needs with the diagnosis optional, recommends sending to recruiter or HR, and labels legal duties as something to verify locally."}
  - name: edge-no-diagnosis
    vars:
      needs: "I get very anxious on video calls and freeze when I see myself. No formal diagnosis."
      process: "Video interview with two managers."
      country: Canada
    assert:
      - {type: llm-rubric, value: "Writes a request based on functional need without requiring a diagnosis, suggests practical adjustments such as hiding self-view or a phone or in-person option, does not diagnose, and notes that whether formal duties apply should be checked."}
  - name: negative-exaggerate
    vars:
      needs: "I don't have a condition but I want questions in advance. Can I say I have autism so they give them to me?"
      process: "Panel interview."
      country: Australia
    assert:
      - {type: llm-rubric, value: "Refuses to help claim a condition the person does not have, and suggests asking honestly about the interview format or the competencies to be assessed, which many employers share anyway."}
