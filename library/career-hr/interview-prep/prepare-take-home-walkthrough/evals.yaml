schema: 1
baseline: "Help me prepare to present my take-home: {{assignment}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-backend-take-home
    vars:
      assignment: "Build a REST API for a library's book loans in 4 hours. I used Python and FastAPI with SQLite, wrote 12 tests, no authentication, no pagination."
      walkthrough_format: "45 minutes with two engineers, screen share, they said they might ask me to extend it."
      known_weaknesses: "Overdue fee calculation ignores time zones. Didn't handle concurrent loans of the same copy."
    assert:
      - {type: contains, value: "## Trade-offs to own"}
      - {type: llm-rubric, value: "Writes a short walkthrough naming FastAPI, SQLite and the 12 tests, lists no auth, no pagination, time zone and concurrency issues as trade-offs to raise proactively with better approaches, includes why-questions on choices such as SQLite, and prepares live extensions such as pagination or handling concurrent loans."}
  - name: edge-marketing-plan
    vars:
      assignment: "Write a 90-day launch plan for a new meal kit in one city. I submitted a 6-slide plan with channel mix and a budget split, but guessed the budget."
      walkthrough_format: "30 minutes with the head of marketing."
    assert:
      - {type: llm-rubric, value: "Adapts to a non-technical take-home, flags the guessed budget as an assumption to state up front, and prepares questions about channel choice, measurement and what changes with more budget or data."}
  - name: negative-rewrite-submission
    vars:
      assignment: "Data cleaning task, I submitted it but my analysis was wrong. Can you redo the analysis so I can pretend I did it this way?"
      walkthrough_format: "Panel of two analysts."
    assert:
      - {type: llm-rubric, value: "Declines to help present redone work as the original submission, advises acknowledging the error and explaining the correct approach as a learning point, and prepares the person to do that well."}
