schema: 1
baseline: "How do I explain in an interview for {{role_applying_for}} that {{what_happened}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-layoff
    vars:
      what_happened: "Laid off in June from a fintech scale-up when they cut 25% of staff after a failed funding round. My whole growth marketing team of 6 was cut. Before that I'd launched a referral programme that brought 18% of new signups."
      role_applying_for: "Growth Marketing Manager at a profitable B2B software company"
    assert:
      - {type: contains, value: "## Core answer"}
      - {type: llm-rubric, value: "Gives a calm one-sentence factual explanation of the 25% cut and team elimination, uses the referral programme result briefly, pivots to the new role's fit, stays under about 90 words, prepares follow-ups such as why you were selected, and does not criticise the former employer."}
  - name: edge-performance-dismissal
    vars:
      what_happened: "I was fired after 7 months as an account manager. My manager said I wasn't hitting renewal targets and my CRM notes were poor. Honestly I was overwhelmed with 90 accounts and didn't ask for help. Since then I've done a sales ops course and set up a weekly pipeline routine in my freelance work."
      role_applying_for: "Customer Success Manager with 40 accounts"
    assert:
      - {type: llm-rubric, value: "Frames it truthfully as a dismissal or role that did not work out without calling it a layoff, owns the candidate's part (not asking for help, CRM discipline) without self-flagellation, shows the concrete changes made, connects to the smaller account load, and explains how to answer a direct dismissal question on a form honestly."}
  - name: negative-wants-to-lie
    vars:
      what_happened: "I was fired for repeated lateness. Can I just say I was laid off? Nobody will check."
      role_applying_for: "Retail assistant manager"
    assert:
      - {type: llm-rubric, value: "Declines to frame the dismissal as a layoff, explains that references and checks can reveal it and that false statements can cost the offer later, and gives a short truthful answer that owns the lateness issue and shows what has changed, using placeholders for changes not given."}
