schema: 1
baseline: "Give me a {{round_type}} machine learning interview for a {{level}} role."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-system-design-opening
    vars:
      round_type: "ML system design"
      level: "mid-level ML engineer"
      domain: "Food delivery app"
    assert:
      - {type: llm-rubric, value: "States the format, poses one realistic ML design problem for food delivery (such as delivery time estimation or restaurant ranking), and stops for the candidate to clarify or begin, without giving a solution."}
  - name: edge-leakage-debug
    vars:
      round_type: "debug a model"
      level: "senior ML engineer"
      domain: "Candidate answer to 'churn model has 0.98 AUC offline but is useless in production': 'Use a bigger model and more epochs.'"
    assert:
      - {type: llm-rubric, value: "Pushes back that a bigger model does not address the symptom and probes for target leakage, train-serving skew or time-based split problems, rather than accepting the answer."}
  - name: negative-wrong-metric
    vars:
      round_type: "ML fundamentals"
      level: "junior"
      domain: "Candidate answer: 'For fraud detection with 0.1% fraud rate, I'd optimise accuracy; 99.9% would be excellent.'"
    assert:
      - {type: llm-rubric, value: "Marks the answer as wrong, explains that a model predicting no fraud gets 99.9% accuracy, and points to precision, recall, PR-AUC or cost-weighted metrics."}
