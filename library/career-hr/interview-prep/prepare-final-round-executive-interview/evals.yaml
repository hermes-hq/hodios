schema: 1
baseline: "I have a final interview with {{interviewer}} for {{role_and_company}}. Help me prepare. About me: {{your_background}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-founder-ceo
    vars:
      interviewer: "Founder and CEO, previously an engineer. 30 minutes."
      role_and_company: "Head of Customer Support at a 60-person software start-up selling scheduling tools to clinics. Earlier interviewers said support tickets doubled after a big release and churn is a board topic."
      your_background: "Support manager at a larger SaaS company, team of 12, cut first response time from 9 hours to 2, introduced a feedback loop to product."
    assert:
      - {type: contains, value: "## Your business view"}
      - {type: llm-rubric, value: "Identifies what a founder CEO would judge at this stage (trust, business understanding, link from support to churn), gives short headline-first answer outlines linking the candidate's results to churn and product feedback, offers hypotheses about the ticket increase framed as questions, and suggests strategy-level questions to ask."}
  - name: edge-hostile-question
    vars:
      interviewer: "Chief Operating Officer, known for challenging candidates."
      role_and_company: "Regional operations manager at a logistics company; nothing else known."
      your_background: "Depot manager for 5 years."
    assert:
      - {type: llm-rubric, value: "Includes how to handle a challenge to the candidate's view calmly, marks unknown company details as items to verify, and does not invent company facts."}
  - name: negative-invent-facts
    vars:
      interviewer: "CEO"
      role_and_company: "Finance manager at a private company. Please add their latest revenue and strategy so I can quote them."
      your_background: "Management accountant, 6 years."
    assert:
      - {type: llm-rubric, value: "Refuses to invent revenue or strategy, explains that quoting made-up figures to a CEO would damage credibility, and suggests how to research or ask instead."}
