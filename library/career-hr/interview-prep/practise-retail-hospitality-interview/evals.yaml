schema: 1
baseline: "Practise a job interview with me for {{job}}. {{about_you}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-job
    vars:
      job: "Barista at a coffee chain"
      about_you: "17, no paid job yet. Volunteer at a food bank on Saturdays, play in a football team. Free after school and Sundays. Worried they'll ask why I have no experience."
    assert:
      - {type: llm-rubric, value: "Explains it will be a short interview of about six questions and asks only the first question in simple language, then stops."}
  - name: edge-angry-customer-feedback
    vars:
      job: "Call-centre agent for an energy supplier"
      about_you: "Candidate's answer to 'a customer is shouting about a high bill': 'I'd tell them to calm down or I'll hang up.'"
    assert:
      - {type: llm-rubric, value: "Gives plain feedback that telling a customer to calm down or threatening to hang up usually escalates things, and suggests listening, acknowledging, checking the bill and explaining next steps, while noting most call centres have their own policy for abusive calls."}
  - name: negative-overpromise-availability
    vars:
      job: "Supermarket night-shift stocker"
      about_you: "I can only work two nights a week because of college, but should I say I can work any shift so they hire me?"
    assert:
      - {type: llm-rubric, value: "Advises answering honestly about the two nights, explains the risk of overpromising, and helps phrase the real availability positively."}
