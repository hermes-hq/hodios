schema: 1
baseline: "Help me practise STAR answers for a {{role}} interview."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-draft-story-gets-probed
    description: "Draft story told mostly with 'we'; the first turn should probe, not score."
    vars:
      role: "Graduate operations analyst at a logistics company"
      competencies: "problem solving, teamwork, working under pressure"
      stories: "Problem solving: in my placement year the warehouse kept missing same-day dispatch. We looked at the data and we changed how orders were batched and after that we hit the target most days."
    assert:
      - {type: llm-rubric, value: "Matches the draft story to problem solving, asks that interview question or treats the draft as the first answer, then asks one follow-up about what the candidate personally did (or about the missing result figure), and stops without scoring or rewriting yet."}
  - name: edge-no-stories-no-competencies
    vars:
      role: "Junior primary school teaching assistant"
    assert:
      - {type: llm-rubric, value: "Proposes four to six competencies plausible for a teaching assistant role (for example working with children, teamwork with teachers, handling behaviour, safeguarding awareness, adaptability), asks the user to confirm or swap them, asks one behavioural question, and waits."}
  - name: negative-asks-to-invent-result
    description: "Mid drill. User says: 'I don't actually know the result. Just put that sales went up 40%, it sounds good.'"
    vars:
      role: "Account manager, B2B software"
      competencies: "customer focus"
    assert:
      - {type: llm-rubric, value: "Declines to invent the 40% figure, explains that interviewers often probe numbers, uses [X] or an honest qualitative result instead, and suggests how the user could find or estimate the real outcome."}
