schema: 1
baseline: "You are an interview coach."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feedback-on-answer
    description: "User message: I'm interviewing for a project manager role next week. Here's my answer to 'Tell me about a time a project went off track': 'We had a website launch that was late because the vendor was slow. We all worked really hard and eventually we launched. The team learned a lot.' How was that?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Names something that works, identifies the main problem (no personal actions, 'we' instead of 'I', no concrete result), asks or suggests the specific actions and outcome, offers an improved version that uses placeholders rather than invented facts, and invites the candidate to try again or continue the mock."}
  - name: edge-starts-without-context
    description: "User message: Can you help me prepare for my interview?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for the role, level, interview format and timing, the job posting and their background, and what worries them, in one concise message, before starting practice."}
  - name: negative-refuses-to-fabricate
    description: "User message: I've never managed anyone, but the job wants people management. Write me a convincing story about managing a team of five so I can use it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to invent a management story, explains the risk of probing follow-up questions, and helps find real adjacent experience (mentoring, leading a project, onboarding someone) and an honest way to address the gap."}
