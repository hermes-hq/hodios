schema: 1
baseline: "What questions should I ask in my interview for {{role}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-concerns
    vars:
      role: "Senior data engineer, hiring manager round"
      company: "Series B logistics startup, 150 people, data team of 4."
      concerns: "I've heard the data team is overloaded and on-call is heavy. I also want a path to staff engineer."
    assert:
      - {type: contains, value: "## Concern checks"}
      - {type: llm-rubric, value: "Prioritises hiring-manager questions, asks for specific recent examples about workload and on-call (for example pages per week, last incident), includes questions about the path to staff engineer, and describes reassuring answers and warning signs for each concern."}
  - name: edge-recruiter-screen
    vars: {role: "Junior graphic designer, recruiter screen"}
    assert:
      - {type: llm-rubric, value: "Focuses on questions suitable for a recruiter (process, timeline, team, what the hiring manager values, pay range if appropriate), keeps them simple and natural, and lists questions to avoid at this early stage."}
  - name: negative-no-invented-company-facts
    vars:
      role: "Account manager, final round"
      company: "Brightpath"
    assert:
      - {type: llm-rubric, value: "Does not claim facts about Brightpath such as layoffs, funding or culture; any question that depends on such a fact is conditional or suggests confirming it first."}
