schema: 1
baseline: "Plan a {{minutes}} minute demo lesson on {{subject}} for {{grade_level}} for my teaching interview."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-secondary-science
    vars:
      subject: "Science - topic set: diffusion"
      grade_level: "Year 9, 26 students, mixed attainment, 3 with EAL"
      minutes: 25
      brief: "Teach a 25-minute lesson on diffusion. We want to see how you check for understanding and support EAL students. Interactive whiteboard, mini-whiteboards available."
    assert:
      - {type: contains, value: "## Lesson plan"}
      - {type: llm-rubric, value: "Sets one observable objective on diffusion, gives a minute-by-minute plan totalling about 25 minutes with buffer, includes whole-class responses on mini-whiteboards and hinge questions with likely misconceptions, provides specific EAL support such as visuals and sentence stems, gives students more than half the time to think and respond, and writes reflection prompts rather than a pre-written verdict."}
  - name: edge-panel-as-students-university
    vars:
      subject: "Introductory microeconomics"
      grade_level: "The interview panel will act as first-year undergraduates"
      minutes: 15
    assert:
      - {type: llm-rubric, value: "Adapts to a panel role-playing undergraduates in 15 minutes, picks a narrow topic with one objective since none was set, states assumptions about prior knowledge, keeps active participation, and lists questions to ask the department."}
  - name: negative-too-much-content
    vars:
      subject: "History - the causes, events and consequences of the First World War"
      grade_level: "Year 7"
      minutes: 20
    assert:
      - {type: llm-rubric, value: "Pushes back on covering the whole war in 20 minutes, narrows to one achievable objective, says what was left out on purpose, and plans accordingly."}
