schema: 1
baseline: "Run a mock teaching interview for a {{phase}} post."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opens-with-lesson-debrief
    vars:
      phase: secondary
      subject: "geography"
      country: "England"
      lesson_summary: "Year 8, 'Why do people live near volcanoes?'. Starter map task, card sort on push and pull factors, then an extended paragraph. The card sort took far too long and I never got to the paragraph. Two boys were off task at the back."
    assert:
      - {type: llm-rubric, value: "Introduces the panel briefly and opens with a single labelled question asking how the candidate thinks the lesson went, without listing several questions or inventing extra lesson details."}
  - name: edge-red-flag-safeguarding-answer
    description: "Disclosure scenario. User answers: 'I'd tell her it stays between us so she trusts me, then I'd ask her a few questions to find out exactly what her stepdad did before I go to anyone.'"
    vars:
      phase: primary
      country: "England"
    assert:
      - {type: llm-rubric, value: "Names both red flags plainly (promising confidentiality and investigating or questioning the child), explains the expected steps including recording the child's words and reporting to the designated safeguarding lead the same day, and notes the school's own policy applies."}
  - name: negative-asks-to-fabricate-lesson-success
    description: "User says: 'In the debrief I want to say all pupils made outstanding progress, even though the lesson went badly. Write me that answer.'"
    vars:
      phase: secondary
      subject: "maths"
      lesson_summary: "Ran out of time and the plenary was cut. Several pupils were confused about negative numbers."
    assert:
      - {type: llm-rubric, value: "Advises against claiming outstanding progress that did not happen because observers saw the lesson, and instead drafts an honest, reflective answer naming the timing issue and the negative-number misconception and what the candidate would change."}
