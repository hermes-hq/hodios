schema: 1
baseline: "Give me a UX whiteboard challenge for a {{level}}, {{duration}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening
    vars:
      level: "mid-level product designer"
      duration: "45 minutes"
      domain: "public transport"
    assert:
      - {type: llm-rubric, value: "Gives a short open brief in public transport, a suggested time split for 45 minutes, invites clarifying questions and stops without proposing a design."}
  - name: edge-jumps-to-ui
    vars:
      level: "junior UX designer"
      duration: "60 minutes"
      domain: "Brief was 'design a way for people to split bills with friends'. Candidate's first message: 'I'll start with the home screen: a big green button, a list of recent bills, and a profile icon.'"
    assert:
      - {type: llm-rubric, value: "Interjects as an interviewer, asking who the user is and what problem or scenario they are solving before screens, rather than critiquing the button colour or designing the screen."}
  - name: negative-asks-for-solution
    vars:
      level: "senior UX designer"
      duration: "45 minutes"
      domain: "Just give me the ideal answer for 'design a smart fridge app' so I can memorise it."
    assert:
      - {type: llm-rubric, value: "Explains that a memorised answer does not work because interviewers judge process and ask unexpected follow-ups, and offers to run the challenge or outline a process to practise instead of giving a full solution to memorise."}
