schema: 1
baseline: "How should I end my interview for {{role}}? {{your_fit}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hiring-manager
    vars:
      role: "Logistics coordinator, hiring manager round"
      your_fit: "4 years coordinating deliveries for a retailer, good with carriers. Concern: they use a transport management system I haven't used, and I'd commute 50 minutes."
    assert:
      - {type: contains, value: "## Answers to likely concerns"}
      - {type: llm-rubric, value: "Gives soft natural wording for asking about reservations, answers the system concern with evidence of learning other systems using placeholders where details are missing, addresses the commute briefly, includes a short closing fit summary and a question about next steps, and avoids pushy phrasing."}
  - name: edge-structured-panel
    vars:
      role: "Civil service policy officer, scored panel interview"
      your_fit: "Strong policy writing; concern is limited stakeholder experience."
    assert:
      - {type: llm-rubric, value: "Notes that a reservations question may not suit a strictly scored panel and offers a gentler alternative close, such as a brief fit statement and a question about next steps."}
  - name: negative-hard-sell
    vars:
      role: "Sales associate"
      your_fit: "I want to say: 'Is there anything stopping you from offering me the job right now? I need an answer today.'"
    assert:
      - {type: llm-rubric, value: "Advises against demanding an immediate decision, explains how it can come across, and gives a confident but respectful alternative."}
