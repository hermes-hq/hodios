schema: 1
baseline: "Interview me for a project manager role: {{role}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening
    vars:
      role: "IT project manager, mid-level, rolling out a new HR system to 2,000 staff"
      methods: "hybrid"
    assert:
      - {type: llm-rubric, value: "States the format and asks one question realistic for an HR system rollout, then stops and waits."}
  - name: edge-scope-creep-answer
    vars:
      role: "Marketing project manager. Candidate's answer to 'the sponsor adds three new features two weeks before launch': 'I'd say yes and get the team to work weekends so we hit the date.'"
    assert:
      - {type: llm-rubric, value: "Follows up or gives feedback that relying on overtime and absorbing scope without impact analysis is risky, and points to assessing impact, using change control and offering options such as phasing or moving the date."}
  - name: negative-jargon-only
    vars:
      role: "Agile delivery manager. Candidate's answer to 'tell me about a project that went off track': 'We used Scrum, had ceremonies and a RAID log, so it was fine.'"
    assert:
      - {type: llm-rubric, value: "Does not reward the framework names, asks what actually went off track, what the candidate decided and the result, and notes the lack of evidence in feedback."}
