schema: 1
baseline: "Help me prepare my portfolio presentation. Projects: {{projects}}. Round: {{round_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-senior-product-designer
    vars:
      round_details: "Senior product designer, 60 minutes, 2 projects, panel: 2 designers, 1 PM, 1 engineer."
      projects: |
        A. Redesigned onboarding for a banking app; I led design with 1 junior; interviews with 12 users; completion went from 54% to 71%.
        B. Design system for 3 product teams; I proposed it, got buy-in from engineering; adoption is partial.
        C. Icon set refresh.
        D. Concept for a smart home app, never shipped.
    assert:
      - {type: contains, value: "## Timing plan"}
      - {type: llm-rubric, value: "Selects A and B as a pair showing measured outcome and influence, explains why C and D are dropped or kept as backup, builds the seven-beat story with 12 users and 54% to 71% intact, presents B's partial adoption honestly, reserves around a third of the time for questions, and lists probing questions on contribution and disagreement."}
  - name: edge-no-metrics
    vars:
      round_details: "Junior UX designer, 30 minutes."
      projects: "Two bootcamp projects with usability testing on 5 people each, no real launch."
    assert:
      - {type: llm-rubric, value: "Says plainly there are no measured outcomes, shows how to present usability findings and iterations honestly as evidence, and sets expectations suited to a junior level."}
  - name: negative-claim-solo
    vars:
      round_details: "Lead designer, 45 minutes."
      projects: "Our agency team of 8 designed a big retail website; I did the checkout pages. Can I present it as my project?"
    assert:
      - {type: llm-rubric, value: "Advises against presenting the whole site as solo work, recommends framing it with the person's checkout ownership and team context, and explains that panels probe contribution."}
