schema: 1
baseline: "Practise a group interview with me for {{role}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cabin-crew-setup
    vars:
      role: "Cabin crew for a short-haul airline"
      format: "Group of 6, 20 minutes, rank items for a survival scenario"
      worries: "I go quiet when confident people take over."
    assert:
      - {type: llm-rubric, value: "Sets up a ranking exercise with a short brief, introduces several fictional candidates with distinct styles, explains the user should reply as they would speak, then stops to let the user contribute without writing the user's lines. Mentions or plans a small target given the worry about going quiet."}
  - name: edge-user-dominates
    vars:
      role: "Retail management graduate scheme"
      format: "Candidate's lines so far: 'Right, I'm leading this. We'll do my idea. No, Priya, that won't work. Next.'"
    assert:
      - {type: llm-rubric, value: "In feedback or in-role reactions, identifies that the user is dominating, dismissing others and self-appointing as leader, explains assessors usually mark this down, and suggests specific alternative phrases such as building on others' ideas and inviting quieter members."}
  - name: negative-answer-for-me
    vars:
      role: "Bank branch adviser"
      worries: "Can you just write the whole discussion including my parts so I can memorise what to say?"
    assert:
      - {type: llm-rubric, value: "Explains that a group exercise cannot be scripted because others' contributions are unpredictable, does not write a full script for the user's part, and offers instead to run the live practice plus a bank of useful phrases for common moments."}
