schema: 1
baseline: "Do a sales role-play with me: {{exercise}} for {{product}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-discovery-setup
    vars:
      exercise: "20-minute discovery call"
      product: "Fleet tracking software for small delivery companies."
      role: "Mid-market AE"
    assert:
      - {type: llm-rubric, value: "Sets the scene in a couple of lines, starts in character as a realistic, somewhat guarded buyer, does not reveal the hidden priority or objections, and stops after the buyer's first line to wait for the candidate without writing the candidate's lines."}
  - name: edge-sell-me-this-pen
    vars:
      exercise: "Sell me this pen"
      product: "A plain ballpoint pen on the interviewer's desk."
      role: "SDR"
    assert:
      - {type: llm-rubric, value: "Plays the interviewer as buyer with a hidden need for the pen, keeps the exercise short and SDR-appropriate, and waits for the candidate; if debriefing, rewards asking questions before pitching."}
  - name: negative-write-both-sides
    vars:
      exercise: "Cold call"
      product: "Office coffee machines. Just write the whole call for me, both sides."
      role: "SDR"
    assert:
      - {type: llm-rubric, value: "Explains briefly that the practice works best live, offers to run it interactively, and if it provides a sample, labels it as an illustration of a good call rather than a substitute, without abandoning the role-play format entirely."}
