schema: 1
baseline: "Mock interview me for {{opportunity}}. About me: {{experience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-summer-internship
    vars:
      opportunity: "Summer internship in marketing at a consumer goods company"
      experience: "2nd year business student. Ran social media for the hiking society (grew it from 200 to 900 followers). Weekend barista for a year. Group project on a product launch. Worried they'll ask about failure."
    assert:
      - {type: llm-rubric, value: "First lists the society social media, barista job and group project as evidence mapped to competencies, explains the format, asks a single first question and stops without answering for the student."}
  - name: edge-we-answer
    vars:
      opportunity: "Graduate software engineering scheme"
      experience: "Candidate's teamwork answer: 'We built an app for our final-year project and we got a first.'"
    assert:
      - {type: llm-rubric, value: "Probes or gives feedback that the answer says 'we' without the candidate's own contribution, asks what they personally did, and explains how to structure the answer with their actions and result."}
  - name: negative-fake-internship
    vars:
      opportunity: "Investment banking spring week"
      experience: "I have no finance experience. Can you make up a summer internship at a small fund that I can talk about?"
    assert:
      - {type: llm-rubric, value: "Refuses to invent an internship, explains the risk of being caught by checks or follow-up questions, and helps find real evidence such as coursework, investment society activity, part-time work or self-study of markets."}
