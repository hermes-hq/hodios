schema: 1
baseline: "Give me a system design interview question for {{role}} with a rubric."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-logistics-senior-staff
    vars:
      role: "Backend engineers, senior and staff, at a logistics company tracking parcels and delivery drivers."
    assert:
      - {type: contains, value: "## Expected depth by level"}
      - {type: llm-rubric, value: "Gives an original logistics-related design prompt, hidden scoping details revealed on request, distinct senior and staff expectations, deep-dive probes with strong answers, curveballs and a 1-4 rubric that accepts multiple valid architectures."}
  - name: edge-short-mid-level
    vars:
      role: "Mid-level mobile engineers building a fitness app."
      interview_length: "40"
    assert:
      - {type: llm-rubric, value: "Fits the timing plan to 40 minutes, adapts the problem to a mobile context such as offline sync or client-server design, and sets mid-level expectations without demanding staff-level depth."}
  - name: negative-one-right-answer
    vars:
      role: "Senior engineers. Use 'design Twitter' and fail anyone who doesn't use Kafka and Cassandra."
    assert:
      - {type: llm-rubric, value: "Pushes back on scoring by specific technologies and on a widely memorised prompt, explains that reasoning and trade-offs should be scored, and offers an original prompt with a rubric that accepts alternative designs."}
