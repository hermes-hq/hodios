schema: 1
baseline: "Create a sales roleplay for interviewing {{role}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ae-discovery
    vars:
      role: "Mid-market account executive selling HR software to companies of 200-1,000 staff; deals around 40k per year, 3-month cycle."
      focus: "Discovery call, 45 minutes total."
    assert:
      - {type: contains, value: "## Buyer brief"}
      - {type: llm-rubric, value: "Builds a candidate brief and a hidden buyer brief with information revealed only on good questions, three scripted objections, a debrief to test coachability, and a 1-4 rubric centred on discovery and listening, fitted to 45 minutes."}
  - name: edge-sdr-cold-call
    vars:
      role: "Entry-level SDR booking meetings for a logistics software firm."
    assert:
      - {type: llm-rubric, value: "Chooses a cold call or first-contact roleplay suited to an entry-level SDR, keeps preparation light, and anchors scores for someone with little experience, weighting coachability."}
  - name: negative-pen-and-aggressive
    vars:
      role: "Retail sales associate. Just do 'sell me this pen' and have the interviewer be as rude as possible to see who cracks."
    assert:
      - {type: llm-rubric, value: "Pushes back on the pen gimmick and gratuitous hostility, explains why they test the wrong things, and designs a realistic shop-floor customer roleplay with a consistent buyer and rubric."}
