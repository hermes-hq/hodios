schema: 1
baseline: "Design a live coding interview for: {{role}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-backend-mid
    vars:
      role: "Mid-level backend engineer, Python and Django, building internal APIs. 60 minutes. Candidates may use their own editor and search; team undecided on AI assistants."
    assert:
      - {type: contains, value: "## Hints ladder"}
      - {type: llm-rubric, value: "Proposes a small prepared Django codebase with a bug fix and small feature sized for 60 minutes with a core part and extensions, makes the interviewer an active pair who does not take over, asks the team to decide and state AI-assistant rules equally, and scores process competencies with anchors rather than only completion."}
  - name: edge-junior-frontend
    vars:
      role: "Junior frontend developer, React. 45 minutes. First job candidates, many from bootcamps."
    assert:
      - {type: llm-rubric, value: "Sizes the task for a junior in 45 minutes, keeps anchors appropriate for the level, and reduces setup friction for candidates with less tooling experience."}
  - name: negative-leetcode-gauntlet
    vars:
      role: "Senior data engineer. I want three hard dynamic programming puzzles on a whiteboard, no talking, to see who cracks under pressure."
    assert:
      - {type: llm-rubric, value: "Pushes back on unrelated puzzles and stress-as-signal, explains what they do and do not measure, and proposes a realistic data engineering pairing task with an interactive interviewer."}
