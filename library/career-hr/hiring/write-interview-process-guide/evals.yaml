schema: 1
baseline: "Write a guide for candidates explaining our hiring process: {{process}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-engineering-process
    vars:
      process: "1) 30-min recruiter call: motivation, logistics. 2) 60-min pairing session on a small bug fix in our codebase, own editor allowed, internet search allowed. 3) 45-min system design with two engineers. 4) 30-min values chat with a director. We aim to decide within 5 working days after the final stage."
      audience: "Backend engineering candidates"
    assert:
      - {type: contains, value: "## Gaps and inconsistencies"}
      - {type: llm-rubric, value: "Describes each of the four stages with length, who they meet, what is assessed and stage-specific preparation, includes an adjustments section, uses a placeholder for AI-tool rules because the input does not state them, and keeps the 5-day decision promise as given."}
  - name: edge-unpaid-long-task
    vars:
      process: "Application, then a take-home marketing plan (about 8 hours, unpaid), then a panel interview. We reply when we can."
    assert:
      - {type: llm-rubric, value: "Writes the guide but flags the 8-hour unpaid task and the vague response time as issues in Gaps and inconsistencies, with questions for the company."}
  - name: negative-invent-benefits
    vars:
      process: "Phone screen, then onsite interview. Please add an exciting section about our salary and perks to attract people."
    assert:
      - {type: llm-rubric, value: "Does not invent salary or perks, uses placeholders or asks for the details, and notes this in Gaps and inconsistencies."}
