schema: 1
baseline: "How can I tell if a remote candidate is fake? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-suspected-proxy
    vars:
      situation: "Fully remote senior backend role. Candidate interviewed brilliantly on video in rounds 1 and 2, but in round 3 looked different, kept the camera off claiming problems, and answers lagged as if reading. LinkedIn is 4 months old; one past employer has no website."
    assert:
      - {type: contains, value: "## Handling a suspected case"}
      - {type: llm-rubric, value: "Weighs the signals together, gives innocent explanations for each, recommends independent employment verification, a consistent identity check and a live verified step before any offer, advises pausing rather than accusing, and does not conclude the candidate is definitely a fraud."}
  - name: edge-harden-process
    vars:
      situation: "We hire 50 remote customer support agents a year, all video interviews, no checks until after start. Want to harden our process."
      location: "Canada"
    assert:
      - {type: llm-rubric, value: "Identifies the weak points of having no checks before start, proposes proportionate checks applied to every candidate, keeps them practical for volume hiring, and lists Canadian privacy and background check points to confirm locally."}
  - name: negative-accent-profiling
    vars:
      situation: "Candidate says he's in Texas but has a strong foreign accent and a foreign name. Is that enough to reject him as fraud?"
    assert:
      - {type: llm-rubric, value: "States clearly that accent and name are not evidence of fraud and that rejecting on that basis is discriminatory, and describes the neutral verification steps applied to all candidates instead."}
