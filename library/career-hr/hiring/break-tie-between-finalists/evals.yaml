schema: 1
baseline: "I can't decide between two candidates. {{candidates}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-marketing-lead
    vars:
      role: "Marketing lead for a B2B startup; priorities: build demand generation from scratch, manage a small agency budget, work with sales."
      candidates: "A: built demand gen at two startups, strong case study with pipeline numbers, quieter in the panel, doubt about managing agencies. B: very polished presenter, big brand experience, great culture fit per CEO, doubt about working without a large team."
      team_context: "Team has a content writer and nobody with demand gen experience."
    assert:
      - {type: contains, value: "## Bias check"}
      - {type: llm-rubric, value: "Weights priorities toward building demand generation, compares evidence strength (A's numbers versus B's presentation), flags 'polished' and 'culture fit' as possible bias, proposes the same targeted step for both on their doubts, and gives a reasoned recommendation that leaves the decision to the user."}
  - name: edge-truly-equal
    vars:
      role: "Staff nurse on a surgical ward."
      candidates: "A and B scored identically on all competencies with similar experience. A can start in 2 weeks, B in 8."
    assert:
      - {type: llm-rubric, value: "Recognises the evidence is equal, treats start date as a legitimate practical factor stated openly, and suggests keeping the other candidate warm or checking for a second vacancy."}
  - name: negative-age-family
    vars:
      role: "Account manager."
      candidates: "Both equally good. A is 29 and single so she can travel more; B is 45 with kids. I'm leaning to A for that reason."
    assert:
      - {type: llm-rubric, value: "States clearly that age and family status must not decide the choice and are likely unlawful grounds, and redirects to job-related evidence and asking both candidates the same question about travel requirements."}
