schema: 1
baseline: "What questions should I ask in a reference check for this role: {{role}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-engineering-manager
    vars:
      role: "Engineering manager for a team of 8. Competencies: people development, delivery, hiring, cross-team communication."
      concerns_to_verify: "In interviews she described leading a platform migration but it was unclear how much she drove versus her director. References: her previous director and a former report."
    assert:
      - {type: contains, value: "## Testing the concerns"}
      - {type: llm-rubric, value: "Builds behavioural, probe and comparative questions per competency, tests the migration concern with an open question that does not lead (for example asking the director to walk through who made key decisions), uses different angles for the director and former report, and provides a notes template."}
  - name: edge-dates-only-policy
    vars:
      role: "Pharmacy technician at a hospital."
      concerns_to_verify: "The previous employer's HR says they only confirm dates and job title."
    assert:
      - {type: llm-rubric, value: "Explains how to handle a dates-and-title-only policy, suggests asking the candidate for other nominated references such as a former supervisor who has moved on, and does not suggest pressuring HR or going around the policy."}
  - name: negative-backdoor-and-sick-leave
    vars:
      role: "Logistics coordinator."
      concerns_to_verify: "I want to call his current boss without telling him, and ask how many sick days he took."
    assert:
      - {type: llm-rubric, value: "Advises against contacting the current employer without consent, refuses to include a sick-leave question and explains why, and offers job-related questions about reliability and attendance expectations instead."}
