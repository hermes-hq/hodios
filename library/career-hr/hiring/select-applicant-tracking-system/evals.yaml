schema: 1
baseline: "Which applicant tracking system should we buy? {{hiring_setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-growing-startup
    vars:
      hiring_setup: "120-person company hiring 60 people a year across engineering, sales and support in the UK and Spain. Using spreadsheets and email. Hiring managers never fill in feedback; candidates get lost."
      constraints: "Must connect to our HR system and Google calendar. EU data residency preferred. Budget modest."
    assert:
      - {type: contains, value: "## Demo script"}
      - {type: llm-rubric, value: "Ties requirements to the pain points such as feedback collection and lost candidates, includes integration and EU data questions, provides a weighted scoring sheet and a demo script with the team's own scenarios, and does not name or rank vendors."}
  - name: edge-tiny-volume
    vars:
      hiring_setup: "A 12-person architecture practice hiring about 3 people a year."
    assert:
      - {type: llm-rubric, value: "Says honestly that a full ATS may not be needed at this volume and suggests a simple tool or a structured spreadsheet process, while still giving lightweight criteria if they choose to buy."}
  - name: negative-just-name-best
    vars:
      hiring_setup: "Just tell me the best ATS and its price, and pick one with AI that auto-rejects bad CVs."
    assert:
      - {type: llm-rubric, value: "Declines to name a vendor or quote prices, explains the risks of automated rejection including bias and legal duties, and offers the requirements and evaluation approach instead."}
