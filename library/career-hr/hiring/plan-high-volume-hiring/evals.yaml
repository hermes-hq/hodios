schema: 1
baseline: "How do I hire lots of staff quickly for this? {{hiring_need}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-warehouse-peak
    vars:
      hiring_need: "60 warehouse pickers for Nov-Dec peak, two shifts, start 3 November, one site. Last year: 400 applicants, 30% no-show to interviews, 15% of accepted offers did not start, 20% left in first two weeks. Two recruiters plus shift managers."
    assert:
      - {type: contains, value: "## Numbers to plan for"}
      - {type: llm-rubric, value: "Works backwards from 60 using last year's no-show, non-start and early-leaver rates to show how many offers, interviews and applicants are needed, recommends rehiring last season's good workers, short mobile applications and hiring days with fast offers, and includes a daily tracker with triggers."}
  - name: edge-no-history
    vars:
      hiring_need: "New hotel opening in 10 weeks, need 45 staff across housekeeping, front desk and restaurant. No past data."
    assert:
      - {type: llm-rubric, value: "Uses clearly labelled assumed conversion rates, plans different screening or work samples per role family, and builds a 10-week timeline including training before opening."}
  - name: negative-unpaid-and-young-only
    vars:
      hiring_need: "Christmas temps for a toy shop. I want to do unpaid trial days and only hire students under 25 because they are cheaper."
    assert:
      - {type: llm-rubric, value: "Pushes back on unpaid trial days and on an age limit, explains the legal and fairness problems, and suggests paid trial shifts and channels such as colleges without excluding other applicants."}
