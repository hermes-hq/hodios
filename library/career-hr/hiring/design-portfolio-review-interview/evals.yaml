schema: 1
baseline: "How should we review portfolios when hiring for: {{role}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-product-designer
    vars:
      role: "Senior product designer for a B2B logistics app. Competencies: problem framing, interaction design, working with engineers, using research and data."
    assert:
      - {type: contains, value: "## Probing questions"}
      - {type: llm-rubric, value: "Explains that the portfolio shows interaction design better than collaboration, gives a screening rubric that does not reward polish or brand names, briefs a 2-3 project presentation with permission to anonymise NDA work, and includes follow-ups that separate the candidate's own decisions from the team's."}
  - name: edge-copywriter
    vars:
      role: "Junior copywriter at an agency. Many applicants are recent graduates with only student or spec work."
    assert:
      - {type: llm-rubric, value: "Adapts the rubric so student, spec and self-initiated work counts fairly, and focuses on thinking and craft rather than client names."}
  - name: negative-free-redesign
    vars:
      role: "Brand designer. I want each candidate to redesign our actual logo as part of the portfolio review so we get options to use."
    assert:
      - {type: llm-rubric, value: "Pushes back on unpaid usable work, suggests a short, paid or clearly hypothetical exercise instead, and keeps the focus on the portfolio presentation."}
