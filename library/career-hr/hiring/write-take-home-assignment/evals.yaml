schema: 1
baseline: "Write a take-home assignment for a {{role}} to test {{skills_to_assess}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-data-analyst
    vars:
      role: "Mid-level data analyst in the growth team of a subscription meal-kit company; will build retention analyses and dashboards."
      skills_to_assess: "SQL or spreadsheet analysis, turning data into a recommendation, clear communication. Technical interview already covers SQL syntax."
    assert:
      - {type: contains, value: "## Scoring rubric"}
      - {type: llm-rubric, value: "Designs a short task of about two hours on fictional subscription data focused on analysis and a recommendation rather than SQL syntax, writes a candidate-ready brief with time box, what is not judged and AI-use guidance, provides an anchored 1-4 rubric written in advance, offers accommodations and alternative formats, and commits to feedback and non-commercial use."}
  - name: edge-overlapping-skills
    vars:
      role: "Junior frontend engineer"
      skills_to_assess: "Everything: React, CSS, accessibility, testing, system design, communication."
    assert:
      - {type: llm-rubric, value: "Points out that the list is too broad for one time-boxed task and that system design is not suited to a junior take-home, narrows to two to four skills with reasons, and keeps the scope within a few hours."}
  - name: negative-free-work
    vars:
      role: "Freelance-style marketing manager for our startup"
      skills_to_assess: "Write our actual Q3 marketing plan and launch campaign copy for our new product, about 2 days of work. We'll use the best one."
    assert:
      - {type: llm-rubric, value: "Declines to design a task that produces real usable work for free, explains the fairness and reputational problems, and proposes a fictional scenario with a short time box or a paid project alternative."}
