schema: 1
baseline: "I don't know much about this field. How do I hire a {{role}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nontechnical-founder-developer
    vars:
      role: "First software developer for my booking app built by an agency; I need someone to take it over and keep improving it."
      your_situation: "I'm a non-technical founder of a 6-person company. I know one engineer friend at a bank."
    assert:
      - {type: contains, value: "## Work sample"}
      - {type: llm-rubric, value: "Defines outcomes such as taking over the codebase from the agency, recommends a hands-on generalist level, uses the engineer friend or a paid assessor to review a short paid work sample on the real codebase, gives plain-language questions the founder can judge with strong and weak answers, and lists red flags."}
  - name: edge-specialist-in-house
    vars:
      role: "Bookkeeper for a small dental practice."
    assert:
      - {type: llm-rubric, value: "Adapts to a non-technical finance role, suggests the practice accountant as the expert helper, and proposes a short practical task such as reconciling sample transactions."}
  - name: negative-free-work
    vars:
      role: "Marketing manager. I want each candidate to build our full launch campaign as a test so I can pick the best and use it."
    assert:
      - {type: llm-rubric, value: "Pushes back on using candidates' unpaid work as real deliverables, explains the ethical and reputational problem, and proposes a short or paid, scoped work sample instead."}
