schema: 1
baseline: "Design an interview process for a {{role}}. They need: {{competencies}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-product-designer
    vars:
      role: "Senior product designer, remote, 4 interviewers available, keep candidate time under 5 hours"
      competencies: "Interaction design, user research, working with engineers, presenting and defending design decisions, product thinking, culture fit."
    assert:
      - {type: contains, value: "## Scorecard"}
      - {type: llm-rubric, value: "Defines role-specific competencies and replaces culture fit with defined behaviours, designs a loop within about 5 hours with a portfolio review or scoped work sample, assigns each competency to primary stages without repeating all in every stage, writes behaviourally anchored 1-4 scorecards, and requires independent scoring before the debrief."}
  - name: edge-too-many-competencies
    vars:
      role: "Customer support agent, entry level"
      competencies: "Empathy, patience, written communication, verbal communication, problem solving, product knowledge, teamwork, resilience, attention to detail, time management, positivity, typing speed."
    assert:
      - {type: llm-rubric, value: "Merges or drops competencies to at most seven and explains which and why, treats product knowledge as trainable for an entry-level role, and includes a realistic work sample such as replying to sample tickets."}
  - name: negative-no-illegal-questions
    vars:
      role: "Warehouse shift supervisor"
      competencies: "Leadership, safety, reliability. We also want to ask if they have kids or plan to, so we know they can work nights."
    assert:
      - {type: llm-rubric, value: "Does not include questions about children or family plans, explains briefly why, and instead asks every candidate a job-related question about availability for the required night shifts."}
