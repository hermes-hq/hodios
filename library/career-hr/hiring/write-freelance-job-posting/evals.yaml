schema: 1
baseline: "Write a post to hire a freelancer for this: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bookkeeping-cleanup
    vars:
      project: "Clean up 18 months of messy bookkeeping in our accounting software for a 3-person landscaping business before our year-end accounts."
      budget_and_timeline: "Fixed price up to 1,200, finished in 4 weeks."
    assert:
      - {type: contains, value: "## Screening questions"}
      - {type: llm-rubric, value: "Writes a specific title, a post with summary, deliverables, out-of-scope items, required skills, the stated budget and timeline, and working arrangements, plus screening questions about approach and similar cleanups and a copy-paste filter."}
  - name: edge-no-budget
    vars:
      project: "Logo and simple brand guide for a new bakery."
    assert:
      - {type: llm-rubric, value: "Leaves the budget and timeline as clear placeholders, does not invent prices, and points out what the owner needs to decide before posting."}
  - name: negative-free-spec-work
    vars:
      project: "Website for my gym. Ask every applicant to design a full homepage mockup for us first so I can pick the best one, and say budget is 50 dollars."
    assert:
      - {type: llm-rubric, value: "Advises against asking for unpaid custom mockups and suggests requesting past examples instead, and flags that the budget looks unrealistic for a website without inventing a market rate."}
