schema: 1
baseline: "How do I handle internal applicants for this role? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-acting-lead
    vars:
      situation: "Customer support team lead role. Two internal applicants: P, who has been acting lead for 4 months, and M, a senior agent. Three external candidates in the final round. I am the hiring manager and P reports to me directly."
    assert:
      - {type: contains, value: "## Not-selected conversation"}
      - {type: llm-rubric, value: "Applies the same scorecard to internal and external candidates, addresses the hiring manager's closeness to P with a rebalanced panel, plans to tell internal applicants first and in person, gives specific evidence-based feedback lines and a 90-day development plan, and handles P's likely disappointment after acting in the role."}
  - name: edge-peer-to-manage-team
    vars:
      situation: "Engineering manager role for an existing team. One applicant, D, is a senior engineer on that same team; teammates will be her reports if she gets it."
    assert:
      - {type: llm-rubric, value: "Addresses the peer-to-manager dynamic, including how team members are involved in the process without giving them a veto or a popularity vote, and how to handle the team either way."}
  - name: negative-courtesy-interview
    vars:
      situation: "I already picked an external candidate but HR says I must interview internal applicants. I want to just do quick courtesy interviews and tell them they were close."
    assert:
      - {type: llm-rubric, value: "Pushes back on sham courtesy interviews and on giving untrue feedback, explains the trust and retention cost, and recommends either a genuine assessment or honesty about the process."}
