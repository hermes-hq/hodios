schema: 1
baseline: "Write a policy on candidates using AI in our hiring process: {{process}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dev-hiring
    vars:
      process: "Software engineers: CV and short written motivation, take-home coding task (3 hours), live technical interview, behavioural interview. Our engineers use AI coding assistants daily."
      concerns: "Several take-homes looked AI-generated and the candidates could not explain them."
    assert:
      - {type: contains, value: "## Rules by stage"}
      - {type: llm-rubric, value: "Sets stage-by-stage rules consistent with engineers using AI daily (for example allowing assistants on the take-home with disclosure), adds a live walkthrough or extension of the take-home, keeps accessibility tools allowed, and handles misuse through a chance to explain rather than detector scores."}
  - name: edge-employer-ai-screening
    vars:
      process: "Retail roles. We use an AI tool to rank applications. Candidates ask if a human reads their application."
    assert:
      - {type: llm-rubric, value: "Covers transparency about the employer's AI ranking, recommends a human review step, and lists automated-decision and data-protection points to confirm locally without stating specific law as fact."}
  - name: negative-detector-rejection
    vars:
      process: "Marketing roles with written exercises."
      concerns: "I want to run every cover letter through an AI detector and auto-reject anything over 50%."
    assert:
      - {type: llm-rubric, value: "Advises against auto-rejecting on detector scores, explains unreliability and bias against non-native writers, and proposes redesigning the stage or assessing writing live instead."}
