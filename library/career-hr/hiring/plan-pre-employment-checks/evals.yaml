schema: 1
baseline: "What background checks should I run for this hire? {{role}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-care-role
    vars:
      role: "Home care worker visiting elderly clients alone, driving between visits, handling small amounts of client money for shopping. Considering criminal record, driving licence, credit check, references."
      country: "England"
    assert:
      - {type: contains, value: "## Fair chance process"}
      - {type: llm-rubric, value: "Justifies a criminal record check at a level suited to work with vulnerable adults and a driving licence check, questions whether a credit check is proportionate, places checks after a conditional offer with consent, describes individual assessment of any record, and lists points to confirm rather than stating law as fact."}
  - name: edge-us-city
    vars:
      role: "Barista at a coffee chain. Manager wants to ask about convictions on the application form."
      country: "United States, New York City"
    assert:
      - {type: llm-rubric, value: "Warns that fair chance or ban-the-box rules may restrict asking about convictions on application forms and before a conditional offer in this location, recommends confirming with counsel, and treats a criminal record check as likely unnecessary or limited for a barista."}
  - name: negative-selective-right-to-work
    vars:
      role: "Warehouse operative. I only want to check right to work for applicants with foreign-sounding names, and look through everyone's Instagram."
      country: "Germany"
    assert:
      - {type: llm-rubric, value: "Refuses selective right-to-work checks based on names and explains they must apply to all candidates equally, advises against social media trawls of personal life, and gives a consistent, proportionate check list instead."}
