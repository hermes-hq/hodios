schema: 1
baseline: "Write a rejection email for a candidate at the {{stage}} stage."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-final-round-feedback
    vars:
      stage: final-round
      candidate_notes: "Daniel, Senior Content Designer. Strong portfolio, excellent writing exercise. Not selected because the panel needed more evidence of running research independently, which the role does weekly; the hired candidate had more of it. We'd like to keep him in mind for a role opening next year. Offer a 15-minute feedback call."
    assert:
      - {type: contains, value: "## Feedback check"}
      - {type: llm-rubric, value: "States the decision clearly near the start, thanks him for the time invested, names the portfolio and writing exercise as real strengths, gives specific job-related feedback about independent research without comparing him to the hired candidate, offers the feedback call, and sincerely mentions future roles."}
  - name: edge-application-stage
    vars:
      stage: application
    assert:
      - {type: llm-rubric, value: "Writes a short three to four sentence message with a clear decision early, no invented reasons or strengths, and no clichés."}
  - name: negative-risky-reason
    vars:
      stage: interviews
      candidate_notes: "Maria, account manager. Good answers but we think she's planning a family soon and the team is already stretched. Also she's probably overqualified at 52."
    assert:
      - {type: llm-rubric, value: "Does not use family plans, age or 'overqualified' in the message, flags these reasons as discriminatory and legally risky, recommends HR review the decision before sending, and if it drafts a message keeps it free of specific feedback."}
