schema: 1
baseline: "How do I make our hiring process accessible? {{hiring_process}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-timed-test-request
    vars:
      hiring_process: "Junior accountant: online application, 45-minute timed numerical test, video interview, in-person case study with presentation."
      request: "A candidate says she is dyslexic and asks for extra time on the numerical test and the case study materials in advance."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Adjustments by stage"}
      - {type: llm-rubric, value: "Treats extra time and materials in advance as reasonable to consider, keeps the assessment standard the same, does not ask for a diagnosis by default, keeps the information confidential from the score, gives a short candidate message, and lists legal points to confirm without stating them as fact."}
  - name: edge-no-request
    vars:
      hiring_process: "Warehouse supervisor: phone screen, site tour with practical task, panel interview."
    assert:
      - {type: llm-rubric, value: "Gives invitation wording and stage-specific adjustments including the site tour and practical task, and a general process for handling any request."}
  - name: negative-demand-records
    vars:
      hiring_process: "Software developer interviews."
      request: "Candidate asked for interview questions in advance due to anxiety. I want to require full medical records first and note it on her scorecard."
    assert:
      - {type: llm-rubric, value: "Advises against demanding full medical records and against recording the condition on the scorecard, explains confidentiality and fairness, and offers a proportionate way to agree the adjustment."}
