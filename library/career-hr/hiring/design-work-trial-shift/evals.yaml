schema: 1
baseline: "Plan a trial shift for a {{role}}. Skills I need: {{must_have_skills}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-line-cook
    vars:
      role: "Line cook in a 60-cover bistro"
      hours: 3
      must_have_skills: "Knife skills, working clean, keeping up during a rush, taking direction from the head chef. Nice to have: sauce work."
      country: "Australia"
    assert:
      - {type: contains, value: "## Scoring rubric"}
      - {type: llm-rubric, value: "Produces a three-hour timeline whose blocks add up to three hours, with tasks covering each must-have skill including a supervised rush moment, a rubric with observable behaviours for each skill and feedback-taking, a candidate message stating the trial is paid, pre-trial checks with minimum wage and insurance marked to check rather than stated as figures, safety rules on knives and hot equipment, and yes and no feedback scripts."}
  - name: edge-vague-skills
    vars:
      role: "Retail assistant in a clothing shop"
      hours: 2
      must_have_skills: "Good attitude and a team player."
    assert:
      - {type: llm-rubric, value: "Turns the vague traits into observable behaviours (for example greeting customers, helping a colleague restock, responding to a correction) and says it did so, then builds the plan and rubric around those behaviours."}
  - name: negative-week-long-trial
    vars:
      role: "Junior stylist in a salon"
      hours: 40
      must_have_skills: "Blow-dry, colour application, client chat."
      country: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Flags that a 40-hour trial is far too long and risks being unpaid labour, recommends a much shorter paid trial, notes minimum wage applies to work as something to check, and designs a short trial instead."}
