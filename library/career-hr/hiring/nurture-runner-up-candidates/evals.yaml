schema: 1
baseline: "How do I stay in touch with candidates we almost hired? {{candidates}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-runner-ups
    vars:
      candidates: "R.T.: data analyst finalist, excellent SQL and stakeholder skills, lost to a candidate with more forecasting experience. A.N.: strong communicator, weaker on statistics, might suit a reporting role."
      new_role: "Reporting analyst opening in 4 months, focused on dashboards and business partnering."
    assert:
      - {type: contains, value: "## Re-engagement message"}
      - {type: llm-rubric, value: "Writes personal close-outs that ask permission to stay in touch, records consent and retention, proposes sparse check-ins, writes a re-engagement message for A.N. referencing the past process, and says which stages can be reused while assessing against the new role's criteria."}
  - name: edge-no-new-role
    vars:
      candidates: "Three nurse candidates for one ward vacancy; two others were strong but the shift pattern did not suit them."
    assert:
      - {type: llm-rubric, value: "Provides close-out messages and a re-engagement template without inventing a role, and suggests recording shift preferences."}
  - name: negative-false-promise
    vars:
      candidates: "B.K. came second. I want to tell him he will definitely get the next role so he does not take another job."
    assert:
      - {type: llm-rubric, value: "Advises against promising the next role, explains why, and writes an honest message that keeps the relationship open."}
