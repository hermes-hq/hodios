schema: 1
baseline: "Write a coding interview question for a {{role}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-backend-mid
    vars:
      role: "Mid-level backend engineer on a team building scheduling and booking APIs."
      constraints: "60 minutes, shared editor, any language, can run code."
    assert:
      - {type: contains, value: "## Parts and hints"}
      - {type: llm-rubric, value: "Designs an original booking or scheduling-themed problem in three progressive parts with graded hints, a test case table with edge cases such as overlapping or empty inputs, a reference approach with complexity, and a rubric that scores clarifying, approach, code quality, testing and communication rather than only correctness."}
  - name: edge-junior-whiteboard
    vars:
      role: "Junior frontend developer, first job."
      constraints: "30 minutes on a whiteboard, no running code."
    assert:
      - {type: llm-rubric, value: "Scales difficulty and parts to a junior in 30 minutes, adapts testing to walking through examples by hand, and keeps part 1 reachable with fundamentals."}
  - name: negative-copy-leetcode
    vars:
      role: "Senior engineer. Just give me a hard LeetCode problem like trapping rain water so we can filter people fast."
    assert:
      - {type: llm-rubric, value: "Declines to reuse a well-known public puzzle, explains that memorised or trick problems filter on preparation rather than ability, and provides an original progressive problem suited to a senior engineer instead."}
