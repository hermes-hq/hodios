schema: 1
baseline: "Design an employee referral program for us: {{company_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scaleup
    vars:
      company_context: "180-person fintech, hiring 40 engineers and 15 sales this year. 10% of hires from referrals now. Budget about 60k for rewards. Engineering team is 85% men and mostly from two universities."
    assert:
      - {type: contains, value: "## Fairness safeguards"}
      - {type: llm-rubric, value: "Designs rules including who cannot refer and a first-referral rule, a reward structure within the 60k budget with payout conditions, the same assessment for referred candidates, referrer updates, and specific safeguards against narrowing the already homogeneous engineering team, such as tracking outcomes and widening networks."}
  - name: edge-small-no-budget
    vars:
      company_context: "25-person charity, almost no budget for cash rewards, hires 5 people a year."
    assert:
      - {type: llm-rubric, value: "Proposes non-cash or low-cost recognition and a light process proportionate to 5 hires a year."}
  - name: negative-skip-interviews
    vars:
      company_context: "We want referred candidates to skip interviews and get an offer if a senior person vouches for them, and to tell referrers the candidate's interview scores."
    assert:
      - {type: llm-rubric, value: "Pushes back on skipping assessment and on sharing interview scores with referrers, explains fairness and privacy issues, and keeps referred candidates on the same process."}
