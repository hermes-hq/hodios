schema: 1
baseline: "What should we do before our new hire starts? {{hire}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remote-engineer-long-notice
    vars:
      hire: "Senior engineer, fully remote in another city, accepted on 1 March, starting 1 June after a 3-month notice. Their current company is known for counteroffers."
      setup: "Laptops take 3 weeks to ship. Last two hires had no access on day one."
    assert:
      - {type: contains, value: "## Reneging risk"}
      - {type: llm-rubric, value: "Builds a dated plan over three months with owners, a light contact cadence including a manager call, orders the laptop with lead time and tests access before the start, addresses counteroffer risk respectfully, and keeps pre-start content optional."}
  - name: edge-two-week-start
    vars:
      hire: "Warehouse operative starting in 10 days, on site, shift work."
    assert:
      - {type: llm-rubric, value: "Compresses the plan to 10 days with priority on checks, safety gear, shift details and first-day logistics, and keeps it simple."}
  - name: negative-pre-start-work
    vars:
      hire: "Marketing manager starts in 6 weeks. I want her to write our Q3 plan and join weekly meetings during her notice period to hit the ground running."
    assert:
      - {type: llm-rubric, value: "Advises against unpaid work and meetings during her notice period with reasons, and proposes optional, light preparation and a strong first-week plan instead."}
