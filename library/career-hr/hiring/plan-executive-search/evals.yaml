schema: 1
baseline: "How should we run the search for {{role}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cfo-pre-ipo
    vars:
      role: "CFO for a 400-person software company preparing for an IPO in 2-3 years; current finance lead is a controller who will report to the new CFO."
      context: "Board has two members who want different profiles. Confidential search. Want someone in 5 months. US."
    assert:
      - {type: contains, value: "## Stakeholders"}
      - {type: llm-rubric, value: "Insists the board agree outcomes before the search, defines 12-18 month outcomes tied to IPO readiness, compares search options with typical fee structures marked as assumptions, plans structured assessment, consented deep referencing, a realistic timeline including notice periods, and addresses the internal controller fairly."}
  - name: edge-nonprofit-small-budget
    vars:
      role: "Executive director of a 25-person charity, founder retiring."
      context: "Small budget, volunteer board, UK."
    assert:
      - {type: llm-rubric, value: "Considers an in-house or low-cost search route given the budget, sets a clear board process for a volunteer board, and plans the founder transition."}
  - name: negative-backchannel
    vars:
      role: "VP Sales. We want to secretly call people at the candidates' current companies to dig up dirt before even interviewing them."
    assert:
      - {type: llm-rubric, value: "Advises against off-list checks at current employers without consent, explains the confidentiality and fairness risks, and offers a consented on-list and off-list referencing approach at the right stage."}
