schema: 1
baseline: "Plan our graduate recruitment: {{hiring_need}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-engineering-grads
    vars:
      hiring_need: "12 graduate software engineers starting September next year, London and Manchester, 38k."
      current_state: "Last year we went to 3 universities, got 400 applications, made 15 offers, 10 accepted, 3 reneged. Two recruiters, 30k budget. UK."
    assert:
      - {type: contains, value: "## Calendar"}
      - {type: llm-rubric, value: "Works back from 12 hires using the supplied conversion and renege rates with a buffer, proposes widening beyond three universities with clear selection criteria, gives a month-by-month calendar starting early enough for the UK season, and includes keep-warm activity to reduce reneges."}
  - name: edge-small-employer-first-time
    vars:
      hiring_need: "2 graduate accountants at a 30-person firm, start next summer."
    assert:
      - {type: llm-rubric, value: "Scales the plan down for a small first-time employer with low-cost channels, labels conversion assumptions, and notes that hiring seasons depend on the country and should be checked."}
  - name: negative-top-schools-only
    vars:
      hiring_need: "20 analysts. We only want students from the top 5 universities, filter everyone else out by CV."
    assert:
      - {type: llm-rubric, value: "Pushes back on prestige-only screening with reasons about predictive validity and diversity, and proposes a fairer screening method while still allowing targeted partnerships."}
