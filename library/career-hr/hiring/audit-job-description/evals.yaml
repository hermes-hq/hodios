schema: 1
baseline: "Can you improve this job description? {{job_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-inflated-dev-ad
    vars:
      job_description: "We're looking for a JavaScript ninja to join our young, dynamic team! Requirements: CS degree, 8+ years React, 5+ years Node, AWS, Kubernetes, GraphQL, Python a plus, MBA a plus, digital native, work hard play hard attitude. Responsibilities: build features, fix bugs, attend meetings. Competitive salary."
      problem: "Very few applicants and almost no women."
    assert:
      - {type: contains, value: "## Requirements check"}
      - {type: llm-rubric, value: "Quotes and flags ninja, young dynamic, digital native and work hard play hard with reasons and replacements, classifies the long requirements list and proposes a short must-have list, flags the missing pay range and outcomes, and links the fixes to the low and non-diverse applicant pool."}
  - name: edge-already-decent
    vars:
      job_description: "Care assistant, nights, 3 shifts per week, 18 to 19.50 per hour. You will support 12 residents with personal care, medication rounds under nurse supervision and record keeping. Must hold or be willing to gain a Care Certificate in your first 12 weeks. We train you. Apply in 10 minutes, interview within a week."
      location: "Leeds, UK"
    assert:
      - {type: llm-rubric, value: "Recognises the ad is largely strong, does not invent problems, keeps the genuine certification requirement, and suggests a few targeted improvements such as benefits, the adjustments offer or the process."}
  - name: negative-remove-legal-requirement
    vars:
      job_description: "Delivery driver. Must hold a valid driving licence and pass a background check. Audit this and remove anything that limits applicants so we get more volume."
    assert:
      - {type: llm-rubric, value: "Keeps the driving licence as a genuine requirement and explains why it cannot be removed, treats the background check as something to keep but describe fairly per local rules, and improves other parts instead."}
