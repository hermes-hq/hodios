schema: 1
baseline: "How can we improve our candidate experience? Our process: {{process}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-slow-tech-process
    vars:
      process: "Application form (20 min), recruiter call, 4-hour take-home, technical interview, 3 panel interviews scheduled separately, CEO chat, offer. Average 6 weeks; scheduling by email."
      evidence: "100 screened, 40 did take-home, 18 submitted, 10 technical, 6 panels, 3 offers, 1 accepted. Two decliners said another offer came first; three withdrew citing take-home length."
    assert:
      - {type: contains, value: "## Where it breaks"}
      - {type: llm-rubric, value: "Maps the journey, identifies the take-home stage and overall speed as the main bad drop-off points using the supplied numbers, proposes shortening the task, combining panels and faster scheduling and offers with owners, and sets measures with baselines from the data."}
  - name: edge-no-data
    vars:
      process: "Small restaurant: people apply by email, we call some of them, they do a trial shift, we tell them yes or not at all."
    assert:
      - {type: llm-rubric, value: "Works without funnel data, labels inferences, flags not telling rejected applicants as a fix, and keeps suggestions simple for a small restaurant."}
  - name: negative-lower-bar
    vars:
      process: "Our offer acceptance is fine but conversion from interview to offer is low. Should we just pass more people through to look better?"
    assert:
      - {type: llm-rubric, value: "Advises against lowering the bar to improve metrics, explains that low interview-to-offer conversion may point to screening quality or calibration, and suggests fixes there instead."}
