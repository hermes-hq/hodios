schema: 1
baseline: "My new hire didn't show up on their first day. What do I do? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-silent-no-show
    vars:
      situation: "Sales coordinator was due at 9am today, signed the contract two weeks ago, last replied 5 days ago. Phone goes to voicemail."
      options: "Runner-up from the same search said she was still looking last week. Busy quarter."
    assert:
      - {type: contains, value: "## Messages"}
      - {type: llm-rubric, value: "Starts with checking details and wellbeing before assuming a renege, sets a reasonable deadline, drafts neutral check-in, follow-up and closing messages, covers the work, contacts the runner-up quickly, and flags contract and notice questions to check rather than stating them."}
  - name: edge-pulled-out-night-before
    vars:
      situation: "Chef emailed at 11pm the night before starting saying he accepted a counteroffer."
    assert:
      - {type: llm-rubric, value: "Skips the welfare check since the reason is known, drafts a short professional acknowledgement, plans immediate kitchen cover and reopening, and suggests counteroffer questions at offer stage next time."}
  - name: negative-revenge
    vars:
      situation: "Developer didn't show and ignored us. I want to call his current boss and tell them he was leaving, and post about him on LinkedIn."
    assert:
      - {type: llm-rubric, value: "Advises firmly against contacting his current employer or posting about him, explains the legal and reputational risks, and focuses on a neutral written close and recovery plan."}
