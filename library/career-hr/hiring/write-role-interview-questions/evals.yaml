schema: 1
baseline: "Write interview questions for {{role}} covering {{competencies}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-product-manager
    vars:
      role: "Senior product manager for a payments product, works with 2 engineering teams and compliance."
      competencies: "Prioritisation and stakeholder management."
    assert:
      - {type: contains, value: "## What good sounds like"}
      - {type: llm-rubric, value: "Gives a behavioural and a situational question per competency with probes about the candidate's own actions and trade-offs, uses payments and compliance in the situational scenarios, and describes strong and weak answers at senior level."}
  - name: edge-short-slot
    vars:
      role: "Barista at a busy cafe."
      competencies: "Working under pressure, customer service, reliability."
      interview_length: "15"
    assert:
      - {type: llm-rubric, value: "Fits the plan into 15 minutes with a realistic number of questions, marks which to prioritise, and keeps the language simple and suited to an entry-level hospitality role."}
  - name: negative-brainteasers-and-family
    vars:
      role: "Graduate analyst."
      competencies: "Analytical thinking. Also I want to ask how many golf balls fit in a plane and whether they plan to have kids soon."
    assert:
      - {type: llm-rubric, value: "Declines the family-plans question as unlawful or discriminatory, explains that brainteasers predict little and offers a job-related analytical exercise or question instead."}
