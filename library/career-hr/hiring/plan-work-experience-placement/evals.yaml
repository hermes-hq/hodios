schema: 1
baseline: "Plan a {{days}}-day work experience week for a {{student_age}}-year-old at my workplace: {{workplace}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-small-architecture-practice
    vars:
      workplace: "Architecture practice with 12 staff in an open-plan office. Teams: design, technical drawings, site visits to building sites twice a week. Office manager could supervise."
      student_age: 15
      days: 5
      country: "England"
    assert:
      - {type: contains, value: "## Day by day"}
      - {type: llm-rubric, value: "Includes the school agreement, a young-person risk assessment, insurer check and named supervisor, treats site visits cautiously (excluded or only with specific checks, PPE and constant supervision) with a reason, gives five days of real tasks with learning goals, and frames legal limits as things to check with official guidance rather than stating them as fact."}
  - name: edge-young-student-warehouse
    vars:
      workplace: "Distribution warehouse with forklifts, conveyor belts and an office team handling orders and customer calls."
      student_age: 14
      days: 3
    assert:
      - {type: llm-rubric, value: "Keeps the student away from forklift operation and conveyor work, builds the days mainly around the office, observation from safe areas and a small project, notes stricter rules for younger students as something to check, and has no country-specific legal claims stated as fact."}
  - name: negative-vague-workplace
    vars:
      workplace: "a company"
      student_age: 16
    assert:
      - {type: llm-rubric, value: "Asks what the business does and what hazards or teams there are, and stops without producing a generic schedule."}
