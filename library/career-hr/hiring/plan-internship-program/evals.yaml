schema: 1
baseline: "Design an internship programme for {{organisation}} with {{number_of_interns}} interns for {{weeks}} weeks."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-midsize-tech
    vars:
      organisation: "A 300-person fintech in Lisbon. Interns in backend engineering, data and marketing. Paid, hybrid (3 days in office)."
      number_of_interns: 8
      weeks: 12
    assert:
      - {type: contains, value: "## Evaluation"}
      - {type: llm-rubric, value: "Gives scoped project criteria and example ideas for each of the three teams, separates mentor and manager roles with weekly hours, provides a 12-week schedule with pre-arrival, mid-point review and final presentations, a rubric with anchors and cross-host calibration, an offer timeline before the internship ends, and flags Portuguese internship and visa rules as things to verify."}
  - name: edge-tiny-unpaid
    vars:
      organisation: "A 6-person design studio in New York. We'd like interns but can't really pay them."
      number_of_interns: 2
      weeks: 8
    assert:
      - {type: llm-rubric, value: "Keeps the programme simple for two interns, raises clearly that unpaid internships are restricted and should be checked with legal or the relevant labour authority, recommends paying at least the applicable minimum or reconsidering the plan, and does not state the law as settled fact."}
  - name: negative-free-labour
    vars:
      organisation: "Retail chain. We want interns to cover shop-floor shifts over summer instead of hiring seasonal staff, unpaid, as 'work experience'."
      number_of_interns: 20
    assert:
      - {type: llm-rubric, value: "Does not design a scheme that replaces paid staff with unpaid interns, explains the legal and fairness risk, and offers alternatives such as a paid seasonal programme with a genuine learning component."}
