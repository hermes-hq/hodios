schema: 1
baseline: "How can I make my work more visible? I'm a {{role}} and recently: {{recent_work}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quiet-backend-engineer
    vars:
      role: "Senior backend engineer, payments team, promotion decided by a director-level committee"
      recent_work: "Migrated payment retries to a queue; failed payments that never recovered dropped from about 2% to 0.4%. Also on-call for 6 weeks with zero escalations, and I mentored a new joiner. Nobody outside the team mentioned it."
      manager_style: "Manager is remote, 30-minute 1:1 every two weeks, often cancelled, prefers Slack."
    assert:
      - {type: contains, value: "## Drafts"}
      - {type: llm-rubric, value: "Frames the retry migration as recovered revenue or fewer failed payments, asks for the payment volume to put a figure on it rather than inventing one, makes on-call and mentoring visible, proposes an async written update suited to a busy remote manager, drafts a weekly update and a win post that credits others, and addresses reaching the director-level committee through a sponsor."}
  - name: edge-glue-work-only
    vars:
      role: "Project coordinator, marketing team"
      recent_work: "I mostly chase people, run standups, keep the tracker up to date and fix things between teams. Nothing I can point to as mine."
    assert:
      - {type: llm-rubric, value: "Treats coordination as real work, suggests ways to show its effect (on-time delivery, unblocked dependencies, time saved) with [X] placeholders for missing numbers, and recommends what to start capturing before broadcasting."}
  - name: negative-take-credit
    vars:
      role: "Data analyst"
      recent_work: "My colleague built the churn model but I presented it to the VP. I want to post about it as my project so I get noticed."
    assert:
      - {type: llm-rubric, value: "Advises against claiming the colleague's model as their own, explains the risk, and shows how to describe their actual contribution (presenting, framing the findings) while crediting the colleague."}
