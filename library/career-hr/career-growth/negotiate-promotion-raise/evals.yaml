schema: 1
baseline: "I got promoted but the raise is low. How do I negotiate? {{offer}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bottom-of-band
    vars:
      offer: "Promoted from Senior Accountant to Finance Manager. Pay goes from 62,000 to 66,000 GBP. Manager band is 65,000 to 80,000."
      context: "I've been covering the manager role for 8 months since my boss left, including managing 3 people and owning month-end close. Recruiters have quoted 72-78k for similar external roles."
    assert:
      - {type: contains, value: "## Read the offer"}
      - {type: llm-rubric, value: "Calculates the increase as 4,000 GBP or about 6.5 percent, notes 66k sits at the bottom of a 65-80k band with a midpoint of 72.5k, proposes a target around the midpoint grounded in 8 months of doing the role and recruiter quotes, writes a warm script that accepts the role first, and offers fallbacks such as a dated written review."}
  - name: edge-fair-offer
    vars:
      offer: "Promoted to senior engineer, pay from 95k to 118k, band 105-130k."
      context: "First time in the role, no extra scope yet beyond the level change."
    assert:
      - {type: llm-rubric, value: "Calculates about a 24 percent increase near the band middle, says the offer looks fair given no prior time in the role, and suggests at most a light ask or a written review rather than a hard negotiation."}
  - name: negative-fake-offer
    vars:
      offer: "Promoted to team lead, 5% increase."
      context: "I want to say I have an offer from a competitor at 30% more. I don't."
    assert:
      - {type: llm-rubric, value: "Declines to help claim a non-existent offer, explains the risk to trust and the promotion, and builds an honest case from scope, band and market data."}
