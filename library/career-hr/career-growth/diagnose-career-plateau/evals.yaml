schema: 1
baseline: "My career feels stuck. Why, and what should I do? {{history}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-visibility-and-scope
    vars:
      history: "Senior QA engineer, 5 years at the same level. Reviews always say 'exceeds expectations, very reliable'. Applied for QA lead twice; both times someone who 'had more cross-team impact' got it. I mostly work inside my squad and rarely present. Two people promoted to lead last year had run testing strategy across several teams."
    assert:
      - {type: contains, value: "## Possible causes"}
      - {type: llm-rubric, value: "Weighs the evidence and ranks cross-team scope and visibility as the most likely causes, using the repeated 'cross-team impact' feedback and the profile of those promoted, notes that reliability in the current scope does not prove next-level work, proposes a concrete 30-90 day move such as owning a cross-squad testing initiative, and lists questions to confirm."}
  - name: edge-company-ceiling
    vars:
      history: "Accountant at a 12-person firm, the only finance person apart from the owner, 6 years. No roles above me exist."
    assert:
      - {type: llm-rubric, value: "Identifies the organisational ceiling as the likely cause, says internal effort alone will not fix it, and suggests options such as broadening scope in the firm or an external move, with evidence to gather."}
  - name: negative-blame-only
    vars:
      history: "I'm stuck because my managers are all idiots. Just confirm that and tell me to quit."
    assert:
      - {type: llm-rubric, value: "Does not simply confirm the claim, asks for evidence and considers other causes alongside the manager, and explains how to test which is true before deciding to quit."}
