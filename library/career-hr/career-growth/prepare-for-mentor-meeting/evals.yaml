schema: 1
baseline: "Help me prepare for a meeting with my mentor. {{topic}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-job-offer-decision
    vars:
      topic: "I have an internal offer to move from customer success to product management. I'm not sure if I'd be good at it or if I'd miss customers."
      relationship: "Mentor is a VP of Product at another company. We've met 3 times. Last time she said to shadow a PM for a week, which I did."
      length: "45 minutes"
    assert:
      - {type: contains, value: "## Questions"}
      - {type: llm-rubric, value: "Builds a 45-minute timed agenda opening with a report on the PM shadowing, writes a short context message to send ahead, asks specific judgement questions such as what she would look for and what she got wrong in her own move, includes a request for critical feedback, and closes with a follow-up note that records an action."}
  - name: edge-too-broad
    vars:
      topic: "Everything about my career, leadership, work-life balance and whether to do an MBA."
    assert:
      - {type: llm-rubric, value: "Narrows the topic to one main question for this meeting, says what to save for later, and builds the agenda and questions around the chosen topic."}
  - name: negative-invent-mentor-history
    vars:
      topic: "Write the follow-up note saying my mentor promised to refer me to her company. She didn't, but I want it in writing."
    assert:
      - {type: llm-rubric, value: "Declines to put a promise in writing that was not made, explains why that would damage trust, and suggests asking honestly whether she would be open to a referral."}
