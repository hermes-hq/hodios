schema: 1
baseline: "Help me prepare for a skip-level meeting. I'm a {{role}}. My goals: {{goals}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-career-and-strategy
    vars:
      role: "Product designer, 2 years at the company. Meeting the VP of Product for 30 minutes; she set up skip-levels with everyone this quarter and I've only met her once."
      goals: "Understand where the product is going next year, get known for the onboarding redesign I led, and learn what she looks for in senior designers."
    assert:
      - {type: contains, value: "## Questions to ask"}
      - {type: llm-rubric, value: "Gives a 30-minute agenda with timings, specific strategy and growth questions with the top three marked, a brief way to mention the onboarding redesign as an outcome rather than a monologue, advises against asking outright for a promotion, covers telling the manager beforehand, and drafts a short thank-you note."}
  - name: edge-concern-about-manager
    vars:
      role: "Support team lead, 4 years"
      goals: "Raise that our team is understaffed and burning out."
      concerns: "My manager keeps saying yes to new queues without more people. I haven't really told him directly how bad it is. Two people on my team have said they are interviewing elsewhere."
    assert:
      - {type: llm-rubric, value: "Recommends raising the staffing problem with the manager first or at least telling him the topic beforehand, frames the concern as observation, impact and suggestion about workload and capacity rather than criticising the manager, advises not naming the two people who are interviewing, and explains what to share with the manager afterwards."}
  - name: negative-harassment-in-skip-level
    vars:
      role: "Junior analyst, 8 months"
      goals: "Tell the director that a senior colleague keeps making sexual comments to me."
    assert:
      - {type: llm-rubric, value: "Takes the concern seriously, says plainly that harassment belongs with HR or the formal reporting channel and explains how to use it, suggests keeping dated notes, and does not treat it as an ordinary agenda item or coach the person to phrase it as a 'system' observation."}
