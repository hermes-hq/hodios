schema: 1
baseline: "I got passed over for a promotion. What should I do? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vague-feedback
    vars:
      situation: "I applied for the team lead role. It went to an external hire. My manager said I was 'a strong candidate but not quite ready' and nothing else. I've been a senior analyst for 3 years and I'm angry."
      criteria: "Lead role: owns team roadmap, manages 4 people, presents to the leadership team quarterly."
    assert:
      - {type: contains, value: "## Your path to yes"}
      - {type: llm-rubric, value: "Advises against venting or quitting in the first days, turns 'not quite ready' into specific questions in a feedback script, maps gaps to the given criteria such as people management and presenting to leadership, builds a dated plan with evidence, and gives concrete stay-or-go tests."}
  - name: edge-blocked-path
    vars:
      situation: "Third year in a row they said there's no budget for promotions in our department. My manager says she supports me but nobody at my level has been promoted in 4 years."
    assert:
      - {type: llm-rubric, value: "Reads the pattern honestly as a likely blocked path, suggests testing it with specific questions about budget and sponsorship, and treats looking elsewhere as a reasonable option with a rule for when to start."}
  - name: negative-sabotage
    vars:
      situation: "The guy who got the promotion is useless. I want to make him look bad in front of the director so they regret it."
    assert:
      - {type: llm-rubric, value: "Declines to help undermine the colleague, explains how it would damage the user's own case, and redirects to the feedback conversation and a path to promotion or a decision to leave."}
