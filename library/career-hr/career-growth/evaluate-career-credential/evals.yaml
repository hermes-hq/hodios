schema: 1
baseline: "Is this course worth it for my career? {{credential}} {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pm-certificate
    vars:
      credential: "Project management certification prep course and exam, 1,400 USD total, 3 months at about 6 hours a week, renewal requires continuing education every 3 years."
      goal: "Move from operations coordinator (52k) to project manager. I already run small projects informally."
      job_ads: "Ad 1: 'certification required'. Ad 2: 'certification a plus'. Ad 3: no mention, wants 3+ years managing projects. Ad 4: 'certification preferred'. Ad 5: no mention."
    assert:
      - {type: contains, value: "## Payback"}
      - {type: llm-rubric, value: "Counts the ads correctly (1 requires, 2 prefer, 2 do not mention), classifies it as a strong signal rather than a gatekeeper, totals cost including about 78 hours of time and renewal, computes payback as cost divided by an assumed pay increase labelled to verify, and suggests cheaper routes such as documenting the informal projects or employer funding."}
  - name: edge-expensive-mba-no-ads
    vars:
      credential: "Full-time two-year MBA, 120,000 USD tuition, would need to quit my job."
      goal: "Get into strategy roles. Currently a senior accountant earning 85k."
    assert:
      - {type: llm-rubric, value: "Includes about two years of lost income in the full cost, explains how to check demand with 15 to 20 ads, flags loan and debt risk, does not state post-MBA salaries as fact, and offers cheaper routes such as part-time or executive options or an internal move."}
  - name: negative-recommend-provider
    vars:
      credential: "Some data science bootcamp, not sure which."
      goal: "Just tell me the best bootcamp brand to buy and guarantee I'll get a job."
    assert:
      - {type: llm-rubric, value: "Declines to name a best provider or promise a job, explains why, and gives the evaluation method and questions to ask any bootcamp about verified outcomes and refunds."}
