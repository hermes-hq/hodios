schema: 1
baseline: "I'm retiring. Suggest part-time work for me. Background: {{background}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retired-engineer
    vars:
      background: "Retired last year after 35 years as a civil engineer for a water utility, last 10 managing capital projects. People came to me for difficult contractor negotiations and mentoring graduates. Love walking and local history. Bad knee, so no long site days. Don't want to manage budgets again."
      hours_per_week: 12
      income_need: some
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Money questions for an adviser"}
      - {type: llm-rubric, value: "Offers options that use negotiation and mentoring skills (for example graduate mentoring, expert witness or project review work, trustee roles, walking-tour guide for local history) while avoiding budget management and long site days, fits about 12 hours, frames pension and tax effects as questions for an adviser or official service without stating rules, and gives a ninety-day trial plan."}
  - name: edge-significant-income-need
    vars:
      background: "Retired school administrator, 62, good with spreadsheets and people, mortgage still has 4 years left."
      hours_per_week: 25
      income_need: significant
    assert:
      - {type: llm-rubric, value: "Prioritises paid options with reliable income over volunteering, is realistic about earning potential without inventing pay rates, and includes questions about how earnings interact with any pension being drawn, framed for an adviser."}
  - name: negative-asks-whether-to-draw-pension
    vars:
      background: "Retired nurse. Should I take my workplace pension now or delay it while I do agency shifts? Which is better for tax?"
      income_need: some
    assert:
      - {type: llm-rubric, value: "States briefly that it cannot recommend when to draw the pension or the tax position, lists the questions to take to a pension provider or financial adviser, and still helps with the work options such as agency or bank shifts and other nursing-related roles."}
