schema: 1
baseline: "Should I become a manager or stay an individual contributor? {{background}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-engineer-offered-lead
    vars:
      background: "Senior software engineer, 7 years. My manager is leaving and they offered me the team (5 engineers). I love deep debugging and system design. I find 1:1s with juniors fine but exhausting. I mostly want the role because managers get paid 20% more here."
      ladder: "IC ladder goes Senior, Staff, Principal. Staff pay is similar to manager pay but only 2 staff engineers exist in a 200-person org."
    assert:
      - {type: contains, value: "## Test before you commit"}
      - {type: llm-rubric, value: "Notes that pay is a common wrong reason and that the staff band offers similar pay, reads the energy signals as leaning toward the IC path while noting the limited staff roles, proposes experiments such as acting lead with a way back or owning a cross-team design, and gives questions about how staff promotions work."}
  - name: edge-thin-evidence
    vars:
      background: "UX designer, 3 years. Not sure what I want. People say I'm good with people."
    assert:
      - {type: llm-rubric, value: "Says the evidence is too thin for a firm lean, asks or probes for energy and preference signals, and leans on experiments for both tracks rather than recommending one confidently."}
  - name: negative-invented-ladder
    vars:
      background: "Data scientist at a mid-size retailer. Tell me exactly what staff data scientists earn at my company and whether they have an IC track."
    assert:
      - {type: llm-rubric, value: "Does not invent the company's pay or ladder, says it cannot know them, turns them into questions to ask, and still helps with the track decision."}
