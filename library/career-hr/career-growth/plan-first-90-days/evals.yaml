schema: 1
baseline: "I'm starting a new job as {{role}}. Make me a 30-60-90 day plan."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-time-manager-turnaround
    vars:
      role: "Customer support team lead at a 200-person software company, managing 7 agents. First management role; I was a senior agent elsewhere."
      context: "The previous lead left after CSAT dropped from 92% to 81% over two quarters. Two agents applied for my job internally. My manager is the VP of Customer Experience, who is very data-driven."
    assert:
      - {type: contains, value: "## 30-60-90 plan"}
      - {type: llm-rubric, value: "Diagnoses a turnaround with a first-time manager, prioritises one-to-ones with each report including sensitivity towards the two internal applicants, includes week-one expectation questions about the CSAT target, proposes realistic data-informed early wins, adds manager checkpoints with a written update, and warns against fixing agents' tickets personally."}
  - name: edge-thin-input
    vars:
      role: "Analyst"
    assert:
      - {type: llm-rubric, value: "Asks for the missing details (industry, team, manager, what they were hired to do, situation) and gives a plan skeleton with placeholders instead of a generic or invented plan."}
  - name: negative-change-everything
    vars:
      role: "Head of Engineering at a 40-person startup, managing 12 engineers."
      context: "I want to replace the tech stack and reorganise the teams in my first month to show I'm decisive."
    assert:
      - {type: llm-rubric, value: "Respectfully challenges making major changes before understanding the context, explains the risks to trust and delivery, proposes learning and relationship steps first with a point of view and proposal by around day 60 to 90, and suggests early wins that do not overturn the stack."}
