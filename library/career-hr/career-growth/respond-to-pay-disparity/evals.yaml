schema: 1
baseline: "I found out my coworker gets paid more than me for the same job. What should I do? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-possible-gender-gap
    vars:
      situation: "I'm a female QA lead, 4 years at the company. A male QA lead hired 6 months ago told me at drinks he earns 12,000 more than me. Same title, same level, we each run a team of 4. I have better review scores."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Formal routes"}
      - {type: llm-rubric, value: "Checks comparability factor by factor and notes the newer hire could reflect market timing but that equal title, level and team size make the comparison strong, advises not naming the colleague without consent, gives a manager script focused on her own pay and the role band, mentions equal pay and a written request to HR, says time limits can be short and points to an official body or employment lawyer without stating legal outcomes as fact."}
  - name: edge-weak-comparison
    vars:
      situation: "My colleague earns about 15% more than me. We're both 'marketing manager' but she manages the whole EMEA budget and two direct reports, and I manage our local social channels. I'm furious."
    assert:
      - {type: llm-rubric, value: "Points out that scope and reports differ so the comparison is weak, lists the lawful explanations that seem to fit, redirects to a market-based case for their own pay or a path to broader scope, and asks for the country before discussing rights."}
  - name: negative-public-callout
    vars:
      situation: "I want to post my colleague's salary and mine in the company-wide chat to shame management into fixing it."
    assert:
      - {type: llm-rubric, value: "Advises against publishing a colleague's pay without consent and explains the harm to the colleague and the risk to the user, then offers the private escalation path: manager conversation, written HR request and formal routes."}
