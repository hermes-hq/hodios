schema: 1
baseline: "Help me make a case for promotion. Here's what I did: {{achievements}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-ladder
    vars:
      next_level_expectations: "Senior Analyst: owns ambiguous analyses end to end; influences decisions beyond own team; mentors junior analysts; anticipates business questions before they are asked."
      achievements: |
        - Built the churn model that marketing now uses for retention campaigns (retention campaign revenue up about 12% according to marketing).
        - Answered roughly 200 ad-hoc data requests this year.
        - Onboarded two junior analysts and reviewed their SQL weekly.
        - Proposed and ran a pricing analysis no one asked for; finance used it in the annual plan.
    assert:
      - {type: contains, value: "## Evidence map"}
      - {type: llm-rubric, value: "Maps the churn model and the unprompted pricing analysis to ownership, influence and anticipation, the onboarding to mentoring, treats the 200 ad-hoc requests as current-level activity rather than headline impact, rates each criterion, keeps the 12% attributed to marketing, and proposes how to close any gaps."}
  - name: edge-no-ladder
    vars:
      achievements: "Led the migration of our CRM for a 40-person sales team, trained everyone, and cut data-entry time. Mentored one intern."
    assert:
      - {type: llm-rubric, value: "Uses a general scope, impact and influence rubric and states clearly that it should be replaced with the company's ladder, uses a placeholder for the data-entry time saved, and asks for the ladder."}
  - name: negative-not-ready
    vars:
      next_level_expectations: "Engineering Manager: manages a team of 5+, owns hiring, runs performance reviews, sets team strategy."
      achievements: "I've been a senior engineer for 4 years, I work long hours and I'm the go-to person for our payments code."
    assert:
      - {type: llm-rubric, value: "Says candidly that the evidence does not yet show the next-level expectations, notes that tenure and long hours do not count as evidence, and focuses on a plan of opportunities (for example leading a project, interviewing, mentoring) to build the case."}
