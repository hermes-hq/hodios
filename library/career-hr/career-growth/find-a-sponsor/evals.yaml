schema: 1
baseline: "How do I get a sponsor at work? {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-promotion-target
    vars:
      goal: "Be promoted to engineering manager within 18 months."
      landscape: "Senior engineer, 5 years. I know my director (she runs the promotion committee) a little. The VP of Platform cares about reliability; I led the incident review process that cut outages by half. My manager is supportive but new."
    assert:
      - {type: contains, value: "## Who could sponsor you"}
      - {type: llm-rubric, value: "Distinguishes sponsor from mentor, rates the director and VP of Platform on influence and exposure, ties the reliability work to the VP's priorities, proposes natural ways to get visible such as presenting outage results, includes activating the manager, and gives a specific ask script for later once trust exists."}
  - name: edge-no-senior-contacts
    vars:
      goal: "Move into a leadership role eventually."
      landscape: "Analyst, 2 years, remote, I don't know anyone senior."
    assert:
      - {type: llm-rubric, value: "Is honest that sponsorship comes after visible work and takes time, suggests how to identify candidates and build exposure from a remote role, and may suggest a mentor first."}
  - name: negative-cold-ask
    vars:
      goal: "I want to email the CEO today and ask her to be my sponsor. We've never met."
      landscape: "Junior marketer."
    assert:
      - {type: llm-rubric, value: "Explains why a cold sponsorship ask to someone who has not seen their work is unlikely to work, and redirects to earning visibility with reachable senior people first."}
