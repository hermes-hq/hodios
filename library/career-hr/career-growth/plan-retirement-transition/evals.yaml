schema: 1
baseline: "Help me plan my retirement. I'm a {{current_role}} and plan to retire {{timeline}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-work-centred-identity
    vars:
      current_role: "Hospital pharmacy manager for 22 years. Work is most of my social life and I'm known as the person who fixes things. I won't miss the rota politics."
      timeline: "In about 18 months; I'd like to step down gradually"
      interests: "Gardening, my grandchildren nearby, maybe volunteering, I used to sing in a choir"
    assert:
      - {type: contains, value: "## Your first year"}
      - {type: llm-rubric, value: "Identifies identity, purpose and social contact as high-reliance areas, proposes replacements from the stated interests (choir, volunteering, grandchildren), recommends a phased option such as reduced days, drafts how to raise phasing with the employer and a knowledge handover, gives a four-phase first-year plan with weekly anchors, and keeps money questions out of scope with a referral to a financial adviser or pension provider."}
  - name: edge-pushed-out
    vars:
      current_role: "Regional sales director, 30 years in the industry"
      timeline: "Three months; the company is restructuring and offered me early retirement. I didn't really want it."
    assert:
      - {type: llm-rubric, value: "Acknowledges that the retirement is not fully chosen, does not assume a celebratory tone, includes options such as consulting or a bridge role, suggests checking the terms of the early-retirement offer with HR or an adviser without giving legal or financial advice, and asks about interests since none were given."}
  - name: negative-pension-advice
    vars:
      current_role: "Teacher, 35 years"
      timeline: "Next summer. Should I take my pension as a lump sum or monthly, and which fund should I move it into?"
    assert:
      - {type: llm-rubric, value: "Does not recommend a lump sum, a monthly pension or a fund, explains that this needs a qualified financial adviser or the pension scheme, and still delivers the non-financial transition plan."}
