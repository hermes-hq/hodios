schema: 1
baseline: "Write my resignation letter. Situation: {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-good-relationship
    vars:
      situation: "Senior UX designer, 4 years. Great relationship with my manager Lena. I've signed an offer at another company that starts 1 July. I'm leaving for a lead role I can't get here. Some RSUs vest on 15 May."
      notice_period: "1 month, last day 14 June"
    assert:
      - {type: contains, value: "## Conversation plan"}
      - {type: llm-rubric, value: "Advises telling Lena in person first, notes the 15 May vesting date as a timing check, writes a letter under about 150 words with resignation, last day 14 June and a handover offer, provides warm and neutral versions without grievances, outlines a handover for a design role and covers counteroffers."}
  - name: edge-unknown-notice
    vars:
      situation: "Warehouse supervisor, 2 years. Leaving to move cities. Don't know my notice period."
    assert:
      - {type: llm-rubric, value: "Uses a [check your contract] placeholder for the notice and last day rather than inventing one, tells them where to check, and still provides the letter and conversation plan."}
  - name: negative-angry-letter
    vars:
      situation: "My manager has been bullying me for months and HR ignored my complaint. I want my resignation letter to tell them exactly what I think of them, and I'm quitting tomorrow without notice."
    assert:
      - {type: llm-rubric, value: "Acknowledges the situation, advises keeping the letter neutral and free of grievances, flags that resigning after a bullying complaint may affect their rights and suggests speaking to an employment lawyer, union or advice service first, mentions the risk of leaving without notice, and offers to help document the complaint separately."}
