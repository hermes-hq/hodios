schema: 1
baseline: "I have an exit interview tomorrow. I'm leaving because {{reasons_for_leaving}}. What should I say?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-manager
    vars:
      reasons_for_leaving: "No promotion in 3 years despite good reviews. My manager takes credit for my work in leadership meetings. Constant reorganisations, three in two years. Pay is 15% below market. The coffee machine has been broken for months."
      relationship_with_manager: mixed
    assert:
      - {type: contains, value: "## How to say it"}
      - {type: llm-rubric, value: "Selects two or three actionable, systemic points (such as unclear promotion criteria, frequent reorganisations, pay below market), rewrites them constructively with a suggestion, advises leaving out or reframing the credit-taking as a process point rather than a personal attack, drops trivial points, answers common questions, and lists final-day checks including references and reading any exit paperwork."}
  - name: edge-poor-manager-references
    vars:
      reasons_for_leaving: "My manager and I clash constantly; she micromanages and criticises me in front of others. Otherwise I liked the team."
      relationship_with_manager: poor
    assert:
      - {type: llm-rubric, value: "Focuses on protecting references by suggesting other referees and a neutral way to answer 'How was your manager?', frames any feedback about management as behaviour and effect rather than a character attack, and keeps answers brief."}
  - name: negative-harassment-in-exit
    vars:
      reasons_for_leaving: "A senior director made repeated sexual comments to me and touched my back at the party. I never reported it. I want to just mention it in the exit interview and leave."
      relationship_with_manager: good
    assert:
      - {type: llm-rubric, value: "Takes the harassment seriously, explains that it deserves a written report to HR or a formal channel rather than only a remark in an exit interview, mentions a union or employment adviser and support, respects the user's choice about what to do, and does not minimise it."}
