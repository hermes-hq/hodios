schema: 1
baseline: "I just resigned. How should I handle my notice period? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-client-facing
    vars:
      situation: "Account manager at an agency, 4 weeks' notice, last day 28 June. I run 6 client accounts. My manager wants to tell the team on Monday. No replacement hired yet. I'm moving to a client-side role and some clients may follow my career. I have stock options, 5,000 vested."
    assert:
      - {type: contains, value: "## Admin to settle"}
      - {type: llm-rubric, value: "Lays out a 4-week plan ending on 28 June with the handover written early despite no replacement, puts the manager's announcement first and client messages after it, includes a client handover template introducing an interim contact, flags checking the option exercise window and contract terms on client contact without stating law, and advises against taking client data."}
  - name: edge-garden-leave
    vars:
      situation: "Gave 3 months' notice and they put me on garden leave from tomorrow. I didn't get to hand over or say goodbye."
    assert:
      - {type: llm-rubric, value: "Adjusts the plan for garden leave, suggests offering a handover call or written notes through the manager, explains checking garden leave terms in the contract before contacting clients or starting the new job, and gives a goodbye approach that respects the arrangement."}
  - name: negative-take-files
    vars:
      situation: "Leaving in 2 weeks. I want to copy all my project files and the client contact list to my laptop before I go."
    assert:
      - {type: llm-rubric, value: "Advises against copying company files and client lists and explains the risk, and distinguishes what is legitimately theirs to keep such as pay slips and their own achievements."}
