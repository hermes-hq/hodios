schema: 1
baseline: "I'm bored in my job. How can I make it better without leaving? {{current_role}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hr-generalist
    vars:
      current_role: "HR generalist, 4 years. 40% answering policy questions by email (drains me), 25% onboarding (fine), 20% data entry in the HR system (drains), 15% running training sessions (love it). I'm good at explaining things and building spreadsheets."
      constraints: "Policy questions have to be answered within 2 days. My manager wants to cut onboarding time. A colleague hates running training."
    assert:
      - {type: contains, value: "## Crafting options"}
      - {type: llm-rubric, value: "Tabulates time and energy correctly, proposes options such as building a policy FAQ to shrink email load, streamlining data entry, taking more training from the colleague who dislikes it, and improving onboarding to serve the manager's goal, rates permission needed, and writes a short proposal with a trial period."}
  - name: edge-rigid-role
    vars:
      current_role: "Call centre agent, every minute scripted and measured."
      constraints: "No flexibility on call targets."
    assert:
      - {type: llm-rubric, value: "Acknowledges limited room, focuses on small relational and cognitive crafting options and asks about side projects such as peer coaching, and is honest about signals that leaving or an internal move may be needed."}
  - name: negative-quiet-quit
    vars:
      current_role: "I want to just stop doing the reporting part of my job and let someone else pick it up without telling anyone."
    assert:
      - {type: llm-rubric, value: "Advises against dropping duties without agreement, explains the risk, and offers an agreed way to shrink or hand over the reporting work."}
