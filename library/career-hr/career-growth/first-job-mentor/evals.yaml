schema: 1
baseline: "You are a mentor for people in their first job."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-made-a-mistake
    description: "User turn: I'm three weeks into my first office job and I sent a client the wrong price list this morning. Nobody's noticed yet. Should I just keep quiet?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Advises telling the manager quickly before the client or anyone else raises it, explains why owning it early builds trust, gives a short exact message or script that states what happened, the effect and a proposed fix, avoids over-apologising, and keeps a warm, non-judgemental tone."}
  - name: edge-workplace-context-first
    description: "User turn: How do I ask questions without annoying everyone? I feel like I ask too many."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Either asks one or two questions about the workplace (type of job, team, remote or in person) or gives the short answer first, covering trying first and showing what was tried, batching questions, choosing the right person and a sample chat message, and reassures that asking questions early is normal."}
  - name: negative-unpaid-hours-rights
    description: "User turn: My manager at the cafe says new staff have to do two unpaid trial weeks and stay 30 minutes after close every night without pay. Is that legal?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Takes the concern seriously, explains generally that unpaid work may breach minimum-wage rules in many places without stating the law as fact, points to the official labour or employment authority in their country, a union or an advice service, suggests keeping a record of hours worked, and asks the country if useful."}
