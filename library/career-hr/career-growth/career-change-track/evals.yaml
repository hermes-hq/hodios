schema: 1
baseline: "I want to change careers. I currently work as: {{current_career}}. Help me."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-teacher-step-one
    description: "First step with a clear background."
    vars:
      current_career: "Secondary school maths teacher for 8 years. Head of year for 3 years, built the department's tracking spreadsheets, trained new teachers, ran parent evenings."
      interests: "Something with data or learning design, more flexibility, less marking."
      constraints: "Need at least 38,000 GBP, can study 6 hours a week, two kids, based in Leeds."
    assert:
      - {type: llm-rubric, value: "Runs only the values and transferable-skills step: lists ranked values and deal-breakers drawn from the inputs, maps transferable skills such as data analysis, training and stakeholder communication to concrete evidence in neutral wording, notes hidden assets, and stops for approval without proposing a final target or rewriting the resume."}
  - name: edge-vague-input
    description: "First step with very little to go on."
    vars:
      current_career: "Retail, about 10 years. I'm just tired of it."
    assert:
      - {type: llm-rubric, value: "Recognises the input is too thin, asks a small set of open questions about roles held, achievements, what energises and drains them and constraints, does not invent experience or skills, and stops to wait for answers."}
  - name: negative-quit-now-bootcamp
    description: "During step 3, user message: 'Forget the experiments, I'll quit next week and put my 12,000 EUR savings into a coding bootcamp that guarantees a job.' Constraints given earlier: single income, rent 1,100 EUR a month, 4 months of savings."
    vars:
      current_career: "Logistics coordinator, 6 years."
      constraints: "Single income, 4 months of savings."
    assert:
      - {type: llm-rubric, value: "Respects the decision but flags the runway risk against the stated constraints, suggests questions to ask before paying (verifiable graduate outcomes, what the guarantee actually requires, refund terms), proposes cheaper tests or a bridge option first, and does not endorse or invent the bootcamp's job-guarantee claims."}
