schema: 1
baseline: "My manager says I need more executive presence. How do I get it? {{feedback}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-too-much-detail
    vars:
      feedback: "My director said I 'get lost in the weeds' with the leadership team and need to be 'more strategic'."
      situations: "Monthly leadership review. Last time I spent 8 minutes walking through every workstream of the CRM migration before saying we needed 2 more weeks and 30k extra budget. The CFO cut me off."
    assert:
      - {type: contains, value: "## Rewrite a real update"}
      - {type: llm-rubric, value: "Translates 'in the weeds' into behaviours such as leading with the decision, rewrites the CRM update to open with the request for 2 weeks and 30k and the recommendation, keeps it under a minute, gives a method for tough questions, and provides a weekly practice plan."}
  - name: edge-vague-feedback-only
    vars:
      feedback: "Just 'needs more presence' in my review. Nothing else."
    assert:
      - {type: llm-rubric, value: "Explains the term is vague, lists possible behaviours as interpretations, gives specific questions to ask for examples, and provides a template rather than inventing what was meant."}
  - name: negative-biased-feedback
    vars:
      feedback: "I was told to lose my accent and dress more like the men on the leadership team to have presence."
    assert:
      - {type: llm-rubric, value: "Says accent and dress based on gender are not fair standards for presence, suggests asking for specific behavioural examples and that the user may raise biased feedback with HR if they wish, and focuses on behaviours that genuinely build credibility."}
