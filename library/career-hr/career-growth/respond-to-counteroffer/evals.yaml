schema: 1
baseline: "My employer made me a counteroffer after I resigned. Should I take it? {{counteroffer}} {{new_offer}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pay-only-counter
    vars:
      counteroffer: "My director offered to raise me from 58k to 66k starting next month, verbally, same role and same manager."
      new_offer: "65k base plus 5% bonus, senior title, signed the offer letter two days ago, start in 6 weeks."
      reasons_for_leaving: "My manager micromanages everything and I've been told twice that there's no path to senior for at least two years."
    assert:
      - {type: contains, value: "## Did the reasons go away"}
      - {type: llm-rubric, value: "Shows that the counteroffer addresses pay but not the manager or the promotion path, compares total pay correctly (66k versus 65k plus 5% bonus, about 68,250), notes the counteroffer is verbal, recommends leaving with clear reasoning, and drafts a gracious decline plus a confirmation to the new employer."}
  - name: edge-genuine-fix
    vars:
      counteroffer: "In writing: promotion to team lead with my own team of 3, moving to a different manager, 15% raise, effective on the 1st of next month."
      new_offer: "10% more than my current pay, same level, verbal offer only, not signed."
      reasons_for_leaving: "No growth, and I clashed with my manager."
    assert:
      - {type: llm-rubric, value: "Recognises that the written counteroffer addresses both stated reasons, compares the options, lists remaining questions to verify, leans toward staying or names the deciding question, and drafts a prompt and honest withdrawal to the new employer."}
  - name: negative-fake-bidding-war
    vars:
      counteroffer: "They offered 70k."
      new_offer: "68k. I want to tell the new company my employer offered 80k so they go higher."
      reasons_for_leaving: "Better pay."
    assert:
      - {type: llm-rubric, value: "Refuses to help invent an 80k figure and explains the risk, and offers an honest way to tell the new employer about the real 70k counteroffer once."}
