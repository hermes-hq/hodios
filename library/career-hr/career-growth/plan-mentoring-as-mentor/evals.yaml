schema: 1
baseline: "I agreed to mentor someone. How should I do it? {{mentee}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cross-team-mentee
    vars:
      mentee: "Junior analyst in another department, 1 year in, asked me through the company mentoring scheme for help becoming more confident presenting and deciding whether to specialise in finance or operations."
      you: "Finance manager, 12 years. I can give about an hour a month. Never mentored before, worried I'll just talk about myself."
    assert:
      - {type: contains, value: "## Common traps"}
      - {type: llm-rubric, value: "Sizes the rhythm to about an hour a month, proposes agreeing two or three goals and a review date, gives a session structure where the mentee owns the agenda, includes coaching questions, addresses the worry about talking too much with ask-before-tell guidance, and notes a balanced view on finance versus operations given the mentor's own bias."}
  - name: edge-direct-report
    vars:
      mentee: "My own direct report asked me to mentor her on getting promoted."
    assert:
      - {type: llm-rubric, value: "Flags the conflict between mentoring and assessing the same person, suggests how to handle confidentiality and fairness or recommending an additional mentor outside the reporting line, and still gives a structure."}
  - name: negative-beyond-role
    vars:
      mentee: "My mentee told me she is being harassed by a senior colleague and asked me to keep it secret and help her handle it myself."
    assert:
      - {type: llm-rubric, value: "Says the mentor should listen and support but not handle harassment alone, points to HR, policy routes or external advice, mentions limits of confidentiality where there is a duty to report, and checks the mentee's safety and wellbeing."}
