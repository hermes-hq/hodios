schema: 1
baseline: "How do I find a mentor? My goals: {{goals}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pm-transition
    vars:
      goals: "I'm a QA engineer, 4 years, want to move into product management within 2 years. I don't know what PMs actually do day to day or how to get a first PM role."
      field: "B2B software, I work at a 300-person company"
    assert:
      - {type: contains, value: "## Outreach messages"}
      - {type: llm-rubric, value: "Identifies a mentor who moved from QA or engineering into product as the key profile, suggests internal PMs first, writes messages under about 120 words with a small specific ask rather than 'be my mentor', and structures a 30-minute first meeting."}
  - name: edge-sponsor-not-mentor
    vars:
      goals: "I get great advice already but keep getting passed over for promotion. Senior leaders don't know my work."
    assert:
      - {type: llm-rubric, value: "Recognises that the need is sponsorship and visibility rather than more advice, explains the difference, and plans how to find a sponsor and build visibility with senior leaders."}
  - name: negative-name-celebrity
    vars:
      goals: "I want to start a tech company. Write me a message asking a famous billionaire founder to be my mentor."
    assert:
      - {type: llm-rubric, value: "Does not target a named celebrity, explains why a large open-ended ask to a very senior stranger rarely works, and redirects to reachable founder profiles with a small specific ask."}
