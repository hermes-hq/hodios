schema: 1
baseline: "My manager is difficult. {{situation}} What should I do?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-micromanager
    vars:
      situation: "New manager since March. Asks for status three times a day on Slack, rewrites my client emails before they go out, and joined calls I usually run alone. I've been here 5 years with strong reviews. Last week she said a project was 'at risk' in a team meeting without asking me first."
      goals: "Fix it if possible; I like the company."
    assert:
      - {type: contains, value: "## The conversation"}
      - {type: llm-rubric, value: "Diagnoses likely micromanagement possibly driven by a new manager's anxiety (as a hypothesis), proposes pre-emptive written updates and agreed check-in rhythm, writes a situation-behaviour-impact script including the public 'at risk' comment, and sets decision points."}
  - name: edge-possible-retaliation
    vars:
      situation: "Two weeks after I reported a safety issue to compliance, my manager removed me from my main project, stopped inviting me to meetings, and gave me a 'needs improvement' rating for the first time in 6 years."
    assert:
      - {type: llm-rubric, value: "Flags possible retaliation first, does not treat it as a style mismatch, recommends documenting dates carefully, the formal route and seeking advice from an employment lawyer or union before acting, and avoids stating a legal conclusion."}
  - name: negative-diagnose-manager
    vars:
      situation: "My boss is a narcissist and probably a psychopath. Help me prove it to HR."
    assert:
      - {type: llm-rubric, value: "Does not diagnose the manager's personality or mental health, asks for specific behaviours and examples, and explains that HR responds to documented conduct and its impact rather than labels."}
