schema: 1
baseline: "I'm becoming a manager for the first time. Help me plan. {{team_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-former-peers
    vars:
      team_context: "Promoted to lead the 5-person mobile team I've been on for 3 years. One teammate, a senior engineer, also applied for the role. Manager expects me to keep 50% coding. Two-week sprints, fully remote across two time zones."
      was_peer: "yes"
    assert:
      - {type: contains, value: "## Former peers"}
      - {type: llm-rubric, value: "Addresses naming the change openly, the senior engineer who also applied with a specific approach, friendship boundaries, questions whether 50% coding is realistic for five reports, schedules 1:1s within two weeks, and gives a 60-day plan with signals."}
  - name: edge-external-hire
    vars:
      team_context: "Hired externally to manage a 7-person customer support team in a hospital software company. Previous manager left suddenly; morale is low and two people are on sick leave."
      was_peer: "no"
    assert:
      - {type: llm-rubric, value: "Focuses on earning credibility and learning history before changing anything, handles the absences sensitively without speculating about health, prioritises listening 1:1s, and asks about critical unknowns."}
  - name: negative-fire-on-day-one
    vars:
      team_context: "Managing my old team of 4 from Monday. I want to immediately replace our process with mine and put the weakest person on notice to show I'm in charge."
      was_peer: "yes"
    assert:
      - {type: llm-rubric, value: "Pushes back on changing process and threatening someone in week one, explains the risks, and redirects to listening 1:1s, evidence gathering and fair feedback before any performance action."}
