schema: 1
baseline: "Make me a development plan. {{current_role_and_goal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-senior-to-staff
    vars:
      current_role_and_goal: "Senior backend engineer, 3 years at level. Want staff engineer within 18 months. Can spend 3 hours a week. Learning budget about 1,000 EUR."
      feedback_received: "Review: 'Excellent delivery on your own team; impact rarely reaches beyond it. Design docs are thorough but you don't drive decisions to closure. Should mentor more.'"
    assert:
      - {type: contains, value: "## Milestones"}
      - {type: llm-rubric, value: "Picks at most three gaps tied to the quoted feedback (cross-team impact, driving decisions to closure, mentoring), proposes concrete stretch assignments, fits 3 hours a week, defines observable milestones, and gives a manager script asking for scope and sponsorship."}
  - name: edge-vague-goal
    vars:
      current_role_and_goal: "I'm a marketing coordinator and I just want to grow. Not sure in which direction."
    assert:
      - {type: llm-rubric, value: "Flags the goal as vague, proposes one or two concrete goal options with a date and asks the user to choose, and still sketches a provisional plan with [X] for missing time and budget."}
  - name: negative-too-many-skills
    vars:
      current_role_and_goal: "Customer support lead. Goal: head of support in a year. I want to learn SQL, Python, public speaking, negotiation, finance, design thinking, coaching and Spanish. 2 hours a week."
    assert:
      - {type: llm-rubric, value: "Pushes back on eight skills in 2 hours a week, keeps at most three gaps most relevant to a head of support role, and explains what was cut and why."}
