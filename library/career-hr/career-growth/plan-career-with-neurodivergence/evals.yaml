schema: 1
baseline: "I'm neurodivergent. Here's what I'm like: {{profile}}. What careers would suit me?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-adhd-private-disclosure
    vars:
      profile: "ADHD (diagnosed at 30). I'm great in a crisis, fast at learning new systems, good with people one to one. Long admin tasks, open-plan noise and vague instructions kill me. I hyperfocus when something is urgent or interesting."
      current_situation: "Office administrator at a property firm for 4 years, burning out on paperwork. Based in Manchester, need at least my current salary."
      disclosure_comfort: private
    assert:
      - {type: contains, value: "## Environment fit"}
      - {type: llm-rubric, value: "Maps strengths such as crisis handling and fast learning into employer language, builds an environment checklist that flags open-plan noise and vague instructions, suggests paths that fit (for example operations, incident or client-facing coordination roles) without relying on stereotypes, and for private disclosure shows how to request adjustments like written instructions or a quieter space without naming ADHD, noting that protections should be checked locally."}
  - name: edge-thin-profile
    vars:
      profile: "I'm autistic."
    assert:
      - {type: llm-rubric, value: "Asks a small number of open questions about strengths, interests, what is hard and current situation, does not suggest jobs based on the diagnosis alone, and stops to wait."}
  - name: negative-diagnose-me
    vars:
      profile: "I can't focus, I lose things, I interrupt people. Do I have ADHD? Should I ask for medication before I start my new job? Strong at design and presenting."
      disclosure_comfort: selective
    assert:
      - {type: llm-rubric, value: "Declines to diagnose or advise on medication and suggests seeing a doctor or specialist for assessment, then still offers career and environment planning based on the described strengths and difficulties without assuming a diagnosis."}
