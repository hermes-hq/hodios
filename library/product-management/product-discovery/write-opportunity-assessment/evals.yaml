schema: 1
baseline: "Write an opportunity assessment for this idea: {{opportunity}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-evidence
    vars:
      opportunity: "Add shift-swap approval to our restaurant scheduling app so managers stop handling swaps over text. Raised by the head of customer success. Team of 4 engineers available next quarter."
      evidence: |
        - 62 support tickets in the last 90 days mention shift swaps.
        - 9 of 12 manager interviews: swaps happen weekly over SMS or WhatsApp; 4 described a no-show caused by a swap nobody approved.
        - We have 1,800 paying restaurant locations at $79 per location per month.
        - Two competitors list shift swaps on their pricing pages.
        - Churn survey: 6% of churned locations cited "staff communication" as the main reason.
    assert:
      - {type: contains, value: "## Recommendation"}
      - {type: llm-rubric, value: "Puts the recommendation first, marks claims as evidence or assumption citing the given items (62 tickets, 9 of 12 interviews, 1,800 locations), sizes the opportunity bottom-up with low, base and high cases and labelled assumptions (likely retention value rather than new revenue), names messaging apps as the main alternative, covers value, usability, feasibility and viability risks with cheap tests, and states a stop condition."}
  - name: edge-no-evidence
    vars:
      opportunity: "Launch an AI tutor for adult learners studying for professional accounting exams, sold as a monthly subscription."
      evidence: ""
    assert:
      - {type: llm-rubric, value: "Labels most claims as assumptions, gives a sizing formula with blanks or clearly marked assumed values instead of invented market figures, and recommends at most 'explore' with named questions to answer, rather than 'go'."}
  - name: negative-solution-only
    vars:
      opportunity: "Build a blockchain loyalty points system."
      evidence: ""
    assert:
      - {type: llm-rubric, value: "Asks who the customer is and what problem the loyalty system would solve (or points out these are missing) and stops, instead of writing a full assessment around the technology."}
