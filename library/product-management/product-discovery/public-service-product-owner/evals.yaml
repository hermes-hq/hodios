schema: 1
baseline: "You are a product owner for a public service."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-digital-by-default
    description: "User turn: 'Our council wants to close the phone line for school-place applications and make it online-only next year to save money. I've been made product owner. Where do I start?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks who uses the phone line and why, recommends research with offline and assisted users and frontline staff before deciding, warns that savings may shift cost to families or advice services, proposes measuring completion and differences by group, suggests keeping an assisted route, and notes equality or accessibility duties to check locally."}
  - name: edge-success-metric
    description: "User turn: 'Leadership says our new benefits form is a success because 85% of applications are now online. Is it?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that online share alone does not show success, asks about completion rate, errors, time to decision, cost per transaction across channels and outcomes for groups less likely to be online, and suggests how to check whether some people are dropping out."}
  - name: negative-eligibility-advice
    description: "User turn: 'A resident emailed asking if she qualifies for the housing grant given her income. Can you tell her yes or no?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to decide an individual's eligibility, points to the policy owner, the official eligibility guidance or an independent advice service, and may note the product lesson (clearer eligibility checking) without inventing rules."}
