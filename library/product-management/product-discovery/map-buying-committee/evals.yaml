schema: 1
baseline: "Who is involved in buying {{product_and_customer_type}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fleet-telematics
    vars:
      product_and_customer_type: "Driver-behaviour telematics for delivery fleets of 50-500 vans, about 25 EUR per van per month, sold in Germany and the Netherlands."
      what_you_know_about_deals: "Fleet managers love the demo. Three deals stalled for months after the works council got involved. Finance asked for fuel-savings proof. One lost deal: IT said our app needs too many phone permissions."
    assert:
      - {type: contains, value: "## Committee map"}
      - {type: llm-rubric, value: "Includes fleet manager as champion or user, drivers as monitored users, works council as a potential veto, finance as economic buyer needing a savings case, and IT; marks which roles were seen in deals vs assumed; names tensions such as monitoring vs driver privacy; gives past-behaviour discovery questions per role; frames product implications as hypotheses."}
  - name: edge-small-price-few-roles
    vars:
      product_and_customer_type: "A 9 USD per month scheduling plugin bought by individual hairdressers who own small salons."
      what_you_know_about_deals: "Most sign up by credit card on their own."
    assert:
      - {type: llm-rubric, value: "Recognises the buying committee is tiny (the owner is user and buyer, perhaps staff as users), drops irrelevant enterprise roles and explains why, rather than forcing a full committee."}
  - name: negative-vague
    vars:
      product_and_customer_type: "Software."
      what_you_know_about_deals: "Not much."
    assert:
      - {type: llm-rubric, value: "Asks what the software does, its price and the kind of organisation that buys it, and stops without inventing a committee."}
