schema: 1
baseline: "Write up these discovery findings for leadership. Decision: {{decision_needed}}. Findings: {{findings_and_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-exec-readout
    vars:
      findings_and_notes: "3 weeks, 11 interviews with HR managers at 50-300 person firms, 1 fake-door test. 8 of 11 run onboarding from a spreadsheet checklist; 6 mentioned IT access delays on day one as the worst moment. 2 said they'd pay for a tool. Fake door on our HR suite: 3.1% click-through vs 2% pass mark set beforehand, 41 clicks. One CHRO said 'this is the biggest problem we have'."
      decision_needed: "Fund a 2-person squad for one quarter to build an onboarding module, decision at the 14 Nov leadership meeting."
      audience: executives
    assert:
      - {type: contains, value: "## Decision asked"}
      - {type: llm-rubric, value: "Puts the decision and recommendation first, separates observations with counts (8 of 11, 6 of 11) from interpretations, grades the fake-door result as stronger evidence and the 2 who'd pay and the CHRO quote as weak, lists unknowns such as willingness to pay, and gives options including a smaller or stop option with risks."}
  - name: edge-board-audience-contradiction
    vars:
      findings_and_notes: "Food bank client survey: 60% want evening opening. But in 9 interviews, 7 said Saturday mornings matter more. Volunteers say evenings are hard to staff."
      decision_needed: "Board to choose whether to change opening hours next quarter."
      audience: funders-or-board
    assert:
      - {type: llm-rubric, value: "Shows the contradiction between survey and interviews rather than smoothing it, notes volunteer capacity as a constraint, offers options such as a short trial of each, and frames for a board audience."}
  - name: negative-no-findings
    vars:
      findings_and_notes: "We talked to some people, it went well."
      decision_needed: "Approve the build."
      audience: executives
    assert:
      - {type: llm-rubric, value: "States the findings are too thin to support a recommendation, asks for the notes, counts and methods, and does not invent findings or quotes."}
