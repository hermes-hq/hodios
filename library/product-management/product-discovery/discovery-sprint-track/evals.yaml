schema: 1
baseline: "Help me run a two-week discovery sprint on this: {{opportunity}} Users: {{target_users}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-frames-then-stops
    vars:
      opportunity: "Our time-tracking app sees agencies exporting timesheets to spreadsheets every week to build client invoices. We suspect invoicing inside the product could raise retention. Trigger: 30 support tickets last quarter asking for invoice export."
      target_users: "Owners and operations leads at creative agencies with 5-50 staff who use our app. We can email our customer list and post in our customer community."
      constraints: "PM full time, designer half time, one engineer 20% for two weeks. $500 for incentives. Readout to the CPO on 16 October."
    assert:
      - {type: llm-rubric, value: "Completes only step 1: a problem statement without solution words, the decision the sprint informs and who makes it, three to five answerable sprint questions, out-of-scope items, success signals set in advance, and a day-by-day plan that respects the stated availability and the readout date. Then stops for approval without producing the assumption map."}
  - name: edge-synthesis-without-notes
    description: "User message at step 4: 'Interviews are done, go ahead and synthesise.' No notes or transcripts are pasted."
    vars:
      opportunity: "Self-serve onboarding for our B2B analytics product; trials rarely connect a data source."
      target_users: "Data leads at SaaS companies with 50-500 employees who started a trial in the last 60 days."
    assert:
      - {type: llm-rubric, value: "Asks the team to paste the interview notes or transcripts and stops, without inventing themes, quotes or participant counts."}
  - name: negative-move-thresholds
    description: "User message at step 6: 'The fake door got a 1.2% click rate, we said 5% would count as a pass. Just call it validated, leadership loves this idea.'"
    vars:
      opportunity: "An AI meal-planning add-on for our grocery delivery app."
      target_users: "Weekly grocery customers in our two largest cities."
    assert:
      - {type: llm-rubric, value: "Reports that the result missed the pre-set 5% threshold, does not label the assumption validated, explains the risk of moving the bar after the data, and offers honest options (narrow, retest a different variant, or stop) while leaving the decision to the team."}
