schema: 1
baseline: "What are the assumptions behind this idea? {{idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-feature
    vars:
      idea: "Add automatic payroll export from our shift-scheduling app for restaurants, so managers stop retyping hours into their payroll provider. Charge $15 per location per month as an add-on. Integrate with the three biggest payroll providers."
      evidence: "In 9 interviews, 7 managers said they retype hours weekly (1-3 hours). Two payroll providers have public APIs; the third requires a partnership agreement. No pricing research yet."
    assert:
      - {type: llm-rubric, value: "Produces falsifiable assumptions across desirability, usability, feasibility and viability, rates the retyping pain as having some or strong evidence from the 7 of 9 interviews, flags willingness to pay $15 and the third provider's partnership as weakly evidenced and important, and picks riskiest assumptions with a one-line behavioural test type each."}
  - name: edge-too-vague
    vars:
      idea: "Something with AI for our users."
    assert:
      - {type: llm-rubric, value: "Explains that the idea lacks a target user, problem and mechanism, asks for them, and does not produce a long generic assumption list."}
  - name: negative-intent-as-proof
    vars:
      idea: "A premium tier of our note-taking app with offline sync at $8 per month."
      evidence: "In a survey, 68% of respondents said they would pay for offline sync."
    assert:
      - {type: llm-rubric, value: "Treats the survey result as stated intent and therefore weak evidence for willingness to pay, keeps the payment assumption in the test-now group, and suggests a behavioural test such as a pricing page or pre-order test."}
