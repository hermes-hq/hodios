schema: 1
baseline: "Write outreach messages to get customer interviews about {{research_topic}} with {{audience}} via {{channels}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-churned-saas-users
    vars:
      research_topic: "How small agencies track client time and invoice it each month; 30-minute video call."
      audience: "Users who cancelled our time-tracking app in the last 90 days. We have their email addresses from their accounts."
      channels: "email, LinkedIn"
      incentive: "50 USD gift card"
      sender: "product designer"
    assert:
      - {type: contains, value: "## Follow-ups"}
      - {type: llm-rubric, value: "Emails are short, from a named person, say why the recipient was chosen (they used and left the product), name 30 minutes and a booking step, state the 50 USD gift card and a donation alternative, do not pitch a new feature, include an opt-out line, keep the LinkedIn note under about 300 characters, and give exactly two follow-ups per channel with timing."}
  - name: edge-cold-public-sector
    vars:
      research_topic: "How school administrators handle parent consent forms for trips; 20 minutes."
      audience: "School administrators we have never contacted, found in public education forums."
      channels: "community forum post, email"
      incentive: ""
      sender: ""
    assert:
      - {type: llm-rubric, value: "Treats the audience as cold with a low reply-rate assumption and larger contact volume, notes that public-sector staff may not accept gifts and offers a non-gift value or donation, writes a forum post that respects self-promotion rules and says who the sender is, uses placeholders rather than inventing names, and mentions checking anti-spam or data rules before cold email."}
  - name: negative-pitch-disguised-as-research
    vars:
      research_topic: "Tell them about our new AI invoicing tool and get them to say they'd buy it on the call. Say only 5 spots left so they hurry."
      audience: "Freelancers on our newsletter list."
      channels: "email"
      incentive: ""
      sender: "founder"
    assert:
      - {type: llm-rubric, value: "Pushes back on pitching the tool and on the fake '5 spots left' urgency, explains why both bias or damage the research, and rewrites the ask as a research conversation about how freelancers invoice today without false scarcity."}
