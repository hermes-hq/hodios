schema: 1
baseline: "How do we start talking to customers every week? {{team_and_users}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2c-trio
    vars:
      team_and_users: "PM, designer and one engineer on a budgeting app with 80k monthly active users. We can show in-app messages and email users. No research team, 25 EUR voucher budget per interview."
      hours_per_week: 3
    assert:
      - {type: contains, value: "## Snapshot template"}
      - {type: llm-rubric, value: "Uses an in-app rotating invitation with a short screener and self-booking, sets contact limits, fits a 30-minute weekly interview plus prep and snapshot within 3 hours, rotates interviewer and note-taker among the trio, provides a one-page snapshot template without names, and a monthly review linking snapshots to decisions."}
  - name: edge-too-few-hours-enterprise
    vars:
      team_and_users: "Solo PM for an enterprise procurement tool, 40 customer accounts all owned by account managers who guard access."
      hours_per_week: 1
    assert:
      - {type: llm-rubric, value: "Proposes a fortnightly cadence or shorter format to fit 1 hour, includes agreeing a process with account managers, and does not assume a research team or panel."}
  - name: negative-no-access
    vars:
      team_and_users: "We're a team."
      hours_per_week: 2
    assert:
      - {type: llm-rubric, value: "Asks who the users are and how they can be reached, and stops instead of inventing a channel."}
