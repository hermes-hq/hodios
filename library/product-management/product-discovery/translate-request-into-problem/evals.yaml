schema: 1
baseline: "Someone asked us for this: {{request}}. How should we build it?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dashboard-request
    vars:
      request: "From the Head of Customer Service: 'We need a real-time dashboard showing every open complaint, by category and agent, on the big screen in the office. Can IT have it by end of month?'"
      requester_and_context: "She reports to the COO, who asked last week why complaint response times went up. We already have complaint data in the CRM."
    assert:
      - {type: contains, value: "## Possible solutions"}
      - {type: llm-rubric, value: "Lists assumptions in the request, asks about the trigger (the COO's question on response times) and how the dashboard would change decisions, frames the problem around response times with [to confirm] markers, proposes lighter options such as an existing CRM report or a weekly review alongside the build, and drafts a warm reply that neither promises nor refuses the dashboard."}
  - name: edge-compliance-request
    vars:
      request: "Legal says we must add a consent checkbox and record consent for marketing emails on the sign-up form by 1 March."
      requester_and_context: ""
    assert:
      - {type: llm-rubric, value: "Recognises this as a compliance obligation and does not question whether to do it, instead focusing on how to meet it well (what to record, where, testing with users) and questions to confirm with legal."}
  - name: negative-just-build-it
    vars:
      request: "Build an app."
      requester_and_context: "The CEO said so. No other details."
    assert:
      - {type: llm-rubric, value: "Does not invent a problem or app requirements; marks the problem framing as almost entirely to confirm, provides respectful trigger and outcome questions for the CEO, and a short reply asking for a conversation."}
