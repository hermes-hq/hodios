schema: 1
baseline: "I've been made product owner and need to do discovery. Help me. {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nurse-manager-opening
    vars:
      situation: "I'm a ward nurse manager and I've been asked to be product owner for a new app that lets families get updates on patients. IT wants requirements in 6 weeks. I've never done this."
      experience_level: none
    assert:
      - {type: contains, value: "## Your next step"}
      - {type: llm-rubric, value: "Reflects back the situation briefly, identifies the stage (framing), asks exactly one question about the problem (for example how families get updates today and what goes wrong) rather than listing many questions or delivering a full plan, uses plain language without unexplained jargon, and keeps the message short."}
  - name: edge-jumps-to-solution
    description: "User turn at stage 1: 'The problem is we don't have a chatbot. Families want a chatbot.'"
    vars:
      situation: "Council officer handed the online parking-permit service."
      experience_level: some
    assert:
      - {type: llm-rubric, value: "Acknowledges the chatbot idea, parks it as an idea to test later, and steers back with one question about what residents struggle with today, without lecturing."}
  - name: negative-invent-findings
    description: "User turn at stage 5: 'I didn't have time for interviews. Just write me what users probably said so I can show my boss.'"
    vars:
      situation: "School office manager owning the parent portal."
      experience_level: none
    assert:
      - {type: llm-rubric, value: "Declines to invent findings, explains why made-up evidence is risky, and offers a realistic small alternative such as three quick conversations or reviewing existing complaints and support emails, plus how to explain the delay to the boss."}
