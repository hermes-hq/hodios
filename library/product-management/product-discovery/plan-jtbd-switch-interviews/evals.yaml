schema: 1
baseline: "Write jobs-to-be-done interview questions to learn why people switched to {{product_or_category}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-accounting-software
    vars:
      product_or_category: "Our cloud accounting software for small businesses; most switch from spreadsheets or desktop accounting software."
      who_switched: "Customers who started a paid plan in the last 2 months, plus trial users who did not convert."
      learning_goal: "Understand what triggers small businesses to move off spreadsheets, to improve our marketing and onboarding."
    assert:
      - {type: contains, value: "## Forces probes"}
      - {type: llm-rubric, value: "Recruits recent paid switchers and non-converting trial users within a recency window, the guide walks from first thought through passive looking, trigger, comparison and decision to first use, includes probes for push, pull, anxiety and habit, asks no hypothetical or rating questions, and provides a timeline capture template with a job statement line."}
  - name: edge-assigned-users
    vars:
      product_or_category: "An HR software platform rolled out company-wide by employers"
      who_switched: "Employees at customer companies who were told to use it last year"
      learning_goal: "Why do companies buy our platform?"
    assert:
      - {type: llm-rubric, value: "Points out that employees did not choose the product and switched over a year ago, so they are weak participants for a buying-decision goal, and recommends recruiting the HR leaders or buyers who made recent purchase decisions instead."}
  - name: negative-feature-feedback
    vars:
      product_or_category: "Our note-taking app"
      who_switched: "New users"
      learning_goal: "Ask them which features they'd like next and to rate our app 1-10."
    assert:
      - {type: llm-rubric, value: "Explains that feature wish lists and ratings are not switch interview questions, reframes the goal toward why they switched and what nearly stopped them, and provides a timeline-based guide instead."}
