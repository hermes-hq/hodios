schema: 1
baseline: "Make a value proposition canvas for {{product}} for {{customer_segment}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-evidence
    vars:
      customer_segment: "Independent physiotherapists running a one-person clinic who see 25 to 40 patients a week."
      product: "Practice app with online booking, automated SMS reminders, exercise programme builder with videos, invoicing and insurance claim export."
      evidence: "8 interviews: 7 of 8 said no-shows cost them most ('an empty slot is money I never get back'); 5 do invoicing on Sunday evenings; 6 send exercises as photocopied sheets and say patients lose them; 2 mentioned insurance claims as painful; none mentioned wanting a patient community feature."
    assert:
      - {type: contains, value: "## Fit analysis"}
      - {type: llm-rubric, value: "Ranks no-shows as the top pain with the interview evidence and the exact quote, maps SMS reminders and online booking to it, maps the exercise builder to the lost-sheets pain and invoicing to Sunday admin, marks items without evidence as assumptions, identifies any gaps honestly, and proposes cheap tests for the riskiest assumptions without inventing data."}
  - name: edge-no-evidence
    vars:
      customer_segment: "Parents of children with food allergies who pack school lunches."
      product: "Meal-planning app that flags allergens in recipes and generates shopping lists."
      evidence: ""
    assert:
      - {type: llm-rubric, value: "Builds the canvas but marks every customer item as an assumption, explicitly frames the whole canvas as hypotheses, and puts weight on tests to run (for example interviews about past lunch-packing experiences)."}
  - name: negative-everyone
    vars:
      customer_segment: "Everyone who eats food."
      product: "Meal-planning app."
      evidence: ""
    assert:
      - {type: llm-rubric, value: "Asks the user to choose one specific segment, suggests two or three possible segments, and stops rather than mapping a canvas for everyone."}
