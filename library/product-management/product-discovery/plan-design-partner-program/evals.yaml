schema: 1
baseline: "Help me set up a design partner program for {{product}} targeting {{target_customer}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-compliance-tool
    vars:
      product: "Early prototype of a tool that tracks supplier compliance documents (certificates, insurance) and chases expiries. We plan to build integrations with procurement systems over the next months."
      target_customer: "Mid-size manufacturers, 200-2,000 employees; users are procurement coordinators, buyer is head of procurement"
      partner_count: 6
      duration_months: 4
    assert:
      - {type: contains, value: "## Give and get"}
      - {type: llm-rubric, value: "Criteria require a named sponsor plus daily procurement coordinators and flag custom-build requests as red flags, the pitch states time commitment and does not promise features, the give-and-get includes real data and a reference in exchange for influence and a placeholder discount, conversion terms are agreed in advance, feedback decisions rely on patterns across partners, and legal review of data sharing is recommended."}
  - name: edge-one-giant-partner
    vars:
      product: "Fleet maintenance scheduling software, nothing built yet."
      target_customer: "Regional trucking companies with 20-200 trucks"
      partner_count: 3
      duration_months: 6
    assert:
      - {type: llm-rubric, value: "Warns against letting one partner dominate, ensures partners match the 20-200 truck profile rather than one very large fleet, and gives a disengagement rule and exit criteria."}
  - name: negative-consumer-app
    vars:
      product: "A meditation app for individuals."
      target_customer: "Anyone stressed"
      partner_count: 50
      duration_months: 12
    assert:
      - {type: llm-rubric, value: "Says a design partner programme is a B2B pattern and the target customer is too vague, and suggests alternatives such as a beta group or co-design sessions instead of forcing the full programme."}
