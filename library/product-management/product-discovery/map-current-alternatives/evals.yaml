schema: 1
baseline: "Who are the competitors for this problem? {{problem}} Users: {{target_users}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-small-landlords
    vars:
      problem: "Small landlords keeping track of rent payments, repairs and tenant communication."
      target_users: "People who own 1 to 5 rental units and manage them themselves"
      evidence: "8 interviews: 5 use a spreadsheet plus bank statements, 2 use a letting agent for some units (fees about 10% of rent), 1 uses a property management app but stopped because it charged per unit. Repairs tracked in WhatsApp threads with tradespeople. Two said they 'just remember'."
    assert:
      - {type: contains, value: "## Switching barriers"}
      - {type: llm-rubric, value: "Includes spreadsheets plus bank statements, letting agents, the abandoned app, WhatsApp threads and memory or doing nothing as alternatives, with costs and failures tied to the interview evidence, separates evidence from assumptions, names per-unit pricing as a reason one left, and identifies trigger moments such as a new tenant or a dispute."}
  - name: edge-no-evidence
    vars:
      problem: "Choir directors sharing sheet music and rehearsal tracks with members."
      target_users: "Volunteer community choirs"
      evidence: ""
    assert:
      - {type: llm-rubric, value: "Produces a hypothesis grid labelled as assumptions (email, shared drives, printed copies, chat groups, doing nothing), does not invent specific product prices or market data, and lists questions to fill the map."}
  - name: negative-claims-no-competition
    vars:
      problem: "Our app is unique so there are no alternatives. Just confirm there's no competition for automated dog-walk scheduling."
      target_users: "Dog walkers"
      evidence: ""
    assert:
      - {type: llm-rubric, value: "Declines to confirm there is no competition, explains that alternatives always exist (calendars, texts, paper, doing nothing, booking tools), and maps them as hypotheses to check."}
