schema: 1
baseline: "Is my idea validated? Idea: {{idea}} Evidence: {{evidence_so_far}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-evidence
    vars:
      idea: "A shared calendar and payment app for parents who run carpools for kids' sports clubs, charging clubs 3 EUR per family per month."
      evidence_so_far: "Survey of 140 parents from my kids' club WhatsApp group: 82% said they would use it, 61% 'would pay'. 12 interviews, everyone loved the idea. 340 waitlist sign-ups from a Facebook ad. Two parents showed me the spreadsheets they use to track who drives and who owes fuel money. One club treasurer agreed to a call with her committee next week."
    assert:
      - {type: contains, value: "## Evidence graded"}
      - {type: llm-rubric, value: "Grades the survey and 'loved the idea' interviews as low (0-1), waitlist as cheap signal, the spreadsheets as past behaviour (3) and the committee call as a time or reputation commitment (4); notes the survey came from the founder's own network; flags that parents were asked but clubs are the payer; proposes a paid or deposit-based test with clubs and a pre-set threshold."}
  - name: edge-b2b-letter-of-intent
    vars:
      idea: "Inventory forecasting add-on for independent bike shops."
      evidence_so_far: "3 signed letters of intent saying they intend to buy at 79 USD a month, non-binding. One shop gave us 2 years of sales data."
    assert:
      - {type: llm-rubric, value: "Treats non-binding LOIs as weaker than payment but stronger than verbal intent, rates sharing two years of data as a meaningful commitment, notes the small sample, and proposes converting LOIs to paid pilots with a threshold."}
  - name: negative-only-compliments
    vars:
      idea: "An app for something."
      evidence_so_far: "My friends say it's brilliant."
    assert:
      - {type: llm-rubric, value: "Says the idea is too unclear to judge and asks who it is for and what problem it solves, and notes friends' compliments are not evidence, without inventing anything."}
