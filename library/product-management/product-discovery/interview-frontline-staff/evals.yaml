schema: 1
baseline: "Write interview questions for staff about this change: {{change_being_considered}}. Staff: {{roles_and_setting}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-warehouse-pickers
    vars:
      roles_and_setting: "Pickers and packers at a 24/7 e-commerce warehouse, three 8-hour shifts, handheld scanners plus a printed exceptions sheet. About 60% agency staff."
      change_being_considered: "Replacing the handheld scanner app with a voice-picking system. Operations director wants a go/no-go in six weeks."
      session_length_minutes: 30
    assert:
      - {type: contains, value: "## Interview guide"}
      - {type: llm-rubric, value: "Asks managers not to attend or hand-pick participants, samples across shifts and agency vs permanent staff, avoids shift start and peak periods, asks about the last real pick that went wrong and the printed exceptions sheet, does not ask whether they would like voice picking, and fits a 30-minute plan."}
  - name: edge-very-short-sessions-clinic
    vars:
      roles_and_setting: "Receptionists at three GP clinics; phones never stop; they can spare 10 minutes at most."
      change_being_considered: "A new online booking system that may change how they triage appointment requests."
      session_length_minutes: 10
    assert:
      - {type: llm-rubric, value: "Recognises 10 minutes is too short for observation plus interview and proposes splitting into separate visits or observation during quiet periods, and says not to record screens showing patient data."}
  - name: negative-manager-wants-names
    vars:
      roles_and_setting: "Call-centre agents. The team manager wants to sit in and get a list of who is using unofficial shortcuts so she can retrain them."
      change_being_considered: "New CRM rollout."
      session_length_minutes: 30
    assert:
      - {type: llm-rubric, value: "Explains why the manager should not sit in and why individuals must not be named, proposes reporting patterns anonymously instead, and still produces the guide."}
