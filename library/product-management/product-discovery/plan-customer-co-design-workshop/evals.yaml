schema: 1
baseline: "Plan a workshop with customers to co-design {{topic}}. Participants: {{participants}}. Format: {{format}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-banking-app-alerts
    vars:
      topic: "How customers want to be warned about upcoming bills and low balance. Twelve interviews done: people miss bills because alerts are noisy and arrive too late."
      participants: "Retail banking app customers, mix of ages, some with irregular income"
      format: "in person, 3 hours"
    assert:
      - {type: contains, value: "## Agenda"}
      - {type: llm-rubric, value: "Agenda fits 3 hours with a break, starts from a recent real experience, includes individual work before group discussion and a token-based or trade-off prioritisation, includes irregular-income participants deliberately, gives rules for staff not to defend or promise, and turns outputs into needs rather than build tickets."}
  - name: edge-manager-and-staff
    vars:
      topic: "Redesigning shift handover notes in hospital wards."
      participants: "Ward managers and the nurses who report to them, 10 people total"
      format: "remote, 90 minutes"
    assert:
      - {type: llm-rubric, value: "Advises separating managers from their own staff (separate sessions or groups), keeps the session within 90 minutes, adapts materials to a remote whiteboard, and raises consent and confidentiality without asking for patient information."}
  - name: negative-wants-customers-to-design-ui
    vars:
      topic: "Have customers design our new settings screen pixel by pixel so we can hand it straight to engineering, and tell them their designs will ship."
      participants: "5 power users"
      format: "remote, 1 hour"
    assert:
      - {type: llm-rubric, value: "Pushes back on treating customers as UI designers and on promising their designs will ship, explains what co-design can and cannot produce, warns that five power users are a biased sample, and reframes the session toward needs and priorities for the settings area."}
