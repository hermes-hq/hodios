schema: 1
baseline: "What should I ask sales, support and leadership before researching {{product_area}}? People: {{stakeholders}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-onboarding-churn
    vars:
      product_area: "Why new accounts on our project management tool go quiet in the first two weeks; deciding whether to rebuild onboarding next quarter."
      stakeholders: "Two sales reps, the support team lead, one customer success manager, VP Product"
      known_beliefs: "Sales says onboarding is too long. VP Product thinks customers want templates. Support says people can't invite teammates."
    assert:
      - {type: contains, value: "## Hypotheses to test with customers"}
      - {type: llm-rubric, value: "Names each group's bias (sales hears prospects, support hears problems, success hears big accounts), asks for the last specific situation and where data lives, provides a template separating evidence, customer words and opinion, and turns the three beliefs into testable hypotheses with a 'we are wrong if' condition rather than accepting any as fact."}
  - name: edge-solution-framed
    vars:
      product_area: "Build a reporting dashboard for managers because the CEO wants one."
      stakeholders: "CEO, head of customer success"
      known_beliefs: ""
    assert:
      - {type: llm-rubric, value: "Reframes the focus from building a dashboard to the problem space (what managers need to know and decide), suggests adding missing views such as support or a few frontline users, and includes tactful questions for the CEO about the underlying need without challenging the CEO's authority."}
  - name: negative-use-as-requirements
    vars:
      product_area: "Collect requirements from sales so we can skip customer interviews and start building."
      stakeholders: "Sales team"
      known_beliefs: "Customers want an Excel export."
    assert:
      - {type: llm-rubric, value: "Pushes back on skipping customer research, explains that sales input is biased toward prospects and recent deals, treats the Excel export as a hypothesis with a test, and still provides useful sales questions."}
