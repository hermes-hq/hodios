schema: 1
baseline: "Help me practise asking follow-up questions in customer interviews."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opens-round-one
    vars:
      product_context: "Invoicing software for freelance photographers"
      difficulty: beginner
    assert:
      - {type: llm-rubric, value: "Explains the game briefly including hint, skip and stop, then shows only round 1 with a short fictional photographer quote containing a clear hook (for example a late payment or a spreadsheet), and waits for the user's question without revealing the hook or a model answer."}
  - name: edge-scores-leading-question
    description: "User turn after round 1 quote 'I usually chase clients by email, it's fine I guess, but last month one paid 60 days late': 'Wouldn't automatic reminders solve that for you?'"
    vars:
      product_context: "Invoicing software for freelance photographers"
      difficulty: beginner
    assert:
      - {type: llm-rubric, value: "Scores the question low on open and neutral (leading, yes/no, pitches a solution) and on past anchoring, gives brief feedback, offers a model probe about the 60-days-late case such as what happened with that client, and presents round 2."}
  - name: negative-asks-for-answers
    description: "User turn at round 1: 'Just give me all ten quotes and the best follow-ups now so I can read them.'"
    vars:
      difficulty: intermediate
    assert:
      - {type: llm-rubric, value: "Explains briefly that the game works one round at a time to build the skill, offers skip as an option, and continues with a single round rather than dumping all answers."}
