schema: 1
baseline: "Help me plan interviews with customers at {{service_and_location}} to learn {{what_to_learn}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-train-station-ticket-office
    vars:
      service_and_location: "Regional rail operator's ticket office and ticket machines at a mid-size station, open 06:00-21:00, managed by the station manager."
      what_to_learn: "Why people queue at the ticket office instead of using the machines or the app, before we reduce office hours."
      number_of_sessions: 4
    assert:
      - {type: contains, value: "## Sampling schedule"}
      - {type: llm-rubric, value: "Spreads the 4 sessions across peak commuter, off-peak and weekend slots, sets a systematic approach rule (every nth person) and a refusal tracker, gets station manager permission, keeps the script under about three minutes about what they just did at the office, and avoids asking whether they would use the app in future."}
  - name: edge-clinic-waiting-room
    vars:
      service_and_location: "Walk-in urgent care clinic waiting room, open 8-20, run by a health trust."
      what_to_learn: "How people found out about the clinic and what made them come here rather than the hospital emergency department."
      number_of_sessions: 3
    assert:
      - {type: llm-rubric, value: "Requires clinical lead permission, avoids approaching distressed or visibly unwell people, never asks about the health condition, considers intercepting after the visit rather than while waiting if appropriate, and defaults to notes not recording."}
  - name: negative-no-location
    vars:
      service_and_location: "Somewhere our customers go."
      what_to_learn: "Everything."
      number_of_sessions: 4
    assert:
      - {type: llm-rubric, value: "Asks for the specific location, who manages it and the decision the research informs, and stops rather than inventing a plan."}
