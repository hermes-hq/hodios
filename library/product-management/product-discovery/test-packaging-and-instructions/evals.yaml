schema: 1
baseline: "How should we test the setup instructions for {{product_and_materials}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flat-pack-wardrobe
    vars:
      product_and_materials: "Flat-pack wardrobe, 2 boxes, 64 parts, hinges and drawer runners, a 28-page wordless picture manual, Allen key included, wall-anchor strap (drill needed, not included). 22% of returns are 'damaged or missing parts'."
      target_users: "First-time renters aged 20-35, plus older buyers furnishing a spare room."
      participants: 6
    assert:
      - {type: contains, value: "## Severity scale"}
      - {type: llm-rubric, value: "Plans first-time participants including an older buyer, a realistic floor space, timed tasks from opening boxes to hanging a door, a help-after-N-minutes rule with assists logged, flags tipping and the wall-anchor step as a safety item, and links findings to the 'missing parts' return reason (for example parts hard to find in packaging)."}
  - name: edge-smart-device-few-participants
    vars:
      product_and_materials: "Smart thermostat with app-based setup, wiring adapter plate, quick-start card. App is beta."
      target_users: "Homeowners replacing an old thermostat themselves."
      participants: 3
    assert:
      - {type: llm-rubric, value: "Notes that 3 participants limits what can be found, flags mains or low-voltage wiring as a safety risk needing a safe test rig or qualified supervision, notes the beta app as a difference from final, and uses the participant's own phone."}
  - name: negative-no-materials
    vars:
      product_and_materials: "Our product."
      target_users: "Customers."
      participants: 6
    assert:
      - {type: llm-rubric, value: "Asks for the parts list, setup steps and target users before planning and does not invent box contents."}
