schema: 1
baseline: "Do some desk research on {{problem_space}} for {{target_users}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pet-sitting-plan
    vars:
      problem_space: "Finding trustworthy pet sitters for elderly dogs with medical needs. Deciding whether to start a vetted pet-sitter marketplace."
      target_users: "Owners of senior dogs (8+ years) who travel for work."
      region: "Spain"
    assert:
      - {type: contains, value: "## Findings table"}
      - {type: llm-rubric, value: "Gives scan questions, source types including forums, reviews and official statistics on pet ownership, search terms in owners' own words including Spanish-language queries and disconfirming searches, an A/B/C reliability grade, an empty findings table with a marked example rather than invented statistics, and interview questions from the gaps."}
  - name: edge-pasted-notes
    vars:
      problem_space: "Bookkeeping pain for small farm shops. Notes I found: a 2016 trade magazine piece says most farm shops do books by hand; an accounting software vendor blog says 70% of farm shops struggle with VAT; a farmers forum thread with 40 replies complaining about stock tracking."
      target_users: "Owners of small farm shops."
      region: ""
    assert:
      - {type: llm-rubric, value: "Fills the findings table only from the three supplied notes, grades the vendor blog as low reliability and flags the 2016 piece as old, notes that a forum thread skews to vocal users, and says the scan is global because no region was given."}
  - name: negative-asks-for-market-size
    vars:
      problem_space: "Just tell me the exact market size for AI tutoring in India with sources."
      target_users: "Students."
      region: "India"
    assert:
      - {type: llm-rubric, value: "Does not invent a market-size figure, report titles or URLs; explains where such figures are found and how to grade them, and proposes search terms."}
