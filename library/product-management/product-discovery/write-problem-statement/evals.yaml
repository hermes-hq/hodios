schema: 1
baseline: "Write a problem statement based on these observations: {{observations}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-support-and-interviews
    vars:
      observations: |
        - 42 support tickets in Q3 about "where is my report" after scheduled exports fail silently.
        - 3 of 6 interviewed finance managers said they re-run month-end exports manually "just to be safe", about 2 hours each month.
        - One customer churned citing "can't trust the numbers arrive".
        - Sales asked for "Slack alerts for failed exports".
      users: "Finance managers at mid-market customers who schedule month-end exports."
      business_context: "B2B reporting tool. Company goal this year: reduce gross churn from 14% to 10%."
    assert:
      - {type: llm-rubric, value: "Writes a solution-free statement about finance managers not being able to rely on scheduled exports arriving, cites the 42 tickets, the 3 of 6 interviews and the churned customer with strength ratings, treats Slack alerts as a requested solution rather than the problem, lists the manual re-run workaround with its 2-hour cost, and ties success to observable trust or reduced re-runs rather than a feature."}
  - name: edge-feature-request-only
    vars:
      observations: "The VP of Sales says we need a mobile app because 'everyone expects one now'."
    assert:
      - {type: llm-rubric, value: "Marks the statement PROVISIONAL or equivalent, notes that the only input is a single stakeholder opinion naming a solution, does not invent user evidence, and makes the open questions (who would use mobile, in what situation, what they do today) the main output."}
  - name: negative-no-invented-numbers
    vars:
      observations: "Several users told us onboarding is confusing. Trial conversion seems low."
    assert:
      - {type: llm-rubric, value: "Does not invent a trial conversion rate, a count of users or quotes; marks evidence as weak, and lists the specific numbers to obtain (for example trial-to-paid rate and where in onboarding users drop) as open questions."}
