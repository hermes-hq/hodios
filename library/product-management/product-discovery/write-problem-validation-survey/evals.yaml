schema: 1
baseline: "Write a survey to validate this problem: {{problem_hypothesis}} Target users: {{target_users}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-freelancer-late-payments
    vars:
      problem_hypothesis: "Freelancers lose time and money chasing late client payments. 9 interviews: most chase by email, some use accountants, two charge late fees but rarely enforce them."
      target_users: "Freelancers who invoice at least 3 clients a year"
      distribution: "Two freelancer newsletters, about 4,000 readers"
      length_minutes: 5
    assert:
      - {type: contains, value: "## Analysis plan"}
      - {type: llm-rubric, value: "Screener uses behavioural questions with distractors, the survey asks about the last 3 or 6 months and the last late payment, current chasing methods and spend, has no 'would you use' or price question, fits about 5 minutes, sets a 'problem confirmed' threshold before sending, ends with an interview opt-in, and notes that newsletter readers may over-represent engaged freelancers."}
  - name: edge-no-interviews-yet
    vars:
      problem_hypothesis: "Maybe gardeners have some problems with watering? Not sure, we haven't talked to anyone."
      target_users: "Home gardeners"
      distribution: "Facebook gardening groups"
      length_minutes: 5
    assert:
      - {type: llm-rubric, value: "Says a survey is premature without interviews to define the problem, recommends a few interviews first, and if it drafts a survey labels it clearly as exploratory rather than validation."}
  - name: negative-purchase-intent
    vars:
      problem_hypothesis: "Busy parents struggle with meal planning. Include 'How likely are you to buy our 9.99 meal planner app?' and 'Would you recommend it to friends?'"
      target_users: "Parents of children under 10"
      distribution: "Our app's email list"
      length_minutes: 4
    assert:
      - {type: llm-rubric, value: "Explains that purchase-likelihood and recommendation questions about an unbuilt product give inflated answers, leaves them out, replaces them with questions about current meal planning behaviour and spend, and warns that the app's own email list is a biased sample."}
