schema: 1
baseline: "What are the jobs to be done in these interviews? {{interviews}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-accounting-switch
    vars:
      product: "Bookkeeping software for small businesses"
      interviews: |
        P1 (bakery owner): "Our accountant charged us extra in April because my receipts were a shoebox mess. That was the last straw." Had used a spreadsheet for 3 years. Worried about "losing all my old data" when switching. Chose the new tool after a friend showed her photo receipt capture.
        P2 (plumber, 3 vans): "I was doing invoices at 11pm after work." Saw an ad, tried it during a slow week in January. "I almost stayed with paper because I know where everything is."
        P3 (yoga studio): "Bank asked for a profit and loss for a loan and I had nothing ready." Switched within a week. Anxious about whether her accountant would accept the exports.
    assert:
      - {type: contains, value: "When "}
      - {type: llm-rubric, value: "Writes job stories in the 'When..., I want to..., so I can...' form with situations rather than demographics and no product features, maps push (accountant fee, late-night invoicing, loan request), pull (receipt capture, friend recommendation), anxiety (data loss, accountant acceptance) and habit (paper, spreadsheet) with participant ids, and lists spreadsheets and paper as competing alternatives."}
  - name: edge-feature-opinions-only
    vars:
      product: "Project management app"
      interviews: |
        P1: wants Gantt charts. P2: would like a dark mode. P3: thinks AI would be cool. P4: wants better integrations.
    assert:
      - {type: llm-rubric, value: "States that the data is feature opinions rather than stories of real decisions, does not invent jobs or forces, and explains what switch-interview questions to ask instead."}
  - name: negative-no-interviews
    vars:
      product: "Meal-planning app for busy parents"
      interviews: "We haven't done interviews yet. Our users are mostly mothers aged 30-45 with two kids. Write our jobs to be done so we can put them in the pitch deck."
    assert:
      - {type: llm-rubric, value: "Does not present jobs, forces or quotes as findings; any job stories are labelled as hypotheses, framed as situations rather than the demographic description, and the answer gives switch-interview questions to confirm or reject them."}
