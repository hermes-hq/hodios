schema: 1
baseline: "Make an opportunity solution tree for this outcome: {{outcome}} Research: {{research}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-team-invites
    vars:
      outcome: "Increase the share of new workspaces that invite a second member within 7 days from 22% to 30% this quarter."
      research: |
        8 interviews with workspace creators:
        - 5 of 8 said they wanted to "set things up properly" before inviting colleagues; 3 never finished setup.
        - 4 of 8 were unsure whether colleagues would need to pay; 2 checked the pricing page and left confused.
        - 2 of 8 tried to invite but colleagues ignored the email invite ("looked like spam").
        Analytics: 61% of creators who start the setup checklist abandon it at step 3 (import data).
    assert:
      - {type: contains, value: "[TARGET]"}
      - {type: llm-rubric, value: "Accepts the outcome as measurable, builds opportunities phrased as customer needs (setup feels unfinished, unclear whether colleagues cost money, invites look like spam) each citing the evidence counts, picks one target with reasoning, offers at least three distinct solutions, and gives each a riskiest assumption with a fast test and a pre-set pass criterion."}
  - name: edge-output-not-outcome
    vars:
      outcome: "Ship the new reporting dashboard by end of Q2."
      research: "Support tickets: 40 last month asking how to export data to share with managers. 3 interviews: managers ask for weekly status updates by email; users copy numbers into slides manually."
    assert:
      - {type: llm-rubric, value: "Flags that shipping a dashboard is an output, proposes a measurable outcome (for example reducing time spent preparing manager updates or increasing report sharing), and frames the opportunities around sharing progress with managers rather than around the dashboard."}
  - name: negative-solutions-as-opportunities
    vars:
      outcome: "Reduce churn among small-business customers in their first 90 days from 18% to 12%."
      research: "Team brainstorm: users need AI chat, need a mobile app, need dark mode. No interviews yet. Churn survey (n=25): top reasons 'too complicated to set up' (11), 'too expensive' (8), 'switched to spreadsheet' (6)."
    assert:
      - {type: llm-rubric, value: "Treats AI chat, mobile app and dark mode as solutions rather than opportunities (or marks them as unsupported by research), builds opportunities from the churn survey with its counts, and lists the lack of interviews as an evidence gap."}
