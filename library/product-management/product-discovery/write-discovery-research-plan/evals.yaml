schema: 1
baseline: "Write a research plan for this: {{decision_and_unknowns}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-language-school-app
    vars:
      decision_and_unknowns: "Decide by 30 November whether to add live group classes to our self-study language app (head of product decides). Unknowns: do paying users want live practice or just more content, would they show up at fixed times, what do competitors charge, do users in Brazil and Germany differ, and general user satisfaction."
      project_constraints: "PM and designer, 5 weeks, 1,500 USD for incentives, we have analytics and an email list of 40k paying users."
    assert:
      - {type: contains, value: "## Cut from scope"}
      - {type: llm-rubric, value: "Links each goal to an if-yes/if-no consequence, cuts or questions general satisfaction as not changing the decision, uses desk research for competitor prices and analytics before interviews, proposes a test of showing up at fixed times (for example a concierge or small live trial), plans samples per country segment, and fits a timeline ending with a readout before 30 November."}
  - name: edge-tight-timeline
    vars:
      decision_and_unknowns: "Decide in 10 days whether to keep the free trial at 14 days or cut to 7. Growth lead decides."
      project_constraints: "Just me."
    assert:
      - {type: llm-rubric, value: "Chooses fast cheap methods such as existing trial conversion data and a small number of interviews, notes what an A/B test would need and whether it fits 10 days, and keeps the plan to one page."}
  - name: negative-no-decision
    vars:
      decision_and_unknowns: "We want to understand our users better."
      project_constraints: ""
    assert:
      - {type: llm-rubric, value: "Asks what decision the research should inform, by when and who decides, and stops instead of writing a generic plan."}
