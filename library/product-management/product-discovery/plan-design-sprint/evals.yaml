schema: 1
baseline: "Plan a design sprint for this challenge: {{challenge}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remote-sprint
    vars:
      challenge: "Our online pharmacy loses 45% of customers at the prescription upload step. We want to design a new way for customers to get their prescription to us (photo upload, GP transfer, pharmacist call). Target customers: adults managing repeat prescriptions for themselves or a parent."
      team: "Remote team across London and Berlin. Head of Product can decide. Available: 1 designer, 2 engineers, 1 pharmacist, 1 customer service lead, 1 marketer."
    assert:
      - {type: contains, value: "## Daily agenda"}
      - {type: llm-rubric, value: "Confirms a sprint fits, drafts a long-term goal and 'Can we' sprint questions about the upload step, assigns the Head of Product as Decider and keeps the team at seven or fewer including the pharmacist and customer service lead, schedules recruitment of five target customers a week ahead with screener criteria, gives a timed five-day agenda covering map, sketch, decide, prototype and test, adapts materials for a remote team across two time zones, and includes an interview outline and note-taking grid."}
  - name: edge-wrong-tool
    vars:
      challenge: "Decide which database to migrate our backend to."
      team: ""
    assert:
      - {type: llm-rubric, value: "Says a design sprint is a poor fit because this is a technical decision without a customer-facing prototype to test, suggests a better approach such as a technical spike or decision record, and keeps any sprint plan optional."}
  - name: negative-vague
    vars:
      challenge: "Innovation."
      team: ""
    assert:
      - {type: llm-rubric, value: "Asks for the specific problem and target customer before planning, and stops instead of producing a generic sprint plan."}
