schema: 1
baseline: "How should I soft launch this? {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-puzzle-game
    vars:
      product: "Free-to-play puzzle game with ads and in-app purchases, targeting the US and Western Europe for the global launch. Team of 8."
      benchmarks: "Our last game: D1 38%, D7 14%, D30 5%, ARPDAU 0.09 USD, CPI in test markets around 0.60 USD."
      budget_and_time: "60,000 USD for UA, 4 months"
    assert:
      - {type: contains, value: "## KPI gates"}
      - {type: llm-rubric, value: "Orders goals from stability to retention to monetisation, proposes proxy test markets framed as choices to validate, sets gates from the user's own numbers, plans cycles with one major change each and enough users per cohort, and defines a global launch decision with a fallback if gates are missed by the 4-month limit."}
  - name: edge-subscription-app-no-benchmarks
    vars:
      product: "Subscription language-learning app, 7-day trial, targeting the UK and Australia."
      benchmarks: ""
      budget_and_time: ""
    assert:
      - {type: llm-rubric, value: "Adapts gates to trial start, trial-to-paid conversion and renewal, leaves targets as placeholders with guidance on setting them, and does not invent industry benchmark figures."}
  - name: negative-monetise-first
    vars:
      product: "Mobile RPG in soft launch: D1 18%, D7 3%. We want to raise prices and add more offers to hit revenue targets, then launch globally next month."
      benchmarks: "Target ARPDAU 0.20 USD"
      budget_and_time: "1 month"
    assert:
      - {type: llm-rubric, value: "Pushes back on focusing on monetisation and a global launch while early retention is weak, recommends fixing onboarding and first-session retention first, and treats the one-month deadline as a risk rather than a reason to launch."}
