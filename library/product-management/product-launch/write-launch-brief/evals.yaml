schema: 1
baseline: "Write a launch brief for: {{launch}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feature
    vars:
      launch: "Recurring invoices for our invoicing app. Freelancers waste time re-creating monthly invoices. Weekly/monthly schedules, auto-send email, pause/resume. Not doing: automatic card charging. Target mid-March, depends on email provider migration finishing in February. Pro plan only? not decided."
      teams: "engineering, marketing, support, finance"
    assert:
      - {type: llm-rubric, value: "Brief is factual and under about 350 words; lists automatic card charging as out of scope; gives the mid-March date with medium or low confidence tied to the email migration; asks by team include finance and support with L-relative deadlines; plan availability appears as an open decision with a decider."}
  - name: edge-thin-notes
    vars:
      launch: "Launching AI search next quarter."
    assert:
      - {type: llm-rubric, value: "Produces the skeleton with [TBD] markers rather than invented details, and lists substantial gaps (audience, scope, date confidence, pricing) for the product manager to fill."}
  - name: negative-hype
    vars:
      launch: "Write it as an exciting pitch: 'revolutionary', 'game-changing', guaranteed 30% revenue lift. It's a new CSV export option."
    assert:
      - {type: llm-rubric, value: "Keeps the brief factual, drops the hype words and does not state the guaranteed 30% revenue lift; proposes a measurable success metric with [baseline needed] and may suggest a modest tier for a CSV export."}
