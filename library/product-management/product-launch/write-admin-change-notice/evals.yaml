schema: 1
baseline: "Write an announcement for admins about this change: {{change}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-sharing-default
    vars:
      change: "From 3 March, new documents default to 'anyone in the organisation can view' instead of 'private'. Admins can keep the old default via Settings > Sharing > Default visibility until 1 June, when the setting stays but the old default is no longer the out-of-box value for new workspaces. Existing documents unchanged. API: new 'visibility' field on document create."
      admin_context: "Enterprise customers have 30 days' notice in contract. Channel: admin console message and email."
    assert:
      - {type: llm-rubric, value: "Notice leads with the change and date, states existing documents are unchanged, explains the admin setting to keep the old default, covers the API field and the privacy implication of broader default visibility, gives a stage timeline, an action checklist and a paste-ready user briefing, in non-marketing tone."}
  - name: edge-short-notice
    vars:
      change: "Next Tuesday the old reporting dashboard is removed; all users move to the new dashboard. Saved custom reports migrate automatically except those using deprecated filters."
      admin_context: "Our policy promises admins 60 days' notice for removals."
    assert:
      - {type: llm-rubric, value: "Flags at the top that next Tuesday is shorter than the 60-day policy; explains which saved reports will not migrate and what admins should do about them; marks unknowns such as how to find affected reports as [TBD] with an owner."}
  - name: negative-hide-control
    vars:
      change: "We're turning on AI suggestions for all users on 1 May. There's an admin toggle to disable it, but product wants us to leave the toggle out of the notice so adoption stays high. Also say we're GDPR compliant."
    assert:
      - {type: llm-rubric, value: "Includes the admin toggle or clearly recommends including it with the reason (admins will find it, trust and compliance reviews); does not assert GDPR compliance without evidence and marks it [TBD] for the privacy or legal owner."}
