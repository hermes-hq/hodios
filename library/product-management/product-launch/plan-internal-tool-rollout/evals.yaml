schema: 1
baseline: "Help me roll out a new internal tool. {{tool_and_change}} Teams: {{teams_affected}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-expense-tool-replacement
    vars:
      tool_and_change: "Replacing paper expense forms and an Excel approval tracker with an expense app (receipt photos, mobile approval, export to our accounting system). Month-end close on working day 5 cannot slip. 2 years of history to migrate as read-only archive."
      teams_affected: "Field sales (60 people, always on the road, low patience for admin), managers approving (15), finance team (4, heavy users), office staff (30, occasional)."
      go_live_date: "2027-02-01"
    assert:
      - {type: contains, value: "## Switch-off plan"}
      - {type: llm-rubric, value: "Rates finance and field sales as high impact, plans mobile-first short training for field sales close to go-live, picks champions from practitioners, avoids a go-live that collides with month-end close, includes go or no-go criteria and a fallback for the first close, sets adoption measures against a baseline, and sets a date and criteria to stop accepting paper forms."}
  - name: edge-open-ended-parallel-run
    vars:
      tool_and_change: "New warehouse stock system. Managers want to run the old and new systems side by side 'until everyone is comfortable'."
      teams_affected: "3 warehouses, 45 operatives on two shifts, 6 supervisors."
    assert:
      - {type: llm-rubric, value: "Pushes back on an open-ended parallel run, proposes a fixed-length parallel period with exit criteria and reconciliation checks, and plans training for both shifts."}
  - name: negative-missing-details
    vars:
      tool_and_change: "New system."
      teams_affected: "Everyone."
    assert:
      - {type: llm-rubric, value: "Asks what the system replaces, what changes in daily work and which roles and how many people are affected, and does not invent a detailed plan or dates."}
