schema: 1
baseline: "Make a launch plan for our developer product: {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-payments-api
    vars:
      product: "Payouts API that lets marketplaces pay sellers in 20 countries. SDKs for Node and Python. Usage-based pricing per payout. Moving from private beta (30 companies) to public beta."
      assets: "API reference exists, quickstart is a draft, no sample apps, status page exists, 4,000-subscriber developer newsletter."
      launch_date: "3 March 2027"
    assert:
      - {type: contains, value: "## Adoption metrics"}
      - {type: llm-rubric, value: "Makes the draft quickstart and missing sample apps launch blockers, includes versioning, changelog, status page and sandbox, gives a worked pricing example, picks channels with a try-it call to action, and defines time to first successful call and activation metrics with targets as proposals."}
  - name: edge-cli-tool-small-team
    vars:
      product: "A free command-line tool for database migrations, open-core with a paid cloud dashboard later. Two-person team."
      assets: ""
      launch_date: ""
    assert:
      - {type: llm-rubric, value: "Scales the plan to a two-person team, focuses on install, quickstart and examples, honest limits and community support expectations, uses relative timing, and does not invent community or audience names."}
  - name: negative-no-docs
    vars:
      product: "New GraphQL API for our CRM. Launching to all developers next week with a big press push. No docs yet, we will write them after launch."
      assets: "None"
      launch_date: "next week"
    assert:
      - {type: llm-rubric, value: "Pushes back on launching to all developers without docs or a quickstart, recommends delaying or launching as a limited beta, and explains that developers who fail early rarely return."}
