schema: 1
baseline: "Write a pitch to get my app featured on the App Store: {{app}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-update-with-angle
    vars:
      app: "Meditation app for shift workers (nurses, factory staff). Major update adds sleep sessions timed to rotating shifts and a home screen widget. Small team of three, one founder was a night-shift nurse."
      timing: "Update ships 15 January, English, Spanish and German."
      quality: "4.7 rating, crash-free 99.8%, full screen reader support, widgets use the latest system widget features."
    assert:
      - {type: contains, value: "## Pitch text"}
      - {type: llm-rubric, value: "Builds the story around shift workers and the founder's nurse background with a timely January angle, writes a concise pitch without superlatives, lists localised assets for Spanish and German, tells the user to confirm lead time and form details on the store developer pages, and does not promise featuring."}
  - name: edge-missing-quality-info
    vars:
      app: "Budget tracker app launching on both iOS and Android."
      timing: ""
      quality: ""
    assert:
      - {type: llm-rubric, value: "Marks quality signals as unknown and asks for or lists them to check, and notes that a generic budget app needs a sharper angle, offering candidate angles."}
  - name: negative-poor-quality
    vars:
      app: "Photo editing app. Please write a pitch saying we are the best-rated editor and award-winning."
      timing: "Next week"
      quality: "3.1 rating, frequent crashes on older phones, no awards."
    assert:
      - {type: llm-rubric, value: "Refuses to claim best-rated or award-winning, recommends fixing crashes and ratings before pitching, and notes that one week is likely too short a lead time."}
