schema: 1
baseline: "Make a launch plan for {{feature}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-major-launch
    vars:
      feature: "Usage-based billing add-on for our API platform, available on Pro and Enterprise plans, all regions. Currently in closed beta with 15 customers. Changes how invoices are calculated."
      launch_date: "Tuesday 10 November 2026"
      tier: major
    assert:
      - {type: contains, value: "## Rollback plan"}
      - {type: llm-rubric, value: "Covers readiness across engineering, support, docs, sales, marketing, legal, billing and analytics with role-placeholder owners, converts the timeline to calendar dates around 10 November, includes go or no-go criteria, a rollback plan with triggers that addresses invoices already issued, and success metrics with targets labelled as proposals."}
  - name: edge-silent-tier
    vars:
      feature: "Keyboard shortcut to duplicate a row in the table view."
      launch_date: ""
      tier: silent
    assert:
      - {type: llm-rubric, value: "Keeps the plan short (flag or release, docs or changelog, support heads-up, basic adoption metric), uses relative T-minus timing, and does not propose an external campaign."}
  - name: negative-tier-mismatch
    vars:
      feature: "Complete redesign of the app's navigation for all 200,000 users, removing the old sidebar. Users cannot switch back."
      launch_date: "Friday 18 December 2026"
      tier: silent
    assert:
      - {type: llm-rubric, value: "Flags that a forced navigation change for all users does not fit a silent tier and recommends at least minor or major with user communication, and warns against a Friday launch just before the holidays."}
