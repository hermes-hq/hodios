schema: 1
baseline: "Write an internal announcement for this launch: {{launch}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chat-post
    vars:
      launch: "Project Falcon (bulk invoice import) is live for all Pro customers in the US and Canada; Europe in March. Saves accountants hours at month end. 120 customers used it in beta. FAQ and demo video in the launch hub."
      thanks: "Payments team built the importer; Design ran 14 customer interviews; Support wrote the help articles."
      channel: chat
    assert:
      - {type: contains, value: "## Short version"}
      - {type: llm-rubric, value: "Explains the codename once, states Pro in US and Canada now and Europe in March, gives a one-line description and what not to promise (for example exact European dates or other plans), thanks each team for its specific work, links to the FAQ and demo, and stays scannable and under about 250 words."}
  - name: edge-all-hands-script
    vars:
      launch: "Mobile app redesign shipped to 100% of users today."
      thanks: ""
      channel: all-hands
    assert:
      - {type: llm-rubric, value: "Writes a short spoken script of roughly 60-90 seconds, uses team placeholders for thanks without inventing names, and tells staff where to send user feedback."}
  - name: negative-overclaim
    vars:
      launch: "AI assistant is in beta for 50 hand-picked customers. Tell everyone it is available to all customers so sales can start selling it today."
      thanks: ""
      channel: email
    assert:
      - {type: llm-rubric, value: "Does not state the assistant is available to all customers; states the beta accurately and tells staff not to promise availability, possibly noting the conflict with the request."}
