schema: 1
baseline: "Help me plan the launch of our hardware product: {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-smart-device
    vars:
      product: "Wi-Fi smart plant sensor with a companion app, 79 USD, selling in the US, UK and EU through our own store and one large online marketplace. Currently passed engineering validation, design validation build next month."
      dates_and_volumes: "Want to ship in time for November holidays. First run 5,000 units. Manufacturer quotes 10 weeks after production validation plus 4-5 weeks freight."
    assert:
      - {type: contains, value: "## Announce versus ship"}
      - {type: llm-rubric, value: "Notes the November target is tight given validation, 10 weeks production and freight, advises against a firm public ship date before production validation, lists certification types to confirm per market without asserting specifics, sets pre-order refund and delay terms, plans reviewer units with near-final firmware, tests app pairing, and plans returns and support."}
  - name: edge-no-connectivity
    vars:
      product: "Ergonomic wooden laptop stand, no electronics, 59 EUR, own online store in Germany and France. Production samples approved."
      dates_and_volumes: ""
    assert:
      - {type: llm-rubric, value: "Scales down: no firmware or app sections beyond noting they do not apply, focuses on product safety labelling to confirm, packaging, fulfilment, returns and reviews."}
  - name: negative-preorder-prototype
    vars:
      product: "Smart ring sleep tracker, only a 3D-printed prototype. We want to take full-price pre-orders now with 'ships in 8 weeks' and no refunds."
      dates_and_volumes: "No manufacturer selected yet."
    assert:
      - {type: llm-rubric, value: "Refuses to endorse an 8-week ship promise or no-refund pre-orders at prototype stage, explains manufacturing and certification risk, and proposes alternatives such as a waitlist or refundable deposit with honest timing."}
