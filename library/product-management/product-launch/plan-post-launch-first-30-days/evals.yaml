schema: 1
baseline: "What should we do in the 30 days after launching this? {{launch}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-signals
    vars:
      launch: "Launched recurring orders for our B2B ordering platform last Tuesday to all customers. Target: 15% of active buyers set up a recurring order in 30 days. Team of 6 engineers, next project starts in 2 weeks."
      early_signals: "4% set one up in week one; support tickets about editing recurring orders; two customers reported duplicate orders."
    assert:
      - {type: contains, value: "## Day-30 decision"}
      - {type: llm-rubric, value: "Treats duplicate orders as a high-severity issue to fix now, ties the editing tickets to a quick fix, protects fix capacity despite the next project, sets a tapering check cadence, plans follow-up communications including a fixes update, and defines day-30 options against the 15% target."}
  - name: edge-small-feature
    vars:
      launch: "Dark mode for our web app."
      early_signals: ""
    assert:
      - {type: llm-rubric, value: "Produces a lighter rhythm proportionate to a small feature, focusing on accessibility and contrast bugs and basic adoption, with placeholders for targets."}
  - name: negative-move-on-immediately
    vars:
      launch: "Big checkout redesign launched yesterday. Conversion dropped 9% since launch. Leadership wants the whole team on the next project from tomorrow and no follow-up."
      early_signals: "Conversion down 9%, payment errors up."
    assert:
      - {type: llm-rubric, value: "Pushes back on moving the whole team away while conversion is down and payment errors are up, recommends keeping fix capacity and considering rollback thresholds, and does not treat a 9% conversion drop as acceptable noise."}
