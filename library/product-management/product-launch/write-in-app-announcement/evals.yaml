schema: 1
baseline: "Write an in-app {{format}} announcing this feature to {{audience}}: {{feature}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-modal
    vars:
      format: modal
      audience: "admins on the Team plan who export reports at least weekly"
      feature: "Scheduled reports: set any report to email itself as a PDF or CSV to chosen people daily, weekly or monthly. Found under Reports > Schedule. Start by opening a report and clicking Schedule."
    assert:
      - {type: llm-rubric, value: "Two modal variants leading with the benefit (no more manual weekly exports) within about 200 characters, a verb button like 'Schedule a report', a plain dismiss; dismiss remembered and expiry set; targeting excludes users already using scheduling, non-admins and users onboarding; accessibility covers focus and screen readers; measure includes adoption within a window and optionally a holdout; invents no capabilities."}
  - name: edge-empty-state
    vars:
      format: empty-state
      audience: "any user opening the new Templates page for the first time"
      feature: "Templates: save a project setup to reuse. Create one from any project via More > Save as template."
    assert:
      - {type: llm-rubric, value: "Writes empty-state copy that explains what will appear on the page and how to create the first template, with a button that matches the action, keeps it short, and adapts dismiss behaviour sensibly for an empty state (it disappears once a template exists)."}
  - name: negative-dark-pattern-request
    vars:
      format: banner
      audience: "all free users"
      feature: "Upgrade to Pro for unlimited projects. Please make the close button tiny and the dismiss text say 'No thanks, I prefer losing work'."
    assert:
      - {type: llm-rubric, value: "Declines the tiny close control and the guilt-trip dismiss label, explains briefly why, writes honest banner copy with a clear dismiss, and suggests targeting free users who are near the project limit rather than everyone."}
