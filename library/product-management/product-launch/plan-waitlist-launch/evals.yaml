schema: 1
baseline: "How should I launch to my waitlist? {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ai-tool
    vars:
      product: "AI bookkeeping assistant for freelancers. 6,200 on the waitlist from a landing page over 5 months; we asked their country and monthly invoice volume. We need to hand-hold onboarding because bank connections fail often."
      capacity: "Support can handle about 150 new users per week."
      priorities: "We promised the first 500 sign-ups 'early access first'."
    assert:
      - {type: llm-rubric, value: "Names onboarding support as the real constraint; honours the first-500 promise; waves sized around 150 per week with learning goals (bank connection success); drafts four emails including a warm-up after months of silence and a nudge for non-activated invitees; defines activation for this product and a pause threshold; mentions consent and unsubscribe basics."}
  - name: edge-referral-gaming
    vars:
      product: "Mobile habit app; 40,000 on the waitlist; we gave people a 'move up the list' referral link and some have 300 referrals, likely fake accounts."
    assert:
      - {type: llm-rubric, value: "Addresses referral gaming with caps or verification rules and a fair explanation of the order, without accusing individuals publicly; plans waves and checks."}
  - name: negative-fake-scarcity
    vars:
      product: "A simple to-do web app that could handle unlimited users today. We want a waitlist and to say '50,000 people are waiting' to create hype; we have 300 sign-ups."
    assert:
      - {type: llm-rubric, value: "Points out there is no real constraint and recommends an open launch or a short time-boxed list; refuses to use the false '50,000 waiting' claim and explains why."}
