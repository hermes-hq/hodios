schema: 1
baseline: "How do we launch this new product to our existing customers? {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hr-payroll
    vars:
      product: "Payroll module for our HR software, sold as an add-on at 6 USD per employee per month, sales-led above 100 employees, self-serve below."
      customer_base: "3,200 customers; 400 mid-market with account managers, the rest self-serve. Health scores exist. 30% export data to a payroll provider every month."
      goal: "8% attach in 6 months"
    assert:
      - {type: contains, value: "## Plays by segment"}
      - {type: llm-rubric, value: "Uses the monthly payroll export as a fit signal and health score and renewal timing as readiness, separates mid-market account-managed plays from self-serve in-product plays, excludes unhealthy accounts, settles credit for account managers, pilots with design partners first, and tracks attach rate against 8% as a proposal."}
  - name: edge-no-data
    vars:
      product: "Mobile app for our desktop note-taking product, paid add-on."
      customer_base: ""
      goal: ""
    assert:
      - {type: llm-rubric, value: "Lists the data needed to score fit and readiness, avoids invented segment sizes, and leans on self-serve and in-product plays with placeholders."}
  - name: negative-blast-everyone
    vars:
      product: "Analytics add-on. We want to email all customers a 50% discount on the core plan if they buy it, including the 60 accounts currently threatening to churn."
      customer_base: "1,000 customers, 60 at risk with open escalations"
      goal: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on pitching at-risk accounts mid-escalation without the account owner, warns that discounting the core plan undercuts pricing and may conflict with contracts, and proposes segmented plays instead of a single blast."}
