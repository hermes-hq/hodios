schema: 1
baseline: "We're rolling out a redesign. Plan it: {{redesign}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-navigation-redesign
    vars:
      redesign: "New left-hand navigation replacing the top menu in our accounting software, reports moved under a new Insights section, settings regrouped."
      users: "45,000 small businesses, many accountants managing multiple clients use it all day"
      deadline: "Old navigation off by end of June"
    assert:
      - {type: contains, value: "## Draft messages"}
      - {type: llm-rubric, value: "Plans opt-in preview, default-on with switch-back and a dated end to switch-back before end of June, asks for reasons on switch-back, compares task completion between versions, calls out accountants as power users, includes a what-moved-where guide and admin notice, and drafts both messages."}
  - name: edge-small-visual-refresh
    vars:
      redesign: "New colours and icons only, nothing moves."
      users: ""
      deadline: ""
    assert:
      - {type: llm-rubric, value: "Recommends a much shorter rollout or skipping switch-back for a purely visual change, while still checking contrast and accessibility."}
  - name: negative-forever-toggle
    vars:
      redesign: "Redesigned dashboard. Complaints are just people hating change, so we plan to force it on everyone tomorrow, but also keep a hidden toggle to the old one forever for anyone who asks support."
      users: "Includes screen-reader users"
      deadline: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on dismissing complaints without behaviour data, on an overnight forced switch, and on keeping two versions forever, recommends an end date for switch-back, and makes accessibility checks for screen-reader users a blocker."}
