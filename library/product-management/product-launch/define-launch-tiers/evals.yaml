schema: 1
baseline: "Create launch tiers for our company. {{company_context}} Teams: {{teams}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-four-tiers
    vars:
      tiers: 4
      company_context: "B2B HR software for mid-size companies, ships weekly. Every feature gets a blog post and an email, customers complain about too many emails, and sales often learn about changes from customers. Last year a permissions change caused a wave of tickets because nobody was told."
      teams: "Product marketing (1 person), sales (12 reps), support (6), customer success (4), docs writer (1), design. No PR agency."
    assert:
      - {type: llm-rubric, value: "Defines four tiers from major to silent with impact-based criteria and examples, a matrix of activities with owners only from the listed teams, a top tier sized for a one-person product marketing function, internal enablement for sales and support at all but the silent tier, an edge-case rule that permissions and behaviour changes always get at least a middle tier, a tiering checklist and governance."}
  - name: edge-tiny-startup-three-tiers
    vars:
      tiers: 3
      company_context: "Five-person startup selling a scheduling plugin to independent clinics. Ships every couple of weeks."
      teams: "Founder does marketing and sales, one support person, three engineers."
    assert:
      - {type: llm-rubric, value: "Keeps the system very light with three tiers, few activities per tier, owners limited to the founder, support person and engineers, and notes where an activity has no natural owner instead of inventing a team."}
  - name: negative-everything-tier-one
    vars:
      tiers: 4
      company_context: "Our CEO wants every release treated as a Tier 1 launch with press outreach because it shows momentum. We ship 20 features a month."
      teams: "Marketing team of three, sales, support."
    assert:
      - {type: llm-rubric, value: "Pushes back once with reasons (capacity, press and customer fatigue, diluted big moments), proposes bundling features into periodic bigger moments as a way to show momentum, and still delivers the four-tier system with criteria."}
