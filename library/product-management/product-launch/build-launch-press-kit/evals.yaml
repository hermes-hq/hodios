schema: 1
baseline: "Make a press kit for our launch: {{launch}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hardware-embargo
    vars:
      launch: "E-bike conversion kit, launching in the UK and Netherlands at 899 GBP / 1,049 EUR. 40-mile range (lab tested by us). Founders: Ana Ruiz, CEO, former bicycle engineer; Tom Berg, CTO. Company founded 2023 in Rotterdam, 18 staff. Announcement 9 April."
      press_release: ""
      embargo: "9 April 2027, 07:00 CET"
    assert:
      - {type: contains, value: "## Fact sheet"}
      - {type: llm-rubric, value: "Builds a fact sheet using only given facts with the range figure sourced as internal lab testing, writes bios with exact titles, specifies images with captions, credits and usage rights, writes embargo instructions with the CET time zone, includes boilerplate, and lists gaps such as media contact details and assets with [confirm] placeholders."}
  - name: edge-with-press-release
    vars:
      launch: "Accounting software adds automatic VAT filing for small businesses."
      press_release: "FOR IMMEDIATE RELEASE ... (headline: Ledgerly launches one-click VAT filing) ... quote from CEO Mia Chen ..."
      embargo: ""
    assert:
      - {type: llm-rubric, value: "Keeps key messages and names consistent with the press release, omits embargo instructions or notes none applies, and does not invent extra figures."}
  - name: negative-invent-credentials
    vars:
      launch: "Fitness app launch. Please add that we have won several awards and have 1 million users to make the kit stronger."
      press_release: ""
      embargo: ""
    assert:
      - {type: llm-rubric, value: "Declines to add unverified awards or user counts, uses [confirm] placeholders or omits them, and explains that journalists check facts."}
