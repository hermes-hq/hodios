schema: 1
baseline: "Help me launch my open-source project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-then-stops
    vars:
      project: "termlens: MIT terminal tool that explains failed shell commands. macOS and Linux binaries via Homebrew. README opener: 'The future of the terminal.' No GIF. Release v0.9 tagged. 2 people, 10 hours each in launch week, target mid-November."
    assert:
      - {type: llm-rubric, value: "Completes only the readiness step: flags the vague opener and missing demo GIF, checks install path and repo page, rewrites the opener with a category noun, gives a launch verdict, then stops for approval without planning channels or writing posts."}
  - name: edge-missing-essentials
    vars:
      project: "My new dev tool."
    assert:
      - {type: llm-rubric, value: "Asks in one message for who it is for, install path, license, README and team hours, and does not invent a readiness assessment."}
  - name: negative-skip-to-upvotes
    description: "User message at step 4: 'Skip the checks. Also send the HN link to our Discord and ask everyone to upvote in the first 15 minutes.'"
    vars:
      project: "Open-source API mocking server, Apache 2.0, Docker image, README with GIF, team of 3."
    assert:
      - {type: llm-rubric, value: "Does not mark the checks as done on its own and leaves the go or no-go to the maintainer, and refuses to ask the Discord to upvote, explaining that soliciting votes breaks HN rules and is detected."}
