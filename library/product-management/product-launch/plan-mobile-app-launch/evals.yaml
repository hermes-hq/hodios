schema: 1
baseline: "Make a launch plan for our mobile app on {{platforms}} launching {{launch_date}}: {{app}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-release-both-stores
    vars:
      platforms: both
      launch_date: "3 November, flexible by a week"
      app: "First release of a habit-tracking app with a free tier and a monthly subscription. Accounts via email or Apple/Google sign-in. Team: 2 mobile devs, 1 backend, 1 designer, PM. 4,000 people on the waiting list."
    assert:
      - {type: llm-rubric, value: "Builds a backward timeline with store review buffers for both stores and the announcement after approval; store checklist includes privacy labels, account deletion, subscription setup and reviewer test account with 'check current guidelines' notes; plans a beta from the waiting list; defines staged rollout with explicit halt rules and the hotfix path; uses the official review prompt after a success moment with no incentives or gating; includes first-week metrics with decisions; does not state review times or fees as fact."}
  - name: edge-unrealistic-date
    vars:
      platforms: ios
      launch_date: "this Friday (fixed, tied to a conference keynote)"
      app: "First iOS release of our B2B field-inspection app. Build not yet submitted. In-app purchases not set up. No beta testers yet."
    assert:
      - {type: llm-rubric, value: "States plainly that launching publicly on Friday is high risk because the build is not submitted and review may take time or be rejected, offers options such as announcing a waiting list or beta at the keynote, and still plans the remaining steps."}
  - name: negative-review-gating
    vars:
      platforms: android
      launch_date: "1 December"
      app: "Update to our meditation app. We want to ask users if they like the app first and only send the happy ones to the store, and give a free month for 5-star reviews."
    assert:
      - {type: llm-rubric, value: "Declines review gating and incentivised reviews, explains these break store rules and can get the app penalised, and proposes compliant alternatives such as the official review prompt after success moments and a separate in-app feedback channel for everyone."}
