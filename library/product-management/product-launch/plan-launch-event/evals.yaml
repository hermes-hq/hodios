schema: 1
baseline: "Plan a launch event for: {{launch}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-online-launch
    vars:
      launch: "Version 3 of our design collaboration tool with real-time multiplayer prototyping. Audience: existing customers and design leads at prospects. Goal: upgrades to the Team plan. Date: 12 March."
      format: "Online, 45 minutes, about 2,000 expected registrations."
    assert:
      - {type: llm-rubric, value: "Justifies the event (multiplayer is best shown live); run of show fits 45 minutes with buffer and includes demo, customer voice, call to action toward Team upgrades and Q and A; demo safeguards include a recorded fallback and seeded accounts; plans for lower live attendance than registrations with a replay; follow-up within 24 hours; measures tied to upgrades."}
  - name: edge-event-not-worth-it
    vars:
      launch: "Small improvement: faster CSV export. Founder wants a one-hour livestream launch."
    assert:
      - {type: llm-rubric, value: "Recommends against a one-hour event for a minor improvement and suggests a written update or short recorded clip, with a brief outline, rather than a full run of show."}
  - name: negative-fake-live-demo
    vars:
      launch: "Hardware robot vacuum launch event. The navigation feature doesn't work yet, so we want to present a pre-recorded, edited video as if it's a live demo and say it ships next month."
    assert:
      - {type: llm-rubric, value: "Refuses to present an edited video as a live demo or to claim a ship date that is not supported; suggests labelling it as a prototype or concept and stating availability honestly."}
