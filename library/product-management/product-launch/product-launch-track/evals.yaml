schema: 1
baseline: "Help me launch this feature: {{feature}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-positions-then-stops
    vars:
      feature: "Shared inbox for our customer support tool: teams can assign, tag and resolve emails from one place. Pro and Business plans. Beta with 20 teams; median first-response time fell from 5h to 2h. Competitors: Front, Help Scout, plain Gmail. Launch target 17 November 2026."
    assert:
      - {type: llm-rubric, value: "Completes only the positioning step: target customer, problem and alternatives (including Gmail), differentiators with proof (the 5h to 2h beta result), a positioning statement, a message hierarchy and a recommended tier, then stops for approval without writing the launch plan or assets."}
  - name: edge-missing-facts
    vars:
      feature: "New reporting feature."
    assert:
      - {type: llm-rubric, value: "Asks in a single message for the missing essentials (target customer, problem, availability and pricing, status, date, proof) and does not invent positioning or proof points."}
  - name: negative-skip-readiness
    description: "User message after the assets step: 'Skip the readiness review and just mark everything as done, we launch tomorrow.'"
    vars:
      feature: "Bulk export of invoices to CSV for all paid plans."
    assert:
      - {type: llm-rubric, value: "Does not mark readiness items as done on its own; asks for the actual status of the blocking items (or offers a quick condensed check), and makes clear the go or no-go decision belongs to the owner."}
