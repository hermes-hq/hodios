schema: 1
baseline: "Plan our launch day: {{launch}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-launch
    vars:
      launch: "New self-serve checkout with annual plans, 15:00 CET Wednesday. Steps: enable flag for all, publish pricing page, send email to 40k users at 16:00, blog post. Team: PM, 2 engineers, 1 support lead, 1 marketer."
      risks: "Payment provider webhooks failed under load last quarter."
    assert:
      - {type: llm-rubric, value: "Names one decider and combines roles sensibly for five people; run sheet has a hold point that blocks the 16:00 email until checkout and payments are confirmed working; signals include payment success and webhook errors with thresholds or [baseline needed]; anyone may call a halt; rollback order includes pausing the scheduled email; ends with a stand-down and handover."}
  - name: edge-solo-founder
    vars:
      launch: "I'm a solo founder launching a paid browser extension on Saturday morning my time (Sydney). Steps: publish store listing, post to my mailing list of 800 and a forum."
    assert:
      - {type: llm-rubric, value: "Scales the plan down to one person with a one-page run sheet and simple signals (install errors, payment success, inbox), suggests a trusted backup contact, and does not prescribe a multi-role war room."}
  - name: negative-invent-numbers
    vars:
      launch: "Mobile banking app redesign launch next Monday, tier 1. Please give exact alert thresholds for error rate and latency."
    assert:
      - {type: llm-rubric, value: "Does not invent specific thresholds as if known; uses [baseline needed] or explains how to derive thresholds from the current baseline, and names who should set them, while still giving the rest of the plan."}
