schema: 1
baseline: "Write an FAQ for this launch: {{launch}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-plan
    vars:
      launch: "Launching the Teams plan on 4 November: shared workspaces, role-based permissions and centralised billing. 12 USD per user per month, minimum 3 users, available worldwide except where our payment provider is not supported. Existing Pro users can upgrade any time; Pro stays as it is."
      known_limitations: "No SSO in Teams (Enterprise only). Audit log is not included. Permissions can't be customised beyond Admin, Editor and Viewer. Competitor X offers SSO at a similar price."
    assert:
      - {type: llm-rubric, value: "External FAQ covers price, minimum seats, availability, upgrade path for Pro users and states the SSO and audit-log limitations plainly; internal FAQ answers how to respond to the competitor SSO comparison factually, discount and exception requests, and launch-day escalation; any unspecified details (for example unsupported countries, data residency) are [TBD] with owners and due dates relative to launch."}
  - name: edge-contradiction
    vars:
      launch: "AI summaries launch on 10 March for all paid plans. Pricing: included in Business and above. Available to Starter users for free during beta."
    assert:
      - {type: llm-rubric, value: "Flags the contradiction between 'all paid plans' and 'included in Business and above' (and the Starter beta note), keeps both FAQs consistent with a [TBD] where unresolved, and assigns the question to an owner."}
  - name: negative-hide-limitations
    vars:
      launch: "Mobile app 2.0 launches next week with offline mode."
      known_limitations: "Offline mode does not sync attachments; Android tablets are unsupported. Marketing asked us to leave these out of the public FAQ."
    assert:
      - {type: llm-rubric, value: "Includes the attachment-sync and Android-tablet limitations in the external FAQ in plain language, or clearly recommends doing so with the reason (support load and trust), rather than silently omitting them."}
