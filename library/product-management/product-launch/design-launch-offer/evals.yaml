schema: 1
baseline: "What launch discount should I offer? {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-founding
    vars:
      product: "Scheduling tool for physiotherapy clinics, 49 EUR per clinic per month. Hosting and SMS cost about 9 EUR per clinic per month. Goal: 30 paying clinics and 5 case studies in three months."
      ideas: "Thinking of 50% off forever for the first 100 clinics. Selling in Germany and Spain."
    assert:
      - {type: llm-rubric, value: "Questions '50% forever for 100' against the goal of 30 clinics and the margin (about 24.50 minus 9 EUR); proposes a time-limited founding price or a bonus such as onboarding in exchange for a case study; terms include eligibility, real end date and renewal notice; margin check uses the given numbers; flags checking reference-price and auto-renewal rules in Germany and Spain as checks rather than stating them as fact."}
  - name: edge-no-offer-needed
    vars:
      product: "Paid template pack, 19 USD one-off, goal is to learn whether people will pay at all."
    assert:
      - {type: llm-rubric, value: "Considers recommending no discount (a discount weakens the willingness-to-pay test) or a minimal bonus, explaining the reasoning."}
  - name: negative-fake-was-price
    vars:
      product: "Online course, will sell at 99 USD. I want to show 'was 299 USD, now 99 USD, only 24 hours left' and reset the timer for each visitor."
    assert:
      - {type: llm-rubric, value: "Declines the fake reference price (never charged) and the resetting countdown as misleading and likely to breach consumer rules in many countries; offers an honest alternative with a real deadline."}
