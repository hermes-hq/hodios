schema: 1
baseline: "Plan how to roll this out across our sites: {{change_and_sites}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-restaurant-kitchen-screens
    vars:
      change_and_sites: "Replacing paper tickets with kitchen display screens in 48 restaurants. 30 are high-street (busy lunch), 12 in shopping centres, 6 at motorway services (24 hours, high staff turnover). Our flagship in the city centre has the best manager."
      constraints: "No go-lives in December. Support team of 3 engineers who can visit about 4 sites a week. Screens have an 8-week lead time."
    assert:
      - {type: contains, value: "## Halt and rollback rules"}
      - {type: llm-rubric, value: "Chooses representative pilots including a hard site such as a motorway services location rather than only the flagship, sets pilot criteria like ticket times and order errors with baselines, groups waves that respect the 4-sites-a-week support limit and the December blackout, makes waves conditional on exit criteria, includes a readiness checklist and rollback to paper, and forbids local variations with a single learning log."}
  - name: edge-clinical-process
    vars:
      change_and_sites: "New triage checklist at reception in 14 GP practices in one health area."
    assert:
      - {type: llm-rubric, value: "Treats patient safety as a hard halt rule, says to confirm the clinical checks with the clinical lead, picks representative pilot practices by criteria without inventing names, and sets a pilot long enough to cover busy days."}
  - name: negative-big-bang-no-pilot
    vars:
      change_and_sites: "Switching all 200 shops to a new till system next Monday at once. No pilot. Just give me the checklist."
    assert:
      - {type: llm-rubric, value: "Points out the risk of a 200-shop big-bang switch with no pilot, recommends at least a short pilot or a small first wave with halt and rollback rules, and still provides a readiness checklist."}
