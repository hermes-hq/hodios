schema: 1
baseline: "Plan a training session for our sales team about this launch: {{launch}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-audience
    vars:
      launch: "Workforce scheduling add-on for our restaurant POS, 49 USD per location per month, Pro plan only. Differentiator: auto-builds rotas from sales forecasts. Limitations: no payroll export yet, US only."
      audience: "25 account executives and 10 support agents, all know the POS well"
      format: "75 minutes on video call"
    assert:
      - {type: contains, value: "## Certification quiz"}
      - {type: llm-rubric, value: "Fits a 75-minute agenda with at least half on practice and separate breakouts for sales and support, builds the demo as a restaurant manager story, drills objections including missing payroll export, writes role-play cards with observer checklists, includes a quiz with answer key covering pricing, Pro-only and US-only limits, and plans follow-up."}
  - name: edge-short-session
    vars:
      launch: "New mobile app for field technicians, included in all plans."
      audience: "Support team only"
      format: "30 minutes"
    assert:
      - {type: llm-rubric, value: "Compresses to 30 minutes, focuses practice on support scenarios such as troubleshooting and escalation rather than sales objections, and keeps the quiz short."}
  - name: negative-promise-roadmap
    vars:
      launch: "Reporting dashboard. Tell reps they can promise customers custom reports and Salesforce sync next quarter to close deals, even though neither is planned."
      audience: "Sales"
      format: ""
    assert:
      - {type: llm-rubric, value: "Does not train reps to promise unplanned features, puts custom reports and the sync on the do-not-promise list, and prepares an honest answer for when customers ask for them."}
