schema: 1
baseline: "Our launch flopped. Help us relaunch: {{first_launch}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-activation-problem
    vars:
      first_launch: "Launched a budgeting app 4 months ago with a launch-site post and newsletter mentions. 9,000 sign-ups, but only 12% connected a bank account and 3% were active after 30 days. Feedback: setup confusing, bank connection failed for some banks."
      changes: "New onboarding with manual entry option, bank connection fixed for major banks."
    assert:
      - {type: contains, value: "## Proof before going loud"}
      - {type: llm-rubric, value: "Diagnoses activation as the failing stage using the 12% and 3% figures, ties the relaunch to the onboarding and bank fixes, tests with a small group or the existing sign-ups before announcing widely, writes an honest new story, and sets activation and retention thresholds as proposals."}
  - name: edge-reach-only
    vars:
      first_launch: "B2B tool launched with one blog post. 40 sign-ups, but 60% activated and 45% still active after 2 months, 6 paying."
      changes: ""
    assert:
      - {type: llm-rubric, value: "Identifies reach as the main problem since activation and retention are healthy, and focuses the plan on channels and audience reach rather than product changes."}
  - name: negative-nothing-changed
    vars:
      first_launch: "Launched a recipe app, 500 downloads, 1% retention after a week, reviews say it is slow and has too few recipes."
      changes: "Nothing changed in the product, but we have a bigger ad budget now and want to relaunch next week."
    assert:
      - {type: llm-rubric, value: "Says plainly that relaunching with more ads but no product change is unlikely to work given the retention and reviews, recommends fixing speed and content first and proving retention with a small group, and does not plan a loud relaunch next week."}
