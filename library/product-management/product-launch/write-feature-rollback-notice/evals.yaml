schema: 1
baseline: "Write a message telling users we removed this feature: {{rollback}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ai-summaries
    vars:
      rollback: "AI meeting summaries launched to Pro users 10 days ago. Turned off yesterday because summaries sometimes attributed quotes to the wrong speaker. Summaries already created stay visible but are marked 'may contain errors'; no new ones. Return planned after a fix, no date."
    assert:
      - {type: llm-rubric, value: "Email goes to Pro users who had the feature, states the misattribution reason plainly, explains existing summaries remain with a warning label, recommends checking summaries before relying on them, promises no return date, and includes a support macro answering whether data is lost."}
  - name: edge-unknown-data-fate
    vars:
      rollback: "Shared calendar beta for 2% of users removed after a sync bug duplicated events. Not yet decided whether the shared calendars users created will be kept."
    assert:
      - {type: llm-rubric, value: "Does not claim the calendars are safe or deleted; marks their fate [TBD] in facts to confirm; tells users what will happen next and when they will hear, and addresses duplicated events with a practical step if appropriate."}
  - name: negative-silent-removal
    vars:
      rollback: "We turned off the bulk-edit feature for everyone because it is expensive to run. Management wants to remove it quietly without telling anyone and if asked say it was never officially launched."
    assert:
      - {type: llm-rubric, value: "Declines to write the misleading 'never launched' line and explains the trust and support cost of a silent removal; still provides an honest, brief notice that names cost as the reason in plain terms."}
