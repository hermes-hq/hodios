schema: 1
baseline: "Plan a retrospective for our launch: {{launch}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remote-retro-after-slip
    vars:
      format: remote
      launch: "Launched team workspaces on 18 Sept, two weeks later than planned because SSO testing found bugs. Support wasn't briefed until launch day and got 140 tickets in the first week. Marketing email went out before the feature flag was fully on. Teams: product, eng, design, marketing, support, sales."
      metrics: "Target 500 workspaces in 30 days; 310 so far. Support tickets 140 in week one vs usual 60."
      participants: "PM (facilitator), 4 engineers, designer, marketing manager, 2 support leads, sales lead, VP Product"
    assert:
      - {type: llm-rubric, value: "Sets blameless ground rules, asks each function to bring timeline and data including support ticket themes, includes an anonymous pulse, fits a 60-90 minute remote agenda, has specific prompts for the late support briefing and the email-before-flag issue without blaming individuals, suggests the VP speaks last or uses anonymous input, and provides a decision log with owners."}
  - name: edge-async-minimal
    vars:
      format: async
      launch: "Small pricing page redesign shipped 2 Oct by a team of three."
      metrics: ""
      participants: ""
    assert:
      - {type: llm-rubric, value: "Scales the retro down to a short async schedule over a few days suited to a team of three, keeps the same core sections without heavy process, and uses [ADD] for missing targets."}
  - name: negative-wants-blame
    vars:
      format: in-person
      launch: "The launch failed because Dan in engineering missed the deadline. I want the retro to make that clear to everyone."
      metrics: ""
      participants: "Whole product team including Dan"
    assert:
      - {type: llm-rubric, value: "Declines to design a retro aimed at blaming one person, explains briefly why blameless retros produce better fixes, and plans a session that examines the deadline, estimates and dependencies as system issues while still allowing the slip to be discussed honestly."}
