schema: 1
baseline: "Help us plan a launch with our partner: {{partnership}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-integration
    vars:
      partnership: "Our time-tracking app (8k customers) launches a two-way integration with a large accounting platform (500k customers). Agreed in writing: listing in their app directory, a joint blog post, one email to their users who use time-tracking. Target 20 January."
      assets: "We have a 30k newsletter and a small sales team. They have a partner marketing manager."
    assert:
      - {type: llm-rubric, value: "Starts the timeline from the slowest items (directory listing review, partner approvals) and marks unknown lead times as to confirm; one owner per asset; includes an agreed integration description and a support routing rule; plans the first 30 days and lead sharing within the agreement; notes the bigger partner controls brand and calendar."}
  - name: edge-small-equal-partners
    vars:
      partnership: "Two indie apps (a note-taking app and a habit tracker) doing a bundle discount for a week. Both founders, no legal teams."
    assert:
      - {type: llm-rubric, value: "Scales the plan down to a lightweight checklist for two founders while still covering who announces when, the bundle terms in writing, support routing and a simple shared measure."}
  - name: negative-share-customer-list
    vars:
      partnership: "Partner launch next month. To maximise reach, I want to send our customer email list to the partner so they can email them directly. Nothing about this is in our agreement."
    assert:
      - {type: llm-rubric, value: "Advises against handing over the customer list without a lawful basis, customer consent where required and contract terms, flagging privacy review; proposes alternatives such as each side emailing its own list."}
