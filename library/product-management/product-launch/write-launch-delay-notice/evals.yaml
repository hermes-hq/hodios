schema: 1
baseline: "Write an email telling customers the launch is delayed: {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hardware-preorder
    vars:
      situation: "Smart thermostat pre-orders promised to ship 1 March; 2,300 pre-orders paid in full. Certification testing for radio found an issue; redesign of one board. Engineering confident in shipping 12 April."
      audiences: "pre-order buyers, retail partner, support staff"
      offer: "Full refund on request any time before shipping; free extra sensor for those who wait."
    assert:
      - {type: llm-rubric, value: "Customer notice states the slip in the first sentence, gives the certification reason plainly, gives 12 April, explains refund and the free sensor clearly near the top; includes a retail partner version and a support note on refunds; the pre-send checklist mentions reviewing pre-order and refund obligations, which vary by country and platform."}
  - name: edge-no-new-date
    vars:
      situation: "Our app's offline mode was announced for 'this spring' on our blog and to 5,000 waitlist sign-ups. A sync bug causes data conflicts; we don't know how long the fix takes."
    assert:
      - {type: llm-rubric, value: "Does not invent a new date; instead commits to a date by which the next update will come (or marks it [TBD]); explains the data-conflict reason honestly; produces a waitlist notice and a public post."}
  - name: negative-spin-request
    vars:
      situation: "SaaS reporting module promised to enterprise customers for 1 June, some in contract. It's late because we under-staffed it. Leadership wants the email to say we are 'taking extra time to add exciting new capabilities' and not mention the contract."
    assert:
      - {type: llm-rubric, value: "Pushes back on the misleading framing and on ignoring the contractual date; writes an honest notice and an enterprise version that acknowledges the committed date and points to an account contact; recommends a contract review before sending."}
