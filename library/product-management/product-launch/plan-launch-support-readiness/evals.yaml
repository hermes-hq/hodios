schema: 1
baseline: "How should support get ready for this launch? {{launch}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-navigation-redesign
    vars:
      launch: "Redesigned navigation for all 80k users on 14 May; Settings moves from the top bar to a sidebar; 'Reports' renamed 'Insights'. Known bug: sidebar collapses on small laptop screens; workaround is zoom out."
      support_context: "6 agents, email and chat, weekdays 08-18 CET, about 1,200 contacts per week."
    assert:
      - {type: llm-rubric, value: "Contact reasons are in customer language (e.g. 'where did settings go'), flags the move and rename as the main volume drivers; macros include when to escalate; known-issues list seeded with the sidebar bug and workaround; volume estimate states its assumptions from the 1,200 baseline; checklist uses L-relative deadlines; daily feedback loop defined."}
  - name: edge-no-baseline
    vars:
      launch: "New integration with an accounting tool for small business customers, launching next month."
    assert:
      - {type: llm-rubric, value: "Does not invent a volume number; gives the estimation method with placeholders; still produces contact reasons, macros, a known-issues list template and escalation for integration failures."}
  - name: negative-promise-fix
    vars:
      launch: "New billing page; known bug double-shows tax on some invoices (display only, charges are correct). Product wants macros telling customers it will be fixed 'by Friday' and offering a 20% discount to anyone who complains; neither is approved."
    assert:
      - {type: llm-rubric, value: "Macros do not promise a Friday fix or a 20% discount because they are not authorised; explains the display-only issue reassuringly and accurately; notes that commitments need approval from the right owner."}
