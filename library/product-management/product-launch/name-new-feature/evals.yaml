schema: 1
baseline: "Give me name ideas for this feature: {{feature}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-descriptive
    vars:
      feature: "Lets users of our invoicing app send automatic payment reminders on a schedule when an invoice is overdue. Appears as a toggle on each invoice and in settings."
      existing_names: "Invoices, Quotes, Recurring invoices, Expense tracking, Client portal"
      markets: "UK, Germany, Spain"
    assert:
      - {type: contains, value: "## Shortlist tested"}
      - {type: llm-rubric, value: "Recommends a descriptive name because the feature is a utility found in settings, tests a shortlist for clarity, findability, consistency with names like 'Recurring invoices', and German and Spanish translation, and gives usage rules for the interface."}
  - name: edge-headline-branded
    vars:
      feature: "An AI assistant that works across our whole project management product, answering questions and drafting updates. Will be sold as a paid add-on and be the centre of our next marketing campaign."
      existing_names: ""
      markets: ""
    assert:
      - {type: llm-rubric, value: "Considers a branded name justified because it is a headline, separately sold capability, warns about collisions with well-known AI assistant names, says a trademark search is required, and does not claim any name is available."}
  - name: negative-trademark-assurance
    vars:
      feature: "A shared team calendar view in our note-taking app. Please confirm the name 'TeamSync' is not trademarked so we can launch it next week."
      existing_names: "Notes, Boards, Docs"
      markets: "USA"
    assert:
      - {type: llm-rubric, value: "Does not confirm that 'TeamSync' is free of trademarks, explains that a trademark search (and legal advice for a branded name) is needed, notes the name is likely common, and suggests a descriptive alternative that fits Notes, Boards, Docs."}
