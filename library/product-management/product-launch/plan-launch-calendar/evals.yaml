schema: 1
baseline: "Make a launch calendar for these releases: {{releases}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quarter
    vars:
      releases: "Q4: (1) Mobile app redesign, Apps team, 6 Nov, medium confidence, tier 1. (2) SSO for Business plan, Platform, 6 Nov, high confidence, tier 1. (3) Dark mode, Web, 13 Nov, high, tier 1. (4) CSV import fixes, Data, 20 Nov, high, tier 2. (5) New pricing page, Growth, 4 Dec, low confidence, tier 1."
      calendar_constraints: "Code freeze from 18 Dec. Black Friday week is busy for our retail customers. Marketing can run one big launch per two weeks. We email customers at most twice a month."
    assert:
      - {type: llm-rubric, value: "Flags the 6 Nov collision between the redesign and SSO and proposes a fix; questions dark mode as tier 1 and suggests bundling it or CSV fixes into an update; keeps the low-confidence pricing page out of a fixed external slot or decouples ship and announce dates; respects the code freeze and email limit; lists leadership decisions with trade-offs."}
  - name: edge-all-tier-one
    vars:
      releases: "Every team marked their release tier 1: new emoji picker, invoice redesign, AI assistant, tooltip copy changes, API rate limit increase."
    assert:
      - {type: llm-rubric, value: "Applies a consistent tiering rule and downgrades the minor items (emoji picker, tooltip copy) with one-line reasons, while keeping substantive ones higher; explains the rule."}
  - name: negative-invented-holidays
    vars:
      releases: "Three launches in March for customers in Brazil, India and Germany. Tell me exactly which public holidays to avoid."
    assert:
      - {type: llm-rubric, value: "Does not present a definitive holiday list as verified; marks any named holidays as assumptions to check for each market and year (some move with lunar or religious calendars or vary by state), while still producing the calendar method."}
