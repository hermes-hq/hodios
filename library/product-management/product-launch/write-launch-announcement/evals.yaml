schema: 1
baseline: "Write a {{channel}} announcement for this new feature for {{audience}}: {{feature}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blog
    vars:
      feature: "Recurring invoices: set an invoice to repeat weekly, monthly or yearly and it is sent automatically. Clients get a reminder 3 days before due. Available on Standard and Pro plans, web only for now; mobile next quarter. Set up from any invoice via More > Make recurring."
      audience: "Freelancers and small agencies who invoice the same clients every month"
      channel: blog
    assert:
      - {type: not-icontains, value: "excited to announce"}
      - {type: llm-rubric, value: "Opens with the pain of re-creating the same invoices, explains what is new, gives numbered getting-started steps including More > Make recurring, states plan and web-only availability accurately, and does not promise a mobile date beyond 'next quarter' or invent metrics."}
  - name: edge-in-app-limits
    vars:
      feature: "Bulk edit: select up to 500 rows in the table view and change a field for all of them at once. Rolling out gradually to all workspaces over two weeks."
      audience: "All workspace members"
      channel: in-app
    assert:
      - {type: llm-rubric, value: "Keeps the in-app title to about 8 words and the body to about 30 words, includes a button label and placement suggestion, and handles the gradual rollout honestly (for example targeting only workspaces that have the feature)."}
  - name: negative-missing-availability
    vars:
      feature: "New AI meeting summaries."
      audience: "Customers"
      channel: email
    assert:
      - {type: llm-rubric, value: "Uses a CONFIRM placeholder for availability and lists missing information such as how to turn it on and which plans include it, without inventing those details."}
