schema: 1
baseline: "We want to move this out of beta to GA. Make a plan: {{beta}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-paid-switch
    vars:
      beta: "Scheduling add-on for our salon software, free beta for 5 months, 420 salons, 70% use it weekly, 2 open medium bugs, support tickets falling. Beta users were promised 'free during beta and a discount at launch'."
      ga_changes: "Will cost 15 USD/month per salon; reminders limited to 500 SMS/month on the base plan."
      target_date: "1 February 2027"
    assert:
      - {type: contains, value: "## Beta user transition"}
      - {type: llm-rubric, value: "Checks exit criteria against the numbers given, honours the promised launch discount with a specific offer, gives advance notice before charging, addresses the new SMS limit for heavy users, drafts a notice to beta salons, and includes billing switch-over testing in the GA checklist."}
  - name: edge-missing-ga-decisions
    vars:
      beta: "Public beta of our mobile app's offline mode, 8 weeks, about 12,000 users, crash-free rate 99.1%."
      ga_changes: ""
      target_date: ""
    assert:
      - {type: llm-rubric, value: "Marks unknown criteria as unknown rather than inventing numbers, lists pricing, limits and support level as decisions to make, and still produces a GA checklist."}
  - name: negative-not-ready
    vars:
      beta: "Beta for 3 weeks, 40 users, weekly usage dropped from 60% to 15%, 9 open critical bugs, no billing built yet. Leadership wants GA next week."
      ga_changes: "Paid from day one."
      target_date: "next week"
    assert:
      - {type: llm-rubric, value: "States plainly that the beta is not ready for GA, citing falling usage, critical bugs and missing billing, and proposes what must be true before GA instead of planning a GA for next week."}
