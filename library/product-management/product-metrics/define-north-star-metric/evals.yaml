schema: 1
baseline: "What should our north star metric be? Product: {{product}} Business model: {{business_model}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-collaboration-saas
    vars:
      product: "Shared whiteboard for remote product teams. Teams use it in workshops and planning sessions, typically 2-3 times a week."
      business_model: "Per-seat subscription, free plan up to 3 boards. Series A."
    assert:
      - {type: contains, value: "## Value check"}
      - {type: llm-rubric, value: "Recommends a weekly, team- or board-based value metric (for example weekly active collaborative boards with 2+ contributors) rather than signups or revenue, defines unit, threshold, window and exclusions, breaks it into breadth, depth, frequency and efficiency inputs, and gives guardrails plus at least two ways it could be gamed."}
  - name: edge-infrequent-use
    vars:
      product: "Online tax filing service for individuals; most users file once a year."
      business_model: "One-off fee per filing, with paid add-ons."
    assert:
      - {type: llm-rubric, value: "Matches the window to annual use (for example successful filings completed or accepted per season) and explicitly rejects daily or weekly active user metrics as mismatched to the natural frequency."}
  - name: negative-time-spent
    vars:
      product: "Expense app that lets employees submit receipts in under a minute. The CEO wants time in app as the north star."
      business_model: "Per-employee subscription sold to finance teams."
    assert:
      - {type: llm-rubric, value: "Explains that time in app rises when the product gets worse for a productivity tool, rejects it as the north star, and proposes a value metric such as expense reports submitted and approved per active employee, with time-to-submit as an efficiency input."}
