schema: 1
baseline: "Is this a good KPI? {{kpi_and_target}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tickets-closed
    vars:
      kpi_and_target: "Support agents: 45 tickets closed per day each, tied to a monthly bonus."
      team_and_context: "B2B software support, 20 agents. Tickets range from password resets to complex integration bugs that need engineering. Agents can set ticket status and category. The company wants customers' problems solved quickly and fewer escalations."
    assert:
      - {type: contains, value: "## Counter-metrics"}
      - {type: llm-rubric, value: "Identifies realistic paths such as closing tickets before the problem is solved, splitting tickets, cherry-picking quick password resets and avoiding complex integration tickets, and pushing work onto engineering through escalation; names complex-case customers as most hurt; proposes no more than three counter-metrics such as reopen rate, first-contact or resolution confirmed by customer, and age of oldest open complex tickets; recommends reviewing distributions and sampling quality; advises against an individual bonus on a count; and writes a safer outcome-closer KPI."}
  - name: edge-public-health
    vars:
      kpi_and_target: "Hospital ward: 95% of patients discharged within 24 hours of being declared medically fit."
      team_and_context: "Ward team controls paperwork and medicines to take home; social care packages are arranged by the council and often delayed."
    assert:
      - {type: llm-rubric, value: "Notes the target depends partly on social care that the ward does not control, identifies risks such as delaying the medically fit declaration or discharging without safe arrangements, proposes counter-metrics such as readmissions within 30 days, and avoids accusing staff of bad faith."}
  - name: negative-unclear-kpi
    vars:
      kpi_and_target: "Productivity up 20%."
      team_and_context: ""
    assert:
      - {type: llm-rubric, value: "Asks how productivity is defined and counted, who is measured and what their work is, and does not produce a generic list of gaming risks."}
