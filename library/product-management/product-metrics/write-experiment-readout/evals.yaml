schema: 1
baseline: "Write up these experiment results. Hypothesis: {{hypothesis}} Results: {{results}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-checkout-test
    vars:
      hypothesis: "Showing delivery dates on the product page will increase checkout conversion by at least 0.5 percentage points because uncertainty about delivery causes drop-off."
      results: "Ran 14 days as planned, 50/50 split. Control: 40,000 users, 2,000 purchases (5.0%). Variant: 40,100 users, 2,240 purchases (5.59%). Guardrail: average order value control $62.10, variant $61.80 (tool says not significant). Pre-planned decision rule: ship if the primary metric lift is positive with a 95% CI excluding zero and AOV does not drop significantly. Exploratory: mobile users showed +1.1 pp, desktop +0.1 pp. About 40,000 users a week reach the product page."
      audience: product and leadership stakeholders
    assert:
      - {type: contains, value: "## TL;DR"}
      - {type: contains, value: "## What this does not tell us"}
      - {type: llm-rubric, value: "Leads with Ship, quoting the pre-set rule; reports a lift of about 0.59 percentage points from a 5.0% base (about 11.7% relative) with a 95% range of roughly 0.28 to 0.90 pp and the arithmetic in an appendix; says the point estimate meets the predicted 0.5 pp but the range includes smaller lifts; translates the lift into roughly 235 extra purchases a week (range about 110 to 360) from the 40,000 weekly users; reports the AOV guardrail as held; puts the mobile versus desktop difference under what the test does not tell us rather than as a finding; and keeps the TL;DR to three plain lines."}
  - name: edge-flat-for-leadership
    vars:
      hypothesis: "Adding customer testimonials to the pricing page will raise trial starts by 10% relative, because visitors doubt that teams like theirs succeed with the product."
      results: "Ran 21 days as planned, 50/50. Tool output: control trial-start rate 3.20% (n=18,450), variant 3.31% (n=18,390); relative change +3.4%, 95% CI -7.8% to +14.7%; sample ratio check passed. The test had 80% power to detect a 16% relative change. Pre-set rule: ship if the 95% CI excludes zero."
      audience: the leadership team
    assert:
      - {type: llm-rubric, value: "Applies the pre-set rule and does not ship on this evidence; explains in plain words that the test found no change it could detect and the true effect could be anywhere from about -8% to +15%; points out the test could not reliably detect the predicted 10% because it was powered for 16%; does not conclude that testimonials do not work; frames what was learned and proposes sensible next steps (for example a bolder change or a larger test); uses the tool's interval rather than inventing new numbers; and keeps statistical jargon out of the TL;DR."}
  - name: negative-no-numbers
    vars:
      hypothesis: "New onboarding increases activation."
      results: "The variant felt better and the team liked it. The dashboard was green."
      audience: product and leadership stakeholders
    assert:
      - {type: llm-rubric, value: "Asks for users and outcomes per variant (or the tool's effect estimate and interval) and stops, without inventing results or declaring a winner."}
