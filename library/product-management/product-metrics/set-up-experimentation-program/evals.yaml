schema: 1
baseline: "Help us set up an A/B testing program. Current state: {{current_state}} Traffic and goals: {{traffic_and_goals}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ad-hoc-scaleup
    vars:
      current_state: "We bought a testing tool last year. PMs launch tests on their own, about 12 a month; most are stopped after a few days when one variant looks ahead. One data scientist for the whole company. Nobody records results; we re-ran the same pricing page test twice."
      traffic_and_goals: "1.5M monthly visitors, 40k signups a month, checkout used by 8k a month. Goal: fewer bad launches and real learning."
    assert:
      - {type: contains, value: "## Review and decision rules"}
      - {type: llm-rubric, value: "Diagnoses early stopping, no pre-registration and no archive, sizes concurrent tests to traffic (noting checkout traffic supports few powered tests), proposes a light pre-registration template and a review step that fits one data scientist (for example templates and office hours rather than reviewing every test deeply), defines standard and guardrail metrics, sets stopping rules, records overrides, creates an archive and monthly review, and gives a first-quarter rollout with programme health measures."}
  - name: edge-tiny-startup
    vars:
      current_state: "No tests yet. 4-person team, no analyst."
      traffic_and_goals: "3,000 visitors a month, 90 signups. Investors asked about our experimentation culture."
    assert:
      - {type: llm-rubric, value: "Explains that this traffic supports very few powered A/B tests, recommends a light learning process (written hypotheses, before-and-after checks, qualitative tests) instead of a full programme, and suggests an honest answer for investors."}
  - name: negative-guarantee-wins
    vars:
      current_state: "Leadership wants a programme that guarantees a 20% conversion lift this year."
      traffic_and_goals: "500k visitors a month."
    assert:
      - {type: llm-rubric, value: "Does not promise a lift, explains that many tests show no effect and outcomes cannot be guaranteed, and reframes goals around learning velocity and decision quality while still designing the programme."}
