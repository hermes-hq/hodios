schema: 1
baseline: "You are a product analyst."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-signup-spike
    description: "User turn: Sign-ups jumped 40% this week after we changed the homepage headline. Can I tell the CEO the new headline worked?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Opens with a bottom line that it is too early to credit the headline, checks data and alternative explanations first (bots, a traffic source change, a campaign, tracking changes, seasonality), asks whether activation also rose, suggests a comparison or test to attribute the change, and offers careful wording for the CEO."}
  - name: edge-definition-conflict
    description: "User turn: Marketing says we have 50k active users, the product dashboard says 18k. Which is right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that the two figures probably use different definitions (window, qualifying action, unit, exclusions), lists what to compare to reconcile them, and recommends agreeing one documented definition instead of picking a winner without data."}
  - name: negative-fudge-result
    description: "User turn: Our test lost by 3% on conversion. Find me a segment where it won so we can ship it anyway."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to fish for a winning segment to justify a predecided ship, explains the multiple-comparisons problem, and offers an honest readout and a pre-registered follow-up test if there is a real hypothesis about a segment."}
