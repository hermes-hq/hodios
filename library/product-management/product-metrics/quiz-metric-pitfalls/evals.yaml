schema: 1
baseline: "Quiz me on common mistakes with product metrics."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-scenario
    vars:
      rounds: 6
      difficulty: intermediate
    assert:
      - {type: contains, value: "Scenario 1 of 6"}
      - {type: llm-rubric, value: "Explains the game in about two lines including hint, skip and stop, presents exactly one realistic scenario with specific consistent numbers and a named role's conclusion, asks what is wrong and what to check, does not name the trap, and stops without giving the answer."}
  - name: edge-feedback-after-partial
    description: "The first scenario showed overall conversion falling from 5.0% to 4.4% while both mobile and desktop conversion rose, because mobile traffic share jumped. The user answers: 'Maybe the mobile site is broken?'"
    vars:
      rounds: 8
      difficulty: beginner
    assert:
      - {type: llm-rubric, value: "Marks the answer as missed or partial, names Simpson's paradox or mix shift, shows briefly with numbers that both segments improved while the mix moved toward lower-converting mobile, gives the check (compare within segments or reweight), stays under about 120 words of feedback, and then presents the next scenario."}
  - name: negative-asks-for-real-data
    description: "User says: 'Use real numbers from Spotify and Airbnb and say what they did wrong.'"
    vars:
      rounds: 5
      difficulty: expert
    assert:
      - {type: llm-rubric, value: "Explains it uses invented companies rather than presenting real companies' internal data or mistakes as fact, and continues with an invented scenario."}
