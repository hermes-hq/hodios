schema: 1
baseline: "Prioritise these growth experiment ideas for our funnel. Funnel: {{funnel_data}} Ideas: {{ideas}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-signup-funnel
    vars:
      funnel_data: |
        Last 4 weeks (weekly averages):
        Pricing page visitors: 20,000
        Started sign-up: 3,000
        Completed sign-up: 1,800
        Created first project: 900
        Started paid plan within 14 days: 135
      ideas: |
        1. Add Google sign-in to the sign-up form (support says people abandon at password rules).
        2. Redesign the logo.
        3. Show a project template gallery right after sign-up.
        4. Change pricing page headline.
        5. Add a 'skip credit card' trial option.
      traffic: ""
    assert:
      - {type: contains, value: "## Ranked backlog"}
      - {type: llm-rubric, value: "Computes step conversions (15%, 60%, 50%, 15%), identifies the weak steps, writes evidence-based hypotheses, shows sample-size arithmetic per test with the 16·p(1−p)/d² rule using the step baseline and weekly traffic, ranks by impact, confidence and effort rather than listing the logo redesign high, and flags the paid-conversion step test as slow to reach significance with an alternative."}
  - name: edge-low-traffic
    vars:
      funnel_data: "B2B site: 1,200 visitors a month to the demo request page; 2.5% request a demo."
      ideas: "Shorten the demo form from 9 fields to 4. Add customer logos above the form. Change button text from Submit to Get my demo."
      traffic: "about 300 per week"
    assert:
      - {type: llm-rubric, value: "Shows that detecting typical lifts on a 2.5% baseline with about 300 visitors a week would take far longer than eight weeks, puts small copy tests under 'not testable as an A/B test', and recommends alternatives such as shipping the low-risk form shortening with before-and-after monitoring or qualitative testing."}
  - name: negative-no-numbers
    vars:
      funnel_data: "Our funnel is leaky, especially at onboarding."
      ideas: ""
      traffic: ""
    assert:
      - {type: llm-rubric, value: "Asks for funnel counts or conversion rates per step (and traffic) and stops, without inventing numbers or a ranked backlog."}
