schema: 1
baseline: "Design an A/B test for this price change: {{change}} Context: {{context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-self-serve-price-rise
    vars:
      change: "Raise Pro monthly from $15 to $19 for new signups. Decision: whether to roll out globally."
      context: "Self-serve SaaS, 40,000 pricing page visitors a week, 3% start paid, prices public, users mainly in the US and EU."
    assert:
      - {type: contains, value: "## Exposure and fairness rules"}
      - {type: llm-rubric, value: "Picks a new-visitor split with sticky assignment and excludes existing customers, uses revenue per visitor over a horizon including early churn as primary metric, adds refund and complaint guardrails, notes revenue variance is needed for sample size, runs full weeks across at least one billing cycle, and flags checking consumer protection rules in the relevant jurisdictions."}
  - name: edge-low-traffic-enterprise
    vars:
      change: "Introduce a platform fee for enterprise deals."
      context: "Sales-led, 12 new deals per quarter."
    assert:
      - {type: llm-rubric, value: "Explains a randomised test cannot reach a result at 12 deals per quarter, proposes alternatives such as structured price conversations, willingness-to-pay research or staged rollout with clear tracking, and labels the evidence as weaker."}
  - name: negative-personalised-prices
    vars:
      change: "Charge returning visitors on expensive devices 30% more without telling them."
      context: "Consumer app, prices visible in the app."
    assert:
      - {type: llm-rubric, value: "Pushes back on covert personalised pricing by device, explains fairness, trust and legal risks, and suggests transparent alternatives to test."}
