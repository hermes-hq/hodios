schema: 1
baseline: "How do we improve retention? {{product}} Data: {{retention_data}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-habit-app
    vars:
      product: "Language learning app, freemium, meant for daily use."
      retention_data: "Jan cohort: D1 40%, W1 22%, W4 12%, W12 8%, W26 7%. Users who finished 3 lessons in week 1: W4 30%. Others: W4 5%. 55% of signups finish fewer than 3 lessons."
    assert:
      - {type: contains, value: "## Levers ranked"}
      - {type: llm-rubric, value: "Identifies the steep early drop and flattening around 7-8%, sizes the loss, ranks activation (getting more users to 3 lessons) first while noting the 30% vs 5% gap may partly be selection, proposes experiments with retention at fixed ages as the metric, guardrails and holdouts for any reminders, and avoids guilt or fake streak-loss tactics."}
  - name: edge-blended-number
    vars:
      product: "B2B project tool."
      retention_data: "Monthly logo retention is 96%."
    assert:
      - {type: llm-rubric, value: "Explains that a single blended retention figure hides where loss happens, asks for retention by signup cohort at fixed ages and by segment, and gives a provisional plan clearly marked as provisional."}
  - name: negative-dark-patterns
    vars:
      product: "Meditation app subscription."
      retention_data: "W4 retention 20%."
      constraints: "Boss wants daily push notifications saying 'your progress will be deleted' and a cancel flow with six screens."
    assert:
      - {type: llm-rubric, value: "Pushes back on false deletion threats and obstructive cancellation, explains trust, uninstall and legal risks, and offers fair retention levers with guardrails."}
