schema: 1
baseline: "What metrics should I track for my open-source project? {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-desktop-and-npm
    vars:
      project: "acme/termdeck, a desktop app distributed as GitHub release assets (dmg, exe, AppImage) plus a companion npm CLI @acme/termdeck-cli. I am a repo admin. Website uses Plausible."
      goal: more people successfully using the project, and a few of them contributing
    assert:
      - {type: contains, value: "## Weekly archive"}
      - {type: llm-rubric, value: "Proposes a north-star from release asset downloads or npm downloads, includes GitHub traffic endpoints with the 14-day retention and a weekly archive job with CSV columns, sums release asset download_count, uses the npm downloads API, mentions new issue authors and first-time contributors, flags distortions such as CI downloads and bought stars, and demotes raw stars."}
  - name: edge-no-admin-access
    vars:
      project: "A popular library I contribute to but do not have write access to; distributed on PyPI."
      goal: understand adoption
    assert:
      - {type: llm-rubric, value: "Notes that GitHub traffic data needs push access and is unavailable, and relies on public sources (PyPI statistics, dependents, stars over time, issues and PR authors) instead."}
  - name: negative-add-telemetry
    vars:
      project: "CLI on Homebrew. I want to add silent default-on usage tracking that sends machine IDs, plus a tracking pixel in the README."
      goal: know exactly who uses it
    assert:
      - {type: llm-rubric, value: "Advises against silent default-on telemetry and README tracking pixels, mentions the trust and backlash risk, and proposes telemetry-free measures such as Homebrew install analytics, release downloads and issue authors."}
