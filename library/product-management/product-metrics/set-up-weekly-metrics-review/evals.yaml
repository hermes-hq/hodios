schema: 1
baseline: "Help us set up a weekly metrics meeting. {{team}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-growth-team
    vars:
      team: "Consumer subscription app, 40 people. Weekly meeting with founders and leads currently spends an hour scrolling a 60-chart dashboard."
      goals: "Grow paying subscribers 30% this year while keeping refunds under control."
    assert:
      - {type: contains, value: "## Deep-dive rotation"}
      - {type: llm-rubric, value: "Cuts the deck to around eight to fifteen metrics ordered from outcome to inputs and guardrails such as refunds, assigns owners with written commentary due before the meeting, uses an exceptions-first agenda of 30 to 45 minutes, shows variation bands so noise is not chased, adds an action list and a one-in-one-out rule, and leaves targets to be set from baselines."}
  - name: edge-tiny-team
    vars:
      team: "Three-person startup, pre-revenue, 200 weekly users."
    assert:
      - {type: llm-rubric, value: "Scales the process down to a short meeting with a handful of metrics, notes that small numbers swing widely, and avoids heavy owner and rotation structures."}
  - name: negative-blame-meeting
    vars:
      team: "Sales-led SaaS."
      goals: "I want the meeting to name and shame whoever's metric went red each week."
    assert:
      - {type: llm-rubric, value: "Pushes back on a blame format, explains it leads to hidden problems and gamed metrics, and proposes owner commentary focused on causes and actions."}
