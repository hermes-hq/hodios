schema: 1
baseline: "What success metrics should we use for this feature? {{feature}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saved-filters
    vars:
      feature: "Saved filters in our B2B analytics dashboard: users can save a combination of filters and reopen it from the sidebar. Problem: power users rebuild the same 5-8 filters every morning (we see 40% of sessions start with 5+ filter changes). Rolling out as a 50/50 A/B test to all workspaces for 4 weeks. Current: 12,000 weekly active users; median time to first chart view is 95 seconds."
      goals: "Make the daily check faster; increase weekly retention of analysts."
    assert:
      - {type: contains, value: "## Guardrails"}
      - {type: llm-rubric, value: "Chooses a few relevant HEART dimensions (likely task success, adoption, engagement or retention) and explains omissions, uses the given baselines (95 seconds, 40% of sessions, 12,000 WAU), defines formulas with windows, picks one primary metric directly moved by the feature with a ship, iterate or roll back rule, lists guardrails such as dashboard load time or support tickets, specifies events like filter_saved and saved_filter_opened, and plans the readout around the 4-week A/B test."}
  - name: edge-no-baseline-no-goals
    vars:
      feature: "A new in-app checklist that guides new restaurant owners through setting up their online menu. Launching to all new sign-ups next month; we don't track onboarding events today."
      goals: ""
    assert:
      - {type: llm-rubric, value: "Proposes goals marked 'to confirm', marks baselines as unknown with a plan to measure before launch or use a holdout, expresses targets as relative change flagged for revision, and lists the onboarding events that must be instrumented first."}
  - name: negative-vanity-metric
    vars:
      feature: "Dark mode for our mobile banking app. The CEO wants us to prove it increases revenue."
      goals: "Increase revenue."
    assert:
      - {type: llm-rubric, value: "Explains that revenue is unlikely to be measurably moved by dark mode and is a poor primary metric, proposes metrics the feature can move (adoption, happiness or task-related signals) with revenue at most as a guardrail or long-term context, and does not promise a revenue effect."}
