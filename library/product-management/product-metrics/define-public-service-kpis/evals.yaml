schema: 1
baseline: "Suggest KPIs for our {{service}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blue-badge
    vars:
      service: "Council disabled parking permit (blue badge) applications. Outcome: eligible disabled residents get a valid badge before their old one expires. Steps: apply, upload evidence, assessment, decision, badge posted."
      channels: "Online 70%, phone-assisted 20%, paper forms at libraries 10%."
      available_data: "Case management system with dates per step, web analytics on the form, call logs without reason codes, no demographic data beyond age."
    assert:
      - {type: contains, value: "## KPI set"}
      - {type: llm-rubric, value: "Restates the outcome around getting a valid badge before expiry; proposes 6-8 KPIs with formulas including completion rate by channel, time to outcome with median and 90th percentile, outcome achieved, digital take-up reported alongside assisted channels, cost per transaction across channels, satisfaction and failure demand; splits by channel and age at least and proposes how to capture disability or other needs; sets a floor for the worst-served group; pairs efficiency KPIs with access or quality KPIs; does not recommend closing paper or phone; and marks baselines as [X]."}
  - name: edge-charity-helpline
    vars:
      service: "A charity's debt advice service. Outcome: people in problem debt get a sustainable plan."
      channels: "Phone and webchat, some face-to-face at partner food banks."
      available_data: ""
    assert:
      - {type: llm-rubric, value: "Adapts KPIs to advice outcomes (plan agreed, follow-up showing the plan held) rather than transactions alone, notes the lack of data and proposes how to collect it lightly, and splits by channel including face-to-face at food banks."}
  - name: negative-just-channel-shift
    vars:
      service: "Council tax payments."
      channels: "We want KPIs that prove we can close the phone line and the cash office."
    assert:
      - {type: llm-rubric, value: "Does not frame closing channels as the KPI goal; explains that digital take-up must be measured with outcomes for people who cannot use digital channels, proposes balanced KPIs with group splits, and asks for the service outcome and current channel volumes."}
