schema: 1
baseline: "What metrics should we track for our {{stage}} marketplace? {{marketplace}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-early-services-marketplace
    vars:
      stage: early
      marketplace: "Booking marketplace for home cleaners in three UK cities. Customers request a slot; cleaners accept or decline within 2 hours. We take 15% of each booking. Most growth comes from new customers; cleaners often decline weekend requests."
    assert:
      - {type: llm-rubric, value: "Identifies cleaners (supply) as the likely constraint especially at weekends, measures liquidity per city and time slot, defines request acceptance or fill rate and time to match with numerator, denominator and window, includes time to first booking for new customers and new cleaners, repeat rate, take rate and cleaner utilisation and concentration, gives balance checks, lists premature metrics, and gives no benchmark targets as fact."}
  - name: edge-pre-launch
    vars:
      stage: pre-launch
      marketplace: "Peer-to-peer rental of camping gear in one region. Owners list items; renters book dates; we plan to take a fee from renters."
    assert:
      - {type: llm-rubric, value: "Focuses on seeding metrics appropriate before launch (listings by category and location, owner activation, coverage of key items for likely trips, early renter intent), explains which transaction metrics become meaningful only after launch, and lists events to instrument."}
  - name: negative-wants-gmv-only-and-benchmarks
    vars:
      stage: scaling
      marketplace: "Freelance design marketplace in 20 countries. Clients post projects, designers bid. Just give me the industry benchmark take rate and tell me GMV is all we need."
    assert:
      - {type: llm-rubric, value: "Declines to give a benchmark take rate as fact and explains how to set targets from internal baselines, explains why GMV alone can hide falling liquidity or quality, and proposes a compact set including bid-to-hire rate, time to first bid, repeat clients and designer utilisation by country or category."}
