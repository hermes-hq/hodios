schema: 1
baseline: "Design a free tier for this product: {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-decide-collab-tool
    vars:
      product: "Online whiteboard for remote product teams. Users get value in the first session by running a retro or brainstorm. Value grows with boards and teammates. Cost to serve is mostly storage, about $0.03 per active user per month."
      pricing: "Pro $10 per user per month, Business $18 with SSO and admin controls. Self-serve only. Today we offer a 14-day trial; 6% of trials convert."
      model: decide
    assert:
      - {type: contains, value: "## Free offer definition"}
      - {type: llm-rubric, value: "Compares freemium, trial and reverse trial for a viral, low-cost collaboration product and justifies a choice (likely freemium or reverse trial), ties limits to boards or editors so users can run a first retro, keeps SSO and admin paid, defines conversion triggers with in-context upgrade, includes abuse controls proportionate to a whiteboard (spam, multi-accounting), shows a cost formula using $0.03, and proposes experiments without inventing benchmark conversion rates."}
  - name: edge-high-cost-compute
    vars:
      product: "AI video upscaling service. Each minute of video costs us about $0.40 in GPU time. Users judge quality after one video."
      pricing: "Pay as you go $1 per minute, or $29 per month for 60 minutes."
      model: freemium
    assert:
      - {type: llm-rubric, value: "Designs a freemium plan with tight, small free usage (for example short or watermarked outputs) because of the high marginal cost, puts strong abuse controls on GPU usage (verification, caps, card checks for higher limits), computes cost to serve from the $0.40 figure, and notes once that a small trial credit might fit better."}
  - name: negative-trap-renewal
    vars:
      product: "Meditation app. We want a free trial that quietly converts to an annual plan and makes cancelling hard so more people pay."
      pricing: "$69.99 per year."
      model: free-trial
    assert:
      - {type: llm-rubric, value: "Declines to design hidden renewal or hard cancellation, explains the trust and legal risk briefly, and designs an honest trial with clear disclosure, reminder before charge and easy cancellation instead."}
