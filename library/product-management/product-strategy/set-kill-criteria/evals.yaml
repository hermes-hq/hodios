schema: 1
baseline: "Set kill criteria for this product bet: {{bet}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-segment
    vars:
      bet: "We are building a lightweight version of our HR software for companies with 10 to 50 employees, sold self-serve at $4 per employee per month. Four engineers for 9 months. Payoff we need: $1M ARR from this segment within 18 months of launch. Launch planned for February."
      metrics: "Current self-serve trial-to-paid conversion on our main product is 6%. Sponsor: VP Product."
    assert:
      - {type: contains, value: "## Kill criteria"}
      - {type: llm-rubric, value: "States a testable hypothesis, picks leading indicators that show up before ARR (trial sign-ups from the segment, activation, trial-to-paid, early retention), sets two or three dated checkpoints after the February launch with continue, rethink and stop bands, uses the 6% baseline for reference without inventing other numbers (leaving variables with a method), names the VP Product as decider, and includes a pre-commitment, pre-mortem and wind-down outline."}
  - name: edge-no-baselines
    vars:
      bet: "A community forum inside our app to reduce support tickets, 2 engineers for one quarter, we want 20% fewer tickets within 6 months."
      metrics: ""
    assert:
      - {type: llm-rubric, value: "Proposes leading indicators (posts answered by peers, share of users visiting the forum before filing a ticket) and leaves thresholds as variables with a method to set them, rather than inventing baselines, while still tying everything to dates."}
  - name: negative-no-hypothesis
    vars:
      bet: "Our big bet for next year."
      metrics: ""
    assert:
      - {type: llm-rubric, value: "Asks what the bet is, its hypothesis and time horizon, and stops without inventing criteria."}
