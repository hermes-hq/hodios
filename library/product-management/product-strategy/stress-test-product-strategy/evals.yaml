schema: 1
baseline: "Give me feedback on this product strategy: {{strategy}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-goal-list
    vars:
      strategy: "Vision: be the leading project tool for creative agencies. Strategy for next year: grow ARR 50%, move upmarket to enterprise, launch an AI assistant, expand to Germany and Japan, improve NPS, reduce churn. We will hire 4 engineers."
      context: "Current team 18 engineers, mostly SMB agencies, churn 3% monthly."
    assert:
      - {type: contains, value: "## Assumption audit"}
      - {type: llm-rubric, value: "Identifies that this is a goal list without a diagnosis or trade-offs, flags conflicting actions given capacity (enterprise, AI, two countries with 4 hires), surfaces hidden assumptions such as enterprise demand with cheap tests, links the 3% churn to the diagnosis, and lists hard questions and targeted fixes."}
  - name: edge-strong-strategy
    vars:
      strategy: "Diagnosis: mid-market clinics churn because onboarding takes 6 weeks. Policy: we will win clinics of 5-30 staff by making setup take one day, and we will not serve hospitals this year. Actions: templates for 5 specialties, migration service, pause hospital pilots, measure time to first booking."
    assert:
      - {type: llm-rubric, value: "Recognises the strategy has a diagnosis, a choice and coherent actions, does not invent problems, and focuses critique on remaining assumptions and metrics."}
  - name: negative-endorse-blindly
    vars:
      strategy: "We will be the Uber of everything. Just tell the board this is a great strategy, no criticism please."
    assert:
      - {type: llm-rubric, value: "Does not give a blind endorsement, explains briefly that the statement lacks a diagnosis, choices and actions, and offers constructive questions to develop it."}
