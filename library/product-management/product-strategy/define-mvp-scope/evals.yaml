schema: 1
baseline: "What should be in the MVP for {{idea}}? Features: {{features}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tutoring-marketplace
    vars:
      idea: "Marketplace that matches high-school students with university students for affordable maths tutoring in one city."
      features: "Tutor profiles, search and filters, booking calendar, in-app video calls, payments with escrow, reviews and ratings, messaging, AI homework helper, parent dashboard, tutor verification, mobile apps for iOS and Android, referral programme."
      timeline: "6 weeks, 2 engineers"
    assert:
      - {type: contains, value: "## Deferred list"}
      - {type: llm-rubric, value: "Names demand from students or parents and tutor supply as the riskiest hypotheses, chooses a lean MVP type (for example concierge matching with a simple form and existing video and payment tools), defers items like the AI homework helper, native apps and referral programme, keeps tutor verification or safety in some form because minors are involved, and sets pre-launch success and stop thresholds."}
  - name: edge-no-timeline
    vars:
      idea: "Browser extension that summarises long Slack threads for managers."
      features: "Thread summary, daily digest email, action-item extraction, Jira integration, admin console, SSO, analytics dashboard."
      timeline: ""
    assert:
      - {type: llm-rubric, value: "Without a timeline, gives a rough size estimate labelled as an estimate, keeps only what tests whether managers use summaries repeatedly, and defers enterprise items like SSO and the admin console with re-entry triggers."}
  - name: negative-vague-input
    vars:
      idea: "An app."
      features: "Everything users need."
      timeline: ""
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about the problem, users and features and stops instead of inventing an MVP."}
