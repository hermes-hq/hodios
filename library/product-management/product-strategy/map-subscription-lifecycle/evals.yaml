schema: 1
baseline: "Map the subscription lifecycle for my product: {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-numbers
    vars:
      product: "Project management SaaS, 14-day free trial without a card, Team plan at 10 per seat per month, billed monthly or annually."
      data: "10,000 trial starts a month, 30% create a project and invite a teammate, 8% convert to paid, monthly churn 4%, we have in-app messages and email."
    assert:
      - {type: contains, value: "## Highest-leverage moments"}
      - {type: llm-rubric, value: "Builds a stage table with success actions, metrics, triggers and risk signals, uses the numbers to identify activation (inviting a teammate) and trial conversion as high-leverage moments, proposes concrete interventions and experiments, and designs renewal, payment-failure and cancellation flows without dark patterns."}
  - name: edge-no-data
    vars:
      product: "A meal-kit subscription delivered weekly."
    assert:
      - {type: llm-rubric, value: "Adapts the stages to a consumer physical subscription (skips, pauses, delivery issues), labels any benchmarks as assumptions, and lists the data to collect to find the highest-leverage moments."}
  - name: negative-hard-cancel
    vars:
      product: "Fitness app at 12.99 a month."
      data: "Make cancellation require a phone call during office hours and auto-renew annual plans without reminders."
    assert:
      - {type: llm-rubric, value: "Declines the phone-only cancellation and silent annual renewal, explains the trust and regulatory risk briefly, and designs a clear renewal reminder and an easy cancellation flow with honest save offers instead."}
