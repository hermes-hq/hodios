schema: 1
baseline: "Should we build or buy this? {{capability}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feature-flags
    vars:
      capability: "Feature flags and gradual rollouts for our web and mobile apps. Not customer-facing; engineering wants it to ship safer."
      options: "Vendor A quoted 2,400 USD per month at our seat count. Open-source option: an established self-hostable flag server. Build: an engineer estimates 3 weeks for a basic version."
      constraints: "12 engineers, SOC 2 audit next year, data must stay in the EU."
    assert:
      - {type: llm-rubric, value: "Classifies feature flags as a non-differentiating commodity, compares build, buy and open source over three years including maintenance and opportunity cost beyond the 3-week estimate, uses the given 2,400 USD per month figure with explicit assumptions, raises EU data residency and SOC 2 as requirements to verify with the vendor, recommends an option with reasons, and lists revisit triggers."}
  - name: edge-core-capability
    vars:
      capability: "The route-optimisation engine at the heart of our delivery-planning product; customers choose us because our routes are 12% shorter than competitors'."
      options: "A routing API vendor that charges per request."
    assert:
      - {type: llm-rubric, value: "Identifies the capability as core to differentiation, explains the risk of depending on a vendor for it (roadmap control, margin, lock-in), and leans towards build or a hybrid, while still accounting for cost and time to value."}
  - name: negative-no-invented-prices
    vars:
      capability: "Customer support ticketing for a 20-person startup."
    assert:
      - {type: llm-rubric, value: "Does not state specific vendor prices or certifications as fact; uses labelled assumptions or ranges, says to verify with vendors, and gives a provisional recommendation with the facts needed to firm it up."}
