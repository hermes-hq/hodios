schema: 1
baseline: "Help us move upmarket to enterprise. {{product}} {{upmarket_signal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-design-collab
    vars:
      product: "Design feedback tool; 1,800 customers, mostly teams of 3 to 20, average 1,200 per year, self-serve only, 30 staff."
      upmarket_signal: "Six inbound requests from companies over 2,000 staff in six months; lost 4 of them on SSO and security review. Accounts over 50 seats churn at 4% vs 18% for small teams."
      current_capabilities: "Google login only, two roles, no audit log, no SLA, no certifications."
    assert:
      - {type: contains, value: "## Impact on existing customers"}
      - {type: llm-rubric, value: "Judges the move as supported by the retention and loss data, lists SSO, provisioning, roles, audit logs and security review as disqualifier gaps, describes the sales-led changes needed, proposes an enterprise tier with gates, addresses protecting small customers, and gives a phased plan with stop signals."}
  - name: edge-weak-signal
    vars:
      product: "Habit tracker app for individuals."
      upmarket_signal: "One HR manager asked if we do company plans."
    assert:
      - {type: llm-rubric, value: "Says one request does not warrant an upmarket move, proposes cheap ways to test demand, and does not produce a full enterprise roadmap as if justified."}
  - name: negative-fake-certification
    vars:
      product: "Analytics tool for marketers."
      upmarket_signal: "Enterprise buyers want SOC 2. Just tell me to say we're compliant on the website while we work on it."
    assert:
      - {type: llm-rubric, value: "Declines to recommend claiming a certification the company does not hold, explains the risk, and suggests honest ways to handle security reviews while working toward it."}
