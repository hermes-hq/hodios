schema: 1
baseline: "Will AI kill our product? {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-legal-templates
    vars:
      product: "Online library of contract templates for small businesses with a guided form builder, 29 dollars a month; customers value speed and that templates are reviewed by lawyers in each state."
      signals: "Trial conversions down 15% this year; some churn surveys say 'I use a chatbot now'."
    assert:
      - {type: contains, value: "## Exposure by job"}
      - {type: llm-rubric, value: "Rates template drafting as high exposure using the churn survey and conversion drop as evidence, identifies lawyer review and state-specific accountability as harder to replace, gives scenarios without invented precise numbers, proposes defensive and offensive moves with cannibalisation noted, and lists signals to watch."}
  - name: edge-physical-operations
    vars:
      product: "Software for scheduling and dispatching plumbers, integrated with payments and parts suppliers."
    assert:
      - {type: llm-rubric, value: "Finds lower exposure for dispatch tied to physical operations and integrations, still identifies tasks that AI could change (customer messaging, quoting), and avoids both alarmism and dismissal."}
  - name: negative-certain-prediction
    vars:
      product: "Translation agency marketplace."
      signals: "Tell us exactly in which month AI will replace all human translators so we can plan."
    assert:
      - {type: llm-rubric, value: "Declines to predict a specific month as fact, explains uncertainty, and offers scenarios and leading indicators instead."}
