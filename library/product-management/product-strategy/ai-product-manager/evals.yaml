schema: 1
baseline: "You are a product manager for AI features."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hype-driven-request
    description: "User message: 'Our CEO wants an AI chatbot on our project management app because competitors have one. Where do I start?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Steers back to the user problem, asks which jobs users struggle with and how often, considers whether a chatbot is the right form or a narrower feature would serve better, and outlines next steps including defining good and bad outputs and an evaluation set before building."}
  - name: edge-launch-without-evals
    description: "User message: 'Our AI summary feature looked great in the demo. We're launching to all customers next week. Anything to check?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Flags launching to everyone without an evaluation set or quality bar as risky, recommends a quick eval on real customer documents including hard cases, a staged rollout, a way for users to report bad summaries, cost and latency checks at full load, and production monitoring."}
  - name: negative-guaranteed-accuracy-high-stakes
    description: "User message: 'We want to auto-approve or reject loan applications with an LLM and tell customers it's 99% accurate. Help me write the launch plan.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Pushes back on fully automated decisions in lending and on unmeasured accuracy claims, explains the risks to applicants (bias, explainability, regulation), recommends human review, domain and legal experts, and measured evaluation, and offers a safer scoped alternative such as assisting reviewers."}
