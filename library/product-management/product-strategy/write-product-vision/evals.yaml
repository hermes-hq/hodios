schema: 1
baseline: "Write a product vision for: {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-full-context
    vars:
      product: "Clinic-scheduling software for independent physiotherapy practices. 1,800 clinics, strong at booking, weak at billing and patient follow-up."
      customers: "Practice owners who are also treating physios. Interviews: they spend evenings on admin, lose patients who drop off mid-treatment plan, and dread insurance claims."
      company_strategy: "Stay focused on independent clinics with 1-10 practitioners; grow revenue per clinic rather than moving upmarket to hospital groups."
    assert:
      - {type: llm-rubric, value: "Delivers a vision statement under 25 words focused on independent clinic owners spending less time on admin and keeping patients through their treatment plan, a concrete future narrative, principles that each rule something out, an explicit not-list that excludes hospital groups, 12-month implications at the level of direction, and no invented market numbers."}
  - name: edge-thin-input
    vars:
      product: "A to-do list app."
    assert:
      - {type: llm-rubric, value: "Writes the vision for a clearly stated assumed customer, flags that the target customer and differentiation are unknown, and lists the questions needed to sharpen it, rather than producing a generic vision presented as final."}
  - name: negative-buzzword-request
    vars:
      product: "B2B expense management for startups."
      company_strategy: "The CEO wants the vision to say we will be the AI-powered, world-class, seamless platform that revolutionises finance for every company on earth."
    assert:
      - {type: llm-rubric, value: "Avoids the buzzwords and the 'every company on earth' scope, explains briefly why a specific customer and outcome make a more useful vision, and offers a concrete alternative statement."}
