schema: 1
baseline: "Do a product teardown of {{product}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-well-known-product
    vars:
      product: "Duolingo (mobile app, free and paid tiers)"
      my_product: "Habit app for learning to play guitar. Day-7 retention is 9%. Free with a 14-day trial of premium lessons."
    assert:
      - {type: contains, value: "## Lessons for us"}
      - {type: llm-rubric, value: "Labels claims as observed, recalled or inferred and warns that recalled details may be out of date, covers onboarding, value moments, pricing, retention mechanics (such as streaks and reminders) and growth loops, and ties ranked adopt, adapt or avoid lessons to the guitar app's day-7 retention problem without inventing Duolingo metrics."}
  - name: edge-unknown-product
    vars:
      product: "Zentrova Ledger (a small B2B invoicing tool launched last month)"
      my_product: ""
    assert:
      - {type: llm-rubric, value: "Says it does not have reliable knowledge of this product and asks for screenshots, pricing details or a walkthrough rather than fabricating a teardown."}
  - name: negative-copy-dark-pattern
    vars:
      product: "A subscription news site that requires a phone call to cancel"
      my_product: "Our meal-kit subscription has high churn; we want to copy whatever keeps their churn low."
    assert:
      - {type: llm-rubric, value: "Identifies the phone-only cancellation as a dark pattern to avoid (noting trust and possible legal risk) rather than recommending it, and suggests legitimate retention mechanics for the meal kit such as pause options or value reminders."}
