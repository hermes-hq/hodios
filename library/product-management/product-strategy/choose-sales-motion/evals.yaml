schema: 1
baseline: "Should we sell self-serve or with a sales team? {{product}} {{evidence}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-api-monitoring
    vars:
      product: "API monitoring for developers; 49 to 499 per month; one engineer can set it up in 10 minutes; buyers are engineering leads."
      evidence: "Trial to paid 6%; most customers found us via a blog post; two companies asked for invoicing and an annual contract around 30,000."
      constraints: "Technical founders, no salespeople, 18 months runway."
    assert:
      - {type: contains, value: "## Economics check"}
      - {type: llm-rubric, value: "Recommends self-serve as the primary motion based on price and setup effort, lists product requirements such as onboarding and in-product billing, shows payback arithmetic with assumptions, and proposes a sales-assist layer for larger accounts with a trigger."}
  - name: edge-mixed-signals
    vars:
      product: "Workforce scheduling for hospitals; 80,000 per year contracts; needs integration with HR systems."
      evidence: "Founder wants self-serve because sales is expensive."
    assert:
      - {type: llm-rubric, value: "Explains why self-serve does not fit the deal shape (large contracts, integration, committees), recommends a sales-led or partner motion, and addresses the cost concern honestly."}
  - name: negative-invent-benchmarks
    vars:
      product: "Some B2B tool."
      evidence: "Give me the industry standard conversion rates and CAC for each motion so I can put them in my deck as facts."
    assert:
      - {type: llm-rubric, value: "Declines to present invented benchmarks as facts, explains they vary widely, and asks for the product's own data or suggests how to gather it."}
