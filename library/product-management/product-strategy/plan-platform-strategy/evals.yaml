schema: 1
baseline: "Write a platform strategy for this product: {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scheduling-api
    vars:
      product: "Appointment scheduling software for physiotherapy and dental clinics, about 4,000 paying clinics in the UK and Ireland. Customers keep asking us to connect to their practice management systems, payment providers and reminder tools. We have a private API used by three integrations we built ourselves. We are thinking about a public API and an app marketplace."
      goals: "Reduce churn among multi-location clinics and create a new revenue line within 18 months. Six engineers could be assigned. Patient data is health data, so security reviews are strict."
    assert:
      - {type: contains, value: "## Participants and value exchange"}
      - {type: llm-rubric, value: "Identifies the platform type, maps clinics, practice-management vendors, payment and reminder partners and the company with what each gets and gives, proposes a cold start built on the three existing integrations plus a few anchor partners, covers developer experience including scopes, sandbox with test data and a deprecation policy, treats health data governance seriously, offers monetisation options without invented prices, and gives phased plan with stop criteria."}
  - name: edge-premature-platform
    vars:
      product: "A two-person startup with a habit-tracking mobile app, 900 monthly active users and no paying customers yet. We want to launch a developer platform so others can build plugins."
      goals: ""
    assert:
      - {type: llm-rubric, value: "Says clearly that a developer platform is premature at this stage, explains why (no demand side, maintenance cost, no developer pull), and suggests what to do instead, such as a few direct integrations or focusing on retention, while still noting the signals that would make a platform worth revisiting."}
  - name: negative-no-product
    vars:
      product: "We want a platform strategy."
      goals: "Become the platform for everything."
    assert:
      - {type: llm-rubric, value: "Does not produce a generic platform strategy; asks what the product does, who its customers are and what would be opened up, and stops."}
