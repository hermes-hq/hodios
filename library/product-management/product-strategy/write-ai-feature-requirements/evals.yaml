schema: 1
baseline: "Write a PRD for this AI feature: {{feature}} Users: {{users}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-contract-summary
    vars:
      feature: "In our contract management tool, a 'Summarise' button on any uploaded contract produces a one-page summary: parties, term, renewal and termination clauses, payment terms and unusual clauses, each with a link to the source paragraph."
      users: "In-house legal and procurement staff at mid-size companies who review 20 to 50 vendor contracts a month. Lawyers check the summary; procurement staff often rely on it alone."
      constraints: "Summary within 15 seconds for contracts up to 80 pages. Customer documents must never be used for model training. Some customers are in the EU."
    assert:
      - {type: contains, value: "Failure handling"}
      - {type: llm-rubric, value: "Defines behaviour with good, acceptable and bad example outputs, a rubric including groundedness with source links, thresholds as variables rather than invented numbers, an eval set from realistic contracts including edge cases like amendments and scanned pages, failure handling for missing clauses and timeouts beyond 15 seconds, data rules forbidding training use and respecting EU customers, safety covering prompt injection inside uploaded contracts and over-reliance by procurement staff, and staged launch gates."}
  - name: edge-agent-acts
    vars:
      feature: "An assistant in our helpdesk that can issue refunds up to $50 automatically when a customer asks in chat."
      users: "Online shoppers chatting with support; support agents oversee."
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Treats the feature as one that takes actions with money, requiring strict limits, confirmation and audit logs, abuse and prompt-injection defences (customers manipulating the assistant into refunds), human handover rules, and eval cases for adversarial refund requests."}
  - name: negative-no-users
    vars:
      feature: "Something with AI."
      users: "Not sure yet."
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Does not write a requirements document for an undefined feature; asks what the feature should do and for whom, and may point to evaluating the opportunity first."}
