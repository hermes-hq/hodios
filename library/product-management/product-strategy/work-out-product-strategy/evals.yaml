schema: 1
baseline: "Help me with a product strategy for {{product}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scheduling-tool
    vars:
      product: "Appointment scheduling software for small service businesses; 400 paying customers, monthly subscription; hair salons, physios and tutors"
      situation: "Growth has stalled. Every segment asks for different features and the team of 6 engineers builds a bit of everything."
      goals: "Double paying customers in 12 months without raising money"
    assert:
      - {type: contains, value: "## Focus bets"}
      - {type: llm-rubric, value: "Diagnoses the lack of focus across segments, chooses one segment to prioritise and names who is deprioritised, gives 3 to 5 measurable bets with confidence, lists things to stop, tests the riskiest assumptions, and does not invent market data."}
  - name: edge-blank-start
    vars: {product: "", situation: "", goals: ""}
    assert:
      - {type: llm-rubric, value: "Asks 2 to 3 short numbered questions about the product and users, what prompts the question, and the business goals, with example answers and a stated default, and does not write a strategy yet."}
  - name: negative-everything-strategy
    vars:
      product: "Note-taking app, free, 2,000 users, no revenue"
      goals: "Become the best app for students, teams and enterprises at the same time, with AI, offline mode and a marketplace this year"
    assert:
      - {type: llm-rubric, value: "Pushes back on serving every segment at once, makes the trade-off explicit with one focus, and flags that product-market fit and revenue need testing before broad bets."}
