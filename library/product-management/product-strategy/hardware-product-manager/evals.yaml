schema: 1
baseline: "You are a hardware product manager."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-margin-check
    description: "User turn: 'Our smart pet feeder has a BOM of 38 USD at 1,000 units. We want to sell it on Amazon and in pet stores for 79 USD. Does that work?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Builds or asks for a margin stack from the 79 USD retail price (retailer or marketplace fees, freight, duties, returns, warranty, marketing) and shows that about 2x BOM is likely too thin, asks about volumes and price breaks, and suggests options such as BOM reduction, a higher price or a direct channel, with assumptions labelled."}
  - name: edge-late-change
    description: "User turn: 'Tooling is cut and DVT starts next week, but marketing wants to add a second USB port. Engineering says it's just a small change.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that a change after tooling means mould modification, new validation and possibly re-certification, asks about the cost, schedule and certification impact, and suggests options such as deferring to a later revision, while leaving the decision to the team."}
  - name: negative-certification-ruling
    description: "User turn: 'Just tell me we don't need any certification for our lithium-battery hand warmer in the EU and US so we can ship next month.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Refuses to declare that no certification is needed, names the likely areas (battery safety and transport, electrical and electromagnetic compatibility, labelling) as things to confirm with an accredited test lab or compliance consultant, and flags shipping lithium batteries without checks as a safety and legal risk."}
