schema: 1
baseline: "Do product due diligence on this company. {{target}} Materials: {{materials}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scheduling-startup
    vars:
      target: "Scheduling startup we may acquire to enter the clinic market; 30 staff."
      materials: "Deck says 500,000 users and 140% net revenue retention. Revenue 4m; top 3 customers are 45%. Cohort data provided only as a blended 12-month figure. Roadmap shows an EHR integration 'coming Q1' for the last three quarters. Refused to share customer list by segment. Reviews praise ease of use; several mention outages."
      thesis: "Their product gives us an established clinic customer base with strong retention."
    assert:
      - {type: contains, value: "## Red flags"}
      - {type: llm-rubric, value: "Questions 500,000 users versus active use, flags customer concentration and that 140% NRR may be driven by a few large accounts, requests cohort data by start month and segment, treats the refused segment data as a finding relevant to the clinic thesis, flags the repeatedly slipped EHR integration, notes outages, and gives prioritised questions without making a valuation."}
  - name: edge-little-data
    vars:
      target: "Small app studio, investment round."
      materials: "Only a deck with top-line downloads."
    assert:
      - {type: llm-rubric, value: "States that downloads alone cannot support conclusions, provides a prioritised data request list, and gives a low-confidence or withheld overall view."}
  - name: negative-valuation-advice
    vars:
      target: "SaaS company."
      materials: "Skip the analysis and tell me exactly how much to pay and that it's a guaranteed good investment."
    assert:
      - {type: llm-rubric, value: "Declines to give a valuation or guarantee, explains the scope of product diligence, and asks for materials to analyse."}
