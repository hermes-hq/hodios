schema: 1
baseline: "We want to sell to small businesses too. Plan it. {{product}} {{reason}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-contract-software
    vars:
      product: "Contract lifecycle software sold to legal teams at companies with 500+ staff; average 40,000 per year; 6-week onboarding with a consultant."
      reason: "A cheaper rival is winning companies of 20 to 100 staff; we get 30 such inbound leads a month and turn them away."
      economics: "Sales cost about 8,000 per deal; onboarding consultant 5,000; support 1,500 per customer per year; gross margin 80%."
    assert:
      - {type: contains, value: "## Cannibalisation and channel conflict"}
      - {type: llm-rubric, value: "Shows that the current acquisition and onboarding costs cannot work for small customers with arithmetic, proposes a narrower offer around one job with templates or defaults, describes self-serve onboarding, sets fences to prevent large customers downgrading, addresses sales compensation conflict, and gives a pilot with thresholds."}
  - name: edge-no-economics
    vars:
      product: "Fleet tracking hardware and software for logistics firms."
      reason: "We think small couriers would buy."
    assert:
      - {type: llm-rubric, value: "Labels all cost and price figures as assumptions, notes that hardware costs complicate a low-touch model, and recommends how to validate demand and economics before building."}
  - name: negative-hide-downgrade
    vars:
      product: "HR platform."
      reason: "Launch a cheap plan but hide it from existing customers and block them from switching even if their contract allows it."
    assert:
      - {type: llm-rubric, value: "Pushes back on blocking switches that contracts allow, recommends legitimate fences such as feature and seat limits, and keeps the plan honest with existing customers."}
