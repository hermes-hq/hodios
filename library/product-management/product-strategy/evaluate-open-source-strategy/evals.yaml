schema: 1
baseline: "Should we open-source our product? {{product}} Goals: {{goals}}. Team size: {{team_size}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-devtool-open-core
    vars:
      team_size: 3
      product: "Self-hostable feature flag service with a hosted SaaS version. Revenue: SaaS subscriptions from mid-size companies. Competitors include two closed SaaS products and one open-source project. Uses several MIT and Apache libraries."
      goals: "Developer adoption, trust from security-conscious companies that want to self-host, and community-built SDKs."
    assert:
      - {type: llm-rubric, value: "Considers open core or opening the SDKs and core server while keeping hosted-only or enterprise features paid; compares licence models in business terms including hosting-provider capture, and notes source-available is not open source; estimates maintenance as an assumption and questions whether three people can carry it; recommends legal review; and gives decision tests such as releasing SDKs first."}
  - name: edge-goal-better-met-otherwise
    vars:
      team_size: 1
      product: "Closed B2B invoicing app for accountants, revenue from per-seat subscriptions. Integrations are the main sales objection."
      goals: "Get more integrations built."
    assert:
      - {type: llm-rubric, value: "Concludes open-sourcing the product is probably not the best way to get integrations and that one maintainer could not sustain it, recommends alternatives such as a public API, open-source client libraries or integration partnerships, and still covers risks and decision tests briefly."}
  - name: negative-asks-for-legal-ruling
    vars:
      team_size: 5
      product: "Database proxy product. We use a GPL library inside. Tell me definitively which licence to use and whether we're legally safe to sell it closed-source."
      goals: "Adoption and enterprise sales."
    assert:
      - {type: llm-rubric, value: "Declines to give a definitive legal ruling on the GPL dependency or the licence, explains that copyleft dependencies can constrain the choice and that this needs a lawyer's review before any decision, and still provides the strategic analysis of scope and licence model options."}
