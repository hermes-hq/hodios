schema: 1
baseline: "Write product principles for our team. Product and strategy: {{product_and_strategy}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-debates
    vars:
      product_and_strategy: "A personal finance app for freelancers in the EU that automates tax set-asides. Strategy: win freelancers who hate admin by doing the bookkeeping for them; we compete against spreadsheets and full accounting software. Company values: honesty, care."
      recurring_debates: |
        - Accountants ask for detailed manual controls; most users never open settings.
        - Sales wants a big launch of invoicing with every feature; engineering wants to ship a small version first.
        - Whether to auto-categorise transactions with AI when it is wrong 8% of the time.
    assert:
      - {type: contains, value: "## Tested against our debates"}
      - {type: llm-rubric, value: "Produces five to seven ranked principles in 'X even over Y' or similarly opinionated form, each with meaning, what it rules out and an example decision, grounded in the freelancer and admin-hating strategy; settles all three debates (for example defaults over manual controls, user-correctable AI with visible confidence), states how conflicts are resolved, and lists dropped generic candidates."}
  - name: edge-no-debates
    vars:
      product_and_strategy: "An internal design tool for our 40-person marketing team to produce social images in brand style. Goal: cut agency spend and make on-brand assets in minutes."
      recurring_debates: ""
    assert:
      - {type: llm-rubric, value: "Infers plausible tensions from the strategy (brand control versus creative freedom, speed versus polish), marks inferred stances as proposed for the team to confirm, still gives example decisions, and notes that the test-against-debates section needs the team's real debates."}
  - name: negative-platitudes-requested
    vars:
      product_and_strategy: "Our app. Just give me principles like 'user-first', 'quality', 'innovation' and 'simplicity' for a poster."
      recurring_debates: ""
    assert:
      - {type: llm-rubric, value: "Explains briefly that slogans whose opposites nobody would choose cannot settle trade-offs, and asks what the product is, who it serves and which trade-offs the team argues about, instead of producing a poster of platitudes."}
