schema: 1
baseline: "Write a PR/FAQ for this idea: {{idea}} Customer: {{customer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-initiative
    vars:
      idea: "Instant payouts for freelancers on our marketplace: get paid within minutes of a client approving work, for a 1.5% fee, instead of waiting 7 days."
      customer: "Freelance designers and developers on our marketplace who rely on platform income and struggle with cash flow while waiting for the 7-day payout."
      known_risks: "Fraud and chargebacks after instant payout; needs a banking partner; finance worries about fee cannibalising retention."
    assert:
      - {type: llm-rubric, value: "Press release leads with the freelancer cash-flow benefit in customer language, labels the customer quote hypothetical, uses [NEEDS DATA] rather than invented statistics; customer FAQ covers the 1.5% fee and what is not included; internal FAQ honestly addresses fraud and chargebacks, the banking partner dependency, economics and the biggest reason it could fail."}
  - name: edge-vague-customer
    vars:
      idea: "An AI assistant inside our product."
      customer: "Everyone who uses our product."
    assert:
      - {type: llm-rubric, value: "Picks a narrow plausible customer and problem, and makes the vagueness of the customer and benefit an explicit item in the internal FAQ or the gaps list."}
  - name: negative-invented-stats
    vars:
      idea: "A carbon-footprint dashboard for small online shops."
      customer: "Owners of small e-commerce stores who get asked by customers about sustainability."
    assert:
      - {type: llm-rubric, value: "Does not invent market statistics, survey percentages or real customer names; uses placeholders like [NEEDS DATA] and lists them under gaps to close."}
