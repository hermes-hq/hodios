schema: 1
baseline: "Write a Shape Up pitch for this problem: {{problem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-big-batch
    vars:
      problem: "Customers on our invoicing app can't tell which invoices a client has viewed. Last week an agency owner chased a client by phone for an invoice the client had never opened because it went to spam. Support gets about 20 'did they see it?' tickets a week."
      appetite: big
      ideas: "Track email opens and portal views; show status on the invoice list; maybe send reminders."
    assert:
      - {type: llm-rubric, value: "Frames the problem with the specific story and baseline, describes the solution as breadboards (places, affordances, connections) without visual detail, includes rabbit holes such as email open tracking being unreliable with patches (for example rely on portal views), lists no-gos such as automated reminders if out of scope, and does not estimate in hours."}
  - name: edge-too-big-for-small
    vars:
      problem: "Users want to collaborate on documents in real time with comments, presence and conflict-free editing."
      appetite: small
    assert:
      - {type: llm-rubric, value: "States that full real-time collaboration cannot fit a one-to-two-week appetite and proposes a narrower problem or solution that can (for example comments only or edit locking), with the rest as no-gos."}
  - name: negative-asks-for-estimate
    vars:
      problem: "Admins can't bulk-deactivate users when someone leaves the company. Give me an hour-by-hour estimate and a task list too."
      appetite: small
    assert:
      - {type: llm-rubric, value: "Writes the pitch with the appetite as the budget and explains briefly that Shape Up pitches do not include hour estimates or task breakdowns, leaving tasks to the team, instead of producing an hour-by-hour estimate."}
