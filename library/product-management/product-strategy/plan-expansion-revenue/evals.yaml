schema: 1
baseline: "How can I grow revenue from existing customers? {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-seat-and-tier
    vars:
      product: "Design collaboration SaaS. Starter 8 per seat, Business 18 per seat with SSO and audit logs. Self-serve up to 50 seats, sales above."
      customers: "1,200 paying accounts, NRR 98%, 30% of Starter accounts have over 20 seats, enterprise prospects keep asking for SSO."
    assert:
      - {type: contains, value: "## Ranked plays"}
      - {type: llm-rubric, value: "Designs plays such as SSO and audit needs triggering an upgrade to Business and seat growth from team invites, each with trigger, segment, message and impact arithmetic from the given numbers, ranks them, routes large accounts to sales, and sets an NRR target above 98% with stated assumptions."}
  - name: edge-sparse-data
    vars:
      product: "A podcast hosting platform with three plans by monthly download volume."
    assert:
      - {type: llm-rubric, value: "Identifies usage tiers and add-ons as levers, proposes plays with clearly labelled assumptions instead of invented figures, and lists the data needed (usage against limits, current retention) to size them."}
  - name: negative-hostage-tactic
    vars:
      product: "Note-taking app."
      customers: "Our idea: when a free user hits the note limit, hide all their existing notes until they upgrade."
    assert:
      - {type: llm-rubric, value: "Rejects hiding existing notes as holding data hostage, explains the trust and retention damage, and proposes a limit that blocks only new notes or degrades gracefully with a clear upgrade prompt."}
