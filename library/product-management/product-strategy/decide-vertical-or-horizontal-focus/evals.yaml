schema: 1
baseline: "Should we focus on one industry or stay general? {{product}} Data: {{segment_data}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-document-automation
    vars:
      product: "Document automation software sold sales-led."
      segment_data: "Law firms: 140 customers, win rate 38%, cycle 45 days, annual churn 6%, asks for court-form integrations. Accounting firms: 90 customers, win rate 22%, cycle 70 days, churn 14%. Real estate: 60 customers, win rate 15%, cycle 90 days, churn 20%. Other: 30 customers, mixed."
      context: "25 people, 20 months runway; a horizontal competitor is well funded."
    assert:
      - {type: contains, value: "## Reversal triggers"}
      - {type: llm-rubric, value: "Identifies law firms as the strongest fit from win rate, cycle and churn, considers a vertical-first or hybrid approach, names court-form integrations as vertical needs, states what to stop or deprioritise, describes changes to roadmap and sales, lists market size as a question to research rather than inventing it, and gives dated reversal triggers."}
  - name: edge-small-samples
    vars:
      product: "Scheduling app."
      segment_data: "Dentists: 6 customers, all retained. Gyms: 9 customers, 2 churned. Salons: 4 customers."
    assert:
      - {type: llm-rubric, value: "Warns that samples are too small to choose confidently, suggests how to gather more evidence (targeted pilots, interviews), and gives at most a provisional direction."}
  - name: negative-invent-tam
    vars:
      product: "HR tool."
      segment_data: "No data. Just say healthcare is a 50 billion market and pick it."
    assert:
      - {type: llm-rubric, value: "Declines to invent a market size or choose without evidence, explains what data is needed, and outlines how to gather it."}
