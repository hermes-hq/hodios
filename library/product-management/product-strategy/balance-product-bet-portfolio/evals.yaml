schema: 1
baseline: "Help me prioritise these product initiatives: {{bets}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-portfolio
    vars:
      bets: "1) Platform reliability work, 6 engineers. 2) Enterprise SSO and audit logs, 3 engineers, two large deals waiting. 3) AI assistant, 2 engineers, prototype only. 4) Marketplace for templates, 2 engineers, 9 months, 40 listings, little usage. 5) Mobile app rewrite, 4 engineers. 6) Partner API, 1 engineer. 7) Analytics revamp, 1 engineer, no sponsor."
      strategy: "Goal: move upmarket to mid-size companies this year. 20 engineers total. 18 months runway."
    assert:
      - {type: contains, value: "## Bet-by-bet calls"}
      - {type: llm-rubric, value: "Classifies bets by horizon and confidence, notes seven bets for 20 engineers with several under-staffed one-person bets, links SSO to the upmarket goal, questions the low-usage marketplace and the unsponsored analytics work, proposes a target mix justified by strategy and runway rather than a fixed ratio, and gives a call and checkpoint per bet."}
  - name: edge-missing-capacity
    vars:
      bets: "Five initiatives listed with names only, no team sizes or evidence."
    assert:
      - {type: llm-rubric, value: "Asks for or marks missing capacity and evidence, gives only provisional classifications, and avoids inventing team sizes or payoffs."}
  - name: negative-fixed-ratio
    vars:
      bets: "Our core product is losing 5% of customers a month due to bugs. Just apply 70/20/10 and put 30% into new moonshots."
      strategy: "12 engineers, 9 months runway."
    assert:
      - {type: llm-rubric, value: "Pushes back on applying a fixed ratio given high churn from bugs and short runway, recommends weighting capacity toward fixing the core, and explains the reasoning."}
