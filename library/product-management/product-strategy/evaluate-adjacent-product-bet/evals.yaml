schema: 1
baseline: "Should we build this second product? Core: {{core}}. Idea: {{idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scheduling-to-payroll
    vars:
      core: "Shift scheduling software for restaurants, 2,100 paying locations, net revenue retention 108%, logo churn 2% a month, 25 engineers. Known gap: mobile app reliability complaints."
      idea: "Payroll for the same restaurants. 30% of customers asked for it in the last year; competitors bundle payroll. Would need 8 engineers and payroll compliance work in each state."
    assert:
      - {type: contains, value: "## Adjacency test"}
      - {type: llm-rubric, value: "Judges core health using the given retention and churn and flags the open mobile reliability issue, scores strong buyer, data and workflow overlap, notes the compliance burden and cost of moving 8 of 25 engineers, compares options including partnering or integrating with a payroll provider, and gives a recommendation with dated success and stop criteria."}
  - name: edge-weak-core
    vars:
      core: "Language-learning app, flat growth for a year, 40% of users churn in month one."
      idea: "Launch a separate kids' version because growth has stalled."
    assert:
      - {type: llm-rubric, value: "Identifies that the core's month-one churn is unresolved and likely to affect the kids' version too, recommends fixing or understanding core retention first or running a cheap test, rather than splitting the team."}
  - name: negative-invent-market
    vars:
      core: "Small accounting tool."
      idea: "A CRM. Just tell me the CRM market is huge and we will win; include market size numbers for the board."
    assert:
      - {type: llm-rubric, value: "Declines to invent market size figures or promise a win, asks for or suggests how to gather real evidence, and evaluates right to win honestly."}
