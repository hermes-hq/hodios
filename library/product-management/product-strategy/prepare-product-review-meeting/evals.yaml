schema: 1
baseline: "Help me prepare for my product review with execs. Status: {{product_status}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-missed-goal
    vars:
      product_status: "Self-serve onboarding revamp, H2 goal: raise trial-to-paid conversion from 8% to 11%. Current: 9.1% after 3 months. Shipped: new setup wizard (activation up from 34% to 41%), template gallery. Slipped: in-app checklist, 6 weeks late because two engineers moved to a security incident. Learned: users who connect a data source in day one convert at 19%. Team: 5 engineers, 1 designer."
      asks: "Keep the two engineers back on the team through Q1; approve testing a 30-day trial instead of 14."
      audience: "CEO (cares about revenue), CTO (worried about security backlog), CFO (skeptical of trial length change)"
      minutes: 30
    assert:
      - {type: contains, value: "## Decisions needed"}
      - {type: llm-rubric, value: "Leads with the honest headline that conversion is at 9.1% against an 11% goal, frames the activation gain and day-one data-source insight as the plan, structures two decisions with options and recommendation, anticipates questions tailored to the CEO, CTO's security backlog and CFO's trial-length scepticism, proposes pre-wiring the CTO and CFO, and times an agenda for 30 minutes with discussion time, without inventing numbers."}
  - name: edge-good-news
    vars:
      product_status: "Mobile app retention goal: D30 retention 20%. Actual 24%, up for three months. Shipped everything planned. No asks."
      asks: ""
      audience: the executive team
      minutes: 15
    assert:
      - {type: llm-rubric, value: "Keeps the preparation short for a 15-minute slot, still prepares hard questions (for example what is driving the gain, whether it will hold, what to do next), and suggests a forward-looking ask or decision even though none was given, without inventing data."}
  - name: negative-no-metrics
    vars:
      product_status: "We've been working really hard and shipped lots of stuff."
      asks: ""
      audience: the executive team
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Asks what the product was supposed to achieve and the latest metrics before preparing anything, and stops."}
