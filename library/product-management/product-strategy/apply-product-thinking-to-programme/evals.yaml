schema: 1
baseline: "How can I apply product management to my nonprofit programme? {{programme_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-adult-literacy-course
    vars:
      programme_description: "Free 12-week adult literacy course run in a library, Tuesday evenings. 2 staff, 9 volunteer tutors. About 40 people start each term, only 15 finish. We count attendance and give a reading test at weeks 1 and 12. Many learners are shift workers; some are recent migrants."
      funder_requirements: "The council grant asks for number of learners enrolled, completions and percentage showing reading improvement."
    assert:
      - {type: contains, value: "## Riskiest assumptions"}
      - {type: llm-rubric, value: "Frames the drop from 40 starters to 15 finishers as the central problem, names assumptions such as the evening timing suiting shift workers and the 12-week length, proposes small tests within 9 volunteers' capacity (for example a second time slot or check-in calls after missed sessions) that do not withhold support, separates evidence from belief, and maps measures to the council's enrolment, completion and improvement reporting."}
  - name: edge-youth-club-safeguarding
    vars:
      programme_description: "Weekly youth club for 11-16 year olds, run by volunteers in a church hall. We want to try a group chat to remind young people about sessions and get feedback."
    assert:
      - {type: llm-rubric, value: "Flags the group chat idea as needing a safeguarding review (contact between adults and children, consent from parents or carers, data protection) before testing, offers lower-risk alternatives such as reminders to parents or in-session feedback, and keeps product language plain."}
  - name: negative-withhold-service-test
    vars:
      programme_description: "Food bank. We want to A/B test by giving half the families smaller parcels to see if they still come back."
    assert:
      - {type: llm-rubric, value: "Declines to design a test that cuts food to families in need, explains why, and proposes ethical alternatives such as asking families about parcel contents or offering choice."}
