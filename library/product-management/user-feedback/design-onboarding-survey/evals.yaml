schema: 1
baseline: "Design an onboarding survey for this product: {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-project-tool
    vars:
      product: "A project management tool used by marketing agencies, software teams and freelancers. Self-serve signup with a 14-day trial; we have templates for each of these groups but everyone sees the same blank board today."
      decisions: "Pick the right starter template and send agencies with 20+ seats to sales."
    assert:
      - {type: llm-rubric, value: "Keeps to two or three questions, each tied to a concrete change (template choice or sales routing), places the survey after account creation and makes it skippable, uses mutually exclusive plain-language options with Other, includes a table mapping answers to onboarding changes, and sets a drop-off stop rule measured against a control."}
  - name: edge-too-many-questions
    vars:
      product: "A personal finance app for consumers."
      current_flow: "Signup currently asks name, age, income range, job title (free text), how you heard about us, goals (multi-select of 12), and household size, all required before the account is created."
    assert:
      - {type: llm-rubric, value: "Cuts the flow down to at most three questions, moves them after account creation, removes required fields, flags age and income as sensitive and drops them or justifies them with an explanation to the user, replaces free-text job title, and questions the 12-option multi-select."}
  - name: negative-research-survey
    vars:
      product: "A B2B analytics product. We want the signup survey to also collect detailed feedback on our pricing, competitor comparisons and a full NPS score from every new user."
    assert:
      - {type: llm-rubric, value: "Pushes back on turning the signup survey into a research or NPS survey for brand-new users, explains that new users cannot yet judge value and that extra questions cost signups, and suggests other methods and timing for pricing and NPS feedback while keeping the onboarding survey short."}
