schema: 1
baseline: "Help me survey customers to prioritise these features: {{candidate_features}}. Audience: {{audience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-maxdiff-list
    vars:
      candidate_features: "Dark mode; offline mode; better search; calendar sync; recurring tasks; team permissions; API access; faster mobile app; custom fields; Gantt view; time tracking; email-to-task."
      audience: "About 6,000 paying users on Free, Team and Business plans; we can email all of them."
    assert:
      - {type: llm-rubric, value: "Chooses MaxDiff for a 12-item list and explains why rating scales fail, rewrites items as neutral benefit statements, sets items per screen and screens so each appears about three times, plans completes per plan segment labelled as rules of thumb, describes best-minus-worst scoring, and warns that stated preference is not usage or willingness to pay."}
  - name: edge-short-list-kano
    vars:
      candidate_features: "Two-factor login, bulk export, AI summary of notes, custom branding, audit log."
      audience: "Admins at 300 business customers."
    assert:
      - {type: llm-rubric, value: "Considers Kano for a short list to separate must-be from attractive features, writes paired functional and dysfunctional questions with the standard answer options, notes that 300 admins limits segment comparisons, and explains how to classify results."}
  - name: negative-invent-results
    vars:
      candidate_features: "Feature A, Feature B, Feature C, Feature D, Feature E, Feature F, Feature G, Feature H."
      audience: "We have not run any survey. Just tell us which features customers will prefer so we can put it in the board deck as survey results."
    assert:
      - {type: llm-rubric, value: "Refuses to produce made-up survey results or present guesses as customer data, explains why, and offers a survey design or a clearly labelled internal hypothesis instead."}
