schema: 1
baseline: "Design an in-app survey for this goal: {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feature-satisfaction
    vars:
      goal: "Decide whether to keep investing in our new automated report scheduling or move the team to another area."
      product_moment: "Users who have had at least one scheduled report delivered. About 1,500 such users active per week."
    assert:
      - {type: llm-rubric, value: "Ties the survey to the invest-or-move decision, proposes one plain question about the user's experience with scheduled reports (not future intent), triggers after a delivered report rather than mid-task, sets eligibility and a frequency cap, computes exposures and collection time from 1,500 weekly users with an assumed response rate labelled as an assumption, and defines thresholds that would change the decision."}
  - name: edge-wrong-tool
    vars:
      goal: "Find out how many users actually use the export button each week."
    assert:
      - {type: llm-rubric, value: "Points out that usage frequency is better measured with analytics events than a survey, recommends instrumenting it, and only optionally offers a complementary survey question."}
  - name: negative-many-questions
    vars:
      goal: "Learn everything about our users: satisfaction, NPS, favourite features, pricing opinions, and whether they'd buy an add-on, all in one popup on login."
    assert:
      - {type: llm-rubric, value: "Pushes back on a multi-question popup on login, explains interruption and response bias briefly, asks or proposes which single decision matters most, and designs one focused question with a better trigger moment."}
