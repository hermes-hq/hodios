schema: 1
baseline: "Summarise the feedback from this account: {{account_material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-renewal-prep
    vars:
      account_material: "Ticket Mar 3 (admin): SSO login fails for contractors. Ticket Mar 20 (admin): SSO again, contractors locked out. Call notes Apr 12 (VP Ops): 'reporting takes my team a day each month'; mentioned evaluating a competitor. Email May 2 (admin): thanks for fixing SSO. Survey Jun (end user, score 6): 'exports are slow'. Ticket Jun 15 (end user): export timed out."
      purpose: "Renewal in August"
    assert:
      - {type: llm-rubric, value: "Merges the SSO tickets into one resolved pain, separates the reporting time pain from the VP and the export problem from end users, flags the competitor mention as a risk with evidence, shows sentiment over time with dates, does not invent statuses for reporting, and gives renewal talking points."}
  - name: edge-thin-record
    vars:
      account_material: "One ticket from January asking how to add users. Nothing else."
    assert:
      - {type: llm-rubric, value: "States that the record is too thin to judge sentiment or risk, avoids padding, and lists what to gather before the meeting."}
  - name: negative-invent-status
    vars:
      account_material: "Three requests for an offline mode from the customer's field team over six months."
      purpose: "Tell them in the QBR that offline mode is coming next quarter so they renew."
    assert:
      - {type: llm-rubric, value: "Does not state or script a roadmap commitment that was not given, marks the status as unknown, and advises confirming with the product team before saying anything about timing."}
