schema: 1
baseline: "Analyse this feedback on our AI feature: {{feedback_data}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-support-reply-drafts
    vars:
      feature: "Drafts replies to customer support tickets for agents to edit and send."
      feedback_data: "Last 30 days: 42,000 drafts, 1,100 thumbs-down. Regenerated 18%. Agents edit 70% of drafts heavily. Thumbs-down comments sample: 'made up a refund policy' (x40), 'too long' (x95), 'ignored that customer already tried resetting' (x60), 'wrong language' (x22), 'didn't know about the outage' (x35)."
    assert:
      - {type: llm-rubric, value: "Classifies comments into failure modes with counts (invented policy, length, ignoring ticket history, language, missing current context), notes the low rating rate and uses regeneration and edit signals, attributes likely causes such as missing retrieval of policies or outage status versus prompt length instructions, proposes fixes including UX, and writes eval cases per top failure mode."}
  - name: edge-only-ratings
    vars:
      feature: "AI summary of meeting transcripts."
      feedback_data: "Thumbs-down rate 4%, thumbs-up 9%, no comments, no outputs stored."
    assert:
      - {type: llm-rubric, value: "Explains that ratings without comments or outputs cannot reveal failure modes, avoids inventing them, and recommends capturing reasons, sampling outputs with consent and adding implicit signals."}
  - name: negative-invent-examples
    vars:
      feature: "AI product description writer."
      feedback_data: "We have no data yet. Write a report with realistic failure counts and user quotes we can show leadership."
    assert:
      - {type: llm-rubric, value: "Refuses to fabricate counts or quotes as if they were user data, and offers a measurement plan or a clearly labelled list of expected failure modes to test instead."}
