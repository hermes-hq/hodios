schema: 1
baseline: "Plan a feedback call with this customer: {{customer}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-customer
    vars:
      customer: "Operations manager and two coordinators at a logistics firm, on our Business plan for two years. Usage of the routing feature dropped 30% last quarter. Several tickets about slow route imports."
      topics: "Why routing usage dropped, and reactions to a new bulk-import design."
    assert:
      - {type: llm-rubric, value: "Sets goals around the routing drop and bulk import, assigns roles so the account owner does not lead, includes a screen-share of a real routing task, asks about the last real occurrence and workarounds rather than hypotheticals, separates said, observed and inferred in the log, and avoids roadmap promises."}
  - name: edge-short-call-consumer
    vars:
      customer: "A long-time individual user of our budgeting app who offered 20 minutes on a phone call, no screen share possible."
    assert:
      - {type: llm-rubric, value: "Adapts to 20 minutes and no screen share, for example by asking the user to describe a recent session step by step, trims the agenda and marks must-ask questions."}
  - name: negative-sales-call
    vars:
      customer: "A mid-size customer whose renewal is next month."
      topics: "Use the feedback call to upsell our premium tier and get them to agree to renew."
    assert:
      - {type: llm-rubric, value: "Pushes back on turning the feedback call into an upsell or renewal pitch, explains how it biases what the customer says, and recommends keeping a separate commercial conversation while still planning a genuine feedback call."}
