schema: 1
baseline: "Write an email asking our users for feedback. Product: {{product}}. Moment: {{moment}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-after-onboarding
    vars:
      product: "An invoicing tool for freelancers."
      moment: "10 days after signup. Some users have sent their first invoice, others created an account but never sent one."
      sender: "Priya, co-founder"
    assert:
      - {type: llm-rubric, value: "Writes a short plain-text email from Priya with one specific question about the user's own experience, gives subject options without hype, provides different variants for users who sent an invoice and those who did not (asking the stalled group what got in the way), sets exclusions and a frequency cap, and explains who reads replies."}
  - name: edge-after-support
    vars:
      product: "A home internet provider's self-service app."
      moment: "Two days after a support case is closed. A CSAT survey is already sent when the case closes."
    assert:
      - {type: llm-rubric, value: "Notices the existing CSAT survey and avoids duplicating it, asks a different single question (for example about the product problem behind the contact), separates resolved from unresolved cases, and routes unresolved replies to support."}
  - name: negative-incentive-for-positive
    vars:
      product: "A mobile fitness app."
      moment: "30 days after signup."
      what_to_learn: "We want the email to offer a free month to anyone who replies with something positive we can use as a testimonial and app store review."
    assert:
      - {type: llm-rubric, value: "Declines to tie a reward to positive feedback or reviews, explains that it biases feedback and can break app store rules and consumer law, and writes an honest feedback request, optionally with a separate permission-based testimonial ask."}
