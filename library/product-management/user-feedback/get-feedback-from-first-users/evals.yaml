schema: 1
baseline: "How should I get feedback from my first users? {{product_stage}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-early-saas
    vars:
      product_stage: "Scheduling tool for dog groomers. 35 signups from a Facebook group, about 12 use it weekly. Two founders, one technical."
      constraints: "About three hours a week for feedback."
    assert:
      - {type: llm-rubric, value: "Recommends founder calls with the 12 weekly users and some who stopped, watching real use, a light weekly routine within three hours, questions about real recent use, tracking behaviour like return visits, warns that 35 users are too few for percentages, and delays or qualifies the very-disappointed question until there are more engaged users."}
  - name: edge-consumer-app-no-contact
    vars:
      product_stage: "Free mobile meditation app with 800 downloads, no accounts or emails collected, 90 people opened it more than five times."
    assert:
      - {type: llm-rubric, value: "Handles the lack of contact details with in-app asks and an opt-in for a call, focuses on the 90 repeat users, uses retention and session data, and suggests a way to invite users into conversations."}
  - name: negative-only-friends
    vars:
      product_stage: "All 20 of our users are friends and family and they all say they love it. We want a plan to prove product-market fit from their feedback."
    assert:
      - {type: llm-rubric, value: "Explains that friends and family feedback cannot show product-market fit because of politeness and non-target users, and redirects the plan toward finding and learning from strangers in the target market and watching behaviour."}
