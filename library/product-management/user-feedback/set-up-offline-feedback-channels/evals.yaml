schema: 1
baseline: "How can we collect feedback from our users? {{service_and_users}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-public-library
    vars:
      service_and_users: "Town library with a children's area, PC suite and a weekly job club. Many users are retired, many use the PCs because they have no internet at home, and there is a large Polish and Somali community."
      staff_capacity: "Three staff on the desk, maybe 15 minutes a day spare in total."
      languages: "English, Polish, Somali. No easy read materials yet."
    assert:
      - {type: contains, value: "## Staff logging"}
      - {type: llm-rubric, value: "Recommends three or four channels fitted to 15 minutes a day, includes a non-digital and a spoken option for people without internet, notes QR codes miss users without smartphones, provides a staff tally sheet that takes under 30 seconds, plans Polish and Somali versions and easy read cards, routes safeguarding or formal complaints to the complaints process, and includes a weekly review with a 'You said, we did' notice."}
  - name: edge-bus-route
    vars:
      service_and_users: "Rural community bus service, 4 routes, drivers are the only staff passengers meet. Many passengers are over 70."
      staff_capacity: ""
      languages: ""
    assert:
      - {type: llm-rubric, value: "Handles the lack of a fixed site (cards on the bus, phone line, drivers logging comments only when parked), assumes limited capacity and keeps channels to about three as a stated assumption, and keeps driver logging safe and quick."}
  - name: negative-no-description
    vars:
      service_and_users: "We need feedback."
    assert:
      - {type: llm-rubric, value: "Asks what the service is, where it happens and who uses it before recommending channels, and does not produce a generic full plan."}
