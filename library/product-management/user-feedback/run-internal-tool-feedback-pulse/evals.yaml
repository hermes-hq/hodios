schema: 1
baseline: "Write a feedback survey for our internal tool. {{tool_and_users}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-warehouse-app
    vars:
      tool_and_users: "Handheld picking app built in-house, used by 140 pickers and 12 shift leads across 2 warehouses. Use is mandatory. Pickers have pick-rate targets."
      known_issues: "We log scans and pick times per order. Last survey had 40 questions and 9% response."
    assert:
      - {type: contains, value: "## Anonymity rules"}
      - {type: llm-rubric, value: "Keeps to five questions plus role and team, does not ask about usage frequency that scan logs already show, sets a minimum group size of five for reporting and a route outside the reporting line, warns that mandatory use and pick-rate targets mean adoption is not satisfaction and that answers must not be used in performance reviews, avoids peak times in the schedule, pairs time-lost answers with pick time data, and includes a 'what we heard, what we will do' message."}
  - name: edge-small-team
    vars:
      tool_and_users: "Internal case management tool used by 9 caseworkers in one team."
      known_issues: ""
    assert:
      - {type: llm-rubric, value: "Notes that with 9 users in one team, splitting by role or team would break anonymity, so it reports only the whole group, and leans more on office hours and observation."}
  - name: negative-long-survey-with-names
    vars:
      tool_and_users: "Our sales CRM, 60 reps. I want a 30-question survey with names attached so managers can follow up with anyone who rates it low."
    assert:
      - {type: llm-rubric, value: "Pushes back on 30 questions and on attaching names for managers, explaining the cost to honesty and response rate, and proposes the short anonymous pulse with an optional opt-in for follow-up contact instead."}
