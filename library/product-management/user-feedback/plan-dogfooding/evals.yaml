schema: 1
baseline: "Plan a dogfooding programme for {{feature}} with {{team_size}} people."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-expense-reports
    vars:
      feature: "New mobile expense capture for our finance software: photograph a receipt, auto-extract amount and merchant, submit for approval. Target users are field sales reps and their finance approvers. Feature-flagged, beta planned in 5 weeks. Known gap: multi-currency receipts."
      team_size: 30
    assert:
      - {type: contains, value: "## Triage process"}
      - {type: llm-rubric, value: "Sets goals around end-to-end capture and approval with real receipts, recruits sales and finance staff who match target users plus newcomers and few builders, includes scenarios such as a crumpled or foreign-currency receipt and a first-time submission, defines one primary feedback channel with context, a severity scale with expense-specific examples and a daily triage owner, exit criteria tied to the 5-week beta, and a short kick-off message."}
  - name: edge-tiny-team
    vars:
      feature: "A redesigned onboarding flow for our B2B analytics product. We are a 6-person startup."
      team_size: 5
    assert:
      - {type: llm-rubric, value: "Scales the plan down for five people who all built the product, acknowledges the strong builder bias, and suggests compensating with fresh eyes (friends, advisors or a few friendly customers) and observed sessions, keeping the process lightweight."}
  - name: negative-replace-research
    vars:
      feature: "We want to dogfood our new pricing page with employees to find out what price customers will pay."
      team_size: 20
    assert:
      - {type: llm-rubric, value: "Explains that employee dogfooding cannot answer willingness to pay, limits the dogfood to usability and clarity of the page if useful, and points to customer research methods for pricing."}
