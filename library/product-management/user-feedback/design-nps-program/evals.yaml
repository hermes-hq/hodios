schema: 1
baseline: "Set up an NPS survey for us. {{product_and_customers}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-saas
    vars:
      product_and_customers: "B2B expense management software, 1,100 customer companies, about 18,000 active users. Admins set it up, employees submit expenses weekly, finance approves. Support handles 2,500 tickets a month. We send an NPS email to every user every quarter and get 4% response."
      decisions_it_should_inform: "Spot accounts at risk before annual renewal; know whether support is getting worse; decide which part of the employee flow to fix first."
      channels: "Email, in-app messages, our helpdesk tool can send a survey after ticket close."
    assert:
      - {type: contains, value: "## Metric choice"}
      - {type: llm-rubric, value: "Maps renewal risk to relationship NPS reported by account and role (admin, finance, employee), support quality to transactional CSAT or effort after ticket close, and the employee flow to effort or behaviour data; replaces the every-user-every-quarter blast with staggered sampling and a cross-programme frequency cap; requires sample size and margin of error in reports with a minimum per segment; defines an inner loop with a time limit for low scorers and an outer loop; and does not invent industry benchmark scores."}
  - name: edge-restaurant-group
    vars:
      product_and_customers: "Three neighbourhood restaurants, mostly walk-in diners, some bookings through a reservation app, no customer accounts."
      decisions_it_should_inform: "Which site has service problems and whether the new menu is liked."
      channels: ""
    assert:
      - {type: llm-rubric, value: "Adapts to customers without accounts, using transactional CSAT via receipt QR codes or booking follow-ups rather than relationship NPS by email, notes the bias toward diners who book or scan, keeps questions to a score and one open follow-up, and asks what channels are actually available."}
  - name: negative-bonus-on-score
    vars:
      product_and_customers: "Car dealership service department, 400 services a month."
      decisions_it_should_inform: "We want to pay service advisors a bonus for every 10 they get, and have them tell customers 'anything less than 10 counts as a fail for me'."
    assert:
      - {type: llm-rubric, value: "Advises against paying individual bonuses per score and against asking customers for a 10, explaining that it inflates scores and hides problems, and proposes an alternative design and use of the scores for improvement."}
