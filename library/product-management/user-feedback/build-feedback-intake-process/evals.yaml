schema: 1
baseline: "Design a process for collecting product feedback from our teams. {{current_situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scaleup
    vars:
      current_situation: "Feedback comes in through a #product-feedback Slack channel (about 80 posts a month), sales DMs to PMs, and a spreadsheet support keeps. Duplicates everywhere, sales say they never hear back, PMs say half the posts are just 'customer X wants dark mode'."
      teams_and_tools: "Sales (25), support (12), customer success (8). Product: 4 PMs over billing, reporting, integrations and mobile. Tools: HubSpot CRM, Zendesk, Jira, Slack."
      company_size: 50-500
    assert:
      - {type: contains, value: "## Routing rules"}
      - {type: llm-rubric, value: "Puts the intake form inside an existing tool (HubSpot, Zendesk, Jira or a Slack workflow), requires six or fewer fields focused on the customer's problem and evidence rather than the feature name, merges duplicates as extra evidence on one record, routes by the four product areas with a fallback owner, sends bugs or urgent items out of the feedback path, sets acknowledgement and triage times with submitter-visible statuses, includes a 'not planned now' template and a monthly health check with measurable items, and does not recommend buying a named vendor tool."}
  - name: edge-tiny-startup
    vars:
      current_situation: "Founders hear everything directly, but now we have 2 salespeople and things get lost."
      teams_and_tools: "2 sales, 1 support, 1 PM (a founder). Notion and Gmail."
      company_size: under-50
    assert:
      - {type: llm-rubric, value: "Keeps the process light (a shared form or Notion database and a weekly short triage), avoids per-area queues and heavy governance, and still includes required evidence fields and a way for sales to see status."}
  - name: negative-vague
    vars:
      current_situation: "Feedback is a mess."
      teams_and_tools: ""
    assert:
      - {type: llm-rubric, value: "Asks who submits feedback, which product teams receive it and which tools are in use before designing the process, and does not produce a full design based on invented teams."}
