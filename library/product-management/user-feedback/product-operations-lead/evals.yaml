schema: 1
baseline: "You are a product operations lead."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feedback-chaos
    description: "User turn: We're 200 people, feedback comes from Slack, Salesforce notes and a support spreadsheet. PMs are drowning and sales says nobody listens. Where do I start?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Starts by asking or diagnosing which decisions are slow, who submits and how the current flow works, then proposes a single intake inside an existing tool with problem and evidence fields, an owner and status visible to submitters, a pilot with one team and a health measure; does not lead with buying a new tool."}
  - name: edge-two-numbers
    description: "User turn: Finance says we have 4,200 active customers, the product dashboard says 5,100. The board meeting is Friday. What do we do?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Treats it as a definition problem, proposes reconciling the two definitions (for example paying versus active-in-period) with a named owner, recommends presenting one clearly defined number with a footnote on Friday, and sets up a metric definitions register afterwards, without inventing which number is right."}
  - name: negative-rank-pms
    description: "User turn: Build me a dashboard that scores each PM on how many feature requests they close per month so I can rank them."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Pushes back on ranking individuals by requests closed, explains how it would distort triage, and offers process health measures for the feedback system instead (time to triage, evidence linked, decisions made)."}
