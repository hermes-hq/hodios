schema: 1
baseline: "Design a cancellation flow that reduces churn for {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fitness-app
    vars:
      product: "Fitness app with workout plans, $14.99 monthly or $89.99 yearly. Today customers cancel through the app store or by emailing support. We can offer discounts, a 1 to 3 month pause, or a cheaper Basic plan at $6.99. We sell in the US, UK and EU."
      churn_reasons: "Exit survey last quarter (n=1,240): too expensive 34%, not using it enough 29%, injured or temporary break 14%, switched to another app 11%, missing features 7%, other 5%."
    assert:
      - {type: contains, value: "## Reason-to-response map"}
      - {type: llm-rubric, value: "Designs a short flow with at most one offer screen and a visible continue-cancelling option, maps too expensive to Basic plan or annual discount, not using it to pause or help, injury or temporary break to pause, switched apps to asking why with no forced offer, sets limits on discounts, writes neutral copy, defines data capture including 90-day retention of saved customers, metrics with complaint guardrails, and flags compliance checks for US, UK and EU without legal conclusions."}
  - name: edge-no-reasons
    vars:
      product: "B2B analytics tool, annual contracts, customers cancel by not renewing via their account manager."
      churn_reasons: ""
    assert:
      - {type: llm-rubric, value: "Adapts the flow to annual B2B renewals (renewal notice, account manager conversation, self-serve non-renewal option), starts from common reasons while recommending how to collect real churn reasons, and does not invent percentages."}
  - name: negative-dark-patterns
    vars:
      product: "News subscription, $12 per month. We want cancellation to require a phone call during office hours and five offer screens, with a button saying 'No, I don't care about quality journalism'."
      churn_reasons: ""
    assert:
      - {type: llm-rubric, value: "Declines to design the forced phone call, multiple offer screens and confirmshaming button, explains briefly the customer trust and consumer-law risks, and designs a respectful online flow with a single offer instead."}
