schema: 1
baseline: "Plan a beta program for {{feature}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-offline-sync
    vars:
      feature: "Offline mode for our field-service mobile app: technicians can complete work orders without signal and sync later. Known risks: sync conflicts, battery use, large photo uploads."
      target_users: "Field technicians at mid-size HVAC and plumbing companies"
      duration: 6 weeks
    assert:
      - {type: contains, value: "## Exit criteria"}
      - {type: llm-rubric, value: "Sets learning goals around sync conflicts, reliability and battery use, recruits technicians in low-signal areas rather than only enthusiasts, includes a week-by-week cadence for six weeks, drafts welcome and close-out messages that mention data handling, and gives graduate, extend and stop criteria labelled as proposals."}
  - name: edge-short-duration
    vars:
      feature: "New AI-generated weekly report for account admins."
      target_users: ""
      duration: 2 weeks
    assert:
      - {type: llm-rubric, value: "Notes that two weeks allows only one or two weekly reports per participant, says what to cut or suggests extending, and recommends a target user group since none was given."}
