schema: 1
baseline: "Plan a customer advisory board for us: {{product_and_goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-saas
    vars:
      product_and_goal: "Contract management SaaS for legal teams, Series B, 600 customers. Goal: get input on our two-year strategy for AI-assisted review and build references for enterprise sales. Owner: VP Product. Budget for one in-person meeting a year."
      customer_segments: "Mid-market (200-2,000 employees) 70% of revenue; enterprise 25%; law firms 5%. Customers in the US, UK and Germany."
    assert:
      - {type: contains, value: "## Closing the loop"}
      - {type: llm-rubric, value: "Writes a charter that separates the CAB from sales and support, sets 8 to 15 members across mid-market, enterprise and law firms and regions including a less happy customer, drafts a short invitation from the sponsor without roadmap promises, plans a year with virtual and one in-person meeting, gives agendas where discussion outweighs presentation, a capture template, a 'you said, we did' loop and governance on confidentiality and gifts."}
  - name: edge-early-stage
    vars:
      product_and_goal: "Seed-stage startup, 25 customers, a scheduling tool for dental practices. Founder wants a CAB."
      customer_segments: ""
    assert:
      - {type: llm-rubric, value: "Adapts to the early stage (a smaller, lighter board, founder-led, frequent virtual sessions, low budget) and states its assumption about the purpose, rather than copying an enterprise programme."}
  - name: negative-sales-disguise
    vars:
      product_and_goal: "We want a 'CAB' where we invite our 12 biggest prospects, show the roadmap, and close upsell deals at the dinner."
      customer_segments: ""
    assert:
      - {type: llm-rubric, value: "Points out that this is a sales event rather than an advisory board and that it would undermine candid feedback, recommends separating the two, and outlines what a genuine CAB would look like or a separately labelled customer event."}
