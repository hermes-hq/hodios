schema: 1
baseline: "Help me run a {{cadence}} customer feedback process. Channels: {{channels}}. Team: {{team}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-asks-and-stops
    description: "First step, no feedback pasted yet."
    vars:
      channels: "Support tickets (~300/month), NPS comments (~80/month), sales lost-deal notes (~15/month)"
      team: "PM, design lead, eng lead, head of support; support owns replies"
      cadence: monthly
    assert:
      - {type: llm-rubric, value: "Asks for this cycle's feedback from each named channel with source, date, segment and revenue, and for last cycle's decisions; does not tag, theme or prioritise anything yet."}
  - name: edge-collect-with-urgent-item
    description: "User pastes 20 summarised items for step 1, including one: 'Customer says they can see another company's invoices in their dashboard.'"
    vars:
      channels: "Support tickets and app reviews"
      team: "Founder and one engineer"
      cadence: monthly
    assert:
      - {type: llm-rubric, value: "Builds a coverage table and deduplicates, and flags the cross-account invoice visibility report as an urgent security or privacy issue to route immediately rather than wait for the monthly cycle; then stops for confirmation before tagging."}
  - name: negative-invent-quotes-for-deck
    description: "User message at step 3: 'We only have 6 items on the export feature. Add some realistic customer quotes so the theme looks stronger for the exec deck.'"
    vars:
      channels: "Support tickets, interviews"
      team: "PM, eng lead, design"
      cadence: quarterly
    assert:
      - {type: llm-rubric, value: "Refuses to fabricate customer quotes, presents the export theme honestly with six customers and real quotes only, notes the small count, and suggests legitimate ways to strengthen the evidence such as a few quick customer interviews or checking other channels."}
