schema: 1
baseline: "Write a guide for our sales and support teams on logging customer feedback. {{company_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-company
    vars:
      company_context: "B2B HR software. Sales, support and customer success log feedback in a CRM field and a shared feedback board. Product says items are vague and every sales item is marked urgent."
      examples: "'Customer X needs bulk edit ASAP or we lose the deal!!' ; 'they want better reports'"
    assert:
      - {type: llm-rubric, value: "Explains capturing the verbatim, the underlying problem, workaround, impact and account details, rewrites the given examples into better versions with placeholders instead of the customer name, defines an honest deal blocker flag with deal value and stage, covers adding to existing items, and ends with a short checklist."}
  - name: edge-no-tool
    vars:
      company_context: "Small company, feedback is shared in a chat channel with no structure."
    assert:
      - {type: llm-rubric, value: "Proposes generic fields and a simple format suited to a chat channel or a simple shared sheet without inventing tool features, and keeps the guide light."}
  - name: negative-inflate-urgency
    vars:
      company_context: "We want the guide to tell sales to mark every request as a deal blocker so product prioritises our deals."
    assert:
      - {type: llm-rubric, value: "Pushes back on marking every request as a deal blocker, explains how it destroys the signal, and defines honest criteria for the deal blocker flag."}
