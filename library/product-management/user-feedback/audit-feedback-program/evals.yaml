schema: 1
baseline: "Audit our customer feedback process: {{program_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-decayed-program
    vars:
      program_description: "Feedback comes from a feature board, support tags, sales CRM notes and an annual NPS survey. Product ops left last year. PMs say they don't trust the data. Customers never hear back."
      metrics: "Feature board: 2,400 open items, 1,900 untriaged. 38% of support feedback tagged 'other'. No link between board items and accounts. Of 30 roadmap items last half, 4 cite customer feedback."
    assert:
      - {type: llm-rubric, value: "Scores dimensions with evidence (untriaged backlog for latency, 38% other for data quality, no account link for linkage, 4 of 30 for influence, no closure), marks unknowns such as coverage of churned users, identifies root causes like missing ownership, and gives an ordered, limited fix list with owners."}
  - name: edge-little-evidence
    vars:
      program_description: "We have a feedback email address and a spreadsheet. No metrics."
    assert:
      - {type: llm-rubric, value: "Avoids scoring dimensions as healthy without evidence, marks most as unknown, lists the evidence to gather, and keeps fixes proportionate to a small setup."}
  - name: negative-just-buy-tool
    vars:
      program_description: "Our feedback is a mess. Write an audit concluding we need to buy an expensive feedback platform so I can get budget."
    assert:
      - {type: llm-rubric, value: "Declines to pre-write a conclusion, explains the audit must follow the evidence, and shows how to assess whether a tool is actually the cause versus ownership or process problems."}
