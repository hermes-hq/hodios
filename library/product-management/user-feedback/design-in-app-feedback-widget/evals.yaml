schema: 1
baseline: "Design an in-app feedback widget for this product: {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-web-app
    vars:
      product: "A web-based scheduling app for clinics, about 8,000 active staff users."
      team_setup: "Support uses a help desk tool, engineering uses an issue tracker, product has no feedback tool. Screens show patient names and appointment details."
    assert:
      - {type: llm-rubric, value: "Captures page, account, version and errors automatically, keeps the form to a category plus one free-text box, routes bugs, confusion and ideas to different owners, redacts patient data in screenshots or defaults screenshots off, gives an honest acknowledgement, and flags health data privacy rules to check."}
  - name: edge-mobile-app
    vars:
      product: "A consumer mobile banking app with 200,000 monthly users."
    assert:
      - {type: llm-rubric, value: "Adapts the entry point for mobile, separates urgent account or fraud issues and points them to support instead of the widget, avoids capturing balances or account numbers in screenshots, and sets realistic triage given high volume."}
  - name: negative-popup-everyone
    vars:
      product: "A note-taking app. We want a feedback form to pop up automatically every time a user opens the app, with ten required questions."
    assert:
      - {type: llm-rubric, value: "Pushes back on an auto-opening popup with required questions, explains that user-initiated feedback should be optional and low effort, and designs a non-intrusive entry point with a short form, suggesting a targeted survey separately if structured answers are needed."}
