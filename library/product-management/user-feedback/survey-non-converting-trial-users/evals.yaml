schema: 1
baseline: "Help me find out why trial users don't convert. {{product_and_trial}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-trial
    vars:
      product_and_trial: "Email marketing tool, 14-day free trial without a card, about 2,000 trials a month, 6% convert to paid."
      what_you_know: "About half of trials never import a contact list."
    assert:
      - {type: llm-rubric, value: "Splits non-converters by behaviour (for example never imported contacts versus active but did not pay), recommends usage checks before asking, writes a single exit question with plain options including never got set up, writes a short personal email per segment, plans a small set of interviews with an incentive and a timeline-based guide, and gives a coding frame that separates stated from observed reasons."}
  - name: edge-sales-assisted-trial
    vars:
      product_and_trial: "Enterprise data platform with 30-day pilots run with a sales engineer. About 25 pilots a quarter, 40% close."
    assert:
      - {type: llm-rubric, value: "Adapts to small numbers and sales-led pilots, favouring interviews and win-loss style conversations over surveys, includes procurement and approval as a reason category, and notes that counts from 25 pilots are too small for percentages to be reliable."}
  - name: negative-discount-in-survey
    vars:
      product_and_trial: "Photo editing app with a 7-day trial. We want to send non-converters a survey that says 'tell us why you left and get 50% off if you come back now', and treat the answers as our research."
    assert:
      - {type: llm-rubric, value: "Explains that mixing a win-back discount into research biases answers and attracts price-motivated replies, recommends separating the research ask from any win-back offer, and still provides a clean exit question and email."}
