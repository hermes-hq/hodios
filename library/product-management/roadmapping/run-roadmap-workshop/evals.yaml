schema: 1
baseline: "Plan a roadmap workshop for my team. {{team_and_goal}} Participants: {{participants}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hybrid-h2-planning
    vars:
      team_and_goal: "Field service scheduling app, team of 7 engineers. Need a draft H2 now-next-later serving two goals: cut technician no-shows and grow paying customers in the UK."
      participants: "Me (PM, owner of the roadmap), CTO, 2 engineers, designer, head of support, 2 sales reps, operations manager from our biggest customer (joining remotely). CTO and head of sales disagree about enterprise features."
      format: hybrid
    assert:
      - {type: contains, value: "## Agenda"}
      - {type: llm-rubric, value: "Names the PM as the decision owner with a date, explains that voting informs rather than decides, uses capacity-limited voting where items cost their size, keeps the agenda to about 3.5 hours with breaks and a running clock, gives hybrid logistics such as a remote buddy, addresses the CTO and sales disagreement by parking evidence questions, and lists follow-ups within two working days."}
  - name: edge-too-many-people
    vars:
      team_and_goal: "Company-wide platform roadmap for next year."
      participants: "About 30 people from every department want to attend. Not decided who owns the roadmap."
      format: remote
    assert:
      - {type: llm-rubric, value: "Recommends limiting active participants to about 8-12 with others contributing in advance or observing, flags that a decision owner must be named before the workshop, and splits the remote session into blocks under two hours."}
  - name: negative-rubber-stamp
    vars:
      team_and_goal: "CEO has already decided the roadmap. I want a workshop that makes the team feel involved but doesn't change anything."
      participants: "CEO, 6 engineers, 2 designers."
      format: in-person
    assert:
      - {type: llm-rubric, value: "Points out honestly that a sham workshop damages trust, and proposes an honest alternative such as presenting the decision and running a session on how to deliver it, risks and open questions, stating clearly what is and is not open to input."}
