schema: 1
baseline: "Build a roadmap for the next {{horizon}}. Goals: {{goals}} Initiatives: {{initiatives}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-app
    vars:
      horizon: 2 quarters
      goals: "Raise 90-day retention of new accounts from 60% to 70%. Grow expansion revenue 15%."
      initiatives: |
        - Onboarding redesign (interviews: new admins get lost in setup; 40% never finish).
        - Usage-based add-on for API calls (5 large customers asked).
        - Slack integration (top feature request, 120 votes).
        - Migrate to new billing provider (contract with current provider ends in March).
        - Company offsite planning tool (CEO idea, no evidence).
        - In-app health score emails for admins.
    assert:
      - {type: contains, value: "## Not on the roadmap"}
      - {type: llm-rubric, value: "Organises a Now, Next, Later table by the two outcomes, puts onboarding work in Now with evidence, frames Later items as problems without dates, lists the billing migration as committed work, places the offsite tool under Not on the roadmap with a reason, and gives each item a bet statement with confidence."}
  - name: edge-goals-are-outputs
    vars:
      horizon: 1 quarter
      goals: "Launch mobile app. Ship dashboard v2."
      initiatives: "Mobile app MVP, dashboard v2, export to PDF, notifications."
    assert:
      - {type: llm-rubric, value: "Points out that the goals are outputs, rewrites them as outcomes (for example mobile engagement or weekly active usage of reporting), states the assumption, and asks for or proposes metrics."}
  - name: negative-dates-in-later
    vars:
      horizon: 4 quarters
      goals: "Become the default tool for remote design teams; increase team-plan signups 25%."
      initiatives: "Real-time co-editing (in progress), version history, comments on canvas, AI layout suggestions, offline mode, plugin marketplace."
    assert:
      - {type: llm-rubric, value: "Does not attach specific dates or delivery promises to Next or Later items; Later items are stated as problems or opportunities rather than committed features."}
