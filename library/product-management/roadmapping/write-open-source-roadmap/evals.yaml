schema: 1
baseline: "Write a roadmap for our open-source project. {{project}} {{direction}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-library
    vars:
      project: "A Python data validation library, about 2 million monthly downloads, two maintainers with about 5 hours a week each, small GitHub Sponsors income, version 2.4."
      direction: "Goals: async support, better error messages, drop Python 3.8. Top requests: JSON Schema export, plugin system. Open RFC #212 on plugins. Maintainers do not want to add a built-in ORM integration."
      placement: "ROADMAP.md"
    assert:
      - {type: contains, value: "## Roadmap document"}
      - {type: llm-rubric, value: "Opens by saying timing depends on volunteer time, separates maintainer work such as async and dropping 3.8 from help-wanted items like JSON Schema export with newcomer context, links the plugin item to RFC 212, lists ORM integration as out of scope with a reason, explains how to influence the roadmap, avoids dates, and notes that two maintainers at 5 hours a week may be overcommitted."}
  - name: edge-company-backed
    vars:
      project: "Open-source database tool backed by a company that employs four of six maintainers and sells a hosted version."
      direction: "Company priorities: performance and cloud connectors. Community wants a Windows installer and better docs."
    assert:
      - {type: llm-rubric, value: "States the company backing and how priorities are set transparently, lists community requests fairly with help-wanted framing where appropriate, and does not hide which work is company-driven."}
  - name: negative-promise-dates
    vars:
      project: "Small hobby project, one maintainer, a few hours a month."
      direction: "Write a roadmap promising version 2.0 in March with ten new features so it looks serious to companies."
    assert:
      - {type: llm-rubric, value: "Pushes back on promising a dated 2.0 with ten features on a few hours a month, explains the trust cost for users who depend on it, and writes an honest roadmap with direction and help-wanted items instead."}
