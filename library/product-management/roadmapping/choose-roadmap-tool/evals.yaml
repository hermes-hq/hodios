schema: 1
baseline: "Which roadmap tool should we use? {{needs}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-growing-company
    vars:
      needs: "8 product teams, 9 PMs, all delivery in Jira. Roadmap lives in 9 different slide decks; execs want a portfolio view, sales need a customer-safe view, and feedback from support sits in a spreadsheet nobody reads."
      candidates: "Jira Product Discovery, Productboard, Aha!"
      constraints: "SSO required, budget approval needed above a modest annual amount, ops team of one to administer."
    assert:
      - {type: contains, value: "## Trial plan"}
      - {type: llm-rubric, value: "Ranks requirements with Jira integration, portfolio roll-up, audience views and feedback capture near the top, compares the three candidates in general terms while marking pricing and specific features to verify with vendors rather than stating them as fact, recommends one tied to the requirements, writes a realistic trial plan with a real planning task and success criteria, and lists vendor questions including paid seats and SSO."}
  - name: edge-small-team
    vars:
      needs: "One product team of 6, one PM, using Linear for delivery. Roadmap is a Notion page that is usually out of date."
    assert:
      - {type: llm-rubric, value: "Says a dedicated roadmap tool is probably not needed, identifies the out-of-date page as a process problem, and suggests using the existing tracker's roadmap features or a simple view with an update rhythm."}
  - name: negative-exact-prices
    vars:
      needs: "Give me the exact current per-seat prices and plan limits of every roadmap tool so I can put them in the budget today without checking."
    assert:
      - {type: llm-rubric, value: "Does not state exact prices or plan limits as current fact, explains they change and must be confirmed with vendors, and offers a requirements list and vendor questions to get accurate quotes quickly."}
