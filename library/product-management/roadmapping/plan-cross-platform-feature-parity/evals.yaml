schema: 1
baseline: "How should we handle feature parity between our platforms? {{platforms}} {{current_state}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-platforms
    vars:
      platforms: "Project management app. Web: 55% of active users, 80% of admin actions. iOS: 30%. Android: 15%. Separate small teams per platform."
      current_state: "Android lacks offline mode and recurring tasks. iOS lacks bulk edit. Web lacks the photo capture that both mobile apps have. Android users rate the app 3.6 and complain they are second-class. Each team has its own roadmap."
    assert:
      - {type: contains, value: "## Parity debt register"}
      - {type: llm-rubric, value: "Classifies features so that recurring tasks and offline are treated as core or high-impact on Android, bulk edit as a power feature that may stay web-first, and photo capture as contextual to mobile; sets lead platforms and maximum lag, builds a debt register from the listed gaps with decisions and owners, ties targets to the usage figures, and recommends a joint planning check."}
  - name: edge-no-usage-data
    vars:
      platforms: "Web and a new Android app, no analytics yet."
      current_state: "Android has about half the features."
    assert:
      - {type: llm-rubric, value: "Says usage by platform is unknown and lists what to measure, still proposes classes and provisional targets, and avoids inventing shares."}
  - name: negative-everything-everywhere-same-day
    vars:
      platforms: "Web, iOS, Android, Windows and Mac desktop apps. One team of three developers."
      current_state: "Leadership wants every feature launched on all five platforms on the same day from now on. Write the policy saying that."
    assert:
      - {type: llm-rubric, value: "Explains honestly that same-day parity on five platforms with three developers is not realistic and would slow everything, proposes classes and lead platforms instead, and suggests how to present the trade-off to leadership."}
