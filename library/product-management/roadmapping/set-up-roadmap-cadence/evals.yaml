schema: 1
baseline: "Help us manage our roadmap better. Situation: {{current_situation}} Org: {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scattered-copies
    vars:
      current_situation: "Roadmap is a slide deck the head of product updates before board meetings, plus a spreadsheet engineering keeps, plus a Notion page sales copied last year. Sales quotes dates from the old page; engineering ignores the deck."
      organisation: "4 product teams, quarterly planning, audiences: leadership, sales, support, engineering. Tools: Notion, Jira, Google Sheets."
    assert:
      - {type: contains, value: "## Views per audience"}
      - {type: llm-rubric, value: "Diagnoses multiple copies and missing ownership, picks one existing tool as the source of truth and retires the other copies including the stale sales page, defines required fields with a confidence label, gives a sales view without exact dates for items not in build, ties updates to existing rituals with a staleness rule, and lays out a four-week rollout without recommending a new tool."}
  - name: edge-tiny-startup
    vars:
      current_situation: "Two founders and three engineers; the roadmap is in the founders' heads and a Trello board."
      organisation: "One team, two-week cycles, audiences: the team and a few design-partner customers."
    assert:
      - {type: llm-rubric, value: "Scales the routine down to a light version on the existing board with few fields and a short weekly check, and a simple customer-facing view with certainty labels, rather than a heavy multi-audience process."}
  - name: negative-promise-dates-to-sales
    vars:
      current_situation: "Sales wants exact ship dates for every item for the next 12 months in their view so they can close deals."
      organisation: "3 teams, quarterly planning."
    assert:
      - {type: llm-rubric, value: "Pushes back on exact 12-month dates in the sales view, explains why unbuilt items carry ranges or horizons and confidence labels, and offers an alternative that still helps sales such as themes, horizons and a commitment approval route."}
