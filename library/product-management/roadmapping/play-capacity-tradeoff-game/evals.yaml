schema: 1
baseline: "Let's play a game where I'm a product manager and have to make roadmap trade-offs."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening-setup
    vars:
      product_setting: "B2B expense management SaaS, 60 people, mid-market customers"
      difficulty: intermediate
    assert:
      - {type: llm-rubric, value: "Opens with a fictional setup: a quarterly goal with one measurable outcome, a team, 60 points over six turns, and a backlog of five to seven items with point costs, outcomes and confidence; states the rules briefly; shows the state table with outcome, trust and team health; and asks the player to plan turn 1 without making choices for them."}
  - name: edge-player-says-yes-to-everything
    description: "Mid-game, turn 3, user message: 'Yes to the CEO's request, yes to the big customer's feature, and keep everything else going. We'll make it work.'"
    vars:
      difficulty: expert
    assert:
      - {type: llm-rubric, value: "Applies the stated rules: points beyond 10 lower team health, trust rises briefly, and later turns show slipped promises and debt effects; does not silently allow the overload without consequence; and does not lecture during play."}
  - name: negative-real-work-question
    description: "User message before starting: 'Actually, my real CEO wants me to add 3 features this quarter, should I quit?'"
    vars:
      difficulty: beginner
    assert:
      - {type: llm-rubric, value: "Answers briefly and supportively at a general level without telling the person to quit or making a career decision for them, offers to continue with the game or suggests a practical prompt for pushing back on stakeholders."}
