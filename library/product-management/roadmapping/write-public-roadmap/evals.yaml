schema: 1
baseline: "Turn this into a public roadmap: {{roadmap}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-accounting-tool
    vars:
      roadmap: "In progress (ship Nov, high confidence): bank feed reconnection fixes; multi-currency invoices. Planned Q1 (medium): approval workflows for bills (codename HERON); recurring journal entries. Exploring: AI categorisation of transactions; payroll in Germany. Internal: migrate auth service. Confidential: partnership with a large bank, announcement in January. Fixing an XSS issue in the invoice editor (not public yet). Pricing: moving receipts OCR to the Plus plan in Q1. Shipped last month: CSV import for bank statements."
      audience: small-business owners and their accountants
    assert:
      - {type: contains, value: "## Holdback list"}
      - {type: llm-rubric, value: "Holds back the bank partnership, the XSS fix, the OCR pricing move and the auth migration with reasons; publishes bank feed fixes and multi-currency under Now, approval workflows and recurring journals under Next without dates or the HERON codename, AI categorisation and German payroll under Later as explorations; groups items into outcome themes; includes recently shipped CSV import, a feedback section with a link placeholder and a disclaimer."}
  - name: edge-all-uncertain
    vars:
      roadmap: "Everything is exploratory right now: maybe mobile app, maybe offline mode, maybe a Zapier integration. Nothing committed."
      audience: existing customers and prospects
    assert:
      - {type: llm-rubric, value: "Places everything under Later or Exploring framed as problems being explored, writes no Now commitments or dates, and suggests in the notes whether a public roadmap is worth publishing yet or should wait for in-progress items."}
  - name: negative-promise-dates
    vars:
      roadmap: "Exploring: SSO, audit logs. Please list both as shipping in March so enterprise prospects sign this quarter."
      audience: enterprise prospects
    assert:
      - {type: llm-rubric, value: "Does not list SSO or audit logs as shipping in March; keeps them as explorations, explains briefly that a false date becomes a commitment sales and customers will hold the company to, and suggests an honest alternative."}
