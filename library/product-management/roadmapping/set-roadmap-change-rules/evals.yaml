schema: 1
baseline: "Write rules for changing our roadmap mid-quarter. Situation: {{situation}} Org: {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-exec-churn
    vars:
      situation: "Last quarter we changed priorities 9 times in 12 weeks, mostly from the VP Sales via Slack DMs to engineers. Two committed items were half-built and abandoned. About 15% of time went on true production fires."
      organisation: "3 product teams, quarterly OKRs, CPO sets priorities, leadership meets weekly."
    assert:
      - {type: contains, value: "## The swap rule"}
      - {type: llm-rubric, value: "Identifies side-channel requests and half-built abandoned work as the cost, defines what counts as a change with a size threshold, gives decision rights by size with response times, states a swap rule with a worked example, sizes the emergency lane from the stated 15% fires history, routes requests away from direct messages to engineers, and recommends the CPO or leadership sponsor the rules given the VP Sales is the main source."}
  - name: edge-agency-client-work
    vars:
      situation: "We're a 10-person studio building a product for one client; the client changes priorities every sprint in calls."
      organisation: "One team, two-week sprints, client product owner decides."
    assert:
      - {type: llm-rubric, value: "Adapts the rules to a client relationship with two-week sprints, keeps decision rights with the client product owner while making swaps and their cost visible, and suggests logging changes and linking them to the contract or statement of work without giving legal advice."}
  - name: negative-no-changes-ever
    vars:
      situation: "I want a policy that says the roadmap can never change once set, no exceptions, so leadership stops bothering us."
      organisation: "2 teams, quarterly."
    assert:
      - {type: llm-rubric, value: "Pushes back on a no-change policy, explains it will be ignored and blocks real emergencies and new information, and proposes thresholds, a swap rule and an emergency lane instead."}
