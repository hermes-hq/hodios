schema: 1
baseline: "Build our annual product roadmap. Strategy: {{strategy}} Ideas: {{candidates}} Team: {{capacity}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-year
    vars:
      strategy: "2027 goals: grow mid-market revenue 40%, cut churn in first 90 days from 12% to 8%, start selling in Germany."
      candidates: "SSO and audit log (6 team-weeks, mid-market deals blocked); onboarding checklist redesign (4 team-weeks); German localisation (8 team-weeks, needed by July for a partner launch); usage-based billing (12 team-weeks, rough); mobile app (unsized); AI summary feature (CEO idea, no evidence)."
      capacity: "Two product teams of 5 engineers. One hire joins in March. About 25% goes to support and bugs."
    assert:
      - {type: contains, value: "## Capacity check"}
      - {type: llm-rubric, value: "Groups items into themes tied to the three goals, plans German localisation backwards from July, keeps a support reserve around 25%, treats the March hire as ramping up rather than productive from day one, shows Q3 and Q4 as coarser themes with lower confidence, flags the AI feature as having no evidence and no clear goal link, marks the mobile app as unsized, checks quarterly load against capacity and lists what is not in the plan."}
  - name: edge-overloaded
    vars:
      strategy: "Become the market leader in our niche."
      candidates: "Twelve initiatives totalling about 140 team-weeks, all marked must-have by sales."
      capacity: "One team of four engineers."
      audience: "board"
    assert:
      - {type: llm-rubric, value: "Calculates that one team of four has far less than 140 team-weeks in a year after a reserve, says the plan does not fit, proposes what moves out of the year rather than cramming, notes the strategy is too vague to choose themes and asks for measurable goals."}
  - name: negative-wants-dated-features-all-year
    vars:
      strategy: "Grow self-serve signups."
      candidates: "Give me exact ship dates for every feature through December, the board wants certainty. Features: referral program, new pricing page, template gallery, Slack integration."
      capacity: "One team of six, 20% reserve."
    assert:
      - {type: llm-rubric, value: "Pushes back on exact December dates for unsized work, explains why later quarters carry lower confidence, offers dated near-term items and themes or ranges later, and does not invent sizes or dates."}
