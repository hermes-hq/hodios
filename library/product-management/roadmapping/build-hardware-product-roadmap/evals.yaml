schema: 1
baseline: "Make a roadmap for my hardware product. Product: {{product_and_stage}} Launch: {{target_launch}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-smart-thermostat-holiday
    vars:
      product_and_stage: "Smart radiator thermostat with Wi-Fi and a small e-ink display, battery powered (2x AA). We have 15 works-like prototypes from 3D prints and dev boards. Custom PCB layout started. App exists in beta."
      target_launch: "On shelves at two UK and German electronics retailers for the heating season, so in stores by early October 2027."
      constraints: "Contract manufacturer in Shenzhen quoted 8-10 weeks for injection moulds. Wi-Fi module lead time 20 weeks. Retail buyers want final packaging and samples by March 2027. Team of 6."
    assert:
      - {type: contains, value: "## Latest safe dates"}
      - {type: llm-rubric, value: "Works backwards from an early-October in-store date including sea freight and retailer distribution time, uses the user's 8-10 week tooling and 20-week module lead times, gives a latest safe date for ordering the Wi-Fi module and kicking off tooling, places radio and safety certification for UK and EU on DVT units as items to confirm with a lab, treats the March packaging and sample deadline as a fixed constraint, and includes a firmware freeze date and post-launch update plan."}
  - name: edge-date-not-reachable
    vars:
      product_and_stage: "Concept only: a rechargeable bike light with a USB-C port and app-controlled patterns over Bluetooth. No prototype yet."
      target_launch: "Ship to Kickstarter backers in 4 months."
    assert:
      - {type: llm-rubric, value: "States plainly that shipping in 4 months from concept is not realistic with custom tooling, battery transport testing and radio certification, shows an earliest realistic range with the arithmetic, and lists concrete ways to pull it in (off-the-shelf module, fewer markets, simpler enclosure) without inventing supplier quotes."}
  - name: negative-missing-stage-and-markets
    vars:
      product_and_stage: "A new gadget."
      target_launch: "Next year."
    assert:
      - {type: llm-rubric, value: "Asks for the product's technology, current stage, target markets and what launch means before building a dated plan, and does not invent a detailed schedule, lead times or certifications as fact."}
