schema: 1
baseline: "Create a user story map for this: {{product_scope}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-clinic-booking
    vars:
      product_scope: "Online appointment booking for small physiotherapy clinics (1-5 therapists). Today patients phone the front desk. In scope: patients find a slot, book, get reminders, reschedule or cancel; clinic staff manage availability. Out of scope: payments and insurance. Launch target: 3 months, team of 3 engineers and a designer."
      users: "Patients booking appointments; clinic receptionists"
    assert:
      - {type: contains, value: "## Walking skeleton"}
      - {type: llm-rubric, value: "Builds a left-to-right backbone of user activities (for example find a therapist or slot, book, prepare and attend, change booking) with verb-phrase tasks, covers both patient and receptionist journeys, defines a thin end-to-end walking skeleton (possibly with manual steps marked), gives two to four slices each with an outcome and metric and what is left out, keeps payments and insurance out of slices, and lists open questions."}
  - name: edge-system-components-input
    vars:
      product_scope: "Our backlog epics are: Database migration, Admin panel, API v2, Notifications service, React frontend. Make a story map for our new expense approval feature."
      users: ""
    assert:
      - {type: llm-rubric, value: "Reframes the map around what users do (submit an expense, review and approve, get reimbursed) rather than using the technical epics as activities, places the epics' work under user tasks where relevant, and asks or assumes clearly who the users are."}
  - name: negative-no-user
    vars:
      product_scope: "A platform."
      users: ""
    assert:
      - {type: llm-rubric, value: "Asks who the users are and what they are trying to get done, and stops without inventing a story map."}
