schema: 1
baseline: "Make a yearly product calendar for my seasonal products. {{products_and_seasons}} {{channels_and_lead_times}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-candles-christmas-and-spring
    vars:
      products_and_seasons: "Scented candles and diffusers. Christmas gift sets are 55% of our year; a smaller spring range for Mother's Day (UK, March). Last Christmas we sold out of two gift sets by 20 November."
      channels_and_lead_times: "Own website, 40 independent gift shops wholesale, and a department store trial this year. Independents order at the January and August trade fairs. Department store buyer wants samples by end of February for Christmas. Glass jars from overseas: 10 weeks plus 6 weeks shipping. Pouring and packing: 4 weeks per 5,000 units."
      region: "UK"
    assert:
      - {type: contains, value: "## Backward schedule"}
      - {type: llm-rubric, value: "Works back from Christmas wholesale and web windows to the February department store sample deadline and August trade fair, computes a jar order date from the 10 plus 6 week lead time plus pouring time and buffer, marks jar orders and packaging as irreversible, shows overlap months on a 12-month calendar, treats the November sell-out as a reason to plan more stock or earlier reorder, and does not invent retailer names or deadlines."}
  - name: edge-southern-hemisphere-garden
    vars:
      products_and_seasons: "Seed starter kits and raised garden beds for the spring planting season."
      channels_and_lead_times: "Online and two hardware chains. Beds made locally in 3 weeks; kits assembled from imported trays (12 weeks)."
      region: "Australia"
    assert:
      - {type: llm-rubric, value: "Places the spring selling window around September to November for the Southern Hemisphere, works back from there, and labels missing buyer deadlines as typical ranges to confirm with the chains."}
  - name: negative-no-channels
    vars:
      products_and_seasons: "Some seasonal stuff."
      channels_and_lead_times: "Not sure yet."
    assert:
      - {type: llm-rubric, value: "Asks which products, seasons and channels and what lead times are known, and does not invent a dated calendar or supplier lead times as fact."}
