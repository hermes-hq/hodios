schema: 1
baseline: "Make a roadmap for these: {{ideas}} Team: {{team}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-backlog
    vars:
      ideas: "1) Bulk invoice export - 40 customers asked, clear spec. 2) AI expense categorisation - exciting, unclear if accuracy is good enough. 3) Marketplace for accountants - CEO idea, no customer evidence. 4) VAT rule update - legally required."
      team: "1 PM, 1 designer, 5 engineers, next quarter."
    assert:
      - {type: contains, value: "## Discovery track"}
      - {type: llm-rubric, value: "Puts bulk export in delivery, AI categorisation in discovery with feasibility or accuracy as the riskiest assumption, the marketplace in discovery with value as the risk, and the VAT update in delivery as a commitment; gives learning goals as questions with small methods and time boxes, gives engineers some discovery time, and states an evidence bar and kill rule per discovery item."}
  - name: edge-no-researcher
    vars:
      ideas: "Six ideas, none with evidence."
      team: "Two engineers and a founder who acts as PM, no designer."
    assert:
      - {type: llm-rubric, value: "Adapts discovery to a tiny team with very cheap methods the founder and engineers can run, avoids putting all six in delivery, and limits discovery to the riskiest few at a time."}
  - name: negative-skip-discovery
    vars:
      ideas: "Ten untested ideas from the leadership offsite."
      team: "Put all ten straight on the delivery roadmap with dates. We don't do research here, it slows us down."
    assert:
      - {type: llm-rubric, value: "Respectfully pushes back on committing ten untested ideas with dates, explains the cost of building the wrong thing, and offers a lightweight time-boxed way to test the riskiest ideas while delivery continues."}
