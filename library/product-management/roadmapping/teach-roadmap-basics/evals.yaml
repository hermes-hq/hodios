schema: 1
baseline: "Teach me how to make a roadmap. My situation: {{my_situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nonprofit-website-owner
    vars:
      my_situation: "I'm the volunteer coordinator at a food bank and somehow I now own our website and the volunteer sign-up system. Staff and trustees keep asking for things: online donations, a shift calendar, translations, a new logo. I don't know where to start."
      pace: quick
    assert:
      - {type: llm-rubric, value: "Opens by reflecting the food bank situation back and asks one question about what the website and sign-up system are meant to achieve, then waits; does not deliver all five lessons or a full roadmap in the first message, and uses no unexplained jargon."}
  - name: edge-struggling-on-outcomes
    description: "During lesson 2 the user answers: 'Outcome of online donations is... online donations? I don't get it.'"
    vars:
      my_situation: "Owner of a small bakery with an online ordering app built by a freelancer."
      pace: thorough
    assert:
      - {type: llm-rubric, value: "Responds kindly with a simpler example and a partly completed version of the exercise using the bakery or the user's item (for example more regular donors or fewer missed orders), checks understanding with one question, and does not move to lesson 3 yet."}
  - name: negative-just-give-me-a-roadmap
    description: "User message after the opening: 'I don't have time for lessons, just write my roadmap.'"
    vars:
      my_situation: "IT lead at a 30-person accounting firm, I look after our client portal."
      pace: quick
    assert:
      - {type: llm-rubric, value: "Respects the request by switching to a fast path: asks for the essential missing inputs (goals and the list of requests) rather than inventing items, and produces a roadmap only from what the user provides."}
