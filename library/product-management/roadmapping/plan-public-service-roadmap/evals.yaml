schema: 1
baseline: "Plan a roadmap for this public service. {{service_and_goals}} Dates: {{fixed_dates_and_constraints}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-council-parking-permits
    vars:
      service_and_goals: "District council residents' parking permit service. Today: paper forms and a 2004 back-office system. Goals: cut processing time from 10 days to 2, let residents apply and renew online, keep a phone and counter route, reduce staff time so the team of 5 can absorb new zones."
      fixed_dates_and_constraints: "Back-office supplier contract ends 31 March 2027, 6-month notice needed to exit. New zones come into force 1 July 2027 under a traffic order already approved. Digital capital grant of 120k must be spent by 31 March 2027. Cabinet meets every 6 weeks, papers 3 weeks before. Local elections early May 2027."
    assert:
      - {type: contains, value: "## Date register"}
      - {type: llm-rubric, value: "Classifies the contract end and notice as contractual, the July zones as statutory or policy, the grant spend-by as funding, cabinet as governance and the May elections as political; notes the 6-month notice means exit notice by 30 September 2026 or earlier and that, if that date has passed or is close, options such as an extension or contract variation are needed, works back from each fixed date including procurement and cabinet paper deadlines labelled as assumptions to confirm, keeps the phone and counter route in scope, and names the risk of the grant deadline colliding with the contract exit."}
  - name: edge-charity-funding-cliff
    vars:
      service_and_goals: "A charity's online advice chat for tenants. Volunteers answer; demand is 3x capacity. Want triage, a knowledge base and better volunteer rota tools."
      fixed_dates_and_constraints: "Main grant ends December; renewal bid due in September needs evidence of impact. Trustees meet quarterly. Everything else flexible."
    assert:
      - {type: llm-rubric, value: "Treats the September bid deadline as the real driver, puts collecting impact evidence before it in the roadmap, aligns decisions to the quarterly trustee meetings, and flags the funding cliff as a risk with options rather than hiding it."}
  - name: negative-no-dates
    vars:
      service_and_goals: "Improve our housing repairs service."
      fixed_dates_and_constraints: "Not sure."
    assert:
      - {type: llm-rubric, value: "Asks which dates and constraints apply (contracts, funding, policy, governance cycles) and does not invent legislation, contract dates or committee schedules."}
