schema: 1
baseline: "Plan our {{period}} roadmap given we're hiring. Team: {{team_and_hiring}} Roadmap: {{roadmap}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-doubling-team
    vars:
      team_and_hiring: "4 engineers today. Hiring 4 more: two to start in month 1, two in month 3. Hiring usually takes us 3 months from opening a role. New engineers take about 3 months to be fully productive."
      roadmap: "Payments rebuild 30 person-weeks (needs deep domain knowledge, partner deadline end of month 4); reporting 20 person-weeks; mobile polish 15 person-weeks; admin tools 15 person-weeks."
      period: half
    assert:
      - {type: contains, value: "## Capacity by month"}
      - {type: llm-rubric, value: "Questions whether month-1 starts are realistic given a 3-month hiring time, applies a ramp curve and interviewing and onboarding drag on the existing four, shows month-by-month arithmetic and contrasts it with the naive 8-heads figure, concludes total demand of 80 person-weeks is at risk, keeps the payments rebuild with the existing team before its month-4 deadline, puts admin tools or mobile polish later for new hires, and recomputes with a two-month slip."}
  - name: edge-user-ramp-data
    vars:
      team_and_hiring: "10 people, 2 hires starting next month; our data says new hires reach full speed in 6 weeks because our stack is simple."
      roadmap: "Three items, 40 person-weeks total."
      period: quarter
    assert:
      - {type: llm-rubric, value: "Uses the user's 6-week ramp rather than the default, labels it as given, and still accounts for some onboarding drag on existing staff."}
  - name: negative-counting-heads
    vars:
      team_and_hiring: "We'll have 20 engineers by next month, I need the plan to show we can do everything."
      roadmap: "Everything on the list."
      period: year
    assert:
      - {type: llm-rubric, value: "Does not produce a plan that shows everything fits, asks for current team size, hiring status and item sizes, and explains why capacity must be ramped rather than counted on start date."}
