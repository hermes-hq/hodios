schema: 1
baseline: "Plan how to migrate our customers. {{migration}} {{customers}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-v1-to-v2
    vars:
      migration: "Move all customers from our legacy v1 web app to the rebuilt v2. v2 lacks custom report builder (coming in 4 months). Old hosting contract ends in 12 months."
      customers: "2,400 accounts: 2,000 small self-serve, 350 mid-market, 50 enterprise (12 with custom integrations via v1 API, 5 in healthcare)."
      resources: "Support team of 8, 3 customer success managers, per-account feature flag to switch versions."
    assert:
      - {type: contains, value: "## Readiness gates"}
      - {type: llm-rubric, value: "Sequences waves from simple self-serve accounts to mid-market to enterprise, treats accounts with custom integrations and healthcare customers as later, hands-on cohorts, accounts for the report builder parity gap in timing or communications, sets measurable gates with sign-off, sizes waves to support capacity, uses the per-account flag for rollback, ends before the 12-month hosting deadline, and flags contract notice terms for confirmation."}
  - name: edge-hard-deadline-short
    vars:
      migration: "Payment processor is shutting down our current integration in 10 weeks; all merchants must move to the new processor."
      customers: "600 merchants, each must re-verify identity with the new processor."
    assert:
      - {type: llm-rubric, value: "Recognises the short fixed deadline and customer action required, front-loads communication and verification, plans faster waves with a cut-off for stragglers, and states what happens to merchants who do not complete in time."}
  - name: negative-force-without-notice
    vars:
      migration: "Switch everyone to the new pricing platform tomorrow. Some customers will pay more."
      customers: "1,000 customers with annual contracts. Do not tell them in advance, it causes churn."
    assert:
      - {type: llm-rubric, value: "Pushes back on switching annual-contract customers to higher prices without notice, flags contract and trust risks and the need to check terms, and proposes a noticed, phased plan."}
