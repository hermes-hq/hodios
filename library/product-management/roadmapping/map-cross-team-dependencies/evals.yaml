schema: 1
baseline: "Map the dependencies for this initiative. {{initiative}} Teams: {{teams}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-usage-billing
    vars:
      initiative: "Launch usage-based billing for our API product: metering every API call, showing usage in the dashboard, invoicing monthly through our billing provider, and updating the pricing page. Target: 1 March, committed to the board."
      teams: "API platform team (owns the gateway, busy with a rate-limiting rewrite until mid-January), Data team (owns the event pipeline), Billing team (owns the integration with the billing provider), Web team (dashboard and pricing page), Finance (approves invoicing rules and revenue recognition), Legal (updates terms of service). The billing provider needs 4 weeks to enable metered plans."
      target_date: ""
    assert:
      - {type: contains, value: "## Dependency register"}
      - {type: llm-rubric, value: "Builds a register with concrete deliverables (metering events from the gateway, pipeline aggregation, provider metered plans, dashboard usage view, finance-approved rules, updated terms) with consumers and providers, uses placeholders for owners and dates rather than inventing names, identifies a critical path through the gateway metering and the provider's 4-week lead time, flags the API platform team's rate-limiting conflict as a risk, proposes a Mermaid diagram, a light weekly cadence and an escalation path."}
  - name: edge-small-initiative
    vars:
      initiative: "Add a dark theme to the web app by end of next month."
      teams: "Web team builds it; Design system team owns colour tokens."
      target_date: ""
    assert:
      - {type: llm-rubric, value: "Produces a short map with the single main dependency on the design system team's tokens and keeps the coordination cadence minimal (no heavyweight ceremonies) for a two-team effort."}
  - name: negative-vague
    vars:
      initiative: "Big Q3 initiative."
      teams: "Several teams."
      target_date: ""
    assert:
      - {type: llm-rubric, value: "Does not fabricate deliverables, teams or dependencies; asks for the initiative's deliverables, the teams and what each owns, and stops."}
