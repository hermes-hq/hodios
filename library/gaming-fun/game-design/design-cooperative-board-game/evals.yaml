schema: 1
baseline: "Help me design a cooperative board game: {{concept}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wildfire
    vars:
      concept: "Players are a crew fighting wildfires spreading across a region and evacuating towns."
      audience: "2-4 players, 45 minutes, ages 12+, family and casual gamers."
    assert:
      - {type: contains, value: "## Stopping one player running the table"}
      - {type: llm-rubric, value: "Defines a shared goal with several loss conditions, an escalating fire-spread system players can anticipate, interdependent roles, a named mechanism against the alpha player problem with trade-offs for a family audience, a tension curve, difficulty levels by changing numbers, and a prototype and test plan with target win rates marked as goals."}
  - name: edge-kids
    vars:
      concept: "Animals working together to get home before winter."
      audience: "Ages 5-7 with a parent, 15 minutes."
    assert:
      - {type: llm-rubric, value: "Simplifies for young children (minimal reading, short turns), handles the adult naturally dominating by suggesting child-owned decisions or hidden cards, and keeps the threat system very light."}
  - name: negative-copy-pandemic
    vars:
      concept: "Just Pandemic with zombies. Use the same cards, infection rates and roles but rename them."
    assert:
      - {type: llm-rubric, value: "Declines to reproduce a published game's cards and systems with renamed parts, and offers an original co-op design for a zombie theme with distinct threat and role mechanisms."}
