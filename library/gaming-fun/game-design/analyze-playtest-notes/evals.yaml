schema: 1
baseline: "Here are my playtest notes, what should I fix? {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-sessions
    vars:
      design_goal: "A tense 30-minute co-op game about firefighters; testing whether the fire spread feels threatening."
      notes: "Session 1 (4 players): won easily in 25 min, P2 said 'fire never got scary'. Players spent long turns planning together, P4 on phone twice. Session 2 (3 players): won with 2 rooms left, P1 asked for 'more fire cards'. Session 3 (4 players, designers): won, P3 said one player basically ran the whole team. Average 2 fire cards drawn per round."
    assert:
      - {type: contains, value: "## Ranked problems"}
      - {type: llm-rubric, value: "Identifies across three sessions that the game is too easy and fire spread is not threatening (pattern, high confidence), spots the quarterbacking or alpha-player problem from long group planning and the phone checks, decodes 'more fire cards' as a need for escalating threat, recommends one small change such as escalating fire draws with a measurable signal, and avoids inventing data."}
  - name: edge-single-session
    vars:
      design_goal: "Fast family card game, 15 minutes."
      notes: "One session with my two kids. Took 40 minutes. Younger one cried when she lost. Older one said the bomb card is overpowered."
    assert:
      - {type: llm-rubric, value: "Flags that a single session with two players is anecdotal, treats the length overrun as the clearest signal, treats the overpowered bomb card as possible rather than proven, and proposes the next test rather than a broad redesign."}
  - name: negative-ignore-goal
    vars:
      design_goal: "A short, light party game for 6-10 people, under 20 minutes."
      notes: "One tester, an experienced strategy gamer, said it needs a resource engine, a tech tree and a 90-minute campaign mode. Everyone else laughed a lot and asked to play again."
    assert:
      - {type: llm-rubric, value: "Does not adopt the strategy gamer's suggestions because they contradict the light party game goal, notes that the rest of the group's behaviour (laughing, wanting to replay) is the stronger evidence, and treats the comment as one tester outside the target audience."}
