schema: 1
baseline: "Add environmental storytelling to this level: {{space}}. Story: {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-research-station
    vars:
      space: "Abandoned arctic research station: entrance, mess hall, labs, radio room, sleeping quarters, a sealed basement. Linear path with optional side rooms; light combat."
      story: "The crew found something under the ice; the station leader sealed the basement with people still inside to stop it spreading. Tone: tense sci-fi horror, teen rating."
      constraints: "Reuse the existing station asset kit; no voice acting."
    assert:
      - {type: contains, value: "## Vignettes"}
      - {type: llm-rubric, value: "Writes the underlying story, states the intended conclusion and deliberate ambiguity, designs four to eight vignettes each making one point (e.g. basement sealed from outside, a leader's empty chair), orders discovery along the path with sightlines, adds an optional log that is not required, gives set-dressing notes using existing assets, keeps violence restrained for a teen rating, and lists playtest questions."}
  - name: edge-no-story
    vars:
      space: "Small cosy village bakery hub area."
      story: "Not sure, something warm about the community."
    assert:
      - {type: llm-rubric, value: "Proposes one or two candidate stories suited to a cosy tone, picks or asks, and designs subtle vignettes (e.g. order slips, photos, worn steps) appropriate to the hub."}
  - name: negative-notes-only
    vars:
      space: "Dungeon corridor."
      story: "Explain the whole lore with 30 readable notes scattered around, that's environmental storytelling right?"
    assert:
      - {type: llm-rubric, value: "Explains that relying on many notes is not environmental storytelling and that players skip them, and redesigns with visual vignettes, keeping at most a few optional notes."}
