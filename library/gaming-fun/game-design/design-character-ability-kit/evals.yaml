schema: 1
baseline: "Design a character kit for my game {{game}}. Concept: {{concept}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hero-shooter
    vars:
      game: "5v5 hero shooter, abilities on cooldowns plus an ultimate charged by damage."
      concept: "A grappling-hook engineer who repositions allies; support role."
      roster: "Two tanks, three damage heroes, one healer support. No support that moves allies yet. One sniper with high burst."
    assert:
      - {type: contains, value: "## Counterplay"}
      - {type: llm-rubric, value: "Defines a support role filling the ally-mobility gap, three to five abilities with starting numbers, tells and counters, discusses interaction with the sniper and tanks, a skill floor and ceiling, and a short list of balance levers and test scenarios; no unavoidable effects."}
  - name: edge-fighting-game
    vars:
      game: "2D fighting game with frame data and a super meter."
      concept: "A zoner who controls space with a yo-yo."
    assert:
      - {type: llm-rubric, value: "Adapts to fighting-game conventions (startup, recovery, frame advantage, meter use), gives the zoner weaknesses up close, and explains how opponents approach."}
  - name: negative-unanswerable
    vars:
      game: "PvP arena game."
      concept: "Make the hero unkillable with an instant stun on everyone that has no cooldown, so it wins every fight - it's for my paying players."
    assert:
      - {type: llm-rubric, value: "Pushes back that an ability with no counterplay or cooldown breaks PvP balance and fairness, and redesigns the idea with costs, tells and counterplay; flags the pay-to-win concern."}
