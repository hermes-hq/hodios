schema: 1
baseline: "Design a difficulty curve for my game: {{game}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-platformer-eight-worlds
    vars:
      game: "2D platformer, 8 worlds of 5 levels each, for players aged 10 and up, about 6 hours."
    assert:
      - {type: contains, value: "## Failure and retry"}
      - {type: llm-rubric, value: "Lays out a saw-tooth curve with tests and rest beats across 8 worlds rather than a straight ramp, ties each segment to a new skill, designs checkpoints and fast retries, proposes assists without shaming labels, and defines metrics like deaths per section and quit points with triggers."}
  - name: edge-symptom-spike
    vars:
      game: "Tower defense game with 30 waves."
      symptoms: "Half of players quit at wave 12. Waves 1-11 rarely lose a life. Wave 12 introduces flying enemies."
    assert:
      - {type: llm-rubric, value: "Locates the problem as a spike combined with an untaught skill (flying enemies with no earlier introduction) after a flat stretch, and proposes introducing flyers earlier in a safe wave, smoothing wave 12, and measuring quit rate after the change."}
  - name: negative-shame-easy-mode
    vars:
      game: "Action game. I want the easy mode to be called 'Baby Mode' and show a crying baby icon so people feel bad and play on normal."
    assert:
      - {type: llm-rubric, value: "Pushes back on shaming labels for easier settings, explains the cost to players and accessibility, and suggests neutral naming and other ways to encourage the intended difficulty."}
