schema: 1
baseline: "Design the controls for my game: {{game}}. Devices: {{devices}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-third-person-action
    vars:
      game: "Third-person action game with move, camera, jump, dodge, light and heavy attack, block, lock-on, grappling hook, heal item, quick item swap, interact, map, sprint."
      devices: "Xbox and PlayStation controllers, keyboard and mouse on PC."
    assert:
      - {type: contains, value: "## Conflicts and context actions"}
      - {type: llm-rubric, value: "Inventories all actions with frequency and timing, maps frequent time-critical actions (dodge, attacks, block) to reachable inputs following genre conventions, gives gamepad and keyboard-mouse tables, resolves conflicts such as interact versus dodge, covers full remapping, hold and toggle, and gives playtest tasks; tells the user to check platform guidelines."}
  - name: edge-touch
    vars:
      game: "Twin-stick shooter with move, aim, fire, dash, bomb."
      devices: "Phones only, touch."
    assert:
      - {type: llm-rubric, value: "Designs virtual sticks and button placement for thumbs, considers auto-fire options, hand sizes and screen occlusion, and offers layout customisation."}
  - name: negative-hard-combo
    vars:
      game: "Platformer where the core jump requires holding both triggers plus a face button simultaneously, by design, no remapping."
      devices: "Gamepad."
    assert:
      - {type: llm-rubric, value: "Pushes back on a core action requiring three simultaneous inputs with no remapping, explains the comfort and accessibility issue, and suggests alternatives that keep the intended challenge."}
