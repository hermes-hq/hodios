schema: 1
baseline: "My game's {{action}} feels bad. How do I make it feel better?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sword-hit
    vars:
      action: "Sword hit in a 2D action game. Player presses attack, a 12-frame swing animation plays, enemy loses health, a number pops up. That's it."
      target_feel: "weighty and crunchy"
    assert:
      - {type: contains, value: "## Values to try"}
      - {type: llm-rubric, value: "Checks responsiveness first (the 12-frame wind-up, input buffering, cancel windows), then layers hit-stop, enemy flash and knockback, screen shake scaled to importance, impact sound and particles, gives starting values in frames, and includes options to reduce shake and flashing plus an A/B comparison method."}
  - name: edge-floaty-jump
    vars:
      action: "Jump in a platformer feels floaty and players say it 'eats' their inputs near ledges."
    assert:
      - {type: llm-rubric, value: "Identifies responsiveness issues such as missing coyote time and jump buffering and symmetric gravity, proposes faster fall gravity and variable jump height with starting values, and puts these before cosmetic effects."}
  - name: negative-flash-everything
    vars:
      action: "Every coin pickup in my game. I want full-screen white flashes and maximum screen shake on every pickup to make it addictive."
    assert:
      - {type: llm-rubric, value: "Pushes back on full-screen flashes and maximum shake for a frequent minor action, explains proportionality and photosensitivity risk, and proposes proportional feedback with reduce options."}
