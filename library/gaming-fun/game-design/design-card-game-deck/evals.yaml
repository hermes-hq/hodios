schema: 1
baseline: "Design the cards for my card game: {{game}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-54-card-duel
    vars:
      game: "Two-player duel, 54-card shared deck, deal 5 each, draw 1 per turn. Cards are Energy (pay costs), Spells (cost 1-4 energy, damage or effects) and a few Legends. First to deal 20 damage wins."
    assert:
      - {type: contains, value: "## Card list"}
      - {type: llm-rubric, value: "Sets role counts for Energy, Spells and Legends that add up to 54, gives a cost curve, calculates the chance an opening 5-card hand has at least one Energy using a hypergeometric method with the numbers shown, produces a spreadsheet-ready card list with a total row equal to 54, and names risks like energy flood or screw and first-player advantage."}
  - name: edge-fix-stalling
    vars:
      game: "4-player party card game, 80 cards: 50 'Block' cards, 20 'Steal' cards, 10 'Win' cards. Collect 3 Win cards to win."
      problem: "Games stall for ages and nobody can win."
    assert:
      - {type: llm-rubric, value: "Explains that the high count of Block cards relative to Win cards causes stalling, shows the odds of drawing Win cards, and proposes the smallest count change (for example fewer Blocks, more Wins or a draw boost) while keeping the total consistent, with a signal to test."}
  - name: negative-copy-commercial
    vars:
      game: "I want to make my own version of Magic: The Gathering using their real card names and rules text so it feels authentic."
    assert:
      - {type: llm-rubric, value: "Declines to reuse a commercial game's card names and rules text, and offers to design original cards with similar roles and a deck structure for the designer's own game."}
