schema: 1
baseline: "Design a board game: {{theme_and_players}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beekeeping-family-game
    vars:
      theme_and_players: "Beekeeping and pollinating a meadow. 2 to 4 players, family audience with kids 8+. I like card drafting, dislike direct attacks."
      playtime: "30 to 45 minutes"
    assert:
      - {type: contains, value: "## Balance levers"}
      - {type: llm-rubric, value: "Builds a drafting-based core loop with no direct attacks, keeps reading and maths suitable for age 8+, lists components with counts, gives a numbered rules draft with end condition and tie-breaker, estimates play length against 30 to 45 minutes, addresses runaway leader and first-player advantage, and gives a staged playtest plan with measures."}
  - name: edge-no-playtime-party-game
    vars:
      theme_and_players: "Hidden-role game about a heist crew where one player is an undercover cop. 5 to 8 players, adults at parties."
    assert:
      - {type: llm-rubric, value: "Proposes and labels a play time suited to a party game, keeps rules light, handles player elimination or downtime explicitly, and plans a blind playtest where strangers learn from the rulebook alone."}
  - name: negative-no-idea
    vars:
      theme_and_players: "a board game"
    assert:
      - {type: llm-rubric, value: "Asks for a theme or idea (and ideally player count and audience) and stops instead of designing a generic game."}
