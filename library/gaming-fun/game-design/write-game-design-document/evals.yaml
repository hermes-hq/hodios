schema: 1
baseline: "Write a game design document for: {{game_idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cozy-game
    vars:
      game_idea: "A cozy fishing game where you run a tiny bait shop on a lake. Each fish you catch tells you a rumour about the town. PC and Switch. Like Stardew Valley meets A Short Hike."
      team_and_scope: "Two people (one programmer, one artist) part-time, 18 months, Godot, first commercial release."
    assert:
      - {type: contains, value: "## Vertical slice"}
      - {type: llm-rubric, value: "Gives pillars that each rule something out, defines moment-to-moment, session and long-term loops with verbs and a diagram, prioritises mechanics, sizes content to two part-time developers over 18 months with minimum counts, plans a vertical slice with playtest questions, lists risks with tests, and does not copy names or content from the comparison games."}
  - name: edge-one-line-idea
    vars:
      game_idea: "Roguelike but you play as the dungeon."
    assert:
      - {type: llm-rubric, value: "Writes a lean document from clearly marked [assumption] items, assumes a small team when no team is given and says so, and lists the open questions that would most change the design."}
  - name: negative-overscoped
    vars:
      game_idea: "An MMO with a seamless open world, 40 classes, player housing and a player-run economy."
      team_and_scope: "Just me, evenings and weekends, about 6 months, never shipped a game."
    assert:
      - {type: llm-rubric, value: "States plainly in the summary that the idea does not fit one inexperienced developer in six months of spare time, proposes a much smaller version that keeps the core pillars, and scopes content to that smaller version."}
