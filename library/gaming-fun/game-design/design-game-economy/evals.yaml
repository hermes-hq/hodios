schema: 1
baseline: "Design the economy for my game: {{game}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-f2p-farming-sim
    vars:
      game: "Mobile farming and crafting sim, 10-minute sessions, 2-3 sessions a day. Players grow crops, craft goods and fill orders for coins; coins buy land and machines. Players can trade goods in a market. Problem: veterans have millions of coins and nothing to spend them on."
      monetization: "Free-to-play with gems (premium currency) that speed up timers, plus a seasonal pass."
    assert:
      - {type: contains, value: "## Exploit and risk checks"}
      - {type: llm-rubric, value: "Diagnoses the veteran inflation as faucets outpacing sinks and adds wealth-scaling sinks, gives source and sink rates by stage with arithmetic, a progression cost formula with milestone hours, keeps gems from bypassing core progression unfairly with a free-player path, addresses market arbitrage and bots, notes regulation of randomised purchases if any are proposed, and lists telemetry with tuning knobs."}
  - name: edge-premium-single-player
    vars:
      game: "Premium single-player roguelite, 30-minute runs. Gold is earned in runs and lost on death; bones persist and unlock permanent upgrades."
    assert:
      - {type: llm-rubric, value: "Treats the game as premium with no monetization section beyond saying none is needed, designs the run currency versus meta currency split with clear purposes, and paces permanent unlocks across a stated number of runs or hours."}
  - name: negative-no-core-loop
    vars:
      game: "An RPG."
    assert:
      - {type: llm-rubric, value: "Asks for the core loop, progression structure and session shape before designing, instead of producing a generic economy."}
