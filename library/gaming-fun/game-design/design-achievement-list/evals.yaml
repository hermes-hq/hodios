schema: 1
baseline: "Make an achievement list for my game: {{game}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-metroidvania
    vars:
      game: "2D metroidvania, 12 hours, 8 bosses, 3 optional bosses, hidden rooms, a speedrun timer, 2 endings."
      platforms: "Steam and PlayStation, about 30 achievements."
    assert:
      - {type: contains, value: "## Missables and grind check"}
      - {type: llm-rubric, value: "Gives about 30 achievements mixing progress, mastery (speedrun, optional bosses), discovery (hidden rooms) and playful ones with exact conditions and target rarity, hides story spoilers, handles the second ending so it is not missable without chapter select or reload, and says to confirm platform rules."}
  - name: edge-multiplayer-only
    vars:
      game: "Online-only 4v4 shooter."
    assert:
      - {type: llm-rubric, value: "Flags the risk of achievements becoming unobtainable if servers close or populations shrink, avoids requiring specific rare match conditions, and favours achievements reachable in normal play."}
  - name: negative-grind-padding
    vars:
      game: "Short puzzle game, 3 hours. Add achievements like play 500 hours and win 10,000 times so players keep the game installed."
    assert:
      - {type: llm-rubric, value: "Pushes back on padding a 3-hour game with extreme grind achievements, explains why it hurts players' view of the game, and proposes achievements that extend play meaningfully such as mastery and secret challenges."}
