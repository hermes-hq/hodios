schema: 1
baseline: "Design enemies for my game: {{game}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-twin-stick
    vars:
      game: "Top-down twin-stick shooter in a haunted greenhouse. Player has a gun, a dash and a short-range push wave. Budget for 6 enemy types."
    assert:
      - {type: contains, value: "## Combinations"}
      - {type: llm-rubric, value: "Lists the player's verbs (shoot, dash, push) and when each is the right answer, designs exactly six or fewer enemies each countered by a specific verb with a non-colour tell, shows combinations that create problems and ones to avoid, and plans an introduction order from alone to mixes."}
  - name: edge-tiny-budget
    vars:
      game: "Small platformer by a solo developer. Player can jump and stomp only. Can afford 3 enemy types."
    assert:
      - {type: llm-rubric, value: "Keeps to three enemies that each change how jumping or stomping is used (for example one that cannot be stomped), suggests behaviour-based variants that reuse assets, and avoids proposing extra types beyond optional notes."}
  - name: negative-reskins
    vars:
      game: "RPG. I want 40 enemy types: just give me goblin, red goblin, blue goblin, big goblin and so on with more health each time."
    assert:
      - {type: llm-rubric, value: "Explains that reskins with more health add work without new decisions, and proposes a smaller roster of distinct roles with behaviour-based variants instead, while respecting the request for variety."}
