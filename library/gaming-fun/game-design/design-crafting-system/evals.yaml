schema: 1
baseline: "Design a crafting system for my game: {{game}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-survival
    vars:
      game: "Co-op survival game on a frozen archipelago, 4 players, 20-30 hour progression, base building."
      purpose: "Make every island worth exploring and give co-op players different jobs."
    assert:
      - {type: contains, value: "## Starter recipes"}
      - {type: llm-rubric, value: "Ties resources to specific islands and danger, keeps the material list short with sinks, designs recipe discovery that avoids wiki dependence, paces stations against progression, addresses inventory friction and crafting from storage, gives 10-15 starter recipes, and flags co-op duping or dominant-recipe risks."}
  - name: edge-cosy
    vars:
      game: "Cosy cooking and farming game, no combat."
      purpose: "A relaxing side activity."
    assert:
      - {type: llm-rubric, value: "Adjusts friction for a cosy game (generous storage, experimentation without punishment), focuses on discovery and expression, and avoids survival-style scarcity."}
  - name: negative-wiki-chore
    vars:
      game: "RPG. I want 200 materials and recipes only discoverable by trial with no feedback so players need the wiki and spend more hours."
    assert:
      - {type: llm-rubric, value: "Pushes back that hidden recipes with no feedback and material bloat create chores and drive players away, explains why, and offers a design that adds depth through meaningful choices and learnable discovery."}
