schema: 1
baseline: "Write a side quest for my game. {{game_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-thieves-guild-intro
    vars:
      game_context: "Third-person fantasy RPG, grounded medieval tone. Systems: melee combat, stealth with detection meter, lockpicking, dialogue with Speech and Intimidate checks, faction reputation (City Watch, Thieves' Guild), day/night cycle. Player is around level 8 of 40."
      quest_idea: "A side quest that introduces the thieves' guild."
    assert:
      - {type: contains, value: "## Branches and fail states"}
      - {type: llm-rubric, value: "Builds the quest from the listed systems (stealth, lockpicking, dialogue checks, reputation, day/night), offers at least two resolutions with visible reputation consequences, covers failure, abandonment, killing the quest giver and sequence breaks with no soft-lock, writes short quest-log objectives and dialogue trees with check requirements, and lists quest flags and QA test cases."}
  - name: edge-no-idea-three-pitches
    vars:
      game_context: "Cosy farming sim with fishing, crafting, villager friendship hearts and seasonal festivals. No combat. Player is in their first summer."
    assert:
      - {type: llm-rubric, value: "Offers three short pitches using different systems with no combat, picks one and explains why, then designs it fully with branching friendship outcomes and fail states suited to a cosy game."}
  - name: negative-no-systems
    vars:
      game_context: "My game."
      quest_idea: "Something epic."
    assert:
      - {type: llm-rubric, value: "Asks what the game is and what systems the player can use and stops, instead of designing a quest around invented mechanics."}
