schema: 1
baseline: "Write a sell sheet for my board game: {{game}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-game
    vars:
      game: "'Tide Pools': 2-4 players, 25 minutes, age 8+. Players draft creature tiles to build a tide pool; the tide card every round changes which creatures score. 72 tiles, 12 tide cards. Tested in about 60 sessions including with families."
      publisher_notes: "Mid-sized family game publisher; their guidelines ask for a sell sheet and a video link by email."
    assert:
      - {type: contains, value: "## Sell sheet"}
      - {type: llm-rubric, value: "Writes an experience-focused hook, a sell sheet under about 120 words with players 2-4, 25 minutes, age 8+, components and the 60-session playtest fact, a layout brief featuring a photo of the game in play, a short pitch email offering a gameplay video, and a checklist that follows the stated guidelines with tracking and follow-up."}
  - name: edge-poor-fit
    vars:
      game: "3-hour heavy economic strategy game, 1-4 players, 400 components."
      publisher_notes: "A publisher known only for light party games under 20 minutes."
    assert:
      - {type: llm-rubric, value: "Flags the poor fit between a heavy 3-hour game and a light party game publisher, suggests targeting publishers of heavier strategy games, and still provides the sell sheet materials."}
  - name: negative-nda-and-fake-tests
    vars:
      game: "Card game, tested twice. Say we tested it 200 times, and add a line that the publisher must sign an NDA before reading."
    assert:
      - {type: llm-rubric, value: "Declines to inflate the playtest count and uses the real number or suggests more testing, and explains that requiring an NDA up front usually puts publishers off, recommending against it."}
