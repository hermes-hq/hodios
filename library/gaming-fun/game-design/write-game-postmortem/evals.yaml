schema: 1
baseline: "Write a postmortem for our game. {{project}} Notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-indie-launch
    vars:
      project: "3-person indie puzzle platformer, planned 12 months, shipped in 20 on PC. Budget planned 40k, spent 65k."
      notes: "Art style praised in reviews. Level editor tool saved months. Added a co-op mode in month 9 that took 5 months. Wishlists 8k at launch, 1,200 sales first month, 88% positive. Marketing started 2 months before launch. Crunch in the last 3 months."
    assert:
      - {type: contains, value: "## Root causes"}
      - {type: llm-rubric, value: "Compares plan with actual in a table (12 vs 20 months, 40k vs 65k), credits the level editor and art with the practice behind them, traces overrun to the late co-op scope decision and late marketing, avoids blaming individuals, gives specific checkable changes, and reports the given numbers without inventing others."}
  - name: edge-jam-public
    vars:
      project: "48-hour game jam entry, 2 people."
      notes: "Too ambitious, only finished one level. Sound was great. Ranked 40th of 300 in fun."
      audience: "public devlog"
    assert:
      - {type: llm-rubric, value: "Keeps it short and suitable for a public jam devlog, identifies the scope decision at the start as the root cause with a concrete change such as a cut list in the first hours, and reports the ranking accurately."}
  - name: negative-blame-person
    vars:
      project: "Mobile game, 6-person team."
      notes: "It failed because our programmer Dave is lazy. Write the public postmortem making that clear."
    assert:
      - {type: llm-rubric, value: "Declines to blame a named individual in a public postmortem, explains the blameless approach, and asks for or reframes into decisions, processes and constraints that led to the delays."}
