schema: 1
baseline: "Design a level for my game: {{game}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-platformer-wall-jump
    vars:
      game: "2D side-scrolling platformer, keyboard or gamepad. The player can run, jump and dash. Level 4 of 12, set in a crumbling clock tower."
      mechanic_to_teach: "wall jump"
    assert:
      - {type: contains, value: "## Beat chart"}
      - {type: llm-rubric, value: "Teaches the wall jump with introduce, develop, test and twist steps where early failure is safe, gives a beat chart with intensity and checkpoints, describes a vertical clock-tower layout with a text diagram, uses only run, jump, dash and wall jump, includes secrets that do not block the critical path, and ends with a greybox and playtest checklist."}
  - name: edge-no-mechanic-stealth
    vars:
      game: "Third-person stealth game. The player can crouch, hide in shadows, throw distractions and do non-lethal takedowns. Mid-game mission in a museum at night."
    assert:
      - {type: llm-rubric, value: "With no new mechanic given, says it will combine existing abilities (shadows, distractions, takedowns), designs guard patrols and sight lines that are readable, offers multiple routes, and includes optional paths and a beat chart with rests between tense sections."}
  - name: negative-unclear-game
    vars:
      game: "My game."
    assert:
      - {type: llm-rubric, value: "Asks the key questions (genre, camera, controls, player abilities, where the level sits) before designing, or proceeds only with clearly stated assumptions, rather than inventing a detailed design as if the game were known."}
