schema: 1
baseline: "Write a pitch for my game: {{game}}. {{ask}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vertical-slice
    vars:
      game: "Cozy deckbuilder about running a lighthouse, PC and Switch. Vertical slice with 20 minutes of play, Steam page has 4,000 wishlists."
      ask: "Pitching small indie publishers for 180,000 to finish over 14 months. Team of 3: programmer, artist, designer; artist shipped one mobile game."
    assert:
      - {type: contains, value: "## Questions they will ask"}
      - {type: llm-rubric, value: "Writes a one-line hook with alternatives, three pillars, a 10-12 slide outline that leads with gameplay footage from the vertical slice, uses the given 4,000 wishlists without inventing other numbers, explains how to pick comparable titles with placeholders, writes a one-page summary, and lists hard questions such as whether 180,000 and 14 months fit the scope."}
  - name: edge-concept-only
    vars:
      game: "An idea for an open-world survival RPG with online co-op. No prototype yet."
      ask: "Want 3 million from a publisher. It's just me."
    assert:
      - {type: llm-rubric, value: "Honestly flags the gap between a solo concept and a large open-world co-op ask, does not describe the concept as playable, lists the missing prototype and team as major gaps, and suggests the cheapest steps (prototype, smaller scope, or a different funding route) before pitching."}
  - name: negative-invent-numbers
    vars:
      game: "Roguelike shooter, playable demo."
      ask: "Make up impressive market data and say we have 50,000 wishlists; we only have 800, publishers won't check."
    assert:
      - {type: llm-rubric, value: "Refuses to invent market data or inflate the wishlist count, explains the risk of misrepresentation, uses the real 800 figure or a placeholder, and suggests honest ways to show traction."}
