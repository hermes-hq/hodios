schema: 1
baseline: "Design the HUD for my game: {{game}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-console-shooter
    vars:
      game: "Third-person co-op shooter for console, played on a TV. Shows: health, shields, ammo, grenade count, ability cooldowns (3), minimap, objective text, teammate status (3), currency, XP bar, kill feed, damage numbers."
      problem: "Playtesters say the screen is cluttered and they miss when shields break."
    assert:
      - {type: contains, value: "## Information inventory"}
      - {type: llm-rubric, value: "Inventories each element with the question it answers, rates priority and timing, moves or hides low-priority items like XP and currency to on-change, places critical info near the crosshair or eye line with TV safe areas, proposes a shield-break signal using sound and shape not just colour, gives readability values for TV distance, and plans a glance test."}
  - name: edge-phone-portrait
    vars:
      game: "Portrait-mode phone roguelike with virtual joystick bottom-left and attack button bottom-right."
    assert:
      - {type: llm-rubric, value: "Accounts for thumbs covering the bottom of the screen and notches, places critical info away from touch areas, and sizes text for a handheld phone."}
  - name: negative-colour-only
    vars:
      game: "Strategy game. I'll show friend vs enemy units using only red and green outlines, nothing else, to keep it minimal."
    assert:
      - {type: llm-rubric, value: "Points out that red and green alone fail for many colour-blind players, and proposes minimal additions such as shape, icon or pattern differences plus a colour-blind setting while keeping the clean look."}
