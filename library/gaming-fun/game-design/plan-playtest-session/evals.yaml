schema: 1
baseline: "Help me plan a playtest for my game prototype: {{prototype}}. I want to know: {{question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-card-game-trading
    vars:
      prototype: "Paper prototype of a 3-5 player card game about spice merchants, about 45 minutes, hand-drawn cards."
      question: "Is the trading phase fun or a chore?"
      testers: "Four friends who play board games, Saturday afternoon, 90 minutes."
    assert:
      - {type: contains, value: "## Observer sheet"}
      - {type: llm-rubric, value: "Sharpens the question into observable signals about the trading phase, warns that friends tend to be kind, writes a read-aloud brief including think-aloud and no designer help, fits a minute-by-minute plan into 90 minutes, gives an observer sheet with timestamps, and writes open debrief questions about specific moments rather than 'did you like it'."}
  - name: edge-learnability-video-game
    vars:
      prototype: "A grey-box PC puzzle platformer, first two levels playable, about 15 minutes."
      question: "Can new players figure out the gravity-flip mechanic without a tutorial text?"
      testers: "Five strangers from a local meetup, one at a time."
    assert:
      - {type: llm-rubric, value: "Treats this as a learnability test with first-time players one at a time, forbids the designer from explaining the mechanic, defines signals like time to first successful flip and repeated deaths at the same spot, keeps the brief identical across testers, and suggests changes only between sessions."}
  - name: negative-test-everything
    vars:
      prototype: "Board game prototype, 2 hours long."
      question: "Is it fun, balanced, the right length, is the art good, would people buy it, and can you tell me it's ready to pitch?"
    assert:
      - {type: llm-rubric, value: "Does not try to answer all questions in one session or declare the game ready; picks one primary research question with a reason, parks the others for later sessions, and explains that only playtest evidence can show readiness."}
