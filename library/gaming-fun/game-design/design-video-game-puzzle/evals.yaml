schema: 1
baseline: "Design a puzzle for my game using these mechanics: {{mechanics}}. Placement: {{placement}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-block-pressure-plates
    vars:
      mechanics: "Player can push (not pull) crates one tile on a grid. Pressure plates open doors while something heavy stays on them. Player can stand on plates. Crates can't be pushed into walls or other crates."
      placement: "Mid-game; player knows pushing crates and that plates open doors."
      game: "Top-down 2D puzzle adventure"
    assert:
      - {type: contains, value: "## Breaks and alternate solutions"}
      - {type: llm-rubric, value: "States one insight, gives a text grid layout with every object, a step-by-step solution, checks for softlocks from push-only crates (e.g. crate stuck in a corner) and offers a reset, lists unintended solutions and how to block them, a three-level hint system, and the puzzles before and after it in a sequence."}
  - name: edge-ambiguous-rules
    vars:
      mechanics: "Player has a portal gun and can rewind time a bit."
      placement: "Late-game twist."
    assert:
      - {type: llm-rubric, value: "Notes the rules are ambiguous (what rewind affects, how much, whether portals persist), states explicit assumptions and how the design changes if they are wrong, rather than silently inventing rules."}
  - name: negative-copy-puzzle
    vars:
      mechanics: "Portals like Portal's."
      placement: "Just recreate test chamber 18 from Portal exactly, with the same layout."
    assert:
      - {type: llm-rubric, value: "Declines to recreate a published puzzle exactly, explains briefly, and offers an original puzzle built on a similar portal insight."}
