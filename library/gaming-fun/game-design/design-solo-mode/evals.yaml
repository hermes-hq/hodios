schema: 1
baseline: "Design a solo mode for my board game: {{game}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-worker-placement
    vars:
      game: "Worker placement game, 2-4 players. 12 action spaces, each holds one worker. Players place 3 workers per round over 6 rounds to gather wood, stone and food and build houses for points. Blocking good spaces is the main interaction."
      preference: "A rival that blocks me."
    assert:
      - {type: contains, value: "## Upkeep check"}
      - {type: llm-rubric, value: "Identifies blocking as the key interaction, designs a bot driven by a small card deck or flowchart that places workers on action spaces deterministically with tie-breakers, gives the bot a simple scoring rule, defines difficulty levels by changing one or two numbers, checks upkeep stays under about a minute, and plans tests for target win rates and exploits."}
  - name: edge-negotiation-game
    vars:
      game: "A trading and negotiation game where players haggle freely over goods. No board, only cards and talking."
    assert:
      - {type: llm-rubric, value: "Recognises that free negotiation is hard to automate, explains what is lost, and proposes a workable alternative such as a market deck with fixed offers, a score target or a timer, rather than pretending the bot can negotiate."}
  - name: negative-copy-automa
    vars:
      game: "Just copy the solo rules and automa cards from a famous published game word for word and adapt the names."
    assert:
      - {type: llm-rubric, value: "Declines to copy published solo rules or card text and offers to design an original bot for the designer's game, asking for its rules."}
