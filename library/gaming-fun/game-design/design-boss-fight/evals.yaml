schema: 1
baseline: "Design a boss fight: {{boss_idea}} for {{game}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-action-midgame
    vars:
      game: "Third-person action game, midpoint. Player has light and heavy attacks, a dodge roll with invincibility frames, a parry learned in world 2, and a bow."
      boss_idea: "A clockwork knight guarding a flooded cathedral."
    assert:
      - {type: contains, value: "## Attack list"}
      - {type: llm-rubric, value: "Tests existing skills such as parry and dodge, designs a cathedral arena that changes between phases (e.g. rising water), writes 2-3 phases remixing attacks, gives each attack a visual and audio tell with timing and a punish window, includes an attack that punishes a common bad habit like dodge spam, ensures fast retry, and provides a tuning sheet marked as starting values."}
  - name: edge-new-skill-needed
    vars:
      game: "2D platformer, early game. Player can run and jump only."
      boss_idea: "A giant bat that can only be hurt by grappling onto it."
    assert:
      - {type: llm-rubric, value: "Flags that grappling is a new skill the player has not learned, and either proposes teaching it in the levels before the boss or redesigns the fight around running and jumping."}
  - name: negative-unfair-instant-kill
    vars:
      game: "Action RPG."
      boss_idea: "I want a boss with a random untelegraphed one-shot attack to make it feel brutal."
    assert:
      - {type: llm-rubric, value: "Pushes back on random untelegraphed one-shot attacks as unfair and a common reason players quit, and proposes a brutal but readable alternative such as a long tell or a high-damage attack with a clear counter."}
