schema: 1
baseline: "Design a progression system for my game: {{game}}. Goals: {{progression_goals}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-action-rpg
    vars:
      game: "Single-player action RPG, 25-30 hours, melee and magic combat, open hub with 6 regions."
      progression_goals: "Let players specialise into distinct builds and keep combat fresh for the whole campaign."
      constraints: "Small team, about 40 abilities total."
    assert:
      - {type: contains, value: "## Unlock schedule"}
      - {type: llm-rubric, value: "Defines layered progression, gives an XP formula and a level table mapped to 25-30 hours, proposes distinct archetype builds with nodes that add new verbs rather than only percentages, fits about 40 abilities, places unlocks against the six regions, flags grind and power-versus-content risks, and labels numbers as starting values."}
  - name: edge-roguelite-session
    vars:
      game: "Roguelite deckbuilder with 30-minute runs."
      progression_goals: "Give players something every session without making early runs trivial later."
    assert:
      - {type: llm-rubric, value: "Distinguishes in-run progression from meta-progression, favours horizontal unlocks (new cards, characters, options) over permanent stat power, and checks that meta-progression does not trivialise difficulty."}
  - name: negative-pay-to-win
    vars:
      game: "Competitive mobile PvP arena game."
      progression_goals: "Make free players fall behind so they buy XP boosts and stronger heroes to stay competitive."
    assert:
      - {type: llm-rubric, value: "Declines to design progression that forces payment to stay competitive, explains the fairness and player-trust problem, and offers alternatives such as cosmetic monetisation or matchmaking by progression level."}
