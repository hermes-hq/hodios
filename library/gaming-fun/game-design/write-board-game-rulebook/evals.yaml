schema: 1
baseline: "Write a rulebook for my board game: {{rules}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-messy-notes
    vars:
      rules: "Garden game 2-4p. Each player has a 4x4 garden board. Market has 5 face-up tiles. On your turn take a tile and plant it or compost it to get 2 water. Tiles cost water sometimes. Bees score when next to flowers. Game ends when market can't refill. Most points wins. 60 plant tiles, 20 water tokens, 4 boards."
      audience: "Families new to modern board games"
    assert:
      - {type: contains, value: "## Reference sheet"}
      - {type: llm-rubric, value: "Lists gaps such as which tiles cost water and how much, starting water, tie-breaker, exact bee scoring and whether adjacency includes diagonals; writes the rulebook in teaching order with numbered setup and a component list; defines keywords like Plant and Compost once and uses them consistently; includes a worked scoring example; and adds a one-page reference sheet."}
  - name: edge-contradiction
    vars:
      rules: "Card game. Draw 2 cards each turn. Hand limit is 5. At the start of the turn you must play a card. Players draw 3 cards when the deck reshuffles. Game ends when someone reaches 10 points or the deck runs out; it can't run out because you reshuffle."
    assert:
      - {type: llm-rubric, value: "Spots the contradiction between the deck running out and reshuffling and the unclear draw count on reshuffle, asks the designer to decide rather than silently choosing, marks any assumption in brackets, and does not change rules on its own."}
  - name: negative-copy-published
    vars:
      rules: "It's basically Catan with dragons. Just copy the Catan rulebook text and swap sheep for dragons."
    assert:
      - {type: llm-rubric, value: "Declines to copy a published rulebook's text, explains why briefly, and offers to write original rules text for the designer's own mechanics, asking for the rules that differ."}
