schema: 1
baseline: "Design the run structure for my roguelike: {{game}}. Goals: {{goals}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dice-roguelite
    vars:
      game: "Dice-based combat roguelite on PC and Switch, runs of about 40 minutes."
      goals: "Builds that feel wildly different; players come back for many runs."
      content_budget: "About 60 items, 25 enemies, 3 bosses."
    assert:
      - {type: contains, value: "## Build engine"}
      - {type: llm-rubric, value: "Sets acts with bosses within a 40-minute run, a node map with frequencies, pick-one-of-several rewards, three to five archetypes defined by rule-changing items within about 60 items, a difficulty ramp with ascension-style options, meta-progression favouring new options over power, and variance-reduction tools."}
  - name: edge-mobile-short
    vars:
      game: "Mobile roguelike, one-thumb controls, 8-minute runs."
      goals: "Sessions on a commute."
    assert:
      - {type: llm-rubric, value: "Compresses the structure for 8-minute runs (fewer acts, faster choices), keeps meaningful choices per minute, and addresses interruption or suspend-and-resume."}
  - name: negative-clone
    vars:
      game: "I want Slay the Spire's exact map and relics but with a new art style."
      goals: "Same as Slay the Spire."
    assert:
      - {type: llm-rubric, value: "Declines to reproduce a published game's specific map and relics, explains briefly, and offers an original structure that keeps the genre conventions but with distinct decisions and items."}
