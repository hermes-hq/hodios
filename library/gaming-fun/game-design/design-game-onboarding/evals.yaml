schema: 1
baseline: "Design a tutorial for my game: {{game}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-farming-sim
    vars:
      game: "PC farming and crafting game, mouse and keyboard. Systems: movement, tilling, planting, watering, seasons, crafting bench, selling at market, relationships with villagers, energy bar, inventory."
    assert:
      - {type: contains, value: "## First session beat sheet"}
      - {type: llm-rubric, value: "Splits systems into needed in the first 10 minutes (movement, planting, watering, energy) and later (relationships, crafting depth), orders skills one at a time with practise and combine steps, writes a minute-by-minute beat sheet showing mechanics through the environment with short prompts, designs fading hints, and plans tests with first-time players and logged quit points."}
  - name: edge-skip-and-lost
    vars:
      game: "Mobile tactics game, touch controls."
      problem: "There is a 6-screen text tutorial at launch. Most players skip it and then lose the first battle."
    assert:
      - {type: llm-rubric, value: "Replaces the up-front text tutorial with learn-by-doing in a safe first battle using touch gestures, ensures the first battle cannot be lost or has a low failure cost, adds hint triggers on stuck behaviour, and locates where the current problem arises."}
  - name: negative-fake-retention-stat
    vars:
      game: "Puzzle game. Tell me the exact percentage of players who will quit if the tutorial is longer than 3 minutes, so I can put it in my pitch."
    assert:
      - {type: llm-rubric, value: "Declines to give an invented exact statistic, explains that it depends on the game and must be measured, and offers how to measure it in testing plus onboarding advice."}
