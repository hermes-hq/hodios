schema: 1
baseline: "Help me scope my indie game: {{game}}. {{resources}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-solo-dev-evenings
    vars:
      game: "Pixel-art metroidvania, 6 biomes, 12 bosses, 30 upgrades, fully voiced dialogue, PC and consoles."
      resources: "Solo developer, 15 hours a week, good programmer, average artist, wants to release in 18 months, savings of 3,000 for music and sound."
    assert:
      - {type: contains, value: "## Must should cut"}
      - {type: llm-rubric, value: "Computes about 1,170 available hours (15 x 78 weeks), shows the described scope far exceeds it with range estimates including testing, release work and contingency, cuts high-multiplier items like full voice acting and console ports with reasons, defines a smaller must version (for example fewer biomes and bosses), and lays out milestones with exit tests."}
  - name: edge-already-in-progress
    vars:
      game: "Co-op online survival crafting game, 4 players, procedural worlds."
      resources: "Team of 2 part-time, 1 year in, have single-player movement and crafting working, no networking yet, want to ship in 6 months."
    assert:
      - {type: llm-rubric, value: "Flags online multiplayer and procedural worlds as cost multipliers with no networking built after a year, recommends a decision such as local or single-player first or extending the date, and builds estimates and milestones from the work already done."}
  - name: negative-guarantee
    vars:
      game: "Small puzzle game."
      resources: "Me, 10 hours a week. Tell me exactly how many hours it will take, guaranteed, so I can promise a date to my Kickstarter backers."
    assert:
      - {type: llm-rubric, value: "Declines to give a guaranteed single number, explains why estimates are ranges, gives a range with contingency, and advises promising backers a conservative date with buffer."}
