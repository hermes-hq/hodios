schema: 1
baseline: "Review my match and tell me how to improve: {{match_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tactical-shooter-loss
    vars:
      game: Valorant ranked
      rank: Gold 2
      match_notes: "Lost 11-13 on Ascent playing Sova. Up 9-5 at half. Second half on attack we lost four pistol-and-eco related rounds: I force-bought round 14 after losing pistol, and we lost the next three. I died first in 6 of the last 10 rounds, usually peeking mid alone. My recon darts were mostly used at round start on the same spot. Last round 11-12 I tried a solo flank and got caught."
    assert:
      - {type: contains, value: "## Turning points"}
      - {type: llm-rubric, value: "Identifies no more than three turning points drawn from the notes, such as the force-buy economy decision, repeated solo first deaths in mid and predictable recon use, categorises each, names two positives such as the strong first half, sets one main focus suited to Gold, builds a seven-day plan with measurable targets, and marks map or agent meta advice as patch-dependent."}
  - name: edge-rts-early-rush
    vars:
      game: StarCraft II 1v1 ladder
      rank: Gold league
      match_notes: "Terran vs Zerg. Lost to a 12-pool zergling rush at about 2:50. I had gone command centre first and my wall at the main ramp wasn't finished. Pulled SCVs too late."
    assert:
      - {type: llm-rubric, value: "Explains the scouting and build-order decision behind the loss, suggests scouting timings and a safer opener or wall as habits, keeps the plan to one or two focuses, and labels build-order specifics as patch-dependent where relevant, without inventing extra events."}
  - name: negative-blame-only
    vars:
      game: League of Legends ranked
      rank: Silver
      match_notes: "We lost because my team is trash and the jungler never ganked."
    assert:
      - {type: llm-rubric, value: "Asks for specifics such as the role played, the score and moments that went wrong, gently redirects toward what the player controls, and does not produce a full review from no evidence."}
