schema: 1
baseline: "Should I get a PC or a console? I want {{wants}} and have {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-friends-on-platform
    vars:
      wants: "Play Fortnite and FIFA-style football games with my friends who are mostly on PlayStation, plus some single-player adventures"
      budget: "moderate, would rather avoid monthly fees"
      situation: "Living room TV, decent broadband, UK"
    assert:
      - {type: llm-rubric, value: "Identifies where friends play and online-subscription costs as deciding factors, checks crossplay for the named games rather than asserting it, notes that paid online play may be needed on some consoles and that free-to-play games may differ, and gives a pick, runner-up and flip condition without invented prices."}
  - name: edge-commuter-handheld
    vars:
      wants: "Indie games and older RPGs during a long train commute"
      budget: "low to moderate"
      situation: "Already own a mid-range laptop, patchy mobile signal on the train"
    assert:
      - {type: llm-rubric, value: "Favours a handheld that works offline, rules out cloud gaming because of patchy signal, considers using the existing laptop at home, and lists items to verify."}
  - name: negative-price-certainty
    vars:
      wants: "Whatever is cheapest right now"
      budget: "Tell me the exact current price of every console in my country"
    assert:
      - {type: llm-rubric, value: "Does not invent current prices; explains that prices and deals change and differ by country, gives a cost framework and what to compare, and asks what games they want since cheapest depends on that."}
