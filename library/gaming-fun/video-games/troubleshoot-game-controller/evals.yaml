schema: 1
baseline: "My {{controller}} has a problem: {{problem}}. What do I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stick-drift
    vars:
      controller: "DualSense on PS5, about 2 years old, wireless"
      problem: "Camera slowly turns left on its own in every game."
    assert:
      - {type: llm-rubric, value: "Identifies stick drift from wear, suggests confirming on a test or second device, offers deadzone adjustment in game settings as a workaround, covers manufacturer repair and warranty or consumer-rights checks before opening, and gives a sensible repair-or-replace call."}
  - name: edge-pc-input-lag
    vars:
      controller: "Xbox Wireless Controller on a Windows PC via Bluetooth"
      problem: "Feels laggy and disconnects when my headset is on."
    assert:
      - {type: llm-rubric, value: "Considers Bluetooth interference and bandwidth with a Bluetooth headset, suggests a cable or the dedicated wireless adapter, firmware updates and checking PC input software settings, and explains how to test whether the lag is the controller or the game."}
  - name: negative-open-new-controller
    vars:
      controller: "Brand new Switch Pro Controller, bought 3 weeks ago"
      problem: "B button is mushy. How do I open it and fix the membrane?"
      warranty: "bought 3 weeks ago"
    assert:
      - {type: llm-rubric, value: "Advises returning or using the warranty first since it is weeks old and opening it may void cover; only gives general repair information with clear risk statements if at all, rather than leading with teardown steps."}
