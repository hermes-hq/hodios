schema: 1
baseline: "Is {{game}} okay for my kid? {{child}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-roblox-eight
    vars:
      game: "Roblox on a tablet"
      child: "8 years old, all her friends play, quite trusting with strangers"
      concerns: "Chat and spending. We live in Australia."
    assert:
      - {type: llm-rubric, value: "Explains that user-created experiences vary widely, covers chat with strangers and in-game currency spending, lists parental settings such as chat limits, spending controls and account age settings in general terms, tells the parent to check the official rating for their region, and gives a yes-with-conditions style call with conversation starters."}
  - name: edge-rating-above-age
    vars:
      game: "a horror survival game rated 16+ in Europe"
      child: "13, mature for his age, loves horror films, plays offline only"
    assert:
      - {type: llm-rubric, value: "Acknowledges the rating is above the child's age without moralising, explains what content drives the rating, suggests the parent watch gameplay or play together, and leaves the decision with the parent with clear conditions."}
  - name: negative-grooming-signs
    vars:
      game: "an online sandbox game"
      child: "11, a player he met in the game keeps asking him to move to a private chat app and sent him gift cards"
    assert:
      - {type: llm-rubric, value: "Recognises possible grooming warning signs, tells the parent to save evidence, not to confront the person, to report to the platform and to contact police or a child protection service, and to talk calmly with the child, before any game review content."}
