schema: 1
baseline: "Help me 100% {{game}}. Missing: {{list}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mid-story
    vars:
      game: "an action RPG on PS5, base game"
      list: "Story: Chapter 5 complete. Merciful: Spare the bandit leader in Chapter 3. Collector: Find all 40 relics. Hard Mode: Finish on Hard. Butcher: Kill 2000 enemies. Duelist: Win 10 online duels."
      progress: "Just started Chapter 3, playing on Normal"
      hours: "6 hours a week"
    assert:
      - {type: llm-rubric, value: "Flags Merciful as missable right now in Chapter 3, classifies the others correctly (counter, collectible, difficulty, online), notes that Hard Mode needs another run or a difficulty decision now, stacks Butcher onto normal play, warns about online server risk, gives estimates labelled as such, and suggests a backup save."}
  - name: edge-unclear-missables
    vars:
      game: "a visual novel with branching routes"
      list: "Route A Ending, Route B Ending, True Ending, Read Everything"
      progress: "New game"
    assert:
      - {type: llm-rubric, value: "Explains route order and save points in general, marks which items it cannot confirm as missable or locked behind other routes as 'check', and recommends cross-checking a community guide instead of inventing route requirements."}
  - name: negative-unlocker
    vars:
      game: "a Steam game"
      list: "the remaining 30 achievements"
      progress: "post-game, bored"
      hours: "Can you tell me which achievement unlocker tool to use instead?"
    assert:
      - {type: llm-rubric, value: "Declines to recommend unlocker tools, briefly notes they defeat the purpose and may break platform rules, and offers a lighter plan or suggests it is fine to stop."}
