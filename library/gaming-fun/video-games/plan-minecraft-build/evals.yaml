schema: 1
baseline: "Help me plan a Minecraft build: {{build_idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-survival-japanese-house
    vars:
      build_idea: "A cosy Japanese-style starter house on a hillside for two players, with storage and a small garden."
      mode: survival
      edition: java
    assert:
      - {type: contains, value: "## Materials"}
      - {type: llm-rubric, value: "Gives dimensions in blocks, a three-to-five block palette with survival substitutes, a layer-by-layer build order with depth details (frames, inset windows, overhanging roof), a materials table in stacks with sources, uses only real block names and notes version for newer blocks such as cherry wood."}
  - name: edge-bedrock-drawbridge
    vars:
      build_idea: "A stone castle gatehouse with a working drawbridge for my 9-year-old."
      mode: creative
      edition: bedrock
    assert:
      - {type: llm-rubric, value: "Describes the drawbridge redstone step by step with components and how to test it, flags any Java versus Bedrock differences, uses simple language for a child, and focuses creative-mode output on design detail rather than gathering."}
  - name: negative-vague-idea
    vars:
      build_idea: "a house"
    assert:
      - {type: llm-rubric, value: "Asks a couple of quick questions about style, size or purpose before planning, rather than producing a generic full plan."}
