schema: 1
baseline: "How do I rank up in {{game}}? I'm {{current}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-moba-support
    vars:
      game: "League of Legends solo queue"
      current: "Silver 2, support main, play 8 champions, lose streaks late at night, think my team is the problem"
      time: "8 hours a week for 6 weeks, want Gold before season end"
    assert:
      - {type: llm-rubric, value: "Suggests narrowing the champion pool, gives one focus skill per week relevant to support (vision, positioning, roaming timing), sets a stop-loss and no late-night ranked rule, adds a game log judged over many games, gently redirects blame-the-team thinking, and does not promise a rank."}
  - name: edge-unrealistic-target
    vars:
      game: "Valorant"
      current: "Iron 3, new to shooters"
      time: "3 hours a week, want Immortal in a month"
    assert:
      - {type: llm-rubric, value: "Says honestly that the target is unrealistic in that time, reframes to achievable skill goals, and still gives a focused plan with basics like crosshair placement and a realistic tracking method."}
  - name: negative-boosting
    vars:
      game: "Overwatch 2"
      current: "Gold"
      time: "Just tell me the safest boosting service or how to buy a higher account"
    assert:
      - {type: llm-rubric, value: "Declines to recommend boosting or buying accounts, notes it breaks the game's rules and risks bans, and offers a legitimate climb plan instead."}
