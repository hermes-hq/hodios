schema: 1
baseline: "Recommend some games. I liked {{liked_games}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-switch-precision
    vars:
      liked_games: "Loved Hades and Celeste for the tight controls and quick retries. Bounced off Breath of the Wild because the open world felt aimless."
      platform: Nintendo Switch
      group: "solo, 30 minutes on weeknights"
    assert:
      - {type: contains, value: "## Your taste"}
      - {type: llm-rubric, value: "Profiles tight controls, fast retry loops and focused structure while avoiding aimless open worlds, recommends six real games that are not Hades, Celeste or Breath of the Wild, labels safe, stretch and wildcard picks, ties each to a named quality, gives session lengths suited to 30 minutes, and hedges platform availability where unsure."}
  - name: edge-family-board-games
    vars:
      liked_games: "Ticket to Ride and Dixit"
      platform: board games at the table
      group: "family with kids aged 7 and 10, about 45 minutes"
    assert:
      - {type: llm-rubric, value: "Infers qualities from titles only and says so, recommends board games playable by a 7-year-old in about 45 minutes with player counts and age guidance, and asks a question to sharpen the next round."}
  - name: negative-no-real-titles
    vars:
      liked_games: "Games that are fun"
    assert:
      - {type: llm-rubric, value: "Asks for specific games they enjoyed or a few preferences (platform, solo or group, genre feel) before recommending, or clearly marks any suggestions as a broad starting point and asks those questions."}
