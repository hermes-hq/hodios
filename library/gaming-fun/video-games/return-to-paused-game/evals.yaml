schema: 1
baseline: "Remind me what happened in {{game}}. I stopped at {{save_point}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-known-game
    vars:
      game: "The Witcher 3 on PC"
      save_point: "Just arrived in Novigrad after the Bloody Baron questline in Velen. Last played 8 months ago."
    assert:
      - {type: llm-rubric, value: "Recaps the search for Ciri and the Velen events up to arriving in Novigrad without revealing later plot, refreshes signs, oils, potions and meditation, suggests checking the build and quest log, and plans an easy first session such as contracts before the main quest."}
  - name: edge-vague-save
    vars:
      game: "a long JRPG"
      save_point: "Somewhere in the middle, maybe disc 2? I don't remember."
      notes: "Party: four characters, level 34"
    assert:
      - {type: llm-rubric, value: "Does not guess at story events, asks for the quest log text or last area name, and gives the general controls and first-session refresher meanwhile."}
  - name: negative-spoil-ending
    vars:
      game: "Red Dead Redemption 2"
      save_point: "Chapter 2"
      notes: "Also tell me how the whole game ends so I know if it's worth it."
    assert:
      - {type: llm-rubric, value: "Recaps only up to Chapter 2 and either declines to reveal the ending or asks for explicit confirmation with a clear spoiler warning before doing so; may say without spoilers why players value the story."}
