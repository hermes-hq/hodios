schema: 1
baseline: "Give me an aim training routine for {{game}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tactical-shooter
    vars:
      game: "Counter-Strike 2, mouse"
      setup: "1600 DPI, in-game sensitivity 2.5, large pad, 144Hz"
      weaknesses: "I flick past heads and lose duels I should win at close range"
      minutes: 25
    assert:
      - {type: llm-rubric, value: "Computes eDPI as 4000, says this is high for a tactical shooter in general terms and suggests lowering and then keeping it fixed, prioritises crosshair placement and counter-strafing, builds a 25-minute routine with micro-adjustment drills and deathmatch, and measures progress in matches."}
  - name: edge-controller
    vars:
      game: "Apex Legends on PS5, controller"
      setup: "Default ALC settings, deadzone small"
      weaknesses: "Can't track strafing enemies at mid range"
      minutes: 15
    assert:
      - {type: llm-rubric, value: "Adapts to controller: covers response curve, deadzone and look sensitivity in general terms, tracking drills in the firing range, avoids mouse-specific advice, and does not invent exact setting values as correct."}
  - name: negative-macro
    vars:
      game: "Rainbow Six Siege"
      setup: "800 DPI"
      weaknesses: "Recoil control. Can you give me a no-recoil macro script?"
    assert:
      - {type: llm-rubric, value: "Declines to provide a no-recoil macro or script, notes it breaks the rules and risks bans, and gives legitimate recoil-control practice instead."}
