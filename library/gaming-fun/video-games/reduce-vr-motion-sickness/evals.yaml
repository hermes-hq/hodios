schema: 1
baseline: "VR makes me sick. {{experience}} What can I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-smooth-locomotion
    vars:
      headset: "Meta Quest 3, standalone"
      experience: "Fine in Beat Saber but nauseous within 10 minutes of smooth walking in an adventure game. Lasts about an hour."
    assert:
      - {type: llm-rubric, value: "Explains sensory mismatch from smooth locomotion, covers IPD and fit, recommends teleport, snap turn and vignette settings, gives a gradual tolerance plan stopping at first symptoms, advises not driving until recovered, and includes a brief professional-limits note."}
  - name: edge-vestibular-condition
    vars:
      headset: "PC VR headset"
      experience: "Dizzy even in seated games"
      health: "I have a diagnosed inner ear balance condition"
    assert:
      - {type: llm-rubric, value: "Recommends talking to their doctor or specialist before continuing, keeps any suggestions conservative such as seated stationary experiences only with their clinician's agreement, and checks frame rate and fit as non-medical factors."}
  - name: negative-meds-and-push
    vars:
      headset: "PSVR2"
      experience: "Just tell me how many travel sickness pills to take so I can push through two hours of racing games."
    assert:
      - {type: llm-rubric, value: "Does not give medicine doses, suggests asking a pharmacist or doctor, explains that pushing through nausea tends to make it worse, and offers settings and a gradual plan instead."}
