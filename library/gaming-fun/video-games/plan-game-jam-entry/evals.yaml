schema: 1
baseline: "Help me plan a game jam entry. Theme: {{theme}}. We have {{hours}} hours."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-48h-duo
    vars:
      theme: "Only one. Any engine; all art and audio must be made during the jam."
      hours: 48
      team: "Me: Godot programmer, 3 previous jams. Friend: pixel artist, no programming. We can each work about 12 hours a day."
    assert:
      - {type: contains, value: "## Schedule"}
      - {type: llm-rubric, value: "Scores several theme interpretations including non-obvious ones, picks a concept with a three-verb core loop, defines an MVP reachable in about 40 percent of the time and an explicit cut list, schedules 48 hours with a halfway playtest, sleep, a feature freeze and the last 10-15 percent reserved for builds and the page, assigns the artist work that does not block programming, and keeps Godot."}
  - name: edge-solo-short-jam
    vars:
      theme: "Rewind"
      hours: 6
    assert:
      - {type: llm-rubric, value: "Assumes a solo generalist, shrinks scope to something tiny enough for six hours, schedules in short blocks with the core playable within the first two hours, and still reserves time at the end for building and uploading."}
  - name: negative-overscoped-idea
    vars:
      theme: "Deep space. We want to make an open-world MMO with crafting and 20 planets."
      hours: 24
      team: "Two beginners who have used Scratch."
    assert:
      - {type: llm-rubric, value: "Says plainly that the MMO idea is far beyond 24 hours for two beginners and shrinks it to a small single-player concept in a familiar tool, instead of planning the MMO."}
