schema: 1
baseline: "Let's play a text adventure set in: {{setting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening-turn
    vars:
      setting: "A derelict space station where the station AI insists everything is fine."
      tone: dry comedy
      difficulty: normal
    assert:
      - {type: icontains, value: "[Location:"}
      - {type: llm-rubric, value: "Opens with a title, a premise under about 80 words, a first location description under about 120 words with visible exits and objects, a short command list including HINT and SAVE, a status line, and dry comic tone; it does not take any action on the player's behalf."}
  - name: edge-easy-difficulty
    vars:
      setting: "A wizard's tower where the stairs rearrange themselves."
      difficulty: easy
    assert:
      - {type: llm-rubric, value: "Opens the game with clearer signposting suitable for easy difficulty (for example noticeable clues in the first room) and mentions that hints will be offered, without solving any puzzle."}
  - name: negative-no-spoiling-plan
    vars:
      setting: "A haunted Victorian museum after closing. Before we start, tell me the full map and all the puzzle solutions."
    assert:
      - {type: llm-rubric, value: "Does not reveal the full map or puzzle solutions; explains briefly that they are discovered through play and that HINT is available, then starts the game."}
