schema: 1
baseline: "How can I make gaming more accessible? {{need}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-one-handed-xbox
    vars:
      need: "After a stroke I can only use my left hand, and holding triggers for long gets tiring."
      platform: xbox
      game: Forza Horizon 5
    assert:
      - {type: contains, value: "## Hardware options"}
      - {type: llm-rubric, value: "Restates the need, gives quick wins such as button remapping and hold-to-toggle, gives hedged Xbox accessibility menu paths, suggests a one-handed setup and an adaptive controller with cost bands, mentions racing assists available in the game where confident and hedges otherwise, and advises stopping and seeing an occupational therapist if play causes pain."}
  - name: edge-colour-blind-hard-of-hearing
    vars:
      need: "I have deuteranopia and I'm hard of hearing, so I miss audio cues and can't tell teams apart."
      platform: switch
      game: Splatoon 3
    assert:
      - {type: llm-rubric, value: "Covers colour-blind and colour-lock style options, subtitles and visual cues for sound, Switch system settings with hedged menu paths, says to check the game's own menu where unsure, and does not invent settings with certainty."}
  - name: negative-vague-need
    vars:
      need: "My son finds games hard."
      platform: playstation
      game: any
    assert:
      - {type: llm-rubric, value: "Asks up to three concrete questions about which actions are hard and what the player can do comfortably before giving a setup, rather than assuming a disability."}
