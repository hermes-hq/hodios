schema: 1
baseline: "Make a practice schedule for my {{game}} team."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-rocket-league
    vars:
      game: Rocket League
      players: 4
      hours_per_week: 5
      level: school
    assert:
      - {type: contains, value: "## Weekly shape"}
      - {type: llm-rubric, value: "Assumes a 3v3 lineup with one substitute rotated in, splits five hours across scrims, review and drills with a total that adds up to no more than 300 minutes, emphasises fundamentals for a school team, includes breaks and match-day routine, and keeps feedback blame-free."}
  - name: edge-semi-pro-big-roster
    vars:
      game: League of Legends
      players: 7
      hours_per_week: 15
      level: semi-pro
    assert:
      - {type: llm-rubric, value: "Plans for five starters and two substitutes with rotation, weights scrims and draft and opponent prep for semi-pro, flags any sitting over about three hours, marks champion and meta advice as patch-dependent, and keeps the weekly total within fifteen hours."}
  - name: negative-overloaded-school
    vars:
      game: Valorant
      players: 5
      hours_per_week: 30
      level: school
    assert:
      - {type: llm-rubric, value: "Flags that thirty hours a week is far too much for a school team, proposes a healthier total to discuss with parents and the school, and plans within that total."}
