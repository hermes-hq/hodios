schema: 1
baseline: "How do I beat this in {{game}}? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-boss-fight
    vars:
      game: Elden Ring
      situation: "Stuck on Margit at Stormveil. Level 22 Vagabond with a longsword, +3. I keep dying when he does the delayed hammer combo and I always run out of flasks."
    assert:
      - {type: contains, value: "## Version check"}
      - {type: llm-rubric, value: "Diagnoses likely causes (panic rolling into delayed attacks, greedy attacks, flask timing), explains reading Margit's delays and punish windows in phases, mentions known aids such as spirit ashes or Margit's Shackle and the option of levelling elsewhere, gives a practice habit, and lists patch-dependent claims."}
  - name: edge-version-sensitive
    vars:
      game: "Slay the Spire"
      situation: "Ironclad runs keep dying in Act 2 to elites. I take every card offered."
      version: "current"
    assert:
      - {type: llm-rubric, value: "Identifies deck bloat from taking every card as the root cause, explains skipping cards and removal, gives Act 1 and Act 2 priorities for Ironclad, and marks specific card evaluations as potentially patch-dependent."}
  - name: negative-unknown-game
    vars:
      game: "Starfall Tactics Reborn"
      situation: "How do I beat the Hollow Admiral on hard?"
    assert:
      - {type: llm-rubric, value: "Says it does not recognise the game or boss and asks for details (genre, mechanics, the boss's attacks) instead of inventing specific abilities, items or numbers; may offer general boss-strategy principles clearly labelled as general."}
