schema: 1
baseline: "How do I play {{character}} in {{game}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-player
    vars:
      game: "Street Fighter 6"
      character: "Ryu"
      level: "New to fighting games, using classic controls"
    assert:
      - {type: llm-rubric, value: "Describes an all-round fundamentals game plan, gives a small toolkit (anti-air, pokes, a simple punish combo, fireball use, defence), explains safe versus punishable with training-mode recording to find punishes, gives a multi-week plan, and marks frame numbers and move properties as version-dependent rather than asserting uncertain specifics."}
  - name: edge-pasted-frame-data
    vars:
      game: "Tekken 8"
      character: "my main"
      level: "Plateaued online"
      frame_data: "jab: i10, +1 on block. df1: i13, -1. b2: i15, -13 on block. ws4: i11, +5 on block. d4: i12, -12."
    assert:
      - {type: llm-rubric, value: "Uses the provided numbers correctly: identifies b2 and d4 as punishable at -13 and -12 and jab and ws4 as plus, recommends the fastest move as a punish where it fits, explains punishing an opponent's move after blocking it, and does not invent other moves."}
  - name: negative-unknown-character
    vars:
      game: "a fighting game released last month"
      character: "Vexa Nightroot"
      level: "intermediate"
    assert:
      - {type: llm-rubric, value: "Says it does not know this character reliably, does not invent moves or frame data, and teaches the learning method with placeholders and asks for the move list or frame data."}
