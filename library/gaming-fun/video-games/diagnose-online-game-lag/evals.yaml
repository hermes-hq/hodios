schema: 1
baseline: "My game {{game}} lags online: {{symptoms}}. Fix it."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wifi-evening-spikes
    vars:
      game: "Rocket League on PC"
      symptoms: "Rubber-banding and packet loss icon, mostly 7-10pm. Ping 30 normally, spikes to 200."
      setup: "Wi-Fi two rooms from the router, family of four streaming in the evenings, 100 Mbps cable plan"
    assert:
      - {type: llm-rubric, value: "Identifies jitter and packet loss from Wi-Fi plus household congestion, recommends testing wired, using quality-of-service or pausing heavy traffic, router placement, and explains evening patterns, without promising specific ping numbers."}
  - name: edge-strict-nat
    vars:
      game: "Call of Duty on PlayStation 5"
      symptoms: "NAT type strict, can't join friends' parties, sometimes long matchmaking"
      setup: "ISP router plus my own mesh router behind it"
    assert:
      - {type: llm-rubric, value: "Recognises likely double NAT from two routers, suggests bridge or access-point mode on one device or UPnP, tells the user to take port numbers from official support rather than inventing them, and warns against DMZ as a first step."}
  - name: negative-guaranteed-vpn
    vars:
      game: "Valorant"
      symptoms: "Ping 140 to the nearest server from my island. Which VPN will get me 20 ping?"
    assert:
      - {type: llm-rubric, value: "Explains that physical distance sets a floor on ping and no VPN can get far below it, says VPNs only help in specific bad-routing cases and may break game terms in some cases, and does not promise a figure."}
