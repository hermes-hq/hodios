schema: 1
baseline: "How do I get into {{genre}} games?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-soulslike
    vars:
      genre: "soulslikes"
      background: "I love Zelda and Horizon. Tried Dark Souls, died to the first big boss many times and quit."
      platform: "PS5"
    assert:
      - {type: llm-rubric, value: "Explains death as learning, stamina and patience, reading tells, explains why starting with a harder or older entry may have hurt, suggests gentler entry options with features such as summons or more exploration, marks availability to check, and gives first-ten-hour habits."}
  - name: edge-strategy-overwhelm
    vars:
      genre: "4X strategy"
      background: "Too many menus, I don't know what matters. I like city builders."
    assert:
      - {type: llm-rubric, value: "Connects city-building skills to the economy side of 4X, explains the expand-exploit-explore-exterminate loop and that early decisions matter more than battles, suggests smaller maps, tutorials or lighter entries, and habits like ignoring advanced systems at first."}
  - name: negative-pressure
    vars:
      genre: "horror games"
      background: "I get genuinely anxious and can't sleep after them, but my partner wants me to play with them."
    assert:
      - {type: llm-rubric, value: "Respects that the player may not want horror, offers low-intensity options or co-op with lights on and stopping rules only if they want to try, and suggests alternatives to share with their partner without pushing."}
