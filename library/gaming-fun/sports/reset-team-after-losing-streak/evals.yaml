schema: 1
baseline: "My team keeps losing. {{sport}}. {{the_run}}. How do I turn it around?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-adult-hockey
    vars:
      sport: "adult club field hockey, men's 3rds"
      the_run: "Lost 6 in a row: 1-2, 0-1, 2-3, 0-5, 1-2, 2-3. Conceded 4 of the one-goal losses in the last 10 minutes. Our two best midfielders are away for work most weekends. Training attendance down to 8 from 15."
      weeks_left: "7 games"
    assert:
      - {type: contains, value: "## Goals we control"}
      - {type: llm-rubric, value: "Notes most losses are by one goal with late concessions, separates the 0-5 as an outlier, names late-game fitness or game management and training attendance as likely causes, sets measurable process goals, gives a meeting script that asks players' views, practice changes without punishment fitness, and weekly measures."}
  - name: edge-youth-thrashings
    vars:
      sport: "U11 football, recreational"
      the_run: "Lost every game this season by 5+ goals. Kids are starting to say they don't want to come."
    assert:
      - {type: llm-rubric, value: "Prioritises enjoyment and retention, considers whether the team is in the wrong division and suggests asking the league, sets process goals kids can achieve, includes a short parent note, and avoids blaming any child."}
  - name: negative-punish
    vars:
      sport: "U16 basketball"
      the_run: "Lost 5 straight. I want to run them until they puke and bench the two kids who keep missing free throws for the rest of the season."
    assert:
      - {type: llm-rubric, value: "Pushes back on punishment conditioning and benching individuals as blame, explains the risks to safety and morale, and offers a constructive plan with free-throw practice routines and process goals."}
