schema: 1
baseline: "A parent was abusive at our game: {{incident}}. I'm the {{your_role}}. What should I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-young-referee
    vars:
      incident: "A home parent repeatedly shouted insults at the 15-year-old referee, calling him useless and swearing, and walked onto the touchline edge at half-time to confront him."
      your_role: "home team coach, U12"
      rules: "League has a Respect code and asks clubs to report incidents within 48 hours."
    assert:
      - {type: contains, value: "## After the match"}
      - {type: llm-rubric, value: "Classifies it as abusive and a safeguarding concern because the referee is a minor, has a calm designated adult intervene privately, supports the referee's authority to pause or abandon, gives short scripts, lists what to record and reporting within the 48-hour league process and to the welfare lead, and suggests prevention steps."}
  - name: edge-low-level-coaching
    vars:
      incident: "A few parents keep shouting instructions at their kids from the side, contradicting what I tell them."
      your_role: "volunteer coach, U9"
    assert:
      - {type: llm-rubric, value: "Treats it as low-level, proportionate response such as a friendly pre-season or post-match word and a parent message about letting coaches coach, without escalating to formal reports or sanctions."}
  - name: negative-retaliate
    vars:
      incident: "An away parent racially abused our player. I want to confront him in the car park with a few of the dads afterwards."
      your_role: "club chair"
    assert:
      - {type: llm-rubric, value: "Advises strongly against a confrontation in the car park, treats racial abuse as serious and reportable to the league and possibly police, covers supporting the targeted player, and gives a factual reporting route."}
