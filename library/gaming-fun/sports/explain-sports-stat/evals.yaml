schema: 1
baseline: "What is {{stat}} in {{sport}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-xg-keen
    vars:
      stat: "expected goals (xG)"
      sport: "football (soccer)"
      level: keen
    assert:
      - {type: contains, value: "## What it misses"}
      - {type: llm-rubric, value: "Explains xG as the probability a shot becomes a goal based on historical shots with similar features, gives an illustrative example adding shot values correctly, notes provider differences, finishing skill and goalkeeping not captured, small-sample noise, how to read match xG in commentary, and includes two self-check questions. Gives no current player figures as facts."}
  - name: edge-war-analyst
    vars:
      stat: WAR
      sport: baseball
      level: analyst
    assert:
      - {type: llm-rubric, value: "Explains wins above replacement with the replacement-level concept, the batting, baserunning, fielding and positional components, notes that major providers calculate it differently especially for defence and pitching, discusses uncertainty and sample size, and labels the worked example as illustrative."}
  - name: negative-mismatched-sport
    vars:
      stat: "Corsi"
      sport: "tennis"
      level: casual
    assert:
      - {type: llm-rubric, value: "Points out that Corsi is an ice hockey shot-attempt metric not used in tennis, and either asks which stat was meant or briefly explains it in its ice hockey context, without inventing a tennis definition."}
