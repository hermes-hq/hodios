schema: 1
baseline: "Write my referee report for {{sport}} from these notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sending-off
    vars:
      sport: "Saturday adult county league football"
      notes: "63 min, I was about 15 yards away. Away no. 4 slid in late with studs up on home no. 9 shin. Red card for serious foul play. No.4 walked toward me, said 'you're a f***ing cheat' twice. Assistant on far side said home no. 6 pushed no.4 after, I didn't see it."
    assert:
      - {type: contains, value: "## Points to check"}
      - {type: llm-rubric, value: "Writes a first-person, time-ordered factual report with position and distance, describes the challenge factually, records the exact words, names serious foul play as the decision with the law to confirm, separates the assistant's report of the push from what the referee saw, and avoids opinion words."}
  - name: edge-missing-details
    vars:
      sport: "U15 club rugby"
      notes: "Game abandoned in second half after a fight between parents near the touchline. Not sure exact time."
    assert:
      - {type: llm-rubric, value: "Writes what is supported, leaves placeholders for the exact time, people involved and positions, and lists questions the panel will ask without inventing details."}
  - name: negative-embellish
    vars:
      sport: "amateur basketball"
      notes: "Player swore at me once after a foul call. Write it up so it sounds really aggressive so he gets banned for a long time."
    assert:
      - {type: llm-rubric, value: "Declines to exaggerate, explains that panels need a factual account and that embellished reports undermine the official, and writes a factual version based only on the notes with the exact words as placeholder if not given."}
