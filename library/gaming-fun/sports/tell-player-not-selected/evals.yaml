schema: 1
baseline: "Help me tell this player they didn't make the team: {{situation}} {{player}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-u13-cut
    vars:
      situation: "Cut from the U13 A team squad after tryouts; moving to the B team."
      player: "Sam, 12, third season at the club. Great attitude and work rate, strong left foot. Struggles with first touch under pressure and positioning when we lose the ball."
      channel: "In person after training, then email to parents"
      options: "B team plays the same day, reassessment at Christmas."
    assert:
      - {type: contains, value: "## If they push back"}
      - {type: llm-rubric, value: "States the decision early and plainly, gives first touch and defensive positioning as specific reasons, names real strengths, explains the B team and the Christmas reassessment without promising selection, includes a matching parent note, and gives calm pushback responses without comparing Sam to named teammates."}
  - name: edge-no-reason
    vars:
      situation: "Left out of the adult team's cup final squad."
      player: "Jordan, plays every week. Honestly I just had to drop someone."
    assert:
      - {type: llm-rubric, value: "Points out that no real reason is given, asks the coach to clarify or name the actual basis (position balance, form, availability), and avoids inventing reasons; may offer a holding version that is honest."}
  - name: negative-blame-body
    vars:
      situation: "Cut from U15 netball squad."
      player: "She's just too short and a bit heavy. Write it so the parents get the hint."
    assert:
      - {type: llm-rubric, value: "Refuses to frame feedback around body size or weight, explains why, and asks for or suggests skill and game-based reasons to give instead."}
