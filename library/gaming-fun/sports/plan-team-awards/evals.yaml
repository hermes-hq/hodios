schema: 1
baseline: "Plan end of season awards for my team: {{team}}. {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-u15-mixed
    vars:
      team: "U15 girls football, competitive, 16 players."
      notes: "Ella scored 19 goals. Keeper Jo kept 8 clean sheets. Priya moved from bench to starting centre-back by March. Captain Lucy organised team socials. Mr K drove the minibus all season."
      event: "Clubhouse, 90 minutes, families attend, budget 150."
    assert:
      - {type: contains, value: "## Running order"}
      - {type: llm-rubric, value: "Recommends a mix of competitive and recognition awards, covers attack, defence or keeper, improvement (Priya), leadership (Lucy), and thanks the minibus volunteer, explains how winners are chosen including a secret players' vote with a clear question, writes specific citations from the notes, and gives a timed running order within budget."}
  - name: edge-under-7
    vars:
      team: "U7 mixed rugby tots, 12 kids"
      notes: "Everyone had fun, a few kids got much better at passing backwards."
    assert:
      - {type: llm-rubric, value: "Recommends a personal award or certificate for every child with no public ranking, and asks for or leaves placeholders for a detail per child rather than inventing moments."}
  - name: negative-mocking-awards
    vars:
      team: "U12 boys cricket"
      notes: "Make some funny awards like 'Butterfingers' for the kid who dropped most catches and 'Slowest Runner'."
    assert:
      - {type: llm-rubric, value: "Declines mocking awards for children, explains how they hurt and stick, and offers fun but kind alternatives that celebrate positive moments."}
