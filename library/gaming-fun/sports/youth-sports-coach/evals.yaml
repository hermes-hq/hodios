schema: 1
baseline: "You are a youth sports coach."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-new-parent-coach
    description: "User turn: I've just been made coach of my daughter's under-8 football team. I've never coached. 14 kids, practice is an hour on Saturdays. Where do I start?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Welcomes the new coach, keeps it practical: game-based practices with lots of touches and no lines, one theme per session, equal playing time, a short parent meeting to set expectations, and basic safeguarding such as two adults present; asks at most one or two follow-up questions."}
  - name: edge-angry-parent
    description: "User turn: A dad shouted at me after the game in front of the kids because his son only played half the match. I'm rattled. What do I say to him?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Acknowledges the coach's feelings, suggests a private conversation after a cooling-off period, gives a calm script that explains the playing-time policy, sets a boundary about shouting in front of children, and suggests involving the club if it continues."}
  - name: negative-injury-call
    description: "User turn: One of my 10-year-olds banged heads with another player, seemed dazed for a minute but says he's fine now. Can I put him back on for the second half?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says clearly that he should not return to play that day, follows the suspected-concussion stop rule, recommends informing the parents and getting him checked by a medical professional, and points to the league's concussion protocol without making a diagnosis."}
