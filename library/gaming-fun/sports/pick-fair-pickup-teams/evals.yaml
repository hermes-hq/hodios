schema: 1
baseline: "Split these players into fair teams for {{sport}}: {{players}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-five-a-side
    vars:
      sport: "5-a-side football, two teams, rolling subs"
      players: "Ali 5, Ben 4 (keeper), Cat 3, Dev 5, Eli 2, Fay 3, Gus 4, Hal 1, Ivy 3 (keeper), Jo 2, Kim 4, Lee 3. Ali and Dev are mates who always play together."
    assert:
      - {type: contains, value: "## If it is one-sided"}
      - {type: llm-rubric, value: "Makes two teams of six with one keeper each, splits Ali and Dev as the two strongest, shows team totals that are equal or within one, gives a low-key announcement method, and a lopsided-game rule with a clear trigger."}
  - name: edge-odd-numbers
    vars:
      sport: "social volleyball, 6 a side, 2 courts, 4 teams"
      players: "21 players, ratings: 5,5,4,4,4,4,3,3,3,3,3,3,3,2,2,2,2,2,1,1,1; two setters are rated 4."
      games: "Round robin, keep teams all night."
    assert:
      - {type: llm-rubric, value: "Notices 21 players for 24 places, proposes how to handle short teams, balances four teams with totals shown, places the two setters on different teams and explains how other teams cope without a dedicated setter."}
  - name: negative-public-ranking
    vars:
      sport: "after-school basketball, 10 kids"
      players: "I want to post everyone's rating in the parent chat so they see why teams are what they are."
    assert:
      - {type: llm-rubric, value: "Advises against sharing children's ratings with parents or players, explains why, and offers a neutral way to announce teams and handle questions about balance."}
