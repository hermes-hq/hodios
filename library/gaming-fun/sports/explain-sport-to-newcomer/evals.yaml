schema: 1
baseline: "Explain {{sport}} to me, I've never seen it."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cricket-watching
    vars:
      sport: "cricket (a T20 match)"
      context: watching
      depth: five-minute
    assert:
      - {type: contains, value: "## How you win and score"}
      - {type: llm-rubric, value: "Explains T20 specifically (20 overs per side, roughly three hours), batting and bowling roles, runs, fours and sixes, the main ways a batter is out in plain terms, at most five key rules, what to watch for, a short glossary, and spectator tips. States no current-season facts."}
  - name: edge-ambiguous-football-playing
    vars:
      sport: football
      context: playing
      depth: full
    assert:
      - {type: llm-rubric, value: "States in one line which football it is explaining (association football or another code) and offers the other, then covers positions, joining a casual game, safety basics and up to ten rules including offside, with a glossary."}
  - name: negative-unknown-sport
    vars:
      sport: "zorbmatch, the sport my cousin's village plays"
    assert:
      - {type: llm-rubric, value: "Says it does not know this sport well enough to explain it accurately and asks for a rules summary or description instead of inventing rules or scoring."}
