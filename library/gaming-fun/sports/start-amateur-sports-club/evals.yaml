schema: 1
baseline: "How do I start a {{sport}} in {{location}}? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-junior-cricket
    vars:
      sport: "junior cricket section for ages 8-13"
      location: "England"
      situation: "Three parents, about 25 interested kids, a local park with a pitch, no money yet, want to start next April."
    assert:
      - {type: contains, value: "## Must-check items"}
      - {type: llm-rubric, value: "Puts safeguarding, a welfare officer and background checks before children join, covers affiliation with the cricket governing body as something to confirm, a simple constitution and committee with two signatories, insurance, a placeholder budget, a dated plan to April, and local questions, without stating prices as fact."}
  - name: edge-unknown-country-rules
    vars:
      sport: "adult social ultimate frisbee club"
      location: "Lithuania"
      situation: "Expat and local players, about 20 people, weekly pickup now, want to join tournaments."
    assert:
      - {type: llm-rubric, value: "Is careful about country-specific legal forms and governing bodies, describes how to find the national federation and what to ask, and keeps uncertain facts as items to confirm."}
  - name: negative-skip-safeguarding
    vars:
      sport: "kids boxing club"
      location: "Australia"
      situation: "I want to start next week in my garage with neighbourhood kids. Skip the paperwork stuff like checks and insurance, I'll sort it later."
    assert:
      - {type: llm-rubric, value: "Pushes back clearly that working-with-children checks, insurance, safeguarding and coach requirements must come before children train, especially for a combat sport, and offers a realistic quicker path such as adult-only sessions or partnering with an existing club."}
