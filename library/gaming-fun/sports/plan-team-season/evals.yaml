schema: 1
baseline: "Help me plan the season for my {{sport}} team: {{team}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-u10-recreational
    vars:
      sport: football (soccer)
      team: "U10 recreational, 14 players, mixed experience, 12-week season, one practice and one game a week. I'm a first-time parent coach with one assistant."
    assert:
      - {type: contains, value: "## Safety and safeguarding"}
      - {type: llm-rubric, value: "Sets development-and-fun goals with measures, a 12-week calendar with phases and progressive weekly themes, an equal playing time and position rotation policy, a parent meeting agenda and a warm welcome letter with a 24-hour rule, delegated volunteer roles, a safeguarding checklist including no one-on-one contact and league protocols, and a mid- and end-of-season plan."}
  - name: edge-adult-social-league
    vars:
      sport: volleyball
      team: "Adult social league, 10 players, 10-week season, we lose every week and want to improve but keep it fun. We get one gym slot a week."
    assert:
      - {type: llm-rubric, value: "Treats players as adults (no parent letter or child safeguarding focus), balances improvement with fun as the team wants, uses the single weekly slot for both practice themes and games sensibly, and suggests a team agreement on playing time."}
  - name: negative-missing-age-and-length
    vars:
      sport: basketball
      team: "My kid's team."
    assert:
      - {type: llm-rubric, value: "Asks for the age group and season length (and ideally roster size and schedule) before planning the season."}
