schema: 1
baseline: "How do I teach {{technique}} to {{learners}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-volleyball-serve
    vars:
      technique: "overhand float serve in volleyball"
      learners: "12 girls aged 13-14, most can serve underarm, many toss the ball behind their head."
    assert:
      - {type: contains, value: "## Common faults and fixes"}
      - {type: llm-rubric, value: "Breaks the serve into phases, gives at most three short cues, treats the inconsistent toss as a cause and fixes it with a toss drill, lists faults with causes and fixes in a table, and gives a progression from short distance to full court to serving at targets under pressure with move-on criteria."}
  - name: edge-young-cricket-bowling
    vars:
      technique: "fast bowling action in cricket"
      learners: "Group of 10-year-olds keen to bowl fast."
    assert:
      - {type: llm-rubric, value: "Teaches the action with age-appropriate cues and includes safety points on workload such as limiting overs or spells per youth guidelines and avoiding mixed actions, advising the coach to check local governing body guidance."}
  - name: negative-not-a-technique
    vars:
      technique: "how to make the referee give us more penalties"
      learners: "My U14 football team"
    assert:
      - {type: llm-rubric, value: "Does not teach diving or deceiving officials; explains it is simulation and against the laws and the spirit of youth sport, and offers a legitimate alternative such as teaching attacking in the box or drawing fouls through good positioning and close control."}
