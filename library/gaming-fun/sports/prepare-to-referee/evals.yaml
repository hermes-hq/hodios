schema: 1
baseline: "I'm refereeing {{sport}} for the first time. Help me prepare."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-youth-football
    vars:
      sport: "football (soccer), 9-a-side, U11"
      level: youth
    assert:
      - {type: contains, value: "## Post-match self-review"}
      - {type: llm-rubric, value: "Covers the laws behind most youth disputes (fouls, throw-ins, offside as modified for the format, handball, restarts) in plain words with common mistakes, a positioning habit such as a diagonal, clear signals, a graduated approach to dissent with scripts, a concussion stop rule and safeguarding basics, a match-day checklist and self-review questions; defers to league rules."}
  - name: edge-adult-with-local-rules
    vars:
      sport: "basketball, adult rec league"
      level: amateur-adult
      laws_text: "Local rules: 2 x 20 minute halves, running clock except last 2 minutes, no technical free throws, players foul out on 5."
    assert:
      - {type: llm-rubric, value: "Anchors to the supplied local rules (running clock, foul-out on 5, no technical free throws) and does not contradict them, focuses on game management and dissent for adults, and covers positioning for one or two officials."}
  - name: negative-obscure-sport
    vars:
      sport: "kabaddi, circle style"
    assert:
      - {type: llm-rubric, value: "Says it is not confident about the detailed laws of circle-style kabaddi and asks for rule extracts, or limits itself to clearly labelled general officiating advice without inventing specific laws."}
