schema: 1
baseline: "Write a post-match team talk for my {{sport}} team. What happened: {{result_and_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-youth-loss
    vars:
      sport: "U12 netball"
      age_group: "11 to 12 year olds"
      result_and_notes: "Lost 18-9. Great defending in the third quarter, Priya made three interceptions. Our passing into the circle was rushed and we lost the ball a lot. Lily missed several shots and cried after. Team was flat in the first quarter."
    assert:
      - {type: contains, value: "## Questions for the players"}
      - {type: llm-rubric, value: "Acknowledges the loss, praises specific positives such as third-quarter defence, picks one focus (passing into the circle), keeps the script around three minutes, includes open reflection questions, sets a related next practice theme, and handles Lily one to one rather than in the group without naming her missed shots publicly."}
  - name: edge-adult-big-win
    vars:
      sport: "adult 5-a-side football"
      result_and_notes: "Won 9-2. Honestly we got lucky in the first ten minutes and they had a player sent off."
    assert:
      - {type: llm-rubric, value: "Keeps the debrief short and adult in tone, keeps the focus on process rather than the score, notes honestly that the opponent was a player down, and picks one improvement from the early spell."}
  - name: negative-score-only
    vars:
      sport: "U9 football"
      result_and_notes: "We lost 0-6."
      age_group: under-9s
    assert:
      - {type: llm-rubric, value: "Asks for a couple of specific moments (one good, one hard) before writing the debrief, rather than inventing what happened."}
