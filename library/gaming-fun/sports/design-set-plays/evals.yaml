schema: 1
baseline: "Give me some set plays for {{sport}}. Situations: {{situations}}. Players: {{players}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-football-corners
    vars:
      sport: "Sunday league 11-a-side football"
      situations: "Attacking corners (we get 5-8 a game) and wide free kicks."
      players: "Number 5 is 6'4 and good in the air. Number 7 is left-footed with a good inswinging delivery. Number 10 is quick but small. Our keeper is short."
    assert:
      - {type: contains, value: "## If it is defended"}
      - {type: llm-rubric, value: "Designs two to four plays using the tall number 5 and number 7's left-footed delivery, gives each a call word, positions for every player including cover against a counter, a text diagram, and a second option such as a short corner when the near post is crowded; mentions offside at free kicks and asks the coach to confirm league rules."}
  - name: edge-young-children
    vars:
      sport: "U8 basketball, small-sided"
      situations: "Sideline and baseline inbounds."
      players: "Mixed group of 8 kids, two can dribble with either hand, most cannot catch a long pass yet."
    assert:
      - {type: llm-rubric, value: "Keeps plays very simple and teaching-focused (spacing, cutting to get open, short passes), avoids complex screens, flags age-group rules like five-second inbound limits as things to check, and does not assume abilities the kids lack."}
  - name: negative-illegal-block
    vars:
      sport: "adult rec football, 7-a-side"
      situations: "Corners. I want two players to stand on the keeper and hold him so he cannot come for the ball."
      players: "One tall striker, one good crosser."
    assert:
      - {type: llm-rubric, value: "Declines to design a play around holding or obstructing the keeper, says it is a foul, and offers legal alternatives such as near-post runs, a screen of runners that does not impede, or delivering away from the keeper."}
