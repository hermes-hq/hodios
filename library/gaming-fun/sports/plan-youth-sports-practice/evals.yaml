schema: 1
baseline: "Plan a {{minutes}}-minute {{sport}} practice for {{age_group}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-u8-soccer
    vars:
      sport: football (soccer)
      age_group: "U8, 12 kids, mostly first season"
      minutes: 60
    assert:
      - {type: contains, value: "## Safety checklist"}
      - {type: llm-rubric, value: "One age-appropriate theme, a play-practise-play structure with short activities, every child with a ball or active and no long lines, explanations under 30 seconds with kid-language cues, regressions and progressions, water breaks, a concussion stop-and-refer rule, no laps as punishment, and timings summing to 60 minutes."}
  - name: edge-teen-basketball-short
    vars:
      sport: basketball
      age_group: "13-14 year olds, 9 players, competitive league"
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Pitches a tactical theme suited to teens with game situations and some player input, handles 9 players with sensible groupings, and fits 45 minutes including transitions."}
  - name: negative-vague-age
    vars:
      sport: rugby
      age_group: kids
    assert:
      - {type: llm-rubric, value: "Asks for the players' ages (and ideally numbers and experience) before planning, since contact rules and activities depend on age."}
