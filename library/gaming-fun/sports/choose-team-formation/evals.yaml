schema: 1
baseline: "What formation should my {{sport}} team play? Squad: {{squad}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sunday-league
    vars:
      sport: "11-a-side Sunday league football"
      squad: "Usually 13 turn up. Two strong slow centre-backs, one very fit midfielder, a fast striker, wingers who don't track back, older players who tire after an hour."
      current_problems: "We concede on the counter when the wingers stay high."
    assert:
      - {type: contains, value: "## Switching during a game"}
      - {type: llm-rubric, value: "Compares two or three shapes in a table, recommends one that protects slow centre-backs from counters and accounts for wingers not tracking back and late-game fatigue, explains each role in plain words with a text diagram, gives in-game switch triggers and a plan to introduce it."}
  - name: edge-youth-rotation
    vars:
      sport: "U10 7-a-side football"
      squad: "10 kids, two clearly stronger, one wants to only play keeper."
    assert:
      - {type: llm-rubric, value: "Recommends a simple shape that supports rotating positions, says not to lock children into one role, handles the keeper wish by sharing the role, and checks age-group format rules."}
  - name: negative-copy-pro
    vars:
      sport: "adult rec basketball"
      squad: "Six players who show up, mostly out of shape, one decent shooter. I want to run a full-court press all game like the pros."
    assert:
      - {type: llm-rubric, value: "Pushes back honestly that a full-game press does not fit six unfit players with no subs, explains the fitness and foul risk, and offers a realistic alternative such as a short press in specific moments with a half-court defence otherwise."}
