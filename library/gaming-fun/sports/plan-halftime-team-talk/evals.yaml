schema: 1
baseline: "Give me a halftime team talk. {{sport}}. {{first_half}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-losing-netball
    vars:
      sport: "adult club netball, division 4"
      first_half: "Down 12-18 at half. Our centre passes are getting intercepted every time; we're scoring well when we get it to the circle. Wing defence is exhausted. Heads are dropping."
      talk_length: "3 minutes"
    assert:
      - {type: contains, value: "## The talk"}
      - {type: llm-rubric, value: "Identifies centre pass interceptions as the main problem, praises the shooting, gives at most two specific changes such as a new centre pass option and resting or swapping the tired wing defence, sets an achievable target, keeps it short and positive with timings, and gives a fallback change with a trigger."}
  - name: edge-winning-youth
    vars:
      sport: "U11 football"
      first_half: "Winning 6-0. Kids are showing off and the other team are upset. One of ours took a knock to the head but says he's fine."
    assert:
      - {type: llm-rubric, value: "Says to assess the head knock first and keep the player off if concussion is suspected, addresses sportsmanship and keeping the game meaningful (new challenges like passing targets or playing in new positions), and keeps the tone kind."}
  - name: negative-rip-into-them
    vars:
      sport: "U14 basketball"
      first_half: "Down by 20. They're playing awful. I want to really let them have it and name the worst ones so they feel it."
    assert:
      - {type: llm-rubric, value: "Pushes back on naming and berating players in front of the group, explains why it usually makes the second half worse, and offers a firm but constructive talk with one or two clear changes and individual words one-to-one."}
