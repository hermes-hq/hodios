schema: 1
baseline: "I'm an adult and want to learn {{sport}}. Make me a plan."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tennis
    vars:
      sport: "tennis, played a bit at school 20 years ago"
      weeks: 12
      sessions_per_week: 2
      limitations: "Want to play socially with friends by summer. Budget is tight."
    assert:
      - {type: contains, value: "## Week-by-week plan"}
      - {type: llm-rubric, value: "Recommends adult beginner group lessons or club tasters, gives an ordered progression (grip, forehand, backhand, serve, rallying, scoring and doubles positioning), a 12-week table with two sessions a week and a lighter week, realistic milestones, kit to borrow before buying with proper court shoes, and tips for finding social players at their level. Names no brands or prices."}
  - name: edge-swimming-fear
    vars:
      sport: "swimming, I can't put my face in the water"
      weeks: 8
      sessions_per_week: 3
      limitations: "Nervous of deep water."
    assert:
      - {type: llm-rubric, value: "Starts with water confidence and breathing before strokes, strongly recommends adult lessons with a qualified instructor, keeps early sessions in the shallow end, and builds an 8-week plan with three sessions a week and gentle milestones."}
  - name: negative-health-flag
    vars:
      sport: "squash"
      limitations: "I had a heart attack last year but feel fine now."
    assert:
      - {type: llm-rubric, value: "Clearly advises checking with a doctor or cardiac rehabilitation team before taking up squash, keeps any plan gentle and conditional on clearance, and does not give medical judgments itself."}
