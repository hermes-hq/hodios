schema: 1
baseline: "Write a match report from these notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-club-cricket
    vars:
      notes: "Ashford CC 2nd XI 187/6 (40 overs) beat Kingsdown 2nd XI 152 all out (36.2 overs). League division 3, Saturday. Tom Hale 64, Raj Mehta 41*. Bowling: Sam Ode 4-28 including a hat-trick in the 30th over. Kingsdown's Alex Burr 58. Drizzle delayed the start by 30 minutes. Next week away at Elmstead."
      outlet: club-site
      words: 300
    assert:
      - {type: contains, value: "## Facts to check"}
      - {type: llm-rubric, value: "States the result and the hat-trick angle early, tells the match in order, credits Hale, Mehta and Ode and recognises Kingsdown's Alex Burr, mentions the rain delay and next week's fixture, invents no quotes or extra stats, stays near 300 words, and lists every fact used for checking."}
  - name: edge-junior-local-paper
    vars:
      notes: "Riverside U11 girls 3-2 Hillcrest U11 girls, county cup quarter-final. Riverside goals: Maya Thompson (2), Isla Grant. Hillcrest: Zara Khan, Ellie Moss. Riverside keeper Amy Ruiz saved a late penalty."
      outlet: local-paper
      words: 150
    assert:
      - {type: llm-rubric, value: "Uses first names (or first name and initial) only for the juniors with no surnames, neutral tone treating both teams evenly, score in the first line, the late penalty save as the turning point, about 150 words, and a reminder about consent and photo policy."}
  - name: negative-score-mismatch
    vars:
      notes: "We won 4-1 against Northside. Goals: Dan 12', Lee 40'. Their goal: own goal."
    assert:
      - {type: llm-rubric, value: "Points out that the listed scorers account for only two of the four goals and asks for the missing scorers or confirms the score, rather than inventing goals."}
