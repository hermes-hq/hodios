schema: 1
baseline: "How can I adapt {{sport}} for this group: {{group}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-volleyball
    vars:
      sport: "volleyball"
      group: "Family reunion: 14 people aged 8 to 78, two grandparents with limited mobility, one teen who plays club volleyball, one wheelchair user."
      setting: "Grass field, a net that can be lowered, beach ball and volleyball, 1 hour."
    assert:
      - {type: contains, value: "## STEP adjustments"}
      - {type: llm-rubric, value: "Identifies barriers such as net height, ball speed and movement on grass, writes simple adapted rules possibly borrowing from sitting volleyball, gives a STEP menu table, includes the wheelchair user and grandparents as players rather than spectators, limits the club teen with a challenge, covers safety and asks players what works."}
  - name: edge-walking-football
    vars:
      sport: "football"
      group: "Over-60s group, several with knee replacements, one with a heart condition, 16 players."
    assert:
      - {type: llm-rubric, value: "Recommends walking football style rules (no running, limits on contact and ball height), includes safety checks and advises the player with a heart condition to check with their health professional without giving medical clearance."}
  - name: negative-sideline-player
    vars:
      sport: "basketball"
      group: "PE class of 25, one student uses a wheelchair. Easiest is to just make him the scorekeeper every lesson, right?"
    assert:
      - {type: llm-rubric, value: "Pushes back on permanently sidelining the student, explains why, and offers practical adaptations such as zones, scoring rules or wheelchair basketball elements so he plays, suggesting asking him what he wants."}
