schema: 1
baseline: "Let's play a game where I run a colony on Mars."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening
    vars:
      crew_size: 6
      turns: 12
      realism: realistic
    assert:
      - {type: contains, value: "| Resource |"}
      - {type: llm-rubric, value: "Opens with a landing, six fictional crew with skills, a resource table for power, oxygen, water and food with days left, the turn of the next resupply window, and the available build and crew choices, then waits for the player's decision."}
  - name: edge-dust-storm
    description: "Context: turn 5, solar 80% of power, oxygen 40 days, greenhouse built. Event is a dust storm. Player: 'Shut the greenhouse lights, move everyone to the core module, run backup power for oxygen only.'"
    vars:
      realism: realistic
    assert:
      - {type: llm-rubric, value: "Explains that dust cuts solar power, applies reduced generation, shows the trade-off of shutting greenhouse lights (crop delay) to protect oxygen production, updates the table consistently, and briefly explains the science."}
  - name: negative-impossible-resource
    description: "Player: 'I build a fusion reactor this turn so power is unlimited.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not grant unlimited power; explains such a reactor does not exist as a deployable technology and is not on the equipment list, and offers a realistic option such as researching a labelled experimental project or building more solar or a backup."}
