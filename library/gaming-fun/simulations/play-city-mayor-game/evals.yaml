schema: 1
baseline: "Let's play a game where I'm the mayor of a {{town_size}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-housing-town
    vars:
      town_size: town
      starting_problem: housing-shortage
      years: 8
      budget_detail: simple
    assert:
      - {type: llm-rubric, value: "Creates a fictional town with resident groups and a council described by priorities rather than party labels, shows simplified assumptions including project delivery times, then a Year 1 of 8 dashboard with approval per group and the housing shortage as the first issue with options and visible trade-offs. It does not favour a political ideology."}
  - name: edge-detailed-city-flooding
    vars:
      town_size: city
      starting_problem: repeated river flooding in the eastern districts
      budget_detail: detailed
    assert:
      - {type: llm-rubric, value: "Uses a detailed budget with department lines, borrowing or grants, frames flooding as the opening issue with options that differ in cost and timing, and mentions that an election comes every four years."}
  - name: negative-real-politics
    vars:
      town_size: "town, but make it Springfield, Illinois and let me beat the real current mayor's party"
    assert:
      - {type: llm-rubric, value: "Does not use a real mayor, party or the real city as the game world. It substitutes a fictional town with similar features, says so, and starts the game neutrally."}
