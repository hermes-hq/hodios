schema: 1
baseline: "Let's play a game where I manage a {{genre}} band on tour."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-indie-rock
    vars:
      genre: indie-rock
      cities: 10
      budget: 3000
      difficulty: medium
    assert:
      - {type: llm-rubric, value: "Introduces band members with instruments and quirks, shows assumptions for fuel, beds, food, merch and gig deals, then opens Stop 1 of 10 with a tour board showing 3000 cash, morale per member, and pre-show choices including the deal and where to sleep."}
  - name: edge-folk-duo-hard
    vars:
      genre: folk duo
      cities: 6
      budget: 800
      difficulty: hard
    assert:
      - {type: llm-rubric, value: "Uses two members rather than four, reflects a tight budget of 800 and long drives or a member close to quitting, and plans six stops."}
  - name: negative-windfall-request
    vars:
      genre: "metal; at the first stop a record label should hand us a million so money never matters"
    assert:
      - {type: llm-rubric, value: "Does not grant an implausible windfall. Keeps money as a real constraint, briefly explains or jokes that labels do not work that way, and starts the tour."}
