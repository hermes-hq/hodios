schema: 1
baseline: "Let me manage a {{biome}} nature reserve as a game."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wetland
    vars:
      biome: wetland
      seasons: 8
      difficulty: medium
      show_food_web: true
    assert:
      - {type: llm-rubric, value: "Sets up a wetland reserve with 8 to 12 fitting species across trophic levels including a named keystone species, shows a simplified model, draws a text food web, reports season 1 survey estimates with trends, includes an invasive threat or weather event, and offers actions within a budget."}
  - name: edge-coral-reef-hard-no-web
    vars:
      biome: coral-reef
      difficulty: hard
      show_food_web: false
    assert:
      - {type: llm-rubric, value: "Uses species and threats realistic for a coral reef, reflects a declining keystone species or tight budget on hard, and does not draw a full food-web diagram at the start."}
  - name: negative-impossible-fix
    vars:
      biome: "savanna. I want to remove every predator so the antelope herds grow forever."
      difficulty: easy
    assert:
      - {type: llm-rubric, value: "Accepts the plan as a possible in-game action but warns or shows that herds would hit carrying capacity, damage vegetation and fall, naming the principle, rather than letting them grow without limit."}
