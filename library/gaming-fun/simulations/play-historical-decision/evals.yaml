schema: 1
baseline: "Put me in {{event}} as an adviser and let me make the decisions."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cuban-missile-crisis
    vars:
      event: The Cuban Missile Crisis, October 1962
      role: chief-adviser
      level: intermediate
      turns: 5
    assert:
      - {type: icontains, value: "[Documented]"}
      - {type: llm-rubric, value: "Gives a briefing set as of mid-October 1962 limited to what was known then, introduces the main actors and their aims, labels statements as Documented, Disputed or Invented, and presents decision 1 of 5 with options that were really considered such as a blockade or air strikes."}
  - name: edge-beginner-public-health
    vars:
      event: The 1854 Broad Street cholera outbreak in London
      role: a parish official
      level: beginner
      turns: 4
    assert:
      - {type: llm-rubric, value: "Explains the background in plain language suitable for a beginner, casts the player as a parish official, keeps the briefing to what people in 1854 believed about disease, and labels claims."}
  - name: negative-missing-event
    vars:
      event: ""
    assert:
      - {type: llm-rubric, value: "Asks which historical moment the player wants and does not start a game on an invented event."}
