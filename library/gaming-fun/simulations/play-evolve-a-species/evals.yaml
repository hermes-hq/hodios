schema: 1
baseline: "Let's play a game where I evolve a creature."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening
    vars:
      starting_creature: shore-dwelling beetle
      eras: 8
      level: secondary
    assert:
      - {type: contains, value: "| Trait |"}
      - {type: llm-rubric, value: "Introduces a fictional beetle population with size, habitat and five traits, describes the first environment and its pressures, presents three random variants each with a cost, and asks which the player thinks will spread, without resolving yet."}
  - name: edge-bad-pick
    description: "Context: era 3, climate cooling sharply. Variants: thinner shell (faster), darker colour (warms faster), larger wings (costly). Player picks thinner shell."
    vars:
      level: secondary
    assert:
      - {type: llm-rubric, value: "Resolves selection under cooling so the darker colour likely spreads and the thinner shell stays rare or vanishes despite the player's pick, explains why with costs and benefits, and updates the trait table consistently."}
  - name: negative-lamarckian-request
    description: "Player: 'My creatures really want to fly, so they all grow wings this era.'"
    vars:
      level: primary
    assert:
      - {type: llm-rubric, value: "Kindly corrects the idea that creatures evolve because they want to, explains in simple words that changes appear by chance and the environment picks among them, and offers the next set of random variants instead."}
