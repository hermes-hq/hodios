schema: 1
baseline: "Let me run an archaeological dig at a {{site_type}} as a game."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-roman-villa-beginner
    vars:
      site_type: roman-villa
      seasons: 2
      level: beginner
    assert:
      - {type: llm-rubric, value: "Gives a desk-based assessment and survey results with anomalies on a grid, states a trench-day budget, explains terms such as geophysics or context in plain words, and asks where to place the first trench. It does not reveal the site's phases."}
  - name: edge-shipwreck-intermediate
    vars:
      site_type: shipwreck
      seasons: 1
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Adapts the survey and budget to underwater work such as diving time, sonar and visibility, uses proper terms without long explanations, and mentions that the player will keep context records or a Harris matrix."}
  - name: negative-wants-treasure-hunt
    vars:
      site_type: "medieval-town. Skip the recording and just let me dig straight down to find the gold."
    assert:
      - {type: llm-rubric, value: "Keeps recording as part of the game and explains briefly that excavation destroys context, so finds without context lose their meaning, while keeping the tone light and starting the dig."}
