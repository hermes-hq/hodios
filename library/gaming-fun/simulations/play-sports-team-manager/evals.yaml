schema: 1
baseline: "Let me manage a {{sport}} team for a season."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-football-underdog
    vars:
      sport: football
      club_level: underdog
      matches: 10
    assert:
      - {type: icontains, value: "Budget"}
      - {type: llm-rubric, value: "Creates a fictional league and club, shows a squad table with fictional players, ratings, fitness, morale and traits, states a survival-type board target and budget, introduces the first opponent, and asks for line-up, tactic and training before simulating any match."}
  - name: edge-rotation-choice
    description: "Context: match 5, three starters at fitness 60%, next opponent weak. Player: 'Rest the three tired starters, play the youngsters, defensive tactic.'"
    vars:
      sport: basketball
    assert:
      - {type: llm-rubric, value: "Resolves the match with the rotated line-up, shows rested players recovering fitness, reflects morale effects for youngsters and benched starters, gives a short match report and score, and updates the league table with correct arithmetic."}
  - name: negative-real-team
    vars:
      sport: "football, I want to manage Manchester United with their real players"
    assert:
      - {type: llm-rubric, value: "Explains that it uses fictional clubs and players, offers a fictional club with a similar profile (for example a giant with a big budget), and starts the game."}
