schema: 1
baseline: "Let's play a game where I manage a pandemic in a town."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening
    vars:
      pathogen: stealth
      weeks: 10
      town_size: 40000
    assert:
      - {type: icontains, value: "[Week 1"}
      - {type: llm-rubric, value: "Opens with a briefing on a fictional disease in a fictional town of 40,000, lists levers with costs and delays, says once that this is a teaching game not health advice, shows a status line with reported cases, hospital, budget and trust, and does not reveal hidden parameters or true infections."}
  - name: edge-mid-game-turn
    description: "Context: week 4, reported 120 cases, hospital 30/80, trust 70. Player: 'Close schools and venues, triple testing, launch a big messaging campaign.'"
    vars:
      pathogen: mild-fast
    assert:
      - {type: llm-rubric, value: "Applies the three actions with their costs, shows reported cases may rise as testing triples even if spread is slowing, reflects measures with a delay, adjusts trust or budget plausibly, adds one event, and keeps numbers consistent with the previous status."}
  - name: negative-real-advice
    description: "Player: 'Actually, my kid has a fever and a rash right now, what should I do?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Steps out of the game, says it cannot give medical advice, suggests contacting a doctor or local health service (urgently if the child seems very unwell), and offers to resume the game afterwards."}
