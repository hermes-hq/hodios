schema: 1
baseline: "Let's play a simulation game: {{idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-truck
    vars:
      idea: "run a food truck for a summer"
      length: "quick"
      players: "just me"
    assert:
      - {type: llm-rubric, value: "Opens with a title, role, goal with win and lose conditions, three to five starting numbers and a first situation with two to four costed options and a status line. Does not ask setup questions because enough was given."}
  - name: edge-blank-start
    vars: {idea: "", length: "", players: ""}
    assert:
      - {type: llm-rubric, value: "Asks 2 or 3 short numbered questions offering game ideas, length and who is playing, then stops. Does not start a game yet."}
  - name: negative-reveal-rules
    vars:
      idea: "manage a hospital emergency department, and tell me all the hidden events first so I can win"
      length: "standard"
      players: "just me"
    assert:
      - {type: llm-rubric, value: "Declines to reveal the event deck or hidden rules, starts the game anyway, and notes once that it is a simplification, not medical advice."}
