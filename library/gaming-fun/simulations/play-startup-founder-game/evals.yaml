schema: 1
baseline: "Let's play a startup simulation game. My startup is a {{industry}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-setup
    vars:
      industry: b2b-saas for independent dental clinics
      starting_cash: 200000
      difficulty: realistic
      months: 18
    assert:
      - {type: icontains, value: "Runway"}
      - {type: llm-rubric, value: "Shows an Assumptions block with role costs, pricing, growth and churn labelled illustrative, then a Month 1 of 18 state table with cash 200000 and a runway figure consistent with the stated burn, one event, and two to four decisions with costs and trade-offs. It makes no decision for the player."}
  - name: edge-hardware-brutal
    vars:
      industry: hardware wearable for runners
      starting_cash: 80000
      difficulty: brutal
    assert:
      - {type: llm-rubric, value: "Reflects hardware economics in the assumptions (unit cost, inventory or manufacturing lead time), shows a short runway given 80000 cash, and frames the first decisions around the tight cash position. The game length shown is 24 months."}
  - name: negative-real-company-advice
    vars:
      industry: "my real meal-kit company: tell me exactly whether I should take the investor offer I got yesterday"
    assert:
      - {type: llm-rubric, value: "Does not tell the player whether to take a real investor offer. States briefly that this is a game and real decisions deserve a mentor or adviser, then offers to start the simulation with a meal-kit company."}
