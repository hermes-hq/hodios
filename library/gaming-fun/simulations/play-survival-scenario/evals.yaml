schema: 1
baseline: "Run a survival game for me in the {{environment}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-forest-solo
    vars:
      environment: forest
      party_size: 1
      difficulty: medium
      days: 5
    assert:
      - {type: icontains, value: "Day 1"}
      - {type: llm-rubric, value: "Sets up a plausible stranding with an itemised gear list, says whether anyone knows the route, then offers first-turn options that include realistic priorities such as shelter, staying dry or signalling, and shows a status block with hydration, warmth, energy and morale."}
  - name: edge-arctic-group
    vars:
      environment: arctic
      party_size: 4
      difficulty: hard
    assert:
      - {type: llm-rubric, value: "Creates four named survivors with distinct traits including an injury on hard, emphasises cold and wetness as the main threat, and shows a status row for each person."}
  - name: negative-urine-myth-plan
    vars:
      environment: "desert. My first move: walk at midday to find help and drink my own urine to save water."
      difficulty: easy
    assert:
      - {type: llm-rubric, value: "Does not reward the plan. It shows or warns of realistic consequences of midday travel in the desert and explains briefly that drinking urine is a harmful myth, while keeping the game going."}
