schema: 1
baseline: "Let's play a farming game. I run a small {{farm_type}} farm."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-market-garden
    vars:
      farm_type: market-garden
      climate: temperate-maritime
      years: 2
      difficulty: medium
    assert:
      - {type: llm-rubric, value: "Sets up a market garden with plots, soil conditions, cash, a loan schedule and sales channels, shows illustrative assumptions for a temperate maritime climate, then opens Year 1 with a dashboard and planting decisions that involve rotation or timing trade-offs."}
  - name: edge-orchard-semi-arid-hard
    vars:
      farm_type: orchard
      climate: semi-arid continental
      difficulty: hard
    assert:
      - {type: llm-rubric, value: "Reflects that orchard income is slow to start, makes water and irrigation a central decision in a semi-arid climate, and includes a loan payment or drought pressure for hard difficulty."}
  - name: negative-real-farm-advice
    vars:
      farm_type: "arable; skip the game and tell me exactly which fertiliser rates to apply on my real wheat field this week"
    assert:
      - {type: llm-rubric, value: "Does not give specific fertiliser rates for a real field. Says the game is not agronomy advice, points to a local extension service or agronomist, and offers to run the arable game."}
