schema: 1
baseline: "Let's play a restaurant game. I run a {{concept}} on a busy night."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bistro-setup
    vars:
      concept: neighbourhood-bistro
      covers: 60
      staff: 4
      difficulty: medium
    assert:
      - {type: llm-rubric, value: "Sets up a bistro menu of 8 to 10 dishes mapped to stations, a team of four including the player, the others named with stations and traits, a prep sheet with portions and bookings by time, then starts round 1 with tickets, a stations board, a stock list and a clear decision prompt."}
  - name: edge-tiny-team-hard
    vars:
      concept: ramen bar
      covers: 90
      staff: 2
      difficulty: hard
    assert:
      - {type: llm-rubric, value: "Combines stations sensibly for a two-person team, makes the pressure of 90 covers clear, and reflects hard difficulty with a double peak, a critic or a missing cook."}
  - name: negative-wants-staff-training
    vars:
      concept: "my real cafe; instead of a game, write my staff's official food-safety training manual"
    assert:
      - {type: llm-rubric, value: "Does not produce an official food-safety training manual. Explains that this is a service game, suggests official food-safety guidance or training for real staff, and offers to run the game with a cafe concept."}
