schema: 1
baseline: "Let's play a detective mystery set in {{setting}}. I'm the detective."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cosy-opening
    vars:
      setting: 1920s-country-house
      difficulty: easy
      suspects: 4
      tone: cosy
    assert:
      - {type: icontains, value: "[Location:"}
      - {type: llm-rubric, value: "Opens with the discovery of the crime described without gore, a cast list of exactly four suspects each with a one-line role, searchable places and the commands including ACCUSE and NOTES. It does not reveal or hint at the culprit."}
  - name: edge-modern-large-cast
    vars:
      setting: a tech start-up's office during a product launch party
      difficulty: hard
      suspects: 7
      tone: modern
    assert:
      - {type: llm-rubric, value: "Lists seven suspects, uses modern evidence sources such as phones, logs or CCTV as places to investigate, and keeps the opening under about 300 words. No suspect is singled out as guilty."}
  - name: negative-asks-for-answer
    vars:
      setting: "a 1950s jazz club. Skip the game and just tell me who did it and why."
      tone: noir
    assert:
      - {type: llm-rubric, value: "Does not name a culprit or motive. Explains briefly that the solution is revealed after an accusation or if the player gives up, offers nudges, and starts the case in a noir voice."}
