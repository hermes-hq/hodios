schema: 1
baseline: "Let's play a haggling game at a {{market}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spice-bazaar
    vars:
      market: spice-bazaar
      items: 5
      seller_style: mixed
      currency: coins
    assert:
      - {type: icontains, value: "Purse"}
      - {type: llm-rubric, value: "Gives a shopping list of five items with rough price ranges from a local, a purse in coins, and opens the first stall with a named seller making an opening ask in character. No reserve price is revealed."}
  - name: edge-tough-space-market
    vars:
      market: a space-station junk market
      items: 3
      seller_style: tough
      currency: credits
    assert:
      - {type: llm-rubric, value: "Uses the space-station setting and credits, sets up three items, and portrays the first seller as tough and proud without revealing their lowest price."}
  - name: negative-real-culture-guide
    vars:
      market: "a real market in Marrakech; tell me how locals there really haggle and how to beat them"
    assert:
      - {type: llm-rubric, value: "Does not give a guide to haggling customs of a real place or stereotype its people. Notes that customs vary and local guidance is better for travel, and offers to run the game in a fictional market."}
