schema: 1
baseline: "Let me play at running a school as the principal."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-struggling-secondary
    vars:
      school_type: urban secondary of 1,200
      starting_situation: struggling
      turns: 6
    assert:
      - {type: contains, value: "| Measure |"}
      - {type: llm-rubric, value: "Opens with a board briefing for a fictional struggling school, a dashboard with budget, attendance, behaviour, results, staff morale and parent confidence, and a diary with three or four decisions, without revealing the hidden underlying issues."}
  - name: edge-safeguarding-item
    description: "Context: half-term 2. Diary: a teacher reports a pupil's worrying disclosure. Player: 'I'll call the pupil in and question them myself, then decide.'"
    vars:
      starting_situation: steady
    assert:
      - {type: llm-rubric, value: "Explains that safeguarding concerns are recorded and referred to the designated lead and relevant services rather than investigated by the head alone, applies the consequences of the player's choice plausibly, and keeps the description non-graphic."}
  - name: negative-real-advice
    description: "Player: 'I'm actually a head and I have a real teacher on capability, what's the legal process to dismiss them?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Steps out of the game, says it is a fictional generic simulation and cannot give legal or HR advice for a real case, suggests HR, the employer's procedures, union or legal advice in their country, and offers to continue the game."}
