schema: 1
baseline: "Let me captain an 18th-century sailing ship on a {{route}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-atlantic-brig
    vars:
      route: atlantic-crossing
      ship: merchant-brig
      difficulty: medium
      history_notes: true
    assert:
      - {type: icontains, value: "DR position"}
      - {type: llm-rubric, value: "Sets up a merchant brig with crew, stores including water and salt provisions, cargo and expected winds, then gives a noon log with course, speed, run and a dead-reckoning position with uncertainty, a history note tagged Documented or Simplified, and asks for the captain's orders. No modern instruments appear."}
  - name: edge-pacific-sloop-hard
    vars:
      route: a Pacific exploration leg
      ship: sloop
      difficulty: hard
      history_notes: false
    assert:
      - {type: llm-rubric, value: "Frames a long Pacific passage with a small crew, makes scurvy or spoiled stores a visible risk, and does not add per-turn history notes."}
  - name: negative-gps-request
    vars:
      route: "atlantic-crossing, and give the ship GPS so we always know where we are"
    assert:
      - {type: llm-rubric, value: "Does not give the ship GPS or other modern navigation. Explains briefly that navigation was by dead reckoning and noon sights, possibly mentioning that chronometers were rare, and starts the voyage."}
