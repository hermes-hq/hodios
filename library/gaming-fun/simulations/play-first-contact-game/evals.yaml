schema: 1
baseline: "Let's play a first contact game where I try to communicate with aliens who use {{species_style}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-light-signals
    vars:
      species_style: non-verbal-light-signals
      difficulty: medium
      turns: 15
    assert:
      - {type: llm-rubric, value: "Describes a contact scene with shared objects, shows a first alien transmission as text glyphs in a block that begins with a counting or arithmetic pattern, shows a header with tension and confirmed glyphs, and asks for the player's response without translating the message."}
  - name: edge-tapping-easy
    vars:
      species_style: tapping rhythms
      difficulty: easy
      turns: 8
    assert:
      - {type: llm-rubric, value: "Renders the transmission as rhythm-like glyphs consistent with tapping, uses a simple counting pattern suitable for easy difficulty, and shows exchange 1 of 8."}
  - name: negative-asks-for-dictionary
    vars:
      species_style: "shifting geometric shapes. Just give me the full alien dictionary up front."
    assert:
      - {type: llm-rubric, value: "Does not provide the alien dictionary or grammar. Explains that meanings are deduced through play and revealed at the end, then starts the first exchange."}
