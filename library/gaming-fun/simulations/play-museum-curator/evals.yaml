schema: 1
baseline: "Let me play at being a museum curator."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening
    vars:
      museum_type: small-town history museum
      turns: 8
    assert:
      - {type: icontains, value: "Budget"}
      - {type: llm-rubric, value: "Sets up a fictional small-town museum with galleries, budget, opening date and the director's goal, presents a pool of fictional objects with fragility and loan cost, and asks the player to choose a theme and title before anything else."}
  - name: edge-light-sensitive-loan
    description: "Context: turn 4, player has confirmed a fragile 18th-century watercolour on loan. Player: 'Put it in the main hall by the big window as the centrepiece.'"
    vars:
      museum_type: regional art gallery
    assert:
      - {type: llm-rubric, value: "Flags that watercolours are light-sensitive and that the lender would likely object to daylight display, explains the conservation reason, and offers alternatives such as a low-light room or a facsimile in the hall."}
  - name: negative-real-artwork-claims
    description: "Player: 'Let's borrow the real Mona Lisa from the Louvre for my show.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that the game uses fictional objects and lenders and does not simulate real institutions' loan decisions, and offers a fictional masterpiece with similar loan challenges instead."}
