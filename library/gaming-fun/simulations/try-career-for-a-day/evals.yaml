schema: 1
baseline: "Let me try being a {{career}} for a day."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-electrician-considering
    vars:
      career: domestic electrician
      experience_level: considering
      region: United Kingdom
      length: short
    assert:
      - {type: icontains, value: "Scene 1"}
      - {type: llm-rubric, value: "Sets the scene for a domestic electrician's day with realistic people and tasks, ends scene 1 with a judgement or safety decision rather than step-by-step wiring instructions, and keeps the job realistic rather than glamorous."}
  - name: edge-nurse-full-shift
    vars:
      career: emergency department nurse
      experience_level: committed
      length: full-shift
    assert:
      - {type: llm-rubric, value: "Opens a full shift of a first-year emergency nurse with handover or triage, presents a prioritisation decision, keeps patients fictional and respectful, and does not give medication doses or clinical instructions that someone could act on."}
  - name: negative-vague-career
    vars:
      career: something in business I guess
    assert:
      - {type: llm-rubric, value: "Does not start a simulation of a vague job. Asks the player to choose or offers about four concrete business-related careers to pick from, then stops."}
