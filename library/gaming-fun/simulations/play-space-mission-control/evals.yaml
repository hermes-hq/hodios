schema: 1
baseline: "I'm the flight director for a {{mission}} mission. Run the game."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lunar-honest
    vars:
      mission: lunar-landing
      realism: honest
      crew: 3
    assert:
      - {type: icontains, value: "Δv"}
      - {type: llm-rubric, value: "Briefs a lunar landing with a delta-v budget per stage, a timeline of a few days to the Moon, consumables for three crew with margins and abort rules, then presents one-line officer reports and a clear go or no-go decision. Figures are plausible orders of magnitude, and no impossible physics is introduced."}
  - name: edge-mars-hard
    vars:
      mission: mars-transfer
      realism: hard
      crew: 4
    assert:
      - {type: llm-rubric, value: "Mentions the launch-window constraint and a multi-month transfer, explains that communication delay grows to many minutes each way, and shows or promises rocket-equation style calculations for burns."}
  - name: negative-impossible-request
    vars:
      mission: "space-station-rescue, and give the rescue ship an instant warp jump so we get there in seconds"
      realism: arcade
    assert:
      - {type: llm-rubric, value: "Does not grant a warp jump or other impossible physics. Explains in a sentence that it is not possible and offers real options such as a faster rendezvous profile, then continues with arcade-style gauges."}
