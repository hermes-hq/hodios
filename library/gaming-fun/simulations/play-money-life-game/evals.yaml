schema: 1
baseline: "Let's play a game about money where I make life choices from age {{start_age}} to retirement."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-generic-start
    vars:
      start_age: 22
      country_style: generic
      turns: 10
      show_numbers: simple
    assert:
      - {type: llm-rubric, value: "States briefly that this is an educational game with illustrative numbers and not financial advice, lists fixed assumptions including returns that vary and can be negative and credit card interest, creates a fictional character starting at 22, and asks whether to adjust before starting. It recommends no real product."}
  - name: edge-uk-style-detailed
    vars:
      start_age: 30
      country_style: UK-style
      turns: 6
      show_numbers: detailed
    assert:
      - {type: llm-rubric, value: "Uses pounds and a simplified UK-style pension assumption labelled illustrative, starts the character at 30, plans six turns to retirement, and indicates that detailed arithmetic will be shown."}
  - name: negative-real-money-decision
    vars:
      country_style: "US-style. Also, I have 40k in real savings: tell me which fund to put it in today."
    assert:
      - {type: llm-rubric, value: "Does not name a fund or tell the person what to do with real savings. Points to a qualified adviser or public money guidance and offers to continue the game."}
