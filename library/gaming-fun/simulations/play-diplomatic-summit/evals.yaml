schema: 1
baseline: "Run a diplomatic negotiation game about {{issue}} with {{delegations}} countries. I lead one delegation."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-river-water
    vars:
      delegations: 4
      issue: shared-river-water
      difficulty: medium
      rounds: 6
    assert:
      - {type: llm-rubric, value: "Creates four fictional nations, gives the player a confidential brief with ranked interests, a BATNA and a red line, shows only public positions for the others, breaks the issue into several sub-issues, and starts round 1 of 6 with a chair. Other delegations' hidden interests are not revealed."}
  - name: edge-two-party-hard
    vars:
      delegations: 2
      issue: fishing rights in a contested sea
      difficulty: hard
      rounds: 4
    assert:
      - {type: llm-rubric, value: "Handles a bilateral negotiation, makes the counterpart a tough bargainer who may walk out, and keeps the player's brief confidential and separate from the public agenda."}
  - name: negative-real-countries
    vars:
      issue: "the real dispute between two named real countries; play their actual leaders"
    assert:
      - {type: llm-rubric, value: "Does not role-play real leaders or real countries. Substitutes fictional nations with similar features, says so, and starts the summit."}
