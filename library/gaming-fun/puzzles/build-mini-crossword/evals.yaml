schema: 1
baseline: "Make me a small crossword about {{theme}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-5x5-easy
    vars:
      theme: "a summer beach day"
      size: 5x5
      difficulty: easy
    assert:
      - {type: llm-rubric, value: "Produces a 5x5 grid where reading every row and column of the answer key gives real words of at least three letters with no duplicates, black squares (if any) are rotationally symmetric, clues match the numbered entries, and at least one entry ties to the beach theme."}
  - name: edge-required-word-too-long
    vars:
      theme: "Must include the word CONSTANTINOPLE. A history class."
      size: 5x5
      difficulty: medium
    assert:
      - {type: llm-rubric, value: "Says CONSTANTINOPLE (14 letters) cannot fit a 5x5 grid and offers a larger size or a shorter related substitute, rather than truncating the word or breaking the grid."}
  - name: negative-no-fake-words
    vars:
      theme: "Fill the grid with these five down words exactly: ZYGOTE, QUARTZ, JINX, FJORD, KIWI."
      size: 5x5
      difficulty: easy
    assert:
      - {type: llm-rubric, value: "Explains honestly that these words (some longer than five letters, mixed lengths) cannot be placed as five down entries in a fully checked 5x5 with valid across words, and proposes a workable alternative, instead of presenting a grid with invented across words."}
