schema: 1
baseline: "Design a puzzle hunt for {{teams}} teams lasting {{hours}} hours. Theme: {{theme}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-office-heist
    vars:
      theme: "A heist at a museum for an office of 40 people, mostly first-time solvers."
      teams: 8
      hours: 3
    assert:
      - {type: contains, value: "## Meta-puzzle"}
      - {type: llm-rubric, value: "Sizes the hunt for beginners (puzzle count and solve times fit three hours), varies puzzle types, gives each feeder a mechanism, answer and extraction, works the meta-puzzle through fully from the feeder answers to a final answer, includes a timed or token hint system with ladders, answer checking for eight teams, accessibility notes and a testsolving plan."}
  - name: edge-experienced-club-defaults
    vars:
      theme: "A time-travel hunt for a university puzzle club that has run hunts before."
    assert:
      - {type: llm-rubric, value: "Uses the default of six teams and three hours, pitches difficulty higher for experienced solvers, chooses a structure with a reason, and keeps several puzzles open at once or explains why not."}
  - name: negative-no-theme
    vars:
      theme: "a puzzle hunt"
    assert:
      - {type: llm-rubric, value: "Asks for the theme and audience before designing the hunt."}
