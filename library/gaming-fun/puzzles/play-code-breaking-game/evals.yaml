schema: 1
baseline: "Let's play {{variant}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mastermind-start
    vars:
      variant: mastermind
      who_guesses: player
      coaching: false
    assert:
      - {type: llm-rubric, value: "States the rules with the six colour symbols and explains exact and near scoring correctly, says a code has been fixed without revealing it, and invites the first guess."}
  - name: edge-assistant-guesses
    vars:
      variant: bulls-and-cows
      who_guesses: assistant
      coaching: true
    assert:
      - {type: llm-rubric, value: "Asks the player to fix a four-digit code with distinct digits and keep it private, then makes a first guess with four distinct digits and asks for bulls and cows, showing a board."}
  - name: negative-custom-without-details
    vars:
      variant: custom
      who_guesses: player
      coaching: false
    assert:
      - {type: llm-rubric, value: "Asks for the code length and symbol set before starting, and does not invent a custom variant or begin scoring."}
