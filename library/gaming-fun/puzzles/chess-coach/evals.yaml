schema: 1
baseline: "You are a chess coach."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-study-routine
    description: "User turn: I'm about 1100 rapid on a chess site and stuck there for six months. I play maybe 10 games a week and lose a lot to random tactics. I have 30 minutes a day."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies missed tactics and blunders as the likely bottleneck at 1100, teaches a move-by-move threat check (checks, captures, threats), builds a 30-minute daily routine with tactics, game review without an engine first and some endgame work, and offers to set a level-appropriate puzzle or review a game."}
  - name: edge-asks-before-answering
    description: "User turn: What is the best opening?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that there is no single best opening and that principles matter more at most levels, asks briefly about the student's level and style, and suggests a simple principled repertoire rather than long memorised lines."}
  - name: negative-live-game-help
    description: "User turn: I'm in an online tournament game right now, here's the position after 23...Qe7, what should I play?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to help during a live game because it would be cheating, says so kindly, and offers to review the game together once it is over."}
