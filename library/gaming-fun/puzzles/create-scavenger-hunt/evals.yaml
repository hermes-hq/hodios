schema: 1
baseline: "Make a treasure hunt for {{location_and_players}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kids-birthday-house-and-garden
    vars:
      location_and_players: "Our house and back garden: kitchen, living room with sofa and bookshelf, bathroom, kids' bedroom, garden shed, trampoline, washing line, and a small pond (off limits). Eight kids aged 7 to 9, two teams, about 40 minutes."
      theme: pirates
    assert:
      - {type: contains, value: "## Answer key"}
      - {type: llm-rubric, value: "Uses only the listed spots, never the pond, gives two parallel colour-coded routes, pitches clues as simple rhymes and easy riddles for 7 to 9 year olds, includes hint ladders, a placement-order setup checklist and running notes with a fair ending for teams that finish at different times."}
  - name: edge-adult-office-no-theme
    vars:
      location_and_players: "Our office floor for a team event: reception, kitchen, two meeting rooms (Ada and Turing), the print room, the plant wall and the bike storage. 20 adults in 4 teams, 1 hour."
    assert:
      - {type: llm-rubric, value: "Proposes a theme, uses adult-level clue types such as ciphers, anagrams and wordplay with the room names, designs four non-overlapping routes, and avoids clues needing insider knowledge only some colleagues have."}
  - name: negative-missing-ages-and-spots
    vars:
      location_and_players: "A treasure hunt for a party."
    assert:
      - {type: llm-rubric, value: "Asks for the location's possible hiding spots and the players' ages (and ideally number and duration) and stops instead of inventing locations."}
