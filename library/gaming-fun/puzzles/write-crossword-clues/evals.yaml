schema: 1
baseline: "Write {{style}} crossword clues for these answers: {{answers}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-standard-school
    vars:
      answers: "PLANET, VOLCANO, ORBIT, FOSSIL, ECLIPSE. For a school science newsletter, ages 11-13, UK spelling."
    assert:
      - {type: contains, value: "## Fairness notes"}
      - {type: llm-rubric, value: "Writes one standard clue per answer with correct enumerations (6), (7), (5), (6), (7), varied clue types, part of speech matching the answer, difficulty ratings suitable for 11- to 13-year-olds, and a fairness note per clue. No answer appears inside its own clue."}
  - name: edge-cryptic-parsing
    vars:
      answers: "LISTEN, CARPET, TEAPOT"
      style: cryptic
    assert:
      - {type: llm-rubric, value: "Writes cryptic clues for LISTEN, CARPET and TEAPOT, each with a clear definition at one end and a fair device (for example an anagram of SILENT for LISTEN, or a charade such as CAR + PET), a smooth surface, a full parsing, and letter counts that check out. Uses at least two different devices."}
  - name: negative-misspelled-answer
    vars:
      answers: "NECESSARY, ACCOMODATE, RHYTHM"
    assert:
      - {type: llm-rubric, value: "Flags that ACCOMODATE is misspelled (ACCOMMODATE, 11 letters) instead of clueing it as given, and clues the other answers with correct enumerations."}
