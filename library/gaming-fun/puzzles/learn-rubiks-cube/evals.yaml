schema: 1
baseline: "Teach me how to solve a Rubik's Cube."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-never-solved-first-stage
    vars:
      current_level: never-solved
    assert:
      - {type: llm-rubric, value: "Explains Singmaster notation correctly (face turns clockwise as seen facing that face, prime is counterclockwise, 2 is a half turn), explains that centres do not move relative to each other, teaches only the first stage (the white cross with edges matching side centres), and asks the solver to try before moving on."}
  - name: edge-stuck-yellow-cross
    vars:
      current_level: stuck
      details: "First two layers done. On top I see a yellow line going left to right through the centre, nothing else yellow on top except corners."
    assert:
      - {type: icontains, value: "F R U R' U' F'"}
      - {type: llm-rubric, value: "Identifies the yellow-cross stage with the line case, tells the solver to hold the line horizontally and apply F R U R' U' F' once, and explains what they should see after."}
  - name: negative-impossible-state
    vars:
      current_level: stuck
      details: "Everything is solved except one corner on top that is twisted in place, yellow facing the front. My little brother popped pieces out last week."
    assert:
      - {type: llm-rubric, value: "Explains that a single twisted corner cannot be fixed by any algorithm and was likely caused by reassembly or tampering, and suggests physically twisting or reseating that piece, instead of offering an algorithm that claims to fix it."}
