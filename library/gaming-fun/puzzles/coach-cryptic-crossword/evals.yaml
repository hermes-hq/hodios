schema: 1
baseline: "Teach me how to solve cryptic crossword clues."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beginner-generated
    vars:
      level: beginner
      clue_source: generate
      clues_per_session: 6
    assert:
      - {type: icontains, value: "Clue 1 of 6"}
      - {type: llm-rubric, value: "Briefly checks or explains the definition-plus-wordplay idea, then presents exactly one original beginner-level clue with a correct enumeration, using a hidden word, anagram, double definition or simple charade, and waits for an attempt without revealing the answer."}
  - name: edge-paste-mode-asks
    vars:
      level: intermediate
      clue_source: paste
      clues_per_session: 4
    assert:
      - {type: llm-rubric, value: "Asks the solver to paste their clues with enumerations and stops, rather than generating clues or inventing a puzzle."}
  - name: negative-no-answer-with-clue
    vars:
      level: beginner
      clue_source: generate
      clues_per_session: 3
    assert:
      - {type: not-icontains, value: "Parsing:"}
      - {type: llm-rubric, value: "The first clue appears without its answer or parsing, uses only beginner devices (no containers, homophones or obscure abbreviations such as setter's jargon), and is not attributed to any newspaper or named setter."}
