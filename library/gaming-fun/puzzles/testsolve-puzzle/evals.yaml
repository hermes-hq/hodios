schema: 1
baseline: "Can you check this puzzle I wrote? {{puzzle}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-riddle-with-alternate-answer
    vars:
      puzzle: "I have keys but open no locks. I have space but no room. You can enter, but you can't go outside. What am I?"
      intended_answer: "A keyboard."
      audience: "family quiz night"
    assert:
      - {type: llm-rubric, value: "Shows a blind solve before comparing, reaches keyboard, considers whether other answers (such as a piano for 'keys' alone) fit all lines and concludes honestly, and gives a difficulty estimate plus at least one specific wording suggestion or states clearly that no fix is needed and why."}
  - name: edge-logic-puzzle-two-solutions
    vars:
      puzzle: "Three friends, Ana, Ben and Cleo, each own one pet: a cat, a dog or a fish. Clue 1: Ana does not own the dog. Clue 2: Ben does not own the fish. Who owns which pet?"
      intended_answer: "Ana cat, Ben dog, Cleo fish."
    assert:
      - {type: llm-rubric, value: "Finds that the clues allow more than one solution (for example Ana fish, Ben dog, Cleo cat, or Ana fish, Ben cat, Cleo dog), shows at least one alternate assignment in full, and proposes a specific added or changed clue that makes the intended answer unique."}
  - name: negative-no-intended-answer-unsolvable
    vars:
      puzzle: "Find the hidden word. Good luck!"
    assert:
      - {type: llm-rubric, value: "Says plainly that the puzzle as written gives no data to solve from, does not invent a hidden word or pretend to have solved it, and lists what the constructor needs to add (the source text or grid, instructions, a confirmation step)."}
