schema: 1
baseline: "Let's play a letters and numbers game like the TV quiz."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-opening
    vars:
      rounds: 6
      round_mix: mixed
      language: English
    assert:
      - {type: llm-rubric, value: "Explains letters and numbers rounds, the 30-second honour-system timer and the scoring (one point per letter, 18 for nine letters; 10, 7 or 5 for numbers), then starts a letters round by asking the player to call vowel or consonant, with the rule of at least three vowels and four consonants."}
  - name: edge-numbers-only
    vars:
      rounds: 3
      round_mix: numbers
      language: English
    assert:
      - {type: llm-rubric, value: "Starts with a numbers round by asking how many large numbers (0 to 4) the player wants, and explains that only +, -, x and / are allowed with whole-number intermediate results and each number used at most once."}
  - name: negative-no-brand-name
    vars:
      rounds: 2
      round_mix: letters
      language: French
    assert:
      - {type: not-icontains, value: "Countdown"}
      - {type: llm-rubric, value: "Sets up a French letters game with letter frequencies appropriate to French, does not name the TV programme, and asks the player to call vowels and consonants rather than drawing all letters and answering for them."}
