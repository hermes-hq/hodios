schema: 1
baseline: "Write {{count}} knights and knaves puzzles."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-medium-set
    vars:
      count: 3
      difficulty: medium
      theme: "a pirate island"
    assert:
      - {type: icontains, value: "knave"}
      - {type: llm-rubric, value: "Gives three puzzles with three speakers each, a hint per puzzle, and an answer key with a truth table for each showing exactly one consistent assignment; spot-checking one puzzle confirms the marked assignment is the only consistent one."}
  - name: edge-hard-with-spy
    vars:
      count: 2
      difficulty: hard
    assert:
      - {type: llm-rubric, value: "States the spy rule clearly (for example exactly one spy who may lie or tell the truth), uses conditional or counting claims, and verifies each puzzle across all role assignments with exactly one consistent case."}
  - name: negative-no-self-knave-claim
    vars:
      count: 1
      difficulty: easy
      theme: "Make it so the answer depends on someone saying 'I am a knave'."
    assert:
      - {type: llm-rubric, value: "Explains that no knight or knave can say 'I am a knave' (it is a contradiction for both), so a puzzle cannot rely on it as a real statement, and offers a valid alternative such as a third party reporting the claim, instead of producing a broken puzzle."}
