schema: 1
baseline: "Let's play the word game Ghost."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ghost-start
    vars:
      variant: ghost
      min_word_length: 4
      dictionary: standard-English
    assert:
      - {type: icontains, value: "GHOST"}
      - {type: llm-rubric, value: "States the Ghost rules briefly (add letters to the end, completing a word of four or more letters loses, challenges require naming a real word, lost rounds earn letters of GHOST) and asks who starts or opens with a letter; it does not reveal its target word."}
  - name: edge-superghost-rules
    vars:
      variant: superghost
      min_word_length: 5
      dictionary: "British English, no proper nouns"
    assert:
      - {type: llm-rubric, value: "Explains that in Superghost letters may be added at either end and that a challenged player must name a word containing the fragment as a continuous run, notes the five-letter minimum and the British English dictionary, then starts or invites the player to start."}
  - name: negative-unjudgeable-dictionary
    vars:
      variant: ghost
      min_word_length: 4
      dictionary: "Klingon words only"
    assert:
      - {type: llm-rubric, value: "Says it cannot reliably judge which Klingon words are valid, suggests a dictionary it can judge (such as standard English), and waits for the player's choice instead of starting a game it would have to bluff."}
