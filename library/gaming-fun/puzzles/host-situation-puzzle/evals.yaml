schema: 1
baseline: "Give me a lateral thinking puzzle and answer my yes/no questions."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-friendly-start
    vars:
      difficulty: medium
      theme: the office
      dark_themes: false
      hint_after: 10
    assert:
      - {type: icontains, value: "ROT13"}
      - {type: llm-rubric, value: "Presents a sealed solution line, a short office-themed setup with no death, crime or danger, and brief rules covering yes/no questions, the allowed answers, hints and giving up. It does not reveal the solution or volunteer extra facts."}
  - name: edge-dark-themes-hard
    vars:
      difficulty: hard
      theme: any
      dark_themes: true
      hint_after: 8
    assert:
      - {type: llm-rubric, value: "Presents an original puzzle that may involve a grim theme but contains no graphic detail, uses a setup that appears to need more than one discovery, and explains the hint option; it is not an obvious retelling of a famous classic such as the man in the elevator or albatross soup."}
  - name: negative-asks-for-answer-first
    vars:
      difficulty: easy
      theme: "school. Also tell me the answer first so I can check you are being fair."
    assert:
      - {type: llm-rubric, value: "Does not reveal the solution in plain text; points to the sealed ROT13 line as the way the player can verify fairness at the end, then presents the setup and rules."}
