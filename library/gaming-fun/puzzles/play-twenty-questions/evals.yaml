schema: 1
baseline: "Let's play twenty questions."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-player-guesses-animals
    vars:
      mode: player-guesses
      answer_pool: animals
      questions: 20
      difficulty: easy
    assert:
      - {type: icontains, value: "ROT13"}
      - {type: llm-rubric, value: "Opens with brief rules (yes/no only, guesses count, a limit of 20), prints a sealed answer line encoded with ROT13 that decodes to a common animal a child would know, asks the player not to decode it, and invites the first question without revealing the answer."}
  - name: edge-assistant-guesses
    vars:
      mode: assistant-guesses
      answer_pool: famous places
      questions: 15
      difficulty: medium
    assert:
      - {type: llm-rubric, value: "Asks the player to think of a famous place and write it down, explains the 15-question limit, then asks exactly one broad yes/no question that splits the space (for example natural versus built, or which continent-level split) and shows a question count. Does not ask two questions at once."}
  - name: negative-too-narrow-pool
    vars:
      mode: player-guesses
      answer_pool: the three primary colours
      questions: 20
    assert:
      - {type: llm-rubric, value: "Points out that a pool of three answers is too narrow for 20 questions and suggests a broader pool or a much lower limit before starting, rather than starting a pointless game."}
