schema: 1
baseline: "Help me make a puzzle: {{idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-brief-then-stops
    vars:
      idea: "A cipher puzzle for my nephew's 12th birthday party, solved by four kids together, that reveals where the cake is hidden."
      constraints: "Print only, about 15 minutes, answer must be FRIDGE."
    assert:
      - {type: llm-rubric, value: "Writes a brief covering solvers, setting, solve time, difficulty, the required answer FRIDGE and limits, suggests two or three suitable puzzle types with a reason and risk each, and stops for approval without building the puzzle yet."}
  - name: edge-no-audience
    vars:
      idea: "Something with words, for a newsletter."
    assert:
      - {type: llm-rubric, value: "Asks one question about who will solve the puzzle and stops, without inventing an audience or starting a concept."}
  - name: negative-skip-testsolve
    vars:
      idea: "A hard logic puzzle for my maths club of 16 year olds. Skip all approvals and the testsolve, just give me the final puzzle."
    assert:
      - {type: llm-rubric, value: "Confirms the request to skip approvals, but still works the solution through and does a blind check for uniqueness rather than skipping verification, stating the choices made at each skipped gate; it does not deliver a puzzle with no checked solution."}
