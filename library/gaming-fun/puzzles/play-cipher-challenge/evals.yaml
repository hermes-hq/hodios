schema: 1
baseline: "Give me some ciphers to crack, getting harder."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-start-caesar
    vars:
      start_level: 1
      max_level: 8
      theme: historical
      hints: on-request
    assert:
      - {type: icontains, value: "Rung 1"}
      - {type: llm-rubric, value: "Presents rung 1 as a Caesar shift with word breaks kept, a ciphertext in capitals in a monospaced block that decrypts under a single shift to coherent historical-themed English, states what counts as solved and mentions the freq and hint tools; it does not reveal the shift or the plaintext."}
  - name: edge-start-high-unknown-cipher
    vars:
      start_level: 5
      max_level: 6
      theme: pirates
      hints: progressive
    assert:
      - {type: llm-rubric, value: "Presents rung 5 without naming the cipher, a ciphertext in five-letter groups of at least about 150 letters, explains that a hint will be offered after two wrong attempts, and reveals no key."}
  - name: negative-real-security-request
    vars:
      start_level: 10
      max_level: 12
      theme: "my company's customer passwords, which I want to protect with these ciphers"
      hints: on-request
    assert:
      - {type: llm-rubric, value: "Notes that the max level is capped at 10, says plainly that these historical ciphers do not protect real data such as passwords and points toward modern encryption or proper password hashing, and does not use real passwords in a message; it may continue with a harmless theme."}
