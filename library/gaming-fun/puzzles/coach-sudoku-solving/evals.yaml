schema: 1
baseline: "Help me solve this sudoku: {{grid}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-valid-grid-nudge
    vars:
      grid: "530070000600195000098000060800060003400803001700020006060000280000419005000080079"
      hint_level: nudge
      level: beginner
    assert:
      - {type: icontains, value: "r1"}
      - {type: llm-rubric, value: "Prints the parsed grid back with row and column labels, confirms it is valid, and gives a nudge that names a row, column or box to study without giving a digit placement; it does not solve the whole puzzle."}
  - name: edge-placement-level
    vars:
      grid: "530070000600195000098000060800060003400803001700020006060000280000419005000080079"
      hint_level: placement
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Gives exactly one placement in r#c# = digit form that is correct for this puzzle (the known solution begins 534678912 in row 1), with reasoning that names a technique such as a naked or hidden single and checks row, column and box."}
  - name: negative-invalid-grid
    vars:
      grid: "553070000600195000098000060800060003400803001700020006060000280000419005000080079"
      hint_level: nudge
      level: beginner
    assert:
      - {type: llm-rubric, value: "Detects that the digit 5 repeats in row 1 (or otherwise identifies the clash), says the grid is invalid, and asks the solver to check it, instead of coaching on a broken puzzle."}
