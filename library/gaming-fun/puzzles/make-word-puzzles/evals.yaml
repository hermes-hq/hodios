schema: 1
baseline: "Make a {{puzzle_type}} puzzle about {{theme}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kids-word-search
    vars:
      theme: "ocean animals"
      puzzle_type: word-search
      age: "age 6-7, early readers"
    assert:
      - {type: contains, value: "## Answer key"}
      - {type: llm-rubric, value: "A grid of about 8x8 to 10x10 in a code block with short ocean-animal words placed only right and down, a word list, an answer key with start row, column and direction for each word, and every listed word actually traceable in the grid at the stated position."}
  - name: edge-adult-cryptogram
    vars:
      theme: "a public-domain quote about courage"
      puzzle_type: cryptogram
      age: adults
    assert:
      - {type: llm-rubric, value: "Encodes a public-domain quote with a substitution key in which no letter maps to itself, keeps spaces and punctuation, the ciphertext decodes correctly with the given key, and the answer key gives the plain text, the key and the attribution."}
  - name: negative-crossword-grid
    vars:
      theme: "space"
      puzzle_type: full crossword grid with numbered clues
    assert:
      - {type: llm-rubric, value: "Explains that a full crossword grid cannot be built reliably in text and suggests a close alternative (for example clues for a crossword tool or a different word puzzle) instead of producing an unverified grid."}
