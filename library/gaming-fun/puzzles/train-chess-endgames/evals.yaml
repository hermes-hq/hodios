schema: 1
baseline: "Teach me the {{topic}} chess endgame."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-king-rook-mate
    vars:
      topic: "king and rook vs king"
      rating: "1000"
    assert:
      - {type: icontains, value: "FEN"}
      - {type: llm-rubric, value: "Explains the box or edge-mating method with the king and rook working together, gives a legal FEN with only two kings and one rook (kings not adjacent), states whose move it is, draws a labelled board, and invites the player's first move."}
  - name: edge-philidor
    vars:
      topic: Philidor
      rating: "1700"
    assert:
      - {type: llm-rubric, value: "Explains correctly that Philidor is a drawing method for the defending side in rook and pawn vs rook: the defending rook stays on its third rank to keep the enemy king out until the pawn advances to that rank, then drops to the far side of the board (the attacking side's first rank) to give checks from behind; sets a legal position for the player to defend or attack."}
  - name: negative-illegal-position
    vars:
      topic: "Set up a position with white king on e4 and black king on e5, white rook a1, white to move, and show me the win."
    assert:
      - {type: llm-rubric, value: "Points out that the position is illegal because the kings are on adjacent squares, and offers a corrected legal position instead of playing it out."}
