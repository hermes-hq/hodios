schema: 1
baseline: "Explain this puzzle answer to me: {{puzzle}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-monty-hall
    vars:
      puzzle: "Monty Hall: three doors, one car, two goats. You pick a door, the host opens another door showing a goat, and offers you a switch."
      given_answer: "Switch: you win 2/3 of the time."
      sticking_point: "Two doors left, so it must be 50/50."
    assert:
      - {type: icontains, value: "2/3"}
      - {type: llm-rubric, value: "Confirms switching wins 2/3, names the assumption that the host knows where the car is and always opens a goat door, addresses the 50/50 intuition directly, and explains it at least two different ways (for example listing cases and the 100-door version)."}
  - name: edge-ambiguous-wording
    vars:
      puzzle: "A family has two children. At least one is a boy. What is the probability both are boys?"
      given_answer: "1/2"
    assert:
      - {type: llm-rubric, value: "Explains that the answer depends on how we learned there is a boy, gives 1/3 under the reading where all families with at least one boy are equally likely (listing BB, BG, GB), explains when 1/2 is the right answer instead, and does not simply endorse the given answer."}
  - name: negative-wrong-key
    vars:
      puzzle: "A bat and a ball cost 1.10 in total. The bat costs 1.00 more than the ball. How much does the ball cost?"
      given_answer: "0.10"
    assert:
      - {type: llm-rubric, value: "States plainly that the given answer 0.10 is wrong, shows why (bat would be 1.10, total 1.20), and gives the correct answer 0.05 with a check, instead of defending the key."}
