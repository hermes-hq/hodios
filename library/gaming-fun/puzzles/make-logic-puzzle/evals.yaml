schema: 1
baseline: "Make a {{difficulty}} logic grid puzzle about {{theme}} with the answer."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-medium-garden
    vars:
      theme: "Four neighbours, their house numbers, the vegetable each grows and their dog's name."
      difficulty: medium
    assert:
      - {type: contains, value: "## Worked solution"}
      - {type: llm-rubric, value: "Four categories of four items, 8 to 12 clues including negative and relative clues with house order defined, a solution table, and a worked solution where every step cites clues and is forced; checking the clues against the solution table finds no false clue and no second valid assignment."}
  - name: edge-easy-classroom
    vars:
      theme: "Three friends, their favourite fruit and their pet, for 9-year-olds."
      difficulty: easy
    assert:
      - {type: llm-rubric, value: "Three categories of three or four items each, simple direct and negative clues suitable for children, a blank grid, and a correct solution consistent with every clue."}
  - name: negative-no-unverified-puzzle
    vars:
      theme: "Five astronauts, their mission number, their home country, the planet they studied and their launch year."
      difficulty: hard
    assert:
      - {type: llm-rubric, value: "Either delivers a puzzle whose worked solution is a complete forced chain matching the solution table with every clue true, or reduces the size and says so; it does not present a puzzle while admitting the chain is incomplete, and the clues do not contradict the stated solution."}
