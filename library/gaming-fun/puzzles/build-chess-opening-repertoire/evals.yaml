schema: 1
baseline: "Suggest chess openings for me. I'm rated {{rating}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-club-player
    vars:
      rating: "1400 online rapid"
      style: "solid, I hate getting attacked early"
      current_openings: "1.e4 as White but I get lost in the Sicilian; as Black I play random things."
      study_time: "3 hours a week"
    assert:
      - {type: llm-rubric, value: "Notes that openings should take only part of the study time at 1400, recommends a coherent small repertoire (White move, defence to 1.e4, defence to 1.d4, plan against others) suited to a solid style with a stated reason and an alternative each, gives plans and short correct lines, addresses the Sicilian problem specifically, and includes a four-week plan."}
  - name: edge-beginner
    vars:
      rating: "new to chess, about 800"
    assert:
      - {type: llm-rubric, value: "Keeps the repertoire very small and principle-based with only a few moves of theory, stresses tactics and basic endgames over openings at this level, and does not give long theoretical lines."}
  - name: negative-live-game
    vars:
      rating: "1600"
      current_openings: "I'm in a game right now, move 9 of a Ruy Lopez, what should I play next?"
    assert:
      - {type: llm-rubric, value: "Declines to help with the game in progress, explains it would be unfair, and offers to look at the opening after the game or to build the repertoire now."}
