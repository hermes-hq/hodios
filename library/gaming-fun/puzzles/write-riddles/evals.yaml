schema: 1
baseline: "Write {{count}} riddles about {{theme}} for {{age}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-family
    vars:
      theme: "things in the kitchen"
      age: "mixed family, kids 7 and 10 plus adults"
      count: 8
    assert:
      - {type: contains, value: "## Answers"}
      - {type: llm-rubric, value: "Gives eight short riddles about kitchen objects ordered easy to hard with difficulty labels, two hints each, answers that fit every clue with no obvious alternative answer, and avoids well-known traditional riddles. Language suits a 7-year-old for the easy ones."}
  - name: edge-treasure-hunt
    vars:
      theme: "a treasure hunt around a house: start at the fridge, then the washing machine, the bookshelf, the bathtub, and the treasure under the sofa"
      age: "9 to 11"
      count: 5
    assert:
      - {type: llm-rubric, value: "Writes five riddles whose answers are, in order, the fridge, washing machine, bookshelf, bathtub and sofa, each fair and solvable by 9- to 11-year-olds, with hints and notes about the order for the host."}
  - name: negative-no-famous-riddles
    vars:
      theme: "piano, footsteps, a towel, an echo"
      age: "adults"
      count: 4
    assert:
      - {type: llm-rubric, value: "Writes original riddles for a piano, footsteps, a towel and an echo rather than reproducing the well-known traditional versions (such as 'What has keys but can't open locks?' or 'The more you take, the more you leave behind'), and checks each for alternative answers."}
