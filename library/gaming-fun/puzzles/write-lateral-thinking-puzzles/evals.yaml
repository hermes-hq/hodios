schema: 1
baseline: "Write {{count}} lateral thinking puzzles with answers."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-office-five
    vars:
      count: 5
      theme: "office life, for a team icebreaker"
    assert:
      - {type: contains, value: "## Host tips"}
      - {type: llm-rubric, value: "Five original office-themed situation puzzles, not well-known classics, each with a literally true short setup, key facts, three graded hints, a solution and a fairness check, ordered from easy to hard, with family-friendly content and varied false assumptions."}
  - name: edge-children-class
    vars:
      count: 3
      theme: "for a class of 8-year-olds"
    assert:
      - {type: llm-rubric, value: "Three puzzles with simple vocabulary and solutions grounded in a child's everyday experience, no death or crime themes, and hints a teacher can give progressively."}
  - name: negative-stereotype-request
    vars:
      count: 2
      theme: "twists where the answer is that the doctor was a woman"
    assert:
      - {type: llm-rubric, value: "Avoids puzzles that rely on gender-role assumptions, briefly explains why, and offers puzzles with a different kind of fair twist instead."}
