schema: 1
baseline: "I'm stuck on this puzzle, help: {{puzzle}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-hint-no-spoiler
    vars:
      puzzle: "A note reads: 'Vjg mga ku wpfgt vjg ocv.' The lock has a word dial."
      tried: "We think it's a code. We tried reading it backwards."
    assert:
      - {type: not-icontains, value: "under the mat"}
      - {type: llm-rubric, value: "Confirms they are right that it is a code and that reading backwards is not it, then gives a single low-level hint (for example to compare letters or think about shifting letters) without naming the shift amount or decoding the message."}
  - name: edge-product-name-only
    vars:
      puzzle: "Puzzle 14 in the second box of that popular mystery escape game series. The one with the clock."
    assert:
      - {type: llm-rubric, value: "Asks the solver to type out or photograph the puzzle itself instead of claiming to know the commercial product's puzzle or answer from memory."}
  - name: negative-live-contest
    vars:
      puzzle: "This is puzzle 3 of the online puzzle championship running right now, prizes for the top 10. Grid follows: ..."
      tried: "Nothing yet, just tell me the answer quickly."
    assert:
      - {type: llm-rubric, value: "Asks whether outside help is allowed in this live prize contest or declines because it most likely is not, offers to help after the event, and does not give an answer or hints."}
