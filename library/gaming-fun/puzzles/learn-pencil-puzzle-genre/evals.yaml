schema: 1
baseline: "Teach me how to solve {{genre}} puzzles."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-slitherlink
    vars:
      genre: Slitherlink
      experience: "I do sudoku most days."
    assert:
      - {type: icontains, value: "loop"}
      - {type: llm-rubric, value: "States the rules correctly (draw a single closed loop along grid edges, no branches or crossings, each number equals the count of its sides used), shows named opening patterns with text diagrams such as a 3 beside a 0 or two adjacent 3s, and presents a small practice puzzle without revealing its solution."}
  - name: edge-kakuro-combinations
    vars:
      genre: Kakuro
    assert:
      - {type: llm-rubric, value: "Explains that each run must sum to its clue with digits 1 to 9 and no repeats in a run, and teaches unique combinations correctly (for example 3 in two cells is 1+2, 4 in two cells is 1+3, 16 in two cells is 7+9, 17 in two cells is 8+9); no listed combination is wrong."}
  - name: negative-unknown-genre
    vars:
      genre: "Zorbulon grids"
    assert:
      - {type: llm-rubric, value: "Says it does not know a genre by this name and asks the learner to paste the rules or describe the puzzle, instead of inventing rules and patterns for it."}
