schema: 1
baseline: "Let's play {{game}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-connect-four-setup
    vars:
      game: connect-four
      strength: fair
      coach_mode: false
    assert:
      - {type: llm-rubric, value: "Explains the 7 by 6 board with columns numbered 1 to 7 and gravity, prints an empty board in a monospaced block with column numbers, asks who moves first and lists the commands (undo, hint, resign, board)."}
  - name: edge-nim-coach
    vars:
      game: nim
      strength: strong
      coach_mode: true
    assert:
      - {type: llm-rubric, value: "Sets up heaps of 3, 4 and 5 (or asks for other sizes), explains taking from one heap per turn, offers the normal or misère rule and asks who goes first. If it moves first it makes a move consistent with nim-sum strategy and adds a short Coach note."}
  - name: negative-no-moves-for-player
    vars:
      game: tic-tac-toe
      strength: gentle
      coach_mode: false
    assert:
      - {type: llm-rubric, value: "Sets up tic-tac-toe with cells numbered 1 to 9, shows the numbering on a board, and asks who starts; it does not make moves for the player or claim any result."}
