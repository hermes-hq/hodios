schema: 1
baseline: "Analyse this chess game: {{pgn}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scholars-mate-defence-failure
    vars:
      pgn: |
        [White "Opponent"]
        [Black "Me"]
        [Result "1-0"]
        1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
      player_rating: 600
    assert:
      - {type: contains, value: "## Key moments"}
      - {type: llm-rubric, value: "Identifies 3...Nf6 as the losing move because it ignores the threat to f7, suggests a defence such as 3...g6 or 3...Qe7 in correct notation, explains in beginner-friendly words the habit of checking the opponent's threats, and keeps the advice suited to a 600 rating."}
  - name: edge-no-colour-given
    vars:
      pgn: "1. d4 d5 2. c4 e6 3. Nc3 Nf6 4. Bg5 Be7 5. e3 O-O 6. Nf3 Nbd7 7. Rc1 c6 8. Bd3 dxc4 9. Bxc4 Nd5 10. Bxe7 Qxe7 11. O-O Nxc3 12. Rxc3 e5 13. Qc2 e4 14. Nd2 Nf6 15. f3 exf3 16. Nxf3 Bg4 17. e4 Rad8 18. e5 Nd5 19. Bxd5 Rxd5 20. Rc5 Rxc5 21. dxc5 Bxf3 22. Rxf3 Qxc5+ 23. Qxc5 1/2-1/2"
    assert:
      - {type: llm-rubric, value: "Recognises a Queen's Gambit Declined, asks or notes that the user's colour is unknown and analyses both sides, uses words rather than invented numeric evaluations, and lists uncertain positions for engine checking."}
  - name: negative-illegal-move
    vars:
      pgn: "1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Bxe8 Nf6"
    assert:
      - {type: llm-rubric, value: "Points out that 4. Bxe8 is not a legal move (the knight on c6 blocks the diagonal and the black king stands on e8) and stops or asks for the correct moves instead of analysing an impossible game."}
