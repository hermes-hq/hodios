schema: 1
baseline: "Make me a puzzle with sixteen words in four hidden groups of four and let me guess."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-medium-general
    vars:
      theme: general
      difficulty: medium
      mistakes_allowed: 4
    assert:
      - {type: icontains, value: "Mistakes left"}
      - {type: llm-rubric, value: "Shows exactly sixteen distinct words in capitals in a 4x4 grid, shuffled so no row is obviously a group, states the rules including four mistakes, and reveals no links or groups."}
  - name: edge-easy-kitchen
    vars:
      theme: the kitchen
      difficulty: easy
      mistakes_allowed: 5
    assert:
      - {type: llm-rubric, value: "Presents a sixteen-word grid with plain, accessible kitchen-related links suitable for easy difficulty, five mistakes allowed, and no group or link revealed."}
  - name: negative-too-narrow-theme
    vars:
      theme: types of screwdriver only
      difficulty: hard
      mistakes_allowed: 4
    assert:
      - {type: llm-rubric, value: "Points out that types of screwdriver alone cannot support four distinct groups of four and proposes widening the theme (for example tools or the workshop) before presenting a grid, or presents one only after stating the widened theme."}
