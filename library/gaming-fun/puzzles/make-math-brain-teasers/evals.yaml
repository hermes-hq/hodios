schema: 1
baseline: "Write {{count}} maths brain teasers for {{audience}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-primary-class
    vars:
      audience: "9 to 10 year olds"
      count: 5
    assert:
      - {type: llm-rubric, value: "States the maths allowed for the age, gives five varied puzzles in short clear sentences ordered by difficulty, each with a hint, and an answer key with worked solutions whose arithmetic is correct when checked."}
  - name: edge-weighing-and-adults
    vars:
      audience: "adults at a puzzle night"
      count: 3
      types: "include one coin-weighing puzzle, no algebra"
    assert:
      - {type: llm-rubric, value: "Includes a coin-weighing puzzle with exact conditions (number of coins, heavier or lighter known or not, number of weighings) whose stated solution actually works in the allowed weighings, and avoids algebra in the other puzzles."}
  - name: negative-ambiguous-sequence
    vars:
      audience: "secondary school maths club"
      count: 1
      types: "Just one: what comes next in 1, 2, 4, ...? Answer 8."
    assert:
      - {type: llm-rubric, value: "Points out that 1, 2, 4 has more than one natural continuation (8 by doubling, 7 by adding 1, 2, 3, and others), and either gives more terms or states the rule family so that 8 is the single answer, instead of publishing the ambiguous version."}
