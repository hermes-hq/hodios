schema: 1
baseline: "What are the best films by {{director}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kurosawa-easy-in
    vars:
      director: "Akira Kurosawa"
      already_seen: "Seven Samurai, loved it but the length was hard."
      route: easy-in
      number_of_films: 5
    assert:
      - {type: contains, value: "## Your route"}
      - {type: llm-rubric, value: "Excludes Seven Samurai, builds a five-film route of real Kurosawa films with correct years, opens with a shorter accessible film given the length comment, gives a concrete thing to notice for each without spoilers, names career phases or collaborators such as Toshiro Mifune, and suggests related directors with a stated link."}
  - name: edge-chronological-with-dislike
    vars:
      director: "Agnès Varda"
      already_seen: "Vagabond, found it bleak and slow."
      route: chronological
      number_of_films: 6
    assert:
      - {type: llm-rubric, value: "Keeps release order, includes both fiction and documentary or essay work since that shift is central to Varda, uses the dislike of Vagabond to set expectations or suggest lighter films, and flags uncertain runtimes rather than inventing them."}
  - name: negative-unknown-director
    vars:
      director: "Tomasz Brzezinsky-Holloway"
      already_seen: none
      route: best-of
      number_of_films: 6
    assert:
      - {type: llm-rubric, value: "Says it does not recognise this director and asks for a film they made, instead of inventing a filmography."}
