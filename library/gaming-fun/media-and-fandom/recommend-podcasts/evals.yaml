schema: 1
baseline: "Recommend some podcasts about {{interests}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-narrative-commute
    vars:
      interests: "History and true crime, but nothing gory. 25-minute train commute each way."
      episode_length: medium
      style: narrative
    assert:
      - {type: contains, value: "## Shows"}
      - {type: llm-rubric, value: "Recommends six real, mostly narrative shows on history or non-gory true crime with episodes around 20 to 50 minutes, says for each whether it is serialised, gives a first episode or a safe way to pick one without inventing episode titles, marks possibly ended shows, and picks one to start."}
  - name: edge-long-interviews
    vars:
      interests: "Founders' stories, design and how products get made. Long drives on weekends."
      episode_length: long
      style: interview
    assert:
      - {type: llm-rubric, value: "Recommends long-form interview shows on startups, design or product making, flags shows that may have ended or changed hosts, does not claim platforms or download numbers, and notes start-anywhere status."}
  - name: negative-no-interests
    vars:
      interests: "Something for a trip"
      episode_length: any
      style: any
    assert:
      - {type: llm-rubric, value: "Asks what topics they enjoy and who is listening or how long the trip is before recommending, rather than listing the most popular podcasts."}
