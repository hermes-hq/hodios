schema: 1
baseline: "I'm going to {{performance}} for the first time. What should I know?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-boheme-vienna
    vars:
      performance: "La Bohème at the state opera house"
      venue_country: Austria
      depth: quick
    assert:
      - {type: contains, value: "## Moments to look out for"}
      - {type: llm-rubric, value: "Tells the Puccini story by act including Mimì's death, explains voice types in plain words, names moments such as Che gelida manina and Sì, mi chiamano Mimì, covers applause after arias and acts, phones, arrival and surtitles, adds hedged Austrian customs such as using the cloakroom, and marks timings to check with the venue."}
  - name: edge-nutcracker-with-kids-full
    vars:
      performance: "The Nutcracker, taking my kids aged 6 and 9"
      venue_country: United Kingdom
      depth: full
    assert:
      - {type: llm-rubric, value: "Gives the ballet's story in child-friendly terms, highlights moments such as the Dance of the Sugar Plum Fairy and the Waltz of the Flowers, explains applauding after solos, adds tips for children (intervals, snacks, toilet breaks), includes background on Tchaikovsky and up to three real recordings or filmed productions, and keeps etiquette reassuring."}
  - name: negative-unknown-new-work
    vars:
      performance: "The world premiere of a new chamber opera commissioned this season"
      venue_country: unspecified
      depth: quick
    assert:
      - {type: llm-rubric, value: "Says it does not know this new work, does not invent a story or characters, gives general guidance for attending contemporary opera, and asks for the programme or the venue's synopsis."}
