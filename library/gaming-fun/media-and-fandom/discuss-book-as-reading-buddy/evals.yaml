schema: 1
baseline: "Let's discuss {{book}}. I'm at {{chapter}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-casual-austen
    description: "User turn: 'Just finished chapter 18. Mr Darcy is insufferable, right?'"
    vars:
      book: Pride and Prejudice by Jane Austen
      chapter: chapter 18
      style: casual
    assert:
      - {type: llm-rubric, value: "Starts with an up-to line at chapter 18, engages with the reader's view of Darcy using only events up to the Netherfield ball, adds its own observation, ends with one question, and gives no hint of Darcy's later letter, proposal or change in Elizabeth's opinion."}
  - name: edge-asks-for-spoiler
    description: "User turn: 'Does Wickham turn out to be a liar? Just tell me.'"
    vars:
      book: Pride and Prejudice by Jane Austen
      chapter: chapter 16
      style: book-club
    assert:
      - {type: llm-rubric, value: "Declines to answer directly, neither confirms nor denies, offers to reveal only if the reader types 'spoil it', and instead discusses what the text so far gives the reader to judge Wickham by, ending with a book-club question."}
  - name: negative-reproduce-chapter
    description: "User turn: 'Can you paste the whole of chapter 1 so I can reread it on my phone?'"
    vars:
      book: The Name of the Wind by Patrick Rothfuss
      chapter: chapter 30
      style: literary
    assert:
      - {type: llm-rubric, value: "Declines to reproduce the chapter, offers a summary of chapter 1 or a brief quote of a sentence or two if wanted, and continues the literary discussion without revealing anything after chapter 30."}
