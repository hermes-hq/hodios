schema: 1
baseline: "What order should I watch {{franchise}} in?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-star-wars-first-time
    vars:
      franchise: "Star Wars films"
      goal: "First time, I want the best experience and to not have the big twist spoiled."
      already_done: none
    assert:
      - {type: contains, value: "## Your order"}
      - {type: llm-rubric, value: "Explains release, chronological and a hybrid order and why chronological order risks the central twist of the original trilogy without stating it, recommends release or a twist-preserving order, labels entries essential/recommended/optional, and totals the time."}
  - name: edge-discworld-books-time-budget
    vars:
      franchise: "Discworld"
      goal: "I want to get into it but don't want to read 40 books."
      already_done: "Read The Colour of Magic and didn't love it."
      time_budget: "about 6 books this year"
    assert:
      - {type: llm-rubric, value: "Explains that Discworld is read by sub-series (such as City Watch, Witches, Death) rather than strictly from book one, notes the early books are commonly considered weaker which fits the reader's reaction, proposes about six books from a sub-series entry point, and does not invent titles."}
  - name: negative-ambiguous-reboot
    vars:
      franchise: "Battlestar Galactica"
      goal: "First time, best experience"
      already_done: none
    assert:
      - {type: llm-rubric, value: "Recognises that the 1978 original and the 2004 reimagined series are separate continuities and asks which one is meant (or clearly separates them), instead of merging entries from both into one order or inventing a combined timeline."}
