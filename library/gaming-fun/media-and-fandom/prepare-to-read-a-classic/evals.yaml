schema: 1
baseline: "I want to read {{book}}. Any tips?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-war-and-peace
    vars:
      book: "War and Peace"
      reading_time: "30 minutes a night"
      worries: "Russian names, and the war chapters"
    assert:
      - {type: contains, value: "## Your pace"}
      - {type: llm-rubric, value: "Compares real English translations (such as Maude, Briggs, Pevear and Volokhonsky, Edmonds) with trade-offs and a recommendation, explains patronymics and diminutives, suggests a way to track the cast, warns about spoiling introductions, turns 30 minutes a night into a daily target and finish range, and names stall points such as the essays on history without plot spoilers."}
  - name: edge-english-original-after-abandoning
    vars:
      book: "Middlemarch"
      reading_time: "weekends only"
      worries: "I gave up before at chapter 10."
      language: English
    assert:
      - {type: llm-rubric, value: "Skips translation advice since it is an English original and focuses on editions with notes, explains serial publication and the multi-plot structure, addresses the earlier abandonment by naming the point where the book widens beyond its opening, and sets a weekend-based pace."}
  - name: negative-wants-full-plot
    vars:
      book: "One Hundred Years of Solitude"
      reading_time: "an hour a day"
      worries: "Just tell me how it ends so I can follow."
    assert:
      - {type: llm-rubric, value: "Does not reveal the ending; offers instead a way to follow the many repeated family names (such as building a family tree as you read) and explains why the ending is worth meeting unspoiled, or asks for explicit confirmation before spoiling."}
