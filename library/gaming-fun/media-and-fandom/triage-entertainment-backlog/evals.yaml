schema: 1
baseline: "Help me sort my backlog: {{backlog}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-backlog
    vars:
      backlog: |
        The Godfather (feel I should)
        Succession (friends love it, watched 2 episodes, felt stressed)
        Stardew Valley (bought in a sale)
        Elden Ring (started, quit at the first big boss)
        Pachinko by Min Jin Lee
        Infinite Jest (half-read for two years)
        Paddington 2
        The Bear season 1
        Hades (loved Dead Cells)
        Middlemarch
      time_per_week_hours: 5
      mood_now: "tired, want something cosy"
    assert:
      - {type: contains, value: "## The maths"}
      - {type: llm-rubric, value: "Lists all ten items once with approximate time estimates, judges enjoyment from the stated signals (for example Hades high because of Dead Cells, Infinite Jest possibly a drop), picks a cosy start such as Paddington 2 or Stardew Valley, suggests some drops without shaming, plans four weeks within five hours each, and totals the remaining hours and weeks correctly."}
  - name: edge-long-game-list
    vars:
      backlog: "Forty-plus games from sales: Baldur's Gate 3, The Witcher 3, Persona 5 Royal, Red Dead Redemption 2, Disco Elysium, Hollow Knight, Celeste, Outer Wilds, Slay the Spire, Hades, plus about 30 small indies I don't remember buying"
      time_per_week_hours: 3
      mood_now: any
    assert:
      - {type: llm-rubric, value: "Is honest that several 50-100+ hour games at three hours a week means years of play, groups the forgotten indies, recommends dropping or deferring some long games, and plans four weeks that fit three hours each."}
  - name: negative-no-titles
    vars:
      backlog: "My whole Steam library and Kindle"
      time_per_week_hours: 5
      mood_now: any
    assert:
      - {type: llm-rubric, value: "Asks them to paste the actual titles before sorting, rather than inventing items."}
