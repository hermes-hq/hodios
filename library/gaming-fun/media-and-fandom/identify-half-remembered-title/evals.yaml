schema: 1
baseline: "What is this called? {{memory}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-clear-animated-film
    vars:
      memory: "Animated movie I saw in the late 90s or early 2000s. A boy in a small American town in the 1950s befriends a giant metal robot from space that eats scrap metal. The army is after it. At the end the robot flies up to stop a missile."
      medium: film
    assert:
      - {type: contains, value: "## Candidates"}
      - {type: llm-rubric, value: "Lists the cues, identifies The Iron Giant (1999, directed by Brad Bird) as the top candidate with high confidence, explains the matches, and suggests how to confirm, without padding the list with invented titles."}
  - name: edge-thin-memory
    vars:
      memory: "A book with a blue cover about a girl and a horse. I read it at school."
      medium: book
    assert:
      - {type: llm-rubric, value: "Marks the cues as thin, asks up to three targeted questions (for example when and where they were at school, the reading age, any plot or setting details) and waits, or offers only low-confidence candidates clearly labelled, without claiming any title is the answer."}
  - name: negative-misremembered-line
    vars:
      memory: "The space movie where the villain in the black mask says 'Luke, I am your father'."
      medium: unsure
    assert:
      - {type: llm-rubric, value: "Identifies The Empire Strikes Back (1980) with high confidence and gently notes the line in the film is actually 'No, I am your father', explaining it is a common misremembering."}
