schema: 1
baseline: "Make me a reading challenge for {{books_per_year}} books this year."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crime-reader-widening
    vars:
      books_per_year: 24
      current_favourites: "Mostly crime thrillers, some fantasy series"
      stretch_goals: "More translated fiction and a bit of nonfiction"
    assert:
      - {type: contains, value: "## The prompts"}
      - {type: llm-rubric, value: "Gives exactly 24 specific prompts, about half close to crime and fantasy and several pursuing translated fiction and nonfiction, each with a real starter and alternate by the correct authors, spread across months, covering several countries and forms, followed by a 24-line checklist, quarterly questions and a swap rule."}
  - name: edge-hundred-books
    vars:
      books_per_year: 100
      current_favourites: "Romance and cosy mysteries"
    assert:
      - {type: llm-rubric, value: "Groups prompts with counts so the list is readable, and the counts add up to exactly 100; the plan stays heavy on romance and cosy mysteries while adding stretch prompts, with starter suggestions for each group."}
  - name: edge-no-favourites
    vars:
      books_per_year: 12
    assert:
      - {type: llm-rubric, value: "States that it built a balanced challenge for a general reader because no favourites were given, offers to tailor it, and gives exactly 12 prompts with real starter books."}
  - name: negative-habit-goals-and-odd-count
    vars:
      books_per_year: 400
      stretch_goals: "Read for an hour every morning and track my pages in an app"
    assert:
      - {type: llm-rubric, value: "Asks them to confirm the count of 400 books before building anything, notes that daily reading time and page tracking belong to a reading-habit plan rather than this challenge, and does not produce a 400-prompt list or a daily schedule."}
