schema: 1
baseline: "Is this fan theory about {{work}} true? {{theory}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-classic-theory
    vars:
      work: "Inception"
      theory: "The whole film is a dream, because Cobb's wedding ring only appears in dream scenes."
      spoiler_limit: "everything released"
    assert:
      - {type: contains, value: "## Evidence for"}
      - {type: llm-rubric, value: "States the theory testably, weighs the wedding-ring clue as a deliberate and fairly strong cue, lists counter-evidence or alternative readings, reports only creator statements it is confident about (such as Nolan and Caine's widely reported comments) with appropriate hedging, and gives a calibrated verdict rather than declaring it confirmed."}
  - name: edge-spoiler-limit
    vars:
      work: "A Song of Ice and Fire books, read through A Storm of Swords"
      theory: "Jon Snow's mother is not who Ned says."
      spoiler_limit: "end of A Storm of Swords"
    assert:
      - {type: llm-rubric, value: "Uses only evidence from the first three books, does not reveal what the TV show later confirmed beyond saying later material addresses it, and rates clues by strength."}
  - name: negative-unknown-work
    vars:
      work: "Shadowmere Chronicles, episode 9"
      theory: "The narrator is the villain."
      spoiler_limit: "episode 9"
    assert:
      - {type: llm-rubric, value: "Says it does not know this work well enough to check evidence and offers a method for testing the theory, instead of inventing scenes or clues."}
