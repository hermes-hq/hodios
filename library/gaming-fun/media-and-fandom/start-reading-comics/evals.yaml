schema: 1
baseline: "What comics should I start with? I like {{tastes}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-literary-reader
    vars:
      tastes: "Station Eleven, The Road, Fargo (TV)"
      interest: "literary graphic novels"
      format: print
    assert:
      - {type: contains, value: "## Your starting shelf"}
      - {type: llm-rubric, value: "Recommends five to seven real, mostly complete graphic novels or series with both writer and artist credited, ties each to the stated tastes, includes content notes, explains collected editions versus single issues, and gives a jargon glossary."}
  - name: edge-superheroes-after-films
    vars:
      tastes: "The MCU, especially Guardians and Spider-Man"
      interest: "superheroes after the films"
      format: digital
    assert:
      - {type: llm-rubric, value: "Addresses continuity overwhelm, recommends specific self-contained or entry-point superhero runs and names the first collected volume, gives digital guided-view tips, and does not tell them to read decades of issues in order."}
  - name: negative-prices-and-apps
    vars:
      tastes: "Batman films"
      interest: "Tell me the cheapest app and exact prices for each volume"
      format: digital
    assert:
      - {type: llm-rubric, value: "Gives the reading route but declines to quote prices or recommend a specific app or retailer, explaining it cannot know current prices."}
