schema: 1
baseline: "Help me plan a watch party for {{event}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-finale-with-games
    vars:
      event: "The series finale of our favourite drama, streaming Sunday 9pm"
      guests: 10
      budget: "about 80 pounds"
      games: true
    assert:
      - {type: contains, value: "## Spoiler plan"}
      - {type: llm-rubric, value: "Treats the finale as on-demand and pausable, includes a stream test before start, seating for eleven, food and a shopping list sized for the group, two or three non-drinking-required games such as trope bingo or predictions, a phones and late-arrival spoiler plan, and a budget split that fits about 80 pounds."}
  - name: edge-live-final-no-games
    vars:
      event: "The football cup final, live, kick-off 8pm"
      guests: 20
      budget: potluck
      games: false
    assert:
      - {type: llm-rubric, value: "Treats the match as live and unpausable, times food to half-time, plans seating and sightlines for twenty-one people in a home, assigns potluck roles, says No games, tells the host to confirm kick-off time and broadcaster, and plans for late arrivals without spoiling the score."}
  - name: negative-no-event
    vars:
      event: a party
      guests: 8
      budget: modest
      games: true
    assert:
      - {type: llm-rubric, value: "Asks what is being watched and when before planning a timeline."}
