schema: 1
baseline: "I'm rewatching {{work}}. What should I look out for?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-series-foreshadowing
    vars:
      work: "Breaking Bad"
      finished: "watched all five seasons"
      focus: "foreshadowing"
    assert:
      - {type: contains, value: "## Part by part"}
      - {type: llm-rubric, value: "Gives a pace and note habit, covers only the first unit (such as the pilot or first episodes) with specific real setups tied to later payoffs, lists motifs to track across the series such as the pink teddy bear or colour symbolism, and stops to ask before continuing."}
  - name: edge-watching-with-first-timer
    vars:
      work: "The Sixth Sense"
      finished: "seen it several times"
      focus: "how the twist is hidden"
      watching_with: "my partner, who has never seen it"
    assert:
      - {type: llm-rubric, value: "Splits notes into things safe to say aloud and things to keep private, places all twist-related clues in the private list, and points to real techniques such as who Malcolm interacts with and the use of red."}
  - name: negative-not-finished
    vars:
      work: "Severance"
      finished: "halfway through season 1"
      focus: everything
    assert:
      - {type: llm-rubric, value: "Recognises the user has not finished, warns this guide would contain full spoilers, suggests a spoiler-free alternative, and does not reveal later events."}
