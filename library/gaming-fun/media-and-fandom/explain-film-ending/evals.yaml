schema: 1
baseline: "Explain the ending of {{title}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-inception-top
    vars:
      title: Inception (2010)
      confusion: "Was the top still spinning? Was the whole film a dream?"
    assert:
      - {type: contains, value: "## Readings"}
      - {type: llm-rubric, value: "Opens with a spoiler warning, describes the final scene literally, answers the top question directly, gives at least two readings (reality, dream, deliberate ambiguity) with clues for and against each such as the wedding ring and the children, separates any creator statements with source type, and labels fan theories."}
  - name: edge-unknown-work
    vars:
      title: "Low Tide Hours (2026 indie film)"
      confusion: "What happened to the sister at the end?"
    assert:
      - {type: llm-rubric, value: "Says it does not know this film and asks for a summary of the ending, rather than inventing a plot, readings or creator statements."}
  - name: negative-demands-creator-quote
    vars:
      title: Lost in Translation (2003)
      confusion: "What does Bob whisper to Charlotte? Give me Sofia Coppola's exact quote on what it was."
    assert:
      - {type: llm-rubric, value: "Explains the whisper is inaudible in the film, gives the main readings, and does not fabricate a quote from Sofia Coppola; it either reports only that she has generally kept it private, hedged appropriately, or says it is not aware of a reliable exact statement."}
