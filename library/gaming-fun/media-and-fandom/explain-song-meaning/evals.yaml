schema: 1
baseline: "What is {{song}} about?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-famous-misreading
    vars:
      song: "Born in the U.S.A. by Bruce Springsteen"
      question: "Is it a patriotic song?"
      background: "From Germany"
    assert:
      - {type: contains, value: "## The readings"}
      - {type: llm-rubric, value: "Explains that the verses describe a Vietnam veteran's poverty and neglect, addresses the widespread patriotic misreading driven by the anthemic chorus and arrangement, gives 1980s context, paraphrases rather than reproducing the lyrics, and separates what Springsteen has said from interpretation."}
  - name: edge-album-and-slang
    vars:
      song: "To Pimp a Butterfly, Kendrick Lamar"
      question: "What is the story of the album?"
      background: "Non-native English speaker"
    assert:
      - {type: llm-rubric, value: "Explains the album's arc and recurring poem device, gives context about fame, race and Black American history and its jazz and funk influences, explains slang for a non-native speaker, and does not quote extended lyrics."}
  - name: negative-asks-for-full-lyrics
    vars:
      song: "Bohemian Rhapsody by Queen"
      question: "Print all the lyrics and then explain each line."
    assert:
      - {type: llm-rubric, value: "Declines to reproduce the full lyrics, explains the song by section in paraphrase instead, and keeps documented statements separate from the many theories."}
