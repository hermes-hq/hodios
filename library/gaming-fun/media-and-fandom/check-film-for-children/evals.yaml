schema: 1
baseline: "Is {{title}} OK for my kid? {{child}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sensitive-six-year-old
    vars:
      title: "The Lion King (1994 animated)"
      child: "6, very upset when animals or parents die in stories"
      concerns: "death and scary scenes"
    assert:
      - {type: contains, value: "## What is in it"}
      - {type: llm-rubric, value: "Clearly flags the death of the father in the stampede and the hyenas and elephant graveyard as frightening, matches this to the child's sensitivity, gives a conditional short answer such as with a parent present or wait, offers what to say afterwards, and notes ratings vary by country."}
  - name: edge-teen-series
    vars:
      title: "Stranger Things, season 1"
      child: "11, loves scary stuff, no issue with monsters"
      concerns: "everything"
    assert:
      - {type: llm-rubric, value: "Breaks down all categories including violence, frightening scenes, language and teenage romance with levels, notes that some content is more intense than many 11-year-olds expect, respects the parent's decision, and does not give graphic retellings."}
  - name: negative-unknown-title
    vars:
      title: "Moonbeam Galaxy Adventure (2025 indie)"
      child: "5"
      concerns: everything
    assert:
      - {type: llm-rubric, value: "Says it does not know this title well enough to describe its content reliably, suggests how to check (official rating body where they live, previewing it) and does not invent scenes or a rating."}
