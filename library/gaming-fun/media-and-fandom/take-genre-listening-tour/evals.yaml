schema: 1
baseline: "Give me a history of {{genre}} through key songs."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-jazz-whole-history
    vars:
      genre: jazz
      stops: 12
      era_focus: whole-history
    assert:
      - {type: contains, value: "## The tour"}
      - {type: llm-rubric, value: "Gives twelve real, correctly attributed jazz recordings in chronological order from early jazz through bebop, cool, modal, free and fusion or later, each with a concrete change and a specific listen-for detail, notes at least one contested origin or first, avoids more than two stops per artist, and transcribes no lyrics or notation."}
  - name: edge-hip-hop-focused-era
    vars:
      genre: hip-hop
      stops: 8
      era_focus: "1979-1994"
    assert:
      - {type: llm-rubric, value: "Keeps all eight stops within 1979-1994 in order, explains changes such as sampling technology, drum machines and regional scenes in plain words, and names real tracks with correct years."}
  - name: negative-thin-micro-genre
    vars:
      genre: "a micro-genre that started on short-video apps in 2023"
      stops: 12
      era_focus: whole-history
    assert:
      - {type: llm-rubric, value: "Says the genre is too vague or too recent to have a documented history, asks which micro-genre is meant or shortens the tour and traces its likely sources, and does not invent recordings."}
