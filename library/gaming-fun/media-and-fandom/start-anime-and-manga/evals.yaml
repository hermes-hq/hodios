schema: 1
baseline: "I'm new to anime. Where should I start? I like {{favourite_genres}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-thriller-fan
    vars:
      favourite_genres: "Psychological thrillers, Breaking Bad, Sherlock"
      format: both
      content_limits: no gore
    assert:
      - {type: contains, value: "## Route"}
      - {type: llm-rubric, value: "Matches cat-and-mouse plotting and morally grey leads, starts with a short, complete title, builds to a bigger commitment, gives length, status, commitment and audience label for each real title, flags or avoids gore, explains official ways to watch without naming a specific platform's catalogue, and includes a glossary."}
  - name: edge-twelve-year-old-manga
    vars:
      favourite_genres: "Harry Potter, Percy Jackson, Minecraft"
      format: manga
      content_limits: "suitable for a 12-year-old"
    assert:
      - {type: llm-rubric, value: "Recommends manga only, chooses titles appropriate for a 12-year-old with content notes, tells the parent to check local ratings, avoids starting with a very long series, and explains labels such as shonen in plain words."}
  - name: negative-anything
    vars:
      favourite_genres: anything
      format: both
      content_limits: none
    assert:
      - {type: llm-rubric, value: "Asks for two or three films, shows, books or games they enjoyed before building a route, rather than listing the most famous anime."}
