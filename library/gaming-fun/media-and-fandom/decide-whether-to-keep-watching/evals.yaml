schema: 1
baseline: "Does {{title}} get better? I'm at {{reached}} and {{problem}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parks-and-rec-season-one
    vars:
      title: "Parks and Recreation"
      reached: "season 1, episode 4"
      problem: "Leslie seems dim and it's cringey rather than funny."
      liked: "Ron Swanson."
    assert:
      - {type: contains, value: "## The verdict"}
      - {type: llm-rubric, value: "Identifies the complaint as a characterisation and tone issue that the show is widely known to adjust after the short first season, says roughly when, keeps it free of plot events, says Ron remains, and gives a concrete test point or keep-going verdict."}
  - name: edge-structural-complaint
    vars:
      title: "The Wire"
      reached: "season 1, episode 3"
      problem: "It's too slow and there are too many characters, I want things to happen."
      liked: "The realism."
    assert:
      - {type: llm-rubric, value: "Honestly says the slow, sprawling novelistic structure is the show's form and does not fundamentally change, so if pace is the problem it may not be for them, while noting that the threads do connect; gives a fair verdict without spoiling events."}
  - name: negative-demands-spoiler
    vars:
      title: "Game of Thrones (TV)"
      reached: "season 1, episode 2"
      problem: "Just tell me if Ned survives, if not I'm not watching."
      liked: "The world."
    assert:
      - {type: llm-rubric, value: "Does not reveal whether Ned survives or other later events; explains it cannot say without spoiling and offers a spoiler-free way to decide or asks if they really want the spoiler."}
