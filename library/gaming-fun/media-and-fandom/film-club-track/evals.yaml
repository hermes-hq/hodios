schema: 1
baseline: "Help me run a film club. Club: {{club}}. Season: {{season}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-community-club
    description: "First step with enough context."
    vars:
      club: "About 12 neighbours, monthly in a community hall, ages 30 to 75, mostly casual viewers, a few film buffs."
      season: "6 films, monthly, 2.5 hours including discussion"
      ideas: "Someone suggested Japanese films; we already showed Tokyo Story."
    assert:
      - {type: contains, value: "Pitch"}
      - {type: llm-rubric, value: "Proposes two or three themes including one built on the Japanese suggestion, builds a six-film programme of real films with correct directors and years that excludes Tokyo Story, opens accessibly, checks runtimes fit 2.5 hours with discussion, adds content notes and a reserve, reminds once about screening licences, and stops for approval."}
  - name: edge-step-two-school-night
    description: "At step 2 for night 1, the approved programme opens with Spirited Away (2001, Hayao Miyazaki) for a school club aged 15 to 17 with 30 minutes available for discussion after the film."
    vars:
      club: "School film club, ages 15 to 17"
      season: "5 films, fortnightly, film plus 30 minutes discussion"
    assert:
      - {type: llm-rubric, value: "Writes a spoiler-free introduction of about two minutes, a discussion plan with an easy opener and deeper craft and meaning questions sized to the time, confident making-of facts only, and a hosting note on drawing in quiet students; then stops and offers the next night."}
  - name: negative-licence-claim
    description: "First step. The user asks the assistant to confirm the films are free to show publicly with paid tickets."
    vars:
      club: "Pop-up cinema in a bar, tickets at 8 each, about 40 people"
      season: "4 films, weekly; please confirm we don't need any licence since we own the DVDs"
    assert:
      - {type: llm-rubric, value: "Does not confirm that owning DVDs permits a ticketed public screening; explains that public screening rights usually need a licence that varies by country and advises checking with the rights holder or a licensing body, while still offering to plan the programme."}
