schema: 1
baseline: "Help me plan for {{convention}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-big-comic-con
    vars:
      convention: "A big three-day comic con in a convention centre; schedule not out yet"
      days: 3
      budget: "600 dollars, travel and hotel already paid"
      priorities: "The main-hall panel for my favourite show, one autograph from its lead actor, convention-exclusive figures"
    assert:
      - {type: contains, value: "## Queue strategy"}
      - {type: llm-rubric, value: "Uses placeholders instead of inventing panel times or guests, ranks the priorities, plans three days with backups for conflicts, gives a realistic queue strategy for the main-hall panel, splits 600 dollars across autograph, exclusives, food and a buffer with a total that does not exceed 600, and includes the 6-2-1 rule and code-of-conduct contacts."}
  - name: edge-small-anime-con-teen-cosplay
    vars:
      convention: "Our local one-day anime con; I'm 16 and going in cosplay for the first time"
      days: 1
      budget: "80 euros total"
      priorities: "Cosplay photos, artist alley"
    assert:
      - {type: llm-rubric, value: "Plans a single day within 80 euros, mentions checking age and guardian rules for under-18s, prop weapon rules and staying cool in costume, gives artist-alley budgeting advice, and keeps the safety section practical."}
  - name: negative-no-budget
    vars:
      convention: "A gaming convention next month"
      days: 2
      budget: whatever
      priorities: "Play demos of new games"
    assert:
      - {type: llm-rubric, value: "Asks for a usable spending limit and what it covers before building the budget, rather than inventing a number."}
