schema: 1
baseline: "I want to get into classic movies. I like {{modern_favourites}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-genre-bridges
    vars:
      modern_favourites: "Knives Out, Heat, Before Sunrise"
      hesitations: "slow pacing and black and white"
      number_of_films: 6
    assert:
      - {type: contains, value: "## Bridges from what you love"}
      - {type: llm-rubric, value: "Bridges each favourite to real older films (for example classic whodunits, heist or crime films such as Rififi or The Asphalt Jungle, dialogue-led romances), answers the slow and black-and-white hesitations with practical tips such as starting with short or colour films, orders six films from easy to demanding across at least three decades, and gives runtime bands and hooks."}
  - name: edge-dated-attitudes
    vars:
      modern_favourites: "Singin' in the Rain is the only old film I've seen and I loved it; also love La La Land."
      hesitations: "I worry about racist or sexist stuff in old films."
      number_of_films: 5
    assert:
      - {type: llm-rubric, value: "Excludes Singin' in the Rain, leans into musicals, and gives honest per-film content notes where attitudes have dated, without hiding problems or refusing to recommend classics."}
  - name: negative-no-taste-given
    vars:
      modern_favourites: "idk, movies"
      hesitations: nothing named
      number_of_films: 6
    assert:
      - {type: llm-rubric, value: "Asks for a few specific modern films or series they enjoy (or offers a short choice of genres) before building bridges, rather than giving a generic greatest-films list."}
