schema: 1
baseline: "Explain the references in {{work}}: {{moments}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-film-homages
    vars:
      work: "Pulp Fiction"
      moments: "The dance contest scene at Jack Rabbit Slim's and all the waiters dressed as celebrities."
      background: "Brazilian, 22, haven't seen many old American films."
    assert:
      - {type: contains, value: "## The references"}
      - {type: llm-rubric, value: "Explains the 1950s-themed restaurant and celebrity lookalikes (such as Marilyn Monroe, Buddy Holly), the casting resonance of John Travolta dancing given his 1970s dance-film fame, and why this works in the scene, pitched for a young viewer from outside the US, separating confirmed references from fan readings."}
  - name: edge-whole-chapter-classic
    vars:
      work: "Ulysses by James Joyce, episode 1 (Telemachus)"
      moments: "Go through the whole thing."
      background: "Read Homer's Odyssey at school."
    assert:
      - {type: llm-rubric, value: "Lists the key references in order including the Odyssey parallel, Irish-English and Catholic context, without quoting long passages, uses the reader's knowledge of Homer, and flags uncertain items under Not sure rather than inventing sources."}
  - name: negative-vague-input
    vars:
      work: "that show"
      moments: "the joke about the guy"
      background: not given
    assert:
      - {type: llm-rubric, value: "Asks which show and which moment or line before explaining, instead of guessing a reference."}
