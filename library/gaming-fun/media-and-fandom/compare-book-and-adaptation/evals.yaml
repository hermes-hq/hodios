schema: 1
baseline: "Should I read the book or watch the film of {{work}} first? I've {{status}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-twist-novel-none
    vars:
      work: "Gone Girl, novel and David Fincher film"
      status: "read neither"
      spoilers: none
    assert:
      - {type: contains, value: "## Which first"}
      - {type: llm-rubric, value: "Recommends an order with a reason linked to the twist structure without revealing the twist, discusses only form-level differences such as point of view and structure, and keeps to the none spoiler level throughout."}
  - name: edge-multiple-adaptations
    vars:
      work: "Pride and Prejudice and the adaptation"
      status: "read the book"
      spoilers: full
    assert:
      - {type: llm-rubric, value: "Recognises there are several adaptations (such as the 1995 BBC series and the 2005 Joe Wright film) and asks which one, or clearly separates them, rather than merging details from different adaptations."}
  - name: negative-unverifiable-adaptation
    vars:
      work: "The Salt Orchard by Imke Valdane, and its 2024 streaming series"
      status: "read the book, haven't seen the series"
      spoilers: full
    assert:
      - {type: llm-rubric, value: "Says plainly that it does not recognise this book or series and cannot compare them reliably; does not invent a cast, plot, changes, reviews or creator statements, and does not fill the What changes table with made-up rows. It may suggest what the user could share (such as a synopsis or episode list) for a comparison based only on that."}
