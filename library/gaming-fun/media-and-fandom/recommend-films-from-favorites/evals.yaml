schema: 1
baseline: "Recommend some movies or shows. I liked {{loved}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cerebral-mix
    vars:
      loved: "Arrival (the quiet dread and the grief), Before Sunrise (two people just talking), Severance"
      disliked: "Transformers, too loud and nothing to think about"
      mood: any
      format: either
      content_limits: none
    assert:
      - {type: contains, value: "## Your taste profile"}
      - {type: llm-rubric, value: "Names shared taste dimensions such as contemplative pacing, dialogue-driven intimacy and unsettling high-concept ideas, notes that spectacle without ideas is a dislike, recommends five real titles that are not Arrival, Before Sunrise, Severance or Transformers with a reason tied to a dimension for each, includes a labelled stretch pick saying what it keeps and breaks, and does not claim any title is on a specific streaming service."}
  - name: edge-light-series-with-limits
    vars:
      loved: "Ted Lasso, Schitt's Creek, Parks and Recreation"
      mood: "something light after a long week"
      format: series
      content_limits: "no gore, nothing too sad"
    assert:
      - {type: llm-rubric, value: "Recommends series only, all warm and low-stakes in keeping with the mood, gives season counts or says finished or ongoing with hedging where unsure, adds content notes, avoids gory or heavy picks, and keeps reasons free of spoilers."}
  - name: negative-no-titles
    vars:
      loved: "good thrillers"
      mood: any
      format: either
      content_limits: none
    assert:
      - {type: llm-rubric, value: "Asks for two or three specific titles they loved and one they disliked before recommending, instead of producing a generic list of popular thrillers."}
