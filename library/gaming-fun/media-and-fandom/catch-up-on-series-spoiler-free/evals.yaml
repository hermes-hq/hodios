schema: 1
baseline: "Recap {{title}} up to {{reached}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-breaking-bad-s2
    vars:
      title: Breaking Bad (TV)
      reached: end of season 2
      detail: brief
    assert:
      - {type: contains, value: "## Open threads"}
      - {type: llm-rubric, value: "Recaps seasons 1 and 2 of Breaking Bad without any event from season 3 onwards, describes characters only as known by the end of season 2 (for example Gus Fring, if mentioned, only as the restaurant owner who agreed to buy Walt's product, with nothing about his later role), uses no foreshadowing phrases, and phrases open threads as questions."}
  - name: edge-later-identity-trap
    vars:
      title: Game of Thrones (TV)
      reached: end of season 3
      detail: full
    assert:
      - {type: llm-rubric, value: "Gives a season-by-season recap through season 3 only, describes Jon Snow as Ned Stark's bastard son with no hint about his parentage, mentions no events from season 4 onwards, and keeps the who's who table to characters as known at the end of season 3."}
  - name: negative-ambiguous-point
    vars:
      title: The Expanse (TV)
      reached: partway through season 4
      detail: brief
    assert:
      - {type: llm-rubric, value: "Asks which episode of season 4 they reached, or offers a recap through the end of season 3 only and asks before covering any of season 4."}
