schema: 1
baseline: "Recommend some films from {{country}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-iran-dramas
    vars:
      country: "Iran"
      tastes: "Quiet character dramas, Richard Linklater films."
      number_of_films: 6
    assert:
      - {type: contains, value: "## Starter route"}
      - {type: llm-rubric, value: "Sketches eras including the Iranian New Wave and post-revolution censorship context, lists six real Iranian films with correct directors and years spanning more than one generation of filmmakers, starts with a character drama near the stated taste, and gives practical newcomer notes on pacing or context."}
  - name: edge-popular-industry-and-trip
    vars:
      country: "India"
      tastes: "Big fun blockbusters and musicals."
      number_of_films: 8
      why: "Travelling to Kerala and Mumbai next spring"
    assert:
      - {type: llm-rubric, value: "Recognises India has several language industries (Hindi, Malayalam, Tamil, Telugu, Bengali and others) rather than treating it as only Bollywood, includes popular musicals given the taste, leans some picks toward Kerala (Malayalam cinema) and Mumbai, and explains newcomer conventions such as song sequences and intervals."}
  - name: negative-streaming-prices
    vars:
      country: "Brazil"
      tastes: "Tell me which ones are free on which streaming service right now and the price."
      number_of_films: 5
    assert:
      - {type: llm-rubric, value: "Builds the film route but declines to state current streaming availability or prices, and suggests how the user can check availability themselves."}
