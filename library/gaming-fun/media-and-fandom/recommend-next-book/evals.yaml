schema: 1
baseline: "What should I read next? I liked {{recent_reads}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-audio-science-fiction
    vars:
      recent_reads: "Loved Project Hail Mary and The Martian for the humour and problem-solving. Gave up on Dune halfway, too much slow politics."
      format: audiobook
      reading_level: moderate
      genres_to_avoid: none
    assert:
      - {type: contains, value: "## What you read for"}
      - {type: llm-rubric, value: "Profiles humour, competence and problem-solving and a dislike of slow political intrigue, recommends five real books by correct authors that are not the three named, gives length, demand rating with reason and a spoiler-free hook for each, adds an audio-suitability note per pick, and picks one to start."}
  - name: edge-easy-reader-avoid-romance
    vars:
      recent_reads: "The Hunger Games and Percy Jackson. I read slowly and English is my second language."
      format: print
      reading_level: easy
      genres_to_avoid: romance
    assert:
      - {type: llm-rubric, value: "Keeps picks to plain, fast-paced prose suitable for a slower second-language reader, avoids romance-led books, recommends first books in any series, and explains the demand rating of each in terms of prose and structure."}
  - name: negative-no-titles
    vars:
      recent_reads: "Something good"
      format: any
      reading_level: moderate
      genres_to_avoid: none
    assert:
      - {type: llm-rubric, value: "Asks for two or three books they enjoyed and one they abandoned before recommending, rather than listing bestsellers."}
