schema: 1
baseline: "Plan a movie marathon for {{theme}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ghibli-day
    vars:
      theme: Studio Ghibli
      hours: 8
      audience: friends
      order: best-flow
    assert:
      - {type: contains, value: "## Total time"}
      - {type: llm-rubric, value: "Picks real Studio Ghibli films with approximate runtimes, orders them with an accessible opener and the most demanding film early, includes ten-minute gaps and a meal break, shows clock offsets, totals runtimes plus breaks within eight hours with correct arithmetic, matches food to the films, and gives spoiler-safe talking points."}
  - name: edge-extended-trilogy-does-not-fit
    vars:
      theme: "The Lord of the Rings extended editions"
      hours: 8
      audience: "two of us"
      order: release
    assert:
      - {type: llm-rubric, value: "Recognises that the three extended editions run roughly eleven hours or more and do not fit in eight hours, says so plainly, and offers options such as theatrical cuts, two days, or watching two films, with correct totals for the option chosen."}
  - name: negative-vague-theme
    vars:
      theme: something fun
      hours: 6
      audience: friends
      order: best-flow
    assert:
      - {type: llm-rubric, value: "Asks for a franchise, director, actor or idea before planning, or offers a few concrete theme options to choose from, rather than building a schedule around arbitrary films."}
