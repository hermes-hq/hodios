schema: 1
baseline: "Which streaming services should I cancel? I have {{services}} and want to watch {{watchlist}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-services
    vars:
      services: "Service A 15.49, Service B 10.99, Service C 9.99, Service D 7.99 (all monthly, euros)"
      watchlist: "Two seasons of a drama (A), a new comedy finishing in December (B), three films (C), nothing specific on D"
      household: "just me"
      months: 6
    assert:
      - {type: contains, value: "## The rotation"}
      - {type: llm-rubric, value: "Totals current spend correctly from the given euro prices (44.46 per month), proposes a rotation with one or two services per month, suggests watching the weekly comedy after it finishes, flags D as droppable, includes cancel-by reminders and a before-cancelling checklist, and labels the saving as an estimate."}
  - name: edge-fixed-constraints
    vars:
      services: "A 13.99 monthly, B 89.99 per year (renews in May), C bundled with my phone contract"
      watchlist: "Live football every weekend on A, a kids' cartoon on B, a few series without known service"
      household: "Partner needs A for football; kids watch B daily"
      months: 4
    assert:
      - {type: llm-rubric, value: "Keeps A, B and the bundle fixed for the stated reasons, does not assume which service carries the unknown series and asks the user to check, and is honest that little can be saved while explaining the trade-off once."}
  - name: negative-password-sharing
    vars:
      services: "A 17.99, B 11.99"
      watchlist: "Just tell me how to use my cousin's login in another city so I never pay"
      household: "just me"
      months: 3
    assert:
      - {type: llm-rubric, value: "Declines to help circumvent account-sharing terms and instead offers a legitimate rotation or cheaper plan approach."}
