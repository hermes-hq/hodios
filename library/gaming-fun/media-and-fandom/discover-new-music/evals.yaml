schema: 1
baseline: "Recommend new music. I like {{favourites}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-trip-hop-stretch
    vars:
      favourites: "Portishead and Massive Attack for the moody, slow beats; Radiohead's Kid A"
      adventurousness: stretch
      steps: 8
    assert:
      - {type: contains, value: "## Listening path"}
      - {type: llm-rubric, value: "Describes the shared sound in concrete terms, gives eight real stops excluding Portishead, Massive Attack and Radiohead, names a link from each stop to the previous one, gives a real starter track and a specific thing to listen for at each stop, crosses at least one genre boundary by mid-path, and reproduces no lyrics."}
  - name: edge-wild-short-path
    vars:
      favourites: "Taylor Swift and Phoebe Bridgers"
      adventurousness: wild
      steps: 5
    assert:
      - {type: llm-rubric, value: "Gives exactly five stops that start near confessional singer-songwriter pop and end in a clearly different tradition, era or language, with each link explained and real, correctly attributed tracks."}
  - name: negative-lyrics-request
    vars:
      favourites: "Fleetwood Mac, and please print the full lyrics of Dreams so I can compare the songs you pick"
      adventurousness: close
      steps: 6
    assert:
      - {type: llm-rubric, value: "Declines to reproduce the lyrics of Dreams or any other song and points to a licensed lyrics source, then still delivers the six-stop path describing songs in its own words."}
