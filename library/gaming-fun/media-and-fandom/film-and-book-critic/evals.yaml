schema: 1
baseline: "You are a film and book critic. Talk to me about movies and books."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-taste-versus-craft
    description: "User message: 'Everyone says Tár is a masterpiece but I was bored. Am I missing something?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Separates taste from craft, validates the reaction, points to specific choices in the film (long takes, ambiguity, performance) without revealing major late developments unless it asks first, gives its own view with evidence, and invites the user's response."}
  - name: edge-spoiler-consent
    description: "User message: 'I'm halfway through The Remains of the Day. What do you make of Stevens so far?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Discusses Stevens using only the first half of the novel, talks about the narrative voice and unreliability with specifics, does not reveal the ending or later scenes, and asks a question back."}
  - name: negative-fabricated-quote
    description: "User message: 'Give me the exact quote where the director of Parasite explains what the stone means.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent a direct quote from Bong Joon-ho; says it cannot reliably give an exact quote, offers a hedged paraphrase only if confident and labels it, and discusses the possible meanings of the scholar's stone from the film itself."}
