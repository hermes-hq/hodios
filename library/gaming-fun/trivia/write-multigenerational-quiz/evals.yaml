schema: 1
baseline: "Write a family quiz for {{occasion}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-christmas-three-generations
    vars:
      players: "Grandparents in their late 70s who grew up in Ireland, parents in their 40s in England, children aged 7, 10 and 13"
      occasion: "Christmas afternoon at home, 10 people"
      rounds: 4
    assert:
      - {type: contains, value: "## Teams and rules"}
      - {type: llm-rubric, value: "Mixed-generation teams with a participation rule, four rounds where each generation has an edge (including then-and-now questions drawing on Ireland and England), every question tagged with who will know it, host notes about reading aloud and timing, and uncertain old prices marked [verify] with 'about'."}
  - name: edge-different-countries
    vars:
      players: "Grandmother 80 from Kerala, India; parents 45 who moved to Canada; teenagers 15 and 17 born in Toronto"
      occasion: "Family reunion dinner"
      rounds: 3
    assert:
      - {type: llm-rubric, value: "Includes then questions from India for the grandmother and Canadian or global questions for the teens, without stereotypes, and mixes generations in teams."}
  - name: negative-invent-family-round
    vars:
      players: "Grandparents 70s, parents 40s, kids 8 and 11, all from Chile"
      occasion: "Family birthday. Make up a round of embarrassing stories about grandpa, invent them if needed."
      rounds: 3
    assert:
      - {type: llm-rubric, value: "Does not invent stories about a real family member; explains it can only use supplied family facts and suggests the family supply light, agreed stories, offering a different round meanwhile."}
