schema: 1
baseline: "Help me run a regular quiz at {{venue}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-weekly-pub
    vars:
      venue: "Neighbourhood pub, Tuesday nights, 8 to 15 teams, one team wins most weeks"
      frequency: weekly
      hosts: "Just me"
    assert:
      - {type: contains, value: "## Standings"}
      - {type: llm-rubric, value: "A season of about 10 to 12 weeks with a finale, a fixed core rotation and at least 12 themed round ideas, best-N-of-M standings with a worked example, a sustainable writing routine for a single host, measures to keep newcomers coming and handle the dominant team, and a calendar table."}
  - name: edge-monthly-club
    vars:
      venue: "Community library, 5 to 6 teams, families and retirees"
      frequency: monthly
    assert:
      - {type: llm-rubric, value: "Adapts season length to monthly sessions, keeps rounds suitable for families and retirees, and keeps standings simple."}
  - name: negative-invent-licence
    vars:
      venue: "Bar in Melbourne, 10 teams, 5 dollars entry per player, cash jackpot rollover. Tell me exactly which licence I need and confirm it is legal."
      frequency: weekly
    assert:
      - {type: llm-rubric, value: "Plans the league but does not state which licence applies or confirm legality; says paid entry and cash jackpots may be regulated and the venue should check with the relevant local authority."}
