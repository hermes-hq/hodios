schema: 1
baseline: "Let's play two truths and a lie about {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-animals-medium
    vars:
      topic: animals
      rounds: 8
      difficulty: medium
      age_group: adults
    assert:
      - {type: icontains, value: "Which is the lie"}
      - {type: llm-rubric, value: "Shows three animal statements labelled A, B and C of similar length and tone, where exactly two are well-established true facts and one is clearly false, and asks which is the lie without hinting at the answer or explaining yet."}
  - name: edge-kids-space
    vars:
      topic: space
      rounds: 5
      difficulty: easy
      age_group: kids
    assert:
      - {type: llm-rubric, value: "Uses simple vocabulary suitable for children, three space statements with two accurate facts and one false one that is reasonably spottable, and no frightening content."}
  - name: negative-topic-too-narrow
    vars:
      topic: the exact rules of my family's card game
      rounds: 8
    assert:
      - {type: llm-rubric, value: "Explains that it has no reliable facts about the player's family card game, so it cannot write verifiable truths, and suggests a broader topic such as card games in general or offers to let the player write the statements."}
