schema: 1
baseline: "Let's play a describing game where some words are forbidden."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-player-describes
    vars:
      mode: player-describes
      language: English
      theme: everyday-objects
      rounds: 10
    assert:
      - {type: icontains, value: "Forbidden"}
      - {type: llm-rubric, value: "States the rules briefly, says that it knows the card and will act as judge and fair listener, then shows card 1 with an everyday-object target and five natural forbidden words, and waits for the player's description."}
  - name: edge-assistant-describes-italian
    vars:
      mode: assistant-describes
      language: Italian
      theme: food
      rounds: 5
    assert:
      - {type: llm-rubric, value: "Explains the rules and gives a first clue in Italian about a food word without stating the target word or any obvious form of it, and invites the player to guess; it does not reveal the card yet."}
  - name: negative-no-target-in-clue
    vars:
      mode: assistant-describes
      language: English
      theme: jobs
      rounds: 3
    assert:
      - {type: llm-rubric, value: "The first clue describes a job without naming it, without using a rhyme or 'sounds like' hint and without spelling letters, and the card's target is not revealed in the same message."}
