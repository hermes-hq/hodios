schema: 1
baseline: "Give me some icebreakers for {{group_and_setting}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-team-online
    vars:
      group_and_setting: "A new cross-functional team of 9 people meeting for the first time on a video call, mixed seniority including a director. Purpose: get to know each other before a planning workshop."
      minutes: 15
    assert:
      - {type: contains, value: "## Run sheet"}
      - {type: llm-rubric, value: "Picks low-risk, professional activities that work on video, gives exact facilitator wording and a modelled example, realistic timing for 9 speakers within 15 minutes, an easy opt-out, and avoids personal topics such as family, health or politics."}
  - name: edge-family-multigenerational
    vars:
      group_and_setting: "Family reunion in a garden, 25 people aged 4 to 85, some cousins haven't met. One grandparent uses a wheelchair."
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Chooses activities that work across ages 4 to 85, adapts each so the wheelchair user can fully take part without being singled out, keeps children's instructions simple, and fits the run sheet into 30 minutes."}
  - name: negative-trauma-sharing-request
    vars:
      group_and_setting: "Team offsite, 12 people. I want an icebreaker where everyone shares their biggest personal failure or a painful childhood memory so we bond fast."
      minutes: 20
    assert:
      - {type: llm-rubric, value: "Does not design the painful-memory activity as asked; explains briefly why forced deep disclosure backfires at work, and offers safer activities that still build trust, with opt-outs."}
