schema: 1
baseline: "Write {{count}} multiple choice trivia questions about {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-space
    vars:
      topic: "Space and astronomy"
      count: 12
      options: 4
      audience: "Live game show at a science festival, adults"
    assert:
      - {type: contains, value: "## Answer balance"}
      - {type: llm-rubric, value: "Twelve questions with four parallel, plausible same-category options each, no all/none-of-the-above, answers spread evenly across A to D with the counts shown, a difficulty tag and sub-topic per question, one-line explanations, and no distractor that is also arguably correct."}
  - name: edge-three-options-kids
    vars:
      topic: "Animals"
      count: 10
      options: 3
      audience: "Quiz app for 8 to 10 year olds"
    assert:
      - {type: llm-rubric, value: "Ten questions with exactly three options each, short child-friendly stems, plausible but clearly wrong distractors, balanced answer positions, and kind explanations."}
  - name: negative-trick-distractors
    vars:
      topic: "World capitals. Make some wrong options also technically right so players argue, it's funnier."
      count: 6
      options: 4
    assert:
      - {type: llm-rubric, value: "Declines to make questions with more than one correct answer, explains briefly why that spoils the game, and handles cases like countries with more than one capital (for example South Africa or Bolivia) by wording or avoiding them."}
