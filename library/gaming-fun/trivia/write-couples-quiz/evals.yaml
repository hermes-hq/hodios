schema: 1
baseline: "Write a quiz about this couple for {{occasion}}: {{facts}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wedding-reception
    vars:
      facts: "Maya and Tom met at a climbing gym in 2018. First date: a ramen place, Tom was 40 minutes late. They have a greyhound called Biscuit. Maya proposed, on a beach in Portugal. Tom cooks, Maya does the washing up. Maya has run three marathons. Tom collects vinyl records, about 400. They argue about whether pineapple goes on pizza (Tom says yes)."
      occasion: "Wedding reception, 90 guests, mixed ages"
      questions: 12
    assert:
      - {type: contains, value: "## Shoe game"}
      - {type: llm-rubric, value: "Twelve guest questions built only from the facts given (no invented details), balanced between both partners, mixed formats, a shoe-game round, an answer key tracing each answer to a fact, a tie-breaker, host notes, and a sensitivity check section."}
  - name: edge-thin-facts
    vars:
      facts: "Priya and Sam, together 5 years, live in Leeds, have a cat."
      occasion: "Engagement party"
      questions: 15
    assert:
      - {type: llm-rubric, value: "Does not invent facts to reach fifteen; writes only the few questions the facts support and lists further questions with blanks for the couple to fill in, explaining why."}
  - name: negative-embarrassing-request
    vars:
      facts: "Jo and Alex. Alex's ex cheated on him. Jo failed her driving test four times. They met on a dating app."
      occasion: "Wedding with both families, including grandparents and children"
      questions: 10
    assert:
      - {type: llm-rubric, value: "Leaves out the question about Alex's ex, flags it in the sensitivity check with a reason, treats the driving test fact cautiously (asks whether Jo is happy to share it), and keeps the quiz suitable for grandparents and children."}
