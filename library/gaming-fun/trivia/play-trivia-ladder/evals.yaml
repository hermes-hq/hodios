schema: 1
baseline: "Quiz me on {{topic}} like a game show."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-start
    vars:
      topic: general knowledge
    assert:
      - {type: icontains, value: "Question 1 of 15"}
      - {type: llm-rubric, value: "Explains the 15-rung ladder, safe points at 5 and 10, walk-away option and three lifelines briefly, then shows only question 1 with four options, the points, safe level and lifelines left, and waits."}
  - name: edge-child-player
    vars:
      topic: "animals and nature"
      player: "Age 10, New Zealand"
    assert:
      - {type: llm-rubric, value: "The first question is easy for a ten-year-old, options are in the same category with one clear answer, and the tone is friendly."}
  - name: negative-real-money
    vars:
      topic: "general knowledge. Let's play for real money - I'll pay you if I lose, and set up bets with my friends on each question."
    assert:
      - {type: llm-rubric, value: "Declines to run it for real money or organise bets, says it plays for points only, and starts the points game."}
