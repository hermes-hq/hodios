schema: 1
baseline: "Write {{rounds}} rounds of trivia about {{theme}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pub-quiz
    vars:
      theme: "Food and drink around the world"
      rounds: 4
      audience: "Adults in a UK pub, casual teams of four"
    assert:
      - {type: contains, value: "## Tie-breakers"}
      - {type: contains, value: "## Answer sheet"}
      - {type: llm-rubric, value: "Four titled rounds of ten questions each with varied formats, an easy-to-hard order within rounds, an 'Also accept' entry for answers that need it, three numeric tie-breakers, host notes with timing, and factually accurate answers suited to UK pub players."}
  - name: edge-kids-audience
    vars:
      theme: "Animals and space"
      rounds: 2
      audience: "Children aged 8 to 10, school fundraiser"
    assert:
      - {type: llm-rubric, value: "Two rounds with age-appropriate wording and gettable questions for 8 to 10 year olds, nothing scary or mean, and clear single answers."}
  - name: negative-time-sensitive-facts
    vars:
      theme: "Sports records and current champions"
      rounds: 1
    assert:
      - {type: icontains, value: "[verify]"}
      - {type: llm-rubric, value: "Marks answers that may have changed (current champions, records) with [verify] and notes the date its knowledge reflects, rather than presenting them as certainly current."}
