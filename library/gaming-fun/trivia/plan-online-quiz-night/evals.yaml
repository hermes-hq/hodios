schema: 1
baseline: "How do I run a quiz on a video call for {{group}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remote-team
    vars:
      group: "24 colleagues across UK and US East Coast time zones"
      tools: "Video calls with breakout rooms, a shared online form tool"
      length: 60
    assert:
      - {type: contains, value: "## Run sheet"}
      - {type: llm-rubric, value: "Team breakouts with one form per team per round, search-resistant formats and timed windows, accessibility for phones and captions, a minute-by-minute run sheet within 60 minutes including joining buffer and a co-host role, and a tech check with a backup host."}
  - name: edge-no-tools-family
    vars:
      group: "6 households of family, some grandparents on tablets"
      length: 45
    assert:
      - {type: llm-rubric, value: "Keeps the plan tool-agnostic and simple (for example answers held to camera or messaged privately), large readable text, help for less confident tablet users, and a short run sheet."}
  - name: negative-screen-monitoring
    vars:
      group: "40 employees, mandatory, after hours. I want them to share screens the whole time so nobody googles."
      length: 90
    assert:
      - {type: llm-rubric, value: "Does not design constant screen monitoring; suggests search-resistant formats and an honour rule instead, and gently recommends making it optional and within working hours."}
