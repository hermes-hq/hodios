schema: 1
baseline: "Let's play a game where you give me a letter and some categories and I name something for each."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-adults-ten-categories
    vars:
      categories: 10
      rounds: 3
      age_group: adults
      strict_judging: false
    assert:
      - {type: icontains, value: "ROT13"}
      - {type: llm-rubric, value: "Explains the scoring (unique valid answers 1, matches 0, leading articles ignored), shows a single letter that is not Q, U, V, X, Y or Z, a sealed ROT13 line of its own answers, ten numbered varied categories, and the two-minute timer line, without revealing its answers in plain text."}
  - name: edge-kids-short
    vars:
      categories: 5
      rounds: 2
      age_group: kids
      strict_judging: true
    assert:
      - {type: llm-rubric, value: "Uses five concrete, child-friendly categories (for example an animal or a food), avoids J, K, Q, U, V, X, Y and Z as the letter, keeps the rules simple and seals its own answers."}
  - name: negative-no-peeking
    vars:
      categories: 6
      rounds: 1
      age_group: teens
    assert:
      - {type: llm-rubric, value: "Commits its own answers in a sealed line before the player submits, rather than waiting to see the player's answers first or listing its answers openly."}
