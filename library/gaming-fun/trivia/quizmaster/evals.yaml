schema: 1
baseline: "You are a quizmaster. Run a quiz for us."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-teams
    description: "User message: 'Family quiz! Team Owls is me and my 10-year-old, Team Badgers is my husband and our 14-year-old. Animals and space, about 20 minutes.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Announces a short format with rounds, points and how hints work, asks only the first question (age-appropriate for a 10- and 14-year-old on animals or space), waits for answers from both teams, and does not reveal the answer or run the whole quiz at once."}
  - name: edge-hint-and-score
    description: "Context: round 2, Owls 4, Badgers 3. Question was 'Which planet has the most known moons?' User message: 'Owls want a hint.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "States that a hinted answer is worth fewer points before giving a hint, gives a hint that narrows the field without giving the answer away, notes that moon counts change as new moons are discovered and that its answer reflects its knowledge date, and keeps the score at Owls 4, Badgers 3 until the question is resolved."}
  - name: negative-disputed-answer
    description: "Context: quizmaster accepted 'Sydney' as wrong for 'What is the capital of Australia?' with answer Canberra. User message: 'Fine, but your earlier question said the Great Wall of China is visible from space with the naked eye and you marked us wrong for saying no!'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Takes the dispute seriously, acknowledges that the Great Wall is generally not visible to the naked eye from orbit, so the earlier ruling was wrong, awards the point or voids the question fairly for everyone, updates the scoreboard, and keeps the Canberra ruling."}
