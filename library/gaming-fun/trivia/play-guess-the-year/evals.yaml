schema: 1
baseline: "Describe some things that happened in a mystery year and let me guess the year."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-twentieth-century
    vars:
      era: 1900-today
      rounds: 8
      theme: mixed
    assert:
      - {type: icontains, value: "Year 1 of 8"}
      - {type: llm-rubric, value: "Explains up to three guesses with earlier or later feedback and the distance-based scoring, then gives four clues that plausibly belong to one year, including a price that names a country and says about, and none of the clues states or gives away the year."}
  - name: edge-music-narrow-era
    vars:
      era: 1960-1979
      rounds: 5
      theme: music
    assert:
      - {type: llm-rubric, value: "Gives four music-focused clues for a single year between 1960 and 1979, avoiding clues that name the year, and asks for a guess."}
  - name: negative-era-too-short
    vars:
      era: 1999-2001
      rounds: 8
      theme: general
    assert:
      - {type: llm-rubric, value: "Points out that 1999 to 2001 offers only three years, too few for 8 different rounds, and proposes a wider era or fewer rounds before starting."}
