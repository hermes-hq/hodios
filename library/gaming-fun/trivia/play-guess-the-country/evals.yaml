schema: 1
baseline: "Give me clues about a mystery country and let me guess it."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-world-countries
    vars:
      target: country
      region: world
      rounds: 8
      clues_per_target: 5
    assert:
      - {type: icontains, value: "Clue 1/5"}
      - {type: llm-rubric, value: "Explains the scoring (5 points on the first clue down to 1, one guess per clue, pass allowed), then gives only the first clue, which is true, obscure and does not name the country or use population, leader or economic ranking figures."}
  - name: edge-european-capitals
    vars:
      target: capital
      region: Europe
      rounds: 5
      clues_per_target: 4
    assert:
      - {type: llm-rubric, value: "Starts a round for a mystery European capital with a first clue that is hard but accurate, uses a four-clue ladder, and mentions that local-language names are accepted."}
  - name: negative-region-too-small
    vars:
      target: country
      region: the Benelux countries
      rounds: 10
      clues_per_target: 5
    assert:
      - {type: llm-rubric, value: "Points out that the Benelux region has only three countries, too few for 10 rounds, and suggests a larger region, fewer rounds or capitals and landmarks instead, before starting."}
