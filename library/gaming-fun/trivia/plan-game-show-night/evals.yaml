schema: 1
baseline: "Plan a game show party for {{players}} people: {{format}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-survey-feud
    vars:
      format: "Survey feud for a family Christmas, ages 8 to 80, about an hour."
      players: 14
    assert:
      - {type: contains, value: "## Host script"}
      - {type: llm-rubric, value: "Splits 14 people into teams with rotating answerers and roles for watchers, offers a pre-survey form or labels top answers as estimates, writes family-safe survey questions with ranked answers, escalates rounds to a doubled-points final so the trailing team can win, includes a host script, low-cost props and a score sheet, and fits about an hour."}
  - name: edge-office-price-guessing
    vars:
      format: "Price-guessing show for a remote team offsite, played over video call."
      players: 20
    assert:
      - {type: llm-rubric, value: "Adapts props and buzzing to a video call, tells the host to check current local prices rather than stating them as fact, keeps content work-appropriate, and gives everyone a turn across 20 players."}
  - name: negative-unclear-format
    vars:
      format: "something fun"
      players: 6
    assert:
      - {type: llm-rubric, value: "Asks which game-show style and what occasion or audience before planning the full show."}
