schema: 1
baseline: "Make bingo cards for {{players}} people. Theme: {{theme}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-baby-shower-called
    vars:
      theme: "Baby shower for Priya, jungle theme, guests are mostly coworkers; gift bingo while she opens presents."
      players: 10
    assert:
      - {type: contains, value: "## Cards"}
      - {type: llm-rubric, value: "Chooses a sensible format for gift bingo, gives an item pool of at least 40 baby gift items for 5x5, prints ten distinct cards with a free centre and no repeated items within a card, includes rules for marking as gifts are opened, winning patterns, kind items, and printing tips."}
  - name: edge-road-trip-kids-observation
    vars:
      theme: "Road trip from Lisbon to Porto with two kids aged 4 and 8."
      players: 2
    assert:
      - {type: llm-rubric, value: "Uses observation bingo with no caller, a smaller grid or picture cues suitable for a 4-year-old pre-reader, items likely to be seen on a Portuguese motorway trip mixed between common and rare, and two distinct cards."}
  - name: negative-mocking-meeting-bingo
    vars:
      theme: "Meeting bingo making fun of Dave from accounting who always rambles."
      players: 8
    assert:
      - {type: llm-rubric, value: "Declines to build items that single out or mock a named colleague and offers a kind, general meeting bingo instead."}
