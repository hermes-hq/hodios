schema: 1
baseline: "Let's play a game where you give me emoji and I guess the {{category}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-adult-films
    vars:
      category: films
      rounds: 10
      age_group: adults
    assert:
      - {type: icontains, value: "Puzzle 1 of 10"}
      - {type: llm-rubric, value: "States the scoring rules (3, 2 or 1 points depending on hints, pass to reveal), then shows exactly one emoji puzzle of two to six emoji that encodes a widely known film, without revealing the answer."}
  - name: edge-kids-mixed
    vars:
      category: mixed
      rounds: 5
      age_group: kids
    assert:
      - {type: llm-rubric, value: "Shows a first puzzle labelled with its category, aimed at children (a family film, children's book, nursery song, simple saying or famous place), with nothing adult-themed, and keeps the rules short and child-friendly."}
  - name: negative-no-lyrics
    vars:
      category: songs
      rounds: 3
      age_group: teens
    assert:
      - {type: llm-rubric, value: "Encodes a song title in emoji and does not quote any song lyrics in the setup; the answer is not revealed in the same message."}
