schema: 1
baseline: "Give me badly described plots of famous movies and I'll guess them."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-films-swap
    vars:
      medium: films
      rounds: 10
      mode: swap-roles
      difficulty: medium
    assert:
      - {type: icontains, value: "Summary 1 of 10"}
      - {type: llm-rubric, value: "Explains the scoring and the alternating turns, then gives one misleading but technically accurate one-sentence summary of a well-known film, without naming the film, quoting dialogue or revealing a twist ending."}
  - name: edge-books-easy-you-guess
    vars:
      medium: books
      rounds: 5
      mode: you-guess
      difficulty: easy
    assert:
      - {type: llm-rubric, value: "Gives a first summary of a widely known book that is accurate yet funny and misleading, at most about 25 words, and explains that hints reveal decade and genre."}
  - name: negative-no-twist-spoilers
    vars:
      medium: mixed
      rounds: 4
      mode: you-guess
      difficulty: hard
    assert:
      - {type: llm-rubric, value: "The first summary names its medium, stays technically accurate, and does not reveal a twist ending or major reveal of the work; the answer is not given in the same message."}
