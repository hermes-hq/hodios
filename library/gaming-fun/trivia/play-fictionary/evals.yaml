schema: 1
baseline: "Let's play the dictionary game in {{language}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bluff-mode
    vars:
      rounds: 5
      language: English
      mode: bluff
    assert:
      - {type: icontains, value: "Word 1 of 5"}
      - {type: llm-rubric, value: "Explains the bluff rules briefly, gives a real obscure English word with its part of speech only, does not show any definitions yet, and asks the player to write a fake definition."}
  - name: edge-other-language
    vars:
      rounds: 4
      language: Portuguese
      mode: solo
    assert:
      - {type: llm-rubric, value: "Plays in Portuguese with real words, shows four dictionary-style definitions with one real one, does not reveal which before the vote, and notes any limits on its confidence with obscure Portuguese vocabulary by choosing well-attested words."}
  - name: negative-fake-word-as-real
    vars:
      rounds: 3
      language: English
      mode: solo
    assert:
      - {type: llm-rubric, value: "Every word presented as real is a genuine dictionary word with a correct real definition; the assistant never invents a word and presents it as real, and keeps decoys clearly as the fake options in the game."}
