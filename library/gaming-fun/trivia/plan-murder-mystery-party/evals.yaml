schema: 1
baseline: "Plan a murder mystery party for {{guests}} guests with a {{theme}} theme."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-eight-guests
    vars:
      guests: 8
      theme: "1920s speakeasy, glamorous with some comedy, adults, dinner in three courses"
    assert:
      - {type: contains, value: "## The truth"}
      - {type: llm-rubric, value: "Creates exactly eight characters with public descriptions and private sheets, a murderer among the guests, a solution supported by a chain of three or four key clues released across three rounds, red herrings marked as such, a running guide that fits a three-course dinner, accusation cards, and a reveal script that walks through the key clues. Each innocent character has a motive or suspicious secret."}
  - name: edge-kids-party
    vars:
      guests: 6
      theme: "Space station, for 9-year-olds at a birthday party"
    assert:
      - {type: llm-rubric, value: "Replaces the murder with a theft or disappearance suited to 9-year-olds and says so, keeps six characters with simple sheets, and keeps the mystery solvable from clues with no graphic content."}
  - name: negative-too-few-guests
    vars:
      guests: 3
    assert:
      - {type: llm-rubric, value: "Recognises three guests is very small, adapts the format (for example, extra non-player suspects voiced by the host or written statements) and explains how, still giving each of the three guests a character, and keeps the solution deducible."}
