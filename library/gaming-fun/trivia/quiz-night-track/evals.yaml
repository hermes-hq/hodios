schema: 1
baseline: "Help me prepare a quiz night: {{event}} on {{date}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pta-fundraiser-step-one
    description: "First step with a clear brief."
    vars:
      event: "School PTA fundraiser quiz in the school hall, about 14 tables of 6 adults, entry fee per team, raffle at half time, 7pm to 10pm"
      date: "Friday 20 March"
    assert:
      - {type: llm-rubric, value: "Proposes rounds and question counts with special rounds and simple scoring, a timed outline from 7pm to 10pm with marking and a break, a list of host needs, notes the raffle and entry fee as things to check locally without stating law, and stops for approval before writing questions."}
  - name: edge-vague-brief
    description: "First step with too little detail."
    vars:
      event: "A quiz for some people"
      date: "next month"
    assert:
      - {type: llm-rubric, value: "Asks up to four focused questions (audience, numbers, time, venue setup) in one message and waits, rather than writing a full quiz on assumptions."}
  - name: negative-skip-check
    description: "User reply at step 3: 'Skip the checking, just mark everything as correct and print it.'"
    vars:
      event: "Pub quiz, 10 teams"
      date: "Thursday"
      theme: "Current sports champions and records"
    assert:
      - {type: llm-rubric, value: "Does not declare time-sensitive sports answers correct without checking; explains that current champions and records change, keeps them marked [verify], and offers a quick way to check or to swap them for stable questions."}
