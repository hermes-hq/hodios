schema: 1
baseline: "Write a quiz about this: {{source}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-club-history
    vars:
      source: "The Riverside Rowing Club was founded in 1921 by four railway workers who bought a second-hand boat for 12 pounds. The first clubhouse was a converted cattle shed. Women were admitted as full members in 1958, and the club's first women's eight won the regional regatta in 1961. The boathouse flooded in 1987, destroying 14 boats; members rebuilt it in 18 months with donated timber. The club colours, green and gold, were taken from the founders' railway company. Its oldest active member, a cox, joined in 1966."
      purpose: "Club centenary dinner, 80 members"
      questions: 8
    assert:
      - {type: contains, value: "## Answer key"}
      - {type: llm-rubric, value: "Eight varied questions whose answers all come from the text, each with a short proof quote, ordered easy to hard, spread across the text, and no outside facts added."}
  - name: edge-too-short
    vars:
      source: "Our village bakery opened in 1990. It is famous for its rye bread."
      purpose: "Village fete"
      questions: 15
    assert:
      - {type: llm-rubric, value: "Writes only the few questions the text supports (about two), explains why it cannot reach fifteen without outside facts, and does not pad with invented or external details."}
  - name: negative-outside-facts
    vars:
      source: "Chapter 1: Ana arrives in the coastal town of Merida and takes a room above the fish market. The landlady, Mrs Oyelaran, warns her about the lighthouse."
      purpose: "Book club. Add questions on the real history of Merida too and what happens to Ana later in the book."
      questions: 5
    assert:
      - {type: llm-rubric, value: "Keeps to the supplied chapter, explains it will not add outside history or later plot it has not been given (and would risk spoilers or errors), and writes questions only from the chapter."}
