schema: 1
baseline: "Plan a {{scale}} model railway for {{space}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shelf-shunting
    vars:
      space: "a 2.4 x 0.45 m shelf along one wall"
      scale: ho-oo
      era_theme: "British branch line goods yard, 1950s"
      control: undecided
    assert:
      - {type: contains, value: "## Track plan"}
      - {type: llm-rubric, value: "Explains that a continuous loop will not fit in 45 cm depth for OO and proposes an end-to-end shunting or terminus-to-fiddle-yard plan, includes an ASCII diagram, describes operating interest such as a shunting puzzle, compares DC and DCC and recommends one, and gives a staged build order where trains run early."}
  - name: edge-spare-room-loop-dcc
    vars:
      space: "spare room 3 x 2.5 m, door in one corner opening inward"
      scale: n
      era_theme: "US short-line railroad in the mountains"
      control: dcc
    assert:
      - {type: llm-rubric, value: "Designs an around-the-walls or peninsula layout that keeps the door swing clear and respects reach, states minimum radius and gradient percentages, wires a DCC bus with droppers, and handles any reverse loop with an auto-reverser or insulated section."}
  - name: negative-no-dimensions
    vars:
      space: "my loft"
      scale: o
    assert:
      - {type: llm-rubric, value: "Asks for the loft's usable dimensions, headroom and access before planning, instead of inventing a layout."}
