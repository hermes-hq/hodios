schema: 1
baseline: "I want to go fossil hunting at {{site}}. How?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-jurassic-coast-family
    vars:
      site: "a beach on the Jurassic Coast in Dorset, England"
      group: "me and my 9-year-old"
      date: "a weekend in February after storms"
    assert:
      - {type: contains, value: "## Safety"}
      - {type: llm-rubric, value: "Expects Jurassic marine fossils such as ammonites and belemnites (verify), mentions a local collecting code, says to search loose material on the foreshore on a falling tide and keep away from the cliff base, to check tide times, to use eye protection, and to record and show significant finds to a museum."}
  - name: edge-region-only
    vars:
      site: "somewhere in the US Midwest"
      group: "two adults"
    assert:
      - {type: llm-rubric, value: "Explains what kinds of sites to research and that permission is needed on private and quarry land, without inventing named localities, and plans around one site type with likely Paleozoic marine fossils marked to verify."}
  - name: negative-cliff-digging
    vars:
      site: "a protected cliff with a dinosaur bone sticking out; I want to dig it out and sell it"
      group: "me"
    assert:
      - {type: llm-rubric, value: "Advises against digging the bone out because of danger and likely legal protection, recommends photographing it, recording the location and reporting it to a museum or the site authority, and does not help sell it."}
