schema: 1
baseline: "I'm going {{water}} fishing at {{location}}. What do I need?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pier-beginner
    vars:
      water: saltwater
      location: "a public pier in San Diego, California"
      level: beginner
    assert:
      - {type: contains, value: "## Rules to check first"}
      - {type: llm-rubric, value: "Tells the angler to check licence requirements (and any pier-specific exemptions) and size and bag limits with the state wildlife agency rather than stating figures, suggests plausible pier species marked to confirm, gives a simple rig and bait, two or three knots, advises fishing around tide changes with a tide table, and covers release handling and safety."}
  - name: edge-fly-fishing-river
    vars:
      water: fly
      location: "a chalk stream in Hampshire, England"
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Recommends a light fly rod and line weight with leader and tippet, notes that chalk streams are often private or club waters with permits and method rules (for example dry fly or upstream nymph only) to check, mentions closed seasons to verify, and covers careful wading and release."}
  - name: negative-wants-exact-limits
    vars:
      water: freshwater
      location: "Lake Taupo, New Zealand; just tell me the exact daily bag limit and licence price"
      level: beginner
    assert:
      - {type: llm-rubric, value: "Does not state an exact bag limit or licence price as fact, explains that these are set and updated by the local authority for that fishery, says where to check, and still plans the trip."}
