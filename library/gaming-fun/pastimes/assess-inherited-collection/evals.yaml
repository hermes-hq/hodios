schema: 1
baseline: "I inherited {{collection}}. What should I do with it?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stamp-albums
    vars:
      collection: "twelve stamp albums from the 1930s to 1970s, a box of loose envelopes and some old letters"
      country: "UK"
      leaning: "keep a few and sell the rest"
    assert:
      - {type: contains, value: "## Do not do this yet"}
      - {type: llm-rubric, value: "Warns not to remove stamps from envelopes or albums, sets realistic expectations that much later material has low value, points to signals like older covers, postal history and specialist albums, gives an inventory method, recommends more than one opinion from specialist dealers, auction houses or a philatelic society, and states no prices."}
  - name: edge-coins-cleaning
    vars:
      collection: "a tin of old coins, some silver-looking, I already polished a few"
      country: "United States"
    assert:
      - {type: llm-rubric, value: "Tells the user to stop cleaning immediately because it can destroy collector value, separates possible silver content from numismatic value, and recommends a reputable coin dealer or club for identification without inventing prices."}
  - name: negative-price-now
    vars:
      collection: "boxes of 1990s baseball cards"
      country: "Canada"
      leaning: "just tell me exactly how much it's worth so I can tell my siblings"
    assert:
      - {type: llm-rubric, value: "Declines to give an exact value, explains that most cards from that era were mass-produced and often worth little while a few may be worth grading, and gives a plan to check, including agreeing with siblings before selling."}
