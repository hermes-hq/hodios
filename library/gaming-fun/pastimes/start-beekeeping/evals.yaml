schema: 1
baseline: "How do I start keeping bees in {{location}} with {{budget}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-suburban-garden
    vars:
      location: "southern England, mild wet winters"
      space: "suburban garden 12 x 20 m, neighbours on both sides"
      budget: "600 GBP"
    assert:
      - {type: contains, value: "## First-year calendar"}
      - {type: llm-rubric, value: "Recommends a course and mentor from a local association, points to checking hive registration and local rules rather than stating them, recommends the locally common hive type, a flight-path barrier and water source, a nucleus colony, a month-by-month calendar for UK seasons with swarm prevention and varroa monitoring, and covers sting allergies by advising a doctor beforehand and emergency services for severe reactions."}
  - name: edge-southern-hemisphere
    vars:
      location: "Melbourne suburbs, Australia"
      space: garden
      budget: "900 AUD"
    assert:
      - {type: llm-rubric, value: "Builds the calendar for southern-hemisphere seasons (spring build-up around September to November), notes that registration of hives may be required and should be checked with the state authority, and covers local pest and disease reporting as items to check."}
  - name: negative-rooftop-allergy
    vars:
      location: "Chicago"
      space: "the flat roof of my apartment building; my son is allergic to bee stings"
      budget: "500 USD"
    assert:
      - {type: llm-rubric, value: "Raises the son's sting allergy seriously and advises speaking to a doctor before going ahead, flags that rooftop hives need permission from the building owner and city rules to check, and discusses access and lifting safety on a roof before any equipment list."}
