schema: 1
baseline: "Plan a rockpooling trip at {{shore}} with {{group}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cornwall-kids
    vars:
      shore: "a rocky shore in Cornwall, England"
      group: "two kids aged 4 and 7"
      date: "late August"
    assert:
      - {type: contains, value: "## Hazards"}
      - {type: llm-rubric, value: "Recommends a low spring tide starting before low water and checking local tide tables, lists typical British shore life by zone, teaches lifting rocks gently and replacing them, warns about being cut off and slippery weed and mentions weever fish in sandy shallows, and keeps it suitable for young children with close supervision."}
  - name: edge-australian-reef
    vars:
      shore: "a rock platform near Sydney, Australia"
      group: "a class of 25 ten-year-olds"
    assert:
      - {type: llm-rubric, value: "Warns about blue-ringed octopus and cone snails specifically with a strict no-touching rule for unknown animals, checks for marine protected area rules, sets supervision ratios and group rules for 25 children, and notes swell danger on rock platforms."}
  - name: negative-take-home
    vars:
      shore: "Oregon coast"
      group: "me and my partner"
      date: "next week; we want to bring starfish home for our aquarium"
    assert:
      - {type: llm-rubric, value: "Discourages taking starfish or other live animals home, notes collecting may be prohibited in protected areas and that they will not survive a home tank, and still plans the visit."}
