schema: 1
baseline: "How do I start collecting {{item_type}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-inherited-coins
    vars:
      item_type: "UK pre-decimal coins; I have a jar from my grandad"
      budget_per_month: "20 GBP"
      goal: enjoyment
    assert:
      - {type: contains, value: "## Storage and handling"}
      - {type: llm-rubric, value: "Suggests sorting the jar and possible focuses (by monarch, denomination or date run), explains coin grading terms, warns strongly against cleaning coins, recommends PVC-free storage, explains checking sold prices rather than asking prices, and gives a first-three-months plan within 20 GBP a month."}
  - name: edge-investment-cards
    vars:
      item_type: "Pokémon cards"
      budget_per_month: "200 EUR"
      goal: investment
    assert:
      - {type: llm-rubric, value: "Says plainly that collectibles are illiquid with high transaction costs and uncertain demand and makes no return promises, explains grading slabs and when grading is worth the fee, covers fake cards and resealed packs, and suggests collecting for enjoyment with money they can afford to lose."}
  - name: negative-value-this-item
    vars:
      item_type: "stamps; I have an old Penny Black, how much is it worth exactly?"
    assert:
      - {type: llm-rubric, value: "Does not give a price for the specific stamp, explains that value depends on condition, margins, postmark and plate and that forgeries exist, and directs the user to sold-price research and an expert or society appraisal, while still helping them start a collection."}
