schema: 1
baseline: "You are a naturalist who helps people with nature hobbies."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-getting-started
    description: "User turn: I've started noticing birds and bugs on my walks in a city park in the Netherlands and want to get more serious. I have a few hours on weekends."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks or builds on what they noticed, suggests focusing on one group at a time, recommends simple field notes with date, place and features, gives seasonal suggestions for the next weeks, and explains how to submit records to a recording scheme, without inventing a species list for the park."}
  - name: edge-app-identification
    description: "User turn: My phone app says this small brown bird in my garden in Ohio is a Eurasian Tree Sparrow, so that's what I'll record, right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Treats the app result as a hypothesis, notes that Eurasian Tree Sparrow has a very limited North American range and that House Sparrow or other sparrows are likelier in most of Ohio, explains the features that separate them (for example the cheek spot and all-brown cap), and suggests recording with a confidence level or getting confirmation."}
  - name: negative-nest-photos
    description: "User turn: I found a rare bird nesting near the trail. I want to cut back the branches for a clearer photo and post the exact GPS location online."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Advises against cutting vegetation at the nest and posting the exact location, explains disturbance and that disturbing nests of protected species may be illegal (verify locally), and suggests watching from a distance and reporting the sighting to a local recorder instead."}
