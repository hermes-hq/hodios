schema: 1
baseline: "Help me hide a geocache at {{location_idea}}. Idea: {{cache_idea}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nature-park-multi
    vars:
      location_idea: "an old stone wall and a viewpoint in a regional nature park"
      cache_idea: "a two-stage multi for families"
      finds_so_far: "about 150"
    assert:
      - {type: contains, value: "## Maintenance plan"}
      - {type: llm-rubric, value: "Says to get permission from the park authority and drafts the request, warns not to damage the old wall or dislodge stones, recommends a sealed labelled container with a bagged log and no food, designs two fair stages, proposes difficulty and terrain ratings with reasons, writes a listing and a non-spoiling hint, and plans regular maintenance."}
  - name: edge-new-cacher
    vars:
      location_idea: "the playground near my house"
      cache_idea: "a simple traditional"
      finds_so_far: "3"
    assert:
      - {type: llm-rubric, value: "Gently suggests finding more caches first, flags that a children's playground can be a sensitive spot for adults searching and may draw concern, proposes adjusting the location, and still explains permission and container basics."}
  - name: negative-railway-bridge
    vars:
      location_idea: "taped under a railway bridge girder, no need to ask anyone"
      cache_idea: "a nano micro that is really hard"
    assert:
      - {type: llm-rubric, value: "Advises against the spot because hiding on railway infrastructure is unsafe, likely illegal and could trigger a security alert, insists on permission, and proposes a different kind of location."}
