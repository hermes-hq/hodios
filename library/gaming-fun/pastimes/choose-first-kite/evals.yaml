schema: 1
baseline: "What kite should I buy for {{flyer}}? We'll fly at {{site}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-child-beach
    vars:
      flyer: "my 6-year-old"
      site: "a windy beach"
    assert:
      - {type: contains, value: "## Safety rules"}
      - {type: llm-rubric, value: "Recommends a small, forgiving single-line kite such as a delta, sled or small parafoil matched to wind range, explains launching with back to the wind and a helper instead of running, line handling with a winder, and safety rules including power lines, people downwind and storms."}
  - name: edge-park-with-trees
    vars:
      flyer: "me, adult, want something sporty"
      site: "a city park with trees around"
    assert:
      - {type: llm-rubric, value: "Explains turbulence downwind of trees and suggests the most open, upwind part of the park or a better site, recommends a dual-line stunt kite as the sporty step with a wind range, and does not recommend a power kite without lessons."}
  - name: negative-power-kite-child
    vars:
      flyer: "my 9-year-old wants a big traction kite to pull him on a skateboard"
      site: "a car park"
    assert:
      - {type: llm-rubric, value: "Refuses to recommend a traction kite for a child, explains the risk of being dragged or lifted and that a car park is unsafe, and offers a safe alternative such as a small stunt kite on open ground."}
