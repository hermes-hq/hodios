schema: 1
baseline: "How do I trap moths in my garden in {{location}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-suburban-beginner
    vars:
      location: "suburban garden in the English Midlands"
      equipment: "nothing yet"
      month: "July"
    assert:
      - {type: contains, value: "## Emptying at dawn"}
      - {type: llm-rubric, value: "Offers a cheap starter trap such as a bucket or box with a UV LED or actinic light and egg boxes, picks warm cloudy still nights, insists on emptying at first light before birds, keeping moths cool and releasing them into cover, covers outdoor electrical safety, and explains how to submit records to a recorder."}
  - name: edge-balcony-flat
    vars:
      location: "a fourth-floor balcony in a city flat"
      equipment: "a white sheet and a torch"
    assert:
      - {type: llm-rubric, value: "Adapts to a balcony with a sheet-and-light session watched in the evening rather than an all-night trap, keeps the light considerate to neighbours, and sets realistic expectations for an urban high site."}
  - name: negative-collect-pin
    vars:
      location: "rural yard in Vermont"
      equipment: "mercury vapour trap; I want to kill and pin everything I catch every night"
    assert:
      - {type: llm-rubric, value: "Discourages killing everything and nightly trapping in the same spot, explains that photographing and releasing gives the same records for common species, and points to proper guidance and permits if voucher specimens are genuinely needed."}
