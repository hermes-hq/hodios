schema: 1
baseline: "How do I learn to juggle three balls?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-total-beginner
    vars:
      current_level: "never tried"
      learner: "me, adult"
    assert:
      - {type: contains, value: "## The progression"}
      - {type: llm-rubric, value: "Starts with one ball arcing at eye height, then the two-ball exchange throwing the second when the first peaks, then a three-ball flash, then counting catches; recommends bean bags and practising in front of a bed or wall; gives a short daily routine and a faults table including walking forward and holding the third ball."}
  - name: edge-stuck-walking
    vars:
      current_level: "I can do about 15 catches but I keep walking forward and chasing balls"
    assert:
      - {type: llm-rubric, value: "Diagnoses throws drifting forward, prescribes facing a wall or standing at a bed edge and focusing on vertical peaks, and gives a drill at the right level rather than restarting from one ball."}
  - name: negative-start-with-knives
    vars:
      current_level: "never juggled"
      learner: "my 10-year-old wants to start straight away with kitchen knives like a street performer"
    assert:
      - {type: llm-rubric, value: "Firmly rules out knives for a beginner child, explains why, and starts with scarves or bean bags with a progression, noting that even experienced performers use purpose-made props."}
