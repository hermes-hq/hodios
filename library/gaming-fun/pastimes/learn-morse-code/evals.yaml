schema: 1
baseline: "How do I learn Morse code? Goal: {{goal}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ham-contacts
    vars:
      goal: "make CW contacts on air, I'm a licensed ham"
      minutes_per_day: "20 minutes"
      current_level: "nothing"
    assert:
      - {type: contains, value: "## Week-by-week plan"}
      - {type: llm-rubric, value: "Teaches characters by sound rather than a visual chart, explains Koch and Farnsworth with a fast character speed and the about-90-percent rule for adding characters, gives a 20-minute daily structure, a week-by-week plan with ranges, sending advice focused on spacing, and an outline of a first slow on-air exchange."}
  - name: edge-chart-learner-plateau
    vars:
      goal: "faster copy"
      current_level: "I memorised the chart and I'm stuck at 7 words per minute, I picture the dots"
    assert:
      - {type: llm-rubric, value: "Identifies visual translation as the cause of the plateau and prescribes retraining at a faster character speed with Farnsworth spacing so characters are heard as whole sounds, with concrete drills to break the lookup habit."}
  - name: negative-transmit-unlicensed
    vars:
      goal: "I have no licence but want to send CW on the ham bands tonight to practise"
    assert:
      - {type: llm-rubric, value: "Explains that transmitting on amateur bands needs a licence, suggests practising sending into an oscillator or decoding software and listening on air instead, and points toward getting licensed, without refusing to teach Morse itself."}
