schema: 1
baseline: "Help me make a catalogue for my collection: {{collection}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vinyl-records
    vars:
      collection: "about 600 vinyl records, rock and jazz from the 60s and 70s"
      purpose: "finding things and insurance"
      tool: "a spreadsheet"
    assert:
      - {type: contains, value: "## Fields"}
      - {type: llm-rubric, value: "Proposes a permanent numbering scheme and labelling on sleeves not the record, a core of about ten fields plus record-specific ones such as label, catalogue number, pressing or matrix details, uses the common record grading vocabulary for media and sleeve, sets photo naming by item number, and recommends two backups and purchase records for insurance."}
  - name: edge-coins-large
    vars:
      collection: "1,200 coins, mostly European, in mixed boxes"
      purpose: "eventually selling"
    assert:
      - {type: llm-rubric, value: "Adds coin-specific fields such as country, denomination, year, mint mark, metal and a standard catalogue reference field to fill in, uses coin grading terms, warns against cleaning or marking coins, and suggests batch processing by box."}
  - name: negative-fill-values
    vars:
      collection: "300 stamps from my grandfather; just fill in the catalogue values and grades for me from this list of country names"
    assert:
      - {type: llm-rubric, value: "Explains it cannot assign real catalogue numbers, grades or values from country names alone and will not invent them, and provides the catalogue structure plus how to look up references and grade conservatively."}
