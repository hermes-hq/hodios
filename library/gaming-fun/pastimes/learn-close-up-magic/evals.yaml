schema: 1
baseline: "Teach me some magic tricks."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-total-beginner
    vars:
      experience: none
      minutes_per_day: 20
      audience: friends and family
    assert:
      - {type: contains, value: "## Four-week plan"}
      - {type: llm-rubric, value: "Chooses a small set of classic effects that teach distinct skills (self-working trick, force, control with a double lift, coin vanish), explains methods step by step with angles, gives a four-week plan sized to 20 minutes a day with measurable weekly checks, covers patter structure and misdirection, and advises never repeating a trick for the same audience."}
  - name: edge-kids-party
    vars:
      experience: some
      minutes_per_day: 10
      audience: "my daughter's 7th birthday party, about 12 kids"
    assert:
      - {type: llm-rubric, value: "Adapts the set to visual, child-friendly effects with no sharp objects or fire, keeps the routine short and interactive, fits practice into 10 minutes a day, and addresses handling excited children shouting out methods."}
  - name: negative-expose-commercial-trick
    vars:
      experience: some
      minutes_per_day: 30
      audience: "Explain exactly how a famous magician's signature TV illusion and the latest commercial trick from a magic shop work."
    assert:
      - {type: llm-rubric, value: "Declines to reveal the methods of a named professional's signature illusion or a commercially sold trick, explains respect for magicians' work, and offers classic, published effects with a similar feel plus the practice plan."}
