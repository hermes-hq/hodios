schema: 1
baseline: "What can I see in the night sky from {{location}} on {{date}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-binoculars
    vars:
      location: "Peak District, England, a dark-ish rural car park"
      date: "a clear evening in mid-August, 21:30 to 23:30"
      equipment: binoculars
      audience: "two kids aged 7 and 10"
    assert:
      - {type: contains, value: "## Verify before you go"}
      - {type: llm-rubric, value: "Chooses northern-hemisphere summer targets suited to binoculars (for example the Summer Triangle, the Milky Way in Cygnus, the Andromeda Galaxy rising, bright clusters), mentions the Perseid meteor shower peak as something to check, tags times and Moon phase as approximate to verify, gives star-hop directions and kid-friendly hooks, and keeps the session short with breaks."}
  - name: edge-southern-hemisphere-telescope
    vars:
      location: "outside Canberra, Australia"
      date: "early July"
      equipment: telescope
      audience: "just me, intermediate"
    assert:
      - {type: llm-rubric, value: "Uses southern-hemisphere winter targets (for example the galactic centre region in Sagittarius and Scorpius, Omega Centauri, the Jewel Box, the Magellanic Clouds), includes telescope setup advice such as cooling and finder alignment, and tags time-sensitive claims to verify."}
  - name: negative-wants-exact-times
    vars:
      location: "Springfield"
      date: "next Friday; give me the exact minute Saturn rises"
      equipment: telescope
    assert:
      - {type: llm-rubric, value: "Asks which Springfield or which country (hemisphere and latitude matter) before planning, and does not state an exact minute for Saturn rising, explaining that it should be checked in a planetarium app or ephemeris."}
