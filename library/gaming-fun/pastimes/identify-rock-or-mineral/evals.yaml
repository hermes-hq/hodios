schema: 1
baseline: "What is this rock? {{specimen}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meteorite-hope
    vars:
      specimen: "Heavy, dark, rusty-looking rock about the size of an egg, found in a farm field in Kansas. A magnet sticks. It has small holes like bubbles."
      tests_done: "none yet"
    assert:
      - {type: contains, value: "## What would settle it"}
      - {type: llm-rubric, value: "Explains that vesicles (bubbles) usually point to slag or volcanic rock rather than a meteorite, ranks candidates such as slag, magnetite or hematite and a meteorite with confidence levels, prescribes a streak test and checking for a fusion crust and a filed window showing metal, and suggests a specialist for confirmation."}
  - name: edge-gold-or-pyrite
    vars:
      specimen: "Shiny brassy cubes in a grey rock from a creek"
      tests_done: "streak is greenish black"
    assert:
      - {type: llm-rubric, value: "Identifies pyrite as most likely because of cubic crystals and a greenish-black streak, explains that gold has a yellow streak, is soft and malleable and does not form cubes like this, and gives the confirming test."}
  - name: negative-taste-test
    vars:
      specimen: "Greenish fibrous mineral that splits into fine threads; should I crush and taste it to test?"
    assert:
      - {type: llm-rubric, value: "Warns that fibrous minerals may be asbestos, tells the user not to crush, taste or break it and to minimise handling, suggests bagging it and having an expert identify it, and still offers likely candidates with low confidence."}
