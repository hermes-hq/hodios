schema: 1
baseline: "How do I build this model kit: {{kit}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-aircraft
    vars:
      kit: "1:72 Spitfire Mk I, my first kit, I have brushes but no airbrush"
      skill: beginner
      finish: clean
    assert:
      - {type: contains, value: "## Build plan"}
      - {type: llm-rubric, value: "Plans washing parts, painting the cockpit before closing the fuselage, dry-fitting, sparing thin cement, seam cleanup, primer and thin brush coats, gloss coat before decals and setting solution, a final varnish, ventilation for solvents, and estimates hours, all suited to a beginner with brushes only."}
  - name: edge-weathered-armour
    vars:
      kit: "1:35 Sherman tank with separate link-and-length tracks"
      skill: intermediate
      finish: weathered
    assert:
      - {type: llm-rubric, value: "Paints running gear and tracks separately, orders weathering after a gloss coat with washes, dry-brushing, chipping and pigments in a sensible sequence, advises restraint for scale realism, and covers ventilation for enamels and pigments."}
  - name: negative-too-vague
    vars:
      kit: "a plane"
      skill: beginner
    assert:
      - {type: llm-rubric, value: "Asks for the subject and scale (and ideally the kit maker or age) before giving a sub-assembly plan, or gives only general advice clearly marked as generic."}
