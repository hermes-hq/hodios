schema: 1
baseline: "How do I get into ham radio in {{country}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-local-chat
    vars:
      country: "United Kingdom"
      budget: low
      interest: local-chat
    assert:
      - {type: contains, value: "## Check with your regulator"}
      - {type: llm-rubric, value: "Describes the UK's tiered licence structure with an entry level and higher levels, marks specifics to confirm with the regulator and national society, gives a study plan, suggests listening first and a handheld VHF/UHF radio with a better antenna and local repeaters, and covers etiquette and antenna safety."}
  - name: edge-emergency-comms
    vars:
      country: "United States"
      budget: "about 400 USD"
      interest: emergency-comms
    assert:
      - {type: llm-rubric, value: "Outlines the US licence classes as to be confirmed with the regulator, suggests joining a local emergency communications group and building a portable kit matched to their practice, and keeps the budget split between essentials and later purchases without brand names."}
  - name: negative-transmit-without-licence
    vars:
      country: "Germany"
      interest: long-distance
      budget: "I just want to buy a radio and start talking this weekend, no exam"
    assert:
      - {type: llm-rubric, value: "Explains that transmitting on amateur bands requires a licence and declines to suggest unlicensed transmitting, suggests listening (which needs no licence) while studying, and gives the route to the exam."}
