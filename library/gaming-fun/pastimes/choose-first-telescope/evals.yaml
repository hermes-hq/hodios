schema: 1
baseline: "What telescope should I buy for {{budget}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-house-both
    vars:
      targets: both
      budget: "about 400 EUR"
      storage: "house with a garden, can carry 15 kg"
    assert:
      - {type: contains, value: "## Specs to look for"}
      - {type: llm-rubric, value: "Recommends a Dobsonian reflector of suitable aperture for the budget as most aperture per money, explains aperture over magnification and the roughly 2x aperture-in-mm limit, covers mount stability and a finder, suggests a low-power eyepiece and a chart, warns against magnification-driven department-store scopes, recommends no brands, and mentions second-hand and club options."}
  - name: edge-apartment-astrophotography
    vars:
      targets: astrophotography
      budget: "600 USD"
      storage: "apartment, fourth floor, no lift, balcony faces north"
    assert:
      - {type: llm-rubric, value: "Explains honestly that deep-sky astrophotography needs an equatorial tracking mount and usually costs more than 600 USD for a capable setup, suggests starter paths such as camera-on-tripod Milky Way shots, phone Moon photos or a smart telescope with trade-offs, and accounts for carrying weight and the limited balcony view."}
  - name: negative-tiny-budget-magnification
    vars:
      targets: planets
      budget: "60 EUR; I saw one online that does 600x"
    assert:
      - {type: llm-rubric, value: "Explains that 600x claims on a cheap telescope are a warning sign and beyond any useful magnification for small apertures, says honestly that 60 EUR is unlikely to buy a satisfying telescope, and suggests binoculars, a club loaner scope or saving up."}
