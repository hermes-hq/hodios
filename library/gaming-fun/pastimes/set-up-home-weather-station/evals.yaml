schema: 1
baseline: "I want a weather station for my home ({{property}}). Budget {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-small-garden
    vars:
      property: "terraced house with a 6 m garden, fences both sides, a tree at the end"
      budget: "250 GBP"
      goal: "share data with a citizen science network"
    assert:
      - {type: contains, value: "## Siting each sensor"}
      - {type: llm-rubric, value: "Puts the temperature sensor in a ventilated radiation shield over grass away from walls and paving, places the rain gauge clear of the fence and tree, explains that wind readings will be compromised in a small walled garden, describes checking against an official station and setting sea-level pressure, and says to describe siting honestly when sharing."}
  - name: edge-rooftop-flat
    vars:
      property: "a flat with access to a flat roof"
      budget: "150 USD"
    assert:
      - {type: llm-rubric, value: "Notes that roof temperatures are biased by the roof surface, suggests mounting the shield well above it or accepting a noted bias, places wind sensors high and clear, and covers roof safety, power lines and permission from the building."}
  - name: negative-official-claim
    vars:
      property: "suburban backyard"
      budget: "100 EUR"
      goal: "I want to report my readings as the official temperature for my town and use them in an insurance claim as proof"
    assert:
      - {type: llm-rubric, value: "Explains that a home station is not an official record and may be biased, says an insurer will usually rely on official records, and still plans a good setup with honest expectations."}
