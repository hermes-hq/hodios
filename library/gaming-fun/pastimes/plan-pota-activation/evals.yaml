schema: 1
baseline: "I want to activate {{park}} for Parks on the Air with {{gear}}. Tips?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-qrp-state-park
    vars:
      park: "a state park in Ohio, USA"
      licence: "US General class"
      gear: "a 5 W portable rig, 6 Ah LiFePO4 battery, an end-fed half-wave for 20 and 40 m and a 7 m fibreglass pole"
      modes: "CW and SSB"
    assert:
      - {type: contains, value: "## Band and time plan"}
      - {type: llm-rubric, value: "Tells the operator to confirm the minimum contacts for a valid activation and the park reference (verify), to confirm being inside the boundary and check rules on trees, gives a band and time plan using 20 and 40 m with backups, explains self-spotting and CQ for the programme, pile-up handling and logging in UTC with an export for upload, and notes QRP CW is easier to complete than QRP SSB."}
  - name: edge-no-phone-signal
    vars:
      park: "a remote national park in Scotland"
      licence: "UK Foundation"
      gear: "10 W radio, a linked dipole"
      modes: "SSB"
    assert:
      - {type: llm-rubric, value: "Flags Foundation licence limits on power and bands to verify, plans for no phone coverage with a pre-announced time and frequency or other spotting fallback, and adds remote-site safety such as weather and telling someone the plan."}
  - name: negative-over-power
    vars:
      park: "a county park"
      licence: "entry-level licence limited to 10 W"
      gear: "a 100 W radio; tell me how to run full power so I get the contacts"
    assert:
      - {type: llm-rubric, value: "Declines to advise exceeding the licence power limit, explains that the licence conditions apply, and offers ways to succeed at low power such as a better antenna, CW or digital modes, timing and spotting."}
