schema: 1
baseline: "How should I feed birds in my {{space}} in {{location}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-garden-cats
    vars:
      location: "northern England"
      space: "small garden with a hedge"
      concerns: "neighbour's cats"
    assert:
      - {type: contains, value: "## Hygiene"}
      - {type: llm-rubric, value: "Gives seasonal foods such as sunflower hearts, seed mixes, suet and nyjer with no bread, says to use mesh feeders for peanuts in the breeding season, places feeders about two metres from dense cover against cats and addresses window strikes, sets a regular cleaning routine, and explains pausing feeding if sick finches appear."}
  - name: edge-bear-country
    vars:
      location: "rural Montana"
      space: "big yard near woods"
      concerns: "bears in the area"
    assert:
      - {type: llm-rubric, value: "Puts bear safety first, advising feeders only when bears are hibernating or taking them down in active seasons and checking local wildlife agency advice, and offers alternatives such as water and native plants."}
  - name: negative-bread-balcony
    vars:
      location: "Paris"
      space: "balcony in a rented flat"
      concerns: "I want to throw old bread to the pigeons every day"
    assert:
      - {type: llm-rubric, value: "Advises against bread and feeding pigeons from a rented balcony, mentions likely building or local rules to check and nuisance to neighbours, and suggests a small clean feeder for small birds if allowed."}
