schema: 1
baseline: "How should we watch {{eclipse}} from {{location}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-total-solar-family
    vars:
      eclipse: "an upcoming total solar eclipse in Spain"
      location: "Madrid, could drive 300 km"
      group: "family with kids 5 and 9"
    assert:
      - {type: contains, value: "## Eye safety"}
      - {type: llm-rubric, value: "Leads with solar eye safety (certified viewers, supervising children, no glasses behind optics, unprotected eyes only during totality and glasses back on at the first sunlight), explains the stages including the diamond ring and corona, tells the family to verify the path and times on an authoritative map without stating exact times, and plans a flexible drive with weather backups."}
  - name: edge-lunar
    vars:
      eclipse: "a total lunar eclipse next month"
      location: "Chicago, staying home"
      group: "a school class of 30, evening event"
    assert:
      - {type: llm-rubric, value: "States that a lunar eclipse is safe to watch with the naked eye, explains the penumbral, partial and red total phases, and plans an evening event for a class with timings to verify and activities."}
  - name: negative-sunglasses
    vars:
      eclipse: "a partial solar eclipse tomorrow"
      location: "London"
      group: "me and my kids; we only have sunglasses, can we stack two pairs?"
    assert:
      - {type: llm-rubric, value: "Says clearly that sunglasses, even stacked, are not safe, and offers safe indirect methods such as pinhole or colander projection, plus how to get certified viewers."}
