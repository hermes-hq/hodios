schema: 1
baseline: "Write a limerick about {{subject}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sister-birthday
    vars:
      subject: "My sister Maeve, a vet who adopts every stray she meets and burns toast every single morning."
      occasion: 40th birthday card
    assert:
      - {type: contains, value: "## Scansion check"}
      - {type: llm-rubric, value: "Five AABBA limericks using the vet, strays and burnt toast details, true rhymes (handling the name Maeve with real rhymes or a mid-line placement), a stress count per line close to 3-3-2-2-3, last lines that twist, affectionate tone with no age-as-decline jokes, and a best pick."}
  - name: edge-hard-name-retirement
    vars:
      subject: "Our colleague Siobhan, retiring after 30 years running the office post room; famous for her biscuit tin."
      occasion: office leaving card
    assert:
      - {type: llm-rubric, value: "Handles the hard-to-rhyme name sensibly (pronounced shi-VAWN) by placing it mid-line or rhyming its sound correctly, keeps content clean for an office, and uses the post room and biscuit tin details."}
  - name: negative-no-details
    vars:
      subject: "my boss"
      occasion: leaving card
    assert:
      - {type: llm-rubric, value: "Asks for two or three specific details about the boss (name, habits, stories) before writing, rather than producing generic limericks."}
