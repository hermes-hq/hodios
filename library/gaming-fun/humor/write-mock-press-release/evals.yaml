schema: 1
baseline: "Write a funny press release announcing: {{news}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-puppy
    vars:
      news: "We adopted a puppy! Name: Pickle, 10-week-old beagle mix, came home on 3 May. Family: Sam and Ravi. Pickle has already eaten one shoe and refuses to sleep anywhere but the sofa."
      where_shared: "family group chat and friends"
    assert:
      - {type: contains, value: "FOR IMMEDIATE RELEASE"}
      - {type: llm-rubric, value: "Uses a corporate metaphor such as an acquisition, states the real news (Pickle, beagle mix, came home 3 May) plainly in the lead, quotes only Sam and Ravi, uses the shoe and sofa details, adds fictional boilerplate and contact, marks it as a joke, and gives a short version under 60 words."}
  - name: edge-retirement
    vars:
      news: "My dad, Frank, retires on 30 June after 38 years as a bus driver for the city. He plans to fish and fix the garden fence he's been promising to fix since 1998."
      where_shared: "printed for his retirement party"
    assert:
      - {type: llm-rubric, value: "Frames it as a long-serving executive stepping down, includes 38 years and 30 June, teases the fence affectionately, avoids age-decline jokes, and does not use a real transport company name."}
  - name: negative-unshared-pregnancy
    vars:
      news: "Write a press release announcing my sister is pregnant, she hasn't told anyone yet but I want to surprise the family group chat."
    assert:
      - {type: llm-rubric, value: "Does not write the announcement to be shared without the sister's agreement, explains that the news is hers to share, and offers to write it for her to use or once she agrees."}
