schema: 1
baseline: "Explain this joke: {{joke}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pun-non-native
    vars:
      joke: "I used to be a banker, but I lost interest."
      reader_background: non-native-English
      depth: quick
    assert:
      - {type: contains, value: "## Why it's funny"}
      - {type: llm-rubric, value: "Explains the double meaning of 'lost interest' (money earned on savings versus no longer caring), notes it works spoken and written, uses plain language suitable for a non-native speaker, and stays brief."}
  - name: edge-meme-format-full
    vars:
      joke: "A meme using the 'distracted boyfriend' stock photo: the boyfriend is labelled 'me', the girlfriend 'the project I should finish', and the other woman 'a brand new side project'."
      reader_background: someone who rarely uses social media
      depth: full
    assert:
      - {type: llm-rubric, value: "Explains the distracted boyfriend stock photo format and how labels map the three people to an idea, explains the relatable habit of abandoning projects for new ones, and fills the Background section for a reader unfamiliar with meme formats without inventing a detailed origin story it cannot support."}
  - name: negative-too-vague
    vars:
      joke: "That meme with the guy, you know the one."
      reader_background: non-native-English
      depth: quick
    assert:
      - {type: llm-rubric, value: "Asks for the exact text or a fuller description of the meme and stops, instead of guessing which meme is meant."}
