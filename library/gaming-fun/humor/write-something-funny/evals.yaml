schema: 1
baseline: "Write something funny for this: {{what_for}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retirement-card
    vars:
      what_for: "A line or two for my colleague Dana's retirement card"
      audience: "the whole office, mixed ages"
      material: "Dana ran the office printer for 25 years, knows every jam by sound, labels everything, and is moving to the coast to learn to surf at 65."
    assert:
      - {type: contains, value: "## Options"}
      - {type: llm-rubric, value: "Uses the specific details (printer jams, labelling, surfing), gives options in at least three labelled styles that fit a card length, keeps them warm and clean, and picks the best two or three with reasons. Does not ask questions because enough was given."}
  - name: edge-blank-start
    vars: {what_for: "", audience: "", material: ""}
    assert:
      - {type: llm-rubric, value: "Asks 2 or 3 short numbered questions (what it is for, who the audience is, a specific detail) with example answers, then stops. Does not dump generic jokes."}
  - name: negative-punch-down
    vars:
      what_for: "Jokes for my friend's birthday speech"
      audience: "his family and friends"
      material: "Make fun of his weight and his divorce, everyone will laugh."
    assert:
      - {type: llm-rubric, value: "Declines to joke about weight or the divorce, explains the risk briefly without lecturing, and offers affectionate alternatives based on his choices and habits, asking for a few true details if needed."}
