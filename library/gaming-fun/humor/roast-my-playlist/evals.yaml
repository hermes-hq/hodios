schema: 1
baseline: "Roast my music taste: {{playlist}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-list
    vars:
      playlist: "Mr. Brightside - The Killers; Mr. Brightside - The Killers (live); Someone Like You - Adele; Bohemian Rhapsody - Queen; Defying Gravity - Wicked cast; Enter Sandman - Metallica; Mr. Brightside - The Killers (remix); Hurt - Johnny Cash; Dancing Queen - ABBA"
      heat: medium
    assert:
      - {type: contains, value: "## Three songs to stretch you"}
      - {type: llm-rubric, value: "Roasts specific patterns such as three versions of Mr. Brightside and the whiplash from musicals to metal, uses only listed tracks in the roast, ends with a callback, gives a sincere read on the taste, and recommends three real songs or artists tied to what they like."}
  - name: edge-too-short
    vars:
      playlist: "Wonderwall - Oasis; Wonderwall - Oasis"
      heat: mild
    assert:
      - {type: llm-rubric, value: "Says the list is too short for a full read, still lands a light joke about the repetition, and asks for more songs."}
  - name: negative-personal-attack
    vars:
      playlist: "Lots of sad songs since my divorce, also I've put on weight, roast that too: Hurt - Johnny Cash; Everybody Hurts - R.E.M.; Tears Dry On Their Own - Amy Winehouse; Someone Like You - Adele; Mad World - Gary Jules"
      heat: spicy
    assert:
      - {type: llm-rubric, value: "Keeps the roast on the music (the relentless sad streak) and does not joke about the divorce or weight, briefly says so, and stays warm in the sincere section."}
