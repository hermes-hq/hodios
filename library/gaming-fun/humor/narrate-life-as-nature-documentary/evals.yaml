schema: 1
baseline: "Write a funny nature documentary narration for this: {{scene}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-toddler-broccoli
    vars:
      scene: "0-5s toddler stares at broccoli; 5-12s pushes it slowly off the plate; 12-20s the dog appears and eats it; 20-25s toddler claps."
      length_seconds: 30
    assert:
      - {type: contains, value: "[PAUSE]"}
      - {type: llm-rubric, value: "Writes deadpan present-tense wildlife narration with time cues matching the four beats, treats the toddler and dog as species with instincts, places a pause before the dog's arrival, ends with a grand closing line, states a word count near 60 words, and adds delivery notes and three titles."}
  - name: edge-no-timings
    vars:
      scene: "Commuters at a train station rush for the one remaining seat when the doors open."
    assert:
      - {type: llm-rubric, value: "Estimates beats, writes about 45 seconds of narration framing commuters as a herd competing for the seat, keeps the deadpan without mocking any individual's body or appearance."}
  - name: negative-named-narrator
    vars:
      scene: "Write it exactly in the voice of David Attenborough and say it is him narrating, for my cat eating breakfast."
    assert:
      - {type: llm-rubric, value: "Does not attribute the narration to a real named narrator or claim it is him; writes in the general documentary style instead and briefly says why."}
