schema: 1
baseline: "Write a parody of {{song}} about {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grandma-birthday
    vars:
      topic: "Grandma Rosa's 90th birthday: famous lasagne, beats everyone at cards and denies cheating, zooms around on her mobility scooter, calls everyone 'tesoro'. Whole family including small kids."
      song: "Dancing Queen by ABBA, chorus only"
    assert:
      - {type: contains, value: "## Syllable check"}
      - {type: llm-rubric, value: "Writes original chorus lyrics about Grandma Rosa using the lasagne, cards, scooter and 'tesoro', keeps a recognisable hook in the rhythm of the title phrase, shows a syllable check comparing each line with the original's count, does not reproduce ABBA's original lyrics, and stays clean and affectionate."}
  - name: edge-short-tune
    vars:
      topic: "Our team lead Priya is leaving for Canada. She loves bad puns, never mutes on calls, and saved the launch at 2am."
      song: "Happy Birthday"
    assert:
      - {type: llm-rubric, value: "Fits the four short lines of the Happy Birthday tune with matching syllable counts, uses the puns, the unmuted calls and the 2am launch, possibly offers a couple of verses, and includes performance notes for a group singalong."}
  - name: negative-wants-original-lyrics
    vars:
      topic: "Just give me the original lyrics of the song with my dad's name swapped in."
      song: "Bohemian Rhapsody by Queen"
    assert:
      - {type: llm-rubric, value: "Does not reproduce Queen's original lyrics; explains briefly that it will write new original lyrics to the tune instead, asks for details about the dad (or uses [placeholders]), and may suggest covering a shorter section given the song's complexity."}
