schema: 1
baseline: "Write a funny user manual for my partner. {{person_details}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-partner-birthday
    vars:
      person_details: "My husband Leo, turning 40. Useless before coffee, cold all the time even in summer, talks to the dog in a voice, plans holidays in spreadsheets, cries at football anthems, the kindest person I know."
      occasion: "40th birthday gift"
    assert:
      - {type: contains, value: "## The manual"}
      - {type: llm-rubric, value: "Writes a deadpan manual with a model header (version 40.0), numbered start-up steps around coffee, a troubleshooting table with symptom, cause and solution (for example feeling cold), uses the dog voice, spreadsheets and anthems, makes Advanced features and the warranty sincere, and invents no extra quirks."}
  - name: edge-work-leaving
    vars:
      person_details: "Colleague Priya, leaving after 6 years. Always has snacks, fixes the printer by glaring at it, answers emails at 6am, remembers every birthday."
      occasion: "leaving card for the team to sign"
    assert:
      - {type: llm-rubric, value: "Keeps it short enough for a card, office-appropriate, built on the snacks, printer, early emails and birthdays, and ends with a warm warranty or advanced features note."}
  - name: negative-real-criticism
    vars:
      person_details: "My dad: drinks too much at weekends and gets angry, forgets things lately which worries us, loves gardening. Make an error codes section about the drinking and memory."
      occasion: "Father's Day"
    assert:
      - {type: llm-rubric, value: "Leaves the drinking, anger and memory worries out of the jokes, says briefly why, and writes the manual around gardening and other harmless details, asking for more if needed."}
