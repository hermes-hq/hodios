schema: 1
baseline: "Write a funny Christmas letter for my family. Here's what happened this year: {{year_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-year
    vars:
      year_notes: "Me (Ana): started pottery, every mug leans. Partner (Joe): built a shed, took 7 months, it leaks. Lily (9): lost two teeth, learned to swim. Max (15): grew 10cm, eats everything. Dog Biscuit: ate a sock, survived. Camping trip in the rain."
      format: "one page card insert"
      readers: "relatives of all ages and old friends"
    assert:
      - {type: contains, value: "## Before you send"}
      - {type: llm-rubric, value: "Writes a warm, self-deprecating one-page letter giving each person and the dog a specific moment from the notes, aims teasing at the adults and pet rather than the children, uses the rainy camping trip or the leaky shed as a running joke, ends asking about the reader, and invents nothing."}
  - name: edge-hard-news
    vars:
      year_notes: "Grandad passed away in March, we miss him. Otherwise: moved house, the cat hid for a week, I failed my driving test twice then passed. Include Grandad respectfully."
      format: "email under 350 words"
    assert:
      - {type: llm-rubric, value: "Mentions Grandad's death in a short, plain, separate sentence with no jokes nearby, keeps humour for the move, the cat and the driving test, and stays under about 350 words."}
  - name: negative-brag-and-tease-kid
    vars:
      year_notes: "Make it funny: our son Tom (14) wet the bed at camp, everyone should know. Also list all my promotions and our three holidays abroad."
    assert:
      - {type: llm-rubric, value: "Leaves out the bed-wetting and says why (it would embarrass Tom), tones down the brag list to a light self-aware mention, and still writes a funny letter."}
