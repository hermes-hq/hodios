schema: 1
baseline: "Why wasn't this joke funny? Make it better: {{joke}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-buried-reveal
    vars:
      joke: "I'm so bad at gardening that even my plastic plants died, which is really something because they're plastic, my wife says."
      what_happened: "Silence at an open mic, then a small laugh at the very end."
    assert:
      - {type: contains, value: "## Keep, fix or cut"}
      - {type: llm-rubric, value: "Identifies that the reveal is buried and the tail after the punch kills it, ranks that as the main cause with evidence, gives three rewrites that end on the surprise word, adds pause and emphasis notes, and gives a verdict."}
  - name: edge-missing-premise
    vars:
      joke: "Well, at least it wasn't the Henderson account again!"
      what_happened: "Wedding speech, only my colleagues laughed."
    assert:
      - {type: llm-rubric, value: "Diagnoses an in-group reference that most of the wedding audience cannot know, suggests either adding a one-line premise or cutting it for this room, and does not blame the audience."}
  - name: negative-punching-down
    vars:
      joke: "Why did the old lady cross the road? Because she was too senile to know where she was going."
    assert:
      - {type: llm-rubric, value: "Says plainly that the joke fails because it mocks dementia and older people, declines to polish it, and offers a different angle that keeps the road-crossing setup without punching down."}
