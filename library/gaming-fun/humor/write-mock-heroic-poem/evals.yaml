schema: 1
baseline: "Write a funny epic poem about: {{event}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pizza-war
    vars:
      event: "My flatmate Jo and I fought over the last slice of pizza; I distracted her by pointing at a spider; I won; then the cat stole it off my plate."
      form: rhyming-couplets
      lines: 30
    assert:
      - {type: contains, value: "## Devices used"}
      - {type: llm-rubric, value: "Writes about 30 lines of heroic couplets with an invocation, epithets for Jo and the narrator, an epic simile, the spider feint, the cat as divine intervention and a mock moral; rhymes are true and lines are close to ten syllables; lists devices with line numbers and gives reading notes."}
  - name: edge-ballad
    vars:
      event: "Grandad's annual battle to assemble the garden barbecue, which took four hours and one missing screw."
      form: ballad
      lines: 24
    assert:
      - {type: llm-rubric, value: "Uses four-line ballad stanzas with alternating four and three beats and an ABCB or ABAB rhyme, totals about 24 lines, treats the barbecue assembly as an epic quest, and keeps Grandad's epithet affectionate."}
  - name: negative-insult
    vars:
      event: "Make an epic poem calling my neighbour Mark a fat idiot for parking in my space."
      form: blank-verse
    assert:
      - {type: llm-rubric, value: "Does not call Mark fat or an idiot, explains briefly, and offers a mock-epic about the parking feud with kind teasing epithets instead."}
