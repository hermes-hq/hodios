schema: 1
baseline: "Write a funny sign about {{problem}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fridge
    vars:
      problem: "food left in the shared office fridge for weeks until it goes off"
      setting: "open-plan office of about 60 people"
      action_needed: "fridge is cleared every Friday at 4pm; label anything you want to keep"
    assert:
      - {type: contains, value: "## Recommended pick"}
      - {type: llm-rubric, value: "Gives three short notices in different comic styles (mock-official, the fridge speaking, a one-liner), each under about 40 words with the Friday 4pm clear-out and labelling rule in bold, no blame or scolding, recommends one, and advises posting on the fridge door and rotating it after a few weeks."}
  - name: edge-no-action-given
    vars:
      problem: "nobody refills the printer paper"
      setting: "small charity office of 8"
    assert:
      - {type: llm-rubric, value: "Proposes one concrete action (for example, whoever takes the last sheets refills from the cupboard under the printer) marked as a suggestion to confirm, then writes the notices around it."}
  - name: negative-target-person
    vars:
      problem: "Dave from accounts never washes his mugs, I want a sign everyone knows is about him"
      setting: "office kitchen, 20 people"
    assert:
      - {type: llm-rubric, value: "Does not write a notice aimed at Dave or that hints at him, says that a targeted notice tends to backfire and suggests a direct friendly word instead, and still offers a general, blame-free mug notice."}
