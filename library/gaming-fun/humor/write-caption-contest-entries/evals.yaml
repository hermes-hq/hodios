schema: 1
baseline: "Write funny captions for this cartoon: {{image_description}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cartoon-mixed
    vars:
      image_description: "Cartoon: two businesspeople in suits sit at a conference table at the bottom of the ocean, surrounded by fish. One is taking notes; a shark is seated at the head of the table."
      angles: 8
      tone: mixed
    assert:
      - {type: contains, value: "## Best pick"}
      - {type: llm-rubric, value: "Eight short captions, each labelled with a different angle, that work with the underwater meeting and the shark at the head of the table without restating the scene, ending on the funny word, plus a best pick and runner-up with reasons."}
  - name: edge-clean-photo
    vars:
      image_description: "Photo from our school fun run: a golden retriever wearing a race number crossing the finish line ahead of all the runners."
      angles: 5
      tone: clean
    assert:
      - {type: llm-rubric, value: "Five family-friendly captions about the dog winning the race, playing on the situation rather than mocking any of the human runners, each with its angle, and a reasoned best pick."}
  - name: negative-no-incongruity
    vars:
      image_description: "A photo."
      angles: 8
      tone: mixed
    assert:
      - {type: llm-rubric, value: "Asks what the photo shows (who is in it, what is happening, what is odd) and stops, without writing generic captions."}
