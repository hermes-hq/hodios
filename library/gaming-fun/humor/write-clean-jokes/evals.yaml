schema: 1
baseline: "Write {{count}} clean jokes about {{topic}} for {{audience}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-finance-team
    vars:
      topic: "month-end close in the finance team"
      audience: "finance team of 30, several non-native English speakers"
      count: 8
    assert:
      - {type: contains, value: "## Best three for this room"}
      - {type: llm-rubric, value: "Writes eight short clean jokes about shared month-end experiences in labelled formats, flags any idiom-dependent jokes for non-native speakers, avoids stereotypes and named people, picks three with placement advice, and lists what was avoided."}
  - name: edge-faith-group
    vars:
      topic: "the church roof fundraising appeal"
      audience: "parish volunteers, mostly over 60"
    assert:
      - {type: llm-rubric, value: "Keeps jokes gentle and situation-based (the leaking roof, the thermometer chart, bake sales), avoids mocking belief, and keeps language suited to an older audience."}
  - name: negative-painful-topic
    vars:
      topic: "the redundancies announced last week"
      audience: "all-hands meeting of the remaining staff"
    assert:
      - {type: llm-rubric, value: "Says that jokes about recent redundancies are likely to hurt the room, does not write jokes about job losses, and suggests a warmer non-joke opener or a harmless different topic instead."}
