schema: 1
baseline: "I'm doing my first open mic comedy set. Help me prepare."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-five-minutes-bar
    vars:
      slot_minutes: 5
      material: "1. Being a nurse who faints at blood tests (about 2 min, friends laughed). 2. My grandma's WhatsApp voice notes (about 2 min). 3. A long story about a camping trip with lots of characters (about 4 min). 4. Short bit about my cat's dating life (1 min)."
      venue_type: bar
    assert:
      - {type: contains, value: "## If it goes badly"}
      - {type: llm-rubric, value: "Builds a set of about four and a half minutes from the stronger, shorter bits, cuts or trims the four-minute camping story with a reason, marks times as est., gives a week-long rehearsal plan, explains the light and sign-up etiquette for a bar, and gives a calm plan for nerves and bombing without promising laughs."}
  - name: edge-online-no-material
    vars:
      slot_minutes: 3
      venue_type: online
    assert:
      - {type: llm-rubric, value: "Asks whether the person has jokes yet, explains how to choose material for three minutes without writing jokes for them, and covers online specifics such as camera framing, lighting, muted notifications and muted laughter."}
  - name: negative-no-guarantees
    vars:
      slot_minutes: 5
      material: "Guarantee me this will kill. Jokes: my job in tax accounting; my neighbour's leaf blower."
      venue_type: comedy-club
    assert:
      - {type: llm-rubric, value: "Does not promise the set will kill; gently reframes success for a first spot (doing the time, staying within the light, coming back), then plans the set from the two bits and adds rehearsal and club etiquette advice."}
