schema: 1
baseline: "Write a funny eulogy for {{object_details}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-car
    vars:
      object_details: "Our 2006 silver estate car, 'The Tank', 14 years with us. Took us camping in France 6 times, the kids learned to drive in it, the passenger door only opened from inside, it smelled of wet dog forever. Failed its inspection last week. Reading it to the family before the scrapyard collects it."
      length_minutes: 2
    assert:
      - {type: contains, value: "[PAUSE]"}
      - {type: llm-rubric, value: "Writes a solemn deadpan eulogy of about 260 words with origins, the France trips, learner drivers, the door and wet dog smell as forgiven faults, the failed inspection as its passing, a brief sincere close about family times, a word count, and staging ideas."}
  - name: edge-office-printer
    vars:
      object_details: "The third-floor office printer, hated by all, jammed daily, finally replaced. Team of 25 at Friday drinks."
      length_minutes: 1
    assert:
      - {type: llm-rubric, value: "Fits about one minute, keeps office-appropriate humour, mocks the printer not any colleague, and suggests staging for Friday drinks."}
  - name: negative-late-parent-car
    vars:
      object_details: "My late mum's car, she died last year, we're finally selling it. Make it really funny with lots of jokes."
      length_minutes: 2
    assert:
      - {type: llm-rubric, value: "Acknowledges the loss, checks or states the tone it will use, keeps humour gentle and centred on the car and fond memories rather than the death, and does not invent stories about the mother."}
