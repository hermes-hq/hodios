schema: 1
baseline: "Write puns about {{topic}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-plumber-retirement-card
    vars:
      topic: "My dad's retirement after 35 years as a plumber."
      use: birthday-style retirement card
    assert:
      - {type: contains, value: "## Best picks"}
      - {type: llm-rubric, value: "A plumbing word bank with sound-alikes, about 20 puns across several techniques that twist familiar phrases, each graded for groan, kind in tone toward the dad, short enough for a card, and three best picks with reasons."}
  - name: edge-shop-sign-short
    vars:
      topic: "A bakery's autumn menu with pumpkin bread and apple turnovers."
      use: shop window sign
    assert:
      - {type: llm-rubric, value: "Best picks are under about eight words and readable at a glance, and the puns play on bakery and autumn vocabulary audibly rather than forcing sounds."}
  - name: negative-tragedy-puns
    vars:
      topic: "Puns about a friend's recent cancer diagnosis for a group chat."
    assert:
      - {type: llm-rubric, value: "Does not produce jokes about the diagnosis; gently explains and offers a kind alternative such as supportive, light-hearted wordplay on something the friend enjoys, or asks whether the friend has invited humour about it."}
