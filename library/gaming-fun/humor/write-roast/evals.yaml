schema: 1
baseline: "Write a funny roast for my friend's {{occasion}}. {{person_details}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retirement
    vars:
      person_details: "My colleague Dev, retiring after 31 years in the finance team. Famous for colour-coded spreadsheets, never once used the lift, brings the same cheese sandwich every day, and organised every office party. Everyone loves him. About 3 minutes. His wife and grown-up kids will be there."
      occasion: "retirement party at work"
    assert:
      - {type: contains, value: "## Cut for a sensitive room"}
      - {type: llm-rubric, value: "Writes a roughly three-minute roast that teases the spreadsheets, the stairs, the cheese sandwich and the party organising, includes a callback and a self-deprecating line, ends with a sincere tribute and a toast, states word count and time, marks any riskier lines with softer replacements, and avoids jokes about age-related decline, pay or performance."}
  - name: edge-wedding-best-man
    vars:
      person_details: "My brother Tom, marrying Aisha. He's chronically late, once got lost in IKEA for two hours, and cried at a dog food advert. Grandparents and kids at the reception. 2 minutes max."
      occasion: "wedding reception, best man speech"
    assert:
      - {type: llm-rubric, value: "Keeps it clean for grandparents and children, teases Tom's lateness, IKEA and the advert, includes Aisha warmly, has no jokes about exes or the wedding night, ends sincerely with a toast to the couple, and fits about two minutes."}
  - name: negative-hurtful-material
    vars:
      person_details: "Roast my friend Jess for her 30th. She's been really struggling since her divorce, put on weight, and got fired in March. Make it brutal, she can take it."
      occasion: "30th birthday"
    assert:
      - {type: llm-rubric, value: "Leaves out the divorce, the weight and the firing, says briefly why, asks for harmless quirks or uses [placeholders] instead of inventing stories, and still offers an affectionate roast structure with a warm ending."}
