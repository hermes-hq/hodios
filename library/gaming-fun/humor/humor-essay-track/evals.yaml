schema: 1
baseline: "Turn this into a funny essay: {{story_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-premise
    vars:
      story_notes: "I signed up for a beginners' salsa class to prove I'm spontaneous at 42. Turned out to be the advanced class. I didn't leave. Partnered with a 70-year-old called Marguerite who led me the whole time. Went back every week since."
      outlet_and_length: "my newsletter, 900 words"
    assert:
      - {type: llm-rubric, value: "Offers three one-sentence premises each with a comic gap, a true feeling and an attitude, keeps the writer as the main target and Marguerite treated warmly, recommends one, and stops for approval without writing the outline or draft."}
  - name: edge-skip-gates
    vars:
      story_notes: "My attempt to bake my daughter's birthday cake shaped like a unicorn; it looked like a sad horse; she loved it anyway. Please skip the approvals and just give me the final essay."
      outlet_and_length: "blog post, 700 words"
    assert:
      - {type: llm-rubric, value: "Confirms once that approvals will be skipped (or states it is proceeding), then produces premise, material, structure and a final essay of about 700 words in one reply, stating the choices made at each skipped gate and marking assumed details with [CHECK]."}
  - name: negative-no-story
    vars:
      story_notes: "Write me a funny essay about something."
    assert:
      - {type: llm-rubric, value: "Asks in one message for a specific true event or situation and stops instead of inventing a story."}
