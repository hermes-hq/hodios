schema: 1
baseline: "Let's play a fill-in-the-blanks funny story game."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kids-zoo
    vars:
      theme: a-day-at-the-zoo
      age_group: kids
      grammar_labels: true
      length: short
    assert:
      - {type: llm-rubric, value: "Asks for one or two kid-friendly word types at a time, each with a short friendly explanation and example, and does not show or describe the story yet."}
  - name: edge-adults-office-medium
    vars:
      theme: the office party
      age_group: adults
      grammar_labels: false
      length: medium
    assert:
      - {type: llm-rubric, value: "Asks for a single numbered list of about 15 to 18 word types suited to adults (it may include adverbs, past-tense verbs or exclamations) without grammar explanations and without revealing the story."}
  - name: negative-no-story-preview
    vars:
      theme: a pirate ship
      age_group: teens
      grammar_labels: true
      length: short
    assert:
      - {type: not-icontains, value: "Once upon"}
      - {type: llm-rubric, value: "Requests words by type only and gives no preview, summary or excerpt of the pirate story before the words are supplied."}
