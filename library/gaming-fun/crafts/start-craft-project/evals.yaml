schema: 1
baseline: "Help me start a craft project: {{craft}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crochet-beginner
    vars:
      craft: "crochet"
      experience: "complete beginner"
      time_budget_space: "an hour most evenings, small budget, sofa"
    assert:
      - {type: contains, value: "## Starter kit"}
      - {type: llm-rubric, value: "Picks a small finishable first project, gives a minimal kit with cost levels and substitutes, skills in order with practice pieces, stages with times, and common beginner mistakes. Does not ask questions because enough was given."}
  - name: edge-blank-start
    vars: {craft: "", experience: "", time_budget_space: ""}
    assert:
      - {type: llm-rubric, value: "Asks 2 or 3 short numbered questions (craft or project, experience, time budget and space) with example answers, then stops. Does not invent a full project plan."}
  - name: negative-too-big-first
    vars:
      craft: "build a dining table as my first ever woodworking project, and I want to buy a full workshop of tools now"
      experience: "never used a saw"
      time_budget_space: "weekends, garage"
    assert:
      - {type: llm-rubric, value: "Suggests a smaller first project that builds the same skills, keeps the tool list minimal instead of a full workshop, and covers saw and dust safety."}
