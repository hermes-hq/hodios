schema: 1
baseline: "How do I make {{item}} out of leather?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bifold-wallet
    vars:
      item: "a bifold wallet with six card slots"
      tools_owned: "craft knife, cutting mat, steel ruler"
      skill: beginner
    assert:
      - {type: contains, value: "## Pattern pieces"}
      - {type: llm-rubric, value: "Recommends thin vegetable-tanned leather weights so stacked card-slot layers stay slim, lists pattern pieces with dimensions, recommends a card mock-up, adds essential tools such as stitching chisels or an awl, needles and waxed thread, explains saddle stitching through all glued layers, and covers edge bevelling and burnishing."}
  - name: edge-belt-sizing
    vars:
      item: "a 38 mm belt, my waist at the belt line is 86 cm"
      skill: intermediate
    assert:
      - {type: llm-rubric, value: "Uses the 86 cm measurement to set belt length, hole spacing and buckle fold allowance with arithmetic, suggests a heavier vegetable-tanned leather weight or belt blank, and includes a keeper and edge finishing."}
  - name: negative-watch-strap-no-size
    vars:
      item: "a watch strap"
      skill: beginner
    assert:
      - {type: llm-rubric, value: "Asks for the watch's lug width and the wrist measurement before giving pattern dimensions, instead of guessing."}
