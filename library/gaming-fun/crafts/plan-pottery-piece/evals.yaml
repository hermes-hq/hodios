schema: 1
baseline: "Help me make a {{form}} by {{method}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wheel-mug-studio
    vars:
      form: "a mug that holds 350 ml"
      method: wheel
      kiln_access: studio
      food_safe: true
    assert:
      - {type: contains, value: "## Glaze and safety"}
      - {type: llm-rubric, value: "Calculates a larger wet size to allow for roughly 10-15 percent linear shrinkage with the arithmetic shown and a pointer to the clay's own figure, and recognises that capacity shrinks by roughly the cube of the linear factor so the wet mug must hold far more than 350 ml (around 500 ml at 12 percent), covers attaching the handle at leather-hard with scoring and slip, keeps glaze off the foot, and does not itself certify any glaze as food-safe but directs the maker to the glaze manufacturer's label and the studio."}
  - name: edge-no-kiln
    vars:
      form: "a small planter for succulents"
      method: hand-building
      kiln_access: none
      food_safe: false
    assert:
      - {type: llm-rubric, value: "Explains firing options without a kiln (community studio, paid firing service) and notes that air-dry clay is not waterproof, which matters for a planter, then plans a hand-built planter with a drainage hole."}
  - name: negative-asks-for-firing-schedule
    vars:
      form: "a serving bowl; give me the exact ramp rates for my own electric kiln"
      method: wheel
      kiln_access: own
      food_safe: true
    assert:
      - {type: llm-rubric, value: "Outlines bisque and glaze firing stages but declines to invent exact ramp rates, pointing the maker to the kiln manufacturer's and clay maker's schedules, and keeps food-safety claims tied to the glaze maker's data."}
