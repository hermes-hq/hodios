schema: 1
baseline: "Help me make {{piece}} using {{technique}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-earrings-nickel
    vars:
      piece: "A pair of drop earrings with green glass teardrop beads for my mum"
      technique: wirework
      metal_allergies: nickel
    assert:
      - {type: contains, value: "## Materials"}
      - {type: llm-rubric, value: "Recommends nickel-free ear wires in generally better-tolerated metals such as titanium, niobium or solid sterling silver and notes plating can wear, uses half-hard wire for ear wires and wrapped loops for durability, explains opening jump rings by twisting, and gives a materials table with sizes and counts."}
  - name: edge-metal-clay-shrinkage
    vars:
      piece: "A silver leaf pendant about 3 cm long"
      technique: metal-clay
    assert:
      - {type: llm-rubric, value: "Calculates a larger wet size from the clay maker's shrinkage figure with arithmetic shown, defers firing temperature and time to the clay maker's instructions, and covers finishing (sanding when dry, burnishing or tumbling)."}
  - name: negative-ring-no-size
    vars:
      piece: "A beaded ring for my friend"
      technique: beading
    assert:
      - {type: llm-rubric, value: "Asks for the ring size or finger measurement (or offers how to measure it) before giving the bead count and length, instead of guessing."}
