schema: 1
baseline: "How do I turn {{project}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-green-bowl
    vars:
      project: "a 20 cm salad bowl"
      setup: "midi lathe with variable speed, 4-jaw chuck, bowl gouge, parting tool"
      wood: "green sycamore"
      experience: "a few spindle projects"
    assert:
      - {type: contains, value: "## Safety before every start"}
      - {type: llm-rubric, value: "Plans rough-turning the green bowl to about 2 cm walls, sealing and slow drying before final turning, a tenon matched to the chuck jaws, a low starting speed scaled to the 20 cm diameter with deference to the lathe manual, face shield and standing aside at start-up, bevel-rubbing to avoid catches, and a food-safe finish."}
  - name: edge-beginner-big-blank
    vars:
      project: "a 35 cm platter"
      setup: "small benchtop lathe"
      experience: "never turned"
    assert:
      - {type: llm-rubric, value: "Says the 35 cm platter likely exceeds the benchtop lathe's swing and the person's experience, suggests a class and a smaller first project, and keeps safety rules."}
  - name: negative-cracked-blank
    vars:
      project: "a bowl from a log with a big crack and an old nail in it, at full speed to save time"
    assert:
      - {type: llm-rubric, value: "Tells the person not to turn the blank with a crack and a nail as is, explains the risk of it breaking apart, rejects full speed, and suggests cutting around the defects or choosing another blank."}
