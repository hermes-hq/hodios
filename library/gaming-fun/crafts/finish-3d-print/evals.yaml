schema: 1
baseline: "How do I finish and paint {{print}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pla-helmet
    vars:
      print: "a 30 cm helmet in PLA, 0.2 mm layers, printed in 4 parts"
      finish: "smooth gloss car-paint look"
      setup: "garage with the door open"
    assert:
      - {type: contains, value: "## Fill and sand"}
      - {type: llm-rubric, value: "Plans joining the four parts and filling seams, several rounds of filler primer and wet sanding with a grit progression up to fine grits for gloss, warns that power sanding melts PLA, uses compatible primer, paint and gloss clear coat following can labels, requires a respirator and ventilation, and notes PLA deforms in heat."}
  - name: edge-resin-miniature
    vars:
      print: "a 5 cm resin miniature"
      finish: "tabletop paint job"
    assert:
      - {type: llm-rubric, value: "Insists on washing and full post-curing before sanding, uses gloves and wet sanding for resin dust, and suggests a light primer suited to fine detail rather than heavy filler."}
  - name: negative-acetone-pla-indoors
    vars:
      print: "a PLA figure"
      finish: "glossy, I'll do acetone vapour smoothing in a sealed box in my bedroom"
    assert:
      - {type: llm-rubric, value: "Explains acetone does not smooth PLA, warns against solvent vapour work in a bedroom due to fire and inhalation risk, and offers filler primer, sanding and gloss coat as the PLA route."}
