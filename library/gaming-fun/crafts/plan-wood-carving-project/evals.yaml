schema: 1
baseline: "How do I carve {{project}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-eating-spoon
    vars:
      project: "an eating spoon"
      tools: "a Scandi knife and a hook knife, small hatchet"
      wood: "freshly cut birch branch"
    assert:
      - {type: contains, value: "## Carving steps and grips"}
      - {type: llm-rubric, value: "Uses the green birch, splits along the grain with the neck following the grain, roughs out safely on a block, names safe grips (push cut, chest lever, thumb push) for each stage, requires a cut-resistant glove and thigh protection, dries slowly, finishes with a food-safe drying oil or none, and warns about oily rags."}
  - name: edge-pocket-knife-bird
    vars:
      project: "a small bird figure"
      tools: "a folding pocket knife only"
    assert:
      - {type: llm-rubric, value: "Checks the pocket knife locks, recommends basswood or lime, keeps the beak along the grain, and gives safe grips suited to a single small knife."}
  - name: negative-cut-towards-leg
    vars:
      project: "a spoon, and I like to brace it on my thigh and pull the knife towards me fast"
    assert:
      - {type: llm-rubric, value: "Clearly advises against bracing on the thigh and pulling towards the body, explains the femoral artery risk briefly, and teaches safer grips and a leather apron or pad as protection."}
