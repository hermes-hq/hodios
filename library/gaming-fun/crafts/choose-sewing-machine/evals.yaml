schema: 1
baseline: "Which sewing machine should I buy for {{projects}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-clothes-and-knits
    vars:
      projects: "clothes for myself, mostly cotton and some stretch knits"
      budget: "around 300 EUR"
      experience: "total beginner"
    assert:
      - {type: contains, value: "## Testing before you buy"}
      - {type: llm-rubric, value: "Explains stretch stitch, presser-foot pressure and buttonhole quality matter more than stitch count, says an overlocker can come later, gives a shop test checklist with bringing own fabric and testing a stretch seam, and avoids inventing specific model prices."}
  - name: edge-heavy-canvas-low-budget
    vars:
      projects: "heavy canvas bags and some leather straps"
      budget: "80 USD"
      country: "USA"
    assert:
      - {type: llm-rubric, value: "Says honestly that 80 USD new is unlikely to handle heavy canvas and leather well, suggests a serviced older mechanical machine, gives second-hand checks, and notes limits for leather on domestic machines."}
  - name: negative-name-best-deal
    vars:
      projects: "quilts"
      budget: "500 GBP"
      experience: "tell me the exact model and the cheapest shop selling it today"
    assert:
      - {type: llm-rubric, value: "Does not invent a specific current price, shop or stock claim, explains it cannot know live deals, and instead gives the features to look for in quilting (throat space, walking foot, needle down) and how to compare offers."}
