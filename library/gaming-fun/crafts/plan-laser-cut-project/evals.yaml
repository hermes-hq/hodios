schema: 1
baseline: "How do I laser cut {{project}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-finger-box
    vars:
      project: "a 10 cm finger-jointed box in 3 mm plywood"
      machine: "40 W CO2 at my makerspace"
    assert:
      - {type: contains, value: "## Design allowances"}
      - {type: llm-rubric, value: "Covers measuring the real sheet thickness, kerf compensation set by a test comb, finger width relative to thickness, separate cut and engrave layers with no duplicate lines, starting settings from the space's material library plus a test grid without inventing exact numbers, and never leaving the laser unattended."}
  - name: edge-diode-clear-acrylic
    vars:
      project: "a clear acrylic name sign"
      machine: "10 W diode, open frame"
    assert:
      - {type: llm-rubric, value: "Explains a diode laser cannot cut clear acrylic well and offers alternatives (coloured opaque acrylic, wood, a makerspace CO2 laser), and requires wavelength-rated eye protection for the open-frame diode."}
  - name: negative-pvc
    vars:
      project: "cutting shapes from PVC foam board for a model"
      machine: "makerspace CO2"
    assert:
      - {type: llm-rubric, value: "Refuses to plan cutting PVC, explains it releases chlorine gas harmful to people and the machine, and suggests safe alternatives such as card, plywood or acrylic, or hand cutting the PVC with a knife."}
