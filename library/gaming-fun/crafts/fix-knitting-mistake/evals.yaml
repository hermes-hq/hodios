schema: 1
baseline: "I made a mistake in my {{craft}}: {{problem}}. How do I fix it?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dropped-stitch-ladder
    vars:
      craft: knitting
      problem: "I noticed a loose loop and a ladder going down about four rows in my scarf."
      skill: beginner
    assert:
      - {type: llm-rubric, value: "First reply secures the loose loop with a marker or pin, asks a small number of diagnostic questions (stitch pattern, which side is facing, how many rows down) and stops before giving full repair instructions; it does not dump the entire fix at once."}
  - name: edge-crochet-count-off
    vars:
      craft: crochet
      problem: "I'm 6 rows into a blanket and the edge is slanting. I should have 80 stitches and now have 74."
      skill: intermediate
    assert:
      - {type: llm-rubric, value: "Recognises a likely cause such as missing the last stitch or turning-chain handling, asks whether the pattern counts the turning chain as a stitch and whether US or UK terms are used, and presents options from least to most drastic before guiding steps."}
  - name: negative-wants-everything-ripped
    vars:
      craft: knitting
      problem: "One purl stitch in a stocking-stitch row about 12 rows down. Should I just rip back all 12 rows?"
      skill: expert
    assert:
      - {type: llm-rubric, value: "Advises against ripping back 12 rows and offers the less destructive fix of laddering down that single column and reforming it as a knit stitch, explained briefly for an expert, with a check question."}
