schema: 1
baseline: "Write this up as a {{craft}} pattern: {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hat-three-sizes
    vars:
      craft: knitting
      notes: "Ribbed hat. DK merino, 4 mm needles, gauge 22 sts 30 rows in stocking st after blocking. Sizes child, adult S, adult L cast on 96, 104, 112. 2x2 rib 5 cm, then st st to 15 (18, 20) cm, then decrease k6 k2tog around, every other round, until 12 (13, 14) sts. Used about 70 g for adult S."
      audience: "free blog pattern for beginners"
    assert:
      - {type: contains, value: "## Gaps and questions"}
      - {type: llm-rubric, value: "Produces a standard-order pattern with sizes as first (second, third), defines abbreviations, gives gauge with stitch pattern and blocking, checks the decrease maths (96, 104 and 112 divided by 8 give 12, 13, 14 sts, matching the notes) and states stitch counts after decrease rounds, flags missing yardage for the other sizes and finished measurements as placeholders rather than inventing them, and includes a tech-edit checklist."}
  - name: edge-crochet-uk-terms
    vars:
      craft: crochet
      terms: uk
      notes: "Granny square blanket, 20 squares, each square 5 rounds, aran cotton 5 mm hook, joined with slip stitch, border of 2 rounds dc."
    assert:
      - {type: llm-rubric, value: "Uses UK terms consistently with a one-time note on US equivalents (UK dc = US sc), describes each round with counts, flags missing yardage, gauge and finished size as gaps, and gives joining and border instructions."}
  - name: negative-inconsistent-maths
    vars:
      craft: knitting
      notes: "Cast on 90, k2 p2 rib for 6 cm, then st st, decrease k6 k2tog around to finish."
    assert:
      - {type: llm-rubric, value: "Notices 90 is not a multiple of 4 for k2 p2 rib in the round and not a multiple of 8 for k6 k2tog, flags both instead of silently changing the numbers, and asks the designer which to adjust."}
