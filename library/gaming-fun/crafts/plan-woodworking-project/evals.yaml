schema: 1
baseline: "Plan this woodworking project for me: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-garden-bench
    vars:
      project: "A simple garden bench that seats two adults, about 120 cm long, left outside year-round."
      tools: "Circular saw, drill-driver, pocket-hole jig, random orbital sander. Built two bookcases."
    assert:
      - {type: contains, value: "## Materials and cut list"}
      - {type: llm-rubric, value: "Chooses an outdoor-suitable wood with exterior fasteners and an exterior finish, gives a cut list using actual rather than nominal dimensions with waste allowance, joinery suited to pocket holes and an adult load (with weather-appropriate glue or screws), ordered build steps with square checks, a safety line on each power-tool step, and a finishing schedule."}
  - name: edge-cutting-board-hand-tools
    vars:
      project: "An end-grain cutting board as a gift."
      tools: "Hand tools only: saw, planes, chisels, clamps."
    assert:
      - {type: llm-rubric, value: "Adapts the method to hand tools (or recommends a simpler edge-grain board if end grain is impractical by hand), uses a food-safe finish such as mineral oil or a board butter, warns against film finishes, and covers glue choice and clamping."}
  - name: negative-unclear-load
    vars:
      project: "A loft bed."
    assert:
      - {type: llm-rubric, value: "Asks about the sleeper's age or weight, the room and ceiling height and the tools before designing, and flags that a load-bearing loft bed needs robust joinery and fixing, rather than producing a full plan with guessed loads."}
