schema: 1
baseline: "Help me plan an embroidery of {{design_idea}}, about {{size_cm}} cm."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-botanical-hoop
    vars:
      design_idea: "A sprig of lavender with a bee, as hoop art for my sister's birthday, in soft purples and greens."
      size_cm: 12
      skill: beginner
    assert:
      - {type: contains, value: "## Stitch map"}
      - {type: llm-rubric, value: "Recommends a woven cotton or linen ground in a hoop slightly larger than 12 cm, a washable or heat-erasable transfer tested first, assigns a named stitch and strand count to every area (stems, lavender buds, bee body, wings), keeps satin areas small or suggests alternatives, orders fills before outlines, and estimates hours."}
  - name: edge-dark-denim-jacket
    vars:
      design_idea: "Large white and yellow daisies on the back of a black denim jacket."
      size_cm: 25
      skill: intermediate
    assert:
      - {type: llm-rubric, value: "Recommends a stabiliser and a transfer method suitable for dark fabric such as printed water-soluble stabiliser, warns about light threads over dark fabric and about tails showing, and plans stitch directions and strand counts for a 25 cm garment design."}
  - name: negative-too-vague
    vars:
      design_idea: "something nice"
      size_cm: 15
      skill: beginner
    assert:
      - {type: llm-rubric, value: "Asks what the design should depict and where it will go before producing a stitch map, instead of inventing a full design."}
