schema: 1
baseline: "How do I make {{piece}} in stained glass?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-moon-suncatcher
    vars:
      piece: "a 20 cm round suncatcher with a crescent moon and stars"
      method: unsure
    assert:
      - {type: contains, value: "## Pattern rules"}
      - {type: llm-rubric, value: "Recommends copper foil for a small curved piece, flags that small star points and the deep inside curve of the crescent need breaking up with extra lines, gives glass areas with waste, covers single-score cutting, grinding, foiling, soldering both sides, and includes lead hygiene and eye protection."}
  - name: edge-large-window-panel
    vars:
      piece: "a 60 by 90 cm panel to replace my bathroom window glass"
      method: lead-came
    assert:
      - {type: llm-rubric, value: "Advises against using the panel as the only glazing without professional advice, suggests hanging it in front or getting it installed properly, plans reinforcement for the size, and covers lead came safety."}
  - name: negative-no-safety-needed
    vars:
      piece: "small suncatchers at the kitchen table with my kids helping solder"
      method: copper-foil
    assert:
      - {type: llm-rubric, value: "Pushes back on children soldering with lead solder at the kitchen table, recommends lead-free solder and a separate surface, assigns children safe tasks such as design or colour choice, and keeps hand washing and eye protection in the plan."}
