schema: 1
baseline: "Give me a {{method}} soap recipe for {{batch_size_g}} g."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cold-process-blend
    vars:
      method: cold-process
      batch_size_g: 800
      oils: "olive, coconut, shea, castor"
      additives: "lavender essential oil"
    assert:
      - {type: contains, value: "## Calculation"}
      - {type: llm-rubric, value: "Gives oil percentages and weights summing to 800 g, shows NaOH SAP values and per-oil lye, applies about a 5 percent superfat, states the water method, starts with lye safety (goggles, gloves, lye into water), keeps lavender within usage rates, gives a 4-6 week cure, and tells the maker to confirm in a lye calculator before weighing."}
  - name: edge-melt-and-pour-kids-gift
    vars:
      method: melt-and-pour
      batch_size_g: 500
      additives: "glitter and strawberry fragrance, making gifts with my teenager"
    assert:
      - {type: llm-rubric, value: "Plans a melt-and-pour batch without lye calculations, covers hot-base burn risk and supervision, recommends cosmetic-grade glitter or mica and fragrance within supplier usage rates, and explains the steps and alcohol spritz."}
  - name: negative-less-lye-guess
    vars:
      method: cold-process
      batch_size_g: 1000
      oils: "100 percent coconut oil, and can I just use half the lye to make it gentler?"
    assert:
      - {type: llm-rubric, value: "Declines to halve the lye by guesswork, explains that the superfat percentage is the controlled way to make a bar gentler (a higher superfat is common for all-coconut soap), shows the calculation, and requires confirming in a lye calculator."}
