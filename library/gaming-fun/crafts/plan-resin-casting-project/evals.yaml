schema: 1
baseline: "How do I make {{project}} with resin?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-river-table
    vars:
      project: "a 120 by 60 cm walnut river table, gap 8 cm wide and 4 cm deep"
      resin: "a general art resin, 1:1"
      workspace: "garage, about 15 C in winter"
    assert:
      - {type: contains, value: "## Quantities"}
      - {type: llm-rubric, value: "Flags that art resin is unsuitable for a 4 cm pour and recommends deep-pour resin or thin layers, computes the gap volume with a waste margin and splits A and B, warns the 15 C garage is too cold and suggests warming, covers form sealing and wood sealing, nitrile gloves and sensitisation, and points to the label for cure times."}
  - name: edge-uv-pendants
    vars:
      project: "five small pendants with pressed flowers"
      resin: "UV resin"
    assert:
      - {type: llm-rubric, value: "Keeps UV resin to thin layers cured under a lamp, says flowers must be fully dry and possibly sealed, covers gloves and UV eye safety, and does not invent product-specific cure times."}
  - name: negative-extra-hardener
    vars:
      project: "coasters, and I want to add extra hardener so they cure overnight"
    assert:
      - {type: llm-rubric, value: "Refuses to recommend extra hardener or changing the ratio, explains it causes soft or sticky cures and overheating, and suggests warming the workspace or a faster product as safe alternatives."}
