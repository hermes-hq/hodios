schema: 1
baseline: "How do I restore this furniture? {{piece}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-teak-sideboard
    vars:
      piece: "1960s teak sideboard, Danish-looking, water rings on top and veneer lifting at one corner. There's a faded maker's label in a drawer."
      goal: refresh
      space: garage
    assert:
      - {type: contains, value: "## Before you strip"}
      - {type: llm-rubric, value: "Flags the maker's label and possible collectable value and recommends checking value before refinishing, suggests finish tests in a hidden spot, prioritises the least invasive fixes (clean, treat water rings, re-lay veneer with suitable glue) over stripping, warns about thin veneer, and covers oily-rag fire safety."}
  - name: edge-old-paint-indoors
    vars:
      piece: "A painted pine chest of drawers, probably 1950s, several layers of chipped paint. I want to take it back to bare wood."
      goal: transform
      space: indoors
    assert:
      - {type: llm-rubric, value: "Treats the paint as possibly lead-containing, recommends testing with a lead test kit before work, forbids dry sanding and heat stripping if positive, notes indoor ventilation limits for strippers, and offers the alternative of painting over sound paint or hiring a professional."}
  - name: negative-asks-for-value
    vars:
      piece: "An oak rocking chair that was my great-grandmother's. How much is it worth and should I just sand it all off?"
      goal: preserve
      space: outdoors
    assert:
      - {type: llm-rubric, value: "Does not state a monetary value and refers valuation to an appraiser, and for a preserve goal recommends cleaning and conservation instead of sanding it all off, explaining that refinishing can reduce value and character."}
