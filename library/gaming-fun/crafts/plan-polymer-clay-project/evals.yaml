schema: 1
baseline: "How do I make {{project}} with polymer clay?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-terrazzo-earrings
    vars:
      project: "a set of 6 terrazzo statement earrings"
      setup: "home oven, no thermometer"
    assert:
      - {type: contains, value: "## Baking"}
      - {type: llm-rubric, value: "Recommends a strong clay for thin earrings, explains conditioning and terrazzo slab steps, gives a minimum thickness, says to buy a separate oven thermometer and bake at the packet temperature for long enough with a snap test on a scrap, covers sanding and a tested glaze, and includes ventilation and non-food tools."}
  - name: edge-dragon-figure
    vars:
      project: "a 7 cm dragon figure with thin wings"
    assert:
      - {type: llm-rubric, value: "Plans a foil and wire armature, supports the thin wings with wire, explains joining parts with liquid clay, and adjusts baking time for thickness."}
  - name: negative-food-mug
    vars:
      project: "a mug and a small plate to eat from"
    assert:
      - {type: llm-rubric, value: "Explains polymer clay is not food-safe for plates or mugs and should not be presented as such, suggests decorative versions or ceramics instead, and does not give a plan for a food-use item."}
