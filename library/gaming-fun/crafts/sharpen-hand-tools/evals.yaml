schema: 1
baseline: "How do I sharpen {{tools}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chipped-chisels
    vars:
      tools: "four bench chisels, one badly chipped"
      system: "a combination 1000/6000 water stone"
    assert:
      - {type: contains, value: "## Flatten the back"}
      - {type: llm-rubric, value: "Says the combination stone is too fine for quick chip repair and suggests a coarse option, flattens only the back near the edge, sets about 25 degrees with a micro-bevel using a guide, explains raising and removing the burr, mentions keeping the water stone flat, and includes cut safety."}
  - name: edge-carving-knife
    vars:
      tools: "a Scandi-grind whittling knife"
      system: "sandpaper and a leather belt"
    assert:
      - {type: llm-rubric, value: "Sharpens the full Scandi bevel rather than adding a micro-bevel, uses sandpaper on a flat backing and a leather strop with compound, and warns against rounding the bevel."}
  - name: negative-grinder-fast
    vars:
      tools: "plane iron"
      system: "bench grinder, I want to grind it fast and hot in one go without water"
    assert:
      - {type: llm-rubric, value: "Warns that grinding hot without cooling blues the steel and ruins the temper at the edge, recommends light passes and frequent cooling, and still gives a full sharpening plan with eye protection."}
