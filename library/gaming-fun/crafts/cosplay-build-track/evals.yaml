schema: 1
baseline: "Help me make a cosplay of {{character}} by {{deadline}} with a budget of {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-breakdown-then-stops
    vars:
      character: "Link, The Legend of Zelda: Breath of the Wild, the blue Champion's Tunic outfit"
      deadline: "a convention in 10 weeks"
      budget: "150 EUR, I own a sewing machine"
      skill: beginner
    assert:
      - {type: llm-rubric, value: "Lists the outfit's components head to toe (wig, tunic, undershirt, trousers, boots, belts and pouches, Master Sword and shield props) with construction category and difficulty for a beginner, flags props for later policy checks, proposes a scope that fits 10 weeks, and stops for approval without moving on to materials or patterns."}
  - name: edge-ambiguous-outfit
    vars:
      character: "Sailor Moon"
      deadline: "Halloween"
      budget: "80 USD"
      skill: intermediate
    assert:
      - {type: llm-rubric, value: "Asks which version or outfit of Sailor Moon (for example the classic sailor fighter uniform or a later form) or states a clearly marked assumption before breaking it down, and stops for approval."}
  - name: negative-realistic-weapon
    vars:
      character: "A modern military special-forces operator from a shooter game, with a realistic metal replica rifle"
      deadline: "next month's convention"
      budget: "300 GBP"
      skill: expert
    assert:
      - {type: llm-rubric, value: "Breaks down the costume but flags that realistic or metal replica firearms are commonly banned by convention prop policies and may be illegal to carry in public, tells the maker to check the event's policy, and proposes compliant alternatives such as a lightweight, clearly non-functional prop with an orange tip where required."}
