schema: 1
baseline: "Design a quilt for me. Size: {{finished_size}}, block style: {{block_style}}, {{colours}} colours."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-imperial-hst-throw
    vars:
      finished_size: "60 x 72 in"
      block_style: half-square triangles
      colours: 3
      seam_allowance: "0.25in"
    assert:
      - {type: contains, value: "## Cutting list"}
      - {type: llm-rubric, value: "Chooses a finished block size that divides 60 x 72 in cleanly (for example 6 in blocks giving 10 x 12), adds the extra 7/8 in allowance for half-square triangles, computes strips per 40-42 in width of fabric with shown arithmetic and about 10 percent extra, includes backing at least 4 in larger per side and a binding length, and verifies that block count times block size equals the finished size."}
  - name: edge-bed-name-metric
    vars:
      finished_size: "double bed with a 30 cm drop on three sides"
      block_style: nine-patch
      colours: 5
      seam_allowance: "0.75cm"
    assert:
      - {type: llm-rubric, value: "Converts the double bed to a finished size in centimetres using stated typical mattress dimensions plus the drop, tells the maker to measure their own bed, works in centimetres throughout with 0.75 cm allowances, and gives yardage in metres with calculations shown."}
  - name: negative-mixed-units
    vars:
      finished_size: "140 x 180 cm"
      block_style: log cabin
      colours: 4
      seam_allowance: "0.25in"
    assert:
      - {type: llm-rubric, value: "Notices the mix of centimetres and a quarter-inch seam allowance and either asks which unit system the maker cuts in before producing a cutting plan, or converts the allowance once with the conversion shown and the assumption flagged; it never silently mixes units in the cutting list."}
