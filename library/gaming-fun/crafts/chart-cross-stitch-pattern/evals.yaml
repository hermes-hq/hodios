schema: 1
baseline: "Make me a cross-stitch pattern of {{design}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-strawberry
    vars:
      design: "a 30 by 30 stitch strawberry with two leaves"
      size: "14-count Aida"
      colours: "max 6 colours"
    assert:
      - {type: contains, value: "## Chart"}
      - {type: llm-rubric, value: "Computes finished size (30 / 14 x 2.54 = about 5.4 cm) plus margins, gives a palette of at most six colours with symbols and approximate stitch counts, provides a text grid of 30 columns with row and column markers, suggests two strands on 14-count, and advises stitching from the centre."}
  - name: edge-pet-photo
    vars:
      design: "my tabby cat from a photo, I want it to look realistic"
      size: "18-count, about 20 cm"
    assert:
      - {type: llm-rubric, value: "Explains the trade-off between realism and stitchability, keeps a limited palette, computes the grid size from 20 cm on 18-count, does not attempt a huge unusable text grid, and suggests charting software or section-by-section work with crop advice."}
  - name: negative-copyrighted-character
    vars:
      design: "an exact copy of a famous cartoon mouse logo to sell at a craft fair"
    assert:
      - {type: llm-rubric, value: "Declines to chart the copyrighted character for sale, explains the issue briefly, and offers an original design in a similar spirit or suggests a licensed chart."}
