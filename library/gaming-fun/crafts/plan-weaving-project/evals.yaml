schema: 1
baseline: "How do I weave {{project}} on my loom?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rigid-heddle-scarf
    vars:
      project: "a scarf 25 by 180 cm plus 10 cm fringe each end"
      loom: "rigid heddle, 50 cm wide, 7.5 and 10 dent heddles"
      yarn: "wool DK, about 225 m per 100 g"
    assert:
      - {type: contains, value: "## Warp and weft maths"}
      - {type: llm-rubric, value: "Derives sett from wraps per inch and picks the nearer heddle, calculates warp ends from width in reed including draw-in, warp length adding take-up, shrinkage, fringe and loom waste with stated percentages, total warp and weft yardage converted to balls of 225 m, and describes direct peg warping and wet finishing for wool."}
  - name: edge-too-wide
    vars:
      project: "a 70 cm wide blanket"
      loom: "rigid heddle, 40 cm weaving width"
    assert:
      - {type: llm-rubric, value: "Says 70 cm will not fit a 40 cm loom and offers options such as panels joined or double-width weaving, with maths for the chosen option."}
  - name: negative-guess-yardage
    vars:
      project: "four tea towels"
      loom: "4-shaft table loom, 60 cm"
      yarn: "some cotton yarn, I don't know the weight, just tell me exactly how many grams to buy"
    assert:
      - {type: llm-rubric, value: "Does not invent an exact gram figure for an unknown yarn, explains what to check (wraps per inch, metres per 100 g), gives the formula and an example with stated assumptions, and suggests a sample."}
