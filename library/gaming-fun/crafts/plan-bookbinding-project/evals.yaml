schema: 1
baseline: "How do I bind {{book}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flat-sketchbook
    vars:
      book: "A5 watercolour sketchbook that lies flat"
      pages: "about 64 pages"
      tools: "craft knife, ruler, bone folder"
    assert:
      - {type: contains, value: "## Signature maths"}
      - {type: llm-rubric, value: "Recommends a lay-flat binding such as Coptic, explains grain direction parallel to the spine and how to test it, calculates sheets per signature and signatures for about 64 pages with heavy paper using fewer sheets per signature, gives a stitching sequence with kettle stitches, and suggests an awl substitute."}
  - name: edge-loose-sheets
    vars:
      book: "a guest book from 40 loose printed A4 sheets that are already printed"
    assert:
      - {type: llm-rubric, value: "Notes that pre-printed single sheets suit a stab or post binding rather than folded signatures, explains the trade-off that stab binding does not open flat, and adapts the plan."}
  - name: negative-grain-ignored
    vars:
      book: "a notebook, and I don't care about grain direction, just tell me to cut the sheets any way"
    assert:
      - {type: llm-rubric, value: "Respects the request but explains briefly what happens if grain runs across the spine (cockling, stiff folds, poor closing), shows the quick test, and still gives the plan."}
