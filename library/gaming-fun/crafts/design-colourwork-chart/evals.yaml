schema: 1
baseline: "Design a colourwork chart for {{placement}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hat-band
    vars:
      placement: "hat band, 112 stitches, 20 rounds"
      theme: "simple snowflakes"
      colours: "cream and navy"
    assert:
      - {type: contains, value: "## Float and contrast check"}
      - {type: llm-rubric, value: "Chooses a repeat that divides 112 (for example 8, 14 or 16), gives a chart grid of consistent width with the repeat marked and rows numbered, lists the longest float per round and keeps them at seven or fewer or names where to trap, uses two colours per round, and asks for a swatch in pattern."}
  - name: edge-awkward-count
    vars:
      placement: "sleeve cuff, 53 stitches, 10 rounds"
    assert:
      - {type: llm-rubric, value: "Notices 53 is prime and has no useful repeat, proposes adjusting the count by increasing or decreasing a few stitches evenly in a plain round, and shows the new repeat maths."}
  - name: negative-long-floats
    vars:
      placement: "yoke band, 240 stitches, 15 rounds"
      theme: "I want big solid blocks of colour 20 stitches wide, no trapping, it's fine"
    assert:
      - {type: llm-rubric, value: "Warns that 20-stitch floats will snag and pucker, explains trapping or redesigning the blocks, and offers an alternative that keeps the bold look."}
