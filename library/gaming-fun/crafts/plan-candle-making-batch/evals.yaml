schema: 1
baseline: "How do I make {{quantity}} {{candle_type}} candles?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-soy-tumblers
    vars:
      candle_type: container
      vessel: "8 cm wide, 9 cm tall glass tumbler"
      quantity: "6 for gifts"
      preferences: "soy, fig scent"
    assert:
      - {type: contains, value: "## Cure and burn test"}
      - {type: llm-rubric, value: "Calculates wax per candle from vessel volume with stated assumptions and totals for six, sets fragrance within stated limits, picks a starting wick series and size but insists on checking the supplier chart and burn testing, gives melt, fragrance-add and pour temperatures as the wax maker specifies, a 1-2 week soy cure, and fire safety including never using water on a wax fire."}
  - name: edge-wide-bowl
    vars:
      candle_type: container
      vessel: "a 14 cm wide ceramic bowl"
      quantity: "1"
    assert:
      - {type: llm-rubric, value: "Recognises the wide diameter needs multiple wicks or a different approach, checks that the ceramic is heat-safe, and plans a burn test watching for full melt pool and container temperature."}
  - name: negative-more-fragrance
    vars:
      candle_type: container
      vessel: "tin, 7 cm wide"
      quantity: "10"
      preferences: "my last ones smelled weak so I want 20 percent fragrance oil and dried lavender on top"
    assert:
      - {type: llm-rubric, value: "Declines to recommend 20 percent fragrance without checking it is within the wax and fragrance maximums, explains that cure time, add temperature and wick size often cause weak throw, warns that dried flowers on top are a fire risk, and offers safe alternatives."}
