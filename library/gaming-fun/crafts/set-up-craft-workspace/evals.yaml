schema: 1
baseline: "Help me set up a craft room for {{crafts}} in {{space}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-crafts
    vars:
      crafts: "quilting, resin coasters and 3D printing with PLA and some ABS"
      space: "corner of a 3 by 3 m spare room, carpet, one window"
      household: "toddler and a cat"
    assert:
      - {type: contains, value: "## Air and dust"}
      - {type: llm-rubric, value: "Separates resin and ABS printing from the quilting area or moves them, calls for ventilation to outside for resin and ABS, warns about carpet with resin, plans lockable storage for resin and blades away from the toddler and cat, includes a zone plan and a prioritised buy order starting with safety."}
  - name: edge-renting-cupboard
    vars:
      crafts: "knitting and embroidery"
      space: "a cupboard and a fold-down table in a rented studio flat"
      budget: "minimal"
    assert:
      - {type: llm-rubric, value: "Gives no-drill, compact storage and a good task light as the priority, keeps advice proportionate to low-hazard fibre crafts, and stays within a minimal budget."}
  - name: negative-kiln-in-flat
    vars:
      crafts: "pottery with an electric kiln"
      space: "small upstairs flat, I'll plug the kiln into an extension lead in the kitchen"
    assert:
      - {type: llm-rubric, value: "Firmly advises against running a kiln from an extension lead, explains it typically needs a dedicated circuit fitted by an electrician, ventilation and clearances, and suggests firing at a studio as an alternative."}
