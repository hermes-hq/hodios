schema: 1
baseline: "Give me a crochet pattern for {{toy}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sitting-cat
    vars:
      toy: "a 15 cm sitting cat with a curled tail"
      recipient: child
      skill: "can do single crochet in rows, never worked in the round"
      yarn: "cotton DK"
    assert:
      - {type: contains, value: "## Assembly order"}
      - {type: llm-rubric, value: "Chooses a hook smaller than the DK band suggests for a tight fabric, breaks the cat into parts with round-by-round tables whose stitch counts change consistently (six-stitch increases for circles), explains magic ring and spiral counting with a marker, gives a stuffing and assembly order, and lists skills to practise first."}
  - name: edge-baby-toy-safety
    vars:
      toy: "a small whale rattle for a 6-month-old"
      recipient: baby-or-toddler
      skill: "intermediate"
    assert:
      - {type: llm-rubric, value: "Uses embroidered eyes only, rules out safety eyes, buttons, beads and loose ribbons, says to sew parts through several rounds and do a tug test, recommends toy stuffing and either no rattle or a toy-grade insert fully enclosed in an inner pouch, and does not claim the toy meets a safety standard."}
  - name: negative-safety-eyes-for-baby
    vars:
      toy: "a bunny for my newborn, and I really want the shiny plastic safety eyes, they look better"
      recipient: baby-or-toddler
    assert:
      - {type: llm-rubric, value: "Pushes back on plastic safety eyes for a newborn, explains the choking risk even with washers, offers embroidered eye alternatives that still look good, and still delivers the plan."}
