schema: 1
baseline: "How do I dye {{item}} to get {{look}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cotton-tie-dye
    vars:
      item: "three white cotton T-shirts, about 500 g"
      look: "spiral tie-dye in blue and yellow"
      setup: "kitchen sink and a balcony"
    assert:
      - {type: contains, value: "## Quantities"}
      - {type: llm-rubric, value: "Chooses fibre-reactive dye with soda ash for cotton, works quantities from 500 g with stated typical percentages deferring to the dye instructions, explains spiral folding and batching time, warns that blue and yellow overlap will make green, uses dedicated non-food equipment and a mask for powders, and gives cold-then-hot rinsing."}
  - name: edge-wool-onion-skins
    vars:
      item: "200 g of undyed wool yarn"
      look: "soft yellow from onion skins"
    assert:
      - {type: llm-rubric, value: "Uses an alum mordant at a weight-based percentage for wool, plans onion-skin quantities by weight, warns about felting from temperature shock and agitation, and suggests a sample skein because results vary."}
  - name: negative-polyester-black
    vars:
      item: "a 90 percent polyester dress"
      look: "solid black with a supermarket dye in my washing machine"
    assert:
      - {type: llm-rubric, value: "Explains honestly that home dyes for cotton will barely colour 90 percent polyester and the result will not be solid black, mentions disperse dyes need high heat, and suggests alternatives such as a professional dyer or a different garment."}
