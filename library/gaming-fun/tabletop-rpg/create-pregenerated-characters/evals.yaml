schema: 1
baseline: "Make pregenerated characters for my one-shot: {{adventure}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-convention-heist
    vars:
      adventure: "A four-hour convention one-shot: a heist on a floating casino. Level 3, 2024 rules. Mostly new players."
      seats: "4 to 5"
      system: dnd-5e
    assert:
      - {type: contains, value: "## Ties"}
      - {type: llm-rubric, value: "Provides six characters (one more than five seats), a party table with complexity and jobs covered, notes that the party works if any one is not picked, precomputed numbers for each at level 3 under 2024 rules, a heist-related personal goal and first-turn suggestion for each, ties to at least two others, and flags which suit new players."}
  - name: edge-cthulhu
    vars:
      adventure: "A Call of Cthulhu one-shot set at a 1920s seaside hotel; experienced players."
      seats: "4"
      system: call-of-cthulhu-7e
    assert:
      - {type: llm-rubric, value: "Builds investigators with Call of Cthulhu characteristics, percentile skills, sanity and occupations rather than D&D classes or levels, and gives each a personal tie to the hotel mystery."}
  - name: negative-missing-system
    vars:
      adventure: "A one-shot about a haunted lighthouse."
      system: ""
    assert:
      - {type: llm-rubric, value: "Asks for the game system and character level, or clearly states an assumption before building, rather than producing stat blocks for an unstated system."}
