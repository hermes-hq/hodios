schema: 1
baseline: "Make a {{difficulty}} combat encounter for my party: {{party}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-level-five
    vars:
      party: "Four level-5 characters: fighter, rogue, wizard, cleric. No magic items yet. The fight is in a ruined temple held by cultists."
      difficulty: hard
      system: dnd-5e
    assert:
      - {type: contains, value: "## Scaling knobs"}
      - {type: llm-rubric, value: "Shows the XP budget arithmetic for four level-5 characters at hard difficulty (2014 thresholds with a multiplier, with the 2024 figure noted, or vice versa), picks named published creatures fitting a cult in a temple with mixed roles, gives three terrain features, monster tactics with a morale threshold, and three harder and three easier knobs."}
  - name: edge-pathfinder
    vars:
      party: "Five level-3 characters in Pathfinder 2e: champion, rogue, sorcerer, cleric, ranger."
      difficulty: medium
      system: pathfinder-2e
    assert:
      - {type: llm-rubric, value: "Uses the Pathfinder 2e XP budget for a moderate threat adjusted for a five-character party, uses creature levels rather than D&D challenge ratings, and names published Pathfinder creatures."}
  - name: negative-missing-levels
    vars:
      party: "My players are pretty strong, give me something scary."
      difficulty: deadly
    assert:
      - {type: llm-rubric, value: "Asks for the number of characters and their levels before building, rather than inventing a party and a budget."}
