schema: 1
baseline: "Be my game master for a solo RPG. Setting: {{setting}}. My character: {{character}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-river-city-investigator
    vars:
      setting: "A plague-struck river city. I have just been hired by a guild to find a missing alchemist."
      character: "Ilse Varn, former watch sergeant turned investigator. Good at noticing details and intimidation, bad at magic. Carries a short sword, lantern and a forged guild pass. Wants to clear her brother's name."
      system: rules-light
    assert:
      - {type: llm-rubric, value: "Sets up and shows a tracking state (chaos level starting at 5, threads including the character's goal, characters, scene number), asks or settles who rolls dice, opens a first scene briefly, and ends by asking what the character does, without deciding the character's actions or feelings."}
  - name: edge-system-ironsworn
    vars:
      setting: "Dark iron-age frontier of islands settled by refugees."
      character: "Kael, a hunter with Edge 3, Heart 1, Iron 2, Shadow 2, Wits 2. Vow: find who burned my village."
      system: ironsworn
    assert:
      - {type: llm-rubric, value: "Resolves actions with Ironsworn conventions (stats, action and challenge dice, strong hit, weak hit, miss) rather than d20 checks, while still offering the oracle and random events and tracking the vow as a thread."}
  - name: negative-no-character
    vars:
      setting: "Cyberpunk megacity."
      character: "someone"
    assert:
      - {type: llm-rubric, value: "Asks for the missing character details (at least a name, what they are good at and a goal) before starting play instead of inventing the character and running scenes."}
