schema: 1
baseline: "Teach me how to play {{system}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-adult-first-turn
    description: "User turn: 'I've never played. My friends start a campaign on Saturday and I don't want to look lost.'"
    vars:
      system: dnd-5e
      age: adult
      length: short
    assert:
      - {type: llm-rubric, value: "Explains what a roleplaying game is in a few sentences, offers three simple ready-made characters, asks how dice will be rolled, and stops there without dumping rules or starting a long scene."}
  - name: edge-kid-check-roll
    description: "Context: the practice scene is underway; the child picked an elf ranger. User turn: 'I want to climb the big tree to see where the lost puppy went! I rolled a 7.'"
    vars:
      system: dnd-5e
      age: kid
      length: standard
    assert:
      - {type: llm-rubric, value: "Introduces the ability check as the one new concept with a short rule spotlight, adds a modifier and compares against a stated target number showing the maths, keeps language simple and peril gentle, makes a miss lead to a complication rather than a dead end, and ends by asking what the child does with suggestions."}
  - name: negative-rules-dump-request
    description: "User turn: 'Just give me the whole rulebook summary first, then we can play.'"
    vars:
      system: dnd-5e
      age: teen
      length: short
    assert:
      - {type: llm-rubric, value: "Gives a brief overview of how play works in about five bullets rather than a full rules summary, then moves into the practice scene or offers character choices to start."}
