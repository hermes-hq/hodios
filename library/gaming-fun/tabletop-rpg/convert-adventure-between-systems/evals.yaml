schema: 1
baseline: "Convert this from {{from_system}} to {{to_system}}: {{content}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-5e-to-pf2e-boss
    vars:
      content: "Boss fight for 4 level-6 characters: a hag (CR 5) with two ghoul minions in a flooded crypt. The hag can cast fog cloud, has a recharge 5-6 Horrific Visage that frightens, and drops a +1 cloak of protection."
      from_system: dnd-5e 2014
      to_system: pathfinder-2e
    assert:
      - {type: contains, value: "## Balance check"}
      - {type: llm-rubric, value: "Explains relevant differences (three-action economy, level-based proficiency, degrees of success, item levels), states each creature's role, builds or references Pathfinder 2e creatures appropriate to a level-6 party, converts frightened and the recharge ability into native mechanics, converts the cloak by item level, and shows an XP budget calculation."}
  - name: edge-osr-to-5e-trap
    vars:
      content: "Room 7: poison needle trap in the chest lock, save vs. poison or die. Treasure: 400 gp, a potion of healing. Party: 5 characters, level 3."
      from_system: old-school-essentials
      to_system: dnd-5e 2024
    assert:
      - {type: llm-rubric, value: "Converts save-or-die into a 5e-appropriate saving throw DC and damage or condition for level 3 rather than instant death, notes the change in lethality as a judgment call, and adjusts treasure to 5e expectations."}
  - name: negative-no-mechanics
    vars:
      content: "The party meets a scary dragon."
      from_system: dnd-5e
      to_system: savage-worlds
    assert:
      - {type: llm-rubric, value: "Asks for the missing mechanical information (which dragon or its stats, party size and level, intended difficulty) or clearly states the assumptions it must make, instead of presenting an invented conversion as faithful."}
