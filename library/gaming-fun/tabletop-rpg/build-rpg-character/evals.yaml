schema: 1
baseline: "Make me a {{system}} character: {{concept}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-5e-level-3
    vars:
      concept: "A cowardly wizard who became a hero by accident. I like talking my way out of things more than fighting."
      system: "dnd-5e 2024 rules, standard array"
      level: 3
    assert:
      - {type: contains, value: "## Hooks for the GM"}
      - {type: llm-rubric, value: "Builds a level 3 wizard under the 2024 rules using the standard array (15, 14, 13, 12, 10, 8), chooses a subclass and background that support the concept, shows hit points, armour class and spell save DC with arithmetic, gives a flaw that creates choices, a short backstory with gaps, several named hooks for the GM, and a check list for table rules. Does not mix 2014-only rules into the 2024 build without saying so."}
  - name: edge-narrative-system
    vars:
      concept: "A disgraced noble who runs a gambling den and owes everyone money."
      system: "blades-in-the-dark"
    assert:
      - {type: llm-rubric, value: "Uses Blades in the Dark's own structure (a playbook such as Slide or Spider, action ratings, vice, heritage and background, friends and rivals) rather than D&D-style levels and ability scores, ignores or explains the level argument, and gives hooks tied to debts and rivals."}
  - name: negative-unknown-system
    vars:
      concept: "A starship mechanic who talks to machines."
      system: "my friend's homebrew system called Rust & Stars"
    assert:
      - {type: llm-rubric, value: "Says it does not know the homebrew system's rules, does not invent mechanics as if they were official, gives the concept, personality, backstory and hooks, and describes the build in general terms for the player to finish with the rules."}
