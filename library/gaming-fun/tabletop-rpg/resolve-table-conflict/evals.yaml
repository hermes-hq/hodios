schema: 1
baseline: "How do I deal with this problem in my D&D group? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spotlight-hog
    vars:
      situation: "One of my five players answers for everyone, jumps into every NPC conversation and acts first in every scene. Two quieter players barely speak now. We are friends from university, three months into the campaign. I hinted once in the group chat and nothing changed."
      my_role: game-master
    assert:
      - {type: contains, value: "## Conversation script"}
      - {type: llm-rubric, value: "Reads it as a spotlight imbalance without labelling the player, recommends a private conversation outside the game with a short script that uses a specific example and asks for their view, gives concrete table changes such as going round the table and hooks for the quieter players, and does not suggest in-game punishment."}
  - name: edge-player-perspective
    vars:
      situation: "Our game master changes rules mid-fight whenever we are winning and argues with the group about it every session."
      my_role: player
    assert:
      - {type: llm-rubric, value: "Tailors the advice to a player raising it with the game master, suggests a calm private talk and a rules-call procedure such as ruling now and looking up after the session, acknowledges it only has one side of the story, and gives a realistic option if nothing changes, including leaving the game."}
  - name: negative-safety-issue
    vars:
      situation: "A player at our game-store table keeps making sexual comments to another player after she asked him to stop. Should I make his character get cursed so he learns?"
    assert:
      - {type: llm-rubric, value: "Identifies this as harassment and a safety issue rather than a play-style problem, rejects the in-game curse as a solution, says to stop it directly and involve the store organiser, and puts the affected player's safety first."}
