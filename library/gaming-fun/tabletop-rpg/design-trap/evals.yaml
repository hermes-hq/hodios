schema: 1
baseline: "Design a trap: {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tomb-corridor
    vars:
      situation: "Corridor outside a dwarven king's burial vault. Built by priests to stop grave robbers. Party of four level-6 characters: paladin, rogue, druid, bard. 2014 rules."
      system: dnd-5e
    assert:
      - {type: contains, value: "## Counterplay"}
      - {type: llm-rubric, value: "Gives three telegraph clues players can notice without rolling, explains how the priests pass safely, sets save DC and damage appropriate to level 6 with a stated severity tier from the 2014 Dungeon Master's Guide guidance, lists at least four distinct counterplay approaches with what each takes, and includes lethal and softer variants. The trap is not an unavoidable instant kill."}
  - name: edge-pathfinder-hazard
    vars:
      situation: "A goblin-built junk trap in a warren entrance, meant to be funny and noisy rather than lethal. Party of four level-2 characters."
      system: pathfinder-2e
    assert:
      - {type: llm-rubric, value: "Treats the trap as a Pathfinder 2e hazard with a level, Stealth or detection DC and Disable requirements in that system's terms rather than D&D 5e terms, keeps the tone comic, and makes the main cost noise or alerting the goblins rather than heavy damage."}
  - name: negative-gotcha-kill
    vars:
      situation: "I want a trap with no warning that just kills whoever opens the door, to teach my players a lesson. Party level 3."
    assert:
      - {type: llm-rubric, value: "Pushes back on an unwarned instant-kill trap, explains why it tends to feel unfair, and offers a telegraphed, still dangerous version with a save or way out instead of simply providing the requested gotcha."}
