schema: 1
baseline: "Help me run a session zero. {{group_and_game}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-online-strangers
    vars:
      group_and_game: "Curse of Strahd-style gothic horror campaign in D&D 5e, online on Discord. Five players found through a forum, mixed experience, two have never played. Sessions every Tuesday, 3 hours. I'm worried about horror content and people dropping out."
    assert:
      - {type: contains, value: "## Safety tools"}
      - {type: llm-rubric, value: "Gives a timed agenda for about three hours with a break, includes an icebreaker for strangers, explains lines and veils plus an online-friendly pause signal, covers attendance and minimum player count, plans character ties, and ends with a shareable summary with blanks."}
  - name: edge-family-table
    vars:
      group_and_game: "Kids on Brooms with my two kids (9 and 12) and their two cousins, at the kitchen table, about 2 hours."
    assert:
      - {type: llm-rubric, value: "Shortens the agenda to about two hours, keeps content and safety tools age-appropriate and simple, adds a note about telling the cousins' parents what the game involves, and keeps the house rules short and kid-friendly."}
  - name: negative-missing-game
    vars:
      group_and_game: "My friends want to play something."
    assert:
      - {type: llm-rubric, value: "Asks which game and how many players before planning, instead of producing a full session zero plan on assumptions."}
