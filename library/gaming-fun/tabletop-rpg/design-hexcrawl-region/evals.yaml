schema: 1
baseline: "Design a hexcrawl map for my campaign: {{region}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-drowned-marsh
    vars:
      region: "A cursed marsh where a drowned kingdom sank a century ago. Frog-folk villages, a smuggler gang and a cult. Party level 2 to 5. The players should eventually find the sunken capital."
      size: small
      system: dnd-5e
    assert:
      - {type: contains, value: "## Hex key"}
      - {type: llm-rubric, value: "States the hex scale, gives a map layout with coordinates, keys a portion of hexes with seen, searched and secret layers tied to the factions and the sunken kingdom, marks landmarks visible from adjacent hexes, gives a travel procedure with navigation and encounter checks, a rolled encounter table with reasons, and eight rumours pointing to keyed hexes with some false."}
  - name: edge-large-region
    vars:
      region: "A frontier of pine forests and mountains claimed by two rival baronies, level 1 start, old-school play style."
      size: large
      system: "an old-school system"
    assert:
      - {type: llm-rubric, value: "Keeps the keyed hexes at or under 20 despite the large size and gives a method for stocking the rest, keeps stats system-light or in old-school terms, and uses the two baronies to drive content."}
  - name: negative-no-context
    vars:
      region: "some wilderness"
    assert:
      - {type: llm-rubric, value: "Asks for the kind of land and the party level, or what the campaign needs from the region, before keying hexes, rather than inventing a full region with no basis."}
