schema: 1
baseline: "Write a pitch for my campaign: {{premise}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-heist-crew
    vars:
      premise: "A crew of thieves in a flooded industrial city run by rival gangs and a corrupt canal authority. Gritty, morally grey, about ambition and loyalty. I want players scheming, not fighting fair."
      system: Blades in the Dark
      schedule: "Every other Wednesday, 7-10pm, online with voice chat"
    assert:
      - {type: contains, value: "## Content and safety"}
      - {type: llm-rubric, value: "Writes a one-page pitch with title, logline, second-person hook, a described balance of scheming, heists and consequences, two or three touchstones, specific content notes with lines and veils deferred to session zero, commitment from the schedule, characters who fit as a crew, no invented Blades mechanics, and a GM notes section listing assumptions."}
  - name: edge-school-club
    vars:
      premise: "Young heroes at a magic academy solving a mystery about vanishing pets."
      system: dnd-5e
      schedule: "School club, Wednesdays at lunch, 45 minutes"
    assert:
      - {type: llm-rubric, value: "Keeps content age-appropriate for students and adds a line for parents, plans for very short sessions and absences, describes beginner-friendly characters, and keeps the mystery's solution secret."}
  - name: negative-too-thin
    vars:
      premise: "zombies"
      system: dnd-5e
      schedule: weekly
    assert:
      - {type: llm-rubric, value: "Asks for setting, what the characters do and the tone before writing, or produces only a skeleton with clearly marked placeholders and asks those questions, rather than inventing a full campaign."}
