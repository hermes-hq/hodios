schema: 1
baseline: "Write a mystery adventure for my tabletop group: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-poisoned-guildmaster
    vars:
      premise: "The head of the merchants' guild is found poisoned the night before a vote on a new trade route. Fantasy port city, level 3 party of four. One session."
      system: dnd-5e
    assert:
      - {type: contains, value: "## Clue map"}
      - {type: llm-rubric, value: "Lists the hidden truth and three to six revelations, gives nodes that point to multiple other nodes, and in the clue map provides at least three clues for every revelation across different nodes with core clues not gated behind rolls. Includes suspects with secrets, proactive events that deliver new leads, and a finale that handles a wrong accusation."}
  - name: edge-cthulhu-multi-session
    vars:
      premise: "A professor vanished from a 1920s university; his notes mention a coastal town. Investigative horror."
      system: call-of-cthulhu-7e
      length: "three sessions"
    assert:
      - {type: llm-rubric, value: "Scales the node count to three sessions, uses Call of Cthulhu conventions (skill rolls such as Library Use, sanity pressure) while still not gating core clues behind single failed rolls, and keeps a horror tone."}
  - name: negative-linear-request
    vars:
      premise: "I want a mystery where the players must find one hidden key clue behind a hard check, or the adventure ends. Level 5 party."
    assert:
      - {type: llm-rubric, value: "Explains why a single gated clue risks a dead end and offers redundant clues or a failure-forward alternative, rather than designing a scenario that stops if one roll fails."}
