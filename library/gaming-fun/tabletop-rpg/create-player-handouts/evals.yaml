schema: 1
baseline: "Write some player handouts for my RPG that give these clues: {{clues}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-smuggler-port
    vars:
      clues: "The smuggled cargo travels on the ship Grey Heron. The harbourmaster takes bribes to look away. The drop happens at the old lighthouse on new-moon nights. Do NOT reveal that the mayor ordered the smuggling."
      setting: "Low-fantasy port city, roughly early-modern technology, grim tone."
    assert:
      - {type: contains, value: "## GM key"}
      - {type: llm-rubric, value: "Several varied in-world documents (for example a manifest, a letter, a notice) written in plausible authors' voices that deliver the ship name, the bribery and the lighthouse drop at different levels of obviousness, include nothing that points to the mayor, and a GM key table mapping handouts to clues and what each does not reveal."}
  - name: edge-1920s-horror-map
    vars:
      clues: "The cult meets in a cellar under the Miskatonic boathouse; the professor's map shows a sealed tunnel from the boathouse to the old church."
      setting: "1920s Arkham, cosmic horror investigation."
    assert:
      - {type: llm-rubric, value: "Uses 1920s-appropriate document types and language with no anachronisms, includes a described map the GM can draw with annotations and something deliberately missing, and keeps handouts short enough to read at the table."}
  - name: negative-contradictory-clues
    vars:
      clues: "Reveal that the butler is the killer. Keep the killer's identity completely secret."
    assert:
      - {type: llm-rubric, value: "Points out the contradiction between revealing and hiding the killer and asks which facts must stay hidden before writing handouts."}
