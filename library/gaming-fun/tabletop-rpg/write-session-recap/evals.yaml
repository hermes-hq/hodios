schema: 1
baseline: "Write a recap of my D&D session from these notes: {{session_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bard-tale
    vars:
      session_notes: "Campaign: Ashes of Veldt. PCs: Kael (rogue), Mira (cleric), Grunt (barbarian). Snuck into the duke's manor during the masquerade. Kael pickpocketed the signet ring. Grunt fell into the fountain, everyone laughed. Mira healed the poisoned servant who told them about the vault. Fight with the masked guards, Mira nearly died. Ended at the vault door, which hums. SECRET: the duke's steward is the cult leader."
    assert:
      - {type: contains, value: "GM only"}
      - {type: not-icontains, value: "cult leader"}
      - {type: llm-rubric, value: "The player-facing part is an in-world bard's tale of 150 to 300 words that gives Kael, Mira and Grunt each a moment (including the fountain mishap) and ends at the humming vault door, followed by out-of-character catch-up bullets. A separate GM-only part after a rule holds loose threads, hooks and a check that refers to the secret line by its position without restating that the steward leads the cult."}
  - name: edge-different-tone
    vars:
      session_notes: "Cyberpunk one. Crew: Zero, Patch, Vex. Heist on the Arasaka-style corp clinic failed, alarm went off, Patch got shot, they escaped by hijacking an ambulance drone. Lost the data shard. Fixer is angry."
      tone: "a breaking news report"
    assert:
      - {type: llm-rubric, value: "Writes the recap as a breaking news report in a cyberpunk voice, keeps events as in the notes (failed heist, Patch shot, ambulance drone escape, shard lost, angry fixer) without inventing new outcomes, and offers hooks such as dealing with the fixer."}
  - name: negative-sparse-notes
    vars:
      session_notes: "fought stuff, found a key"
    assert:
      - {type: llm-rubric, value: "Writes only a short recap without inventing specific enemies, locations or outcomes beyond the notes, and asks a few questions (who fought what, where the key was found, where the session ended) to fill the gaps."}
