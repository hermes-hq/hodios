schema: 1
baseline: "Write read-aloud descriptions for these RPG scenes: {{scenes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-scenes
    vars:
      scenes: |
        1. A flooded crypt under a chapel. Exits: stairs up, a narrow tunnel east. Hidden: a pressure-plate trap under the water near the altar.
        2. Entrance of Lady Corvina, a vampire noble pretending to be a grieving widow, at a funeral.
        3. Event: the ground shakes and the chapel bell rings by itself.
      tone: gothic dread
    assert:
      - {type: llm-rubric, value: "Each read-aloud is roughly 40 to 90 words, uses senses beyond sight, includes the exits, never tells the characters what they feel or do, does not reveal the trap or that Corvina is a vampire in the boxed text, ends on something actionable, and puts the secrets in GM notes."}
  - name: edge-no-tone
    vars:
      scenes: "A bustling gnome workshop full of clockwork toys. Exit: a round door. The owner, Fizzwick, is asleep under a bench."
    assert:
      - {type: llm-rubric, value: "States the inferred tone in one line, writes a lively read-aloud within the word range, includes the round door and the sleeping owner, and gives a pronunciation or keeps the invented name easy to read."}
  - name: negative-too-vague
    vars:
      scenes: "the next room"
    assert:
      - {type: llm-rubric, value: "Asks what the room is, who or what is there and its exits instead of inventing the key facts of the scene."}
