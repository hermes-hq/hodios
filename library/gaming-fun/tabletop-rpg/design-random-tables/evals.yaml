schema: 1
baseline: "Make a {{die}} random table for {{purpose}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-marsh-encounters-2d6
    vars:
      purpose: "Encounters while travelling through a haunted marsh, rolled every four hours of travel, party of 4 at level 4."
      setting: "The Drowned Barony: the baron's hunters, a bog-witch coven and the restless dead of a sunken abbey."
      die: 2d6
    assert:
      - {type: contains, value: "## Probability check"}
      - {type: llm-rubric, value: "A 2d6 table whose common results sit at 6-8 and rare dramatic ones at 2 and 12, every result actionable and tied to the hunters, coven or abbey, encounter numbers suited to level 4, and a probability list that covers 2-12 exactly once."}
  - name: edge-rumours-d6
    vars:
      purpose: "Rumours heard in a tavern in a port city at war."
      die: d6
    assert:
      - {type: llm-rubric, value: "Six distinct rumours, each marked true, partly true or false in a GM column, each giving a lead to follow, with ranges that cover 1-6 once."}
  - name: negative-unclear-purpose
    vars:
      purpose: "my campaign"
    assert:
      - {type: llm-rubric, value: "Asks what kind of results the table should produce (encounters, loot, rumours, names, events) before writing a table."}
