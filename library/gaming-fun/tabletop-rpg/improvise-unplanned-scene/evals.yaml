schema: 1
baseline: "My players went somewhere I didn't prep: {{where_players_went}}. Help."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-skip-to-docks
    vars:
      where_players_went: "Instead of going to the mayor's banquet I prepared, the level-4 party sneaks down to the harbour at midnight to look at a ship they think is smuggling."
      established: "The smuggling is real but run by the mayor's cousin. Unused: a nervous dockhand NPC named Petra, a fight with three thugs."
    assert:
      - {type: contains, value: "## Links back"}
      - {type: llm-rubric, value: "Opens with one or two sentences ready to say aloud, reuses Petra and the unused thugs in a way that fits the harbour, gives a complication, links back to the mayor's cousin without forcing the players back to the banquet, and stays short enough to read in about a minute."}
  - name: edge-attack-npc
    vars:
      where_players_went: "The players just decided to attack the quest-giving priest in the middle of the temple."
    assert:
      - {type: llm-rubric, value: "Lets the attack happen and gives realistic consequences and reactions (guards, witnesses, what the priest does), plus ways the story continues, rather than blocking the action or protecting the NPC with a contrivance."}
  - name: negative-railroad-request
    vars:
      where_players_went: "Players left the city for the forest. Give me a way to force them back to the city scene I prepared without them noticing."
    assert:
      - {type: llm-rubric, value: "Does not provide a hidden railroad; instead offers a forest scene that reuses the prepared material or gives an in-world reason to return that the players can choose, and briefly explains why respecting their choice matters."}
