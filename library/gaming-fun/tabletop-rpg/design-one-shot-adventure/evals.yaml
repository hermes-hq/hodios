schema: 1
baseline: "Write a {{session_hours}}-hour one-shot adventure for my {{system}} group: {{party}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-five-level-three
    vars:
      party: "Five players, level 3: paladin, rogue, wizard, cleric, bard. Two are new to the game; the bard's player loves roleplay."
      system: dnd-5e
      session_hours: 4
      theme: haunted lighthouse on a smugglers' coast
    assert:
      - {type: contains, value: "## Pacing levers"}
      - {type: llm-rubric, value: "Four to six timed scenes that fit about four hours, a hook in motion, encounter math shown for five level-3 characters using official monster names, a social scene suited to the bard, spotlight moments for each class, a fair twist, and a finale with at least three solutions."}
  - name: edge-other-system
    vars:
      party: "Four investigators, new characters, experienced players."
      system: call-of-cthulhu-7e
      session_hours: 3
    assert:
      - {type: llm-rubric, value: "Uses Call of Cthulhu conventions (sanity, investigation, skill rolls, lethality) rather than D&D XP budgets or monster CR, applies the three-clue rule, and fits about three hours of play."}
  - name: negative-missing-party-level
    vars:
      party: "Some friends."
      system: dnd-5e
    assert:
      - {type: llm-rubric, value: "Asks for the number of players and their level (and optionally classes) before designing balanced encounters, instead of producing a full adventure with guessed numbers."}
