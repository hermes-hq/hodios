schema: 1
baseline: "Plan the loot for my campaign: {{campaign}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dnd-tier-two
    vars:
      campaign: "Party of four going from level 5 to 10 over about 20 sessions: barbarian who wants to hit harder, warlock obsessed with her patron, ranger with an animal companion, cleric who wants a holy relic. Medium magic, heroic tone, 2014 rules. They currently have a +1 longsword and a bag of holding."
      system: dnd-5e
    assert:
      - {type: contains, value: "## Gold sinks"}
      - {type: llm-rubric, value: "States assumptions, gives a coin and magic item budget for levels 5 to 10 tied to the Dungeon Master's Guide guidance with the source named, plans items per character that match the barbarian, warlock patron, ranger companion and cleric relic, places each reward in play, adds non-monetary rewards and gold sinks, and keeps rewards fair across the party."}
  - name: edge-pathfinder-math
    vars:
      campaign: "Pathfinder 2e party of four from level 3 to 6, standard magic."
      system: pathfinder-2e
    assert:
      - {type: llm-rubric, value: "Uses Pathfinder 2e treasure-by-level guidance and makes sure weapon potency, striking and armour potency runes arrive near the levels the system's math expects, or mentions automatic bonus progression as an alternative."}
  - name: negative-overpowered-wish
    vars:
      campaign: "Level 3 party, I want to give the rogue a legendary vorpal sword now because he asked nicely. 2014 rules."
    assert:
      - {type: llm-rubric, value: "Flags that a legendary item at level 3 breaks balance and spotlight fairness, and offers alternatives such as a lesser item that grows over time or a quest for the sword, rather than simply planning it as requested."}
