schema: 1
baseline: "Help me prepare a social encounter: {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pirate-negotiation
    vars:
      situation: "The level-6 party must convince a pirate queen and her suspicious quartermaster to stop raiding the coast for a season. The party has a stolen map she wants. One player is shy and rarely speaks in character."
      system: dnd-5e
    assert:
      - {type: contains, value: "## Attitude track"}
      - {type: llm-rubric, value: "Gives both NPCs interests, fears and leverage, uses the map as leverage on both sides, sets starting attitudes with thresholds, a table of approaches with checks and backfires, a way for the shy player to contribute by stating an approach and rolling, at least three exchanges before an outcome, and success, partial, failure and disaster outcomes."}
  - name: edge-pathfinder-influence
    vars:
      situation: "A city council of five members votes on whether to grant the party a mining charter. Level 4 party."
      system: pathfinder-2e
    assert:
      - {type: llm-rubric, value: "Uses Pathfinder 2e's influence approach (influence points, discover checks, thresholds per council member) or an equivalent clearly tied to that system, and gives each council member distinct interests so the party must build a majority."}
  - name: negative-one-roll
    vars:
      situation: "I just want the king to agree if they roll a 20 on Persuasion, otherwise he says no and they fail."
    assert:
      - {type: llm-rubric, value: "Explains the problem with a single-roll yes or no and offers a short multi-step version with interests and partial outcomes, rather than simply restating the one-roll design."}
