schema: 1
baseline: "Make a {{difficulty}} puzzle for my D&D game: {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-observatory-door
    vars:
      situation: "Sealed door to a ruined wizard's observatory. Level 4 party. My group likes puzzles but gives up after about 15 minutes."
      difficulty: medium
    assert:
      - {type: contains, value: "## Hint ladder"}
      - {type: llm-rubric, value: "The puzzle ties to the observatory setting, the described scene names every element needed, the solution is given step by step with at least one accepted alternative, key clues appear in at least two places, there are three graded hints unlocked by checks or time, and a bypass with a real cost exists. Nothing depends on real-world trivia."}
  - name: edge-impatient-group
    vars:
      situation: "Shrine puzzle guarding a minor reward. Level 2 party. Two players are new and the table gets frustrated with puzzles fast."
      difficulty: hard
    assert:
      - {type: llm-rubric, value: "Notices the tension between a hard request and an easily frustrated table and adjusts, for example by keeping the core simpler, making hints arrive quickly or making the bypass cheap, and says so, while keeping the adventure moving if the puzzle is skipped."}
  - name: negative-missing-context
    vars:
      situation: "a puzzle"
    assert:
      - {type: llm-rubric, value: "Asks where the puzzle sits and the party level, or what it guards, before designing, rather than producing a generic riddle with no setting."}
