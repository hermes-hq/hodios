schema: 1
baseline: "Design a dungeon for my {{system}} group ({{party_level}}). Theme: {{theme}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fungus-cult-mint
    vars:
      theme: "A drowned dwarven mint taken over by a fungus cult; medium size. The players want the mint's master die to stop counterfeiting."
      party_level: "4 characters, level 5"
      system: dnd-5e
    assert:
      - {type: contains, value: "## Secrets and clues"}
      - {type: llm-rubric, value: "A 10-15 room site whose map lists connections with at least two loops, two entrances, a secret path and a vertical link; at least two factions with goals; terse room keys that lead with first impressions; one encounter solvable without combat; encounter math shown for four level-5 characters with official monster names; each major secret has three clues in different rooms."}
  - name: edge-old-school-system
    vars:
      theme: "A small barrow mound, 6-8 rooms, where a dead chieftain's honour guard still keeps watch."
      party_level: "5 characters, level 2"
      system: old-school-essentials
    assert:
      - {type: llm-rubric, value: "Fits 6-8 rooms, uses old-school conventions (reaction rolls, wandering monster checks on a turn schedule, treasure as a main reward) rather than D&D 5e encounter budgets, still includes a loop or alternative route and telegraphed traps."}
  - name: negative-theme-too-thin
    vars:
      theme: "a dungeon"
    assert:
      - {type: llm-rubric, value: "Asks a few focused questions about what the place is, who built it or what the players want there before designing, rather than producing a generic full dungeon."}
