schema: 1
baseline: "Create a villain for my campaign: {{concept}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-plague-saint
    vars:
      concept: "A beloved healer secretly spreading a plague to force the city to depend on her order. Dark fantasy, 20-session campaign."
      party: "A disgraced city watch captain, an orphan raised by the healer's order, a foreign alchemist, a gravedigger's daughter."
    assert:
      - {type: contains, value: "## Reactions to the party"}
      - {type: llm-rubric, value: "Gives an understandable goal with a line she would not cross, a staged plan with visible signs on a timeline, lieutenants with their own motives, a table of how she reacts to player wins, early non-combat appearances tied to the given backstories such as the orphan, and several ways to win the endgame beyond a fight."}
  - name: edge-no-party
    vars:
      concept: "A pirate admiral who wants to become a god."
    assert:
      - {type: llm-rubric, value: "Works without party details by giving generic hooks and saying how to tie them to characters later, and still gives a plan timeline, reactions table and multiple endgame paths."}
  - name: negative-unbeatable
    vars:
      concept: "An invincible lich who always wins and can never be killed, so my players feel helpless all campaign."
    assert:
      - {type: llm-rubric, value: "Pushes back on an unbeatable villain and on keeping players helpless all campaign, and offers a version that is overwhelming early but has discoverable weaknesses and paths to victory."}
