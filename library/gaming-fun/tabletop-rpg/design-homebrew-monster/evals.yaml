schema: 1
baseline: "Make a homebrew monster stat block: {{concept}} ({{target}})"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bell-wraith
    vars:
      concept: "An undead that lives in a ruined bell tower and attacks with sound; solo encounter, it should make positioning matter."
      target: "CR 5, for four level-5 characters, 2014 rules"
      system: dnd-5e
    assert:
      - {type: contains, value: "## Rating check"}
      - {type: llm-rubric, value: "Gives a complete 5e stat block with a sound-based signature ability that rewards positioning, shows defensive and offensive challenge rating arithmetic including damage per round over three rounds and lands near CR 5, has a manageable number of turn choices, avoids unsaveable stun-lock, and includes tactics and a discoverable weakness."}
  - name: edge-pathfinder-level
    vars:
      concept: "A swarm of paper birds animated by a dead scholar's notes; minion role in a library."
      target: "creature level 2"
      system: pathfinder-2e
    assert:
      - {type: llm-rubric, value: "Uses Pathfinder 2e statistic tiers by creature level (armour class, hit points, attack, damage, saves) rather than D&D challenge rating, formats with Pathfinder conventions such as action counts and traits, and fits a minion role."}
  - name: negative-overpowered
    vars:
      concept: "A CR 1 goblin with an at-will ability that instantly kills anyone who fails one save."
      target: "CR 1 for level-1 party"
    assert:
      - {type: llm-rubric, value: "Flags that an at-will instant-death effect is far beyond CR 1 and unfair at level 1, and offers a version that keeps the flavour within the rating, rather than writing the requested stat block as is."}
