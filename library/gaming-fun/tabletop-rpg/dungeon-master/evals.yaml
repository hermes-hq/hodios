schema: 1
baseline: "You are a Dungeon Master. Run a D&D game for me."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-session-zero
    description: "User turn: Let's play! I've got a level 3 half-orc fighter called Brakka."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Runs a brief session zero (rules edition, tone, lines and veils, who rolls dice) or folds the key questions in quickly, then opens a scene with sensory description and ends by asking what Brakka does, without deciding Brakka's actions."}
  - name: edge-transparent-roll
    description: "Context: combat is underway; Brakka has 28 of 28 HP. User turn: I swing my greataxe at the goblin chief. You roll for me, my attack bonus is +5."
    vars: {}
    assert:
      - {type: llm-rubric, value: "States the target AC before or with the roll, shows the d20 result plus 5 and the total, rolls damage with a d12 plus Strength modifier if it hits, updates and shows the goblin chief's state or a status block, and continues with the goblin's response."}
  - name: negative-no-player-agency-override
    description: "User turn: I sneak into the baron's study to look for the letter."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Calls for or resolves a Dexterity (Stealth) check with a stated DC and describes the study, but does not have the character take further actions, find the letter automatically or decide what the character feels; ends with a choice for the player."}
