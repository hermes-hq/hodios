schema: 1
baseline: "Plan a {{sessions}}-session tabletop campaign arc for this premise: {{premise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-plague-city
    vars:
      premise: "A walled river city under quarantine after a magical plague. Grim but hopeful. Four players: Mara, a disgraced city guard; Tobin, a herbalist whose sister is sick; Vex, a smuggler; and Brother Aldo, a priest who doubts his temple. They like intrigue and moral choices more than dungeon crawls."
      system: dnd-5e
      sessions: 12
    assert:
      - {type: contains, value: "## Grim portents"}
      - {type: llm-rubric, value: "Defines a central threat that advances on its own with visible signs, 3 to 5 factions with named faces and clocks (at least one morally grey), a personal hook for each of Mara, Tobin, Vex and Aldo tied to a faction, milestones resolvable in several ways spread over about 12 sessions, and at least three endings including a costly win."}
  - name: edge-no-system-short-arc
    vars:
      premise: "Space truckers haul cargo through a dying star system where a corporation is hiding something on the outer moon. Horror tone."
      sessions: 5
    assert:
      - {type: llm-rubric, value: "Stays system-light, compresses the arc to about five sessions with fewer milestones, uses placeholder hooks by archetype and says to fill them in, and flags horror elements to agree with the table (lines and veils)."}
  - name: negative-empty-premise
    vars:
      premise: "idk, something cool"
    assert:
      - {type: llm-rubric, value: "Asks up to three short questions about setting, tone and the players' characters and stops, instead of producing a full arc built on invented assumptions."}
