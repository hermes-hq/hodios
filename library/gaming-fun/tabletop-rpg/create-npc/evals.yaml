schema: 1
baseline: "Create an NPC: {{role_in_story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-innkeeper
    vars:
      role_in_story: "Innkeeper in a fog-bound smuggling port who knows something about the ship that vanished last week. Party is level 3."
    assert:
      - {type: contains, value: "## Reactions to the party"}
      - {type: llm-rubric, value: "Gives a named innkeeper with a concrete current want and a secret tied to the missing ship, performable voice and mannerism with three sample lines, what they share freely, for a price and lie about, a reactions table, a light D&D 5e stats sketch for a non-combatant or a commoner-type block with the edition assumption stated, and return hooks. Sections are short and table-ready."}
  - name: edge-other-system
    vars:
      role_in_story: "A university librarian who has been reading the forbidden book and is starting to change."
      system: "call-of-cthulhu-7e"
    assert:
      - {type: llm-rubric, value: "Fits Call of Cthulhu's investigative horror tone, gives characteristics and skills in that system's style (percentages such as Library Use) rather than D&D stats, and uses the secret and reactions to drive investigation."}
  - name: negative-missing-role
    vars:
      role_in_story: "an NPC"
    assert:
      - {type: llm-rubric, value: "Asks what the NPC is for (role in the story, setting, party level) before writing, or gives a short placeholder clearly labelled as needing that information, rather than a full invented NPC presented as fitting the campaign."}
