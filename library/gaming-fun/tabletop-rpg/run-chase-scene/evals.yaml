schema: 1
baseline: "Help me run a chase scene: {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rooftop-thief
    vars:
      situation: "A thief snatched the duke's signet ring and flees over the rooftops into the night market. Party of four level-3 characters including a heavily armoured dwarf paladin. If she escapes, the ring reaches the guild."
      system: dnd-5e
    assert:
      - {type: contains, value: "## Complications"}
      - {type: llm-rubric, value: "Gives a short abstract distance track through rooftops and market zones, a turn procedure with several action options and 5e checks, something useful for the slow armoured paladin, a complications table tied to zones with avoid and cost, a round limit, and end conditions for capture and escape with a twist."}
  - name: edge-party-fleeing
    vars:
      situation: "The party is running from a collapsing mine with a giant centipede behind them. Level 2, rules-light game."
      system: rules-light
    assert:
      - {type: llm-rubric, value: "Handles the party as the quarry rather than the pursuer, uses simple rules-light checks instead of D&D specifics, and makes being caught lead to a tense fight or cost rather than instant death."}
  - name: negative-missing-stakes
    vars:
      situation: "a chase"
    assert:
      - {type: llm-rubric, value: "Asks who is chasing whom, where and what is at stake before building, rather than inventing a full chase with no context."}
