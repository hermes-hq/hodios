schema: 1
baseline: "Help me level up my character to level {{new_level}}: {{character}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ranger-to-five
    vars:
      character: "Level 4 wood elf ranger (2014 rules, Gloom Stalker), Dex 18, Wis 14, longbow, Sharpshooter not taken yet, spells: hunter's mark, goodberry. Core books plus Xanathar's allowed."
      new_level: "5"
      goals: "I like big damage from range but I keep losing concentration on hunter's mark."
      system: dnd-5e
    assert:
      - {type: contains, value: "## Sheet updates"}
      - {type: llm-rubric, value: "Lists the level-5 gains for a 2014 ranger including Extra Attack and second-level spells, compares realistic spell options with the concentration problem in mind, uses simple damage maths, gives a sheet update checklist including hit points and spell slots, and keeps to 2014 rules and the allowed sources."}
  - name: edge-range-planning
    vars:
      character: "Level 1 Pathfinder 2e cleric of a healing deity, Wisdom 18, cloistered."
      new_level: "1 to 4"
      system: pathfinder-2e
    assert:
      - {type: llm-rubric, value: "Plans levels 2 to 4 level by level using Pathfinder 2e structure (class feats at levels 2 and 4, skill feats at even levels, a general feat and a skill increase at level 3) rather than D&D terms such as an ability score improvement at level 4, places no ancestry feat or ability boosts before level 5, notes new spell ranks and slots as the cleric gains them, and lists sheet updates."}
  - name: negative-missing-version
    vars:
      character: "My wizard is level 3, what should I pick?"
      new_level: "4"
    assert:
      - {type: llm-rubric, value: "Asks for the rules version, ability scores or current spells and allowed sources before recommending, or states clearly labelled assumptions, rather than presenting confident picks for an unknown sheet."}
