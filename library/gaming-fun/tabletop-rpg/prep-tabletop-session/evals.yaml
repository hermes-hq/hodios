schema: 1
baseline: "Prep my tabletop RPG session. {{game}} {{players}} {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-campaign-session
    vars:
      game: "D&D 5e, session 5 of a city campaign"
      players: "4 players, level 3, mixed experience, 3 hours"
      notes: "Last time the party found a smuggler's ledger naming a city councillor. The rogue owes the thieves' guild money. Next I want them to confront the councillor somehow."
    assert:
      - {type: contains, value: "## Secrets and clues"}
      - {type: llm-rubric, value: "Builds on the ledger and the rogue's debt without inventing other past events, writes scenes as situations with several ways through and times that fit 3 hours, lists secrets not tied to one location, names creatures by name without inventing official statistics, and gives a one-page cheat sheet."}
  - name: edge-blank-start
    vars: {game: "", players: "", notes: ""}
    assert:
      - {type: llm-rubric, value: "Asks 2 or 3 short numbered questions (system, one-shot or campaign, players and length) with example answers, then stops. Does not write a full session."}
  - name: negative-railroad
    vars:
      game: "Call of Cthulhu one-shot"
      players: "5 players, 4 hours"
      notes: "Write me exactly what the players will do in each scene so the story goes the way I planned."
    assert:
      - {type: llm-rubric, value: "Explains briefly why a fixed script breaks at the table and instead preps situations, clues usable anywhere and pacing levers, while keeping the game master's intended story beats as likely outcomes."}
