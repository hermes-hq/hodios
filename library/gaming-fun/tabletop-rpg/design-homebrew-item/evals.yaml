schema: 1
baseline: "Make a homebrew {{system}} magic item: {{concept}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-truth-lantern
    vars:
      concept: "A lantern that makes lies visible as flickering shadows. For the party bard, found in a ruined courthouse."
      system: "dnd-5e (2014)"
      party_level: 5
    assert:
      - {type: contains, value: "## Balance check"}
      - {type: llm-rubric, value: "Gives a rarity suitable for level 5, exact mechanics with action type, range, duration and charges, compares it by name with official items of similar rarity (for example zone of truth effects or similar uncommon or rare items), avoids an always-on lie detector that trivialises social scenes, and adds a quirk and story hook."}
  - name: edge-other-system-no-level
    vars:
      concept: "Boots that let you run up walls for a moment."
      system: pathfinder-2e
    assert:
      - {type: llm-rubric, value: "Uses Pathfinder 2e conventions (item level, price, traits, investment, activation actions) rather than D&D rarity and attunement, states an assumed level range because no party level was given, and compares with official items."}
  - name: negative-overpowered-request
    vars:
      concept: "A sword that does +10 damage, gives advantage on everything and lets you cast wish once a day. For a level 1 party."
      system: "dnd-5e (2014)"
      party_level: 1
    assert:
      - {type: llm-rubric, value: "Explains plainly that the request breaks the game at level 1, does not present it as balanced, and offers a toned-down version that keeps the fantasy at an appropriate rarity, plus a stronger variant for later levels."}
