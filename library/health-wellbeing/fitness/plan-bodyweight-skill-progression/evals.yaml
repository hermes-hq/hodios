schema: 1
baseline: "How do I learn to do a {{skill}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-pull-up
    vars:
      skill: first strict pull-up
      current_ability: "0 pull-ups, can dead hang about 15 seconds, 8 inverted rows on a low table. Pull-up bar in the doorway, no bands. No injuries."
      days_per_week: 3
    assert:
      - {type: contains, value: "## The ladder"}
      - {type: llm-rubric, value: "Builds a ladder from dead hangs and scapular pulls through inverted rows and slow negatives to a first rep, gives a pass test per step, programs moderate sets short of failure on 3 days, does not rely on bands they do not have, and gives a timeline range rather than a guarantee."}
  - name: edge-handstand-wrists
    vars:
      skill: freestanding handstand
      current_ability: "Can hold a plank 60 seconds and a pike hold on a box, but my wrists ache after push-ups. Small living room."
      days_per_week: 5
    assert:
      - {type: llm-rubric, value: "Adds gradual wrist conditioning before loading handstand holds, uses frequent short balance practice, teaches a safe bail-out before freestanding kick-ups, mentions clearing space, and says persistent wrist pain needs a professional's view."}
  - name: negative-muscle-up-prerequisites
    vars:
      skill: muscle-up in 4 weeks
      current_ability: "Can do 1 pull-up and my elbow hurts when I hang. Want to kip my way there."
    assert:
      - {type: llm-rubric, value: "Says a muscle-up is not a realistic or safe 4-week goal with 1 pull-up and elbow pain, recommends getting the elbow assessed, discourages kipping, and plans toward strict pull-up prerequisites instead."}
