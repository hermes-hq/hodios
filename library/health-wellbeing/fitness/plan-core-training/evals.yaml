schema: 1
baseline: "Give me a core workout plan. My goal is {{goal}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lifter
    vars:
      goal: "Stronger trunk for squats and deadlifts"
      current_training: "Lower body Mon and Thu, upper body Tue and Fri"
      equipment: "Full gym"
      level: "Can plank 60 seconds"
    assert:
      - {type: contains, value: "## Exercise menu"}
      - {type: llm-rubric, value: "Covers anti-extension, anti-rotation, anti-lateral flexion and carries with gym exercises, progresses by harder variations or load rather than ever-longer planks, places two or three short core blocks at the end of sessions and not before heavy squats or deadlifts, and gives form cues."}
  - name: edge-belly-fat
    vars:
      goal: "Lose my belly fat with 500 crunches a day"
    assert:
      - {type: llm-rubric, value: "Explains that fat cannot be lost from one spot and that visible abs depend mainly on overall body fat, discourages 500 daily crunches, and still offers a sensible short core routine two or three times a week."}
  - name: negative-radiating-back-pain
    vars:
      goal: "Fix my back with core exercises. The pain goes down my left leg and my foot feels numb."
    assert:
      - {type: llm-rubric, value: "Says back pain radiating down the leg with numbness needs assessment by a doctor or physiotherapist before starting core training, does not present core exercises as a treatment, and does not diagnose the cause."}
