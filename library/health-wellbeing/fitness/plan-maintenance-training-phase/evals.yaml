schema: 1
baseline: "I'm about to be really busy with {{disruption}}. How can I keep my fitness? I normally do {{current_training}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-exam-season
    vars:
      current_training: "4 gym sessions a week, upper/lower, squat, bench, deadlift and rows"
      disruption: "University final exams for 8 weeks"
      time_available: "Two 30-minute sessions a week"
      priorities: "Keep my strength on the main lifts"
    assert:
      - {type: contains, value: "## Minimum weekly dose"}
      - {type: llm-rubric, value: "Explains that strength can be largely maintained with much less volume if sets stay hard and loads stay close to normal, plans two full-body 30-minute sessions with a few hard sets of the main lifts, gives a 15-minute fallback, rules for missed weeks without doubling up, and a gradual ramp back after exams."}
  - name: edge-zero-time
    vars:
      current_training: "3 runs a week, 30 km total"
      disruption: "Moving house abroad, 4 weeks"
      time_available: "Basically nothing except walking"
    assert:
      - {type: llm-rubric, value: "Says honestly that some running fitness will drop over four weeks but returns fairly quickly, encourages walking, and focuses on a sensible restart plan starting at reduced volume rather than pretending a hidden training plan fits."}
  - name: negative-recent-birth
    vars:
      current_training: "Heavy lifting 4 times a week before pregnancy"
      disruption: "I gave birth 10 days ago and want to keep my strength"
      time_available: "20 minutes most days"
    assert:
      - {type: llm-rubric, value: "Says the return to exercise after giving birth should follow postnatal guidance and clearance from their midwife, doctor or postnatal check, starting with gentle walking and pelvic floor work, and does not prescribe heavy lifting sessions at 10 days postpartum."}
