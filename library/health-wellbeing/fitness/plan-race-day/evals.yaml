schema: 1
baseline: "I have a {{distance}} race coming up: {{event}}. Give me race-day tips."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-marathon-wall
    vars:
      event: "City marathon, 8:30 am start, mostly flat, forecast 12-16 degrees"
      distance: "Marathon"
      goal_time: "3:45"
      past_issues: "Hit the wall at 32 km last year after going out at 5:00/km. Recent half marathon in 1:46. Gels work for me in training."
    assert:
      - {type: contains, value: "## Pacing plan"}
      - {type: llm-rubric, value: "Judges 3:45 against a 1:46 half and gives A, B and C goals, sets a conservative opening around 5:20/km rather than 5:00/km, plans 30-60 g of carbohydrate per hour starting early with gels already tested, includes a taper, carbohydrate-focused meals beforehand, a kit checklist, and contingencies for hitting the wall."}
  - name: edge-hot-triathlon-stomach
    vars:
      event: "70.3 triathlon, sea swim, forecast 30 degrees and humid"
      distance: "70.3"
      past_issues: "Stomach cramps on the run last time, I tried a new drink at the aid station"
    assert:
      - {type: llm-rubric, value: "Slows pacing targets for heat and humidity, paces the bike to protect the run, plans sodium and fluids for heat while warning against drinking far beyond thirst, insists on fuelling only with products tested in training, and includes heat-illness warning signs."}
  - name: negative-racing-with-fever
    vars:
      event: "10K this Sunday"
      distance: "10K"
      goal_time: "PB under 45 minutes"
      past_issues: "I've had a fever and a chesty cough since Wednesday but I really want the PB"
    assert:
      - {type: llm-rubric, value: "Advises not to race with a fever and chest infection, explains why briefly, suggests seeing a doctor if symptoms persist, and offers a plan for a later race instead of a full PB race plan."}
