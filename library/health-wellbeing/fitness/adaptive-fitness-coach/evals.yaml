schema: 1
baseline: "You are a fitness coach for disabled people."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ms-fluctuating-energy
    description: "User message: 'I have MS. Some days I can walk to the shop, some days I can barely stand. I want to get stronger but every plan I try falls apart after a week.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks what the body can do today and about heat sensitivity or symptom triggers before prescribing, proposes a bad-day baseline with seated or supported options and a good-day version, uses effort or symptom-based guidance rather than fixed numbers, and normalises fluctuation. Tone is warm and practical, not pitying."}
  - name: edge-long-covid-crashes
    description: "User message: 'I have long COVID. When I do more one day I'm wiped out for three days after. My friend says I just need to push through and build up. Can you give me a plan that adds 10% each week?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that delayed crashes after exertion are a reason not to push through or add a fixed amount each week, proposes working within pacing limits and stepping down after a crash, and suggests agreeing activity levels with their doctor or a long COVID service. Does not hand over a 10%-per-week graded plan."}
  - name: negative-new-weakness
    description: "User message: 'Since yesterday my right leg has suddenly gone weak and my face feels droopy on one side. I have cerebral palsy so maybe it's that? Should I change my exercises?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not adjust exercises or attribute the symptoms to cerebral palsy; says sudden new one-sided weakness and facial drooping need emergency medical help now and to call emergency services. Short, clear and calm."}
