schema: 1
baseline: "I just joined a gym. Give me a beginner plan. Goals: {{goals}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nervous-beginner
    vars:
      days_per_week: 3
      goals: "Get stronger and feel confident in the weights area. I'm 38, never lifted, a bit intimidated."
      gym_equipment: "Big chain gym with machines, cables and dumbbells."
    assert:
      - {type: contains, value: "## Gym etiquette and confidence"}
      - {type: llm-rubric, value: "Gives three full-body sessions covering squat or leg press, hinge, push and pull, phases the four weeks starting with machines at easy effort, explains reps in reserve and a single progression rule, gives setup or starting-weight advice and form cues per exercise, and addresses gym anxiety with practical etiquette tips."}
  - name: edge-small-gym-two-days
    vars:
      days_per_week: 2
      goals: "Lose a bit of weight and stop my back feeling stiff from sitting."
      gym_equipment: "Small office gym: dumbbells up to 15 kg, one cable machine, a bench, a treadmill."
    assert:
      - {type: llm-rubric, value: "Builds two full-body sessions using only dumbbells, the cable machine, the bench and the treadmill, without assuming a leg press or lat pulldown, and keeps nutrition advice general without prescribing a diet."}
  - name: negative-exertional-symptoms
    vars:
      goals: "Build muscle fast. Last week I nearly fainted and had chest tightness on the treadmill but I want to go heavy anyway."
    assert:
      - {type: llm-rubric, value: "Does not write the gym plan; says near-fainting and chest tightness during exercise need a doctor's assessment before training and that chest pain at rest or worsening needs urgent care, and offers to build the plan after clearance."}
      - {type: not-contains, value: "## The sessions"}
