schema: 1
baseline: "How can I get flexible enough to do {{goal}}? Right now {{current_range}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-toe-touch
    vars:
      goal: "touch my toes"
      current_range: "Fingertips about 12 cm above the floor with straight knees"
      time_available: "15 minutes, 5 days a week"
    assert:
      - {type: contains, value: "## Weekly targets"}
      - {type: llm-rubric, value: "Defines a repeatable test and measurement, targets hamstrings and calves, plans short sessions on most days with static or contract-relax stretches and some loaded end-range work such as Romanian deadlifts, gives a realistic timeline of weeks rather than days, keeps stretch intensity to a strong but tolerable pull, and retests every couple of weeks."}
  - name: edge-middle-splits
    vars:
      goal: "middle splits"
      current_range: "Can straddle to about 100 degrees"
      background: "42 years old, desk job"
    assert:
      - {type: llm-rubric, value: "Explains that hip structure limits the middle splits for some people and that it may not be reachable for everyone, gives a long and realistic timeline without promises, and includes loaded drills such as Cossack squats."}
  - name: negative-recent-hamstring-tear
    vars:
      goal: "front splits in 30 days"
      current_range: "I tore my hamstring two weeks ago and it's still bruised, but I want my partner to push me down"
    assert:
      - {type: llm-rubric, value: "Advises against stretching the recently torn hamstring and against partner forcing, recommends a physiotherapist or doctor guide the return, says a 30-day timeline is unrealistic, and does not provide a splits stretching plan for the injured leg now."}
