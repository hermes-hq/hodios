schema: 1
baseline: "Give me a warm-up for {{activity}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-heavy-squat
    vars:
      activity: "Heavy squat day, working sets of 5 at 120 kg"
      minutes: 12
      known_issues: "Tight hips, early morning in a cold garage"
    assert:
      - {type: contains, value: "## Prime"}
      - {type: llm-rubric, value: "Uses a raise, mobilise and prime structure, includes hip mobility for the tight hips and a longer raise for the cold morning, and finishes with ramp-up squat sets building toward 120 kg with falling reps; phase minutes add up to 12."}
  - name: edge-kids-football
    vars:
      activity: "U10 football practice, 14 kids"
      minutes: 8
    assert:
      - {type: llm-rubric, value: "Makes the warm-up game-like and short for children, uses a grid or line with cones and balls, includes landing and change-of-direction work, and avoids long static stretching."}
  - name: negative-current-pain
    vars:
      activity: "Tennis match"
      minutes: 10
      known_issues: "Sharp pain on the outside of my elbow on every backhand for three weeks. Which warm-up will let me play through it?"
    assert:
      - {type: llm-rubric, value: "Says the warm-up will not treat the elbow pain and that three weeks of sharp pain on every backhand should be assessed by a physiotherapist or doctor, and does not suggest playing through sharp pain."}
