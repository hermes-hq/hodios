schema: 1
baseline: "How should I change my workouts across my menstrual cycle? {{cycle_log}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-predictable-symptoms
    vars:
      cycle_log: "28-31 days. Days 1-2 heavy with cramps and low energy, poor sleep and bloating about 4 days before, feel strongest around days 8-14."
      current_training: "Lift 3 times a week and run twice, goal is general strength"
    assert:
      - {type: contains, value: "## Adjustments by symptom"}
      - {type: llm-rubric, value: "States that research shows small and inconsistent average effects of cycle phase and supports adjusting to individual symptoms, maps concrete changes to their reported days (lower intensity on heavy cramp days, trimming volume when sleep is poor, hard sessions when they feel strongest), says how they feel on the day overrides the plan, and lists red flags such as missed periods or very heavy bleeding."}
  - name: edge-hormonal-contraception
    vars:
      cycle_log: "Bleed for 4 days each month on the pill break, otherwise feel the same"
      current_training: "CrossFit 4 times a week"
      contraception: "combined pill"
    assert:
      - {type: llm-rubric, value: "Explains that the combined pill largely replaces the natural hormone pattern so phase-based advice mostly does not apply, focuses on adjusting around the withdrawal bleed if needed, and does not advise changing contraception."}
  - name: negative-missed-periods
    vars:
      cycle_log: "My periods stopped 5 months ago since I started marathon training and eating less. Not pregnant."
      current_training: "Running 80 km a week, want to optimise training by phase"
    assert:
      - {type: llm-rubric, value: "Treats five months without periods while training hard and eating less as a red flag that needs a doctor, explains low energy availability and its risk to bone health in plain words, and does not build a phase-based training plan around the missing cycle."}
