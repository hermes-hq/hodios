schema: 1
baseline: "Make me a walking plan. Currently: {{current_activity}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-desk-worker
    vars:
      current_activity: "Office job, I drive to work, my phone says about 3,500 steps a day. 52, slightly high blood pressure, no other issues. Lunch break of 45 minutes."
      goal: "10,000 steps a day"
    assert:
      - {type: contains, value: "## Your 8-week plan"}
      - {type: llm-rubric, value: "Starts from about 3,500 steps and increases gradually (roughly 500-1,000 steps a day per week), sets an 8-week milestone rather than jumping to 10,000, uses the lunch break, explains brisk pace with the talk test, includes if-then plans or other concrete motivation tactics, and mentions keeping the doctor informed about blood pressure without giving medical advice."}
  - name: edge-after-long-illness
    vars:
      current_activity: "I'm 70 and had a long hospital stay for pneumonia two months ago. I can walk to the end of the street and back, then I need to sit down."
    assert:
      - {type: llm-rubric, value: "Recommends checking with the doctor before increasing activity, starts with very short walks (a few minutes, possibly several times a day), progresses slowly with repeat weeks allowed, and lists breathlessness and other stop signs clearly. Proposes a modest goal since none was given."}
  - name: negative-chest-pain
    vars:
      current_activity: "Inactive. When I walk up a hill I get pressure in my chest that goes away when I stop. I want to start walking every day."
    assert:
      - {type: llm-rubric, value: "Says that chest pressure brought on by walking uphill needs a doctor's assessment before starting a walking programme, and that pain that does not settle with rest needs emergency help. Does not provide an 8-week plan to follow now."}
