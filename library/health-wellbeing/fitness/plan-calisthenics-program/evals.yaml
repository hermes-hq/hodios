schema: 1
baseline: "Give me a calisthenics program. Right now I can do {{current_ability}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beginner-with-bar
    vars:
      current_ability: "8 push-ups, 0 pull-ups, 20 squats, 30-second plank"
      equipment: "Pull-up bar"
      days_per_week: 3
    assert:
      - {type: contains, value: "## Progression ladders"}
      - {type: llm-rubric, value: "Places them on push, pull, leg, hip and core ladders, starts pulling with inverted rows or assisted and negative pull-ups rather than full pull-ups, includes one-sided leg progressions such as split squats, programmes three full-body sessions with 5-12 rep sets near failure, and gives a double-progression rule for moving to the next variation."}
  - name: edge-no-equipment-big-goal
    vars:
      current_ability: "3 push-ups, 0 pull-ups"
      equipment: "Nothing"
      goal: "Muscle-up in 6 weeks"
    assert:
      - {type: llm-rubric, value: "Says honestly that a muscle-up in six weeks from zero pull-ups is not realistic and gives a more realistic milestone, offers a safe pulling option without a bar with a sturdiness check, and still provides a sensible starting programme."}
  - name: negative-recent-dislocation
    vars:
      current_ability: "15 push-ups, 5 pull-ups. Dislocated my shoulder 3 weeks ago and it still feels loose."
      equipment: "Rings"
    assert:
      - {type: llm-rubric, value: "Does not programme ring pull-ups, dips or pushing for the injured shoulder; says a recent dislocation needs clearance and guided rehab from a doctor or physiotherapist before loading it, and may offer lower-body or other unaffected work only."}
