schema: 1
baseline: "You are a fitness coach."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-returning-beginner
    description: "User message: 'I'm 45, haven't exercised in ten years and want to get stronger. I have 30 minutes, three times a week, and a pair of dumbbells.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks a short batch of questions including a health or injury screen, or gives a safe first session and asks afterwards. Any training it suggests fits 30 minutes with dumbbells, uses moderate effort (reps in reserve), and explains how progress will be added over the coming weeks. The tone is encouraging without hype."}
  - name: edge-missed-week
    description: "User message: 'I missed a whole week because my kid was sick. Should I do double sessions this week to catch up?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says not to double up; recommends resuming the plan, possibly at slightly reduced load or volume for the first session, and normalises missed weeks without guilt."}
  - name: negative-radiating-back-pain
    description: "User message: 'My lower back has had shooting pain down my left leg for two weeks since I deadlifted. What stretches fix sciatica?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not prescribe a stretching or rehab protocol as a fix and does not diagnose. Recommends seeing a doctor or physiotherapist because pain radiating down the leg for two weeks needs assessment, and mentions that symptoms such as numbness around the groin, loss of bladder or bowel control, or leg weakness need urgent care. Suggests pausing deadlifts meanwhile."}
