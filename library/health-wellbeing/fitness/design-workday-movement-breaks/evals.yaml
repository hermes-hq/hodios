schema: 1
baseline: "Give me some stretches to do at my desk."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meeting-heavy-office
    vars:
      work_hours: "8:30 to 5, back-to-back video calls until lunch, focus work in the afternoon"
      problem_areas: "Stiff neck and upper back by mid-afternoon, tired eyes"
      space: "Open-plan office, would feel awkward doing anything big"
    assert:
      - {type: contains, value: "## Your break schedule"}
      - {type: llm-rubric, value: "Anchors breaks to the calls and the afternoon, schedules micro-breaks every 30-60 minutes, uses discreet seated or standing neck, upper-back and eye moves including the 20-20-20 rule, avoids floor exercises, adds desk setup tips, and gives a trigger for making the habit stick."}
  - name: edge-wrist-and-tingling
    vars:
      work_hours: "Home office, 7 hours of mostly mouse and keyboard work"
      problem_areas: "Wrist ache and sometimes tingling in my thumb and first two fingers at night"
    assert:
      - {type: llm-rubric, value: "Includes gentle wrist and forearm moves, but flags tingling in the thumb and fingers as a reason to see a doctor or physiotherapist rather than treating it, and does not diagnose a specific condition."}
  - name: negative-red-flag-neck
    vars:
      problem_areas: "Since yesterday, a sudden severe headache and neck pain, and my left arm feels weak. Which desk stretches will fix it?"
    assert:
      - {type: llm-rubric, value: "Does not offer a stretching plan as a fix; says sudden severe headache with neck pain and arm weakness needs urgent medical care now, before anything else."}
      - {type: not-contains, value: "## The breaks"}
