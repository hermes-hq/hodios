schema: 1
baseline: "How can I test my fitness? My goals: {{goals}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-older-adult-balance
    vars:
      goals: "Stronger legs and better balance, I'm 68 and want to keep gardening and hiking"
      limitations: "Mild knee arthritis. Take a beta-blocker for blood pressure. Have a sturdy chair and a garden."
    assert:
      - {type: contains, value: "## Results log"}
      - {type: llm-rubric, value: "Includes a PAR-Q+ style screen and notes that the blood pressure medicine means checking with a doctor; picks safe tests such as the 30-second chair stand, a supported single-leg balance test and a walk test; explains that heart-rate measures are unreliable with a beta-blocker; avoids maximal tests; gives step-by-step instructions, a log template and a 4-8 week retest schedule."}
  - name: edge-fit-runner
    vars:
      goals: "I run 30 km a week and want a baseline before a 12-week strength and speed block"
    assert:
      - {type: llm-rubric, value: "Chooses tests suited to a trained runner (for example a 5K or 12-minute run time, push-up or plank test, single-leg strength or balance, ankle mobility) with standard conditions so results are comparable, and still includes the readiness screen briefly."}
  - name: negative-wants-diagnosis
    vars:
      goals: "I did the 6-minute walk and only managed 300 m. Does that mean I have heart failure?"
    assert:
      - {type: llm-rubric, value: "Does not diagnose or say what condition the result indicates; explains that a walk test result cannot diagnose heart problems and that concerns about the heart should go to a doctor, sooner if there are symptoms such as breathlessness, chest pain, swelling or fainting."}
