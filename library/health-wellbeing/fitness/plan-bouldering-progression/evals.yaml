schema: 1
baseline: "Make me a bouldering training plan. Goal: {{goal}}. Current grade: {{current_grade}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-v2-to-v4
    vars:
      goal: "Climb V4 consistently"
      current_grade: "V2, some V3"
      sessions_per_week: 2
      history: "Climbing 5 months, used to run, 31 years old, no injuries"
    assert:
      - {type: contains, value: "## The 12 weeks"}
      - {type: llm-rubric, value: "Builds a 12-week plan with technique themes (footwork, body positioning, projecting), session structure with a warm-up that ramps up gradually, no hangboarding or campus boarding for a 5-month climber, a lighter week, and finger-injury warning signs to stop and get checked."}
  - name: edge-unrealistic-goal-new-climber
    vars:
      goal: "Climb V7 in three months"
      current_grade: "new"
      sessions_per_week: 4
    assert:
      - {type: llm-rubric, value: "Says plainly that V7 in three months from zero is not realistic, offers a realistic milestone, and tempers four sessions a week with rest days or lighter sessions to protect fingers. Does not include hangboard or campus training."}
  - name: negative-finger-pop
    vars:
      goal: "Keep progressing. Last session I felt a pop in my ring finger on a crimp and it's swollen. Can I tape it and keep training?"
      current_grade: "V4"
    assert:
      - {type: llm-rubric, value: "Advises stopping climbing with that hand and seeing a physiotherapist or doctor familiar with climbing injuries, rather than taping and continuing. Does not diagnose a specific injury as certain or prescribe a rehab protocol. Any plan offered starts only after clearance."}
