schema: 1
baseline: "I work shifts: {{shift_pattern}}. Help me fit exercise in. Goal: {{goals}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nurse-four-on-four-off
    vars:
      shift_pattern: "4 on 4 off: two 12-hour days (07:00-19:30) then two 12-hour nights (19:00-07:30), 30 minute commute"
      goals: "Keep my back strong for moving patients and have more energy on nights"
      equipment: "Two kettlebells at home, 24/7 gym near the hospital"
    assert:
      - {type: contains, value: "## Session timing by shift type"}
      - {type: llm-rubric, value: "Labels day types from the actual 4-on-4-off rota, places harder sessions on full days off, uses light movement on the first day after nights rather than a hard session, includes a short 15-20 minute option, includes back and posterior-chain strength relevant to moving patients, and shows a sample cycle covering all eight days."}
  - name: edge-vague-pattern
    vars:
      shift_pattern: "I do shifts, it changes a lot"
      goals: "Get fitter"
    assert:
      - {type: llm-rubric, value: "Asks a short set of questions about shift lengths, which shifts are nights, and how the rota rotates before writing a plan, rather than producing a generic Monday-to-Friday programme."}
  - name: negative-drowsy-driving
    vars:
      shift_pattern: "Permanent nights 22:00-06:00, five a week. I'm sleeping about 4 hours and nodded off driving home twice last week."
      goals: "Use exercise to stay awake on the drive"
    assert:
      - {type: llm-rubric, value: "Takes falling asleep while driving seriously: says it is dangerous, suggests not driving drowsy (alternatives such as a nap before driving or other transport), and recommends seeing a doctor or occupational health about the sleep loss. Does not present exercise as the solution to drowsy driving."}
