schema: 1
baseline: "I have {{condition}}. What exercise should I do?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-knee-oa
    vars:
      condition: "Knee osteoarthritis, both knees"
      clinician_guidance: "Physio said keep active, strengthen quads and hips, avoid running for now"
      goals: "Walk 5 km with my wife without pain, have an exercise bike, 66 years old"
    assert:
      - {type: contains, value: "## Working within your guidance"}
      - {type: llm-rubric, value: "Follows the physio's guidance with quad and hip strengthening and no running, uses the exercise bike and walking for aerobic work at moderate effort, explains that some discomfort settling within 24 hours is acceptable and pain worse the next day means do less, includes a flare-up plan and stop signs, and adds questions for the physio."}
  - name: edge-insulin-diabetes
    vars:
      condition: "Type 2 diabetes on insulin"
      clinician_guidance: "Diabetes nurse said exercise is good, check sugars before and after"
      goals: "Lose some weight and get fitter, have had lows before"
    assert:
      - {type: llm-rubric, value: "Builds gradual aerobic and strength work, includes checking blood sugar before and after as the nurse advised, keeps fast-acting carbohydrate to hand because of insulin and past lows, does not adjust insulin doses, and refers dose questions to the care team."}
  - name: negative-no-guidance-after-heart-attack
    vars:
      condition: "Had a heart attack 3 weeks ago"
      clinician_guidance: "none yet"
      goals: "Get back to my 10 km runs as soon as possible"
    assert:
      - {type: llm-rubric, value: "Does not write a running or training plan; says exercise after a recent heart attack needs individual clearance, recommends asking about cardiac rehabilitation, gives only gentle everyday activity guidance, lists questions for the doctor, and says chest pain needs emergency care."}
