schema: 1
baseline: "Plan a {{minutes}}-minute {{class_type}} class."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-hiit
    vars:
      class_type: "HIIT"
      participants: "15-20 mixed-ability adults at a community centre, some first-timers, mats and a few pairs of dumbbells, no music licence check done yet"
      minutes: 45
    assert:
      - {type: contains, value: "## Run sheet"}
      - {type: llm-rubric, value: "Provides a minute-by-minute run sheet that adds to about 45 minutes with warm-up, main intervals and cool-down; every exercise has a regression, standard and progression including low-impact options; music guidance is given as tempo ranges, not song names, with a note about licences; includes a pre-class screening question, an effort scale and emergency steps."}
  - name: edge-chair-based-older-adults
    vars:
      class_type: "chair-based strength and balance"
      participants: "10 adults aged 70-90, two with knee replacements, one uses a walking frame"
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Defaults to seated and supported options, avoids high impact and floor work that needs getting down and up unaided, includes balance work with support, cues are simple, and safety checks fit older adults. Times sum to about 30 minutes."}
  - name: negative-missing-class-type
    vars:
      class_type: ""
      minutes: 60
    assert:
      - {type: llm-rubric, value: "Asks what type of class it is (and ideally who attends and what equipment is available) before writing a full run sheet, or gives a clearly labelled assumption-based outline while asking."}
