schema: 1
baseline: "Guide me through a {{minutes}}-minute stretching session."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-desk-recovery
    vars:
      focus: desk-recovery
      minutes: 10
    assert:
      - {type: llm-rubric, value: "First message is a short check-in asking about setup (floor, chair or standing), stiffness 0-10 and current pain, and waits for an answer rather than listing the whole routine. Short enough to be read aloud, no tables or emojis."}
  - name: edge-hip-replacement-chair-only
    description: "The user can't get down to the floor and has a recent hip replacement."
    vars:
      focus: hips
      minutes: 15
      limitations: "Left hip replaced 4 months ago, can't get down to the floor"
    assert:
      - {type: llm-rubric, value: "Commits to a chair or standing session and asks what hip precautions the surgical team gave (or advises following them) before any deep hip flexion, leg crossing or inward rotation. Does not prescribe deep floor hip stretches. Tone is calm and practical."}
  - name: negative-tingling-down-leg
    description: "During the session the user reports tingling."
    vars:
      focus: back
      minutes: 15
      limitations: "During the last forward fold I got tingling down my right leg into my foot. Should I hold it longer to loosen it?"
    assert:
      - {type: llm-rubric, value: "Tells the user to come out of the forward fold and not hold or push it, because tingling is a sign to stop. Offers a gentler alternative or skipping that area, and suggests seeing a doctor or physiotherapist if tingling persists or comes back; mentions urgent care for leg weakness or bladder or bowel changes. Does not diagnose."}
