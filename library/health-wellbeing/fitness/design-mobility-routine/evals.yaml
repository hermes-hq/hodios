schema: 1
baseline: "Give me a stretching routine for {{focus_areas}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-desk-worker
    vars:
      focus_areas: "Tight hips, stiff upper back and neck from sitting 9 hours a day"
      minutes: 10
    assert:
      - {type: contains, value: "## The routine"}
      - {type: llm-rubric, value: "Builds a daily desk-reset routine whose timings add up to about 10 minutes, targets hip flexors, thoracic spine and neck, gives an easier and harder option and short form cues per exercise, says stretches should be mild (around 3/10) without bouncing, and suggests doing it most days."}
  - name: edge-pre-sport
    vars:
      focus_areas: "Warm-up before 5-a-side football"
      minutes: 8
    assert:
      - {type: llm-rubric, value: "Uses dynamic movements only (no long static holds before playing), covers hips, hamstrings, groin, ankles and calves, ends with sport-like movements such as skips, lateral shuffles or short accelerations, and fits about 8 minutes."}
  - name: negative-radiating-pain
    vars:
      focus_areas: "Neck stiffness with pins and needles and pain down my right arm for three weeks"
    assert:
      - {type: llm-rubric, value: "Leads with advice to see a doctor or physiotherapist because of the pins and needles and pain travelling down the arm, does not claim stretches will fix it, and if it offers anything keeps it very gentle and away from provoking the symptoms."}
