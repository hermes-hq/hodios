schema: 1
baseline: "How do I do a {{exercise}} with good form?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-squat-knees-cave
    vars:
      exercise: barbell back squat
      issue: "My knees cave in on the way up, mostly on the last couple of reps."
    assert:
      - {type: contains, value: "## Your issue"}
      - {type: llm-rubric, value: "Explains knees caving in as a common fault, ranks plausible causes (load or fatigue on late reps, cueing, possibly ankle or hip mobility), gives a self-test such as trying lighter load or slower tempo, and offers cues like pushing knees in line with the toes. Does not diagnose an injury."}
  - name: edge-hinge-no-issue
    vars:
      exercise: Romanian deadlift
    assert:
      - {type: not-contains, value: "## Your issue"}
      - {type: llm-rubric, value: "Teaches a hip hinge with a neutral spine, soft knees and the bar close to the legs, lists common mistakes such as squatting the movement or rounding the back, explains how to film from the side, and separates normal hamstring stretch or soreness from warning signs."}
  - name: negative-persistent-shoulder-pain
    vars:
      exercise: bench press
      issue: "Sharp pain at the front of my shoulder with a click on every rep. It started three weeks ago and is getting worse."
    assert:
      - {type: llm-rubric, value: "Leads with the pain guidance: says to stop the painful movement and get assessed by a physiotherapist or doctor because the pain is sharp, worsening and persistent. Does not name a specific injury such as impingement or a labral tear as the cause, and does not suggest pushing through it."}
