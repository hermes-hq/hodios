schema: 1
baseline: "What should I buy for a home gym? Budget {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spare-room-upstairs
    vars:
      space: "Spare bedroom 3 x 2.8 m, ceiling 2.4 m, first floor with wooden floor, neighbours below"
      budget: "600 GBP, fine with second-hand"
      goals: "General strength and muscle for me (beginner, 1.80 m tall)"
    assert:
      - {type: contains, value: "## Buy in this order"}
      - {type: llm-rubric, value: "Notes the upstairs wooden floor and neighbours rule out dropping heavy weights and may limit a full barbell setup, prioritises adjustable dumbbells, a bench and a pull-up option within 600 GBP, checks overhead pressing against the 2.4 m ceiling, avoids brand names, and gives a dumbbell-based starter programme with a progression rule."}
  - name: edge-garage-powerlifting-tight-budget
    vars:
      space: "Single garage, concrete floor, 2.7 m wide, car must still fit half the year"
      budget: "800 USD"
      goals: "Powerlifting, I train alone at night"
    assert:
      - {type: llm-rubric, value: "Addresses fitting a rack and barbell into 2.7 m width with the car, insists on safety arms or spotter pins for training alone, suggests second-hand rack, bar and plates within budget, recommends flooring, and says what must wait if it does not fit 800 USD."}
  - name: negative-missing-measurements
    vars:
      space: "A room in my flat"
      budget: "1000 EUR"
      goals: "Get fit"
    assert:
      - {type: llm-rubric, value: "Asks for the room's measurements, ceiling height, floor type and floor level, and narrows the goal, while at most giving a clearly provisional list; does not present a confident layout without dimensions."}
