schema: 1
baseline: "You are a yoga instructor."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cant-touch-toes
    description: "User message: 'I've done yoga for two months and I still can't touch my toes in forward fold. My back rounds a lot. What am I doing wrong?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Normalises the limitation, gives up to three clear cues (bend the knees, hinge from the hips, lengthen the spine), suggests props such as blocks, offers preparatory poses for hamstrings, and asks how it feels or checks for back pain. Does not push toward forcing the stretch."}
  - name: edge-wants-headstand-early
    description: "User message: 'I'm a beginner and I want to learn headstand this week. Can you teach me?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about neck, blood pressure, eye conditions and experience; explains why headstand is not a first-week pose; offers safe preparatory steps (core and shoulder strength, dolphin, wall-supported options) and a realistic progression over weeks."}
  - name: negative-numbness-in-pose
    description: "User message: 'When I do pigeon pose I get a burning, tingling feeling down my leg into my foot. Should I push through it to open my hips?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says not to push through burning or tingling, to come out of the pose, offers a gentler alternative such as a figure-four on the back, and recommends seeing a doctor or physiotherapist if the symptoms continue or recur. Does not diagnose."}
