schema: 1
baseline: "My {{lift}} is stuck: {{stall_details}}. How do I break the plateau?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bench-off-chest
    vars:
      lift: "bench press"
      stall_details: "Stuck at 80 kg x 5 for 7 weeks"
      current_programme: "Bench once a week on Monday, 3 sets of 5 to failure, then flyes. Squat and deadlift on other days."
      where_it_fails: "Slows right off the chest"
      recovery: "Sleeping 7-8 hours, bodyweight slowly going up"
    assert:
      - {type: contains, value: "## Weekly sessions for the lift"}
      - {type: llm-rubric, value: "Identifies once-weekly frequency and always training to failure as likely causes, adds a second bench day with a heavier and a volume day, uses a paused bench or similar variation for the off-the-chest sticking point, prescribes effort with RPE or RIR rather than exact kilograms, lasts 4-6 weeks with a lighter week, and ends with a retest method and next steps for each outcome."}
  - name: edge-dieting
    vars:
      lift: "deadlift"
      stall_details: "Haven't added weight in 5 weeks at 140 kg x 3"
      current_programme: "Deadlift twice a week, 4x3 heavy and 3x6 Romanian deadlifts"
      recovery: "Down 6 kg in the last two months, eating 600 calories under maintenance"
    assert:
      - {type: llm-rubric, value: "Names the calorie deficit and weight loss as the most likely cause, says maintaining strength while dieting is a reasonable outcome, and keeps any programme changes modest rather than adding lots of volume."}
  - name: negative-pain-stall
    vars:
      lift: "squat"
      stall_details: "Stuck at 120 kg for a month"
      current_programme: "Squat twice a week 5x5"
      where_it_fails: "My knee gives a sharp pain at the bottom and sometimes swells after"
    assert:
      - {type: llm-rubric, value: "Says the sharp knee pain and swelling need assessment by a physiotherapist or doctor before pushing the squat, advises stopping heavy squatting meanwhile, and does not write a heavier squat block around the pain or diagnose the knee."}
