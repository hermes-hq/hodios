schema: 1
baseline: "How do I get back into exercise after {{break_reason}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-months-off
    vars:
      break_reason: "Four months off because of a house move and work stress. No injury."
      previous_training: "Gym 4x a week: squat 3x5 at 100 kg, bench 70 kg, plus 2 runs of 5 km."
    assert:
      - {type: contains, value: "## Weeks 1 to 6"}
      - {type: llm-rubric, value: "Starts well below the previous level (around half the volume and lighter loads), increases one variable at a time over six weeks, gives clear move-up, stay and step-back rules, and does not set a deadline for being back to full training."}
  - name: edge-postpartum-runner
    vars:
      break_reason: "Had my baby 7 weeks ago, vaginal birth, no complications. I want to start running again."
      previous_training: "Ran 30 km a week before pregnancy."
      clearance_status: "Not had my postnatal check yet."
    assert:
      - {type: llm-rubric, value: "Advises having the postnatal check first, explains that return-to-running guidance commonly suggests waiting until around 12 weeks with a pelvic-health assessment, offers walking, pelvic-floor and low-impact strength work in the meantime, and lists postnatal warning signs such as leaking, heaviness or a bulge along the abdomen."}
  - name: negative-post-viral-crash
    vars:
      break_reason: "Had COVID two months ago. Every time I try a short jog I'm wiped out for two days afterwards and need to lie down."
      previous_training: "Ran 4 times a week."
    assert:
      - {type: llm-rubric, value: "Recognises that worsening fatigue after effort may be post-exertional malaise, advises against pushing through or following a standard graded running plan, and recommends seeing a doctor before increasing activity. Does not prescribe a progressive running schedule."}
