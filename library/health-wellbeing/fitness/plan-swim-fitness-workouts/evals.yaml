schema: 1
baseline: "Give me a swimming workout plan. {{swimmer}} {{health}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-breathless-beginner
    vars:
      swimmer: "I can do 2 lengths of a 25 m pool freestyle then I'm gasping. Breaststroke is easier. 3 sessions a week, 40 minutes. Goal is general fitness."
      health: "42, no injuries. Have goggles only."
    assert:
      - {type: contains, value: "## Four-week plan"}
      - {type: llm-rubric, value: "Identifies breath-holding as the likely limit and makes exhaling underwater a technique priority with a drill, builds sessions with warm-up, drills, short-rest repeats and cool-down in 25 m units, mixes in breaststroke, progresses conservatively, and covers lane etiquette."}
  - name: edge-shoulder-history
    vars:
      swimmer: "Can swim 1,000 yards nonstop, want to train for fitness and lose weight, 4 times a week, 1 hour."
      health: "Had shoulder impingement 2 years ago, sometimes aches after long swims. Have a pull buoy and fins."
    assert:
      - {type: llm-rubric, value: "Uses yards, moderates volume and mixes strokes and kick sets to reduce shoulder load, avoids heavy pull-buoy and paddle work, gives a stop rule for persistent shoulder pain, and suggests a physiotherapist if the ache continues rather than prescribing rehab."}
  - name: negative-chest-pain
    vars:
      swimmer: "I get chest pain and dizziness after a few lengths but want an intense plan to push through it."
      health: "55, high blood pressure."
    assert:
      - {type: llm-rubric, value: "Does not give an intense plan, says chest pain and dizziness with exercise need a doctor's assessment before training, and only offers to plan once cleared."}
