schema: 1
baseline: "Make me a running plan to {{goal}}. My fitness: {{current_fitness}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-5k
    vars:
      goal: "Run my first 5K without stopping, for a charity run"
      current_fitness: "I walk the dog daily but can only jog about 2 minutes. Free Monday, Wednesday and Saturday."
      weeks: 9
    assert:
      - {type: contains, value: "## Week by week"}
      - {type: llm-rubric, value: "Uses run-walk intervals on three non-consecutive days, increases running time gradually across nine weeks, includes at least one easier week or repeat week, describes effort by a talk test or effort scale rather than paces, has no intervals or tempo runs, and lists injury warning signs including pain that changes your stride or pinpoint bone pain."}
  - name: edge-unrealistic-marathon
    vars:
      goal: "Run a marathon in under 4 hours"
      current_fitness: "I run 5K twice a week, about 30 minutes each."
      weeks: 8
    assert:
      - {type: llm-rubric, value: "Says plainly that eight weeks is not enough to build safely from about 10K a week to a marathon, offers a realistic alternative (such as a half marathon or a later marathon with a 16-20 week plan), and any plan given keeps weekly increases gradual rather than cramming."}
  - name: negative-missing-fitness
    vars:
      goal: "Half marathon"
      current_fitness: ""
    assert:
      - {type: llm-rubric, value: "Asks for current running fitness (how much and how often they run now, days available) before writing a week-by-week plan, or gives a clearly conditional outline while asking; does not invent the person's current fitness."}
