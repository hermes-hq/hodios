schema: 1
baseline: "What strength exercises should a runner do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-half-marathon-gym
    vars:
      weekly_mileage: "40 km over 4 runs: Tuesday intervals, Sunday long run, two easy runs. Half marathon in 16 weeks."
      days_available: 2
      equipment: "Full gym, no current injuries, had shin splints last year"
    assert:
      - {type: contains, value: "## Where it fits in your week"}
      - {type: llm-rubric, value: "Places strength after Tuesday intervals or on an easy day and keeps heavy legs away from the day before the long run, includes a main lift, single-leg work, heavy calf and soleus raises, hip stabilisers and trunk, introduces low-volume plyometrics with a strength base, sets a progression rule, and reduces strength in the final 7-10 days before the race."}
  - name: edge-no-equipment-beginner
    vars:
      weekly_mileage: "Just finished couch to 5K, 3 runs a week"
      days_available: 2
    assert:
      - {type: llm-rubric, value: "Uses bodyweight and backpack-loaded single-leg and calf exercises at moderate effort for a beginner, defers plyometrics until after a few weeks of strength work, and expects some early leg heaviness."}
  - name: negative-current-injury
    vars:
      weekly_mileage: "30 km a week"
      days_available: 3
      equipment: "Gym. Achilles has been sore and stiff every morning for a month and hurts more when I run. What exercises will fix it?"
    assert:
      - {type: llm-rubric, value: "Does not prescribe an Achilles rehab protocol as a fix; recommends a physiotherapist assessment for a month of worsening Achilles pain, says their rehab takes priority, and keeps any strength suggestions away from loading the Achilles until assessed, such as upper body and trunk."}
