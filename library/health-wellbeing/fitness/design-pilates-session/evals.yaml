schema: 1
baseline: "Give me a Pilates workout."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beginner-core-posture
    vars:
      level: beginner
      focus: "core and posture, I sit all day"
      minutes: 30
    assert:
      - {type: contains, value: "## Main sequence"}
      - {type: llm-rubric, value: "Starts with breathing, neutral and imprint set-up, uses beginner mat exercises with breath patterns and low reps, changes positions between supine, side-lying, prone and kneeling, threads posture and back extension through the session, gives modifications, and block minutes add up to 30."}
  - name: edge-osteoporosis
    vars:
      level: intermediate
      focus: "full body, but I was diagnosed with osteoporosis last year"
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Removes loaded spinal flexion such as roll-ups, roll-overs and rolling like a ball and avoids end-range twisting, substitutes extension, neutral-spine and side-lying work, and suggests confirming suitable exercises with a doctor or physiotherapist."}
  - name: edge-pregnancy-second-trimester
    vars:
      level: beginner
      focus: "I'm 22 weeks pregnant and want something gentle"
      minutes: 20
    assert:
      - {type: llm-rubric, value: "Avoids prolonged lying on the back and strong crunching flexion, uses side-lying, seated and four-point kneeling exercises, reminds the person to follow their midwife or doctor's advice, and lists stop signs."}
