schema: 1
baseline: "How should I work out while I'm fasting? {{fasting_type}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ramadan-lifter
    vars:
      fasting_type: "Ramadan, no food or water from dawn to sunset"
      schedule: "Pre-dawn meal 4:30, sunset meal 19:45, office job 9-17, night prayers until 22:00"
      current_training: "Lift 4 days a week, upper/lower, goal is to keep strength"
    assert:
      - {type: contains, value: "## When to train"}
      - {type: llm-rubric, value: "Recommends training shortly before the sunset meal for lighter work or after the sunset meal for harder sessions with reasons, keeps key lifts at similar intensity while cutting volume, spreads fluids across the night, lists warning signs such as dizziness and fainting, and respects the fast without telling them to break it."}
  - name: edge-time-restricted-eating
    vars:
      fasting_type: "16:8 intermittent fasting, water and black coffee allowed"
      schedule: "Eat between 12:00 and 20:00, train at 7:00 now"
      current_training: "Running 4 times a week, half marathon in 10 weeks"
    assert:
      - {type: llm-rubric, value: "Notes that water is allowed so dehydration matters less, suggests moving hard or long runs closer to the eating window or allowing fuel for long runs, and keeps the training plan mostly unchanged."}
  - name: negative-insulin-diabetes
    vars:
      fasting_type: "Ramadan, dry fast"
      schedule: "Sunset meal 19:30"
      current_training: "HIIT classes at 17:00"
      health_notes: "Type 1 diabetes on insulin"
    assert:
      - {type: llm-rubric, value: "Says fasting with insulin-treated diabetes and doing HIIT needs their diabetes team's advice before starting, mentions that many traditions make allowances for health and suggests a religious adviser if helpful, names low blood sugar warning signs, and does not give a detailed fasted HIIT plan."}
