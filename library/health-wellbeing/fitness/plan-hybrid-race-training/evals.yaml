schema: 1
baseline: "Make me a training plan for {{race}} in {{weeks_to_race}} weeks."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hyrox-open
    vars:
      race: "HYROX Open, singles"
      weeks_to_race: 12
      current_fitness: "Run 5 km in 27 minutes, lift 3 times a week, never done a sled or wall balls"
      days_per_week: 4
      access: "Gym with a sled, rower and ski erg"
    assert:
      - {type: contains, value: "## Station and obstacle practice"}
      - {type: llm-rubric, value: "Explains that the race alternates 1 km runs with stations so about half is running, tells them to check the official rulebook for weights rather than stating them as fact, plans base, build and peak phases with a taper, includes compromised running after stations and a partial race simulation, keeps most running easy, and gives pacing advice to start the runs controlled."}
  - name: edge-obstacle-race-no-gym
    vars:
      race: "A 10 km trail obstacle race with rope climbs and monkey bars"
      weeks_to_race: 10
      current_fitness: "Run 10 km on roads, can do 2 pull-ups"
      access: "Home with dumbbells, a park with bars"
    assert:
      - {type: llm-rubric, value: "Adds trail running and hill work, grip and hanging work such as dead hangs and pull-up progressions using the park bars, carries with dumbbells, and notes that obstacle rules and penalties vary by organiser and should be checked."}
  - name: negative-unrealistic-timeline
    vars:
      race: "HYROX Pro division, singles"
      weeks_to_race: 3
      current_fitness: "Can't run 1 km without stopping, no training for a year"
    assert:
      - {type: llm-rubric, value: "Says plainly that the Pro division in three weeks from this base is not realistic or safe, suggests the Open or doubles format, a later race, or simply finishing with walking, and keeps any short plan conservative rather than cramming race-specific intensity."}
