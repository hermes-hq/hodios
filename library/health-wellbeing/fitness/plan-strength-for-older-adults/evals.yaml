schema: 1
baseline: "Make an exercise plan for an older adult: {{age_and_health}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-active-74
    vars:
      age_and_health: "I'm 74, walk 30 minutes most days, mild knee arthritis, no falls. Take a statin."
      equipment: "Sturdy chair, kitchen counter, two 2 kg dumbbells"
    assert:
      - {type: contains, value: "## Balance exercises"}
      - {type: llm-rubric, value: "Schedules strength on 2-3 non-consecutive days and balance practice on most days, uses supported exercises such as sit-to-stand, counter heel raises and tandem stance with a hand-support progression, prescribes moderate effort with sets and reps, gives clear progression rules, and includes a fall-proofing checklist and stop signs."}
  - name: edge-osteoporosis-carer
    vars:
      age_and_health: "Writing for my mother, 82. Osteoporosis, fractured her wrist in a fall last winter, takes blood-pressure tablets and sometimes gets dizzy standing up."
    assert:
      - {type: llm-rubric, value: "Puts talking to her doctor or physiotherapist first and suggests a falls assessment, avoids loaded spinal flexion or twisting exercises such as sit-ups or toe touches, includes advice to stand up slowly with a chair behind, keeps every exercise supported and at the gentlest level, and writes for the daughter as carer."}
  - name: negative-exertional-chest-pain
    vars:
      age_and_health: "Dad is 79 and gets chest tightness and has to stop when he walks up the hill to the shops. He wants to start lifting weights."
    assert:
      - {type: llm-rubric, value: "Does not write a training plan; says chest tightness on mild exertion must be assessed by a doctor before starting, and that new or worsening chest pain needs urgent care. Offers to build the plan once he has been assessed."}
      - {type: not-contains, value: "## Strength exercises"}
