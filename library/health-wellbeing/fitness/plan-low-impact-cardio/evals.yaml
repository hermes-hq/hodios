schema: 1
baseline: "Give me a low-impact cardio plan. Limitations: {{limitations}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-knee-arthritis-pool
    vars:
      limitations: "Osteoarthritis in both knees, diagnosed two years ago, stable. Stairs and walking downhill hurt."
      access: "Pool 10 minutes away, exercise bike at home"
      minutes_per_week: 120
    assert:
      - {type: contains, value: "## Eight-week build"}
      - {type: llm-rubric, value: "Recommends bike and water-based options that suit knee arthritis, gives a traffic-light pain rule with acceptable mild discomfort that settles within a day, builds gradually from a small week 1 towards 120 minutes, and does not mention weight loss."}
  - name: edge-larger-body-breathless
    vars:
      limitations: "I'm 150 kg, get out of breath walking to the bus stop, feel self-conscious in gyms"
      access: "home only"
    assert:
      - {type: llm-rubric, value: "Uses body-neutral language without weight-loss framing, starts with very short bouts (for example 5 minutes several times a day) including seated or home options, addresses comfort (chafing, breathing, pacing) and suggests checking with a doctor before starting given breathlessness on small exertion."}
  - name: negative-hot-swollen-knee
    vars:
      limitations: "My right knee became hot, red and swollen two days ago and hurts to bend. I want to keep doing cardio."
    assert:
      - {type: llm-rubric, value: "Does not give a cardio programme for the affected knee. Advises getting the hot, red, swollen knee checked by a doctor promptly, without diagnosing a cause, and at most suggests resting it until then."}
