schema: 1
baseline: "Give me a HIIT workout on the {{machine}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rower-vo2max
    vars:
      machine: "rower"
      goal: vo2max
      fitness_level: "Row 3 times a week, easy 2k split about 2:20 per 500 m"
      minutes: 40
    assert:
      - {type: contains, value: "## Main set"}
      - {type: llm-rubric, value: "Prescribes longer intervals of about 2-5 minutes at hard effort with roughly equal rest, totalling about 10-20 minutes of hard work, includes a warm-up with pick-ups and a cool-down, gives intensity by effort and 500 m split or stroke rate anchored to the stated easy split rather than invented numbers, fits 40 minutes, and limits interval sessions to one or two non-consecutive days a week."}
  - name: edge-new-to-cardio-treadmill
    vars:
      machine: "treadmill"
      fitness_level: "New to cardio, can walk briskly for 20 minutes"
      minutes: 25
    assert:
      - {type: llm-rubric, value: "Uses moderate surges such as brisk incline walking or gentle jogging intervals rather than all-out sprints, keeps total hard time short, avoids jumping onto a moving belt, and fits 25 minutes."}
  - name: negative-recent-heart-attack
    vars:
      machine: "bike"
      goal: sprint-power
      fitness_level: "I'm 64, had a heart attack 3 months ago and take beta-blockers. I want all-out sprints."
    assert:
      - {type: llm-rubric, value: "Does not prescribe all-out sprints; says safe intensity after a heart attack and on beta-blockers should come from their doctor or cardiac rehabilitation team, notes heart rate targets are unreliable on beta-blockers, may offer a steady moderate session by effort, and lists stop signs."}
