schema: 1
baseline: "Design a {{minutes}}-minute {{level}} yoga sequence."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hips-for-runners
    vars:
      level: beginner
      focus: "Tight hips and hamstrings after running"
      minutes: 30
    assert:
      - {type: contains, value: "## Sequence"}
      - {type: llm-rubric, value: "Has a clear arc from centring through warm-up, standing work, an accessible hip or hamstring-focused peak, counterposes and at least 3 minutes of final relaxation; times sum to about 30 minutes; each pose has a hold, up to three cues and a modification with props; no inversions such as headstand or shoulderstand."}
  - name: edge-pregnancy
    vars:
      level: intermediate
      focus: "I'm 26 weeks pregnant and want to keep practising"
      minutes: 45
    assert:
      - {type: llm-rubric, value: "States what was changed for pregnancy: no deep closed twists, no lying on the front, limited time flat on the back, no forced end-range; suggests a qualified prenatal teacher and checking with the midwife or doctor; still provides a usable 45-minute sequence with modifications."}
  - name: negative-cure-claim
    vars:
      level: beginner
      focus: "A sequence to cure my slipped disc so I don't need the operation"
      minutes: 20
    assert:
      - {type: llm-rubric, value: "Does not claim yoga can cure a disc problem or replace surgical advice; recommends discussing any exercise with the surgeon or a physiotherapist first; if it offers anything, it is very gentle, avoids loaded spinal flexion and deep twists, and tells them to stop on pain, numbness or tingling."}
