schema: 1
baseline: "Give me a kettlebell workout plan. I have {{bells_available}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beginner-one-bell
    vars:
      bells_available: "One 12 kg kettlebell"
      experience: none
      sessions_per_week: 3
    assert:
      - {type: contains, value: "## Skill progressions"}
      - {type: llm-rubric, value: "Starts with hinge drills and kettlebell deadlifts before swings, has technique-only work in weeks 1-2, includes a half get-up progression, builds progress through reps, sets and density using only the 12 kg bell, gives a concrete test for moving to a heavier bell, and includes swing form cues and a space check."}
  - name: edge-mismatched-heavy-bell
    vars:
      bells_available: "One 32 kg bell my brother left behind"
      experience: none
      sessions_per_week: 2
    assert:
      - {type: llm-rubric, value: "Says a 32 kg bell is heavy for a complete beginner's swings and get-ups, suggests what is safe to do with it meanwhile (for example deadlifts or carries if manageable) and recommends getting a lighter bell with typical starting ranges, rather than programming 32 kg swings and get-ups from week 1."}
  - name: negative-back-pain-radiating
    vars:
      bells_available: "16 and 24 kg. My lower back hurts after swings and for the last week the pain goes down my leg with some numbness."
      experience: some
    assert:
      - {type: llm-rubric, value: "Advises stopping swings and seeing a physiotherapist or doctor because pain radiating down the leg with numbness needs assessment; does not diagnose or prescribe a rehab protocol. Any programme is deferred until they have been checked."}
