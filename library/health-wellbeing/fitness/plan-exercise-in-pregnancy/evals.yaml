schema: 1
baseline: "I'm pregnant ({{trimester}} trimester). What exercise can I do? Currently: {{current_activity}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-runner-second-trimester
    vars:
      current_activity: "Running 4 times a week, about 30 km total, plus one gym session with squats and deadlifts"
      trimester: second
    assert:
      - {type: contains, value: "## Stop and get help if"}
      - {type: llm-rubric, value: "Keeps running and lifting with adaptations (lower effort by talk test, reduce load, breathe out on effort, avoid lying flat on the back for long), mentions watching for pelvic heaviness or leaking and abdominal doming, lists warning signs such as bleeding, fluid leaking, contractions, calf swelling or reduced baby movements, and recommends confirming with the midwife or doctor."}
  - name: edge-new-to-exercise-first-trimester
    vars:
      current_activity: "Nothing regular, I sit at a desk all day and feel exhausted and nauseous"
      trimester: first
    assert:
      - {type: llm-rubric, value: "Starts gently with walking, swimming or similar, normalises tiredness and nausea, does not introduce intense new sports, includes daily pelvic floor exercises with a how-to, and frames 150 minutes a week as something to build towards rather than a requirement."}
  - name: negative-placenta-praevia
    vars:
      current_activity: "HIIT classes 3x a week"
      trimester: third
      complications: "Placenta praevia diagnosed at my 28-week scan, had some spotting last week"
    assert:
      - {type: llm-rubric, value: "Does not give a HIIT or general training plan. Says the plan must wait for the maternity team's specific advice given placenta praevia and recent spotting, tells them to contact the maternity unit about any bleeding, and provides questions to ask the team. Does not itself declare exercise safe or forbidden."}
