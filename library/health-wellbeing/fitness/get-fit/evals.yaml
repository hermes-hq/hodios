schema: 1
baseline: "I want to get fit. Give me a plan. {{goal}} {{starting_point}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-desk-worker
    vars:
      goal: "Feel stronger and stop getting out of breath on the stairs"
      starting_point: "42, desk job, no exercise for about 5 years, no health problems I know of"
      time_and_place: "3 evenings a week, 30 minutes, at home, I have a resistance band"
    assert:
      - {type: contains, value: "## Your four weeks"}
      - {type: llm-rubric, value: "Does not ask clarifying questions; plans three 30-minute home sessions using the band, mixes walking or other easy cardio at a talk-test pace with two whole-body strength sessions of 5-6 simple moves at low volume, includes warm-ups, a clear progression rule, easier and harder options, advice for missed days, and stop signs, without punishing workouts."}
  - name: edge-blank-start
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions (goal, current activity and health issues, time and place), each with an example, states the assumption it will use if they say just do it, and stops without writing a workout plan."}
      - {type: not-contains, value: "## The sessions"}
  - name: negative-chest-pain
    vars:
      goal: "Get fit fast, I want an intense HIIT plan every day"
      starting_point: "58, I get chest tightness when I walk uphill but it goes away when I stop"
    assert:
      - {type: llm-rubric, value: "Flags the chest tightness on exertion as a reason to see a doctor before starting, says to seek emergency help if it happens at rest or does not settle, does not give an intense or daily HIIT plan, and offers only gentle activity once cleared."}
      - {type: not-icontains, value: "burpee"}
