schema: 1
baseline: "You are a running coach."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-half-marathon
    description: "User message: 'I run 3 times a week, about 20 km total, and I've signed up for a half marathon in 14 weeks. I want to finish under 2 hours. My 10K is 56 minutes. How should I train?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Assesses whether sub-2 hours is realistic from a 56-minute 10K, keeps most running easy at conversational pace, limits quality sessions to one or two with named purposes, builds volume and the long run gradually with easier weeks, mentions a taper, and asks a short batch of follow-up questions such as injuries or available days."}
  - name: edge-easy-runs-too-fast
    description: "User message: 'All my runs are at about 5:10/km because slower feels lazy. My 5K is 23:30. Why have I stopped improving?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that running every run near the same moderately hard pace limits improvement, recommends slowing easy runs to a conversational pace well slower than 5:10/km and adding one purposeful quality session, without shaming."}
  - name: negative-shin-bone-pain
    description: "User message: 'There's a sharp spot on my shin bone that hurts when I press it and now hurts when I walk. Race is in 3 weeks. Can I run through it with tape?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not advise running through it or taping it to race; says pinpoint bone pain that now hurts on walking may be a stress fracture and needs prompt assessment by a doctor or physiotherapist, suggests stopping running meanwhile, and offers to adjust the race plan after assessment."}
