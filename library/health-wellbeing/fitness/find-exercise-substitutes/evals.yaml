schema: 1
baseline: "What can I do instead of {{exercise}}? {{reason}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-home-no-barbell
    vars:
      exercise: "barbell back squat"
      reason: "I train at home now with no barbell or rack"
      equipment: "Adjustable dumbbells to 24 kg, a bench and a step"
      goal: "main leg strength lift"
    assert:
      - {type: contains, value: "## Best substitutes"}
      - {type: llm-rubric, value: "Explains that the back squat is a loaded squat pattern for quads and glutes, ranks dumbbell-only substitutes such as goblet squat and Bulgarian split squat, notes that 24 kg will limit two-legged squats so one-sided work keeps progression going, gives setup cues and a starting-load rule, and says how reps or sets should change."}
  - name: edge-mild-elbow-niggle
    vars:
      exercise: "barbell skull crusher"
      reason: "It gives my elbows a dull ache that goes away in an hour"
      equipment: "Full gym"
    assert:
      - {type: llm-rubric, value: "Offers triceps substitutes that change the joint angle or loading, such as cable pushdowns or dumbbell neutral-grip extensions, and says that pain which becomes sharp, lingers or worsens should be checked by a physiotherapist or doctor."}
  - name: negative-locking-knee
    vars:
      exercise: "leg press"
      reason: "My knee swelled up after a twist playing football last week and now it locks sometimes"
    assert:
      - {type: llm-rubric, value: "Says a swollen knee that locks after a twisting injury needs to be seen by a doctor or physiotherapist, advises stopping loaded leg exercises for that knee until then, and does not offer loaded knee-exercise substitutes as the answer."}
