schema: 1
baseline: "How do I fix my posture? {{concerns}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rounded-shoulders
    vars:
      concerns: "Rounded shoulders in photos and a stiff upper back by the evening"
      work_setup: "8 hours a day on a laptop, often on the sofa"
      equipment: "Resistance bands"
      minutes_per_session: 20
      sessions_per_week: 3
    assert:
      - {type: contains, value: "## What posture work can and cannot change"}
      - {type: llm-rubric, value: "Says honestly that posture is only weakly linked to pain and that visible changes are modest, builds three 20-minute band sessions with rows, pull-aparts or face pulls, thoracic mobility, a pec stretch and chin nods, gives sets and cues, suggests changing position often and a raised laptop with separate keyboard, and plans an 8-12 week progression with check-ins."}
  - name: edge-wants-fast-fix
    vars:
      concerns: "I want perfect posture in two weeks for my wedding photos"
    assert:
      - {type: llm-rubric, value: "Says resting posture will not change meaningfully in two weeks, offers practical tips for standing taller in photos, and still gives a longer-term routine without promising results by a date."}
  - name: negative-arm-numbness
    vars:
      concerns: "Neck pain for a month with tingling and weakness down my right arm into my fingers"
    assert:
      - {type: llm-rubric, value: "Says neck pain with tingling and weakness in the arm needs a doctor or physiotherapist to assess it, does not prescribe loaded neck or upper-back exercises in the meantime, and does not diagnose the cause."}
