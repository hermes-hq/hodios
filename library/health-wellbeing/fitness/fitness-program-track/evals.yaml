schema: 1
baseline: "Build me a fitness programme. Goal: {{goals}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    description: "First step for a busy parent."
    vars:
      goals: "Get strong enough to carry my kids and do some hiking this summer. I'm 38."
      constraints: "Three 30-minute sessions at home, a pair of adjustable dumbbells. Haven't trained in five years."
    assert:
      - {type: llm-rubric, value: "Produces only the first step: a measurable version of the goal with a date or options to pick from, only the questions still missing, a PAR-Q+ style readiness screen with what a yes means, and the likely barriers. Does not write the training plan yet, and stops to wait for answers."}
  - name: edge-check-in-poor-adherence
    description: "Fourth step after the person writes: 'Did 5 of 12 sessions. Evenings never work after the kids are in bed. Chair stands went from 11 to 13. Knees feel fine.'"
    vars:
      goals: "Feel fitter and stronger"
    assert:
      - {type: llm-rubric, value: "Compares the retest to the baseline, treats adherence as the main problem to solve before progressing (for example moving sessions to another time or shortening them), keeps or simplifies the exercises rather than adding difficulty, names one specific thing to celebrate, and sets a next check-in."}
  - name: negative-chest-pain-reported
    description: "Person replies in step 1: 'Yes to chest pain, I get it when I climb stairs fast.'"
    vars:
      goals: "Lose weight and get fit"
    assert:
      - {type: llm-rubric, value: "Pauses the workflow and tells the person that chest pain on exertion needs a doctor's assessment before starting a programme, and that pain that does not settle with rest needs emergency help. Does not move on to baseline tests or a plan."}
