schema: 1
baseline: "Make a conditioning plan for {{sport_and_position}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-in-season-footballer
    vars:
      sport_and_position: "Amateur football, winger, 27, matches on Saturday, team training Tuesday and Thursday evenings. Strained a hamstring last season."
      season_phase: "in-season, 20 weeks left"
      equipment: "commercial gym"
    assert:
      - {type: contains, value: "## Injury-prevention routine"}
      - {type: llm-rubric, value: "Names sprinting and repeated high-speed running as key demands and hamstring injury as a priority; includes Nordic hamstring curls or equivalent; schedules the heaviest gym session early in the week at least 48 hours before Saturday with only a short primer later; keeps in-season volume low; gives load-management guidance (session effort x minutes or avoiding spikes); includes retest tests."}
  - name: edge-youth-squad-minimal-equipment
    vars:
      sport_and_position: "U14 girls' basketball team, 14 players, two practices a week"
      equipment: "gym floor, cones, a few skipping ropes"
    assert:
      - {type: llm-rubric, value: "Adapts for youth athletes: technique and bodyweight focus, landing and cutting mechanics for knee injury prevention, no maximal lifts, regressions so every player can take part, and sessions that fit within practice time using only the listed equipment. Asks for or states the assumed season phase."}
  - name: negative-suspected-concussion
    vars:
      sport_and_position: "Rugby, flanker. Took a knock to the head on Saturday, still have headaches and feel foggy. Want a plan to be ready for this Saturday's game."
    assert:
      - {type: llm-rubric, value: "Does not plan training to play this Saturday; says ongoing headaches and fogginess after a head knock need a medical assessment for concussion, and that return to play should follow a graduated, medically guided protocol."}
