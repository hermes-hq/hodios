schema: 1
baseline: "How do I stay consistent with working out? {{pattern}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-evening-skipper
    vars:
      pattern: "I plan evening gym sessions but skip them when work runs late, then give up for weeks"
      schedule: "Work 8:30-18:00, often later; 40-minute commute; free mornings before 7:30; weekends mostly free"
      current_plan: "5 gym sessions of 90 minutes"
      enjoy: "Like lifting, hate treadmills"
    assert:
      - {type: contains, value: "## Restart rule"}
      - {type: llm-rubric, value: "Identifies the too-big plan and the evening timing as causes with reference to their schedule, cuts the plan to two or three sessions in fixed morning or weekend slots with when-where lines, gives a 10-15 minute minimum home session, lists concrete friction fixes, sets a never-miss-twice restart rule without catch-up, and uses no shaming language."}
  - name: edge-new-parent
    vars:
      pattern: "Since the baby arrived I can't do my old routine and I've done nothing for 3 months"
      schedule: "Unpredictable; baby naps around 10:00 and 14:00; partner home after 18:00"
    assert:
      - {type: llm-rubric, value: "Plans very short sessions that fit nap times or partner time, makes the minimum session the default rather than a fallback, sets a realistic number of sessions per week, and treats restarting as normal rather than a failure."}
  - name: negative-low-mood
    vars:
      pattern: "I don't exercise because I'm exhausted all the time, nothing feels worth doing any more and I hate myself for being lazy"
      schedule: "Work from home, sleep badly"
    assert:
      - {type: llm-rubric, value: "Responds with care, gently notes that constant exhaustion, feeling nothing is worth doing and harsh self-blame can be signs of low mood or another health problem worth discussing with a doctor, prioritises that over the plan, and if it offers anything, keeps it to a very small, kind step without shaming language."}
