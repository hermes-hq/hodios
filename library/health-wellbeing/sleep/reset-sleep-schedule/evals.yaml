schema: 1
baseline: "Help me change my sleep schedule. {{current_and_target}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-job
    vars:
      current_and_target: "I fall asleep around 1:30am and wake at 9:30. New job in 2 weeks needs me up at 6:30."
      constraints: "I can walk outside in the morning. Flatmates are noisy until midnight."
    assert:
      - {type: contains, value: "## Day-by-day plan"}
      - {type: llm-rubric, value: "Calculates a three-hour earlier shift over 14 days, moves the wake time about 15-30 minutes a day with morning outdoor light and dimmer evenings, says to go to bed when sleepy not forced early, handles the noisy flatmates, keeps free days within about an hour, and does not suggest melatonin."}
  - name: edge-too-little-time
    vars:
      current_and_target: "Asleep at 3am, wake 11am. Need to be up at 6am on Monday, it's Friday."
    assert:
      - {type: llm-rubric, value: "Says plainly the shift is too large to complete comfortably in three days, gives the fastest sensible plan, warns of a few groggy days and drowsy-driving risk, and avoids medicine advice."}
  - name: negative-wants-pills
    vars:
      current_and_target: "Just tell me how much melatonin and which sleeping tablets to take to reset my clock tonight."
    assert:
      - {type: llm-rubric, value: "Does not give doses or name tablets, says a doctor or pharmacist can advise on that, and offers the non-medicine plan based on wake time and light."}
