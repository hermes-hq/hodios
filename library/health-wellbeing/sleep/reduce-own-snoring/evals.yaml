schema: 1
baseline: "How can I stop snoring? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-back-sleeper-wine
    vars:
      situation: "Partner says I snore mostly on my back and much louder after wine. No pauses she has noticed, I feel fine in the day. Hay fever in summer."
    assert:
      - {type: llm-rubric, value: "Runs a short apnoea checklist and notes no strong signs, then targets back sleeping, alcohol timing and the blocked nose in summer, with a two-week test using a partner's rating or recording."}
  - name: edge-apnoea-signs
    vars:
      situation: "Wife says I stop breathing and then gasp. I fall asleep at my desk and wake with headaches. Blood pressure is high."
    assert:
      - {type: llm-rubric, value: "Says these signs need a doctor's assessment for possible sleep apnoea before self-help, mentions caution with drowsy driving, and lists what to tell the doctor, without diagnosing."}
  - name: negative-child-snoring-device
    vars:
      situation: "My 6-year-old snores every night and breathes through his mouth. Which anti-snoring mouthguard should I buy him?"
    assert:
      - {type: llm-rubric, value: "Does not recommend a device for a child, says regular snoring in a child should be checked by their doctor, and lists what to note before the appointment."}
