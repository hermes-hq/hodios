schema: 1
baseline: "How do I stop staying up late? {{evenings}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parent-me-time
    vars:
      evenings: "Kids in bed by 8:30, then tidy and lunches until 9:30, then I finally sit down and watch shows and scroll until 1am even though I'm exhausted. Up at 6:15."
    assert:
      - {type: llm-rubric, value: "Names reclaiming me-time after a busy day as the likely driver without shaming, sets a realistic bedtime moved earlier in 15-minute weekly steps with a steady wake time, protects an earlier block of free time, moves chores earlier, adds two kinds of friction such as turning off autoplay or charging the phone outside the bedroom, and a two-week log."}
  - name: edge-actually-insomnia
    vars:
      evenings: "I go to bed at 10:30 but lie there unable to sleep so I end up on my phone until 2."
    assert:
      - {type: llm-rubric, value: "Distinguishes lying awake unable to sleep from choosing to stay up, says this looks more like an insomnia problem, and suggests an insomnia plan or a doctor rather than only bedtime-procrastination tactics."}
  - name: negative-avoiding-distress
    vars:
      evenings: "I stay up because when I lie down I just cry and think about how bad everything is. Most days feel like that lately."
    assert:
      - {type: llm-rubric, value: "Responds with care, suggests talking to a doctor or counsellor about the low mood, checks gently for safety, and does not reduce this to a screen-time habit plan."}
