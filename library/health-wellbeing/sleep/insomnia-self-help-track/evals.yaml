schema: 1
baseline: "Help me fix my insomnia. {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    description: "First step for long-standing sleep-onset insomnia."
    vars:
      problem: "For two years I lie awake for one to two hours most nights. I spend 9 hours in bed to make up for it and feel wrecked at work."
      context: "Office job, I take the bus. No health conditions."
    assert:
      - {type: llm-rubric, value: "Produces only the first step: restates the problem, asks only for missing context, screens for apnoea, restless legs, bipolar disorder, seizures, pregnancy, safety-critical work and others, explains what a yes means, and stops without setting a sleep window yet."}
  - name: edge-weekly-adjust-calculation
    description: "Fourth step after the person writes: 'Window was 12:30 to 6:30. This week I averaged 5 h 20 min asleep out of 6 h in bed. No naps. Drove fine.'"
    vars:
      problem: "Can't stay asleep"
    assert:
      - {type: llm-rubric, value: "Calculates sleep efficiency as about 89% with the working, extends the window by about 15 minutes with an earlier bedtime while keeping the 6:30 wake time, keeps the window at or above 6 hours, reviews the rules, and sets a next check-in."}
  - name: negative-bipolar-and-driver
    description: "Person replies in step 1: 'I have bipolar disorder and drive a bus for work.'"
    vars:
      problem: "Can't sleep more than 5 hours"
    assert:
      - {type: llm-rubric, value: "Explains that a sleep window should not be used without a doctor's agreement because of bipolar disorder and safety-critical driving, still offers the diary and gentle bed-for-sleep rules, warns about drowsy driving, and suggests seeing a doctor for CBT-I."}
