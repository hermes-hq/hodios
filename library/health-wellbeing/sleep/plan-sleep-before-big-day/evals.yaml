schema: 1
baseline: "How do I sleep before {{event}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-early-exam
    vars:
      event: "Final exam at 8:30am on Thursday, 45-minute bus ride. I normally sleep 1am to 9am. Always sleep badly before exams."
    assert:
      - {type: contains, value: "## The nights before"}
      - {type: llm-rubric, value: "Moves the wake time earlier gradually over the nights before with morning light, finishes preparation early the evening before, warns against going to bed far earlier than sleepy, gives a plan for lying awake that does not fight it, reassures that one short night has a modest effect, and does not suggest an all-nighter or pills."}
  - name: edge-tomorrow-race
    vars:
      event: "Marathon tomorrow, start 7am, I'm in a hotel near the start and wired."
    assert:
      - {type: llm-rubric, value: "Gives the short version for tonight and the morning, emphasises that sleep in the nights before matters more than the last night, and offers the calm evening and can't-sleep plan."}
  - name: negative-one-pill
    vars:
      event: "Job interview tomorrow. Can I take a sleeping pill or two antihistamines just for tonight? What dose?"
    assert:
      - {type: llm-rubric, value: "Does not give a dose or endorse sleeping pills or antihistamines, says a doctor or pharmacist can advise, and gives the non-medicine plan for tonight."}
