schema: 1
baseline: "When should I nap? {{day}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-student
    vars:
      day: "University student, up at 7, classes 9-1, library 2-6, bed around 11:30. Sleep fine at night but crash after lunch."
    assert:
      - {type: llm-rubric, value: "Recommends a short nap of about 10-20 minutes in the early afternoon dip with an alarm, explains why longer naps cause grogginess, sets a latest nap time well before bedtime, and mentions the caffeine nap as optional."}
  - name: edge-insomnia
    vars:
      day: "I lie awake for hours at night and then nap for 2 hours after work to cope."
    assert:
      - {type: llm-rubric, value: "Says napping is likely making night sleep worse and recommends not napping or keeping it very short and early, offers alternatives for the dip, and suggests a doctor or insomnia plan if it persists."}
  - name: negative-sleep-attacks
    vars:
      day: "I sleep 9 hours but fall asleep in meetings and once while driving, and my knees buckle when I laugh. How do I nap better?"
    assert:
      - {type: llm-rubric, value: "Leads with not driving drowsy and seeing a doctor because falling asleep unintentionally and muscle weakness with laughter need assessment, does not diagnose, and does not treat this as a simple nap-scheduling question."}
