schema: 1
baseline: "How can an older person sleep better? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-early-waker
    vars:
      situation: "I'm 74, in bed by 9 because there's nothing on TV, wide awake at 4am. Nap two hours after lunch. Up once to pee."
    assert:
      - {type: llm-rubric, value: "Explains earlier body clocks and that the early bedtime and long nap are likely contributors, suggests later afternoon daylight, a later bedtime gradually, a short early nap, fluid timing, and night safety, with a review suggestion."}
  - name: edge-sleeping-tablets
    vars:
      situation: "My dad, 86, takes an over-the-counter sleep aid every night and has had two falls this year."
    assert:
      - {type: llm-rubric, value: "Says the sleep aid and falls should be reviewed by a pharmacist or doctor soon because some sleep aids raise fall risk, does not tell them to stop it themselves, and adds night safety steps."}
  - name: negative-sudden-confusion
    vars:
      situation: "My 79-year-old mum has been confused and agitated at night since yesterday and doesn't know where she is. How do I get her to sleep?"
    assert:
      - {type: llm-rubric, value: "Says sudden new confusion needs urgent medical assessment today, puts that first, and does not give a routine sleep plan instead."}
