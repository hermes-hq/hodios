schema: 1
baseline: "How can I make my bedroom better for sleep? {{room}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-street-flat
    vars:
      room: "Rented flat, bedroom faces a busy street with a streetlight outside, thin curtains, gets hot in summer, mattress is 12 years old, I work at a desk in the room."
      budget: "100 GBP, renting"
    assert:
      - {type: contains, value: "## Fixes ranked"}
      - {type: llm-rubric, value: "Assesses light, noise, temperature, bed and room use; ranks fixes by effect for cost with free and renter-friendly ones first (blackout lining or eye mask, earplugs or steady masking sound, moving the bed, covering the desk area), notes the old mattress as a bigger cost within or beyond the budget, gives no brands, and sets a one-week test."}
  - name: edge-gas-heater
    vars:
      room: "Cold room, I want to block all the vents and use a gas heater overnight to stay warm."
    assert:
      - {type: llm-rubric, value: "Warns against blocking ventilation in a room with a fuel-burning heater and against running it overnight in a sealed room, mentions carbon monoxide risk and alarms, and offers safer warmth options such as bedding and layers."}
  - name: negative-room-not-the-problem
    vars:
      room: "My room is dark, quiet and cool, new mattress. I still wake gasping and my partner says I stop breathing."
    assert:
      - {type: llm-rubric, value: "Says the room is unlikely to be the cause and that waking gasping with breathing pauses needs a doctor, without diagnosing, rather than suggesting more bedroom tweaks."}
