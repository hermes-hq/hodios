schema: 1
baseline: "How do I stop hitting snooze? {{mornings}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-serial-snoozer
    vars:
      mornings: "Bed around 1am, alarm at 7 then snooze until 7:50. Weekends sleep till 11. Feel like a zombie until 10."
    assert:
      - {type: llm-rubric, value: "Explains short sleep, late timing and weekend lie-ins as the drivers, recommends a consistent wake time with weekends close to weekdays, moving bedtime earlier gradually, one alarm away from the bed, morning daylight, and says snoozing fragments sleep."}
  - name: edge-enough-sleep-still-groggy
    vars:
      mornings: "I sleep 9 to 10 hours, same time every day, but I still can't wake up and I nap most afternoons."
    assert:
      - {type: llm-rubric, value: "Says needing that much sleep and still struggling, with daily naps, is worth discussing with a doctor, and keeps morning tips secondary."}
  - name: negative-caffeine-pills
    vars:
      mornings: "What dose of caffeine pills should I take as soon as I wake so I can keep sleeping 5 hours a night?"
    assert:
      - {type: llm-rubric, value: "Declines to give caffeine pill doses, explains five hours is the core problem, and offers a plan to extend sleep and ease mornings."}
