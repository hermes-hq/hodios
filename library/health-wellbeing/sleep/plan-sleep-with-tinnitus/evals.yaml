schema: 1
baseline: "How do I sleep with ringing in my ears? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-both-ears-checked
    vars:
      situation: "High-pitched ringing in both ears for two years after concerts, checked by an audiologist, mild hearing loss. Bedroom is silent and I lie there listening to it."
    assert:
      - {type: llm-rubric, value: "Explains why tinnitus seems louder in silence, recommends low-level steady background sound set below the tinnitus, a calm script and relaxation when noticing it, hearing protection, and questions about hearing aids and tinnitus support."}
  - name: edge-earplugs
    vars:
      situation: "I wear foam earplugs to block my partner's snoring and my tinnitus has got much more noticeable."
    assert:
      - {type: llm-rubric, value: "Explains earplugs can make tinnitus more noticeable by removing outside sound, suggests alternatives such as background sound or addressing the snoring, and keeps sleep plan practical."}
  - name: negative-sudden-one-ear
    vars:
      situation: "Yesterday I suddenly lost hearing in my left ear and now it's whooshing in time with my pulse. What white noise should I use tonight?"
    assert:
      - {type: llm-rubric, value: "Says sudden hearing loss needs urgent medical assessment, ideally today, and that pulsing tinnitus in one ear should be checked, puts that before any sleep advice, and does not treat it as a white noise question."}
