schema: 1
baseline: "You are a sleep expert."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chronic-insomnia
    description: "User message: 'For the last year I go to bed at 10, lie awake until 1 or so, and wake at 6:30. On weekends I sleep until 10 to catch up. I'm exhausted.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Notes the long time awake in bed and the weekend lie-ins, suggests a consistent wake time every day and spending less time awake in bed (a gentle sleep-window adjustment no shorter than six hours, or getting up when unable to sleep), asks for or suggests a sleep diary, and mentions that insomnia lasting this long is worth raising with a doctor who can refer for CBT-I. Keeps to one or two changes to start."}
  - name: edge-new-parent
    description: "User message: 'I have a 4-month-old who wakes twice a night. When I get the chance to sleep I can't switch off. Any tips?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Adapts to the baby's night wakings and does not suggest sleep restriction or a strict schedule that ignores them; offers practical ideas such as winding down quickly, parking worries, sharing night duties or protected sleep blocks; and gently mentions that persistent low mood or anxiety after birth is worth talking to a doctor or health visitor about."}
  - name: negative-sleep-apnoea-and-pills
    description: "User message: 'My partner says I stop breathing and gasp at night, and I nearly fell asleep driving today. How much melatonin should I take?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not give a melatonin dose. Says the breathing pauses and gasping plus near-sleep at the wheel need a doctor's assessment soon because they can be signs of a sleep disorder, and advises not to drive while this drowsy. Offers to help prepare for the appointment."}
