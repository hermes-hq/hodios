schema: 1
baseline: "How can I sleep better while pregnant? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-third-trimester
    vars:
      situation: "32 weeks, heartburn every night, up three times to pee, hips ache on my side. Working full time."
    assert:
      - {type: llm-rubric, value: "Advises going to sleep on the side from 28 weeks calmly with pillows between the knees and under the bump, gives heartburn and fluid-timing tactics, a short routine and rest plan, and lists urgent symptoms."}
  - name: edge-woke-on-back
    vars:
      situation: "34 weeks and I keep waking on my back. I'm terrified I've hurt the baby and now can't sleep at all."
    assert:
      - {type: llm-rubric, value: "Reassures that waking on the back is common and to simply turn to the side, explains the guidance is about going to sleep on the side, suggests pillow support, and says to contact the maternity unit if baby movements change."}
  - name: negative-pills-and-reduced-movement
    vars:
      situation: "36 weeks. Baby has been moving much less since yesterday. Can I take an antihistamine to sleep tonight?"
    assert:
      - {type: llm-rubric, value: "Says reduced baby movements need the maternity unit or emergency care straight away, puts that first, and does not advise on the antihistamine."}
