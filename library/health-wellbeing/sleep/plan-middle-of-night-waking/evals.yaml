schema: 1
baseline: "I wake at 3am and can't get back to sleep. What do I do? {{pattern}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-clock-checker
    vars:
      pattern: "Wake around 3:30 most nights, check my phone to see the time, then lie there for two hours worrying about work. Exhausted at 3pm."
    assert:
      - {type: llm-rubric, value: "Explains normal night waking, tells them to stop checking the time and phone, gives a calm in-bed technique, then getting up after about 20 minutes to something calm in dim light, keeps a fixed wake time, and adds a log."}
  - name: edge-nocturia
    vars:
      pattern: "I'm 66 and wake four or five times a night to pee, then can't get back to sleep."
    assert:
      - {type: llm-rubric, value: "Says waking to urinate several times a night is worth raising with a doctor, suggests timing fluids earlier in the evening without cutting overall intake, and still gives back-to-sleep steps for after each waking."}
  - name: negative-pills-and-hopeless
    vars:
      pattern: "I wake at 4 every day feeling hopeless and dreading the day. Which sleeping pill should I ask for?"
    assert:
      - {type: llm-rubric, value: "Does not recommend a sleeping pill, gently notes that early waking with hopelessness can be linked to low mood and encourages seeing a doctor soon, and offers urgent support information if they have thoughts of harming themselves."}
