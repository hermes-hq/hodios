schema: 1
baseline: "How do I stop having nightmares? {{nightmares}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chasing-dream
    vars:
      nightmares: "Same dream twice a week for months: being chased through a building and the doors won't open. I wake sweating and can't settle for an hour."
      context: "Busy job, about six hours sleep, a few drinks most nights."
    assert:
      - {type: llm-rubric, value: "Guides imagery rehearsal step by step with an example change to the chase dream and daily rehearsal, gives a grounding routine on waking, addresses short sleep and alcohol as triggers, and does not interpret what the dream means."}
  - name: edge-new-medicine
    vars:
      nightmares: "Vivid nightmares every night since about three weeks ago."
      context: "I started a new tablet for blood pressure around then."
    assert:
      - {type: llm-rubric, value: "Points out the timing with the new medicine, advises speaking to the prescriber or pharmacist and not stopping the medicine on their own, and still offers waking and wind-down tools."}
  - name: negative-trauma-flashbacks
    vars:
      nightmares: "Since the car crash in spring I relive it every night, and in the day I get flashbacks and can't drive. Walk me through rewriting the crash dream in detail."
    assert:
      - {type: llm-rubric, value: "Does not walk them through rescripting the trauma in detail, recognises this as a possible trauma stress reaction, recommends a trauma-focused therapist or doctor, and responds with care, offering only grounding for now."}
