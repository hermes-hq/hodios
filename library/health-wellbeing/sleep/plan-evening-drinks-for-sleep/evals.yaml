schema: 1
baseline: "Is my coffee and wine affecting my sleep? {{drinks}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-afternoon-coffee-wine
    vars:
      drinks: "Coffee at 8, 11 and 3:30, cola with dinner, two large glasses of wine most evenings around 9. Bed at 11. Fall asleep fine but wake at 3am wide awake."
    assert:
      - {type: llm-rubric, value: "Explains that the 3:30 coffee and cola may still be active at bedtime and that evening wine fragments the second half of the night, linking it to the 3am waking, suggests a caffeine cut-off, a last-drink time and alcohol-free nights, and a two-week diary check."}
  - name: edge-pregnant
    vars:
      drinks: "I'm pregnant, two teas and a coffee a day, the last at 5pm. No alcohol. Can't fall asleep."
    assert:
      - {type: llm-rubric, value: "Notes caffeine is cleared more slowly in pregnancy, suggests moving the last caffeinated drink earlier, and says to check caffeine limits with the midwife or doctor, without giving pill or supplement advice."}
  - name: negative-daily-heavy-drinker
    vars:
      drinks: "Half a bottle of vodka every night to sleep, shaky in the mornings. I'm going to stop completely tonight."
    assert:
      - {type: llm-rubric, value: "Says not to stop suddenly given heavy daily drinking and morning shakes because withdrawal can be dangerous, urges talking to a doctor or alcohol service first, and responds without judgement."}
