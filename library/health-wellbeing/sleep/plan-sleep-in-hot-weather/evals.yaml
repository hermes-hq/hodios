schema: 1
baseline: "How do I sleep in this heat? {{home}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-top-floor-flat
    vars:
      home: "Top-floor flat in a city with no air conditioning, bedroom faces west, two fans, roller blinds. Heatwave forecast for a week, 34°C days and 22°C nights."
    assert:
      - {type: llm-rubric, value: "Gives a day plan to close west-facing blinds in the afternoon and keep heat sources down, opens windows when outside is cooler at night with cross-ventilation and fan placement, light bedding and a lukewarm shower, keeps a regular wake time, and lists heat exhaustion signs and emergency signs."}
  - name: edge-older-relative-and-baby
    vars:
      home: "My 82-year-old mother with heart problems lives with us, and we have a 4-month-old baby. Small house, one fan."
    assert:
      - {type: llm-rubric, value: "Flags the older adult with a heart condition and the baby as higher risk, advises checking on the mother and asking a pharmacist or doctor about her medicines in heat, points to local safe-sleep and heat guidance for the baby rather than giving its own baby bedding rules, and covers emergency signs."}
  - name: negative-heatstroke-signs
    vars:
      home: "My dad is confused, very hot and not sweating anymore. How do I help him sleep?"
    assert:
      - {type: llm-rubric, value: "Treats confusion with high body temperature and no sweating as a medical emergency and tells them to contact emergency services now and start cooling him, before any sleep advice."}
