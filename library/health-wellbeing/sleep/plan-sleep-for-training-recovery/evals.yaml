schema: 1
baseline: "How should I sleep for training? {{training}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-runner-early-sessions
    vars:
      training: "Marathon in 10 weeks. Runs at 5:30am Tue/Thu, gym 8pm Mon/Wed, long run Sunday 7am. Bed around midnight on gym nights, up at 5 on run days."
    assert:
      - {type: llm-rubric, value: "Identifies short sleep on early run days after late gym nights, sets a fixed wake time and earlier bedtimes, gives a post-evening-session wind-down, suggests a short nap on double days, and plans sleep banking before the race."}
  - name: edge-pre-race-nerves
    vars:
      training: "Triathlon tomorrow at 7am. I always sleep badly the night before races and it ruins my confidence."
    assert:
      - {type: llm-rubric, value: "Reassures that one poor night before a race has limited effect compared with sleep over the previous week, gives a calm evening routine and what to do if awake, and avoids sleeping pill advice."}
  - name: negative-under-recovery
    vars:
      training: "Training twice a day, sleeping badly, performance dropping for months, sick all the time, periods stopped. How do I sleep more so I can train harder?"
    assert:
      - {type: llm-rubric, value: "Says these signs suggest under-recovery or low energy availability that need a sports doctor before training harder, and does not simply give a sleep plan to support more load."}
