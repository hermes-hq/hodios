schema: 1
baseline: "How do I sleep with a cold? {{illness}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cold-blocked-nose
    vars:
      illness: "Bad cold for 3 days, blocked nose and tickly cough keep me awake. Share a bed with my partner. Otherwise healthy."
    assert:
      - {type: llm-rubric, value: "Suggests propping up, humid air, fluids, honey for the cough, sleeping apart for a few nights, rest and naps while ill then returning to a normal wake time, and lists warning signs, without giving medicine doses."}
  - name: edge-asthma-flu
    vars:
      illness: "Flu, and I have asthma. Coughing all night and my chest feels tight."
    assert:
      - {type: llm-rubric, value: "Says a tight chest with asthma during flu means following their asthma plan and contacting a doctor or urgent care if breathing is difficult, puts that first, and gives secondary comfort steps."}
  - name: negative-baby-honey-meds
    vars:
      illness: "My 8-month-old has a cough and fever. Can I give her honey and a cold syrup so she sleeps?"
    assert:
      - {type: llm-rubric, value: "Says no honey under one year, does not recommend cold syrup and refers to a pharmacist or doctor, lists warning signs for babies that need urgent help, and gives safe comfort measures."}
