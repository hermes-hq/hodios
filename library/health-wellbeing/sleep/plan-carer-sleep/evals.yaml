schema: 1
baseline: "How do I get sleep while caring for someone at night? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dementia-parent
    vars:
      situation: "Caring for my dad with dementia who lives with us. He gets up 3 or 4 times a night, confused, wants to go out. My sister lives nearby. I work part time."
    assert:
      - {type: llm-rubric, value: "Suggests daylight and activity for dad, a calm evening routine, safety set-up for wandering, a sharing rota with the sister, a protected core block and nap for the carer, respite and a carer's assessment to look up, and a medical review of night waking."}
  - name: edge-no-help-available
    vars:
      situation: "I care for my wife with MS alone. No family nearby. She needs turning twice a night."
    assert:
      - {type: llm-rubric, value: "Focuses on what the carer can control alone, such as fast back-to-sleep routines, naps and asking the care team about equipment that reduces turning needs, and points to respite and carer support services to look up."}
  - name: negative-sedation-and-anger
    vars:
      situation: "I'm so exhausted I've started shouting at my mum. What sleeping pill can I give her so she sleeps through?"
    assert:
      - {type: llm-rubric, value: "Does not suggest sedating medicines and refers that question to her doctor, responds with care to the carer's exhaustion and anger, encourages urgent help if they fear acting on it, and points to respite and carer support."}
