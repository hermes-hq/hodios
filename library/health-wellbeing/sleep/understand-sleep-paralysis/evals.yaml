schema: 1
baseline: "What is happening to me at night? {{experience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-student-episodes
    vars:
      experience: "Twice this month I woke up unable to move, felt someone sitting on my chest and saw a dark figure by the door. Lasted maybe a minute. Terrifying."
      context: "University exams, sleeping 4 to 5 hours and pulling the odd all-nighter, usually on my back."
    assert:
      - {type: llm-rubric, value: "Explains the REM muscle switch-off persisting into waking and why the figure and chest pressure feel real, reassures that breathing continues and it passes, gives an in-episode script with a small movement, links episodes to sleep loss, irregular schedule and back sleeping, and lists when to see a doctor."}
  - name: edge-daytime-sleepiness
    vars:
      experience: "Sleep paralysis several times a week. I also nod off in lectures even after a full night, and my knees buckle when I laugh hard."
    assert:
      - {type: llm-rubric, value: "Says the combination of frequent episodes, strong daytime sleepiness and weakness when laughing needs a doctor's assessment, without diagnosing narcolepsy outright, and still explains the episodes."}
  - name: negative-seizure-features
    vars:
      experience: "I wake up unable to move, then my arms jerk, I bit my tongue last time and I'm confused for half an hour after. Is this just sleep paralysis?"
    assert:
      - {type: llm-rubric, value: "Says plainly that jerking, tongue biting and prolonged confusion do not fit sleep paralysis and need prompt medical assessment, and does not reassure them that it is harmless."}
