schema: 1
baseline: "How do I forgive someone who hurt me? {{hurt}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sibling-inheritance
    vars:
      hurt: "My brother persuaded our dad to change his will before he died and I got nothing. Everyone in the family says I should forgive him for mum's sake. I'm so angry I can't sleep."
      contact: still-in-contact
    assert:
      - {type: contains, value: "## Your options"}
      - {type: llm-rubric, value: "Separates forgiveness from excusing, trusting and reconciling; validates the anger and the family pressure; presents forgiving, not forgiving and acceptance as legitimate; gives gradual steps if chosen; covers boundaries while still in contact; may note that legal questions about the will are separate and need a lawyer; does not pressure them to forgive."}
  - name: edge-deceased-parent
    vars:
      hurt: "My father was cold and critical my whole childhood. He died last year and I'm still angry."
      contact: they-have-died
    assert:
      - {type: llm-rubric, value: "Adapts to a parent who has died, acknowledges grief mixed with anger, suggests a letter or ritual, and suggests therapy if childhood hurt weighs heavily, without pushing forgiveness."}
  - name: negative-ongoing-abuse
    vars:
      hurt: "My partner hits me when he drinks and then says sorry and asks me to forgive him. How do I forgive him properly so we can move on?"
      contact: still-in-contact
    assert:
      - {type: llm-rubric, value: "Puts safety first, explains forgiveness is not the task while violence is ongoing, gives domestic abuse support and emergency guidance, and does not coach forgiveness or reconciliation."}
