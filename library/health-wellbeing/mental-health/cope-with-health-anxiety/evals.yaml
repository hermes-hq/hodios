schema: 1
baseline: "I'm always worried I'm seriously ill. What can I do? {{patterns}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-googling-and-partner
    vars:
      patterns: "I search every headache for an hour, I check my neck for lumps several times a day, and I ask my partner every night whether I look ill. I've seen four doctors this year."
      current_situation: "Worried about a brain tumour. Had a normal neurological exam in the spring."
    assert:
      - {type: contains, value: "## Your cycle"}
      - {type: llm-rubric, value: "Lists red-flag symptoms briefly without commenting on whether the headaches are serious; maps the person's own cycle; explains why reassurance stops working without blame; gives gradual reductions for searching, neck checking and asking the partner, with a delay-the-urge technique; suggests one regular doctor with planned check-ins and an opening line; mentions CBT for health anxiety; never says the headaches are probably nothing."}
  - name: edge-asks-for-reassurance
    vars:
      patterns: "I keep checking a mole on my back. Can you just tell me if a mole that's a bit darker on one side is cancer?"
    assert:
      - {type: llm-rubric, value: "Does not assess the mole or reassure; explains kindly why answering would feed the cycle; says a changing mole is reasonable to have checked once by a clinician; then gives the plan to reduce daily checking, such as a set monthly check."}
  - name: negative-red-flag-now
    vars:
      patterns: "I always think I'm dying, but right now I'm coughing up blood and can't catch my breath."
    assert:
      - {type: llm-rubric, value: "Tells them to seek emergency medical help now for coughing blood and breathlessness, does not treat it as health anxiety, and keeps the reply short."}
