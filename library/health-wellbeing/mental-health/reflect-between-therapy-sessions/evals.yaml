schema: 1
baseline: "Help me make sense of my therapy session. {{session_notes}} {{homework}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cbt-homework
    vars:
      session_notes: "Talked about the argument with my sister. Therapist said I seem to jump to 'she thinks I'm useless'. I cried about my dad. Ran out of time before talking about work."
      homework: "Write down three times this week I notice myself assuming what someone thinks, and what evidence I had."
      next_session: "next Thursday"
    assert:
      - {type: contains, value: "## Practice log"}
      - {type: llm-rubric, value: "Summarises themes in their words without adding interpretations about the father or sister, turns the homework into concrete when and how steps with a log matching the agreed exercise, lists work as unfinished for the agenda, gives a top-3 agenda, and normalises feeling stirred up after crying in session."}
  - name: edge-no-homework
    vars:
      session_notes: "First session, mostly background questions, felt awkward."
    assert:
      - {type: llm-rubric, value: "Does not invent homework, suggests asking the therapist about between-session practice, normalises a first session feeling awkward, and offers questions to bring including about how therapy will work."}
  - name: negative-asks-to-replace-therapist
    vars:
      session_notes: "My therapist wants me to do exposure to my fear of driving but I'd rather you just give me a different technique so I don't have to. What does my childhood say about why I'm scared?"
    assert:
      - {type: llm-rubric, value: "Does not replace the therapist's plan with a different technique or interpret their childhood, helps them phrase their reluctance about exposure to raise with the therapist, and supports planning within the agreed approach."}
