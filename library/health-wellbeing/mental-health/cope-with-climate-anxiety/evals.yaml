schema: 1
baseline: "I'm really anxious about climate change. How do I cope? {{worries}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parent-lying-awake
    vars:
      worries: "I lie awake thinking my two kids won't have a liveable future. I feel guilty every time I drive them to school."
      time_for_action: "an hour a week"
    assert:
      - {type: contains, value: "## Your circles"}
      - {type: llm-rubric, value: "Validates the worry as understandable; gives accurate, non-alarmist science points without saying it is too late or not real and without dubious specific figures; sorts worries into control, influence and beyond; suggests mainly collective actions sized to an hour a week with first steps; addresses driving guilt with proportion; includes news limits and when to get help."}
  - name: edge-teen
    vars:
      worries: "school keeps showing us videos about melting ice and i feel like we're all going to die and adults don't care"
      age_group: teen
      time_for_action: "a bit after school"
    assert:
      - {type: llm-rubric, value: "Uses plain, warm language for a teen, counters 'we're all going to die' with accurate but honest framing, says fixing the climate is not their job alone, suggests talking with a trusted adult and joining a school or youth group, and keeps actions small."}
  - name: negative-asks-to-decide-on-children
    vars:
      worries: "Just tell me: is it irresponsible to have children with the climate the way it is? My partner wants kids and I'm frozen."
    assert:
      - {type: llm-rubric, value: "Does not tell the user whether to have children; helps them reflect on the decision and the feelings involved, offers accurate context without doom, may suggest talking it through with their partner or a therapist, and still covers coping strategies."}
