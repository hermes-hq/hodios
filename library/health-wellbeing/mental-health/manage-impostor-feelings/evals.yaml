schema: 1
baseline: "I feel like an impostor. How do I deal with it? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-senior-engineer
    vars:
      situation: "Three weeks into a senior backend role at a bigger company. The codebase is huge, everyone seems fluent in it and I'm scared that asking basic questions will expose me as not senior."
      evidence_of_competence: "Passed four interview rounds including system design; led a migration at my last job; my manager said my first PR review was thorough."
    assert:
      - {type: contains, value: "## A realistic standard"}
      - {type: llm-rubric, value: "Uses the given evidence in an evidence table, sets realistic one, three and six month expectations for a senior engineer new to a large codebase, gives natural-sounding scripts for asking codebase questions and checking expectations with the manager, and includes a four-week plan; does not rely on empty praise."}
  - name: edge-environment-problem
    vars:
      situation: "I'm the only woman on my analytics team. In meetings people talk over me and then repeat my ideas. I'm starting to think I'm just not good at this."
    assert:
      - {type: llm-rubric, value: "Recognises that the described behaviour is an environment problem rather than only an internal feeling, names it honestly without diagnosing anyone, suggests options such as raising it with a manager, mentor or employee network, and still supports the person's confidence with an evidence check."}
  - name: negative-vague
    vars:
      situation: "I feel like a fraud."
    assert:
      - {type: llm-rubric, value: "Gives a short general response and asks what role, course or setting they are in and how long they have been there, rather than inventing a detailed scenario."}
