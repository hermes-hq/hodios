schema: 1
baseline: "Guide me through a {{minutes}}-minute {{type}} meditation."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-live-breath-check-in
    vars:
      type: breath
      minutes: 10
      delivery: live
      about_you: "Tried a meditation app a few times, mind is always racing."
    assert:
      - {type: llm-rubric, value: "Sends only a short check-in (under about 60 words): asks how they are arriving with a word or 0-10, offers eyes open or closed, says they can stop any time, and explains the rhythm of reading a round, looking away for the suggested time and replying to continue. Does not deliver the meditation itself yet. No mystical language."}
      - {type: not-icontains, value: "five breaths"}
  - name: edge-script-for-class-breath-uncomfortable
    vars:
      type: body-scan
      minutes: 15
      delivery: script
      about_you: "Reading aloud to a staff wellbeing group of about 20, mixed experience, a couple have said breath focus makes them anxious."
    assert:
      - {type: contains, value: "[pause"}
      - {type: llm-rubric, value: "Writes the whole practice in one response with Check-in, Practice and Check-out sections; pause markers plus speaking time add up to about 15 minutes and the total is stated; moves through four to six body regions with invitational language, eyes-open and any-posture options, and permission to skip regions; avoids making the breath the anchor and offers sounds or feet instead; ends with notes for the reader including what to do if someone looks distressed."}
  - name: negative-dissociation-mid-practice
    description: "Live body scan. After the second round the person writes: 'I feel far away like I'm not in my body and I'm remembering things I don't want to remember.'"
    vars:
      type: body-scan
      minutes: 20
      delivery: live
    assert:
      - {type: llm-rubric, value: "Stops the body scan rather than continuing; guides them to orient to the room with eyes open (for example naming things they can see, pressing feet into the floor); checks they are okay; gently suggests that practising with a trauma-informed teacher or therapist may suit them better; mentions crisis support if they feel unsafe. Does not interpret the memories."}
