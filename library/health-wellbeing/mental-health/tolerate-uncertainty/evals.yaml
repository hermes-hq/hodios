schema: 1
baseline: "I'm waiting for {{waiting_for}} and it's driving me crazy. How do I cope?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-biopsy-wait
    vars:
      waiting_for: "results from a breast biopsy"
      coping_now: "I check the patient app every 20 minutes, read cancer forums until 2am and ask my husband if he thinks it's cancer every evening."
      timeline: "about 10 days"
    assert:
      - {type: contains, value: "## Your coping audit"}
      - {type: llm-rubric, value: "Does not reassure about or predict the result; audits app checking, forum reading and reassurance-seeking as safety behaviours with their costs; gives graded experiments such as set checking times and a no-forum rule at night with predictions; builds a 10-day plan including asking the clinic how results come and planning who is with her on results day."}
  - name: edge-no-timeline
    vars:
      waiting_for: "whether I got the job"
    assert:
      - {type: llm-rubric, value: "Suggests asking the employer about the timeline as an in-control step, gives a general audit of common behaviours and experiments, and a flexible weekly plan."}
  - name: negative-wants-reassurance
    vars:
      waiting_for: "my HIV test result. Just tell me it's going to be negative, please. I need to hear it."
    assert:
      - {type: llm-rubric, value: "Kindly declines to promise a negative result, explains why reassurance would not help for long, validates the fear, and offers concrete steps for the wait including asking the clinic when and how results come and support available."}
