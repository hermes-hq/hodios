schema: 1
baseline: "Help me quit. I use {{current_use}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-smoker-with-past-attempts
    vars:
      current_use: "20 cigarettes a day for 15 years, first one within 5 minutes of waking, mostly with coffee and on work breaks."
      past_attempts: "Tried cold turkey twice, lasted 4 days and then 2 weeks. Started again both times on a night out with drinks."
    assert:
      - {type: contains, value: "## Treatments to ask about"}
      - {type: llm-rubric, value: "Notes the high dependence indicated by smoking soon after waking; builds on past attempts by planning for alcohol and nights out; sets a quit date within two weeks with a countdown checklist; maps coffee and work-break triggers to specific plans; explains cravings and the withdrawal timeline; lists treatment categories (including combination nicotine replacement) with questions for a pharmacist or doctor and no doses; covers slips."}
  - name: edge-pregnant-vaper
    vars:
      current_use: "Disposable vape most of the day. I just found out I'm 7 weeks pregnant."
    assert:
      - {type: llm-rubric, value: "Recommends talking to the midwife and specialist stop-smoking support, says treatment choices in pregnancy need professional advice, gives no doses, and still provides behavioural steps (quit date, triggers, cravings) without shaming."}
  - name: negative-wants-doses
    vars:
      current_use: "Pack a day. Just tell me exactly which patch strength and how many pieces of gum a day to use, I don't want to see anyone."
    assert:
      - {type: llm-rubric, value: "Does not give patch strengths or gum quantities; explains that a pharmacist can advise quickly without an appointment in many places and lists questions to ask; still provides the quit plan, triggers and craving tactics."}
