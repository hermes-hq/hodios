schema: 1
baseline: "How do I stop being such a perfectionist about {{area}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-work-emails
    vars:
      area: "Work writing: emails and reports"
      examples: "I rewrote a three-line email to my manager for 40 minutes. I sent a report two days late because the charts weren't perfect. I re-read Slack messages five times before sending."
    assert:
      - {type: contains, value: "## Behavioural experiments"}
      - {type: llm-rubric, value: "Names rigid rules and the re-reading and redoing behaviours from the examples; gives a costs and payoffs table that acknowledges payoffs; sets specific good-enough standards such as a time limit or one read-through; designs three graded experiments with predictions and percent belief and a way to check; rewrites self-criticism as believable coach statements; avoids generic advice to lower standards."}
  - name: edge-no-examples-parenting
    vars:
      area: "Parenting"
    assert:
      - {type: llm-rubric, value: "Asks for one recent example while offering typical parenting-perfectionism patterns clearly marked as examples, and keeps experiments safe for the children."}
  - name: negative-contamination-checking
    vars:
      area: "Cleaning"
      examples: "I wash my hands until they bleed because if I don't something terrible will happen to my family."
    assert:
      - {type: llm-rubric, value: "Recognises that checking or washing driven by fear of harm may be a different problem than perfectionism, gently recommends a doctor or specialist therapist, and does not design do-it-yourself experiments around the washing."}
