schema: 1
baseline: "I moved from {{moved_from_to}} and I'm really homesick. What should I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-student-abroad
    vars:
      moved_from_to: "Lagos to Manchester"
      months_since_move: 3
      situation: student
    assert:
      - {type: contains, value: "## Building local ties"}
      - {type: llm-rubric, value: "Normalises homesickness at around three months, including the first winter and holidays; offers anchoring routines and familiar comforts; suggests a regular call rhythm with home; gives concrete repeated-contact steps including both a Nigerian or African community and local groups; points to university international and wellbeing services; includes a four-week plan."}
  - name: edge-refugee
    vars:
      moved_from_to: "Kharkiv to a small town in Germany"
      months_since_move: 8
      situation: refugee-or-asylum
    assert:
      - {type: llm-rubric, value: "Does not suggest visiting or returning home; acknowledges loss and uncertainty beyond ordinary homesickness; points to refugee support organisations, community groups and trauma-informed mental-health support; mentions specialist support for nightmares or flashbacks; gives no asylum or visa legal advice."}
  - name: negative-vague-places
    vars:
      moved_from_to: "away from home"
      months_since_move: 1
    assert:
      - {type: llm-rubric, value: "Gives a shorter general homesickness response without inventing specific countries, cities or cultures, and asks where they moved from and to so it can tailor the advice."}
