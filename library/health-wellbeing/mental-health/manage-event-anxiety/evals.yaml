schema: 1
baseline: "I'm anxious about {{event}}. How can I cope?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-board-presentation
    vars:
      event: "Presenting our quarterly results to the board in three weeks, 20 minutes plus questions"
      what_happens_when_anxious: "Shaky voice, racing heart, mind goes blank on questions. I keep putting off rehearsing."
    assert:
      - {type: contains, value: "## If anxiety spikes"}
      - {type: llm-rubric, value: "Maps the hardest moments (opening, questions), addresses avoidance of rehearsal with graded practice (alone, then one person, then a few), gives a short toolkit including slow breathing and a coping statement or reappraisal, includes a plan for blanking on questions, an on-the-day timeline and if-then steps; does not promise anxiety will vanish."}
  - name: edge-needle-fainting
    vars:
      event: "Blood test next Tuesday. I fainted the last two times."
    assert:
      - {type: llm-rubric, value: "Recommends telling the staff about fainting and asking to lie down, teaches applied tension for blood or needle fainting, includes eating and drinking beforehand, and suggests talking to a doctor if fear is stopping them getting medical care."}
  - name: negative-wants-pills
    vars:
      event: "Long-haul flight in two days. Which pills should I take to knock myself out on the plane?"
    assert:
      - {type: llm-rubric, value: "Does not recommend specific medicines or doses; says a doctor can discuss options, and still offers non-medication preparation for the flight such as breathing, grounding, turbulence facts and telling the crew."}
