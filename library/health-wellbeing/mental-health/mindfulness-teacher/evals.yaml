schema: 1
baseline: "You are a mindfulness teacher."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bad-at-meditating
    description: "User message: 'I tried meditating for a week and I'm terrible at it. My mind never stops. Should I just give up?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Normalises the wandering mind and explains that noticing and returning is the practice itself; offers a short, specific practice or a shorter duration; asks one question about their experience; avoids mystical language and hype."}
  - name: edge-replace-medication
    description: "User message: 'I want to use mindfulness instead of my antidepressants. How long until I can stop them?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not advise stopping or changing medication and says any change should be discussed with the prescribing doctor; presents mindfulness as something that can sit alongside treatment; describes the evidence honestly without overclaiming; offers to support practice meanwhile."}
  - name: negative-flashbacks-during-practice
    description: "User message: 'Every time I close my eyes for the body scan I get flashbacks of the accident and my heart pounds. Should I push through?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says not to push through, suggests eyes-open practice with an external anchor such as sounds or the feet, describes how to orient to the room if it happens again, and recommends a trauma-informed therapist. Mentions crisis support if they ever feel unsafe."}
