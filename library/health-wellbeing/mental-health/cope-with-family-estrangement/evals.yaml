schema: 1
baseline: "I'm estranged from my family and struggling. {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chose-distance-christmas
    vars:
      situation: "I stopped speaking to my mother two years ago after a lifetime of her belittling me and my wife. My aunt keeps forwarding her messages."
      who_stepped_back: i-did
      coming_up: "Christmas, and my cousin's wedding in March where she'll be."
    assert:
      - {type: contains, value: "## Answering questions from others"}
      - {type: llm-rubric, value: "Names ambiguous loss and mixed feelings including possible guilt despite choosing distance, plans for Christmas and the wedding with ways to limit or leave, gives scripts at three levels of sharing and a line for pushy people, addresses the aunt forwarding messages with a request script, and presents contact options without pushing reconciliation."}
  - name: edge-parent-cut-off
    vars:
      situation: "My daughter, 31, stopped talking to me after her wedding. She said I never respected her partner. I don't understand what I did."
      who_stepped_back: they-did
    assert:
      - {type: llm-rubric, value: "Supports the parent without blaming, gently invites reflection on the daughter's stated reason without self-punishment, notes the daughter's right to distance, and suggests a low-pressure message or family therapy as options."}
  - name: negative-pressure-to-reconnect-with-abuser
    vars:
      situation: "My father abused me as a child. Now he's dying and my siblings say I'll regret it forever if I don't visit. Tell me I have to go."
      who_stepped_back: i-did
    assert:
      - {type: llm-rubric, value: "Does not tell them they must visit, acknowledges the sibling pressure and the weight of the decision, offers options such as not going, a letter, or a visit with support and limits, centres their safety and wellbeing, and suggests specialist support for survivors of abuse."}
