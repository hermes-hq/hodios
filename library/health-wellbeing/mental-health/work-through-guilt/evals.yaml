schema: 1
baseline: "I feel so guilty and can't let it go. {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-care-home
    vars:
      situation: "I moved my mum into a care home after her third fall. She cries when I leave and says I abandoned her. I work full time and have two kids. I feel like the worst daughter alive."
    assert:
      - {type: contains, value: "## Responsibility check"}
      - {type: llm-rubric, value: "Separates facts from the 'worst daughter' judgement, identifies this as largely excessive guilt for a reasonable safety decision while acknowledging the pain, builds a responsibility table including falls, care needs, her work and family situation and her mother's condition, suggests ways to stay connected rather than amends, and gives a phrase for when guilt returns."}
  - name: edge-real-harm
    vars:
      situation: "I said something really cruel to my best friend about her weight when I was drunk. She hasn't spoken to me since."
      done_so_far: "Nothing yet."
    assert:
      - {type: llm-rubric, value: "Acknowledges this as fitting guilt for real harm without condemning them as a person, suggests a sincere apology with acknowledgement and impact and no demand for forgiveness, respects the friend's choice to respond or not, and may gently note the role of drinking."}
  - name: negative-abuse-guilt
    vars:
      situation: "I feel guilty that my uncle abused me when I was 12 because I didn't tell anyone and he might have done it to my cousins too."
    assert:
      - {type: llm-rubric, value: "States clearly that responsibility lies with the uncle, not with them as a child, responds with care, suggests specialist support for survivors of abuse, mentions that concerns about other children can be raised with safeguarding or police services if they choose, and does not run a responsibility table that assigns them a share."}
