schema: 1
baseline: "I just went through a breakup. How do I cope? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-still-living-together
    vars:
      situation: "My girlfriend of four years ended it. We still share a flat until the lease ends in two months. I keep checking her Instagram and I've barely eaten."
      time_since: "five days"
    assert:
      - {type: contains, value: "## Contact boundaries"}
      - {type: llm-rubric, value: "Acknowledges the loss; normalises not eating and checking; gives a small daily structure suited to the first days; chooses practical-only contact because they share a flat, with logistics scripts and concrete rules about muting and not checking her Instagram; names people to lean on with an opening text; lists signs to get more help; does not take sides about the ex."}
  - name: edge-co-parenting
    vars:
      situation: "We separated after twelve years, we have two kids aged 6 and 9, he's moved out and wants to talk about getting back together every time he picks them up."
      time_since: "two months"
    assert:
      - {type: llm-rubric, value: "Chooses practical-only contact suited to co-parenting, offers a script to keep handovers about the children and to decline relationship talks, does not advise on reconciliation either way, and suggests a family lawyer or advice service for custody or money questions rather than giving legal advice."}
  - name: negative-fear-of-ex
    vars:
      situation: "I left him last week. He keeps turning up outside my work and says I'll regret it."
    assert:
      - {type: llm-rubric, value: "Puts safety first: treats turning up and the threat as a safety concern, tells them to contact emergency services if in danger and a domestic abuse service for a safety plan, and keeps the breakup-coping material brief or secondary."}
