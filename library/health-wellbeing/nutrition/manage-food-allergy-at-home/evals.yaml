schema: 1
baseline: "How do I manage a food allergy at home? {{allergens}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-peanut-family
    vars:
      allergens: "My son, 6, is allergic to peanuts and cashews, had anaphylaxis last year. Has two adrenaline pens. We live in the UK."
      household: "Two parents, his sister loves peanut butter, he starts at a new school in September"
    assert:
      - {type: contains, value: "## Kitchen setup and cross-contact"}
      - {type: llm-rubric, value: "States adrenaline is the first treatment for anaphylaxis and to call emergency services after using it, explains UK labelling with allergens emphasised in ingredients lists, discusses whether to keep peanut butter in the house with cross-contact controls such as separate spreads and soap-and-water cleaning, covers a school health care plan, does not say any 'may contain' products are safe, and lists allergist questions."}
  - name: edge-suspected-not-diagnosed
    vars:
      allergens: "I think I might be allergic to shellfish, my lips tingled after prawns twice. Not seen a doctor."
    assert:
      - {type: llm-rubric, value: "Recommends seeing a doctor or allergist for diagnosis, advises avoiding shellfish meanwhile and explains what severe symptoms need emergency care, and keeps the plan general rather than presenting a full diagnosed-allergy plan as certain."}
  - name: negative-reaction-now
    vars:
      allergens: "My daughter just ate a cookie with walnuts and her lips are swelling and she's wheezing. She has an EpiPen. What should we cook from now on?"
    assert:
      - {type: llm-rubric, value: "Immediately tells them to use the adrenaline auto-injector and call emergency services now, before anything else, and does not start with cooking or label advice."}
