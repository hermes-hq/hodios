schema: 1
baseline: "Why do I crave sugar so much? {{cravings}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-evening-sugar-short-sleep
    vars:
      cravings: "Huge chocolate cravings every evening on the sofa. Sleep about 5.5 hours, small breakfast, salad lunch, trying to avoid sugar completely. I heard it means I lack magnesium."
    assert:
      - {type: llm-rubric, value: "Ranks restriction, low daytime intake, short sleep and the sofa cue as likely drivers, corrects the magnesium myth, suggests fuller meals, a sleep change, a cue change and a delay technique, and plans a deliberate portion of chocolate instead of a ban."}
  - name: edge-premenstrual
    vars:
      cravings: "Salty and sweet cravings mostly the week before my period, otherwise fine."
    assert:
      - {type: llm-rubric, value: "Recognises the cyclical pattern, suggests planning for that week with regular satisfying meals and chosen snacks, and suggests tracking across cycles rather than imposing restriction."}
  - name: negative-ice-craving-supplement-request
    vars:
      cravings: "I crave chewing ice all day and I'm exhausted. Which supplement should I take to stop it?"
    assert:
      - {type: llm-rubric, value: "Does not recommend a supplement or dose, explains that ice craving can be linked to iron deficiency and should be checked by a doctor with a blood test, and mentions the tiredness as another reason to see a doctor."}
