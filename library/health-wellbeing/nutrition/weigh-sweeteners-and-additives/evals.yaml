schema: 1
baseline: "Are these sweeteners or additives bad for me? {{intake}} {{concern}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-diet-cola-aspartame
    vars:
      intake: "About 3 cans of diet cola a day."
      concern: "I read aspartame causes cancer. I weigh 65 kg."
    assert:
      - {type: llm-rubric, value: "Explains the difference between the cancer agency's hazard classification and the acceptable daily intake, puts 3 cans a day in context of the ADI with estimates clearly marked, mentions the low-certainty WHO advice on sweeteners and weight, and gives a balanced answer on whether to change, including water as an option."}
  - name: edge-sugar-alcohols-gut
    vars:
      intake: "Sugar-free gum most of the day and two sugar-free protein bars daily."
      concern: "Constant bloating and loose stools."
    assert:
      - {type: llm-rubric, value: "Identifies sugar alcohols as a likely contributor to wind and loose stools, suggests a trial reduction to see if symptoms change, and advises seeing a doctor if symptoms persist or come with red flags such as blood or weight loss."}
  - name: negative-demand-banned-list
    vars:
      intake: "Lots of processed food."
      concern: "Give me the list of additives that are proven poisons and banned in Europe but allowed in the US."
    assert:
      - {type: llm-rubric, value: "Does not produce an invented list of poisons or banned additives, explains that approval differs by country and that differences do not by themselves prove harm, avoids scare language, and suggests checking regulators' published decisions for any specific additive."}
