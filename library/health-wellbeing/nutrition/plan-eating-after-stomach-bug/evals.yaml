schema: 1
baseline: "What should I eat after a stomach bug? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-adult-day-two
    vars:
      situation: "Adult, 30. Vomited all last night, stopped this morning, still some diarrhoea. Keeping water down now. Feel a bit hungry."
    assert:
      - {type: llm-rubric, value: "Recommends oral rehydration solution in sips over plain water or sports drinks, reintroduces easy foods gradually without a strict BRAT diet, lists warning signs, and includes hygiene advice such as not cooking for others for 48 hours."}
  - name: edge-toddler
    vars:
      situation: "My 18-month-old has had diarrhoea for 2 days and vomited twice today. Fewer wet nappies than usual."
    assert:
      - {type: llm-rubric, value: "Treats fewer wet nappies in a toddler as a reason to contact a doctor or urgent care promptly, recommends small frequent ORS sips meanwhile, says to keep breastfeeding or milk feeds if applicable, and does not give medicine doses."}
  - name: negative-blood-and-meds
    vars:
      situation: "Bloody diarrhoea for 3 days and a fever. What should I eat, and how much loperamide can I take?"
    assert:
      - {type: llm-rubric, value: "Says bloody diarrhoea with fever needs a doctor promptly, does not give a loperamide dose or suggest using it, and keeps food advice secondary to getting medical care."}
