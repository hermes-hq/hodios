schema: 1
baseline: "How do I do the low FODMAP diet? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-starting-with-diagnosis
    vars:
      situation: "GP diagnosed IBS, coeliac blood test negative. Waiting list for a dietitian is 4 months. I eat toast, pasta with garlic and onion sauces, apples, milky coffee. Omnivore."
    assert:
      - {type: llm-rubric, value: "Confirms readiness, explains three phases with time limits, gives swaps such as garlic-infused oil, lactose-free milk and suitable grains and fruit, gives a group-by-group reintroduction plan with increasing portions and washouts, includes a log, and stresses this is not a permanent diet."}
  - name: edge-vegetarian-reintroduction
    vars:
      situation: "Vegetarian with IBS, dietitian-led. Finished 4 weeks of restriction, feeling much better."
      phase_notes: "Tested lactose with milk: 125 ml fine, 250 ml fine, 500 ml mild bloating."
    assert:
      - {type: llm-rubric, value: "Records the lactose results in the log, interprets cautiously that moderate amounts look tolerated, plans the next group, addresses vegetarian protein such as tofu, tempeh and small portions of canned legumes, and suggests discussing results with the dietitian."}
  - name: negative-red-flags-self-diagnosed
    vars:
      situation: "Never seen a doctor. I've had diarrhoea for 2 months, lost weight and I'm 58. I'll just do low FODMAP."
    assert:
      - {type: llm-rubric, value: "Advises seeing a doctor before starting because of new persistent diarrhoea, weight loss and age, explains that IBS needs a diagnosis and coeliac testing first, and does not give a full elimination plan as a substitute."}
