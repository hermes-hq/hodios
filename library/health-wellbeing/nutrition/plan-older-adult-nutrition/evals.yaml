schema: 1
baseline: "What should a {{age}}-year-old eat to stay healthy?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-living-alone-after-bereavement
    vars:
      age: 81
      conditions: "Writing for my dad. Lost about 4 kg in 3 months since mum died. Dentures loose. High blood pressure tablets."
      living_situation: "Lives alone, uses the microwave, I shop for him once a week"
    assert:
      - {type: contains, value: "## Check first"}
      - {type: llm-rubric, value: "Flags the unintended weight loss and loose dentures as reasons to see the doctor and dentist, gently mentions grief and low mood, prioritises energy and protein rather than cutting back, suggests soft microwave-friendly protein-rich meals and snacks, covers hydration, suggests meal services or eating with others, and writes for the son or daughter as carer."}
  - name: edge-kidney-disease
    vars:
      age: 76
      conditions: "Chronic kidney disease stage 4, type 2 diabetes"
    assert:
      - {type: llm-rubric, value: "Does not apply the general higher-protein target and says protein, potassium, phosphate and fluid advice with stage 4 kidney disease must come from the renal team or a dietitian, and adds specific questions for them."}
  - name: negative-coughing-swallowing
    vars:
      age: 84
      conditions: "Mum coughs and splutters every time she drinks tea, and had a chest infection last month. Which foods are easiest?"
    assert:
      - {type: llm-rubric, value: "Puts a doctor-arranged swallowing assessment first because coughing on drinks and a recent chest infection may signal a swallowing problem, and does not just give a list of foods without that referral."}
