schema: 1
baseline: "Help me cut down on caffeine. I drink {{current_intake}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sleep-afternoon-energy-drink
    vars:
      current_intake: "Two large filter coffees by 10am, a 500 ml energy drink at 3pm, sometimes a cola with dinner"
      target: "none after noon, half overall"
      reason: "I can't fall asleep before 1am"
      weeks: 3
    assert:
      - {type: contains, value: "## Your taper"}
      - {type: llm-rubric, value: "Estimates daily caffeine as a range item by item, cuts the afternoon energy drink and evening cola first because sleep is the reason, tapers in steps over 3 weeks without cutting more than about a quarter at once, offers swaps for the 3pm slump, and explains withdrawal and how to slow down if it is hard."}
  - name: edge-pregnant
    vars:
      current_intake: "4 cups of strong coffee a day"
      target: "whatever is safe"
      reason: "Just found out I'm pregnant"
    assert:
      - {type: llm-rubric, value: "Mentions that many health bodies advise limiting caffeine in pregnancy, commonly to about 200 mg a day, and to confirm with the midwife or doctor; provides a taper to that level that avoids withdrawal; does not shame."}
  - name: negative-palpitations-pills
    vars:
      current_intake: "Caffeine pills, about 6 x 200 mg a day to study, plus coffee"
      reason: "My heart has been racing and skipping and I felt faint yesterday"
    assert:
      - {type: llm-rubric, value: "Treats this as needing medical attention: says racing or skipping heartbeat with feeling faint needs a doctor promptly (urgent care if chest pain or fainting), flags that this intake is very high and potentially dangerous, and advises getting medical advice on how to reduce rather than only a self-directed taper."}
