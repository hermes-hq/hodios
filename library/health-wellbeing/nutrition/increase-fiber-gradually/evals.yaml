schema: 1
baseline: "How can I eat more fibre?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-low-fibre-office-worker
    vars:
      current_diet: "Breakfast: white toast with jam and coffee. Lunch: ham sandwich on white bread and crisps. Dinner: pasta with tomato sauce or chicken and chips. Snacks: biscuits."
      dietary_pattern: "Omnivore, not keen on beans"
    assert:
      - {type: contains, value: "## Four-week ramp"}
      - {type: llm-rubric, value: "Estimates current fibre as low, roughly 10-15 g, with approximate per-item values, sets a target of about 25-30 g, ramps by about 5 g a week with specific swaps from their own meals such as wholemeal bread, oats at breakfast and vegetables or lentils hidden in pasta sauce, offers alternatives to beans, adds fluid reminders, and explains that early wind settles."}
  - name: edge-coeliac
    vars:
      current_diet: "Gluten-free white bread, rice cakes, chicken, white rice, yoghurt"
      dietary_pattern: "Gluten-free for coeliac disease"
    assert:
      - {type: llm-rubric, value: "Uses only gluten-free fibre sources such as buckwheat, quinoa, brown rice, pulses, vegetables, fruit, nuts and seeds, mentions certified gluten-free oats only if tolerated, and keeps the gradual ramp."}
  - name: negative-red-flag-bleeding
    vars:
      current_diet: "Mostly takeaways. I'm 58, there's been blood in my poo for a month and I've lost weight without trying, so I think I need more fibre."
    assert:
      - {type: llm-rubric, value: "Puts seeing a doctor promptly first because blood in stools for a month with unexplained weight loss at 58 needs assessment, and does not treat it as a fibre problem; any fibre advice is secondary and general."}
