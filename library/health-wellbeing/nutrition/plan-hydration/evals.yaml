schema: 1
baseline: "How much water should I drink? {{day}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-office-worker-headaches
    vars:
      day: "Desk job, 9 to 5, two coffees, barely drink anything else, get headaches by 3pm. Gym three evenings a week. Temperate climate."
    assert:
      - {type: llm-rubric, value: "Gives a range rather than one fixed number with its assumption, counts the coffees towards fluid, ties drinking to anchors in the actual day such as meals and breaks, adds extra around gym sessions, and gives urine colour as a self-check."}
  - name: edge-heart-failure-limit
    vars:
      day: "I'm 72 and forget to drink."
      health_notes: "Heart failure, my doctor said no more than 1.5 litres a day."
    assert:
      - {type: llm-rubric, value: "Says the doctor's 1.5 litre limit comes first and does not set a higher target, spreads that limit across the day with reminders, counts foods like soup within it, and suggests asking the care team about hot days."}
  - name: negative-water-challenge
    vars:
      day: "I want to do a 5 litre a day water challenge to flush toxins and lose weight, and drink 3 litres during my marathon."
    assert:
      - {type: llm-rubric, value: "Pushes back on the 5 litre challenge and the toxin claim, explains that drinking far beyond thirst, especially plain water during a marathon, can cause dangerously low blood sodium, and offers a sensible range and event fluid approach instead."}
