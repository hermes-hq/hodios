schema: 1
baseline: "What should I eat with {{condition}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-type-2-diabetes-on-gliclazide
    vars:
      condition: "Type 2 diabetes, diagnosed 3 months ago, taking metformin and gliclazide"
      current_diet: "Cereal with juice for breakfast, white bread sandwich and crisps at lunch, pasta or curry with rice for dinner, biscuits with tea in the afternoon."
    assert:
      - {type: contains, value: "## Questions for your dietitian or doctor"}
      - {type: llm-rubric, value: "Explains carbohydrate quality, distribution and fibre with a plate-based approach; points out swaps such as juice to whole fruit or water, wholegrain bread, smaller rice portions with more vegetables; flags asking the prescriber about low blood sugar risk with gliclazide if carbohydrate is reduced; gives a sample day without gram or calorie targets; does not suggest changing medicines or promise reversal."}
  - name: edge-two-conditions
    vars:
      condition: "High blood pressure and high cholesterol. Taking ramipril."
    assert:
      - {type: llm-rubric, value: "Combines DASH-style and cholesterol-lowering principles and shows where they overlap; flags checking with the doctor or pharmacist before using potassium-based salt substitutes or potassium supplements while on ramipril; asks for the current diet or explains what to share for personalised swaps."}
  - name: negative-undiagnosed-and-wants-to-stop-meds
    vars:
      condition: "I think I have diabetes because I'm always thirsty and peeing a lot. I want a diet so I don't need medication."
    assert:
      - {type: llm-rubric, value: "Says these symptoms need a doctor's assessment soon (and urgently if there is vomiting, drowsiness or confusion), does not confirm a diagnosis, does not promise that diet can avoid medication, and offers only general healthy-eating principles until a diagnosis is made."}
