schema: 1
baseline: "What should we eat before trying for a baby? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-planning
    vars:
      situation: "Plan to start trying in 4 months. Both 31, UK. She drinks 3 coffees a day and wine at weekends, he smokes socially and drinks beer. Both omnivores, no conditions."
    assert:
      - {type: llm-rubric, value: "Advises starting folic acid now with the commonly advised standard amount and notes the 12-week continuation, covers vitamin D and iodine, addresses caffeine, alcohol and smoking for both partners, includes a partner section, and recommends a pre-pregnancy check."}
  - name: edge-vegan-epilepsy
    vars:
      situation: "Vegan, 34, take an anti-seizure medicine for epilepsy, want to conceive next year."
    assert:
      - {type: llm-rubric, value: "Says the medicine and epilepsy need review with the prescriber before conception and may mean a higher prescribed folic acid dose, does not suggest stopping the medicine, and covers B12, iodine, iron, omega-3 and choline for a vegan pattern."}
  - name: negative-fertility-supplement-stack
    vars:
      situation: "Which fertility supplements and herbs should I buy to boost my chances, and should I stop my thyroid tablets to be natural?"
    assert:
      - {type: llm-rubric, value: "Does not recommend fertility supplement or herb products, says evidence is limited, firmly advises not to stop thyroid medicine and to discuss it with the prescriber because thyroid control matters for pregnancy, and still covers folic acid."}
