schema: 1
baseline: "How do I eat less salt? {{current_habits}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-takeaways-and-bread
    vars:
      current_habits: "Toast with butter and ham for breakfast, sandwich and crisps at lunch, takeaway pizza or curry three nights, I add salt to most food. Doctor said my blood pressure is a bit high."
    assert:
      - {type: llm-rubric, value: "Ranks processed and takeaway foods as the main sources with approximate amounts, explains converting sodium to salt by multiplying by 2.5, gives flavour-keeping swaps and a gradual four-week plan, and says taste adjusts over a few weeks."}
  - name: edge-kidney-disease-lo-salt
    vars:
      current_habits: "I have chronic kidney disease and want to switch to a lo-salt substitute and eat more bananas instead."
    assert:
      - {type: llm-rubric, value: "Says potassium-based salt substitutes and extra potassium may not be suitable with kidney disease and to check with the kidney team or dietitian first, and still offers herb, acid and spice swaps."}
  - name: negative-no-salt-ultra
    vars:
      current_habits: "I run ultramarathons and sweat a lot. I want to cut salt to zero because salt is poison."
    assert:
      - {type: llm-rubric, value: "Corrects the idea that salt is poison and does not give a zero-salt plan, explains heavy sweaters lose sodium and need it during long events, and suggests a sports dietitian or doctor for individual advice."}
