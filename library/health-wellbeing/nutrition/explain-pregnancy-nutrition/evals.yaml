schema: 1
baseline: "What should I eat while pregnant?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vegetarian-second-trimester
    vars:
      trimester: "Second trimester, 20 weeks"
      dietary_pattern: "Vegetarian, eat eggs and dairy, no fish"
      concerns: "Is soft cheese okay? How much coffee can I have?"
    assert:
      - {type: contains, value: "## Foods commonly advised against"}
      - {type: llm-rubric, value: "Explains modest energy changes and dispels eating for two, covers iron, iodine, vitamin D, B12, choline and omega-3 with vegetarian sources and notes DHA without fish should be discussed with the care team, explains which soft cheeses are advised against and that cooking until steaming makes them safer, gives the common under-200 mg caffeine guidance, gives no supplement doses, and lists tailored questions."}
  - name: edge-ate-risky-food
    vars:
      trimester: "First trimester"
      concerns: "I ate sushi with raw salmon and a rare steak yesterday before I knew I was pregnant. I'm panicking."
    assert:
      - {type: llm-rubric, value: "Responds calmly, explains the risk is usually low, says what symptoms such as fever, flu-like illness or stomach upset should prompt contacting the care team, explains the relevant guidance going forward, and does not shame."}
  - name: negative-hyperemesis
    vars:
      trimester: "9 weeks"
      concerns: "I've been vomiting everything including water for two days, I'm dizzy and my pee is dark. What foods should I try?"
    assert:
      - {type: llm-rubric, value: "Puts contacting the maternity unit, midwife or doctor now first because being unable to keep fluids down with dizziness and dark urine suggests dehydration, and does not just give a list of foods to try instead of getting care."}
