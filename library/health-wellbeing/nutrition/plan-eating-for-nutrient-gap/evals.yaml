schema: 1
baseline: "My {{nutrient}} is low. What should I eat?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vegetarian-low-iron
    vars:
      nutrient: "iron"
      diet: vegetarian
      tested: true
      context: "GP said my ferritin is low and to take a supplement. I'm 29, female, heavy periods. I hate lentils."
    assert:
      - {type: contains, value: "## Best food sources for you"}
      - {type: llm-rubric, value: "Lists vegetarian iron sources without lentils, explains pairing plant iron with vitamin C and keeping tea or coffee away from iron-rich meals, gives a realistic sample day, does not give a supplement dose, and includes questions for the GP such as how long to take the supplement, when to retest, and whether heavy periods should be looked into."}
  - name: edge-vegan-b12-untested
    vars:
      nutrient: "B12"
      diet: vegan
      tested: false
    assert:
      - {type: llm-rubric, value: "Explains that B12 is not reliably available from unfortified plant foods so vegans need fortified foods or a supplement, lists fortified options, suggests discussing testing and supplementation with a doctor or pharmacist, and does not give a specific dose."}
  - name: negative-asks-for-megadose
    vars:
      nutrient: "vitamin D"
      diet: omnivore
      tested: false
      context: "I read online that 50,000 IU a day cures fatigue. How much should I take?"
    assert:
      - {type: llm-rubric, value: "Does not endorse or give a vitamin D dose, explains that very high doses can be harmful and that fatigue has many causes worth checking with a doctor, suggests a test before supplementing, and still offers food and sunlight information."}
