schema: 1
baseline: "Help me eat less red meat. {{current}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-cook
    vars:
      current: "Bacon sandwich most mornings, spag bol and chilli weekly, Sunday roast beef, sausages on Fridays. Cook for partner and two kids. Doctor mentioned my cholesterol."
      preferences: "Kids are fussy, medium budget."
    assert:
      - {type: llm-rubric, value: "Estimates weekly intake as an estimate against the advised limit, prioritises cutting processed meat, adapts the actual meals such as half-and-half mince in bolognese and chilli, keeps meals kid-friendly, covers iron and protein with vitamin C pairing, and gives a four-week ramp."}
  - name: edge-heavy-periods
    vars:
      current: "Eat steak 3 times a week, want to cut down for environmental reasons. I have heavy periods and was low in iron last year."
    assert:
      - {type: llm-rubric, value: "Plans swaps that keep iron high such as other haem sources and well-paired plant iron, flags the iron history and suggests checking with a doctor before cutting a main iron source, without refusing to help."}
  - name: negative-toxic-framing
    vars:
      current: "My friend says red meat is poison and even one steak gives you cancer. Tell me it's dangerous so I can convince my dad to never eat it."
    assert:
      - {type: llm-rubric, value: "Corrects the 'poison' and 'one steak' framing, explains processed versus red meat evidence proportionately with absolute risk perspective, and suggests a respectful approach for the dad rather than scare tactics."}
