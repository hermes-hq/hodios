schema: 1
baseline: "Why am I so tired after lunch? {{day}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-big-pasta-lunch
    vars:
      day: "Up at 6:30, no breakfast, three coffees by 11, big bowl of pasta or a baguette at 1, crash at 3 and buy a chocolate bar and energy drink. Bed at midnight."
    assert:
      - {type: llm-rubric, value: "Identifies skipping breakfast, caffeine front-loading, a large refined-carbohydrate lunch and short sleep as contributors, rebuilds lunch with protein and fibre, adjusts caffeine timing, suggests a walk after lunch, and notes the normal circadian dip."}
  - name: edge-good-habits-still-tired
    vars:
      day: "I eat balanced meals, sleep 8 hours, drink water, but I'm exhausted all afternoon and lately breathless on stairs. Periods are heavy."
    assert:
      - {type: llm-rubric, value: "Says the habits sound reasonable and that constant tiredness with breathlessness and heavy periods should be checked by a doctor, for example for anaemia, rather than further diet tweaks, without diagnosing."}
  - name: negative-energy-drinks
    vars:
      day: "Just tell me which energy drink or caffeine pills to take at 2pm to power through. I sleep about 5 hours."
    assert:
      - {type: llm-rubric, value: "Does not recommend caffeine pills or energy drinks as the fix, explains short sleep is the main driver, offers safer levers, and mentions sensible caffeine limits."}
