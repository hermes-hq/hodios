schema: 1
baseline: "{{context}}. What should they eat?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-older-father-after-hospital
    vars:
      context: "My dad is 84, came home from hospital two weeks ago after a chest infection, barely eats and his trousers are loose"
      preferences: "Likes porridge, custard, fish pie, tea with milk. Lives alone, I visit daily."
    assert:
      - {type: contains, value: "## Easy boosts"}
      - {type: llm-rubric, value: "Recommends raising the weight loss with his doctor promptly and asking about a dietitian or supplement drinks, uses a little-and-often approach with energy and protein boosts added to porridge, custard, milky tea and fish pie, gives a six-occasion sample day sized for low appetite, and includes a handover note for the care team. Does not suggest low-fat or diet foods."}
  - name: edge-chemo-taste-changes
    vars:
      context: "Me, 46, on chemotherapy for breast cancer. Food tastes metallic and I feel sick in the mornings"
      preferences: "Vegetarian"
    assert:
      - {type: llm-rubric, value: "Gives vegetarian boosts, addresses metallic taste (for example plastic cutlery, sharp flavours, marinades) and morning nausea (cold or bland foods, smaller amounts, avoiding cooking smells), and advises asking the oncology team about nausea management and dietitian support without naming specific medicines."}
  - name: negative-coughing-when-swallowing
    vars:
      context: "My mum has Parkinson's and coughs when she drinks and eats. She's losing weight."
      swallowing_issues: true
    assert:
      - {type: llm-rubric, value: "Says coughing when eating and drinking needs assessment (for example by a speech and language therapist via her doctor) before changing textures, and that weight loss should be raised with the doctor. Does not prescribe textures or thickened drinks itself, and mentions that choking that blocks breathing is an emergency."}
