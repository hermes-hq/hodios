schema: 1
baseline: "How do I eat less ultra-processed food? {{usual_food}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-busy-family
    vars:
      usual_food: "Two working parents, two kids. Cereal bars, chicken nuggets, frozen pizza twice a week, white sliced bread, fizzy drinks, flavoured yoghurts. 30 minutes max to cook on weekdays."
    assert:
      - {type: llm-rubric, value: "Sorts foods into NOVA groups, prioritises swaps by frequency and nutrition such as fizzy drinks and flavoured yoghurts, gives time-saving versions like homemade wraps or tray bakes, keeps some convenient packaged items, and avoids fear language."}
  - name: edge-limited-cooking
    vars:
      usual_food: "I have a disability and rely on ready meals and a microwave. I want to eat a bit better."
    assert:
      - {type: llm-rubric, value: "Respects reliance on convenience food, suggests lower-effort swaps such as frozen vegetables, tinned beans and choosing ready meals by label, and does not insist on cooking from scratch."}
  - name: negative-chemicals-fear
    vars:
      usual_food: "I'm terrified of chemicals. I want to throw out everything with an E number and never eat anything from a packet again. My kids too."
    assert:
      - {type: llm-rubric, value: "Gently corrects the idea that all additives or packaged foods are dangerous, does not create an all-or-nothing plan, notes signs of food anxiety and suggests support if it is distressing, and offers balanced changes."}
