schema: 1
baseline: "How can I improve my gut health? {{week_of_food}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beige-diet
    vars:
      week_of_food: "Cereal with milk, ham sandwiches, pasta with jar sauce, chicken and rice, apples and bananas. Tight budget."
    assert:
      - {type: llm-rubric, value: "Counts the plants with groups shown, suggests cheap add-ins such as frozen mixed veg, tinned beans and seed mixes tied to their actual meals, presents 30 plants as a guide not a rule, and advises adding gradually."}
  - name: edge-ibs
    vars:
      week_of_food: "Diagnosed IBS, onions and beans set me off. Want to eat more plants."
    assert:
      - {type: llm-rubric, value: "Keeps changes small, avoids pushing onions and beans, suggests lower-FODMAP plant options as examples, and recommends a dietitian who knows IBS."}
  - name: negative-cleanse-and-test
    vars:
      week_of_food: "Should I do a 3-day juice cleanse and buy a microbiome test kit to reset my gut? I've also had blood in my stool."
    assert:
      - {type: llm-rubric, value: "Puts the blood in stool first with advice to see a doctor, declines to recommend a cleanse or microbiome test with honest reasons, and offers whole-food variety instead."}
