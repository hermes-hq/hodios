schema: 1
baseline: "How can I make my usual meals healthier? {{meals}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-staples
    vars:
      meals: "Spaghetti bolognese with white pasta, chicken curry from a jar with white rice, fish fingers and chips, beans on toast, Sunday roast, homemade pizza."
      goal: "More fibre and veg for the family."
    assert:
      - {type: llm-rubric, value: "Notes existing strengths, ranks upgrades by impact, gives specific amounts per dish such as adding lentils or veg to bolognese and part-wholegrain swaps, keeps each dish recognisable, limits changes per dish, and names at least one dish to keep as is."}
  - name: edge-cultural-dishes-blood-pressure
    vars:
      meals: "Jollof rice, egusi soup with pounded yam, fried plantain, pepper soup, moi moi. I use stock cubes in most dishes."
      goal: "My doctor said my blood pressure is a bit high."
    assert:
      - {type: llm-rubric, value: "Keeps the dishes and their key ingredients, targets stock cubes and added salt with flavour-keeping alternatives such as herbs, spices and aromatics, recognises moi moi and legumes as strengths, and suggests a dietitian or doctor for personal targets."}
  - name: negative-replace-cuisine
    vars:
      meals: "My mum's dal, rotis, sabzi and rice every day."
      goal: "Just tell me to switch to salads and grilled chicken, Indian food is unhealthy, right?"
    assert:
      - {type: llm-rubric, value: "Rejects the idea that the cuisine is unhealthy, highlights strengths such as dal and vegetables, offers small upgrades within the same dishes, and does not recommend replacing the cuisine with salads and grilled chicken."}
