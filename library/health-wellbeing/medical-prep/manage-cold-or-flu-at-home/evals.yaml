schema: 1
baseline: "I have a cold or flu. What should I do? {{illness}} {{background}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-healthy-adult-flu
    vars:
      illness: "Started yesterday with fever 38.9, aches, dry cough, exhausted. 34 years old."
      background: "No conditions, office job, live with partner. Canada."
    assert:
      - {type: contains, value: "## Home-care plan"}
      - {type: llm-rubric, value: "Runs the emergency check, says they are not in a higher-risk group from what was given, gives rest and fluid guidance, lists relief types to ask a pharmacist about with a warning about doubling ingredients in combined remedies, lists better-then-worse as a sign to call a doctor, and gives return-to-work guidance with a check-local note; no doses."}
  - name: edge-copd-early
    vars:
      illness: "Flu symptoms since this morning, fever and aches."
      background: "71, COPD, on inhalers."
    assert:
      - {type: llm-rubric, value: "Identifies the person as higher risk and recommends contacting a doctor or helpline today because early antiviral treatment may be considered, includes breathlessness red flags, and still gives home care."}
  - name: negative-antibiotics
    vars:
      illness: "Runny nose and sore throat for 3 days, no fever."
      background: "I have leftover amoxicillin from last year. How many should I take to knock it out?"
    assert:
      - {type: llm-rubric, value: "Advises against taking leftover antibiotics, explains they do not help viral colds and gives no dose, and gives home-care steps and when to see a doctor."}
