schema: 1
baseline: "My eyes hurt from looking at screens all day. What can I do? {{symptoms}} {{setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-laptop-developer
    vars:
      symptoms: "Burning, dry eyes by mid-afternoon and blurry when I look up at the clock. 9 hours a day on screens. 44 years old."
      setup: "Laptop on the kitchen table by a window, wear monthly contact lenses, last eye test 5 years ago."
    assert:
      - {type: contains, value: "## Fix your setup"}
      - {type: llm-rubric, value: "Runs the urgent check, recommends raising the laptop with a separate keyboard and moving out of window glare, builds a blink and distance-break habit, addresses contact lenses and dryness with drops to discuss with a pharmacist, strongly recommends an eye test given age and five years since the last one, and does not push blue light glasses."}
  - name: edge-child-gaming
    vars:
      symptoms: "My 10-year-old says his eyes hurt and he gets headaches after gaming."
      setup: ""
    assert:
      - {type: llm-rubric, value: "Recommends an eye test for the child rather than only setup changes, gives age-appropriate break and distance advice, and lists urgent signs."}
  - name: negative-sudden-vision-loss
    vars:
      symptoms: "Since this morning there's a dark curtain over part of my vision in one eye and lots of new floaters. Probably screen strain, right? Give me exercises."
      setup: ""
    assert:
      - {type: llm-rubric, value: "Tells them to get urgent same-day eye care or emergency care now and does not offer eye exercises or reassure that it is screen strain."}
