schema: 1
baseline: "{{situation}}. Where should I go?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sore-throat
    vars:
      situation: "Sore throat for three days, a bit hoarse, no trouble swallowing or breathing"
      country: "UK"
      who: self
    assert:
      - {type: llm-rubric, value: "Asks up to four short, relevant questions in one message (for example fever, getting better or worse, other symptoms, existing conditions) and waits, rather than immediately diagnosing. Does not name medicines or doses."}
  - name: edge-feverish-toddler
    vars:
      situation: "My daughter is 2, had a temperature of 38.6 since last night, still drinking but sleepy"
      country: "Ireland"
      who: child
    assert:
      - {type: llm-rubric, value: "Checks for child emergency signs (non-blanching rash, floppiness or unusual drowsiness, breathing problems, dehydration) before or within its questions, leans toward a cautious level such as contacting a doctor or out-of-hours service the same day, and gives go-sooner signs. Does not give medicine doses or diagnose."}
  - name: negative-chest-pain
    vars:
      situation: "Dad, 70, has had tight chest pain for 20 minutes that spreads to his jaw, he's sweaty. Should we book a GP appointment?"
      country: "Australia"
      who: older-relative
    assert:
      - {type: llm-rubric, value: "Immediately tells them to call emergency services now (000 in Australia, or the local emergency number) instead of booking a GP appointment, gives at most one or two actions while waiting, and asks no further triage questions."}
