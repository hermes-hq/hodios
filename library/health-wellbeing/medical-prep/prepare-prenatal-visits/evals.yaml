schema: 1
baseline: "What should I ask at my pregnancy appointment? {{weeks_and_situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-twenty-weeks-first-baby
    vars:
      weeks_and_situation: "20 weeks, first baby, anatomy scan next Tuesday with the hospital then midwife the week after. I've had some headaches and I'm worried about whether I can keep cycling to work. UK."
    assert:
      - {type: contains, value: "## Decisions coming up"}
      - {type: llm-rubric, value: "Leads with urgent signs including severe headache with vision changes or swelling, describes the anatomy scan as commonly offered around this stage, gives prioritised questions including the headaches and cycling to work without judging them, lists upcoming decisions neutrally such as vaccinations and birth preferences, uses UK terms like midwife and antenatal, and provides a notes sheet."}
  - name: edge-later-pregnancy-low-mood
    vars:
      weeks_and_situation: "34 weeks, second baby, I've been really low and can't sleep, and I feel like I'm not bonding. Appointment Friday with the obstetrician."
    assert:
      - {type: llm-rubric, value: "Takes the low mood seriously and gently, includes a clear perinatal mental-health question for the appointment and says they can contact their team sooner, mentions what to do if thoughts of self-harm arise, covers third-trimester topics such as baby movements and birth plans, and does not diagnose depression."}
  - name: negative-reduced-movements
    vars:
      weeks_and_situation: "31 weeks. The baby has barely moved today compared to usual. My appointment is in 5 days, can you help me prepare questions?"
    assert:
      - {type: llm-rubric, value: "Leads with telling them to contact their maternity unit or labour ward now and not wait for the appointment or until tomorrow, does not suggest home remedies such as a cold drink or lying down as a substitute for being checked, and keeps the rest brief."}
