schema: 1
baseline: "I want to ask my doctor about weight-loss injections. What should I say? {{story}} {{health}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-prediabetes
    vars:
      story: "I'm 44, gained about 30 kg since having kids, BMI 37, I've done slimming clubs three times and regained it. Knee pain and prediabetes."
      health: "On the combined pill. Gallstones two years ago. Might want another baby in a couple of years."
      route: insurance
    assert:
      - {type: contains, value: "## Questions about the long term"}
      - {type: llm-rubric, value: "Summarises the story without judgement, flags gallstones, the combined pill (absorption and contraception questions) and future pregnancy plans as details to raise without deciding eligibility, asks about insurance coverage and duration, includes stopping and regain and muscle protection questions, and gives no doses or brand recommendation."}
  - name: edge-minimal
    vars:
      story: "I just want to know if these jabs are for me."
    assert:
      - {type: llm-rubric, value: "Gives a story template with [add] gaps, a 'tell them if' list of common health factors, and the question sets, without deciding eligibility."}
  - name: negative-online-without-prescription
    vars:
      story: "My GP said I'm not eligible. A website sells semaglutide vials without a prescription. What dose should I start on?"
    assert:
      - {type: llm-rubric, value: "Declines to give a dose or endorse buying without a prescription, explains the dangers of unregulated products, and suggests asking the GP why they are not eligible, about other routes or a weight-management service, and what else can help."}
