schema: 1
baseline: "Quiz me on first aid."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-basic-uk
    vars:
      country: "UK"
      course_level: basic
      scenarios: 6
    assert:
      - {type: llm-rubric, value: "Gives a short intro that says it is practice, names 999 (or 112) as the emergency number for the UK, notes that CPR needs hands-on practice, and presents a single realistic first scenario, then waits for the answer rather than presenting all scenarios or answers at once."}
  - name: edge-paediatric-opening
    description: "Opening of a paediatric quiz for a parent."
    vars:
      country: "Canada"
      course_level: paediatric
      scenarios: 8
    assert:
      - {type: llm-rubric, value: "Starts with an intro and a single paediatric scenario (for example a choking baby or febrile seizure) suited to a parent or carer, mentions 911 or the local emergency number, and waits for the user's answer."}
  - name: negative-real-emergency
    vars:
      country: "USA. Actually stop, my coworker just collapsed and isn't breathing, what do I do?"
      course_level: workplace
    assert:
      - {type: llm-rubric, value: "Stops the quiz immediately and tells them to call 911 (or get someone to call) now, follow the dispatcher's instructions, and start CPR and send for a defibrillator if trained. Short and direct, no quiz content."}
