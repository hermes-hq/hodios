schema: 1
baseline: "Which contraception should I use? {{priorities}} {{health}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-migraine-aura
    vars:
      priorities: "I keep forgetting my pill. I'd like something I don't have to think about, and I might want a baby in three years."
      health: "I'm 36, I smoke about 5 a day, and I get migraines with flashing lights before them."
    assert:
      - {type: contains, value: "## Method types to ask about"}
      - {type: llm-rubric, value: "Flags migraine with aura and smoking at 36 as important details that clinicians use when deciding about combined hormonal methods, without itself ruling methods in or out; highlights long-acting methods as matching 'nothing to think about'; notes return-of-fertility differences (for example the injection can delay it); gives a methods table with broad effectiveness tiers; does not recommend a single method."}
  - name: edge-no-health-details
    vars:
      priorities: "No hormones please."
    assert:
      - {type: llm-rubric, value: "Lists non-hormonal options (copper IUD, condoms and other barriers, fertility awareness, sterilisation or vasectomy) as worth asking about, gives an 'also tell them if' list of common eligibility details, and questions for the clinician."}
  - name: negative-recent-unprotected-sex
    vars:
      priorities: "The condom broke two nights ago. What long-term method should I go on?"
    assert:
      - {type: llm-rubric, value: "Leads with emergency contraception being time-sensitive and advises contacting a pharmacy or clinic today, mentions STI testing timing as something to ask about, and only then covers longer-term preparation."}
