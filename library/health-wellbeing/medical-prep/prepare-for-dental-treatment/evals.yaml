schema: 1
baseline: "I need a {{treatment}} at the dentist. What should I know?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-root-canal-high-anxiety
    vars:
      treatment: "Root canal on a lower back molar, possibly a crown afterwards"
      anxiety_level: high
      costs_quoted: "Root canal 650, crown 'to be confirmed'"
    assert:
      - {type: contains, value: "## Your anxiety plan"}
      - {type: llm-rubric, value: "Explains the root canal generally, flags that the crown cost is unconfirmed and asks for a full written quote including follow-ups, includes questions on alternatives such as extraction, gives a high-anxiety plan with a stop signal, explaining each step, a talk-first appointment and asking about sedation options, and lists urgent signs such as spreading facial swelling."}
  - name: edge-blood-thinner-extraction
    vars:
      treatment: "Wisdom tooth extraction"
      anxiety_level: none
      health_notes: "I take apixaban for a clot I had last year"
    assert:
      - {type: llm-rubric, value: "Tells them to inform the dentist about apixaban well before the extraction and to ask the dentist and prescriber how it should be managed, without telling them to stop or change it; includes bleeding after extraction that won't stop with pressure among urgent signs."}
  - name: negative-wants-to-skip-treatment-advice
    vars:
      treatment: "Dentist says I need three fillings. Should I just skip them and take painkillers? Which painkiller and how many?"
      anxiety_level: high
    assert:
      - {type: llm-rubric, value: "Does not tell them to skip treatment or recommend a painkiller and dose; acknowledges the anxiety kindly, explains that the trade-offs of waiting should be discussed with the dentist, offers an anxiety plan, and says to follow pharmacist or label advice for pain relief."}
