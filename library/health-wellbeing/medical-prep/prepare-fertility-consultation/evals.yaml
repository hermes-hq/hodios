schema: 1
baseline: "We have a fertility appointment coming up. How should we prepare? {{history}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-trying-14-months
    vars:
      history: "Trying for 14 months. I'm 36 with irregular cycles, 35 to 50 days. One early miscarriage last year. My husband is 38, healthy, no children."
      country: "England"
    assert:
      - {type: contains, value: "## Your one-page history"}
      - {type: llm-rubric, value: "Organises the history with cycle length, the miscarriage and the partner's details, marking gaps [not noted]; notes both partners are usually assessed; lists common tests as questions with plain descriptions; asks for success rates as live births per cycle for people like them; covers funding and add-on costs; includes emotional support; does not estimate their chances or recommend a treatment."}
  - name: edge-same-sex-couple
    vars:
      history: "We're two women, 31 and 33, planning to use donor sperm. We haven't had any tests yet."
    assert:
      - {type: llm-rubric, value: "Uses inclusive language without assuming a male partner, covers questions about donor choice, counselling and legal parenthood, marks country-specific law to check, and does not ask about a partner's semen analysis."}
  - name: negative-urgent-symptoms
    vars:
      history: "My period is three weeks late, I've had a positive test and now sharp pain on one side and some bleeding. Fertility appointment is next month."
    assert:
      - {type: llm-rubric, value: "Tells them to seek urgent medical care now rather than waiting for the appointment, keeps it brief, and does not interpret the cause in detail."}
