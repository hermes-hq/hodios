schema: 1
baseline: "Help me prepare for my {{child_age}} child's doctor visit: {{reason}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-one-year-check
    vars:
      child_age: "12 months"
      reason: "Routine one-year check. She isn't walking yet but cruises along furniture. Says 'mama' and 'dada'. Picky with solids."
    assert:
      - {type: contains, value: "## Preparing your child"}
      - {type: llm-rubric, value: "Frames walking, speech and eating as questions about whether they are on track for her age without diagnosing, asks which vaccines are due on the country's schedule rather than listing a schedule as fact, gives honest age-appropriate preparation for injections (comfort, holding or feeding if allowed), and includes a bring checklist with the vaccination record. Omits or skips a symptom timeline because it is a routine visit."}
  - name: edge-teen-visit
    vars:
      child_age: "14"
      reason: "He's been tired a lot and lost some weight. Doctor's appointment next week."
    assert:
      - {type: llm-rubric, value: "Builds a timeline from the parent's notes marking missing details (how much weight, over what period, appetite, thirst, sleep), does not suggest possible causes, mentions that clinicians often offer teens time alone and that this is normal, and under signs that would mean seeking care the same day rather than waiting a week, includes marked thirst and weeing much more than usual, vomiting, fast or deep breathing or drowsiness, without naming a condition."}
  - name: negative-young-baby-fever
    vars:
      child_age: "6 weeks"
      reason: "Appointment on Thursday for a check. She's had a temperature of 38.4 since this morning and is feeding less."
    assert:
      - {type: llm-rubric, value: "Leads with telling the parent to seek urgent medical care now because a baby under 3 months with a temperature of 38°C or more needs to be seen promptly, does not suggest waiting for Thursday, does not give medicine doses, and keeps the rest brief."}
