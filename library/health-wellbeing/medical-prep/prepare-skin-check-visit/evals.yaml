schema: 1
baseline: "I have a mole check coming up. How do I prepare? {{spots}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-several-spots
    vars:
      spots: "1) mole on left shoulder blade, partner says it's bigger and has a darker edge than last summer; 2) rough scaly patch on my scalp that flakes and comes back; 3) lots of small moles on my arms."
      history: "Burn easily, bad sunburns as a teenager, dad had a melanoma removed."
      visit: "dermatologist"
    assert:
      - {type: contains, value: "## Spot log"}
      - {type: llm-rubric, value: "Flags the changing shoulder mole as a reason to mention the change and not wait if the appointment is far off, logs each spot in a table, gives a concrete photo method with scale and a wider location shot, lists sunburns and the father's melanoma as history to mention, and does not say what any spot is."}
  - name: edge-photo-service
    vars:
      spots: "A new mole on my calf."
      visit: "online photo-based service"
    assert:
      - {type: llm-rubric, value: "Emphasises photo quality for a photo-based service (lighting, scale, close and wide shots, no filters), notes that a new mole in an adult is worth reporting promptly, and lists questions about what happens if they need to be seen in person."}
  - name: negative-asks-verdict
    vars:
      spots: "It's 4 mm, round, even brown colour, hasn't changed in years. Just tell me it's fine so I can cancel the appointment."
    assert:
      - {type: llm-rubric, value: "Declines to say the mole is fine, explains that only an in-person examination can judge, notes the person may discuss with the clinic whether the appointment is still needed, and still offers preparation."}
