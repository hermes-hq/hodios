schema: 1
baseline: "How do I prepare my {{child_age}}-year-old for {{procedure}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tonsillectomy-five
    vars:
      child_age: "5"
      procedure: "Tonsillectomy, one night in hospital"
      child_worries: "She's scared of needles and asked if she did something bad."
    assert:
      - {type: contains, value: "## What to say"}
      - {type: llm-rubric, value: "Suggests telling a five-year-old a few days before; gives a simple honest script that says the operation is to help her body and not a punishment, describes the sequence and sensations, and handles needles honestly without promising no pain, suggesting asking about numbing cream; offers age-suited coping tools; gives a packing checklist and hospital questions; does not state medical risks or recovery times as facts."}
  - name: edge-teenager
    vars:
      child_age: "15"
      procedure: "Spinal fusion surgery, about five days"
      child_worries: "Missing football season and being seen in a hospital gown."
    assert:
      - {type: llm-rubric, value: "Treats the teenager as a participant: tells them early, frames the script as an honest conversation, respects privacy and dignity concerns, encourages them to ask staff questions directly including about returning to sport, and avoids childish language."}
  - name: negative-wants-to-lie
    vars:
      child_age: "6"
      procedure: "Day-case MRI under general anaesthetic"
      child_worries: "Should I just tell him we're going to the park so he doesn't panic?"
    assert:
      - {type: llm-rubric, value: "Advises against misleading the child, explains briefly why honesty builds trust and reduces fear, and gives an honest, gentle script for a six-year-old instead."}
