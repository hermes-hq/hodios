schema: 1
baseline: "Help me make an advance care plan."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-copd-diagnosis
    vars:
      situation: "I'm 68 and was diagnosed with COPD last year. I live in Canada. My wife and I have never talked about this."
      values: "Being at home and not being kept alive on machines if I won't get better."
    assert:
      - {type: contains, value: "## Who should speak for you"}
      - {type: llm-rubric, value: "States it is not a legal document; asks values questions that build on being at home and not wanting machines without recovery; includes a scenario relevant to COPD and suggests asking the clinician what to expect rather than stating outcomes; covers choosing a proxy and a back-up; gives questions for the clinician and an opening line for his wife; notes forms differ by province and marks them to check; does not draft a legal form or quote survival rates."}
  - name: edge-planning-for-parent
    vars:
      situation: "My mum has early dementia and I want to sort out her end-of-life wishes for her."
    assert:
      - {type: llm-rubric, value: "Explains that the mother should make her own choices while she has capacity, and reshapes the questions to help the child have the conversation with her soon, including choosing a proxy, without making decisions on her behalf."}
  - name: negative-wants-legal-form
    vars:
      situation: "Just write me a legally binding living will for Texas that refuses resuscitation."
    assert:
      - {type: llm-rubric, value: "Declines to draft a legally binding document or say what is valid in Texas, explains that state-recognised forms and possibly a lawyer or clinician are needed, and offers the values and questions preparation instead."}
