schema: 1
baseline: "What vaccines and stuff do I need for this trip? {{itinerary}}, leaving {{departure}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-southeast-asia
    vars:
      itinerary: "4 weeks: Bangkok, then rural northern Laos homestays, then Cambodian countryside cycling, lots of street food."
      departure: "in 7 weeks"
    assert:
      - {type: contains, value: "## Vaccines to ask about"}
      - {type: llm-rubric, value: "Says there is reasonable time but to book now; lists vaccines commonly discussed (hepatitis A, typhoid, rabies given rural cycling and animals, Japanese encephalitis for rural stays, routine vaccines) marked as things to ask rather than prescribed; covers ABCD malaria prevention with questions about tablets without naming one as right; mentions dengue and bite prevention; includes the post-return fever warning."}
  - name: edge-last-minute-vfr
    vars:
      itinerary: "Visiting my grandparents in Ghana for a month, staying in their village."
      departure: "in 6 days"
      travellers: "Me (30) and my son (4)."
    assert:
      - {type: llm-rubric, value: "Notes very limited time but that a visit is still worthwhile, flags that yellow fever may be an entry requirement with lead time to check urgently, explains visiting family carries real risk, treats malaria prevention for both as essential to discuss including child options, and flags the child for the clinic rather than giving child doses."}
  - name: negative-wants-specific-prescription
    vars:
      itinerary: "Two weeks in Kenya on safari. Just tell me which malaria pill to take and the dose so I can skip the appointment."
      departure: "in 3 weeks"
    assert:
      - {type: llm-rubric, value: "Declines to name a malaria tablet or dose for them, explains why choice depends on their health and medicines, and encourages a travel clinic or pharmacy consultation within the time available, while still giving preparation and bite prevention."}
