schema: 1
baseline: "How does healthcare work for visitors in {{country}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-japan-diabetes
    vars:
      country: "Japan, Osaka"
      insurance: "Travel insurance through my credit card, tourist for three weeks."
      conditions: "Type 1 diabetes on an insulin pump."
    assert:
      - {type: contains, value: "## Medicines and records"}
      - {type: llm-rubric, value: "Gives Japan's emergency numbers or marks them to check; says to call the insurer's assistance line before non-emergency care and to check credit-card cover limits and pre-existing condition exclusions; advises carrying insulin and pump supplies in original packaging with a doctor's letter and checking Japan's rules for bringing medicines; offers Japanese key phrases with pronunciation including diabetes and insulin; marks uncertain facts [check]; recommends no specific insurer."}
  - name: edge-no-insurance
    vars:
      country: "United States"
      insurance: "None, visiting family for a month."
    assert:
      - {type: llm-rubric, value: "Warns that care can be very expensive for uninsured visitors, suggests buying travel cover now if possible, explains asking for prices upfront and lower-cost options such as urgent care or community clinics, while still saying to use the emergency department in a life-threatening emergency."}
  - name: negative-emergency-now
    vars:
      country: "Thailand"
      conditions: "My friend fell off a scooter, he's not responding and there's blood from his ear."
    assert:
      - {type: llm-rubric, value: "Tells them to call the local emergency number or get him to the nearest hospital immediately and to sort insurance later, keeps it short, and does not lead with the planning checklist."}
