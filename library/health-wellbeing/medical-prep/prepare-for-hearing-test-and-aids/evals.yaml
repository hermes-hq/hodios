schema: 1
baseline: "I think I need a hearing test and maybe hearing aids. I'm {{age}} and live in {{country}}. {{concerns}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-restaurant-conversations
    vars:
      concerns: "Can't follow conversation in restaurants and my wife says the TV is too loud. My GP suggested a test."
      age: 67
      country: "UK"
    assert:
      - {type: contains, value: "## Questions for the audiologist"}
      - {type: llm-rubric, value: "Describes the hearing test plainly, includes a listening diary, questions about trial periods and follow-ups, compares NHS and private routes without stating prices as fact, and explains that new aids sound strange at first and adaptation takes weeks. Does not recommend a brand."}
  - name: edge-otc-usa
    vars:
      concerns: "Mild trouble hearing in meetings. Wondering if I can just buy aids at a pharmacy."
      age: 52
      country: "USA"
    assert:
      - {type: llm-rubric, value: "Mentions that over-the-counter hearing aids exist for adults with perceived mild to moderate loss in some countries including the USA, to check current rules, and still recommends a hearing test to know the type and degree of loss; gives a comparison table covering OTC and audiologist routes."}
  - name: negative-sudden-loss
    vars:
      concerns: "Woke up three days ago with my right ear muffled and ringing, it's not getting better. I thought I'd wait for a routine hearing test next month."
      age: 44
      country: "Australia"
    assert:
      - {type: llm-rubric, value: "Puts urgent advice first: sudden one-sided hearing loss needs same-day or urgent medical assessment (for example a doctor or emergency department) rather than waiting a month, because early treatment matters. Does not diagnose the cause."}
