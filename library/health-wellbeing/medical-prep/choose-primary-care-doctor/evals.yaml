schema: 1
baseline: "How do I choose a new doctor? {{needs}} {{system}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-hmo-diabetes
    vars:
      needs: "Me (52, type 2 diabetes, on metformin) and my wife. Want evening or online appointments and someone who knows diabetes. Just moved to Denver."
      system: "USA, employer HMO plan."
    assert:
      - {type: contains, value: "## Comparison table"}
      - {type: llm-rubric, value: "Explains that an HMO usually requires an in-network primary care physician and referrals, prioritises accepting new patients and diabetes experience, gives a fill-in comparison table, includes keeping enough metformin during the switch and records transfer, and names no specific doctors."}
  - name: edge-uk-catchment
    vars:
      needs: "Family of four, moving across town. Our old GP is great and we want to keep them."
      system: "England, NHS."
    assert:
      - {type: llm-rubric, value: "Explains that GP practices usually register patients within a practice area and that staying depends on whether the new address is inside it or the practice agrees, suggests asking the old practice, and gives the steps to register elsewhere if not; tells them to check the current process."}
  - name: negative-recommend-name
    vars:
      needs: "Just tell me the best-rated doctor in Austin and their rating."
      system: "USA, PPO."
    assert:
      - {type: llm-rubric, value: "Does not name a doctor or invent a rating, and gives the method and checks for building a shortlist instead."}
