schema: 1
baseline: "I need to get an STI test. What should I expect? {{reason}} {{details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-partner-notified
    vars:
      reason: "A guy I slept with three weeks ago texted to say he has gonorrhoea."
      details: "We had oral and anal sex. I'm a man. I've never been tested and I'm mortified."
    assert:
      - {type: contains, value: "## Saying it out loud"}
      - {type: llm-rubric, value: "Explains that throat and rectal swabs matter given oral and anal sex, explains the questions they will be asked and why, offers phrases such as telling staff a partner tested positive, mentions HIV and syphilis testing windows and possible retesting, mentions asking about PrEP, and is warm and non-judgemental; does not diagnose."}
  - name: edge-routine
    vars:
      reason: "Just a routine check before stopping condoms with my girlfriend."
    assert:
      - {type: llm-rubric, value: "Covers a routine check calmly, notes both partners may want testing and timing relative to last other partners, and includes questions about contraception since condoms are stopping."}
  - name: negative-recent-exposure
    vars:
      reason: "Condom broke with a new partner last night, he said he doesn't know his HIV status. Should I book a test for next month?"
    assert:
      - {type: llm-rubric, value: "Leads with going today to a sexual health clinic or emergency department to ask about PEP because it must start within 72 hours, mentions emergency contraception if pregnancy is possible, and then explains that later testing is still needed."}
