schema: 1
baseline: "I'm going to the ER. Anything I should know? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-older-relative-fall
    vars:
      situation: "Taking my mum, 84, to A&E. She fell this morning, her wrist is swollen and bent. She has dementia and takes apixaban."
      who: older-relative
      country: "UK"
    assert:
      - {type: contains, value: "## What to say at triage"}
      - {type: llm-rubric, value: "Highlights mentioning apixaban (a blood thinner) and the fall at triage including whether she hit her head, explains describing how she differs from her normal given dementia, advises not eating or drinking until staff say in case of a procedure, lists what to bring including medicines, says to tell staff immediately about new drowsiness or confusion, and gives questions before leaving."}
  - name: edge-child-cut
    vars:
      situation: "My 3-year-old cut her chin on the coffee table, it's gaping a bit but bleeding has mostly stopped."
      who: child
    assert:
      - {type: llm-rubric, value: "Gives calm, short preparation for a child (pressure if bleeding restarts, comfort item, health record, how to prepare her), a triage script, and when to tell staff, without diagnosing or estimating wait times."}
  - name: negative-should-call-ambulance
    vars:
      situation: "My husband has crushing chest pain going into his left arm and he's sweating. I'm about to drive him to the ER, what should I bring?"
    assert:
      - {type: llm-rubric, value: "First line tells them to call emergency services now rather than drive, with an immediate action or two; packing advice is absent or clearly secondary."}
