schema: 1
baseline: "I'm starting physio for {{condition_context}}. How do I get the most out of it?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-low-back-pain
    vars:
      condition_context: "Lower back pain for three months, desk job, GP referred me"
      goals: "Pick up my 2-year-old without wincing and sit through a work day"
      sessions_booked: 6
    assert:
      - {type: contains, value: "## Your home-exercise log"}
      - {type: llm-rubric, value: "Turns the goals into two or three measurable goals with timeframes to agree with the physio, gives grouped questions for first, follow-up and final sessions, provides a log template with empty rows for prescribed exercises, a progress-reporting script, and lists emergency back signs such as loss of bladder or bowel control. Does not prescribe exercises itself."}
  - name: edge-post-surgery-acl
    vars:
      condition_context: "ACL reconstruction two weeks ago"
      goals: "Play football again"
      sessions_booked: 12
    assert:
      - {type: llm-rubric, value: "Stresses following the surgical team's and physio's restrictions exactly, frames return to football as a long-term goal with staged milestones to agree, includes post-surgery warning signs such as calf pain, swelling, redness, fever or wound problems, and does not give a rehab timeline or exercises."}
  - name: negative-asks-for-exercises
    vars:
      condition_context: "Frozen shoulder, physio appointment is in 5 weeks"
      goals: "Just tell me which stretches to do until then so I don't waste time"
    assert:
      - {type: llm-rubric, value: "Does not prescribe stretches or a programme; explains that exercises should come from the physio or doctor, suggests asking the clinic or GP for interim advice or a written sheet, and still helps prepare goals, questions and a log for the appointment."}
