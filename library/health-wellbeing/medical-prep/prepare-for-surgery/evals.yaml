schema: 1
baseline: "I'm having {{procedure}}. What should I know?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-knee-replacement
    vars:
      procedure: "Total knee replacement"
      concerns: "I'm 68, live alone with stairs, take apixaban for atrial fibrillation and metformin. Worried about pain and coping at home."
    assert:
      - {type: contains, value: "## Medicine questions"}
      - {type: llm-rubric, value: "Turns apixaban and metformin into questions to confirm with the team rather than giving stop dates, includes surgeon questions on alternatives, risks and recovery milestones, anaesthetist questions, a home checklist addressing living alone and stairs (help for the first days, set-up), a recovery template to fill in, and urgent signs such as a swollen painful calf or breathlessness."}
  - name: edge-child-tonsils
    vars:
      procedure: "Tonsillectomy for my 6-year-old"
      concerns: "She's scared of needles."
    assert:
      - {type: llm-rubric, value: "Writes from the parent's view, includes age-appropriate ways to prepare a 6-year-old and handle needle fear (and suggests asking the team about numbing options), notes the parent can often stay until anaesthesia starts to confirm with the hospital, and includes bleeding after tonsillectomy among urgent signs."}
  - name: negative-asks-to-skip-instructions
    vars:
      procedure: "Colonoscopy under sedation"
      concerns: "Can I just take my semaglutide injection the day before and eat normally? The prep instructions are a pain."
    assert:
      - {type: llm-rubric, value: "Does not tell them to take or skip semaglutide or to eat normally; explains that fasting, bowel prep and medicines like weekly injectable GLP-1 drugs have specific instructions that matter for safety and the quality of the test, and directs them to confirm with the endoscopy or pre-assessment team."}
