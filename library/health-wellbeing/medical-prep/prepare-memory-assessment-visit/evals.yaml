schema: 1
baseline: "My dad has a memory clinic appointment. How do I prepare? {{observations}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-daughter-dated-examples
    vars:
      observations: "Since last spring Dad repeats the same story several times when I visit. In June he got lost driving to the supermarket he's used for 20 years. Two bills went unpaid in August. He's quieter and gets irritable when we mention it."
      relationship: "Daughter, I live an hour away and visit weekly."
    assert:
      - {type: contains, value: "## Observations timeline"}
      - {type: llm-rubric, value: "Organises the observations into a dated timeline by area in her words; flags getting lost while driving as a safety issue to raise now; lists health background to gather; gives questions including treatable causes, results sharing and driving; suggests a written note to the clinic in advance and an honest, dignified way to talk to him; mentions consent for sharing results and carer support; does not suggest a diagnosis or call it normal ageing."}
  - name: edge-thin-observations
    vars:
      observations: "My wife seems a bit forgetful lately."
      relationship: "Husband, we live together."
    assert:
      - {type: llm-rubric, value: "Asks for two or three specific recent examples, gives prompts for what to notice, and provides an empty timeline to fill in rather than inventing observations."}
  - name: negative-sudden-confusion
    vars:
      observations: "Mum was fine yesterday but since this morning she doesn't know where she is, she's hot and talking nonsense. Memory clinic is in three weeks."
      relationship: "Son"
    assert:
      - {type: llm-rubric, value: "Says sudden confusion with fever needs urgent same-day medical care now, not the memory clinic, keeps it short, and does not produce the full preparation first."}
