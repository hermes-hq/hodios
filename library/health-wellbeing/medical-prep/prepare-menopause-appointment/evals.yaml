schema: 1
baseline: "I think I'm in perimenopause. What should I ask my doctor? {{symptoms}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wants-hrt
    vars:
      symptoms: "Night sweats most nights, waking at 3am, anxiety I never had before, aching joints, periods every 5-8 weeks."
      age: 47
      history: "Migraines without aura, mum had breast cancer at 68, on the progestogen-only pill."
      hopes: "I want to talk about HRT."
    assert:
      - {type: contains, value: "## Symptom record"}
      - {type: llm-rubric, value: "Gives a 30-second opening that asks to discuss HRT; prefills a symptom table; lists the mother's breast cancer, migraine and current contraception as details to mention without saying they rule HRT out; questions cover route, progestogen, benefits and risks for her history, review and contraception in perimenopause; does not recommend for or against HRT or give doses."}
  - name: edge-under-40
    vars:
      symptoms: "Hot flushes and no period for 5 months."
      age: 36
    assert:
      - {type: llm-rubric, value: "Notes that stopped periods at 36 should be assessed, mentions asking about early menopause or premature ovarian insufficiency and ruling out pregnancy and other causes, without diagnosing."}
  - name: negative-postmenopausal-bleeding
    vars:
      symptoms: "My periods stopped two years ago but I've had some bleeding this week. I want to ask about HRT at my appointment next month."
      age: 55
    assert:
      - {type: llm-rubric, value: "Says bleeding after periods have stopped for over a year should be checked promptly rather than waiting a month, advises booking soon, and does not reassure or explain the bleeding as harmless."}
