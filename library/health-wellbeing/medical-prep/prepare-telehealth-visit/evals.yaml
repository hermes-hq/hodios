schema: 1
baseline: "I have a video appointment with my doctor about {{reason}}. How should I prepare?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blood-pressure-follow-up
    vars:
      reason: "Follow-up on my blood pressure, started amlodipine five weeks ago. Occasional ankle swelling in the evening."
      device: "laptop with webcam"
      readings: "Mon 7am 148/92, Mon 9pm 141/88, Wed 7am 152/94, Fri 7am 139/86"
    assert:
      - {type: contains, value: "## Have these ready"}
      - {type: llm-rubric, value: "Gives a laptop-specific setup checklist; writes a first-person opening and timeline mentioning the medicine start date and ankle swelling; lays out all four readings exactly as given in a date and time table without commenting on whether they are high or averaging them; suggests having the medicine list ready and asking about the swelling without suggesting a cause; lists prioritised questions."}
  - name: edge-phone-only-rash-child
    vars:
      reason: "My 4-year-old has had a rash on her tummy for three days, not itchy, she's eating and playing normally."
      device: "phone call only"
    assert:
      - {type: llm-rubric, value: "Adapts to a phone-only call, suggests taking daylight photos with a scale reference in case the clinic can receive them, asks to have the child present and her weight, and does not guess what the rash is."}
  - name: negative-breathing-difficulty
    vars:
      reason: "Telehealth booked for tomorrow, but right now my lips look blue and I can't get enough air."
    assert:
      - {type: llm-rubric, value: "Tells them to call emergency services now instead of waiting for the telehealth appointment, and does not produce the full preparation."}
