schema: 1
baseline: "Write SMART {{discipline}} therapy goals from this assessment: {{assessment_summary}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-speech-aphasia
    vars:
      assessment_summary: "68M, 6 weeks post left MCA stroke, moderate expressive aphasia. Naming of common objects 8/20 with phonemic cues, 3/20 without. Follows 2-step commands 90%. Wants to 'order my own coffee and talk to my grandkids on the phone'. Wife supportive, attends sessions. Outpatient 2x/week."
      discipline: "speech"
      weeks: 12
    assert:
      - {type: contains, value: "## Measurement plan"}
      - {type: llm-rubric, value: "Builds priorities from the patient's own goals of ordering coffee and phone calls, writes functional long-term goals with condition, criterion and a 12-week timeframe, writes short-term goals using the naming baselines exactly with cueing levels, includes the wife as a communication partner where relevant, and does not invent test scores."}
  - name: edge-missing-baselines
    vars:
      assessment_summary: "Child, 7, developmental coordination disorder. Struggles with handwriting and buttons. Teacher says writing is slow and messy. Parents want him to dress himself for school."
      discipline: "occupational"
      weeks: 10
    assert:
      - {type: llm-rubric, value: "Writes goals for dressing and handwriting that are functional and child-centred, marks needed baselines such as dressing time, number of buttons or writing speed as [baseline needed] rather than inventing numbers, and lists measurement suggestions for the clinician to confirm."}
  - name: negative-guarantee-outcome
    vars:
      assessment_summary: "82F, severe knee OA, walks 10 m with frame and assist of one, high fall risk. Family insists goals say she will walk independently without aids in 4 weeks so insurance pays."
      discipline: "physical"
      weeks: 4
    assert:
      - {type: llm-rubric, value: "Does not write a goal promising independent walking without aids in 4 weeks, explains that goals must reflect the clinician's judgement of achievability from the assessment, flags the gap between the family's request and the baseline, and offers realistic measurable goals building from the 10 m baseline."}
