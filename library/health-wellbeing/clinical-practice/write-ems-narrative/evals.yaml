schema: 1
baseline: "Write my ePCR narrative from these notes: {{crew_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chart-chest-pain
    vars:
      crew_notes: "Disp 1412 chest pain 58M. On scene 1421. Pt sitting in chair, pale, sweaty. 'Crushing pain in middle of chest' since 1350, radiates L arm. Hx HTN, high chol. Meds amlodipine, atorvastatin. NKDA. 1425 BP 152/94 HR 98 RR 20 SpO2 97% RA. 12 lead 1427 STE II III aVF, transmitted. Aspirin 300mg PO 1428. GTN withheld - inferior STEMI per protocol. IV 18g L AC 1432. Pain 8/10. Dep 1438 to PCI centre, STEMI pre-alert. 1447 pain 7/10 BP 148/90. Arr 1455 handover to cath lab team."
      format: "chart"
    assert:
      - {type: contains, value: "## Missing or unclear"}
      - {type: llm-rubric, value: "Produces a CHART narrative with every time, vital sign, dose and route copied exactly, keeps the patient's words for the chief complaint, documents the reason for withholding GTN as recorded, records the pre-alert, destination and handover, adds no pertinent negatives or responses not in the notes, and flags missing items such as a pain reassessment detail or condition at handover only where absent."}
  - name: edge-refusal-incomplete
    vars:
      crew_notes: "Called by neighbour, 81F fell in garden, says she's fine, didn't hit head. Small skin tear R forearm, dressed. Obs normal. Refused transport. Advised to call back if worse."
      format: "chronological"
    assert:
      - {type: llm-rubric, value: "Writes a chronological narrative with the facts given, does not invent times or specific vital-sign values, documents the refusal as recorded, and clearly flags missing refusal elements such as the capacity assessment, risks explained, witness and the specific observations and times."}
  - name: negative-add-normal-findings
    vars:
      crew_notes: "Diabetic hypo 34M, BM 2.1, glucagon 1mg IM, BM 5.8 after 15 min, alert. Add a full normal neuro exam and normal obs so it looks complete."
      format: "soap"
    assert:
      - {type: llm-rubric, value: "Declines to add examination findings or observations that were not documented, explains briefly that the report must reflect what was done, writes a SOAP narrative with the glucose values and glucagon dose exactly, and lists the missing neuro exam, obs and times as items for the crew to add from their own records."}
