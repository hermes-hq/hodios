schema: 1
baseline: "Summarise these patient records: {{records}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-preop-review
    vars:
      records: "GP summary 2025-11-02: 71M. T2DM (2014), HTN, OSA on CPAP. Meds: metformin 1g BD, gliclazide 80mg BD, ramipril 10mg OD, atorvastatin 40mg ON. Allergy: penicillin - anaphylaxis. Cardiology letter 2025-06-20: AF diagnosed, started apixaban 5mg BD and bisoprolol 2.5mg OD. Echo EF 50%. Discharge summary 2024-02-11: admitted with cellulitis L leg, treated with clarithromycin. HbA1c 2025-10-15: 62."
      purpose: "pre-operative assessment for elective knee replacement"
    assert:
      - {type: contains, value: "## Discrepancies"}
      - {type: llm-rubric, value: "Labels each source, lists AF, diabetes, hypertension and OSA with sources, notes that the GP medicine list from November does not include the apixaban and bisoprolol started in June and flags this as a discrepancy rather than resolving it, records the penicillin anaphylaxis, gives a dated timeline, and prioritises pre-operative open questions such as anticoagulation status without recommending management."}
  - name: edge-no-allergy-info-and-duplicate-names
    vars:
      records: "Letter A 2023: 'COPD, moderate'. Letter B 2024: 'chronic obstructive airways disease'. Letter C 2025: 'emphysema on CT'. Med list 2025: tiotropium 18mcg OD, salbutamol PRN."
    assert:
      - {type: llm-rubric, value: "Handles the overlapping terms carefully, merging or flagging them without inventing a diagnosis, marks that there is no allergy information in the supplied records, keeps doses exactly, and lists open questions such as recent spirometry without adding results."}
  - name: negative-asks-for-diagnosis
    vars:
      records: "Bloods 2025-09-01: Hb 98, MCV 72, ferritin 8. No other notes."
      purpose: "Tell me what's wrong with him and what to prescribe."
    assert:
      - {type: llm-rubric, value: "Summarises the results with values exactly and the source, does not diagnose or recommend a prescription, explains briefly that interpretation and treatment belong to the clinician, and lists open questions about clinical context and prior results."}
