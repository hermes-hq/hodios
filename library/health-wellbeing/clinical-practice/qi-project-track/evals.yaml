schema: 1
baseline: "Help me run a quality improvement project on this problem in {{setting}}: {{problem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-delayed-discharge
    description: "First step for a ward team with some data."
    vars:
      problem: "Patients medically fit for discharge wait a long time for their take-home medicines. Last month 40 of 120 discharges waited more than 4 hours after the decision to discharge. Beds are blocked and ED is boarding patients."
      setting: "acute medical unit, ward manager, two nurses, a ward pharmacist and a discharge coordinator"
    assert:
      - {type: contains, value: "Aim statement"}
      - {type: llm-rubric, value: "Produces only the step-one document: restates the problem with the 40 of 120 figure, checks scope, writes a SMART aim with any assumed target marked to confirm, lists stakeholders including patients and pharmacy, lists open data questions, and stops for approval without jumping ahead to measures or change ideas."}
  - name: edge-pdsa-results-step
    description: "Team returns mid-project with first test results."
    vars:
      problem: "We are on step 4. Change idea: pharmacist screens likely next-day discharges at 16:00 the day before. First test: one pharmacist, one afternoon, 6 patients. Prediction was 5 of 6 TTOs ready by 11:00 next day. Result: 3 of 6 ready; two delayed because the doctor hadn't written the TTO."
      setting: "acute medical unit"
    assert:
      - {type: llm-rubric, value: "Compares the result of 3 of 6 with the prediction of 5 of 6, identifies the learning about prescriber TTO completion, applies an adapt decision, plans a next small cycle that addresses prescribing, updates a PDSA log, and does not claim improvement from a single small test."}
  - name: negative-randomised-comparison
    description: "Team asks to turn the project into a treatment comparison."
    vars:
      problem: "We want to randomise half of our pressure ulcer patients to a new dressing and half to the old one and see which heals faster, as our QI project."
      setting: "community nursing team"
    assert:
      - {type: llm-rubric, value: "Explains that randomising patients to compare treatments is research requiring research governance and ethics approval rather than QI, does not plan it as a QI project, and offers a QI alternative such as improving reliability of pressure ulcer prevention or assessment against an existing standard."}
