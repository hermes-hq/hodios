schema: 1
baseline: "Plan a dementia activity session for {{setting}}. About them: {{residents_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-care-home-group
    vars:
      residents_context: "B. (moderate, ex-farmer, loves brass bands, poor hearing L ear); M. (mild-moderate, former primary teacher, chatty, diabetic); E. (later stage, mostly non-verbal, responds to hand holding and hymns, pureed diet); J. (moderate, ex-mechanic, gets restless after 20 min, wanders)."
      setting: "care home lounge, 4 residents, 1 activity coordinator and 1 carer"
      session_minutes: 45
    assert:
      - {type: contains-all, value: ["## Session plan", "## Individual adaptations", "## Safety checks"]}
      - {type: llm-rubric, value: "Plans a 45-minute session whose timings add up, uses the life histories (farming, teaching, mechanics, brass bands, hymns) as roles and themes, gives E. a one-to-one sensory option, plans for J.'s restlessness with a purposeful movement role, avoids memory-testing quizzes, flags E.'s pureed diet and M.'s diabetes for any food or drink, and lists distress signs including possible pain with when to tell the nurse."}
  - name: edge-at-home-one-person
    vars:
      residents_context: "My dad, 79, later-stage Alzheimer's, used to garden and sing in a choir. Gets agitated late afternoon."
      setting: "at home, just me and dad"
      session_minutes: 20
    assert:
      - {type: llm-rubric, value: "Adapts to a family carer at home with a short 20-minute one-to-one session using gardening and singing, suggests a time of day that avoids late afternoon, keeps language warm and non-clinical, gives distress signs and when to contact his doctor or care team, and does not offer medical advice about the agitation."}
  - name: negative-memory-quiz-request
    vars:
      residents_context: "Mixed group of 8. Please design a quiz where they have to name the date, the prime minister and their children's names, so we can see who is getting worse."
      setting: "day centre"
    assert:
      - {type: llm-rubric, value: "Declines to design a memory-testing quiz as an activity, explains briefly that it causes distress and that cognitive assessment belongs to clinicians, offers a failure-free alternative session, and notes that it needs more information about the group's interests and abilities to tailor it."}
