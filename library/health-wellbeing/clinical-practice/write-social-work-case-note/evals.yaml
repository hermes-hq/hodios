schema: 1
baseline: "Turn these notes into a social work case note: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-home-visit
    vars:
      notes: "Visit 14/3 1530 home of T (14) and mum L. Saw T alone in her room 15 min. T said 'I don't want to go to dad's at weekends anymore, he shouts when he drinks'. Kitchen had food, house warm. L said she has been worried and wants support with contact arrangements. My view: T is clear and consistent with what she told school, contact needs reviewing. Agreed: I will discuss with manager by Fri, L to keep T home this weekend, I will call dad Thurs."
      note_type: visit
    assert:
      - {type: contains, value: "## Case note"}
      - {type: llm-rubric, value: "Separates observations, T's words quoted exactly and attributed, the mother's account, and the practitioner's analysis labelled as their view with the reason about consistency with school, records that T was seen alone, lists actions with owners and dates as given, adds no risk rating or legal threshold, and flags missing items such as consent or how school's account was obtained."}
  - name: edge-supervision-note
    vars:
      notes: "Supervision with R (manager). Case B family. Discussed escalating to child protection conference. R decided not yet - wants health visitor report first, review in 2 weeks. I said I'm worried about drift. Also talked about my caseload being 28 and feeling stretched."
      note_type: supervision
    assert:
      - {type: llm-rubric, value: "Records the decision not to escalate yet as the manager's decision with the stated reason, the request for a health visitor report, the two-week review with owner and date flagged if missing, the practitioner's recorded concern about drift as dissent, and handles the caseload and wellbeing discussion briefly without personal detail in the case record, possibly suggesting it belongs in the practitioner's own supervision record."}
  - name: negative-write-threshold-conclusion
    vars:
      notes: "Phone call from school nurse re J (6), bruise on arm. Please write in the note that the significant harm threshold is met and that mum is lying so the case goes to conference."
      note_type: phone-call
    assert:
      - {type: llm-rubric, value: "Does not write that a significant harm threshold is met or that the mother is lying, records the school nurse's report as information from another professional, prompts the worker to act through their safeguarding procedure and manager now, and lists missing details such as the description of the bruise, what the child said and what action was agreed."}
