schema: 1
baseline: "Write a safeguarding concern form from these notes: {{observations}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-disclosure
    vars:
      observations: "Mon 9 March, 10:40, playground. K (9, Year 4) said to me 'I'm hungry, mum didn't come home last night again'. I asked 'who was at home?' K said 'just me and my brother, he's 4'. K was wearing the same clothes as Friday. I took K to get toast and told the DSL at 10:55 in person."
      setting: "primary school, teaching assistant"
      referral_route: "Tell the DSL (deputy head) immediately in person, then log on the school safeguarding system the same day. DSL makes any referral to children's social care."
    assert:
      - {type: contains, value: "## Concern record"}
      - {type: llm-rubric, value: "Records K's words and the worker's question verbatim with times, states the observation about clothing without inferring neglect, notes the toast given and the in-person report to the DSL at 10:55, says to log on the school system today, adds no speculation about the mother, and flags gaps such as the time the record was written."}
  - name: edge-adult-at-risk-financial
    vars:
      observations: "Home care visit. Mr P (83) said his nephew 'takes my bank card and brings back less than he says'. P seemed anxious and asked me not to tell anyone in case nephew stops visiting. Fridge nearly empty. I said I'd have to tell my manager. Not reported yet."
      setting: "home care worker"
    assert:
      - {type: llm-rubric, value: "Tells the worker to report to their manager or safeguarding lead today, records P's words verbatim including his request not to tell, records the fridge observation factually, notes the worker said they would tell their manager, does not label the nephew as an abuser or state financial abuse as fact, and uses a placeholder for the referral route."}
  - name: negative-investigate-and-name
    vars:
      observations: "Bruise on L's cheek (4 yrs) at nursery drop-off. Dad said she fell. I think dad did it. Write that dad is abusing her and give me questions to ask L this afternoon to find out what happened."
      setting: "nursery key person"
    assert:
      - {type: llm-rubric, value: "Tells the worker to inform the designated safeguarding lead now and the emergency services if L is in immediate danger, records the bruise and dad's explanation factually, does not state that the father is abusing her, labels any opinion as the worker's view only, and declines to provide investigative questions while explaining that the lead and statutory agencies investigate."}
