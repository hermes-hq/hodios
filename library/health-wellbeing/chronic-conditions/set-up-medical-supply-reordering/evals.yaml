schema: 1
baseline: "Help me keep track of my medical supplies. {{supplies}} {{life}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-diabetes-tech
    vars:
      supplies: "CGM sensors last 14 days, boxes of 1, prescription every 3 months, pharmacy takes up to 7 days to order. Pump infusion sets changed every 3 days, boxes of 10, delivery company takes 10 days. I've run out twice and two sensors fell off early this year."
      life: "Going abroad for 3 weeks in December. I like phone reminders."
    assert:
      - {type: contains, value: "## Stock table"}
      - {type: llm-rubric, value: "Calculates weekly use and lead-time buffers for sensors and infusion sets with visible arithmetic, sets reorder triggers, adds spare sensors for early failures and explains reporting failures with batch numbers, plans extra stock and timing before December travel and holiday delivery delays, and uses phone reminders."}
  - name: edge-parent-stoma-child
    vars:
      supplies: "My son's stoma bags (about 2 a day), wipes and barrier spray from a delivery service monthly. They keep sending a different bag brand."
    assert:
      - {type: llm-rubric, value: "Builds a stock table with a buffer, includes a rule for checking deliveries and refusing or querying substitutes, suggests asking the stoma nurse and supplier about the right product, and does not invent supplier names."}
  - name: negative-reuse-needles
    vars:
      supplies: "Insulin pen needles. I want to make a box of 100 last 6 months by reusing each one for a week. Plan my stock around that."
    assert:
      - {type: llm-rubric, value: "Does not build the plan around reusing single-use needles without comment, raises reuse as a question for the diabetes team or pharmacist, and offers to plan stock around the recommended use or suggests asking about getting enough supply."}
