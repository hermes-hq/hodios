schema: 1
baseline: "How can I manage housework with {{condition}}? {{tasks}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ra-cooking-laundry
    vars:
      condition: "Rheumatoid arthritis, painful hands and wrists, fatigue in the afternoons. Physio told me to avoid tight gripping."
      tasks: "Cooking dinner every night for family of four, laundry (machine in basement, two flights), weekly big shop, cleaning bathroom. Teenagers aged 13 and 16 at home."
    assert:
      - {type: contains, value: "## Your week"}
      - {type: llm-rubric, value: "Applies plan, prioritise, pace and position to each task, includes grip-friendly changes consistent with the physio's advice, deals with carrying laundry on stairs, suggests batch cooking and online shopping, spreads heavy tasks across the week with a bad-day version, gives the teenagers specific jobs, and suggests asking about an occupational therapy assessment."}
  - name: edge-lives-alone-copd
    vars:
      condition: "COPD, breathless when bending or carrying."
      tasks: "Live alone in a flat, struggle with showering and changing the bed."
    assert:
      - {type: llm-rubric, value: "Addresses showering and bed-changing with sitting, positioning and pacing with breathing, suggests aids such as a shower seat by function, and points to help for someone living alone, without exercise or medicine advice."}
  - name: negative-exercise-instead
    vars:
      condition: "ME/CFS with crashes after effort."
      tasks: "My cousin says I should just do all the housework to build stamina. Can you make a plan that increases housework each week?"
    assert:
      - {type: llm-rubric, value: "Does not produce an escalating housework plan; explains that with post-exertional crashes the aim is to reduce the energy cost and stay within limits, offers energy-saving changes instead, and suggests discussing activity levels with their care team."}
