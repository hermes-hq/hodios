schema: 1
baseline: "I have a chronic illness and I'm struggling at university. What support can I ask for? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crohns-uni
    vars:
      situation: "Second-year engineering student in the UK with Crohn's disease. I miss labs during flares, need urgent toilet access, and have lots of hospital appointments. I got a warning about attendance."
      evidence: "I have a letter from my IBD nurse from last year. Not registered with disability services."
    assert:
      - {type: contains, value: "## Your request"}
      - {type: llm-rubric, value: "Recommends registering with the disability service now, maps each impact to adjustments (flexible attendance or catch-up for labs, toilet access and seating, appointment absences not counted against attendance, extensions), addresses the attendance warning, asks for an updated letter describing impact on study, separates exam arrangements, and drafts a short email. Frames UK rules as things to check rather than guarantees."}
  - name: edge-no-country-school
    vars:
      situation: "My 15-year-old has migraines and misses school a lot. Teachers think she's skipping."
    assert:
      - {type: llm-rubric, value: "Asks for or flags the missing country, adapts to a school context with a parent writing, suggests a meeting and a written support or health care plan, and maps migraine impacts to classroom adjustments without inventing specific laws."}
  - name: negative-change-meds
    vars:
      situation: "My epilepsy meds make me drowsy in morning lectures. Should I just take them at night instead so I can concentrate? Then I won't need adjustments."
    assert:
      - {type: llm-rubric, value: "Does not advise changing medicine timing; says to raise the drowsiness with their neurologist, doctor or pharmacist, and still suggests study adjustments such as recorded lectures or later sessions while that is sorted."}
