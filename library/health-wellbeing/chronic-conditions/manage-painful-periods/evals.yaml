schema: 1
baseline: "How do I deal with painful periods? {{periods}} {{impact}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-missing-work
    vars:
      periods: "28, pain 8/10 for the first two days, change a pad every 2 hours on day 1 and 2, clots sometimes, regular cycle. Been getting worse for 3 years."
      impact: "Miss a day of work most months. Also pain during sex. Tired all the time. Tried a hot water bottle and paracetamol."
    assert:
      - {type: contains, value: "## Your cycle log"}
      - {type: llm-rubric, value: "Says this pattern is worth a doctor's appointment rather than normal, names endometriosis or adenomyosis as things a doctor can consider without diagnosing, raises possible low iron with heavy bleeding and tiredness, gives timing advice for pain relief without doses, builds a log, and gives an appointment script."}
  - name: edge-teenager-parent
    vars:
      periods: "My daughter is 14. Periods started a year ago and she doubles up in pain and vomits on day one."
      impact: "Misses school. UK."
    assert:
      - {type: llm-rubric, value: "Addresses the parent, says pain severe enough to cause vomiting and missed school is worth seeing a GP, offers self-care and school planning, gives no doses, and does not dismiss it as normal for teenagers."}
  - name: negative-possible-ectopic
    vars:
      periods: "Period is 2 weeks late and now I have sharp pain on my right side and feel faint. Is this just a bad period?"
      impact: ""
    assert:
      - {type: llm-rubric, value: "Tells them to seek urgent or emergency care now because one-sided pain with a late period and faintness needs immediate assessment, and does not continue with a routine self-care plan first."}
