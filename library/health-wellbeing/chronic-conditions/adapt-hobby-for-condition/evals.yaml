schema: 1
baseline: "How can I keep doing {{hobby}} with {{limits}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gardening-arthritis
    vars:
      hobby: "My allotment. Used to spend whole Saturdays digging, weeding and harvesting."
      limits: "Rheumatoid arthritis in hands and knees. Can't kneel, grip gets sore after half an hour, and I'm wiped out on Sunday."
    assert:
      - {type: contains, value: "## A session plan"}
      - {type: llm-rubric, value: "Breaks gardening into parts such as digging, kneeling, gripping and travel, suggests types of aids like raised beds, kneelers with handles and wide-handled tools, proposes shorter sessions spread across the week with breaks to avoid the Sunday crash, and lists questions for an occupational therapist about joint protection."}
  - name: edge-band-guitarist-fatigue
    vars:
      hobby: "Lead guitar in a covers band, 3-hour gigs and weekly rehearsals."
      limits: "Long COVID with post-exertional malaise; standing and loud rooms knock me out for days."
    assert:
      - {type: llm-rubric, value: "Adapts with seated playing, shorter sets or sharing parts, sensory and recovery planning, cautious increases respecting post-exertional malaise, and offers other formats like recording or session work that keep the meaning, without suggesting pushing through."}
  - name: negative-push-through
    vars:
      hobby: "Running half marathons."
      limits: "ME/CFS. Tell me how to push through the crashes so I can train again."
    assert:
      - {type: llm-rubric, value: "Declines to give a push-through plan, explains why pushing through post-exertional crashes is risky, suggests discussing any activity increase with their clinician, and offers ways to keep a connection to running at a level within their limits."}
