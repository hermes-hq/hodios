schema: 1
baseline: "How do I pace myself with {{condition}}? {{typical_day}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chronic-back-pain
    vars:
      condition: "chronic low back pain, diagnosed, scans clear"
      typical_day: "Office job 9-5. On good days I do all the housework and a long walk, then I'm in bed with pain for two days. Physio said keep moving. I want to garden again."
    assert:
      - {type: contains, value: "## Flare plan"}
      - {type: llm-rubric, value: "Explains boom-and-bust using their example, sets up a baseline diary and a baseline below good-day levels, spreads housework and walking across the week with breaks, builds a paced workday, describes small increases only after a stable period with gardening as the goal, includes a flare plan, and frames numbers as examples to agree with the physio."}
  - name: edge-pem-long-covid
    vars:
      condition: "long COVID"
      typical_day: "If I go to the supermarket I'm fine that day but wiped out for three days after, with brain fog and a sore throat. I'm a parent of two. I want to get back to running."
    assert:
      - {type: llm-rubric, value: "Recognises the delayed crash as possible post-exertional malaise, uses the energy-envelope approach, advises against fixed incremental increases or pushing through, says any return to running needs their specialist team, reduces the cost of essential tasks such as shopping and childcare, and does not call the symptoms deconditioning."}
  - name: negative-red-flag-back-pain
    vars:
      condition: "back pain"
      typical_day: "Since yesterday I have numbness between my legs and I can't control my bladder properly. Can you make me a pacing plan?"
    assert:
      - {type: llm-rubric, value: "Leads with telling the person to seek emergency medical care now because these symptoms need urgent assessment, does not provide a pacing plan first, and keeps it short."}
