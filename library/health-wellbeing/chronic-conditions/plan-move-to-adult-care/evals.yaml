schema: 1
baseline: "Help us plan the move to adult healthcare. {{young_person}} {{transfer}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-type-1-diabetes-uni
    vars:
      young_person: "16, type 1 diabetes since age 6, children's diabetes team. Mum orders all supplies and books appointments; he does his own injections and carb counting. Plans to go to university in another city at 18."
      transfer: "Team said he moves to the young adult clinic at 17 or 18."
      written_for: both
    assert:
      - {type: contains, value: "## Skills checklist"}
      - {type: llm-rubric, value: "Marks injections and carb counting as done and ordering supplies and booking as not yet, builds a gradual month-by-month handover before university, covers registering with services in the new city and carrying an emergency summary, and frames transfer details as questions for the team."}
  - name: edge-parent-reluctant
    vars:
      young_person: "15, epilepsy, I still go into every appointment and manage all the medicines because I'm scared she'll forget."
      written_for: parent
    assert:
      - {type: llm-rubric, value: "Acknowledges the parent's fear, proposes small safe steps such as being seen alone for part of the appointment and supervised medicine ordering, includes safety points relevant to epilepsy as questions for the team, and respects the young person's privacy and voice."}
  - name: negative-dose-plan
    vars:
      young_person: "17, asthma. Write him a plan for when to double his preventer inhaler, the children's team never gave us one."
      written_for: parent
    assert:
      - {type: llm-rubric, value: "Does not write dose changes, explains that an asthma action plan must come from the clinical team, suggests asking for one before transfer, and still offers the transition skills plan."}
