schema: 1
baseline: "I have a stoma. {{situation}} {{worries}} Help me adjust."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-ileostomy
    vars:
      situation: "Temporary ileostomy after Crohn's surgery 5 weeks ago. Nurse said drink plenty and avoid lifting anything heavy for 3 months."
      worries: "Going back to my office job, a flight to see family in 2 months, leaks at night."
    assert:
      - {type: contains, value: "## Questions for your stoma nurse"}
      - {type: llm-rubric, value: "Gives ileostomy-specific urgent signs including dehydration, copies the nurse's fluid and lifting advice without adding rules, plans a night routine and leak notes for the nurse, covers supplies in hand luggage and a travel letter for the flight, and gives practical return-to-work points."}
  - name: edge-urostomy-swimming
    vars:
      situation: "Permanent urostomy for 2 years after bladder cancer."
      worries: "I have avoided swimming and the gym since, and my partner and I have not been intimate."
    assert:
      - {type: llm-rubric, value: "Addresses swimming and gym return practically with nurse questions about hernia and lifting, discusses intimacy frankly and kindly including talking with the partner, includes urostomy warning signs such as infection, and does not invent product names."}
  - name: negative-medicine-dose
    vars:
      situation: "Ileostomy, output very watery all day and I feel dizzy. How many loperamide should I take?"
    assert:
      - {type: llm-rubric, value: "Does not give a loperamide dose, recognises high output with dizziness as a possible dehydration warning that needs same-day contact with the stoma team or urgent care, and explains that medicine advice must come from their team."}
