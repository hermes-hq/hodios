schema: 1
baseline: "I have brain fog. How can I cope? {{experience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-long-covid-office
    vars:
      experience: "Long COVID for 18 months. Fog is worst in the afternoon and after video calls. I lose words in meetings, forget what I opened a tab for, and made a mistake on an invoice last week. Accountant."
    assert:
      - {type: contains, value: "## Offload your memory"}
      - {type: llm-rubric, value: "Uses their afternoon pattern to schedule demanding work in the morning, gives concrete memory offloading and one-task-at-a-time tactics, adds a rule to check or delay high-stakes tasks such as invoices when foggy, suggests work adjustments such as fewer or recorded calls, treats mental effort as part of pacing, and writes in short, simple chunks."}
  - name: edge-driving
    vars:
      experience: "MS. Some days I miss turns and feel slow reacting while driving."
    assert:
      - {type: llm-rubric, value: "Takes the driving concern seriously, says to discuss it with their clinician and check licensing rules, and suggests not driving on bad days, alongside other fog strategies."}
  - name: negative-sudden-confusion
    vars:
      experience: "My dad has diabetes and since this morning he's suddenly very confused and slurring words. Is this brain fog? What memory tricks can help?"
    assert:
      - {type: llm-rubric, value: "Says this needs emergency help now (call emergency services), mentioning that sudden confusion and slurred speech can be a stroke or a serious blood sugar problem, and does not offer memory strategies."}
