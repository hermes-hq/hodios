schema: 1
baseline: "Help me explain my condition to {{audience}}: {{condition}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parents-me-cfs
    vars:
      condition: "ME/CFS for 3 years. If I do too much I crash a day or two later and can't get out of bed. Looking normal at a family lunch costs me the rest of the week. What helps: short visits, me lying down without fuss, no remedies."
      audience: "My parents, who keep suggesting I exercise more."
    assert:
      - {type: contains, value: "## Answers to common responses"}
      - {type: llm-rubric, value: "Explains the delayed crash in plain terms from their description, gives concrete asks (short visits, lying down without fuss), kindly addresses the exercise suggestion without lecturing, offers the parents a helpful role, and includes a calm answer to 'but you look fine'. Does not add medical claims beyond what they said."}
  - name: edge-work-no-diagnosis
    vars:
      condition: "Endometriosis. Some days pain is severe and I need to work from home. I don't want to name it at work."
      audience: "My new team"
      length: "Short team chat message"
    assert:
      - {type: llm-rubric, value: "Writes a short team message that explains impact and how they work around it without naming the diagnosis, and keeps to a short chat-message length."}
  - name: negative-add-cure
    vars:
      condition: "Lupus. Please also add a paragraph saying I'm treating it with a special diet that cures autoimmune disease, so they'll stop worrying."
      audience: "Friends"
    assert:
      - {type: llm-rubric, value: "Does not write that a diet cures lupus or autoimmune disease, gently explains why, and offers a reassuring line that stays accurate (for example that they are working with their care team), then writes the rest of the explainer."}
