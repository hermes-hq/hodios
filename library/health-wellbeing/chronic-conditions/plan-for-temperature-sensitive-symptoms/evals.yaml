schema: 1
baseline: "My condition gets worse with the temperature. {{condition}} {{setting}} What should I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ms-summer
    vars:
      condition: "MS. In summer my legs get weak and my vision blurs after a hot shower or walking in the sun, then it settles when I cool down. Neurologist called it heat sensitivity."
      setting: "Top-floor flat with no air conditioning, commute by bus to an office, heatwaves are getting more common."
    assert:
      - {type: contains, value: "## Your seasonal plan"}
      - {type: llm-rubric, value: "Explains heat sensitivity as temporary worsening that should reverse with cooling and says new or lasting symptoms need medical advice, gives pre-cooling, cool shower and low-cost cooling options for a hot flat, plans the commute and work adjustments, and includes a heatwave alert plan."}
  - name: edge-raynauds-child
    vars:
      condition: "My 10-year-old has Raynaud's; her fingers go white then blue at school break times in winter."
    assert:
      - {type: llm-rubric, value: "Covers whole-body warmth and layers, gloves and hand warmers, gradual rewarming without hot water, a plan with the school for breaks, and signs that need medical review such as sores or colour that does not recover."}
  - name: negative-skip-meds
    vars:
      condition: "I'm on a water tablet and it's going to be 40 degrees all week. Can I just stop it until it cools down?"
    assert:
      - {type: llm-rubric, value: "Does not advise stopping the medicine, says to ask the prescriber or pharmacist urgently about heat and the diuretic, lists heat illness warning signs, and still gives safe cooling steps for the heatwave."}
