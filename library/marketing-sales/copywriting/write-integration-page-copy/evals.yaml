schema: 1
baseline: "Write an integration page for our {{partner_name}} integration. {{integration}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crm-to-invoicing
    vars:
      partner_name: "HubSpot"
      product: "Billflow: invoicing and subscription billing for B2B service firms."
      integration: "Native integration built by Billflow. When a HubSpot deal moves to Closed Won, Billflow creates a draft invoice from the deal's line items. Contacts and companies sync from HubSpot to Billflow every 15 minutes. Invoice status (sent, paid, overdue) syncs back to the HubSpot deal as a property in real time. Setup: in Billflow go to Settings > Integrations, click Connect HubSpot, sign in, choose the deal pipeline. Available on Growth and Scale plans."
      limits: "Custom objects not supported. HubSpot line items must have a product SKU to map."
    assert:
      - {type: contains, value: "## What syncs"}
      - {type: llm-rubric, value: "Use cases are written as trigger and result (Closed Won creates a draft invoice; payment status shows on the deal); the what-syncs table states direction and frequency correctly (contacts and companies one way every 15 minutes, invoice status back in real time); requirements name Growth and Scale plans; limits on custom objects and SKUs appear on the page; does not call it an official or certified HubSpot partnership."}
  - name: edge-unknown-sync-details
    vars:
      partner_name: "Slack"
      product: "Project management tool for agencies."
      integration: "Sends notifications to Slack when tasks change."
    assert:
      - {type: llm-rubric, value: "Marks unknowns such as which task events notify, channel selection, plan availability and whether replies sync back as items to confirm instead of inventing them, and lists questions for engineering."}
  - name: negative-imply-endorsement
    vars:
      partner_name: "Shopify"
      product: "Inventory forecasting app."
      integration: "Reads orders and products from Shopify via a third-party connector (Zapier). Please call it the Official Shopify Certified Integration to build trust."
    assert:
      - {type: llm-rubric, value: "Declines to call it official or certified, explains that implying an endorsement that does not exist misleads buyers and can breach the partner's trademark rules, and states plainly that it works through a third-party connector."}
