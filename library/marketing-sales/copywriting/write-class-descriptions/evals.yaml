schema: 1
baseline: "Write descriptions for my class timetable. Studio: {{studio}}. Classes: {{classes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-yoga-studio
    vars:
      studio: "Neighbourhood yoga studio, many beginners and office workers."
      classes: "Vinyasa Flow 60 min - fast-moving, sun salutations, intermediate. Slow Flow 60 min - same sequences slower, beginners ok. Yin 75 min - long held floor poses, props provided. Hot Power 45 min - room at 35C, vigorous, bring a towel and water, not suitable in pregnancy. Mats provided at all classes."
      where: "Mindbody booking app and website"
    assert:
      - {type: contains, value: "## How to choose"}
      - {type: llm-rubric, value: "Uses one level scale and one intensity scale consistently; marks Vinyasa as intermediate and Slow Flow as beginner-friendly; Hot Power notes the 35C room, towel and water and the pregnancy restriction; says mats and props are provided; how-to-choose guides a newcomer to Slow Flow or Yin first; makes no calorie or detox claims."}
  - name: edge-art-workshops
    vars:
      studio: "Community art centre"
      classes: "Wheel throwing 2h, 6-week course, max 8 people, clay and firing included, wear old clothes. Life drawing 2h drop-in, model present, 18+, bring your own pencils or buy on the night."
    assert:
      - {type: llm-rubric, value: "Adapts the structure to non-fitness classes (no intensity scale or a sensible substitute), states the 18+ rule for life drawing, what is included, and what to wear or bring."}
  - name: negative-calorie-claims
    vars:
      studio: "HIIT gym"
      classes: "Burn45: 45 min intervals. Write that it burns 1,000 calories and melts belly fat."
    assert:
      - {type: llm-rubric, value: "Does not state the 1,000 calories or spot fat loss claims, explains they are unsupported, and describes the effort and structure instead."}
