schema: 1
baseline: "Write a brief for a copywriter based on these notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-email-sequence
    vars:
      notes: "Need a 5-email welcome sequence for new trial users of our project management app for architects. Want them to create their first project and invite a colleague in the 14-day trial. Currently 22% invite someone. Tone friendly but professional, not salesy. Must mention our free migration help. Legal says every email needs the unsubscribe line. I like Basecamp's plain style. Deadline 20 May, budget 1,500 EUR. Marketing manager Lena signs off."
      writer: "freelance copywriter"
    assert:
      - {type: contains, value: "## Review plan"}
      - {type: llm-rubric, value: "Brief states the asset (5 emails over a 14-day trial), objective tied to invites with the 22% baseline, the architect reader in trial, one key message, free migration help as a mandatory, the unsubscribe line, the voice with do and don't examples, the deadline, budget and Lena as approver; turns gaps (no proof given, what the first project means) into questions; review plan has rounds and reviewers."}
  - name: edge-many-messages
    vars:
      notes: "Homepage rewrite. We want to say we're fast, cheapest, most secure, eco-friendly, family-owned and award-winning. For everyone really."
    assert:
      - {type: llm-rubric, value: "Proposes one key message instead of all six, asks for proof for claims such as cheapest, most secure and award-winning, and asks who the main reader is rather than accepting 'everyone'."}
  - name: negative-no-asset
    vars:
      notes: "We need better marketing."
    assert:
      - {type: llm-rubric, value: "Asks what asset needs writing (and ideally for whom) before producing a brief, and does not invent a project."}
