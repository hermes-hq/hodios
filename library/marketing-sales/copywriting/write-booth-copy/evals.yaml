schema: 1
baseline: "Write copy for our trade show booth at {{event}}: {{offer}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-logistics-saas-booth
    vars:
      offer: "RouteWise: route optimisation software for mid-size delivery fleets. Cuts fuel costs 11% on average across 48 customers (internal data). Customers who agreed to be named: Corrib Parcels, Northgate Fresh. Live demo at the booth on a real map. Goal: book 30-minute follow-up demos."
      event: "Multimodal 2026, Birmingham NEC, 3x3 m inline booth with a back wall, a counter and one screen."
      audience: Operations and fleet directors at companies with 20-200 vehicles.
    assert:
      - {type: contains, value: "## Conversation kit"}
      - {type: llm-rubric, value: "Gives headline options of about six words or fewer naming the problem or outcome for fleet directors, three proof points using only the 11% from 48 customers and the two named customers, counter and screen-loop copy, openers that are not 'Can I help you?', qualifying questions about fleet size, a lead offer such as booking a demo slot on the spot, and a data-use note for lead capture."}
  - name: edge-small-table-food-fair
    vars:
      offer: "Small-batch hot sauces from Cornwall, three heat levels. Want people to taste and sign up for 10% off their first online order."
      event: "Regional food fair, one table and one pull-up banner."
    assert:
      - {type: llm-rubric, value: "Adapts to a table and one banner with only a headline, two proof points or fewer and the offer, writes tasting-based openers, and does not invent awards or customer quotes."}
  - name: negative-missing-basics
    vars:
      offer: "We're a tech company, make the booth look cool."
      event: "Web Summit"
    assert:
      - {type: llm-rubric, value: "Asks what the company sells, who it is for and what visitors should do before writing, instead of producing generic buzzword copy."}
