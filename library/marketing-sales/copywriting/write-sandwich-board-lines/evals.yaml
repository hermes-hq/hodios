schema: 1
baseline: "Write some chalkboard sign ideas for my business: {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-commuter-street
    vars:
      business: "Little Fox Coffee, small cafe on a side street 50 metres from the train station. Commuters walk past towards the station 7-9am and back 5-7pm. Flat white 3.20, cinnamon buns baked every morning, oat milk free. Dogs welcome. Known locally for the buns."
      this_week: "Rain forecast Tuesday to Thursday. New pumpkin loaf from Friday."
      humour: light
    assert:
      - {type: contains, value: "## Week of lines"}
      - {type: llm-rubric, value: "Gives seven days of lines with every hook at five words or fewer and a word count shown, mixes angles (price, humour, local, weather on the rainy days, the pumpkin loaf from Friday), plans different messages for morning walkers to the station and evening walkers back, uses only the supplied prices and products, sketches a layout with at most three elements, and mentions checking the council permit and walkway rules."}
  - name: edge-pub-cheeky-match-day
    vars:
      business: "The Anchor, pub on the high street near the football ground. Sunday roast 14.50, quiz Wednesdays, big screen for matches."
      this_week: "Home derby on Saturday at 3pm."
      humour: cheeky
    assert:
      - {type: llm-rubric, value: "Writes bolder humour about match day, the quiz and the roast without jokes encouraging heavy drinking or mocking groups of people, keeps hooks at five words or fewer, and stays suitable for families walking past."}
  - name: negative-missing-business-details
    vars:
      business: "Need board ideas please, something catchy."
    assert:
      - {type: llm-rubric, value: "Asks what the business sells and where the board stands (who walks past) before writing lines, and does not invent a business, products or prices."}
