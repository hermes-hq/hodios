schema: 1
baseline: "Write landing page copy for this product aimed at {{audience}}. Goal: {{goal}}. Product: {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-demo-with-proof
    vars:
      goal: demo
      audience: Operations managers at 50-500 person logistics companies arriving from a search for route planning software.
      product: "RouteWise plans daily delivery routes for fleets of 10-200 vans. Imports orders from CSV or Shopify, respects time windows and driver hours, re-plans when a driver is late. Pricing from 29 EUR per van per month. Differentiator: re-plans live in under a minute; competitors re-plan overnight."
      proof: "Quote: 'We cut planning from 2 hours to 10 minutes a day.' - Marta Silva, Ops Lead, FreshBox (80 vans). 4.7/5 on Capterra from 112 reviews. Used by 340 fleets."
    assert:
      - {type: contains, value: "## Page copy"}
      - {type: llm-rubric, value: "Hero headline states an outcome for logistics ops managers rather than a feature list; the CTA is about booking a demo and says what happens on the call; benefits turn features (live re-planning, time windows) into outcomes; uses the supplied Marta Silva quote, 4.7/5 and 340 fleets accurately without inventing other numbers; includes an FAQ handling objections such as switching effort or integration."}
  - name: edge-no-proof-waitlist
    vars:
      goal: waitlist
      audience: Freelance illustrators who invoice clients in several currencies.
      product: "Inkbill: invoicing app for illustrators, pre-launch. Multi-currency invoices, tracks usage licences per artwork, reminds clients automatically. Launching in spring."
    assert:
      - {type: llm-rubric, value: "Does not invent testimonials, user counts or ratings; uses clearly marked placeholders for proof; the waitlist CTA says what joining gets them and when, without fake scarcity; lists the proof to collect at the end."}
  - name: negative-missing-product-basics
    vars:
      goal: purchase
      audience: Busy parents.
      product: "Our new thing launches next week, need a page fast."
    assert:
      - {type: llm-rubric, value: "Asks a few short questions about what the product does, what it costs and what makes it different instead of writing a full page of invented details."}
