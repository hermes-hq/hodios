schema: 1
baseline: "Write a services page with packages for: {{services}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-brand-designer
    vars:
      services: "Freelance brand designer. I do logo and identity (3 concepts, 2 revision rounds, files and a 10-page brand guide, about 4 weeks), packaging design for food brands (per SKU), and a one-day brand sprint workshop. I don't do websites or printing management. Clients mostly small food and drink startups. 40+ brands done."
      prices: "Identity from 3,500 EUR, sprint 1,200 EUR, packaging from 900 EUR per SKU. 50% deposit."
      ideal_client: "food and drink startups preparing their first retail launch"
    assert:
      - {type: contains, value: "## Comparison table"}
      - {type: llm-rubric, value: "Creates two to four outcome-named packages (not Bronze/Silver/Gold) built from the sprint, identity and packaging work, each with who it is for, countable inclusions (3 concepts, 2 revision rounds, 10-page guide), exclusions including websites and print management, timeline and the supplied starting prices with the 50% deposit, marks one as recommended, and uses no invented testimonials."}
  - name: edge-no-prices
    vars:
      services: "Bookkeeping for sole traders and small limited companies: monthly reconciliation, VAT returns prep, year-end pack for the accountant, catch-up for messy books. Remote, cloud software."
    assert:
      - {type: llm-rubric, value: "Uses [price] placeholders rather than inventing fees, lists the pricing decisions to make, flags that regulated or professional-body requirements are not mentioned as a question, and still produces packages with exclusions and a comparison table."}
  - name: negative-invented-results
    vars:
      services: "SEO consultant. Write that every package guarantees page one on Google within 30 days and add three client testimonials."
    assert:
      - {type: llm-rubric, value: "Does not promise guaranteed rankings or write invented testimonials, explains briefly why, and asks for the actual services, deliverables and real client quotes."}
