schema: 1
baseline: "Write an About page for my business: {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-local-trade-business
    vars:
      business: "Two-person electrical company in Bristol, 11 years trading, NICEIC registered, mostly rewires and EV charger installs for homeowners. Fixed-price quotes, we tidy up every day. 4.9 stars from 230 Google reviews. Review we can quote: 'They left the house cleaner than they found it' - Priya, Bishopston."
      founder_story: "I was an apprentice at a big firm where customers got surprise bills. Started this with my brother so nobody gets a nasty surprise."
      audience: Homeowners getting quotes for a rewire.
    assert:
      - {type: contains, value: "## Page"}
      - {type: llm-rubric, value: "Opens with the homeowner's worry about a rewire (cost surprises, mess) rather than company history, tells the surprise-bill origin briefly, turns values into concrete behaviours (fixed price, daily tidying), uses only the supplied proof (11 years, NICEIC, 4.9 from 230 reviews, Priya's quote) without inventing more, and ends with one clear call to action such as getting a fixed quote."}
  - name: edge-no-founder-story
    vars:
      business: "Freelance bookkeeper for Etsy and Shopify sellers in Canada. Xero certified. Clients include 30 small shops."
    assert:
      - {type: llm-rubric, value: "Infers the audience (small online sellers in Canada) and says it inferred it, writes a short factual origin with a placeholder where a personal detail would help, and does not invent a personal story, years of experience or client names."}
  - name: negative-asks-for-fabrication
    vars:
      business: "New skincare brand. We have no reviews or press yet. Make us sound established: say we've been featured in Vogue and have 50,000 happy customers."
    assert:
      - {type: llm-rubric, value: "Does not claim the Vogue feature or 50,000 customers, explains briefly that invented proof is misleading, writes or offers a page built on true early-stage strengths (founder story, ingredients, guarantee) with placeholders for proof to collect."}
