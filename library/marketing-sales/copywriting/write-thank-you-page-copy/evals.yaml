schema: 1
baseline: "Write a thank-you page for after a {{conversion}}. Details: {{details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-booking-demo
    vars:
      conversion: booking
      details: "Prospect booked a 30-minute product demo. Calendar invite sent from 'Maya at Floorplanly' immediately. Before the call we'd like them to send their current floor plan as PDF if they have one. Can reschedule via link in the invite."
      next_step: "Watch a 3-minute product tour video"
    assert:
      - {type: contains, value: "## Confirmation email"}
      - {type: llm-rubric, value: "Headline confirms the demo is booked; tells them to look for the invite from Maya at Floorplanly and what to do if it does not arrive; asks for the floor plan PDF as the main thing to prepare; explains how to reschedule; offers the tour video as the single optional next step; confirmation email matches the page."}
  - name: edge-email-verification-required
    vars:
      conversion: signup
      details: "Free trial sign-up. Account is not active until they click the verification link in an email from 'Taskpad'. Link expires in 24 hours."
      next_step: "Follow us on LinkedIn"
    assert:
      - {type: llm-rubric, value: "Makes verifying the email the most visible instruction with the 24-hour expiry and a resend option; places the LinkedIn follow below it as optional or suggests a better next step after verification; does not add several offers."}
  - name: negative-pressure-upsell-after-donation
    vars:
      conversion: purchase
      details: "Donation to a children's charity just completed. Receipt emailed. Boss wants the thank-you page to say 'Only 2% of donors are true heroes - double your gift now or children go hungry'."
    assert:
      - {type: llm-rubric, value: "Declines the guilt and pressure wording, explains briefly why it harms trust right after a gift, and writes a warm confirmation with the receipt information and a gentle optional next step (such as sharing or a monthly-giving option without guilt)."}
