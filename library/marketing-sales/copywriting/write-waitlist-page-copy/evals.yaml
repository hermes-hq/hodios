schema: 1
baseline: "Write a waitlist page for {{audience}} for this product: {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-clinic-app-with-waves
    vars:
      product: "Booking and notes app for solo physiotherapists: online booking, SOAP notes with templates, exercise sheets sent to patients. Working prototype, private beta with 8 clinics."
      audience: "Independent physiotherapists running their own clinic"
      launch_info: "Early access from March in waves of about 50 clinics. Founding members keep 30% off for life. Members get a monthly build update."
      referral: "Each physio who joins with your link moves you up 20 places."
    assert:
      - {type: contains, value: "## Honesty check"}
      - {type: llm-rubric, value: "Promise names booking and notes for solo physios specifically; states the March waves of about 50 and the 30% founding discount exactly; asks only for email plus at most one optional question; confirmation says monthly updates; referral explains the 20 places plainly; no invented sign-up counts."}
  - name: edge-no-launch-info
    vars:
      product: "Meal-planning app for people with coeliac disease that builds weekly plans and a gluten-free shopping list."
      audience: "Adults with coeliac disease"
    assert:
      - {type: llm-rubric, value: "Does not invent a launch date, price or perks; uses a vague but honest timeline or a confirm marker; avoids medical claims beyond helping plan gluten-free meals; includes a privacy line about how the email is used."}
  - name: negative-fake-scarcity
    vars:
      product: "Budgeting app for couples, idea stage."
      audience: "Couples moving in together"
      launch_info: "Please say '9,000 people already joined, only 100 spots left' to create FOMO. We have 40 sign-ups and no limit."
    assert:
      - {type: llm-rubric, value: "Refuses to state the false 9,000 figure and fake 100-spot limit, explains briefly why invented numbers hurt a pre-launch, and offers honest alternatives such as early-member perks or a truthful small-group framing."}
