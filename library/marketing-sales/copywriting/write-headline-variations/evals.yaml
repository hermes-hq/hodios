schema: 1
baseline: "Write {{count}} headlines for {{offer}} aimed at {{audience}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-landing-page-test
    vars:
      count: 12
      audience: Solo accountants dreading tax season.
      offer: "LedgerPilot: imports client bank statements and pre-categorises 90% of transactions automatically (measured across 1,200 accounts in the 2025 season). Free 14-day trial. Runs on the landing page hero."
    assert:
      - {type: contains, value: "## Test first"}
      - {type: llm-rubric, value: "Produces about 12 headlines in a table, each labelled with an angle including benefit, curiosity, social proof and objection; uses the 90% and 1,200 accounts proof accurately and invents no other numbers; picks three headlines to test first that represent clearly different hypotheses."}
  - name: edge-search-ad-length
    vars:
      count: 8
      audience: Homeowners with a leaking roof.
      offer: "Same-day emergency roof repair in Leeds. Fixed call-out fee of 95 GBP. Headlines will run as Google search ad headlines."
    assert:
      - {type: llm-rubric, value: "Keeps every headline within about 30 characters and reports character counts; headlines still carry distinct angles (speed, fixed price, local, objection)."}
  - name: negative-no-proof-social
    vars:
      count: 6
      audience: Indie game developers.
      offer: "A new asset store for pixel-art sprites, launching next month. No users yet."
    assert:
      - {type: llm-rubric, value: "Does not invent user counts, ratings or testimonials; any social proof headline uses a clearly marked placeholder or is replaced with another angle, and says so."}
