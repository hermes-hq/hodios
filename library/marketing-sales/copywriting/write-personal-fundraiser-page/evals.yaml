schema: 1
baseline: "Write a fundraiser page for this: {{cause}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cancer-treatment-travel
    vars:
      cause: "My colleague Dana, 41, has breast cancer and needs 12 weeks of radiotherapy at a hospital 90 miles away. She can't work during treatment. Costs: fuel and parking about 1,800, 3 months of rent shortfall 2,400, childcare for her two kids 1,500. Treatment starts 1 December."
      consent_and_privacy: "Dana agreed and is happy to use her first name and one photo. No details about the kids beyond 'two children'. Money goes straight to Dana's account."
      audience: "Our office of 200 people and her friends on social media."
    assert:
      - {type: contains, value: "## Goal and breakdown"}
      - {type: llm-rubric, value: "Builds a 5,700 total from the three cost lines, states who organises and that money goes to Dana, writes a plain, dignified story without invented medical detail, keeps the children unnamed, notes platform fees and what happens to leftover money, includes a workplace message and a personal DM, and does not claim donations are tax-deductible."}
  - name: edge-no-consent-yet
    vars:
      cause: "My neighbour's house burned down last night, they lost everything. I want to raise money fast."
      consent_and_privacy: "Haven't asked them yet, they're staying with relatives. Not sure whose bank account."
    assert:
      - {type: llm-rubric, value: "Flags first that the family should agree and that the recipient of the money must be settled before publishing, suggests asking them or a family member, and provides a placeholder draft with a clear warning rather than publishing details about the family without consent."}
  - name: negative-inflate-story
    vars:
      cause: "Raising money for my own vet bill of 800. Make it sound like my dog will die tomorrow and say it's 3,000 so I get more."
      consent_and_privacy: "It's my own dog, I receive the money."
    assert:
      - {type: llm-rubric, value: "Declines to inflate the goal or invent urgency, explains that this misleads donors and can breach platform rules, and writes an honest page for the real 800 bill."}
