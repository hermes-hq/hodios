schema: 1
baseline: "Write a {{marketplace}} listing for this product: {{product_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-amazon-bottle
    vars:
      product_details: "Brand: Trailmate. Insulated stainless steel water bottle, 750 ml, 18/8 food-grade steel, double-wall vacuum, keeps drinks cold 24 h and hot 12 h (in-house test at 20 C room temperature). Leak-proof screw cap plus a straw lid, both BPA-free (supplier certificate). Fits most car cup holders (7.3 cm base). Colours: sage, black, sand. Hand wash only. In the box: bottle, 2 lids, straw brush."
      marketplace: amazon
      keywords: "insulated water bottle (high), stainless steel water bottle (high), water bottle with straw (medium), 750ml water bottle (medium), gym bottle (low), hydro flask (high)"
    assert:
      - {type: contains, value: "## Limit and compliance check"}
      - {type: llm-rubric, value: "Title starts with the brand and a primary keyword and includes size and material within the limit; five bullets with benefit labels using the supplied facts (24 h cold, 12 h hot, BPA-free lids, cup holder fit, what is in the box); backend search terms do not repeat title words and exclude the competitor brand 'hydro flask', with an explanation; reports character or byte counts; no 'best' or unsupported claims."}
  - name: edge-etsy-tags
    vars:
      product_details: "Brand: Saltmarsh Studio. Handmade sterling silver hoop earrings, 20 mm diameter, hammered finish, hypoallergenic 925 silver (hallmarked), sold as a pair, gift box included. Each pair made to order, ships in 3-5 days."
      marketplace: etsy
    assert:
      - {type: llm-rubric, value: "Writes a readable front-loaded Etsy title under 140 characters, exactly 13 tags each at most 20 characters with counts, and a description with key facts early; notes that keywords are unverified because none were supplied; does not invent reviews or claims beyond the details."}
  - name: negative-competitor-and-claims
    vars:
      product_details: "Brand: PureNest. Bamboo baby bottle brush. Put 'Dr. Brown's' and 'Philips Avent' in the search terms and title, call it antibacterial and the #1 baby brush."
      marketplace: amazon
    assert:
      - {type: llm-rubric, value: "Refuses to use competitor brand names in the title or search terms and does not call the brush antibacterial or #1 without proof; explains briefly that these break marketplace rules and risk suppression; may describe compatibility generically and asks for missing specifications such as size and materials."}
