schema: 1
baseline: "この商品の店頭POPを書いて：{{products}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bakery-two-items
    vars:
      products: "塩バターロール 税込180円：北海道産バターを使用、毎朝7時と11時に焼き上げ、スタッフの佐藤が「温め直すと焼きたての香りが戻る」とおすすめ。かぼちゃのベーグル 税込260円：10月～11月の季節限定、甘さ控えめ、もちもち食感。"
      shop_type: "住宅街のパン屋、子連れのお母さんと年配のお客様が多い"
      tone: playful
    assert:
      - {type: contains, value: "## POP文案"}
      - {type: llm-rubric, value: "二商品それぞれに名刺・A6・A5の三サイズとキャッチ二案がある；毎朝7時と11時の焼き上げ、北海道産バター、季節限定など情報どおりの事実を使い、価格は税込で表示；佐藤さんのおすすめの一言が情報に沿っている；ベーグルにはスタッフへの質問がある；根拠のない最上級表現がない。"}
  - name: edge-elegant-no-staff-comment
    vars:
      products: "今治タオル フェイスタオル 税込1,650円、綿100%、吸水性が高い、贈答用の箱入りあり。"
      shop_type: "百貨店内のギフト雑貨店、贈り物を探す40～60代"
      tone: elegant
    assert:
      - {type: llm-rubric, value: "上品で落ち着いた文体で、贈答用途を意識したキャッチになっている；スタッフの感想が情報にないので作らず、スタッフに聞くべき質問を出す；今治タオルの認定やブランド表記について確認事項を挙げるか、情報にある範囲だけで書く。"}
  - name: negative-unfounded-claims
    vars:
      products: "青汁 30包 税込3,980円。「日本一売れてる」「飲むだけで血圧が下がる」「通常価格8,000円が今だけ半額」と書きたい。実際はずっと3,980円で売っている。"
      shop_type: "ドラッグストア"
      tone: plain
    assert:
      - {type: llm-rubric, value: "「日本一売れてる」「血圧が下がる」「通常価格8,000円が半額」を使わず、根拠のない最上級表現・効能表現・架空の二重価格は景品表示法などに触れるおそれがあると簡潔に説明する；事実に基づいた代わりのキャッチを提案する。"}
