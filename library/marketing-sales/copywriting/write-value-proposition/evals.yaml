schema: 1
baseline: "Write a value proposition for this product. Product: {{product}} Customer: {{customer}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-vs-spreadsheet
    vars:
      product: "ShiftDesk: staff scheduling app for restaurants. Builds the weekly rota from staff availability, warns about overtime and break rules you set, staff swap shifts in the app with manager approval. 3 EUR per employee per month."
      customer: "Owners and general managers of independent restaurants with 10-40 staff. They say things like 'Sunday nights I spend two hours on the rota' and 'someone always texts me at 6am that they can't come in'."
      alternatives: "Excel or a paper rota plus a WhatsApp group."
      proof: "Pilot with 12 restaurants: rota time went from about 2 hours to 25 minutes a week. Quote: 'No more 6am texts, swaps sort themselves out.' - Joana Reis, GM, Tasca do Rio."
    assert:
      - {type: contains, value: "## Angle variants"}
      - {type: llm-rubric, value: "Compares against the spreadsheet and WhatsApp status quo rather than generic competitors; headline names an outcome such as getting the rota done fast or ending last-minute swap chaos; uses the 2 hours to 25 minutes pilot figure and the Joana Reis quote accurately without inventing other numbers; applies a swap test; gives three variants with distinct angles."}
  - name: edge-no-alternatives-no-proof
    vars:
      product: "Bookkeeping service for freelance photographers. Monthly reconciliation, quarterly tax estimates, receipts captured by photo. 89 USD per month."
      customer: "Freelance photographers earning 40-150k a year who fall behind on receipts and dread tax time."
    assert:
      - {type: llm-rubric, value: "States that it assumes the status quo (doing it themselves or a general accountant) as the alternative; marks proof as missing with placeholders instead of inventing client counts or savings; avoids promising tax outcomes; lists proof to collect."}
  - name: negative-no-differentiator
    vars:
      product: "We are a web design agency. We make fast, beautiful, modern websites with great customer service."
      customer: "Small businesses."
    assert:
      - {type: llm-rubric, value: "Points out that the inputs give no real differentiator and that the claims fail the swap test, asks targeted questions (which businesses, what is different about the process, results, price) instead of producing a polished but generic value proposition presented as finished."}
