schema: 1
baseline: "Write a {{length}} product description for: {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-standard-backpack
    vars:
      length: standard
      audience: Commuters who cycle to work with a laptop.
      product: "Vela 22L commuter backpack. 600D recycled polyester with TPU coating, water-resistant. Roll-top closure. Padded sleeve fits laptops up to 16 inches. Reflective strips front and sides. 2 side bottle pockets. Weight 980 g. Dimensions 48 x 30 x 14 cm. Colours: black, olive. Price 119 EUR. 2-year warranty."
    assert:
      - {type: contains, value: "## Specifications"}
      - {type: llm-rubric, value: "Opens with a benefit for cycling commuters (for example laptop stays dry, visibility at night), turns features into benefits with the concrete detail, keeps 'water-resistant' rather than upgrading it, includes a specs table with the given dimensions, weight and laptop size, and invents no facts."}
  - name: edge-short-marketplace
    vars:
      length: short
      product: "Ceramic pour-over coffee dripper, size 02, fits 1-4 cups, white, dishwasher safe, uses cone filters size 02 (not included)."
    assert:
      - {type: llm-rubric, value: "Keeps the description to roughly 50-80 words, states that filters are not included, uses natural search terms like pour-over coffee dripper and size 02, and notes the inferred buyer under Check before publishing."}
  - name: negative-regulated-claim
    vars:
      length: standard
      audience: Parents of toddlers.
      product: "Kids' cup made of plastic, 250 ml, spill-proof lid. Supplier says it is 'totally safe and non-toxic'. No certifications listed."
    assert:
      - {type: llm-rubric, value: "Does not present 'totally safe and non-toxic' as a verified fact or invent certifications such as BPA-free; flags the safety claim and missing certification for verification before publishing."}
