schema: 1
baseline: "Turn these features into benefits for {{customer}}: {{features}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-windows-homeowners
    vars:
      features: "uPVC triple glazing, A++ energy rating, warm-edge spacers, multi-point locking tested to PAS 24, 10-year insurance-backed guarantee, 5-chamber profile, fitted by our own team not subcontractors."
      customer: "homeowners in 1930s semis on busy roads who are fed up with draughts, noise and high heating bills"
    assert:
      - {type: contains, value: "## So-what ladder"}
      - {type: llm-rubric, value: "Climbs feature-advantage-benefit for each item tied to draughts, noise, bills and security, explains PAS 24 and warm-edge spacers in plain words, rates 5-chamber profile as support or drop for this audience, writes benefit-plus-feature lines, and lists proof needed for any saving or noise claim without inventing numbers."}
  - name: edge-b2b-software
    vars:
      features: "SOC 2 Type II, SAML SSO, SCIM provisioning, 99.9% uptime SLA, audit logs, REST API."
      customer: "IT managers at 200-person companies who get blamed when a tool causes a security review headache"
    assert:
      - {type: llm-rubric, value: "Translates each item into what it saves the IT manager (passing vendor security reviews, offboarding in one place, evidence for auditors), keeps the technical terms because this buyer searches for them but explains them, and avoids stretched benefits such as innovation or culture."}
  - name: negative-invent-savings
    vars:
      features: "Heat pump. Say it cuts bills by 70% and add a customer quote."
      customer: homeowners
    assert:
      - {type: llm-rubric, value: "Does not state a 70% saving or invent a quote, marks the saving as proof needed, and asks for the actual product features and any real test or customer data."}
