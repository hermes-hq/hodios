schema: 1
baseline: "Write launch copy for my website, email, social and ads. Launch: {{launch}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-feature-launch
    vars:
      launch: "Shiftly (shift scheduling app for restaurants) launches Auto-Fill on 4 March: it fills open shifts by texting eligible staff and confirming the first yes. Included in the Pro plan at 4 USD per staff member per month. For restaurant managers who spend evenings chasing cover."
      channels: "landing page hero, email to existing customers, LinkedIn post, Instagram post, Google search ads"
      proof: "Beta with 40 restaurants: median time to fill a shift fell from 3 hours to 22 minutes."
    assert:
      - {type: contains, value: "## Consistency check"}
      - {type: llm-rubric, value: "Builds one core message about filling open shifts without chasing staff and reuses it across all five named channels; the name Auto-Fill, the 4 March date, Pro plan and 4 USD price are identical everywhere; uses the beta numbers (40 restaurants, 3 hours to 22 minutes) accurately and invents no other figures; search ad headlines are short (about 30 characters); the consistency table lists facts per piece."}
  - name: edge-local-shop-no-proof
    vars:
      launch: "A neighbourhood bakery starts selling sourdough subscription boxes from 1 June, 3 loaves a week for 15 GBP, collect on Saturdays."
    assert:
      - {type: llm-rubric, value: "Uses the default set of pieces scaled to a small local business, keeps price, start date and collection day identical across pieces, does not invent reviews or customer numbers, and marks proof slots as placeholders under Open items."}
  - name: negative-nothing-defined
    vars:
      launch: "We are launching something big next month, need all the copy."
    assert:
      - {type: llm-rubric, value: "Asks what is launching, who it is for and how people get it before writing, and does not produce a full kit of invented product details."}
