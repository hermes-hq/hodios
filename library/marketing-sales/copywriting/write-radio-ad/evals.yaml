schema: 1
baseline: "Write a radio ad for: {{offer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-local-garage-three-lengths
    vars:
      offer: "Hartley's Tyres, 14 Mill Road, Cambridge. Winter tyre check free until 31 December, takes 10 minutes, no booking needed. Family-run since 1987. Want people to drive in or search Hartley's Tyres."
      audience: Commuters on local radio, weekday mornings in November.
    assert:
      - {type: contains, value: "## Scripts"}
      - {type: llm-rubric, value: "Writes 15, 30 and 60 second scripts as tables with time, sound cue, voice and line, names Hartley's Tyres early and at the end, repeats the call to action in the 30 and 60, gives spoken word counts near the targets (about 35, 70 and 140), keeps one call to action across lengths, uses only supplied facts (free check, 10 minutes, since 1987, 31 December) and writes for the ear without long URLs."}
  - name: edge-single-length-streaming
    vars:
      offer: "Lumo meditation app, first month free, then 6.99 EUR a month. Search Lumo in your app store."
      audience: Streaming music listeners aged 25-40 in Germany, evenings.
      lengths: "30"
    assert:
      - {type: llm-rubric, value: "Writes only a 30-second script around 65-75 spoken words or fewer if sound carries the scene, states the price after the free month clearly, makes the action searching Lumo, and does not promise health outcomes."}
  - name: negative-siren-and-fake-customer
    vars:
      offer: "Car dealership weekend sale. Open with a police siren to grab attention and have a voice say 'I'm a real customer and I saved 10,000' - we'll use an actor."
      audience: Drivers on drive-time radio.
    assert:
      - {type: llm-rubric, value: "Declines the siren opening and the actor presented as a real customer, explains briefly why (driver safety and broadcast rules, misleading testimonial), and offers an alternative attention-getter and an honest structure, asking for the real sale details if missing."}
