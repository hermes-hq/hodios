schema: 1
baseline: "Scrivi la retroetichetta e le note di degustazione per questo vino: {{vino}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-etna-rosso
    vars:
      vino: "Etna Rosso 2022, 90% Nerello Mascalese e 10% Nerello Cappuccio. Vigneto sul versante nord dell'Etna a 650 metri, suolo sabbioso vulcanico, alberelli di circa 60 anni. Vendemmia manuale a metà ottobre, fermentazione in acciaio, 12 mesi in botte grande di rovere. 13,5% vol. L'enologa lo descrive: rubino chiaro, ciliegia, fragolina, pepe e note di cenere; tannino fine, acidità viva. Servire a 16 gradi. Cantina familiare dal 1998."
      denominazione: "Etna Rosso DOC"
      spazio_caratteri: 400
    assert:
      - {type: contains, value: "## Termini regolamentati da verificare"}
      - {type: llm-rubric, value: "Retroetichetta entro 400 caratteri con conteggio, che usa versante nord, 650 metri, suolo vulcanico, botte grande e i descrittori dell'enologa; versione breve circa la metà; scheda con vista, naso e bocca coerenti; abbinamenti adatti a un rosso fresco e tannino fine, 16 gradi; elenca 'Etna Rosso DOC' e l'eventuale 'vecchie vigne' tra i termini da verificare; nessun premio inventato."}
  - name: edge-no-denomination-short-space
    vars:
      vino: "Rosato frizzante da uve Lambrusco di Sorbara, rifermentato in bottiglia, 11% vol, profumi di fragola e pompelmo, da bere fresco a 8 gradi."
      spazio_caratteri: 180
    assert:
      - {type: llm-rubric, value: "Testo entro 180 caratteri con conteggio; non usa alcuna denominazione o menzione (né 'Lambrusco di Sorbara DOC' né 'metodo classico') perché non è indicata; segnala che il nome del vitigno e il termine 'rifermentato in bottiglia' vanno verificati per l'uso in etichetta senza denominazione; abbinamenti semplici e coerenti."}
  - name: negative-false-riserva-and-awards
    vars:
      vino: "Sangiovese IGT Toscana 2023, affinamento 6 mesi in acciaio. Il proprietario vuole scrivere 'Riserva', 'biologico' (non certificato) e '95 punti' (mai ricevuti), e che fa bene al cuore."
      denominazione: "Toscana IGT"
      spazio_caratteri: 350
    assert:
      - {type: llm-rubric, value: "Non usa 'Riserva', 'biologico', '95 punti' né benefici per la salute; spiega brevemente che sono menzioni regolamentate o affermazioni non veritiere e vietate; scrive un testo corretto con i soli fatti forniti e mette questi punti nei termini da verificare."}
