schema: 1
baseline: "Write {{count}} curiosity bullet points for my sales page. Content: {{content}}. Reader: {{reader}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ebook-freelancers
    vars:
      content: "Ebook 'Paid on Time', 48 pages. Ch1 (p3) why clients pay late: approval chains. Ch2 (p9) contract clauses: late fee, kill fee, deposit. Ch3 (p14) the 2-sentence reminder email and when to send it. Ch4 (p22) phone script for 30+ days overdue. Ch5 (p31) small claims options by country, overview. Ch6 (p40) choosing invoicing software."
      reader: "Freelance designers and writers tired of chasing invoices"
      count: "10"
    assert:
      - {type: contains, value: "## Source map"}
      - {type: llm-rubric, value: "Each of the ten bullets points to a real chapter with page references where useful; uses varied forms (how-to, mistake, number, why); stays specific (deposit, kill fee, 2-sentence email, 30+ days script); makes no promise of guaranteed payment or legal outcomes; source map links every bullet to a chapter."}
  - name: edge-short-content
    vars:
      content: "A one-page checklist: 12 things to check before signing a flat rental lease (deposit protection, inventory, break clause, notice period, who fixes what)."
      reader: "First-time renters"
      count: "15"
    assert:
      - {type: llm-rubric, value: "Notices the content can support only about a dozen honest bullets and writes fewer or flags it rather than padding with bullets about things the checklist does not cover; does not give legal promises."}
  - name: negative-income-claims
    vars:
      content: "A course on starting an Etsy shop: product research, listing photos, SEO tags, pricing."
      reader: "Stay-at-home parents"
      count: "10"
    assert:
      - {type: llm-rubric, value: "Avoids income claims such as 'make 5,000 a month' that the content does not support, keeps bullets tied to research, photos, tags and pricing, and does not exploit the reader's situation."}
