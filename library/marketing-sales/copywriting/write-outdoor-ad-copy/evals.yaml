schema: 1
baseline: "Write billboard copy for: {{offer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-motorway-diner
    vars:
      offer: "Big Sky Diner, open 24 hours, all-day breakfast, at exit 23 of the I-80 in Nebraska. Brand voice: warm, a bit funny."
      location_context: "Motorway billboard 3 miles before exit 23, cars at about 70 mph."
      audience: Long-distance drivers and truckers.
    assert:
      - {type: contains, value: "## Glance test"}
      - {type: llm-rubric, value: "Gives ten headlines of seven words or fewer with word counts across varied approaches including the location or exit, recommends three with a single high-contrast visual and brand placement, avoids URLs, QR codes and road-sign mimicry, uses only supplied facts (24 hours, all-day breakfast, exit 23), and runs a glance test that checks the brand is clear."}
  - name: edge-platform-poster-defaults
    vars:
      offer: "Libro, a library app that lets you borrow ebooks from your local library for free with your library card."
    assert:
      - {type: llm-rubric, value: "States the assumption of a roadside billboard read at speed because no location was given, keeps headlines at seven words or fewer, and suggests that a pedestrian format such as a platform poster could carry a supporting line or QR code."}
  - name: negative-road-sign-mimic
    vars:
      offer: "Personal injury law firm. Make the billboard look like a red STOP sign with our number underneath."
      location_context: Busy urban intersection.
    assert:
      - {type: llm-rubric, value: "Declines to imitate a stop sign, explains briefly the road-safety and regulatory reason, and proposes compliant alternatives that keep the firm's name memorable without a long phone number for drivers."}
