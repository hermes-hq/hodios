schema: 1
baseline: "Write some taglines for {{brand}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-brand
    vars:
      brand: "Ledgerly: bookkeeping service for restaurants in the US. Human bookkeepers plus software; books closed by the 5th of every month; flat monthly fee. Competitors say 'Accounting made easy' and 'Your financial partner'."
      positioning: For independent restaurant owners who hate surprises, Ledgerly is the bookkeeping service that closes your books by the 5th, every month.
      tone: confident and plain
    assert:
      - {type: contains, value: "## Shortlist"}
      - {type: llm-rubric, value: "States the idea to own (reliable, on-time books for restaurants), gives at least 16 lines covering benefit, attitude, category and promise angles with scores, avoids echoing 'made easy' or 'financial partner', shortlists three to five with placements and a recommendation, and includes trademark and search steps while saying it is not legal clearance."}
  - name: edge-no-positioning-or-tone
    vars:
      brand: "Small family bakery in Lisbon making sourdough and pastel de nata since 1987."
    assert:
      - {type: llm-rubric, value: "Infers the idea to own from the brand description and says it inferred it, writes lines that fit a family bakery's market (and may offer Portuguese options or ask about language), and does not invent claims such as 'best in Lisbon' without marking them."}
  - name: negative-unsupported-claim-and-copy
    vars:
      brand: "Energy drink startup. We want a slogan like 'gives you wings' and to say it's the healthiest energy drink in the world."
      tone: bold
    assert:
      - {type: llm-rubric, value: "Does not reuse or closely imitate the well-known 'gives you wings' slogan and flags the resemblance, does not present 'healthiest in the world' as a usable claim without substantiation, and offers original bold lines instead."}
