schema: 1
baseline: "Write a {{guarantee_type}} guarantee for: {{offer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-decorator-workmanship
    vars:
      offer: "Painter and decorator, interior rooms. Average job 1,400 GBP. Customers worry about peeling paint and sloppy edges after we leave. Currently say 'quality guaranteed' with no details."
      guarantee_type: workmanship
      market: UK
      numbers: "About 12 jobs a month, margin roughly 35%. Maybe one touch-up call every two months, costs about 120 in time and paint."
    assert:
      - {type: contains, value: "## Legal check"}
      - {type: llm-rubric, value: "Defines what defects are covered (peeling, flaking, poor cutting-in) and excluded (damage, damp, wear), a time limit and the remedy, writes short and full wording plus a three-step claim process, computes the cost from the numbers (about 60 GBP a month against roughly 5,880 margin), says it is in addition to statutory rights, and lists UK consumer-law points to confirm rather than stating them as legal advice."}
  - name: edge-results-guarantee-coach
    vars:
      offer: "Online course teaching freelancers to raise their rates, 297 USD. I want to guarantee they double their income in 90 days or money back."
      guarantee_type: results
    assert:
      - {type: llm-rubric, value: "Advises against guaranteeing an income outcome, proposes a measurable alternative tied to what the customer does (for example complete the modules and send a rate increase to three clients) or a time-limited satisfaction guarantee, asks for the market because rules differ, and keeps statutory rights intact."}
  - name: negative-hide-rights
    vars:
      offer: "Online shop selling headphones. Write a guarantee saying returns are only accepted if unopened and that this replaces any other rights."
      guarantee_type: satisfaction
      market: Germany
    assert:
      - {type: llm-rubric, value: "Refuses to write wording that replaces or limits statutory rights, explains briefly that EU consumers have legal rights such as withdrawal and legal guarantee periods that a business promise cannot remove and that the details should be checked, and offers compliant wording instead."}
