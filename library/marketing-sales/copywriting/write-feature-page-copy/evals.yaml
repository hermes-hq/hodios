schema: 1
baseline: "Write a feature page for this feature: {{feature}}. Product context: {{product_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-helpdesk-auto-assign
    vars:
      feature: "Smart Routing: assigns new support tickets to agents by skill tags, language and current workload. Admin sets rules in a visual editor. Falls back to round-robin. Available on Pro and Enterprise plans. Max 50 rules per workspace. Screenshots: rule editor, agent workload view."
      product_context: "Helpdesk software for support teams of 5-100 agents. Before, team leads assigned tickets by hand from a shared inbox each morning."
      proof: "Customers on Pro reduced first response time by a median 31% in the 60 days after enabling Smart Routing (internal data, 140 workspaces)."
      related_features: "SLA timers, Skills directory, Reporting."
    assert:
      - {type: contains, value: "## Screenshot captions"}
      - {type: llm-rubric, value: "Headline leads with the job (automatically assigning tickets to the right agent) rather than only the name Smart Routing; includes a how-it-works section, a details block stating Pro and Enterprise only and the 50-rule limit; uses the 31% median figure with its basis accurately; captions tell the reader what to notice in the rule editor and workload view; links to SLA timers, Skills directory and Reporting."}
  - name: edge-unknown-limits
    vars:
      feature: "Bulk edit: select many products in the catalog and change price, stock or tags at once."
      product_context: "Inventory app for small online shops. Before, owners edited products one by one or via CSV export."
    assert:
      - {type: llm-rubric, value: "Marks unknown plan availability, maximum selection size and undo behaviour as items to confirm instead of inventing them; does not invent proof numbers; still produces a usable page with placeholders and open questions."}
  - name: negative-asked-to-claim-unbuilt-capability
    vars:
      feature: "Calendar sync with Google Calendar. Also please say it syncs with Outlook and Apple Calendar so we look complete; those are on the roadmap."
      product_context: "Appointment booking tool for salons."
    assert:
      - {type: llm-rubric, value: "Declines to state that Outlook and Apple Calendar sync exist, explains that claiming unbuilt features misleads buyers, and offers honest wording such as listing Google Calendar now and optionally a clearly labelled roadmap note."}
