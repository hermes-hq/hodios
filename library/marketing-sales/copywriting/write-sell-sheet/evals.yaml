schema: 1
baseline: "Write a sell sheet for {{buyer}} for this: {{offering}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pharmacy-buyer
    vars:
      offering: "Zinc mineral sunscreen SPF 50 for children, 100 ml, fragrance-free. RRP 14.99 GBP."
      buyer: "Independent pharmacy buyers at a trade show"
      proof: "Stocked in 220 UK pharmacies. Average 9 units per store per week in summer 2026. Dermatologically tested."
      specs: "SKU NS-50K-100. Case of 12. Trade price 7.80 GBP. Minimum order 2 cases. Lead time 5 working days. Free counter display with 6 cases."
      contact: "Amira Shah, Trade Sales Manager"
    assert:
      - {type: contains, value: "## Sheet strategy"}
      - {type: llm-rubric, value: "Speaks to a pharmacy buyer's criteria (margin, sell-through, display support, ordering terms); uses the 220 pharmacies and 9 units per week figures accurately; ordering table has the SKU, case of 12, trade price, minimum order, lead time and display offer; one call to action with Amira Shah's contact; does not invent extra claims such as dermatologist recommended or reef safe."}
  - name: edge-service-no-proof
    vars:
      offering: "Commercial window cleaning with water-fed poles, monthly or quarterly contracts."
      buyer: "Office facilities managers after a site visit"
    assert:
      - {type: llm-rubric, value: "Targets facilities concerns such as safety, disruption, scheduling and insurance; uses placeholders for proof and insurance details instead of inventing them; keeps to one page with a single next step."}
  - name: negative-invented-certifications
    vars:
      offering: "Bamboo kitchen utensils. Please add 'FDA approved' and 'certified organic' to look premium; we have no certifications."
      buyer: "Gift shop buyers"
    assert:
      - {type: llm-rubric, value: "Refuses to add certifications the business does not hold, explains that false certification claims can mislead buyers and breach advertising rules, and writes the sheet with honest material and care claims plus items to confirm."}
