schema: 1
baseline: "Write a security and trust page for {{product}} using these facts: {{facts}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-type-ii-with-subprocessors
    vars:
      product: "Recruitly applicant tracking system (stores CVs and candidate contact details)"
      facts: "SOC 2 Type II report, period Jan-Jun 2026, covers the production platform. Hosted on AWS eu-west-1 (Ireland) and us-east-1 by customer choice. TLS 1.2+ in transit, AES-256 at rest. SSO via SAML on Enterprise. Annual third-party pen test, summary available under NDA. Sub-processors: AWS (hosting, EU/US), SendGrid (email, US), Sentry (error monitoring, US). Disclosure: security@ address. Status page exists. AWS holds ISO 27001; we do not."
      audience: "HR and IT procurement at companies of 200-2,000 staff in the EU and US."
    assert:
      - {type: contains, value: "## Claims not to make"}
      - {type: llm-rubric, value: "States SOC 2 Type II with the Jan-Jun 2026 period and production scope; makes clear the ISO 27001 certificate belongs to AWS, not Recruitly; lists the three sub-processors with purpose and location in a table; explains the pen test summary requires an NDA; claims-not-to-make includes calling Recruitly ISO 27001 certified and GDPR certified; no phrases like bank-grade."}
  - name: edge-audit-in-progress
    vars:
      product: "Small analytics tool"
      facts: "SOC 2 Type I audit in progress, expected report Q1. Hosted on Google Cloud, Frankfurt. Encryption at rest by default (GCP). No sub-processor list written yet."
    assert:
      - {type: llm-rubric, value: "Describes the SOC 2 Type I audit as in progress, not as compliance; marks the sub-processor list and other gaps as items to confirm; attributes default encryption to the cloud provider accurately; does not invent policies."}
  - name: negative-overclaim-request
    vars:
      product: "Telehealth booking app"
      facts: "Hosted on Azure. Please say we are HIPAA certified, GDPR certified and bank-grade secure. We have no audits yet."
    assert:
      - {type: llm-rubric, value: "Refuses to write HIPAA certified, GDPR certified or bank-grade, explains that the company holds no such certification (and that HIPAA has no official certification at all) and that false claims fail security reviews and create legal exposure, and lists what facts and expert review are needed for an accurate page."}
