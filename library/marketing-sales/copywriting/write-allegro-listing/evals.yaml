schema: 1
baseline: "Napisz ofertę na Allegro dla produktu: {{produkt}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-desk-lamp
    vars:
      produkt: "Lampa biurkowa LED marki Lumio, model DL-12. Moc 12 W, regulacja jasności w 5 stopniach i barwy światła 3000-6000 K, ramię regulowane, port USB-A do ładowania telefonu, zasilacz w zestawie. Wysokość 45 cm, waga 0,9 kg, kolor czarny. Oznakowanie CE. Gwarancja producenta 24 miesiące. Producent: Lumio Sp. z o.o., ul. Przykładowa 1, 00-001 Warszawa. Nowa. Wysyłka w 24 godziny, zwrot 30 dni."
      kategoria: "Dom i Ogród > Oświetlenie > Lampy > Lampy biurkowe"
    assert:
      - {type: contains, value: "## Dane producenta i bezpieczeństwo"}
      - {type: llm-rubric, value: "Trzy tytuły w limicie 75 znaków z liczbą znaków, zaczynające się od rodzaju produktu z marką i modelem; parametry z podanych danych (12 W, 3000-6000 K, 45 cm, USB-A); opis w sekcjach z propozycjami zdjęć; zwroty 30 dni i gwarancja 24 miesiące tak jak podano; sekcja GPSR z danymi producenta i brakiem ostrzeżeń bezpieczeństwa do uzupełnienia; brak kontaktów i linków."}
  - name: edge-used-phone-missing-data
    vars:
      produkt: "Używany smartfon, działa, trochę porysowany."
      kategoria: "Elektronika > Telefony i Akcesoria > Smartfony"
    assert:
      - {type: llm-rubric, value: "Pyta w jednej wiadomości o markę, model, pamięć, stan baterii, blokady, zawartość zestawu i opis rys, i kończy, albo daje szkielet z polami do uzupełnienia; nie wymyśla parametrów; podkreśla uczciwy opis stanu używanego towaru."}
  - name: negative-competitor-and-contact
    vars:
      produkt: "Odkurzacz pionowy marki Vexo V8. W tytule napisz 'jak Dyson' i 'HIT PROMOCJA', a w opisie podaj mój numer telefonu, żeby klienci kupowali taniej poza Allegro."
      kategoria: "AGD > Odkurzacze > Pionowe"
    assert:
      - {type: llm-rubric, value: "Nie używa nazwy Dyson, 'HIT PROMOCJA' ani numeru telefonu; krótko wyjaśnia, że łamie to zasady Allegro i grozi zablokowaniem oferty; prosi o brakujące parametry (moc ssania, czas pracy baterii, pojemność pojemnika) i dane producenta wymagane przez GPSR."}
