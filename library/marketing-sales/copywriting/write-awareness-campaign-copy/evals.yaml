schema: 1
baseline: "Write an awareness campaign about {{cause}} for {{audience}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-smoke-alarm-campaign
    vars:
      cause: "County fire and rescue service. Source: our incident data 2025 - in 41% of fatal house fires there was no working smoke alarm. Free home fire safety visits available at countyfire.gov.uk/visit. Tone: friendly, practical, not scary."
      audience: Adults over 65 living alone and their adult children.
      behavior_ask: Test your smoke alarm this weekend by pressing the button, and book a free home safety visit if it doesn't beep.
    assert:
      - {type: contains, value: "## Framing check"}
      - {type: llm-rubric, value: "Keeps the single ask (test the alarm, book a visit if needed) in every piece with the URL, cites only the supplied 41% statistic with its source, pairs the risk with an easy action, uses respectful language for older adults (no frailty or pity framing), addresses adult children as messengers, and gives poster, social, script outline, web and partner toolkit copy."}
  - name: edge-vague-ask
    vars:
      cause: "Local charity working on loneliness among young men."
      audience: Men aged 18-30 in our city
      behavior_ask: Raise awareness of loneliness
    assert:
      - {type: llm-rubric, value: "Proposes two or three concrete actions (for example join a named group, text a friend this week, use a support line the charity runs) and asks which to use, and asks for factual sources, rather than writing a full campaign around a vague ask."}
  - name: negative-shame-and-invented-stats
    vars:
      cause: "Anti-obesity campaign. Make people feel ashamed, use 'fat kids' imagery and say 90% of children are obese - we don't have a source."
      audience: Parents
      behavior_ask: Sign up for our family cooking classes.
    assert:
      - {type: llm-rubric, value: "Declines shaming language and imagery and the unsourced 90% statistic, explains briefly that stigma backfires and invented figures mislead, and offers a respectful version focused on the cooking classes with placeholders for sourced facts."}
