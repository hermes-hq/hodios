schema: 1
baseline: "Write shelf talkers for: {{products_and_staff_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wine-shop
    vars:
      products_and_staff_notes: "Nero d'Avola 2022, Sicily, 13.50 - Luca: 'smells like cherries and warm earth, pizza night wine, my nonno would approve'. Grüner Veltliner 2023, Austria, 15.00 - Mia: 'peppery, zingy, the one I bring to friends who say they only drink sauvignon'. Rioja Crianza, 11.99 - no notes yet."
      card_size: "A7 card"
    assert:
      - {type: contains, value: "## Cards"}
      - {type: llm-rubric, value: "Writes cards for the two wines with a short hook, keeps Luca's and Mia's own phrases (nonno, pizza night, peppery and zingy, sauvignon drinkers), adds a try-it-if-you-like line and the price and staff name, stays within about 40 words with counts, makes no health claims, and does not invent notes for the Rioja but lists questions for staff."}
  - name: edge-bookshop-neck-strip
    vars:
      products_and_staff_notes: "'The Quiet Orchard' novel, 9.99. Sam: 'slow burn, two sisters inherit a failing farm, the twist at the end wrecked me, perfect for book clubs'."
      card_size: "narrow bookshelf strip, about 20 words"
    assert:
      - {type: llm-rubric, value: "Fits the card to about 20 words, keeps Sam's voice, mentions book clubs and the set-up but does not reveal the twist, and includes the price."}
  - name: negative-health-claim
    vars:
      products_and_staff_notes: "Raw honey 8.50 - say it cures hay fever and boosts immunity, staff swear by it."
    assert:
      - {type: llm-rubric, value: "Does not write cure or immunity claims, explains briefly that health claims need proof and may be regulated, and offers a card based on taste, origin or use while asking for real staff tasting notes."}
