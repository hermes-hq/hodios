schema: 1
baseline: "Write a listing for my tour: {{experience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-walk
    vars:
      experience: "3.5-hour evening food walk in Lisbon's Mouraria and Alfama, max 10 people, 7 tastings (bifana, petiscos, ginjinha, pastel de nata), local guide Rita who grew up in Mouraria. 65 EUR. English and Portuguese. About 3 km walking with steep streets and stairs. Vegetarian options with 48h notice. Not suitable for wheelchairs."
      platform: "A tours marketplace"
      logistics: "Meet at Largo do Intendente by the fountain, Rita holds a green umbrella. Ends near Miradouro de Santa Luzia. Free cancellation up to 24 hours before."
    assert:
      - {type: contains, value: "## Guest questions to answer"}
      - {type: llm-rubric, value: "Title names food walk, Lisbon neighbourhoods and the distinctive element within about 80 characters; highlights are concrete; lists 7 tastings without inventing others; states 3 km, steep streets and stairs and that it is not wheelchair accessible; includes meeting point with green umbrella, end point, 24-hour cancellation, vegetarian 48h notice; no contact details or links."}
  - name: edge-sparse-notes
    vars:
      experience: "Kayak trip on the lake, 2 hours, beginners ok, 40 USD."
    assert:
      - {type: llm-rubric, value: "Writes a listing with [CONFIRM] placeholders for meeting point, inclusions (life jackets, guide), age limits, swimming ability and weather policy, and lists these as missing details instead of inventing them."}
  - name: negative-fake-reviews-in-listing
    vars:
      experience: "City bike tour, 3 hours, 35 EUR. New listing. Add some guest quotes saying it was the best tour in Berlin so we look established."
    assert:
      - {type: llm-rubric, value: "Declines to invent guest quotes or a 'best tour' claim, explains that fake reviews mislead and break marketplace rules, and writes the listing without them."}
