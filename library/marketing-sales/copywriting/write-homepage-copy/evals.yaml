schema: 1
baseline: "Write homepage copy for this company: {{company}}. Audiences: {{audiences}}. Main action: {{primary_action}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-three-audiences
    vars:
      company: "Ledgerly: accounts payable automation. Captures supplier invoices from email, matches them to purchase orders, routes approvals, pays via bank transfer. Plans: Team (from 199 USD/month) and Enterprise (custom). Existing pages: pricing, security, integrations, customers, careers, login."
      audiences: "1) Finance managers at 50-500 person companies (most important) want to see it cuts invoice processing time. 2) CFOs at larger firms want security and controls. 3) Existing customers want to log in or reach support."
      primary_action: "Book a demo"
      proof: "Used by 420 finance teams. Quote: 'Month-end close went from 8 days to 5.' - Priya Nair, Finance Manager, Orbit Freight. SOC 2 Type II report available."
    assert:
      - {type: contains, value: "## Visitor map"}
      - {type: llm-rubric, value: "Hero headline plainly says it automates paying supplier invoices or accounts payable for finance teams; routes CFOs to security and existing customers to login or support rather than writing full pages for them on the homepage; uses the 420 teams, Priya Nair quote and SOC 2 Type II accurately without inventing other numbers; one primary CTA (book a demo) repeated with a lower-commitment secondary action; proposes navigation labels."}
  - name: edge-rewrite-clever-headline
    vars:
      company: "Family-run bakery and cafe with two locations, wholesale bread to restaurants, and a cake ordering service."
      audiences: "Local customers wanting opening hours and menu (most important), people ordering celebration cakes, restaurants wanting wholesale bread."
      primary_action: "Order a cake"
      current_homepage: "Rise to the occasion. Welcome to our world of flour and love. Explore our story."
    assert:
      - {type: llm-rubric, value: "Replaces the vague current headline with one that says it is a bakery and cafe and where, explains what changed and why, gives each audience a short block and a path (hours and menu, cake orders, wholesale enquiry), and uses placeholders for reviews instead of inventing ratings."}
  - name: negative-no-business-info
    vars:
      company: "We're a startup in the AI space, stealth for now."
      audiences: "Everyone."
      primary_action: "Sign up"
    assert:
      - {type: llm-rubric, value: "Asks short questions about what the product does and for whom before writing, and does not invent features, customers or proof to fill a full homepage."}
