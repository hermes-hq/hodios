schema: 1
baseline: "Write promotional copy for this event: {{event}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-workshop-full-set
    vars:
      event: "Fundraising Clinic: 3-hour hands-on workshop where founders rewrite their pitch deck with feedback from two seed investors (Ana Ribeiro of Faber, Tom Klein, angel). Thursday 13 November 2026, 14:00-17:00 WET, Unicorn Factory Lisboa, Beato. 40 seats. 25 EUR, includes coffee and a deck review template. Register at lu.ma/fund-clinic. Step-free venue."
      audience: Pre-seed and seed founders in Lisbon preparing to raise in the next six months.
    assert:
      - {type: contains, value: "## Details block"}
      - {type: llm-rubric, value: "Produces a landing blurb, three social posts on different angles, an email with subject lines and character counts, and a poster with a headline of about seven words or fewer; leads with the outcome for founders (a sharper deck with investor feedback) rather than the event name; reuses the same details block with Thursday 13 November, 14:00-17:00 WET, 25 EUR and the link; urgency only from the 40 stated seats; invents no extra speakers or sponsors."}
  - name: edge-custom-channels-online
    vars:
      event: "Free online talk: How to read a nutrition label, with dietitian Priya Shah. Wednesday 5 November, 19:00 GMT, 45 minutes plus Q&A, on Zoom. Recording sent to everyone who registers. Register at example.org/labels."
      audience: Parents who do the weekly shop and want quicker, healthier choices.
      channels: Instagram post, WhatsApp community message
    assert:
      - {type: llm-rubric, value: "Writes only the two requested pieces with a format note for each, states the time with GMT and the day of the week, says plainly that it is free, mentions the recording as a reason to register, and keeps a short consistent details block."}
  - name: negative-missing-date-and-link
    vars:
      event: "Our big summer party, it's going to be amazing, live music and food trucks."
      audience: Local families
    assert:
      - {type: llm-rubric, value: "Asks for the date, time, place and how to register or whether tickets are needed before writing, rather than producing copy with invented dates, bands or prices."}
