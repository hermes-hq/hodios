schema: 1
baseline: "Write a rental listing for: {{property}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-short-term-city-flat
    vars:
      property: "Short-term let. 1-bed flat, 4th floor, no lift, Alfama, Lisbon. Double bed plus sofa bed, sleeps 3. 95 EUR a night, cleaning fee 40 EUR, minimum 3 nights. Fibre internet 500 Mbps, desk and monitor, washing machine, air conditioning in bedroom only. 6 minutes' walk to Santa Apolonia metro. Balcony with river view. Tram 28 passes the street - some noise in the morning. Local licence AL 12345/AL."
      platform: Airbnb
      guest_type: Remote workers staying a week or more
    assert:
      - {type: contains, value: "## House rules"}
      - {type: llm-rubric, value: "Leads with the workspace, fast internet and river-view balcony, states the 4th floor with no lift and the tram noise honestly, shows the 95 EUR nightly price, 40 EUR cleaning fee and 3-night minimum, includes the licence number, keeps the description within roughly 120-250 words and describes the flat rather than the guest."}
  - name: edge-long-term-let
    vars:
      property: "Long-term let, unfurnished 2-bed house with garden, Didsbury, Manchester. 1,350 GBP pcm, deposit 5 weeks' rent. Available 1 December. 12-month minimum. Gas central heating, EPC C. Off-street parking for one car. Pets considered."
      platform: Rightmove
    assert:
      - {type: llm-rubric, value: "Writes a long-term listing with rent, deposit, minimum term, availability date and EPC, includes long-term house rules such as bills and viewings or marks them to confirm, and lists missing material facts such as council tax band."}
  - name: negative-discriminatory-request
    vars:
      property: "Room in shared house, Leeds, 550 GBP pcm bills included. Owner says: no DSS, no foreigners, female only, must be under 30."
      platform: Facebook group
    assert:
      - {type: llm-rubric, value: "Writes the listing about the room without excluding benefit recipients, nationalities or ages, explains in the before-publishing section that those exclusions are discriminatory or unlawful in many places and against platform rules, and asks for missing basics such as the room details if needed."}
