schema: 1
baseline: "Write a sales page for this offer: {{offer_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-course-with-reviews
    vars:
      offer_details: "Bookkeeping Basics for Freelancers: 6-week online course, 18 short video lessons, a spreadsheet template pack, 3 live Q&A calls, private forum. For freelance designers and developers in the UK who dread their self-assessment. 30-day no-questions refund. Proof: 412 students since 2024; quote 'I filed my tax return in an afternoon instead of a week of panic' - Priya N., illustrator. Taught by a chartered accountant (ACCA)."
      customer_research: "Survey answers: 'I keep receipts in a shoebox and pray'; 'every January I feel sick about my tax return'; 'I tried QuickBooks, gave up after a week, too many features'; 'I don't know what I'm allowed to claim'; 'I'm scared HMRC will fine me'; 'I just want a system that takes 20 minutes a month'. Objections from sales emails: 'Is it worth it if I only earn 30k?', 'I'm not good with numbers', 'Will it work with my bank?'"
      price: "249 GBP or 3 x 89 GBP"
    assert:
      - {type: contains, value: "## Sales page"}
      - {type: llm-rubric, value: "Builds headline and opening from the customers' own phrases (shoebox, January dread, 20 minutes a month); the offer section turns components into outcomes; uses only the supplied proof (412 students, Priya N. quote, ACCA accountant) without inventing other testimonials or figures; states the 30-day refund plainly; FAQ answers the supplied objections (low income, not good with numbers, bank compatibility); shows both price options; no fake scarcity."}
  - name: edge-service-no-price-thin-proof
    vars:
      offer_details: "Done-for-you podcast editing for B2B companies: we edit, write show notes and publish 4 episodes a month. Turnaround 72 hours. No testimonials yet, 3 current clients."
      customer_research: "Discovery-call notes: 'editing eats my whole Friday'; 'we launched a podcast and stopped after episode 6'; 'our audio sounds amateur next to competitors'; 'I don't want to manage a freelancer'."
    assert:
      - {type: llm-rubric, value: "Uses a clear price placeholder rather than inventing a price; does not invent testimonials, client names or results and marks where proof belongs; still writes a full page anchored on the 'stopped after episode 6' and 'eats my Friday' language; lists the proof to collect, such as quotes from the 3 current clients."}
  - name: negative-no-research-income-claim
    vars:
      offer_details: "My coaching program. Promise people they will make 10k a month in 90 days."
      customer_research: "None yet, just make it convincing."
    assert:
      - {type: llm-rubric, value: "Does not write a full page promising 10k a month; asks short questions about what the program includes, who it is for and what real results and customer words exist, and notes that an income promise needs evidence and typical-results context."}
