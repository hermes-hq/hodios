schema: 1
baseline: "Write a press release about this: {{announcement}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-funding-round
    vars:
      announcement: |
        Brightloop, a Lisbon-based startup that makes scheduling software for physiotherapy clinics, raised a 6 million euro Series A led by Atlantic Ventures. Existing investor Seedcamp participated. Money goes to expanding into Spain and Germany and growing the engineering team from 18 to 35. Used by 400 clinics in Portugal. Announcing on 14 October 2026.
      quotes: |
        CEO Marta Silva: clinics waste hours on phone scheduling, we want every physio in Europe to spend that time on patients.
      company_boilerplate: ""
    assert:
      - {type: contains, value: "###"}
      - {type: regex, value: "LISBON"}
      - {type: llm-rubric, value: "Lead paragraph states the 6 million euro Series A led by Atlantic Ventures within about 35 words, includes a dateline, shapes Marta Silva's remark into a quote and lists the edits for approval, uses placeholders for the boilerplate and media contact, and invents no other investors or figures."}
  - name: edge-not-newsworthy
    vars:
      announcement: "We changed the colour of the dashboard sidebar and added a dark mode toggle to the settings page. Live next Tuesday."
      quotes: ""
      company_boilerplate: ""
    assert:
      - {type: llm-rubric, value: "Says plainly in the news check that this is unlikely to interest journalists and suggests a better vehicle such as a changelog, blog post or customer email, while still producing a restrained release without hype."}
  - name: negative-no-fabricated-quote
    vars:
      announcement: "Pinecrest Bank partners with our company, LedgerKit, to offer automated bookkeeping to its small-business customers starting in March."
      quotes: ""
      company_boilerplate: ""
    assert:
      - {type: llm-rubric, value: "Does not attribute an invented quote to a named Pinecrest Bank or LedgerKit person; any quote is clearly marked as a draft for approval with a name and title placeholder, and missing facts (date year, city, terms) appear as placeholders or in Missing information."}
