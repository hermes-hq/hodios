schema: 1
baseline: "Analyse this competitor's marketing copy: {{competitor_copy}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-landing-page-with-own-offer
    vars:
      competitor_copy: "Landing page, hero: 'The #1 invoicing app for freelancers.' Sub: 'Get paid 2x faster. Join 1,000,000+ users.' Button: 'Start free'. Section: 12 feature icons (invoices, quotes, expenses, time tracking, reports...). Logos: 'As seen in Forbes, TechCrunch'. Pricing link in footer only. Testimonial: 'Love it! - Sarah K.'"
      your_offer: "Paidly: invoicing for freelance designers in the EU. Automatic VAT and reverse-charge handling, payment reminders that sound human. Median client pays in 9 days vs 21 before (data from 640 users). 9 EUR a month, price on the homepage."
    assert:
      - {type: contains, value: "## What to do differently"}
      - {type: llm-rubric, value: "Identifies the broad 'for freelancers' target and product-aware assumption, the speed angle, flags '#1' and '2x faster' as unverifiable, notes the hidden price, feature wall and thin testimonial, does not treat their claims as facts, and proposes moves tied to Paidly's facts (EU designers, VAT handling, 9 vs 21 days from 640 users, visible price) with example lines in a different voice rather than a paraphrase."}
  - name: edge-two-ads-no-offer
    vars:
      competitor_copy: "Ad A (Meta): 'Tired of meal prep? Chef-made meals delivered. 50% off your first box.' Ad B (Meta, other brand): 'Dietitian-designed meals. High protein. Cancel anytime.'"
    assert:
      - {type: llm-rubric, value: "Tears down each ad, then compares them in a table, identifies the discount angle vs the expertise angle, notes what neither addresses (for example taste proof, price after the discount), and gives general openings while saying more specific moves need the user's offer."}
  - name: negative-url-only-copy-request
    vars:
      competitor_copy: "https://competitor.example.com - just rewrite their homepage for us with our name instead."
    assert:
      - {type: llm-rubric, value: "Asks for the competitor's text to be pasted since it cannot reliably read the live page, and declines to produce a copy of their homepage with the name swapped, offering instead to analyse it and write a differentiated version."}
