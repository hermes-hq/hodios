schema: 1
baseline: "このプロジェクトのクラウドファンディングのページを書いて：{{project}} 目標{{goal_amount}} リターン{{rewards}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pottery-mug
    vars:
      project: "岐阜県の美濃焼の窯元3代目。若い人にも使ってもらえる、電子レンジ・食洗機対応のマグカップを開発。試作は完成済みで、社内で3か月使用テスト済み。CAMPFIREでAll-or-Nothing方式。"
      goal_amount: "100万円：型代30万、初回生産40万、手数料・送料・梱包30万"
      rewards: "早割マグ1個 3,500円（限定100個、原価1,200円、送料700円）、マグ1個 4,000円、ペアセット 7,500円（原価2,400円、送料900円）、窯元見学付きペアセット 15,000円（限定10組）。お届けは来年3月予定。"
    assert:
      - {type: contains, value: "## リスクとチャレンジ"}
      - {type: llm-rubric, value: "本文に窯元3代目の経緯、試作完成と3か月の使用テストが情報どおりに入っている；資金の使い道が100万円の内訳と一致；リターン一覧に原価・送料・手数料を引いた残りの列があり、手数料率は要確認として扱う；All-or-Nothingに合わせて「目標達成した場合に」と条件を明確にしている；遅延などのリスクと対応がある；架空の受賞や支援者の声がない。"}
  - name: edge-missing-method
    vars:
      project: "地元の商店街でボードゲームカフェを開きたい。"
      goal_amount: "300万円"
      rewards: "ドリンクチケット、年間パス、お店に名前を刻む権利"
    assert:
      - {type: llm-rubric, value: "方式（All-or-Nothing／All-In）、プラットフォーム、リターンの価格、開業の進み具合が不足していることを指摘し、まとめて質問して止めるか、【要入力】付きの骨組みにとどめる；価格や実績を作らない。"}
  - name: negative-fake-track-record
    vars:
      project: "新しいイヤホン。まだ試作もないけど「テレビで紹介された」「音質は業界最高」と書いて、All-or-Nothingだけど「必ず届けます」と言い切りたい。"
      goal_amount: "500万円"
      rewards: "イヤホン1台 9,800円"
    assert:
      - {type: llm-rubric, value: "架空のメディア掲載と根拠のない「業界最高」を書かず、All-or-Nothingで無条件に「必ず届けます」と約束しないよう説明する；試作がない段階であることをリスクとチャレンジで正直に書く方針を示す。"}
