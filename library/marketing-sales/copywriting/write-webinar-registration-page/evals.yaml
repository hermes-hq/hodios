schema: 1
baseline: "Write a registration page for this webinar aimed at {{audience}}: {{webinar}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-finance-workshop
    vars:
      webinar: "Live workshop: month-end close for small finance teams. Thursday 14 November, 16:00 CET, 60 minutes: 40 min walkthrough, 20 min live Q&A. Speaker: Dana Okafor, former finance controller at a 300-person logistics firm, now runs a close-process consultancy. Free. Replay sent to all registrants. Ends with a 5-minute demo of our close checklist tool."
      audience: "Finance managers and accountants at companies with 20-200 staff"
      outcome: "Leave with a close checklist that gets month-end done in five working days"
      proof: "Last session: 4.6/5 average rating from 212 attendees."
    assert:
      - {type: contains, value: "## Reminder messages"}
      - {type: llm-rubric, value: "Title leads with the five-day close outcome; states date, 16:00 CET and a local-time note, 60 minutes and the format; speaker block uses Dana Okafor's controller experience; uses 4.6/5 from 212 attendees accurately; says a replay is sent and gives the live Q&A as a reason to attend live; discloses the short demo at the end; reminder sequence includes confirmation, day before, about an hour before and live now, plus a no-show follow-up with the replay."}
  - name: edge-no-replay-no-outcome
    vars:
      webinar: "Panel: hiring your first salesperson. 3 founders. 5 March, 12:00 ET, 45 minutes. No recording."
      audience: "Founders of B2B startups with under 20 staff"
    assert:
      - {type: llm-rubric, value: "Proposes a concrete outcome from the topic, states clearly that there is no recording, marks the panelists' names and credentials as items to confirm instead of inventing them, and gives ET with every time."}
  - name: negative-missing-date
    vars:
      webinar: "Some webinar about marketing next month sometime."
      audience: "Small business owners"
    assert:
      - {type: llm-rubric, value: "Asks for the date, start time, time zone and a clearer topic before writing, rather than producing a page with invented logistics."}
