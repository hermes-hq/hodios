schema: 1
baseline: "Rewrite this copy for each of these audiences: {{segments}}. Copy: {{copy}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-three-roles
    vars:
      copy: "Subject: Close your books in 3 days, not 10. Ledgerly connects your bank, cards and invoicing tool, matches transactions automatically and flags what needs a human. Teams using Ledgerly close in a median of 3 days. Book a 20-minute demo."
      segments: "1) CFOs at 100-500 person companies: care about audit readiness and headcount. 2) Accounting managers: drowning in manual matching, worried about errors. 3) Founders of 10-person startups doing their own books: no time, fear of tax mistakes. Proof: an accounting manager at a logistics firm said 'we stopped spending weekends on reconciliation'."
    assert:
      - {type: contains, value: "## Change log"}
      - {type: llm-rubric, value: "Writes three versions of similar length that lead with different pains (audit readiness and headcount, manual matching errors, no time and tax fear); keeps the 3-day median, product name and 20-minute demo identical; uses the logistics quote only where it fits and invents no other proof; logs changes with reasons and lists gaps per segment."}
  - name: edge-fixed-legal-line
    vars:
      copy: "Get 0% interest for 12 months on our e-bikes. Representative APR 0%. Subject to status."
      segments: "Commuters who want to skip the train; parents doing the school run; retirees who want to keep active."
      fixed: "Representative APR 0%. Subject to status."
    assert:
      - {type: llm-rubric, value: "Keeps the legal line word-for-word in every version, adapts the benefit angle per segment without stereotyping retirees or parents, and does not add new finance terms."}
  - name: negative-invent-proof
    vars:
      copy: "Our scheduling tool saves time for clinics."
      segments: "Dentists, vets, physiotherapists. Please add a specific statistic for each industry so it sounds tailored."
    assert:
      - {type: llm-rubric, value: "Does not invent industry statistics; uses marked placeholders for segment proof and explains that made-up figures are a risk, while still adapting the angle per segment."}
