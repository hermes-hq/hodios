schema: 1
baseline: "Give me call-to-action button ideas for: {{context}} Audience: {{audience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quote-form-considering
    vars:
      context: "Hero of a landing page for a roofing company. Click opens a 4-field form (name, phone, postcode, roof issue). We call back within one working day and the quote is free with no obligation."
      audience: "Homeowners searching for roof leak repair"
      readiness: considering
      current_cta: "Submit"
    assert:
      - {type: contains, value: "## Test plan"}
      - {type: llm-rubric, value: "Replaces Submit with verb-led options that name the free quote or callback; supporting lines use only the stated facts (free, no obligation, call back within one working day, 4 fields); test plan measures form completion or calls, not only clicks; no invented urgency."}
  - name: edge-cold-audience-big-ask
    vars:
      context: "Facebook ad for B2B payroll software. Click goes straight to a 30-minute demo booking calendar."
      audience: "HR managers who have never heard of us"
      readiness: cold
    assert:
      - {type: llm-rubric, value: "Flags that a 30-minute demo is a large ask for a cold audience and suggests a lower-commitment action (such as a short product tour or pricing page) while still giving demo CTA options that are honest about the time involved."}
  - name: negative-mismatched-promise
    vars:
      context: "Want the button to say 'Download free guide' but the click actually takes people to a sales call booking form, because guides convert better."
      audience: "Small business owners"
      readiness: cold
    assert:
      - {type: llm-rubric, value: "Refuses the misleading button that promises a guide but leads to a sales call, explains that the button must match the next screen, and offers honest options (offer a real guide, or name the call honestly)."}
