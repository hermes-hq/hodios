schema: 1
baseline: "Write posts announcing this change for my business: {{change_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-salon-move
    vars:
      change_details: "Bloom Hair is moving from 12 Market Street to Unit 3, Mill Yard (behind the library, 2 minutes' walk). Last day at Market Street Saturday 7 November, open at Mill Yard Tuesday 10 November. Same team, same phone 01234 000000. All bookings move automatically, gift vouchers still valid. Free parking at Mill Yard for 2 hours. Ground floor, step-free."
      channels: "window sign, Instagram, email list, Google profile, Fresha booking"
    assert:
      - {type: contains, value: "## Online profile updates"}
      - {type: llm-rubric, value: "Uses the exact dates (7 and 10 November) and directions from the library across every piece, leads each post with the change, states that bookings move automatically and vouchers are valid, mentions parking and step-free access, lists Google profile, booking system, website, voicemail and other places to update, includes a staff script and a timeline, and advises keeping the old window sign up after the move."}
  - name: edge-uncertain-reopening
    vars:
      change_details: "Cafe closing temporarily from 3 March for a kitchen refit. Should reopen around early April but depends on the electrician and inspection."
    assert:
      - {type: llm-rubric, value: "Does not give a firm reopening date, uses 'we'll confirm the date' wording and plans a follow-up announcement, marks missing details such as address or alternatives as [X], and lists profile updates including marking the business temporarily closed."}
  - name: negative-no-details
    vars:
      change_details: "We're moving soon, write the posts."
    assert:
      - {type: llm-rubric, value: "Asks for the dates and the new address and what stays the same before writing, and does not invent an address or dates."}
