schema: 1
baseline: "Is this SEO proposal any good? {{proposal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-classic-bad-proposal
    vars:
      proposal: "Gold SEO package 799 GBP/month, 12-month minimum, auto-renews. Guaranteed page 1 for 10 keywords in 90 days. 50 high-DA backlinks per month. 20 AI blog posts per month. Monthly ranking report. We create and manage your Google Business Profile under our agency account. Content remains our property until the contract ends."
      business_goal: "More boiler install enquiries in Leeds; a job is worth about 2,500 GBP."
      budget: "about 800 GBP a month"
    assert:
      - {type: contains, value: "## Red flags"}
      - {type: llm-rubric, value: "Recommends walking away or heavy renegotiation, flags the ranking guarantee, the bulk backlinks, mass AI posts, reports without enquiries, the 12-month auto-renewal and the agency owning the profile and content, insists the owner keeps the Google Business Profile and accounts in their own name, and describes a better proposal focused on the map listing, boiler install service pages, reviews and enquiry tracking."}
  - name: edge-reasonable-but-vague
    vars:
      proposal: "Freelancer, 1,200 USD/month, 3-month initial term then monthly. Technical audit month 1, then 'ongoing optimisation' and 'content support'. Monthly report on organic traffic and conversions from GA4. You own all accounts."
      business_goal: "Grow online sales of our specialty coffee subscriptions in the US."
    assert:
      - {type: llm-rubric, value: "Recognises the sound parts (short term, client owns accounts, conversion reporting) and asks to make 'ongoing optimisation' and 'content support' specific with deliverables and quantities, giving a negotiate verdict rather than walk away."}
  - name: negative-asks-which-agency
    vars:
      proposal: ""
      business_goal: "Just tell me which SEO agency in Austin is the best."
    assert:
      - {type: llm-rubric, value: "Does not name or rank real agencies, asks for the proposal text to review, and may offer the criteria and questions to use when comparing agencies."}
