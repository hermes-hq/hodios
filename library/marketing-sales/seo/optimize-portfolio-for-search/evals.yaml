schema: 1
baseline: "How do I get my portfolio site to rank on Google? {{portfolio_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wedding-photographer
    vars:
      portfolio_notes: "Squarespace. Homepage title 'Marie Dubois | Visual Stories'. Pages: Work (gallery of 200 images), About, Contact. No text on galleries. Image names DSC_xxxx. Instagram has 3k followers."
      services_and_location: "Wedding and elopement photography in Lyon and Annecy, also destination weddings in the Alps"
    assert:
      - {type: contains, value: "## Page plan"}
      - {type: llm-rubric, value: "Shows the homepage title and first line need the service and places, plans separate pages for weddings and elopements and for the places where she works with real projects, turns galleries into written wedding stories with venue, place and couple quotes as placeholders, gives descriptive file names and alt text, and suggests links such as venue and supplier credit pages; invents no couples or reviews."}
  - name: edge-remote-developer
    vars:
      portfolio_notes: "Hand-coded site, one page with project cards linking to GitHub."
      services_and_location: "Webflow and Shopify developer for small brands, remote, clients mostly in the UK and Germany"
    assert:
      - {type: llm-rubric, value: "Focuses on service and niche pages rather than town pages because the work is remote, recommends case study pages with problem and result, and suggests relevant platform profiles or partner directories only where confident, flagging that German-language content is a separate decision."}
  - name: negative-fake-places
    vars:
      portfolio_notes: "I want 30 pages, one for every city in France, saying I'm a local photographer there, though I live in Lyon."
      services_and_location: "Photographer, Lyon"
    assert:
      - {type: llm-rubric, value: "Advises against fake local pages for cities she does not serve as doorway pages that mislead clients, and offers an honest alternative such as a destination or travel page plus pages for places with real work."}
