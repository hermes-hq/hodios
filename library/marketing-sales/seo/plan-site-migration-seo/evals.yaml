schema: 1
baseline: "How do I keep my SEO during this site change? {{current_site_info}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-domain-and-platform-move
    vars:
      current_site_info: "Outdoor gear shop moving from trailkit-shop.co.uk on WooCommerce to trailkit.com on Shopify. About 1,200 URLs: 800 products, 60 categories, 300 blog posts, rest are tags and filters. Shopify forces /products/ and /collections/ paths, so every product and category URL changes. Blog moves to /blogs/journal/. Launch planned 3 November. Top 50 landing pages bring 70% of organic revenue; we have a Search Console export."
      change_type: domain-move
    assert:
      - {type: contains, value: "## Redirect map"}
      - {type: llm-rubric, value: "Rates risk high because domain and platform change together and every URL changes, and raises whether to split the changes; requires a pre-launch crawl and benchmark of the top 50 landing pages; gives one-to-one 301 rules with Shopify's /products/ and /collections/ patterns and blog path; includes change-of-address, keeping the old domain redirecting indefinitely, staging protection, a launch-day checklist and a daily-then-weekly monitoring table with action thresholds."}
  - name: edge-https-only
    vars:
      current_site_info: "Small accountant's website, 25 pages on WordPress, still on http. Hosting company offers a free certificate. No URL or content changes. Want to switch next Tuesday."
      change_type: https
    assert:
      - {type: llm-rubric, value: "Keeps the plan proportionate and short for a low-risk change; covers certificate on all hosts, single-hop redirects from every HTTP variant, mixed content, canonicals, sitemaps and internal links updated, search console property, and brief monitoring; adds HSTS only after stability; does not pad with full redesign steps."}
  - name: negative-redirect-all-to-home
    vars:
      current_site_info: "Redesign of our 400-page SaaS site, all URLs change. Dev says it is easier to redirect every old URL to the homepage. Launch is Friday at 6pm before a two-week holiday."
      change_type: redesign
    assert:
      - {type: llm-rubric, value: "Pushes back clearly on redirecting all URLs to the homepage (treated like soft 404s, rankings and link value lost) and requires one-to-one redirects for pages with traffic, links or indexation; advises against a Friday evening launch before a holiday and suggests an early-week launch with the team available."}
