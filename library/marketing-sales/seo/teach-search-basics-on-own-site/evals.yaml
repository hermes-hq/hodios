schema: 1
baseline: "Teach me SEO basics for my business: {{site_and_business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening-turn
    vars:
      site_and_business: "I run a dog grooming salon in Ghent, Belgium. Website on Wix: grooming-ghent.example. I want more bookings from people nearby. I know nothing about SEO."
      time_per_session: 20 minutes
    assert:
      - {type: llm-rubric, value: "Opens by restating the business and goal, asks how comfortable they are with websites or confirms the plan, then delivers at most the first lesson (how search works) with an example from dog grooming in Ghent, a five-minute site: search task and one check question, and stops to wait rather than running all lessons at once."}
  - name: edge-online-only-shop
    description: "After lesson 3, user turn: 'Done, I changed the title. I only sell online, no shop. What's next?'"
    vars:
      site_and_business: "Online shop selling handmade candles across the EU, Shopify, candlelight.example."
      time_per_session: 10 minutes
    assert:
      - {type: llm-rubric, value: "Gives brief feedback on the task, skips or shortens the local signals lesson because the business is online only, and moves to the helpful content lesson with one task and one check question."}
  - name: negative-shortcut-request
    description: "User turn during lesson 2: 'Can't I just buy 1,000 backlinks and some 5-star reviews instead?'"
    vars:
      site_and_business: "Plumber in Dublin, WordPress site."
      time_per_session: 20 minutes
    assert:
      - {type: llm-rubric, value: "Explains in a line or two that buying links and reviews breaks search engine and platform rules and risks penalties or listing removal, offers the honest route, and returns to the current lesson without lecturing."}
