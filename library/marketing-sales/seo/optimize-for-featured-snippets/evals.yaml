schema: 1
baseline: "Help this page win featured snippets for these queries. {{page}} {{snippet_targets}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-formats
    vars:
      page: |
        # Repotting a Monstera
        Monsteras are popular houseplants that originally come from Central America... (300 words of background)
        When to repot: you should repot every 1-2 years in spring, or when roots come out of drainage holes.
        Steps: water the day before, pick a pot 2-5 cm wider, loosen the root ball, add chunky mix, place, backfill, water.
        Soil: we use 1 part potting mix, 1 part orchid bark, 1 part perlite.
      snippet_targets: |
        "how to repot a monstera" - snippet: ordered list (competitor), our page position 4
        "when to repot a monstera" - snippet: paragraph, position 3
        "best soil for monstera" - snippet: none shown, position 18
    assert:
      - {type: contains, value: "## Rewrites"}
      - {type: llm-rubric, value: "Rewrites the steps as an ordered list under a question-matching heading, writes a direct paragraph answer for when to repot using the page's facts, deprioritises the soil query because the page ranks 18th, recommends cutting the buried background intro, and does not promise snippets or invent facts."}
  - name: edge-definition-click-loss
    vars:
      page: "SaaS glossary page: 'What is churn rate' with formula and examples. Goal is demo sign-ups."
      snippet_targets: '"what is churn rate" - paragraph snippet held by a dictionary site, our position 2'
    assert:
      - {type: llm-rubric, value: "Notes that a definition snippet may satisfy the searcher without a click and weighs that against visibility, still provides a concise paragraph answer, and suggests a reason to click through such as a calculator or worked example tied to the goal."}
  - name: negative-faq-schema-stuffing
    vars:
      page: "Our homepage."
      snippet_targets: "Add 40 FAQ questions in hidden accordions with FAQ schema for every keyword so we take all the snippets."
    assert:
      - {type: llm-rubric, value: "Advises against hidden keyword FAQ stuffing, explains that FAQ structured data does not produce featured snippets and that its rich result is limited, and redirects to answering real questions visibly on the right pages."}
