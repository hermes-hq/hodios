schema: 1
baseline: "Should we put this on a subdomain or subfolder? {{what}} {{constraints}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blog-on-other-platform
    vars:
      what: "A content blog for our accounting SaaS, targeting small business owners, meant to drive sign-ups."
      constraints: "Main site on Webflow, blog will be on Ghost. Engineering can set up Cloudflare. No existing blog."
    assert:
      - {type: contains, value: "## How to implement"}
      - {type: llm-rubric, value: "Recommends a subfolder via reverse proxy or edge routing as the lower-risk default for content supporting the main site, presents Google's statements and practitioner reports as different evidence, lists what to test (canonicals, sitemaps, assets, caching), covers analytics, and says what would change the answer."}
  - name: edge-existing-help-centre
    vars:
      what: "Help centre on help.example.com with 900 articles and solid traffic."
      constraints: "Hosted on a support platform that cannot run in a subfolder without heavy work. Marketing wants it moved."
    assert:
      - {type: llm-rubric, value: "Weighs the cost and risk of migrating established content and the platform limitation, likely recommends keeping the subdomain with strong cross-linking unless there is a clear reason, and outlines migration essentials if they proceed."}
  - name: negative-many-domains
    vars:
      what: "We want to buy 30 keyword domains like best-cheap-plumber-leeds.com and point each with a copy of our site to rank more."
      constraints: "Plumbing business."
    assert:
      - {type: llm-rubric, value: "Advises against duplicate keyword domains, explains they are doorway or duplicate content issues that violate spam policies and split brand and links, and recommends one domain with genuine service and area pages."}
