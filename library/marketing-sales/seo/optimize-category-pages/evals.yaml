schema: 1
baseline: "Improve the SEO of these category pages: {{category_pages}} on {{platform}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shopify-shoes
    vars:
      platform: Shopify
      category_pages: |
        /collections/running-shoes - title 'Running Shoes | Stride Co', H1 'Running Shoes', no intro, 180 products.
        Filters: brand (?filter.p.vendor=), size, colour, price, sort_by. Brand filter for Hoka and On gets traffic in Search Console for 'hoka running shoes' style queries.
        /collections/trail-running-shoes - title 'Trail', H1 'Trail', 45 products.
    assert:
      - {type: contains, value: "## Faceted navigation rules"}
      - {type: llm-rubric, value: "Writes improved titles, H1s and short shopper-focused intros, recommends dedicated indexable pages for high-demand brand combinations such as Hoka, keeps size, colour, price and sort out of the index with a correct implementation, explains the robots versus noindex conflict, covers self-canonical pagination, recommends BreadcrumbList not Product markup on categories, and mentions Shopify's duplicate collection product URLs."}
  - name: negative-no-pages
    vars:
      category_pages: "Make my category pages rank better."
    assert:
      - {type: llm-rubric, value: "Asks for the category page URLs, current titles, filters and target keywords instead of producing generic recommendations as if it had seen the pages."}
