schema: 1
baseline: "Is this domain safe to buy for SEO? {{domain}} {{findings}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spammy-history
    vars:
      domain: brightpath.com
      findings: |
        Archive: 2009-2016 a small coaching business. 2017-2019 Japanese-language pages selling replica watches. 2020-2024 parked. Seller asks $8,000, says "DA 45".
        Backlinks: 1,900 referring domains; 70% from 2018 with anchors like "cheap replica rolex", 15% blog comments, ~60 links from 2010-2015 coaching sites.
        site: search shows 0 results.
      plan: "New brand for our career-coaching app."
    assert:
      - {type: contains, value: "## Verdict"}
      - {type: llm-rubric, value: "Identifies the replica-watch period as hacked or spam repurposing and the manipulative 2018 anchors, notes zero indexed pages as a possible signal to investigate, treats DA as a third-party estimate, gives a conditional or walk-away verdict with a lower price rationale, and lists post-purchase steps including checking Manual Actions in Search Console and serving 410s for spam URLs, plus a trademark check suggestion."}
  - name: edge-clean-acquisition
    vars:
      domain: localgardenblog.co.uk
      findings: "Same owner since 2012, consistent gardening content, 140 referring domains from gardening sites and local press."
      plan: "Acquire and merge into our garden centre site."
    assert:
      - {type: llm-rubric, value: "Rates it as clean and relevant, recommends merging content with one-to-one redirects to matching pages rather than a blanket redirect to the homepage, and notes checks that can only happen after transfer."}
  - name: negative-expired-domain-redirects
    vars:
      domain: "50 expired domains"
      findings: "High authority expired domains in unrelated niches."
      plan: "Redirect them all to our supplement store to boost rankings."
    assert:
      - {type: llm-rubric, value: "Refuses to recommend redirecting unrelated expired domains for link value, explains expired domain abuse and that engines aim to neutralise it, and suggests legitimate link earning."}
