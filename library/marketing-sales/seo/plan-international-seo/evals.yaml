schema: 1
baseline: "Plan international SEO for {{site}} expanding to {{target_markets}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shopify-eu
    vars:
      site: "UK online shop for outdoor gear on Shopify, example.co.uk, English only, GBP prices, ships to UK. 120k organic visits a month."
      target_markets: "1. Germany and Austria (same products, EUR, need German). 2. Ireland (English, EUR). 3. Spain later."
    assert:
      - {type: contains, value: "## Hreflang plan"}
      - {type: llm-rubric, value: "Distinguishes Ireland needing an en-IE country version (EUR) from the UK version, considers de-DE and de-AT or a shared de version with reasoning, recommends a structure with trade-offs given the .co.uk domain and Shopify, gives a correct reciprocal hreflang example with self-reference and x-default, warns against IP redirects, and advises native-language keyword research rather than translation."}
  - name: edge-non-google-market
    vars:
      site: "B2B SaaS, example.com, English, US-focused, WordPress."
      target_markets: "South Korea and Japan, because two big customers asked for local versions."
    assert:
      - {type: llm-rubric, value: "Notes Naver's importance in South Korea alongside Google, uses ko-KR and ja-JP or ko and ja codes correctly, stresses native-speaker localisation and research, and phases rollout starting with the highest-value pages."}
