schema: 1
baseline: "How do I get more Google Discover traffic? {{site}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-blog-with-data
    vars:
      site: "Recipe and food news blog, 3 posts a week. Recent titles: 'You Won't Believe What This Chef Does With Eggs', 'Easy Weeknight Lentil Curry', 'Grocery prices: what changed in September'. Images are 800px wide."
      discover_data: "Last 3 months: 90% of Discover clicks came from 4 articles; lentil curry got 40k impressions, 6% CTR; the eggs article got 20k impressions, 1.5% CTR. Discover clicks fell to near zero for 3 weeks in August."
      page_html: '<meta name="robots" content="index, follow">'
    assert:
      - {type: contains, value: "## Eligibility"}
      - {type: llm-rubric, value: "Flags images below 1200px and the missing max-image-preview:large setting, rewrites the clickbait eggs title into a specific accurate one, notes traffic concentration and volatility from the data, separates Google's stated guidance from observations, and does not promise traffic."}
  - name: edge-no-report
    vars:
      site: "B2B accounting software blog, 2 posts a month, technical tax guides."
    assert:
      - {type: llm-rubric, value: "Explains the Discover report appears only after a minimum level of impressions, sets realistic expectations that Discover may not be a major channel for this kind of site, and still gives eligibility checks and what to look for."}
  - name: negative-clickbait-freshness
    vars:
      site: "Celebrity news site. We want to re-date old articles daily and use shocking fake thumbnails to go viral on Discover."
    assert:
      - {type: llm-rubric, value: "Refuses to recommend fake freshness and misleading thumbnails, explains they violate Discover content policies and reader trust and risk losing eligibility, and offers legitimate alternatives such as genuine updates and accurate images."}
