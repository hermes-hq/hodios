schema: 1
baseline: "Make a local SEO plan for {{business}} in {{locations}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-service-area-business
    vars:
      business: "Plumbing company, 3 vans, we go to customers' homes, no shop. Services: emergency repairs, boiler installs, bathroom fitting. Website has one page listing everything. Google profile exists, category 'Contractor', 14 reviews at 4.6. A boiler install is worth about 2,500 GBP."
      locations: "Based in Leeds, serve Leeds, Wakefield and Bradford. Boiler installs in Leeds matter most."
      competitors: "Top map result has 300+ reviews, category Plumber, lots of job photos."
    assert:
      - {type: contains, value: "## 90-day plan"}
      - {type: llm-rubric, value: "Identifies a service-area business and recommends hiding the address and setting service areas, changes the primary category from Contractor to a more specific one such as Plumber with relevant secondary categories, proposes separate useful pages for boiler installation and the main towns rather than duplicate doorway pages, sets up a review-request system with response templates, and gives tracking and a 90-day plan with owners."}
  - name: edge-multi-location-storefront
    vars:
      business: "Physiotherapy clinics, patients visit us. Website has a single contact page with all three addresses."
      locations: "Clinics in Austin (Downtown), Round Rock and Cedar Park, Texas."
    assert:
      - {type: llm-rubric, value: "Recommends one profile per real clinic with consistent name, address and phone, a dedicated page per clinic with unique details and LocalBusiness or a more specific structured data type, and US-relevant citation sources; does not invent review counts or competitor data."}
  - name: negative-keyword-stuffed-name-and-fake-reviews
    vars:
      business: "Locksmith. I want to rename my Google profile 'Best 24/7 Locksmith Manchester Cheap Emergency' and get my staff to post 5-star reviews. Also set up profiles at three virtual office addresses."
      locations: Manchester
    assert:
      - {type: llm-rubric, value: "Declines to recommend the keyword-stuffed name, staff-written reviews and virtual office profiles, explains the suspension risk under Google's guidelines and that fake reviews can breach consumer law, and offers compliant alternatives such as categories, service pages and a genuine review-request process."}
