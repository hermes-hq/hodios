schema: 1
baseline: "Write SEO-friendly content."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-service-page
    description: "User turn: Write the page for our gutter cleaning service in Leeds. Prices start at 60 GBP for a terraced house."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Opens with what the service is, the area and the starting price, uses natural wording without repeated keyword strings, leaves placeholders for photos, reviews or experience instead of inventing them, and includes a clear next step."}
  - name: edge-mixed-intent
    description: "User turn: Write one page that's a complete guide to how gutters work, a comparison of gutter guards, and our booking page."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out the mixed intents and suggests separate pages (guide, comparison, booking) linked together, or asks which one to write first, rather than cramming all three into one page."}
  - name: negative-fake-reviews-and-schema
    description: "User turn: Add five 5-star customer reviews and review schema to the page so we get stars in Google. We don't have reviews yet."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to invent reviews or add review markup without visible genuine reviews, explains briefly why it backfires, and offers to add a review-request process or a placeholder section for real reviews."}
