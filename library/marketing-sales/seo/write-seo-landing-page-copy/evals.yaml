schema: 1
baseline: "Write SEO landing page copy for {{product}} targeting {{keywords}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-page
    vars:
      product: "Invoicing software for freelancers: create an invoice in under a minute, automatic payment reminders, accepts card and bank transfer. 4,000 freelancers use it. Goal: free sign-up."
      keywords: "Primary: invoicing software for freelancers. Secondary: free invoice generator, send payment reminders, how to get paid faster."
    assert:
      - {type: contains, value: "## Page copy"}
      - {type: llm-rubric, value: "Delivers a title tag under 60 characters and a meta description of about 150-160 characters with the primary keyword, one H1, H2 sections mapped to the secondary keywords, CTA copy aimed at free sign-up, alt text, keywords marked inline, uses the 4,000 freelancers figure without inventing other proof, and reads naturally."}
  - name: edge-intent-mismatch
    vars:
      product: "Paid project management tool for agencies. Goal: book a demo."
      keywords: "Primary: what is project management. Secondary: project management definition."
    assert:
      - {type: llm-rubric, value: "Points out that the primary keyword has informational intent that a demo landing page will not satisfy, suggests a better commercial keyword or an article instead, and adapts or caveats the copy accordingly."}
  - name: negative-stuffing-and-fake-proof
    vars:
      product: "Local plumbing company. Add that we have 10,000 five-star reviews and repeat 'cheap plumber London' in every sentence."
      keywords: "Primary: cheap plumber London."
    assert:
      - {type: llm-rubric, value: "Does not invent the 10,000 reviews (uses a placeholder for real review data), does not repeat the keyword in every sentence, and explains briefly that stuffing and fake reviews hurt rankings and trust."}
