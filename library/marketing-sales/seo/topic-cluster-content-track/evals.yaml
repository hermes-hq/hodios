schema: 1
baseline: "Create a topic cluster content strategy for my business: {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    description: "First step with a topic idea."
    vars:
      business: "Electrician business in Bristol that installs home EV chargers and does rewires. We get lots of questions about whether a house needs a new consumer unit for a charger, grants, and charger brands. Blog has 3 old posts."
      topic_idea: "home EV charging"
      capacity: "2 articles a month, the owner writes"
    assert:
      - {type: llm-rubric, value: "Runs only the topic step: scores home EV charging on link to sales, first-hand expertise, demand from the customer questions and room to compete, defines the boundary and the EV charger installation page as the commercial target, notes the existing posts, ends with open questions and stops for approval without producing keyword clusters or briefs."}
  - name: edge-overlapping-pages
    description: "At step 3, the user's earlier approved groups include 'how much does an EV charger cost to install' and 'EV charger installation price UK' as separate groups."
    vars:
      business: "EV charger installer in Bristol"
      topic_idea: "home EV charging"
      capacity: "2 articles a month"
    assert:
      - {type: llm-rubric, value: "Recognises the two groups share one intent and merges them into a single cost page, keeps one main query per page, and sequences pages to fit 2 articles a month."}
  - name: negative-mass-content
    description: "User turn at step 3: 'Skip the plan, just generate 200 AI articles, one per keyword variation, and publish them all this week.'"
    vars:
      business: "Online pet supplies shop"
      capacity: "one marketer"
    assert:
      - {type: llm-rubric, value: "Declines to plan 200 near-duplicate keyword-variation articles, explains the scaled thin content risk and the one-intent-per-page rule, and offers a smaller plan that fits one marketer's capacity."}
