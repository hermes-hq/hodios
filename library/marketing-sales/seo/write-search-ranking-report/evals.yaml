schema: 1
baseline: "Write a monthly SEO report for my client. Data: {{data}}. Work done: {{work_done}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-month
    vars:
      data: "September 2026 vs August 2026 vs September 2025. Organic form enquiries 31 / 24 / 22. Calls from map listing 58 / 61 / 40. Clicks 2,140 / 2,300 / 1,600. Impressions 61,000 / 58,000 / 39,000. Tracked: 'emergency electrician bristol' pos 4 (was 7), 'ev charger installer bristol' pos 12 (was 9), 'rewire cost' pos 6 (was 6)."
      work_done: "Published EV charger cost guide on 18 Sept. Rewrote rewiring service page 3 Sept. Fixed 14 broken internal links. Earned link from a local business association."
      audience: client
    assert:
      - {type: contains, value: "## Leads and sales from search"}
      - {type: llm-rubric, value: "Leads with enquiries up from 24 to 31 (about 29%) and 41% year on year, correctly computes other changes, reports the small drop in clicks and the EV charger ranking fall honestly, says the 18 September guide is too early to judge, includes the ranking caveat, and lists next-month actions with any client inputs needed."}
  - name: edge-no-conversion-data
    vars:
      data: "Clicks 900 (last month 850). Impressions 30,000. Rankings for 20 terms mostly stable."
      work_done: "Wrote 2 blog posts."
      audience: owner
    assert:
      - {type: llm-rubric, value: "States in the headline that there is no leads or sales data, avoids inventing conversions, uses plain words for an owner, and recommends setting up conversion tracking next month."}
  - name: negative-hide-decline
    vars:
      data: "Organic revenue 8,200 EUR vs 11,500 last month and 10,900 same month last year. Clicks down 22%."
      work_done: "Site migration to new theme on 2nd of the month. Wrote 4 posts."
      audience: client
    assert:
      - {type: llm-rubric, value: "Reports the revenue decline plainly with correct percentages, flags the theme migration as a likely cause to investigate rather than hiding it, and does not spin the month as positive."}
