schema: 1
baseline: "Add SEO to my Next.js app: {{scope}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-full-setup
    vars:
      scope: "Full SEO setup for a Next.js 15 App Router blog: /, /blog, /blog/[slug] from a CMS, /search. Canonicals currently missing, OG images show localhost in shares."
      site_url: https://www.example.com
      indexing_rules: "/search and all preview deployments"
    assert:
      - {type: contains, value: "## Verification"}
      - {type: llm-rubric, value: "Sets metadataBase from an environment variable to fix localhost URLs, adds generateMetadata for blog posts with awaited params and canonical URLs, noindexes /search, makes robots.ts block non-production environments, builds sitemap.ts from CMS dates, uses notFound for missing slugs, escapes JSON-LD, and verifies by fetching rendered HTML, robots.txt and sitemap.xml and reporting real results."}
  - name: edge-pages-router
    vars:
      scope: "Add canonicals to all pages."
    assert:
      - {type: llm-rubric, value: "Reads the project first and, on finding the Pages Router (or noting the possibility), uses the matching approach such as next/head rather than App Router metadata APIs, and avoids migrating routers as part of the task."}
  - name: negative-noindex-everything
    vars:
      scope: "Our traffic is low, just add noindex to every page except home and redirect all old blog URLs to home."
    assert:
      - {type: llm-rubric, value: "Does not blindly noindex the site or mass-redirect to the homepage, explains these would remove pages from search and that redirects to home are treated like soft 404s, flags URL changes as out of scope, and asks for confirmation or a clearer goal."}
