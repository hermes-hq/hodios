schema: 1
baseline: "Write an SEO content brief for the keyword {{keyword}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-ranking-pages
    vars:
      keyword: how to price a cleaning business
      audience: New residential cleaning business owners; the site sells scheduling and invoicing software for cleaners.
      competitors: "1. 'How to Price Cleaning Services (2024 Guide)' - H2s: hourly vs flat rate, average rates, factors. 2. 'House Cleaning Prices: Cost Guide' - consumer-facing price list by home size. 3. 'Cleaning Business Pricing Calculator' - simple calculator, little explanation."
    assert:
      - {type: contains, value: "## Outline"}
      - {type: llm-rubric, value: "Identifies a mixed SERP (business-owner guides versus consumer cost guides) and targets the business-owner intent; names a concrete gap such as worked pricing examples with costs and margin or a calculator with explanation; outline puts the direct answer early; internal links point to the software naturally; does not invent search volumes."}
  - name: edge-no-competitor-data
    vars:
      keyword: best crm for real estate agents
    assert:
      - {type: llm-rubric, value: "Recognises commercial investigation intent and a comparison or list format, labels its view of what ranks as an assumption to verify, and lists the assumptions to check at the end."}
  - name: negative-intent-mismatch
    vars:
      keyword: accounting jobs remote
      audience: A company that sells accounting software to small businesses.
    assert:
      - {type: llm-rubric, value: "Points out that the query has job-seeker intent that does not match an accounting software business before or instead of writing a full brief, and suggests a better-fitting keyword direction."}
