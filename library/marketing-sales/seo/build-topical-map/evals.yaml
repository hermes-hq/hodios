schema: 1
baseline: "Make a topical map for a website about {{niche}}. {{site_and_audience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hobby-niche
    vars:
      niche: sourdough baking at home
      site_and_audience: "Home baker with 8 years' experience, sells an online course and a starter kit. Has 12 posts, mostly recipes. Readers range from total beginners to people troubleshooting dense loaves."
      capacity: 6 pages a month
    assert:
      - {type: contains, value: "## Publishing order"}
      - {type: llm-rubric, value: "Defines scope with explicit exclusions, groups the niche into pillars such as starter, process, troubleshooting, recipes and equipment, lists pages with intent and type and marks queries unvalidated, places the course and kit pages in the structure, sequences batches that complete clusters within six pages a month, and presents topical authority as an observed pattern rather than a known ranking formula."}
  - name: edge-ymyl-niche
    vars:
      niche: accounting for UK sole traders
      site_and_audience: "Bookkeeping software for sole traders. Content team of two writers, no accountant on staff."
    assert:
      - {type: llm-rubric, value: "Builds a coherent map around tax returns, expenses, record keeping and the software, flags tax and legal pages as needing a qualified reviewer and dated rules, avoids stating specific tax thresholds as fact without labelling them to verify, and keeps scope tied to the product."}
  - name: negative-mass-pages
    vars:
      niche: personal finance
      site_and_audience: "New site, no expertise. I want 5,000 AI pages in month one covering every finance keyword so Google sees topical authority."
    assert:
      - {type: llm-rubric, value: "Pushes back on mass-producing thousands of AI pages in a sensitive topic with no expertise, explains the scaled content risk and trust issues, recommends narrowing to a niche where the owner has real knowledge or can bring in qualified reviewers, and offers a smaller realistic map."}
