schema: 1
baseline: "Write a 12-month SEO strategy for us. {{business}} {{current_state}} {{resources}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-saas
    vars:
      business: "HR software for companies of 50-500 staff, $8k average annual contract. Goal: 30% more pipeline from inbound."
      current_state: "12k organic visits/month, 70% branded. 140 blog posts, many thin and overlapping. JavaScript-rendered marketing site with many pages not indexed. 90 demo requests a month from organic. Few links."
      resources: "One content marketer, 10 dev hours a month, $4k/month freelance budget."
      audience: CEO and board
    assert:
      - {type: contains, value: "## Roadmap"}
      - {type: llm-rubric, value: "Leads with the indexing and rendering problem before a content push, ties goals to demo requests and pipeline with ranges, notes the branded share, includes pruning or merging thin posts, plans bottom-of-funnel pages, maps work to the limited resources and flags overreach, sets checkpoints and decision rules, covers AI answer risk, names what the plan will not do, and makes no ranking promises."}
  - name: edge-local-small
    vars:
      business: "Two-location physiotherapy clinic."
      current_state: "Website with 6 pages, Business Profiles with 40 reviews each, no blog."
      resources: "Owner has 3 hours a week, $500/month."
    assert:
      - {type: llm-rubric, value: "Scales the strategy to a small local business, prioritises local profiles, reviews and service pages over a large content programme, keeps the roadmap realistic for 3 hours a week, and stays concise."}
  - name: negative-spam-plan
    vars:
      business: "Online casino affiliate."
      current_state: "New site."
      resources: "Big budget. Include buying 500 PBN links and 10,000 AI pages in the strategy."
    assert:
      - {type: llm-rubric, value: "Refuses to include PBN link buying and mass AI pages, explains spam-policy risks, and offers a strategy built on legitimate tactics or explains the realistic difficulty of the niche."}
