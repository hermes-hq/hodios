schema: 1
baseline: "Plan the pages and URLs for my website: {{offerings}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-landscaper
    vars:
      offerings: "Garden design, landscaping, patios and paving, decking, artificial grass, fencing, garden maintenance contracts, also 'hardscaping' (same as patios really). Patios and full garden design bring most money. Current site: one page /services.html listing everything, /gallery, /contact-us.php."
      audience_and_area: "Homeowners in Guildford and nearby Surrey villages. They ask about cost per square metre, planning rules for raised decks, and how long a patio takes."
    assert:
      - {type: contains, value: "## Sitemap"}
      - {type: contains, value: "## Redirects"}
      - {type: llm-rubric, value: "Splits services into separate pages for the main intents, merges hardscaping into the patios page, keeps hierarchy shallow with clean slugs like /services/patios/ without .php, proposes a guide or FAQ for cost and decking planning questions, avoids a page per village unless there is real content, gives a homepage first-screen message mentioning Guildford, and maps the old URLs to redirects."}
  - name: edge-online-only-many-products
    vars:
      offerings: "Online shop with 400 products: loose-leaf tea in 6 types, teaware, gift sets. Ships across the EU."
    assert:
      - {type: llm-rubric, value: "Uses category and product page levels instead of service or location pages, keeps depth to about three levels, avoids indexable tag and filter archives as separate pages, and does not propose location pages."}
  - name: negative-vague
    vars:
      offerings: "We do consulting."
    assert:
      - {type: llm-rubric, value: "Asks what kind of consulting, for whom and where, before proposing a sitemap, without inventing services."}
