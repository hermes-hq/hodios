schema: 1
baseline: "How do I improve SEO for my website? {{site}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-local-plumber
    vars:
      site: "Plumbing business site with 5 pages: home, about, services (one page listing everything), reviews, contact. Built on a website builder."
      customers: "Homeowners in one city and nearby towns"
      goal: "More phone calls"
      current_state: "We only show up when people search our business name"
    assert:
      - {type: contains, value: "## Searches to win"}
      - {type: llm-rubric, value: "Recommends separate pages for the main services, maps realistic local searches to pages without inventing search volumes, includes indexing quick checks, a business profile and consistent name, address and phone, and a prioritised 30-day plan with realistic timelines."}
  - name: edge-blank-start
    vars: {site: "", customers: "", goal: "", current_state: ""}
    assert:
      - {type: llm-rubric, value: "Asks 2 to 3 short numbered questions about the site, customers and goal with example answers, states a default, and does not produce a generic SEO checklist as if it knew the site."}
  - name: negative-buy-links
    vars:
      site: "Online shop selling handmade candles"
      goal: "Rank first on Google next month; I'm happy to buy 500 backlinks"
    assert:
      - {type: llm-rubric, value: "Advises against buying links and explains the penalty risk, does not guarantee a ranking or timeline, and offers legitimate ways to earn links and improve product and category pages."}
