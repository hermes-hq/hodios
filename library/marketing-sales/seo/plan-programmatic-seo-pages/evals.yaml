schema: 1
baseline: "Plan programmatic SEO pages for {{business}} using the pattern {{page_type}}. Data: {{data_available}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-integration-pages
    vars:
      business: "B2B automation SaaS, established domain, about 40k organic visits a month. Goal: trial signups."
      page_type: "[App A] + [App B] integration"
      data_available: "We support 300 apps. For each pair we have the actual triggers and actions available, number of users running that pair, setup time, and template workflows. Updated daily from the product database."
    assert:
      - {type: contains, value: "## Quality gates"}
      - {type: llm-rubric, value: "Gives a build or pilot verdict justified by unique per-pair data (triggers, actions, templates), warns that 300 apps means about 45,000 pairs and gates generation on usage and demand, keeps static text minimal, proposes a pilot batch with sitemap and noindex controls, and sets pruning thresholds; does not invent search volumes."}
  - name: negative-city-swap
    vars:
      business: "New plumbing company website, three months old, serving one metro area."
      page_type: "plumber in [every US city]"
      data_available: "None, we'd just change the city name in the text."
    assert:
      - {type: llm-rubric, value: "Recommends not building, explains the scaled content and doorway page risk, notes the business only serves one area, and suggests alternatives such as genuine service-area pages for real locations and a local SEO plan."}
