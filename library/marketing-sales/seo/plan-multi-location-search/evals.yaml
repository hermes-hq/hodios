schema: 1
baseline: "Make a local SEO plan for my business with several locations: {{locations}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opticians
    vars:
      locations: "Four optician shops in Northern Ireland: Belfast city centre (120 reviews, 4.7), Lisburn (35 reviews), Bangor (8 reviews, hearing tests too), Newry (closed in June, moved to Banbridge, new profile not made). All owned."
      current_setup: "Each manager made their own Google profile using personal emails. Website has one /stores page listing addresses. Two profiles exist for Lisburn. Nobody answers reviews except Belfast."
    assert:
      - {type: contains, value: "## Who owns what"}
      - {type: llm-rubric, value: "Moves profiles under a central business account with managers as managers, resolves the Lisburn duplicate, marks Newry as moved or closed and creates a Banbridge profile, proposes one page per branch with branch-specific content such as hearing tests in Bangor, sets a review process per branch, gives a responsibility table and a phased rollout starting with data fixes."}
  - name: edge-franchise
    vars:
      locations: "12 franchised carpet cleaning territories in Ohio, franchisees work from home and travel to customers."
    assert:
      - {type: llm-rubric, value: "Treats them as service-area businesses with hidden home addresses, notes the franchise agreement governs profile ownership, warns against profiles at addresses without staffed premises, and plans territory pages with real local content."}
  - name: negative-virtual-offices
    vars:
      locations: "One real office in Leeds. I want profiles at 15 virtual office addresses across the UK to look like a national chain."
    assert:
      - {type: llm-rubric, value: "Declines to recommend virtual office profiles, explains the guideline breach and suspension risk, and offers alternatives such as service area settings and useful service pages."}
