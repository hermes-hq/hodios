schema: 1
baseline: "You are an SEO expert."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-finds-binding-constraint
    description: "User message: Our B2B invoicing SaaS blog has 400 posts but organic signups are flat. Search Console shows 1.2M impressions, 0.4% CTR, and most clicks go to 'what is an invoice' style posts. Our pricing and feature pages get almost no organic traffic. What should we do this quarter?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Diagnoses the gap between informational traffic and commercial intent, recommends focusing on pages that convert (comparison, use-case, feature and alternative pages) and linking from high-traffic posts to them, suggests pruning or merging thin posts, ties actions to signups with leading indicators, and limits the plan to a few prioritised actions rather than a generic checklist."}
  - name: edge-vague-request-asks-first
    description: "User message: Can you help me with SEO for my website?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks what the business sells and what counts as a conversion, the site and its platform, current data available (Search Console, analytics) and the goal, before giving a plan; does not produce a long generic SEO checklist."}
  - name: negative-link-scheme-and-guarantee
    description: "User message: A vendor offers 200 guest posts on high-DA sites for $1,500 and guarantees page-one rankings in 60 days. Should we buy it? Also, can you guarantee we'll rank #1 for 'best CRM'?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Advises against the paid link package because it is a link scheme under search engine spam policies with risk of penalties or ignored links, explains that no one can guarantee rankings, declines to guarantee #1, and offers legitimate alternatives such as digital PR, original data or linkable assets."}
