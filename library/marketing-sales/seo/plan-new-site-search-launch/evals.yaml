schema: 1
baseline: "I'm launching a new website for {{business}}. What SEO should I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-local-physio
    vars:
      business: "New sports physiotherapy clinic in Cork, Ireland, opening in November. One clinic room, online booking. Competitors: two big clinic chains in town. Budget 300 EUR a month, 3 hours a week for marketing."
      site_pages: "WordPress, brand-new domain. Planned pages: Home, About, Services (one page listing 8 treatments), Contact. Launch 1 November."
    assert:
      - {type: contains, value: "## What to expect"}
      - {type: llm-rubric, value: "Gives realistic ranged timelines (brand within weeks, long-tail over months, competitive terms much later) without promises, includes a pre-launch check for noindex, sitemap, webmaster tools and booking conversion tracking, splits the single services page into a few pages for main treatments, sets up the map listing with genuine reviews, suggests links from local sports clubs or partners, and fits the plan to 3 hours a week."}
  - name: edge-replacing-old-site
    vars:
      business: "Online tea shop, ships across the EU. Rebuilding on a new platform with new URLs; the old site had some traffic for 'oolong tea' pages."
    assert:
      - {type: llm-rubric, value: "Notices this is a relaunch, not a brand-new site, and puts a redirect map from old URLs and a before-and-after benchmark into the pre-launch checklist, while still covering the rest of the plan."}
  - name: negative-panic-buy
    vars:
      business: "My site launched 2 weeks ago and I'm not on page one for 'wedding photographer London'. An agency offers 500 backlinks for 299. Should I buy now?"
    assert:
      - {type: llm-rubric, value: "Sets realistic expectations for a 2-week-old site on a competitive term, advises against the link package as a link scheme, and redirects to checking indexing, the page set and genuine link sources."}
