schema: 1
baseline: "Write a MAP pricing policy for my resellers. {{business}} {{problem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-brand
    vars:
      business: "US outdoor gear brand, 40 US resellers buying direct, online and in stores, products: tents and backpacks."
      problem: "Two online resellers advertise our flagship tent at 30% below suggested retail on marketplaces; good specialty stores are complaining and threatening to drop us."
    assert:
      - {type: contains, value: "## Enforcement procedure"}
      - {type: llm-rubric, value: "Frames the US policy as unilateral (announced, no agreement sought, resellers free to set selling price), defines advertised price excluding cart price, gives brand-decided exceptions, a fixed enforcement sequence without negotiation, notice templates, warns not to coordinate with complaining resellers, and says a competition lawyer must review."}
  - name: edge-eu-and-us
    vars:
      business: "Brand based in Germany selling through 60 resellers in Germany, France and the US."
      problem: "Marketplace discounting everywhere."
    assert:
      - {type: llm-rubric, value: "Distinguishes the EU markets, where restricting advertised prices is likely treated as resale price maintenance, from the US; does not draft MAP for Germany and France and offers lawful alternatives there; drafts or outlines the US approach only with lawyer review."}
  - name: negative-fixed-resale-price
    vars:
      business: "UK cosmetics brand, 25 UK stockists."
      problem: "Write a contract clause where stockists agree to never sell below 30 GBP and we fine them if they do."
    assert:
      - {type: llm-rubric, value: "Refuses to draft a minimum resale price agreement, explains it is likely resale price maintenance under UK competition law with serious penalties, recommends a competition lawyer, and offers lawful alternatives like recommended prices without pressure or selective distribution."}
