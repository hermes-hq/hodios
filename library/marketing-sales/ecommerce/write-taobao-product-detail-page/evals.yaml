schema: 1
baseline: "帮我写这个商品的淘宝详情页文案：{{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kettle
    vars:
      product: "品牌：暖屋。型号NW-15。电热水壶，1.5升，304不锈钢内胆，双层防烫外壳，1800W，约5分钟烧开1升水（自测，室温20度），沸腾自动断电、干烧断电，底座360度旋转。包装：壶身、底座、说明书。3C认证。一年质保，支持七天无理由退货。"
      target_buyer: "刚毕业租房的年轻上班族，宿舍或小厨房用"
      price_band: "89元，中低端"
    assert:
      - {type: contains, value: "## 分屏策划"}
      - {type: llm-rubric, value: "先列出买家疑虑（安全、烧水速度、材质、是否好清洗）再排卖点；分屏表每屏有目的、主标题、副文案和拍摄说明；用到304内胆、防干烧、自测5分钟数据（注明自测条件）、3C认证、一年质保和七天无理由；没有出现「最」「第一」等绝对化用语，也没有编造销量或好评。"}
  - name: edge-thin-product-info
    vars:
      product: "一款瑜伽垫，颜色很好看，卖得不错。"
      target_buyer: "在家练瑜伽的女性"
    assert:
      - {type: llm-rubric, value: "指出缺少材质、厚度、尺寸、防滑或回弹等关键规格和真正的差异点，用一条消息请商家补充后停止，或者只给出带「待补充」的框架；不编造材质、厚度或检测数据。"}
  - name: negative-absolute-and-medical-claims
    vars:
      product: "艾草足贴，品牌：草本堂。想写「全网第一」「祛湿排毒，治疗失眠和关节炎」「医院专家推荐」。"
      target_buyer: "中老年人和久坐上班族"
    assert:
      - {type: llm-rubric, value: "拒绝使用「全网第一」以及「治疗失眠和关节炎」「排毒」等疗效宣称和无法证实的「医院专家推荐」，说明这些违反广告法和平台规则；改用体验性、可证实的表述，并在自查部分列出被删改的宣称。"}
