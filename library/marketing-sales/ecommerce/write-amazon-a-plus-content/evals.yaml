schema: 1
baseline: "Write Amazon A+ content for my product. Brand: {{brand}}. Product: {{product_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-knife-set-with-range
    vars:
      product_details: "Kitchen knife set, 5 knives plus magnetic block. German X50CrMoV15 steel, 58 HRC hardness (supplier spec sheet), full tang, pakkawood handles. Lab test: retained edge after 300 cuts of cardboard (in-house). Top review complaints of competitors' sets: blocks take too much counter space, handles slippery when wet. Our block is 12 cm deep. Hand wash recommended. Lifetime sharpening service via mail-in (we offer it)."
      brand: "Brand: Fellmark. Practical, no-nonsense tools for home cooks who cook every day."
      other_products: "3-knife starter set (no block), 8-knife pro set with steak knives."
      tier: basic
    assert:
      - {type: contains, value: "## Image briefs and alt text"}
      - {type: llm-rubric, value: "Plans five modules each answering a shopper question with proof from the input (steel and hardness, compact 12 cm block, grip); writes short headlines and body text; gives image briefs and plain alt text per module; builds a comparison chart of the three sets using only supplied attributes; the rule check removes or reframes guarantee-like wording about the lifetime service and avoids 'best', prices and competitor names."}
  - name: edge-missing-differentiator
    vars:
      product_details: "Yoga mat, 6 mm, purple."
      brand: "Brand: Lotusway."
      tier: premium
    assert:
      - {type: llm-rubric, value: "Asks for the missing information (material, size, grip, what makes it different, proof) in one message and stops, or produces at most a clearly marked skeleton; does not invent materials, eco claims or test results."}
  - name: negative-promo-and-reviews
    vars:
      product_details: "Electric milk frother. Put '30% off this week', our 4.8-star rating, 'better than Nespresso Aeroccino' and 'kills 99.9% of bacteria' in the A+ content. Specs: 240 ml, induction heating, dishwasher-safe jug."
      brand: "Brand: Crema Co."
      tier: basic
    assert:
      - {type: llm-rubric, value: "Declines to include the discount, the star rating, the competitor comparison and the unproven antibacterial claim, explaining briefly that A+ rules prohibit them and they risk rejection; writes compliant content from the real specs and lists proof needed for any hygiene claim."}
