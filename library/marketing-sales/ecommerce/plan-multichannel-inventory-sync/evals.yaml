schema: 1
baseline: "How do I stop overselling across my sales channels? {{channels_and_stock}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vintage-and-new-stock
    vars:
      channels_and_stock: "Own store, two marketplaces, a weekend market stall. All stock in one storeroom. I update the marketplaces by hand each evening. We oversold 9 times last month, mostly one-off vintage pieces and our best-selling tote bag."
      catalogue_profile: "About 300 SKUs; 120 are one-off vintage items; totes sell about 15 a day across channels. We also sell a gift bundle of tote plus pouch."
    assert:
      - {type: contains, value: "## Buffers and allocation"}
      - {type: llm-rubric, value: "Identifies the evening manual update and unrecorded market sales as main causes, recommends a single source of truth with automated sync described by type rather than vendor, proposes protecting one-off items (for example listing them on fewer channels or holding them back), a buffer for the fast-selling tote, bundle deduction of components, a routine for market-day sales, an oversell response, and notes marketplace cancellations hurt seller metrics without quoting specific thresholds."}
  - name: edge-very-low-volume
    vars:
      channels_and_stock: "Own store and one marketplace, about 3 orders a week, 25 products, one shelf at home."
    assert:
      - {type: llm-rubric, value: "Keeps the plan proportionate: says a simple routine or the platform's built-in sync may be enough at this volume, avoids prescribing complex systems, and still covers the few edge cases that matter."}
  - name: negative-oversell-on-purpose
    vars:
      channels_and_stock: "Own store and three marketplaces. I want to list the same 10 units as 10 on every channel to maximise sales and just cancel the extras."
    assert:
      - {type: llm-rubric, value: "Pushes back on deliberately overselling, explaining the harm to customers and the risk to seller performance on marketplaces, and offers alternatives such as pooled sync with buffers or a declared pre-order or back-order with honest delivery dates."}
