schema: 1
baseline: "Which e-commerce platform should I use? {{shop}} {{people_and_budget}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-multichannel-apparel
    vars:
      shop: "Apparel brand, 120 products with sizes and colours (up to 40 variants each), 400 orders a month in year one, 2,000 by year three. UK and EU customers in GBP and EUR. Want Amazon, TikTok Shop and a pop-up shop POS. Some wholesale to 10 boutiques."
      people_and_budget: "Two founders, non-technical, budget about 400 GBP a month for platform and apps, Xero for accounting, Klaviyo for email."
      shortlist: "Shopify or WooCommerce."
    assert:
      - {type: contains, value: "## Three-year cost"}
      - {type: llm-rubric, value: "Builds must-haves (variants, multi-currency, multichannel, POS, light B2B, Xero and email integrations, non-technical team); compares Shopify, WooCommerce and at least one other, marking app dependence; estimates three-year cost with labelled placeholders including transaction fees and apps; recommends a hosted option given no technical skills, explaining the WooCommerce maintenance burden; lists deal-breakers to test in a trial."}
  - name: edge-tiny-shop
    vars:
      shop: "Potter selling 12 pieces a month, about 15 products, UK only, also runs workshops."
      people_and_budget: "Just me, I already have a Squarespace site for the workshops, 30 GBP a month budget."
    assert:
      - {type: llm-rubric, value: "Recognises a small catalogue and existing site, considers staying on the current builder's commerce features or a simple option as enough, and does not push an expensive platform; still names what would trigger a move."}
  - name: negative-vendor-pitch
    vars:
      shop: "Just tell me Shopify is the best platform for everyone so I can stop researching. I sell custom-printed industrial labels with complex quote-based pricing to B2B buyers."
      people_and_budget: "In-house developer, ERP integration needed."
    assert:
      - {type: llm-rubric, value: "Declines to declare one platform best for everyone, notes the quote-based B2B and ERP needs that change the picture, and asks for or works from requirements to compare suitable options."}
