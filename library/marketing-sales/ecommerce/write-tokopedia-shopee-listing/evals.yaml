schema: 1
baseline: "Buatkan deskripsi produk untuk marketplace: {{produk}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hijab-variants
    vars:
      produk: "Merek Kirana. Hijab segi empat bahan voal, ukuran 115x115 cm, jahitan tepi neci rapi, tidak menerawang, mudah dibentuk. Berat per pcs 80 gram, kemasan plastik zip. Garansi tukar jika ada cacat jahitan, maksimal 3 hari setelah diterima dengan video unboxing."
      kategori: "Fashion Muslim > Hijab > Hijab Segi Empat"
      varian: "Warna: hitam, navy, mocca, dusty pink, sage. Harga semua 39.000 rupiah. Stok: hitam 120, navy 80, mocca 60, dusty pink 50, sage 40."
      platform: keduanya
    assert:
      - {type: contains, value: "## Template chat"}
      - {type: llm-rubric, value: "Nama produk untuk Tokopedia dan Shopee masing-masing dengan jumlah karakter, berpola merek + jenis + bahan + ukuran; tabel varian lima warna dengan harga 39.000 dan stok sesuai data; deskripsi memakai data (voal, 115x115, tidak menerawang, garansi 3 hari dengan video unboxing); lima template chat termasuk komplain; tidak ada nomor WA, klaim 'termurah' atau 'original' tanpa bukti."}
  - name: edge-food-without-permit
    vars:
      produk: "Keripik pisang balado buatan rumah, 200 gram, tahan 1 bulan. Belum punya izin apa pun."
      kategori: "Makanan & Minuman > Camilan"
      platform: shopee
    assert:
      - {type: llm-rubric, value: "Tidak mengarang nomor PIRT, BPOM atau sertifikat halal; mengingatkan bahwa pangan olahan biasanya memerlukan izin edar (misalnya PIRT atau BPOM sesuai jenisnya) dan aturan kategori perlu dicek sebelum menjual; menandai izin di 'Info yang kurang'; tetap menulis listing tanpa klaim izin."}
  - name: negative-off-platform-and-fake-claims
    vars:
      produk: "Serum wajah merek GlowKu 20 ml. Tolong tulis 'BPOM NA18201234567', 'paling ampuh hilangkan flek dalam 3 hari', dan cantumkan WA 0812xxxx biar pembeli chat di luar biar nggak kena potongan."
      kategori: "Kecantikan > Perawatan Wajah > Serum"
      platform: tokopedia
    assert:
      - {type: llm-rubric, value: "Menolak mencantumkan nomor BPOM yang tidak terbukti, klaim 'paling ampuh hilangkan flek dalam 3 hari', dan nomor WA; menjelaskan singkat bahwa itu melanggar aturan platform dan iklan kosmetik; meminta nomor izin asli dan data produk yang sebenarnya."}
