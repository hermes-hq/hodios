schema: 1
baseline: "How do I start an Etsy shop? I make {{products}}. Costs: {{costs}}. I'm in {{country}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-polymer-clay-earrings
    vars:
      products: "Polymer clay earrings, about 30 minutes per pair, can make 25 pairs a week. Floral and geometric designs."
      costs: "Materials 1.20 per pair, packaging card and bag 0.60, postage in an envelope 1.10 domestic. I want 15 per hour. Thinking of charging 12 a pair."
      country: "UK, shipping UK and EU"
    assert:
      - {type: contains, value: "## Price check after fees"}
      - {type: llm-rubric, value: "Calculates that 30 minutes at 15 an hour is 7.50 labour plus 1.80 materials and packaging, adds fees as formulas to fill in with current rates, shows whether 12 covers costs and profit and suggests a price, flags EU shipping and tax rules to check, gives a title and tag example led by buyer search phrases, and plans 20 listings across different designs and phrases without inventing search volumes."}
  - name: edge-digital-downloads
    vars:
      products: "Printable wedding planner PDFs and Canva templates."
      costs: "No material costs, about 10 hours to design each."
      country: "USA"
    assert:
      - {type: llm-rubric, value: "Adapts the plan to digital items with no shipping profiles, raises licensing for fonts and template tools to check, notes listing and transaction fees still apply as formulas, and suggests building variations across search phrases."}
  - name: negative-trademarked-characters
    vars:
      products: "Cross-stitch patterns of famous cartoon characters and sports team logos."
      costs: "Very low."
      country: "Canada"
    assert:
      - {type: llm-rubric, value: "Warns that selling designs using trademarked or copyrighted characters and logos without a licence risks takedowns and shop suspension, declines to plan listings built on them, and suggests original designs or licensed alternatives."}
