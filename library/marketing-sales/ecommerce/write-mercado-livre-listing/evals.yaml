schema: 1
baseline: "Escreva um anúncio do Mercado Livre para este produto: {{produto}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-air-fryer
    vars:
      produto: "Fritadeira elétrica sem óleo marca Cozimax, modelo CZ-45, capacidade 4,5 litros, 1500 W, 127 V (também existe versão 220 V), cesto antiaderente removível, timer de 60 minutos, termostato até 200 graus, cor preta. Na caixa: fritadeira, cesto, manual. Garantia de 12 meses do fabricante. Selo Inmetro. Nova, com nota fiscal."
      categoria: "Eletrodomésticos > Fornos e Fogões > Fritadeiras"
      diferenciais: "Enviamos no mesmo dia útil para pedidos até 14h. Loja com nota fiscal em todas as vendas."
    assert:
      - {type: contains, value: "## Ficha técnica"}
      - {type: llm-rubric, value: "Título começa pelo produto (fritadeira elétrica / air fryer), inclui marca, modelo e capacidade, sem palavras de promoção, com contagem de caracteres perto de 60; ficha técnica preenchida com os dados informados (4,5 L, 1500 W, voltagem); a descrição em blocos menciona as duas voltagens como variações; perguntas frequentes incluem voltagem e garantia; nenhum telefone, link ou contato externo."}
  - name: edge-used-item-missing-specs
    vars:
      produto: "Bicicleta aro 29 usada, uns 2 anos de uso, alguns arranhões no quadro."
      categoria: "Esportes e Fitness > Ciclismo > Bicicletas"
    assert:
      - {type: llm-rubric, value: "Pede marca, modelo, tamanho do quadro, material, número de marchas e tipo de freio antes de escrever o anúncio completo, ou entrega uma versão com esses campos marcados 'a confirmar' sem inventar valores; menciona que o estado de uso e os arranhões devem ser descritos com honestidade."}
  - name: negative-competitor-and-contact
    vars:
      produto: "Fone bluetooth marca Sonora, modelo S20. Coloca no título 'igual ao AirPods' e 'frete grátis', e no fim da descrição o meu WhatsApp para fechar mais barato por fora."
      categoria: "Eletrônicos, Áudio e Vídeo > Fones de ouvido"
    assert:
      - {type: llm-rubric, value: "Não usa 'AirPods' nem outra marca concorrente no título ou na descrição, não coloca 'frete grátis' no título e não inclui o WhatsApp nem convite para negociar fora da plataforma; explica de forma breve que isso viola as regras do Mercado Livre e pode pausar o anúncio; pede as especificações que faltam (autonomia, versão do bluetooth, o que vem na caixa)."}
