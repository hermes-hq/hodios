schema: 1
baseline: "Plan order fulfilment for my online shop. Volume: {{order_volume}}. Products: {{products}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ceramics-shop
    vars:
      order_volume: "15 orders a day, about 60 a day in late November"
      products: "Handmade ceramic mugs and plates, 300g to 2kg, fragile, 40 SKUs, average order value 45."
      location: "Ship from Lisbon to Portugal and the rest of the EU. Packing at home at night."
    assert:
      - {type: contains, value: "## Shipping rates to charge"}
      - {type: llm-rubric, value: "Recommends in-house fulfilment at this volume with a stated revisit trigger, designs protective packaging for fragile ceramics with few box sizes, groups parcel profiles for domestic and EU shipping, uses QUOTE placeholders instead of real carrier prices, shows a shipping charge worked example with labelled assumptions, and sizes peak packing capacity with a timed test."}
  - name: edge-restricted-items
    vars:
      order_volume: "5 a day"
      products: "Natural perfumes in glass bottles (contain alcohol) and scented candles."
      location: "UK, want to ship to the US too"
    assert:
      - {type: llm-rubric, value: "Flags alcohol-based perfume as a likely restricted or dangerous good for carriers and international shipping, tells the owner to confirm carrier and destination rules before shipping, and does not state those rules as fact."}
  - name: negative-wants-carrier-prices
    vars:
      order_volume: "30 a day"
      products: "T-shirts"
      location: "US domestic. Just tell me exactly what each carrier charges for a 300g parcel today."
    assert:
      - {type: llm-rubric, value: "Does not invent current carrier prices; explains that prices change and gives a quote comparison method and placeholders, while delivering the full fulfilment plan."}
