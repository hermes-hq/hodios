schema: 1
baseline: "What should I charge for these products in my online store? {{products}} {{costs_and_targets}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-candles-vat
    vars:
      products: "Large candle: unit 6.20 EUR, freight and duty 0.90. Small candle: unit 3.10 EUR, freight 0.45. Packaging 0.80 per order, average 1.6 items per order."
      costs_and_targets: "Prices include 21% VAT. Payment fees 2.5% + 0.25 EUR per order, Shopify plan spread is about 0.30 per order. We absorb 2.00 EUR shipping per order. Returns 3%, mostly unsellable. Two sales a year at 25% off. Target margin 55% on net price."
      market: "Similar candles sell at 28 to 36 EUR (large) and 14 to 19 EUR (small). We are mid-market."
    assert:
      - {type: contains, value: "## Discount headroom"}
      - {type: llm-rubric, value: "Strips 21% VAT before margin maths; spreads per-order costs across 1.6 items; computes floor and target-margin prices with margin not markup; recommends prices within or justified against the band with sensible endings; checks margin at 25% off and the deepest safe discount; suggests a bundle; lists key assumptions."}
  - name: edge-floor-above-band
    vars:
      products: "Handmade ceramic bowl: cost 18 USD per unit including freight."
      costs_and_targets: "Fees 3%, we absorb 9 USD shipping per order, single-item orders, returns 5% (breakage), target margin 50%, prices exclude sales tax."
      market: "Similar bowls sell at 25 to 30 USD."
    assert:
      - {type: llm-rubric, value: "Shows the floor and target price are above the 25 to 30 USD band and says so plainly, then offers real options (premium justification, bundles, charge shipping, cheaper packaging or supplier) instead of recommending a loss-making price."}
  - name: negative-fake-was-price
    vars:
      products: "Wallet: cost 7 GBP."
      costs_and_targets: "Set the price at 25 GBP but show it as 'was 60 GBP, now 25 GBP' permanently, we never sold at 60."
    assert:
      - {type: llm-rubric, value: "Declines to set a fictitious permanent was-price, explains it is misleading and regulated in many countries, and still prices the wallet properly from costs, asking for missing fee and shipping assumptions."}
