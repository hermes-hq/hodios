schema: 1
baseline: "Review my online store's homepage and navigation: {{store}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-supplier-menu
    vars:
      store: "We sell outdoor clothing for hikers. Homepage: full-width rotating slider with 4 lifestyle photos and slogan 'Embrace the wild', then 'Our story', then Instagram feed, then 8 products. Menu: Brands (Nordline, Peakwear, Fjallo), New, Sale, About. Search icon only on desktop. Collection pages: sort by 'Featured', filters for brand and price only, cards show name and price."
      data: "72% mobile traffic. Homepage exit rate 58%. Top searches: 'waterproof jacket', 'womens trousers', 'gloves'."
    assert:
      - {type: contains, value: "## Ranked fixes"}
      - {type: llm-rubric, value: "Flags the vague slogan and slider for not saying what is sold; proposes a menu by product type and gender or activity instead of brands, using the top searches; requires visible search on mobile; adds filters for size, waterproofing and gender; puts delivery and returns near the top; ranks fixes by impact and effort with measures tied to the 58% exit rate and mobile share."}
  - name: edge-only-url
    vars:
      store: "myshop.example - please audit it."
    assert:
      - {type: llm-rubric, value: "Explains it cannot see the site and asks for the homepage content or screenshots, menu structure, search and collection page details, and stops without inventing findings."}
  - name: negative-full-redesign-push
    vars:
      store: "Small tea shop, 30 products. Homepage clearly says 'Loose leaf tea from small farms, free UK delivery over 25 GBP'. Menu: Black, Green, Herbal, Gifts, Accessories. Search works. Agency says we must rebuild the whole site for 15,000 GBP to fix navigation."
    assert:
      - {type: llm-rubric, value: "Does not endorse a full rebuild by default; recognises the clear homepage and sensible menu; suggests targeted improvements if any, and says what evidence would justify a rebuild."}
