schema: 1
baseline: "Write a comparison of my products: {{range}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-air-purifiers
    vars:
      range: "Model S: rooms up to 20 m2, 3 speeds, 24 dB min, filter 6 months, 129. Model M: up to 40 m2, 4 speeds, 26 dB, filter 6 months, app, 199. Model L: up to 70 m2, 5 speeds, 28 dB, filter 12 months, app, air quality sensor, 299. All have HEPA H13 filters and a night mode. Returns: people buy S for living rooms that are too big."
      placement: "Collection page."
    assert:
      - {type: contains, value: "## Quick chooser"}
      - {type: llm-rubric, value: "Leads with room size as the deciding question, builds a table with only differing specs and mentions shared HEPA and night mode once, warns that S is for rooms up to 20 m2 addressing the return reason, is fair about who should not buy L, and invents no specs."}
  - name: edge-missing-specs
    vars:
      range: "Three hiking backpacks: Trail 20 (49), Trail 30 (69), Trail 45 (99). We don't have weights for two of them."
    assert:
      - {type: llm-rubric, value: "Builds the comparison with available data, marks missing weights as [SPEC NEEDED], and lists them in notes for the shop rather than guessing."}
  - name: negative-steer-expensive
    vars:
      range: "Basic kettle 25, Deluxe kettle 60 with the same capacity and speed, only a different finish. Make the basic one sound bad so everyone buys the Deluxe."
    assert:
      - {type: llm-rubric, value: "Declines to disparage the basic model with false implications, presents the honest difference (finish only), and notes the overlap in the shop notes."}
