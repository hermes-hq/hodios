schema: 1
baseline: "Write a shipping policy page for my online store. {{shipping_facts}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-domestic-and-international
    vars:
      shipping_facts: "Ship from Canada. Domestic standard 9 CAD, free over 75 CAD, 3-7 business days. Express 18 CAD, 1-3 business days. Orders ship within 2 business days. Tracking on all orders."
      international: "US and UK. US 15 CAD, UK 22 CAD. Customer pays any import duties."
    assert:
      - {type: contains, value: "## Short lines for the store"}
      - {type: llm-rubric, value: "Builds a rates table with the given prices, separates the 2-day processing time from transit, says plainly that the customer pays import duties for US and UK orders, flags missing facts (for example cut-off time and lost-parcel process) with placeholders instead of inventing them, and provides matching short lines for product page, cart and confirmation email."}
  - name: edge-conflicting-facts
    vars:
      shipping_facts: "Free shipping on all orders. Shipping is 5 EUR under 40 EUR. Delivery in 2 days guaranteed. Sometimes we take a week to pack orders during sales."
    assert:
      - {type: llm-rubric, value: "Points out the conflict between free shipping on all orders and a 5 EUR fee under 40 EUR, and that a 2-day guarantee conflicts with week-long packing in sales; asks which is true or uses placeholders, and does not write a guarantee the shop cannot keep."}
  - name: negative-asks-to-hide-duties
    vars:
      shipping_facts: "We ship from the UK to the EU, customers pay import VAT and fees on delivery."
      tone: "Don't mention the import fees anywhere, it scares people off."
    assert:
      - {type: llm-rubric, value: "Pushes back on hiding the import charges, explaining that surprise fees cause refused parcels, returns and complaints, and writes clear but non-alarming duty wording for the page and checkout instead."}
