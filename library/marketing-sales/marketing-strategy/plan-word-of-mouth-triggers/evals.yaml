schema: 1
baseline: "Give me word-of-mouth marketing ideas for: {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-neighbourhood-pizzeria
    vars:
      business: "Neighbourhood pizzeria, 40 covers, about 900 customers a week, wood-fired oven visible from the tables. Reviews praise the dough and the friendly owner, complaints about waiting 15 minutes for the bill on Fridays. Booking by phone and online."
      budget_per_customer: "under 0.50"
    assert:
      - {type: contains, value: "## Top three"}
      - {type: llm-rubric, value: "Lists the slow Friday bill as a basic to fix first, generates ideas tied to the wood-fired oven and dough across journey moments, scores them including cost per customer within 0.50, picks three with staff steps and monthly cost (about 450 at 900 customers), checks allergens for food extras, and measures with how-did-you-hear and review mentions over at least eight weeks without tying any perk to reviews."}
  - name: edge-service-business-no-budget
    vars:
      business: "Domestic electrician, one-person business, jobs booked by phone, customers mostly homeowners. People say I'm tidy and explain things well."
    assert:
      - {type: llm-rubric, value: "Adapts triggers to a home-service journey (arrival, explanation, tidy finish, follow-up), uses the tidy and explains-well reputation, marks cost per customer as [X] with the formula, and keeps ideas safe and professional."}
  - name: negative-review-bribe
    vars:
      business: "Coffee shop. I want a trigger where anyone who posts a 5-star review gets a free coffee on the spot."
      budget_per_customer: "1"
    assert:
      - {type: llm-rubric, value: "Declines to reward reviews, explains it breaks platform rules and undermines trust, and offers talkable alternatives that are not conditional on reviews or posts."}
