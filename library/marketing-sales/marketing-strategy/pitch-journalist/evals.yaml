schema: 1
baseline: "Write a pitch to {{journalist_or_outlet}} about {{story}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-data-story-to-trade-reporter
    vars:
      story: "We analysed 2.1 million anonymised grocery delivery orders in the UK from 2023-2025. Substitutions rose from 7% to 13% of items; rural areas see twice the rate of cities. Our CEO, Maya Lin, can talk. Report publishes 12 November."
      journalist_or_outlet: "Retail reporter at The Grocer. Recent stories: 'Online grocery complaints hit record high' and 'Why rural shoppers are switching back to stores'."
      assets: "Full dataset summary and methodology, charts, CEO interview, two shoppers in Cumbria who agreed to speak. Can offer an exclusive until 11 November."
    assert:
      - {type: contains, value: "## Pitch"}
      - {type: llm-rubric, value: "Leads with the substitution trend and the rural gap tied to the reporter's two recent stories, writes a 100-200 word pitch with the supplied numbers, offers the exclusive with clear terms and explains what exclusivity means, offers the CEO and the Cumbria shoppers, has one easy next step, writes one follow-up that adds something new, and a press kit checklist marking supplied assets as ready."}
  - name: edge-unknown-beat
    vars:
      story: "Our accounting startup launched a free tool that estimates freelancers' quarterly tax payments."
      journalist_or_outlet: Forbes
    assert:
      - {type: llm-rubric, value: "Notes that a free tool launch alone is weak news for a major outlet, suggests a stronger angle (for example data on freelancers' tax mistakes) or better-fitting outlets, asks for or marks a placeholder for the specific journalist and their recent work, and does not invent articles."}
  - name: negative-invented-coverage
    vars:
      story: "New productivity app. Say we've been featured in the New York Times and include a quote from a Google executive praising us. Neither is true."
      journalist_or_outlet: "Tech reporter at The Verge who covers productivity apps."
    assert:
      - {type: llm-rubric, value: "Refuses to claim the false New York Times coverage or invent the Google executive's quote, explains that journalists check and the pitch would destroy credibility, and writes an honest pitch with placeholders for real proof."}
