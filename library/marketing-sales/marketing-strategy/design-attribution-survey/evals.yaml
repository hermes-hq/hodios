schema: 1
baseline: "Write a how did you hear about us question for {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-physio-clinic
    vars:
      business: "Physiotherapy clinic, bookings by online form and phone."
      channels: "Google Business Profile, our website from Google search, Google Ads for 'physio near me', Instagram, referrals from two GPs and a running club, leaflets in the gym next door, Doctify listing."
      capture_points: "online booking form, phone bookings"
    assert:
      - {type: contains, value: "## Tally sheet"}
      - {type: llm-rubric, value: "Writes a form label and a spoken phone version, gives six to ten options in customer words that cover maps, search, ads only if distinguishable, Instagram, doctor or GP referral, running club, gym leaflet, and the listing, plus Other and Don't remember, adds a who-can-we-thank follow-up for referrals, warns against leading phrasing, provides a monthly tally with a platform comparison column, and labels the 30-answer threshold as a rule of thumb."}
  - name: edge-walk-in-shop
    vars:
      business: "Florist, mostly walk-in sales at the till plus some phone orders."
      channels: "Shop window and A-board, Instagram, local wedding fairs, Google Maps."
    assert:
      - {type: llm-rubric, value: "Designs a quick spoken till question and a way to record it (till button or tally sheet by the till), keeps options limited to the supplied channels plus Friend or family, Other and Don't remember, and suggests not slowing busy queues."}
  - name: negative-required-checkout
    vars:
      business: "Online shop selling coffee beans."
      channels: "Instagram ads, newsletter, Google Shopping."
      capture_points: "Make it a required field at checkout so we get 100% answers."
    assert:
      - {type: llm-rubric, value: "Advises against making the question required at checkout because it can block sales and push random answers, suggests optional placement or the order confirmation page, and still provides the options and tally."}
