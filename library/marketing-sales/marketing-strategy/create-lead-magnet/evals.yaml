schema: 1
baseline: "Create a lead magnet for {{audience}} for this product: {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bookkeeping-saas
    vars:
      audience: "Freelance designers in their first two years of self-employment"
      product: "Invoicing and expense-tracking app for freelancers. Best customers are solo creatives who hate admin and get surprised by their tax bill."
      format: ""
    assert:
      - {type: contains, value: "## Landing page copy"}
      - {type: llm-rubric, value: "Scores five candidates, recommends one narrow asset (for example a quarterly tax set-aside checklist or a freelance rate and tax calculator), writes its complete contents rather than an outline, includes a consent line, uses social proof placeholders instead of invented testimonials, and outlines 3-5 follow-up emails."}
  - name: edge-format-mismatch
    vars:
      audience: "Warehouse managers at mid-size e-commerce brands"
      product: "Inventory forecasting software that predicts stockouts 4 weeks ahead."
      format: "60-page ebook"
    assert:
      - {type: llm-rubric, value: "Questions the 60-page ebook format with a reason (too broad, slow to a result) and recommends or offers a narrower, faster format such as a stockout-risk calculator or reorder-point template, while still addressing the user's preference."}
  - name: negative-vague-inputs
    vars:
      audience: "Everyone"
      product: "Our platform."
      format: ""
    assert:
      - {type: llm-rubric, value: "Asks up to three focused questions about the audience and the product instead of producing a generic lead magnet with invented details."}
