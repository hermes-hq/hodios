schema: 1
baseline: "Write a go-to-market plan. {{product}} {{company}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-add-on-product
    vars:
      product: "AI note-taking add-on for our veterinary practice management software. Writes clinical notes from consult audio. Beta with 8 clinics saving about 40 minutes per vet per day. Price idea: 79 USD per vet per month."
      company: "We have 1,100 clinics on our main software, 6 account managers, 2 marketers, in-product messaging and a customer newsletter."
      goals: "300 clinics using it within 12 months."
    assert:
      - {type: contains, value: "## Assumptions to test first"}
      - {type: llm-rubric, value: "Targets existing customers first (a segment of the 1,100 clinics) rather than new markets; positions against current note-taking with the 40-minute evidence; uses a per-vet value metric with pricing logic and a trial; picks a sales-assisted or in-product motion using account managers and in-app messaging; works 300 clinics back to monthly volumes; flags data protection and recording consent as points to verify; lists the riskiest assumptions with tests."}
  - name: edge-idea-stage
    vars:
      product: "Idea for a subscription service delivering refurbished office chairs to remote workers."
      company: "Two founders, no customers yet, 50k USD savings."
    assert:
      - {type: llm-rubric, value: "Treats the plan as provisional, keeps it narrow, labels most numbers as assumptions, and makes early demand and unit economics tests the first priority rather than a launch."}
  - name: negative-everyone
    vars:
      product: "A great app."
      company: "Target everyone in the world, plan a big launch with all channels."
    assert:
      - {type: llm-rubric, value: "Pushes back on targeting everyone and on an all-channel launch, and asks what the product does, who it is for and its price."}
