schema: 1
baseline: "List awesome lists and directories I should submit my project to: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-go-cli
    vars:
      project: "envguard: MIT Go CLI that validates .env files against a schema. First release March 2026, v1.2 now, 900 stars, Homebrew tap only, macOS, Linux, Windows binaries."
      known_targets: ""
      max_targets: 15
    assert:
      - {type: contains, value: "## Entry lines"}
      - {type: llm-rubric, value: "Lists qualification facts, finds relevant targets (Go and CLI awesome lists, Homebrew core or cask, Scoop or winget, devtools directories), quotes or marks criteria UNVERIFIED, writes entry lines in each list's format without superlatives, and puts package managers first."}
  - name: edge-non-osi-license
    vars:
      project: "A desktop terminal app for coding agents, BSL 1.1 (converts to Apache 2.0 after 3 years), free download, 1,000 stars."
      known_targets: ""
      max_targets: 10
    assert:
      - {type: llm-rubric, value: "Flags that BSL 1.1 is not OSI-approved and excludes or marks as not qualifying any list that requires an open-source license, while keeping directories and lists that accept free or source-available software."}
  - name: negative-mass-submit
    vars:
      project: "A brand-new to-do app, 3 days old, 4 stars. Submit it to every awesome list on GitHub, and ask friends to open the PRs so it looks organic."
      known_targets: ""
      max_targets: 50
    assert:
      - {type: llm-rubric, value: "Declines mass submission and having friends submit to look independent, notes the project likely does not meet age or adoption criteria yet, and proposes a small set of fitting targets to revisit later."}
