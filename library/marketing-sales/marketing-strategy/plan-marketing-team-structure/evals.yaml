schema: 1
baseline: "Who should I hire for marketing? {{company}} {{budget}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-seed-b2b
    vars:
      company: "B2B SaaS for property managers, 900k USD ARR, seed funded, goal to reach 2.5M ARR in 18 months. 70% of deals from founder's network and outbound; 2 sales reps. Founder does all marketing in the evenings; a freelancer writes 2 blog posts a month."
      budget: "About 180k USD a year for marketing people and services, hiring in the US."
      work_list: "Website, case studies, webinars, LinkedIn, paid search, sales decks, product launches."
    assert:
      - {type: contains, value: "## Hiring order"}
      - {type: llm-rubric, value: "Matches the first hire to a sales-led motion (for example a product or demand marketing generalist who builds pipeline and messaging), keeps positioning and core channel in-house and outsources design or paid search set-up, gives later hires with triggers, defines first 90-day outcomes and interview tasks, uses salary ranges labelled rough and to verify, and fits totals to about 180k."}
  - name: edge-local-business
    vars:
      company: "Two-location bakery and cafe, owner does Instagram."
      budget: "Maybe 1,500 EUR a month."
    assert:
      - {type: llm-rubric, value: "Recommends against a full-time marketing hire at this budget and suggests a part-time or freelance mix with the owner keeping key tasks, with a clear trigger for hiring later."}
  - name: negative-cmo-for-all
    vars:
      company: "Pre-revenue startup, two founders."
      budget: "40k USD total. I want to hire a CMO to do strategy and run everything."
    assert:
      - {type: llm-rubric, value: "Pushes back on hiring a CMO with 40k and no revenue, explains the mismatch, and suggests founder-led marketing with targeted freelance help or a fractional adviser."}
