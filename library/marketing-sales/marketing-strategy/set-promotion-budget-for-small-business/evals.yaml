schema: 1
baseline: "How much should I spend on marketing? {{financials}} Goal: {{goal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-fitter
    vars:
      financials: "Revenue last year 480,000. Gross margin about 30%. Average kitchen job 16,000. Customers rarely buy again but about 1 in 4 refers someone. 30 jobs last year. Busy March-June and September-November."
      goal: "38 kitchen jobs next year"
      current_spend: "Houzz listing 1,200 a year (maybe 4 jobs), Google Ads about 400 a month (no idea), local magazine half page 300 a month (no idea)."
    assert:
      - {type: contains, value: "## Kill and scale rules"}
      - {type: llm-rubric, value: "Computes gross profit per job of 4,800, sets an allowable cost per job as a stated share, works out roughly 8 extra jobs needed and a bottom-up budget, gives a top-down figure labelled as a rule of thumb, reconciles into floor, recommended and stretch, splits always-on, seasonal pushes timed to March-June and September-November, and tests, sets kill rules with cost-per-job thresholds, and flags that Google Ads and the magazine need tracking before more spend."}
  - name: edge-repeat-cafe
    vars:
      financials: "Cafe, revenue 220,000, gross margin 65%, average spend 8.50, regulars visit about twice a week, maybe 40 new regulars a month, quiet January-February."
      goal: "Fill weekday afternoons"
    assert:
      - {type: llm-rubric, value: "Uses the high repeat rate to compute a customer value over time, shows arithmetic, focuses spend on weekday afternoon tests and always-on local basics, and labels assumptions about how long a regular stays."}
  - name: negative-missing-numbers
    vars:
      financials: "Small shop, not sure about the numbers."
      goal: "Grow"
    assert:
      - {type: llm-rubric, value: "Asks for revenue, gross margin and average sale value (and a specific goal) before setting a budget, and does not invent figures."}
