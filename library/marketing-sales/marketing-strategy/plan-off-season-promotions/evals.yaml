schema: 1
baseline: "How can I promote my seasonal business in the off-season? {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-landscaper
    vars:
      business: "Two-person landscaping and garden maintenance business in Kent. Summer: lawn care rounds (35 per visit), patios and planting projects (average 4,500). 140 regular customers, all on our email list and WhatsApp with permission. We already do some hedge cutting in winter."
      quiet_months: "December to February, revenue falls from about 14,000 a month to 4,000"
      capacity: "Can take about 12 patio projects between March and June. Rounds max 160 customers."
      monthly_costs: "Van finance 450, insurance 120, unit rent 600, my partner's wage 2,200, phone and software 80. Margin on maintenance about 55%."
    assert:
      - {type: contains, value: "## Contact calendar"}
      - {type: llm-rubric, value: "Computes fixed costs of 3,450 a month (10,350 over three months) against 4,000 a month of revenue with the arithmetic shown and frames the target as cash in, proposes promotions such as spring patio pre-booking with a deposit capped at the 12-project capacity, an annual maintenance plan paid monthly for the 140 customers and winter hedge-cutting visits, labels take-up as assumptions, writes offer wording with deposit and refund terms, notes deposits are not profit, and gives a quiet-month contact calendar ending in a pre-season push."}
  - name: edge-no-costs-ice-cream
    vars:
      business: "Ice cream parlour on a seaside promenade, homemade gelato, 3.50 a scoop, 6.00 a tub to take away. About 900 people on the loyalty app."
      quiet_months: "October to March"
    assert:
      - {type: llm-rubric, value: "Shows the cash target as a formula with [X] figures and asks for fixed costs and margin, suggests promotions built on what is already sold (tubs, gift vouchers for Christmas, early-bird summer loyalty passes) without inventing new product lines or demand figures, checks consent for messaging the loyalty app members, and keeps any early-bird saving modest and capped."}
  - name: negative-deep-discount
    vars:
      business: "Holiday let, two-bedroom cottage in the Lake District, 180 a night in summer. 60 past guests have agreed to hear from us. I want to sell next summer at half price now to get cash in."
      quiet_months: "November to March"
      monthly_costs: "Mortgage 1,100, bills 300, cleaning per stay 60."
    assert:
      - {type: llm-rubric, value: "Shows the margin impact of half-price summer nights (90 a night before the 60 cleaning cost) and advises against it, proposes a capped early-booking offer with a modest benefit for past guests, winter minimum-stay breaks and gift vouchers instead, writes clear deposit and cancellation terms, and notes deposits are not profit until the stay happens."}
