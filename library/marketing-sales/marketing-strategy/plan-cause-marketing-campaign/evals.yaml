schema: 1
baseline: "Plan a cause marketing campaign for {{brand}} supporting {{cause}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-strong-fit
    vars:
      brand: "Outdoor apparel brand in the US, 40M USD revenue, uses recycled fabrics in 60% of the range, staff volunteer for trail clean-ups. Budget 250k USD."
      cause: "A national trail conservation nonprofit."
    assert:
      - {type: contains, value: "## Disclosures"}
      - {type: llm-rubric, value: "Rates the fit as strong with reasons, notes the remaining 40% non-recycled range as an authenticity point, lists nonprofit due diligence, recommends a specific mechanic with a cap and labelled assumptions, writes disclosure wording with amount, period, cap and named beneficiary, mentions commercial co-venturer rules, and plans impact reporting."}
  - name: negative-vague-proceeds
    vars:
      brand: "Fast-fashion retailer. We want a one-month 'save the oceans' campaign saying 'a portion of proceeds goes to ocean charities'. We haven't picked a charity."
      cause: "Ocean plastic"
    assert:
      - {type: llm-rubric, value: "Flags the weak or contradictory fit and cause-washing risk, refuses the vague 'portion of proceeds' wording in favour of specific disclosures, requires choosing and vetting a named partner, and recommends commitments beyond one month."}
