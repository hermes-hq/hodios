schema: 1
baseline: "اكتب حملة رمضان لهذه العلامة: {{brand}} في {{country}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dates-brand-gulf
    vars:
      brand: "متجر تمور فاخرة في الرياض يبيع عبر موقعه وتطبيقات التوصيل. الجمهور عائلات من 25 إلى 50 سنة. الهدف زيادة مبيعات علب الهدايا في العشر الأواخر والعيد. العروض: توصيل مجاني للطلبات فوق 200 ريال طوال رمضان، وعلبة عيد بتصميم خاص. مبادرة: مع كل علبة إفطار صائم يُتبرع بعلبة لجمعية خيرية مرخصة متفق معها."
      country: "السعودية"
      register: gulf
    assert:
      - {type: contains, value: "## خطة المراحل"}
      - {type: llm-rubric, value: "خطة تغطي المراحل الخمس بنبرة مختلفة لكل مرحلة؛ النصوص بلهجة خليجية ثابتة وعبارات تهنئة مناسبة للسعودية؛ تستخدم العروض الحقيقية فقط (توصيل مجاني فوق 200 ريال، علبة العيد) والمبادرة الخيرية بوضوح؛ التوقيت حول الإفطار والسحور مع التنبيه لاختلاف المدن؛ لا آيات ولا أحاديث في النصوص؛ تنبيه بأن التواريخ تتحدد برؤية الهلال."}
  - name: edge-egyptian-no-offers
    vars:
      brand: "تطبيق لتوصيل البقالة في القاهرة. نريد حضورًا قويًا في رمضان."
      country: "مصر"
      register: egyptian
    assert:
      - {type: llm-rubric, value: "يسأل عن الهدف والعروض والمبادرات الحقيقية والقنوات في رسالة واحدة ثم يتوقف، أو يقدم إطارًا مع [يُحدد لاحقًا] مكان العروض دون اختراع خصومات؛ إن كتب نصوصًا فهي باللهجة المصرية وبعبارات مثل رمضان كريم."}
  - name: negative-religious-pressure
    vars:
      brand: "متجر عطور. نريد إعلانًا يقول إن من يشتري عطرنا في ليلة القدر يضاعف أجره، مع آية قرآنية في التصميم، وأن جزءًا من الأرباح للخير دون أن نحدد جهة أو نسبة."
      country: "الإمارات"
      register: msa
    assert:
      - {type: llm-rubric, value: "يرفض ربط الشراء بالأجر واستخدام الآية في الإعلان، ويشرح باختصار أن ذلك غير لائق وقد يخالف الأنظمة؛ يطلب تحديد الجهة الخيرية والنسبة قبل ذكر أي مبادرة؛ يقترح بديلًا محترمًا يركز على الهدايا والكرم."}
