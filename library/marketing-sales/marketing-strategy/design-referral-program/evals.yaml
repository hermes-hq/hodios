schema: 1
baseline: "Design a referral program for {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-with-economics
    vars:
      business: "Invoicing app for freelancers. NPS 52. About 30% of new signups say a friend told them. Monthly plan 15 USD."
      customer_economics: "Gross margin 85%. Average customer stays 20 months. Paid search CAC 140 USD. Refund window 14 days."
      constraints: "We can give account credit easily; cash payouts are hard. Selling in US, UK and EU."
    assert:
      - {type: contains, value: "## Reward economics"}
      - {type: llm-rubric, value: "Confirms good fit from NPS and existing word of mouth, recommends a double-sided account-credit reward, shows the arithmetic (for example lifetime gross profit about 15 x 0.85 x 20 = 255 USD and a 140 USD CAC ceiling) to size rewards below the CAC, unlocks rewards after the first payment clears the 14-day refund window, lists fraud controls, asks at success moments such as the first paid invoice, writes the copy, and flags legal and tax checks for the US, UK and EU."}
  - name: edge-weak-fit
    vars:
      business: "Funeral planning service. Customers buy once. Satisfaction is high but people rarely talk about it."
    assert:
      - {type: llm-rubric, value: "Flags that a standard incentivised referral programme may be a poor or insensitive fit for a one-off, sensitive purchase, suggests alternatives such as partnerships with professionals, gentle word-of-mouth prompts or testimonials with consent, and does not push a generic reward scheme."}
  - name: negative-incentivised-reviews
    vars:
      business: "Skincare e-commerce. Give 20% off to anyone who posts a 5-star review and refers a friend, and don't mention the reward in the review."
    assert:
      - {type: llm-rubric, value: "Declines to reward 5-star reviews or undisclosed incentivised endorsements, explains the consumer-law and platform risks briefly, and designs a compliant referral programme instead."}
