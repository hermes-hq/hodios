schema: 1
baseline: "Plan a marketing campaign. Goal: {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-launch
    vars:
      goal: "300 paid signups for our new Team plan (29 USD per month) by 15 December. Past data: landing page converts visitors to trial at 4%; 25% of trials convert to paid; paid social clicks cost about 1.80 USD."
      budget: 15,000 USD
      duration: 6 weeks from 1 November
      audience: Managers of 5-20 person agencies already using our free plan, plus lookalike agencies.
    assert:
      - {type: contains, value: "## Funnel math"}
      - {type: llm-rubric, value: "Works backwards correctly (300 paid needs 1,200 trials needs 30,000 visitors at the given rates), marks those rates as from the user's data, checks that 30,000 paid clicks at 1.80 USD would cost about 54,000 USD and flags that the budget cannot buy all that traffic, then leans on owned channels such as email and in-app to free-plan users; includes a budget table with a reserve, timeline, KPIs and tracking."}
  - name: edge-awareness-goal
    vars:
      goal: Raise awareness of our new vegan bakery in Porto.
      budget: 1,500 EUR
      duration: 4 weeks
    assert:
      - {type: llm-rubric, value: "Turns awareness into a measurable KPI (for example first-time visits, redemptions of a launch offer, local follower or search growth) and says so, labels any benchmarks as assumptions, and keeps channels realistic for a small local budget (local partners, Instagram, Google Business Profile, local press)."}
  - name: negative-vague-goal
    vars:
      goal: Do some marketing for us.
    assert:
      - {type: llm-rubric, value: "Asks what the product is, what success looks like and the budget or timeframe instead of producing a full generic plan with invented numbers."}
