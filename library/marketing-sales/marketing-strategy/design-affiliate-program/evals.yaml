schema: 1
baseline: "Design an affiliate programme for {{offer}}. Margins: {{margins}}. Audience: {{audience}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-subscription
    vars:
      offer: "Language-learning app subscription, 12.99 USD per month or 89.99 USD per year. 60% of new subscribers choose annual. Monthly churn on monthly plans about 9%. Refunds about 4%."
      margins: "Gross margin 80%. Average customer lifetime value about 110 USD. Paid social CAC currently 55 USD."
      audience: "Adults learning languages for travel and work; language YouTubers and travel bloggers are trusted."
    assert:
      - {type: contains, value: "## Economics"}
      - {type: llm-rubric, value: "Calculates an affordable commission from 80% margin, about 110 USD LTV and 55 USD CAC with the math shown, recommends a structure for monthly and annual plans with caps, rates language creators highly and limits or excludes coupon and cashback sites for incrementality, includes brand bidding bans, disclosure, refund reversals, and an incrementality check."}
  - name: negative-thin-margin
    vars:
      offer: "Discount electronics reseller, average order 200 USD."
      margins: "Gross margin 4% per order, no repeat purchase data. Want to pay affiliates 10%."
    assert:
      - {type: llm-rubric, value: "Shows that a 10% commission exceeds the 4% margin and would lose money on every sale, stops or limits the design after economics, and suggests alternatives such as flat fees on high-margin accessories or improving margin first."}
