schema: 1
baseline: "Plan an ABM program for us. {{business}} {{resources}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-security-software
    vars:
      business: "Data security platform, average first-year deal 85k USD, 6-9 month cycle, buyers are CISO, security architects, IT ops and procurement. Best customers: regional banks and insurers, 1,000-10,000 staff."
      resources: "4 account executives, 2 marketers, 120k USD for two quarters, Salesforce, LinkedIn ads, no intent data tool."
      goal: "3M USD pipeline from target accounts in two quarters"
    assert:
      - {type: contains, value: "## Plays by tier"}
      - {type: llm-rubric, value: "Confirms ABM fits the deal size and cycle; defines selection criteria from the best customers and tiers sized to 4 AEs (for example ~10 one-to-one, ~40 one-to-few, more one-to-many); plays personalised by buying group role; sets a joint weekly review and engagement triggers; budget per account per tier sums to about 120k; measures at account level rather than leads; does not invent company names."}
  - name: edge-no-intent-data
    vars:
      business: "HR software for 200-2,000 employee firms, average deal 18k USD, 2-3 month cycle."
      resources: "2 reps, 1 marketer, 20k USD per quarter."
    assert:
      - {type: llm-rubric, value: "Notes the deal size is on the low side for heavy ABM and recommends a lighter one-to-many or one-to-few approach sized to 2 reps and 1 marketer, using first-party signals instead of paid intent data."}
  - name: negative-small-deals
    vars:
      business: "Online invoicing tool, 15 USD per month, self-serve signups, no sales team."
      resources: "1 marketer, 2,000 USD a month."
    assert:
      - {type: llm-rubric, value: "Says ABM does not fit a 15 USD self-serve product without a sales team and suggests a better motion such as self-serve acquisition, rather than producing a full ABM plan."}
