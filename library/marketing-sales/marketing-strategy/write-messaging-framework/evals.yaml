schema: 1
baseline: "Create a messaging framework for this positioning: {{positioning}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-with-proof
    vars:
      positioning: "For finance teams at 50-500 person companies who close the books in spreadsheets, Closewise is month-end close software that cuts close time by automating reconciliations and checklists. Unlike ERP add-ons, it works with any accounting system and is live in a week."
      personas: "Controller (owns the close, worried about errors and audit), CFO (wants faster reporting and less overtime), Staff accountant (does the reconciliations)."
      proof_points: "Median customer closes 4 days faster (from 9 to 5 days) across 120 customers. Quote: 'Our auditors asked what changed' - Controller, Pella Foods (approved). SOC 2 Type II. Live in 6 days on average."
    assert:
      - {type: contains, value: "## Value pillars"}
      - {type: llm-rubric, value: "Writes a one-sentence core message, three distinct benefit pillars each with supplied proof (4 days faster, auditor quote, SOC 2, 6-day setup), persona messages that lead with different pillars for controller, CFO and staff accountant, short forms, use/avoid language lists, and applied examples; does not invent new statistics or customers."}
  - name: edge-no-personas-no-proof
    vars:
      positioning: "A meal-planning app for families with picky kids that builds weekly menus everyone will eat, unlike recipe apps that ignore kids' preferences."
    assert:
      - {type: llm-rubric, value: "Proposes up to three personas marked as proposals, marks pillars without proof as [PROOF NEEDED], and lists proof to collect in Gaps rather than inventing reviews or numbers."}
  - name: negative-adjective-positioning
    vars:
      positioning: "We are an innovative, best-in-class, seamless platform that leverages AI."
    assert:
      - {type: llm-rubric, value: "Points out that the input lacks who the product is for, the problem and the difference, asks for those before building the framework, and does not produce pillars made of adjectives."}
