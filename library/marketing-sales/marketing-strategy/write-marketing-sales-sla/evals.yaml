schema: 1
baseline: "Write an SLA between marketing and sales. {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-friction
    vars:
      situation: "B2B SaaS, 3 marketers, 6 SDRs, 4 AEs, Salesforce. About 400 MQLs a month. SDRs say 70% are junk and often don't call for 3-4 days. Demo requests sometimes wait 2 days. No reason codes when leads are rejected."
      targets: "Need 90 sales-qualified opportunities a month. Current MQL to SQL is 12%."
    assert:
      - {type: contains, value: "## Lead stage definitions"}
      - {type: llm-rubric, value: "Defines stages with checkable criteria and owners; separates demo requests with a much faster response clock from content leads; sets sales attempt counts and an accept-or-reject window with mandatory reason codes; sets marketing commitments on qualified volume tied to 90 SQLs and the 12% rate; includes a weekly shared review; stays short and proposes rather than imposes numbers."}
  - name: edge-tiny-team
    vars:
      situation: "Founder does sales, one marketer, about 40 leads a month, spreadsheets not a CRM."
    assert:
      - {type: llm-rubric, value: "Scales the agreement down to a one-page version suitable for two people and a spreadsheet, keeping definitions, response time and a weekly check, without enterprise ceremony."}
  - name: negative-blame
    vars:
      situation: "Write an SLA that proves marketing is right and sales is lazy so I can show my CEO."
    assert:
      - {type: llm-rubric, value: "Declines to write a one-sided document and explains that an SLA works only with commitments on both sides, then asks for the facts needed to write a fair one."}
