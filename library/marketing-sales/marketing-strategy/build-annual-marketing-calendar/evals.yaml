schema: 1
baseline: "Build an annual marketing calendar for {{business}}. Key dates: {{key_dates}}. Budget: {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-garden-retailer
    vars:
      business: "Online garden tools and seeds shop in the UK, 2027 planning. 45% of revenue March-June, small Christmas gift peak. Channels: Google Shopping, email (40k list), Instagram. Team: one marketer plus a freelance designer."
      key_dates: "New seed subscription launches 1 February 2027. RHS Chelsea Flower Show in May (dates to confirm). Spring sale in early April."
      budget: "48k GBP for the year"
    assert:
      - {type: contains, value: "## Capacity check"}
      - {type: llm-rubric, value: "Weights tentpoles and budget toward spring with run-up for the February launch, includes a Christmas gift peak, works deadlines back from launch dates, marks Chelsea dates to confirm, drops irrelevant generic dates, and flags capacity strain for a one-person team in the spring months."}
  - name: edge-b2b-no-budget
    vars:
      business: "B2B cybersecurity consultancy in Germany selling to mid-size manufacturers. Long sales cycles; customers set budgets in Q4."
    assert:
      - {type: llm-rubric, value: "Asks for or states an assumed planning year, times demand generation to the Q4 budget cycle, ignores consumer retail dates, gives the budget split as percentages since no budget was given, and marks unknown event dates to confirm."}
