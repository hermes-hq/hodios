schema: 1
baseline: "Design a loyalty programme for my business: {{business_and_margins}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-stamps
    vars:
      business_and_margins: "Independent cafe in Bristol. Average transaction 6.50 GBP. Coffee costs us about 0.60 GBP to make and sells at 3.40 GBP; food margin about 60%. 4,200 transactions a month. Card till that supports a simple loyalty add-on. Want regulars to come more often and fill 2-4pm, which is dead."
      customer_behaviour: "About 40% of transactions are regulars who come 3+ times a week. Many students and remote workers. Lots of one-time tourists in summer."
    assert:
      - {type: contains, value: "## Economics"}
      - {type: llm-rubric, value: "Uses cost price (about 0.60 GBP) rather than menu price for the free coffee and computes the effective discount (for example a free coffee after 9 or 10 paid is a few percent of spend); shows cautious and optimistic scenarios with labelled redemption and enrolment assumptions and a break-even lift; addresses the 2-4pm goal with a targeted element (for example bonus stamps in the afternoon); warns about rewarding regulars for existing behaviour; simple one-sentence mechanic; measures with thresholds."}
  - name: edge-thin-margin-online
    vars:
      business_and_margins: "Online electronics accessories store, average order 48 EUR, gross margin 15% after shipping and payment fees, 3,000 orders a month, about 70% of customers buy once."
    assert:
      - {type: llm-rubric, value: "Shows that a points discount large enough to matter would consume most of the 15% margin, recommends a non-discount or second-purchase-focused design (for example free shipping threshold perks, early access, a one-time second-order incentive with an expiry), and targets the one-time-buyer problem with economics shown."}
  - name: negative-no-margins
    vars:
      business_and_margins: "Hair salon. Want a points programme where customers get 20% back on everything. Make it exciting."
    assert:
      - {type: llm-rubric, value: "Asks for average transaction value and gross margin (or service cost) before designing, and flags that 20% back may exceed what the margin can sustain, rather than producing a full programme on unchecked numbers."}
