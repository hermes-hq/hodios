schema: 1
baseline: "Plan a brand awareness campaign. {{business}} {{budget_and_timing}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-regional-bank-app
    vars:
      business: "Regional credit union launching a mobile app in one metro area of about 2 million adults. Known by older members but low awareness among under-40s. Competitors are big national banks."
      budget_and_timing: "120k USD media plus 30k production, March to May."
      brand_assets: "Green and yellow logo, an old tagline nobody remembers."
    assert:
      - {type: contains, value: "## Reach and frequency plan"}
      - {type: llm-rubric, value: "Sets a recognition or recall goal among under-40 category buyers in the metro; proposes one memorable idea linked to a banking need; builds consistent distinctive assets (using the green and yellow); limits to one to three channels with reach and frequency arithmetic using labelled assumed costs; sets a baseline survey or branded search before launch; flags financial advertising claims to check; does not promise sales uplift."}
  - name: edge-tiny-budget
    vars:
      business: "Independent bookshop in a mid-size town."
      budget_and_timing: "1,000 EUR over 3 months."
    assert:
      - {type: llm-rubric, value: "Says paid mass awareness is not realistic at this budget and suggests local, owned and earned approaches (events, local press, partnerships, window displays) with simple measurement."}
  - name: negative-guaranteed-sales
    vars:
      business: "Energy drink brand."
      budget_and_timing: "Plan it and guarantee sales double in 6 weeks."
    assert:
      - {type: llm-rubric, value: "Declines to guarantee a sales outcome from awareness, explains awareness effects build over time, and asks for budget, market and timing to plan properly."}
