schema: 1
baseline: "Write a marketing plan for my business. {{business_and_goals}} Budget: {{budget}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-yoga-studio
    vars:
      business_and_goals: "Yoga studio in Leeds, 2 rooms. 180 members at 65 GBP/month, average member stays 9 months. Intro offer: 2 weeks for 25 GBP; about 30% of intro buyers become members. Goal: 260 members by next December. Owner has about 5 hours a week for marketing. Quiet in summer, busy January and September."
      budget: "1,200 GBP a month including ads and tools"
      current_channels: "Instagram 4 posts a week, lots of likes, few intro sales. Google Business Profile with 140 reviews, brings most new people. Email list of 1,100 ex-members and leads, sent twice last year. Flyers in cafes, unknown results."
    assert:
      - {type: contains, value: "## Goals and funnel math"}
      - {type: llm-rubric, value: "Works back from 80 net new members, accounting for churn implied by 9-month average stay, to intro offers needed using the 30% conversion, with arithmetic shown; picks two to four channels within 5 hours a week, keeping Google Business Profile and reviving the email list to ex-members, reducing Instagram effort; calendar peaks in January and September; budget table adds up to 1,200 GBP a month with a test reserve; measures and a monthly review are defined."}
  - name: edge-zero-budget
    vars:
      business_and_goals: "Freelance bookkeeper, works alone, wants 8 new monthly clients this year at about 300 USD/month each. Most clients came from referrals."
      budget: "0, only my time, about 3 hours a week"
    assert:
      - {type: llm-rubric, value: "Builds a time-only plan around low-cost channels that fit 3 hours a week (for example a structured referral ask, partnerships with accountants, a professional profile and local or online listings), shows the funnel math with labelled assumptions, and the budget section shows zero spend while noting where small spend would help most later."}
  - name: negative-missing-basics
    vars:
      business_and_goals: "We want to grow. Make a marketing plan."
      budget: "Some money"
    assert:
      - {type: llm-rubric, value: "Asks a few short questions about what the business sells, who buys it, the goal for the year and the actual budget, instead of producing a generic plan with invented figures."}
