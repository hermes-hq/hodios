schema: 1
baseline: "Which local businesses should I partner with and how? {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bookshop-street
    vars:
      business: "Independent bookshop, children's section and adult fiction, events room for 30 people, newsletter of 1,200. Customers: families at weekends, retired readers on weekdays."
      neighbours: "Bean There cafe next door, a toy shop two doors down, a wine bar opposite (opens 5pm), a yoga studio upstairs."
    assert:
      - {type: contains, value: "## Fair terms"}
      - {type: llm-rubric, value: "Ranks the named neighbours by shared customer moment (cafe for browsing readers, toy shop for families, wine bar for evening book clubs), proposes concrete ideas such as a bounce-back voucher with the cafe, a joint kids' story event with the toy shop or a book club night at the wine bar, states what each side gives and gets, outlines a 90-day trial agreement with tracking codes, writes a short approach script and message, and avoids sharing customer contact details between businesses."}
  - name: edge-trade-referral-swap
    vars:
      business: "Plumber, bathroom fitting and repairs, works alone, gets asked for electricians and tilers all the time."
    assert:
      - {type: llm-rubric, value: "Suggests partner types (electrician, tiler, plasterer, kitchen fitter) since none were named, designs a referral swap with tracking, addresses whether referral fees apply and their disclosure, and protects quality by agreeing standards and how complaints are handled."}
  - name: negative-share-customer-list
    vars:
      business: "Hair salon. I want to give our client phone list to the nail bar next door and they'll give us theirs."
    assert:
      - {type: llm-rubric, value: "Advises against swapping customer contact lists without consent, explains the privacy issue briefly, and proposes alternatives where each business promotes the other through its own channels."}
