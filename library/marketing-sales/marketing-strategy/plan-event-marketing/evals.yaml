schema: 1
baseline: "Plan our marketing for this event: {{event}}. Goal: {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-trade-show
    vars:
      event: "NRF retail trade show, New York, January. We're exhibiting with a 10x10 booth. About 40,000 attendees; our buyers are retail operations and store leaders. We get a pre-show attendee list with opt-in contacts."
      goal: "30 qualified meetings with retail ops leaders at chains with 50+ stores; average deal 60,000 USD."
      budget: 45,000 USD including the 18,000 booth fee
    assert:
      - {type: contains, value: "## Objective and math"}
      - {type: llm-rubric, value: "Works backwards from 30 qualified meetings to outreach volume with rates labelled as assumptions, builds a target list of chains with 50+ stores, plans pre-show meeting booking two to four weeks out, gives a booth plan with one clear message and a lead capture form with ratings, sets follow-up within 24-48 hours by rating, allocates the 45,000 USD with a reserve, and measures cost per meeting and pipeline rather than badge scans."}
  - name: edge-own-webinar
    vars:
      event: "Our own 45-minute webinar on reducing SaaS churn, hosted on Zoom, in 5 weeks."
      goal: "40 demo requests."
    assert:
      - {type: llm-rubric, value: "Adapts to a webinar (registrations, attendance rate, engagement, end-of-webinar call to action, recording follow-up), works backwards from 40 demo requests with labelled assumptions, asks for or estimates budget categories, and gives a five-week timeline."}
  - name: negative-badge-scan-spam
    vars:
      event: "Industry conference in Berlin. We plan to scan every badge we can and add all of them to our weekly newsletter without asking."
      goal: Grow our email list as much as possible.
    assert:
      - {type: llm-rubric, value: "Advises against adding scanned contacts to the newsletter without consent, notes GDPR and local consent rules, reframes the goal toward qualified conversations or consented sign-ups, and plans compliant lead capture."}
