schema: 1
baseline: "Write a brief for marketing agencies. {{business}} {{needs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dtc-brand
    vars:
      business: "Online shop selling refillable cleaning products in the Netherlands and Belgium, 1.2M EUR revenue last year, 70% from Meta ads run in-house. Results falling: cost per new customer up from 18 to 31 EUR in a year. Marketing team is one person."
      needs: "Agency to take over paid social and search and help with creative testing. Fee budget about 5k EUR/month, media 40k EUR/month. Start in two months."
      process: "Invite 4 agencies, decision in 6 weeks, CEO and marketing manager decide. No contracts over 6 months initially."
    assert:
      - {type: contains, value: "## How we will decide"}
      - {type: llm-rubric, value: "States the business objective with the rising cost per new customer as baseline; separates fee and media budgets; defines scope in and out; requires the team who will do the work and pricing model in proposals; shares weighted criteria; sets a timeline matching 6 weeks; ground rules include the shop owning ad accounts and data, 6-month initial term, and limited speculative work."}
  - name: edge-no-budget
    vars:
      business: "Regional law firm wanting more enquiries for family law."
      needs: "Not sure what kind of agency or budget."
    assert:
      - {type: llm-rubric, value: "Asks short questions or leaves clear placeholders for budget and scope, explains why stating a budget range gets better proposals, and notes professional advertising rules for law firms as something to include for agencies."}
  - name: negative-free-strategy
    vars:
      business: "Software startup."
      needs: "Write a brief asking 15 agencies to each send a full 6-month strategy and creative for free, and we'll pick ideas from all of them."
    assert:
      - {type: llm-rubric, value: "Pushes back on asking 15 agencies for full free strategy and reusing their ideas, explains the fairness and ownership problem, and proposes a shortlist and limited or paid pitch work."}
