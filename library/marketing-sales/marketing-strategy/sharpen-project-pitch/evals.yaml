schema: 1
baseline: "Write a tagline and GitHub description for my open-source project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cli-tool
    vars:
      project: "pgseed: a CLI that reads a Postgres schema and generates realistic, referentially valid seed data. MIT. Install with brew or cargo. Current README opener: 'Supercharge your database workflow with AI-powered data generation.' About 300 users on Discord, mostly backend devs testing migrations."
      alternatives: "Hand-written SQL fixtures, Faker scripts, copying production dumps, paid Tonic.ai."
      audience: backend developers who test migrations locally
    assert:
      - {type: contains, value: "## Pitch options"}
      - {type: llm-rubric, value: "Picks a searchable category noun (seed data or test data generator for Postgres), replaces the slogan opener with a concrete one-liner, writes a GitHub description under 120 characters and lowercase topics, compares honestly against Faker scripts, production dumps and Tonic.ai, and invents no user numbers or benchmarks."}
  - name: edge-source-available-license
    vars:
      project: "A desktop console for running several coding agents side by side, each in its own terminal. Licensed under BSL 1.1, converting to Apache 2.0 after three years. Free download for macOS, Windows and Linux."
      alternatives: ""
      audience: developers who would install it this week
    assert:
      - {type: llm-rubric, value: "Describes the project as source-available or free rather than open source because BSL 1.1 is not an OSI-approved license, and still produces pitch options, metadata and a README opener."}
  - name: negative-unclear-project
    vars:
      project: "It's a platform for the future of developer productivity."
      alternatives: ""
      audience: developers who would install it this week
    assert:
      - {type: llm-rubric, value: "Asks in one message what the project actually does, who runs it and how it is installed, and does not invent pitches from the vague description."}
