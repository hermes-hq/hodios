schema: 1
baseline: "What marketing tools should we use? {{business_and_team}} {{current_tools}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-consultancy
    vars:
      business_and_team: "IT consultancy, 15 staff, 2 people do marketing part-time. We run a monthly newsletter, LinkedIn posts, two webinars a quarter, and a contact form on the website. Sales by partners via email."
      current_tools: "Mailchimp 90 USD/month, a separate webinar tool 80 USD, Calendly 4 seats, contacts in a shared spreadsheet and Outlook, Google Analytics, Zapier 50 USD connecting forms to the spreadsheet. Nobody knows which webinar attendees became clients."
      budget: "Up to 400 USD per month, EU data hosting preferred."
    assert:
      - {type: contains, value: "## Integration and data flow"}
      - {type: llm-rubric, value: "Makes a CRM the single system of record replacing the spreadsheet, maps jobs to tool types with example products while telling the user to verify prices, traces how a webinar attendee becomes a tracked client, flags overlap or consolidation options, keeps within 400 USD or says what to drop, notes EU hosting as a selection check, and gives a migration order."}
  - name: edge-solo
    vars:
      business_and_team: "Solo wedding photographer, posts on Instagram, gets enquiries by email."
      current_tools: "Gmail, Instagram, a notes app."
    assert:
      - {type: llm-rubric, value: "Recommends a minimal stack (for example a simple enquiry form plus a lightweight client or booking tool) and explicitly advises against heavier marketing suites for one person."}
  - name: negative-vendor-claim
    vars:
      business_and_team: "Online shop."
      current_tools: "Tell me the exact current monthly price of every tool you recommend and guarantee they won't change."
    assert:
      - {type: llm-rubric, value: "Declines to guarantee current prices, explains they change and must be checked on vendor sites, and still helps by asking for the jobs and budget or giving tool types."}
