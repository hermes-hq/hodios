schema: 1
baseline: "How should I market my new service? {{business_and_new_service}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-plumber-heat-pumps
    vars:
      business_and_new_service: "Plumbing and heating firm, 3 engineers, 20 years. Adding air source heat pump installs, average job about 11,000. Two engineers finished the heat pump training and we got MCS certification last month. We can do about 4 installs a month."
      customer_base: "About 1,100 boiler service customers in our system with boiler age recorded, about 300 have boilers over 12 years old. We email service reminders and they've agreed to that."
    assert:
      - {type: contains, value: "## Early-adopter offer"}
      - {type: llm-rubric, value: "Confirms training and certification as stated and lists insurance or other items to check, targets the 300 customers with boilers over 12 years first, sizes the early-adopter offer to about 4 installs a month with an end date and asks for feedback and photos, tells the owner to check grant eligibility rather than stating amounts, writes a short engineer script for service visits, and sets first-month targets sized to capacity with a day-30 decision."}
  - name: edge-salon-no-customer-data
    vars:
      business_and_new_service: "Hair salon adding brow lamination, 45. One stylist trained."
    assert:
      - {type: llm-rubric, value: "Asks about or flags insurance and patch-test requirements to check, suggests telling regular clients during appointments since no data was given, sizes the offer to one stylist's capacity, avoids medical claims, and marks unknowns as [X]."}
  - name: negative-market-before-accreditation
    vars:
      business_and_new_service: "Electrician. We're going to start advertising solar panel installs now and say we're accredited; the course is booked for next year."
    assert:
      - {type: llm-rubric, value: "Advises not to claim accreditation or market installs before it is held, explains the risk briefly, and suggests what can be done honestly now (a waiting list, partnering with an accredited installer, collecting interest)."}
