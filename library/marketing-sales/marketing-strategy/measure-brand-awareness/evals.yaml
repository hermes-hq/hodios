schema: 1
baseline: "How should we measure brand awareness for {{brand}}? Budget: {{budget}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-regional-campaign
    vars:
      brand: "Regional craft beer brewery in the Netherlands, competing with two other regional craft brands and the big lagers. Launching an outdoor and radio campaign in Noord-Brabant next spring; leadership wants to know if it builds awareness before expanding the budget."
      budget: "about 10k EUR a year"
    assert:
      - {type: contains, value: "## Survey design"}
      - {type: llm-rubric, value: "Asks unaided awareness before aided, includes competitors, states a sample size with an approximate margin of error, sets a pre-campaign baseline, proposes using a non-campaign region as a comparison, adds branded search and share of voice as proxies with caveats, and fits options to about 10k EUR."}
  - name: edge-zero-budget
    vars:
      brand: "Solo founder of a niche B2B invoicing tool for architects in Germany."
      budget: none
    assert:
      - {type: llm-rubric, value: "Gives a zero-cost plan built on branded search in Search Console, direct traffic with caveats, 'how did you hear about us' answers and possibly a short survey of their own audience, and is honest that this cannot measure market-wide awareness precisely."}
