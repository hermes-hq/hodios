schema: 1
baseline: "Write a campaign brief for {{campaign}} targeting {{audience}}. Budget {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lapsed-customers
    vars:
      campaign: "Meal-kit company. Win back customers who cancelled. Exit survey: 52% said 'too much cooking on weeknights'. We now have 15-minute recipes and can pause anytime. Goal: reactivate 8,000 customers by end of Q1. Channels: email, paid social, direct mail. Must include the 50% off first box offer and terms link."
      audience: "Customers who cancelled in the last 12 months"
      budget: "120k EUR media, 40k EUR production"
    assert:
      - {type: contains, value: "Proposition"}
      - {type: llm-rubric, value: "Writes a one-page brief whose insight builds on the 'too much cooking on weeknights' survey finding with tension, gives a single-minded proposition around 15-minute recipes rather than listing several messages, states the 8,000 reactivations by Q1 objective, includes the 50% offer and terms as mandatories, and marks missing items like approvals as TBC."}
  - name: negative-five-messages
    vars:
      campaign: "Bank app relaunch. We want to say it's faster, safer, greener, has new budgeting tools, and offers 4% interest. No research. All five messages must be equal in the brief."
      audience: "Everyone aged 18-65"
    assert:
      - {type: llm-rubric, value: "Pushes back on five equal messages and an audience of everyone, chooses or proposes one proposition with the others as reasons to believe or alternatives, labels insights as to validate since there is no research, flags the 4% interest claim for legal review, and lists open questions."}
