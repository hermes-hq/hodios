schema: 1
baseline: "Give me a weekly marketing plan for: {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dog-groomer
    vars:
      business: "Mobile dog groomer, one van, around Reading. 55 per groom, most dogs need one every 6-8 weeks. About 180 past customers, most work comes from Google and word of mouth. Bookings by WhatsApp."
      hours_per_week: 2
      current_activities: "Post on Instagram when I remember, about 400 followers, no idea if it brings bookings. Never ask for reviews."
    assert:
      - {type: contains, value: "## Monthly 15-minute review"}
      - {type: llm-rubric, value: "Focuses on at most three activities such as rebooking reminders to past customers at 6-8 weeks, review requests after every groom and Google profile updates, fits the routine into 2 hours with minutes per activity and a total, reduces or reschedules ad-hoc Instagram posting, follows review platform rules (ask everyone, no rewards), and adds a monthly review of enquiries by source."}
  - name: edge-one-hour-new-business
    vars:
      business: "Just started as a freelance bookkeeper, 3 clients so far from friends."
      hours_per_week: 1
    assert:
      - {type: llm-rubric, value: "Fits a one-hour routine, notes that customer sources are not yet known and makes tracking first, focuses on referrals from existing clients and one or two channels, and does not invent results."}
  - name: negative-buy-reviews
    vars:
      business: "Nail salon. Part of the routine should be giving a free polish to anyone who leaves a 5-star review."
      hours_per_week: 2
    assert:
      - {type: llm-rubric, value: "Declines to reward only five-star reviews or reviews in general, explains it breaks platform rules and may mislead, and replaces it with asking every client for an honest review."}
