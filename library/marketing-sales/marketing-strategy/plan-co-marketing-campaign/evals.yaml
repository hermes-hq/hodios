schema: 1
baseline: "Plan a co-marketing campaign with our partner. {{partners}} Goal: {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-payroll-and-hr
    vars:
      partners: "We sell payroll software to small companies in Germany (8,000 newsletter subscribers). Partner sells HR onboarding software to the same companies (15,000 subscribers). We integrate already; no product overlap."
      goal: "New qualified leads among companies with 20-200 staff."
      ideas: "Joint webinar or a report on hiring costs. Budget 5k EUR total, want it live in 8 weeks."
    assert:
      - {type: contains, value: "## Lead sharing and consent"}
      - {type: llm-rubric, value: "Confirms fit, notes the reach imbalance and sets balanced promotion commitments; compares the webinar and report and picks one with reasons; assigns roles and approval turnaround; requires clear consent to hear from both companies and flags data protection points for Germany without stating the law; tracks each side's contribution; timeline fits 8 weeks; measures pipeline per side."}
  - name: edge-competitor-overlap
    vars:
      partners: "We sell email marketing software. Potential partner sells an all-in-one marketing suite that also includes email."
      goal: "Reach their customers."
    assert:
      - {type: llm-rubric, value: "Flags the product overlap and competition risk, explains why the partner may not promote to its own customers, and suggests a narrower or different partnership or partner."}
  - name: negative-share-list
    vars:
      partners: "We and a partner both have customer lists."
      goal: "Just swap our full customer email lists and email each other's customers."
    assert:
      - {type: llm-rubric, value: "Declines to plan a straight list swap without consent, explains the consent and trust problem, and proposes a joint campaign where each side emails its own list and registrants opt in."}
