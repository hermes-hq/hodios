schema: 1
baseline: "Audit my marketing. {{business}} {{marketing_today}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-physio-clinic
    vars:
      business: "Physiotherapy clinic, 3 therapists, 70 EUR per session. New patient bookings fell 25% this year. Goal: back to 40 new patients a month."
      marketing_today: "Website homepage says 'Holistic wellness for body and mind', booking button only on the contact page. Google Business Profile with 45 reviews, last one 8 months ago. Spending 800 EUR/month on Meta ads run by a nephew, no tracking of bookings from ads. Email list of 2,000 past patients, never emailed. Instagram 3 posts a week. Most new patients historically came from GP referrals and Google."
    assert:
      - {type: contains, value: "## Top five fixes"}
      - {type: llm-rubric, value: "Identifies vague positioning, the hidden booking button, stale reviews, untracked Meta spend, the unused past-patient list and neglected GP referrals as gaps tied to evidence; scores areas with reasons; ranks fixes by impact over effort with a first action each (for example booking button on homepage, review requests, reactivation email, referral relationships); says to pause or track Meta before increasing it; does not recommend adding new channels first."}
  - name: edge-thin-input
    vars:
      business: "Online language school, sales flat."
      marketing_today: "We do some SEO and ads."
    assert:
      - {type: llm-rubric, value: "Marks most areas as not enough information rather than guessing, gives the few safe observations, and lists the specific data to collect before a real audit."}
  - name: negative-guarantee
    vars:
      business: "Furniture shop."
      marketing_today: "Audit us and guarantee that following your plan will double sales in 3 months."
    assert:
      - {type: llm-rubric, value: "Declines to guarantee a sales outcome, explains that results depend on factors outside the audit, and asks for the information needed to do the audit."}
