schema: 1
baseline: "Write our marketing plan for next quarter. {{targets}} {{inputs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-team-of-three
    vars:
      targets: "Q1 target: 900k USD marketing-sourced pipeline (last quarter 620k vs target 800k; webinars produced 40% of it, paid social produced little). Also launch new reporting module."
      inputs: "Ideas: new website, podcast, 3 webinars, partner webinar, paid social refresh, G2 review push, customer case studies, trade show in March (already booked), sales wants a new deck. Team: content marketer (full time), demand gen manager (full time), designer 50%. Budget 60k USD."
      context: "Sales team adding 2 reps in February."
    assert:
      - {type: contains, value: "## Not this quarter"}
      - {type: llm-rubric, value: "Uses last quarter's miss and the webinar lesson; sets outcome goals tied to the 900k pipeline; chooses three to five programmes (likely webinars, the reporting module launch, the booked trade show, case studies or reviews) with owners, hours and budget summing to 60k; checks hours against 2.5 people with a buffer; explicitly defers items such as the new website or podcast with reasons; lists dependencies such as product launch date and new reps."}
  - name: edge-solo-marketer
    vars:
      targets: "Grow trial signups 20% this quarter."
      inputs: "Just me, about 30 hours a week, 5k USD. Lots of requests from the CEO."
    assert:
      - {type: llm-rubric, value: "Limits the plan to what one person can run, keeps a buffer for CEO requests, and makes the 'not this quarter' list explicit to manage expectations."}
  - name: negative-everything
    vars:
      targets: "No targets yet."
      inputs: "Put every idea in the plan, we'll figure out time later."
    assert:
      - {type: llm-rubric, value: "Asks for targets and team capacity and explains that a plan without them cannot prioritise, instead of listing every idea."}
