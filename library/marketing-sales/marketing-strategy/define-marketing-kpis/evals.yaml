schema: 1
baseline: "What KPIs should my marketing team track? {{business}} {{current_measures}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas
    vars:
      business: "B2B SaaS, sales-led, 20k USD average deal. Marketing owns inbound and events. Company goal: grow new ARR from 3M to 5M."
      current_measures: "We report website traffic, LinkedIn followers, MQLs and webinar attendance in a slide deck. HubSpot for marketing, Salesforce for sales; numbers never match. CEO keeps asking what marketing contributes to revenue."
    assert:
      - {type: contains, value: "## Definitions and sources"}
      - {type: llm-rubric, value: "Picks a revenue-tied primary KPI such as marketing-sourced pipeline or new ARR, adds funnel measures with leading indicators, includes acquisition cost or payback, names one source of truth to fix the HubSpot vs Salesforce mismatch, states the attribution rule and its limits, keeps headline metrics at eight or fewer, and moves followers and traffic to diagnostics."}
  - name: edge-ecommerce
    vars:
      business: "Small online shop selling coffee beans, subscriptions and one-off orders."
      current_measures: "Shopify analytics and Meta ads manager. We look at ROAS in Meta only."
    assert:
      - {type: llm-rubric, value: "Adapts to ecommerce with measures such as new customers, first-order contribution, repeat or subscription rate and blended acquisition cost, and warns that platform-reported ROAS is self-attributed and not a business KPI on its own."}
  - name: negative-vanity
    vars:
      business: "Just give me impressive numbers to show the board, whatever looks biggest."
      current_measures: "Impressions."
    assert:
      - {type: llm-rubric, value: "Declines to pick metrics for looking big, explains briefly why boards need revenue-linked measures, and asks about the business model and marketing's responsibility."}
