schema: 1
baseline: "Which marketing channels should I use for {{business}} targeting {{audience}}? Budget: {{budget}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-saas
    vars:
      business: "Shift scheduling software for independent veterinary clinics, 149 USD per month per clinic. 12 paying clinics, all from the founder's network (she was a vet practice manager). Founder is good at talking to clinics, weak at ads."
      audience: "Practice managers at independent vet clinics in the US"
      budget: "6,000 USD and about 10 hours a week for three months"
    assert:
      - {type: contains, value: "## Test plans"}
      - {type: llm-rubric, value: "Scores channels with reasons, favours channels matching the founder's strengths and the niche audience (for example vet practice manager communities, industry events or associations, outbound to clinics, referrals) over broad social ads, writes three tests with customer-tied metrics and explicit success and kill thresholds derived from customer value, and fits 6,000 USD and 10 hours a week."}
  - name: edge-low-price-consumer
    vars:
      business: "Mobile app for tracking houseplant watering, 2.99 USD one-off purchase. Pre-launch."
      audience: "Houseplant hobbyists"
    assert:
      - {type: llm-rubric, value: "Recognises the low price point rules out costly channels like outbound sales or events, favours app store optimisation, communities, organic social or content and partnerships with plant creators, labels value estimates, and asks for or assumes a testing budget explicitly."}
