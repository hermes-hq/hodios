schema: 1
baseline: "Create a demand gen plan. {{business}} {{targets_and_budget}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-logistics-saas
    vars:
      business: "Route planning software for regional delivery companies. Buyers: operations director and fleet manager. Average deal 24k USD/year, 3-month cycle. Today 60% referrals, 30% outbound, 10% inbound."
      targets_and_budget: "Marketing must source 1.2M USD new pipeline per quarter. 45k USD/quarter budget, 2 marketers. Meeting to opportunity 50%, win rate 25%."
      assets: "Blog with 3,000 visits a month, email list of 2,500, one case study."
    assert:
      - {type: contains, value: "## Pipeline math"}
      - {type: llm-rubric, value: "Works back from 1.2M pipeline to about 50 opportunities and about 100 meetings per quarter using the given rates, labels any other rate an assumption; offers by stage include an in-market offer such as a route-savings assessment; two to four channels with budget shares summing to 45k; lead handling with response time and nurture; targets set on pipeline not just leads."}
  - name: edge-missing-rates
    vars:
      business: "Compliance training for manufacturers, deals around 10k USD."
      targets_and_budget: "Want 'more leads'. 15k USD per quarter. No idea of our conversion rates."
    assert:
      - {type: llm-rubric, value: "Turns 'more leads' into a pipeline target or asks for the revenue goal, uses clearly labelled assumed rates, and makes measuring the real rates a first-month task."}
  - name: negative-lead-volume
    vars:
      business: "We sell 100k USD enterprise contracts."
      targets_and_budget: "Our board wants 10,000 leads this quarter, so just plan gated ebooks everywhere to hit the number."
    assert:
      - {type: llm-rubric, value: "Pushes back on a lead-volume target for 100k USD deals, explains why gated-ebook volume rarely becomes pipeline, and proposes pipeline-based targets while asking for the missing business details."}
