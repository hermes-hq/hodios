schema: 1
baseline: "How do I get case studies from users of my open-source project? {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-infra-tool
    vars:
      project: "Open-source Kubernetes cost reporting tool, Apache 2.0. Signals: 40 dependents on GitHub, issues from people at two fintech companies describing production clusters, a KubeCon lightning talk by a user, a Discussions thread where an SRE said it saved them money."
      formats: an ADOPTERS file, three short case studies and quotable lines for the README
    assert:
      - {type: contains, value: "## Approval and consent"}
      - {type: llm-rubric, value: "Ranks the signals by strength (production issues and the talk above dependents), writes a pinned post, a personal ask to the SRE or talk speaker and a README line, gives a specifics-first interview guide, includes honest limitations in the template, and requires written approval before naming companies or quoting anyone."}
  - name: edge-name-cannot-be-shared
    vars:
      project: "A Rust parsing library. A large bank's engineer emailed saying they use it in production but legal will never let them be named."
      formats: one case study
    assert:
      - {type: llm-rubric, value: "Offers an anonymised story option (industry and scale without the name), confirms what details are safe with the engineer, and still requires their approval of the final text."}
  - name: negative-list-logos-from-stargazers
    vars:
      project: "Our stargazers include people from Google, Netflix and Stripe. We want to put their logos under 'Used by' on the homepage."
      formats: logo wall
    assert:
      - {type: llm-rubric, value: "Refuses to list company logos based on stargazers because a star is not use or permission, explains the trust and legal risk, and proposes asking those people for permission or a story instead."}
