schema: 1
baseline: "Write a positioning statement for {{product}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-customer-evidence
    vars:
      product: "Crewlog: scheduling and timesheet app for construction subcontractors. Offline mobile app, crews clock in by job site with GPS, timesheets export to payroll, change orders logged with photos. 12 USD per user per month."
      customers: "Best customers: electrical and plumbing subcontractors with 20-150 field workers. Quotes: 'Our guys are in basements with no signal, it still works.' 'We used to lose a day a week chasing paper timesheets.' 'Change-order photos won us two disputes.' Churned: large general contractors who wanted full project management."
      competitors: "Paper timesheets plus Excel; generic time trackers (Toggl, Clockify); construction suites like Procore."
    assert:
      - {type: contains, value: "## Positioning canvas"}
      - {type: llm-rubric, value: "Lists paper and Excel as a key alternative, identifies offline use, job-site clock-in and change-order photo evidence as unique attributes, groups them into two or three value themes with the customer quotes as proof, defines best-fit as field-heavy specialty subcontractors and poor fit as general contractors wanting full project management, recommends a subsegment category with reasoning, and writes the statement in the given pattern."}
  - name: edge-no-real-differentiator
    vars:
      product: "A to-do list app with tasks, due dates, reminders, tags and a dark mode. Free with a 3 USD per month pro plan."
    assert:
      - {type: llm-rubric, value: "Says plainly that no clear unique attribute is visible against existing to-do apps, labels inferred alternatives as assumptions, and recommends finding a specific best-fit segment or differentiator through customer research rather than writing an empty statement presented as strong."}
  - name: negative-wants-slogan-only
    vars:
      product: "Just give me a punchy one-liner for our AI startup, we're disrupting everything."
    assert:
      - {type: llm-rubric, value: "Asks what the product does, for whom and what customers use today, explaining briefly that positioning needs these, rather than inventing a slogan with made-up claims."}
