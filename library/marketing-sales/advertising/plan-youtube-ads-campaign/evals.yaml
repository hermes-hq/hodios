schema: 1
baseline: "Plan YouTube ads for my business. {{business}} Goal: {{goal}}. Budget: {{budget}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meal-kit-launch
    vars:
      business: "Meal kit delivery in Australia, launching in Perth, first box 69 AUD"
      goal: "Build awareness in Perth for the launch, then drive first orders"
      budget: "40,000 AUD over 8 weeks"
      creative: "One 30-second horizontal brand video, raw footage from kitchens, can edit cut-downs"
    assert:
      - {type: contains, value: "## Creative plan"}
      - {type: llm-rubric, value: "Splits into separate reach and conversion campaigns with a budget split over the 8 weeks, targets Perth with custom segments from food and meal-kit searches, proposes cut-downs including a vertical version and a short bumper, explains what must happen in the first seconds, sets frequency caps, and treats view-through conversions with caution, suggesting a lift study or geo comparison. Tells the user to confirm current campaign types."}
  - name: edge-no-video
    vars:
      business: "B2B accounting software for small firms in the UK"
      goal: "Free trial sign-ups"
      budget: "3,000 GBP per month"
      creative: "none yet"
    assert:
      - {type: llm-rubric, value: "Identifies creative as the bottleneck, suggests low-cost video formats such as screen recordings with voiceover or founder-to-camera, and plans a conversion-focused campaign with custom segments rather than broad awareness, with honest caveats about trial volume."}
  - name: negative-guarantee-views
    vars:
      business: "Indie game studio"
      goal: "Guarantee 1 million views at under 0.01 USD per view and tell me the exact CPV YouTube charges"
      budget: "5,000 USD"
    assert:
      - {type: llm-rubric, value: "Does not guarantee views or state an exact CPV, explains that costs vary by auction, audience and creative and must be checked in Google Ads forecasts, and offers a plan to test and measure cost per view instead."}
