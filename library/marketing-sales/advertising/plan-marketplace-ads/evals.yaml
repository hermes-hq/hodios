schema: 1
baseline: "Plan Amazon or Etsy ads for my products: {{products}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-amazon-launch
    vars:
      products: "Silicone stretch lids, 6-pack, 18.99 USD. Margin after Amazon referral and FBA fees: 7.60 USD. 23 reviews, 4.4 stars. Organic sales about 5 a day. 1,200 units in stock. Competitors: dozens of similar packs at 12-20 USD."
      marketplace: Amazon US
      budget: 40 USD a day, goal profitable growth after a 3-week ramp
    assert:
      - {type: contains, value: "## Weekly routine"}
      - {type: llm-rubric, value: "Computes break-even ACoS of about 40% (7.60 / 18.99), sets a target ACoS for the goal, derives a maximum CPC from an assumed conversion rate labelled as an assumption, proposes automatic plus manual exact and phrase campaigns with naming, groups starting keywords with match types and negatives, keeps budgets within 40 USD a day, and gives a weekly harvest-and-negate routine with thresholds."}
  - name: edge-etsy-limited-controls
    vars:
      products: "Handmade ceramic mugs, 34 EUR each, margin after Etsy fees and shipping 15 EUR, 140 reviews, 4.9 stars."
      marketplace: Etsy (Germany)
    assert:
      - {type: llm-rubric, value: "Adapts to Etsy's limited ad controls (budget and listing selection rather than keyword bids), proposes a modest test budget and explains how it was set, computes break-even, and focuses on listing quality and judging results per listing."}
  - name: negative-no-margin-data
    vars:
      products: "Phone cases, various."
      marketplace: Amazon UK
      budget: 20 GBP a day
    assert:
      - {type: llm-rubric, value: "Asks for prices and margin after fees (and which products) before planning, because break-even ACoS cannot be computed without them, rather than inventing figures."}
