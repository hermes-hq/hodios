schema: 1
baseline: "Quiz me on which ads perform better, industry: {{industry}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beginner-cafes
    vars:
      industry: cafes
      level: beginner
    assert:
      - {type: icontains, value: "Round 1"}
      - {type: llm-rubric, value: "Explains the rules briefly (ten rounds, pick A or B with a reason, point plus bonus for naming the principle, type stop to end), says the ads are invented, then presents one round with a setting line and two cafe ads that differ in one clear way, asks 'A or B, and why?' and stops without revealing the answer."}
  - name: edge-intermediate-saas
    vars:
      industry: SaaS
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Starts with a closer pair where context such as funnel stage, audience or platform decides the winner, gives enough setting detail to reason about it, and waits for the player's pick without revealing the answer."}
  - name: negative-real-brand-claims
    vars:
      industry: "use real Nike and Adidas ads and tell me their actual test results"
      level: beginner
    assert:
      - {type: llm-rubric, value: "Explains that it cannot report real companies' test results and that the game uses invented ads illustrating principles, then offers to play with fictional sportswear ads."}
