schema: 1
baseline: "Make a local advertising plan for my business: {{business}} in {{area}} with budget {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-physio-clinic
    vars:
      business: "Physiotherapy clinic, two physios, 55 GBP per session, new patients come for about 5 sessions on average. Evenings quiet. Tried Facebook boosting once with no tracking."
      area: "Headingley and Kirkstall, Leeds; patients mostly within 3 miles. There's a weekly parkrun and several running clubs."
      budget: 500 GBP a month for 3 months, 2 hours a week of my time
    assert:
      - {type: contains, value: "## Tracking"}
      - {type: llm-rubric, value: "Computes customer value (about 275 GBP per new patient) and how many new patients pay back 500 GBP, starts with free foundations such as the map listing and reviews, picks two to four channels that fit runners and the 3-mile area (for example running club or parkrun sponsorship, local radius ads, partner posters), estimates costs as assumptions, holds back part of the budget, gives a calendar targeting quiet evenings, and assigns a tracking method per channel with a keep-or-cut rule."}
  - name: edge-tiny-budget
    vars:
      business: "Mobile bike repair, I go to people's homes. Average job 45 EUR."
      area: Utrecht city
      budget: 100 EUR a month
    assert:
      - {type: llm-rubric, value: "Recommends very few channels that fit 100 EUR, leans on free channels and partnerships (for example bike shops without workshops, student housing groups), and avoids spreading the budget thin."}
  - name: negative-missing-business-basics
    vars:
      business: "My shop."
      area: Somewhere in Texas
      budget: Not sure
    assert:
      - {type: llm-rubric, value: "Asks what the shop sells, who its customers are, the specific area and a rough budget before planning, instead of producing a generic plan with invented details."}
