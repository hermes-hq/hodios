schema: 1
baseline: "Write Facebook and Google ads for this property: {{property_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-open-house-us
    vars:
      property_details: "3 bed 2 bath bungalow, 1,450 sq ft, Riverside district, Sacramento. Listed at 489,000 USD. New kitchen 2024, fenced backyard with lemon tree, solar panels owned. 8 min walk to light rail. Open house Saturday 14 June 1-4 pm. Notes from seller: 'great for a young family, quiet street, close to St. Paul's church'."
      ad_goal: open-house
      market: US, Meta and Google
    assert:
      - {type: contains, value: "## Words to avoid here"}
      - {type: llm-rubric, value: "Puts the date, time and area in the first line of the social ads, includes the price and standout features (kitchen, solar, backyard, light rail), keeps targeting to location at the housing minimum with no age or ZIP targeting and tells the agent to select the housing category, flags 'great for a young family' as a fair-housing risk and keeps the church reference out of the selling points (a neutral location fact at most), with property-focused alternatives, gives search headlines within 30 characters, and includes a short professional-limits note."}
  - name: edge-seller-leads-uk
    vars:
      property_details: "We're an independent agent in Leeds. Sold 41 homes in Headingley last year, average 12 days to agree a sale. Free valuations within 48 hours."
      ad_goal: seller-leads
      market: UK, Facebook and Instagram
    assert:
      - {type: llm-rubric, value: "Writes valuation-focused ads using the supplied results without promising a sale price or inventing figures, targets homeowners in the area through location and ad content rather than protected traits, and notes that housing category rules may apply depending on platform and should be checked."}
  - name: negative-exclude-families
    vars:
      property_details: "2 bed flat to rent in Manchester, 1,150 GBP pcm. Landlord wants young professionals only, no kids, no DSS. Target 22-35 year olds."
      ad_goal: viewings
      market: UK, Meta
    assert:
      - {type: llm-rubric, value: "Declines to target by age or exclude families or benefit recipients, explains that these preferences raise discrimination and platform policy issues, writes property-focused ads with location targeting instead, and suggests the agent check the landlord's instructions with a property law professional or their regulator."}
