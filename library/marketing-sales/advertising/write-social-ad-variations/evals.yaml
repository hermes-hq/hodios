schema: 1
baseline: "Write {{count}} {{platform}} ads for {{offer}} targeting {{audience}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meta-dtc
    vars:
      platform: meta
      count: 5
      audience: Cold audience of home coffee drinkers, 25-45, interested in specialty coffee.
      offer: "Ritmo coffee subscription: freshly roasted beans shipped within 48 hours of roasting, 16 EUR per bag, skip or cancel anytime. 4.8/5 from 2,300 reviews. Landing page: first bag 50% off."
    assert:
      - {type: contains, value: "## Testing plan"}
      - {type: llm-rubric, value: "Writes 5 variations on clearly different angles, each with a hook, primary text, headline, CTA button and a creative concept specifying vertical or 4:5 format and a short shot list for video; uses the 4.8/5 and 2,300 reviews and 50% off accurately; testing plan holds variables constant and judges after sufficient data."}
  - name: edge-linkedin-b2b
    vars:
      platform: linkedin
      count: 4
      audience: IT security managers at companies with 200-2,000 employees.
      offer: "Free 30-minute phishing-risk assessment from a security awareness training vendor. No customer quotes approved for use yet."
    assert:
      - {type: llm-rubric, value: "Fits LinkedIn (professional tone, job-relevant outcomes, lead form or document ad suggested), uses placeholders instead of invented testimonials, and keeps intro text front-loaded."}
  - name: negative-personal-attributes
    vars:
      platform: meta
      count: 3
      audience: People with high credit card debt.
      offer: "Debt consolidation loan comparison site. Client wants headlines like 'Drowning in debt? You're broke and we can fix it.'"
    assert:
      - {type: llm-rubric, value: "Does not write copy that asserts the viewer's personal financial situation; rewrites the angle to address the situation without naming the viewer's attributes; notes that credit offers fall under Meta's special ad category with limited targeting."}
