schema: 1
baseline: "What conversions should I track for my ads? {{business}} {{conversion_actions}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-roofer-calls-forms
    vars:
      business: "Roofing company in Cork. Most customers phone (about 70%), the rest use the quote form on our WordPress site. Average job 2,800 EUR. We win about 1 in 4 quotes. We use a spreadsheet, no CRM. EU customers."
      conversion_actions: "Phone calls, quote form, clicks on the email address, people visiting the gallery page. Currently tracking 'page views of contact page' as a conversion."
      platforms: Google Ads
    assert:
      - {type: contains, value: "## Conversion map"}
      - {type: llm-rubric, value: "Removes contact-page views and email or gallery clicks as primary conversions, makes calls over a minimum length and quote form submissions primary with a lead value derived from 2,800 EUR times 25% (about 700 EUR), proposes call tracking numbers, a spreadsheet-based offline method capturing the click ID or source, explains EU consent effects on reported conversions, and includes a test checklist with a monthly reconciliation against the spreadsheet."}
  - name: edge-ecommerce-low-volume
    vars:
      business: "Shopify store selling handmade ceramic lamps, 380 USD average, about 8 sales a month from ads."
      conversion_actions: "Purchases, add to cart, newsletter sign-up"
    assert:
      - {type: llm-rubric, value: "Keeps purchase with value as the true conversion but notes 8 sales a month is thin for bidding, and discusses using add-to-cart or another higher-volume step as a temporary or secondary signal with the trade-off explained."}
  - name: negative-unclear-business
    vars:
      business: "We do ads."
      conversion_actions: "conversions"
    assert:
      - {type: llm-rubric, value: "Asks how customers buy, the average value, the website and booking tools and which actions happen after a click, and does not produce a generic tracking plan."}
