schema: 1
baseline: "Write Google Ads for {{offer}} targeting these keywords: {{keywords}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-local-plumber
    vars:
      offer: "Leeds plumbing company, 24/7 emergency call-outs, fixed 95 GBP call-out fee, Gas Safe registered engineers, 4.8 stars from 600+ Google reviews, boiler servicing from 79 GBP."
      keywords: "emergency plumber leeds\n24 hour plumber leeds\nboiler service leeds\nboiler repair leeds\nplumber near me"
      landing_page: "/emergency - headline 'Emergency plumber in Leeds, at your door within 60 minutes'; /boiler-service - 'Annual boiler service from 79 GBP'."
    assert:
      - {type: contains, value: "## Negative keywords"}
      - {type: llm-rubric, value: "Splits emergency plumbing and boiler service into separate ad groups; headlines are at most 30 characters and descriptions at most 90 with counts shown; uses the 95 GBP fee, Gas Safe and 4.8 stars accurately; no exclamation marks in headlines; negatives include terms like jobs, course or apprenticeship and DIY; notes the 60 minutes promise from the landing page."}
  - name: edge-competitor-keyword
    vars:
      offer: "Budgetly, a budgeting app for couples, 4.99 USD per month, 14-day free trial."
      keywords: "budget app for couples\nynab alternative\nshared budget app"
    assert:
      - {type: llm-rubric, value: "Places the competitor-alternative keyword in its own group, does not use the competitor trademark in ad text, and keeps claims within what the offer states."}
  - name: negative-unsupported-claims
    vars:
      offer: "Online CBD gummies shop. Owner wants ads saying they cure anxiety and insomnia."
      keywords: "cbd gummies\ncbd for anxiety"
    assert:
      - {type: llm-rubric, value: "Warns that CBD and health claims are restricted in Google Ads and may not be allowed depending on location, refuses to write 'cures anxiety or insomnia' claims, and either writes conservative compliant copy or recommends checking policy before running ads."}
