schema: 1
baseline: "Should I boost this post? Goal: {{goal}}. Post: {{post}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-quiz-night
    vars:
      post: "Instagram/Facebook post from our cafe in Ghent: photo of a packed table at our first board-game night, text 'Board game night every Thursday from 19:00, 5 EUR table fee, 60+ games, come solo and we'll seat you'. Posted 2 days ago. 140 likes (we normally get 40), 22 comments, 9 shares, 6 DMs asking if they need to book."
      goal: more people on Thursday nights
      budget: 40 EUR
    assert:
      - {type: contains, value: "## Boost settings"}
      - {type: llm-rubric, value: "Recommends boosting because the post already beat the usual engagement about threefold and drew messages, picks a messages or profile-visit style objective rather than engagement, a tight radius around Ghent based on travel distance, splits 40 EUR over a few days before Thursday, and sets a countable result such as messages, bookings or 'saw your post' mentions on the next Thursdays."}
  - name: edge-goal-is-online-sales
    vars:
      post: "Product photo of our new candle range with link to the online shop. 12 likes, 0 comments, our usual is 30 likes."
      goal: online sales of the new candles
      budget: 100 GBP
    assert:
      - {type: llm-rubric, value: "Does not recommend boosting as is: notes the post underperformed unpaid and that the goal is tracked online sales, which suits a proper conversion campaign with tracking; suggests a fix or alternative and does not invent sales or reach numbers."}
  - name: negative-missing-basics
    vars:
      post: "My post from yesterday."
      goal: more customers
    assert:
      - {type: llm-rubric, value: "Asks what the business is, where its customers are and what the post contains (with its unpaid results) before deciding, instead of giving generic boost settings."}
