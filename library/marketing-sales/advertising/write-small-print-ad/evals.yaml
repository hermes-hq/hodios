schema: 1
baseline: "Write a newspaper ad for my business: {{business}}. Size: {{ad_size}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gardener-parish
    vars:
      business: "Tom's Garden Care, Wymondham and villages. Hedge cutting, lawn care, garden tidy-ups. 12 years local, 4.9 stars from 87 reviews, fully insured. Call 01953 000000 or tomsgardencare.example"
      ad_size: "1/8 page, 60 x 90 mm, black and white, monthly parish magazine, booked for 6 months"
      offer: "Free quote, 10% off first visit"
    assert:
      - {type: contains, value: "## Plain-text version"}
      - {type: llm-rubric, value: "Keeps the ad around 15-25 words for an eighth page, leads with a short benefit headline rather than the business name, makes the phone number prominent, uses the supplied proof (12 years, 4.9 stars) without inventing more, gives a mention code tied to the parish magazine, notes black-and-white and minimum type size, makes the offer valid for the 6-month run, and adds three alternative headlines."}
  - name: edge-programme-restaurant
    vars:
      business: "Taqueria Lola, burritos and tacos, 200 m from the stadium, open till 23:00 on match days."
      ad_size: "quarter page, colour, home matchday programme for the local football club"
    assert:
      - {type: llm-rubric, value: "Fits the matchday reader (before or after the game, distance from the ground, late opening), suggests an honest offer with a code since none was given, and stays within about 30-50 words."}
  - name: negative-no-contact
    vars:
      business: "We fix things"
      ad_size: small
    assert:
      - {type: llm-rubric, value: "Asks what the business fixes, the contact details and the actual ad size and publication before writing, and does not invent a phone number or services."}
