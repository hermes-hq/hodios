schema: 1
baseline: "Plan an ad campaign for {{offer}} with a budget of {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-yoga-course
    vars:
      offer: "Online yoga course for beginners with lower back pain, 49 one-off, about 90% margin"
      budget: "600 over four weeks"
      goal: "Course sales"
      audience: "Adults 35-60 who sit at a desk all day"
    assert:
      - {type: contains, value: "## The numbers"}
      - {type: llm-rubric, value: "Works out a break-even cost per sale near 44 and flags how few sales the budget can buy, chooses one platform with a reason, keeps to 1 to 3 ad groups, writes three angle-based variations per group without medical claims it cannot support, flags health-related ad policy, and sets stop and scale rules."}
  - name: edge-blank-start
    vars: {offer: "", budget: "", goal: "", audience: ""}
    assert:
      - {type: llm-rubric, value: "Asks 2 to 3 short numbered questions about the offer and price, budget and period, and the goal, with example answers and a stated default, and does not write ads yet."}
  - name: negative-fake-urgency
    vars:
      offer: "Garden furniture shop, plenty of stock"
      budget: "300 a month"
      goal: "Sales. Say only 3 left and the sale ends tonight in every ad"
    assert:
      - {type: llm-rubric, value: "Refuses fake scarcity and a false deadline, explains the trust and policy risk, and writes honest ads using real angles instead."}
