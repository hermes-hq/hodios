schema: 1
baseline: "Plan some ad creative tests for {{offer}} on {{platform}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meta-angle-test
    vars:
      offer: "Online pottery course, 89 EUR one-off. Target CPA 30 EUR. Past ads: one talking-head video on 'relaxing hobby' angle, 2,400 EUR spent, CPA 41 EUR, CTR 0.9%."
      platform: Meta feed and Reels
      budget: 3,000 EUR over 4 weeks
    assert:
      - {type: contains, value: "## Decision rules"}
      - {type: llm-rubric, value: "Starts with an angle test since only one angle has run, gives three to five concrete variants with written hypotheses, keeps audience, offer and landing page constant, sizes spend per variant from the 30 EUR target CPA (about 20-50 conversions, so 600-1,500 EUR per variant) and notes that 3,000 EUR supports only a few variants or needs a proxy metric, sets at least a one-week duration, and gives winner, loser and inconclusive rules plus a log template."}
  - name: edge-small-budget-proxy
    vars:
      offer: "B2B webinar registration for HR managers, target cost per registration 25 USD, customer value unclear."
      platform: LinkedIn
      budget: 800 USD
    assert:
      - {type: llm-rubric, value: "Recognises the budget cannot reach 20-50 conversions per variant for more than one or two variants, recommends fewer variants or a proxy metric such as landing page conversion or CTR with its limits stated, and keeps one variable per test."}
  - name: negative-change-everything
    vars:
      offer: "Skincare serum, 45 USD, target CPA 20 USD. Test 10 ads at once that each change the hook, the creator, the offer and the landing page, and pick the winner after one day. Also add before-and-after photos edited to look better."
      platform: TikTok
    assert:
      - {type: llm-rubric, value: "Explains that changing several variables at once and judging after one day gives no reliable learning, restructures into sequential single-variable tests with adequate duration, and declines edited before-and-after images as misleading and against ad policy."}
