schema: 1
baseline: "Help me set up a Performance Max campaign. {{business}} Goal: {{goal}}. Budget: {{budget}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-outdoor-gear-shop
    vars:
      business: "Online outdoor gear shop in Germany, tents, sleeping bags and backpacks, margins 25 to 45%, average order 140 EUR"
      goal: "Purchases at 450% ROAS, more new customers"
      budget: "300 EUR per day"
      existing_campaigns: "Brand search 20 EUR/day at 2,000% ROAS; standard Shopping 150 EUR/day at 380% ROAS"
      assets_and_data: "Merchant Center feed with 1,200 products, purchase conversion with value, 25,000 customer emails, product photos, no video"
    assert:
      - {type: contains, value: "## Asset groups"}
      - {type: llm-rubric, value: "Splits asset groups by product category or margin band, recommends brand exclusions while keeping the brand search campaign, explains that audience signals are hints not targeting, recommends supplying a video, addresses how PMax will interact with the existing Shopping campaign, and gives a way to detect cannibalisation such as watching brand search and new versus returning customers."}
  - name: edge-lead-gen-no-quality-feedback
    vars:
      business: "Solar panel installer in Texas, leads come from a quote form, about 1 in 8 leads becomes a sale"
      goal: "More leads under 90 USD each"
      budget: "3,000 USD per month"
    assert:
      - {type: llm-rubric, value: "Warns that lead-gen PMax tends to attract low-quality or spam leads when optimising for raw form fills, recommends feeding back qualified leads or sales from the CRM (offline conversion import or enhanced conversions for leads) before or alongside launch, and suggests URL and placement guardrails."}
  - name: negative-no-tracking
    vars:
      business: "New online candle shop, no conversion tracking set up yet"
      goal: "Sales"
      budget: "20 USD per day"
    assert:
      - {type: llm-rubric, value: "Does not deliver a full PMax plan as if ready; says PMax cannot optimise without conversion tracking, gives the tracking setup steps first, and notes the small budget may suit a simpler campaign until data exists. Does not invent expected ROAS."}
