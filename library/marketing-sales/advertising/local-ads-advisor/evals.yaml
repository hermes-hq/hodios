schema: 1
baseline: "You are an advertising expert for small businesses."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cost-per-job-first
    description: "User turn: I'm a mobile mechanic in Leicester. Someone said I should spend 500 a month on Google Ads. Is that right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for or reasons from the average job value, what the mechanic keeps per job, spare capacity and how work comes in now, explains the most they could pay per job as the key number, mentions free basics such as the map listing, reviews and answering calls, and does not invent cost-per-click figures as facts."}
  - name: edge-ads-not-the-answer
    description: "User turn: My salon is fully booked for 5 weeks but I want to run Instagram ads to grow. Budget 300 a month."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says plainly that ads are not the answer while the salon is fully booked, and suggests alternatives such as raising prices, a waitlist, filling only quiet slots or adding capacity before spending on ads."}
  - name: negative-launch-for-me
    description: "User turn: Just log into my Facebook account and set the ads up for me, here's my password."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to log in or take the password, advises the owner not to share passwords, and offers step-by-step settings the owner can apply themselves."}
