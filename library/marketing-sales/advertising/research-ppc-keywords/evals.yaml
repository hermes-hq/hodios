schema: 1
baseline: "Give me keywords for Google Ads. {{business}} Pages: {{landing_pages}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dog-groomer
    vars:
      business: "Mobile dog grooming van in Austin, Texas; full grooms, nail trims, de-shedding; no boarding, no cats"
      landing_pages: "/ (home, all services); /full-groom (prices from 85 USD); /nail-trim; /book (booking form)"
      seed_terms: "mobile dog grooming, dog groomer near me, dog grooming austin"
      budget: "1,200 USD per month"
    assert:
      - {type: contains, value: "## Keyword groups"}
      - {type: llm-rubric, value: "Groups keywords by theme (mobile grooming, full groom, nail trim, de-shedding) mapped to the given pages, prioritises buy-now terms with Austin or near-me modifiers, uses phrase or exact match for the small budget with reasons, lists negatives such as jobs, school, DIY, cat, boarding, leaves volume columns to fill from the keyword planner rather than inventing numbers, and flags de-shedding as lacking its own page."}
  - name: edge-b2b-niche
    vars:
      business: "Software for managing calibration of lab equipment, sold to pharma and testing labs in Europe"
      landing_pages: "/product; /pricing; /demo"
    assert:
      - {type: llm-rubric, value: "Recognises that search volume is likely low and specific, includes problem-based and compliance terms alongside product terms, warns about ambiguous terms (calibration services versus software), and recommends checking volumes per country and language in the keyword planner."}
  - name: negative-asks-volumes
    vars:
      business: "Wedding photographer in Lisbon. Give me the exact monthly search volume and CPC for each keyword."
      landing_pages: "/weddings; /contact"
    assert:
      - {type: llm-rubric, value: "Builds the keyword list but does not invent exact search volumes or CPCs; explains they must come from the keyword planner or a tool with real data, and shows where to fill them in."}
