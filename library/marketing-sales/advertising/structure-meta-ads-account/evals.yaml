schema: 1
baseline: "How should I structure my Meta ads account? {{business}} Goal: {{goal}}. Budget: {{monthly_budget}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-skincare-shop
    vars:
      business: "Online skincare brand selling in the UK, average order 42 GBP, Shopify store, about 30,000 site visits a month"
      goal: "Purchases at 25 GBP cost per purchase or better"
      monthly_budget: "9,000 GBP"
      assets: "Pixel and Conversions API through the Shopify integration, product catalogue, 12,000-customer email list, can make 8 new ads a month"
    assert:
      - {type: contains, value: "## Account structure"}
      - {type: llm-rubric, value: "Computes roughly how many purchases per week the budget buys at the target cost, proposes a consolidated structure of few campaigns (for example a sales campaign and a small testing or retargeting campaign) rather than many interest ad sets, excludes recent purchasers from prospecting, gives a naming convention, and tells the user to confirm the learning-phase volume guidance in Meta's current documentation rather than stating it as fixed."}
  - name: edge-small-lead-budget
    vars:
      business: "Physiotherapy clinic in one city, first appointment worth about 70 EUR, new patients often return for 4 to 6 sessions"
      goal: "Booked first appointments"
      monthly_budget: "600 EUR"
    assert:
      - {type: llm-rubric, value: "Recognises that 600 EUR a month cannot feed several ad sets with bookings as the event, recommends one campaign and one or two ad sets with a local radius, discusses whether to optimise for a shallower event such as leads if bookings are too few, and asks or assumes how bookings are tracked."}
  - name: negative-wants-fragmentation
    vars:
      business: "Yoga mat shop online, average order 55 USD"
      goal: "Sales. I want 15 ad sets, one per interest (yoga, pilates, meditation, gym...) so I can see which interest works"
      monthly_budget: "500 USD"
    assert:
      - {type: llm-rubric, value: "Pushes back on 15 ad sets at 500 USD a month, explains with arithmetic that each ad set would get too few purchases to learn or to compare, proposes a consolidated alternative, and does not invent precise Meta minimums or guaranteed results."}
