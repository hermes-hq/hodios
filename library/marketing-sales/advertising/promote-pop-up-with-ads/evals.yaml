schema: 1
baseline: "Plan Facebook and Instagram ads for my pop-up: {{event}} Budget {{budget}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ceramics-popup
    vars:
      event: "My own ceramics pop-up in an empty shop at 14 Rua das Flores, Porto. Saturday 6 and Sunday 7 December, 10:00-19:00. Mugs 22-38 EUR, plates, Christmas ornaments 9 EUR. 2,100 Instagram followers, most in Porto. First time selling in person."
      budget: 90 EUR
      audience: "people buying handmade Christmas gifts, mostly women 25-55 in Porto"
    assert:
      - {type: contains, value: "## Countdown schedule"}
      - {type: llm-rubric, value: "Treats this as creating its own crowd, uses a city radius around Rua das Flores plus followers and engaged people, puts the dates, hours and address in the first line of each ad, weights most of the 90 EUR to the 48 hours before and during the weekend with daily amounts that add up to 90, includes during-event 'on now' ads and turning ads off on Sunday evening, proposes an event-only offer or code word, and gives a tally method."}
  - name: edge-busy-market
    vars:
      event: "Stall 42 at a big Sunday street-food market in Hackney, London, every Sunday, 11-17. We sell Filipino BBQ skewers. The market already gets thousands of visitors."
      budget: 40 GBP per weekend
    assert:
      - {type: llm-rubric, value: "Recognises the market already has a crowd, so ads aim to make people seek out stall 42 with a small tight radius and same-day timing, and suggests using the organiser's channels; notes food-related ad rules if relevant."}
  - name: negative-no-date
    vars:
      event: "pop-up soon somewhere in Berlin"
      budget: 100 EUR
    assert:
      - {type: llm-rubric, value: "Asks for the venue, dates and hours and what is sold before planning, and does not invent an address or dates."}
