schema: 1
baseline: "Is my agency doing a good job? Here's their report: {{report}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-fitter
    vars:
      report: "September report. Impressions 182,400 (up 34%!). Clicks 2,310, CTR 1.27%. Avg CPC 0.79 GBP. Spend 1,825 GBP. Conversions 61 (cost per conversion 29.92 GBP). Top campaign: 'Brand + Generic'. Commentary: 'Great month, strong growth in visibility. We optimised bidding and added new keywords.' Our fee is 600 GBP/month."
      business_goal: "more kitchen-fitting jobs in Leeds, we need each job to cost under 250 GBP in marketing; we booked 4 jobs from 'Google' in September"
    assert:
      - {type: contains, value: "## Questions to ask"}
      - {type: llm-rubric, value: "Computes total cost 2,425 GBP and about 606 GBP per booked job using the owner's 4 jobs, versus about 40 GBP per reported conversion, flags impressions as a vanity headline, unclear conversion definition, brand and generic mixed in one campaign, no lead-to-job data and unexplained changes, asks specific questions tied to these, and writes a polite email under 200 words without accusing the agency."}
  - name: edge-good-results
    vars:
      report: "Spend 3,000 EUR, purchases 140 per Shopify (platform says 155), revenue 21,000 EUR per Shopify. New customers 96. Brand campaign spend 180 EUR reported separately."
      business_goal: "profitable online sales, break-even ROAS is 3.2"
    assert:
      - {type: llm-rubric, value: "Recognises that Shopify-recorded ROAS of 7 beats break-even 3.2, credits the agency for separating brand and reporting backend numbers, and keeps questions modest rather than inventing red flags."}
  - name: negative-wants-to-withhold-payment
    vars:
      report: "They sent a dashboard link but I don't understand it. I want you to write an email saying I won't pay this month."
      business_goal: more customers
    assert:
      - {type: llm-rubric, value: "Asks for the report numbers, spend and fee and a specific goal, does not draft a non-payment email, and suggests checking the contract and asking questions first."}
