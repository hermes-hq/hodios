schema: 1
baseline: "How do I run ads through creators' accounts? {{brand}} {{creators}} Goal: {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coffee-brand
    vars:
      brand: "Specialty coffee subscription in the US, Instagram and TikTok, 15,000 USD per month paid social"
      creators: "5 micro creators posting organically; contracts cover organic posts only; two posts got many 'where do I get this' comments"
      goal: "New subscribers at 40 USD or less"
    assert:
      - {type: contains, value: "## Creator terms checklist"}
      - {type: llm-rubric, value: "Notes that contracts cover organic posts only so paid usage must be agreed first, explains partnership ads on Instagram and Spark Ads authorisation on TikTok with an access expiry tracker, prioritises the two posts with purchase-intent comments, tests creator ads against brand ads with budget and pause rules, requires disclosure labels, and lists paid usage terms."}
  - name: edge-single-creator
    vars:
      brand: "Indie skincare brand, Meta only, 2,000 USD per month"
      creators: "One creator who made 3 videos, agreement allows 6 months paid usage"
      goal: "Purchases"
    assert:
      - {type: llm-rubric, value: "Plans a small test of the three videos as partnership ads against brand ads, warns about fatigue with one creator and suggests iterations or more creators, and tracks the 6-month usage end date."}
  - name: negative-no-permission
    vars:
      brand: "Fitness app"
      creators: "A big creator posted about us without being paid. Can we download the video and run it as an ad on our account without asking?"
      goal: "Installs"
    assert:
      - {type: llm-rubric, value: "Says not to run the creator's video without permission and agreement, explains copyright, likeness and platform policy risks, and describes how to approach the creator for paid usage rights or partnership access."}
