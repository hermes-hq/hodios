schema: 1
baseline: "Write a handoff document from sales to customer success for {{customer}} based on these notes: {{deal_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-informal-promise
    vars:
      customer: "Lindqvist Retail Group"
      deal_notes: |
        Signed 3-year contract, 96k EUR/year, starts 1 November. Buyer: Erik Lindqvist, COO (sponsor). Champion: Maja Holm, Head of Store Ops. IT lead Anders was sceptical about the POS integration.
        Why: store managers spend 6 hours a week on manual stock counts; Erik wants that halved by Q2.
        Rep told Maja on a call that the Shopify POS connector 'will be ready before go-live in January' (it's on the roadmap, no date). Rep also offered a 10% renewal discount verbally.
        Contract: annual payment upfront, 90-day notice before renewal.
    assert:
      - {type: contains, value: "## Promises and commitments"}
      - {type: llm-rubric, value: "Flags at the top the verbal connector promise and the verbal renewal discount as not in the contract, captures the 6-hours-to-half success criterion by Q2, maps Erik, Maja and Anders with the IT scepticism as a risk, records contract facts accurately, and produces a 30-day plan and kickoff agenda without inventing details."}
  - name: edge-thin-notes
    vars:
      customer: "Pine Street Dental"
      deal_notes: "Closed won. Practice management software, 12 seats. Office manager Karen signed."
    assert:
      - {type: llm-rubric, value: "Writes only what the notes support, marks success criteria and stakeholders as unknown, lists the specific information the rep must provide, and does not invent goals, dates or contacts."}
