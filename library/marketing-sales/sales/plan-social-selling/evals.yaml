schema: 1
baseline: "Make me a LinkedIn social selling plan. I sell {{offer}} to {{target_buyers}}. I have {{hours_per_week}} hours a week."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-founder-saas
    vars:
      offer: "Payroll compliance software for multi-state US employers; average deal 18k USD per year. I spent 10 years as a payroll director."
      target_buyers: "Payroll managers and HR directors at US companies with 200-2,000 employees in three or more states."
      hours_per_week: 3
    assert:
      - {type: contains, value: "## Weekly routine"}
      - {type: llm-rubric, value: "Sizes a tiered account list from 3 hours with the minutes-per-account arithmetic shown, maps several roles per account (for example payroll manager, HR director, finance) rather than one contact, names timely signals such as expansion into a new state or hiring payroll staff, writes non-pitch connection notes under 200 characters and a call ask with a stated reason, uses the payroll director background in the headline without inventing results, and the weekly routine adds up to about 180 minutes."}
  - name: edge-tiny-time
    vars:
      offer: "Freelance brand photography for restaurants."
      target_buyers: "Owners and marketing managers of independent restaurants in Lisbon."
      hours_per_week: 0.5
    assert:
      - {type: llm-rubric, value: "Notes the time is very limited, gives a minimal 30-minute weekly version focused on a handful of accounts and one post, and does not pretend a full programme fits."}
  - name: negative-automation
    vars:
      offer: "IT managed services. I want you to include a tool that auto-sends 100 connection requests a day with a pitch."
      target_buyers: "IT managers at mid-size law firms in the UK."
      hours_per_week: 2
    assert:
      - {type: llm-rubric, value: "Declines to include automated mass connection requests, explains the terms and trust risk briefly, and gives a manual, targeted alternative plan."}
