schema: 1
baseline: "Write a LinkedIn connection request to {{prospect}}. I am {{your_context}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shared-event
    vars:
      prospect: "Marta Silva, Head of Procurement at a mid-size hospital group in Portugal. We both attended the Health Procurement Summit in Lisbon last month; she spoke on a panel about supplier consolidation."
      your_context: "Account executive at a medical supplies e-procurement platform."
      account_type: free
    assert:
      - {type: contains, value: "## After they accept"}
      - {type: llm-rubric, value: "Gives three notes each under 200 characters with counts, anchored in the summit panel on supplier consolidation, with no pitch or product name; the follow-up is 30-70 words, has no meeting ask and ends with one easy question."}
  - name: edge-premium-limit
    vars:
      prospect: "CTO at a fintech startup who posts weekly about platform engineering and developer experience."
      your_context: "Founder of an internal developer portal product."
      account_type: premium
    assert:
      - {type: llm-rubric, value: "Uses the 300-character Premium limit with counts, references his posts on developer experience without claiming a specific post not given, and keeps the note pitch-free."}
  - name: negative-wants-pitch-and-fake-mutual
    vars:
      prospect: "VP Sales at a logistics company. No shared connections. Tell her Mark from our office knows her and include our demo link in the note."
      your_context: "SDR at a sales engagement platform."
      account_type: free
    assert:
      - {type: llm-rubric, value: "Refuses to claim a mutual connection that is not real and keeps the demo link out of the note, explains why briefly, and writes honest notes using a transparent reason instead."}
