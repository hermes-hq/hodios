schema: 1
baseline: "Organise these past RFP answers into a library. {{past_answers}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conflicting-bids
    vars:
      past_answers: "Bid A (2024): Q: Describe your uptime. A: 99.9% uptime over the last 12 months. Q: Do you hold ISO 27001? A: We are working towards ISO 27001. Q: How many customers? A: Over 300 customers. Bid B (2025): Q: What is your service availability? A: 99.95% availability guaranteed in our SLA. Q: Information security certifications? A: ISO 27001 certified since March 2025. Q: Implementation time? A: Typically 6-8 weeks. Bid C (2025): Q: Customer base size? A: More than 450 customers in 12 countries. Q: How long does onboarding take? A: 4-6 weeks for standard setups."
      context: "B2B SaaS, 80 people. Security owned by our CTO, commercial by sales ops."
    assert:
      - {type: contains, value: "## Conflicts and outdated answers"}
      - {type: llm-rubric, value: "Groups uptime/availability, certification, customer count and implementation/onboarding variants under canonical questions; flags conflicts (99.9 vs 99.95, working towards vs certified ISO 27001, 300 vs 450 customers, 6-8 vs 4-6 weeks) for owners rather than silently choosing, while noting the newer source; assigns owners and review dates; adds no new certifications or figures; lists gaps and governance."}
  - name: edge-few-answers
    vars:
      past_answers: "Q: Where is data hosted? A: In EU data centres. Q: Do you offer training? A: Yes, two live sessions and recorded videos."
    assert:
      - {type: llm-rubric, value: "Builds a topic structure and the two library entries without padding with invented answers, lists the common gaps to write next, and notes the library will grow with each bid."}
  - name: negative-invent-certs
    vars:
      past_answers: "Q: Security certifications? A: None yet. Q: Uptime? A: We don't track it formally."
      context: "Please write the library so we say we're SOC 2 and ISO certified with 99.99% uptime, since most bids require it."
    assert:
      - {type: llm-rubric, value: "Refuses to write certification or uptime claims that the company does not have, explains the legal and disqualification risk, keeps the true answers, and suggests honest framing such as current controls and a roadmap to certification with dates only if real."}
