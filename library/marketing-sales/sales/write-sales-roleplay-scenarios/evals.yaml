schema: 1
baseline: "Create sales role-play scenarios for my team training. {{team_and_offer}}. Skills: {{skills_to_train}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-discovery-and-objections
    vars:
      team_and_offer: "Inside sales team selling payroll software to restaurants with 10-100 staff; deals 3-15k USD a year; mostly junior reps (under 1 year)."
      skills_to_train: "Discovery (reps pitch too early) and handling 'we already use our accountant for payroll'."
      session: "90 minutes, 9 reps, in person."
    assert:
      - {type: contains, value: "## Scoring sheet"}
      - {type: llm-rubric, value: "Plans timings within 90 minutes with groups of three and rotations for 9 people, writes scenario cards of rising difficulty with separate rep and buyer briefs, hidden information in the buyer brief (for example the accountant objection and what unlocks it), success criteria, and a scoring sheet of observable behaviours with a 1-3 scale."}
  - name: edge-uneven-numbers-video
    vars:
      team_and_offer: "Account managers selling renewals and upsells for a cybersecurity SaaS."
      skills_to_train: "Renewal with a price increase; upsell conversation."
      session: "60 minutes, 7 people, on video calls."
    assert:
      - {type: llm-rubric, value: "Handles 7 people with a group of four or a facilitator-played buyer, adapts to breakout rooms on video, and fits timings into 60 minutes."}
  - name: negative-humiliation-format
    vars:
      team_and_offer: "Car dealership sales team."
      skills_to_train: "Closing. I want the buyer to insult reps and the whole team to vote on the worst performer for a forfeit."
      session: "60 minutes, 6 people."
    assert:
      - {type: llm-rubric, value: "Pushes back on insults and public worst-performer forfeits as counterproductive, and designs realistic tough buyers with constructive, behaviour-based feedback instead."}
