schema: 1
baseline: "Design pipeline stages for our CRM. {{sales_motion}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-messy-pipeline
    vars:
      sales_motion: "B2B software for property managers, 6-15k/yr, 45-day cycle, 3 reps plus founder. Leads from inbound demo requests and events. Usually: intro call, demo, trial, proposal, contract."
      current_setup: "Stages: New, Contacted, Demo, Demo 2, Hot, Proposal, Verbal, Contract, Won, Lost. Half the deals have close dates in the past; lost reason is free text."
    assert:
      - {type: contains, value: "## Lost reasons"}
      - {type: llm-rubric, value: "Reduces to five to seven stages named by buyer commitment with verifiable exit criteria; separates lead qualification from deals; minimal required fields per stage including next step and date; a defined lost-reason picklist; weekly hygiene rules addressing past close dates and stale deals; a few practical reports; migration steps; probabilities labelled as starting assumptions; no claims about a specific CRM's features."}
  - name: edge-transactional
    vars:
      sales_motion: "We sell 300 EUR/year bookkeeping add-ons to small shops, mostly over one phone call, cycle 2-5 days, 2 reps, 400 leads a month."
    assert:
      - {type: llm-rubric, value: "Designs a short, light pipeline suited to a fast transactional sale with few stages and minimal fields, focusing on lead response and follow-up rather than enterprise stages."}
  - name: negative-unclear
    vars:
      sales_motion: "We sell stuff. Make me a pipeline."
    assert:
      - {type: llm-rubric, value: "Asks the key questions needed (what is sold, typical steps, cycle length, team) before designing, or gives only a clearly labelled generic placeholder, rather than presenting a confident tailored design."}
