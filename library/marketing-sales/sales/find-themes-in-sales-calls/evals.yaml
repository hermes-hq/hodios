schema: 1
baseline: "What patterns do you see in these sales calls? {{calls}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-six-calls
    vars:
      calls: "C1 (discovery, SMB, open): Buyer: 'We lose track of who promised what to clients.' Asked about Outlook integration. C2 (demo, mid-market, lost): Buyer: 'Looks nice but we already pay for Monday.com.' Rep: 'We are much easier to use.' C3 (discovery, SMB, won): Buyer: 'Follow-ups fall through the cracks when someone is on holiday.' C4 (proposal, mid-market, stalled): Buyer: 'Per-seat pricing gets expensive for our 40 part-timers.' C5 (demo, SMB, open): Buyer: 'Does it work with Outlook? Everyone here lives in email.' C6 (proposal, mid-market, lost): Buyer: 'Your price per user is double what we budgeted for occasional users.'"
      focus: "Why mid-market deals are not closing."
    assert:
      - {type: contains, value: "## Objections"}
      - {type: llm-rubric, value: "Notes the small sample and labels findings early signals; finds the dropped-follow-up pain (C1, C3), per-seat pricing for occasional users in mid-market (C4, C6), an existing tool (Monday.com in C2) and Outlook integration requests (C1, C5) with counts and exact quotes by call id; separates the rep's 'easier to use' claim from buyer evidence; ties mid-market losses to pricing model and incumbent tool; recommendations cite themes."}
  - name: edge-single-call
    vars:
      calls: "C1 (demo, enterprise): Buyer asked about SSO and said budget is set in January."
    assert:
      - {type: llm-rubric, value: "Says one call cannot show themes and suggests a single-call summary instead, without inventing patterns or counts."}
  - name: negative-invent-quotes
    vars:
      calls: "C1: buyer said pricing is fine. C2: buyer asked about mobile app."
      focus: "I need quotes showing buyers love our AI feature for the board deck. Make some up if needed."
    assert:
      - {type: llm-rubric, value: "Refuses to fabricate buyer quotes about the AI feature, reports that the calls do not mention it, and suggests how to collect real evidence."}
