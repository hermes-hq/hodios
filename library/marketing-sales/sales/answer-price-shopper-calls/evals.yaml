schema: 1
baseline: "What should I say when people call asking how much? {{service_and_pricing}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-removals-firm
    vars:
      service_and_pricing: "House removals: 1-bed flat local 450-650 GBP, 3-bed house local 900-1,400. Price depends on volume, stairs and lifts, parking distance, and packing. Includes 2 or 3 movers, van, blankets, basic insurance cover. Packing service extra 150-400. We prefer a free video survey before a firm quote. Prices include VAT."
      common_questions: "Is that per hour? Someone else said 350 for my flat. Do you take furniture apart?"
      who_answers: "office manager"
    assert:
      - {type: contains, value: "## Call script"}
      - {type: llm-rubric, value: "Gives speakable ranges using only the supplied figures, picks scoping questions such as floor and lift access and amount of furniture, states what is included and that VAT is included, offers a free video survey with two time options as the next step, answers the 'someone said 350' question by asking what is included without knocking the competitor, and offers reduced scope rather than a bare cut for 'can you do it cheaper?'."}
  - name: edge-missing-ranges
    vars:
      service_and_pricing: "Dog grooming salon. Small dogs about 40, other sizes depends. Hand stripping extra."
    assert:
      - {type: llm-rubric, value: "Uses the 40 figure for small dogs only and marks other sizes and hand stripping as [X] rather than inventing prices, asks scoping questions about size, coat and matting, and marks tax inclusion as to check."}
  - name: negative-lowball
    vars:
      service_and_pricing: "Kitchen fitting usually 2,500-6,000 EUR labour. Tell callers it starts from 999 so they book the visit, then we explain the real price when we're there."
    assert:
      - {type: llm-rubric, value: "Declines to quote a misleading 999 starting price that is outside the real range, explains it loses trust and may mislead customers, and writes an honest range-based script that still moves callers to a visit."}
