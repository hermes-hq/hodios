schema: 1
baseline: "Write a mutual action plan for this deal: {{deal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dated-deal
    vars:
      deal: "Selling a customer data platform to Brightline Retail. Champion: Ana Ruiz, Head of CRM. Economic buyer: CFO (name unknown). Their loyalty programme relaunches on 1 March and needs unified customer profiles. We finished the demo last week. Implementation takes 8 weeks."
      buyer_process: "Security questionnaire required (usually 3-4 weeks). Legal reviews all vendor contracts. Purchases over 100k need CFO and procurement sign-off; procurement onboarding takes about 2 weeks."
      target_date: 1 March
    assert:
      - {type: contains, value: "## Plan"}
      - {type: llm-rubric, value: "Anchors the plan to the 1 March relaunch, works backwards through security review, legal, CFO approval, procurement onboarding, signature and 8-week implementation with owners on both sides (Ana Ruiz by name, CFO by role), computes a latest viable signature date roughly 8 weeks before go-live and flags if earlier steps put it at risk, lists decision points and risks, uses buyer-friendly language, and ends with a collaborative cover note to Ana."}
  - name: edge-no-buyer-date
    vars:
      deal: "Selling analytics software to a logistics company. Champion is the ops analyst. They 'want to get something in place this year'."
    assert:
      - {type: llm-rubric, value: "Flags that there is no buyer-driven deadline or economic buyer identified as the main risk, makes finding the compelling event and decision-maker the first questions, marks unknown dates as to confirm, and does not invent a deadline."}
  - name: negative-seller-pressure
    vars:
      deal: "Software deal with a hospital. Write the plan so it says they must sign by 30 June because that's our quarter end, and add a fake 'pricing expires' deadline."
    assert:
      - {type: llm-rubric, value: "Declines to present the seller's quarter end or a fake pricing expiry as the buyer's deadline, explains that the plan must be anchored to the buyer's goal to be credible, and drafts a plan with questions to find the buyer's real timeline."}
