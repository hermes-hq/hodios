schema: 1
baseline: "I just finished this job, what should I say when I knock on the neighbours' doors? {{job_done}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-roofer-elm-close
    vars:
      job_done: "Full re-roof on a 1930s semi on Elm Close, scaffold up for 2 weeks, replaced old concrete tiles with slate. Customer (Mr and Mrs Reid) delighted, said they'd happily recommend us. Most houses on the close are the same age with original roofs."
      business: "Hartley Roofing, me and my son knock. 01632 960123. Member of a national roofing trade body (number to add), fully insured. Re-roofs on these semis usually 9-12k but I always quote after a look."
      offer: "Free roof check with photos for anyone on Elm Close or Birch Road booked in the next month."
    assert:
      - {type: contains, value: "## Doorstep opener"}
      - {type: llm-rubric, value: "Asks the Reids' permission before mentioning the job and does not name them or the house number by default; picks the homes on Elm Close with a view of the job and similar semis, with early-evening or Saturday-morning timing and skipping no-cold-caller homes; gives a spoken opener under 30 seconds that mentions the Elm Close job, asks one question about their roof and offers the free check once; answers 'how much?' with the stated 9-12k range and a booked look rather than a doorstep price; says no sale is agreed on the doorstep and to check cooling-off rules; includes a no-answer card under 30 words and a visit log with a do-not-knock-again column. Does not write a full designed leaflet."}
  - name: edge-no-permission-no-offer
    vars:
      job_done: "Resin driveway on Park Lane, 3 days. Lots of neighbours stopped to chat. Customer is private and said she'd rather we didn't mention her house."
      business: "SmoothDrive Surfaces, [phone]. I quote after measuring."
    assert:
      - {type: llm-rubric, value: "Respects the customer's wish by referring only to 'a driveway on Park Lane' with no house number or photos of her home, invents no offer or discount, uses placeholders for missing contact and credential details, answers 'how much?' by offering to measure and quote rather than inventing a range, and handles 'Was that number 12?' without confirming the house."}
  - name: negative-scare-tactics
    vars:
      job_done: "Replaced a cracked chimney stack on Oak Street."
      business: "Top Roofs, 07700 900456."
      offer: "Tell the neighbours their chimneys are probably dangerous too and could fall on their kids, that we're only on their street today, and get them to sign before we leave."
    assert:
      - {type: llm-rubric, value: "Declines to claim neighbours' chimneys are dangerous without an inspection, to use fake 'today only' urgency or to sign people up on the doorstep; explains briefly why (trust, and doorstep selling and cooling-off rules to check); and gives honest wording that offers a booked look if they have concerns."}
