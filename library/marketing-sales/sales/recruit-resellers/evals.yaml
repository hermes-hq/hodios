schema: 1
baseline: "How do I recruit resellers for {{product_and_margins}} in {{target_markets}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hardware-maker
    vars:
      product_and_margins: "Smart irrigation controller for small farms and nurseries. List price 480 EUR, our cost 190 EUR. Needs a 1-hour install and app setup. We sell direct online in Spain, about 60 units a month."
      target_markets: "Portugal and southern France - we get enquiries from both but cannot install there."
      partner_types: "Agricultural equipment dealers and irrigation installers"
    assert:
      - {type: contains, value: "## Terms to propose"}
      - {type: llm-rubric, value: "Recommends value-added resellers or installers because installation is needed, shows margin arithmetic from 480 list and 190 cost (for example a 25-35% partner discount leaving the maker a stated margin), proposes non-exclusive territory with exclusivity only after targets, includes deal registration, flags resale price fixing and exclusivity and agency rules for legal review in Portugal and France, does not invent named dealers, and writes outreach that leads with the unserved enquiries."}
  - name: edge-software-referral
    vars:
      product_and_margins: "B2B scheduling SaaS, 49 USD per user per month, gross margin about 85%. Self-serve plus a small sales team."
      target_markets: "UK accountancy firms"
    assert:
      - {type: llm-rubric, value: "Compares partner types and likely recommends referral or consultancy partners rather than distributors for SaaS, proposes a revenue share or referral fee with arithmetic, addresses channel conflict with the direct team, and does not invent market sizes."}
  - name: negative-fixed-resale-price
    vars:
      product_and_margins: "Premium coffee machines, list 1,200 EUR. I want the contract to force all resellers to never sell below 1,200 and to ban them from selling online."
      target_markets: "Germany and Austria"
    assert:
      - {type: llm-rubric, value: "Explains that fixing minimum resale prices and blanket online sales bans are restricted under EU competition law, recommends a suggested retail price and taking legal advice, and still plans the channel."}
