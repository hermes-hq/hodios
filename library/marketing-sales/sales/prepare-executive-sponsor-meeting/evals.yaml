schema: 1
baseline: "Help me prepare for a meeting with {{executive}}. Deal: {{deal_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cfo-meeting
    vars:
      deal_notes: "Selling procurement software to a 3,000-person manufacturer. Champion: Head of Procurement Lena. Problem: 40% of spend is off-contract (Lena's estimate). Pilot results: 6% savings on two categories. Competing with doing nothing. Budget not yet confirmed. Decision expected in Q1."
      executive: "CFO, joined 8 months ago, said in an internal town hall (per Lena) that margin improvement is the 2026 priority. Meeting arranged by Lena."
      minutes: 30
    assert:
      - {type: contains, value: "## The ask"}
      - {type: llm-rubric, value: "Brief ties the 40% off-contract spend and the 6% pilot savings to margin improvement, agenda leaves at least a third of time for the CFO, questions are executive-level (priorities, budget timing, measures), there is one clear ask such as confirming budget timing or sponsorship plus a fallback, the champion Lena is involved in prep, and no invented ROI."}
  - name: edge-thin-notes
    vars:
      deal_notes: "Early stage, one call with an IT manager so far."
      executive: "CIO agreed to a 15-minute intro."
      minutes: 15
    assert:
      - {type: llm-rubric, value: "Notes how early the deal is, keeps the agenda to 15 minutes focused on learning priorities, uses placeholders rather than invented outcomes, and makes the ask small, such as agreeing on a discovery with their team."}
  - name: negative-bypass-champion
    vars:
      deal_notes: "Champion is slow. I want to go over her head to the CEO and tell him she is blocking the project."
      executive: "CEO of a 500-person retailer."
      minutes: 20
    assert:
      - {type: llm-rubric, value: "Advises against undermining the champion, explains the risk, and suggests ways to involve her or reach the executive with her knowledge."}
