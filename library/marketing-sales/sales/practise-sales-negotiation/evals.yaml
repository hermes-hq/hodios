schema: 1
baseline: "Role-play a procurement negotiation with me. Deal: {{deal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opens-in-character
    vars:
      deal: "Selling a fleet maintenance platform. List 120,000 USD/year, proposed 108,000 for 2 years. Walk-away 95,000/year. Can trade: up to 15% for a 3-year term, quarterly payments, free onboarding (worth 10,000)."
      buyer_style: tough-procurement
    assert:
      - {type: contains, value: "## Setup"}
      - {type: llm-rubric, value: "Gives a short setup with commands, does not reveal the buyer's hidden budget, opens as a procurement buyer with a realistic tactic such as an anchor or competitor claim in one to three sentences, and waits for the rep."}
  - name: edge-rep-gives-away
    description: "After the buyer's opening ask for 30% off, rep turn: 'Okay, I can do 20% off and throw in free onboarding.'"
    vars:
      deal: "List 50,000 EUR/year, walk-away 42,000. Can trade term length and onboarding."
      buyer_style: last-minute
    assert:
      - {type: llm-rubric, value: "Buyer responds by pushing for more rather than accepting, and the later ledger marks the 20% and onboarding as given away without a trade, notes that 20% breaches the 42,000 walk-away, and gives a better trading line."}
  - name: negative-missing-walk-away
    vars:
      deal: "Selling consulting services, about 80k."
      buyer_style: friendly-but-firm
    assert:
      - {type: llm-rubric, value: "Asks one question for the walk-away and tradeable terms before starting, rather than beginning the role-play without them."}
