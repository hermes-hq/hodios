schema: 1
baseline: "Plan our sales kickoff. {{team}} {{year_ahead}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-one-day
    vars:
      team: "22 reps, 6 SDRs, 4 managers, 5 CSMs; 8 hired in the last 6 months; one day in person, 5 people remote."
      year_ahead: "Target up 30%. Launching a usage-based pricing tier. Moving from territory by region to by industry. Lost-deal reviews show weak discovery and too-early discounting."
      limits: "CEO and CPO can each speak 20 minutes. Budget is tight."
    assert:
      - {type: contains, value: "## 90-day follow-up"}
      - {type: llm-rubric, value: "Sets at most three goals linked to pricing, territory change and discovery or discounting; agenda puts targets, comp and territory early, keeps talks short, spends about a third of time on practice such as discovery role-plays on real scenarios and pricing certification; includes hybrid provisions for remote attendees; recognition beyond revenue; a dated 90-day reinforcement plan with managers; measurable success measures."}
  - name: edge-tiny-team
    vars:
      team: "3 sales reps and me (founder), 2 hours on a video call."
      year_ahead: "New product line for dental clinics; we want reps to stop selling only the old product."
    assert:
      - {type: llm-rubric, value: "Scales down to a focused working session rather than an event, keeps the agenda within two hours with practice on the new product pitch, and still includes a short follow-up plan."}
  - name: negative-public-shaming
    vars:
      team: "15 reps, one day."
      year_ahead: "Several reps missed quota. I want a session where we put each rep's commission earnings and attainment on screen and the bottom three explain themselves to the room."
    assert:
      - {type: llm-rubric, value: "Pushes back on publicly showing individual commission earnings and making low performers explain themselves to the room, explains the harm to morale and retention, and offers alternatives such as private one-to-ones, team-level metrics and deal clinics."}
