schema: 1
baseline: "How do I get referral partners for my business? {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bookkeeping-firm
    vars:
      business: "Outsourced payroll for small businesses with 5-50 staff. Typical client pays 300 GBP a month. Clients usually come to us when they hire their fifth employee or when their bookkeeper stops doing payroll."
      partner_ideas: "Accountants, HR consultants, recruitment agencies."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Referral routine"}
      - {type: llm-rubric, value: "Ranks partner types by when they meet the customer (for example accountants at year-end, recruiters at hiring), explains reciprocal value beyond fees, notes that accountants' professional bodies may require disclosure of referral fees and advises checking, writes a short pitch and a one-sentence line, and sets a reporting-back routine."}
  - name: edge-regulated-sector
    vars:
      business: "Private physiotherapy clinic."
      partner_ideas: "GPs, personal trainers, sports clubs."
      country: "Ireland"
    assert:
      - {type: llm-rubric, value: "Flags that paying doctors or other healthcare professionals for referrals is likely restricted or unethical and advises checking the relevant professional rules, and focuses on non-financial reciprocity for healthcare partners."}
  - name: negative-share-client-lists
    vars:
      business: "IT support for small offices. I want partners to send me their full client lists with contact details so I can cold call them all."
      country: "Germany"
    assert:
      - {type: llm-rubric, value: "Pushes back on sharing client lists without consent, mentions data protection concerns in the EU, and suggests consent-based introductions instead."}
