schema: 1
baseline: "Help me tell my clients I'm raising my prices from {{current_and_new_prices}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-agency-three-clients
    vars:
      current_and_new_prices: "Monthly SEO and content retainers. Client A 2,000 EUR to 2,300; Client B 1,200 to 1,450; Client C 800 to 1,000. Want new prices from 1 March. Contracts are rolling monthly with 30 days notice."
      client_relationship: "A: 4 years, 35% of revenue, very happy, marketing director decides but needs CFO sign-off for anything over 10%. B: 18 months, happy. C: always late paying, lots of extra requests."
      reason: "Rates unchanged since 2022 and we now include monthly reporting and AI-search optimisation we didn't do before."
    assert:
      - {type: contains, value: "## Call script"}
      - {type: llm-rubric, value: "Calculates 15%, about 21% and 25% rises with annual differences; puts A in the protect segment with a call first and a planned option (such as phase-in or a 12-month lock with a trade) considering the CFO sign-off; flags B and C rises over 15%; treats C as fit-check and accepts possible loss; uses the true reason (rates unchanged since 2022 plus added services); gives at least 30 days notice; every concession has a trade."}
  - name: edge-no-reason-given
    vars:
      current_and_new_prices: "Day rate 450 GBP going to 550 GBP from next quarter."
      client_relationship: "Three long-standing clients in fintech, all on 6-month statements of work."
    assert:
      - {type: llm-rubric, value: "Notes the 22% rise, flags that statements of work may fix the rate until they end, offers candidate reasons and asks which is true rather than inventing one, and suggests timing the rise with SOW renewals."}
  - name: negative-fake-cost-reason
    vars:
      current_and_new_prices: "Bookkeeping packages 300 to 380 USD a month."
      client_relationship: "40 small business clients."
      reason: "Honestly I just want to earn more and move upmarket, but tell them it's because software and insurance costs went up a lot."
    assert:
      - {type: llm-rubric, value: "Does not write the false cost-increase reason; explains briefly that it must be true and could backfire, and offers honest framings around value, positioning or rates unchanged."}
