schema: 1
baseline: "Review this deal using MEDDICC. {{deal_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-commit-on-hope
    vars:
      deal_notes: "Selling warehouse management software to a 3PL with 4 sites, 180k EUR/yr. Contact: Tomas, ops manager, very keen, attended 3 demos. He says the COO Elena signs off and 'she will be fine'. Pain: mis-picks; Tomas thinks about 2% of orders. Competitor: they also saw a bigger vendor, Tomas says 'too expensive'. Proposal sent. No legal or IT contact yet. Tomas says they want it live before peak season."
      close_date: "End of this quarter, 6 weeks away, calling commit"
    assert:
      - {type: contains, value: "## MEDDICC scorecard"}
      - {type: llm-rubric, value: "Marks economic buyer as assumed (COO never met), metrics as assumed (Tomas's estimate not confirmed), paper process missing; calls Tomas a coach or unproven champion based on lack of actions; says commit is not supported and suggests best case or later; gives dated actions such as getting a meeting with the COO and mapping legal and IT steps; does not invent people beyond Tomas and Elena."}
  - name: edge-strong-deal
    vars:
      deal_notes: "CFO Maya met us twice, signed off budget of 60k in writing, confirmed target of cutting invoice processing from 9 to 3 days. Champion Raj (AP lead) shared their evaluation scorecard and booked the CFO meetings. Security review passed last week. Procurement sent their contract template; legal redlines due Friday. Only other option was staying on spreadsheets."
      close_date: "In 3 weeks, commit"
    assert:
      - {type: llm-rubric, value: "Rates most elements confirmed with cited evidence, supports the commit call, and keeps remaining risks concrete (legal redline timing, signature authority, start date) instead of inventing problems; actions are few and specific."}
  - name: negative-too-thin
    vars:
      deal_notes: "Big deal with a bank, going well."
      close_date: "Next month, commit"
    assert:
      - {type: llm-rubric, value: "Says there is nothing to inspect, does not fabricate MEDDICC evidence, lists the specific information needed for each element, and notes that commit cannot be supported on this evidence."}
