schema: 1
baseline: "Help me prepare a discovery call with {{prospect}}. We sell {{product}}. Use {{framework}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spin-inbound
    vars:
      framework: spin
      prospect: "Inbound demo request from Lena Fischer, Operations Manager at Nordhaus Kitchens (custom kitchen manufacturer, ~150 staff, Germany). Form note: 'Our quotes take too long and sales keep using old price lists.' They use Excel and an old ERP."
      product: "CPQ (configure, price, quote) software for manufacturers of configurable products. Typical deal 20-40k EUR per year, 2-4 month cycle. Qualified means: quoting pain with measurable cost, an executive sponsor, and a decision this year."
    assert:
      - {type: contains, value: "## Questions"}
      - {type: llm-rubric, value: "Separates facts from labelled inferences, writes pain hypotheses about slow quotes and outdated price lists, orders questions by SPIN with few situation questions and strong implication questions (for example cost of wrong prices, lost deals from slow quotes), includes an up-front agenda statement, disqualifiers, and two specific next-step options."}
  - name: edge-meddicc-enterprise
    vars:
      framework: meddicc
      prospect: "Referral to the Director of IT Security at a regional bank (2,000 employees). Only the referrer's note: 'They failed part of an audit on access reviews.'"
      product: "Identity governance software automating user access reviews. Deals 100-250k USD, 6-9 month cycles, procurement and security review required."
    assert:
      - {type: llm-rubric, value: "Organises questions under MEDDICC elements (metrics, economic buyer, decision criteria, decision process, pain, champion, competition), treats the audit failure as a hypothesis to confirm, and asks about the procurement and security review process."}
  - name: negative-no-prospect-info
    vars:
      framework: bant
      prospect: "A call tomorrow with someone."
      product: "Marketing analytics software."
    assert:
      - {type: llm-rubric, value: "Flags that there is almost no prospect information, does not invent company facts, lists the research to do or asks who the person and company are, and still offers a generic question flow only if clearly labelled as such."}
