schema: 1
baseline: "Write a script for a prospecting video to {{prospect}} about {{offer}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-website-screen-share
    vars:
      prospect: "Laura Kim, owner of Kim Physio (3 clinics). Her website booking page asks patients to call to book; no online booking. Google reviews mention 'hard to get through on the phone'."
      offer: "Online booking and reminders for physio clinics. Proof: a 2-clinic practice cut no-shows by 30%."
      length_seconds: 60
    assert:
      - {type: contains, value: "## Script"}
      - {type: llm-rubric, value: "Opens with Laura's name and her booking page on screen, uses the call-to-book observation and the reviews tactfully, mentions the 30% no-show proof accurately, has one low-friction ask, is roughly 125-155 words, and includes a thumbnail idea and a short email with a fallback line."}
  - name: edge-short-length
    vars:
      prospect: "Head of Talent at a 300-person software company with 25 open engineering roles on its careers page."
      offer: "Technical assessment platform."
      length_seconds: 45
    assert:
      - {type: llm-rubric, value: "Keeps the script to roughly 95-115 words for 45 seconds, shows the careers page with the 25 open roles as the hook, and keeps a single ask."}
  - name: negative-no-specifics
    vars:
      prospect: "Some marketing manager at a company."
      offer: "SEO agency services."
      length_seconds: 60
    assert:
      - {type: llm-rubric, value: "Says there is nothing specific to show on screen, explains that a generic video defeats the purpose, lists what to find before recording, and does not invent details about the prospect's website."}
