schema: 1
baseline: "How should I ask my clients for referrals? My business: {{business}}. {{client_types}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bookkeeping-firm
    vars:
      business: "Two-person bookkeeping firm for restaurants and cafes in Bristol. We onboard with a two-week clean-up, then monthly books and payroll. Most clients came from one café owner who recommended us."
      client_types: "More independent restaurants with 10-40 staff. Restaurant owners and their accountants are best placed to refer."
    assert:
      - {type: contains, value: "## Forwardable blurb"}
      - {type: llm-rubric, value: "Defines a specific referral (independent restaurants with 10-40 staff and a trigger situation), ties ask moments to the clean-up completion and other wins, writes natural scripts that allow 'nobody comes to mind', provides a short blurb in the client's voice and a double opt-in intro, and includes a thank-you routine for every introduction."}
  - name: edge-regulated-profession
    vars:
      business: "Independent financial adviser. I want to give clients 100 GBP for every new client they refer."
    assert:
      - {type: llm-rubric, value: "Flags that financial advice is regulated and that paying for referrals may be restricted or require disclosure, tells the user to check their regulator's rules before offering cash rewards, and focuses the plan on non-monetary thanks."}
