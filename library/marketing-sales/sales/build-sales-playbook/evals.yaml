schema: 1
baseline: "Create a sales playbook for {{company}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-win-loss
    vars:
      company: "Contract management software for mid-size legal teams (in-house, 3-20 lawyers). 25-90k USD per year. Competitors: Ironclad (enterprise), spreadsheets and shared drives. We win on fast setup (live in 2 weeks) and Word integration."
      sales_motion: "Inbound plus founder-led outbound, cycle 60-90 days, hiring first 2 AEs, HubSpot."
      win_loss_notes: "Won 9 of last 20. Wins: GC was champion, had a painful audit. Losses: 5 to 'no decision' after procurement got involved late, 4 to Ironclad when IT required SSO plus a security review we weren't ready for, 2 on price."
    assert:
      - {type: contains, value: "## Sales stages"}
      - {type: llm-rubric, value: "Grounds 'How we win' in the notes (GC champion, audit trigger), defines stages with buyer-action exit criteria, addresses the no-decision losses by bringing procurement and security review earlier, includes a qualification framework suited to a 60-90 day cycle, an objection library drawn from the notes, factual competitor cards for Ironclad and spreadsheets without disparagement, templates and a 30-60-90 ramp; does not invent win rates beyond the supplied 9 of 20."}
  - name: edge-no-win-loss-data
    vars:
      company: "Online scheduling tool for physiotherapy clinics, 79 EUR per month per clinic, self-serve trial with sales assist."
    assert:
      - {type: llm-rubric, value: "Keeps the playbook light and suited to a transactional, sales-assisted motion, marks 'how we win', objections and competitor points as hypotheses to validate, and lists the evidence to gather in Gaps."}
  - name: negative-missing-basics
    vars:
      company: "We're a startup, make us a sales playbook."
    assert:
      - {type: llm-rubric, value: "Asks what the company sells, to whom and at what price before building the playbook, rather than producing a generic one with invented details."}
