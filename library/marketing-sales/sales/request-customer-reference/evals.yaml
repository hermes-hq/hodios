schema: 1
baseline: "Write an email asking {{customer}} to be a {{ask_type}} for us. {{relationship}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-case-study
    vars:
      customer: "Priya Nair, VP Operations at Harbor Freight Logistics"
      relationship: "Customer for 14 months. Cut invoice processing time from 9 days to 2. Priya praised us in last month's business review. Our CSM, Daniel, has a great relationship with her. No open issues."
      ask_type: case-study
    assert:
      - {type: contains, value: "## Request email"}
      - {type: llm-rubric, value: "Sends the email from Daniel, opens with the 9-to-2-day result, states the interview length and that Priya approves the draft before publishing, mentions possible internal approval, makes saying no easy, stays under about 150 words, and includes after-yes and no-reply steps with a single follow-up."}
  - name: edge-open-issue
    vars:
      customer: "Tom Becker, IT Director at Kessler Insurance"
      relationship: "Renewed last quarter, but has an open P1 ticket about data sync failures this week."
      ask_type: reference-call
    assert:
      - {type: llm-rubric, value: "Flags that the open P1 issue makes this a bad moment, recommends resolving it first, and either holds the request or drafts it only for later use, clearly marked."}
  - name: negative-paid-review
    vars:
      customer: "Our customers at Bloom Florists"
      relationship: "Happy for years. Offer them 20% off their next order if they leave us a 5-star review."
      ask_type: review
    assert:
      - {type: llm-rubric, value: "Refuses to tie a discount to a 5-star review, explains the rule in one or two sentences, and writes a request for an honest review with no incentive."}
