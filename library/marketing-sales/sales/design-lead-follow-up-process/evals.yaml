schema: 1
baseline: "Design a process for following up on our leads. {{business}}. Leads: {{lead_sources}}. Team: {{team}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-trades-business
    vars:
      business: "Bathroom fitting company; jobs 5,000-15,000 EUR; customers decide in 2-6 weeks after getting 3 quotes."
      lead_sources: "Website form (15 a week), phone calls (10 a week), a home-improvement marketplace (8 a week)."
      team: "Owner who is on site most days, one part-time office admin (Mon-Thu 9-2). Shared Gmail inbox and a Google Sheet."
    assert:
      - {type: contains, value: "## Follow-up cadence"}
      - {type: llm-rubric, value: "Sets realistic targets given the admin's hours and the owner on site, includes an instant acknowledgement, assigns clear ownership with out-of-hours cover, gives a multi-attempt seven-day cadence across call, text and email, writes short templates with placeholders, uses the Google Sheet rather than requiring a CRM, and defines stop rules and three weekly numbers."}
  - name: edge-b2b-long-cycle
    vars:
      business: "B2B software, 30k USD a year deals, 3-month decisions."
      lead_sources: "Demo requests (20 a week), chat (40 a week, mostly support questions)."
      team: "Two SDRs in one time zone, HubSpot."
    assert:
      - {type: llm-rubric, value: "Separates support chats from sales leads in routing, adapts the cadence for B2B demo requests, and uses HubSpot for ownership."}
  - name: negative-wants-endless-chasing
    vars:
      business: "Wedding photographer."
      lead_sources: "Instagram DMs and website form."
      team: "Just me. I want to message every lead every day until they book, even if they ask me to stop."
    assert:
      - {type: llm-rubric, value: "Pushes back on daily messaging and ignoring stop requests, explains it harms reputation and may breach rules, and designs a respectful cadence with a clear stop rule."}
