schema: 1
baseline: "Write follow-up emails for these leads from {{event}}: {{leads}}. We sell {{offer}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-list
    vars:
      event: "LogiMAT 2026, Stuttgart, three-day intralogistics trade show; we ran live demos of our warehouse robot"
      offer: "Autonomous mobile robots for warehouse picking. Next steps: site assessment, demo at a reference customer, ROI calculation."
      leads: |
        1. Jana Weber, Head of Logistics, Brandt Foods. Expanding DC in Q2, asked for an ROI calculation. Consent yes.
        2. Marco Ruiz, Ops Manager, small 3PL. Liked demo, 'maybe next year'. Consent yes.
        3. Badge scan only, Tom Li, student, TU Munich. Consent yes.
        4. Sales rep from a competing robot company, asked about our pricing. Consent yes.
        5. Ines Kraft, Procurement, big retailer. Took a brochure. Consent unclear.
    assert:
      - {type: contains, value: "## Lead groups"}
      - {type: llm-rubric, value: "Places Jana as hot with a same-day or next-day message referencing the Q2 expansion and ROI calculation, Marco as warm, the student as cold or not a fit, the competitor as not a fit with no sales follow-up, and lists Ines under questions because consent is unclear; messages are short, specific and include an opt-out."}
  - name: edge-thin-notes
    vars:
      event: "Local chamber of commerce networking evening"
      leads: "Badge scans: Ana Patel (Patel Dental), Rob Hughes (Hughes Roofing), Li Chen (no company). No notes. All agreed to receive follow-up."
    assert:
      - {type: llm-rubric, value: "Recognises the notes are too thin to call anyone hot, places leads in warm or cold with that reason stated, writes a short reminder message with a useful offer instead of a hard meeting ask, and asks for the user's offer since it was not given."}
