schema: 1
baseline: "Make a 90-day onboarding plan for a new sales rep. {{role_and_market}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-long-cycle-ae
    vars:
      role_and_market: "First account executive at a 15-person startup selling compliance software to mid-size banks and credit unions. Average deal 60,000 USD a year. Mostly outbound plus some founder referrals. Founder has closed all 8 customers so far."
      sales_cycle: "5-7 months"
      resources: "Founder has 4 hours a week. HubSpot set up. 12 recorded demos. No written playbook. Two customers happy to take reference calls."
    assert:
      - {type: contains, value: "## Certifications"}
      - {type: llm-rubric, value: "Says closed revenue is unrealistic in 90 days given the 5-7 month cycle and sets pipeline and skill milestones instead, labels numeric targets as assumptions to revisit after week 4, includes listening to the 12 demos and reverse shadowing with the founder, defines certification gates with passing standards before customer-facing activity, fits check-ins to 4 founder hours a week, and lists the missing playbook as a gap."}
  - name: edge-short-cycle-sdr
    vars:
      role_and_market: "SDR booking meetings for a payroll product for restaurants. Inbound and outbound. Target when ramped: 12 qualified meetings a month."
      sales_cycle: "2-3 weeks"
    assert:
      - {type: llm-rubric, value: "Uses the 12 meetings target to build a ramped schedule as percentages, sets earlier customer-facing activity suited to a short cycle, assumes about three manager hours a week and says so, and does not invent extra industry benchmarks."}
  - name: negative-missing-cycle
    vars:
      role_and_market: "New rep starting Monday."
      sales_cycle: ""
    assert:
      - {type: llm-rubric, value: "Asks what the rep sells, to whom, the deal size and the sales cycle, and stops instead of producing a generic plan."}
