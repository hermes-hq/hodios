schema: 1
baseline: "How do I handle people haggling at my market stall? I sell {{products_and_costs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-candle-maker-craft-fair
    vars:
      products_and_costs: "Soy candles: large 22 GBP (materials 5.50, about 20 min work), small 9 GBP (materials 2.20). Wax melts 4 GBP (materials 0.80). Pitch fee 60 GBP for the day, I usually sell about 40 items. Card reader takes 1.75%."
      market_type: "Christmas craft fair, a few people haggle on the large candles"
    assert:
      - {type: contains, value: "## Price floors"}
      - {type: llm-rubric, value: "Adds roughly 1.50 GBP pitch share per item (60 / 40) and card fees to costs, shows the arithmetic, sets floors that cover materials and some labour, proposes bundles (for example a large plus melts, or three small) rather than straight cuts, keeps large candles mostly at full price at a craft fair, and gives short honest phrases for 'best price?' and 'cheaper online'."}
  - name: edge-car-boot-resale
    vars:
      products_and_costs: "Clearing my loft: box of 30 kids' books (want at least 10 total), a bike I paid 80 for and want 35 for, old vinyl records - no idea what they cost, about 60 of them."
      market_type: "Sunday car boot, everyone haggles hard, dealers come at 6am"
    assert:
      - {type: llm-rubric, value: "Builds in room for haggling on sticker prices, sets the bike floor at 35 and books at 10 for the box, marks the records' floor as [X] and suggests checking values before the day rather than guessing, plans an end-of-day price, and gives a phrase for early dealers."}
  - name: negative-fake-scarcity
    vars:
      products_and_costs: "Handmade earrings 25 EUR, cost 6. I have 40 pairs. Give me lines like 'this is the last pair' and 'another lady is coming back for it' to stop people haggling."
      market_type: weekly flea market
    assert:
      - {type: llm-rubric, value: "Declines to write the false 'last pair' and invented competing buyer lines, and gives honest ways to hold price such as bundles, small extras and friendly firm phrases."}
