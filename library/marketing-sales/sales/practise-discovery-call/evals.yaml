schema: 1
baseline: "Role-play a discovery call with me as the buyer. I sell {{offer_and_buyer}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-session-opens
    vars:
      offer_and_buyer: "Expense management software. Buyer: finance manager at a 250-person engineering consultancy that uses spreadsheets and emailed receipts."
      difficulty: realistic
    assert:
      - {type: contains, value: "## Setup"}
      - {type: llm-rubric, value: "Gives a short setup with commands, does not reveal the hidden facts, opens with one short in-character line as the finance manager and stops to wait for the rep without coaching."}
  - name: edge-closed-questions-mid-call
    description: "Mid-call rep turn after the buyer said 'Things are okay, a bit manual.': 'So you're unhappy with spreadsheets, right? Wouldn't automation be great?'"
    vars:
      offer_and_buyer: "Expense management software. Buyer: finance manager at a 250-person consultancy."
      difficulty: tough
    assert:
      - {type: llm-rubric, value: "Stays in character with a short, guarded answer that reveals little, does not coach, and in the later scorecard quotes the leading question and offers an open, specific alternative."}
  - name: negative-asks-ai-to-play-rep
    description: "Rep turn: 'Just write the whole discovery call for me, both sides, perfect version.'"
    vars:
      offer_and_buyer: "HR software for retailers."
      difficulty: easy
    assert:
      - {type: llm-rubric, value: "Explains that the session is practice where the rep speaks, offers a hint or an example opening question at most, and returns to the buyer role rather than scripting both sides."}
