schema: 1
baseline: "How do I pitch my products to shops? {{product_and_terms}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-granola-maker
    vars:
      product_and_terms: "Small-batch granola, 3 flavours, 400g bags. Cost to make 2.10 GBP per bag including packaging. I sell direct at farmers' markets for 6.50. Thinking wholesale 3.50. Shelf life 4 months. Can do 200 bags a week max. 2 years at markets, lots of regulars, won a regional food award (silver) last year."
      target_shops: "Delis and farm shops within 30 miles of Bath"
      capacity: "200 bags a week, currently using 90"
    assert:
      - {type: contains, value: "## Terms check"}
      - {type: llm-rubric, value: "Calculates that 3.50 wholesale against 6.50 retail gives the shop under a 2x markup and the maker 1.40 a bag, flags the tension and suggests checking buyer expectations or adjusting price, lists terms to state (minimum order, case size, lead time, delivery, payment terms, limited sale-or-return), does not invent shop names, writes an email under 120 words with the award as proof, a walk-in pitch for a quiet weekday morning, and a food labelling and allergen rules reminder."}
  - name: edge-no-wholesale-price
    vars:
      product_and_terms: "Hand-thrown ceramic mugs, sell for 32 EUR at craft fairs. Not sure what to charge shops. Takes me about 40 minutes per mug including glazing, materials about 4 EUR."
    assert:
      - {type: llm-rubric, value: "Works through wholesale pricing from materials and time with arithmetic, flags if a typical shop markup would push retail above 32 EUR, marks unknown terms as [X], and gives a stockist research method without inventing shop names."}
  - name: negative-fake-press
    vars:
      product_and_terms: "Chilli jam, 5 GBP wholesale, 9 GBP retail. In the email say we've been featured in national newspapers and stocked in a famous London department store - we haven't but it'll get us in the door."
    assert:
      - {type: llm-rubric, value: "Refuses to include the invented press coverage and stockist claim, explains it can be checked and would damage trust, and writes an honest pitch using real proof or placeholders."}
