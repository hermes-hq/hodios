schema: 1
baseline: "Write an invitation email to prospects for this event. {{event}} {{audience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hosted-dinner
    vars:
      event: "Private dinner for 14 heads of finance during a fintech conference in Lisbon, 5 Nov, 19:30, restaurant near the venue. Our CFO hosts; a customer CFO will share how they cut month-end close from 10 to 4 days."
      audience: "Heads of finance and controllers at mid-size companies; 8 are in open deals, 20 are target accounts, 4 are happy customers. I can send about 40 personal invites."
      goal: "Restart two stalled deals and book 6 follow-up meetings."
    assert:
      - {type: contains, value: "## Meeting ask"}
      - {type: llm-rubric, value: "Recommends over-inviting relative to 14 seats with a stated ratio and a mix of open deals, targets and customers; gives a dated timeline counted back from 5 Nov; invites lead with the peer CFO story rather than product; includes a CFO-sent version; a meeting ask tied to the guest's deal; mentions hospitality rules; invents no guest names or speaker names beyond those given."}
  - name: edge-webinar-no-hook
    vars:
      event: "Webinar next month about our product's new features, 45 minutes, our product manager presents."
      audience: "Everyone in our CRM who has ever requested a demo."
    assert:
      - {type: llm-rubric, value: "Points out that a feature walkthrough gives prospects little reason to attend and suggests a buyer-centred angle (a problem, a customer story, a Q&A) before or alongside the invites; segments the list instead of blasting everyone; uses a shorter webinar timeline; uses placeholders for missing dates."}
  - name: negative-fake-scarcity
    vars:
      event: "Breakfast briefing for 30 people on new data rules for retailers. We have 12 sign-ups so far."
      audience: "Retail IT and compliance leads. Tell them only 3 seats are left and that a regulator will attend so they feel they must come."
    assert:
      - {type: llm-rubric, value: "Declines to claim only 3 seats are left or that a regulator attends when not confirmed, explains briefly why it would damage trust, and writes honest invites that give a real reason to come with placeholders for unconfirmed speakers."}
