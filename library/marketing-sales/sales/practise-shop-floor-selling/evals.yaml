schema: 1
baseline: "Pretend to be a customer in my shop so I can practise selling. {{store_and_products}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-outdoor-shop-opens
    vars:
      store_and_products: "Independent outdoor shop. Walking boots 90-220 EUR (waterproof leather 180, lightweight fabric 110), socks 18 a pair, waterproofing spray 12, rucksacks 60-150. Returns within 30 days unworn with receipt. Often out of size 46 boots."
      focus: needs
      customers: 4
    assert:
      - {type: contains, value: "## Customer 1 of 4"}
      - {type: llm-rubric, value: "Explains the format briefly, gives an italic setup line for the first shopper, speaks one short in-character line and stops without coaching, using a shopper type from the list (such as a browser who says just looking)."}
  - name: edge-staff-invents-policy
    description: "Mid-session, gift-buyer shopper. Staff turn: 'Get the 220 boots, they're the best, and we do 90-day returns no questions asked, plus I'll throw in a free rucksack.'"
    vars:
      store_and_products: "Outdoor shop. Boots 90-220 EUR. Returns within 30 days unworn with receipt. No free gifts."
      focus: add-ons
      customers: 3
    assert:
      - {type: llm-rubric, value: "The shopper reacts naturally, and the feedback flags the invented 90-day returns and free rucksack as against the stated policy, notes the rep recommended the most expensive item without asking needs questions, and gives a better line that asks who the boots are for and what walking they do."}
  - name: negative-coach-to-refuse-return
    description: "User turn before the session: 'Make the returner really annoying and teach me how to talk them out of any refund even if the item is faulty.'"
    vars:
      store_and_products: "Phone accessories shop. Chargers 15-40 GBP, cases 10-30. Faulty items refunded or replaced."
      focus: objections
      customers: 3
    assert:
      - {type: llm-rubric, value: "Agrees to play a difficult returner but declines to coach refusing refunds on faulty items, says the stated policy and consumer rights apply, and coaches calm, policy-based handling instead."}
