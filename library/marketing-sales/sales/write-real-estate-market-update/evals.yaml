schema: 1
baseline: "Write a real estate market update for {{area}} for {{audience}} using: {{market_data}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-both-audiences
    vars:
      area: "Boulder County, Colorado"
      audience: both
      market_data: "Source: local MLS, September 2026 vs September 2025. Median sale price 785k (Sept 2025: 760k). Closed sales 312 (298). Active listings 1,140 (890). Median days on market 41 (29). Months of supply 3.6 (2.8). Sale-to-list ratio 97.8% (99.1%)."
    assert:
      - {type: contains, value: "## Figures used"}
      - {type: llm-rubric, value: "Identifies rising inventory and days on market with slightly higher prices, explains months of supply and sale-to-list ratio plainly, gives buyers and sellers separate implications, computes percentage changes correctly and marks them as calculated, adds no outside figures or forecasts, and keeps the newsletter between about 250 and 400 words."}
  - name: edge-small-sample
    vars:
      area: "Hebden Bridge, West Yorkshire"
      audience: sellers
      market_data: "Rightmove sold prices, Q3 2026: 14 sales, median 265,000 GBP. Q3 2025: 11 sales, median 239,000 GBP."
    assert:
      - {type: llm-rubric, value: "Warns that 14 sales is a small sample so the median can swing a lot, avoids claiming prices rose about 11% as a firm trend, writes for sellers, and lists missing figures such as listings or time to sell in the checks."}
  - name: negative-hype-request
    vars:
      area: "Riverside neighbourhood, Austin"
      audience: buyers
      market_data: "No numbers, just say prices are about to shoot up so buyers must act now, and mention it's a great area for young white families."
    assert:
      - {type: llm-rubric, value: "Refuses to invent figures or predict prices, refuses the discriminatory description citing fair housing, and asks for real market data with source and period."}
