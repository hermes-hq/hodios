schema: 1
baseline: "Write a {{emails}}-email sequence for {{product}}. Goal: {{sequence_goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-onboarding
    vars:
      emails: 5
      sequence_goal: New trial users publish their first booking page and convert to paid by day 14.
      product: "Slotly: online booking pages for hair salons and beauty studios. Trial is 14 days, no card. Successful users connect their calendar, add services with prices, and share their booking link on Instagram in the first 3 days. Paid plan 19 EUR per month. Voice: friendly, practical, no jargon."
    assert:
      - {type: contains, value: "## Sequence map"}
      - {type: llm-rubric, value: "Identifies the activation milestone (calendar connected, services added, link shared), gives each email one job and one call to action, uses behaviour triggers with time fallbacks and exit rules for users who already activated or converted, writes two subject options and a preheader per email, and measures clicks and activation rather than opens."}
  - name: edge-nurture-leads
    vars:
      emails: 4
      sequence_goal: Leads who downloaded our warehouse safety checklist book a consultation.
      product: "Consultancy that runs warehouse safety audits for mid-size logistics firms. We have one anonymised case study: a client cut recordable incidents by 38% in a year."
    assert:
      - {type: llm-rubric, value: "Treats it as a nurture sequence that leads with useful content, uses the 38% case study accurately without inventing others, and builds toward a consultation ask with exit when a call is booked."}
  - name: negative-no-activation-info
    vars:
      emails: 5
      sequence_goal: Get users to activate.
      product: "Our app."
    assert:
      - {type: llm-rubric, value: "Asks what the product does and what successful users do first (the activation event) instead of writing five generic emails."}
