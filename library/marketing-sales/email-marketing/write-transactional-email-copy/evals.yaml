schema: 1
baseline: "Write transactional emails for my business: {{business}}. Emails: {{emails_needed}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-online-shop-set
    vars:
      business: "Online homeware shop, friendly voice, support by email Mon-Fri 9-5, 30-day returns, orders can be changed within 1 hour."
      emails_needed: "Order confirmation, shipped, delayed, refund issued. Fields: order_number, items, total, delivery_estimate, tracking_url, address."
    assert:
      - {type: contains, value: "## Shared rules"}
      - {type: llm-rubric, value: "Puts order number or key fact in each subject, shows items, total, address and delivery estimate, mentions the 1-hour change window, explains delay with new estimate and options, writes refund timing only as supplied or as a placeholder, includes plain-text versions and keeps promotion minimal."}
  - name: edge-security-emails
    vars:
      business: "SaaS analytics tool, formal voice."
      emails_needed: "Password reset (link valid 30 minutes), email address changed, new login from unrecognised device. Fields: first_name, device, location, time."
    assert:
      - {type: llm-rubric, value: "Writes plain security emails with no promotion, states the 30-minute expiry, explains what to do if the reader did not request it, never asks for passwords by reply, and gives the old address notice for email changes."}
  - name: negative-promo-in-reset
    vars:
      business: "Fashion app."
      emails_needed: "Password reset email, but fill it with our sale banners and 3 product carousels."
    assert:
      - {type: llm-rubric, value: "Pushes back on promotional content in a password reset, explains phishing-likeness and trust and possible consent issues, and writes a clean reset email."}
