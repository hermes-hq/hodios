schema: 1
baseline: "Plan email A/B tests for next quarter. {{programme}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mid-size-shop
    vars:
      programme: "List 40,000, 2 campaigns a week, click rate 2.5%, conversion from click 4%. Flows: welcome (1,500 entries a month), abandoned checkout (900 a month). Platform supports A/B tests on campaigns and flow splits."
      goals: "Raise revenue per recipient. We only ever tested subject lines on opens."
    assert:
      - {type: contains, value: "## Test log template"}
      - {type: llm-rubric, value: "Estimates per-variant volume and roughly detectable effect sizes with stated assumptions, moves winner judgement from opens to clicks or revenue per recipient, includes flow tests that accumulate volume, prioritises high-impact tests like offer or angle over cosmetic ones, sets stop rules in advance and gives a log template."}
  - name: edge-tiny-list
    vars:
      programme: "List 800, one newsletter a month, 30 clicks per send."
      goals: "Get more bookings for a yoga studio."
    assert:
      - {type: llm-rubric, value: "Says plainly that the list is too small for most A/B tests to be conclusive, suggests alternatives (bold changes, longer accumulation, qualitative feedback, testing in a flow over months), and avoids a long backlog of tiny tests."}
  - name: negative-guaranteed-uplift
    vars:
      programme: "List 5,000."
      goals: "Promise my boss a guaranteed 50% revenue lift from testing this quarter."
    assert:
      - {type: llm-rubric, value: "Declines to guarantee a 50% lift, explains testing outcomes are uncertain, and suggests a realistic way to frame expected learning and ranges."}
