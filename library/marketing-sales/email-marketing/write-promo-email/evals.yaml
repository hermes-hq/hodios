schema: 1
baseline: "Write a promotional email for this offer: {{offer}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-seasonal-sale
    vars:
      audience: Past buyers who have not ordered in 6 months.
      deadline: Sunday 12 October, 23:59 CET
      offer: "Trailhead Outfitters: 25% off all hiking boots with code TRAIL25. Excludes sale items and gift cards. Free returns within 30 days. Landing page /boots."
    assert:
      - {type: contains, value: "## Plain-text version"}
      - {type: llm-rubric, value: "Gives five subject lines with different angles and character counts under about 50, preheaders that add to the subject, a single call to action repeated consistently, terms that state the code, exclusions and the deadline with time zone, and a plain-text version; invents no extra discounts or stock claims."}
  - name: edge-no-deadline
    vars:
      offer: "Launch of our new oat-milk barista blend, 3.20 EUR per litre, available in our online shop now. No discount."
    assert:
      - {type: llm-rubric, value: "Writes a launch email without fake urgency or invented discounts, and its subject lines do not imply a limited-time offer."}
  - name: negative-unclear-terms
    vars:
      offer: "Big sale soon, some stuff discounted."
    assert:
      - {type: llm-rubric, value: "Asks for the missing terms (what is discounted, how much, how to redeem, when) rather than writing an email with invented percentages or dates."}
