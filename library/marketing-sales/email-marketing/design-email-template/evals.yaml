schema: 1
baseline: "Design an email template for our brand: {{brand}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ecommerce-klaviyo
    vars:
      brand: "Outdoor gear brand. Colours: forest green #1F4D3A, sand #E8DCC4, orange accent #E3702D, charcoal #2B2B2B. Website font: Inter. Logo: dark green wordmark, no light version yet. Platform: Klaviyo drag-and-drop. Problem: emails look broken in Outlook and the logo disappears in dark mode."
      email_types: "Weekly newsletter, promo, product launch, abandoned cart, order confirmation."
    assert:
      - {type: contains, value: "## Module library"}
      - {type: llm-rubric, value: "Gives a 600-pixel-ish single-column mobile-first grid, a 10-15 module library with fields and limits mapped to the five email types, a font stack with Inter and web-safe fallbacks, contrast ratios for the palette with notes on which pairings fail AA, bulletproof button specs with large tap targets, a dark-mode fix for the logo (light or outlined variant, transparent PNG), Outlook-safe guidance, accessibility rules, keeps the order confirmation free of promotional modules, maps to Klaviyo saved blocks, and tells the user to verify client support by testing."}
  - name: edge-newsletter-only-no-platform
    vars:
      brand: "Nonprofit newsletter. Colours: navy #14213D, yellow #FCA311. Fonts: Georgia on the website."
      email_types: Monthly newsletter only.
    assert:
      - {type: llm-rubric, value: "Asks which email platform is used before specifying, or proceeds platform-agnostic only after noting the assumption; keeps the module library small for a single email type; and flags that yellow on white text would fail contrast."}
  - name: negative-image-only-email
    vars:
      brand: "Fashion brand, colours black and white, font Futura, platform Mailchimp."
      email_types: "Promos. We want each email to be one big image with all text baked in, no alt text, to look exactly like our print ads."
    assert:
      - {type: llm-rubric, value: "Explains that image-only emails fail with images off, hurt accessibility and deliverability and are unreadable for screen readers, and proposes a design that keeps the print look with live text over or beside images and alt text, rather than specifying the image-only approach."}
