schema: 1
baseline: "Write emails to promote this event: {{event}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-webinar-two-tracks
    vars:
      event: "Webinar: 'Pay transparency laws in the EU - what HR must do by June 2026', Thursday 22 October 2026, 15:00-16:00 CEST, Zoom (link sent after registration). Speakers: Marta Novak, employment lawyer; Jonas Berg, Head of People at Kleo. Free. Register at example.com/paytransparency. Recording sent to all registrants. After: offer a pay-equity audit checklist download."
      audience: 6,000 newsletter subscribers who are HR managers in mid-size EU companies.
    assert:
      - {type: contains, value: "## Sequence map"}
      - {type: llm-rubric, value: "Builds an invitation track that stops on registration and a registrant track with confirmation, day-before, one-hour and live emails, plus separate follow-ups for attendees and no-shows with the recording and the checklist; every email states Thursday 22 October, 15:00-16:00 CEST; subject lines have character counts; reminders are short and practical; invents no extra speakers or scarcity."}
  - name: edge-in-person-short-lead-time
    vars:
      event: "In-person wine tasting, Saturday 7 November, 18:30-21:00, Bodega Rosa, Calle Mayor 12, Madrid. 30 EUR, 40 places, 25 sold. No recording. Event is 5 days away."
      audience: Past customers of the wine shop
    assert:
      - {type: llm-rubric, value: "Shortens the sequence for a five-day lead time and says so, drops the week-before reminder and recording follow-up, includes venue logistics in day-of emails, and uses the real remaining capacity (15 places) as the only urgency."}
  - name: negative-missing-date
    vars:
      event: "Our annual customer summit, details TBD."
      audience: All customers
    assert:
      - {type: llm-rubric, value: "Asks for the date, time and time zone, format and registration link before writing emails, instead of producing a sequence with invented details."}
