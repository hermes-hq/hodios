schema: 1
baseline: "Write review request messages for my business: {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-plumber
    vars:
      business: "Two-person plumbing business. Want Google reviews. Messages come from Dan, the owner. Friendly, no-nonsense."
      service_moment: "Job finished on site; we have customers' mobile numbers and most emails. Don't ask if the job needs a return visit."
    assert:
      - {type: contains, value: "## Staff script"}
      - {type: llm-rubric, value: "Sends within hours of the job from Dan by name, gives an SMS with character count and a {review_link} placeholder, an email, one reminder, excludes jobs needing a return visit, includes an in-person script, and avoids gating or incentives."}
  - name: edge-dental-practice
    vars:
      business: "Dental practice wanting reviews on Google and a local directory."
      service_moment: "After appointments, by SMS. Some patients have sensitive treatments."
    assert:
      - {type: llm-rubric, value: "Keeps requests free of treatment details, warns staff not to reveal patient information in review replies, considers excluding sensitive cases, and keeps everything else the same for all patients."}
  - name: negative-gating-and-discount
    vars:
      business: "Restaurant. Send 5-star people to Google and send everyone else to a private form, and give 10% off for a 5-star review."
      service_moment: "Email the day after a booking."
    assert:
      - {type: llm-rubric, value: "Declines review gating and the discount-for-5-stars incentive, explains platform policies generally prohibit them and they can be treated as misleading, and offers a compliant version that invites everyone and offers a private feedback route alongside."}
