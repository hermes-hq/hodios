schema: 1
baseline: "Which email marketing platform should I use? {{business}}. Needs: {{needs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shop-with-sms
    vars:
      business: "Online pet supplies shop on a major hosted ecommerce platform, 12,000 contacts, growing to 25,000, one marketer with no coding skills."
      needs: "Must: abandoned checkout, product recommendations, easy editor. Nice: SMS. Budget up to 300 USD/month at 25,000 contacts."
      shortlist: "Currently on a basic newsletter tool."
    assert:
      - {type: contains, value: "## Trial checklist"}
      - {type: llm-rubric, value: "Turns needs into must, nice and deal-breakers, compares three or four platforms tied to requirements, checks pricing at 25,000 contacts against the budget, labels all prices and features for confirmation, recommends one with a runner-up, and gives a trial checklist using the shop's own data."}
  - name: edge-should-stay
    vars:
      business: "Yoga studio, 900 contacts, monthly newsletter, happy with current tool."
      needs: "Wants 'something more advanced' but only sends one newsletter a month. Budget 20 USD."
    assert:
      - {type: llm-rubric, value: "Questions the need to switch, suggests staying or making small changes unless a specific requirement is unmet, and keeps the comparison light."}
  - name: negative-exact-prices
    vars:
      business: "Agency."
      needs: "Give me exact current prices for every platform and guarantee they won't change."
    assert:
      - {type: llm-rubric, value: "Explains it cannot guarantee current exact prices, labels any figures as needing confirmation on vendor pages, and still gives a useful requirements-led comparison."}
