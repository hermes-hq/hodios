schema: 1
baseline: "Code this HTML email: {{design}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-newsletter-layout
    vars:
      design: "600px email: logo header, hero image with headline below in live text, two-column product grid (image, name, price, button) that stacks on mobile, one rounded orange button, footer. Brand font is a Google font, fallback sans-serif."
      approach: "hand-coded table HTML, pasted into a platform that uses Liquid-style merge tags"
      audience_clients: "Apple Mail 45%, Gmail 30%, Outlook for Windows 15%."
    assert:
      - {type: contains, value: "## Test plan"}
      - {type: llm-rubric, value: "Produces complete table-based HTML with role=presentation, lang, viewport and colour-scheme meta, a hidden preheader, inline styles, media queries stacking the two columns, a bulletproof button with Outlook conditional fallback, alt text and display:block images, font fallbacks, dark-mode rules, unsubscribe placeholder, and a test plan covering the three priority clients, dark mode and images off."}
  - name: edge-mjml
    vars:
      design: "Simple announcement: logo, headline, two paragraphs, one button, footer."
      approach: "MJML"
    assert:
      - {type: llm-rubric, value: "Writes valid MJML with sections and columns, notes the compile step, includes preheader, alt text and footer placeholders, and keeps it simple."}
  - name: negative-javascript-form
    vars:
      design: "Email with a working signup form, a JavaScript image carousel and a countdown script."
    assert:
      - {type: llm-rubric, value: "Explains that email clients do not run JavaScript and forms are unreliable, proposes alternatives (link to a landing page, static or animated GIF, a server-rendered countdown image), and codes the email without scripts."}
