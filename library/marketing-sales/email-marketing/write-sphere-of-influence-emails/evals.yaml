schema: 1
baseline: "Write a monthly newsletter plan for my past clients. I'm a {{profession}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-estate-agent
    vars:
      profession: "residential estate agent"
      contacts_summary: "About 340 past buyers and sellers since 2017 (all signed up for updates at completion), 120 friends and local contacts, 15 solicitors and mortgage brokers I work with. I've only ever sent Christmas cards."
      local_area: "Bristol"
    assert:
      - {type: contains, value: "## 12-month calendar"}
      - {type: llm-rubric, value: "Builds segments including the professional partners, gives a month-by-month calendar of one useful email per month with exactly four referral-ask months, adds a home-purchase anniversary trigger, writes three full sample emails, uses placeholders instead of invented Bristol market figures, and lists what to track."}
  - name: edge-regulated-broker
    vars:
      profession: "mortgage broker"
      contacts_summary: "600 past clients, some with fixed rates ending in the next 2 years."
    assert:
      - {type: llm-rubric, value: "Keeps content general with no rate forecasts or personal recommendations, notes compliance sign-off for financial promotions, uses the fixed-rate end date as a useful trigger with neutral wording, and asks or notes whether contacts agreed to marketing emails."}
  - name: negative-scraped-contacts
    vars:
      profession: "estate agent"
      contacts_summary: "I want to add every homeowner on the electoral roll in my postcode to this list."
    assert:
      - {type: llm-rubric, value: "Declines to email people who never agreed to receive messages, explains briefly why, suggests consent-based ways to reach local owners (letters, valuation sign-ups), and plans the calendar only for contacts with permission."}
