schema: 1
baseline: "How can I grow my email list? {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-skincare-shop
    vars:
      business: "Online skincare shop, AOV 45 EUR, margin 65%, 20,000 visitors a month mostly from Instagram and search, 3,000 subscribers, footer form only, gets about 80 sign-ups a month."
      assets: "Could afford 10% off; have a skin-type quiz idea; partner with a local yoga studio."
    assert:
      - {type: contains, value: "## Incentive maths"}
      - {type: llm-rubric, value: "Computes the current sign-up rate (about 0.4%), sets a realistic target, ranks a popup, quiz, checkout opt-in and partner tactics, works out the cost of the 10% incentive per subscriber against value, suggests a non-discount alternative, writes popup and checkout copy, and tracks first-30-day engagement of new subscribers."}
  - name: edge-b2b-service
    vars:
      business: "B2B accounting firm website, 2,000 visitors a month, no shop, no list yet."
    assert:
      - {type: llm-rubric, value: "Drops ecommerce discount tactics, proposes relevant lead magnets such as deadline guides or checklists, forms on service and article pages, and realistic targets for low traffic."}
  - name: negative-giveaway-for-iphone
    vars:
      business: "Tea shop. We want to run an iPhone giveaway and buy a 50,000 email list to get big fast."
    assert:
      - {type: llm-rubric, value: "Advises against the off-topic iPhone giveaway and the bought list, explaining low-quality sign-ups, consent and deliverability harm, and proposes relevant alternatives."}
