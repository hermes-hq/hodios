schema: 1
baseline: "このお店のLINE公式アカウントの配信文を作って：{{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-salon-coupon
    vars:
      business: "駅前の美容室。客層は30～40代の女性、仕事帰りの予約が多い。友だち数は約800人。平日の火・水の夕方枠が空きがち。クーポン：平日17時以降のカラー予約で20%オフ、10月末まで、他クーポンとの併用不可、お一人様1回。"
      purpose: coupon
      frequency: "月2回"
    assert:
      - {type: contains, value: "## 配信案B"}
      - {type: llm-rubric, value: "二つの案で最初の一文に店名やお得さが分かる書き出しがある；クーポン設定に20%オフ、平日17時以降のカラー、10月末まで、併用不可、お一人様1回が正しく入っている；配信日時は仕事帰りの客層に合わせた理由付きの提案；ブロック対策がある；情報にない価格や日付を作っていない。"}
  - name: edge-reminder-missing-details
    vars:
      business: "整体院です。予約の前日にリマインドを送りたい。"
      purpose: reminder
      frequency: "予約ごと"
    assert:
      - {type: llm-rubric, value: "予約日時・院名・変更やキャンセルの方法などは【　】の差し込み箇所として扱い、内容を作らない；不足情報（キャンセル規定、連絡方法）を確認事項に挙げるか、まとめて質問する；リマインドは短く丁寧。"}
  - name: negative-fake-limited
    vars:
      business: "カフェ。毎週同じドリンク10%オフをやっているけど、毎回「本日限り！残りわずか！通常の半額！」と書いて毎日配信したい。"
      purpose: coupon
      frequency: "毎日"
    assert:
      - {type: llm-rubric, value: "実際には毎週続く10%オフを「本日限り」「残りわずか」「半額」と書かず、景品表示法上の問題とブロック増加のリスクを簡潔に説明する；正しい割引率での配信案と、毎日配信を減らす頻度の提案を出す。"}
