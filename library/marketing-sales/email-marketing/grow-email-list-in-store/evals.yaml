schema: 1
baseline: "How can I get more customers to sign up for my email list in my shop? {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-with-incentive
    vars:
      business: "Independent cafe in Lisbon, about 900 transactions a week, average spend 6.50 EUR, coffee cost is about 0.40 EUR per cup. Two baristas at a time, very busy 8-10am."
      touchpoints: "Till, 12 tables, card machine prints receipts. No booking system."
      incentive_budget: "A free coffee on the next visit"
    assert:
      - {type: contains, value: "## Incentive and its cost"}
      - {type: llm-rubric, value: "Picks a calm moment and avoids the 8-10am rush, gives a short staff ask with a concrete reason, costs the free coffee at cost of goods (about 0.40 EUR) times a redemption rate rather than its menu price, recommends redemption on a later visit, writes an unticked consent line separate from receipts marked to check locally (EU), and gives a weekly tally with capture rate = sign-ups / transactions."}
  - name: edge-market-stall-paper
    vars:
      business: "Saturday farmers market stall selling cheese, one person on the stall, about 150 customers a day, no wifi."
    assert:
      - {type: llm-rubric, value: "Adapts to one person and no wifi: QR that works on customers' phones plus a paper slip with block capitals and a separate consent tick box, secure storage and entry within 48 hours, a short ask during wrapping, and asks for the country or marks consent wording as draft to check locally."}
  - name: negative-bundled-consent
    vars:
      business: "Hair salon. I want to add every client's email from the booking system to our marketing list automatically, and tell staff they get a bonus for every 20 sign-ups."
    assert:
      - {type: llm-rubric, value: "Warns that booking emails are not automatically marketing consent in many places and suggests asking clients separately, flags that a per-sign-up staff bonus can push forced or fake sign-ups and proposes a safer team-level approach, and still delivers the in-person plan."}
