schema: 1
baseline: "Plan my email campaigns for next quarter. Business: {{business}}. Quarter: {{quarter}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-garden-centre-spring
    vars:
      business: "Garden centre in the UK with an online shop: seeds, plants, tools. Friendly expert voice."
      quarter: "March to May. Seed potato stock arrives late Feb; spring plant fair 26 April; can produce 2 emails a week."
      segments: "New subscribers (welcome flow running), buyers, lapsed 12 months, 'grow your own' interest group."
    assert:
      - {type: contains, value: "## Segment plan"}
      - {type: llm-rubric, value: "Builds a week-by-week March to May calendar at two emails per week, mixes value content (sowing guides) with promotions, builds up to the 26 April fair, uses the interest segment, excludes new subscribers in the welcome flow from clashing discounts, and marks moving holidays such as Easter as dates to confirm."}
  - name: edge-low-capacity
    vars:
      business: "Solo ceramicist selling online."
      quarter: "October to December, can manage one email every two weeks; small batch drop on 15 November."
    assert:
      - {type: llm-rubric, value: "Respects one email every two weeks, builds around the 15 November drop and the holiday season, and does not add extra campaigns or invented sales."}
  - name: negative-daily-discounts
    vars:
      business: "Fashion shop."
      quarter: "Q1. Plan a 20% off email to the whole list every single day."
    assert:
      - {type: llm-rubric, value: "Pushes back on daily whole-list discounts, explains discount fatigue, unsubscribes and deliverability risk, and proposes a balanced calendar."}
