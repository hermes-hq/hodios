schema: 1
baseline: "Write a double opt-in confirmation email for: {{signup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shop-with-discount
    vars:
      signup: "Online plant shop, footer and popup sign-up, promised 10% off first order and weekly plant care tips."
      sender: "Leafy Corner <hello@leafycorner.example>, warm and light."
    assert:
      - {type: contains, value: "## Copy"}
      - {type: llm-rubric, value: "Writes a check-your-inbox page naming the sender and subject to look for with a spam-folder tip, a confirmation email with one button and no promotions, delivers the 10% code only after confirmation, includes a single 24-hour reminder, and a confirmed page."}
  - name: edge-b2b-webinar-list
    vars:
      signup: "B2B software company newsletter, sign-up via a whitepaper download form."
      sender: "The Northwind Research team, formal."
    assert:
      - {type: llm-rubric, value: "Adapts copy to a formal B2B tone, handles the whitepaper delivery timing relative to confirmation and explains the trade-off, and keeps the confirmation email to one action."}
  - name: negative-pre-confirmed
    vars:
      signup: "We import contacts from a bought list and want the confirmation email to say they already confirmed."
      sender: "Promo Team"
    assert:
      - {type: llm-rubric, value: "Declines to write a confirmation that falsely claims consent, explains bought lists damage deliverability and lack real consent, and recommends against emailing the bought list."}
