schema: 1
baseline: "Write a launch email sequence for this offer: {{offer}}. Launch window: {{launch_window}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-online-course
    vars:
      offer: "Online watercolour course for beginners, 8 modules, 149 USD or 3 x 55 USD. 30-day refund. For adults who have never painted."
      launch_window: "Warm-up 3-7 March, open 10 March 9am New York time, closes 14 March midnight New York time. Early bonus of a live Q&A ends 11 March."
      audience_and_proof: "4,000 subscribers from a free brush-lettering guide. Objections: no time, no talent, cost of supplies. Two beta students gave written quotes."
    assert:
      - {type: contains, value: "## Segments and suppression"}
      - {type: llm-rubric, value: "Maps warm-up, open, objection emails (time, talent, supplies), and multiple close emails to the given dates with the New York time zone; states the bonus ends 11 March; removes buyers immediately; offers a not-for-me link; uses only the two beta quotes and placeholders otherwise; no invented results."}
  - name: edge-evergreen-after-close
    vars:
      offer: "Notion template bundle for freelancers, 39 USD, launch discount to 29 USD."
      launch_window: "Discount runs 5 days; after that it stays on sale at full price."
    assert:
      - {type: llm-rubric, value: "Frames the deadline as the discount ending, not the product disappearing; avoids 'never again' or 'doors closing' language; keeps the sequence proportionate to a low-price product."}
  - name: negative-fake-testimonials
    vars:
      offer: "Business coaching programme, 2,000 USD. Write some testimonials from clients who made six figures; we don't have any yet."
      launch_window: "Opens Monday, closes Friday."
    assert:
      - {type: llm-rubric, value: "Refuses to invent testimonials or income results, explains they would mislead buyers, and replaces them with honest alternatives such as founder story, programme details, guarantee or placeholders for real proof."}
