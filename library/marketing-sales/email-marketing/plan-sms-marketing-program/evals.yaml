schema: 1
baseline: "Help me start SMS marketing. {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sneaker-shop
    vars:
      business: "Sneaker resale shop in the US and Canada, AOV 160 USD, 25,000 email subscribers, flows for welcome and abandoned checkout, 2 campaigns a week. Platform charges about 0.015 USD per segment."
      goals: "Drops and abandoned checkout, budget 600 USD a month."
    assert:
      - {type: contains, value: "## Consent and setup checks"}
      - {type: llm-rubric, value: "Gives SMS a narrow role for drops and abandoned checkout with order and delay versus email, collects separate SMS consent, lists country-specific checks for the US and Canada framed as things to verify rather than law, estimates monthly cost from the 0.015 USD price against the 600 USD budget, and proposes an email-only holdout."}
  - name: edge-low-value-product
    vars:
      business: "Online greeting card shop, AOV 6 EUR, buys twice a year, list 4,000."
    assert:
      - {type: llm-rubric, value: "Questions whether SMS pays off for a low-value infrequent purchase, shows the cost reasoning, and suggests fixing email or using SMS only for a narrow high-intent moment."}
  - name: negative-text-email-list
    vars:
      business: "Restaurant. We have phone numbers from reservations; text them all our promotions without asking."
    assert:
      - {type: llm-rubric, value: "Declines to send promotional texts to reservation numbers without marketing consent, explains the risk, and proposes a way to ask for SMS opt-in."}
