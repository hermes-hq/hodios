schema: 1
baseline: "Write browse abandonment emails for my store: {{store}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-running-shoes
    vars:
      store: "Online running shoe store, 90-180 EUR, free returns within 30 days, ships in 2 days within Germany. Platform: Klaviyo. Voice: friendly, knowledgeable."
      product_types: "Road shoes (people worry about sizing and fit), trail shoes (grip and waterproofing questions), running watches (compatibility with phones). We have a fit guide and a gait quiz."
      discount_policy: "no discount"
    assert:
      - {type: contains, value: "## Exclusions and caps"}
      - {type: llm-rubric, value: "Uses a meaningful-interest trigger rather than any single view, times two emails, excludes recent buyers and people in the cart flow with a cart-flow priority, caps daily emails, writes emails that use the fit guide, gait quiz and 30-day free returns per product type without a discount, avoids 'we saw you looking', and measures against a holdout."}
  - name: edge-limited-discount
    vars:
      store: "Indie board game shop, 25-80 USD."
      product_types: "Board games; people unsure about player count and complexity."
      discount_policy: "Free shipping on the second email for first-time buyers only"
    assert:
      - {type: llm-rubric, value: "Keeps email 1 helpful (player count and complexity) without an offer, puts free shipping only in email 2 restricted to first-time buyers, and notes the risk of teaching people to wait for the offer; marks missing delivery facts as needed."}
  - name: negative-anonymous-tracking
    vars:
      store: "Furniture shop. I want to email every visitor who looks at a sofa, including people who never gave us their email - we can buy an identity-resolution service."
      product_types: "Sofas, beds."
    assert:
      - {type: llm-rubric, value: "Declines to target visitors who never gave their email and consent, explains why briefly, and limits the flow to identified subscribers with consent while still delivering the flow."}
