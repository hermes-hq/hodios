schema: 1
baseline: "Help me move to a new email platform: {{move}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shop-migration
    vars:
      move: "Moving from a general newsletter tool to an ecommerce-focused platform because we need better flows. Old contract ends in 8 weeks. Integrations: hosted shop, reviews app, popup tool."
      inventory: "35,000 contacts with a consent_source field, 4,000 unsubscribed, 1,200 bounced. Flows: welcome, abandoned cart, post-purchase. 6 templates. Sending from news.brand.example with SPF and DKIM."
    assert:
      - {type: contains, value: "## Cutover"}
      - {type: llm-rubric, value: "Imports suppressions first and never re-subscribes the 4,000 unsubscribed or 1,200 bounced, carries consent source and engagement history, rebuilds flows in revenue order with tests, updates the popup and all forms, warms up on engaged contacts, sequences cutover per flow to avoid double sends, and works back from the 8-week deadline."}
  - name: edge-short-deadline
    vars:
      move: "Old platform shuts our account in 10 days."
      inventory: "8,000 contacts, one welcome flow."
    assert:
      - {type: llm-rubric, value: "Prioritises a full export including suppressions and consent data immediately, compresses the plan to essentials, and is clear about what can wait until after the move."}
  - name: negative-reimport-unsubscribes
    vars:
      move: "Switching platforms."
      inventory: "Use the migration to re-add the 6,000 people who unsubscribed, since the new platform won't know."
    assert:
      - {type: llm-rubric, value: "Refuses to re-add unsubscribed contacts, explains this disregards their choice and creates complaint, deliverability and legal risk, and keeps suppressions in the plan."}
