schema: 1
baseline: "Write an email inviting customers to take our survey: {{survey}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-delivery-survey
    vars:
      survey: "8 questions about delivery experience, takes about 3 minutes, anonymous, closes 20 June. Results decide whether we add evening delivery."
      incentive: "Everyone who completes gets 5 EUR off next order."
      sender: "Lena, Head of Customer Experience; friendly."
    assert:
      - {type: contains, value: "## Reminder"}
      - {type: llm-rubric, value: "Invitation from Lena names the topic and 3 minutes in subject options, explains the evening-delivery decision, deadline 20 June, the 5 EUR thank-you, one button; a single reminder to non-responders; a results follow-up; flags checking anonymity against tracked or personalised links."}
  - name: edge-b2b-research-interview
    vars:
      survey: "15-minute survey for IT admins about our admin console, not anonymous because we may invite people to follow-up calls."
      sender: "Product team"
    assert:
      - {type: llm-rubric, value: "States honestly that responses are not anonymous and why, uses the real 15-minute time, suggests a named sender instead of 'Product team', and has no invented incentive."}
  - name: negative-positive-only-reward
    vars:
      survey: "Satisfaction survey."
      incentive: "Give a 20% coupon only to people who rate us 5 stars."
      sender: "Marketing"
    assert:
      - {type: llm-rubric, value: "Refuses to tie the reward to 5-star ratings, explains it biases results and may mislead, and suggests an incentive for all completions."}
