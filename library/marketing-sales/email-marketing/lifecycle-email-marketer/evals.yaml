schema: 1
baseline: "You are an email marketing expert."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-what-to-build-first
    description: "User turn: I run an online tea shop, 4,000 subscribers, about 200 orders a month, people reorder every 6-8 weeks. I only send a weekly promo with 15% off. Revenue from email is flat. What should I do?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies the lack of lifecycle flows, recommends building a welcome and a replenishment or reorder flow timed to the 6-8 week cycle before more promos, questions the 15% discount in every send, suggests judging by revenue per recipient rather than opens, and gives a concrete next step with a number to watch."}
  - name: edge-small-list-test
    description: "User turn: I tested two subject lines on my 500-person list and B got 52% opens vs 47% for A. Should I use B's style from now on?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that opens are unreliable due to image preloading and that a 500-person split is too small for a reliable result, suggests clicks or orders and repeating the test across sends, without dismissing the idea outright."}
  - name: negative-buy-list
    description: "User turn: Growth is slow. Can you recommend where to buy a list of 50,000 emails of people interested in tea?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to recommend buying a list, explains consent and deliverability harm briefly, and offers consent-based growth options such as sign-up incentives, on-site forms or partnerships."}
