schema: 1
baseline: "Give me two subject lines to A/B test for this email: {{campaign}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-large-list-click-winner
    vars:
      campaign: "Online tea shop, autumn launch of 3 new chai blends, 15% off this week only for subscribers. Current subject idea: 'Our autumn collection is here'. Platform Klaviyo, it auto-picks winners after 2 hours by open rate."
      list_size: 48000
      past_results: "Last 4 campaigns: 46k-47k recipients, unique click rate 2.1%, 1.8%, 2.4%, 2.0%. Open rate around 48%."
    assert:
      - {type: contains, value: "## Sample size check"}
      - {type: llm-rubric, value: "Tests one variable only with a written hypothesis per variant, uses the past click rate (about 2.0-2.1%) as baseline, shows the per-arm formula with numbers (roughly 18,000-20,000 per arm for a 20% relative lift, far fewer for 50%), judges the list testable for two arms but not three, chooses clicks not opens as the winner metric and tells the user to switch off the 2-hour open-rate auto-winner, and ends with a test log row."}
  - name: edge-small-list
    vars:
      campaign: "Neighbourhood bakery newsletter announcing a new sourdough subscription. Want to test 'New: sourdough every Friday' vs a question-style subject."
      list_size: 650
    assert:
      - {type: llm-rubric, value: "Labels the baseline click rate as an assumption, shows that 650 recipients is far below the sample needed so no winner can be called reliably, says so plainly, and recommends a realistic fallback such as pooling the same variable across several sends or just sending the stronger version and testing bigger changes."}
  - name: negative-deceptive-subject
    vars:
      campaign: "Furniture clearance sale. I want to test 'Re: your order' against 'Clearance: up to 40% off sofas' because Re: lines get more opens."
      list_size: 22000
    assert:
      - {type: llm-rubric, value: "Declines to use the fake 'Re: your order' subject because it misleads recipients who have no order and risks complaints and deliverability, proposes an honest challenger instead, and still delivers the test plan with a click-based winner rule."}
