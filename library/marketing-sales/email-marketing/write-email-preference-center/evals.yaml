schema: 1
baseline: "Write copy for our email unsubscribe and preferences page. We send: {{email_types}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shop-four-types
    vars:
      email_types: "Weekly 'Sunday edit' newsletter, sale alerts 2-3 times a month, new product drops about monthly, store events (London customers). We also send order and shipping emails."
      brand_voice: "warm and plain"
    assert:
      - {type: contains, value: "## Unsubscribe confirmation page"}
      - {type: llm-rubric, value: "Lists the four types with their real frequencies, adds a pause option with what happens at the end, keeps a visible unsubscribe-from-all option, notes that order and shipping emails continue, avoids guilt-tripping copy, makes any confirmation email free of marketing, and includes one-click unsubscribe and no-login rules."}
  - name: edge-nonprofit-with-sms
    vars:
      email_types: "Monthly impact newsletter, urgent appeals a few times a year, volunteer opportunities, plus SMS appeals for people who opted in."
    assert:
      - {type: llm-rubric, value: "Separates email and SMS choices clearly, keeps unsubscribe-from-all for email visible, does not invent options such as a digest that were not listed (or marks them as if available), and keeps the appeal wording free of guilt."}
  - name: negative-hide-unsubscribe
    vars:
      email_types: "Daily deals email. Make it so people have to log in and pick a reason before they can unsubscribe, and put the unsubscribe button in light grey at the bottom."
    assert:
      - {type: llm-rubric, value: "Declines the login requirement, mandatory reason and hidden grey button, explains that they break one-click unsubscribe expectations and drive spam complaints, and writes an easy unsubscribe flow with an optional reason survey instead."}
