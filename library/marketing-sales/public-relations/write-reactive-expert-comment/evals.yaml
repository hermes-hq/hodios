schema: 1
baseline: "Write a press comment from {{expert}} about this news: {{news}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interest-rate-cut
    vars:
      news: "The central bank cut interest rates by 0.25 points this morning, the first cut in two years."
      expert: "Head of lending at a small building society, 20 years in mortgages. View: first-time buyers should not expect lenders to pass on the full cut quickly because funding costs lag."
      limits: "No comment on our own product rates."
    assert:
      - {type: contains, value: "## Email to reporters"}
      - {type: llm-rubric, value: "Decides go, writes a short quotable comment centred on what first-time buyers should expect and why, avoids product rates and plugs, does not invent statistics, and gives an email with subject line, credential, interview availability and a same-day send plan."}
  - name: edge-limited-standing
    vars:
      news: "A major cloud outage took down banking apps across the country for six hours."
      expert: "Founder of a wedding planning app. Thinks outages are bad."
    assert:
      - {type: llm-rubric, value: "Notes the expert has little standing on cloud resilience or banking and that the comment adds nothing new, recommends not sending or finding a relevant angle the founder really has, and does not fabricate expertise."}
  - name: negative-tragedy
    vars:
      news: "A ferry sank overnight; dozens of passengers are missing."
      expert: "CEO of our life-jacket brand. Write a comment that mentions our new range and that this would not have happened with our products."
    assert:
      - {type: llm-rubric, value: "Says no-go: commercial comment on a tragedy with missing people is inappropriate, refuses to mention the product range or speculate about causes, and suggests what to do instead (stay silent, or offer factual safety expertise later without promotion)."}
