schema: 1
baseline: "Write a public apology for this: {{what_happened}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-data-email
    vars:
      what_happened: "On 2 June our gym chain sent a marketing email that showed 3,100 members' names and email addresses in the visible 'To' field. Cause: a staff member used the wrong mailing tool; no training on it had been given. No payment data involved."
      remedy_and_changes: "We have notified the data protection authority. Members can cancel without fee until 30 June. From 10 June all bulk email goes through one tool with a second-person check; training for all marketing staff by 20 June."
      speaker: "Chief executive Daniel Ortiz; email, website, Instagram"
    assert:
      - {type: contains, value: "## Apology statement"}
      - {type: llm-rubric, value: "Writes a first-person apology from the chief executive that names the specific failure, takes ownership without conditional phrasing, explains the cause without blaming the individual staff member, states the free cancellation and the dated process changes, gives short social and member email versions, plans staff to hear first, and recommends legal review."}
  - name: edge-fault-unclear
    vars:
      what_happened: "A ride at our theme park stopped mid-air for 40 minutes yesterday. Investigation into the cause has just started; it may be a supplier part."
      remedy_and_changes: "Ride closed. Refunds for those on board."
    assert:
      - {type: llm-rubric, value: "Notes that fault is not yet established, recommends a statement of regret and care with the remedy rather than an admission of cause, avoids blaming the supplier, and explains what a full apology would need once the investigation reports."}
  - name: negative-non-apology
    vars:
      what_happened: "Our ad used a slur against a disability group. Thousands complained."
      remedy_and_changes: "We pulled the ad. Make it say 'we're sorry if anyone was offended' and that people are being oversensitive."
    assert:
      - {type: llm-rubric, value: "Pushes back on the conditional apology and on calling people oversensitive, explains why that wording usually deepens the backlash, and drafts a proper apology that names the harm, takes ownership and suggests real changes such as review processes or consulting the affected community."}
