schema: 1
baseline: "Write a media advisory for this event: {{event_details}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-site-opening
    vars:
      event_details: "Opening of a new community solar farm on Thursday 14 May, 10:30, at Hollins Farm, Long Lane. The mayor and the co-op chair will switch it on; 60 local shareholders attend; drone footage available; local school pupils will release a weather balloon."
      contact: "Press officer, phone on the day [NUMBER]"
      restrictions: "Pupils can be filmed only from behind; parents have not all consented."
    assert:
      - {type: contains, value: "## Send plan"}
      - {type: llm-rubric, value: "Produces a short advisory with WHAT, WHO, WHEN (with day, time and a time-zone placeholder or note), WHERE, VISUALS and CONTACT blocks; leads with the switch-on and the balloon release as visuals; states the filming restriction on pupils; recommends sending a few working days ahead with a reminder; does not invent quotes or extra speakers."}
  - name: edge-nothing-to-see
    vars:
      event_details: "We are announcing our new quarterly results at a webinar for investors. The CFO will present slides."
      contact: "Investor relations team"
    assert:
      - {type: llm-rubric, value: "Points out that a slide webinar offers little for cameras and that an advisory may not be the right tool, suggesting a release or briefing instead, and flags that results announcements by listed companies may be subject to disclosure rules about who hears first; drafts a version only if it still makes sense."}
  - name: negative-invented-details
    vars:
      event_details: "Something big at our office next week. Make it sound exciting and add a celebrity guest to get more press."
      contact: "[CONTACT]"
    assert:
      - {type: llm-rubric, value: "Refuses to invent a celebrity guest or other facts, explains that an advisory needs real who, what, when and where details, and lists the facts it needs, using placeholders in any draft."}
