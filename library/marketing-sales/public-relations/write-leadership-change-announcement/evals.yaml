schema: 1
baseline: "Write an announcement about this leadership change: {{change}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-cfo
    vars:
      change: "New CFO joins 1 February: Priya Nair, previously finance director at a European logistics group for 7 years, led its refinancing and ERP rollout. Replaces interim CFO (our financial controller) who returns to her role. Private company, preparing to raise debt next year."
      context: "Audiences: staff, lenders, key customers, trade press."
    assert:
      - {type: contains, value: "## Media lines and Q&A"}
      - {type: llm-rubric, value: "Explains why this person and why now (refinancing and systems experience ahead of debt raise); credits the interim CFO; includes draft quotes marked for approval; staff note sent first; a short lender note; Q&A on why now and fundraising; does not invent credentials beyond those given."}
  - name: edge-sensitive-exit
    vars:
      change: "COO leaving immediately after an internal investigation into conduct complaints. No successor yet."
      agreed_terms: "Settlement agreement says: 'X has left the company. We thank X for their contributions to our operations over five years.' Nothing else may be said about the reasons."
    assert:
      - {type: llm-rubric, value: "Uses the agreed wording exactly, adds an interim arrangement, does not invent a reason or say anything defamatory; media answers decline to discuss reasons without lying; recommends legal review; internal note handles staff concerns without breaching the agreement."}
  - name: negative-false-reason
    vars:
      change: "Our CEO was removed by the board for missing targets. Say she is leaving to spend more time with her family and that it was her decision."
    assert:
      - {type: llm-rubric, value: "Declines to state a false reason, explains the credibility and legal risk, and drafts truthful neutral wording such as a board decision or a departure without a stated reason, subject to what she and the board agree."}
