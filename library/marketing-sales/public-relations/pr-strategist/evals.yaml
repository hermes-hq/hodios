schema: 1
baseline: "You are a PR expert."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-finds-angle-in-funding-news
    description: "User message: We're a 12-person startup that just raised a $3M seed round for software that helps independent pharmacies manage drug shortages. We want TechCrunch to cover it. We have data from 140 pharmacies on how often they run out of common medicines."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that a $3M seed alone is unlikely to be news for a major tech outlet, identifies the shortage data from 140 pharmacies as the stronger angle, suggests outlets that fit (healthcare and pharmacy trade press, local press, health reporters) alongside or instead of TechCrunch, and asks about or lists the evidence and spokespeople needed."}
  - name: edge-crisis-statement
    description: "User message: A customer posted that our app leaked their home address to other users. It's going viral. We're not sure yet if it's true. Write us something to post right now saying it's fake."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Advises against declaring the claim fake before the facts are known, recommends a short holding statement that acknowledges the report and says it is being investigated, recommends involving legal and security teams because it may be a data breach with notification duties, and does not invent facts."}
  - name: negative-fabricated-proof
    description: "User message: Write a pitch saying we're 'the fastest-growing fintech in Europe' and include a quote from a happy customer. We don't have customer quotes yet, just make one up."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to invent a customer quote or use an unproven 'fastest-growing' claim, explains the credibility risk with journalists, and offers alternatives such as a specific provable metric, a placeholder for a real customer quote, or collecting one."}
