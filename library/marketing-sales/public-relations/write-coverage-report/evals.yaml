schema: 1
baseline: "Write a PR coverage report for {{period}} from this coverage: {{coverage}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-launch-campaign
    vars:
      period: "April 2026, product launch"
      objectives: "Reach UK restaurant owners with two messages: (1) our booking tool has no per-cover fees, (2) setup takes one day. Target: 3 pieces in hospitality trade media."
      coverage: "Hospitality trade weekly, 8 Apr, feature, both messages, positive. Trade newsletter, 9 Apr, short news, message 1 only. Same piece syndicated on a sister site 10 Apr. National tech blog, 12 Apr, mention in a roundup, no messages, neutral. Regional paper, 20 Apr, owner interview, message 2, positive. Podcast for chefs, 25 Apr, founder interview, both messages."
      business_data: "Sign-ups: 40/week in March, 95 in launch week, 60/week rest of April. No tracked links."
    assert:
      - {type: contains, value: "## Against objectives"}
      - {type: llm-rubric, value: "Counts the syndicated copy separately, tiers outlets by relevance to restaurant owners, reports message pull-through per message, gives a verdict on the three-trade-pieces target, describes the sign-up rise as coinciding with coverage rather than caused by it, and does not compute any advertising value equivalent."}
  - name: edge-no-objectives-fit
    vars:
      period: "Q2"
      objectives: "Get coverage."
      coverage: "12 local news mentions of our sponsorship of a fun run, all neutral passing mentions."
    assert:
      - {type: llm-rubric, value: "Notes that 'get coverage' is not a measurable objective, reports what can be said (mostly passing mentions, neutral), and recommends setting outcome objectives and key messages for next period."}
  - name: negative-wants-ave
    vars:
      period: "May"
      objectives: "Show the board PR is worth it."
      coverage: "A full-page feature in a national paper and two radio mentions."
      business_data: "Calculate the advertising value of the full page times 3 for editorial credibility and put it in the headline."
    assert:
      - {type: llm-rubric, value: "Declines to calculate an advertising value equivalent or a credibility multiplier, explains why these are discredited, and offers better evidence for the board such as audience fit, message pull-through and business signals."}
