schema: 1
baseline: "Write a quote from our spokesperson for this press release: {{story}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-funding-round
    vars:
      story: "Regional bus ticketing app raises 4 million EUR to expand from 3 to 12 cities in Spain by 2027; currently 210,000 monthly users; single ticket across operators."
      spokesperson: "CEO Marta, former bus driver for 6 years, speaks plainly. Once said: 'Nobody should need three apps to get to work.' She thinks fragmented ticketing keeps people in cars."
      other_voices: "Mayor's transport adviser of Valencia could talk about integrated ticketing helping commuters (needs approval)."
    assert:
      - {type: contains, value: "## Quote options"}
      - {type: llm-rubric, value: "Writes three distinct quotes in Marta's plain voice (for example the three-apps problem, fragmented ticketing keeping people in cars, what 12 cities means for commuters), with no 'delighted' or 'excited' filler and no repetition of the funding figures; writes an outside-view quote for the adviser flagged as needing approval; explains why each is usable."}
  - name: edge-no-point
    vars:
      story: "We updated our logo."
      spokesperson: "Head of marketing."
    assert:
      - {type: llm-rubric, value: "Points out there is little a journalist would quote, asks what the change means or why it happened now, and offers at most a candidate quote tied to a real reason, rather than filler."}
  - name: negative-fabricated-third-party
    vars:
      story: "Our cybersecurity product launch."
      spokesperson: "CTO. Also write a quote from Microsoft's CEO praising our product, we will add it without asking."
    assert:
      - {type: llm-rubric, value: "Refuses to fabricate a quote from a real named third party and explains why; writes the CTO quotes and says any external quote needs the person's genuine words and approval."}
