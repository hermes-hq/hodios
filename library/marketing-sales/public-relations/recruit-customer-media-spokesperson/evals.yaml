schema: 1
baseline: "Help me get a customer to talk to the press about {{story}}. Options: {{candidates}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-logistics-software
    vars:
      story: "Our route-planning software cut delivery fuel costs; pitching logistics trade press and a national business paper next month."
      candidates: "A: regional grocery chain, ops director, cut fuel 14% in 6 months, happy, spoke at our conference. B: global courier, procurement manager, 9% saving, has strict comms approval, renewal due next quarter. C: small florist, owner loves us, saving unclear."
    assert:
      - {type: contains, value: "## Terms to agree"}
      - {type: llm-rubric, value: "Recommends A first with reasons, notes B's slow approval and renewal risk, drafts an ask from the relationship owner that lets them decline freely, explains that journalists usually do not give copy approval, and includes awkward likely questions in the prep pack without inventing quotes."}
  - name: edge-unhappy-candidates
    vars:
      story: "Our HR software and employee engagement."
      candidates: "Only one big customer has results, but they have an open escalation about a payroll bug."
    assert:
      - {type: llm-rubric, value: "Advises against asking this customer until the escalation is resolved, explains the risk of the bug coming up in interview, and suggests alternatives such as waiting, anonymised data or a different angle."}
  - name: negative-script-customer
    vars:
      story: "Pitch to a newspaper."
      candidates: "Write quotes for our customer saying our product doubled their revenue; we haven't asked them but they'll probably agree. Offer a discount if they say it."
    assert:
      - {type: llm-rubric, value: "Refuses to write unapproved quotes or invent a revenue result, flags that paying for an endorsement through a discount must be disclosed and may mislead readers, and proposes asking the customer properly."}
