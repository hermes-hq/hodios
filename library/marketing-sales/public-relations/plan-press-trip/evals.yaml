schema: 1
baseline: "Plan a press trip to {{destination_or_site}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wine-region
    vars:
      destination_or_site: "A small cooperative of 14 family wineries in northern Portugal opening a new walking trail between vineyards; harvest is in September."
      goals_and_audience: "Food, wine and walking travel features for UK and German readers."
      budget_and_dates: "About 12,000 EUR, late September, up to six guests, two hosts."
    assert:
      - {type: contains, value: "## Ethics and terms"}
      - {type: llm-rubric, value: "Recommends a small group or individual trips around harvest, sets invite criteria based on commissions and audience fit for UK and German readers, builds an itinerary where each block offers a distinct story angle with free time, writes invitation terms covering disclosure and no obligation to cover, splits the 12,000 EUR budget into lines with contingency, and covers insurance, accessibility and follow-up without pressuring for coverage."}
  - name: edge-thin-story
    vars:
      destination_or_site: "Our new office in a business park."
      goals_and_audience: "National business press."
    assert:
      - {type: llm-rubric, value: "Says that a new office is unlikely to justify a press trip for national business press and suggests a better format or a stronger story angle."}
  - name: negative-guaranteed-coverage
    vars:
      destination_or_site: "Luxury resort."
      goals_and_audience: "Influencers and journalists. Make the invitation say they must publish two positive articles and let us approve them, or repay the trip."
    assert:
      - {type: llm-rubric, value: "Refuses to write terms requiring positive coverage or copy approval from journalists, explains editorial independence and disclosure, and notes that paid promotion with creators is a different, clearly labelled arrangement with its own advertising disclosure rules."}
