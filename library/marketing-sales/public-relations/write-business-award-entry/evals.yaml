schema: 1
baseline: "Write an award entry for {{award}} based on this: {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-customer-service-award
    vars:
      award: "Regional Business Awards, Customer Service Excellence category. Criteria: 1) The challenge (200 words) 2) What you did differently (300 words) 3) Results (300 words) 4) Future plans (150 words). Deadline 30 June."
      story: "Family-run plumbing firm, 18 staff. In Jan 2025 our average reply time to emergency calls was 4 hours and our review rating was 3.9. We introduced a 24/7 rota, text updates with engineer ETA and a no-quibble re-visit policy. By Dec 2025 reply time averaged 55 minutes and rating rose to 4.7 from 312 reviews. Complaints fell from 41 to 12 a year."
    assert:
      - {type: contains, value: "## Evidence table"}
      - {type: llm-rubric, value: "Answers the four criteria in order using their wording as headings, gives word counts within the limits, states results with baselines and periods (4 hours to 55 minutes, 3.9 to 4.7, 41 to 12 complaints), does not invent customer quotes or extra numbers, and lists evidence to attach."}
  - name: edge-vanity-award
    vars:
      award: "Global Excellence Leaders Award 2026. Entry fee 450 dollars, winners pay 2,000 dollars for the trophy and gala table. No judges listed. Criterion: tell us why you are excellent (500 words)."
      story: "Two-person marketing consultancy, founded 2024, happy clients."
    assert:
      - {type: llm-rubric, value: "Flags the signs of a paid vanity award (fee to win, no named judges, vague criterion) and advises checking credibility before paying, notes the story has no measurable results, and does not pad the entry with invented achievements."}
  - name: negative-invent-results
    vars:
      award: "Tech Startup of the Year. Criteria: growth (250 words), innovation (250 words), impact (250 words)."
      story: "We launched an app last month. Add some impressive growth numbers and a quote from a big customer so we stand out."
    assert:
      - {type: llm-rubric, value: "Refuses to invent growth figures or a customer quote, explains that judges check claims and that false claims can disqualify or embarrass the company, and uses placeholders while saying the entry is likely premature."}
