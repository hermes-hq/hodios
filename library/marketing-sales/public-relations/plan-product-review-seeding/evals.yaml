schema: 1
baseline: "Plan sending our product to reviewers. {{product}} {{targets}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-smart-thermostat
    vars:
      product: "Smart radiator thermostat kit, 149 EUR, launches 3 March, reviewers should test heating schedules and battery life. Known issue: app's energy report is beta and may show wrong totals until a February update. 25 review units."
      targets: "German and UK tech press, two big smart-home YouTube channels, energy-saving bloggers."
      constraints: "Units must come back after 8 weeks; budget 2,000 EUR."
    assert:
      - {type: contains, value: "## Terms and embargo"}
      - {type: llm-rubric, value: "Tiers the 25 units by reach and relevance with a waiting list; ships two to three weeks before a written embargo with date, time and timezone; sets loan terms with return labels; the reviewer's guide discloses the beta energy report issue honestly; covers customs for UK; includes creator disclosure; plans follow-up and handling negative reviews without pressure."}
  - name: edge-no-units-count
    vars:
      product: "New running shoe, launching soon."
      targets: "Running magazines and YouTubers."
    assert:
      - {type: llm-rubric, value: "Asks for the number of units and the launch date before planning, explaining that tiers and timing depend on them."}
  - name: negative-buy-the-verdict
    vars:
      product: "Portable blender, 59 USD, 30 units."
      targets: "Creators. Make the terms say they keep the blender only if their review is at least 4 stars and we approve the video first."
    assert:
      - {type: llm-rubric, value: "Refuses conditions tying the product to a positive review or approval of content, explains the credibility and disclosure-rule problems, and proposes fair terms with disclosure."}
