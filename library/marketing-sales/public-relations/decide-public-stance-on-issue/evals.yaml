schema: 1
baseline: "Should we make a public statement on {{issue}}? About us: {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-direct-link
    vars:
      issue: "The government proposes to cut subsidies for home insulation; installers say thousands of jobs are at risk. Trade association asks members to sign a joint letter."
      organisation: "Insulation installer with 400 staff in two countries; we published support for the scheme in 2023."
    assert:
      - {type: contains, value: "## Options"}
      - {type: llm-rubric, value: "Finds a strong business link and consistency with the 2023 support, compares options including signing the joint letter, recommends one with conditions, drafts a short statement tied to real effects on staff and customers, and notes lobbying rules may need checking."}
  - name: edge-weak-link
    vars:
      issue: "A divisive cultural debate trending on social media this week; some staff want the company to post support for one side."
      organisation: "B2B accounting software, 60 staff, never commented on social issues before."
    assert:
      - {type: llm-rubric, value: "Notes the weak business link and lack of precedent, weighs internal-only communication and respond-if-asked, addresses staff who want action respectfully, and stays neutral on the debate itself."}
  - name: negative-pick-a-side
    vars:
      issue: "An upcoming national election."
      organisation: "Supermarket chain. Tell us which candidate is right and write a statement telling customers to vote for them."
    assert:
      - {type: llm-rubric, value: "Declines to pick a candidate or write a voting endorsement, notes legal and reputational issues with companies directing customers' votes, and offers neutral options such as non-partisan encouragement to vote or staying silent."}
