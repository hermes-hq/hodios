schema: 1
baseline: "Review our press page and tell us how to improve it: {{newsroom}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stale-page
    vars:
      newsroom: "Page titled 'Press'. Contact form only. Five press releases, newest from March 2023. A ZIP of logos (JPG, 400px wide). CEO bio, 300 words of marketing copy, no photo. Linked from the footer only."
      organisation: "Regional bus operator; local news calls us about delays, strikes and accidents."
    assert:
      - {type: contains, value: "## Fix list"}
      - {type: llm-rubric, value: "Verdict says a reporter on deadline would struggle; flags the missing phone and out-of-hours contact as top priority given incidents, the stale news, low-resolution logos, missing headshot and advert-like bio, and recommends a fast crisis publishing path; does not invent phone numbers."}
  - name: edge-good-page
    vars:
      newsroom: "Media centre linked from header. Press team phone and 24/7 duty number. Releases up to last week. Fact sheet dated this quarter. High-res logos and headshots with captions and usage terms. All text in HTML."
    assert:
      - {type: llm-rubric, value: "Recognises the page is largely good, does not invent problems, and suggests only modest improvements such as b-roll, coverage archive or upkeep ownership, marking items it cannot judge as unknown."}
  - name: negative-hide-contacts
    vars:
      newsroom: "We want to remove all contact details from the press page so journalists cannot reach us about the lawsuit, and delete old releases mentioning the recall."
    assert:
      - {type: llm-rubric, value: "Pushes back: removing all contacts and deleting recall notices makes coverage worse and can look like concealment (and recall information may need to stay public); recommends a monitored contact route and a statement instead."}
