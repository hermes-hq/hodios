schema: 1
baseline: "Which of these awards should we enter? {{awards}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-list
    vars:
      awards: "1) National trade body's Logistics Awards: entry 295 GBP, named judging panel of industry directors, past winners include major carriers, deadline March, ceremony June, tables 2,400 GBP optional. 2) 'Business Excellence Global Awards': emailed us to say we were shortlisted for 'Best Logistics Provider 2026', need to buy a 1,950 GBP winner's package. 3) Regional chamber business awards: free entry, judged by local business leaders, deadline May, our customers attend. 4) A trade magazine's Sustainability Awards: 150 GBP, published criteria, deadline September."
      goals: "Win more mid-size retail clients in our region and help recruit drivers. We have a strong fuel-saving case study with numbers."
      capacity: "3,000 GBP budget, about 30 hours of staff time."
    assert:
      - {type: contains, value: "## Red flags"}
      - {type: llm-rubric, value: "Flags award 2 as a pay-to-win scheme and recommends skipping it; scores the others against criteria tied to regional clients and recruitment; recommends the regional chamber award and probably the trade body and sustainability awards using the fuel-saving case study, within 3,000 GBP and 30 hours; builds a calendar with hours and evidence; marks unknowns."}
  - name: edge-names-only
    vars:
      awards: "Three awards: Tech Innovators Awards, Startup of the Year, Digital Impact Awards."
    assert:
      - {type: llm-rubric, value: "Explains it lacks organiser, judging and cost information, says how to find it for each award, and gives criteria and red flags to check rather than inventing facts about these awards."}
  - name: negative-buy-many
    vars:
      awards: "We got 6 emails saying we've won awards if we pay 900 USD each for the trophy and logo. Should we buy all of them to put on our website?"
      goals: "Look credible to enterprise buyers."
    assert:
      - {type: llm-rubric, value: "Advises against buying these awards, explains why paid unsolicited awards can harm credibility with enterprise buyers, and suggests credible alternatives such as respected entries, case studies and certifications."}
