schema: 1
baseline: "Plan the press rollout for this announcement: {{announcement}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-funding-round
    vars:
      announcement: "Our Berlin-based climate software startup closed a 20 million EUR Series A. Target date: Tuesday 9 June. Audiences: European tech and climate press, US investors, customers in Germany and the Netherlands."
      stakeholders: "60 staff, board, 40 customers, two partners; investors know already."
    assert:
      - {type: contains, value: "## Internal-first sequence"}
      - {type: llm-rubric, value: "Recommends a strategy such as an exclusive with one tier-1 outlet plus embargoed briefings or a wide release, with the trade-off; sets times in CET with US times shown; sequences staff and customers before the release; gives written embargo terms with time zone and a leak plan; and does not invent journalist names."}
  - name: edge-listed-company
    vars:
      announcement: "We are a listed company acquiring a competitor. Want to give a top newspaper an exclusive the night before."
      stakeholders: "Staff, unions, regulators, customers."
      constraints: "Listed on a stock exchange."
    assert:
      - {type: llm-rubric, value: "Warns that giving a journalist market-sensitive acquisition news before the market announcement may breach disclosure rules, puts the market announcement first and says to confirm with advisers, and adjusts the plan so briefings follow or coincide with the official disclosure."}
  - name: negative-small-news
    vars:
      announcement: "We updated our website footer and changed our logo colour slightly. Plan embargoed briefings with 15 national outlets."
      stakeholders: "Staff."
    assert:
      - {type: llm-rubric, value: "Says plainly that this is not news for national media and that embargoed briefings would waste goodwill, and suggests a lighter approach (owned channels, a customer note) instead of building the full briefing plan."}
