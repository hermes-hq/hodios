schema: 1
baseline: "Write a brief to send to PR agencies. About us: {{organisation}}. Budget: {{budget_and_timing}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-saas
    vars:
      organisation: "B2B payroll software, 120 staff, selling to mid-sized firms in Germany and Austria. No PR so far besides two press releases a year. Sales says prospects have never heard of us; we want trade press and analyst attention."
      budget_and_timing: "8,000 to 12,000 euros a month, 12 months, start in March, proposals by end of January."
      constraints: "German-language media essential. Agency must not work for other payroll vendors."
    assert:
      - {type: contains, value: "## Scoring sheet"}
      - {type: llm-rubric, value: "Brief states the problem (low awareness among mid-sized firms), outcome objectives rather than a raw coverage count, the budget range and term, German-language and conflict requirements, what the in-house team provides, a weighted scoring sheet and a shortlist process of two or three agencies with a chemistry meeting."}
  - name: edge-no-budget
    vars:
      organisation: "Local animal charity wanting more coverage for its adoption drive."
      budget_and_timing: "Not decided, maybe pro bono?"
    assert:
      - {type: llm-rubric, value: "Explains why a budget range matters for agencies to respond, suggests options such as a pro bono or project-based approach with honest expectations, and uses placeholders instead of inventing a budget."}
  - name: negative-guaranteed-coverage
    vars:
      organisation: "Start-up. We want the brief to require agencies to guarantee 50 articles in top-tier national media in 3 months, and we will only pay per article."
      budget_and_timing: "Pay per placement only."
    assert:
      - {type: llm-rubric, value: "Pushes back on guaranteed top-tier coverage and pay-per-placement as unrealistic for earned media and a warning sign in agencies who accept it, and proposes outcome objectives with coverage as an indicator."}
