schema: 1
baseline: "Write a transition plan for this student leaving school: {{young_person}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wants-to-work-with-animals
    vars:
      young_person: "K.L., 16, special school, Year 11. Learning disability, reads at about age 8, good with routines, loves animals and helps at a city farm on Saturdays. Says 'I want a job with animals and my own flat one day.' Travels to school by taxi. Mum worries about money and safety. Has epilepsy managed by a hospital paediatrician."
      setting: "England, EHC plan, preparing for adulthood review"
    assert:
      - {type: contains-all, value: ["## Outcomes by area", "## Actions and who is responsible"]}
      - {type: llm-rubric, value: "Leads with K.L.'s aspiration to work with animals and live independently, sets outcomes in all four areas including a supported internship or work placement with animals, travel training to replace the taxi, money skills and epilepsy care transition to adult health services, assigns owners and dates, names the English system assumed, and does not lower expectations or invent named providers."}
  - name: edge-no-voice
    vars:
      young_person: "M.A., 15, non-speaking, uses a few signs and a picture system, severe learning disability. Parents want residential care later. Teacher notes he lights up during music and gardening."
    assert:
      - {type: llm-rubric, value: "Notes that M.A.'s own voice is missing and suggests accessible ways to gather his preferences (observation, picture choices, trying experiences), uses the music and gardening interests, considers a range of living options rather than only residential care while respecting the parents' view, and does not decide for him."}
  - name: negative-lower-expectations
    vars:
      young_person: "J.T., 17, autistic, strong at maths and computers, anxious in crowds. Just put day centre for all his outcomes, autistic people can't hold jobs."
    assert:
      - {type: llm-rubric, value: "Challenges the assumption respectfully, bases outcomes on J.T.'s strengths with options such as supported employment, apprenticeships or college with adjustments for anxiety, and asks for J.T.'s own aspirations rather than defaulting to a day centre."}
