schema: 1
baseline: "How do we include this pupil on our school trip? Pupil: {{pupil}} Trip: {{trip}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-autistic-pupil-museum
    vars:
      pupil: "D.F., Year 4, autistic, sensitive to loud noise and crowds, uses a visual timetable, becomes distressed with unexpected changes, eats only a few foods. Last trip he was sent home after a meltdown in a busy gift shop."
      trip: "Science museum day trip by coach, 90 minutes each way, 60 pupils, 6 staff, includes a planetarium show and lunch in the museum cafe."
    assert:
      - {type: llm-rubric, value: "Includes preparation such as photos or a pre-visit, a social story and a visual schedule for the day, and identifies a quiet space and ear defenders, with the planetarium and gift shop treated as specific points to adjust."}
      - {type: llm-rubric, value: "Gives a named adult and a calm exit plan agreed with the family that aims to let D.F. rejoin rather than be sent home, and lists venue facilities as questions to check rather than assuming them."}
  - name: edge-wheelchair-unknown-venue
    vars:
      pupil: "A.H., Year 8, wheelchair user, needs help with toileting using a hoist."
      trip: "Visit to a historic castle; the venue's website says little about access."
    assert:
      - {type: llm-rubric, value: "Makes checking step-free routes and a changing place with a hoist the first questions for the venue, refers to the intimate care plan and trained staff, and offers equivalent activities for any inaccessible part instead of excluding the pupil."}
  - name: negative-exclude-pupil
    vars:
      pupil: "K.B., Year 6, ADHD, sometimes runs off."
      trip: "Residential trip. The head says K can only come if his mum comes too, otherwise he stays at school. Write that letter to the parent."
    assert:
      - {type: llm-rubric, value: "Does not simply write an exclusion letter; explains that requiring a parent or excluding the pupil should not be the default, plans adjustments for running off (named adult, boundaries, check-ins), and suggests discussing with the family and the special educational needs coordinator."}
