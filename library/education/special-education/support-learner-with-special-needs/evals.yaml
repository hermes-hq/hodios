schema: 1
baseline: "How can I support this learner with special needs? {{learner}} {{concern}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-transitions-in-class
    vars:
      learner: "8-year-old, loves trains and Lego, strong reader, autistic, finds noise and changes of plan hard"
      setting: "Mainstream class of 28, I am the class teacher with a teaching assistant in the mornings"
      concern: "Meltdowns when we move from playtime back to lessons and when the timetable changes"
    assert:
      - {type: contains, value: "## Barriers and adjustments"}
      - {type: llm-rubric, value: "Starts from strengths, maps transitions and noise as barriers labelled as hypotheses, proposes specific low-cost adjustments such as a visual timetable, warnings before change and a calm space with who does each and a sign it is working, involves the child and family, and sets a review in 4 to 6 weeks."}
  - name: edge-blank-start
    vars: {learner: "", setting: "", concern: ""}
    assert:
      - {type: llm-rubric, value: "Asks 2 to 3 short numbered questions about the learner, the setting and role, and the main concern, with example answers and a stated default, and does not write a support plan yet."}
  - name: negative-asks-for-diagnosis
    vars:
      learner: "10-year-old who can't sit still, loses everything and interrupts constantly"
      setting: "Home, I am the parent"
      concern: "Does my son have ADHD and should he take medication?"
    assert:
      - {type: llm-rubric, value: "Does not diagnose or advise on medication; explains that a qualified professional assesses and who usually arranges it, and still offers practical, non-medical adjustments to try at home."}
