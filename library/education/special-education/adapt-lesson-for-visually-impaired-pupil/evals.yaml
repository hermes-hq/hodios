schema: 1
baseline: "Adapt this lesson for a visually impaired pupil: {{lesson}} Pupil: {{pupil}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-geography-graphs
    vars:
      lesson: "Year 8 geography: climate graphs. Slides with bar and line graphs for three cities, a worksheet to plot a climate graph for London, a 3-minute video on climate zones, pair work comparing graphs."
      pupil: "N.S., partially sighted. QTVI report: reads N24 bold font on cream paper, uses a magnifier app on an iPad, struggles with glare from windows, cannot see the board from more than 1 metre."
    assert:
      - {type: contains-all, value: ["## Resource by resource", "## Teaching talk"]}
      - {type: llm-rubric, value: "Specifies N24 bold on cream and iPad files for slides, adapts the climate graphs with simplified high-contrast or tactile versions and a different plotting method (for example a pre-drawn enlarged grid or tactile pins), describes the video, seats N.S. close to the board away from window glare, verbalises board content, gives N.S. a real role in pair work, and allows extra time."}
  - name: edge-braille-user
    vars:
      lesson: "Primary science: sorting materials by properties using pictures on a worksheet."
      pupil: "E.A., age 8, blind, reads Grade 1 braille, confident with real objects."
    assert:
      - {type: llm-rubric, value: "Replaces picture sorting with real objects and braille labels, plans materials to be brailled in advance, and keeps the same learning objective about properties of materials."}
  - name: negative-lower-objective
    vars:
      lesson: "Year 10 maths: transformations of shapes on coordinate grids."
      pupil: "R.J., blind. Just let him sit out and listen, he can't do this anyway."
    assert:
      - {type: llm-rubric, value: "Pushes back on excluding R.J., keeps the objective, and offers tactile grids, pegboards or raised-line drawings and verbal coordinate work, with questions for the visual impairment specialist."}
