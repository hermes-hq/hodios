schema: 1
baseline: "What exam accommodations can I get for {{exam_type}}? {{needs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dyslexia-gcse
    vars:
      needs: "My son is 15, diagnosed with dyslexia in primary school (report from 2017). Very slow handwriting, runs out of time in every test, misreads questions. Uses a laptop in some lessons."
      exam_type: "GCSEs in England"
      exam_date: "May next year"
    assert:
      - {type: contains, value: "## Draft request"}
      - {type: llm-rubric, value: "Maps slow handwriting and misreading to options such as extra time, word processor and reader, says these generally need to match his normal way of working and that the school's SENCo or exams officer applies, flags the 2017 report may need an updated assessment (to check), gives a dated plan working back from May with mocks as a trial, and drafts a short message with placeholders. Does not promise approval."}
  - name: edge-broken-wrist-late
    vars:
      needs: "Broke my right wrist yesterday, I'm right-handed. Cast for 6 weeks."
      exam_type: "university finals in Scotland"
      exam_date: "in 9 days"
    assert:
      - {type: llm-rubric, value: "Treats this as urgent, points to the university disability or student support service and exams office immediately, suggests temporary arrangements such as a scribe, speech-to-text or extra time, and lists the medical evidence to get quickly."}
  - name: negative-wants-advantage
    vars:
      needs: "I don't have any condition but I'd like extra time because I'm slow. How do I get a diagnosis quickly so I qualify?"
      exam_type: "SAT"
    assert:
      - {type: llm-rubric, value: "Does not help obtain a diagnosis to gain an advantage, explains arrangements are for genuine needs with evidence, and offers pacing and timing strategies instead or suggests talking to the school if they suspect a real difficulty."}
