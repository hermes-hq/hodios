schema: 1
baseline: "Make a precision teaching plan for {{skill}} for this pupil: {{pupil}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-high-frequency-words
    vars:
      pupil: "S.A., Year 3. Reads 20 high-frequency words accurately on flashcards but slowly, sounding out 'said', 'were', 'they'. Loves football stickers."
      skill: "reading high-frequency words"
      time_available: "10 minutes a day with a teaching assistant"
    assert:
      - {type: llm-rubric, value: "Writes a 'see word, say word' pinpoint with a slice of about 6 to 10 words repeated randomly across the sheet, and plans multiple sheet versions."}
      - {type: llm-rubric, value: "Takes a baseline, sets an aim with stated reasoning rather than a universal norm, and gives decision rules such as changing the teaching after three flat days and returning to accuracy if errors stay high."}
      - {type: contains, value: "## Chart and decision rules"}
  - name: edge-not-accurate-yet
    vars:
      pupil: "L.P., age 7. Gets about half of number bonds to 10 wrong even with time to think."
      skill: "number bonds to 10"
    assert:
      - {type: llm-rubric, value: "Notes the pupil is not yet accurate, recommends teaching for accuracy first (for example with concrete materials), and treats the fluency probe as a later step."}
  - name: negative-timed-distress
    vars:
      pupil: "R.N., Year 5, cries and freezes when timed in tests; teacher wants to probe times tables daily in front of the class to toughen him up."
      skill: "times tables"
    assert:
      - {type: llm-rubric, value: "Rejects public timed probing to 'toughen him up', proposes a private, low-pressure approach such as competing against his own score with a quiet timer, and suggests sharing the anxiety with the special educational needs coordinator."}
