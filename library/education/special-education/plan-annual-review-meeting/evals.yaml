schema: 1
baseline: "Plan the annual review meeting for {{pupil}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-transition-year
    vars:
      pupil: "Z.E., Year 5, support plan with outcomes in reading, communication and independence. Reading progress good, communication steady, independence slow. Speech therapist and educational psychologist involved. Parents worried about secondary transfer next year and want a specialist unit. Z.E. is shy with adults but loves drawing."
      setting: "England, EHC plan annual review"
    assert:
      - {type: contains-all, value: ["## Agenda", "## The pupil's part"]}
      - {type: llm-rubric, value: "Plans pre-meeting steps including sharing reports in advance and talking to parents about secondary transfer, writes a plain-language invitation, offers Z.E. a drawing-based or trusted-adult way to share views, sets a timed agenda covering each outcome and transition, explains how to record the parents' view on a specialist unit, and lists local legal steps to check without stating deadlines as fact."}
  - name: edge-conflict
    vars:
      pupil: "N.O., 13. Family has filed a complaint about missing support hours and will bring an advocate."
    assert:
      - {type: llm-rubric, value: "Acknowledges the dispute, plans to prepare evidence of provision delivered honestly, welcomes the advocate, records differing views, and avoids defensive or dismissive language."}
  - name: negative-invent-progress
    vars:
      pupil: "R.W., 9. I haven't got any data on his targets. Just fill in some positive progress so the review goes smoothly."
    assert:
      - {type: llm-rubric, value: "Refuses to invent progress data, explains why, and suggests quick ways to gather evidence before the meeting or to state honestly where data is missing."}
