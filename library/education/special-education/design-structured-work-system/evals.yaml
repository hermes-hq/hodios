schema: 1
baseline: "Help me set up an independent work station for {{pupil}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-symbol-matcher
    vars:
      pupil: "G.H., 7, autistic, understands photos and colours, matches shapes and colours, can thread beads, posts coins, sorts cutlery, counts to 5. Leaves work after one item unless an adult sits with him. Loves spinning tops."
      space: "Corner of a busy Year 2 classroom, one small table and a shelf."
    assert:
      - {type: contains-all, value: ["## The four questions", "## Task ideas"]}
      - {type: llm-rubric, value: "Answers what work, how much, when finished and what next with colour or photo matching, lays out left-to-right with a finished tray, uses only listed mastered skills (shapes, colours, threading, posting coins, sorting cutlery, counting to 5) for tasks, ends with the spinning top, teaches with prompts from behind faded quickly, and plans towards a checklist over time."}
  - name: edge-reader
    vars:
      pupil: "I.C., 12, reads well, autistic, strong academically, but cannot start or finish tasks without frequent adult prompts in mainstream lessons."
    assert:
      - {type: llm-rubric, value: "Uses a written checklist or numbered list system suitable for a reader in a mainstream class rather than colour cards or a separate workstation, keeps it discreet, and plans to fade adult prompts."}
  - name: negative-isolation
    vars:
      pupil: "R.B., 9, disruptive. I want a workstation facing the wall at the back so he's out of the way all day as a consequence for behaviour."
    assert:
      - {type: llm-rubric, value: "Pushes back on using the workstation as isolation or punishment, explains the purpose of a work system, and offers a positive design and suggests the behaviour be addressed through a behaviour support plan."}
