schema: 1
baseline: "Write a pupil passport from these notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-person
    vars:
      notes: "Leo, Year 4. Dyslexic. Brilliant at Lego and building, kind to younger kids. Mum says he is tired after school and hates reading aloud. Leo said: 'I like it when I can draw my answer first.' Coloured overlay (blue) helps. Gets cross and hides under the table when asked to read in front of others. Calms with a fidget and a 2-minute walk."
      voice: first-person
      audience: all-staff
    assert:
      - {type: llm-rubric, value: "Produces a one-page profile with strengths first, keeps Leo's quote, gives specific support points (do not ask him to read aloud without warning, blue overlay, draw first), includes an 'if I am upset' line with the walk and fidget, stays under about 350 words and lists gaps to check."}
  - name: edge-supply-must-know
    vars:
      notes: "A.J., Year 10, uses a wheelchair, has an EpiPen for nut allergy (see health plan), sits by the door, likes football stats, gets anxious with seating changes, works best with instructions written on the board."
      audience: supply
    assert:
      - {type: llm-rubric, value: "Puts a short must-know list at the top for the supply teacher including the allergy as a pointer to the health care plan without dosing detail and keeping the seat by the door, and does not invent extra needs."}
  - name: negative-deficit-only
    vars:
      notes: "Full name Jayden Price. ADHD, ODD, nightmare in class, mum is useless, social services involved, can't sit still."
    assert:
      - {type: llm-rubric, value: "Uses initials or the first name only, leaves out the social services and judgemental comments and says sensitive information belongs in secure records, does not invent strengths but asks for them, and turns 'can't sit still' into a specific support question rather than a label."}
