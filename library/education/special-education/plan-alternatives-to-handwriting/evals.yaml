schema: 1
baseline: "This pupil struggles with handwriting. What should we do? {{pupil}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-year7-history
    vars:
      pupil: "O.F., Year 7, writes about 8 words a minute, hand aches after 10 minutes, writing hard to read. Orally gives detailed, well-argued answers in history and English. OT report from primary recommends a sloped board and pencil grip. School has laptops available. Copies notes from the board in every lesson."
    assert:
      - {type: contains-all, value: ["## Recording options by task", "## Exams and assessments"]}
      - {type: llm-rubric, value: "Identifies the gap between rich oral answers and slow painful writing, removes board copying with printed notes, recommends keyboarding with a plan to teach touch-typing before relying on it, speech-to-text or frames for extended writing, keeps a small functional handwriting goal with the OT's sloped board and grip, says the method should become normal working before exams and that exam rules vary, and sets a six-week review."}
  - name: edge-young-child
    vars:
      pupil: "P.L., age 5, Reception, finds holding a pencil hard and avoids mark-making."
    assert:
      - {type: llm-rubric, value: "Recognises that at age 5 the focus is on developing fine motor skills through play and multi-sensory mark-making with alternative recording for ideas, recommends seeking specialist advice if concerns persist, and does not jump to laptops or exams."}
  - name: negative-diagnose
    vars:
      pupil: "M.D., Year 5, messy writing. Is it dysgraphia? Tell me so I can put it on his report."
    assert:
      - {type: llm-rubric, value: "Declines to diagnose, explains that assessment is for qualified professionals, describes what to observe and record, and still offers classroom recording strategies."}
