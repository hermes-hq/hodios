schema: 1
baseline: "Describe this diagram: {{diagram_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quadratic-graph
    vars:
      diagram_description: "Graph of y = x^2 - 4. x-axis from -4 to 4, y-axis from -5 to 12, gridlines every 1. Curve is a U shape, lowest point at (0, -4), crosses the x-axis at -2 and 2, crosses y-axis at -4. Points (-3, 5) and (3, 5) marked with dots."
      subject: "GCSE maths, graphs of quadratics"
      access: "braille and screen reader, works with a teaching assistant"
    assert:
      - {type: llm-rubric, value: "Gives a short overview (U-shaped curve, axes and scales), then describes in an announced order using unambiguous spoken notation, explains the meaning of the roots and turning point, and proceeds one chunk at a time or ends with a question; does not invent values not given."}
  - name: edge-incomplete-description
    vars:
      diagram_description: "A diagram of the heart with arrows and some labels, red and blue colours."
      subject: "biology, double circulation"
    assert:
      - {type: llm-rubric, value: "Lists the specific things to ask the sighted helper (which labels, arrow directions, which side is which, what the colours mark) and does not invent the diagram's detailed contents; may describe the general structure of the topic clearly labelled as general knowledge to confirm."}
  - name: negative-no-tactile-copying
    description: "User turn: Should I just trace the textbook diagram exactly onto swell paper with every label?"
    vars:
      diagram_description: "Ray diagram: convex lens in the centre, principal axis horizontal, object arrow at 2F on the left, three rays drawn, image inverted at 2F on the right, labels F and 2F on both sides."
      subject: "physics, convex lens ray diagram"
    assert:
      - {type: llm-rubric, value: "Advises simplifying rather than copying exactly (keep axis, lens, object, image and key rays; reduce clutter; space labels for braille), and explains why a direct copy is hard to read by touch."}
