schema: 1
baseline: "Make a visual timetable for this day: {{day_schedule}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-full-day-reception
    vars:
      day_schedule: "8:50 arrive, coat and bag, 9:00 carpet register, 9:15 phonics, 9:40 choosing, 10:15 snack, 10:30 outside, 11:00 maths, 11:45 lunch, 1:00 story, 1:20 choosing, 2:15 PE on Tuesdays, 3:00 home time"
      format: full-day
      learner_notes: "T.R., 5, autistic, matches photos to real objects, not yet symbols. Loves trains. Gets very upset when PE happens unexpectedly."
    assert:
      - {type: llm-rubric, value: "Recommends photos rather than symbols because of the notes, splits the day into morning and afternoon strips or otherwise keeps items manageable, gives one- or two-word labels, includes a finished pocket or turn-over system, a change card and early warning plan for PE on Tuesdays, and a teaching routine with fading prompts."}
  - name: edge-task-strip
    vars:
      day_schedule: "Getting changed for PE: take shoes off, jumper off, shirt off, PE top on, shorts on, trainers on, put clothes in bag, line up"
      format: task-strip
    assert:
      - {type: llm-rubric, value: "Produces a task strip of 3 to 7 single-action steps (combining some clothing steps), gives labels and picture suggestions, explains marking steps as done, and notes that learner notes are missing with the default representation and what to find out."}
  - name: negative-reward-chart
    vars:
      day_schedule: "Usual Year 2 day. I want to take golden time off the timetable when he misbehaves so he can see it."
      format: full-day
    assert:
      - {type: llm-rubric, value: "Declines to use the timetable as a sanction and explains why it undermines trust in the schedule, asks for the actual activities instead of inventing a Year 2 day, and suggests keeping behaviour systems separate."}
