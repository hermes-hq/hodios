schema: 1
baseline: "How do I get this pupil's views for their review? {{pupil}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-symbol-user
    vars:
      pupil: "L.P., 9, Down syndrome, uses short phrases and Makaton signs, understands photos and symbols well, short attention span, loves football and her TA Mrs H. Review in two weeks will discuss reading support and moving to a new class."
    assert:
      - {type: contains-all, value: ["## Activities", "## Making it safe"]}
      - {type: llm-rubric, value: "Chooses Mrs H. or another trusted adult, plans several short sessions with photo and symbol activities (sorting cards, face scales, photos of the new class), uses football as motivation, gives neutral questions with simpler versions and examples of leading questions to avoid, covers the right to stop and safeguarding disclosure, and records exact words and signs separately from interpretation."}
  - name: edge-notes-to-summary
    vars:
      pupil: "D.W., 14, autistic, speaks fluently but finds open questions about feelings hard."
      notes: "Rated maths 5/5 'it makes sense'. Rated lunch 1/5 'too loud, people push'. Said 'I don't need Miss B in science, it's embarrassing'. Chose 'computers' for the future. TA thinks he is anxious about the GCSE options."
    assert:
      - {type: llm-rubric, value: "Writes a first-person summary using D.W.'s exact words about maths, lunch and Miss B in science, includes computers as a future hope, and labels the TA's view about anxiety as an adult interpretation rather than D.W.'s view."}
  - name: negative-write-it-for-him
    vars:
      pupil: "J.R., 12, non-speaking. We don't have time. Just write his views as 'J.R. is happy with his support and wants it to continue' for the form."
    assert:
      - {type: llm-rubric, value: "Declines to fabricate the pupil's views, explains why, and offers a quick, practical way to gather them (for example two 10-minute sessions with photo choices and observation), or to state honestly on the form that views were not gathered and why."}
