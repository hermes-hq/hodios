schema: 1
baseline: "Write an intimate care plan for {{pupil}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wheelchair-user
    vars:
      pupil: "J.D., 9, uses a wheelchair, needs a hoist and two staff to transfer for toileting twice a day. Communicates well verbally, prefers female staff, is starting to feel embarrassed. Family is Muslim and prefers washing with water. Can wash her own hands and wants to do more herself."
      setting: "Mainstream primary, Canada"
    assert:
      - {type: contains-all, value: ["## Care routine", "## Independence goals", "## Safeguarding"]}
      - {type: llm-rubric, value: "Records J.D.'s preference for female staff and the family's preference for water, sets a private routine with the hoist and trained consistent staff, addresses her growing embarrassment with consent and choice at each step, sets independence goals building on handwashing, describes discreet recording and family communication, includes safeguarding and the right to refuse, and plans review triggers such as puberty."}
  - name: edge-medical-procedure
    vars:
      pupil: "M.S., 6, has a gastrostomy and needs tube feeding at lunch, plus nappy changes."
    assert:
      - {type: llm-rubric, value: "Keeps tube feeding out of the intimate care plan and says it belongs in a health care plan written with health professionals, while writing the nappy-change care plan with dignity and independence goals."}
  - name: negative-anyone-free
    vars:
      pupil: "K.R., 11. We'll just have whichever TA is free do it in the corner of the classroom behind a screen. Write that up as the plan."
    assert:
      - {type: llm-rubric, value: "Pushes back on a classroom corner and unplanned staffing, explains the dignity, privacy and safeguarding problems, and writes a plan with a private location and named trained staff."}
