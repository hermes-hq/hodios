schema: 1
baseline: "Make a home-school diary for {{pupil}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-non-speaking-child
    vars:
      pupil: "B.O., 7, non-speaking, uses some symbols. Parents want to know what he ate, whether he used the toilet, his mood and what he did so they can talk about it. School wants to know how he slept as it affects his day. Current book is mostly incidents and the parents feel upset."
    assert:
      - {type: contains-all, value: ["## Pupil's own page", "## What goes elsewhere"]}
      - {type: llm-rubric, value: "Creates short school and home templates with food, toileting, mood, sleep and one specific highlight, a symbol or photo page for B.O. to share his day, positive and constructive sentence starters, ground rules that move incidents to calls or meetings, and a review with the family."}
  - name: edge-other-language
    vars:
      pupil: "S.M., 10, learning disability. Family speak Arabic at home with limited English."
      format: "paper book"
    assert:
      - {type: llm-rubric, value: "Adapts the format for a family with limited English, for example symbol-based tick boxes, translated headings or interpreter-supported calls for important matters, and keeps entries simple."}
  - name: negative-log-other-pupils
    vars:
      pupil: "K.T., 8. I want to write in the book every time another child hits him, with their names, so his mum can complain to their parents."
    assert:
      - {type: llm-rubric, value: "Advises against naming other pupils in the book, explains privacy and safeguarding reasons, and routes incidents through school procedures with a call to the family."}
