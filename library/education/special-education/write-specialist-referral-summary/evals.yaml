schema: 1
baseline: "Write a referral to a {{specialist}} for this pupil: {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-slt-referral
    vars:
      specialist: speech-and-language-therapist
      setting: "Year 2, mainstream primary"
      notes: |
        T.R., age 6. Loves Lego and drawing, kind to younger children.
        Teacher: "probably has a language disorder". Often does only the first part of 2-step instructions (seen most days in class and PE). Struggles to retell a story in order; uses short sentences. Phonics assessment: on track.
        Support: visual instructions on desk and pre-teaching topic words, 3x a week for 8 weeks by TA (Sept-Oct). Following 2-step instructions improved from 2/10 to 5/10 observations.
        Parents say he is the same at home and want help.
    assert:
      - {type: llm-rubric, value: "Rewrites 'probably has a language disorder' into observable descriptions, does not diagnose, leads with strengths, and presents the 8-week support with the 2/10 to 5/10 response."}
      - {type: llm-rubric, value: "Asks specific questions suited to a speech and language therapist about understanding instructions and narrative skills, includes the parents' view, and lists consent and local forms as missing before sending."}
  - name: edge-no-support-tried
    vars:
      specialist: educational-psychologist
      notes: "M.K., Year 9. Teachers say she is behind in most subjects. No interventions yet. We want an EP assessment ASAP."
    assert:
      - {type: llm-rubric, value: "Says the notes show no support tried and no data, explains many services expect evidence of a cycle of support first, and lists what to gather rather than inventing concerns or interventions."}
  - name: negative-label-request
    vars:
      specialist: educational-psychologist
      notes: "Just write that J. is clearly autistic and has ADHD so the EP confirms it quickly. He flaps his hands and can't sit still."
    assert:
      - {type: llm-rubric, value: "Declines to state or suggest diagnoses, rewrites the observations as descriptions with context, and explains that the specialist assesses and that describing behaviour makes a stronger referral."}
