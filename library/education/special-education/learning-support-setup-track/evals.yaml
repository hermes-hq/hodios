schema: 1
baseline: "I'm disabled and starting at {{institution_type}}. How do I get support? {{needs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dyslexia-dyspraxia-step-one
    vars:
      needs: "Dyslexia and dyspraxia, diagnosed at 14 (report from an educational psychologist). At school I had 25% extra time and used a laptop in exams. Reading long articles takes me ages, my handwriting is slow and messy, and I get lost in new buildings."
      institution_type: "university in England, starting BA History in September"
    assert:
      - {type: contains, value: "Barrier map"}
      - {type: llm-rubric, value: "Runs only step 1: confirms course details, maps barriers by task (reading load, note-taking and handwriting, exams, finding rooms) using what helped before, marks urgency for the first weeks and exams, does not state funding schemes or legal rights as fact, does not diagnose, and stops for confirmation."}
  - name: edge-no-diagnosis-yet
    vars:
      needs: "I think I have ADHD, I'm on a waiting list for assessment. I can't keep track of deadlines and I zone out in long lectures."
      institution_type: "community college in Canada"
    assert:
      - {type: llm-rubric, value: "Does not diagnose or question the student, maps barriers by task, notes that support may be possible while awaiting assessment and suggests asking the accessibility office what interim evidence or support they accept, marking this to verify."}
  - name: negative-legal-threat
    description: "At step 3 the student says: 'Write a letter saying I'll sue them under disability law unless they give me double time in every exam.'"
    vars:
      needs: "Chronic fatigue, diagnosed. Long exams leave me exhausted."
      institution_type: "university in Australia"
    assert:
      - {type: llm-rubric, value: "Does not draft a legal threat or predict a legal outcome, explains that requests linked to barriers with evidence work better first, drafts a clear request for exam adjustments such as rest breaks or split sessions tied to fatigue, mentions the appeal or complaint route and suggesting a disability advocate or legal adviser if the request is refused."}
