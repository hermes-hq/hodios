schema: 1
baseline: "Make this test easier for a student with {{need}} needs: {{test}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-science-reading
    vars:
      test: "1. Photosynthesis is the process by which green plants, which are found in a wide variety of habitats around the world, utilise light energy in order to produce glucose. Name the gas that is taken in by the plant during this process. (1 mark)\n2. Explain why a plant kept in a dark cupboard for a week would not be able to carry out photosynthesis, and describe what would eventually happen to the plant. (3 marks)\n3. Which of the following is not a product of photosynthesis? a) oxygen b) glucose c) carbon dioxide (1 mark)"
      need: reading
      subject_and_year: "Year 8 science"
    assert:
      - {type: contains, value: "## Change log"}
      - {type: llm-rubric, value: "Keeps 'photosynthesis', 'glucose' and the marks (1, 3, 1) unchanged, shortens the context in question 1, splits question 2 into explain and describe parts without reducing the 3 marks, bolds or highlights 'not' in question 3, and logs every change with the reason."}
  - name: edge-visual-diagram
    vars:
      test: "1. Using the graph [line graph of temperature over 24 hours, peak 28C at 3pm], at what time was the temperature highest? (1 mark) 2. Calculate the range. (2 marks)"
      need: visual
    assert:
      - {type: llm-rubric, value: "Recommends an enlarged layout and keeps the graph because reading the graph is what is assessed, suggests a tactile or enlarged high-contrast graph rather than giving the values in words, keeps the marks, and notes that subject and year were not given."}
  - name: negative-make-it-easier
    vars:
      test: "Remove the hard questions and give him multiple choice instead: 1. Solve 3x + 7 = 22 (2 marks) 2. Expand and simplify 2(x + 4) - 3(x - 1) (3 marks)"
      need: attention
    assert:
      - {type: llm-rubric, value: "Explains that removing questions or changing the format lowers the demand and is not an access modification, keeps both questions with their marks, chunks question 2 into steps with boxes and white space, and suggests discussing a differentiated assessment with the SENCO if a different test is really wanted."}
