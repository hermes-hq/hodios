schema: 1
baseline: "What accommodations should this pupil have for reading? {{pupil}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-decoding-gap
    vars:
      pupil: "F.G., Year 7, age 12. Decoding at about age 8, reads 60 words per minute, but listening comprehension at age level and rich spoken vocabulary. Struggles in science worksheets, history sources and maths word problems. School has Chromebooks with text-to-speech. In a phonics-based intervention 3 times a week."
      subjects: "English, maths, science, history, geography"
    assert:
      - {type: contains-all, value: ["## Accommodations by subject", "## Staff briefing"]}
      - {type: llm-rubric, value: "Identifies a decoding-level gap with strong listening comprehension and so prioritises text-to-speech, read-aloud and advance texts over simplified content, gives subject-specific accommodations for worksheets, sources and word problems, keeps content at age level, links to the existing intervention, plans a 4-6 week check, and writes a five-line staff briefing."}
  - name: edge-comprehension-need
    vars:
      pupil: "V.B., Year 5. Decodes accurately at age level but understands little of what she reads or hears in lessons; limited vocabulary."
    assert:
      - {type: llm-rubric, value: "Recognises this is a language comprehension need rather than decoding, so read-aloud alone will not help; prioritises vocabulary pre-teaching, visuals and checking understanding, and suggests seeking specialist language advice without diagnosing."}
  - name: negative-modify-everything
    vars:
      pupil: "S.D., Year 8, reads slowly. Just give him the Year 3 worksheets in all subjects so he can read them himself."
    assert:
      - {type: llm-rubric, value: "Explains the difference between accommodation and modification, warns that giving lower-level content in all subjects would limit his learning, and offers access accommodations that keep age-level content."}
