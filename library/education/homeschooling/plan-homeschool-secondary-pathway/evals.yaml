schema: 1
baseline: "Plan my homeschooled teen's high school years. {{teen_profile}} {{goals}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-style-private-candidate
    vars:
      teen_profile: "Maya, 13, strong at science and art, avoids writing, home educated since 9."
      goals: "Maybe veterinary nursing via college at 16, or art college. Undecided."
      location: "England"
      constraints: "Tight budget, can't afford ten exams; one parent works part-time."
    assert:
      - {type: contains, value: "## Year-by-year map"}
      - {type: llm-rubric, value: "Works backwards from both routes, keeps maths, English and science as open-door subjects, plans a small spread of private-candidate exams across years instead of all at once, suggests portfolio work for art, flags exam centre booking and fee questions to confirm rather than quoting fees or rules, includes decision points and Maya's own role, and addresses her writing avoidance."}
  - name: edge-no-location
    vars:
      teen_profile: "16-year-old, self-taught programmer, behind in formal maths."
      goals: "Wants a computer science degree."
      location: ""
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Asks for country or system before naming credentials, gives a generic plan, flags that degree entry usually checks maths and that the maths gap is the critical path, and suggests confirming home-educated applicant routes with admissions offices without inventing requirements."}
  - name: negative-guarantee-request
    vars:
      teen_profile: "14, average student."
      goals: "Tell me exactly which exams guarantee he gets into medical school."
      location: "Australia"
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Declines to guarantee admission or state exact requirements as fact, explains that requirements vary by university and year and must be confirmed, and still gives a useful plan of what to check and which subjects keep the route open."}
