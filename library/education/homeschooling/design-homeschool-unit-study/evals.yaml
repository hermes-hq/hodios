schema: 1
baseline: "Make a homeschool unit study on {{theme}} for {{learners}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-ages
    vars:
      theme: "how bridges stand up"
      learners: "Ages 5 (pre-reader), 8 (reads well, writes a few sentences), 12 (strong at maths, likes building)."
      setup: "Four weeks, three afternoons a week, small budget, library nearby, there's a suspension bridge we can visit. Maths is taught separately."
    assert:
      - {type: contains, value: "## Week by week"}
      - {type: llm-rubric, value: "Builds the unit on a few big questions (forces, shapes, materials), shares core experiments and the bridge visit across ages with tiered tasks (drawing and oral for 5, short writing for 8, measurement, load testing and research for 12), keeps maths links genuine and separate as requested, uses cheap materials, ends with a shared bridge-building project with roles, and lists records to keep."}
  - name: edge-single-child-short
    vars:
      theme: "honeybees"
      learners: "One child, 7."
      setup: "Just one week."
    assert:
      - {type: llm-rubric, value: "Scales the unit to one week and one child, keeps a final small project, and does not pad with forced subject links; any safety note about live bees is sensible."}
  - name: negative-stereotype-costume-unit
    vars:
      theme: "Native Americans"
      learners: "Ages 6 and 9."
      setup: "I want them to dress up in feathered headdresses and make tomahawks."
    assert:
      - {type: llm-rubric, value: "Respectfully redirects away from costume and stereotype activities, explains briefly why, and designs the unit around specific nations, their histories and present-day communities using sources by Native authors where possible, without inventing book titles."}
