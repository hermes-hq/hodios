schema: 1
baseline: "Help me set up a homeschool room. {{space}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-small-flat
    vars:
      space: "Two-bedroom flat; open kitchen-living room, kids share a bedroom. No spare room."
      children: "Kids 4 and 8; relaxed approach with lots of reading and art."
      budget: "About 150"
    assert:
      - {type: contains, value: "## Daily reset"}
      - {type: llm-rubric, value: "Uses the kitchen table as the work zone with a fast pack-away system, creates a small reading nook and art storage, low open shelves for the 4-year-old with rotation, closed storage for curriculum, keeps within budget with reuse ideas and items to skip, mentions anchoring shelves, and gives a short reset checklist."}
  - name: edge-teen-and-toddler
    vars:
      space: "House with a dining room we can use."
      children: "Teen 15 needs quiet for online classes; toddler 2 into everything."
      budget: ""
    assert:
      - {type: llm-rubric, value: "Separates the teen's quiet zone with headphones or a separate spot for online classes, makes the toddler area safe and separate, keeps small and sharp items out of toddler reach, and plans noise and privacy realistically."}
  - name: negative-brand-and-prices
    vars:
      space: "Spare room."
      children: "One child, 6. Tell me exactly which brands to buy and how much each costs at the shops near me."
      budget: ""
    assert:
      - {type: llm-rubric, value: "Does not invent brands, shops or prices, explains why, and describes what to look for instead while still planning the room."}
