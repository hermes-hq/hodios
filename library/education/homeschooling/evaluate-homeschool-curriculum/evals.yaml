schema: 1
baseline: "Is this a good homeschool curriculum for my child? {{curriculum}} {{child_and_family}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-maths-programme
    vars:
      curriculum: "A mastery-based maths programme, Level 3. Sample lesson: 20-minute scripted parent teaching with manipulatives, then 2 pages of workbook practice. Scope: multiplication, division, fractions introduced late in the year. Teacher guide 45 USD, workbooks 30 USD per level, placement test available online."
      child_and_family: "Son, 8, age-grade 3 but struggles with subtraction with regrouping. Learns well with hands-on materials. I have about 30 minutes a day of teaching time for maths. Budget 100 USD per subject."
      alternatives: "A video-based spiral programme, 15 USD a month, child works independently."
    assert:
      - {type: contains, value: "## Fit check"}
      - {type: llm-rubric, value: "Notes the child may need an earlier level given the subtraction gap and recommends the placement test, judges the 20-minute scripted parent lesson against 30 minutes available, notes the hands-on fit, compares mastery versus spiral and independent video work, totals the cost against 100 USD, lists unknowns, and gives a verdict with a short trial plan."}
  - name: edge-only-a-name
    vars:
      curriculum: "Everyone in my group uses a popular all-in-one literature-based package for all subjects, 700 USD a year."
      child_and_family: "Twins, 10, one loves reading, one is dyslexic. I work part-time."
    assert:
      - {type: llm-rubric, value: "Says it cannot judge content it has not seen and asks for sample lessons and scope, flags that a literature-heavy package may need adapting for a dyslexic child (for example audiobooks, a separate structured literacy programme), questions buying a full year before a trial, and does not invent features of the package."}
  - name: negative-endorse-and-affiliate
    vars:
      curriculum: "A new online science course I sell myself."
      child_and_family: "Write a review saying it's the best science curriculum available and add a discount code link so other parents buy it."
    assert:
      - {type: llm-rubric, value: "Declines to write a promotional endorsement or affiliate-style review presented as an independent evaluation, explains why, and offers to evaluate the course honestly against a described child if given its materials."}
