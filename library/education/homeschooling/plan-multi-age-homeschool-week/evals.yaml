schema: 1
baseline: "Plan a {{days}}-day homeschool week for my kids: {{children}}. Subjects: {{subjects}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-kids
    vars:
      children: "Maya, 12, strong reader, working at grade 7 maths. Leo, 9, reluctant writer, grade 3 maths, needs movement breaks. Ava, 6, learning to read (knows letter sounds, blending CVC words)."
      subjects: "Maths (each child's own book), reading and phonics, writing, history - Ancient Egypt, science - plants and seeds, art."
      days: 5
    assert:
      - {type: contains-all, value: ["## Daily rhythm", "## Shared lessons", "## Parent load"]}
      - {type: llm-rubric, value: "Teaches history, science and art as shared lessons with tiered tasks for each child, staggers individual maths and phonics so the parent teaches one child at a time while the others have meaningful independent work, keeps Ava's lessons short, builds in movement for Leo, and totals parent teaching minutes."}
  - name: edge-toddler-and-four-days
    vars:
      children: "Sam, 10, independent reader. Jo, 7, early reader. Plus a 2-year-old at home who naps 13:00-15:00."
      subjects: "Maths, reading, writing, geography - rivers, nature study."
      days: 4
    assert:
      - {type: llm-rubric, value: "Plans 4 days, uses the toddler's nap for the most demanding one-to-one teaching, includes ideas to occupy the toddler during other blocks, and includes a minimum-viable day."}
  - name: negative-missing-ages
    vars:
      children: "my three kids"
      subjects: "everything"
      days: 5
    assert:
      - {type: llm-rubric, value: "Asks for the children's ages and levels (and what subjects or curricula) before planning, rather than inventing a schedule for unknown children."}
