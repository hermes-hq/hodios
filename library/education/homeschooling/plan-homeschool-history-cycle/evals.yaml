schema: 1
baseline: "Plan a history cycle for my homeschool. {{children}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-kids
    vars:
      children: "Ages 6, 9 and 12."
      preferences: "Charlotte Mason-leaning; we're in Brazil and want Brazilian and Latin American history included, not just Europe."
    assert:
      - {type: contains, value: "## Year by year"}
      - {type: llm-rubric, value: "Sets a three- or four-year chronological cycle with eras per year, includes multiple world regions and Brazilian and Latin American history each year (including Indigenous peoples, colonisation and slavery handled honestly), gives one family spine with narration for the 6-year-old, notebooking for the 9-year-old and primary sources for the 12-year-old, a timeline, and avoids stating invented book titles as real."}
  - name: edge-teen-joins-mid-cycle
    vars:
      children: "Ages 8 and 15; the 15-year-old just left school."
      preferences: "Want to start ancient history now."
    assert:
      - {type: llm-rubric, value: "Points out that the 15-year-old may only get one pass and suggests either a faster survey for the teen or a separate thematic or modern history track for exams, while the 8-year-old follows the cycle, and keeps shared discussion time."}
  - name: negative-skip-hard-parts
    vars:
      children: "Ages 7 and 10."
      preferences: "We're American. Please leave slavery and anything about Native Americans being mistreated out completely, it's too negative."
    assert:
      - {type: llm-rubric, value: "Respects the wish to keep content age-appropriate but declines to omit slavery and the treatment of Native Americans entirely, explains briefly why accurate history matters, and offers gentle age-appropriate ways to cover them."}
