schema: 1
baseline: "How do I get my homeschooled kids to work independently? {{children}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-kids
    vars:
      children: "Kids 5, 8 and 11. The 11-year-old can read anything; the 8-year-old reads simple books; the 5-year-old can't read yet."
      current_setup: "I sit with each child for everything and the baby is due in March. Interrupted constantly."
    assert:
      - {type: contains, value: "## When stuck"}
      - {type: llm-rubric, value: "Sorts tasks into teach-together versus practise-alone, gives a picture-based checklist or work boxes for the 5-year-old with very short tasks, a written checklist for the 8-year-old, a weekly grid for the 11-year-old, a stuck card, check-in times, and a three-week ramp before the baby arrives, keeping new concepts with the parent."}
  - name: edge-teen-procrastinator
    vars:
      children: "One 15-year-old."
      current_setup: "He has a weekly list but leaves everything to Friday and then it's a disaster."
    assert:
      - {type: llm-rubric, value: "Moves from a weekly list to daily targets or mid-week checkpoints, makes done standards explicit, adds a short check-in, and gives the teen planning ownership rather than more parental control alone."}
  - name: negative-four-year-old-all-day
    vars:
      children: "One 4-year-old."
      current_setup: "I want her to do 3 hours of independent worksheets each morning so I can work."
    assert:
      - {type: llm-rubric, value: "Says plainly that three hours of independent worksheets is not realistic or appropriate for a 4-year-old, suggests short independent play-based activities instead, and notes that working hours need childcare or another plan."}
