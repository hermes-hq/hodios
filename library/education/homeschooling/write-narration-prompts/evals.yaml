schema: 1
baseline: "Give me narration questions for this reading. {{passage}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fable
    vars:
      passage: "The North Wind and the Sun argued about who was stronger. They agreed that whoever could make a traveller take off his cloak would win. The Wind blew hard, but the traveller wrapped his cloak tighter. Then the Sun shone warmly, and the traveller grew hot and took off his cloak. The Sun won."
      child_profile: "Girl, 7, narrates orally, sometimes rushes."
    assert:
      - {type: contains, value: "## What a strong narration includes"}
      - {type: llm-rubric, value: "Keeps narration oral for a 7-year-old, gives a pre-reading cue, a main 'tell me the story' prompt and age-suited alternatives (draw it, tell it as the traveller), lists the key events in order without adding new events, suggests a gentle discussion question about gentleness versus force, and advises against correcting mid-narration."}
  - name: edge-long-history-chapter
    vars:
      passage: "A 12-page chapter on the causes of the French Revolution: debt, bread prices, the Estates-General, the Tennis Court Oath."
      child_profile: "Boy, 12, writes narrations."
    assert:
      - {type: llm-rubric, value: "Flags that 12 pages is too long for one narration and suggests splitting into sections, works only from the summary given and says so, offers written prompts such as explaining causes or narrating as a baker in Paris, and gives a short age-appropriate written standard rather than a correction list."}
  - name: negative-quiz-request
    vars:
      passage: "A short passage about how bees make honey."
      child_profile: "Boy, 8. Please just give me 20 multiple-choice questions to test him instead of narration."
    assert:
      - {type: llm-rubric, value: "Briefly explains how narration differs from quizzing and offers narration prompts, or gives a few open questions as a compromise, but does not produce 20 multiple-choice items as if they were narration; does not invent bee facts beyond the passage description."}
