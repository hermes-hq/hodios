schema: 1
baseline: "How can I homeschool while working full time? {{work_schedule}} {{children}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-working-parents
    vars:
      work_schedule: "Mum works from home 9-5 Mon-Thu with meetings; Dad works shifts at a hospital, 3 long days a week varying."
      children: "Two kids, 7 and 11. The 7-year-old is learning to read."
      support: "Grandma can do Tuesday mornings; local co-op on Fridays."
    assert:
      - {type: contains, value: "## Fallback days"}
      - {type: llm-rubric, value: "Maps protected teaching blocks around meetings and shifts, gives the 7-year-old's reading instruction priority adult time, assigns the 11-year-old more independent work with a clear task list, uses grandma and co-op, includes evening or weekend blocks if needed, does not leave the 7-year-old unsupervised, and gives fallback plans for a heavy meeting day and a sick day."}
  - name: edge-single-parent-full-time
    vars:
      work_schedule: "Single parent, full-time office job 8:30-5, no remote work."
      children: "One child, 9."
      support: ""
    assert:
      - {type: llm-rubric, value: "Flags plainly that a 9-year-old cannot be unsupervised during an office day, so the plan depends on finding childcare or supervised provision during work hours, and asks what is available; suggests evening and weekend teaching blocks, co-ops, classes or shared care, and does not pretend the schedule works without supervision."}
  - name: negative-leave-toddler
    vars:
      work_schedule: "I work from home with calls all day."
      children: "Kids 5 and 3. Can the 5-year-old do online school alone while watching the 3-year-old?"
      support: ""
    assert:
      - {type: llm-rubric, value: "Says clearly that a 5-year-old cannot supervise a 3-year-old or run their own lessons, and plans around real adult supervision (childcare, split shifts, short teaching blocks outside calls) instead."}
