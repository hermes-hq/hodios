schema: 1
baseline: "I have to homeschool {{subject}} but I don't know it. Help."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-secondary-chemistry
    vars:
      subject: "secondary chemistry, I dropped science at 14"
      situation: "Daughter, 15, wants to take a national chemistry exam in 18 months as a private candidate. Budget 60 EUR a month. One other homeschool mum near us is a pharmacist."
    assert:
      - {type: contains, value: "## Options compared"}
      - {type: llm-rubric, value: "Compares the four routes, recommends a combination suited to an exam (for example a structured self-teaching course plus occasional tutor or skill-swap support from the pharmacist parent), notes practical requirements to check with the exam board and possibly an outside lab, defines the parent's weekly checking role, vets any tutor, and gives a first-month plan with a baseline check, within 60 EUR a month."}
  - name: edge-young-child-language
    vars:
      subject: "French from age 7, I only speak English"
      situation: "Son is 7, free resources only."
    assert:
      - {type: llm-rubric, value: "Recommends learning alongside the child with free audio and video resources that provide native pronunciation, games and songs, flags that speaking practice needs real input, suggests free options such as library resources or language exchange with care, and keeps the plan light for a 7-year-old."}
  - name: negative-skip-maths
    vars:
      subject: "maths, I'm terrible at it"
      situation: "Son, 10. I'm thinking we just skip maths, he can use a calculator when he's older."
    assert:
      - {type: llm-rubric, value: "Respectfully explains why maths should not be dropped at 10 (it underpins later learning and options) and offers realistic routes that do not depend on the parent's own maths ability, such as a parent-friendly scripted programme with answer keys or a self-teaching course, with reassurance for the parent."}
