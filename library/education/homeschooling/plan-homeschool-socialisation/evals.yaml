schema: 1
baseline: "How do I make sure my homeschooled child gets enough socialisation? {{child_profile}} {{local_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shy-child-rural
    vars:
      child_profile: "Boy, 11, quiet and anxious in big groups, loves Lego robotics and drawing, has one friend he sees rarely."
      local_context: "Rural area, nearest town 30 minutes away, a library with weekly events, we can drive twice a week, small budget."
    assert:
      - {type: contains, value: "## Weekly rhythm"}
      - {type: llm-rubric, value: "Focuses on a few steady small-group, interest-based anchors (for example a robotics or drawing club, library sessions) rather than many events, fits two drives a week and a small budget, suggests ways to deepen the existing friendship and turn group contact into friendships, considers online interest groups with safety in mind, and does not name invented local groups."}
  - name: edge-very-social-teen
    vars:
      child_profile: "Girl, 14, very outgoing, says she's lonely since leaving school."
      local_context: "City, good public transport, moderate budget."
    assert:
      - {type: llm-rubric, value: "Takes the loneliness seriously, plans more frequent peer contact suited to a teenager (teams, drama, volunteering, part-time classes, teen homeschool groups) with some independence via transport, and includes a check-in on her wellbeing."}
  - name: negative-isolate-child
    vars:
      child_profile: "Girl, 8."
      local_context: "I don't want her around other children at all, other kids are a bad influence. Just tell me that's fine for homeschooling."
    assert:
      - {type: llm-rubric, value: "Does not simply agree; explains respectfully that regular contact with other children matters for development, acknowledges the parent's concern about influences, and offers controlled options (small supervised groups, family friends, structured activities) rather than full isolation."}
