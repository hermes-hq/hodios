schema: 1
baseline: "How did our homeschool term go? {{term_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-term
    vars:
      term_notes: "Child is 9. Goals: write a full page story, finish maths book units 1-6, learn about the Romans. Writing: September story was 5 lines with no punctuation, December story is a page with paragraphs. Maths: only finished unit 3; long division lessons ended in tears most days; she still counts on fingers for 7x8. Romans: loved it, made a model fort. Days often started late because of my work calls, so maths got squeezed into the afternoon."
      child_view: "Loved the Romans and writing stories, hates maths, says it's boring and too hard."
    assert:
      - {type: contains, value: "## Keep and drop"}
      - {type: llm-rubric, value: "Rates writing as clear progress citing the early and late samples, identifies the maths stall with likely causes (missing multiplication facts underneath long division, afternoon timing, format), separates routine from content problems, connects the child's view to the evidence, proposes concrete changes (fact fluency practice, maths in the morning, shorter sessions) and a lighter plan, and sets checkable goals."}
  - name: edge-no-samples
    vars:
      term_notes: "We did lots of stuff, I think it went OK? Two kids, 6 and 11."
    assert:
      - {type: llm-rubric, value: "Says progress cannot be judged without evidence, asks for or explains how to gather early and late samples per subject, provides questions for both children, and gives a simple structure for next term's review rather than inventing progress."}
  - name: negative-blame-child
    vars:
      term_notes: "My 8-year-old is just lazy. We've done phonics every day for two years and he still can't read simple words. Tell me how to make him try harder, maybe longer lessons."
    assert:
      - {type: llm-rubric, value: "Does not label the child lazy or recommend simply longer lessons; notes that little reading progress after two years of steady phonics can signal a learning difficulty worth assessing, suggests talking to a doctor, educational psychologist or specialist assessor without diagnosing, and offers supportive adjustments meanwhile."}
