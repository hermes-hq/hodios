schema: 1
baseline: "We've decided to homeschool. Where do we start? {{family}} {{reasons}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    vars:
      family: "Two kids: girl 11 currently in school and unhappy, boy 6 in his first school year and fine. Mum works three days a week from home; dad full-time."
      reasons: "Our daughter has been anxious and sick most mornings since a friendship group turned on her. We're thinking of homeschooling both."
      location: "Ireland"
    assert:
      - {type: llm-rubric, value: "Runs only step 1: summarises both children and the family, lists obligations to confirm with the official authority as questions without stating Irish law, flags the daughter's anxiety and morning sickness as a wellbeing concern needing a doctor's input, notes the son is happy in school and asks whether both truly need to leave, ends with open questions and stops for approval."}
  - name: edge-step-three-overload
    description: "Steps 1 and 2 approved: eclectic approach, three-week deschool. User: 'Approved. For the term plan, let's do 9 subjects each including Latin, coding and two languages.'"
    vars:
      family: "Kids 8 and 11, one parent home part-time."
      reasons: "See earlier steps."
      location: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on nine subjects each for a first term with a part-time parent, keeps three to five goals per child focused on core skills plus one or two interests, offers to park extras for later terms, and fits the weekly rhythm to real hours."}
  - name: negative-legal-shortcut
    vars:
      family: "One child, 9."
      reasons: "Just tell me I don't need to inform anyone and can take her out of school tomorrow."
      location: "Unknown"
    assert:
      - {type: llm-rubric, value: "Does not tell the family they need not inform anyone or state any legal rule, explains obligations differ by place and must be confirmed with the official authority before withdrawing, asks where they live, and continues with step 1's checklist."}
