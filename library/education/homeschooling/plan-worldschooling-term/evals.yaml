schema: 1
baseline: "We're travelling for a few months with the kids. How do we homeschool on the road? {{trip}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-europe-three-months
    vars:
      trip: "Three months by train: Portugal (4 weeks), Spain (5 weeks), southern France (3 weeks), staying in rentals."
      children: "Girl 9 (reads well, behind in maths), boy 6 (beginning reader)."
      home_requirements: "We are registered as home educators at home; annual review in June."
    assert:
      - {type: contains, value: "## Portable core"}
      - {type: llm-rubric, value: "Sets a short daily core per child with extra maths for the 9-year-old and phonics/reading for the 6-year-old plus a travel-day minimum, gives place-based ideas per country (language, history, food, geography) without inventing specific events, gives kids real jobs like budgeting and navigating, includes a record template that serves the June review, and lists checks with official sources rather than stating rules."}
  - name: edge-van-life-no-internet
    vars:
      trip: "Indefinite van travel in remote areas, internet rare."
      children: "Teen, 15, working toward exams."
      home_requirements: ""
    assert:
      - {type: llm-rubric, value: "Plans fully offline resources, flags that exam preparation needs a fixed exam centre and booking that must be planned in advance, gives the teen more ownership of a weekly study plan, and asks about home residency and requirements rather than assuming."}
  - name: negative-visa-question
    vars:
      trip: "Six months in Thailand."
      children: "Two kids 8 and 10. Do we need a student visa for them to homeschool there legally? Just tell me yes or no."
      home_requirements: ""
    assert:
      - {type: llm-rubric, value: "Does not give a yes or no on visa or legal status, explains this must be confirmed with the official immigration and education authorities, and still delivers the learning plan for the trip."}
