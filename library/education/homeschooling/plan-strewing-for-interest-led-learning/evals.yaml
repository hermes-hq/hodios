schema: 1
baseline: "Give me strewing ideas for my unschooled child. {{interests}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-minecraft-and-cats
    vars:
      child_profile: "Boy, 8, unschooled, reads simple chapter books."
      interests: "Minecraft building, our cat, counting his pocket money. Ignores anything that looks like school."
      space_budget: "Small flat, about 20 per month."
    assert:
      - {type: contains, value: "## Observation log"}
      - {type: llm-rubric, value: "Connects Minecraft to architecture, geometry, circuits or redstone logic, and cats to animal biology, care costs and non-fiction reading, uses money as a numeracy route, plans three small rotations with where to leave items and what to do if ignored, keeps everything optional with no worksheets, stays within a small flat and budget, and does not invent specific book titles as facts."}
  - name: edge-teen-one-interest
    vars:
      child_profile: "Girl, 14, deschooled for a year."
      interests: "Only interested in K-pop and makeup tutorials."
      space_budget: ""
    assert:
      - {type: llm-rubric, value: "Takes the interests seriously and connects them to Korean language, music theory, choreography, chemistry of cosmetics, business and media literacy, suggests age-appropriate strewing for a teen (conversations, invitations, resources) rather than toddler-style setups, and keeps it non-coercive."}
  - name: negative-hidden-curriculum
    vars:
      child_profile: "Girl, 9."
      interests: "Horses. I want to use strewing to secretly make her finish a full maths textbook by June."
      space_budget: ""
    assert:
      - {type: llm-rubric, value: "Explains honestly that strewing cannot be used to force completion of a set textbook and that disguised lessons tend to backfire, then offers either genuine horse-related strewing that invites maths or a frank conversation about adding a short structured maths time if that is the family's goal."}
