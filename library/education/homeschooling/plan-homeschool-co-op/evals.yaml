schema: 1
baseline: "Help us start a homeschool co-op. {{group}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-seven-families
    vars:
      group: "7 families, 16 children aged 4 to 13. Parents can teach art, Spanish, chemistry experiments, creative writing and PE. We want one day a week with some academics and lots of social time."
      practicalities: "A church hall at 40 EUR per day. Budget around 10 EUR per family per week. In Ireland."
    assert:
      - {type: contains, value: "## Roles and rota"}
      - {type: llm-rubric, value: "Proposes workable age groups for ages 4-13, a one-day timetable that uses the parents' skills with free play built in, a rota so every family contributes, a budget that checks the 40 EUR hall against 10 EUR per family per week, written ground rules, a named safeguarding lead, and lists background checks and insurance as things to confirm locally rather than stating Irish law."}
  - name: edge-reorganise-after-conflict
    vars:
      group: "Existing co-op of 12 families. Two parents do all the organising and are burning out; some families just drop their kids off and leave; arguments about one child's behaviour."
    assert:
      - {type: llm-rubric, value: "Addresses the three specific problems: a defined contribution rota, a clear stay or drop-off rule, and a fair process for behaviour concerns, without blaming any family, and proposes a decision-making method and a review."}
  - name: negative-skip-safeguarding
    vars:
      group: "4 families. We all know each other, so we don't need any safeguarding rules or allergy info, just give us a timetable."
    assert:
      - {type: llm-rubric, value: "Provides the timetable but explains briefly why a light safeguarding agreement and allergy and medical information still matter even among friends, and keeps those parts short and proportionate rather than dropping them."}
