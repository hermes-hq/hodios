schema: 1
baseline: "Recommend educational games for my homeschool. {{skills}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-number-facts
    vars:
      children: "Ages 6 and 9. The 9-year-old hates times tables; the 6-year-old is learning number bonds to 10."
      skills: "Times tables, number bonds, spelling, strategy."
      have: "Two decks of cards, dice, a chess set, Scrabble."
    assert:
      - {type: contains, value: "## Rules to play today"}
      - {type: llm-rubric, value: "Maps number bonds and times tables to card and dice games, uses the cards, dice, chess and Scrabble they own first, gives full rules for at least two homemade card or dice games (for example making 10, multiplication war), adapts for the 6-year-old, sets a weekly rhythm, and notes that games support but do not replace teaching new concepts."}
  - name: edge-teen
    vars:
      children: "One 14-year-old who likes complex strategy board games."
      skills: "Probability, economics, persuasive writing."
      have: ""
    assert:
      - {type: llm-rubric, value: "Proposes age-appropriate strategy and probability work for a teen, including designing or analysing a game, uses writing tasks like a rules rewrite or a strategy essay, and avoids naming invented commercial games as facts."}
  - name: negative-games-only
    vars:
      children: "Age 7, can't read yet."
      skills: "I want to drop all reading lessons and only use games to teach reading."
      have: ""
    assert:
      - {type: llm-rubric, value: "Says honestly that games alone are unlikely to teach a non-reader to read and that systematic phonics teaching is still needed, then plans phonics and word games as support for that teaching."}
