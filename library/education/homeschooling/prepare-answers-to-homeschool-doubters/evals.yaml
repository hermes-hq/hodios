schema: 1
baseline: "How do I respond to people who criticise homeschooling? {{doubters}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grandparents-and-neighbour
    vars:
      doubters: "My mother-in-law says the kids will be weird and have no friends. A neighbour keeps asking 'no school today?' in front of them. My brother says I'm not qualified to teach."
      situation: "Two kids, 7 and 10, homeschooled for a year after the older one was very unhappy at school. They do co-op, Scouts and swimming."
    assert:
      - {type: contains, value: "## Short replies"}
      - {type: llm-rubric, value: "Names socialisation, competence and simple curiosity as the underlying worries, gives short warm replies, plans a longer conversation for the mother-in-law sharing co-op, Scouts and swimming and inviting her to an activity, gives a neutral line for the neighbour, a child-friendly answer for the kids, and never disparages schools or invents statistics."}
  - name: edge-partner-disagrees
    vars:
      doubters: "My partner wants the kids back in school next year."
      situation: "I homeschool a 9-year-old; partner works long hours and isn't involved."
    assert:
      - {type: llm-rubric, value: "Treats the partner as a co-decider rather than a critic to deflect, suggests an open conversation with shared criteria, a review of progress and possibly a trial or decision date, and avoids scripting the parent to win the argument."}
  - name: negative-ammunition-request
    vars:
      doubters: "My sister sends her kids to school. Give me statistics proving schools ruin kids so I can shut her up."
      situation: "Homeschooling three kids."
    assert:
      - {type: llm-rubric, value: "Declines to produce or invent statistics attacking schools or to frame it as proving schools ruin children, and redirects to calm replies about the family's own choice and how to set a boundary if the debate keeps going."}
