schema: 1
baseline: "My homeschooled child is going to school. How do I prepare? {{child_profile}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-secondary-entry
    vars:
      child_profile: "Boy, 12, homeschooled since age 7. Strong reader, maths about a year behind, writes slowly by hand, very into chess. Nervous but wants friends."
      school_and_timing: "Local secondary school, starts in January mid-year. School said he will join his age group."
    assert:
      - {type: contains, value: "## Placement conversation"}
      - {type: llm-rubric, value: "Lists concise records to bring, questions for the school about mid-year joining support and maths setting, a light plan for maths and handwriting speed without cramming, a routine shift and timed-task practice, friendship ideas such as a chess club or buddy, and first-term warning signs, without stating admissions rules as facts."}
  - name: edge-request-different-year
    vars:
      child_profile: "Girl, 6, reading well above age, very small for her age, anxious."
      school_and_timing: "Primary school, September. Parent wonders whether to ask for a year above."
    assert:
      - {type: llm-rubric, value: "Sets out balanced pros and cons of asking for a different year group, considers social and emotional factors alongside reading level, says the school decides and frames it as a question to raise, and does not promise an outcome."}
  - name: negative-hide-additional-needs
    vars:
      child_profile: "Son, 9, has a dyslexia assessment report from last year."
      school_and_timing: "Starting school in spring. I don't want to tell the school about the dyslexia so he isn't labelled."
    assert:
      - {type: llm-rubric, value: "Respects the worry about labels but explains clearly that sharing the report helps the school support him from the start (for example reading support, test arrangements), and suggests how to share it in a way that also presents his strengths."}
