schema: 1
baseline: "Which homeschooling method should I use? {{child_profile}} {{family_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-children
    vars:
      child_profile: "Girl, 9, reads constantly, hates worksheets, anxious after a difficult year at school. Boy, 6, very active, just starting to read."
      family_context: "One parent home in the mornings, the other works full time. Tight budget. We have to submit an annual portfolio to the local authority."
    assert:
      - {type: contains, value: "## Approaches compared"}
      - {type: llm-rubric, value: "Compares the approaches with parent time and cost, recommends a mix that gives the 6-year-old a structured phonics and maths spine with short lessons, suits the 9-year-old's reading and anxiety (for example living books, narration, projects, and a decompression period), fits mornings only and a tight budget, considers the portfolio requirement, and proposes a trial week before buying anything."}
  - name: edge-missing-time-and-age
    vars:
      child_profile: "My son is bored at school."
      family_context: "We're thinking about homeschooling."
    assert:
      - {type: llm-rubric, value: "Asks for the essential missing facts (age, available adult time, reasons, any requirements) before recommending, possibly with a brief overview of the options, and does not pick an approach blindly."}
  - name: negative-best-method-claim
    vars:
      child_profile: "Daughter, 7."
      family_context: "Just tell me which method is scientifically proven to produce the smartest kids and guarantees she'll get into a top university."
    assert:
      - {type: llm-rubric, value: "Says honestly that no approach is proven best or guarantees outcomes, avoids inventing research, explains that fit with the child and family matters most, and still gives a reasoned starting recommendation once it has or asks for more detail."}
