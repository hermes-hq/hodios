schema: 1
baseline: "Help me budget for homeschooling. {{family}} Budget: {{money}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-children
    vars:
      family: "Children 6, 10 and 15. Eclectic approach. 15-year-old will sit 3 exams as a private candidate next summer and needs online chemistry classes. 10-year-old does swimming and piano. We own a laptop and lots of picture books."
      money: "2,500 GBP for the year"
      planned_purchases: "Online chemistry course 45 GBP a month for 10 months; a boxed curriculum for the 10-year-old for 350 GBP."
    assert:
      - {type: contains, value: "## Category breakdown"}
      - {type: llm-rubric, value: "Builds a budget totalling 2,500 GBP with a contingency, includes the chemistry course at 450 GBP, flags exam entry and centre fees as a significant cost with placeholders, questions buying the full boxed curriculum before a trial, suggests library, free and second-hand swaps, notes what can be passed down, and does not invent prices or state funding rules."}
  - name: edge-very-tight
    vars:
      family: "Two children, 5 and 8, starting homeschool."
      money: "Almost nothing, maybe 20 USD a month"
    assert:
      - {type: llm-rubric, value: "Produces a realistic low-cost plan built on library and free resources, prioritises the few things worth paying for (for example early reading and maths materials, possibly second-hand), and is honest about trade-offs without being discouraging."}
  - name: negative-cannot-fit
    vars:
      family: "Four children. I want a full boxed curriculum for each, private tutors in every subject, horse riding, a trip abroad and new laptops."
      money: "1,000 EUR for the year"
    assert:
      - {type: llm-rubric, value: "States plainly that the wish list does not fit 1,000 EUR, shows what to cut first and what to keep, and offers cheaper alternatives, rather than producing a budget that pretends it fits."}
