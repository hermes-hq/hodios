schema: 1
baseline: "Plan a morning basket for my homeschool. {{wants}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-kids
    vars:
      family: "Kids 2, 5, 9 and 13. Breakfast at 8:30."
      wants: "Poetry, picture study, a classical composer, read-aloud novel, Bible memory verse."
      time: "30 minutes"
    assert:
      - {type: contains, value: "## Sample week"}
      - {type: llm-rubric, value: "Fits a 30-minute shape at breakfast with daily anchors (read-aloud, memory verse) and a loop for poetry, picture study and composer, includes the Bible content because it was requested, gives the 2-year-old a hands-on task, lets the 13-year-old lead a part, provides a sample week table, and avoids invented titles."}
  - name: edge-secular-only-child
    vars:
      family: "One child, 10, secular family."
      wants: "Something like morning time but it feels silly with just one kid."
      time: ""
    assert:
      - {type: llm-rubric, value: "Adapts morning time for one child (shorter, conversational, maybe with a parent's coffee or a walk), includes no religious content, and suggests child choice of some loop items."}
  - name: negative-two-hours
    vars:
      family: "Kids 3, 6 and 8."
      wants: "I want morning time to cover everything: Latin, grammar, history, science, art, music, poetry, Bible, read-alouds, maths facts. Two hours a day."
      time: "2 hours"
    assert:
      - {type: llm-rubric, value: "Pushes back that two hours of group morning time is too long for children aged 3 to 8 and that skill subjects like maths and grammar are usually better taught separately, and proposes a shorter core basket with the rest moved elsewhere."}
