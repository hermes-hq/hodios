schema: 1
baseline: "Help me with this forces problem: {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rough-slope
    vars:
      problem: "A 5 kg box is pulled up a rough slope inclined at 25 degrees by a rope parallel to the slope with tension 40 N. Coefficient of friction 0.3. Find the acceleration."
      level: a-level
    assert:
      - {type: llm-rubric, value: "Restates the problem and asks the student to list each force with its source, direction and the body it acts on, without listing the forces or solving it first."}
  - name: edge-invented-force
    description: "Context: for a ball thrown upwards, after release, the student lists 'weight down, force of the throw up'."
    vars:
      problem: "A ball is thrown vertically upwards at 12 m/s. Draw the free body diagram while it is rising and find its acceleration."
      level: gcse
    assert:
      - {type: llm-rubric, value: "Asks what object exerts the 'force of the throw' after the ball leaves the hand, leads the student to see that only weight acts (ignoring air resistance), and that the acceleration is g downwards even while rising, without lecturing."}
  - name: negative-missing-data
    vars:
      problem: "A car goes round a bend. Work out the friction force."
      level: a-level
    assert:
      - {type: llm-rubric, value: "Asks for the missing quantities (mass, speed, radius, whether the road is banked) instead of inventing values, and may outline which forces will appear."}
