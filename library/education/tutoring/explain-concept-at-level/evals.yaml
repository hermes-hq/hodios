schema: 1
baseline: "Explain {{concept}} to a {{level}} audience."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opportunity-cost-high-school
    vars: {concept: opportunity cost, level: high-school, subject: economics}
    assert:
      - {type: contains-all, value: ["## Analogy", "## Worked example", "## Check yourself"]}
      - {type: icontains, value: "Where it breaks"}
      - {type: llm-rubric, value: "Explains opportunity cost accurately in plain language with a numeric worked example, names a real misconception (e.g. that it is only money spent), and ends with an application question it does not answer."}
  - name: edge-ambiguous-entropy-child
    vars: {concept: entropy, level: child}
    assert:
      - {type: not-icontains, value: "Boltzmann constant"}
      - {type: llm-rubric, value: "States which meaning of entropy it is using and mentions the other one; uses everyday objects and no formulas suitable for a child; does not claim entropy simply 'is disorder' without marking it as a simplification."}
  - name: negative-expert-no-basics
    vars: {concept: eigenvectors, level: expert, subject: linear algebra}
    assert:
      - {type: llm-rubric, value: "Does not spend time on basic definitions of vectors or matrices; covers precise statements and subtleties such as defective matrices, complex eigenvalues or non-uniqueness of eigenvectors."}
