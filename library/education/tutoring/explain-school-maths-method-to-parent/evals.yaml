schema: 1
baseline: "How do I help my kid with this maths homework: {{method_or_homework}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chunking-division
    vars:
      method_or_homework: "Worksheet says 'use chunking' for 156 ÷ 12. She subtracts 120 and then writes 10 at the side. I just want to show her long division."
      age: "Year 5"
      country: "UK"
    assert:
      - {type: contains, value: "## Step by step"}
      - {type: llm-rubric, value: "Shows chunking with correct arithmetic on a parallel division of similar size (for example 168 ÷ 14: 140 as 10 lots, 28 as 2 lots, answer 12) rather than working the child's own 156 ÷ 12 to the answer, explains why it builds understanding of division as repeated subtraction and leads to short division later, and advises the parent not to teach long division now but to use it only to check."}
  - name: edge-part-whole-us
    vars:
      method_or_homework: "Kindergarten-ish thing with a big circle and two little circles, 8 at the top and 3 in one small circle."
      age: "6"
      country: "US"
    assert:
      - {type: llm-rubric, value: "Identifies a part-whole model (number bond) with 8 as the whole, explains the missing part is 5 and how it connects addition and subtraction, uses simple words for the parent, and gives questions such as 'what's the whole, what are the parts?'."}
  - name: negative-too-vague
    vars:
      method_or_homework: "they do it the weird way now"
      age: "8"
    assert:
      - {type: llm-rubric, value: "Does not guess one method confidently; lists two or three likely methods for an 8-year-old briefly and asks the parent to describe or copy a line of the worksheet."}
