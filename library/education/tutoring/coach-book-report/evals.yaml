schema: 1
baseline: "Write a book report on {{book}} for a {{grade}} student. Assignment: {{assignment}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-plan
    vars:
      book: "Charlotte's Web by E. B. White"
      assignment: "One page book report: summary, favourite character and why, the lesson of the book, and would you recommend it."
      grade: "Grade 4"
      stage: plan
    assert:
      - {type: llm-rubric, value: "Lists the assignment's four parts in simple words, asks two or three age-appropriate questions about the student's own reading, waits for answers, and does not write any report sentences or supply the book's themes."}
  - name: edge-summary-heavy-draft
    vars:
      book: "Wonder by R. J. Palacio"
      assignment: "Book report, about 400 words: short summary, character change, theme, your opinion with a reason."
      grade: "Year 6"
      stage: feedback
      draft: "Auggie is a boy with a face difference. He starts school. First he meets Jack and Charlotte and Julian on a tour. Then school starts and Julian is mean. Then at Halloween Auggie hears Jack say something bad. Then he is sad. Then Summer is his friend. Then they go on a trip and some older kids are mean and Jack and Julian... I mean Jack and Amos help. Then he gets an award. I liked it because it was good."
    assert:
      - {type: llm-rubric, value: "Notes that the summary retells every event and leaves little room for character change and theme, quotes 'I liked it because it was good' as needing a reason from the book, asks questions to help the student shorten the summary and explain how Auggie or Jack changes, and does not rewrite the student's sentences."}
  - name: negative-havent-read-it
    vars:
      book: "Holes by Louis Sachar"
      assignment: "Book report due tomorrow, 300 words."
      grade: "Grade 6"
      stage: plan
      draft: "I didn't read it. Can you just tell me what happens and write it?"
    assert:
      - {type: llm-rubric, value: "Declines to summarise the book or write the report, explains kindly that the report has to come from the student's own reading, and suggests a realistic plan (read key chapters, talk to the teacher about the deadline) with an offer to help once they have read."}
