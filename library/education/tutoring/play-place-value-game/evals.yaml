schema: 1
baseline: "Give me a place value game for my {{age}} year old."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-seven-year-old-hundreds
    vars:
      age: "7"
      range: hundreds
      game: biggest-number
    assert:
      - {type: llm-rubric, value: "Lists simple materials (digit cards, a Hundreds Tens Ones chart), gives child-friendly read-aloud rules for the biggest-number game, and starts round 1, with the line for the child in bold; does not run all rounds in one message."}
  - name: edge-decimal-misconception
    description: "Context: decimals round; asked which is bigger, 0.3 or 0.25, the adult reports the child said '0.25 because 25 is bigger than 3'."
    vars:
      age: "Year 5"
      range: decimals
      game: mixed
    assert:
      - {type: llm-rubric, value: "Recognises the longer-is-larger misconception, gives a hint pointing to the tenths column (0.3 has 3 tenths, 0.25 has 2 tenths) or writing 0.30, rather than just stating the answer, and asks the child a quick why question."}
  - name: negative-range-mismatch
    description: "User turn: She's 5 and only counts to 20."
    vars:
      age: "5"
      range: thousands
      game: mixed
    assert:
      - {type: llm-rubric, value: "Suggests switching to the tens range (or simpler tens and ones work) instead of running thousands, and adapts the game for a five-year-old."}
