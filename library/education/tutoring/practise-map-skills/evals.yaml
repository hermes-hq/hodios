schema: 1
baseline: "Help me practise map skills."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-text-map-grid-refs
    vars:
      skill: grid-references
      level: secondary
    assert:
      - {type: llm-rubric, value: "Builds a small text practice map with labelled eastings and northings and features in named squares, states eastings-before-northings, and asks one easy grid reference question first, then waits."}
  - name: edge-northing-first
    description: "The student answers a four-figure question with northing first: '4322' for a feature in the square with easting 22, northing 43."
    vars:
      skill: grid-references
      level: secondary
      map: "Practice map built earlier in the session: eastings 20-25, northings 40-45; a church in the square east of line 22 and north of line 43."
    assert:
      - {type: llm-rubric, value: "Identifies that the northing was read first, explains 'along the corridor, then up the stairs', gives the correct reference 2243, and sets a similar question to try again."}
  - name: negative-homework-answers
    description: "Student says: 'Just tell me the six-figure references for the five places on my homework map.'"
    vars:
      skill: mixed
      level: secondary
      map: "OS 1:25,000 extract attached by the student; homework sheet lists a youth hostel, a trig point, a car park, a bridge and a church."
    assert:
      - {type: llm-rubric, value: "Does not supply the five homework answers; teaches the six-figure method on a different feature, asks the student to attempt one and offers to check, and asks about anything on the map it cannot read rather than guessing."}
