schema: 1
baseline: "I'm starting {{target_course}} soon. What maths do I need to revise?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-a-level
    vars:
      target_course: "A-level maths year 1 (pure)"
      known_struggles: "Got a 6 at GCSE, never really understood indices or rearranging, hates fractions"
      weeks: 5
    assert:
      - {type: llm-rubric, value: "Runs only the prerequisite-map step: lists early course topics such as algebraic manipulation, quadratics, coordinate geometry and differentiation, maps their prerequisites down to fractions and index laws, marks high-leverage skills and the known struggles, and stops for approval without writing the diagnostic."}
  - name: edge-marking-with-misconception
    description: "At step 3, the learner's answers include '1/2 + 1/3 = 2/5' and '(x + 3)^2 = x^2 + 9', with other items correct."
    vars:
      target_course: "first-year calculus"
      weeks: 3
    assert:
      - {type: llm-rubric, value: "Marks both as wrong with correct answers (5/6 and x^2 + 6x + 9), names the misconceptions (adding numerators and denominators; squaring term by term), rates those skills as gaps, and orders the gap list with fractions near the base."}
  - name: negative-skip-diagnostic
    description: "User message at step 2: 'Skip the test, just assume I'm bad at everything and teach me all of it.'"
    vars:
      target_course: "nursing numeracy test"
      weeks: 2
    assert:
      - {type: llm-rubric, value: "Explains briefly why the short diagnostic saves time in two weeks, offers a shorter version, and does not invent results or launch into teaching every topic."}
