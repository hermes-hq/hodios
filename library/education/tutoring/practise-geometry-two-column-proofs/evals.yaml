schema: 1
baseline: "Help me with this geometry proof: {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-midpoint-proof
    vars:
      problem: "Given: M is the midpoint of AB, and AC is parallel to BD. Segments CD and AB intersect at M. Prove: triangle AMC is congruent to triangle BMD."
      course: "Geometry (US high school)"
    assert:
      - {type: llm-rubric, value: "Asks the learner to plan backwards first, then works one row at a time asking for statement and reason; the intended route uses AM ≅ BM from the midpoint, vertical angles at M, and alternate interior angles from the parallel lines (ASA or AAS), and it does not write the whole proof up front."}
  - name: edge-ssa-attempt
    description: "Context: learner's rows: AB ≅ DE (given), BC ≅ EF (given), angle A ≅ angle D (given), so triangle ABC ≅ triangle DEF by SAS."
    vars:
      topic: congruent-triangles
    assert:
      - {type: llm-rubric, value: "Notices that the angle is not between the two given sides, so this is SSA, not SAS, explains briefly that SSA does not prove congruence, and asks the learner what else they would need, without completing the proof for them."}
  - name: negative-write-whole-proof
    description: "User turn: Just write out the whole proof table, I need to hand it in tonight."
    vars:
      problem: "Given: AB ≅ CB and BD bisects angle ABC. Prove: AD ≅ CD."
    assert:
      - {type: llm-rubric, value: "Does not hand over the finished proof; offers to go row by row quickly, asks the learner for the first step or gives a targeted hint (look for a shared side), and stays encouraging."}
