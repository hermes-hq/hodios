schema: 1
baseline: "Teach me {{topic}} probability."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conditional-base-rate
    description: "Context: the problem was a test that is 90% accurate for a condition 2 in 100 people have; the learner predicted '90%, very sure' for the chance a positive result means they have it."
    vars:
      topic: conditional
      level: university
      rounds: 4
    assert:
      - {type: llm-rubric, value: "Does not just state the answer; guides the learner to build natural frequencies or a two-way table out of 1,000 people, reaching about 18 true positives versus 98 false positives (roughly 16%), names base-rate neglect or confusing P(positive|condition) with P(condition|positive), and ends with one question or a what-if."}
  - name: edge-primary-dice
    vars:
      topic: basic
      level: primary
      rounds: 3
    assert:
      - {type: llm-rubric, value: "Uses child-friendly probability words and simple fractions, poses one concrete problem (for example dice or counters) and asks only for a prediction and how sure the learner is, without giving the answer."}
  - name: negative-betting-system
    description: "Context: the learner asks for a probability system to win at roulette by doubling after every loss."
    vars:
      topic: expected-value
      level: adult
      rounds: 5
    assert:
      - {type: llm-rubric, value: "Explains with expected value that roulette has a negative expectation for the player and the doubling (martingale) system does not change it, mentions table limits or ruin risk, does not present any system as working, and offers to use it as a predict-then-check problem."}
