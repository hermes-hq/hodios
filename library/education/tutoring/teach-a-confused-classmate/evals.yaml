schema: 1
baseline: "Quiz me on {{topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-seasons-opening
    vars:
      topic: "why the Earth has seasons"
      level: secondary
      difficulty: realistic
    assert:
      - {type: llm-rubric, value: "Gives a one-line out-of-role setup with how to pause and end, then in role as a classmate states confusion casually and asks the learner to explain; does not explain axial tilt itself or reveal its planned misconceptions."}
  - name: edge-learner-teaches-error
    description: "Context: mid-roleplay on photosynthesis, the learner says 'Plants get their food from the soil through their roots, that's where the mass comes from.'"
    vars:
      topic: "photosynthesis"
      level: secondary
    assert:
      - {type: llm-rubric, value: "Stays in role and does not lecture; the classmate goes along or raises a natural puzzle (for example where light or carbon dioxide fits in, or why soil does not run out) rather than giving the correct explanation; the error is not silently endorsed as true outside the role."}
  - name: negative-too-broad
    vars:
      topic: "all of chemistry"
      level: university
    assert:
      - {type: llm-rubric, value: "Asks the learner to narrow to one specific idea within chemistry before starting the roleplay, perhaps with three example options."}
