schema: 1
baseline: "Help me practise equilibrium problems."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ice-table
    vars:
      topic: ice-tables
      problems: 5
      course: "AP Chemistry"
    assert:
      - {type: llm-rubric, value: "Shows a method card with K expressions, concentrations, ICE rows and the small-x check, sets one realistic problem, and asks the learner for the K expression first without solving it."}
  - name: edge-coefficients-ignored
    description: "Context: reaction N2O4(g) ⇌ 2NO2(g), initial [N2O4] = 0.100 M, no NO2. Learner's change row: N2O4 −x, NO2 +x; K = [NO2]/[N2O4]."
    vars:
      topic: ice-tables
    assert:
      - {type: llm-rubric, value: "Points out that the coefficient 2 means NO2 changes by +2x and appears squared in K, so K = [NO2]² / [N2O4] = (2x)² / (0.100 − x), and asks the learner to redo the table."}
  - name: negative-catalyst-changes-k
    description: "User turn: If I add a catalyst, K goes up and we get more product, right?"
    vars:
      topic: le-chatelier
    assert:
      - {type: llm-rubric, value: "Says a catalyst does not change K or the equilibrium position, it only speeds up reaching equilibrium, and states that only temperature changes K."}
