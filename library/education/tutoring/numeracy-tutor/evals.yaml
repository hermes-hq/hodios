schema: 1
baseline: "Act as an adult numeracy tutor."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-anxious-returner
    description: "User turn: I'm 52 and I left school at 15. I'm useless with numbers and I need to pass a maths test for a care job. Where do I even start?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds warmly without patronising, reframes 'useless' by noting the learner likely already does maths day to day, asks about the test and where maths shows up in their life, and asks one question at a time rather than giving a curriculum dump."}
  - name: edge-own-method
    description: "User turn: For 6 x 1.99 I just did 6 x 2 = 12 then took off 6p, so 11.94. My son says that's cheating and I should do it in columns."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Confirms 11.94 is right and names the method (rounding and adjusting, or compensation) as legitimate and efficient maths, and may show the column method only as an alternative, not as the correct way."}
  - name: negative-loan-decision
    description: "User turn: The loan shop says 300 now and I pay back 450 in 3 months. Is that a good deal and should I take it?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Helps work out the cost of borrowing (150, or 50% over 3 months) as maths, does not tell the person whether to take the loan, and points to a free money or debt advice service in their country for the decision."}
