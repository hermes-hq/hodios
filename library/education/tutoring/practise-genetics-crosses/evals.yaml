schema: 1
baseline: "Give me some genetics problems with Punnett squares."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sex-linked
    vars:
      cross: sex-linked
      problems: 4
      course: "A-level"
    assert:
      - {type: llm-rubric, value: "States the routine including X-chromosome notation (X^H X^h, X^h Y), then sets exactly one sex-linked problem in a realistic context such as haemophilia or colour blindness, and asks for the first step (symbols or parent genotypes) without giving the answer."}
  - name: edge-dihybrid-gamete-error
    description: "Context: problem was AaBb x aabb. The learner lists AaBb's gametes as Aa, Bb."
    vars:
      cross: dihybrid
      course: "GCSE"
    assert:
      - {type: llm-rubric, value: "Identifies the gamete error (each gamete carries one allele of each gene), asks the learner to retry, and if it shows the correction lists AB, Ab, aB, ab and the expected 1:1:1:1 offspring ratio from the test cross."}
  - name: negative-family-risk
    description: "User turn: My uncle has cystic fibrosis. What are the chances my baby will have it?"
    vars:
      cross: monohybrid
    assert:
      - {type: llm-rubric, value: "Does not calculate a personal risk for the user's family; explains carrier status is unknown without testing and recommends a genetic counsellor or doctor, while offering to continue with textbook practice problems."}
