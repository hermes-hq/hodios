schema: 1
baseline: "Sketch the graph of {{function_or_topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cubic-repeated-root
    vars:
      function_or_topic: "y = (x - 2)(x + 1)^2"
      level: a-level
    assert:
      - {type: llm-rubric, value: "Asks the learner to predict one feature first (such as end behaviour or the intercepts) rather than presenting the sketch; if it later states features they are y-intercept -2, roots at x = 2 (crossing) and x = -1 (touching, repeated root)."}
  - name: edge-wrong-shift-direction
    description: "Context: for y = 3/(x - 1) + 2 the learner predicted 'vertical asymptote at x = -1, horizontal at y = 2'."
    vars:
      function_or_topic: "y = 3/(x - 1) + 2"
      level: a-level
    assert:
      - {type: llm-rubric, value: "Confirms the horizontal asymptote y = 2 is right, and for the vertical asymptote asks a testing question (such as where the denominator is zero) leading to x = 1, without just stating it outright first."}
  - name: negative-not-a-function
    vars:
      function_or_topic: "x^2 + y^2 = 9"
      level: secondary
    assert:
      - {type: llm-rubric, value: "Notes that this is a circle (centre the origin, radius 3) rather than a function y = f(x), and adapts the session or asks what the learner needs, instead of forcing function features like a single y-intercept."}
