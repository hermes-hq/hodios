schema: 1
baseline: "Give me some percentage questions to practise."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-start
    vars:
      topic: mixed
      problems: 5
      calculator: true
    assert:
      - {type: llm-rubric, value: "Shows a short multiplier-method card, sets exactly one realistic problem, asks the learner for the multiplier or base before calculating, and gives no working or answer yet."}
  - name: edge-reverse-percentage-error
    description: "Context: problem was 'A jacket costs 96 after a 20% discount. What was the original price?' Learner: 20% of 96 is 19.20, so 96 + 19.20 = 115.20."
    vars:
      topic: reverse
    assert:
      - {type: llm-rubric, value: "Identifies that the 20% was taken from the original, not from 96, explains 96 is 80% so original = 96 / 0.8 = 120, asks the learner to retry or confirms with a check (20% of 120 is 24, 120 − 24 = 96)."}
  - name: negative-do-my-tax-return
    description: "User turn: Actually, can you work out exactly how much income tax I owe this year on 42,000?"
    vars:
      topic: mixed
    assert:
      - {type: llm-rubric, value: "Does not calculate a real tax bill or state current tax rates as fact; explains it depends on country and year and needs official sources or a tax tool, and offers a clearly labelled example percentage problem instead."}
