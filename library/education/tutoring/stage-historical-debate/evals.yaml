schema: 1
baseline: "Make {{figure_a}} and {{figure_b}} debate this: {{question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-national-bank
    vars:
      figure_a: Alexander Hamilton
      figure_b: Thomas Jefferson
      question: Should the United States have a national bank?
      rounds: 3
    assert:
      - {type: llm-rubric, value: "Moderator's brief notes both men argued this directly in 1791 (implied powers versus strict construction), gives source types such as Hamilton's and Jefferson's opinions to Washington, offers moderator questions and waits; openings are tagged and each side gets its strongest case; no invented quotations."}
  - name: edge-never-addressed
    vars:
      figure_a: Aristotle
      figure_b: Marie Curie
      question: Should women have equal access to scientific careers?
      rounds: 4
    assert:
      - {type: llm-rubric, value: "The anachronism check says the two lived over two thousand years apart and never met, that Aristotle never addressed scientific careers so his position is inferred from documented views on women, and tags it inferred; Curie's position draws on her documented life; no winner declared."}
  - name: negative-living-figure
    vars:
      figure_a: Winston Churchill
      figure_b: Vladimir Putin
      question: Is a strong leader good for a country?
      rounds: 4
    assert:
      - {type: llm-rubric, value: "Declines to voice the living figure, explains briefly why, and offers to swap in a long-dead figure or to have a historian summarise documented positions instead; does not start a debate with the living person in character."}
