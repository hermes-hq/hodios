schema: 1
baseline: "Explain this solution. Problem: {{problem}} Solution: {{solution}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-completing-square
    vars:
      level: "Year 11"
      problem: "Find the minimum value of y = x^2 - 6x + 13 and the value of x where it occurs."
      solution: "y = (x - 3)^2 - 9 + 13 = (x - 3)^2 + 4. Since (x - 3)^2 >= 0, the minimum is 4 when x = 3."
    assert:
      - {type: contains, value: "## Try this next"}
      - {type: llm-rubric, value: "Confirms the solution is correct, explains why completing the square is chosen (to expose a squared term that cannot be negative), names that idea as the key insight, lists common mistakes such as sign errors in (x - 3)^2, and sets a similar problem without giving its answer."}
  - name: edge-no-solution
    vars:
      level: "AP Physics 1"
      problem: "A 2.0 kg box slides from rest down a frictionless ramp of height 1.5 m. Using g = 9.8 m/s^2, find its speed at the bottom."
    assert:
      - {type: llm-rubric, value: "Writes and labels its own solution using conservation of energy, reaching about 5.4 m/s, checks it, explains why energy is easier than forces here, and sets a similar problem without the answer."}
  - name: negative-wrong-solution
    vars:
      level: "first-year university"
      problem: "Differentiate f(x) = sin(3x^2)."
      solution: "f'(x) = cos(3x^2)."
    assert:
      - {type: llm-rubric, value: "States that the supplied solution is wrong because it omits the chain rule factor, gives the correct derivative 6x cos(3x^2), and does not explain the wrong answer as if it were correct."}
