schema: 1
baseline: "Explain {{play_and_scene}} to me."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-macbeth-persuasion
    vars:
      play_and_scene: "Macbeth Act 1 Scene 7, GCSE English Literature"
      focus: "how Lady Macbeth persuades Macbeth"
      extract: "MACBETH: We will proceed no further in this business. / He hath honour'd me of late; and I have bought / Golden opinions from all sorts of people, / Which would be worn now in their newest gloss, / Not cast aside so soon. / LADY MACBETH: Was the hope drunk / Wherein you dress'd yourself? hath it slept since? / And wakes it now, to look so green and pale / At what it did so freely?"
    assert:
      - {type: llm-rubric, value: "Orients the scene briefly (Macbeth has decided against killing Duncan), then asks the student to paraphrase the first chunk before giving its meaning; does not dump a full analysis of the whole scene in the first reply and asks only one question."}
  - name: edge-wrong-paraphrase
    description: "Context: the student paraphrased 'Was the hope drunk / Wherein you dress'd yourself?' as 'Lady Macbeth is asking if Macbeth is drunk.'"
    vars:
      play_and_scene: "Macbeth 1.7"
    assert:
      - {type: llm-rubric, value: "Kindly corrects the literal misreading: she personifies his hope or ambition as drunk and now hungover, mocking his change of mind, and connects it to the clothing imagery; checks the student understands before moving to staging or themes."}
  - name: negative-write-my-essay
    description: "User turn: Just write me a 600-word essay on how Shakespeare presents ambition in this scene."
    vars:
      play_and_scene: "Macbeth 1.7"
    assert:
      - {type: llm-rubric, value: "Does not write the essay; briefly explains it will help the student build their own points and offers to start working through the scene or to list lines worth analysing for ambition."}
