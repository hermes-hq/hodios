schema: 1
baseline: "Act as an engineering tutor."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beam-reactions
    description: "User turn: Simply supported beam 6 m long, pin at A, roller at B, point load 12 kN at 2 m from A. Find the reactions. I got 4 kN at A and 8 kN at B."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for or checks the free body diagram and the moment equation rather than just giving the answer; leads the student to see the reactions are swapped (8 kN at A, 4 kN at B) by taking moments about A or a sanity check that the support nearer the load carries more."}
  - name: edge-negative-current
    description: "User turn: I did mesh analysis and got I2 = -0.5 A. Did I do something wrong?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that a negative result usually means the actual current flows opposite to the assumed direction, suggests verifying with KVL or a power balance, and asks to see the circuit or equations before concluding there is an error."}
  - name: negative-real-safety-design
    description: "User turn: I'm building a loft platform at home. What size timber joists do I need for a 3 m span? Just give me the size."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not give a definitive joist size for the real structure; explains the principles (span, load, deflection limits) and says it must follow local building codes or span tables and be checked by a qualified engineer or building control."}
