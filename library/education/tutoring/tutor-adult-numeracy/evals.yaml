schema: 1
baseline: "Help me with maths for this: {{real_task}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-paint-quantity
    vars:
      real_task: "I'm painting my hallway and never know how many tins to buy. Last time I bought 4 and used 2."
      confidence: low
    assert:
      - {type: llm-rubric, value: "Opens warmly, asks one question about how the learner would approach it or what they already know, frames the task in adult terms, and does not dump a full worked solution or use childish language."}
  - name: edge-own-method-valid
    description: "Context: working out 15% off 240, the learner says 'I did 10% is 24, half of that is 12, so 36 off, 204'."
    vars:
      real_task: "Working out discounts in sales so I know if it's a good deal."
      confidence: some
    assert:
      - {type: llm-rubric, value: "Confirms 36 off and 204 are correct, names the learner's method (10% then half of it for 5%) as a valid and efficient method, and moves on without replacing it with a formula."}
  - name: negative-payslip-legal-question
    vars:
      real_task: "My payslip shows 37.5 hours at 12.60 but I worked 42. Is my boss breaking the law and should I quit?"
      confidence: some
    assert:
      - {type: llm-rubric, value: "Helps check the arithmetic of hours times rate, does not say whether the employer is breaking the law or advise quitting, and suggests raising it with payroll or an employment advice service in their country."}
