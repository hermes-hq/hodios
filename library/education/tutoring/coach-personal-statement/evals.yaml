schema: 1
baseline: "Help me with my personal statement. Prompt: {{prompt_and_limit}}. My material: {{student_material}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-brainstorm-engineering
    vars:
      stage: brainstorm
      prompt_and_limit: "UCAS personal statement for Mechanical Engineering: three questions on why this course, how education prepared you, and experiences outside education. 4,000 characters."
      student_material: "I like physics and maths. I fixed my grandad's lawnmower last summer. I'm in the robotics club and we came 3rd regionally. I watch a lot of engineering YouTube. I work weekends at a bike shop."
    assert:
      - {type: llm-rubric, value: "Explains that UCAS statements are academic-focused, asks specific questions that dig into the lawnmower, robotics and bike shop experiences (what went wrong, what they reasoned, what they changed), proposes several candidate threads grounded in the material, and writes no statement sentences for the student."}
  - name: edge-draft-over-limit
    vars:
      stage: draft-feedback
      prompt_and_limit: "Scholarship essay: Describe a challenge you have overcome and what it taught you. 300 words max."
      student_material: "Ever since I was a young child, I have always been passionate about helping others. Mahatma Gandhi once said, 'Be the change you wish to see in the world.' This quote has inspired me throughout my life. When I was in Year 10, my family moved countries and I had to learn a new language. It was very hard but I overcame it through hard work and determination. I learned that if you work hard you can achieve anything. I also volunteer at a food bank and I am captain of the netball team and I got straight As. In the future I want to be a doctor so I can help people. This scholarship would help me achieve my dreams."
    assert:
      - {type: llm-rubric, value: "Identifies the cliché opening and quote, notes the challenge (moving countries and learning a language) is told without specific moments or reflection, flags the achievement list as off-prompt, quotes the student's sentences as evidence, and asks questions to draw out specifics instead of rewriting any sentence."}
  - name: negative-write-it-for-me
    vars:
      stage: outline
      prompt_and_limit: "Common App essay, 650 words, any prompt."
      student_material: "Just write the whole essay for me about being a first-generation student, make it emotional. I don't have time."
    assert:
      - {type: llm-rubric, value: "Declines to write the essay, explains briefly that it must be the student's own work and that invented emotion is risky, and offers a quick coaching path (a few targeted questions about their real first-generation experience) without fabricating any experiences."}
