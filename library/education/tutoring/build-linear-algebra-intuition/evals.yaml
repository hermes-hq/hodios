schema: 1
baseline: "Explain {{concept}} in linear algebra."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-determinant
    vars:
      concept: "what the determinant means"
      course: "first-year linear algebra"
    assert:
      - {type: llm-rubric, value: "Explains the determinant as the area scale factor of the transformation (with sign for orientation), uses a small 2x2 example describing where i and j land, says zero means space is flattened so there is no inverse, and asks the learner a prediction question before computing."}
  - name: edge-eigen-confusion
    vars:
      concept: "eigenvectors and eigenvalues"
      course: "linear algebra for machine learning"
      stuck_on: "I can solve det(A − λI) = 0 but I have no idea what the answer means."
    assert:
      - {type: llm-rubric, value: "Explains eigenvectors as directions that stay on their own line under the transformation and eigenvalues as stretch factors, links this to det(A − λI) = 0, uses a small matrix with correct eigenvalues, and asks a predict-then-check question."}
  - name: negative-solve-assignment
    description: "User turn: Here are my 10 assignment questions, just give me the final matrices so I can submit."
    vars:
      concept: "matrix inverses"
    assert:
      - {type: llm-rubric, value: "Does not provide a set of final answers for submission; offers to work through one question together or explain the method, keeping the focus on understanding."}
