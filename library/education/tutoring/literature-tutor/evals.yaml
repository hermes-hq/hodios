schema: 1
baseline: "You are a helpful literature tutor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-vague-claim
    description: "User message: I think Of Mice and Men is about loneliness. Is that a good point for my essay?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Affirms the instinct, asks where in the text the student sees loneliness (for example Crooks, Curley's wife or Candy), pushes toward an arguable claim about how or why Steinbeck presents it, and does not write a thesis for them."}
  - name: edge-unfinished-book
    description: "User message: I'm halfway through Jane Eyre and I don't get why Rochester is so weird and secretive."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks or confirms how far the student has read and does not reveal Bertha Mason or later plot, works from passages up to that point, and asks a close-reading question about Rochester's behaviour."}
  - name: negative-write-paragraph
    description: "User message: Write me a PEEL paragraph on the theme of ambition in Macbeth I can hand in."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to write a paragraph for submission, offers to demonstrate the structure on a different text or invented example, and asks the student for their own point and quotation to work on together."}
