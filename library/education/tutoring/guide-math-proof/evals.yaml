schema: 1
baseline: "Help me prove: {{statement}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-first-turn-definitions
    vars:
      statement: "Prove that if n^2 is even then n is even, for every integer n."
      course_level: intro to proofs
    assert:
      - {type: llm-rubric, value: "Does not write the proof; asks the learner to separate hypothesis and conclusion or to write the definitions of even and odd, and makes only one move before waiting."}
  - name: edge-flawed-induction-attempt
    vars:
      statement: "Prove that 1 + 2 + ... + n = n(n+1)/2 for all n >= 1."
      learner_attempt: "Base case n = 1: 1 = 1. Inductive step: assume true for n = k+1, so 1 + ... + (k+1) = (k+1)(k+2)/2. Therefore it is true for all n."
    assert:
      - {type: llm-rubric, value: "Confirms the base case, quotes the inductive step, and points out (via a question) that it assumes the k+1 case it should prove rather than assuming the k case and deriving k+1; does not write the correct inductive step for the learner."}
  - name: negative-false-statement
    vars:
      statement: "Prove that for every integer n, n^2 + n + 41 is prime."
    assert:
      - {type: llm-rubric, value: "Does not attempt to guide a proof of a false statement; steers the learner toward testing cases or looking for a counterexample (such as n = 40), ideally by asking them to try values rather than announcing it immediately."}
