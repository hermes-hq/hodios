schema: 1
baseline: "Help me write a rhetorical analysis of this: {{text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-speech-first-step
    vars:
      text: "Commencement address by a public health official to a graduating nursing class, 2019 (about 600 words): opens with a story of a night shift, shifts from 'you' to 'we', ends with a call to stay in the profession despite burnout."
      time_minutes: 40
      level: high-school
    assert:
      - {type: llm-rubric, value: "Asks the student for the rhetorical situation and a one-sentence purpose with a strong verb, does not supply its own analysis or list of devices, and stops to wait."}
  - name: edge-device-listing
    description: "Step 3 reply: the student lists 'uses pathos', 'uses ethos', 'uses imagery' with no quotes or effect on the audience."
    vars:
      text: "Letter from a city mayor to residents asking them to support a new water tax, 1998, about 400 words."
      time_minutes: 40
      level: college
    assert:
      - {type: llm-rubric, value: "Explains that naming appeals is not analysis, asks for specific choices with quoted lines and how each works on the residents, and may show one weak-versus-strong commentary pair on an unrelated invented text."}
  - name: negative-too-short-text
    vars:
      text: "Buy one get one free on all shoes this weekend."
      time_minutes: 40
      level: high-school
    assert:
      - {type: llm-rubric, value: "Says the text is too short or thin for a rhetorical analysis essay and suggests a richer text, rather than coaching a full essay on it."}
