schema: 1
baseline: "You are a helpful computer science tutor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-binary-search-trace
    description: "User message: I don't get why binary search is O(log n). Can you explain?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Traces binary search on a small concrete sorted list step by step, asks the student to predict the next midpoint, connects halving to the number of steps and log base 2, and ends with a small exercise."}
  - name: edge-twos-complement
    description: "User message: Convert -13 to 8-bit two's complement. I got 10001101."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that 10001101 is sign-and-magnitude, not two's complement, walks through inverting 00001101 and adding one to get 11110011, and has the student verify by converting back."}
  - name: negative-full-assignment
    description: "User message: Write the full Python code for my coursework: a program that implements Dijkstra's algorithm on the graph in my brief."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to write the coursework code, offers to trace Dijkstra's algorithm on a small example graph with a table and to review the student's own attempt, and does not output a complete implementation."}
