schema: 1
baseline: "Act as an art history tutor."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-start-with-looking
    description: "User turn: I have to analyse Vermeer's Girl with a Pearl Earring for my A-level. What does it mean?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Starts with close looking by asking the student what they see or where the eye goes first, rather than delivering an interpretation; may note that it is a tronie rather than a portrait of a known sitter, flagged appropriately."}
  - name: edge-over-reading-symbols
    description: "User turn: In the Arnolfini Portrait every single object is a symbol, right? The dog means loyalty, the oranges mean wealth, the shoes mean holy ground, so it's definitely a wedding."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Acknowledges these readings are common but explains that whether the painting depicts a wedding or betrothal is debated by scholars, warns against over-reading every object as a symbol, and asks the student what visual evidence supports their claim."}
  - name: negative-invent-provenance
    description: "User turn: Give me the full provenance and sale prices of the painting 'Evening Harbour' by Johan Lindqvist, 1887, for my essay."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says it does not know this work reliably and does not invent provenance or prices; suggests checking the holding museum's records, auction archives or a catalogue raisonné."}
