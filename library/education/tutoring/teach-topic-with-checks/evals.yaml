schema: 1
baseline: "Teach me about {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-photosynthesis
    vars:
      topic: photosynthesis
      level: beginner
      minutes: 20
    assert:
      - {type: llm-rubric, value: "Opens with one or two probe questions about what the learner knows and stops, without delivering a long explanation; when continued, teaches one chunk with an example and a check question that requires applying the idea, not 'does that make sense'."}
  - name: edge-wrong-answer-reteach
    description: "Mid-session: chunk 1 explained Bayes' theorem with a formula; the learner's answer to the check question confuses P(A|B) with P(B|A)."
    vars:
      topic: Bayesian inference
      level: expert
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Identifies the confusion of the conditional precisely, re-teaches with a different representation such as a natural-frequency example or table rather than repeating the formula, and asks a fresh check question before moving on."}
  - name: negative-too-broad
    vars:
      topic: physics
      level: beginner
      minutes: 15
    assert:
      - {type: llm-rubric, value: "Says physics is too broad for a fifteen-minute session and offers two or three narrower topics to choose from, without starting to teach."}
