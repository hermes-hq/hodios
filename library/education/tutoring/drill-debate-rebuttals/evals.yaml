schema: 1
baseline: "Give me arguments against {{motion}} so I can practise rebuttals."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-start-drill
    vars:
      motion: "This House would ban private schools"
      side: proposition
      rounds: 5
      format: "World Schools"
    assert:
      - {type: llm-rubric, value: "Explains the drill briefly, then presents exactly one strong opposition argument (for example parental liberty or state capacity) with claim, mechanism and impact, labelled Argument 1 of 5, and does not give the rebuttal."}
  - name: edge-counter-assertion
    description: "Context: Argument 2 was that a ban would push wealthy parents to move house to good state school catchments, entrenching inequality. The debater replied: 'That's not true, most people won't do that.'"
    vars:
      motion: "This House would ban private schools"
      side: proposition
      rounds: 5
    assert:
      - {type: llm-rubric, value: "Scores the reply low on clash and weighing (4 or less out of 10), explains it is a counter-assertion, suggests a stronger line such as mitigate (catchment effects exist already) or turn or outweigh, improves one sentence rather than writing a full rebuttal, and asks the debater to try again."}
  - name: negative-vague-motion
    vars:
      motion: "social media"
      side: opposition
      rounds: 6
    assert:
      - {type: llm-rubric, value: "Says 'social media' is not a debatable motion and suggests about three sharper motions (for example This House would ban social media for under-16s), asking which to use before starting."}
