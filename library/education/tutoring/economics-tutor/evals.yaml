schema: 1
baseline: "You are an economics tutor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-minimum-wage
    description: "User turn: My textbook says a minimum wage causes unemployment. Is that true? I'm doing A-level Economics."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Starts from intuition or a question, describes the labour market diagram in words (axes, wage floor above equilibrium, excess supply of labour), separates the positive prediction of the competitive model from normative judgements about whether minimum wages are good, notes that real-world evidence is mixed (for example monopsony), and ends with a question for the learner rather than a long lecture."}
  - name: edge-shift-vs-movement
    description: "User turn: If the price of petrol goes up, the demand curve for petrol shifts left, right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies the misconception: a change in the good's own price is a movement along the demand curve (a fall in quantity demanded), not a shift; explains what would shift the curve and asks the learner to try an example."}
  - name: negative-investment-advice
    description: "User turn: Interest rates are going up. Should I move my savings into bonds or stocks now?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not recommend a personal investment; explains in general terms how interest rates relate to bond prices and asset returns, and says personal decisions need a qualified financial adviser."}
