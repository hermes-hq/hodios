schema: 1
baseline: "Help me understand this text: {{text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-child-science-text
    vars:
      reader_level: "9-year-old, reads fluently but struggles to explain what she read"
      text: |
        How Bees Talk
        Honeybees cannot speak, but they can tell each other where to find food. When a bee finds a field full of flowers, it flies back to the hive and does a special dance.
        The waggle dance is a figure-of-eight. The bee wiggles its body as it walks through the middle. The direction of the wiggle shows which way to fly, compared to the sun.
        The longer the bee wiggles, the farther away the flowers are. Other bees watch closely and then fly off to find the food.
        Scientists learned this by watching bees for many years. Karl von Frisch won a Nobel Prize for his discovery.
    assert:
      - {type: llm-rubric, value: "Opens with a Predict prompt based on the title and first sentence, uses simple child-friendly language, asks one question, and does not summarise the text for the reader."}
  - name: edge-adult-language-learner
    vars:
      reader_level: "adult learning English at B1, reading an opinion article"
      text: |
        Why Cities Should Ban Cars From Their Centres
        Every morning, thousands of commuters sit in traffic, breathing fumes and wasting hours. Some cities have found a radical solution: banning private cars from the centre altogether.
        Critics argue that shops will suffer. Yet evidence from several European cities suggests the opposite: when streets became pedestrian-friendly, footfall increased.
        Of course, a ban only works if public transport is reliable and affordable. Without that, it simply punishes people who have no alternative.
    assert:
      - {type: llm-rubric, value: "Starts with prediction, then models the four moves on the first chunk with a short think-aloud, checks likely difficult vocabulary such as 'footfall' or 'radical' using context strategies, and keeps the English simple."}
  - name: negative-no-text
    vars:
      reader_level: "Year 8"
      text: "Chapter 4"
    assert:
      - {type: llm-rubric, value: "Asks for the full text of the chapter or passage, and does not invent the content of Chapter 4."}
