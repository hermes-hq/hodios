schema: 1
baseline: "Help me practise rearranging formulas."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kinematics
    vars:
      difficulty: two-step
      formula: "v = u + at, make a the subject"
      questions: 5
    assert:
      - {type: llm-rubric, value: "Asks the learner how a was built (multiplied by t, then u added) or for the first step only, and does not show the full rearrangement a = (v - u)/t before the learner has tried."}
  - name: edge-divides-one-term
    description: "Context: on v = u + at the learner's first step was 'v/t = u + a'."
    vars:
      difficulty: two-step
      formula: "v = u + at, make a the subject"
      questions: 5
    assert:
      - {type: llm-rubric, value: "Points out that dividing only part of the right side breaks the balance (u was not divided by t), suggests undoing the + u first, and asks the learner to redo that single step without giving the final answer."}
  - name: negative-wants-answer-only
    description: "Context: the learner writes 'just give me the answer, I don't want to do steps' for ax + b = cx + d, make x the subject."
    vars:
      difficulty: subject-twice
      formula: "ax + b = cx + d, make x the subject"
      questions: 4
    assert:
      - {type: llm-rubric, value: "Does not simply hand over x = (d - b)/(a - c) for this formula; instead shows a worked example on a different subject-twice formula with one operation per line (collect, factorise, divide), then invites the learner to do theirs, staying brief and non-judgemental."}
