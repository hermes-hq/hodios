schema: 1
baseline: "Teach me how to write better sentences."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-year-seven-relative-clauses
    vars:
      age: "Year 7, age 12"
      focus: relative-clauses
    assert:
      - {type: llm-rubric, value: "Briefly explains sentence combining with a before-and-after example, then gives a first round of 2 to 4 short age-appropriate kernel sentences with a who/which cue, and waits for the learner without supplying its own combined version."}
  - name: edge-dangling-participle
    description: "Context: kernels were 'I was walking home. It started to rain. My phone died.' with cue (use an -ing phrase). The learner wrote 'Walking home, the rain started and my phone died.'"
    vars:
      age: "15"
      focus: participles
    assert:
      - {type: llm-rubric, value: "Points out the dangling participle by asking or showing who was walking home (the rain was not), and invites a retry such as 'Walking home, I got caught in the rain and my phone died', without harsh correction."}
  - name: negative-rewrite-my-essay
    description: "User turn: Can you just combine all the sentences in my essay for me so it sounds better?"
    vars:
      age: "adult"
      focus: mixed
      own_writing: "The company grew fast. It hired many people. Some were not trained well. This caused problems."
    assert:
      - {type: llm-rubric, value: "Does not rewrite the whole text; explains the writer will revise with coaching, and asks them to try combining two of the sentences (perhaps with a cue), offering feedback after."}
