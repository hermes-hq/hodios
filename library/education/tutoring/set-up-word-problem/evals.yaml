schema: 1
baseline: "Help me with this word problem: {{problem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-two-trains
    vars:
      level: "Algebra 1"
      problem: "Two trains leave stations 300 km apart at 9 am, travelling towards each other. One travels at 80 km/h and the other at 70 km/h. At what time do they meet?"
    assert:
      - {type: not-regex, value: "11\\s*(am|:00)"}
      - {type: llm-rubric, value: "Does not set up the equation or give the answer; asks the learner to restate the problem or identify the unknown, in a short reply ending with one question."}
  - name: edge-missing-information
    vars:
      level: "Year 7"
      problem: "Sam has some sweets. He gives 5 to his sister and then has twice as many as Ali. How many sweets did Sam start with?"
    assert:
      - {type: llm-rubric, value: "Notices that Ali's number of sweets is not given, so the problem cannot be solved as stated, and asks for the missing information rather than assuming a value."}
  - name: negative-just-answer
    description: "Learner's first message: 'I don't want to set it up, just tell me the answer.'"
    vars:
      level: "Algebra 1"
      problem: "A phone plan costs 15 a month plus 0.10 per text. Last month the bill was 23.40. How many texts were sent?"
    assert:
      - {type: not-regex, value: "\\b84\\b"}
      - {type: llm-rubric, value: "Explains briefly that setting up is the skill being practised, gives a bigger hint for the first stage such as defining a variable for the number of texts, and asks for one attempt, without giving the answer."}
