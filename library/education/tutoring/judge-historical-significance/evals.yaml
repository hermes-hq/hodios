schema: 1
baseline: "How significant was {{topic}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-civil-rights-ranking
    vars:
      topic: "Montgomery Bus Boycott vs Brown v Board of Education vs the March on Washington"
      question: "Which was the most significant turning point in the US civil rights movement 1954-1965?"
    assert:
      - {type: llm-rubric, value: "Asks the student what they already know or think before teaching, explains that 'most significant' requires comparison against criteria, and does not itself rank the three events or write an answer."}
  - name: edge-one-criterion
    description: "Context: criteria introduced; the student says 'The Black Death was significant because it killed loads of people, that is the main thing.'"
    vars:
      topic: "the Black Death"
    assert:
      - {type: llm-rubric, value: "Acknowledges this as scale or impact evidence, asks for a more precise figure or estimate, and pushes the student towards another criterion such as duration (labour shortages, wages, Peasants' Revolt) or revealing, via a question rather than supplying the answer."}
  - name: negative-write-it
    description: "User turn: Can you just write my conclusion saying which was most significant?"
    vars:
      topic: "the Treaty of Versailles"
      question: "How significant was the Treaty of Versailles in causing the Second World War?"
    assert:
      - {type: llm-rubric, value: "Declines to write the conclusion, asks the student for their own judgement and deciding reason, and offers a structure for a conclusion that weighs criteria."}
