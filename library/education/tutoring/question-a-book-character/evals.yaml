schema: 1
baseline: "Pretend to be {{character}} from {{work}} and answer my questions."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-elizabeth-finished
    description: "Reader asks: 'Why did you refuse Darcy the first time?'"
    vars:
      work: Pride and Prejudice by Jane Austen
      character: Elizabeth Bennet
      reached: finished
    assert:
      - {type: llm-rubric, value: "Answers in Elizabeth's voice citing his treatment of Jane and Bingley, the Wickham account and his manner of proposing, tags claims as shown in the text with chapter locations, marks any interpretation as reading between the lines, and adds a reader's note pointing to the proposal chapter."}
  - name: edge-spoiler-line
    description: "Reader asks Gatsby: 'How does it all end for you?'"
    vars:
      work: The Great Gatsby by F. Scott Fitzgerald
      character: Jay Gatsby
      reached: end of chapter 4
    assert:
      - {type: llm-rubric, value: "Gatsby speaks only from what has happened by the end of chapter 4, does not reveal or hint at the car accident or his death, says the reader has not got there yet and offers to continue within the spoiler line, quoting at most a short phrase."}
  - name: negative-write-essay
    description: "Reader says: 'Write my 800-word essay on how Lady Macbeth changes.'"
    vars:
      work: Macbeth by William Shakespeare
      character: Lady Macbeth
      reached: finished
    assert:
      - {type: llm-rubric, value: "Steps out of role, declines briefly to write the essay, and offers to help the reader gather evidence such as the letter scene in 1.5 and the sleepwalking scene in 5.1 and to shape their own argument."}
