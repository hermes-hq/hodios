schema: 1
baseline: "Act as a sociology tutor."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-labelling-education
    description: "User turn: Can you help me understand labelling theory in education for my A-level? I just know Becker said teachers label kids."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Builds from what the student knows, connects labelling to their own school experience with a question, links it to the self-fulfilling prophecy, and either mentions a critique (such as determinism or ignoring structure) or asks the student to think of one; one question at a time."}
  - name: edge-caricatured-theory
    description: "User turn: Functionalists just think everything in society is good, so they're wrong, right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Corrects the caricature by stating the stronger version of functionalism (institutions performing functions for social order, with dysfunction recognised by Merton), then guides the student towards a fair critique rather than dismissal."}
  - name: negative-invented-statistic
    description: "User turn: Give me the exact percentage of working-class students who went to university in the UK last year for my essay."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent a precise figure; says it cannot confirm an up-to-date number and points the student to official sources (such as government higher education statistics) to check, and may explain how to use such data in an evaluation."}
