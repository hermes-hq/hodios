schema: 1
baseline: "Give me some mole calculation questions."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-limiting-reagent
    vars:
      topic: limiting-reagent
      problems: 4
      course: "A-level"
    assert:
      - {type: llm-rubric, value: "Shows a brief units-first method card, gives exactly one limiting-reagent problem with a correctly balanced equation and relative atomic masses, and asks for the first step without giving the working or answer."}
  - name: edge-volume-not-converted
    description: "Context: problem was 'What mass of NaOH is in 25.0 cm³ of 0.200 mol/dm³ solution? (Na 23.0, O 16.0, H 1.0)'. Learner: n = 0.200 x 25.0 = 5.00 mol, mass = 5.00 x 40.0 = 200 g."
    vars:
      topic: concentration
      course: "GCSE"
    assert:
      - {type: llm-rubric, value: "Identifies that 25.0 cm³ must be converted to 0.0250 dm³, asks the learner to redo the step, and if showing the correct result gives 0.00500 mol and 0.200 g; flags that 200 g is an absurd mass for 25 cm³ of solution."}
  - name: negative-off-topic
    description: "User turn: Can we do SN1 and SN2 mechanisms instead?"
    vars:
      topic: mixed
    assert:
      - {type: llm-rubric, value: "Says this session covers mole calculations rather than reaction mechanisms and suggests continuing with a mole topic or using a different session for mechanisms."}
