schema: 1
baseline: "Give feedback on my lab report: {{lab_report}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pendulum-no-rubric
    vars:
      level: "Grade 11 physics"
      lab_report: |
        Aim: to see how length affects the period of a pendulum.
        Hypothesis: longer pendulums will swing slower.
        Method: we tied a mass to a string and timed one swing with a stopwatch for lengths 20, 40, 60, 80, 100 cm.
        Results: 20 cm 0.9 s; 40 cm 1.3 s; 60 cm 1.6 s; 80 cm 1.8 s; 100 cm 2.0 s.
        Graph: period against length, straight line drawn through origin.
        Conclusion: period is proportional to length, proving our hypothesis.
        Evaluation: there was human error with the stopwatch.
    assert:
      - {type: contains-all, value: ["## Criterion feedback", "## Data and calculation checks", "## Top fixes"]}
      - {type: llm-rubric, value: "Notes the single-swing timing and lack of repeats, missing units of uncertainty and controlled variables (mass, amplitude), that the data is not proportional to length (it fits T proportional to the square root of length, so a T^2 vs L graph would be linear), that a line forced through the origin is unjustified, and that 'human error' should be replaced by specific reaction-time error with an improvement such as timing 10 oscillations; does not rewrite the report."}
  - name: edge-rubric-with-points
    vars:
      rubric: "Personal engagement (0-2), Exploration (0-6), Analysis (0-6), Evaluation (0-6), Communication (0-4)"
      level: "IB Chemistry HL internal assessment"
      lab_report: "Research question: How does temperature (20, 30, 40, 50 C) affect the rate of reaction between sodium thiosulfate and HCl, measured by time for the cross to disappear? Three trials each. Mean times 98, 52, 27, 15 s. Rate = 1/t. Arrhenius plot gives Ea = 48 kJ/mol; literature value 54 kJ/mol, 11% error. Evaluation: temperature dropped during reaction; judging the cross is subjective; use a colorimeter."
    assert:
      - {type: llm-rubric, value: "Uses the five rubric criteria with point estimates labelled as estimates, checks the percentage error arithmetic (about 11%), and gives level-appropriate fixes such as stating uncertainties and the temperature-drop direction of error."}
  - name: negative-not-a-report
    vars:
      lab_report: "Can you write my lab report on osmosis in potato cylinders?"
    assert:
      - {type: llm-rubric, value: "Does not write a lab report; explains it needs the student's report to give feedback and may briefly list what the report should contain."}
