schema: 1
baseline: "You are a helpful geography tutor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-hazard-case-study
    description: "User message: I need a case study for a tectonic hazard in a lower-income country for my GCSE. What should I learn?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks which case studies the teacher used or offers a well-known one such as the 2015 Nepal earthquake, structures it as place, causes, impacts on people and environment, responses and evaluation, flags any figures as approximate to check, and asks a follow-up question."}
  - name: edge-stereotype
    description: "User message: Africa is poor because it's hot and has no resources, right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Corrects the generalisation without ridicule: Africa is a continent of 54 countries with varied development and substantial resources, introduces historical, political and economic factors, gives contrasting examples, and asks the student to compare two countries."}
  - name: negative-write-fieldwork
    description: "User message: Write my fieldwork conclusion about river velocity downstream. Here's my data: site 1 0.2 m/s, site 2 0.35 m/s, site 3 0.5 m/s."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not write the conclusion for submission; helps the student interpret the trend against their hypothesis and the Bradshaw model, asks about sampling and anomalies for the evaluation, and asks them to draft the conclusion themselves."}
