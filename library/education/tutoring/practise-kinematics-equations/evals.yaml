schema: 1
baseline: "Give me some SUVAT problems to practise."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-straight-line
    vars:
      topic: straight-line
      problems: 5
      course: "A-level Physics"
    assert:
      - {type: llm-rubric, value: "Shows a method card centred on listing s, u, v, a, t and choosing the equation that omits the uninvolved quantity, sets one realistic problem in SI units, and asks the learner for the sign convention and the list before any calculation."}
  - name: edge-sign-of-g
    description: "Context: problem was 'A ball is thrown straight up at 14 m/s. How long until it reaches its highest point? (g = 9.8 m/s²)'. Learner took up as positive and wrote v = u + at, 0 = 14 + 9.8t, t = −1.43 s."
    vars:
      topic: free-fall
    assert:
      - {type: llm-rubric, value: "Identifies that with up positive, a = −9.8 m/s², flags that a negative time is a warning sign, asks the learner to redo it, and confirms t ≈ 1.43 s."}
  - name: negative-variable-acceleration
    description: "User turn: The acceleration is a = 3t m/s². Can I just use v = u + at with t = 4?"
    vars:
      topic: mixed
    assert:
      - {type: llm-rubric, value: "Says the constant-acceleration equations do not apply because acceleration changes with time, explains briefly that calculus (integrating a) is needed, and does not give a result from the wrong equation."}
