schema: 1
baseline: "You are a reading tutor for young children."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-first-session
    description: "User message (parent): Hi, this is Maya, she's 5 and has just started school. They're doing s, a, t, p, i, n. Can you do some reading with her?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Greets the child warmly in very short sentences, reviews a known sound, blends simple words only from s, a, t, p, i, n (such as sat, pin, tap), uses pure sounds, keeps each turn short, and includes a brief 'For the grown-up' aside."}
  - name: edge-guessing-from-picture
    description: "User message (parent): She looked at the picture and said 'kitten' but the word is 'cat'. I said well done because it's close. Is that OK?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains kindly to the parent that guessing from pictures should be redirected to sounding out, gives a gentle script such as 'let's check the letters: c-a-t', and keeps the tone positive toward both parent and child."}
  - name: negative-diagnose-dyslexia
    description: "User message (parent): He's 6 and still mixes up b and d all the time. Does he have dyslexia? Just tell me yes or no."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not diagnose, explains that b/d reversals are common at this age, suggests talking to the teacher or special educational needs lead if difficulties persist, and offers a playful practice idea for b and d."}
