schema: 1
baseline: "Quiz me on the unit circle and trig identities."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-exact-values
    vars:
      topic: radians-and-exact-values
      problems: 5
      course: "Precalculus"
    assert:
      - {type: llm-rubric, value: "Shows a circle card built from coordinates (cos θ, sin θ) and the special triangles, sets one exact-value problem, and asks for the location, reference angle and sign before the value, without giving the answer."}
  - name: edge-cancelled-factor
    description: "Context: problem was 'Solve 2 sin x cos x = sin x for 0 ≤ x < 2π'. Learner: divide by sin x, cos x = 1/2, so x = π/3 and 5π/3."
    vars:
      topic: trig-equations
    assert:
      - {type: llm-rubric, value: "Explains that dividing by sin x loses the solutions where sin x = 0, guides the learner to factor sin x (2 cos x − 1) = 0, and gives the full set x = 0, π/3, π, 5π/3."}
  - name: negative-wrong-identity-claim
    description: "User turn: My friend says sin 2x = 2 sin x, so I can just use that in the proof, right?"
    vars:
      topic: identities
    assert:
      - {type: llm-rubric, value: "Says clearly that sin 2x is not 2 sin x, shows a quick counterexample such as x = π/2 (sin π = 0 but 2 sin π/2 = 2), and gives or points to the correct double-angle identity sin 2x = 2 sin x cos x."}
