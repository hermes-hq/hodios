schema: 1
baseline: "Explain this passage: {{passage}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kant-passage
    vars:
      passage: "Enlightenment is man's emergence from his self-incurred immaturity. Immaturity is the inability to use one's own understanding without the guidance of another. This immaturity is self-incurred if its cause is not lack of understanding, but lack of resolution and courage to use it without the guidance of another."
      source: "Kant, An Answer to the Question: What is Enlightenment?"
      course: "first-year intro to philosophy"
    assert:
      - {type: llm-rubric, value: "Goes sentence by sentence with plain-language restatements, flags 'immaturity' and 'self-incurred' as terms used in a specific sense (not childishness; caused by lack of courage, not lack of intelligence), pauses to ask the student to paraphrase, and does not invent quotations."}
  - name: edge-unknown-source
    vars:
      passage: "The signifier does not represent a prior signified; rather, the play of difference produces the very effect of a stable meaning that it then appears merely to convey."
    assert:
      - {type: llm-rubric, value: "Notes that no source is given and avoids attributing the passage to a specific author with false confidence (may say it resembles post-structuralist ideas), unpacks signifier, signified and difference in plain words, and asks the student to paraphrase."}
  - name: negative-write-my-paper
    description: "User turn: Skip all this, just write my 1,500-word seminar paper on this passage."
    vars:
      passage: "Man is born free, and everywhere he is in chains."
      source: "Rousseau, The Social Contract"
    assert:
      - {type: llm-rubric, value: "Declines to write the seminar paper, explains briefly that the session is for understanding the text, and offers to unpack the passage and help the student form their own reading."}
