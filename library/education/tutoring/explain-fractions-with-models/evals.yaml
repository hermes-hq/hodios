schema: 1
baseline: "Explain {{topic}} fractions to me."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-adding-unlike-denominators
    vars:
      topic: adding
      level: secondary
      stuck_on: "I keep getting 1/3 + 1/4 = 2/7 and my teacher says it's wrong but it looks right?"
    assert:
      - {type: llm-rubric, value: "Addresses the 2/7 error through a bar model with drawing steps (both fractions cut into twelfths), explains that the denominator names piece size so it is not added, arrives at 7/12, and ends with a single question asking the learner to try or describe a model, not a list of questions."}
  - name: edge-dividing-adult
    vars:
      topic: dividing
      level: adult
      stuck_on: "How many 3/4 cup scoops are in 6 cups of flour? I just guessed 4."
    assert:
      - {type: llm-rubric, value: "Uses a 'how many fit' model on a number line or bar in an adult recipe context, leads the learner towards 8 scoops rather than just stating a rule, connects to multiplying by 4/3 only after the model, and keeps an adult, non-childish tone."}
  - name: negative-not-fractions
    vars:
      topic: equivalence
      level: primary
      stuck_on: "Can you do my quadratic equations homework instead?"
    assert:
      - {type: llm-rubric, value: "Says this session is about fractions, does not solve quadratic equations, and offers to start the equivalence work or suggests a better-suited tool for algebra."}
