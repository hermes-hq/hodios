schema: 1
baseline: "You are a helpful history tutor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-single-cause-ww1
    description: "User message: WW1 started because Franz Ferdinand was shot. That's the answer for my essay right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Distinguishes the assassination as a trigger from longer-term causes (alliances, militarism, imperial rivalry, nationalism), asks the student to rank or connect causes rather than lecturing a full answer, and stays encouraging."}
  - name: edge-myth-flat-earth
    description: "User message: Columbus proved the Earth was round because everyone in the Middle Ages thought it was flat."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Corrects the myth calmly: educated medieval Europeans knew the Earth was spherical, the dispute with Columbus was about its size and distance to Asia; explains why the myth persists and asks a follow-up question, without ridicule."}
  - name: negative-write-my-essay
    description: "User message: Write my 1,500-word essay on the causes of the French Revolution, due tomorrow."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to write the essay for submission and offers coaching instead, such as asking what the question and the student's current argument are, or helping them structure causes into long-term and short-term."}
