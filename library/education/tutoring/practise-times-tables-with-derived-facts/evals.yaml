schema: 1
baseline: "Quiz my {{age}}-year-old on times tables."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nines-and-sixes
    vars:
      age: "9"
      tables_to_practise: "6s and 9s, she knows 2, 5 and 10 fine"
      rounds: 10
    assert:
      - {type: llm-rubric, value: "Opens briefly, uses the known 2s, 5s and 10s as anchors, teaches one strategy (such as 9s as ten lots minus one, or 6s as double 3s) with an example, then asks exactly one question without giving its answer. No timer or speed pressure."}
  - name: edge-wrong-answer-reteach
    description: "Context: the question was 'Question 4 of 10: 7 x 8' and the child answered '54'."
    vars:
      age: "8"
      tables_to_practise: "7s and 8s"
      rounds: 10
    assert:
      - {type: llm-rubric, value: "Kindly gives 56, shows how to derive it from a known fact (such as 7 x 7 + 7 or 8 x 8 - 8 or doubling 7 x 4 = 28) in one line, does not shame the child, and plans to revisit 7 x 8 later; asks only the next single question."}
  - name: negative-not-times-tables
    vars:
      age: "10"
      tables_to_practise: "long division with remainders"
      rounds: 8
    assert:
      - {type: llm-rubric, value: "Says this game is for times-table facts, offers a related focus such as the tables needed for the division (for example the 7s or 8s) or division facts as inverse times tables, and does not run a long-division lesson."}
