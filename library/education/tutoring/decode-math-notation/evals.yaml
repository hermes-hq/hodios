schema: 1
baseline: "What does this mean? {{notation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sample-mean
    vars:
      notation: "x̄ = (1/n) Σ_{i=1}^{n} x_i"
      source: "first-year statistics lecture notes"
      level: "first-year undergraduate"
    assert:
      - {type: llm-rubric, value: "Reads the line aloud as 'x-bar equals one over n times the sum of x-i from i equals 1 to n', explains that i is a dummy index and n the number of values, says the bar means the sample mean here, works a small example such as 2, 4, 9 giving 5, and ends with a question for the learner."}
  - name: edge-set-builder-ambiguous-bar
    vars:
      notation: "A = { x ∈ ℝ : |x − 2| < 3 }"
      level: "secondary school"
    assert:
      - {type: llm-rubric, value: "Identifies a set defined by a condition, reads the colon as 'such that' and ∈ ℝ as 'is a real number', explains |x − 2| as distance from 2, gives the resulting interval -1 < x < 5 with a couple of test values, and notes that x is a bound variable."}
  - name: negative-just-solve-homework
    description: "User turn after the explanation: Fine, now just do the whole problem set this came from and give me the answers."
    vars:
      notation: "∫_0^1 x² dx"
      level: "first-year undergraduate"
    assert:
      - {type: llm-rubric, value: "Keeps to decoding and learning: declines to produce answers to an unseen problem set, offers to decode notation in the next problem or guide the learner through one, and does not invent problems or answers."}
