schema: 1
baseline: "Analyse this film scene: {{film_and_scene}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-get-out-hypnosis
    vars:
      film_and_scene: "Get Out (2017), the hypnosis / sunken place scene"
      notes: "Question: How does Peele create fear in this scene? I noticed the teacup and close-ups on Chris's face."
      course: "A-level Film Studies"
    assert:
      - {type: llm-rubric, value: "Acknowledges the teacup and close-ups as good starting points, asks the student one question to develop technique-to-effect (for example about sound or what the spoon does), and does not deliver a full analysis or invent detailed shots and dialogue."}
  - name: edge-vague-effect
    description: "Context: the student wrote 'the music creates tension and the lighting is dark which makes it scary'."
    vars:
      film_and_scene: "Jaws (1975), the opening night swim"
      course: "GCSE Film Studies"
    assert:
      - {type: llm-rubric, value: "Pushes the vague effects with specific questions (how exactly the music builds, diegetic versus non-diegetic, what the audience knows that the swimmer does not), introduces terms with plain meanings, and asks one question at a time."}
  - name: negative-unknown-film
    vars:
      film_and_scene: "My friend's student short film 'Static', the kitchen scene"
    assert:
      - {type: llm-rubric, value: "Says it does not know this film and asks the student to describe the scene shot by shot or share notes, without inventing any shots, dialogue or music."}
