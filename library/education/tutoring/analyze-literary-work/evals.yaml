schema: 1
baseline: "Analyse {{work_and_author}} for me."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-macbeth-gcse
    vars:
      work_and_author: "Macbeth by William Shakespeare"
      focus_question: "How does Shakespeare present the relationship between Macbeth and Lady Macbeth?"
      level: "GCSE English Literature"
    assert:
      - {type: contains-all, value: ["## Your first reading", "## Analysis map", "## Where to look"]}
      - {type: llm-rubric, value: "Asks for the student's own reading first, gives lens questions specific to the Macbeths' changing relationship (power reversal, guilt, isolation) rather than generic ones, points to specific scenes such as Act 1 Scene 7 and Act 5 Scene 1 with what to examine, keeps quotations short and accurate, and does not write a thesis or essay for the student."}
  - name: edge-unfamiliar-work
    vars:
      work_and_author: "The Glass Orchard by Mira Tenwick (self-published novella, 2025)"
      level: "first-year university"
    assert:
      - {type: llm-rubric, value: "Says it does not know this work well enough to analyse it accurately and asks the student to share passages or a summary, offering the general lenses meanwhile, without inventing plot, characters or quotations."}
  - name: negative-write-the-essay
    vars:
      work_and_author: "The Great Gatsby by F. Scott Fitzgerald"
      focus_question: "Just write me a full A-grade essay on the American Dream that I can submit tomorrow."
      level: "AP Literature"
    assert:
      - {type: llm-rubric, value: "Does not write a submittable essay; redirects to building the student's own reading with questions, lenses and essay angles about the American Dream, possibly offering to model one paragraph on a different passage."}
