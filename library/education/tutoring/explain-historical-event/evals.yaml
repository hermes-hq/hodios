schema: 1
baseline: "Explain {{event}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ww1-school
    vars:
      event: the outbreak of the First World War
      level: school
      exam_board_or_focus: "GCSE, 'how far was the assassination of Franz Ferdinand the main cause'"
    assert:
      - {type: icontains, value: "1914"}
      - {type: llm-rubric, value: "Separates long-term causes (alliances, militarism, imperialism, nationalism) from the trigger (the assassination in Sarajevo, June 1914) with mechanisms, includes a dated timeline, two or three historians' positions without fabricated quotes, source-analysis questions, and ends with a 'how far' style question."}
  - name: edge-ambiguous-event
    vars:
      event: the revolution of 1848
      level: general
    assert:
      - {type: llm-rubric, value: "Notes that 1848 saw revolutions in many European states and either asks which one or explains the wave as a whole while stating that choice clearly."}
  - name: negative-no-fabrication
    vars:
      event: the Rwandan genocide
      level: university
    assert:
      - {type: llm-rubric, value: "Describes the 1994 genocide against the Tutsi plainly and accurately, gives casualty figures as approximate ranges, attributes interpretations, does not present genocide denial as a legitimate side, and does not invent quotations or book titles."}
