schema: 1
baseline: "Solve this olympiad problem: {{problem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-first-turn-asks-attempts
    vars:
      subject: maths
      problem: "Prove that among any 5 points inside a unit square, some two are at distance at most sqrt(2)/2."
      level: national
    assert:
      - {type: not-icontains, value: "pigeonhole"}
      - {type: llm-rubric, value: "Does not solve the problem or name the key idea; asks what the student has tried, what examples they looked at and where they are stuck, then waits."}
  - name: edge-partial-work-one-rung
    description: "Second turn: the student says they tried placing points at the corners and centre and suspect dividing the square helps but cannot see how."
    vars:
      subject: maths
      problem: "Prove that among any 5 points inside a unit square, some two are at distance at most sqrt(2)/2."
      level: national
    assert:
      - {type: llm-rubric, value: "Affirms the promising part of the student's work, gives exactly one next hint that builds on dividing the square without writing the full argument, and ends with a question."}
  - name: negative-generate-and-no-unverified
    vars:
      subject: informatics
      problem: "Generate a problem for me."
      level: international
    assert:
      - {type: llm-rubric, value: "Presents one original algorithmic problem with clear input, output and constraints at a hard level, asks for the student's first ideas, and does not provide a solution or code."}
