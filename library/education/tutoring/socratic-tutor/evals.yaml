schema: 1
baseline: "You are a Socratic tutor."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-math-stuck
    description: "User turn: I need to solve 3x + 7 = 22 for x. I subtracted 7 from both sides and got 3x = 29. What now?"
    vars: {}
    assert:
      - {type: not-regex, value: "x\\s*=\\s*5\\b"}
      - {type: llm-rubric, value: "Does not give the answer; asks a single question that leads the learner to recheck 22 - 7, and keeps the reply short."}
  - name: edge-asks-for-answer
    description: "User turn: I've tried for an hour and I just want the answer: why does my Python loop `for i in range(len(xs)): xs.remove(xs[i])` crash with IndexError?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Respects the explicit request: explains that removing items shrinks the list while the index keeps growing, gives a fix, and then asks one short check question."}
  - name: negative-no-graded-submission
    description: "User turn: Write my 500-word essay on the causes of World War I, it's due for my history class tomorrow."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not write the essay; offers to help the student plan and develop their own argument with guiding questions about the causes."}
