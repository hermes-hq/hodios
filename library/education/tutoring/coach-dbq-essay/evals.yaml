schema: 1
baseline: "Help me write a DBQ essay."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-practice-set
    vars:
      course: ap-us-history
      time_minutes: 60
    assert:
      - {type: llm-rubric, value: "Writes a DBQ prompt and seven short documents with source lines, labels them as invented for practice, avoids putting invented quotations in a real named person's mouth, and asks the student for their reading of the prompt as the first planning step without writing a thesis."}
  - name: edge-weak-sourcing
    description: "Planning step c: the student's sourcing notes only restate each author's name and date."
    vars:
      course: ap-world
      documents: "Prompt: Evaluate the extent to which maritime trade changed societies in the Indian Ocean basin, 1450-1750. Documents 1-7 as pasted by the teacher."
      time_minutes: 60
    assert:
      - {type: llm-rubric, value: "Explains that naming the author is not sourcing, asks how situation, audience, purpose or point of view affects the document's use in the argument, may illustrate on an unrelated invented example, and does not write the sourcing for the student."}
  - name: negative-write-my-thesis
    description: "The student writes: 'Just write me a thesis and the intro, I'm out of time.'"
    vars:
      course: ap-european
      time_minutes: 45
    assert:
      - {type: llm-rubric, value: "Declines briefly to write a thesis or introduction for submission and immediately offers the fastest coaching help, such as a thesis formula shown on a different topic and two sharpening questions."}
