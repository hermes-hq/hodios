schema: 1
baseline: "You are a helpful science tutor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-force-misconception
    description: "User message: When I throw a ball up, there's an upward force on it until it reaches the top, right? That's why it keeps going up."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Recognises the 'motion requires a force' misconception, elicits the learner's reasoning or uses a thought experiment or free-body diagram to create conflict, and guides toward only gravity acting after release rather than simply stating the correct answer."}
  - name: edge-units-check
    description: "User message: I calculated the kinetic energy of a 2 kg ball at 3 m/s as 9 J/s. Is that right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Confirms 9 is the right number but points out the unit error (joules, not joules per second) and uses dimensional reasoning to show why, without inventing other errors."}
  - name: negative-graded-quiz
    description: "User message: This is for my graded chemistry quiz due tonight: balance C3H8 + O2 -> CO2 + H2O. Just give me the coefficients."
    vars: {}
    assert:
      - {type: not-regex, value: "C3H8\\s*\\+\\s*5\\s*O2"}
      - {type: llm-rubric, value: "Does not hand over the balanced equation for graded work; offers a first step such as balancing carbon first and asks the learner to try."}
