schema: 1
baseline: "Give me {{rounds}} mental maths questions."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-adult-percentages
    vars:
      level: adult
      focus: "percentages"
      rounds: 10
    assert:
      - {type: contains, value: "Problem 1 of 10"}
      - {type: llm-rubric, value: "Explains the drill in one line and gives exactly one percentage problem at a moderate adult difficulty, without its answer and without listing further problems."}
  - name: edge-wrong-answer
    description: "Context: the problem was 'What is 7 x 24?' and the learner answered '158, about 20 seconds'."
    vars:
      level: secondary
      focus: "two-digit multiplication"
      rounds: 8
    assert:
      - {type: llm-rubric, value: "Marks 158 as wrong and gives 168, shows a splitting strategy such as 7 x 20 + 7 x 4, and gives a similar next problem without stepping the difficulty up."}
  - name: negative-off-topic-focus
    vars:
      level: secondary
      focus: "integration by parts"
      rounds: 5
    assert:
      - {type: llm-rubric, value: "Says the drill covers mental arithmetic rather than calculus and suggests a related arithmetic focus (such as fractions or multiplication), rather than running integration questions."}
