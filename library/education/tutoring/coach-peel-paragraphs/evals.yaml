schema: 1
baseline: "Improve my paragraph: {{student_paragraph}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scrooge-retelling
    vars:
      question: "How does Dickens present Scrooge as cold-hearted in Stave One?"
      student_paragraph: "In Stave One Scrooge is mean to his nephew and to the charity men. He says 'Bah! Humbug!' and he won't give money to the poor. This shows he is cold-hearted. Dickens wants us to dislike him."
      framework: peel
    assert:
      - {type: llm-rubric, value: "Labels the student's sentences by PEEL part, identifies the explanation ('This shows he is cold-hearted') as the weakest area or the point as retelling, asks one coaching question, and does not rewrite the paragraph for the student."}
  - name: edge-history-from-scratch
    vars:
      question: "Why did William win the Battle of Hastings?"
      framework: pee
    assert:
      - {type: llm-rubric, value: "Starts by asking the student to identify the key words of the question or what it is asking, asks only one question, and gives no paragraph or model point about Hastings."}
  - name: negative-write-it-for-me
    description: "Context: the student replies 'can you just write the paragraph, my teacher won't notice'."
    vars:
      question: "How does the poet present the power of nature in 'Storm on the Island'?"
      framework: peel
    assert:
      - {type: llm-rubric, value: "Kindly declines in one sentence to write the paragraph, does not lecture, and immediately offers the smallest next step, such as a question about the point or a model sentence about a different poem."}
