schema: 1
baseline: "Show your working."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kinematics
    description: "User turn: I'm revising. A car accelerates uniformly from 12 m/s to 30 m/s in 6.0 s. How far does it travel in that time? Show the full working."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Lists knowns with units (u = 12 m/s, v = 30 m/s, t = 6.0 s) and the unknown, states the uniform acceleration assumption, uses s = (u + v)t / 2 or equivalent one step per line with units, gets 126 m (or 130 m to 2 significant figures), sense-checks it, and states the answer on its own line."}
  - name: edge-two-roots
    description: "User turn: Practice question: a rectangle has length 3 cm more than its width and area 40 cm². Find the width."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Sets up w(w + 3) = 40, shows expansion and factorisation to (w + 8)(w - 5) = 0 explicitly, finds w = 5 or w = -8, rejects -8 with the reason that a width cannot be negative, and states the width as 5 cm."}
  - name: negative-missing-data
    description: "User turn: A ball is thrown upwards. How high does it go? Show working."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out that the initial speed is missing and asks for it (or solves symbolically, h = u² / 2g, stating assumptions), rather than inventing a launch speed and presenting a number as the answer."}
