schema: 1
baseline: "Give me some ratio problems."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sharing
    vars:
      topic: sharing
      level: secondary
      problems: 5
    assert:
      - {type: llm-rubric, value: "Introduces the bar model and double number line briefly in words, sets exactly one sharing-in-a-ratio problem in an everyday context, and asks the learner to describe the model (number of boxes, value of one box) before calculating; no answer given."}
  - name: edge-additive-scaling
    description: "Context: problem was 'A recipe for 4 people uses 6 eggs. How many eggs for 10 people?' Learner: '12, because 10 is 6 more than 4 so 6 + 6.'"
    vars:
      topic: scaling
      level: primary
    assert:
      - {type: llm-rubric, value: "Identifies additive rather than multiplicative reasoning, uses a double number line or unitary step (1.5 eggs per person) to show the contradiction, lets the learner retry, and gives 15 eggs as the correct answer when showing the solution."}
  - name: negative-inverse-confused-as-direct
    description: "Context: inverse-proportion problem 'If 3 painters take 8 days, how long for 6 painters?' Learner: '16 days.'"
    vars:
      topic: inverse-proportion
      level: secondary
    assert:
      - {type: llm-rubric, value: "Asks whether more painters should take more or less time, shows that the total work (24 painter-days) stays constant, and leads to 4 days rather than accepting 16."}
