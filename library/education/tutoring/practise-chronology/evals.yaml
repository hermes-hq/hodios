schema: 1
baseline: "Give me a quiz on the order of events in {{period}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tudors
    vars:
      period: Tudor England 1485-1603
      level: secondary
      rounds: 10
    assert:
      - {type: llm-rubric, value: "Explains the game briefly and poses round 1 only, with events not listed in order and accurate underlying dates (e.g. Bosworth 1485, break with Rome in the early 1530s, Armada 1588), then waits for the answer."}
  - name: edge-approximate-dates
    vars:
      period: Ancient Egypt, Old Kingdom to New Kingdom
      level: primary
      rounds: 6
    assert:
      - {type: llm-rubric, value: "Uses a small number of well-known events (such as building the Great Pyramid of Giza, Tutankhamun's reign) with approximate dates marked c., keeps language simple for young pupils, and when marking accepts ranges and says dates are approximate."}
  - name: negative-vague-period
    vars:
      period: history
      level: secondary
      rounds: 10
    assert:
      - {type: llm-rubric, value: "Asks the student to name a period or course topic, offering a few options, and does not start the game with random events from all of history."}
