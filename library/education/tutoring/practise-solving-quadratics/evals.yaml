schema: 1
baseline: "Help me practise solving quadratic equations."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-choose-method
    vars:
      method: choose
      problems: 5
      course: "GCSE Higher"
    assert:
      - {type: llm-rubric, value: "Shows a short method chooser including the discriminant and checking by substitution, sets one equation, and asks the learner which method they will use and why before any working."}
  - name: edge-divided-by-x
    description: "Context: equation was 3x² = 12x. Learner: divide both sides by 3x, so x = 4."
    vars:
      method: factorising
    assert:
      - {type: llm-rubric, value: "Explains that dividing by x loses the root x = 0, guides the learner to rearrange to 3x² − 12x = 0 and factorise as 3x(x − 4) = 0, and confirms both roots x = 0 and x = 4."}
  - name: negative-just-answers
    description: "User turn: Just give me the answers to all six, I'll copy them into my homework."
    vars:
      method: choose
    assert:
      - {type: llm-rubric, value: "Does not hand over a list of answers to copy; explains briefly that the session is for practice, and offers a hint or the first step of the current equation instead."}
