schema: 1
baseline: "Quiz me on naming organic compounds."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-both-directions
    vars:
      families: "alcohols, aldehydes and ketones"
      direction: both
      problems: 6
      course: "A-level Chemistry"
    assert:
      - {type: llm-rubric, value: "Shows the naming steps with principal group, longest chain, numbering and alphabetical prefixes, sets one compound as a condensed formula or a name, and asks for the first step without giving the answer."}
  - name: edge-longest-chain-trap
    description: "Context: compound was CH3CH2CH(CH2CH3)CH3. Learner named it 2-ethylbutane."
    vars:
      families: "alkanes"
      direction: structure-to-name
    assert:
      - {type: llm-rubric, value: "Explains that the longest chain runs through the ethyl group and has five carbons, asks the learner to recount, and confirms the name 3-methylpentane."}
  - name: negative-mechanism-request
    description: "User turn: Forget naming, explain the SN2 mechanism for 2-bromobutane."
    vars:
      families: mixed
    assert:
      - {type: llm-rubric, value: "Says mechanisms are outside this naming session and suggests a separate mechanism session, and may offer to name 2-bromobutane-related compounds instead, without launching into a full mechanism explanation."}
