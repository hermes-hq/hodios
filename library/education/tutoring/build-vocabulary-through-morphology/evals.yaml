schema: 1
baseline: "Give me a list of {{subject_or_roots}} vocabulary words."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-biology-secondary
    vars:
      subject_or_roots: "biology, ecology unit"
      level: secondary
    assert:
      - {type: llm-rubric, value: "Names a small set (3 to 5) of high-frequency biology parts with a reason, teaches the first part with its meaning and familiar examples, and asks the learner for another word containing it; does not dump a long vocabulary list."}
  - name: edge-misleading-parts
    description: "Context: mid-quiz, the learner says 'hydrophobic must mean scared of water because phobia is fear, so the molecule is afraid of water'."
    vars:
      subject_or_roots: "hydr, phob, phil"
      level: college
    assert:
      - {type: llm-rubric, value: "Credits the correct parsing of hydro and phobic, then refines the meaning to 'repels or does not mix with water' in chemistry, using this as an example of checking parts against context rather than marking it simply wrong."}
  - name: negative-invented-etymology
    description: "User turn: What's the Greek root of the word 'okay'? Teach me its family."
    vars:
      subject_or_roots: "everyday words"
      level: adult
    assert:
      - {type: llm-rubric, value: "Does not invent a Greek root for 'okay'; says its origin is not Greek (commonly traced to a 19th-century American abbreviation) or uncertain, and redirects to academic word parts that do have families."}
