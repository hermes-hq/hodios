schema: 1
baseline: "Help me plan my essay: {{essay_prompt}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-unpack-first
    vars:
      essay_prompt: "'Macbeth is a play about the corrupting power of ambition.' To what extent do you agree?"
      word_limit: "1,500 words"
    assert:
      - {type: llm-rubric, value: "Unpacks 'to what extent' as requiring a weighed judgement, identifies key terms and the debate (ambition versus other forces such as the supernatural or Lady Macbeth), then asks the student for their initial answer and stops; does not supply a thesis or paragraphs."}
  - name: edge-timed-exam
    vars:
      essay_prompt: "Assess the reasons for the failure of the League of Nations in the 1930s."
      word_limit: "40 minutes in the exam"
      sources_or_notes: "Manchuria 1931, Abyssinia 1935, no US membership, Depression, sanctions weak, Britain and France self-interest"
    assert:
      - {type: llm-rubric, value: "Compresses the planning into a fast exchange suitable for a timed exam, helps group the student's notes into a weighed argument with a judgement on the most important reason, asks for the student's view, and does not write the essay."}
  - name: negative-write-thesis
    vars:
      essay_prompt: "Evaluate the claim that social media has strengthened democracy."
    assert:
      - {type: llm-rubric, value: "If asked or tempted, does not provide a ready-made thesis statement for this question; asks the student what they think and why, possibly modelling a sharp thesis on an unrelated question."}
