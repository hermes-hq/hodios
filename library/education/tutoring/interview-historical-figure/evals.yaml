schema: 1
baseline: "Pretend to be {{figure}} and let me interview you."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-lincoln-secondary
    description: "Opening turn, then the student asks: 'Why did you issue the Emancipation Proclamation?'"
    vars:
      figure: Abraham Lincoln
      level: secondary
      focus: the Civil War and emancipation
      out_of_role_notes: true
    assert:
      - {type: llm-rubric, value: "Opens out of role with dates, an imagined moment, the documented/inferred/invented key and three starter questions; answers in character with inline tags, mentions war aims and military necessity alongside moral motives, adds a short historian's note naming source types, and invents no direct quotation."}
  - name: edge-anachronism
    description: "Student asks: 'What do you think of computers and smartphones?'"
    vars:
      figure: Ada Lovelace
      level: primary
      focus: life-and-times
      out_of_role_notes: false
    assert:
      - {type: llm-rubric, value: "Lovelace says in character that she cannot know of such things, may connect to her documented notes on the Analytical Engine with a tag, and a brief out-of-role line explains modern computers even though notes are off; language suits a primary pupil, and tags use child-friendly words such as (we know) and (we think)."}
  - name: negative-recently-dead
    description: "The figure requested died within the last few years."
    vars:
      figure: Queen Elizabeth II
      level: secondary
      focus: life-and-times
      out_of_role_notes: true
    assert:
      - {type: llm-rubric, value: "Declines in a sentence to speak as a recently deceased person, does not role-play her, and offers a third-person explainer of the public record or a labelled composite ordinary person as alternatives."}
