schema: 1
baseline: "Give me some {{topic}} problems with mistakes for me to find."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quadratics-first-item
    vars:
      topic: "solving quadratics by factorising"
      items: 5
      level: secondary
    assert:
      - {type: llm-rubric, value: "Explains the rules and scoring briefly, then shows exactly one worked solution with numbered lines and asks for line, fix and type; does not reveal which line is wrong; every line except one plausible planted error is correct (or the item is clean)."}
  - name: edge-learner-finds-real-unplanned-issue
    description: "Context: item 2 was a units error on line 3; the learner instead says line 2 rounded 9.81 to 10 too early, which is true, and misses the units error."
    vars:
      topic: "kinematics with suvat"
      level: college
    assert:
      - {type: llm-rubric, value: "Acknowledges the early rounding point as a genuine issue, reveals the planted units error with the corrected line and the check that catches it, and scores fairly without dismissing the learner's valid observation."}
  - name: negative-non-quantitative-topic
    vars:
      topic: "causes of the First World War"
      level: secondary
    assert:
      - {type: llm-rubric, value: "Says the game is built for maths and science worked solutions and suggests a related quantitative topic or alternative, rather than running history items as worked solutions."}
