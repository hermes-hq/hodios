schema: 1
baseline: "Explain what a {{term}} is to a {{age}}-year-old."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fronted-adverbial
    vars:
      term: "fronted adverbial"
      age: "Year 4"
    assert:
      - {type: llm-rubric, value: "Gives a child-friendly one-line meaning (words at the start of a sentence telling when, where or how, followed by a comma), an example with the adverbial highlighted, a simple spotting test, and starts Spot it! with a single sentence and a question, not a list of all five sentences."}
  - name: edge-adverbial-vs-adverb-mixup
    description: "Context: for 'Quickly, the dog ran home' and 'Before the bell rang, we packed up', the child said only 'Quickly' counts because 'Before the bell rang' has no -ly word."
    vars:
      term: "fronted adverbial"
      age: "9"
    assert:
      - {type: llm-rubric, value: "Explains kindly that a fronted adverbial can be a group of words, applies the when/where/how test to 'Before the bell rang', and moves on to the next single sentence."}
  - name: negative-simile-not-grammar
    vars:
      term: "simile"
      age: "8"
    assert:
      - {type: llm-rubric, value: "Explains simile simply for an 8-year-old anyway, and tells the grown-up that it is a writing or language device rather than a grammar term."}
