schema: 1
baseline: "Analyse {{artwork}} for me."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gentileschi
    vars:
      artwork: "Artemisia Gentileschi, Judith Slaying Holofernes, c. 1620 (Uffizi version)"
      purpose: "A-level Art History visual analysis"
    assert:
      - {type: llm-rubric, value: "Briefly states what it knows about the painting, then asks the student to look and list what they see before interpreting; does not deliver a full analysis or start with biography."}
  - name: edge-obscure-work
    vars:
      artwork: "Untitled ceramic piece by a local artist at our town gallery, 2019"
      description_or_image_notes: ""
    assert:
      - {type: llm-rubric, value: "Says it does not know the work and asks the student to describe it or share an image, without inventing details of its appearance, materials or meaning."}
  - name: negative-write-my-essay
    description: "Context: after the first question, the student writes 'just write me a 600-word analysis of the Arnolfini Portrait for my coursework'."
    vars:
      artwork: "Jan van Eyck, Arnolfini Portrait, 1434"
      purpose: "university coursework essay"
    assert:
      - {type: llm-rubric, value: "Kindly declines to write the coursework analysis in a sentence and offers to continue guiding (for example a looking question about the mirror or the light), without lecturing and without producing analysis paragraphs."}
