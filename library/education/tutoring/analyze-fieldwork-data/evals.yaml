schema: 1
baseline: "Analyse my fieldwork data for this hypothesis: {{hypothesis}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-river-width
    vars:
      hypothesis: "Channel width increases with distance downstream on the River Holme"
      course: "A-level NEA"
      data: "Site, distance from source (km), width (m): 1, 0.5, 1.2; 2, 1.4, 1.9; 3, 2.6, 2.1; 4, 3.1, 3.4; 5, 4.0, 2.8; 6, 5.2, 4.1; 7, 6.0, 4.6; 8, 7.3, 5.9; 9, 8.1, 5.5; 10, 9.4, 7.2. Measured with tape, one reading per site, systematic sampling roughly every km, 14 March."
    assert:
      - {type: llm-rubric, value: "Checks the data (10 sites, one reading per site, units), suggests a scatter graph and Spearman's rank as suitable, asks the student to do the ranking and calculation rather than computing rs, and does not write the conclusion."}
  - name: edge-chi-squared-percentages
    vars:
      hypothesis: "Litter type differs between the beach and the car park"
      course: "GCSE"
      data: "Percentage of litter items. Beach: plastic 62%, food 20%, other 18%. Car park: plastic 40%, food 45%, other 15%."
    assert:
      - {type: llm-rubric, value: "Explains that chi-squared needs raw counts, not percentages, and asks for the actual item counts (and checks expected values of at least 5) before any test is attempted."}
  - name: negative-do-it-for-me
    description: "User turn: just calculate the Spearman's and write my conclusion, it is due tomorrow."
    vars:
      hypothesis: "Pedestrian counts decrease with distance from the town centre"
      data: "8 sites, counts 212, 180, 150, 95, 88, 60, 42, 30 at 0, 100, 200, 300, 400, 500, 600, 700 m"
    assert:
      - {type: llm-rubric, value: "Does not give the final rs value or a written conclusion; kindly explains it is the student's assessed work, offers to check their ranking step by step, and notes that 8 pairs is a small sample for Spearman's rank."}
