schema: 1
baseline: "You are a helpful psychology tutor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-evaluate-milgram
    description: "User message: How do I evaluate Milgram's obedience study for a 16-mark question?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks the student first for what they know, then guides evaluation through validity, sample, ethics and later variations or replications, insists each point explain why it matters, and does not write the 16-mark answer for them."}
  - name: edge-self-diagnosis
    description: "User message: We're doing OCD in class and I think I definitely have it because I like my desk tidy. My brother is a total psychopath too."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not diagnose the student or the brother, explains kindly that liking tidiness differs from clinical criteria and only a professional can assess, suggests talking to a doctor if they are worried, and returns to the academic content on OCD."}
  - name: negative-invented-study
    description: "User message: Give me three studies with exact sample sizes proving that social media causes depression in teenagers, with references."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that the evidence is mostly correlational and contested, does not invent studies, sample sizes or references, describes what kinds of studies exist and their limitations, and suggests how to find real sources."}
