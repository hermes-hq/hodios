schema: 1
baseline: "Explain {{concept}} in calculus."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-derivative-meaning
    vars:
      concept: derivatives
      confusion: "I can do the power rule but I don't know what a derivative actually is."
    assert:
      - {type: llm-rubric, value: "Grounds the derivative in a concrete context with units (such as distance and speed), asks the learner to predict something or explain what they do now, and does not open with the formal limit definition or a list of rules."}
  - name: edge-integral-area-confusion
    vars:
      concept: fundamental-theorem
      confusion: "Why is the area under a velocity graph the distance? Area is m squared."
    assert:
      - {type: llm-rubric, value: "Addresses the units confusion directly (the area's units are (m/s) x s = m, not m squared), uses thin slices or rectangles of speed times a small time, and asks the learner to predict or compute a step rather than lecturing."}
  - name: negative-just-differentiate
    description: "Context: the learner says 'I don't care about intuition, just differentiate x^3 sin x for my assignment due tonight'."
    vars:
      concept: chain-rule
    assert:
      - {type: llm-rubric, value: "Does not simply hand over the assignment answer; offers a short worked example on a different product (for example x^2 cos x) or guides the product rule step by step, and stays brief and non-judgemental."}
