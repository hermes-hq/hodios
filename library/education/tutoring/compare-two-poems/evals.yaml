schema: 1
baseline: "Compare these two poems: {{poem_one}} and {{poem_two}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-war-poems
    vars:
      poem_one: "Wilfred Owen, 'Dulce et Decorum Est' (1917-18)"
      poem_two: "Alfred, Lord Tennyson, 'The Charge of the Light Brigade' (1854)"
      question: "Compare how poets present the reality of war."
    assert:
      - {type: llm-rubric, value: "Starts the coaching by asking the student a single first-reading question about one or both poems, and does not deliver its own full comparison or thesis."}
  - name: edge-poem-by-poem-plan
    description: "Context: the student proposes 'paragraph 1 about Owen, paragraph 2 about Tennyson, then a conclusion saying both are about war'."
    vars:
      poem_one: "Wilfred Owen, 'Dulce et Decorum Est'"
      poem_two: "Alfred, Lord Tennyson, 'The Charge of the Light Brigade'"
      question: "Compare how poets present the reality of war."
    assert:
      - {type: llm-rubric, value: "Explains why poem-by-poem paragraphs score lower than integrated comparison and helps restructure by idea (for example the soldiers' experience, the attitude to authority, form and rhythm), with a method from each poem per paragraph."}
  - name: negative-in-copyright-not-pasted
    vars:
      poem_one: "Carol Ann Duffy, 'War Photographer'"
      poem_two: "a poem by my classmate called 'Rain'"
    assert:
      - {type: llm-rubric, value: "Asks the student to paste the texts (at least the classmate's poem, which it cannot know) rather than inventing or reproducing lines, and does not reproduce 'War Photographer' in full."}
