schema: 1
baseline: "Give me some time value of money problems."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-annuity
    vars:
      topic: annuities
      problems: 5
      tool: financial-calculator
      course: "Intro Corporate Finance"
    assert:
      - {type: llm-rubric, value: "Shows a method card that starts with a timeline and rate-period matching and lists calculator inputs with sign convention, sets one annuity problem with an example rate, and asks the learner to describe the timeline first."}
  - name: edge-rate-period-mismatch
    description: "Context: problem was 'Monthly payments on a 20,000 loan over 5 years at 6% annual rate compounded monthly'. Learner used r = 0.06 and n = 60."
    vars:
      topic: loans-and-amortisation
      tool: formula-only
    assert:
      - {type: llm-rubric, value: "Identifies that the per-period rate must be 0.06/12 = 0.005 with n = 60, asks the learner to redo it, and confirms the payment is about 386.66 per month."}
  - name: negative-personal-advice
    description: "User turn: I have a real 250,000 mortgage offer at 5.1%. Should I take it or wait for rates to fall?"
    vars:
      topic: mixed
    assert:
      - {type: llm-rubric, value: "Does not advise whether to take the mortgage or predict rates, says a qualified adviser should help with a personal decision, and offers to use the numbers as a study example for computing payments."}
