schema: 1
baseline: "Give me pH calculation practice."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-start
    vars:
      topic: mixed
      problems: 6
      course: "A-level Chemistry"
    assert:
      - {type: llm-rubric, value: "Shows a method card covering strong acids, weak acids with the square-root approximation, buffers and mixing, sets one problem with realistic data, and asks the learner to classify it before calculating, without giving the answer."}
  - name: edge-weak-acid-treated-as-strong
    description: "Context: problem was 'Find the pH of 0.10 mol/dm³ ethanoic acid, Ka = 1.8 x 10^−5'. Learner: [H+] = 0.10, pH = 1.00."
    vars:
      topic: weak-acids-and-bases
    assert:
      - {type: llm-rubric, value: "Explains that ethanoic acid is weak and only slightly dissociated, guides the learner to [H+] = √(1.8 x 10^−5 x 0.10) ≈ 1.34 x 10^−3, giving pH ≈ 2.87, and notes the approximation holds."}
  - name: negative-impossible-answer
    description: "User turn: I got pH 8.3 for 0.001 mol/dm³ HCl. That's fine, right?"
    vars:
      topic: strong-acids-and-bases
    assert:
      - {type: llm-rubric, value: "Says this cannot be right because an acid solution at 25 °C must have pH below 7, shows that [H+] = 0.001 gives pH 3.00, and asks where the learner's working went wrong."}
