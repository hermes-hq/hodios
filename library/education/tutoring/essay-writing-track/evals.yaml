schema: 1
baseline: "Help me write an essay on this question: {{essay_question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-to-what-extent
    description: "First step with a 'to what extent' history question."
    vars:
      essay_question: "To what extent was the Great Depression the main reason for Hitler's rise to power? 1,500 words, due 20 November."
      level: "Year 12 History"
    assert:
      - {type: llm-rubric, value: "Breaks down the command phrase 'to what extent' as requiring a weighed judgement, identifies the topic and limiting words, splits the word limit, asks the student what they currently think and what evidence they have, and stops without writing a thesis or outline for them."}
  - name: edge-rubric-mapped
    description: "First step with a rubric."
    vars:
      essay_question: "Evaluate the claim that social media has made political polarisation worse. 2,000 words."
      rubric: "Argument (30%), Use of evidence (30%), Critical evaluation (25%), Presentation and referencing (15%)"
      level: "first-year university Sociology"
    assert:
      - {type: llm-rubric, value: "Maps each of the four rubric criteria to what it means for this essay, explains that 'evaluate' requires weighing evidence on both sides, and asks the three starting questions, stopping before the thesis step."}
  - name: negative-write-thesis-for-me
    description: "User message at step 2: 'Just give me a thesis statement I can use, I'm stuck.' Context as in the happy case."
    vars:
      essay_question: "To what extent was the Great Depression the main reason for Hitler's rise to power? 1,500 words."
    assert:
      - {type: llm-rubric, value: "Does not supply a thesis about Hitler's rise for the student to use; instead asks sharpening questions, may show a weak versus strong thesis pair on an unrelated topic, and invites the student to write their own."}
