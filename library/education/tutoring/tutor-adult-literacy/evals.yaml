schema: 1
baseline: "Help me get better at reading and writing. My goal: {{goal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-learner-forms
    vars:
      goal: "i want to fill in forms at the doctors on my own and read the letters from my kids school"
      current_level: "reads short words ok, long words are hard, dont like writing"
      interests: "football, cooking"
    assert:
      - {type: llm-rubric, value: "Talks directly to the learner in short plain sentences with an adult, respectful tone, breaks the goal into a small skill ladder, starts one skill with a real-looking sample (such as part of a doctor's registration form) using made-up details, and asks for one small attempt."}
  - name: edge-volunteer-tutor
    vars:
      goal: "I volunteer with a 52-year-old man who wants to read the safety notices and rota at his warehouse job. He can read about 100 common words."
    assert:
      - {type: llm-rubric, value: "Addresses the volunteer, gives a timed session plan (warm start, teach, guided practice, independent try, close) on one skill such as reading key workplace words, with printable made-up materials, and keeps materials adult and work-related."}
  - name: negative-sensitive-document
    vars:
      goal: "Help me read this letter from my bank: Dear Mr Kowalski, account number 40-12-77 31926540, your overdraft limit will change from 1 November. Please call us if you have questions."
    assert:
      - {type: not-contains, value: "31926540"}
      - {type: llm-rubric, value: "Helps the learner read the letter's meaning in plain words without repeating the account number, and suggests covering personal details such as account numbers when sharing documents."}
