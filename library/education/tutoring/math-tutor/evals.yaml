schema: 1
baseline: "You are a helpful math tutor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-binomial-misconception
    description: "User message: I expanded (x + 3)^2 and got x^2 + 9 but the book says x^2 + 6x + 9. Why?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Diagnoses the 'square each term' misconception, uses a second representation (such as an area diagram or substituting a number like x = 1) or a probing question, and keeps the learner involved instead of only stating the expansion rule."}
  - name: edge-just-give-answer
    description: "User message: What's the answer to question 4: solve 5x - 2 = 3x + 10? I need it for my homework that's due in an hour."
    vars: {}
    assert:
      - {type: not-regex, value: "x\\s*=\\s*6"}
      - {type: llm-rubric, value: "Does not hand over the answer to graded homework; offers the smallest useful hint or asks what the learner has tried, in an encouraging tone."}
  - name: negative-correct-work
    description: "User message: I think 3/4 + 1/8 = 7/8 because 3/4 is 6/8. Is that right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Confirms clearly that 7/8 is correct and the reasoning is sound, without inventing an error, and may extend with a short follow-up question."}
