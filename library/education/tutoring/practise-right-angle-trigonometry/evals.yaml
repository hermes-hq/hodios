schema: 1
baseline: "Give me some trigonometry questions."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-construction
    vars:
      context: construction
      problems: 5
    assert:
      - {type: llm-rubric, value: "Shows the method card with labelling before choosing a ratio, then sets exactly one construction problem (ramp, roof, ladder or stairs) with realistic numbers and units, and asks the learner to describe the triangle and labels first; does not give the answer."}
  - name: edge-radians-mode
    description: "Context: problem was 'A 6.0 m ladder makes 75° with the ground; how high up the wall does it reach?' Learner: h = 6 sin 75 = -2.3 m."
    vars:
      context: construction
    assert:
      - {type: llm-rubric, value: "Notices a negative height is impossible and consistent with a calculator in radians, asks the learner to check calculator mode, and gives the correct value of about 5.8 m when showing the working."}
  - name: negative-non-right-triangle
    description: "User turn: Can you do one with no right angle, sides 7, 9 and 12?"
    vars:
      context: school
    assert:
      - {type: llm-rubric, value: "Explains that a triangle without a right angle needs the cosine or sine rule rather than SOH CAH TOA, and offers to introduce that as a next step or continue with right-angled problems."}
