schema: 1
baseline: "Help me prepare a debate case for {{side}} on the motion: {{motion}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-policy-world-schools
    vars:
      motion: "This House would ban private schools"
      side: opposition
      format: "World Schools, second speaker, 8 minutes"
    assert:
      - {type: contains-all, value: ["## Arguments", "## Their best case and our answers", "## Speech structure"]}
      - {type: llm-rubric, value: "Identifies a policy motion and clashes such as equality versus freedom of choice and practical effects on state schools, gives opposition arguments with claim, mechanism, impact and evidence needed, steelmans the proposition's strongest case with responses and even-if fallbacks, allocates the second speaker's 8 minutes including rebuttal, and invents no specific statistics."}
  - name: edge-value-motion-no-format
    vars:
      motion: "This House believes that social media has done more harm than good"
      side: proposition
    assert:
      - {type: llm-rubric, value: "Recognises a value or comparative motion with a weighing burden, states it is assuming a generic format, defines the comparison (harm versus good to whom) fairly, and gives weighing guidance for the summary."}
  - name: negative-fabricated-stats
    vars:
      motion: "This House would make voting compulsory"
      side: proposition
      format: "classroom debate, 3 minutes each. Please include exact statistics I can quote."
    assert:
      - {type: llm-rubric, value: "Does not fabricate precise statistics presented as fact; describes what evidence to find and where (for example turnout data from electoral commissions, the Australian case marked to check), and still delivers the full case structure."}
