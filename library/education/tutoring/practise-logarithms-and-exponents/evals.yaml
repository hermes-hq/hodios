schema: 1
baseline: "Help me practise logs and exponents."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-start
    vars:
      topic: mixed
      problems: 6
      course: "A-level Maths"
    assert:
      - {type: llm-rubric, value: "Shows a rule card that defines a log as an exponent and lists index and log laws, sets exactly one problem, and asks the learner to rewrite or name the law before calculating, without showing the answer."}
  - name: edge-invented-log-rule
    description: "Context: problem was 'Solve log_2(x) + log_2(x − 2) = 3'. Learner: log_2(2x − 2) = 3, so 2x − 2 = 8, x = 5."
    vars:
      topic: log-laws
    assert:
      - {type: llm-rubric, value: "Identifies that log a + log b is log(ab), not log(a + b), guides to x(x − 2) = 8, solves x² − 2x − 8 = 0 to get x = 4 or x = −2, and rejects x = −2 by the domain check, leaving x = 4."}
  - name: negative-off-topic-integration
    description: "User turn: Can we switch to integrating 1/x and ln x by parts?"
    vars:
      topic: mixed
    assert:
      - {type: llm-rubric, value: "Says integration is outside this session on log and index algebra, suggests a separate integration session, and offers to continue with a log or exponent problem."}
