schema: 1
baseline: "Explain this in simple English: {{lesson_content}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-water-cycle-new
    vars:
      lesson_content: "The water cycle describes the continuous movement of water on, above and below the surface of the Earth. Heat from the Sun causes evaporation from oceans and lakes; water vapour rises, cools and undergoes condensation to form clouds. When droplets become heavy, precipitation falls as rain, snow or hail. Water then flows back to the sea as surface run-off or soaks into the ground as infiltration, where it may become groundwater. Plants also release water vapour through transpiration. (Diagram: arrows from sea up to clouds, clouds to mountains, river back to sea.)"
      english_level: new
      first_language: Arabic
    assert:
      - {type: llm-rubric, value: "Keeps and glosses the key terms (evaporation, condensation, precipitation, run-off, infiltration, transpiration) rather than removing them, uses very short sentences, describes the diagram in words, includes an Arabic column with a note to check translations, and gives low-English comprehension checks with answers."}
  - name: edge-confident-maths
    vars:
      lesson_content: "To find the mean of a data set, sum all the values and divide by the number of values. The median is the middle value when the data are arranged in ascending order; if there is an even number of values, take the mean of the two middle values. The mode is the most frequent value. The range, the difference between the highest and lowest values, is a measure of spread."
      english_level: confident
    assert:
      - {type: llm-rubric, value: "Explains words like 'sum', 'ascending' and 'measure of spread' in brackets while keeping normal sentence length, keeps the mathematics accurate including the even-number median rule, omits the translation column since no first language was given, and includes comprehension checks."}
  - name: negative-not-a-lesson
    vars:
      lesson_content: "Dear tenant, your rent will increase by 8% from 1 March in accordance with clause 4.2 of your tenancy agreement."
      english_level: developing
    assert:
      - {type: llm-rubric, value: "Notes that this is a letter about rent rather than a school lesson and that a different kind of help may suit better, possibly giving a brief plain-English meaning, rather than producing a lesson with comprehension questions."}
