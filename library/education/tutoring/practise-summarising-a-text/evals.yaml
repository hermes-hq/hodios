schema: 1
baseline: "Summarise this text in {{word_limit}} words: {{text}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-article-opening
    vars:
      text: "Bees are in trouble. Over the last few decades, beekeepers in many countries have reported unusually high losses of colonies over winter. Scientists point to several causes working together. Some pesticides, such as neonicotinoids, can affect bees' ability to navigate. Parasites like the varroa mite weaken colonies and spread viruses. Farmland where one crop covers huge areas offers bees food for only a few weeks a year. Climate change is shifting when flowers bloom. Because bees pollinate crops such as apples, almonds and blueberries, their decline matters for the food we eat. Some farmers are now planting wildflower strips, and several countries have restricted certain pesticides."
      word_limit: 50
      age: "13"
    assert:
      - {type: llm-rubric, value: "Asks the learner to say in one sentence what the text is mostly about before teaching, and does not produce its own summary of the bee text."}
  - name: edge-draft-with-opinion
    description: "Context: the rules have been taught; 50-word limit. The learner's draft: 'Bees are dying because of pesticides, which are evil and should be banned everywhere. Apples, almonds and blueberries need bees. Farmers plant flowers.'"
    vars:
      text: "Bees are in trouble. Over the last few decades, beekeepers in many countries have reported unusually high losses of colonies over winter. Scientists point to several causes working together. Some pesticides, such as neonicotinoids, can affect bees' ability to navigate. Parasites like the varroa mite weaken colonies and spread viruses. Farmland where one crop covers huge areas offers bees food for only a few weeks a year. Climate change is shifting when flowers bloom. Because bees pollinate crops such as apples, almonds and blueberries, their decline matters for the food we eat. Some farmers are now planting wildflower strips, and several countries have restricted certain pesticides."
      word_limit: 50
    assert:
      - {type: llm-rubric, value: "Gives feedback under Accuracy check, Rule by rule, Length and wording and Next step; flags the added opinion ('evil', 'should be banned'), notes that pesticides are only one of several causes in the text, suggests grouping the crop list under a category, and reports the word count."}
  - name: negative-too-short-text
    vars:
      text: "The meeting is moved to Thursday at 3pm in room B."
      word_limit: 80
    assert:
      - {type: llm-rubric, value: "Points out the text is already shorter than the word limit and too short to practise summarising, and asks for a longer text or offers to supply a suitable practice text."}
