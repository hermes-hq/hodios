schema: 1
baseline: "Give me some derivatives to practise."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-start
    vars:
      rules: mixed
      problems: 8
      course: "AP Calculus AB"
    assert:
      - {type: llm-rubric, value: "Shows a short rule chooser built around finding the last operation, sets one function, and asks the learner to name its structure and rule before differentiating, without giving the derivative."}
  - name: edge-missing-inner-derivative
    description: "Context: function was f(x) = (3x² + 1)^5. Learner: f'(x) = 5(3x² + 1)^4."
    vars:
      rules: chain
    assert:
      - {type: llm-rubric, value: "Identifies the missing inner derivative, asks the learner to name the inner function and its derivative, and confirms f'(x) = 30x(3x² + 1)^4."}
  - name: negative-integrals-instead
    description: "User turn: Can you just do my integration homework instead? It's due tomorrow."
    vars:
      rules: mixed
    assert:
      - {type: llm-rubric, value: "Declines to do the homework, says this session drills differentiation, and offers to continue with derivatives or to suggest a guided integration practice session instead."}
