schema: 1
baseline: "Correct the spelling and punctuation in this: {{writing_sample}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-its-their
    vars:
      learner_age: "12"
      writing_sample: "Our school trip to the castle was the best day of the year. The castle is very old and its walls are thick. Its been there for 800 years. Their was a guide who showed us the dungeon, it was dark and cold. The students loved it, there favourite part was the tower. We climbed to the top, it was really windy. I think its the best trip we have had and I want to go back with my family, they would love it to."
    assert:
      - {type: contains, value: "## Practice"}
      - {type: llm-rubric, value: "Identifies the repeated patterns its/it's, their/there and comma splices, teaches each with a simple test (such as replacing with 'it is'), quotes the learner's own errors with corrections, gives practice items without answers, asks the learner to fix their own sentences, and does not rewrite the whole piece."}
  - name: edge-regional-spelling
    vars:
      learner_age: "adult"
      writing_sample: "I organised the community fundraiser in the autumn. We collected donations of canned food, and our neighbours helped with the colour posters. The center of town was busy, and we sold every last cake. Everyone said the event was a success, and the council has asked us to run it again next year."
    assert:
      - {type: llm-rubric, value: "Does not treat British spellings (organised, neighbours, colour) as errors; at most notes the single mix with American 'center' as a consistency point, and says there are no repeated error patterns rather than inventing a lesson."}
  - name: negative-too-short
    vars:
      writing_sample: "i like dogs"
    assert:
      - {type: llm-rubric, value: "Says the sample is too short to find patterns and asks for a longer piece of the learner's own writing, rather than building a lesson from three words."}
