schema: 1
baseline: "Write a response paper on this reading: {{reading}}. Assignment: {{assignment}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-react
    vars:
      reading: "Nicholas Carr, 'Is Google Making Us Stupid?' My summary: he says reading online in skims and links is changing how our brains work, and he finds it harder to read long books now."
      assignment: "Response paper, 750 words: brief summary (no more than a third), your response with reasons and evidence, one connection to our unit on attention. MLA."
      stage: react
      material: "I kind of agree but also he's just one guy."
    assert:
      - {type: llm-rubric, value: "Lists the assignment's requirements, asks the student to state Carr's main claim and support, asks questions that turn 'kind of agree but he's just one guy' into a specific stance (for example about anecdote as evidence), and writes no paper sentences."}
  - name: edge-summary-heavy-draft
    vars:
      reading: "Peter Singer, 'Famine, Affluence, and Morality'."
      assignment: "Critical response, 2 pages: short summary, your evaluation of one argument, one objection and reply."
      stage: feedback
      material: "Singer says that if we can prevent something bad without sacrificing anything of comparable moral importance, we ought to do it. He uses the example of a drowning child. He says distance does not matter. He says it does not matter if other people could also help. He says we should give much more to famine relief. He says charity should not be optional. He says this changes how we think about duty and charity. I think this is very interesting and makes you think."
    assert:
      - {type: llm-rubric, value: "Notes the paper is almost all summary and the response is only 'very interesting and makes you think', quotes those words, asks the student which one argument (such as distance not mattering) they will evaluate and what they think of it, and does not rewrite or supply the evaluation."}
  - name: negative-invent-reading
    vars:
      reading: "Chapter 3 of our course reader, I don't remember the author."
      assignment: "Reading response, 500 words."
      stage: plan
      material: "Can you just say what chapter 3 argues and write the response from that?"
    assert:
      - {type: llm-rubric, value: "Does not guess or invent what the chapter argues and does not write the response; asks the student to share the title, author or key passages and their own reactions before planning."}
