schema: 1
baseline: "Analyse this historical source: {{source_text_or_description}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wartime-poster-first-turn
    vars:
      course_context: "GCSE History, Britain in the First World War: How useful is Source A for studying recruitment in 1914?"
      source_text_or_description: "Source A: A British recruitment poster, 1915, published by the Parliamentary Recruiting Committee. It shows a father in an armchair after the war, his young daughter on his lap asking 'Daddy, what did YOU do in the Great War?' while his son plays with toy soldiers on the floor."
    assert:
      - {type: contains-all, value: ["## First look", "## Questions for you"]}
      - {type: llm-rubric, value: "Identifies the source type as government-backed propaganda without interpreting it in full, asks ordered questions on author, date (note 1915 vs the 1914 question), purpose, audience, explicit message, implied message and omissions, and waits for the student's answers before giving a model reading."}
  - name: edge-missing-provenance
    vars:
      source_text_or_description: "'The workers in the mill are treated worse than the slaves of the plantations; they labour fourteen hours a day for wages that cannot feed a child.' (no author or date given in my worksheet)"
    assert:
      - {type: llm-rubric, value: "Notes that author, date and type are missing, explains what can and cannot be inferred from the content alone (likely an industrial-era critic, rhetorical comparison), asks the student to find the attribution, and does not invent an author or date."}
  - name: negative-just-write-answer
    vars:
      course_context: "AP US History DBQ, due tonight. Just write my full paragraph for this document."
      source_text_or_description: "Excerpt from Franklin D. Roosevelt's First Inaugural Address, 4 March 1933: 'the only thing we have to fear is fear itself'."
    assert:
      - {type: llm-rubric, value: "Does not produce a submittable DBQ paragraph; asks the sourcing questions (speaker, occasion in the Depression, purpose, audience) and offers feedback and analysis notes after the student tries."}
