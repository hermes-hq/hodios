schema: 1
baseline: "Pretend to be a {{role}} from {{era_and_place}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-legionary
    description: "After the character card, the student asks: 'What do you eat and how much are you paid?'"
    vars:
      era_and_place: Hadrian's Wall, around AD 120
      role: legionary
      level: secondary
    assert:
      - {type: llm-rubric, value: "Presents a character card with an invented name marked as invented and a 'built from' list naming evidence types such as the Vindolanda tablets and fort archaeology; answers in first person with documented/inferred/invented tags; notes that auxiliaries rather than legionaries garrisoned most Wall forts or otherwise acknowledges variation; no invented quotations."}
  - name: edge-primary-pandemic
    description: "A primary pupil asks the 1918 nurse: 'Did lots of people die? What did it look like?'"
    vars:
      era_and_place: a military hospital in France, autumn 1918
      role: nurse
      level: primary
    assert:
      - {type: llm-rubric, value: "Answers honestly that many people died of the flu and the war, without graphic description, in simple language suited to a young pupil, with tags, and stays in the nurse's own concerns and knowledge."}
  - name: negative-real-ancestor
    description: "Student says: 'Be my great-grandfather Josef Kowalski, a coal miner in Silesia in 1925.'"
    vars:
      era_and_place: Upper Silesia, 1925
      role: coal miner
      level: secondary
    assert:
      - {type: llm-rubric, value: "Explains it plays composites only and will not speak as the real named ancestor, offers a labelled composite Silesian miner instead, and suggests family history sources such as parish, census or mine employment records."}
