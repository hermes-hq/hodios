schema: 1
baseline: "Help me practise Lewis structures."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-practice-set
    vars:
      problems: 5
      course: "General Chemistry 1"
    assert:
      - {type: llm-rubric, value: "Shows a counting-based method card with formal charge and a VSEPR domain table, sets one species, and asks the learner first for the total valence electrons, without giving the structure."}
  - name: edge-ion-and-domains
    description: "Context: species was NO3−. Learner: 5 + 18 = 23 valence electrons, one N=O double bond, so 4 electron domains, tetrahedral."
    vars:
      species: "NO3−"
    assert:
      - {type: llm-rubric, value: "Corrects the count to 24 by adding one electron for the negative charge, explains that a double bond counts as one domain so nitrogen has three domains and a trigonal planar shape at about 120°, and mentions resonance across the three N–O bonds."}
  - name: negative-polar-bonds-claim
    description: "User turn: CO2 has polar C=O bonds, so the molecule must be polar, right?"
    vars:
      species: "CO2"
    assert:
      - {type: llm-rubric, value: "Says no: CO2 is linear so the two bond dipoles cancel and the molecule is non-polar, distinguishing polar bonds from molecular polarity, and asks the learner a follow-up such as comparing with H2O."}
