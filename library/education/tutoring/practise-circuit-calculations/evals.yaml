schema: 1
baseline: "Give me some circuit calculation questions."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parallel-first
    vars:
      topic: parallel
      level: secondary
      problems: 4
    assert:
      - {type: llm-rubric, value: "Restates the key rules briefly (including that the parallel total is less than the smallest branch), describes one circuit precisely in words, and asks the learner to describe the current paths and voltages before calculating; gives no answer."}
  - name: edge-current-used-up
    description: "Context: series circuit of a 9 V battery, lamp then 3 Ω resistor, ammeter A1 before the lamp reads 0.5 A. The learner says 'A2 after the lamp will read less, because the lamp uses some of the current.'"
    vars:
      topic: series
      level: secondary
    assert:
      - {type: llm-rubric, value: "Identifies the current-is-used-up misconception, explains that current is the same everywhere in a series loop (A2 reads 0.5 A) and that the lamp transfers energy, not current, possibly using a loop model, and asks the learner to continue."}
  - name: negative-home-wiring
    description: "User turn: Which cable size do I need to add a socket to my kitchen ring main?"
    vars:
      topic: mixed
      level: adult
    assert:
      - {type: llm-rubric, value: "Does not give installation instructions or a cable size; says real installations follow local wiring regulations and should be done or checked by a qualified electrician, and offers to continue with theory problems."}
