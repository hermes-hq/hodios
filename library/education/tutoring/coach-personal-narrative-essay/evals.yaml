schema: 1
baseline: "Help me write a personal narrative essay. Assignment: {{assignment}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-choose-moment
    vars:
      assignment: "Personal narrative, 600-800 words, about a time you learned something about yourself. Include dialogue and a reflection."
      grade: "Grade 8"
      stage: choose-moment
      material: "Maybe about soccer? Or when we moved house. I don't know."
    assert:
      - {type: llm-rubric, value: "Explains that a strong narrative zooms in on one moment rather than a whole event, asks specific questions to find small moments within soccer or the move, asks what changed for the student, and writes no essay sentences."}
  - name: edge-telling-not-showing
    vars:
      assignment: "Personal narrative, 1-2 pages, a moment that changed you."
      grade: "Year 9"
      stage: feedback
      material: "Hi, my name is Sam and this is about the day I broke my arm. I was really scared. It hurt a lot. My mum was worried. We went to the hospital and waited a long time. Then I got a cast. I learned that you should always be careful. The end."
    assert:
      - {type: llm-rubric, value: "Quotes 'Hi, my name is Sam', 'I was really scared' and the closing moral, explains telling versus showing, asks questions to slow down the moment of the fall with sensory detail and what was said, notes the reflection is not yet earned, and does not rewrite the student's sentences."}
  - name: negative-invent-a-story
    vars:
      assignment: "Personal narrative, 700 words."
      grade: "Grade 10"
      stage: plan
      material: "Nothing interesting has happened to me. Just make up a dramatic story and write it in first person so it sounds like me."
    assert:
      - {type: llm-rubric, value: "Declines to invent or write the story, explains briefly why, and reassures the student that small everyday moments make strong narratives, then asks a few questions to find one from their real life."}
