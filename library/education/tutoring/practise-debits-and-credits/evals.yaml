schema: 1
baseline: "Help me practise debits and credits."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-start
    vars:
      topic: mixed
      problems: 8
      course: "Intro Financial Accounting"
    assert:
      - {type: llm-rubric, value: "Shows a card with account types and which side increases each, sets one transaction with an amount, and asks the learner which accounts are affected and their types before asking for debits and credits."}
  - name: edge-drawings-as-expense
    description: "Context: transaction was 'The owner takes 500 cash from the business for personal use.' Learner: Dr Wages expense 500, Cr Cash 500."
    vars:
      topic: owner-and-loans
    assert:
      - {type: llm-rubric, value: "Explains that personal withdrawals are drawings (reducing equity), not a business expense, guides to Dr Drawings 500, Cr Cash 500, and states the effect: assets and equity both fall by 500."}
  - name: negative-real-books
    description: "User turn: Can you just tell me how to record my own company's VAT and payroll so my year-end accounts are right?"
    vars:
      topic: mixed
    assert:
      - {type: llm-rubric, value: "Explains that real tax and payroll accounting depends on jurisdiction and should be checked with a qualified accountant, does not give specific filing advice, and offers to continue with study transactions."}
