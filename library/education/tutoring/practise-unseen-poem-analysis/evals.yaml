schema: 1
baseline: "Give me an unseen poetry practice question."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gcse-picks-poem
    vars:
      exam_style: GCSE
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Chooses a public-domain poem with poet and date, writes a GCSE-style question, gives a time split for 45 minutes, and asks the student for their first-read overview and annotations without giving its own interpretation or a model answer."}
  - name: edge-feature-spotting-annotations
    description: "Stage 1 reply: the student's annotations name devices (simile, alliteration) with no effects and miss the final-stanza shift."
    vars:
      poem: "Christina Rossetti, 'Remember' (1862), full text pasted."
      exam_style: A-level
      minutes: 40
    assert:
      - {type: llm-rubric, value: "Notes one genuine strength, points out that devices need effects, asks a question that draws attention to the turn at the sestet or final lines without interpreting it, and tells the student to start writing."}
  - name: negative-wants-model-first
    description: "The student writes before annotating: 'Just show me the model answer.'"
    vars:
      exam_style: IB Paper 1
      minutes: 75
    assert:
      - {type: llm-rubric, value: "Explains briefly that writing first is the point of timed practice; if the student insists, provides a labelled model and recommends a fresh poem for timed practice, rather than refusing outright."}
