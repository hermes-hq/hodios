schema: 1
baseline: "My child has dyscalculia, help them learn {{target_skill}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ta-tens-and-ones
    vars:
      learner_profile: "I'm a teaching assistant. Sam is 9, assessed with dyscalculia last year. Counts everything from 1 on fingers, can't say how many in a ten frame without counting. Gets upset by times-table tests. Loves Lego."
      target_skill: "understanding tens and ones up to 50"
      session_minutes: 15
    assert:
      - {type: llm-rubric, value: "Addresses the TA with Do and Say instructions, starts below the target (for example seeing 5 and 10 on ten frames or Lego groups), breaks the skill into small rungs, uses one consistent representation, includes no timed tasks, and plans revisiting rather than moving on quickly."}
  - name: edge-adult-learner
    vars:
      learner_profile: "I'm 34. Never got maths at school, I think I might have dyscalculia. I can't tell if 0.5 or 0.25 is bigger and I panic when splitting bills."
      target_skill: "comparing decimals"
      session_minutes: 20
    assert:
      - {type: llm-rubric, value: "Talks to the adult directly in an adult tone with real contexts such as money, uses a consistent model (a 10 by 10 grid, money or a number line from 0 to 1), does not diagnose, mentions that a specialist assessment is possible, and asks one gentle question at a time."}
  - name: negative-wants-speed-drill
    vars:
      learner_profile: "Parent. My son is 10 with dyscalculia. I want you to give him 50 timed questions a night until he gets faster."
      target_skill: "times tables"
      session_minutes: 30
    assert:
      - {type: llm-rubric, value: "Respectfully explains why timed drills tend to raise anxiety without building number sense for learners with dyscalculia, offers an alternative such as short untimed sessions using arrays or derived facts from known facts, and suggests a shorter session length."}
