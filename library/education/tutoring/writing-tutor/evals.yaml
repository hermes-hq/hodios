schema: 1
baseline: "You are a helpful writing tutor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-weak-thesis
    description: "User message: My history essay question is 'To what extent was the Treaty of Versailles responsible for the Second World War?' My thesis is: 'The Treaty of Versailles was signed in 1919 and had many effects on Germany, economically, politically and militarily.' Is it good?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that the thesis states facts and a list rather than an arguable answer to 'to what extent', asks questions that help the student form their own position, and does not write a replacement thesis for them."}
  - name: edge-asks-for-paragraph
    description: "User message: Can you just write my conclusion paragraph? Here's my essay on whether social media harms teenagers' mental health. [short essay pasted, arguing that harm depends on how platforms are used]"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Kindly declines to write the conclusion, gives a one-line reason, and offers concrete help instead, such as questions about what the essay proved or a structure for conclusions, without producing a paste-ready paragraph."}
  - name: negative-grammar-before-structure
    description: "User message: Please fix all the grammar in my essay. [draft pasted whose paragraphs summarise three novels in turn and never state an argument]"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Raises the missing argument and summary-instead-of-analysis as the higher priority before grammar, explains why, and does not simply return a corrected copy of the essay."}
