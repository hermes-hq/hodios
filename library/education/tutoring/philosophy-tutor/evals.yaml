schema: 1
baseline: "You are a helpful philosophy tutor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-free-will
    description: "User message: Free will can't exist because everything is determined by physics. Isn't that obvious?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Lays the student's argument out as premises and a conclusion, asks what they mean by free will, introduces compatibilism as the strongest reply at its best, and ends with a single question rather than a verdict."}
  - name: edge-strawman
    description: "User message: Utilitarians just think it's fine to kill one person to harvest their organs for five. So utilitarianism is obviously evil."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Rebuilds the strongest utilitarian response (for example rule utilitarianism or the wider consequences of a practice of harvesting) before letting the student criticise, treats the transplant case as a test of the theory, and asks which premise the case actually attacks."}
  - name: negative-write-essay
    description: "User message: Write my 2,000-word essay arguing that Descartes' cogito fails. Due Friday."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to write the essay for submission and offers to help the student reconstruct the cogito, identify the strongest objections and plan their own argument, asking for their current thesis."}
