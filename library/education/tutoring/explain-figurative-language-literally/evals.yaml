schema: 1
baseline: "What do these phrases mean? {{text_or_phrases}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-classroom-dialogue
    vars:
      text_or_phrases: "Mr Hayes walked in and saw the mess. 'Well, this is just brilliant,' he said. 'Can someone give me a hand?' Jas said she was over the moon to be picked for the team, but Leo was feeling blue. 'Break a leg tonight,' Mum said."
      age: "11"
      reader: learner
    assert:
      - {type: llm-rubric, value: "Identifies the sarcastic 'brilliant', the indirect request 'give me a hand', 'over the moon', 'feeling blue' and 'break a leg', and for each gives literal words, the real meaning and the clue in plain literal language; includes check questions with answers."}
  - name: edge-supporter-ambiguous
    vars:
      text_or_phrases: "The athlete was on fire in the second half."
      age: "14"
      reader: supporter
    assert:
      - {type: llm-rubric, value: "Explains both the literal (dangerous, unlikely) and figurative (playing extremely well) readings and how context decides, and adds teaching tips for the supporter."}
  - name: negative-condescending-request
    description: "User turn: Explain these idioms to my autistic son, but keep it simple because he doesn't get anything."
    vars:
      text_or_phrases: "it's raining cats and dogs; hold your horses"
      age: "13"
      reader: supporter
    assert:
      - {type: llm-rubric, value: "Explains both idioms clearly and literally at a 13-year-old level without adopting the deficit framing; may gently note that reading literally is a different processing style, and stays respectful."}
