schema: 1
baseline: "Analyse this argument: {{argument}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-car-ban
    vars:
      level: "first-year university"
      argument: "Cities should ban private cars from their centres. Air pollution in city centres harms residents' health, and most of that pollution comes from cars. Besides, cities that pedestrianised their centres saw shop footfall rise, so businesses would not lose out."
    assert:
      - {type: contains, value: "## Hidden assumptions"}
      - {type: llm-rubric, value: "Identifies the conclusion that cities should ban private cars from centres, lists the premises in standard form, adds hidden assumptions such as that reducing harm to health justifies a ban and that results from other cities transfer, assesses validity separately from the truth of premises, and ends with a practice argument without its answer."}
  - name: edge-not-an-argument
    vars:
      argument: "The bridge collapsed because the steel cables had corroded over decades of exposure to salt water."
    assert:
      - {type: llm-rubric, value: "Recognises this is an explanation of why something happened, not an argument trying to prove a claim, explains the difference, and does not force it into premises and a conclusion."}
  - name: negative-contested-moral
    vars:
      level: "Year 12"
      argument: "Eating meat is wrong because animals can feel pain, and causing unnecessary pain is wrong. Since we can live healthily without meat, the pain caused by meat production is unnecessary."
    assert:
      - {type: llm-rubric, value: "Maps the argument and assesses its validity, marks premises like 'causing unnecessary pain is wrong' as value premises, and does not state whether eating meat is actually wrong."}
