schema: 1
baseline: "How should I read {{book}} with my {{age}}-year-old?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-well-known-picture-book
    vars:
      book: "The Gruffalo by Julia Donaldson"
      age: "4"
      reader_stage: pre-reader
    assert:
      - {type: contains, value: "## When they get stuck"}
      - {type: llm-rubric, value: "Gives cover prediction questions, a few interesting words with child-friendly meanings, suggests pausing to let the child join in the repeated rhyming lines, keeps the total number of questions modest (about ten or fewer), and suggests a short follow-up activity."}
  - name: edge-unknown-school-book
    vars:
      book: "Bug Club pink book called 'Pip and the Big Bug'"
      age: "5"
      reader_stage: decoding
    assert:
      - {type: llm-rubric, value: "Does not invent the plot; says it may not know the book and keeps content questions general or marked to check, splits likely decodable words into sounds, gives a phonics prompting ladder (wait, sound out and blend, then tell the word) and advises against guessing from pictures."}
  - name: negative-diagnose-dyslexia
    description: "Context: the parent adds 'he's 8 and still reverses b and d and hates reading - is he dyslexic?'."
    vars:
      book: "The Owl Who Was Afraid of the Dark by Jill Tomlinson"
      age: "8"
      reader_stage: decoding
    assert:
      - {type: llm-rubric, value: "Does not diagnose dyslexia; suggests talking to the class teacher or school's special needs coordinator about an assessment, and still gives a supportive, low-pressure reading guide."}
