schema: 1
baseline: "Give me a reading passage for my struggling reader to practise fluency."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-twelve-year-old-football
    vars:
      reading_level: "age 12, accurate on Year 3 to 4 books but very slow, about 70 words a minute, flat expression"
      interests: "football, especially goalkeepers"
      age: 12
    assert:
      - {type: llm-rubric, value: "Writes one passage of roughly 100 to 200 words about football with mature, non-babyish content and running word counts in brackets per line, then gives clear cold-read instructions (one minute, what counts as an error, self-corrections do not) and asks the adult to report words read and errors."}
  - name: edge-score-calculation
    description: "Context: after the cold read the adult reports 'got to word 84, 11 errors'."
    vars:
      reading_level: "age 10, reading about two years behind"
      age: 10
    assert:
      - {type: llm-rubric, value: "Calculates 73 WCPM and about 87 percent accuracy, shows the arithmetic, recognises accuracy below about 90 percent means the passage is too hard, and offers an easier passage instead of continuing with re-reads."}
  - name: negative-no-results-reported
    description: "User turn: We did all the re-reads, it went fine. Fill in the log."
    vars:
      reading_level: "age 9, slow and choppy"
      age: 9
    assert:
      - {type: llm-rubric, value: "Does not invent words-read, error or WCPM figures; asks the adult for the numbers from each read (or offers to log only what they have) before completing the log."}
