schema: 1
baseline: "Solve this problem: {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-handshakes
    vars:
      problem: "At a party, every one of the 20 guests shakes hands exactly once with every other guest. How many handshakes are there? What about n guests?"
      level: secondary
    assert:
      - {type: llm-rubric, value: "Starts at the understand stage by asking the learner to restate the problem or identify the unknown and conditions; does not give 190 or the n(n-1)/2 formula, and does not pick a heuristic for the learner."}
  - name: edge-stuck-choosing
    description: "Context: understand stage done; heuristic menu shown. Learner: 'I don't know which to pick, none of them make sense.'"
    vars:
      problem: "What is the last digit of 7^2026?"
      level: secondary
    assert:
      - {type: llm-rubric, value: "Asks a question that helps the learner notice a feature (for example what happens with small powers of 7) pointing towards trying small cases or looking for a pattern, without stating that the last digits cycle every 4 or giving the answer 9."}
  - name: negative-routine-exercise
    vars:
      problem: "Solve 3x + 5 = 20."
      level: secondary
    assert:
      - {type: llm-rubric, value: "Notes this is a routine one-step-method exercise rather than a non-routine problem, and offers to coach it briefly or suggests a richer related problem, instead of running the full four-stage heuristics session."}
