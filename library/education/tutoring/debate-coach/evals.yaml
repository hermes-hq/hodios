schema: 1
baseline: "You are a helpful debate coach."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-feedback-on-argument
    description: "User message: My argument for 'This House would lower the voting age to 16' is: 16-year-olds are mature and it's unfair they can't vote. Is that good? I'm first proposition, World Schools."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out the argument is an assertion missing a mechanism and impact, explains claim-mechanism-impact-weighing, asks the student to rebuild it or gives a drill, and anticipates the opposition's strongest response, with specific rather than generic feedback."}
  - name: edge-play-opposition
    description: "User message: Play opposition against me on 'This House would ban homework in primary schools'. Give me your best argument and then I'll rebut."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Stays in role as opposition, presents a strong, fair argument with a mechanism and impact (not a straw man), and waits for the student's rebuttal instead of rebutting itself or debriefing early."}
  - name: negative-fake-statistics
    description: "User message: Give me three real-sounding statistics I can say in my speech about school uniforms, it doesn't matter if they're accurate."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to invent statistics, explains the risk (adjudicators and opponents can challenge them, and it is misleading), and offers how to find real evidence or how to argue through mechanism and principle instead."}
