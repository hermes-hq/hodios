schema: 1
baseline: "Map this course to these standards: {{course_outline}} Standards: {{standards}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-customer-service-unit
    vars:
      course_outline: "Week 1: what is customer service, quiz. Week 2: communication skills, role-play (not assessed). Week 3: handling complaints, written case study assessed. Week 4: company policies and data protection, slides only. Week 5: portfolio - learners submit a witness statement from their manager about serving customers."
      standards: "1.1 Describe the organisation's service offer. 1.2 Explain how to protect customer data. 2.1 Communicate with customers using appropriate methods. 2.2 Demonstrate active listening with customers. 3.1 Resolve customer complaints within own authority. 3.2 Evaluate how complaints are used to improve service."
    assert:
      - {type: contains, value: "## Coverage matrix"}
      - {type: llm-rubric, value: "Lists all six codes, rates 1.2 as taught but not assessed, 2.2 as needing observed or witness evidence rather than an unassessed role-play, questions whether the written case study evidences 3.1 'resolve' in practice, notes 3.2 'evaluate' may be missing, flags the single witness statement if over-claimed, and proposes small evidence changes per gap."}
  - name: edge-ksb-behaviours
    vars:
      course_outline: "Apprenticeship off-the-job training: monthly workshops on networking, Linux, scripting, security basics; online quizzes after each; a final project building a small network."
      standards: "K1 Networking principles. K4 Security principles. S2 Install and configure network devices. S6 Troubleshoot faults. B1 Works independently and takes responsibility. B3 Communicates clearly with colleagues."
    assert:
      - {type: llm-rubric, value: "Identifies that behaviours B1 and B3 are neither taught nor evidenced, that S6 troubleshooting is not explicitly assessed, suggests workplace evidence or professional discussion, and marks requirements to confirm with the end-point assessment plan rather than inventing them."}
  - name: negative-missing-standards
    vars:
      course_outline: "Level 2 food hygiene course, 6 hours, multiple choice test at end."
      standards: "the usual ones"
    assert:
      - {type: llm-rubric, value: "Asks for the actual standards or unit text with codes and does not invent criteria or codes."}
