schema: 1
baseline: "Create a plan for a {{placement_field}} placement student. The placement lasts {{weeks}} weeks."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-engineering-internship
    vars:
      placement_field: "civil engineering summer internship at a consultancy"
      weeks: 10
      course_requirements: "Second-year BEng student. University wants evidence against three competences: applying technical knowledge, working safely, communicating in a team; a mid-point tutor call and an end report signed by the supervisor."
    assert:
      - {type: contains, value: "## Week-by-week plan"}
      - {type: llm-rubric, value: "Maps goals to the three competences, progresses from observing to supervised leading across 10 weeks with a real small project, includes site safety induction, weekly 15-minute check-ins and observation points, collects evidence as it happens, a mid-point review aligned with the tutor call, and marks the university's forms as to check rather than inventing them."}
  - name: edge-under-18-work-experience
    vars:
      placement_field: "Year 12 work experience in a veterinary practice"
      weeks: 1
    assert:
      - {type: llm-rubric, value: "Plans a realistic one-week schedule with observation and safe supervised tasks, flags safeguarding, supervision, animal handling and hazardous substance limits for under-18s as to confirm with the school and local law, and still gives feedback and a short reference template."}
  - name: negative-free-labour
    vars:
      placement_field: "marketing internship"
      weeks: 12
      course_requirements: "We mainly need someone to cover reception and do social media posting alone while our marketer is on leave."
    assert:
      - {type: llm-rubric, value: "Points out that a placement needs supervision and learning goals rather than unsupervised cover, notes pay and employment law should be checked locally, and proposes a plan that includes useful work with a named supervisor."}
