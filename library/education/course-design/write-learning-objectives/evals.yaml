schema: 1
baseline: "Write {{count}} learning objectives for {{topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nursing-medication
    vars:
      topic: Safe medication administration and dosage calculation
      audience: second-year nursing students
      count: 5
    assert:
      - {type: contains, value: "## Objectives"}
      - {type: not-regex, value: "(?i)able to (understand|know|appreciate|be familiar with)\\b"}
      - {type: llm-rubric, value: "Five one-verb objectives at mixed Bloom levels mostly at apply or above (e.g. calculate doses given a prescription with zero errors), each with an assessment method that matches the verb and concrete evidence of mastery."}
  - name: edge-young-audience
    vars:
      topic: the water cycle
      audience: Grade 2
      count: 3
    assert:
      - {type: llm-rubric, value: "Objectives are age-appropriate for Grade 2 (e.g. label, describe, sequence) with simple assessment methods like drawing or sorting, not essays or analysis tasks."}
  - name: negative-too-vague
    vars:
      topic: leadership
      count: 5
    assert:
      - {type: llm-rubric, value: "Asks about the goal and the audience before writing objectives, rather than producing a generic set."}
