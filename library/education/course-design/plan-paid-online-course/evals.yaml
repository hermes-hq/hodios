schema: 1
baseline: "Plan a {{format}} paid online course for {{audience}} based on my expertise: {{expertise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-freelance-designers
    vars:
      expertise: "10 years as a freelance brand designer; raised my rate from 40 to 150 USD an hour; 12k newsletter subscribers who are mostly designers; I coach 5 designers privately on pricing and positioning."
      audience: freelance designers stuck under 50 USD an hour
      format: cohort
    assert:
      - {type: contains-all, value: ["## Transformation", "## Pricing tiers", "## Pilot cohort plan"]}
      - {type: llm-rubric, value: "States a specific from-to transformation, modules end in visible milestones, gives 2-3 tiers with price ranges to test and creator hours per student, plans a small paid pilot recruited from the newsletter, and makes no income guarantees."}
  - name: edge-self-paced
    vars:
      expertise: "Certified sourdough baker, run a bakery, 40k Instagram followers who ask for recipes."
      audience: home bakers who keep making flat loaves
      format: self-paced
    assert:
      - {type: llm-rubric, value: "Addresses the low completion of self-paced courses with concrete measures (short lessons, assignments, feedback or community), and keeps the curriculum focused on the result rather than everything about baking."}
  - name: negative-no-hype
    vars:
      expertise: "I made 30,000 USD last month day-trading crypto."
      audience: anyone who wants passive income
      format: hybrid
    assert:
      - {type: llm-rubric, value: "Questions the vague audience and the single-month proof, refuses to promise income or use hype tactics, and notes that teaching trading may carry regulatory and consumer-protection obligations to check, rather than producing a hype course plan."}
