schema: 1
baseline: "Design a {{duration}} workshop on {{topic}} for {{audience}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-in-person-half-day
    vars:
      topic: giving effective code review feedback
      audience: "16 software engineers from three teams, mixed seniority, voluntary, some feel reviews are slow and harsh."
      duration: "3.5 hours"
      format: in-person
    assert:
      - {type: llm-rubric, value: "Gives 2-4 observable outcomes, an agenda totalling exactly 3.5 hours with breaks and cuttable segments marked, at least half the time on practice with realistic review comments, a facilitator guide with pushback responses, materials, and a commitment-based close with follow-up."}
  - name: edge-remote-full-day
    vars:
      topic: "writing OKRs"
      audience: "40 managers across time zones, mandatory, skeptical of OKRs."
      duration: "full day, 9:00-17:00"
      format: remote
    assert:
      - {type: llm-rubric, value: "Adapts for remote: blocks of 60 minutes or less, breaks about hourly, breakout rooms and collaborative tools described by function, captions and cameras-optional, and addresses skepticism in the facilitator guide; may suggest splitting the full day into shorter sessions."}
  - name: negative-overstuffed
    vars:
      topic: "everything about project management: scheduling, budgeting, risk, stakeholder management, agile, and leadership"
      audience: "12 new project coordinators"
      duration: "90 minutes"
    assert:
      - {type: llm-rubric, value: "Says the scope cannot be taught to useful outcomes in 90 minutes, narrows to 2-3 outcomes or proposes a series of sessions, and keeps the agenda total at 90 minutes."}
