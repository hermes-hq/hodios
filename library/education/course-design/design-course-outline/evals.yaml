schema: 1
baseline: "Design a {{length}} course on {{subject}} for {{audience}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-data-viz-course
    vars:
      subject: introductory data visualisation with Python
      audience: second-year biology undergraduates with no coding experience
      length: 8 weeks, one 2-hour session per week
    assert:
      - {type: contains-all, value: ["## Outcomes", "## Assessment plan", "## Module plan", "## Alignment matrix"]}
      - {type: llm-rubric, value: "Outcomes use observable verbs and are realistic for beginners in 8 weeks; modules are ordered by prerequisites (Python basics before plotting); there is an authentic summative task such as visualising a biology dataset; every outcome appears in at least one module and one assessment."}
  - name: edge-workshop-format
    vars:
      subject: facilitating effective team retrospectives
      audience: new engineering managers
      length: a 2-day workshop
    assert:
      - {type: llm-rubric, value: "Adapts the module plan to sessions within two days rather than weeks, with practice-based assessment (such as running a mock retrospective) instead of an exam."}
  - name: negative-overscoped
    vars:
      subject: all of physics
      audience: high-school students
      length: 4 weeks
    assert:
      - {type: llm-rubric, value: "Explicitly narrows the scope, states what was cut and why, rather than cramming all of physics into four weeks."}
