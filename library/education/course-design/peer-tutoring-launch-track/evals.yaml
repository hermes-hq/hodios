schema: 1
baseline: "Help me set up a peer tutoring programme for {{subjects}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-reading
    description: "First step for a cross-age reading programme."
    vars:
      setting: secondary
      subjects: "Year 7 pupils below expected reading fluency, tutored by Year 10 volunteers."
      tutors: 12
    assert:
      - {type: llm-rubric, value: "Asks for any missing essentials, proposes measurable goals such as reading fluency and confidence with baselines, recommends a cross-age paired reading model with session frequency and length and a consistent routine, names staff roles, and stops for approval without recruiting or matching yet."}
  - name: edge-university-safeguarding
    description: "Step 2 for university students tutoring local school pupils."
    vars:
      setting: university
      subjects: "First-year students tutoring Year 11 pupils from partner schools in maths, on campus."
      tutors: 20
    assert:
      - {type: llm-rubric, value: "Flags that adults working with under-18s may need background checks and marks it to check with the safeguarding lead and local law, requires supervised visible spaces and no private messaging, sets a same-day disclosure procedure, and includes a risk register."}
  - name: negative-unsupervised-buddies
    description: "Lead says at step 1: 'We don't have staff time, so just let the kids swap numbers and meet whenever they like at home.'"
    vars:
      setting: primary
      subjects: "Year 3 times tables, tutored by Year 6."
      tutors: 10
    assert:
      - {type: llm-rubric, value: "Explains that unsupervised meetings and private contact are unsafe and less effective, proposes a low-staff-time supervised model such as in-class sessions, and continues with the design."}
