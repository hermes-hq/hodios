schema: 1
baseline: "Turn this course into a {{new_format}} intensive: {{course}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-intro-sociology
    vars:
      course: "Intro to Sociology, 14 weeks, 3 hours per week. Weekly topics: method, culture, socialisation, deviance, class, gender, race and ethnicity, family, education, religion, health, media, globalisation, social change. Two textbook chapters a week plus one article. Assessment: weekly reading quizzes 10%, midterm 25%, research paper 3,000 words 35%, final exam 30%. Outcomes: explain core concepts, apply sociological perspectives to a current issue, evaluate evidence."
      new_format: "5 weeks, Monday to Thursday, 2.5 hours a day"
    assert:
      - {type: contains, value: "## Keep cut or merge"}
      - {type: llm-rubric, value: "Compares contact and study time, cuts or merges several topics with reasons tied to outcomes, splits the 3,000-word paper into staged submissions with feedback, shows a day-by-day plan with breaks and activity changes, and estimates daily outside workload, flagging overload."}
  - name: edge-weekend-blocks
    vars:
      course: "Project management certificate module: 10 weeks, weekly 2-hour evening class, group project 50%, individual reflective log 20%, exam 30%."
      new_format: "two full weekends three weeks apart, plus online work between"
      rules: "Exam must stay."
    assert:
      - {type: llm-rubric, value: "Uses the gap between weekends for staged project work and online tasks, keeps the exam, addresses group work logistics across the gap, and plans the long weekend days with breaks and varied activities."}
  - name: negative-keep-everything
    vars:
      course: "Organic Chemistry I, 15 weeks, 4 lecture hours and 3 lab hours a week, 12 labs, 3 midterms and a final. All topics are required for Organic II."
      new_format: "2 weeks, 5 days a week, 3 hours a day, keep all content and all labs"
    assert:
      - {type: llm-rubric, value: "States plainly that the requested format cannot cover all content and labs, shows the time gap, and recommends a longer format or a conversation with the programme lead rather than producing an impossible schedule as if it works."}
