schema: 1
baseline: "Write a module descriptor for '{{module_title}}' ({{credits}} credits). Notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-final-year-module
    vars:
      module_title: "Sustainable Supply Chains"
      credits: 20
      notes: "Final year BSc Business. Students should understand carbon accounting in supply chains, supplier audits, circular economy models, and critique corporate sustainability claims. 2h lecture + 1h seminar for 11 weeks. Want a group consultancy report for a real local firm and an individual reflective piece. Prereq: Operations Management in year 2."
    assert:
      - {type: contains, value: "## Outcome to assessment map"}
      - {type: llm-rubric, value: "Replaces 'understand' with final-year verbs such as evaluate or critique, gives 200 notional hours split so totals match (33 scheduled hours accounted for), maps every outcome to at least one component with weightings summing to 100%, addresses individual marking within the group report, and uses placeholders rather than invented book titles."}
  - name: edge-ects-template
    vars:
      module_title: "Introduction to Machine Learning"
      credits: 5
      notes: "Master's, ECTS, 1 ECTS = 28 hours here. Required headings: Objectives; Content; Methods; Assessment; Literature. Topics regression, classification, model evaluation, Python labs. Final exam."
    assert:
      - {type: llm-rubric, value: "Uses 140 study hours (5 x 28) rather than the 10-hour default, follows the institution's required headings in order, pitches outcomes at master's level, and points out that a single exam may not evidence practical lab outcomes, suggesting a lab component."}
  - name: negative-no-content
    vars:
      module_title: "New elective"
      credits: 15
      notes: "Need this by Friday for the panel."
    assert:
      - {type: llm-rubric, value: "Asks what students will learn and the level before writing, and does not invent a full module on an assumed topic."}
