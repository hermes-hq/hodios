schema: 1
baseline: "Design a train-the-trainer programme for this course: {{course}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-safety-cascade
    vars:
      course: "Half-day 'Safe manual handling' course for care home staff: legislation overview, risk assessment, hoist use demonstration and practice, case scenarios, short quiz. Hoist safety checks must be delivered exactly as written."
      trainers: "10 senior carers across 5 homes, experienced in care but have never trained groups."
      time: "two days plus one observed delivery"
    assert:
      - {type: contains, value: "## Teach-back and sign-off"}
      - {type: llm-rubric, value: "Builds content mastery and facilitation strands, marks hoist safety checks as deliver as written and checks them in sign-off, uses teach-backs with structured feedback, signs off on an observed delivery, prepares likely learner questions, and plans observation and refreshers to keep quality up."}
  - name: edge-confident-presenters
    vars:
      course: "90-minute customer onboarding webinar for a software product."
      trainers: "Five experienced salespeople who present well but tend to improvise."
    assert:
      - {type: llm-rubric, value: "Focuses content mastery and fidelity for confident presenters, separates what can be adapted from what must stay, and checks fidelity in the sign-off rather than mainly teaching presentation skills."}
  - name: negative-attendance-certificate
    vars:
      course: "First aid awareness for office staff."
      trainers: "Office managers. We want to certify them as trainers after watching one video."
    assert:
      - {type: llm-rubric, value: "Explains that watching a video does not qualify someone to train, proposes sign-off on observed delivery, and notes that first aid training may be subject to regulated or accredited trainer requirements to check locally."}
