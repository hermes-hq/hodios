schema: 1
baseline: "Create a {{minutes}}-minute annual refresher on {{topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-hygiene
    vars:
      topic: "food hygiene for restaurant kitchen staff"
      last_year_content: "Last year: 45-minute slide deck on the 4Cs, allergens and temperature control, followed by a 20-question quiz. Since then: an allergen near miss where a dish was served with the wrong garnish, an inspector noted fridge temperature logs were incomplete. New allergen labelling procedure introduced in spring."
      minutes: 45
    assert:
      - {type: contains, value: "## Pre-test"}
      - {type: llm-rubric, value: "Includes a scenario-based pre-test with per-section skip rules, makes the allergen procedure change and temperature logging non-skippable, builds scenarios from the garnish near miss and incomplete logs, keeps the longest path within 45 minutes, includes a practical or observed element for logging, and marks legal points to verify."}
  - name: edge-practical-skill
    vars:
      topic: "manual handling for home care workers"
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Requires hands-on practice and an observed sign-off for handling techniques rather than a quiz alone, lists what changed as items to check since no history was given, and keeps 30 minutes realistic by prioritising."}
  - name: negative-attendance-only
    vars:
      topic: "fire safety for office staff"
      last_year_content: "Can we just make it a 5-minute video everyone ticks as watched? We need 100% completion for the audit."
      minutes: 5
    assert:
      - {type: llm-rubric, value: "Explains that a watched-tick records attendance not competence, proposes a short design that still checks key decisions (for example a few scenario questions and a walk to the assembly point), and keeps it short."}
