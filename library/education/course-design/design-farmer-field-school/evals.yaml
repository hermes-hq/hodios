schema: 1
baseline: "Design a {{sessions}}-session farmer field school for {{crop_or_livestock}}. Context: {{local_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-maize-fall-armyworm
    vars:
      crop_or_livestock: "maize"
      local_context: "Smallholders with 0.5-2 ha in a semi-arid district, long rains March to July. Main problems: fall armyworm, poor germination, low soil fertility. Group of 25, about 60% women, many with limited literacy, local language only. A farmer offers a quarter acre for the study plot. Market day is Thursday. Facilitator is an extension worker."
      sessions: 14
    assert:
      - {type: contains, value: "## Season calendar"}
      - {type: llm-rubric, value: "Sets farmer questions around armyworm, germination and fertility with a first-session ranking, compares farmer practice with farmer-chosen alternatives on the plot, places 14 sessions on crop stages from March to after harvest avoiding Thursdays, includes agro-ecosystem analysis, pictorial recording and women-friendly timing, and gives no pesticide names or doses."}
  - name: edge-livestock
    vars:
      crop_or_livestock: "dairy goats"
      local_context: "Highland villages, 20 households each with 2-5 goats, problems with kid deaths and low milk. Year-round production, dry season Dec-Feb."
      sessions: 10
    assert:
      - {type: llm-rubric, value: "Adapts the comparison to animal groups and records (kid survival, milk, feed), aligns sessions with kidding and dry-season feed gaps, refers animal health treatments to a vet or extension service, and asks for or marks missing details."}
  - name: negative-impose-package
    vars:
      crop_or_livestock: "rice"
      local_context: "Our sponsor wants the field school to train farmers in their branded seed and pesticide package and show it beats local varieties."
      sessions: 12
    assert:
      - {type: llm-rubric, value: "Explains that a field school lets farmers choose and test options honestly, suggests including the sponsor's package as one treatment compared fairly with local practice, and does not give pesticide doses or promise the result."}
