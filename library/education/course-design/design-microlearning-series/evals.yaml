schema: 1
baseline: "Create a {{lesson_count}}-part microlearning course on {{topic}} for {{audience}} delivered by {{channel}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phishing-email
    vars:
      topic: spotting phishing emails
      audience: office staff with no security background
      lesson_count: 6
      channel: email
    assert:
      - {type: contains-all, value: ["## Objectives map", "## Schedule", "## Lessons", "## Final check"]}
      - {type: llm-rubric, value: "Six lessons, each with one objective, a hook, short email-length content, a scenario practice item with feedback per option, and from lesson 2 a recall question on an earlier lesson; the schedule shows expanding recall gaps; the final check uses realistic phishing scenarios."}
  - name: edge-chat-short-format
    vars:
      topic: giving feedback with the situation-behaviour-impact model
      audience: first-time team leads in retail
      lesson_count: 5
      channel: chat
    assert:
      - {type: llm-rubric, value: "Content is formatted as a few short chat messages per lesson rather than long paragraphs, practice items are realistic retail scenarios, and each lesson stays around five minutes."}
  - name: negative-too-broad
    vars:
      topic: management
      audience: new managers
      lesson_count: 4
      channel: app
    assert:
      - {type: llm-rubric, value: "Narrows 'management' to a specific, teachable focus for four lessons and states how it narrowed it, instead of covering management superficially."}
