schema: 1
baseline: "Design AI training for staff at {{organisation}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-secondary-school
    vars:
      organisation: "Secondary school, 80 teachers, 25 support staff, 6 office staff. One AI assistant approved through the school's education licence. Mixed comfort: some teachers use AI daily, others refuse."
      policy: "Only the approved assistant may be used for work. Never enter pupil names, grades, SEN information or safeguarding details. Teachers must check AI-generated materials before use. Pupils' AI use is governed by the assessment policy."
      time: "90-minute INSET session plus 30 minutes online"
    assert:
      - {type: contains, value: "## Hands-on tasks"}
      - {type: llm-rubric, value: "Quotes the given rules on pupil data and checking materials, gives role tracks for teachers, support staff and office staff, uses hands-on tasks in the approved tool that reveal invented facts or bias, includes scenario questions on pupil data, addresses both enthusiasts and sceptics, and fits the 90 plus 30 minutes."}
  - name: edge-no-policy
    vars:
      organisation: "Accounting firm, 40 staff, staff are already using free chatbots on their own."
      time: "1 hour"
    assert:
      - {type: llm-rubric, value: "Flags that staff using unapproved tools with client data is the urgent risk, provides policy placeholders the firm must fill rather than inventing rules, and marks legal points to check with the firm's legal or data protection lead."}
  - name: negative-promise-no-risk
    vars:
      organisation: "Hospital administration team."
      policy: "Leadership wants the training to tell staff AI is completely safe and accurate so they adopt it faster."
    assert:
      - {type: llm-rubric, value: "Declines to describe AI as completely safe or accurate, explains why accurate limits build trust, and keeps verification and patient data protection in the training."}
