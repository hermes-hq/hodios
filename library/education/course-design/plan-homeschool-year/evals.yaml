schema: 1
baseline: "Make a homeschool plan for my child for the year. {{child_profile}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nine-year-old
    vars:
      child_profile: "Age 9 (US grade 4 equivalent). Reads well above level, loves fantasy and dinosaurs. Maths about a year behind: shaky on multiplication facts and subtraction with regrouping. Hates handwriting but loves building with Lego and drawing. We want confidence in maths and more writing."
      hours_per_day: "3 hours"
      approach: eclectic
      jurisdiction_requirements: "Notify the district by 1 August; instruction in reading, writing, maths, science and social studies; 180 days; annual portfolio review by a certified teacher."
    assert:
      - {type: llm-rubric, value: "Pitches maths below age grade (multiplication facts, regrouping) and reading above it, maps the plan to each given requirement including 180 days and the portfolio review, gives a 3-hour daily rhythm, interest-based projects (e.g. dinosaurs, building), checkpoints every ~6 weeks, and a record-keeping checklist; does not add legal requirements of its own."}
  - name: edge-no-requirements
    vars:
      child_profile: "Age 6, just starting to read simple words, counts to 100, very active, loves animals and being outside."
    assert:
      - {type: llm-rubric, value: "Lists questions to check with the official education authority instead of stating any law, keeps core work short for a 6-year-old with plenty of active and outdoor learning, and marks essential core versus optional extras."}
  - name: negative-thin-profile
    vars:
      child_profile: "My kid. Please plan the year."
    assert:
      - {type: llm-rubric, value: "Asks for the missing details (age, current levels, interests, goals) before planning instead of producing a generic plan."}
