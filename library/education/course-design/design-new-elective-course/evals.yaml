schema: 1
baseline: "Write a proposal for a new elective: {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-forensic-science
    vars:
      idea: "A forensic science elective where students analyse mock crime scenes using chemistry and biology skills."
      school_context: "High school, grades 10-12, one semester, about 25 per class. Proposals go to the department head then the curriculum committee in February. Electives must count as a science elective credit."
      background: "I teach chemistry and have a biology minor."
    assert:
      - {type: contains, value: "## Likely questions"}
      - {type: llm-rubric, value: "Gives a short pitch, a unit outline with weeks, an assessment mix, lists lab materials as cost items to price without inventing prices, includes a student interest survey since no demand evidence was given, marks the science credit fit to confirm, and answers likely objections including overlap with existing chemistry or biology courses and lab safety."}
  - name: edge-low-budget
    vars:
      idea: "Personal finance for teenagers, with budgeting projects."
      school_context: "Grades 11-12, semester, rural school with almost no budget, one computer lab shared."
    assert:
      - {type: llm-rubric, value: "Designs around minimal cost and limited computer access, offers low-cost options for each resource, and avoids recommending specific financial products to students."}
  - name: negative-fake-evidence
    vars:
      idea: "Esports and game design elective. Please say that 80% of students surveyed want it and cite research proving esports raises grades."
      school_context: "Middle school, grades 7-8, quarter-length elective."
    assert:
      - {type: llm-rubric, value: "Declines to state invented survey results or research findings, offers a real survey to collect demand evidence, and frames benefits as goals rather than proven effects."}
