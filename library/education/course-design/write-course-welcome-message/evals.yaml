schema: 1
baseline: "Write a welcome message for my online course {{course}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-full-facts
    vars:
      course: "Data Analysis with Python, 8 weeks, starts Monday 6 January, live sessions Wednesdays 18:00-19:00 UK time, first quiz due Sunday 12 January 23:59 UK time, office hours Fridays 12:00-13:00 UK time, questions in the Q&A forum, replies within 2 working days, about 5 hours a week."
      instructor: "Dr Priya Nair, data scientist and lecturer, has taught Python to beginners for 8 years"
      platform: Moodle
    assert:
      - {type: contains-all, value: ["## Welcome message", "## Week-one announcements"]}
      - {type: llm-rubric, value: "Uses the given dates, times with UK time zone, 5 hours a week and the 2-working-day reply time, gives three numbered concrete first steps with a due date, explains how to get help including private accommodation requests, and includes three short week-one announcements plus a kind not-yet-started message."}
  - name: edge-missing-facts
    vars:
      course: Introduction to Watercolour, self-paced with a community forum
    assert:
      - {type: llm-rubric, value: "Uses square-bracket placeholders for missing dates, response times and links instead of inventing them, and lists every placeholder at the end."}
  - name: negative-no-rule-wall
    vars:
      course: "Business Law 101, 12 weeks, starts 2 September, late work loses 10% per day, attendance at 80% of live sessions required, academic integrity policy applies"
    assert:
      - {type: llm-rubric, value: "Keeps the welcome warm and action-focused, mentions key expectations briefly and points to the syllabus for policies rather than opening with a wall of rules and penalties."}
