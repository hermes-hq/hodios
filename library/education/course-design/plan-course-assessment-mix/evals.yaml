schema: 1
baseline: "Suggest assessments for a {{weeks}}-week course with these outcomes: {{outcomes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-audit-end-loaded-module
    vars:
      outcomes: "1. Explain core principles of public health epidemiology. 2. Calculate and interpret incidence, prevalence and relative risk. 3. Critically appraise an observational study. 4. Communicate a health risk to a lay audience."
      current_assessments: "Critical appraisal essay 3,000 words 50% due week 11; exam 2 hours 50% in week 12. 180 students, 3 markers. University says feedback in 15 working days."
      weeks: 12
    assert:
      - {type: contains, value: "## Load by week"}
      - {type: llm-rubric, value: "Notes that outcome 4 (lay communication) is not assessed and both deadlines cluster at the end, proposes a mix where every outcome is assessed with weightings summing to 100%, adds formative tasks with feedback back before the next summative piece, estimates marker hours for 180 scripts as an assumption, and suggests an authentic lay-communication task."}
  - name: edge-no-current-mix-short-course
    vars:
      outcomes: "Learners can safely set up and use a pressure washer; choose the right nozzle and detergent for a surface; recognise when a job needs a specialist."
      weeks: 2
    assert:
      - {type: llm-rubric, value: "Designs from scratch, keeps the mix light for a two-week course, uses practical observed performance for the safety and setup outcome rather than a written test, and states assumptions about cohort and assessors."}
  - name: negative-no-outcomes
    vars:
      outcomes: "TBC"
      weeks: 10
    assert:
      - {type: llm-rubric, value: "Asks for the learning outcomes and stops rather than inventing outcomes and an assessment plan."}
