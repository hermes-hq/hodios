schema: 1
baseline: "Make a pacing guide for {{course}} for this school year."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grade-8-science
    vars:
      course: "Grade 8 science, six units: matter, chemical reactions, forces and motion, energy, waves, earth systems"
      calendar: "School runs 26 August to 11 June. Class meets daily. Breaks: 25-29 November, 23 December to 3 January, 17-21 March. State science test window 5-16 May. Benchmark testing days 7 October and 3 February."
      content: "Forces and motion and chemical reactions are the most heavily tested. Earth systems is lightly tested."
      minutes_per_lesson: 50
    assert:
      - {type: contains, value: "## Instructional days"}
      - {type: llm-rubric, value: "Counts net lessons after breaks, testing days and an explicitly stated loss percentage; gives forces and motion and chemical reactions more lessons than earth systems; finishes tested units and places review before 5 May; includes buffer lessons; allocated lessons sum to the net total."}
  - name: edge-no-content-list
    vars:
      course: "Year 9 history"
      calendar: "Term 1: 4 September to 19 December, half term 27-31 October. Term 2: 6 January to 3 April, half term 16-20 February. Term 3: 21 April to 18 July, half term 26-30 May. Two lessons a week."
    assert:
      - {type: llm-rubric, value: "Proposes a plausible unit list marked to check against the school's curriculum, states the system assumed, counts lessons from two lessons a week across the three terms, and still produces a dated calendar and fall-behind rules."}
  - name: negative-no-dates
    vars:
      course: "AP Chemistry"
      calendar: "The usual school year."
    assert:
      - {type: llm-rubric, value: "Does not invent a calendar or dates; asks for the first and last teaching days, breaks and the exam date, and stops or gives only a short outline of what it will produce once given them."}
