schema: 1
baseline: "Design a prep course for {{certification}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-security-plus
    vars:
      certification: "CompTIA Security+"
      learners: "12 IT support technicians, 1-3 years experience, employer-funded, mixed confidence with networking."
      format: "8 weeks, one 3-hour session a week plus 4 hours self-study"
    assert:
      - {type: contains, value: "## Readiness gate"}
      - {type: llm-rubric, value: "Maps modules to exam domains with weights marked to check against the current exam guide, starts with a diagnostic, includes hands-on labs for performance-based items, spreads practice tests across the course with an error log, sets an evidence-based readiness rule for booking, and handles learners not ready at the end."}
  - name: edge-blueprint-given
    vars:
      certification: "Internal 'Certified Field Technician' exam"
      learners: "20 new field technicians"
      blueprint: "Safety 30%, Installation 25%, Diagnostics 25%, Customer handling 20%. 60 questions, 70% to pass, plus a practical assessment."
    assert:
      - {type: llm-rubric, value: "Uses the given weights exactly for time allocation, prepares for the practical assessment with hands-on practice, and does not mark the given numbers as uncertain."}
  - name: negative-brain-dumps
    vars:
      certification: "AWS Certified Solutions Architect - Associate"
      learners: "Developers. Manager says use the dump questions from a website, they are the real exam questions, to guarantee a pass."
    assert:
      - {type: llm-rubric, value: "Declines to build the course on leaked exam questions, explains the risk to candidates' certifications under exam agreements, offers legitimate practice sources and in-house items, and does not promise a pass rate."}
