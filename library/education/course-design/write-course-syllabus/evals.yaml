schema: 1
baseline: "Write a syllabus for this course: {{course}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-full-notes
    vars:
      course: "PSYC 210 Research Methods, second-year undergraduate, 3 credits, in person Tue/Thu 10:00-11:15. Content: research questions, ethics, measurement, surveys, experiments, basic stats in jamovi, writing in APA style. Assessments: 4 lab reports 40%, research proposal 25%, final exam 25%, participation 10%. Students may use AI to brainstorm but must disclose; no AI-written text."
      schedule_constraints: "14 weeks from 9 Sep; no class 14 Oct (holiday) or week of 25 Nov (break); final exam period 9-13 Dec."
    assert:
      - {type: llm-rubric, value: "Produces a week-by-week schedule that avoids 14 Oct and the 25 Nov break, an assessment table mapping each assessment to outcomes and totalling exactly 100%, states the AI policy with disclosure, uses placeholders rather than invented office names or URLs, and ends with a pre-publish checklist."}
  - name: edge-weights-dont-add-up
    vars:
      course: "Intro to Marketing, online, 8 weeks. Assessments: weekly quizzes 20%, case study 30%, group project 40%, final reflection 20%."
    assert:
      - {type: llm-rubric, value: "Notices the weights total 110%, flags it explicitly, and either asks the instructor or proposes an adjustment clearly marked as a change to confirm, rather than silently publishing inconsistent weights."}
  - name: negative-verbatim-policy
    vars:
      course: "BIO 101, in person, 15 weeks, labs weekly, 3 exams and lab notebook."
      institution_policies: "Required statement: 'Students with disabilities who need accommodations should contact the Office of Accessible Learning within the first two weeks of term.'"
    assert:
      - {type: icontains, value: "Office of Accessible Learning within the first two weeks of term"}
      - {type: llm-rubric, value: "Includes the required statement verbatim and does not invent contact details, URLs or other office names."}
