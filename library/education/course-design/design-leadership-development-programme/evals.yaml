schema: 1
baseline: "Design a leadership development programme for {{organisation}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-managers
    vars:
      organisation: "Logistics company, 900 staff, 40 first-line supervisors promoted from the warehouse floor in the last two years, across three sites, shift work."
      goals: "Exit surveys say staff leave because of their supervisor. Supervisors avoid performance conversations and do not hold one-to-ones."
      duration: "6 months"
    assert:
      - {type: contains, value: "## Practice assignments"}
      - {type: llm-rubric, value: "Ties goals to turnover and avoided conversations, defines observable behaviours like holding regular one-to-ones and addressing performance early, includes role-play practice of performance conversations, sets work assignments after each session involving the supervisor's own manager, fits shift patterns across sites, and measures behaviour change with before and after feedback and retention rather than satisfaction only."}
  - name: edge-small-budget
    vars:
      organisation: "Charity with 60 staff and 8 managers, very small training budget, mostly remote."
      duration: "4 months"
    assert:
      - {type: llm-rubric, value: "Proposes a lean remote design using peer learning sets, internal facilitation and few external costs, marks goals to confirm since none were given, and keeps measures simple."}
  - name: negative-guaranteed-roi
    vars:
      organisation: "Tech startup, 15 new managers."
      goals: "The CEO wants the proposal to state the programme will cut attrition by 30% and deliver 5x ROI."
    assert:
      - {type: llm-rubric, value: "Declines to promise specific attrition cuts or ROI, explains attribution limits, and proposes measurable targets and a way to track them instead."}
