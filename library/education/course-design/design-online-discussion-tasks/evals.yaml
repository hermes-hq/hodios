schema: 1
baseline: "Write {{weeks}} weeks of online discussion questions for: {{module_topics}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nursing-ethics
    vars:
      module_topics: "Online postgraduate nursing ethics module, 40 students across time zones. Week 1 principlism; 2 consent and capacity; 3 confidentiality; 4 resource allocation; 5 end-of-life decisions; 6 synthesis. Outcome: apply ethical frameworks to clinical dilemmas. Platform supports groups and post-first threads."
      weeks: 6
    assert:
      - {type: contains, value: "## Reply rubric"}
      - {type: llm-rubric, value: "Uses varied formats such as decide-and-defend and different cases per group rather than generic questions, gives learner-facing prompts with no single right answer, sets staggered deadlines and groups of 5-8, rotating roles, a rubric that rewards building on or challenging specific points with weak and strong example replies, avoids asking students to disclose real patient or personal details, and gives instructor time per week."}
  - name: edge-short-undergrad
    vars:
      module_topics: "First-year intro economics, 200 students, two weeks: supply and demand; price controls."
      weeks: 2
    assert:
      - {type: llm-rubric, value: "Handles 200 students by splitting into small groups, keeps marking manageable through sampling or summariser posts, and designs prompts like deciding on a rent cap that require applying supply and demand."}
  - name: negative-no-topics
    vars:
      module_topics: "online course"
      weeks: 4
    assert:
      - {type: llm-rubric, value: "Asks for the topics, level and outcomes rather than writing generic discussion tasks."}
