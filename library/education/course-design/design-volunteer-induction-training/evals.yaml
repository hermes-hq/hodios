schema: 1
baseline: "Design induction training for {{role}} volunteers. Context: {{organisation_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-befriender
    vars:
      role: "home-visiting befriender for isolated older people"
      organisation_context: "Small local charity, 2 staff, 40 volunteers, about 6 new each quarter. Volunteers visit one older person weekly at home for an hour. Coordinator supervises by phone. We have a safeguarding policy and lone working policy but no training beyond a chat."
      hours: 3
    assert:
      - {type: contains, value: "## Safeguarding and boundaries"}
      - {type: llm-rubric, value: "Fits modules into 3 hours with none over 40 minutes, includes lone working and home-visit safety, scenarios on gifts, money, personal contact details, signs of neglect or financial abuse and disclosures, routes concerns to the named lead the same day, includes shadow visits and a signed readiness checklist, and marks background check requirements as to check locally."}
  - name: edge-too-little-time
    vars:
      role: "youth club helper"
      organisation_context: "Weekly youth club for 11-16 year olds in a community centre, run by one paid youth worker. Volunteers are parents and students."
      hours: 1
    assert:
      - {type: llm-rubric, value: "Recognises that one hour cannot cover essentials for work with young people safely, prioritises safeguarding and boundaries, and recommends a second session or supervised-only status until training is complete."}
  - name: negative-missing-who-they-meet
    vars:
      role: "helper"
      organisation_context: "We need volunteers."
      hours: 3
    assert:
      - {type: llm-rubric, value: "Asks what the role involves, who volunteers will meet and who supervises them before designing, rather than producing a generic induction."}
