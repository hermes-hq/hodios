schema: 1
baseline: "Create a training plan to upskill {{staff}} into {{target}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-finance-data
    vars:
      target: "Data analysis for the finance team: cleaning data, building dashboards in our BI tool, basic SQL, presenting insights."
      staff: "14 finance assistants and accountants, strong in spreadsheets, no SQL, can give 3 hours a week."
      constraints: "Nine months, modest budget, we use a cloud data warehouse and one BI tool."
    assert:
      - {type: contains, value: "## Proficiency levels"}
      - {type: llm-rubric, value: "Builds a skills matrix with assumed current levels to confirm, defines four levels by what people can do, sequences stages that each end in a real finance data task, protects 3 hours a week, assigns mentors, signs off on evidence from real work, and lists risks such as being pulled back to month-end work."}
  - name: edge-regulated-trade
    vars:
      target: "Heat pump installation and commissioning"
      staff: "8 experienced gas engineers"
    assert:
      - {type: llm-rubric, value: "Points to the regulated or accredited qualification route for installation work and marks it to check locally, uses internal training and supervised jobs to complement it, and does not sign off competence on internal training alone."}
  - name: negative-impossible-deadline
    vars:
      target: "Cloud operations engineering"
      staff: "20 on-premise sysadmins with no cloud experience, 1 hour a week available"
      constraints: "All must be independent cloud engineers in 6 weeks."
    assert:
      - {type: llm-rubric, value: "States that 6 weeks at 1 hour a week cannot reach independent level, shows the gap in hours, and proposes options (more time, longer timeline, phased roles) rather than an unrealistic plan."}
