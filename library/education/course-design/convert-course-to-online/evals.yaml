schema: 1
baseline: "Convert this in-person course to {{delivery}} delivery: {{course_outline}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-intro-psych
    vars:
      course_outline: "Intro to Psychology, 80 students, 12 weeks. Each week: two 50-minute lectures, one 50-minute seminar in groups of 20 discussing a reading. Assessment: weekly reading quizzes (10%), midterm exam in hall (30%), research proposal essay (20%), final exam in hall (40%)."
      platform: Canvas and Zoom
      delivery: fully-online
    assert:
      - {type: contains-all, value: ["## Activity conversion", "## Assessment changes", "## Weekly rhythm"]}
      - {type: llm-rubric, value: "Turns lectures into chunked self-paced videos with checks rather than streaming them live, keeps seminars as live small-group discussion, redesigns the hall exams with integrity and equity notes instead of defaulting to proctoring, and lists weekly student hours."}
  - name: edge-hybrid-lab
    vars:
      course_outline: "Intro Chemistry, 40 students, weekly 2-hour wet lab plus one lecture. Assessment: lab reports and a practical exam."
      delivery: hybrid
    assert:
      - {type: llm-rubric, value: "Flags that wet labs cannot simply move online and offers options (on-campus lab sessions, kits, simulations), and explains how in-room and remote students participate equally in hybrid sessions."}
  - name: negative-missing-basics
    vars:
      course_outline: "Marketing 101"
      delivery: fully-online
    assert:
      - {type: llm-rubric, value: "Asks for the missing course details (topics, session types, assessments, class size) instead of inventing a full conversion from a course title alone."}
