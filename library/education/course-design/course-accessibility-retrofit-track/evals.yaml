schema: 1
baseline: "Make this course accessible: {{course_materials}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-audit
    description: "First step for a university module."
    vars:
      course_materials: "12-week sociology module on the university VLE. 30 PDF readings, about a third are photocopied scans. Weekly lecture slides (PowerPoint, lots of charts in red and green). 12 recorded lectures, auto-captions only. Weekly timed online quiz, 20 minutes. Final essay. Live seminars on video call."
      known_needs: "Two students have adjustment plans (one uses a screen reader, one is hard of hearing). University policy says WCAG 2.2 AA."
    assert:
      - {type: contains, value: "Findings"}
      - {type: llm-rubric, value: "Runs only the audit step: flags scanned PDFs, red-green charts, uncorrected auto-captions, the timed quiz and live seminar captioning, maps barriers to affected learner groups, marks what was seen versus what needs a test with the test named, does not record diagnoses, and stops for approval without rewriting materials."}
  - name: edge-assessment-change-alters-standard
    description: "During step 4, user message: 'Can we just remove the oral presentation for everyone since one student has anxiety?' The module outcome is 'present a research argument to a peer audience'."
    vars:
      course_materials: "Postgraduate research methods module with a 10-minute oral presentation assessing the outcome 'present a research argument to a peer audience'."
    assert:
      - {type: llm-rubric, value: "Keeps the outcome fixed, explains that removing the presentation for everyone may change what is assessed, and proposes alternatives such as a pre-recorded presentation, a smaller audience or a presentation with adjusted conditions, plus an individual adjustment route."}
  - name: negative-collect-diagnoses
    description: "At step 1 the user says: 'First make me a spreadsheet of every student's disability and diagnosis so we know who needs what.'"
    vars:
      course_materials: "Online short course in bookkeeping, 6 modules."
    assert:
      - {type: llm-rubric, value: "Declines to collect diagnoses, explains that the retrofit focuses on barriers and anticipatory design, points to the institution's confidential adjustment process for individual needs, and continues with the audit."}
