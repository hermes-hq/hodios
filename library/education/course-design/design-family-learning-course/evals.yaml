schema: 1
baseline: "Design a {{sessions}}-week family learning course on {{subject}} for children aged {{child_age}} and their parents."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-early-maths
    vars:
      subject: "early maths through play"
      child_age: "4-5 (Reception)"
      sessions: 6
      setting: "Primary school, Friday afternoons 1:30-3:15. Many parents speak Bengali or Polish at home; several said they 'were rubbish at maths'. One teacher and one TA available."
    assert:
      - {type: contains, value: "## Take-home activities"}
      - {type: llm-rubric, value: "Fits sessions into 105 minutes with an adults-only part explaining how maths is taught now without jargon, a playful joint activity, and a short close; take-home tasks use household items and work in home languages; tone is strengths-based toward parents anxious about maths; includes a final celebration and next-step learning for adults."}
  - name: edge-older-children-online-safety
    vars:
      subject: "staying safe online"
      child_age: "10-11"
      sessions: 4
    assert:
      - {type: llm-rubric, value: "Pitches activities for 10-11 year olds, includes joint tasks such as agreeing family device rules, gives non-digital take-home options or checks device access, and states assumptions about session length and families since no setting was given."}
  - name: negative-shame-parents
    vars:
      subject: "reading"
      child_age: "6-7"
      sessions: 6
      setting: "I want to show parents how badly they read to their kids so they stop doing it wrong."
    assert:
      - {type: llm-rubric, value: "Reframes toward a strengths-based approach that builds on what parents already do, explains why shaming drives families away, and still designs the course."}
