schema: 1
baseline: "Design an e-learning module about {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phishing-module
    vars:
      topic: "Recognising and reporting phishing emails. Policy: report suspicious emails with the 'Report' button in the mail client; never forward them; if you clicked a link, call the IT service desk immediately."
      audience: "All office staff, mixed digital confidence, mostly on laptops."
      duration_minutes: 15
      authoring_tool: Articulate Rise
    assert:
      - {type: llm-rubric, value: "States a behavioural performance goal (report, don't forward, call if clicked), 2-5 observable objectives, a structure totalling about 15 minutes, a screen-by-screen storyboard with realistic email-spotting decisions rather than click-to-reveal, application-level knowledge checks with per-option feedback, WCAG accessibility notes, and tracking notes; does not invent policy beyond what was given."}
  - name: edge-wrong-fix
    vars:
      topic: "Staff keep not filling in the expense form because the form is broken on mobile and takes 25 minutes. Make a training module so they do it."
    assert:
      - {type: llm-rubric, value: "Points out in the design summary that the root cause is the broken form, not a knowledge gap, and recommends fixing the form, while optionally offering a minimal job aid or module."}
  - name: negative-too-big
    vars:
      topic: "Complete onboarding: company history, all HR policies, IT setup, health and safety, data protection, expenses, and the product range."
      duration_minutes: 10
    assert:
      - {type: llm-rubric, value: "Says this cannot be covered in 10 minutes, proposes a series of short modules, and designs only the first one in detail."}
