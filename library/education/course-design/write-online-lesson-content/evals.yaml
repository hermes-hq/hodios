schema: 1
baseline: "Write an online lesson on {{lesson}} for {{audience}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-payslip
    vars:
      lesson: "How to read a payslip - learners can check gross pay, deductions and net pay on their own payslip"
      audience: "school leavers starting their first job"
      minutes: 20
    assert:
      - {type: contains, value: "## Lesson content"}
      - {type: llm-rubric, value: "Splits the lesson into short headed chunks each with an example and a check question with feedback per option, uses a sample payslip as a worked example, marks tax and deduction names that vary by country to verify, ends with a task to check their own payslip, and estimates time near 20 minutes."}
  - name: edge-source-provided
    vars:
      lesson: "Logging a near miss in our safety system"
      audience: "warehouse staff"
      source: "Near misses must be logged within 24 hours in SafeLog. Fields: date, location, what happened, who was involved, immediate action. No blame is attached to reporting. Supervisors review weekly."
      minutes: 10
    assert:
      - {type: llm-rubric, value: "Uses only the given rules (24 hours, the listed fields, no blame, weekly review), does not invent extra fields or steps, includes at least one scenario question about whether an event is a near miss, and fits about 10 minutes."}
  - name: negative-invented-rules
    vars:
      lesson: "Our company's new expenses policy"
      audience: "all staff"
      minutes: 15
    assert:
      - {type: llm-rubric, value: "Does not invent specific policy limits, approval thresholds or deadlines; asks for the policy or writes a template lesson with clearly marked placeholders to fill from the real policy."}
