schema: 1
baseline: "Review this lesson for Universal Design for Learning: {{course_or_lesson}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grade8-history
    vars:
      course_or_lesson: "Grade 8 history lesson on causes of World War I. Goal - students explain three long-term causes. Teacher lectures for 25 minutes with slides of dense text. Students read a 4-page textbook section silently. Assessment - a timed 20-minute written paragraph answer, no notes."
      learners: "28 students, 4 multilingual learners, 2 students with ADHD, one with low vision."
    assert:
      - {type: contains-all, value: ["## Firm goals", "## Barriers found", "## Quick wins"]}
      - {type: llm-rubric, value: "Keeps 'explain three long-term causes' firm while allowing flexible means (oral, visual, written), identifies the dense slides, silent text-only reading and timed writing as barriers for the specific learners described, proposes concrete options under all three UDL principles with effort ratings, and notes the low-vision student may also need an individual accommodation."}
  - name: edge-university-course
    vars:
      course_or_lesson: "Undergraduate statistics course, 12 weeks. Weekly recorded lecture, weekly problem set, one final exam worth 100% of the grade."
    assert:
      - {type: llm-rubric, value: "Flags the single high-stakes exam and lack of practice feedback as barriers, suggests options such as low-stakes retrieval quizzes, worked examples, captions and transcripts, while keeping the statistical competence standard firm."}
  - name: negative-no-learning-styles
    vars:
      course_or_lesson: "Year 5 science lesson on the water cycle. I want to sort the class into visual, auditory and kinaesthetic learners and give each group a different worksheet."
    assert:
      - {type: llm-rubric, value: "Explains briefly that UDL is not learning-styles matching and that grouping students by style is not supported by evidence, and instead offers multiple means for all students."}
