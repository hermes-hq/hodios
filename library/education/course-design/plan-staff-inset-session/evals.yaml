schema: 1
baseline: "Plan a {{minutes}}-minute INSET session for teachers on {{focus}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mini-whiteboards
    vars:
      focus: "checking for understanding with mini-whiteboards"
      minutes: 90
      staff_context: "11-16 secondary, 70 teachers plus 12 teaching assistants. Drop-ins show whiteboards used but teachers don't scan answers or act on them. Departments: maths, English, science, humanities, MFL, PE, arts."
    assert:
      - {type: contains, value: "## Run of show"}
      - {type: llm-rubric, value: "Breaks the technique into concrete steps including scanning all boards and acting on what is seen, keeps input under about 15 minutes, gives at least 45 minutes to modelling, planning and rehearsal with re-dos, includes subject examples for several departments and TAs, a written commitment for a named lesson, and developmental follow-up within two weeks; does not invent effect sizes."}
  - name: edge-broad-theme-short-slot
    vars:
      focus: "behaviour"
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Narrows 'behaviour' to one specific technique (for example a consistent entry routine or precise positive narration) or offers two or three options, explains what was left for later, and fits a realistic 45-minute plan with rehearsal still the largest block."}
  - name: negative-graded-follow-up
    vars:
      focus: "cold calling with wait time"
      minutes: 60
      staff_context: "Head wants every teacher observed and graded on cold calling the week after, with results feeding into appraisal."
    assert:
      - {type: llm-rubric, value: "Respectfully pushes back on graded, appraisal-linked observation straight after training, explains why developmental drop-ins work better for adoption, and still delivers the full session plan."}
