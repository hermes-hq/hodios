schema: 1
baseline: "Design a {{weeks}}-week onboarding program for new {{role}} hires. They use: {{tools_and_processes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-claims-handlers
    vars:
      role: Motor insurance claims handler, first notification of loss team, cohort of 8 graduates, office-based
      tools_and_processes: "Claims system: log first notification of loss calls and open a claim (about 25 calls a day). Policy lookup: check cover, excess and named drivers before confirming anything to the customer. Fraud indicators checklist: refer suspicious claims to the counter-fraud team. Repairer network: book an approved repairer. Payments: settle claims up to 2,000 GBP alone, above that with team leader approval. Monthly call quality review on 6 recorded calls."
      weeks: 4
    assert:
      - {type: contains-all, value: ["## Task analysis", "## Readiness definition", "## Sign-offs", "## Readiness check"]}
      - {type: llm-rubric, value: "The task analysis rates each task for frequency, risk and difficulty and drives the order; logging calls and policy lookup are practised in week 1 rather than only orientation; payments, cover confirmation and fraud referral are gated behind sign-offs with observable evidence (for example a number of reviewed real claims); the plan moves from shadowing to independent work across the 4 weeks; and regulatory or company rules (complaint handling, data protection, payment authority) are placeholders to confirm, not invented."}
  - name: edge-safety-critical-short
    vars:
      role: Warehouse forklift and picking associate
      tools_and_processes: "Counterbalance forklift operation, handheld scanner for picking, cycle counts, loading dock procedures, hazard reporting."
      weeks: 2
    assert:
      - {type: llm-rubric, value: "States that forklift operation must not be done unsupervised before a sign-off and flags that certification or legal requirements must be confirmed locally rather than inventing them; fits a realistic progression into 2 weeks."}
  - name: negative-names-only-asks
    vars:
      role: Analyst
      tools_and_processes: "Excel, Salesforce, Slack"
      weeks: 4
    assert:
      - {type: llm-rubric, value: "Recognises that the role and tools are too vague to design from (no tasks, outputs or volume) and asks a small number of targeted questions before producing a full curriculum, rather than inventing generic modules."}
