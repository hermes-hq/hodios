schema: 1
baseline: "Design a {{weeks}}-week onboarding program for new {{role}} hires. They use: {{tools_and_processes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-support-agents
    vars:
      role: Tier 1 customer support agent, B2B SaaS, remote
      tools_and_processes: "Zendesk: triage, tag and reply to tickets (about 40 a day). Internal knowledge base: find and link articles. Jira: escalate bugs to engineering with reproduction steps. Refund process: refunds under 200 USD approved by the agent, above that by a lead. Weekly QA scoring on 5 random tickets."
      weeks: 4
    assert:
      - {type: contains-all, value: ["## Readiness definition", "## Sign-offs", "## Readiness check"]}
      - {type: llm-rubric, value: "Includes a task analysis that orders tasks by frequency and risk, puts hands-on ticket practice in week 1 rather than only orientation, gates refunds and bug escalation behind sign-offs with observable evidence, and shows a shadow-to-independent progression across the 4 weeks."}
  - name: edge-safety-critical-short
    vars:
      role: Warehouse forklift and picking associate
      tools_and_processes: "Counterbalance forklift operation, handheld scanner for picking, cycle counts, loading dock procedures, hazard reporting."
      weeks: 2
    assert:
      - {type: llm-rubric, value: "States that forklift operation must not be done unsupervised before a sign-off and flags that certification or legal requirements must be confirmed locally rather than inventing them; fits a realistic progression into 2 weeks."}
  - name: negative-names-only-asks
    vars:
      role: Analyst
      tools_and_processes: "Excel, Salesforce, Slack"
      weeks: 4
    assert:
      - {type: llm-rubric, value: "Recognises that the role and tools are too vague to design from (no tasks, outputs or volume) and asks a small number of targeted questions before producing a full curriculum, rather than inventing generic modules."}
