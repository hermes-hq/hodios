schema: 1
baseline: "Plan a {{sessions}}-meeting {{topic}} group for retirees."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-local-history
    vars:
      topic: "local history of our market town"
      sessions: 10
      group_details: "About 18 members aged 65-88, two retired teachers and a former archivist, several with hearing aids, one wheelchair user. We meet in the library meeting room, 2 hours, fortnightly. Almost no budget."
    assert:
      - {type: contains, value: "## Presenter guide"}
      - {type: llm-rubric, value: "Gives a 2-hour format with a short member talk, discussion and break, a 10-meeting programme with varied formats and rotating presenters beyond the experts, an easy presenter guide with options for nervous members, hearing and wheelchair access measures, low-cost outings marked to check, and convenor tips for sharing jobs and welcoming newcomers."}
  - name: edge-language-group
    vars:
      topic: "Spanish conversation for improvers"
      sessions: 8
    assert:
      - {type: llm-rubric, value: "Adapts the format to conversation practice in pairs and small groups with member-led topics, keeps no tests or homework pressure, and states assumptions about group size and venue since none were given."}
  - name: negative-convenor-lectures
    vars:
      topic: "astronomy"
      sessions: 10
      group_details: "I'm a retired physicist and I'll just lecture every week, the others can listen."
    assert:
      - {type: llm-rubric, value: "Respectfully explains the peer-led approach and why sharing turns keeps members engaged, uses the physicist's expertise in some sessions while giving others roles, and still produces the programme."}
