schema: 1
baseline: "Write a facilitator guide for this course: {{course_materials}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-facilitator
    vars:
      course_materials: |
        Workshop: Running effective one-to-ones (2 hours, 12-16 new managers).
        Outcomes: plan a one-to-one agenda; use open questions; agree actions.
        Agenda: 10 min intro; 20 min why one-to-ones matter (slides 2-6); 30 min open vs closed questions practice in trios; 10 min break; 35 min role-play a one-to-one with observer checklist; 15 min action planning and close.
        Handouts: agenda template, question bank, observer checklist.
      facilitator_experience: new
    assert:
      - {type: contains-all, value: ["## Run of show", "## Segment guides", "## Common questions", "## Materials checklist"]}
      - {type: llm-rubric, value: "Run of show adds to 120 minutes; each segment has SAY/DO/ASK cues with suggested wording appropriate for a new facilitator, clear trio and role-play instructions with timing, debrief questions and a short-on-time option; materials list quantities for 12-16 participants; no new content invented beyond suggestions marked as such."}
  - name: edge-overrun-experienced
    vars:
      course_materials: "90-minute webinar on data privacy basics. Agenda: 15 min intro, 40 min presentation, 30 min case studies in breakouts, 20 min Q&A, 10 min quiz."
      facilitator_experience: experienced
    assert:
      - {type: llm-rubric, value: "Notices that the agenda adds up to 115 minutes, not 90, and proposes specific cuts; uses brief cues rather than full scripts for an experienced facilitator; includes virtual-delivery troubleshooting."}
  - name: negative-thin-materials
    vars:
      course_materials: "A course on teamwork."
      facilitator_experience: new
    assert:
      - {type: llm-rubric, value: "Lists what is needed (agenda, objectives, length, activities) instead of inventing a full course and guide."}
