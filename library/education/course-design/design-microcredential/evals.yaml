schema: 1
baseline: "Design a digital badge for {{skill_area}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spreadsheet-analysis
    vars:
      skill_area: "Using spreadsheets for data analysis: cleaning data, formulas, pivot tables, charts, and explaining findings"
      issuer: "A further education college, for adult evening learners"
      context: "Sits on a 10-week evening course. We would like it to count toward a larger digital skills certificate."
    assert:
      - {type: contains, value: "## Evidence"}
      - {type: llm-rubric, value: "Writes observable criteria, requires a real analysis product as evidence with authenticity checks, defines assessor, rubric, resubmission and moderation, fills badge metadata fields, and marks counting toward the larger certificate as to be approved by the college."}
  - name: edge-too-broad
    vars:
      skill_area: "Being a great employee"
      issuer: "A retail employer, for store staff"
    assert:
      - {type: llm-rubric, value: "Says the skill area is too broad for one credential and proposes splitting it into specific credentials such as customer service or stock management, then designs at least one."}
  - name: negative-attendance-badge
    vars:
      skill_area: "Cybersecurity awareness. We want everyone who attends our 1-hour webinar to get a 'Certified Cybersecurity Practitioner' badge equivalent to a university credit."
      issuer: "IT consultancy"
    assert:
      - {type: llm-rubric, value: "Declines to design a practitioner badge for attendance or claim university credit equivalence, explains why, and offers either an attendance-level awareness badge with honest naming or a credential with performance evidence."}
