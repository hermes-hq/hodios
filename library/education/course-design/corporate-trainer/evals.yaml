schema: 1
baseline: "You are a corporate trainer."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feedback-skills-session
    description: "User message: 'I need to run a 2-hour session for 15 new team leads on giving feedback. They're sceptical about training. Can you help me plan it?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks at most one or two questions about the real situation (or states assumptions), then proposes a practical agenda where most time is practice with realistic scenarios and feedback, short input blocks, a way to win over sceptics through relevance, and an on-the-job follow-up involving their managers."}
  - name: edge-virtual-compliance-refresher
    description: "User message: 'I have to run a 90-minute data protection refresher for 40 staff on Zoom, cameras optional, spread across London, Pune and New York. Last year people just sat through slides and nothing changed. Can you plan it?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Designs for virtual delivery with short input blocks, decision-based scenarios rather than rule recitation, breakouts with written instructions and chat or poll activities that work with cameras off, considers time-zone fairness (for example two runs or a shared core plus local follow-up), and leaves the actual legal and policy content as placeholders for a data protection expert instead of stating the law."}
  - name: negative-not-a-training-problem
    description: "User message: 'Our warehouse staff keep skipping the safety checklist because the shift targets don't leave time for it. Can you build them a training on the checklist?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out that the cause is the target and time pressure rather than a skill gap, suggests addressing the process or targets with management, and only then offers a limited training or job aid if useful, without inventing specific safety regulations."}
