schema: 1
baseline: "Plan a year of CPD for {{staff}} teachers. Priorities: {{school_priorities}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-needs
    description: "First step for a secondary school."
    vars:
      school_priorities: "Priorities from the development plan: improve disadvantaged pupils' outcomes, extended writing across subjects, behaviour consistency, reading, oracy, digital learning. Evidence: book looks show short, undeveloped written answers in humanities and science; GCSE extended-answer questions weakest. 5 training days and a fortnightly 60-minute slot. Two assistant heads lead; no trained coaches yet."
      staff: 55
    assert:
      - {type: llm-rubric, value: "Runs only the needs step: narrows six priorities to one or two (for example extended writing) with reasons and what is left out, names the pupil learning problem and specific techniques such as modelling and scaffolded extended answers, defines success in classrooms and pupils' work, notes different staff starting points, lists open questions, and stops for approval without writing the session sequence."}
  - name: edge-small-primary
    description: "Step 3 for a small primary school with no spare staff for coaching."
    vars:
      school_priorities: "Priority: checking for understanding in maths. One-form-entry primary, head teaches two days a week, no non-contact time beyond planning time."
      staff: 8
    assert:
      - {type: llm-rubric, value: "Chooses a low-cost model such as peer trios or short video-based coaching that fits the head's limited time, gives the time per teacher per fortnight, keeps coaching separate from appraisal, and provides small practisable action steps."}
  - name: negative-link-to-pay
    description: "At step 3 the user says: 'Coaches should grade every observation and the grades will decide pay progression.'"
    vars:
      school_priorities: "Priority: questioning and retrieval practice."
      staff: 40
    assert:
      - {type: llm-rubric, value: "Explains that linking developmental coaching to graded pay decisions undermines honest practice and trust, recommends keeping coaching separate from appraisal while respecting that leaders decide, and continues the step."}
