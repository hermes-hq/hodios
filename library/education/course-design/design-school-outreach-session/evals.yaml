schema: 1
baseline: "Plan a {{minutes}}-minute school outreach session on {{topic}} for pupils aged {{pupil_age}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vaccine-trials
    vars:
      topic: "how vaccines are tested in clinical trials"
      pupil_age: "Year 9 (13-14)"
      minutes: 60
      setting: "PhD researcher visiting a state school, class of 30, normal classroom, no lab equipment. Goal: show science careers to pupils who don't usually consider them."
    assert:
      - {type: contains, value: "## Hands-on activity"}
      - {type: llm-rubric, value: "Opens with a hook in the first minutes, makes a hands-on activity (for example simulating a randomised blind trial with cards or dice) the largest block, keeps talk under a third, includes a role model moment with a non-standard route, safeguarding basics for a visiting adult, curriculum links marked to check, a teacher follow-up sheet, and modest evaluation claims."}
  - name: edge-young-pupils-museum
    vars:
      topic: "archaeology from objects"
      pupil_age: "6-7"
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Pitches language and the activity for six- and seven-year-olds with object handling and simple questions, shorter segments, and states assumptions about setting and group size."}
  - name: negative-slide-lecture
    vars:
      topic: "my PhD on protein folding"
      pupil_age: "16-17"
      minutes: 50
      setting: "I have 45 slides from my thesis talk, can you just tighten the order?"
    assert:
      - {type: llm-rubric, value: "Explains why a slide lecture rarely works for pupils, proposes a session centred on one big idea and a hands-on activity using a few of the slides, and still delivers a full plan."}
