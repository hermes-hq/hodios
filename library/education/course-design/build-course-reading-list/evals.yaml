schema: 1
baseline: "Create a {{weeks}}-week reading list for {{course}} for {{level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-urban-sociology
    vars:
      course: "Introduction to Urban Sociology - week topics - cities and modernity, the Chicago School, segregation, gentrification, informal settlements, smart cities"
      weeks: 6
      level: first-year undergraduates, many with English as an additional language
    assert:
      - {type: contains-all, value: ["## Reading list by week", "## Reading load", "## Verify before publishing"]}
      - {type: llm-rubric, value: "Lists well-known, real works (for example Simmel, Park and Burgess, Massey and Denton, Glass or Smith on gentrification, Davis on slums) with no invented DOIs or page ranges, gives confidence ratings, keeps core reading load realistic for first-years with weekly hour estimates, includes Global South perspectives, and provides a verification checklist."}
  - name: edge-existing-readings
    vars:
      course: Philosophy of Mind
      weeks: 4
      level: third-year undergraduates
      existing_readings: "Week 1 - Descartes, Meditations II and VI. Week 3 - Nagel, What Is It Like to Be a Bat? (1974)."
    assert:
      - {type: llm-rubric, value: "Keeps the given Descartes and Nagel readings in weeks 1 and 3, builds coherent core and optional readings around them, and estimates a heavier but realistic load for third-years."}
  - name: negative-no-invented-references
    vars:
      course: Advanced seminar on the regional economic history of 19th-century Paraguay's yerba mate trade
      weeks: 5
      level: postgraduate
    assert:
      - {type: llm-rubric, value: "Acknowledges limited confidence for such a niche topic, avoids fabricating specific article titles, journals or page numbers, marks uncertain items as low confidence and offers search strategies (databases, subject librarians, bibliographies) instead of padding the list."}
