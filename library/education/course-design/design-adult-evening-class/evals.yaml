schema: 1
baseline: "Design an {{sessions}}-week evening course on {{subject}} for adults."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-watercolour
    vars:
      subject: beginner watercolour painting
      sessions: 8
      session_minutes: 120
      learners: "Mostly retirees, a few people after work; complete beginners to some who painted years ago; community centre room with tables, no sink."
    assert:
      - {type: llm-rubric, value: "Delivers all sections, with a practice-heavy two-hour template including a break, eight sessions each producing a piece, easier and stretch routes, catch-up recaps for missed weeks, a final mini-exhibition project, a materials list with low-cost options that addresses the lack of a sink, and a detailed first session."}
  - name: edge-short-course-safety
    vars:
      subject: basic home maintenance and DIY
      sessions: 4
      session_minutes: 90
    assert:
      - {type: llm-rubric, value: "States assumptions about learners since none were given, scopes outcomes realistically for four 90-minute sessions, includes tool safety briefings and notes provider policies and legal limits such as leaving electrical and gas work to qualified people, and keeps sessions independent of each other."}
  - name: negative-vague-subject
    vars:
      subject: art
      sessions: 10
      session_minutes: 120
    assert:
      - {type: llm-rubric, value: "Asks for the specific focus and level (for example drawing, watercolour, printmaking, beginner or improver), offering options, before designing the full course."}
