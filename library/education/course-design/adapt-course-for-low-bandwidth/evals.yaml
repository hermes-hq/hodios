schema: 1
baseline: "Make this course work for learners with poor internet: {{course_outline}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-teacher-training-messaging
    vars:
      course_outline: "8-week course for rural primary teachers on phonics teaching. Currently: weekly 25-minute HD video, 30-page PDF handbook, Friday live Zoom 90 min, online quiz. Teachers have Android phones, prepaid data that is expensive, patchy 3G, many only charge phones at school."
      channel: messaging-app
    assert:
      - {type: contains, value: "## Data budget"}
      - {type: llm-rubric, value: "Converts video to short voice notes with images or text, splits the PDF into small chunks, replaces the live call with asynchronous audio Q&A, sends a weekly message sequence with sizes, uses voice note or photo submissions instead of the online quiz, estimates weekly data in MB with assumptions, and addresses privacy in messaging groups."}
  - name: edge-sms-only
    vars:
      course_outline: "Farmer business skills course, 6 modules on record keeping, pricing and saving. Learners have basic feature phones, no smartphones, some low literacy."
      channel: sms
    assert:
      - {type: llm-rubric, value: "Designs numbered messages under 160 characters with reply codes, adds audio by voice call or a printed pack for low literacy, uses reply-code quizzes, and keeps outcomes reachable or flags limits."}
  - name: negative-no-materials
    vars:
      course_outline: "Our course."
      channel: mixed
    assert:
      - {type: llm-rubric, value: "Asks for the modules, materials and learner access details before redesigning."}
