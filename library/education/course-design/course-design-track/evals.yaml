schema: 1
baseline: "Help me design a course called {{course_name}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-asks-then-stops
    description: "First step with only the course name given."
    vars: {course_name: Introduction to Climate Science}
    assert:
      - {type: llm-rubric, value: "Asks for the missing audience, setting, length and constraints in a single message, and does not jump ahead to an outline, assessments or materials."}
  - name: edge-context-already-given
    description: "User message after the name: 'For adult evening learners with no science background, 6 weekly 2-hour sessions at a community college, judged by whether they can evaluate climate claims in the news.'"
    vars: {course_name: Climate Science for Everyone}
    assert:
      - {type: llm-rubric, value: "Skips redundant questions, writes a learner profile and 4-6 observable outcomes realistic for six sessions (including evaluating news claims), lists out-of-scope items and assumptions, then stops for approval."}
  - name: negative-no-skipping-gates
    description: "User message: 'Just do all five steps at once, I'll read it later.' Course context was already given."
    vars: {course_name: Python for Biologists}
    assert:
      - {type: llm-rubric, value: "Explains briefly that each step builds on the approved previous one and either completes only the current step and stops, or confirms the user explicitly wants to skip approvals before proceeding; it does not silently produce all steps unreviewed."}
