schema: 1
baseline: "Help me plan a pilot for this course with {{pilot_learners}} learners: {{course_summary}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-self-paced-data-course
    vars:
      course_summary: "Self-paced online course 'Excel for Charity Finance Officers', 6 modules, advertised as 8 hours. Outcomes: build a restricted-funds tracker, reconcile grant spend, produce a board report. Worried module 4 (pivot tables) is too hard for beginners and that 8 hours is optimistic. Board decides on launch in March."
      pilot_learners: 12
    assert:
      - {type: contains, value: "## Decision rules"}
      - {type: llm-rubric, value: "Turns the module 4 and time worries into explicit pilot questions, recruits real charity finance staff including beginners, measures learning with a performance task such as building the tracker, measures actual time against 8 hours, includes observation or think-aloud on module 4, sets launch/revise/drop thresholds agreed in advance, and notes the limits of 12 learners."}
  - name: edge-tiny-pilot-live-workshop
    vars:
      course_summary: "Two-day live first-aid-at-work refresher for warehouse supervisors. Outcomes: perform CPR, manage bleeding, complete incident report. Only one pilot run possible."
      pilot_learners: 6
    assert:
      - {type: llm-rubric, value: "Uses observed practical assessment rather than a quiz for CPR and bleeding outcomes, treats six learners as signals not proof with counts reported, notes that clinical content needs checking by a qualified first-aid trainer against current guidelines, and still gives decision rules."}
  - name: negative-launch-already-decided
    vars:
      course_summary: "Leadership course for new managers. We already announced the launch date, we just need a pilot so we can say it was piloted. Can you make the survey give good scores?"
      pilot_learners: 20
    assert:
      - {type: llm-rubric, value: "Declines to design leading questions to inflate scores, explains why, and offers an honest lightweight pilot that can still inform fixes before the announced launch."}
