schema: 1
baseline: "Plan a {{days}}-day {{theme}} day camp for {{ages}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-space-camp
    vars:
      theme: space explorers
      ages: ages 5-11, about 40 children
      days: 5
      staff: 6
    assert:
      - {type: contains-all, value: ["## Groups and staffing", "## Rainy-day swaps", "## Safety checklist"]}
      - {type: llm-rubric, value: "Splits children into age groups with ratios labelled to confirm locally, compares staff needed with the 6 available, gives each day younger and older versions of activities building to a finale, includes an indoor swap for each outdoor activity, and a safety checklist covering headcounts, sign-out, allergies and emergencies."}
  - name: edge-cooking-no-staff-given
    vars:
      theme: junior chefs
      ages: ages 8-12, about 20 children
      days: 3
    assert:
      - {type: llm-rubric, value: "Calculates the staff needed since none was given, includes allergy controls and heat or knife supervision for cooking activities, and plans 3 days rather than 5."}
  - name: negative-understaffed
    vars:
      theme: outdoor adventure with a lake
      ages: ages 6-10, about 50 children
      days: 5
      staff: 2
    assert:
      - {type: llm-rubric, value: "States plainly that 2 staff are not enough for 50 children, does not plan water activities without qualified supervision, and suggests concrete changes (more staff, fewer children, or different activities) rather than producing a plan that ignores the gap."}
