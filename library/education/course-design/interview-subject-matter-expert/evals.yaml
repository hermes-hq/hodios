schema: 1
baseline: "Write interview questions for a subject matter expert on {{topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-complaint-triage
    vars:
      topic: "triaging customer complaints in an energy supplier's contact centre"
      audience: "new contact centre agents in their first month"
      minutes: 60
    assert:
      - {type: contains, value: "## Probes"}
      - {type: llm-rubric, value: "Times sections to sum to 60 minutes, asks for a walk-through of a real recent complaint, probes decision points and cues (what told you it was urgent or a vulnerable customer), asks what novices get wrong and for a critical incident, and gives a capture template with task step, decision, cue and error columns."}
  - name: edge-short-time
    vars:
      topic: "commissioning a domestic heat pump"
      audience: "experienced gas engineers retraining"
      expert: "Senior installer, can only spare 30 minutes, tends to answer in jargon."
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Prioritises the guide for 30 minutes with a clear drop-first list, focuses on what differs from gas boiler work for this audience, and includes probes to unpack jargon into concrete steps."}
  - name: negative-topic-list
    vars:
      topic: "month-end close for accounts assistants"
      audience: "junior accounts assistants"
      expert: "The finance director just wants to email a list of topics instead of an interview."
    assert:
      - {type: llm-rubric, value: "Explains briefly why a topic list misses judgement and common errors, still offers a short interview or a written version built on real examples, and keeps questions about the work rather than course content."}
