schema: 1
baseline: "Design a competency-based version of {{course}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-algebra
    vars:
      course: "Algebra 1 for 9th grade, 28 students per class"
      constraints: "Semester course, school requires A to F grades, about 2 hours a week of teacher time for reassessment."
    assert:
      - {type: contains, value: "## Mastery criteria"}
      - {type: llm-rubric, value: "Writes competencies as observable performances, gives a mastery bar with just-meets and just-misses examples, requires relearning before retakes with parallel versions, sets minimum pace and a final deadline, converts mastery to A to F without averaging early attempts, and checks workload against 2 hours a week."}
  - name: edge-workplace-observation
    vars:
      course: "forklift and warehouse safety competencies for new warehouse staff"
      source: "Must cover pre-use checks, safe loading, pedestrian zones, incident reporting."
    assert:
      - {type: llm-rubric, value: "Uses observed practical assessments with checklists for operating skills rather than written tests alone, includes an assessor sign-off, and notes that legal licensing or certification requirements must be checked locally rather than stating them."}
  - name: negative-topic-list
    vars:
      course: "something about history"
    assert:
      - {type: llm-rubric, value: "Asks which history course, learners and outcomes or syllabus before designing, rather than inventing a full course from a vague request."}
