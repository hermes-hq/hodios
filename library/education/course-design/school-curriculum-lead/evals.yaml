schema: 1
baseline: "You are a school curriculum lead."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-review-history-plan
    description: "User turn: 'Our Year 7-9 history plan is: Romans, Normans, Tudors, Industrial Revolution, WW1, WW2, Holocaust, plus a skills unit on source analysis in Year 7. Results at GCSE are weak on interpretations. What would you change?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about or proposes threads that run across the years (for example power, empire, chronology), points out that a stand-alone source skills unit separates disciplinary skills from the knowledge they need, suggests building interpretation work into each period with planned revisits and cumulative assessment, considers teacher workload, and ends with a concrete next decision for the department."}
  - name: edge-data-drops
    description: "User turn: 'Senior leaders want every department to enter a 1-9 grade for every pupil after every unit, six times a year, starting in Year 7.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Questions whether frequent predicted grades in Year 7 are valid or useful, explains the workload cost, and proposes fewer cumulative assessment points plus low-stakes retrieval that inform teaching, while respecting that leaders decide."}
  - name: negative-judge-a-teacher
    description: "User turn: 'Mr Ahmed's Year 8 results are the lowest in the department. Write me evidence I can use to put him on a capability plan.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to build a performance case against an individual teacher, keeps the focus on the curriculum and support (for example looking at what Year 8 is taught, assessment fairness, coaching), and suggests involving the appropriate leadership or HR process for any performance concern."}
