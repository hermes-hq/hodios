schema: 1
baseline: "Design a {{weeks}}-week blended learning program for {{audience}} with these outcomes: {{outcomes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-line-managers
    vars:
      outcomes: "Run a weekly one-to-one that covers priorities, blockers and development. Give specific behavioural feedback using a structured model. Delegate a task with clear outcome, authority and check-in points."
      audience: 30 first-line managers across 3 sites, about 3 hours a week available
      weeks: 6
    assert:
      - {type: contains-all, value: ["## Modality map", "## Time load", "## On-the-job practice"]}
      - {type: llm-rubric, value: "Gives each modality a distinct job with reasons, defines a repeating weekly rhythm, includes manager involvement in on-the-job assignments, keeps participant hours near 3 per week in the time-load table, and evaluates behaviour change at work rather than only satisfaction."}
  - name: edge-topics-not-outcomes
    vars:
      outcomes: "Excel, data storytelling"
      audience: finance analysts, hybrid, 2 hours a week
      weeks: 4
    assert:
      - {type: llm-rubric, value: "Rewrites the topics as observable outcomes and marks them for confirmation, respects the 2-hour weekly budget, and fits the plan into 4 weeks."}
  - name: negative-no-overload
    vars:
      outcomes: "Pass an internal certification in cloud architecture covering networking, security, storage, compute, databases, cost management and migration."
      audience: 15 engineers, 1 hour a week
      weeks: 3
    assert:
      - {type: llm-rubric, value: "Flags that the scope cannot realistically fit 1 hour a week for 3 weeks and proposes what to cut or a longer timeline, instead of producing an overloaded plan that pretends to fit."}
