schema: 1
baseline: "Design a customer training program for {{product}} for these roles: {{customer_roles}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-expense-software
    vars:
      product: B2B expense management software with mobile app, approvals and accounting integrations
      customer_roles: "Admins configure policies, users and integrations. Approvers review and approve expenses. Employees submit receipts from the mobile app. Partner consultants implement the accounting integrations for mid-size customers."
      goals: "Cut how-to support tickets in the first 90 days by 30%. Certify 50 partner consultants this year."
    assert:
      - {type: contains-all, value: ["## Learning paths", "## Certification", "## Metrics"]}
      - {type: llm-rubric, value: "Gives a separate task-based path for each of the four roles, uses in-product or short formats for employees and deeper training for admins and partners, recommends practical sandbox-based certification for partners but not for employees, and measures ticket reduction with a fair comparison and no causal over-claiming."}
  - name: edge-no-goals
    vars:
      product: open-source data pipeline tool with a paid cloud version
      customer_roles: "Data engineers build and schedule pipelines; platform admins manage workspaces and access."
    assert:
      - {type: llm-rubric, value: "Proposes 2-3 goals and marks them as proposed, and keeps the first phase small enough for a small team to ship."}
  - name: negative-vague-roles
    vars:
      product: our platform
      customer_roles: users
    assert:
      - {type: llm-rubric, value: "Asks what the product does and what different users do with it before designing learning paths, rather than producing generic paths."}
