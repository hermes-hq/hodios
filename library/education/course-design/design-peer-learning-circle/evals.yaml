schema: 1
baseline: "Help me run a {{weeks}}-week study group on {{topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-library-python
    vars:
      topic: "Introduction to Python programming using a free online course"
      weeks: 6
      setting: "Public library, Tuesday evenings, 90 minutes, 8 library laptops and wifi. Librarian facilitating, has never programmed. Expected joiners: job seekers and curious retirees."
    assert:
      - {type: contains, value: "## Facilitator script"}
      - {type: llm-rubric, value: "Keeps the librarian as a host not a teacher with sayable wording for not knowing answers, gives a 90-minute meeting rhythm with check-ins and working time, a six-week plan with a goals and set-up first meeting and a sharing final meeting, realistic weekly hours, device and log-in help without sharing passwords, and does not invent a specific course title or link."}
  - name: edge-workplace-short
    vars:
      topic: "Data visualisation basics"
      weeks: 4
      setting: "Workplace lunchtime circle, 45 minutes, people join from home and office."
    assert:
      - {type: llm-rubric, value: "Compresses the meeting format to 45 minutes, adapts for hybrid attendance, and keeps between-meeting work small for busy staff."}
  - name: negative-no-topic
    vars:
      topic: ""
      weeks: 6
    assert:
      - {type: llm-rubric, value: "Asks what the circle will learn before designing it."}
