schema: 1
baseline: "Plan {{sessions}} sessions of an after-school {{club_type}} for {{ages}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-robotics
    vars:
      club_type: robotics club with 6 LEGO robotics kits and 8 laptops
      ages: ages 9-11, about 15 children
      sessions: 10
    assert:
      - {type: contains-all, value: ["## Session plans", "## Showcase", "## Logistics and safety"]}
      - {type: llm-rubric, value: "Plans 10 sessions that share 6 kits across 15 children (groups or rotations), each session has a hands-on build with a level-up and easier entry, each session stands alone for absent children, and there is an end-of-term showcase where every child shows something."}
  - name: edge-mixed-age-chess
    vars:
      club_type: chess club
      ages: ages 6-13, beginners and two children who play in tournaments
      sessions: 8
    assert:
      - {type: llm-rubric, value: "Handles the wide age and ability range explicitly (pairing, stations or roles for the strong players such as coaching younger members) and progresses from piece movement to games and a tournament within 8 sessions."}
  - name: negative-no-invented-rules
    vars:
      club_type: debate club
      ages: ages 14-16
      sessions: 6
    assert:
      - {type: llm-rubric, value: "Mentions supervision, photo consent and collection arrangements as items to check against school policy rather than stating specific legal ratios as fact, and keeps teacher talk short with most time spent debating."}
