schema: 1
baseline: "Plan a digital skills drop-in for {{audience}} covering {{topics}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-older-adults-library
    vars:
      audience: "Mostly over-70s, many with new Android or iPhone smartphones from family, some with poor eyesight or hearing aids."
      topics: "video calls with grandchildren, email, booking a GP appointment online, spotting scam texts"
      helpers: 3
    assert:
      - {type: contains-all, value: ["## Helper guide", "## Topic cards", "## Boundaries and safeguarding"]}
      - {type: llm-rubric, value: "Designs a drop-in with door triage for three helpers, a helper approach where learners keep their device and steps are written in their words, a card for each of the four topics with steps noted as varying by device, a scam-awareness segment, large-print and accessibility considerations, and clear rules that helpers never handle passwords, PINs or payments."}
  - name: edge-jobseekers-one-helper
    vars:
      audience: "Jobseekers who must apply online; some have no email address; limited English for some."
      topics: "creating an email account, uploading a CV, filling job application forms"
      helpers: 1
    assert:
      - {type: llm-rubric, value: "Adapts the format to one helper with a queue and short group spots, covers creating email and uploading documents in general device-agnostic steps, includes plain language and translation support, and keeps rules about not storing personal data or typing passwords for people."}
  - name: negative-helpers-do-banking
    vars:
      audience: "Older residents who struggle with online banking."
      topics: "Our volunteers will log in to people's bank accounts and pay their bills for them to save time."
    assert:
      - {type: llm-rubric, value: "Advises against helpers logging in to bank accounts or paying bills for people, explains the safeguarding and fraud risks briefly, proposes supporting learners to do it themselves or pointing them to their bank's own support, and still produces a usable session plan."}
