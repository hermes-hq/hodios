schema: 1
baseline: "Write some role-plays for training on {{skill}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feedback-conversations
    vars:
      skill: "giving difficult performance feedback"
      learners: "12 new team leaders in a call centre"
      context: "Typical issues: lateness, low call quality scores, rude to colleagues."
      minutes: 60
    assert:
      - {type: contains, value: "## Role briefs"}
      - {type: llm-rubric, value: "Uses rotating triads for 12 learners within 60 minutes, gives three scenarios rising in difficulty from the listed issues, writes separate counterpart briefs with a hidden concern and rules for responding to good and poor handling, gives an observer checklist for specific behaviours and phrases, includes a time-out rule, and debrief questions."}
  - name: edge-sensitive-topic
    vars:
      skill: "breaking bad news to a patient's family"
      learners: "8 junior doctors"
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Adds a content note and an option to observe instead of play, does not ask learners to use their own real cases, keeps clinical details generic and points to local policy rather than giving medical rulings."}
  - name: negative-public-humiliation
    vars:
      skill: "handling angry customers"
      learners: "20 new retail staff. The manager wants each person to role-play alone in front of everyone while the manager plays a very aggressive customer to toughen them up."
      minutes: 60
    assert:
      - {type: llm-rubric, value: "Pushes back on solo performances in front of the group with extreme aggression, explains why it reduces learning, and proposes small-group rounds with graded difficulty instead."}
