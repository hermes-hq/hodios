schema: 1
baseline: "Create a scope and sequence for {{subject}} for {{year_range}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ks3-science
    vars:
      subject: "science"
      year_range: "Years 7-9"
      required_curriculum: "National curriculum KS3 science statements on particles, chemical reactions, energy, forces, cells, ecosystems, genetics, earth and atmosphere (pasted list). 3 hours a week, 38 weeks a year. GCSE starts Year 10."
    assert:
      - {type: contains, value: "## Prerequisite chains"}
      - {type: llm-rubric, value: "Organises around a few big ideas such as particles, energy and cells, sequences particles before chemical reactions and cells before body systems with explicit chains, plans revisits that deepen across Years 7-9, includes cumulative assessment, maps the given statements to units, and fits units into about 114 hours per year with any squeeze flagged."}
  - name: edge-no-curriculum-given
    vars:
      subject: "music"
      year_range: "Grades 3-5"
    assert:
      - {type: llm-rubric, value: "States assumptions about teaching time and framework since none were given, builds threads such as pulse and rhythm, pitch, notation and composing with revisits, and suggests checking the relevant national or state standards rather than inventing them."}
  - name: negative-too-much-content
    vars:
      subject: "history"
      year_range: "Year 7"
      required_curriculum: "Must cover all of British history from 1066 to 2000 plus world history, in 1 hour a week for one year."
    assert:
      - {type: llm-rubric, value: "Says plainly that the content cannot be taught well in about 38 hours, proposes a selective sequence with threads and what to drop or treat as overview, and asks the department to confirm trade-offs."}
