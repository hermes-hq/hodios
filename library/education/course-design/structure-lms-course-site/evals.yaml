schema: 1
baseline: "How should I organise my {{lms}} course site? {{course}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-canvas-online
    vars:
      course: "Introduction to Marketing, 12 weeks fully online. Weekly topics from segmentation to digital marketing. Weekly readings and short lecture videos, weekly discussion posts 20%, two case analyses 40% (weeks 5 and 10), final marketing plan 40% (week 12)."
      lms: "Canvas"
      delivery: online
    assert:
      - {type: contains, value: "## Module template"}
      - {type: llm-rubric, value: "Gives a start-here page, a repeating weekly module template with a worked example week, a naming convention including week numbers with examples, recommends hiding unused navigation, sets due dates so they show in the calendar, and includes an accessibility and student-view launch check."}
  - name: edge-in-person-lean
    vars:
      course: "Year 11 chemistry, taught in person, I just need a place for slides, homework and revision materials."
      lms: "Google Classroom"
      delivery: in-person-support
    assert:
      - {type: llm-rubric, value: "Keeps the structure lean around topics, homework and revision rather than a full online course, and still gives naming rules and a short launch check."}
  - name: negative-invented-feature
    vars:
      course: "Statistics 101, 10 weeks, blended."
      lms: "Moodle"
      delivery: blended
    assert:
      - {type: llm-rubric, value: "Describes settings in general terms or with features it is confident exist in Moodle, does not assert detailed menu paths as fact, and advises checking the platform's help pages for exact steps."}
