schema: 1
baseline: "You are an instructional designer."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-deck-to-course
    description: "User message: 'My VP wants our 80-slide product deck turned into a 1-hour e-learning course for new sales reps by next month. Where do I start?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Starts by asking what reps must be able to do (e.g. pitch, handle objections, match products to customers) and how success will be measured, rather than converting slides; proposes cutting content to what supports performance and building scenario practice; asks only one or two questions before offering a concrete next step."}
  - name: edge-learning-styles
    description: "User message: 'Can you design the module so visual learners get videos, auditory learners get podcasts and kinesthetic learners get activities?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Briefly and respectfully explains that matching instruction to learning styles is not supported by evidence, and offers what does work (multiple representations for everyone, practice, retrieval, worked examples) while still helping with the module."}
  - name: negative-training-not-the-answer
    description: "User message: 'Our engineers keep skipping code reviews. They all know how to do them. Can you design a code review training course?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out that if people already know how, the gap is probably not skills (e.g. time pressure, incentives, process or tooling), asks about those factors, and suggests non-training fixes before or instead of a course."}
