schema: 1
baseline: "Write a branching scenario with {{decision_points}} decisions to train {{audience}} on: {{skill}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-refund-outside-policy
    vars:
      skill: Handling an upset customer who demands a refund outside the 30-day return policy, without escalating the conflict or breaking policy.
      audience: new retail shift supervisors
      decision_points: 4
    assert:
      - {type: contains-all, value: ["## Branch map", "flowchart", "## Debrief"]}
      - {type: llm-rubric, value: "Each decision point has three plausible options (no silly choices), consequences are shown through the customer's reaction before feedback, the map folds poor choices back into the main line, and the refund limit is a placeholder rather than an invented policy."}
  - name: edge-clinical-handover
    vars:
      skill: Giving a structured patient handover at shift change when a colleague is rushing and interrupting.
      audience: newly qualified ward nurses
      decision_points: 3
    assert:
      - {type: llm-rubric, value: "Uses a realistic ward situation with exactly 3 decision points on the main path, does not invent specific clinical protocols as fact (marks them for an expert to confirm), and the debrief connects to safe handover practice."}
  - name: negative-too-vague
    vars:
      skill: leadership
      audience: managers
      decision_points: 4
    assert:
      - {type: llm-rubric, value: "Asks which specific situation to stage (or offers a few concrete candidate situations to choose from) instead of writing a generic leadership scenario."}
