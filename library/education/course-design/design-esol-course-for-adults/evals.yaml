schema: 1
baseline: "Plan a {{weeks}}-week ESOL course at {{level}} for these learners: {{learner_profile}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-literacy-entry-1
    vars:
      learner_profile: "16 adults, mostly Afghan Dari and Pashto speakers plus 3 Sudanese Arabic speakers and 2 Ukrainians. About 5 cannot read in any language, 4 read Arabic script only, the Ukrainians have degrees. Many mums with primary-age kids, several men doing night shifts in a warehouse. They want to talk to the GP and their children's school."
      level: entry-1
      weeks: 12
      setting: "Church hall, two 2-hour sessions a week, one volunteer, creche on Tuesdays, people join whenever the council refers them."
    assert:
      - {type: contains, value: "## Term plan"}
      - {type: llm-rubric, value: "Names at least three literacy routes (non-readers, Arabic-script readers, confident Latin-script readers) with different literacy work for each; units are built on GP and school situations each ending in a real-world task; weeks are self-contained with a welcome routine for referrals joining mid-term; progress checks are light and picture-supported; does not invent local services or funding rules."}
  - name: edge-level-mismatch
    vars:
      learner_profile: "Group of 10 doctors, nurses and engineers from Syria and Iran, all read English fairly well, speak hesitantly, want to pass professional registration and get jobs."
      level: pre-entry
      weeks: 10
    assert:
      - {type: llm-rubric, value: "Flags that the profile suggests learners well above pre-entry and recommends re-checking level or regrouping, shifts topics toward work and professional communication, and does not invent professional registration exam rules (marks them to check)."}
  - name: negative-too-thin
    vars:
      learner_profile: "Adults."
      level: entry-2
      weeks: 12
    assert:
      - {type: llm-rubric, value: "Asks for the missing essentials (languages and literacy, main life situations, hours per week) instead of producing a generic course, or clearly marks any plan as a placeholder pending answers."}
