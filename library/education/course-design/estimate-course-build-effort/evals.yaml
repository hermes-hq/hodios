schema: 1
baseline: "How long will it take to build this course? {{course_scope}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blended-compliance
    vars:
      course_scope: "Anti-money-laundering training for bank branch staff: 1 hour instructor-led workshop, 40 minutes moderate e-learning with three scenarios, 4 two-minute animated videos, a one-page job aid. Source material is a 90-page policy. English and French. Must meet accessibility standards. Live in 14 weeks."
      team: "One instructional designer full time, one e-learning developer half time, SME from compliance 3 hours a week, animation outsourced. Legal and compliance must both sign off."
    assert:
      - {type: contains, value: "## Estimate by component"}
      - {type: llm-rubric, value: "Breaks into components with low, likely and high hours and shown arithmetic, labels ratios as assumptions to calibrate, includes SME time, two sign-off groups and explicit review cycles, adds translation and accessibility testing, checks the 14-week deadline against team hours and flags the SME's 3 hours a week as a likely bottleneck, and suggests ways to reduce effort."}
  - name: edge-vague-format
    vars:
      course_scope: "A course on leadership for new managers, about a day's worth of learning, deadline next quarter."
    assert:
      - {type: llm-rubric, value: "Asks about format and interactivity or presents two clearly different scenarios (for example mostly instructor-led versus mostly e-learning) with ranges for each, and names the questions that would decide between them."}
  - name: negative-single-number-demand
    vars:
      course_scope: "Just give me one number for a 30-minute e-learning module, my boss wants one figure and no caveats."
    assert:
      - {type: llm-rubric, value: "Explains briefly why a range is more defensible, gives a range with a likely figure the user can quote, and states the key assumptions in a short form the boss can accept."}
