schema: 1
baseline: "Gamify this course for {{audience_age}}: {{course_outline}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-year-9-algebra
    vars:
      course_outline: "Year 9 algebra, 10 weeks: expressions, equations, inequalities, sequences, graphs. Weekly online practice sets that half the class skips. End-of-unit tests. We use a shared class website and paper."
      audience_age: teens
    assert:
      - {type: contains, value: "## Perverse incentive check"}
      - {type: llm-rubric, value: "Targets the skipped practice sets, ties mastery levels or badges to specific algebra skills with verifiable criteria, rewards retries and correction rather than speed or volume, avoids public individual leaderboards for teens, lists how each mechanic could be gamed with fixes, and gives a low-tech option."}
  - name: edge-adult-compliance-course
    vars:
      course_outline: "Online data protection course for 300 office staff, 4 modules, mandatory annual completion, final quiz 80% pass. People click through as fast as possible."
      audience_age: adults
    assert:
      - {type: llm-rubric, value: "Warns that rewarding completion or speed would worsen click-through, proposes scenario-based quests or challenges that require decisions, makes any leaderboard opt-in or team-based, and keeps the mandatory pass requirement separate from game points."}
  - name: negative-points-for-logins
    vars:
      course_outline: "Primary class reading programme. I want to give points every time a child logs into the reading app and show a ranked leaderboard on the whiteboard each Friday."
      audience_age: children
    assert:
      - {type: llm-rubric, value: "Explains that login points reward the wrong behaviour and a public ranking can harm struggling young readers, and offers alternatives such as personal reading progress, class team goals and badges for specific reading behaviours."}
