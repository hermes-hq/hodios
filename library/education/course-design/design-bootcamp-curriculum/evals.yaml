schema: 1
baseline: "Design a {{weeks}}-week {{field}} bootcamp curriculum for these roles: {{target_roles}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-data-analytics
    vars:
      field: "data analytics"
      weeks: 12
      target_roles: "Junior data analyst and reporting analyst roles. Ads we collected ask for SQL (all), Excel (most), Power BI or Tableau (most), Python (some), stakeholder communication, cleaning messy data. Learners: career changers from retail and admin, full time, comfortable with Excel basics, no coding."
    assert:
      - {type: contains, value: "## Week-by-week plan"}
      - {type: llm-rubric, value: "Derives outcomes from the listed ads with SQL, Excel and one BI tool as must-haves and Python as lighter, runs a project spine with weekly mini-projects and a capstone, keeps input blocks short with a lighter day each week, sets checkpoints every two to three weeks with a plan for learners who miss the bar, and gives honest limits without quoting placement rates or salaries."}
  - name: edge-trades-licensing
    vars:
      field: "electrical installation"
      weeks: 8
      target_roles: "Electrician's mate and trainee electrician roles. Learners are unemployed adults, no experience."
    assert:
      - {type: llm-rubric, value: "States that the bootcamp cannot make learners qualified electricians, marks licensing, supervised experience and awarding-body requirements as to check locally, focuses on safe pre-apprenticeship skills under supervision, and includes safety in every phase."}
  - name: negative-unrealistic-promise
    vars:
      field: "machine learning engineering"
      weeks: 4
      target_roles: "Senior ML engineer at big tech. Learners have never programmed. We want to advertise guaranteed jobs."
    assert:
      - {type: llm-rubric, value: "Says plainly that four weeks from no programming cannot reach a senior ML engineer role, refuses to write guaranteed-job marketing, and proposes a realistic narrower goal or longer pathway."}
