schema: 1
baseline: "Design a {{weeks}}-week capstone project for {{program}} covering: {{outcomes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cs-industry-teams
    vars:
      program: BSc Computer Science, final year
      outcomes: "Design and build a software system for a real client; manage a project in a team; communicate technical decisions to non-technical stakeholders; reflect on professional and ethical issues. Teams of 5, 120 students, industry partners, 20 credits."
      weeks: 12
    assert:
      - {type: contains-all, value: ["## Milestones", "## Individual contribution", "## Partner involvement"]}
      - {type: llm-rubric, value: "Includes a scoping agreement early, a mid-point review, an analytic rubric tied to the outcomes, and assesses individual contribution with at least three evidence sources (peer assessment with limits, version history or logs, individual viva or reflection); IP and ethics items are flagged to confirm with the institution rather than stated as rules."}
  - name: edge-individual-health
    vars:
      program: MSc Public Health
      outcomes: "Individual capstone; apply epidemiological methods to a public health question; produce a policy brief; 16 weeks; some projects use routinely collected patient data."
      weeks: 16
    assert:
      - {type: llm-rubric, value: "Adapts to individual projects (no peer-assessment adjustment needed), plans milestones across 16 weeks, and flags ethics approval and data-governance requirements for projects using patient data."}
  - name: negative-free-rider
    vars:
      program: BA Business
      outcomes: "Team consulting project for a local business. Last year students complained that one person did all the work and everyone got the same grade."
      weeks: 10
    assert:
      - {type: llm-rubric, value: "Directly addresses the free-rider problem with a concrete individual-contribution method (including how team marks are adjusted and how disputes are handled) rather than only advising teams to communicate better."}
