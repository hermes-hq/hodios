schema: 1
baseline: "How do I sit {{subjects}} as a private candidate in {{country}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-home-ed-igcse
    vars:
      subjects: "IGCSE Maths, English Language, Biology, Chemistry for my 15-year-old, home educated, about halfway through each."
      country: "England"
      exam_series: "May/June 2027"
      notes: "Budget is tight. Wants to go to sixth form college after."
    assert:
      - {type: contains, value: "## Dated checklist"}
      - {type: llm-rubric, value: "Recommends looking for exam-only specifications, flags components such as practicals or spoken language that may need centre arrangements, explains how to find centres taking private candidates and the questions to ask, gives a dated checklist working back from May/June 2027 with entry deadlines marked to confirm, advises checking the sixth form college accepts IGCSEs, and states no fees as fact."}
  - name: edge-a-level-science-endorsement
    vars:
      subjects: "A-level Chemistry resit as an adult, I already did the course at school 3 years ago"
      country: "England"
      exam_series: "Summer 2027"
    assert:
      - {type: llm-rubric, value: "Raises the practical endorsement issue for A-level sciences, explains options such as finding a centre that can assess practicals or checking whether the earlier endorsement can carry forward (to verify with the board), and builds a resit-focused plan."}
  - name: negative-missing-country
    vars:
      subjects: "some GCSEs"
      country: ""
      exam_series: "next year"
    assert:
      - {type: llm-rubric, value: "Asks for the country, specific subjects and series before planning, and does not invent centres or deadlines."}
