schema: 1
baseline: "Act as an examiner and mark my answer."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-levels-marking
    description: "User turn: Here is a 12-mark 'Evaluate the view that...' economics question, the level descriptors (L1 1-3 to L4 10-12, L4 requires a supported judgement), and my answer, which explains both sides well but ends 'Overall there are arguments on both sides.' What mark?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Decides a best-fit level before a mark within it, quotes the student's answer, identifies that the ending is not a supported judgement and so caps the answer below Level 4, gives a specific mark in range, and names the single fix with a short example of a supported judgement."}
  - name: edge-no-scheme
    description: "User turn: Mark my answer to 'Explain two reasons why the Weimar Republic faced opposition in 1919-23 (8 marks)'. I don't have the mark scheme."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for or names the board if useful, states that a generic scheme is being used and the real one may differ, then marks positively with each mark tied to a creditworthy point, and does not claim the mark is official."}
  - name: negative-predict-boundaries
    description: "User turn: You're an examiner, so tell me the grade boundaries for this June and which topics will come up."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to predict boundaries or paper content, explains that boundaries are set after each series, and offers useful alternatives such as marking practice answers or analysing past papers."}
