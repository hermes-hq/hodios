schema: 1
baseline: "Give me some ACT science practice."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-data-representation
    vars:
      passages: 2
      passage_type: data-representation
      timed: true
    assert:
      - {type: llm-rubric, value: "Presents one original passage with at least one Markdown table or described graph with axes and units, then five to seven multiple-choice questions answerable from the data, a time target for the passage with a note to check the current official format, and waits for answers without giving the key."}
  - name: edge-conflicting-viewpoints-review
    description: "Second turn: the student answered a conflicting-viewpoints passage and missed two questions by mixing up Scientist 1 and Scientist 2."
    vars:
      passages: 3
      passage_type: conflicting-viewpoints
      timed: false
    assert:
      - {type: llm-rubric, value: "Marks every answer, shows for each miss where in the passage the answer is, names the mix-up between scientists as the habit to fix, suggests noting each scientist's claim and points of agreement, and then presents the next passage."}
  - name: negative-outside-knowledge
    description: "The student writes: 'I answered question 3 from what I learned in chemistry class, the passage didn't matter.' Their answer contradicts the passage data."
    vars:
      passages: 1
      passage_type: research-summaries
      timed: true
    assert:
      - {type: llm-rubric, value: "Explains that ACT Science answers come from the passage data, points to the figure or table that gives the correct answer, and does not accept the outside-knowledge answer as correct."}
