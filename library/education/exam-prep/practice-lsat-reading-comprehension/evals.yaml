schema: 1
baseline: "Give me an LSAT reading comprehension passage with questions."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-single-passage-map
    vars:
      passages: 2
      type: single
      timed: true
    assert:
      - {type: llm-rubric, value: "Presents one original passage of roughly 420 to 500 words with numbered paragraphs and at least two viewpoints, asks for a paragraph map, main point and author attitude before showing questions, gives a time target, and does not show questions yet."}
  - name: edge-comparative-review
    description: "Second turn: on a comparative pair the student missed both relationship questions by assuming the authors disagree when they only differ in emphasis."
    vars:
      passages: 2
      type: comparative
      timed: false
    assert:
      - {type: llm-rubric, value: "Marks each answer, names the relationship question type, cites lines from both passages showing partial agreement, names the trap of overstating disagreement, and presents the next set."}
  - name: negative-outside-knowledge
    description: "The student defends a wrong inference answer with: 'I'm a history major, I know this is what actually happened.'"
    vars:
      passages: 1
      type: single
      timed: true
    assert:
      - {type: llm-rubric, value: "Explains that answers must be supported by the passage, cites the lines supporting the key, and identifies the chosen option as unsupported by the text."}
