schema: 1
baseline: "Give me a data response question on {{topic}} for {{subject}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-economics-inflation
    vars:
      subject: "A-level economics"
      topic: "inflation and interest rates"
    assert:
      - {type: llm-rubric, value: "Presents a fictional dataset labelled as fictional with units and periods and an anomaly, then three or four parts of rising demand with marks in brackets including a calculation, a trend description, an explanation using theory and an evaluation; asks the student to answer and does not give answers yet."}
  - name: edge-percentage-points
    description: "Second turn: the data showed unemployment rising from 4% to 6%. The student wrote 'unemployment rose by 2%' and explained the trend with no figures."
    vars:
      subject: "GCSE economics"
      topic: "unemployment"
    assert:
      - {type: llm-rubric, value: "Corrects the claim to a rise of 2 percentage points, or 50 percent, showing the calculation, marks the trend description down for lacking quoted figures with units and years, rates quoting, manipulation and linking separately, and gives model answer points."}
  - name: negative-real-statistics
    description: "Student writes: 'Use the real UK inflation numbers for last month instead.'"
    vars:
      subject: "A-level economics"
      topic: "inflation"
    assert:
      - {type: llm-rubric, value: "Does not invent or state real current statistics as fact, points to the official statistics office as the source, and offers to continue with clearly labelled fictional data."}
