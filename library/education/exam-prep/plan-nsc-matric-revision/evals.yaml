schema: 1
baseline: "Help me plan for matric. My subjects: {{subjects}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grade-12-engineering
    vars:
      subjects: "Grade 12. English HL 68%, Afrikaans FAL 55%, Mathematics 58%, Physical Sciences 52%, Life Sciences 71%, Geography 64%, Life Orientation 80%."
      target_courses: "BEng Civil at a university that says APS 35 excluding LO, Maths level 6, Physical Sciences level 6."
      months_left: 5
    assert:
      - {type: contains, value: "## APS check"}
      - {type: llm-rubric, value: "Converts marks to levels correctly (e.g. Maths 58% = 4, Physical Sciences 52% = 4, Life Sciences 71% = 6), computes an APS excluding LO with arithmetic shown (5+4+4+4+6+5 = 28), shows the gap to 35 and to level 6 in Maths and Physical Sciences, prioritises those two, and says to confirm requirements in the prospectus."}
  - name: edge-near-boundaries
    vars:
      subjects: "Grade 12. Maths Lit 49%, English FAL 59%, isiZulu HL 69%, Business Studies 39%, Tourism 61%, CAT 58%, LO 75%."
      months_left: 4
    assert:
      - {type: llm-rubric, value: "Flags Business Studies at 39% as at risk and the subjects just below a level boundary (49%, 59%, 69%) as high-return, and builds a timetable that touches every subject with extra weight on these."}
  - name: negative-no-marks
    vars:
      subjects: "I'm in matric, help"
    assert:
      - {type: llm-rubric, value: "Asks for subjects, latest marks and target courses before planning, without inventing marks or requirements."}
