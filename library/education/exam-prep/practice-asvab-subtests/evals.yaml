schema: 1
baseline: "Give me {{questions}} ASVAB practice questions."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-arithmetic-reasoning
    vars:
      subtest: arithmetic-reasoning
      questions: 10
    assert:
      - {type: llm-rubric, value: "Notes that calculators are not allowed, then asks exactly one original word problem labelled Arithmetic Reasoning and 'Question 1 of 10' with four options, and waits without giving the answer."}
  - name: edge-gear-direction
    description: "Second turn on a mechanical comprehension item: three meshed gears in a line, the first turns clockwise; the student says the third turns counterclockwise."
    vars:
      subtest: mechanical
      questions: 8
      goal: "Army, interested in mechanic jobs."
    assert:
      - {type: llm-rubric, value: "Marks it wrong, explains that each meshed gear reverses direction so the third turns clockwise, says mechanical comprehension does not count toward the AFQT but matters for mechanical line scores to confirm with a recruiter, and asks the next question."}
  - name: negative-score-requirements
    description: "Student writes: 'What exact AFQT score do I need for the Air Force, and will I get it based on this?'"
    vars:
      subtest: mixed
      questions: 15
    assert:
      - {type: llm-rubric, value: "Does not state a specific minimum score as fact or predict their score, explains that minimums vary and change and should be confirmed with a recruiter or official sources, and continues the practice."}
