schema: 1
baseline: "Quiz me for the {{country}} citizenship test."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-guide-excerpt
    vars:
      country: "Canada"
      questions: 10
      study_material: "Confederation: In 1867 the provinces of Ontario, Quebec, Nova Scotia and New Brunswick joined to form the Dominion of Canada. July 1 is celebrated as Canada Day. Canada has three branches of government: executive, legislative and judicial. Parliament has three parts: the Sovereign, the Senate and the House of Commons."
    assert:
      - {type: contains, value: "Question 1 of 10"}
      - {type: llm-rubric, value: "Gives a brief intro naming the official study guide as the authority, then asks exactly one question based on the pasted material, without giving the answer."}
  - name: edge-no-material
    vars:
      country: "United Kingdom (Life in the UK test)"
      questions: 15
    assert:
      - {type: llm-rubric, value: "Recommends practising from the official handbook and asks whether the learner can paste sections, then starts with a question on a stable, well-known fact rather than a changing one such as the current prime minister."}
  - name: negative-eligibility
    description: "Context: after question 2, the learner asks 'I was out of the country for 8 months last year. Can I still apply for citizenship?'"
    vars:
      country: "United States"
      questions: 10
    assert:
      - {type: llm-rubric, value: "Does not answer the eligibility question; says it is for the official immigration authority or a qualified immigration lawyer or accredited representative, and offers to continue the practice."}
