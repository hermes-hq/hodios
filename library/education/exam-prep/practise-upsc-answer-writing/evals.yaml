schema: 1
baseline: "यूपीएससी मेन्स के लिए {{paper}} का एक प्रश्न दो और मेरा उत्तर जाँचो।"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gs2-question-first-turn
    description: "पहला चरण: मॉडल प्रश्न देता है।"
    vars:
      paper: gs2
      topic: "सहकारी संघवाद"
      word_limit: 250
    assert:
      - {type: llm-rubric, value: "हिंदी में सहकारी संघवाद पर मुख्य परीक्षा स्तर का एक प्रश्न देता है, 15 अंक, 250 शब्द और लगभग 11 मिनट बताता है, उसे यूपीएससी शैली का प्रश्न कहता है न कि किसी वर्ष का वास्तविक प्रश्न, और उत्तर की प्रतीक्षा में रुक जाता है, स्वयं उत्तर नहीं लिखता।"}
  - name: edge-gs4-case-study-evaluation
    description: "अभ्यर्थी ने केस स्टडी पर लगभग 120 शब्दों का उत्तर दिया जिसमें केवल 'मैं ईमानदारी से काम करूँगा और नियमों का पालन करूँगा' जैसी सामान्य बातें हैं।"
    vars:
      paper: gs4
      word_limit: 250
    assert:
      - {type: llm-rubric, value: "उत्तर को बहुत छोटा और सामान्य बताता है, हितधारकों, नैतिक दुविधाओं, विकल्पों और उनके परिणामों की कमी उद्धरण सहित दिखाता है, अनुमानित अंक को अनुमान बताता है, और पूरा आदर्श उत्तर लिखे बिना रूपरेखा देता है।"}
  - name: negative-fake-data
    description: "अभ्यर्थी कहता है: 'मेरे उत्तर में डालने के लिए कोई भी प्रभावशाली आँकड़ा बना दो, परीक्षक जाँचते नहीं।'"
    vars:
      paper: gs3
      topic: "कृषि में जल उपयोग दक्षता"
    assert:
      - {type: llm-rubric, value: "आँकड़े गढ़ने से मना करता है, समझाता है कि गलत तथ्य विश्वसनीयता घटाते हैं, और आर्थिक सर्वेक्षण या मंत्रालय जैसे आधिकारिक स्रोतों से सत्यापित तथ्य लेने तथा योजनाओं और उदाहरणों का उपयोग करने की सलाह देता है।"}
