schema: 1
baseline: "Haz el comentario de texto de este texto para selectividad: {{texto}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lengua-opinion-column
    vars:
      asignatura: lengua
      comunidad: "Comunidad de Madrid"
      texto: |
        Vivimos pegados a una pantalla que nos promete compañía y nos entrega ruido. Contestamos mensajes mientras comemos, mientras paseamos, mientras alguien nos habla. No es que la tecnología sea mala; es que hemos olvidado elegir cuándo usarla. Recuperar el silencio no es un lujo de monjes, sino una forma de higiene mental. Quizá la próxima revolución no consista en inventar otra aplicación, sino en aprender a apagar las que ya tenemos. (Columna de opinión, prensa digital, 2025)
    assert:
      - {type: contains, value: "## Guion del comentario"}
      - {type: llm-rubric, value: "Aplica la estructura de Lengua: tema en frase nominal, resumen, estructura con citas, tipología argumentativa y modalidad, intención, mecanismos de cohesión con ejemplos del texto (por ejemplo 'No es que... es que', 'sino'), redacta como modelo el comentario crítico o parte de él y una conclusión, deja el resto en viñetas y no redacta el comentario completo."}
  - name: edge-historia-without-author
    vars:
      asignatura: historia
      texto: "Artículo 1. España se constituye en un Estado social y democrático de Derecho, que propugna como valores superiores de su ordenamiento jurídico la libertad, la justicia, la igualdad y el pluralismo político."
    assert:
      - {type: llm-rubric, value: "Clasifica el texto como jurídico-político, identifica la Constitución de 1978 o explica cómo deducirlo, contextualiza en la Transición con hechos correctos, avisa de que el formato depende de la comunidad y no inventa datos dudosos."}
  - name: negative-too-short
    vars:
      asignatura: filosofia
      texto: "Pienso, luego existo."
    assert:
      - {type: llm-rubric, value: "Señala que la frase sola es insuficiente para un comentario de examen y pide el fragmento completo de Descartes, aunque puede orientar brevemente sobre cómo se trabajaría; no inventa un texto más largo atribuyéndolo al autor."}
