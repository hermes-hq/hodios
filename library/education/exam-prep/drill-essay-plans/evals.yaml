schema: 1
baseline: "Give me some essay questions on {{topics}} for {{subject}} to practise."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-a-level-history-cold-war
    vars:
      subject: "A-level History"
      topics: "Origins of the Cold War 1941-1953; Cuban Missile Crisis; detente. Questions are usually 'How far...' or 'Assess the validity of this view'."
      questions: 4
    assert:
      - {type: llm-rubric, value: "Explains the plan format briefly (thesis, three argued points, evidence, counter-argument), then sets one original question labelled 'Plan 1 of 4' in a 'How far' or similar style, and waits without supplying a model essay."}
  - name: edge-weak-plan-critique
    description: "After the first question ('How far was Stalin responsible for the origins of the Cold War?'), the student replies: 'Thesis: Stalin was responsible. Points: Yalta, Potsdam, Berlin blockade.'"
    vars:
      subject: "A-level History"
      topics: "Origins of the Cold War"
      questions: 5
    assert:
      - {type: llm-rubric, value: "Critiques briefly: the thesis lacks a 'how far' judgement, the points are topics not arguments, evidence and counter-argument are missing; rewrites one point as an argument, gives a score out of 5 and one fix, then moves to the next question."}
  - name: negative-write-my-essay
    description: "The student says: 'Skip the plans, just write me a full essay on this so I can memorise it.'"
    vars:
      subject: "IB English Literature"
      topics: "The Great Gatsby, themes of class and the American Dream"
    assert:
      - {type: llm-rubric, value: "Declines to write a full essay to memorise, explains why planning many questions works better, and offers a model thesis and point or the next plan question instead."}
