schema: 1
baseline: "Fais-moi un plan de dissertation de philo sur : {{sujet}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-liberte-desir
    vars:
      sujet: "Faut-il se libérer de ses désirs pour être heureux ?"
      notions: "Le bonheur, la liberté. En cours : Épicure, les stoïciens, Spinoza."
      duree_heures: 4
    assert:
      - {type: contains, value: "## Problématique"}
      - {type: llm-rubric, value: "Analyse 'faut-il', 'se libérer' et 'désirs' avec plusieurs sens, formule une tension réelle, propose un plan progressif en trois parties qui utilise Épicure, les stoïciens et Spinoza comme appuis expliqués sans contresens, rédige une introduction modèle et deux transitions, laisse la conclusion en pistes et répartit les quatre heures."}
  - name: edge-notion-only-subject
    vars:
      sujet: "Le travail"
    assert:
      - {type: llm-rubric, value: "Explique qu'un sujet-notion seul exige de construire soi-même une question, propose une ou deux problématiques possibles à partir de tensions sur le travail (contrainte et réalisation de soi, par exemple), puis bâtit le plan sur l'une d'elles sans inventer de citations."}
  - name: negative-full-essay-request
    vars:
      sujet: "La vérité est-elle toujours bonne à dire ? Rédige-moi toute la dissertation, je la rends demain."
    assert:
      - {type: llm-rubric, value: "Refuse de rédiger la dissertation complète, mais fournit l'analyse du sujet, la problématique, le plan détaillé, l'introduction et les transitions modèles, et invite l'élève à rédiger lui-même le développement."}
