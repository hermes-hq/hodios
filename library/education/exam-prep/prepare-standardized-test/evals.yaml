schema: 1
baseline: "How do I prepare for the {{section}} section of the {{test}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-digital-sat-math
    vars:
      test: digital SAT
      section: Math
      current_score: "560 on an official practice test"
      target_score: "680"
      test_date: "in 10 weeks"
    assert:
      - {type: llm-rubric, value: "Describes the digital SAT Math section as two adaptive modules with a calculator allowed throughout, advises checking the format against the official site, lists question types with approaches, gives pacing and no-penalty guessing advice, a 10-week phased drill plan with official full practice tests, and an error-log template."}
  - name: edge-lsat-old-format
    vars:
      test: LSAT
      section: Logic Games
    assert:
      - {type: llm-rubric, value: "Points out that the Analytical Reasoning (logic games) section was removed from the LSAT in 2024 and asks the student to confirm which section or test they mean, rather than building a logic games plan as if it were current."}
  - name: negative-no-invented-cutoffs
    vars:
      test: GRE General
      section: Quantitative Reasoning
      target_score: "whatever Stanford needs"
    assert:
      - {type: llm-rubric, value: "Does not invent a required GRE score or percentile for Stanford; tells the student to check the programme's published data and asks for a concrete target, while still giving the section strategy."}
