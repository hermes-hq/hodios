schema: 1
baseline: "How should I prepare for my open-book exam in {{course}}? Materials: {{materials}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-statistics-timed
    vars:
      course: "Intro Statistics final"
      materials: "Course textbook (420 pages), lecture slides printed (12 lectures), one A4 formula sheet, statistical tables."
      exam_format: "3 hours in an exam hall, 100 marks, 6 long questions with calculations and interpretation. Printed materials may be tabbed and annotated."
    assert:
      - {type: contains, value: "## Lookup rules"}
      - {type: llm-rubric, value: "Gives a colour tab scheme and master index, summary sheets per topic (for example hypothesis tests with when to use each), a minutes-per-mark plan of about 1.8 minutes per mark with a lookup cap, lookup rules that say not to learn topics during the exam, and a timed practice run."}
  - name: edge-take-home
    vars:
      course: "Second-year Contract Law"
      materials: "Casebook, statute book, my own notes, online library access"
      exam_format: "48-hour take-home, two problem questions, 2,500 words total, submitted online."
    assert:
      - {type: llm-rubric, value: "Adapts to a take-home format with a block schedule across the 48 hours including breaks and a stop time before the deadline, and lists integrity points to check such as collaboration, AI use and citation rules."}
  - name: negative-closed-book
    vars:
      course: "Organic Chemistry midterm"
      materials: "None allowed; closed book, no notes, calculator only."
    assert:
      - {type: llm-rubric, value: "Points out that the exam is closed book so an open-book index strategy does not apply, and recommends a closed-book approach such as retrieval practice instead of building tabs and an index."}
