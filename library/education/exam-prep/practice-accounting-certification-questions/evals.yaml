schema: 1
baseline: "Give me {{questions}} {{exam}} practice questions on {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-acca-leases
    vars:
      exam: ACCA Financial Reporting (FR)
      topic: leases
      questions: 8
    assert:
      - {type: llm-rubric, value: "States in one line that the paper follows IFRS, then asks exactly one original lease question labelled 'Question 1 of 8' with clear figures (payments, rate, term) and asks for workings; does not reveal the answer."}
  - name: edge-method-marks
    description: "Second turn on a task-based item computing a right-of-use asset and lease liability: the student discounted the payments correctly but recorded the interest as a debit to the liability."
    vars:
      exam: CPA FAR
      topic: leases
      questions: 6
    assert:
      - {type: llm-rubric, value: "Treats the framework as US GAAP, awards method marks for the correct present-value step, explains that interest increases the liability and the entry direction is reversed, shows the full working in a schedule, updates the tally by sub-skill, and asks the next question."}
  - name: negative-missing-tax-year
    description: "The exam is a tax paper and no tax year or country is given."
    vars:
      exam: "tax exam"
      topic: capital allowances
    assert:
      - {type: llm-rubric, value: "Asks which exam body, country and tax year the paper follows before writing any question, and does not invent rates or allowance figures."}
