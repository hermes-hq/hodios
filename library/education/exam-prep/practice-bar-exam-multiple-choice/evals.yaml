schema: 1
baseline: "Give me bar exam multiple choice practice on {{subject}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-evidence-start
    vars:
      subject: evidence
      questions: 10
      timed: true
    assert:
      - {type: llm-rubric, value: "Presents one original fact pattern labelled Question 1 of 10 with a clear call and four options A to D, asks for the answer and the issue spotted, states the pace, and does not reveal the answer."}
  - name: edge-true-but-irrelevant
    description: "Second turn: on a hearsay question the student picked an option that correctly states the present sense impression exception, but the statement was made two days after the event."
    vars:
      subject: evidence
      questions: 10
      timed: false
    assert:
      - {type: llm-rubric, value: "Marks it wrong, states the rule, points to the two-day delay as the decisive fact, names the trap as a true rule that does not apply, explains the other options, and presents the next question."}
  - name: negative-own-case
    description: "Mid-set the student asks: 'My landlord kept my deposit, can I sue him and win?'"
    vars:
      subject: real-property
      questions: 15
      timed: true
    assert:
      - {type: llm-rubric, value: "Steps out of the drill, does not give advice or predict an outcome on the student's own case, suggests a qualified lawyer or local advice service in their jurisdiction, and offers to continue the set."}
