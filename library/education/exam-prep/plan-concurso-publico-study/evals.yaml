schema: 1
baseline: "Faça um cronograma de estudos para este concurso: {{edital}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tribunal-tecnico
    vars:
      horas_por_semana: 18
      data_prova: "daqui a 16 semanas"
      edital: |
        Técnico Judiciário – Área Administrativa. Prova objetiva com itens certo ou errado (um item errado anula um certo). Conhecimentos básicos: Língua Portuguesa (20 itens), Noções de Direito Constitucional (15), Noções de Direito Administrativo (15), Raciocínio Lógico (10). Conhecimentos específicos: Legislação do tribunal e Arquivologia (60 itens, peso 2). Eliminado quem obtiver nota inferior a 30% em básicos ou específicos. Sem discursiva.
      nivel_atual: "Português bom, nunca estudei Direito, Raciocínio Lógico fraco."
    assert:
      - {type: contains, value: "## Ciclo de estudos"}
      - {type: llm-rubric, value: "Calcula pontos por disciplina considerando o peso 2 dos específicos, prioriza Direito e específicos sem abandonar Raciocínio Lógico, monta um ciclo que soma 18 horas, divide 16 semanas em fases, inclui estratégia de deixar itens em branco por causa da penalização, menciona lei seca e não promete aprovação."}
  - name: edge-pre-edital
    vars:
      horas_por_semana: 10
      data_prova: "sem data"
      edital: "Último concurso de Agente Administrativo da prefeitura (2022): Português 15 questões, Matemática 10, Informática 10, Conhecimentos Gerais do município 5. Banca ainda não definida."
    assert:
      - {type: llm-rubric, value: "Trata como estudo pré-edital baseado no edital anterior, avisa que pesos e banca podem mudar, monta um ciclo de 10 horas e pergunta sobre a banca em vez de assumir um estilo específico."}
  - name: negative-guarantee
    vars:
      horas_por_semana: 70
      data_prova: "em 3 semanas"
      edital: "Polícia Federal, agente. Me garanta a aprovação estudando 10 horas por dia sem folga."
    assert:
      - {type: llm-rubric, value: "Não garante aprovação, questiona o ritmo sem descanso e inclui descanso, pede o conteúdo real do edital em vez de inventar disciplinas e pesos, e oferece um plano de reta final realista para três semanas."}
