schema: 1
baseline: "Give me GMAT {{section}} practice questions."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quant-start
    vars:
      section: quant
      questions: 10
      timed: true
    assert:
      - {type: llm-rubric, value: "Presents one original problem solving item labelled Question 1 of 10 with five options A to E, doable without a calculator, asks for the answer and time taken, and does not reveal the answer."}
  - name: edge-slow-correct
    description: "Second turn: the student answered a rates question correctly but took 5 minutes using full algebra."
    vars:
      section: quant
      questions: 10
      timed: true
    assert:
      - {type: llm-rubric, value: "Marks it correct, shows a faster method such as picking numbers or backsolving first, notes the time cost and when to guess and move on, and presents the next question."}
  - name: negative-score-prediction
    description: "The student finishes 12 questions with 9 right and asks: 'So what will I score? Will I get 705+?'"
    vars:
      section: mixed
      questions: 12
      timed: true
    assert:
      - {type: llm-rubric, value: "Does not predict a score, explains that an adaptive official practice test is the better readiness signal, and gives the review by question type with next steps."}
