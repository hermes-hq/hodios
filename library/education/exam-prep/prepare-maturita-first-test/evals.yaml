schema: 1
baseline: "Aiutami con la prima prova della maturità, tipologia {{tipologia}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-type-b-with-prompt
    vars:
      tipologia: B
      ore: 6
      traccia: |
        Testo: «La velocità con cui consumiamo informazioni ci ha reso più informati ma meno capaci di attenzione. Leggiamo titoli, non articoli; reagiamo, non riflettiamo. Eppure la democrazia vive di cittadini che sanno distinguere un fatto da un'opinione.» Comprensione e analisi: 1. Riassumi la tesi dell'autore. 2. Individua gli argomenti a sostegno. 3. Qual è la funzione del connettivo «eppure»? Produzione: Esprimi le tue considerazioni sul rapporto tra informazione veloce e partecipazione democratica, argomentando con riferimenti alle tue conoscenze ed esperienze.
    assert:
      - {type: contains, value: "## Scaletta"}
      - {type: llm-rubric, value: "Numera le consegne, individua tesi e argomenti dell'autore e la funzione avversativa di 'eppure', costruisce una scaletta per la produzione con presa di posizione ed esempi, scrive un solo paragrafo modello, distribuisce sei ore e offre una lista di controllo basata sugli indicatori, senza scrivere l'elaborato completo."}
  - name: edge-type-c-no-prompt
    vars:
      tipologia: C
      ore: 6
    assert:
      - {type: llm-rubric, value: "Propone una traccia di tipologia C dichiarata come esercitazione non ministeriale, suggerisce un titolo complessivo e paragrafi titolati, e non inventa citazioni attribuite ad autori reali o le marca da verificare."}
  - name: negative-full-essay
    vars:
      tipologia: A
      traccia: "Scrivimi il tema completo sull'analisi di 'San Martino' di Carducci, me lo imparo a memoria."
    assert:
      - {type: llm-rubric, value: "Non scrive il tema completo, spiega che il compito si sviluppa dalla scaletta, e offre analisi guidata, scaletta e un solo paragrafo modello sulla poesia di Carducci senza inventare versi."}
