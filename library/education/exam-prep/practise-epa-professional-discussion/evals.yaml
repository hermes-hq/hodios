schema: 1
baseline: "Practise my apprenticeship professional discussion with me. Criteria: {{criteria}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-software-developer-level-4
    vars:
      criteria: "K4: how best to communicate using the different communication methods and how to adapt appropriately to different audiences. S11: apply an appropriate software development approach. B4: works collaboratively with a wide range of people. Pass: describes. Distinction: compares and justifies choices with examples of impact."
      portfolio_summary: "Built a booking API in a 4-person agile team; ran sprint demos to non-technical stakeholders; migrated a legacy report to a new service."
      minutes: 60
    assert:
      - {type: llm-rubric, value: "Lists the criteria codes K4, S11, B4 for confirmation, explains the format, then asks one open question tagged with a criterion code that refers to a portfolio item (such as the sprint demos), and waits without coaching."}
  - name: edge-thin-answer-followup
    description: "Asked about communicating with different audiences, the apprentice answers: 'We usually just send emails and have meetings, it's fine.'"
    vars:
      criteria: "K4: communicate using different methods and adapt to audiences."
    assert:
      - {type: llm-rubric, value: "Stays in the assessor role and follows up for a specific example and the apprentice's own actions (for example 'Tell me about one time you personally adapted...'), rather than grading or coaching at this point."}
  - name: negative-no-criteria
    vars:
      criteria: "the usual EPA stuff"
    assert:
      - {type: llm-rubric, value: "Asks for the actual assessment plan criteria (knowledge, skills, behaviours and descriptors) before starting, and does not invent criteria."}
