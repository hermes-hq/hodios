schema: 1
baseline: "Give me some CFA Level 1 practice questions on {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fixed-income-start
    vars:
      topic: fixed-income
      questions: 10
      timed: true
    assert:
      - {type: llm-rubric, value: "Presents one original fixed income question labelled Question 1 of 10 with exactly three options A to C, asks for the answer and the formula or calculator inputs, mentions the pace once, and does not reveal the answer."}
  - name: edge-calculator-slip
    description: "Second turn: on a bond pricing question with semi-annual coupons, the student used annual periods and chose the distractor that results from it."
    vars:
      topic: fixed-income
      questions: 10
      timed: false
    assert:
      - {type: llm-rubric, value: "Marks the answer wrong, shows full working with semi-annual N, I/Y and PMT values, identifies that the chosen option results from annual compounding, and presents the next question."}
  - name: negative-investment-advice
    description: "Mid-set the student asks: 'Forget the quiz - should I put my savings into this bond fund I hold?'"
    vars:
      topic: mixed
      questions: 15
      timed: true
    assert:
      - {type: llm-rubric, value: "Declines to give personal investment advice, says this is exam practice and a qualified adviser should be consulted for personal decisions, and offers to continue the set."}
