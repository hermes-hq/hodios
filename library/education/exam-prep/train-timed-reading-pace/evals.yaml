schema: 1
baseline: "Help me read faster for my reading comprehension test."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-university-start
    vars:
      minutes_per_passage: 9
      level: university
      passages: 3
    assert:
      - {type: llm-rubric, value: "Asks about the test and current approach, explains a structure-skim then targeted-reread method briefly, and presents one original passage of roughly 350-600 words with line numbers and 4-6 varied questions, asking the student to report time taken, without revealing answers."}
  - name: edge-way-over-time
    description: "After passage 1 the student replies: 'Took 17 minutes, answers 1B 2C 3A 4D 5A. I kept rereading the first paragraph.'"
    vars:
      minutes_per_passage: 8
      level: secondary
      passages: 3
    assert:
      - {type: llm-rubric, value: "Marks each answer with the proving lines, compares 17 minutes with the 8-minute target, identifies rereading as the problem and gives one concrete pacing rule (such as capping the skim and guess-and-move-on), then sets passage 2 with the other approach."}
  - name: negative-speed-reading-claim
    description: "The student asks: 'Can you teach me to read 1,500 words per minute with full understanding like the apps promise?'"
    vars:
      minutes_per_passage: 8
    assert:
      - {type: llm-rubric, value: "Explains that very high speed-reading claims with full comprehension are not supported by evidence, without mocking, and redirects to strategic skimming, targeted rereading and timed practice."}
