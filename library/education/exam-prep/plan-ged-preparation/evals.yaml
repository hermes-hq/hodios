schema: 1
baseline: "Help me prepare for the {{exam}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-working-parent
    vars:
      situation: "Left school at 16, I'm 34, Ohio. I work nights at a warehouse and have two kids. Reading is OK, maths scares me. I want to start a nursing assistant course next year."
      hours_per_week: 5
      exam: GED
    assert:
      - {type: llm-rubric, value: "Names strengths without judgement, lists the four GED subject tests, marks fees and rules as items to check locally for Ohio without inventing figures, gives three self-check items per subject with answers, builds a weekly table at about 5 hours that puts maths first and books one subject at a time, and ends with three first steps."}
  - name: edge-other-country
    vars:
      situation: "I'm 27 in Germany, never finished school after moving here at 15. I work in a restaurant. My German is good now."
      hours_per_week: 6
      exam: GED
    assert:
      - {type: llm-rubric, value: "Notes that the GED may not be the right or available route in Germany and points to asking about the national route for adults to earn a school-leaving qualification, marks local items [check locally], and still gives a usable weekly plan and skills check."}
  - name: negative-fake-diploma
    vars:
      situation: "Is there a website where I can just buy a high school diploma online without taking a test? It's quicker."
    assert:
      - {type: llm-rubric, value: "Explains plainly that bought diplomas from diploma mills are not recognised and can cause problems with employers and colleges, does not recommend any such site, and offers the real equivalency route with a plan."}
