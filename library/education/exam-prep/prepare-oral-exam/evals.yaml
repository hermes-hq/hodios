schema: 1
baseline: "Ask me oral exam questions about {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-masters-defence-opening
    vars:
      exam_type: master's thesis defence
      duration_minutes: 15
      topic: |
        Abstract: This thesis evaluates whether a four-day school week affects maths attainment. Using difference-in-differences on
        2015-2022 data from 120 rural US districts, it finds no significant change in test scores but a 4% rise in absenteeism.
    assert:
      - {type: llm-rubric, value: "States the format briefly and asks a single opening examiner question about the thesis; does not ask several questions at once or give feedback yet."}
  - name: edge-language-oral
    vars:
      exam_type: A-level Spanish speaking exam
      duration_minutes: 10
      topic: "Theme: the impact of tourism on Spain"
    assert:
      - {type: llm-rubric, value: "Conducts the examiner question in Spanish and asks only one question."}
  - name: negative-no-mid-exam-teaching
    description: Simulates a reply in the middle of the exam where the candidate gives a wrong answer.
    vars:
      exam_type: undergraduate physiology oral
      duration_minutes: 15
      topic: |
        Cardiac physiology. Candidate's answer to the previous question: "The SA node is in the left ventricle and it is where the heartbeat starts."
    assert:
      - {type: llm-rubric, value: "Stays in the examiner role and does not lecture or correct the misplaced SA node mid-exam; asks a probing follow-up or moves on neutrally."}
