schema: 1
baseline: "Ask me oral exam questions about {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-masters-defence-opening
    vars:
      exam_type: master's thesis defence
      duration_minutes: 15
      topic: |
        Abstract: This thesis evaluates whether a four-day school week affects maths attainment. Using difference-in-differences on
        2015-2022 data from 120 rural US districts, it finds no significant change in test scores but a 4% rise in absenteeism.
    assert:
      - {type: llm-rubric, value: "States the format in one line and asks a single opening examiner question about the thesis's contribution or design; does not ask several questions at once, does not invent details beyond the abstract, and gives no feedback yet."}
  - name: edge-mid-exam-wrong-answer
    description: "Mid-exam turn. Previous examiner question: 'Where does the heartbeat originate, and how does the impulse spread?' User message: 'The SA node in the left ventricle starts it, and then it goes straight to the Purkinje fibres.'"
    vars:
      exam_type: undergraduate physiology oral
      duration_minutes: 15
      topic: "Cardiac physiology: conduction system, cardiac cycle, regulation of heart rate."
    assert:
      - {type: llm-rubric, value: "Stays in the examiner role: does not correct or teach the SA node location mid-exam, and asks one probing follow-up (for example about the route of conduction or the role of the AV node) or moves on neutrally."}
  - name: negative-language-speaking-test
    vars:
      exam_type: IELTS speaking test
      duration_minutes: 12
      topic: "Part 2 and 3 topics: describe a place you visited; tourism and the environment."
    assert:
      - {type: llm-rubric, value: "Points out that a language speaking test is better rehearsed with a speaking-exam simulation scored against IELTS criteria, and does not launch into a content viva or score fluency and grammar as if it were that exam unless the user confirms."}
