schema: 1
baseline: "Hazme un resumen del tema de oposiciones: {{tema}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-age-written
    vars:
      cuerpo: "Cuerpo General Administrativo de la Administración del Estado"
      tema: "El procedimiento administrativo común: concepto y fases. Los interesados. Términos y plazos."
      formato: escrito
      tiempo_minutos: 45
    assert:
      - {type: contains, value: "## Normativa a verificar"}
      - {type: llm-rubric, value: "Divide el enunciado en sus epígrafes literales, construye un índice que los respeta, cita la Ley 39/2015 del Procedimiento Administrativo Común marcándola para verificar vigencia en el BOE, desarrolla en viñetas sin redactar el tema entero, reparte exactamente 45 minutos y propone repasos espaciados."}
  - name: edge-oral-teacher
    vars:
      cuerpo: "Maestros, especialidad Educación Primaria, Comunidad de Madrid"
      tema: "La función tutorial. La coordinación con las familias."
      formato: oral
      tiempo_minutos: 30
    assert:
      - {type: llm-rubric, value: "Adapta el plan al formato oral con guion de palabras clave y ensayos en voz alta, menciona normativa educativa estatal y autonómica marcada para verificar sin inventar números de decreto, y deja margen al final de los 30 minutos."}
  - name: negative-incomplete-topic
    vars:
      cuerpo: "no lo sé todavía"
      tema: "Tema 12"
    assert:
      - {type: llm-rubric, value: "No inventa el contenido de un 'Tema 12' desconocido; pide el enunciado completo del temario y el cuerpo u oposición antes de preparar nada."}
