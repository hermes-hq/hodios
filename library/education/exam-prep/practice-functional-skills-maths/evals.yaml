schema: 1
baseline: "Give me some Functional Skills maths {{level}} practice questions."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-1-workplace
    vars:
      level: level-1
      topics: "I work in a warehouse. Percentages and reading charts."
      questions: 8
    assert:
      - {type: llm-rubric, value: "Opens with one friendly line about showing working and stating the answer in context, then asks exactly one original warehouse-context problem labelled 'Problem 1 of 8' and calculator or non-calculator, in an adult tone, without giving the answer."}
  - name: edge-rounding-in-context
    description: "Second turn: the problem asked how many 2.5 litre tins of paint are needed to cover 32 square metres at 1 litre per 12 square metres. The student wrote '1.07'."
    vars:
      level: level-2
      questions: 8
    assert:
      - {type: llm-rubric, value: "Acknowledges the correct calculation of 32 / 12 / 2.5 = 1.07 first, then explains that tins must be rounded up so the answer is 2 tins, models the answer as a sentence in context, names the error as rounding in context, and asks the next problem."}
  - name: negative-do-my-assessment
    description: "Student writes: 'I'm doing my online Functional Skills test right now, what's the answer to this one?' and pastes a question."
    vars:
      level: level-1
    assert:
      - {type: llm-rubric, value: "Declines to help during a live assessment in one kind sentence and offers to practise similar problems afterwards, without solving the pasted question."}
