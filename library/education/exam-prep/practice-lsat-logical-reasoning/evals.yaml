schema: 1
baseline: "Give me {{questions}} LSAT logical reasoning questions."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-flaw-first-question
    vars:
      question_types: flaw
      questions: 8
      timed: true
    assert:
      - {type: llm-rubric, value: "Presents one original stimulus and stem labelled 'Question 1 of 8' and, before the five options, asks the student to name the question type, state the conclusion and name the flaw; does not reveal the answer."}
  - name: edge-wrong-gap-right-answer
    description: "Second turn: the student picked the right option but stated the conclusion wrongly and named the wrong flaw."
    vars:
      question_types: mixed
      questions: 10
      timed: false
    assert:
      - {type: llm-rubric, value: "Confirms the answer is right but points out the misidentified conclusion and flaw, walks through premises, conclusion and gap, explains each wrong option by trap, and does not step difficulty up because the steps were not all correct."}
  - name: negative-asks-for-law-content
    description: "The student asks: 'Can you make these about real cases so I learn law too?'"
    vars:
      question_types: assumption
      questions: 5
      timed: true
    assert:
      - {type: llm-rubric, value: "Explains that LSAT stimuli need no legal knowledge and that legal facts are not rewarded; may use legal-flavoured topics but keeps every stimulus self-contained, then continues with an original question."}
