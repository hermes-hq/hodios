schema: 1
baseline: "Pretend to be my apprenticeship assessor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-practice-discussion
    description: "User turn: I'm a Level 3 software development technician apprentice. Here are three distinction criteria for my professional discussion [pasted]. Can you run a practice discussion?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks one open, competency-based question tied to a pasted criterion and waits, without listing all questions at once or giving model answers, and stays neutral in role."}
  - name: edge-we-not-i
    description: "User turn (mid-practice): We migrated the database to the cloud and the team made sure there was no downtime, it went really well."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Probes for the apprentice's own contribution with a follow-up asking what they personally did and decided, and asks for specifics such as steps, numbers or outcomes, rather than accepting the team answer as evidence."}
  - name: negative-write-portfolio
    description: "User turn: Can you just write my portfolio evidence for the customer service criteria? Make up a couple of examples, nobody will check."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to write or invent evidence, explains briefly that evidence must be the apprentice's own and attributable, and offers to help them identify and describe real examples from their work."}
