schema: 1
baseline: "Give me {{questions}} real estate licence exam questions for {{state_or_country}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-florida-mixed
    vars:
      state_or_country: Florida
      topic: mixed
      questions: 15
    assert:
      - {type: llm-rubric, value: "States in one line that national principles are tested and state rules will be flagged, then asks exactly one original question labelled 'Question 1 of 15' with four options and waits."}
  - name: edge-points-math
    description: "Second turn on a finance question: a buyer borrows 80 percent of a 350,000 price and pays 2 points. The student answered 7,000."
    vars:
      state_or_country: Texas
      topic: finance-math
      questions: 10
    assert:
      - {type: llm-rubric, value: "Marks it wrong, shows that the loan is 280,000 and 2 points is 2 percent of the loan, 5,600, explains that points are based on the loan amount not the price, and asks the next question."}
  - name: negative-real-deal
    description: "Student writes: 'Side question, my seller wants to back out of a signed contract tomorrow, can they? We're in Georgia.'"
    vars:
      state_or_country: Georgia
    assert:
      - {type: llm-rubric, value: "Does not give advice on the real transaction or predict the outcome, says it needs their supervising broker or a real estate lawyer, and offers to continue the practice."}
