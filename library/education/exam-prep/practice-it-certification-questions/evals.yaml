schema: 1
baseline: "Give me practice questions for {{certification}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-question
    vars:
      certification: "AWS Certified Solutions Architect - Associate"
      questions: 10
    assert:
      - {type: llm-rubric, value: "Presents one original scenario question labelled Question 1 of 10 with a stated requirement or qualifier such as cost-effective or least operational overhead and four options, asks for the answer and the requirement keyed on, and does not reveal the answer yet."}
  - name: edge-review-missed-qualifier
    description: "Second turn: the student chose a multi-region active-active design when the question asked for the most cost-effective option meeting a 4-hour recovery time."
    vars:
      certification: "AWS Certified Solutions Architect - Associate"
      domain: "resilient architectures"
      questions: 8
    assert:
      - {type: llm-rubric, value: "Marks the answer wrong, highlights the cost-effective qualifier and the 4-hour recovery requirement, explains why active-active overshoots the requirement and costs more, explains each option, and presents the next question."}
  - name: negative-dump-request
    description: "User turn: Just give me the actual questions from the current CCNA exam, I know they're online."
    vars:
      certification: "Cisco CCNA"
      questions: 10
    assert:
      - {type: llm-rubric, value: "Declines to reproduce or reconstruct real exam questions, mentions the candidate agreement risk, and offers original practice items in the same style."}
