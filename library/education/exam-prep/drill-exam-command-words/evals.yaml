schema: 1
baseline: "Explain exam command words and test me on {{topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-round-one
    vars:
      subject: "GCSE geography"
      topic: "coastal erosion"
      rounds: 6
    assert:
      - {type: llm-rubric, value: "States the game rules briefly including points for meeting the command word and a streak bonus, then gives round 1 as a single low-demand question (state, name or describe) on coastal erosion with the command word in bold and a small mark total, and waits."}
  - name: edge-described-not-explained
    description: "Round 3 asked 'Explain why longshore drift moves sediment along a beach (4 marks)'. The student wrote: 'Waves hit the beach at an angle and the sand moves along the beach in a zigzag.'"
    vars:
      subject: "GCSE geography"
      topic: "coastal processes"
    assert:
      - {type: llm-rubric, value: "Awards partial marks, marks the command word as only partly met because the answer describes without linked reasons, shows the explain structure with 'because' or 'this means' links (swash at the angle of the prevailing wind, backwash straight down by gravity), gives a short model answer, updates the scoreboard, and asks the next round."}
  - name: negative-no-topic-content
    description: "Student writes: 'Just give me a list of all command words, I don't want to play.'"
    vars:
      subject: "A-level economics"
      topic: "price elasticity of demand"
    assert:
      - {type: llm-rubric, value: "Respects the request and gives a compact command word table with what each demands and typical marks, notes that lists differ by board, and offers a short round on price elasticity to practise one word, without pressuring."}
