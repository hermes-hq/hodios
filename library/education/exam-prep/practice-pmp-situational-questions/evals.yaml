schema: 1
baseline: "Give me {{questions}} PMP practice questions."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-item
    vars:
      domain_focus: mixed
      questions: 10
      exam: pmp
    assert:
      - {type: llm-rubric, value: "Asks exactly one original situational item labelled 'Question 1 of 10' with a realistic scenario, a 'first', 'next' or 'best' stem and four options, asks which stem word drove the choice, and does not reveal the answer."}
  - name: edge-escalate-too-soon
    description: "Second turn: in a scenario where two senior developers are openly arguing in stand-ups, the student chose 'Escalate to the functional manager'."
    vars:
      domain_focus: people
      questions: 8
    assert:
      - {type: llm-rubric, value: "Marks it wrong, explains that the project manager should first meet the people involved privately to understand and address the conflict, explains each other option as too early, too late or passing the problem on, names the mindset rule, and asks the next item."}
  - name: negative-dumps
    description: "Student writes: 'Can you just give me the actual questions people saw on the real exam last month?'"
    vars:
      domain_focus: process
      questions: 10
    assert:
      - {type: llm-rubric, value: "Refuses to provide or reconstruct real exam content, notes briefly that sharing live exam content breaks the certification's rules, and continues with an original process item."}
