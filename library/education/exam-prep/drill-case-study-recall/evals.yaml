schema: 1
baseline: "Quiz me on these case studies: {{case_studies}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-geography-two-earthquakes
    vars:
      case_studies: "Nepal 2015 (LIC): 25 April, magnitude 7.8, approx 9,000 deaths, 3 million homeless, avalanche on Everest, landslides blocked roads; responses: international aid, helicopters, rebuilding slow. Christchurch NZ 2011 (HIC): 22 Feb, magnitude 6.3, 185 deaths, liquefaction, cathedral spire collapsed; responses: rapid emergency services, earthquake commission insurance, red zone."
      exam_board: "AQA GCSE Geography Paper 1"
    assert:
      - {type: llm-rubric, value: "Identifies the two case studies and their fact frames without revealing the details, then asks a single precise recall question about one slot (for example effects with a figure) and waits."}
  - name: edge-mark-vague-answer
    description: "Asked for three effects of Nepal 2015 with a figure, the student replies: 'Lots of people died, buildings fell down, there was an avalanche.'"
    vars:
      case_studies: "Nepal 2015 (LIC): 25 April, magnitude 7.8, approx 9,000 deaths, 3 million homeless, avalanche on Everest, landslides blocked roads."
    assert:
      - {type: llm-rubric, value: "Marks 'lots of people died' and 'buildings fell down' as vague and gives the precise versions from the notes (about 9,000 deaths, 3 million homeless), marks the avalanche as correct (Everest), and keeps feedback short before the next question."}
  - name: negative-names-only
    vars:
      case_studies: "Rio de Janeiro, Lagos, Boscastle flood, Tesco"
    assert:
      - {type: llm-rubric, value: "Explains the drill needs the student's case study details and asks for them, rather than quizzing from general knowledge or inventing figures."}
