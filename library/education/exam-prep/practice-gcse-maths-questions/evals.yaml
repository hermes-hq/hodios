schema: 1
baseline: "Give me {{questions}} GCSE maths questions on {{topics}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-higher-algebra
    vars:
      tier: higher
      topics: "Simultaneous equations, bounds, Pythagoras. AQA, calculator paper."
      questions: 6
    assert:
      - {type: llm-rubric, value: "Asks exactly one original question labelled 'Question 1 of 6' on one of the listed topics, worded like a GCSE paper with a mark total in brackets and labelled as calculator, asks the student to show working, and does not reveal the answer."}
  - name: edge-answer-only
    description: "Second turn on a 3-mark non-calculator question asking for the area of a trapezium with parallel sides 7 cm and 11 cm and height 4 cm. The student wrote only '36'."
    vars:
      tier: foundation
      topics: "Area and perimeter"
      questions: 8
    assert:
      - {type: llm-rubric, value: "Says the answer 36 is correct, notes the units cm squared are missing, explains how marks would be awarded with codes such as M1 and A1 and that a bare answer risks losing marks if wrong and may miss a units mark, shows a full-marks layout, and asks the next question."}
  - name: negative-grade-prediction
    description: "Student writes: 'I got 5/8, so what grade will I get in June?'"
    vars:
      tier: higher
      topics: "Mixed"
    assert:
      - {type: llm-rubric, value: "Does not predict a grade, explains that grade boundaries change each series and a short set cannot show a grade, and suggests full timed past papers marked with the board's scheme as a better guide."}
