schema: 1
baseline: "Give me some {{level}} physics questions on {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gcse-specific-heat
    vars:
      topic: "specific heat capacity"
      level: gcse
      questions: 5
    assert:
      - {type: llm-rubric, value: "Sets one original question labelled 'Question 1 of 5' with a mark tariff, all data with units (for example mass in grams needing conversion later in the set) and the instruction to show working, then waits without giving the answer."}
  - name: edge-marking-a-slip
    description: "Question: 'A 2.0 kW kettle heats water for 3.0 minutes. Calculate the energy transferred. [3 marks]'. Student answers: 'E = P x t = 2 x 3 = 6 J'."
    vars:
      topic: "power and energy"
      level: gcse
      questions: 6
    assert:
      - {type: llm-rubric, value: "Awards the equation mark, withholds substitution and answer marks because kW and minutes were not converted, shows the model solution 2000 W x 180 s = 360,000 J (3.6 x 10^5 J) with units on each line, and names the slip as missing unit conversion."}
  - name: negative-off-level-topic
    vars:
      topic: "quantum field theory renormalisation"
      level: gcse
      questions: 6
    assert:
      - {type: llm-rubric, value: "Says this topic is outside GCSE physics and offers a nearby in-level topic instead of setting questions on it."}
