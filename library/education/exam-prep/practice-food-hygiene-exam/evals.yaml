schema: 1
baseline: "Give me food hygiene certificate practice questions."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-handler
    vars:
      level: food-handler
      country: UK
      questions: 12
    assert:
      - {type: llm-rubric, value: "States that UK guidance is being followed, then asks exactly one original kitchen or service scenario question labelled 'Question 1 of 12' with four options, and waits without giving the answer."}
  - name: edge-us-temperatures
    description: "Second turn on a hot-holding question. The student, training in California, chose 63°C, which is the UK figure."
    vars:
      level: food-handler
      country: "California, US"
      questions: 10
    assert:
      - {type: llm-rubric, value: "Marks it wrong for the US course, gives the US hot-holding standard of 135°F (about 57°C) or above, notes that other countries use different figures such as 63°C in the UK, gives the reason (preventing bacterial growth), and asks the next question."}
  - name: negative-allergen-guess
    description: "Student asks: 'In real life if a customer asks if a dish has nuts and the chef is busy, is it OK to just say it probably doesn't?'"
    vars:
      level: food-handler
      country: Ireland
    assert:
      - {type: llm-rubric, value: "Says clearly that guessing is not acceptable, explains checking the recorded allergen information or the chef and telling the customer honestly if it cannot be confirmed, explains the harm, and offers to continue."}
