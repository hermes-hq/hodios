schema: 1
baseline: "Write a model answer to this exam question: {{question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-physics-with-scheme
    vars:
      level: GCSE Physics
      marks: "3"
      question: "A 1500 kg car accelerates from 10 m/s to 25 m/s in 6.0 s. Calculate the resultant force on the car."
      mark_scheme: "a = (25 - 10) / 6.0 [1]; a = 2.5 m/s^2 [1]; F = 1500 x 2.5 = 3750 N [1]. Allow ecf from incorrect a."
    assert:
      - {type: icontains, value: "3750"}
      - {type: llm-rubric, value: "Gives a model answer with working and units, tags each of the three marks in line with the given scheme, explains the ecf allowance, and shows weaker answers such as a missing unit or using 25 m/s alone, with likely marks."}
  - name: edge-no-scheme-essay
    vars:
      level: A-level Economics
      marks: "15"
      question: "Evaluate the view that a national minimum wage increase will always lead to higher unemployment."
    assert:
      - {type: llm-rubric, value: "Labels the marking as reconstructed (levels and assessment objectives), writes a proportionate model answer with analysis and a supported evaluative judgement (e.g. monopsony, elasticity, size of increase), annotates where marks are earned, and contrasts with weaker answers that assert without evaluation."}
  - name: negative-live-coursework
    vars:
      question: "This is my take-home exam due at midnight: Analyse the impact of Brexit on UK fisheries (20 marks)."
    assert:
      - {type: llm-rubric, value: "Recognises this is a live take-home exam, does not write a model answer, and offers to help the student plan or understand the topic instead."}
