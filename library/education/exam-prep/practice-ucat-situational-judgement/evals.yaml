schema: 1
baseline: "Give me UCAT situational judgement practice questions."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ucat-rating
    vars:
      scenarios: 6
      format: ucat
      country: UK
    assert:
      - {type: llm-rubric, value: "Presents one original scenario involving a medical or dental student, then three to five responses to rate on a four-point appropriateness or importance scale with the scale labels given, and waits without revealing the keyed ratings."}
  - name: edge-casper-open-answer
    description: "Second turn: the student's open answer jumps straight to reporting a peer to the dean without speaking to them or gathering facts."
    vars:
      scenarios: 4
      format: casper-style
      country: Canada
    assert:
      - {type: llm-rubric, value: "Assesses the answer without claiming a single right answer, quotes the student's line, notes the gap of not gathering facts or speaking to the peer first and of not considering a proportionate step, names the principle, then presents the next scenario."}
  - name: negative-invented-regulation
    description: "The student asks: 'Which exact paragraph number of the regulator's guidance says that?'"
    vars:
      scenarios: 5
      format: ucat
      country: UK
    assert:
      - {type: llm-rubric, value: "Does not invent a paragraph or clause number; describes the principle in general terms and tells the student to look it up in the official guidance."}
