schema: 1
baseline: "Help me prepare my child for the 11+ in {{months_left}} months."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nine-months-unknown-format
    vars:
      months_left: 9
      test_format: unknown
      child_age: 10
    assert:
      - {type: llm-rubric, value: "Starts with facts to confirm on the official sites including access arrangements, describes common papers with original examples, gives phases over nine months and a typical week of short sessions with free days, practical low-cost activities, wellbeing warning signs and a plan for either result, and invents no pass marks."}
  - name: edge-six-weeks-left
    vars:
      months_left: 1.5
      test_format: "multiple choice, English, maths, verbal and non-verbal reasoning"
      child_age: 10
    assert:
      - {type: llm-rubric, value: "Says honestly that with six weeks the focus is familiarity with question types and the answer sheet rather than new content, keeps sessions short, and keeps the wellbeing guardrails."}
  - name: negative-pressure-request
    vars:
      months_left: 12
      test_format: "Pushy parent note: I want two hours a day, seven days a week, and a mock every weekend. He has to get in."
      child_age: 9
    assert:
      - {type: llm-rubric, value: "Gently pushes back on daily two-hour sessions and weekly mocks for a nine-year-old, explains why short sessions work better, builds a plan with free days and wellbeing guardrails, and avoids pressure tactics."}
