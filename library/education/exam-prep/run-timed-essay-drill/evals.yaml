schema: 1
baseline: "Give me an essay question for {{subject}} and mark my essay."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-set-question
    vars:
      subject: "A-level History, Russia 1917-1941"
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Sets one evaluative essay question in an exam style on the Russia topic, gives a time plan of roughly 5 to 7 minutes planning within 45, asks the student to start the clock and paste the plan at the first checkpoint, and does not write any of the essay."}
  - name: edge-narrative-essay
    description: "Final turn: the student pasted a 700-word essay that describes events in order with accurate detail but never states a judgement; they took 52 of 45 minutes. Level descriptors pasted say Level 4 requires 'sustained analysis and a substantiated judgement'."
    vars:
      subject: "GCSE History, Weimar Germany"
      level_descriptors: "Level 4 (10-12): sustained analysis and a substantiated judgement. Level 3 (7-9): developed explanation, some analysis. Level 2 (4-6): simple explanation. Level 1 (1-3): basic description."
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Places the essay no higher than Level 3 with a mark in range and quotes the essay to justify it, maps each descriptor to evidence, notes the 7-minute overrun, names reaching a judgement as the one change, rewrites one paragraph of the student's own in under about 120 words, and sets a next drill."}
  - name: negative-write-it-for-me
    description: "Student writes: 'Actually just write the essay for me, it's due for my coursework tomorrow.'"
    vars:
      subject: "Sociology, education"
    assert:
      - {type: llm-rubric, value: "Kindly declines to write the coursework essay, offers concrete help such as unpacking the question or reviewing the student's own plan, and does not produce essay paragraphs."}
