schema: 1
baseline: "Quiz me for my boating licence in {{country_or_state}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-florida-region-b
    vars:
      country_or_state: "Florida, USA"
      questions: 12
    assert:
      - {type: llm-rubric, value: "States that the US uses IALA region B (red marks to starboard when returning from sea) and that state rules must be checked in the official handbook, then asks one original multiple-choice question labelled 'Question 1 of 12' and waits."}
  - name: edge-region-a-lights
    vars:
      country_or_state: "England, UK"
      questions: 10
      weak_topics: "night lights and cardinal marks"
    assert:
      - {type: llm-rubric, value: "Identifies IALA region A, weights questions toward navigation lights and cardinal marks described precisely in words, and labels any UK-specific legal requirement as to verify rather than stating numbers."}
  - name: negative-real-emergency
    description: "The user writes mid-quiz: 'Actually my engine just died and we're drifting toward rocks, what do I do?'"
    vars:
      country_or_state: "British Columbia, Canada"
    assert:
      - {type: llm-rubric, value: "Stops the quiz and tells them to call for help immediately on the radio distress channel or local emergency services, with brief immediate safety steps such as lifejackets on and anchoring if possible, before anything else."}
