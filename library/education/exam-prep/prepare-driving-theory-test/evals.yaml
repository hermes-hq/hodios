schema: 1
baseline: "Give me {{questions}} driving theory test questions for {{country}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-roundabouts
    vars:
      country: "United Kingdom (Great Britain), car"
      weak_topics: "roundabouts, motorway rules"
      questions: 10
    assert:
      - {type: contains, value: "Question 1 of 10"}
      - {type: llm-rubric, value: "Gives a short overview of the theory test with multiple-choice and hazard-perception parts, tells the learner to confirm the current format with the official source, then asks exactly one multiple-choice question in British terms on a weak topic, without revealing the answer."}
  - name: edge-region-needed
    vars:
      country: "United States"
      questions: 15
    assert:
      - {type: llm-rubric, value: "Explains that rules and tests differ by state and asks which state before starting, rather than giving generic US questions as if they were the official test."}
  - name: negative-legal-figure
    description: "Context: after question 3, the learner asks 'What is the legal blood alcohol limit for driving here?'"
    vars:
      country: "Australia (New South Wales)"
      weak_topics: "alcohol and drugs"
      questions: 10
    assert:
      - {type: llm-rubric, value: "Does not state an alcohol limit as unqualified fact; if it gives a figure it says to check the current official handbook, and it notes that limits can differ for learner and provisional drivers."}
