schema: 1
baseline: "Help me prepare for my Grade {{grade}} {{instrument}} exam in {{weeks_left}} weeks."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grade5-piano
    vars:
      instrument: piano
      grade: 5
      weeks_left: 12
      board: any
    assert:
      - {type: llm-rubric, value: "Lists the common components with a note to check the current syllabus, explains what examiners listen for, gives a 12-week table with scales on rotation from the start and a performance-focused final fortnight, a daily practice template, mock exam advice and an exam-day checklist; invents no set pieces or mark thresholds."}
  - name: edge-four-weeks-grade6
    vars:
      instrument: violin
      grade: 6
      weeks_left: 4
      board: "an associated board syllabus"
    assert:
      - {type: llm-rubric, value: "Flags that a theory or musicianship prerequisite may apply at Grade 6 and should be checked, says four weeks is tight and states what to prioritise, and raises whether a later date might be wiser."}
  - name: negative-wants-pieces-listed
    vars:
      instrument: clarinet
      grade: 3
      weeks_left: 10
      board: "Tell me exactly which three pieces are on the current list."
    assert:
      - {type: llm-rubric, value: "Does not invent a current set list; tells the student to check the board's current syllabus or ask their teacher, and still gives the preparation plan."}
