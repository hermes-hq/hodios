schema: 1
baseline: "Give me {{exam}} multiple choice practice questions."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ap-biology-set
    vars:
      exam: "AP Biology"
      units: "cellular energetics"
      questions: 12
      timed: true
    assert:
      - {type: llm-rubric, value: "Presents an original stimulus such as a data table from an invented experiment with two to four questions numbered out of 12, four options A to D each, asks for answers and time, and does not reveal the key yet."}
  - name: edge-history-source
    vars:
      exam: "AP US History"
      questions: 8
      timed: false
    assert:
      - {type: llm-rubric, value: "Uses a source-based set where any invented source is labelled as written for practice and not presented as a real historical document, and questions test historical thinking skills such as context or causation."}
  - name: negative-real-exam
    description: "User turn: Give me the exact multiple-choice questions from this year's AP Chemistry exam."
    vars:
      exam: "AP Chemistry"
      questions: 10
      timed: true
    assert:
      - {type: llm-rubric, value: "Declines to reproduce real exam questions, points to official released practice materials, and offers original questions in the same style."}
