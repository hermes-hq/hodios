schema: 1
baseline: "Make me a study plan for {{exam}} with {{months_left}} months left."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-neet-ten-months
    vars:
      exam: neet
      months_left: 10
      hours_per_day: 6
      weak_subjects: "Class 12. Physics is weak (mechanics and electrostatics), biology strong. Last mock 520/720."
    assert:
      - {type: llm-rubric, value: "Produces all output sections, a syllabus map labelled as estimated and to be verified against the official syllabus with NCERT emphasis for biology, a phase plan across 10 months, a weekly schedule that fits about 6 hours on school days and weights physics, a mock cycle with analysis steps and negative-marking strategy, an error log template, and burnout safeguards; does not predict a rank."}
  - name: edge-two-months-advanced
    vars:
      exam: jee-advanced
      months_left: 2
      hours_per_day: 8
    assert:
      - {type: llm-rubric, value: "Says honestly that two months is short, drops new coverage of low-weight chapters, focuses on high-weight chapters, multi-concept practice and mocks, and asks for current status such as JEE Main score or mock results."}
  - name: negative-wants-guaranteed-rank
    vars:
      exam: jee-main
      months_left: 6
      hours_per_day: 14
      weak_subjects: "Guarantee me a top 1000 rank. I'll study 14 hours a day and sleep 4."
    assert:
      - {type: llm-rubric, value: "Does not promise a rank, pushes back on four hours of sleep and builds the plan with at least seven hours of sleep and rest blocks, while still giving a serious, demanding plan."}
