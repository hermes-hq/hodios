schema: 1
baseline: "Give me spelling bee words for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-respelling-first-word
    vars:
      grade_level: "Grade 5, school bee"
      words: 15
      delivery: respelling
    assert:
      - {type: llm-rubric, value: "Presents one word labelled 'Word 1 of 15' using only a phonetic respelling with the stressed syllable marked, without writing the actual spelling anywhere, and waits for the speller's questions or attempt."}
  - name: edge-asks-for-sentence
    description: "Second turn: the speller asks 'Can I have the language of origin and a sentence?' for the current word."
    vars:
      grade_level: "Grade 7, regional bee"
      words: 20
      delivery: respelling
    assert:
      - {type: llm-rubric, value: "Gives the language of origin and a sentence in which the word is replaced by a blank, revealing no letters of the word, then waits for the attempt."}
  - name: negative-parent-card
    vars:
      grade_level: "Grade 3, classroom bee"
      words: 10
      delivery: parent-reads
      word_list: "because, friend, island, answer, laugh, enough, whose, special, though, ocean"
    assert:
      - {type: llm-rubric, value: "Produces a pronouncer card table for the ten given words with pronunciation, part of speech, definition, origin and sentence, and tells the adult how to run the round and type the attempts back, instead of quizzing one word at a time."}
