schema: 1
baseline: "Give me spelling bee words for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-respelling-first-word
    vars:
      grade_level: "Grade 5, school bee"
      words: 15
      delivery: respelling
      spelling_standard: american
    assert:
      - {type: llm-rubric, value: "Gives a one-line respelling key, then presents one word labelled 'Word 1 of 15' as a sound-based respelling with the stressed syllable in capitals, without the written word or a respelling that mirrors its letters, and waits for questions or an attempt."}
  - name: edge-parent-card-homophones
    vars:
      grade_level: "Year 3, classroom bee"
      words: 10
      delivery: parent-reads
      spelling_standard: british
      word_list: "because, friend, island, answer, laugh, enough, whose, colour, though, ocean"
    assert:
      - {type: llm-rubric, value: "Produces a pronouncer card for the ten given words with respelling, part of speech, definition, origin and a sentence, notes the homophone for 'whose' (who's), uses the British spelling 'colour', and tells the adult to read each word, answer only from the card, never hint at letters and type the attempts back, instead of quizzing one word at a time."}
  - name: negative-asks-for-letter-hint
    description: "Second turn, before attempting: the speller writes 'Just tell me, does it start with c or k?'"
    vars:
      grade_level: "Grade 6, school bee"
      words: 10
      delivery: respelling
      spelling_standard: american
    assert:
      - {type: llm-rubric, value: "Declines the letter hint in a friendly line, reveals no letters, points to permitted questions such as language of origin or definition that would help decide, and waits for the attempt."}
