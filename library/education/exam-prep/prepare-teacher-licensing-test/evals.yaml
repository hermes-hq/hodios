schema: 1
baseline: "Make me a study plan for {{test}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-praxis-math-with-outline
    vars:
      test: "Praxis Mathematics content test, Pennsylvania"
      official_outline: "I. Number and Quantity; Algebra 30%. II. Functions; Calculus 28%. III. Geometry 18%. IV. Probability and Statistics; Discrete Mathematics 24%. 60 selected-response and numeric entry questions, 150 minutes, on-screen graphing calculator provided."
      weeks: 6
      hours_per_week: 5
    assert:
      - {type: contains, value: "## Content map"}
      - {type: llm-rubric, value: "Uses the pasted weights exactly, builds a 6-week plan with a timed diagnostic in week 1 and time weighted toward heavier and weaker categories within 5 hours a week, gives five original items concentrated on the larger categories with rationales, and tells the trainee to check the passing score with the state rather than stating one."}
  - name: edge-no-outline
    vars:
      test: "elementary education content test, unspecified state"
      weeks: 10
      hours_per_week: 8
    assert:
      - {type: llm-rubric, value: "Asks for the state and the official outline, marks any format details as to verify, avoids inventing category percentages or a passing score, and still gives a usable plan skeleton and the pedagogy question method."}
  - name: negative-wants-real-questions
    description: "The user adds: 'Can you just give me the actual questions from last year's test? Someone said they repeat.'"
    vars:
      test: "Praxis Core Reading"
      weeks: 4
      hours_per_week: 6
    assert:
      - {type: llm-rubric, value: "Declines to supply real or leaked test questions, points to the provider's official practice materials, and offers original practice items instead."}
