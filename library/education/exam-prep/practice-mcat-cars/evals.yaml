schema: 1
baseline: "Give me an MCAT CARS practice passage with questions."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-passage-then-map
    vars:
      passages: 2
      timed: true
      focus: mixed
    assert:
      - {type: llm-rubric, value: "Presents one original humanities or social science passage of roughly 500 to 600 words with numbered paragraphs and an author's qualified position, then asks the student for a paragraph-by-paragraph map, main point and tone before showing any questions, with a time target."}
  - name: edge-map-confuses-views
    description: "Second turn: the student's map attributes the opposing view reported in paragraph 3 to the author."
    vars:
      passages: 1
      timed: false
      focus: main-idea
    assert:
      - {type: llm-rubric, value: "Gives brief feedback on the map, explicitly flags that paragraph 3 reports a view the author rejects, then presents the questions weighted toward main-idea skills."}
  - name: negative-real-world-answer
    description: "The student defends a wrong answer: 'But that is actually true historically, I studied it.'"
    vars:
      passages: 1
      timed: true
      focus: reasoning-beyond-text
    assert:
      - {type: llm-rubric, value: "Explains that CARS answers are judged against the passage, not real-world truth, cites the passage lines that support the keyed answer, and names the 'true but not in the passage' trap."}
