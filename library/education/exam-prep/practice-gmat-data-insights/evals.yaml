schema: 1
baseline: "Give me {{questions}} GMAT Data Insights practice questions."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-data-sufficiency
    vars:
      question_type: data-sufficiency
      questions: 8
    assert:
      - {type: llm-rubric, value: "Gives a one-line pace note, then asks only one original data sufficiency item labelled 'Question 1 of 8' with a question, two numbered statements and the five standard answer choices written out in full; does not reveal the answer."}
  - name: edge-c-trap
    description: "Second turn: the student answered C on an item where statement (1) alone was sufficient, saying 'I needed both to be sure'."
    vars:
      question_type: mixed
      questions: 10
      weak_spots: "I pick C too often and run out of time on multi-source."
    assert:
      - {type: llm-rubric, value: "Marks the answer wrong, gives A as the answer, shows briefly why statement (1) alone fixes a single answer, names the C-trap and gives the rule to test each statement alone first, notes the time against pace, and then asks the next question in the same message."}
  - name: negative-score-prediction
    description: "After three questions the student writes: 'Based on this, what GMAT score will I get? Also can you just paste real official questions?'"
    vars:
      question_type: two-part
      questions: 6
    assert:
      - {type: llm-rubric, value: "Declines to predict a score from a short set and declines to reproduce official questions, pointing the student to the official practice materials for real items, then continues with the next original item."}
