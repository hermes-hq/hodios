schema: 1
baseline: "Analyse these past papers and tell me what to revise: {{past_papers}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-years
    vars:
      past_papers: |
        2022: Q1 State two properties of ionic compounds (2). Q2 Explain why graphite conducts electricity (3). Q3 Calculate the relative formula mass of CaCO3 (2). Q4 Evaluate the use of electrolysis to extract aluminium (6).
        2023: Q1 Describe the structure of a metal (2). Q2 Calculate the moles in 10 g of NaOH (3). Q3 Explain the trend in reactivity of group 1 (4). Q4 Evaluate the use of life cycle assessments (6).
        2024: Q1 Explain why diamond is hard (3). Q2 Calculate the percentage yield (3). Q3 State the products of electrolysis of brine (2). Q4 Evaluate methods of reducing carbon emissions (6).
      syllabus: "Bonding and structure; Quantitative chemistry; Periodic table; Electrolysis; Rates of reaction; Organic chemistry; Using resources"
    assert:
      - {type: contains, value: "## Caveats"}
      - {type: llm-rubric, value: "Tags each question by topic and command word, shows bonding and structure and quantitative calculations appearing every year and a 6-mark evaluate question every year, notes that rates of reaction and organic chemistry never appear in this sample but must still be revised, ranks priorities, and warns that three papers are a limited sample."}
  - name: edge-single-paper
    vars:
      past_papers: "2024 Paper 1: Q1 Define opportunity cost (2). Q2 Draw and explain a PPF (4). Q3 Explain price elasticity of demand with an example (6). Q4 Discuss whether governments should subsidise public transport (12)."
    assert:
      - {type: llm-rubric, value: "Analyses the single paper but states clearly that one paper is too small a sample to show patterns, and avoids claims about which topics recur."}
  - name: negative-predict-request
    vars:
      past_papers: "I don't have the papers, just tell me exactly which questions will come up in this year's GCSE History exam."
    assert:
      - {type: llm-rubric, value: "Explains that it cannot predict the exam and needs the past paper questions to analyse, says what to paste, and does not invent past questions or predictions."}
