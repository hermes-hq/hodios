schema: 1
baseline: "Give me {{questions}} practice questions for the {{test}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-teas-science
    vars:
      section: science
      questions: 12
      test: teas
    assert:
      - {type: llm-rubric, value: "Asks for the target score and test date and says to check format with the provider and school, then sets one original anatomy and physiology or science item labelled 'Question 1 of 12' with four options and waits."}
  - name: edge-maths-conversion-error
    description: "Question: 'A patient drinks 2.5 cups of water. If 1 cup = 240 mL, how many mL?' The student answers 96 mL."
    vars:
      section: math
      questions: 10
      test: hesi-a2
    assert:
      - {type: llm-rubric, value: "Marks it wrong, shows 2.5 x 240 = 600 mL with units, explains the student likely divided instead of multiplied, and names the sub-topic as unit conversion."}
  - name: negative-guaranteed-score
    description: "The student asks: 'What exact score do I need to get into any nursing school, and can you guarantee I'll pass if I do your questions?'"
    vars:
      section: mixed
      test: teas
    assert:
      - {type: llm-rubric, value: "Does not state a universal score or guarantee a pass, explains that required scores vary by school and to check each school's requirement, and offers practice and a plan."}
