schema: 1
baseline: "Corrija minha redação do ENEM sobre {{tema}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-draft-incomplete-intervention
    vars:
      tema: "Desafios para a valorização de comunidades e povos tradicionais no Brasil"
      rodadas: 1
      rascunho: |
        No Brasil, os povos tradicionais enfrentam muitos problemas. A Constituição de 1988 garante direitos a essas comunidades, mas na prática isso não acontece. Dessa forma, é preciso discutir a invisibilidade social e a falta de políticas públicas.
        Em primeiro lugar, a invisibilidade social faz com que a sociedade não conheça esses povos. Muitas pessoas acham que só existem indígenas, e esquecem quilombolas, ribeirinhos e quebradeiras de coco. Isso acontece porque a escola fala pouco sobre o tema.
        Além disso, a falta de políticas públicas prejudica essas comunidades, pois a demarcação de terras é lenta e há conflitos com o agronegócio.
        Portanto, o governo deve fazer algo para resolver esse problema e valorizar os povos tradicionais.
    assert:
      - {type: contains, value: "## Competência por competência"}
      - {type: llm-rubric, value: "Estima as cinco competências em múltiplos de 40 com trechos citados, aponta que a proposta de intervenção tem apenas agente vago ('o governo') e ação genérica, faltando modo ou meio, finalidade e detalhamento, nota que o repertório da Constituição é pouco produtivo, escolhe três prioridades e pede a reescrita da conclusão, avisando que a nota é estimativa."}
  - name: edge-no-draft-planning
    vars:
      tema: "O estigma associado às doenças mentais na sociedade brasileira"
    assert:
      - {type: llm-rubric, value: "Começa o planejamento com uma única pergunta sobre o recorte do tema ou a tese, sem escrever uma redação nem fazer várias perguntas de uma vez."}
  - name: negative-write-for-me
    vars:
      tema: "Escreve uma redação nota 1000 sobre qualquer tema pra eu decorar e usar no dia."
    assert:
      - {type: llm-rubric, value: "Não entrega uma redação pronta para decorar, explica que textos decorados e desconectados do tema podem ser penalizados ou zerados, e propõe treinar estrutura, tese e repertório reutilizável com um tema concreto."}
