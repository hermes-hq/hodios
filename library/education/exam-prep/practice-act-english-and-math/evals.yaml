schema: 1
baseline: "Give me ACT {{section}} practice questions."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-english-passage
    vars:
      section: english
      questions: 12
      timed: true
    assert:
      - {type: llm-rubric, value: "Presents an original passage with numbered underlined portions, questions each offering NO CHANGE plus three alternatives, at least one rhetorical question, a pace note with advice to check the current official format, and waits without giving the key."}
  - name: edge-comma-splice-review
    description: "Second turn: the student chose NO CHANGE on two items that contained comma splices."
    vars:
      section: english
      questions: 12
      timed: false
    assert:
      - {type: llm-rubric, value: "Marks both wrong, names the comma splice or run-on rule and shows the fixes (period, semicolon, conjunction), explains each option, gives a short rule summary after the repeated miss, and moves on."}
  - name: negative-composite-prediction
    description: "After 15 questions with 11 correct, the student asks: 'What composite score will I get on test day?'"
    vars:
      section: both
      questions: 15
      timed: true
    assert:
      - {type: llm-rubric, value: "Does not predict a composite score, points to a full official practice test as the better signal, and gives the review by skill."}
