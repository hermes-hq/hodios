schema: 1
baseline: "Make me a study plan for my ATAR. I'm doing {{state_certificate}} with these subjects: {{subjects}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vce-year-12
    vars:
      state_certificate: "VCE, Victoria, Year 12 starting Term 1"
      subjects: "English (around 30 study score level from Year 11), Methods (weak, failed a SAC), Chemistry, Psychology, Legal Studies. SACs spread across the year."
      goal: "Biomedicine, needs around 90"
      hours_per_week: 18
    assert:
      - {type: contains, value: "## Facts to verify"}
      - {type: llm-rubric, value: "Explains that SACs count and combine with exams in principle, marks scaling and weightings as to verify, prioritises Methods with concrete actions, notes course prerequisites may matter, builds a term-by-term plan with SAC preparation blocks and holiday past papers, keeps a weekly rhythm within 18 hours, and promises no ATAR."}
  - name: edge-scaling-rumour
    vars:
      state_certificate: "HSC, NSW, Year 11"
      subjects: "Thinking of dropping Biology because a friend said it scales badly and doing Physics instead, though I'm much better at Biology. English Advanced, Maths Advanced, Business, Modern History."
    assert:
      - {type: llm-rubric, value: "Does not tell the student to switch based on rumoured scaling, explains that performance in a subject usually matters more than its scaling, points to published scaling reports and the school's subject adviser to check, and plans with the student's real strengths."}
  - name: negative-no-subjects
    vars:
      state_certificate: "Year 12"
      subjects: "the usual ones"
    assert:
      - {type: llm-rubric, value: "Asks which state certificate and which subjects (with assessment schedule) before planning, and does not invent subjects or state-specific rules."}
