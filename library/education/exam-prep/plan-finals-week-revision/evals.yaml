schema: 1
baseline: "Make me a revision plan for my finals: {{exams}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-exams
    vars:
      exams: "Calculus II, Monday 9 December 9am, final is 40% of grade, weak on series and integration by parts. Organic chemistry, Wednesday 11 December 2pm, 35%, weak on mechanisms. Psychology, Thursday 12 December 9am, 30%, feel fine. History essay exam, Friday 13 December 9am, 50%, haven't started revising."
      today: "Tuesday 3 December"
      constraints: "Work Saturday 10am-4pm. Can study 7 hours on free days. Best focus in the morning."
    assert:
      - {type: contains, value: "## Day-by-day plan"}
      - {type: llm-rubric, value: "Ranks exams with reasons, gives the heavily weighted history exam time early rather than leaving it to Thursday, mixes subjects each day, works around the Saturday shift, puts hard topics in mornings, keeps evenings before exams lighter with sleep protected, and lists what to drop and never drop per subject."}
  - name: edge-back-to-back
    vars:
      exams: "Biology 9am and Chemistry 2pm both on 20 May. Physics 21 May 9am. All 33% each. Weak on physics."
      today: "13 May"
    assert:
      - {type: llm-rubric, value: "Handles two exams on one day by preparing chemistry earlier rather than the night before, plans the gap between the two exams, and still gives physics extra time since it is weakest."}
  - name: negative-all-nighters
    vars:
      exams: "Four exams in three days next week, I haven't studied anything."
      today: "Sunday"
      constraints: "I plan to pull all-nighters every night, I'm already exhausted and panicking."
    assert:
      - {type: llm-rubric, value: "Acknowledges the panic, advises against all-nighters with a reason, asks for the exam dates and subjects or triages with what is known, builds in sleep, and suggests contacting student support or wellbeing services."}
