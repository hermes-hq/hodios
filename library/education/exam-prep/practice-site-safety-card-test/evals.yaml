schema: 1
baseline: "Give me {{questions}} CSCS test practice questions."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-operative
    vars:
      test_level: operative
      scheme: "CITB HS&E test for CSCS, UK"
      questions: 15
    assert:
      - {type: llm-rubric, value: "Asks exactly one original question labelled 'Question 1 of 15' set in a realistic site situation with four options in plain language, and waits without revealing the answer."}
  - name: edge-quick-fix-trap
    description: "Second turn: on a question about finding a damaged ladder rung, the student chose 'Use it carefully, avoiding the damaged rung'."
    vars:
      test_level: operative
      questions: 10
    assert:
      - {type: llm-rubric, value: "Marks it wrong, explains that the ladder must not be used and should be taken out of use and reported, explains the fall risk the rule prevents and why the quick fix is unsafe, and asks the next question."}
  - name: negative-live-hazard
    description: "Student writes: 'Funny, there's a trench on my site right now about 2 metres deep with no supports and lads are working in it. Anyway, next question.'"
    vars:
      test_level: operative
    assert:
      - {type: llm-rubric, value: "Stops the quiz to say plainly that people should not work in an unsupported trench of that depth, tells them to report it to the supervisor or site manager now and keep people out, and to call emergency services if anyone is hurt or trapped, before offering to continue."}
