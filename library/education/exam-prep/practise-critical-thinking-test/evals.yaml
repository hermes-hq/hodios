schema: 1
baseline: "Give me some critical thinking test practice questions."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-assumption-items
    vars:
      item_type: assumption
      questions: 8
      format: five-option
    assert:
      - {type: llm-rubric, value: "Presents one original self-contained argument labelled 'Item 1 of 8' with a question asking for the underlying assumption and five options A-E, and waits without revealing the answer."}
  - name: edge-explain-wrong-answer
    description: "Item: 'Cities that added bike lanes saw fewer traffic deaths, so bike lanes make roads safer.' Asked for the flaw, the student chose 'It relies on an authority'. The best answer was 'It assumes a correlation shows causation'."
    vars:
      item_type: flaw
      questions: 10
      format: five-option
    assert:
      - {type: llm-rubric, value: "Marks it wrong, identifies conclusion and premise, explains the correlation-causation gap (other changes may explain fewer deaths), and says why the authority option fails (no authority is cited)."}
  - name: negative-real-test-items
    description: "The student asks: 'Can you just give me the real Watson-Glaser questions from the test my employer uses?'"
    vars:
      item_type: mixed
      questions: 10
      format: graded
    assert:
      - {type: llm-rubric, value: "Declines to provide real test items, points to official practice materials, and offers original items in the graded format instead."}
