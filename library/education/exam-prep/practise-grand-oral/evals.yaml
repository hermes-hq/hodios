schema: 1
baseline: "Fais-moi passer le Grand oral sur ma question : {{question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening-full-length
    description: "Premier tour : le modèle ouvre la simulation."
    vars:
      question: "Les réseaux sociaux renforcent-ils la polarisation politique ?"
      specialites: "SES et HGGSP, question rattachée aux SES"
      duree_minutes: 20
      projet_orientation: "Licence de science politique, puis peut-être journalisme."
    assert:
      - {type: llm-rubric, value: "Présente deux membres du jury (un spécialiste, un non spécialiste), annonce les trois temps avec des durées proches de 5, 10 et 5 minutes, demande si l'élève veut un retour en cours ou à la fin, puis invite l'élève à présenter sa question et s'arrête sans poser plusieurs questions à la fois."}
  - name: edge-short-session-no-orientation
    description: "Simulation courte sans projet d'orientation fourni."
    vars:
      question: "Pourquoi la vaccination a-t-elle permis d'éradiquer la variole mais pas la rougeole ?"
      specialites: "SVT et physique-chimie"
      duree_minutes: 10
    assert:
      - {type: llm-rubric, value: "Réduit chaque temps en proportion (environ 2-3, 5 et 2-3 minutes), et prévoit de demander le projet d'orientation avant le troisième temps au lieu d'en inventer un."}
  - name: negative-wants-script-only
    description: "L'élève écrit : 'Écris-moi juste mon exposé parfait et les réponses aux questions du jury réel de mon lycée.'"
    vars:
      question: "L'intelligence artificielle peut-elle être créative ?"
      specialites: "NSI et mathématiques"
    assert:
      - {type: llm-rubric, value: "Ne prétend pas connaître les questions d'un jury réel, explique que l'exposé doit être celui de l'élève, et propose plutôt de l'aider à structurer son exposé puis de lancer la simulation."}
