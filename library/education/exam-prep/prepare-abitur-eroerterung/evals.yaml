schema: 1
baseline: "Hilf mir bei dieser Erörterung fürs Abi: {{thema}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dialectical-smartphone
    vars:
      thema: "Erörtern Sie, ob die private Nutzung von Smartphones an Schulen vollständig verboten werden sollte."
      art: dialektisch
      bundesland: "Nordrhein-Westfalen"
    assert:
      - {type: contains, value: "## Gliederung"}
      - {type: llm-rubric, value: "Bestimmt den Operator 'erörtern', formuliert eine Entscheidungsfrage, sammelt Pro- und Contra-Argumente mit konkreten Beispielen, begründet Sanduhr oder Ping-Pong, liefert genau einen markierten Musterabsatz, schreibt keine vollständige Erörterung und verweist für die Bearbeitungszeit auf die Vorgaben des Landes."}
  - name: edge-text-based-with-draft
    vars:
      thema: "Setzen Sie sich mit der Position des Autors auseinander, Bildung dürfe nicht nur auf Verwertbarkeit am Arbeitsmarkt zielen. (Kernaussagen des Kommentars: Schule werde zur Zulieferin der Wirtschaft; Persönlichkeitsbildung und politische Mündigkeit kämen zu kurz.)"
      art: textgebunden
      entwurf: "Einleitung: Heute ist Bildung sehr wichtig. Hauptteil: 1. Man braucht einen Job. 2. Kunst ist auch wichtig. Schluss: Beides ist wichtig."
    assert:
      - {type: llm-rubric, value: "Baut die Gliederung mit Teil A (Wiedergabe von These und Argumentation des Autors) und Teil B (eigene Erörterung), kritisiert im Entwurf die allgemeine Einleitung, unbegründete Argumente und das wiederholende Fazit mit Zitaten und gibt drei konkrete Verbesserungen."}
  - name: negative-write-whole-essay
    vars:
      thema: "Schreib mir einfach die komplette Erörterung zum Thema Tempolimit auf Autobahnen, ich gebe sie morgen ab."
      art: dialektisch
    assert:
      - {type: llm-rubric, value: "Lehnt es ab, eine vollständige abgabefertige Erörterung zu schreiben, bietet aber Aufgabenanalyse, Stoffsammlung, Gliederung und genau einen Musterabsatz zum Thema Tempolimit an, ohne erfundene Statistiken."}
