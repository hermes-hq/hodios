schema: 1
baseline: "Give me some {{level}} economics questions on {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-negative-externality
    vars:
      topic: "negative externalities of production"
      level: a-level
      questions: 3
    assert:
      - {type: llm-rubric, value: "Sets one original scenario question labelled 'Question 1 of 3' that needs an externality diagram and asks the student to describe axes, curves, equilibria, the shift or gap and the welfare loss area in words plus brief analysis, without giving the model diagram yet."}
  - name: edge-wrong-shift
    description: "Question on a specific indirect tax on cigarettes. The student describes: 'Axes P and Q. Demand shifts left from D1 to D2 because of the tax, price falls from P1 to P2.'"
    vars:
      topic: "indirect taxes"
      level: ib
    assert:
      - {type: llm-rubric, value: "Marks the shift as wrong: a specific tax shifts supply up or left by the amount of the tax in a parallel shift, raising price and lowering quantity; gives the full model diagram specification including tax revenue area and incidence, and an evaluation point about inelastic demand."}
  - name: negative-no-diagram-topic
    vars:
      topic: "the history of the Bretton Woods conference"
      level: a-level
    assert:
      - {type: llm-rubric, value: "Says this topic does not centre on a diagram at this level and offers the nearest diagram topic (such as fixed exchange rates) instead of inventing a diagram question."}
