schema: 1
baseline: "Give me a creative writing task and mark my answer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-set-task
    vars:
      task: either
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Offers one original description task (based on a described image) and one narrative task, states 45 minutes including about 5 for planning, gives a brief plan shape, and asks the student to paste their writing when done, without writing an example piece."}
  - name: edge-feedback-on-comma-splices
    description: "The student pastes: 'The market was busy, people were everywhere, the smell of spices filled the air. I walked through it. It was loud, it was colourful, it was alive. Suddenly the rain came, everyone ran, the stalls emptied in seconds and the street was quiet.'"
    vars:
      task: description
      minutes: 45
    assert:
      - {type: contains, value: "## Technical accuracy"}
      - {type: llm-rubric, value: "Quotes at least two specific comma splices from the text with fixes, notes the shift from bustle to quiet as a structural strength, sets one rewrite target per strand, and gives no numeric grade because no mark scheme was pasted."}
  - name: negative-write-it-for-me
    description: "The student says: 'Just write a top-grade description of a beach for me to learn by heart for the exam.'"
    vars:
      task: description
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Declines to write a full piece to memorise, explains briefly why, and offers to set the timed task or model two sentences instead."}
