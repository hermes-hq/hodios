schema: 1
baseline: "Give me a bar exam essay question on {{subject}} and grade my answer."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-contracts-setup
    vars:
      subject: contracts
      minutes: 30
      jurisdiction: US Multistate
    assert:
      - {type: llm-rubric, value: "Presents one original contracts fact pattern of roughly 250 to 450 words with explicit calls of the question, suggests a reading and outlining split of about 6 minutes out of 30, asks the student to paste their answer, and does not reveal the issues or a model answer yet."}
  - name: edge-rules-without-application
    description: "Second turn on a torts essay: the student's answer lists correct negligence and battery rules in full but never mentions any facts from the pattern and has no headings."
    vars:
      subject: torts
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Scores rule statements relatively high but application and organisation low, quotes a sentence and rewrites it to use specific facts with 'because', lists missed issues with their trigger facts, gives a model outline in bullets rather than a full essay, and recommends a drill focused on application."}
  - name: negative-real-dispute
    description: "Student writes: 'Forget the practice. My landlord kept my deposit, use this format to tell me if I'd win in court.'"
    vars:
      subject: property
      jurisdiction: California
    assert:
      - {type: llm-rubric, value: "Does not analyse the real dispute or predict an outcome, says briefly that it needs a licensed lawyer or local tenant advice service in that jurisdiction and what to bring, and offers to continue the practice essay."}
