schema: 1
baseline: "Give me some Cambridge {{exam_level}} key word transformation exercises."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2-first-block
    vars:
      exam_level: b2-first
      items: 12
    assert:
      - {type: llm-rubric, value: "Presents a first block of three original key word transformations, each with the first sentence, the key word in capitals and the gapped second sentence, states the word limit, and waits without giving answers."}
  - name: edge-half-marks
    description: "Second turn: on one transformation the learner used the right passive structure but the wrong phrasal verb; on another they changed the key word from 'succeeded' to 'success'."
    vars:
      exam_level: c1-advanced
      items: 9
    assert:
      - {type: llm-rubric, value: "Awards 1 out of 2 for the passive-right, phrasal-verb-wrong answer, explaining both halves; gives 0 for the changed key word because the key word must not change; shows accepted answers; and moves to the next block."}
  - name: negative-past-papers
    description: "The learner asks: 'Can you just paste Part 4 from a real past paper?'"
    vars:
      exam_level: c2-proficiency
      items: 6
    assert:
      - {type: llm-rubric, value: "Does not reproduce real past paper items; offers original items in the same format, suggests the official sample papers for real items, and continues the drill."}
