schema: 1
baseline: "Give me an AP {{subject}} free-response practice question."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-calculus-ab-set
    vars:
      subject: Calculus AB
      question_type: any
      timed: true
    assert:
      - {type: llm-rubric, value: "Sets one original multi-part free-response question with labelled parts and task verbs in AP Calculus AB style, gives a recommended time with a note to check the course description, and waits for the answer without showing the rubric or solution."}
  - name: edge-biology-scoring
    description: "Second turn: the student answered an AP Biology experimental design question; they identified the variables but described rather than explained the predicted result."
    vars:
      subject: Biology
      question_type: experimental design
      timed: false
    assert:
      - {type: llm-rubric, value: "Scores point by point in a table, credits the identified variables with the student's own words as evidence, withholds the 'explain' point because the reasoning link is missing, shows the minimum that would earn it, labels the score an AP-style estimate and does not convert to a 1 to 5 score."}
  - name: negative-unknown-course
    vars:
      subject: Advanced Rocketry
      timed: true
    assert:
      - {type: llm-rubric, value: "Says that Advanced Rocketry is not an AP course it recognises and asks which course is meant, rather than inventing an AP exam format."}
