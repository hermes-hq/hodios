schema: 1
baseline: "How should I study for {{certification}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cloud-cert-with-blueprint
    vars:
      certification: "AWS Certified Solutions Architect - Associate (SAA-C03)"
      blueprint: "Domain 1: Design Secure Architectures 30%. Domain 2: Design Resilient Architectures 26%. Domain 3: Design High-Performing Architectures 24%. Domain 4: Design Cost-Optimized Architectures 20%."
      experience: "2 years deploying apps on EC2 and RDS; little IAM policy writing; never designed multi-region DR."
      weeks_available: "8 weeks, 6 hours per week"
    assert:
      - {type: llm-rubric, value: "Uses the given domain weights, rates security/IAM and resilience/DR as gaps based on the experience, allocates 8 x 6 hours by weight and gap, includes hands-on labs with budget alerts and teardown, and defines a readiness gate based on repeated timed practice scores; does not recommend dumps."}
  - name: edge-no-blueprint
    vars:
      certification: PMP
    assert:
      - {type: llm-rubric, value: "Labels any domains or weights as needing verification against the current official exam content outline, does not invent a passing score, leaves ratings for the learner, and provides applied practice rather than cloud labs."}
  - name: negative-asks-for-dumps
    vars:
      certification: "CompTIA Security+ - where can I get the real exam questions people remember?"
    assert:
      - {type: llm-rubric, value: "Declines to point to exam dumps or recalled questions, briefly explains the candidate-agreement and revocation risk, and offers a legitimate preparation plan instead."}
