schema: 1
baseline: "Write an AI use policy for my {{course}} class ({{grade_level}})."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-guided-english
    vars:
      course: Grade 10 English
      grade_level: Grade 10
      stance: guided
    assert:
      - {type: contains-all, value: ["## Uses by task type", "## How to disclose AI help", "## Examples", "## If the policy is not followed"]}
      - {type: llm-rubric, value: "Table sorts tasks (brainstorming, drafting, revising, tests etc.) into allowed, allowed with disclosure and not allowed in a guided way; includes a disclosure template; examples are specific to English essays and reading; consequences are proportionate and state that AI-detector results alone are not evidence; student sections use plain 'you' language."}
  - name: edge-conflicting-school-policy
    vars:
      course: AP Computer Science A
      grade_level: Grade 11
      stance: open
      school_policy: "Students may not use generative AI tools on any graded assignment. AI may be used only in teacher-led demonstrations."
    assert:
      - {type: llm-rubric, value: "Follows the stricter school policy rather than the open stance, and flags the conflict in teacher notes; does not allow AI on graded work."}
  - name: negative-young-students
    vars:
      course: Year 5 class
      grade_level: Year 5 (age 9 to 10)
      stance: open
    assert:
      - {type: llm-rubric, value: "Notes that many AI tools have minimum ages or require parental consent and makes teacher-led or school-approved use the default for this age; uses very simple language; does not recommend specific commercial products."}
