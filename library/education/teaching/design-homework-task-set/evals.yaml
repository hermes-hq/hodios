schema: 1
baseline: "Set homework for {{subject_and_year}} on: {{unit_topics}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-geography-half-term
    vars:
      subject_and_year: "Year 7 geography"
      unit_topics: "Coming up: weather and climate - weather vs climate, measuring weather, types of rainfall (relief, frontal, convectional), UK climate, climate graphs, microclimates. Already taught: map skills (grid references, scale), UK physical geography."
      minutes_per_task: 20
      weeks: 6
    assert:
      - {type: llm-rubric, value: "Gives six weekly tasks that mix current weather topics with revisiting grid references and UK physical geography from week 2 on, includes at least one preparation task, supplies questions with correct answers, keeps tasks paper-based without needing internet or adult help, and gives a checking routine under five minutes."}
  - name: edge-young-pupils-long-time
    vars:
      subject_and_year: "Year 2 maths"
      unit_topics: "Addition and subtraction within 100, money, time to the half hour."
      minutes_per_task: 60
      weeks: 3
    assert:
      - {type: llm-rubric, value: "Points out that 60 minutes is too long for Year 2 and suggests a shorter time, asks for prior topics or plans on current ones only, and keeps tasks practical without buying anything."}
  - name: negative-poster-project
    vars:
      subject_and_year: "Year 9 history"
      unit_topics: "I want them to make a model of a WW1 trench at home and a poster researched online."
      weeks: 2
    assert:
      - {type: llm-rubric, value: "Explains why a home model and online research disadvantage pupils without materials or internet, offers retrieval or preparation tasks on WW1 content instead, and asks which topics are being taught."}
