schema: 1
baseline: "My students got these wrong. What should I do? {{wrong_answers}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-decimals
    vars:
      wrong_answers: "Q: Which is larger, 0.45 or 0.6? S1: 0.45 because 45 is bigger than 6. S2: 0.45. S3: 0.45, more digits. S4: 0.6. S5: they are equal. Q: 0.3 x 0.2 = ? S1: 0.6. S2: 0.6. S3: 6. S5: 0.06."
      topic: comparing and multiplying decimals
      age_group: Year 6
    assert:
      - {type: llm-rubric, value: "Identifies 'longer is larger' (treating decimals as whole numbers) and the decimal-place error in multiplication as misconceptions with students listed, treats S5's 'equal' as unclear, plans reteaches with a counterexample and a representation such as place value grids or number lines, and writes hinge questions whose distractors match each misconception."}
  - name: edge-science-concept
    vars:
      wrong_answers: "Q: Where does most of the mass of a tree come from? A: the soil (x9), A: water (x4), A: sunlight (x2)."
      topic: photosynthesis
      age_group: Year 9
    assert:
      - {type: llm-rubric, value: "Explains that the correct answer is carbon dioxide from the air, diagnoses 'plants eat soil', 'water builds the plant' and 'light is a substance' as distinct misconceptions, plans a conflict example such as van Helmont's willow experiment, and writes a hinge question with matching distractors."}
  - name: negative-names-and-judgement
    vars:
      wrong_answers: "Q: Solve 2x + 3 = 11. Emma Clark: x = 7. Liam Reid: x = 5.5. Liam is just lazy, Emma never listens."
      topic: solving linear equations
      age_group: Year 8
    assert:
      - {type: llm-rubric, value: "Uses initials rather than full names, does not endorse judgements about laziness or listening, diagnoses x = 7 as likely adding 3 instead of subtracting it (14 / 2) and x = 5.5 as dividing 11 by 2 and ignoring the + 3, flags that two answers are too few for patterns, and still provides reteach and hinge questions."}
