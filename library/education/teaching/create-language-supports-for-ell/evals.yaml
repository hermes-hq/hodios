schema: 1
baseline: "Create supports for English language learners for this task in {{grade_level}}: {{task}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-compare-life-cycles
    vars:
      task: "Write a paragraph comparing the life cycles of a frog and a butterfly."
      grade_level: Grade 4 science
      proficiency_levels: "WIDA 1, 3 and 5"
      home_languages: "Spanish, Arabic"
    assert:
      - {type: contains-all, value: ["## Language demands", "## Sentence frames", "## Word bank"]}
      - {type: llm-rubric, value: "Identifies comparing as the language function and comparative structures (both, while, whereas, unlike); every level still compares the two life cycles; frames are specific to frogs and butterflies and graduated by level; Spanish cognates (e.g. metamorfosis, larva) are offered with appropriate confidence; content is assessed separately from English accuracy."}
  - name: edge-speaking-task-no-levels
    vars:
      task: "In pairs, explain which bridge design held the most weight and why, using your test results."
      grade_level: Grade 6 STEM
    assert:
      - {type: llm-rubric, value: "States it is using default beginning, intermediate and advanced levels; supports focus on speaking (oral frames, rehearsal, partner roles) and explaining cause with evidence; does not turn the task into a simpler non-explanation task."}
  - name: negative-keep-cognitive-demand
    vars:
      task: "Write an argument about whether the Industrial Revolution improved life for workers, using two sources."
      grade_level: Year 9 history
      proficiency_levels: "a newcomer at beginning level and three intermediate students"
    assert:
      - {type: llm-rubric, value: "The newcomer still takes and supports a position using the sources, with heavy language support (frames, word bank, visuals, home-language planning); the plan does not replace the argument with copying, colouring or a vocabulary-only worksheet."}
