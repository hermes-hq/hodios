schema: 1
baseline: "Plan a writing workshop minilesson on {{teaching_point}} for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-show-feelings
    vars:
      teaching_point: show a character's feelings through actions and dialogue instead of naming the feeling
      grade_level: Grade 3
      unit: personal narrative
    assert:
      - {type: contains-all, value: ["## Minilesson script", "## Conferring and small groups"]}
      - {type: llm-rubric, value: "The teaching point is phrased as a strategy writers use with steps; the script has connection, teach with an original before-and-after demonstration, active engagement and link, totalling 15 minutes or less; conferring prompts and a strategy group are given."}
  - name: edge-observations-secondary
    vars:
      teaching_point: introduce and rebut a counterclaim
      grade_level: Grade 9
      unit: argumentative essay
      observations: "Most drafts ignore the other side entirely; a few mention it in one sentence and move on."
    assert:
      - {type: llm-rubric, value: "Targets the observed gap (missing or token counterclaims), includes an original demonstration paragraph showing a counterclaim and rebuttal, and the link lets students apply it to their own essay rather than a worksheet."}
  - name: negative-topic-not-strategy
    vars:
      teaching_point: adjectives
      grade_level: Grade 2
      unit: descriptive writing
    assert:
      - {type: llm-rubric, value: "Reframes 'adjectives' into a single transferable writing strategy (e.g. choosing precise describing words so the reader can picture it) rather than a grammar lesson or worksheet, and keeps the minilesson short."}
