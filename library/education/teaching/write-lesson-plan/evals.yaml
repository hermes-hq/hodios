schema: 1
baseline: "Write a {{duration_minutes}}-minute lesson plan on {{topic}} for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fractions-grade5
    vars:
      topic: comparing fractions with unlike denominators
      grade_level: Grade 5
      duration_minutes: 50
    assert:
      - {type: contains-all, value: ["## Lesson sequence", "## Exit ticket", "I can"]}
      - {type: llm-rubric, value: "Timings in the sequence table add up to 50 minutes; includes a written worked example, at least two checks for understanding, the misconception that a larger denominator means a larger fraction, and exit ticket answers."}
  - name: edge-short-lesson-with-standard
    vars:
      topic: the causes of the Great Depression
      grade_level: Grade 11 US History
      duration_minutes: 30
      objectives: "Analyze the causes of the Great Depression, including stock market speculation, bank failures and overproduction."
    assert:
      - {type: llm-rubric, value: "Timings add up to 30 minutes, objectives use measurable verbs aligned to the given standard, and activities fit the shorter time without trying to cover everything superficially."}
  - name: negative-no-vague-objectives
    vars:
      topic: photosynthesis
      grade_level: Year 7
      duration_minutes: 60
    assert:
      - {type: not-regex, value: "(?i)students will understand"}
      - {type: llm-rubric, value: "Objectives use observable verbs (explain, label, identify, predict) rather than 'understand' or 'learn about'."}
