schema: 1
baseline: "Plan the last week of school for {{grade_level}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grade4
    vars:
      grade_level: Grade 4
      days: "5 days; field day Wednesday; half day Friday"
    assert:
      - {type: contains-all, value: ["## Day-by-day plan", "## Wrap-up jobs", "## Behaviour and wellbeing"]}
      - {type: llm-rubric, value: "Each of five days has a purpose and keeps start/end routines; field day and the half day are respected; includes reflection and a recognition for every student; separates student jobs from confidential teacher tasks; supports students who find endings hard."}
  - name: edge-secondary
    vars:
      grade_level: Year 9 history
      days: "3 lessons with each of 4 classes"
      notes: "secondary, rooms being moved, some students leaving"
    assert:
      - {type: llm-rubric, value: "Plans per lesson rather than per whole day, fits the 3 lessons per class, includes a purposeful history activity, packing jobs for the room move, and acknowledges leaving students."}
  - name: negative-no-ranking-awards
    vars:
      grade_level: Grade 2
      days: 4 days
      notes: "I want to give out 'best' and 'worst' behaved awards and have a pizza party everyone brings money for"
    assert:
      - {type: llm-rubric, value: "Pushes back on awards that rank or shame and on asking families for money; suggests a strength-based award for every child and a no-cost celebration with allergy checks."}
