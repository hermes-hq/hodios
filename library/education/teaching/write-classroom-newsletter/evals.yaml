schema: 1
baseline: "Write a class newsletter for parents from these notes: {{week_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grade2-week
    vars:
      week_notes: "Finished our plants unit - kids loved the bean experiment. Started 2-digit subtraction with regrouping. Library day moved to Thursday. Field trip permission slips due Monday 10 Nov. Picture day Wednesday 12 Nov 9am. Need empty egg cartons for art."
      grade_level: Grade 2
    assert:
      - {type: contains-all, value: ["## Subject line", "## Newsletter", "## Short message version", "## Before you send"]}
      - {type: llm-rubric, value: "Opens with the dated actions (slips due Monday 10 Nov, picture day Wednesday 12 Nov 9am, egg cartons, library day Thursday); explains learning in plain words; offers a no-cost home activity suited to Grade 2 subtraction or plants; under about 300 words; no jargon such as 'regrouping' left unexplained."}
  - name: edge-translation-friendly
    vars:
      week_notes: "Quarter ends Friday. We're wrapping up persuasive writing. Parent conferences sign-up opens soon. Don't forget it's a half day next week."
      grade_level: Grade 6
      languages_at_home: Spanish, Arabic, Vietnamese
    assert:
      - {type: llm-rubric, value: "Avoids idioms ('wrapping up', 'don't forget' style phrasing is simplified) and writes literally for translation; uses placeholders for missing dates (half day, conference sign-up) and lists them under Before you send rather than guessing dates."}
  - name: negative-no-individual-students
    vars:
      week_notes: "Great week. Liam finally passed his reading level after struggling all term. Ava got student of the week. Spelling test Friday."
    assert:
      - {type: llm-rubric, value: "Does not mention Liam's reading struggles or name individual students' achievements in the newsletter (or notes that individual recognition needs family agreement); keeps celebrations at class level."}
  - name: happy-reception-family-question
    vars:
      week_notes: "Phonics: s a t p i n sounds, blending CVC words. Maths: number bonds to 5. Topic: autumn, leaf hunt on Thursday was lovely, Leo found a conker as big as his fist. Trip to the farm Wed 22 Oct, need wellies and a packed lunch, consent forms + 4 pounds by Fri 17th. Lots of lost jumpers - please label. Some parents asked how to help with reading."
      grade_level: "Reception, ages 4-5"
      reading_level: plain
    assert:
      - {type: contains, value: "## Short message version"}
      - {type: llm-rubric, value: "Explains phonics and number bonds in everyday words with an 'Ask me' question; gives one five-minute, no-print, no-purchase home activity; lists the farm trip with weekday, wellies, packed lunch and the bold Friday 17 October deadline for the form and 4 pounds; answers the reading-help question in a Your questions section; does not name Leo; uses short sentences without idioms; the short message version is under 80 words."}
