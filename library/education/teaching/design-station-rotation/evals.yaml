schema: 1
baseline: "Design a station rotation lesson with {{stations}} stations for {{grade_level}} on: {{objective}}. The lesson is {{minutes}} minutes."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-area-grade4
    vars:
      objective: "Find the area of composite rectilinear shapes by splitting them into rectangles."
      grade_level: "Grade 4, 28 students, 6 laptops"
      stations: 4
      minutes: 60
    assert:
      - {type: contains-all, value: ["## Station cards", "## Teacher station by group", "## Rotation schedule"]}
      - {type: llm-rubric, value: "Shows a timing calculation that fits 60 minutes with transitions; every station practises composite area; independent stations have student-facing task cards with self-checking; the teacher station differs for each group; the schedule table has every group visit every station."}
  - name: edge-too-many-stations
    vars:
      objective: "Identify the main idea and two supporting details in an informational text."
      grade_level: Grade 3
      stations: 6
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Calculates that six stations in 45 minutes leaves too little time per station (under 8 minutes), says so, and recommends fewer stations or a two-day rotation, then plans the recommended option."}
  - name: negative-no-busywork
    vars:
      objective: "Use the past simple of regular and irregular verbs in short spoken and written sentences."
      grade_level: "Year 6 English as an additional language class"
      stations: 3
      minutes: 50
    assert:
      - {type: llm-rubric, value: "Each station practises past simple verbs specifically; no station is unrelated filler (colouring, free reading, generic games); tasks are doable without teacher help."}
