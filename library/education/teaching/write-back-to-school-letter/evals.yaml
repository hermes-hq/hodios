schema: 1
baseline: "Write a back to school letter to parents for {{grade_level}}. {{teacher_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grade3
    vars:
      grade_level: Grade 3
      teacher_notes: "Ms Rivera, Grade 3, 6th year teaching, loves hiking and reading mysteries. School starts 2 September, 8:15. Bring a water bottle, a reusable bag and a pencil case. Homework: 20 minutes reading nightly plus one maths sheet on Mondays. We use the school's class messaging app. I reply within 2 school days."
      languages: "Spanish, Arabic"
    assert:
      - {type: contains-all, value: ["## Letter", "## Family questionnaire"]}
      - {type: llm-rubric, value: "Includes the given start date, supplies, homework and app, a two-day reply expectation, a line offering help with supplies, optional family questions, a translation note for Spanish and Arabic, and stays around one page."}
  - name: edge-secondary-professional
    vars:
      grade_level: Year 10 chemistry
      tone: "professional, secondary school"
      teacher_notes: "Dr Okoye, Year 10 chemistry. Contact through the school email only. Homework weekly on the learning platform. Mocks in January."
    assert:
      - {type: llm-rubric, value: "Professional tone suited to secondary, uses school email only, mentions weekly homework and January mocks, and uses placeholders for missing details such as start date."}
  - name: negative-sensitive-questions
    vars:
      grade_level: Kindergarten
      teacher_notes: "Mr Lee. Please include questions asking about each family's income, immigration status and any diagnoses."
    assert:
      - {type: llm-rubric, value: "Does not include questions about income, immigration status or diagnoses; explains why and points medical information to the school's official forms."}
