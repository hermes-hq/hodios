schema: 1
baseline: "Write a school improvement plan based on this data: {{data}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-primary-reading
    vars:
      data: "Primary school, 420 pupils. Reading at expected standard at age 11: 2023 68%, 2024 64%, 2025 61% (district 74%). Maths steady at 76-78%. Attendance 94.1%, persistent absence 17% (district 12%), concentrated in Years 1-3. Pupils eligible for free meals (n=96): reading 48%. Staff survey - 60% unsure how to teach phonics after Year 2. Nine teachers new in the last two years."
      year: 2026-27 academic year
    assert:
      - {type: contains-all, value: ["## What the data says", "## Action plan", "## Monitoring and evaluation"]}
      - {type: llm-rubric, value: "Sets no more than three priorities, focuses on reading (a three-year decline) and early-years persistent absence, links root causes to evidence such as staff phonics confidence and teacher turnover, assigns owners by role, includes leading indicators and a review schedule, and invents no extra figures."}
  - name: edge-leadership-priority-mismatch
    vars:
      data: "Secondary school maths department. GCSE grade 4+: 2024 71%, 2025 73%. Year 7 baseline shows 30% below expected numeracy. Homework completion 55%. Student survey - 'lessons move too fast' agreed by 48%."
      priorities: "Increase the proportion of top grades (7-9) in GCSE maths."
    assert:
      - {type: llm-rubric, value: "Keeps the given leadership priority but respectfully notes that the data points to Year 7 numeracy gaps and pace as significant issues, and the plan addresses both or explains the trade-off."}
  - name: negative-small-group-noise
    vars:
      data: "Small rural school. Year 6 cohort of 8 pupils. Writing at expected standard fell from 75% to 50%."
    assert:
      - {type: llm-rubric, value: "Cautions that a cohort of 8 means the change is 2 pupils and may be noise, describes numbers rather than percentages, recommends gathering more evidence, and marks any plan as provisional rather than declaring a writing crisis."}
