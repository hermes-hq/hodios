schema: 1
baseline: "Plan a 5E lesson on {{topic}} for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-circuits
    vars:
      topic: series and parallel circuits
      grade_level: Grade 6
      time_available: two 50-minute lessons
      resources: class sets of batteries, bulbs, wires and switches
    assert:
      - {type: contains-all, value: ["## Phase plan", "## Evaluate task", "## Safety and logistics"]}
      - {type: llm-rubric, value: "Students explore circuits before the teacher explains series and parallel; Explore has a clear investigable question and written student instructions; the plan marks where lesson one ends; it targets a real misconception (e.g. current is used up by the bulb); Elaborate applies the idea to a new context such as house wiring; safety mentions short circuits or hot wires."}
  - name: edge-no-lab
    vars:
      topic: how the angle of sunlight affects temperature and seasons
      grade_level: Year 8
      time_available: one 60-minute lesson
      resources: "no lab, ordinary classroom, one torch"
    assert:
      - {type: llm-rubric, value: "All activities fit an ordinary classroom with a torch and simple items, timings fit 60 minutes, and the plan addresses the misconception that seasons are caused by distance from the Sun."}
  - name: negative-explain-first
    vars:
      topic: why ice floats on water
      grade_level: Grade 7
      time_available: one 45-minute lesson
    assert:
      - {type: llm-rubric, value: "The Engage phase does not give away the explanation (density, hydrogen bonding); the formal explanation comes after students explore; any simplification is flagged rather than stated as the full truth."}
