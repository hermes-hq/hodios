schema: 1
baseline: "Make a {{levels}}-level rubric for this assignment: {{assignment}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-persuasive-essay
    vars:
      levels: 4
      assignment: "Grade 9: Write a 600-800 word persuasive essay arguing whether your school should adopt a four-day week. Use at least two credible sources and address one counter-argument."
    assert:
      - {type: contains-all, value: ["## Rubric", "## Alignment", "## Scoring notes"]}
      - {type: llm-rubric, value: "Rubric has 3-6 non-overlapping criteria (e.g. claim, evidence, counter-argument, organisation, conventions) with four parallel levels whose descriptors name observable features rather than just adjectives like good or excellent; includes weights or points."}
  - name: edge-three-levels-with-objectives
    vars:
      levels: 3
      assignment: "Undergraduate lab report on measuring g with a pendulum."
      objectives: "1. Design a controlled experiment. 2. Analyse data with uncertainty. 3. Communicate results in scientific format."
    assert:
      - {type: llm-rubric, value: "Uses exactly three levels and every criterion maps to one of the three given objectives, with uncertainty analysis assessed explicitly."}
  - name: negative-vague-brief
    vars:
      levels: 4
      assignment: "A project about the environment."
    assert:
      - {type: llm-rubric, value: "Asks clarifying questions about the task, product and grade level instead of producing a generic rubric."}
