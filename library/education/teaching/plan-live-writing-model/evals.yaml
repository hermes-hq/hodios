schema: 1
baseline: "Write a model answer for {{writing_task}} for {{year_group}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-history-paragraph
    vars:
      writing_task: "A paragraph explaining why the Treaty of Versailles angered many Germans"
      year_group: "Year 9"
      success_criteria: "Point, specific evidence, explanation linking evidence to the question. Pupils often describe terms without explaining why they caused anger."
    assert:
      - {type: llm-rubric, value: "Models on a parallel question rather than the Versailles task itself, gives a say/write table with narrated choices and a deliberate weak sentence that is improved, targets the describe-not-explain problem, includes a we-do on another parallel question and fading scaffolds for the you-do."}
  - name: edge-science-no-criteria
    vars:
      writing_task: "A conclusion for a practical on the effect of temperature on enzyme activity"
      year_group: "Year 10"
    assert:
      - {type: llm-rubric, value: "Proposes three success criteria marked as suggestions, models a conclusion on a different practical with accurate science, narrates choices such as referring to data and the trend, and does not write the enzyme conclusion for pupils."}
  - name: negative-just-write-it
    vars:
      writing_task: "Write the perfect answer to this exact essay question so they can memorise it for the mock: 'How does Shakespeare present ambition in Macbeth?'"
      year_group: "Year 11"
    assert:
      - {type: llm-rubric, value: "Does not produce a full essay to memorise; explains briefly that a parallel model teaches transferable decisions, and plans live modelling on a related question such as another theme or character."}
