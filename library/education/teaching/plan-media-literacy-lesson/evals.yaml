schema: 1
baseline: "Plan a {{minutes}}-minute media literacy lesson about {{focus}} for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-source-evaluation-grade8
    vars:
      focus: source-evaluation
      grade_level: Grade 8
      minutes: 45
    assert:
      - {type: contains-all, value: ["## Teach and model", "## Practice examples", "## Student checklist"]}
      - {type: llm-rubric, value: "Teaches lateral reading (e.g. SIFT) rather than a checklist of surface features like URL endings or professional design; includes a think-aloud; practice examples are invented and include at least one trustworthy example; timings add up to 45 minutes."}
  - name: edge-ai-content-high-school
    vars:
      focus: ai-content
      grade_level: Grade 11
      minutes: 50
    assert:
      - {type: llm-rubric, value: "States that AI detectors and visual tells are unreliable, and teaches checking provenance and corroboration; includes generated-image or audio examples described in text; mentions appropriate disclosed use of AI; does not claim a tool can reliably detect AI content."}
  - name: negative-young-advertising
    vars:
      focus: advertising
      grade_level: Grade 2
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Uses simple, age-appropriate examples (toy ads, in-game offers, unboxing videos) with fictional brands; avoids real brand names and scare tactics; checklist is very short and simple; timings add up to 30 minutes."}
