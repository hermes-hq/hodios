schema: 1
baseline: "Plan a {{minutes}}-minute number talk for {{grade_level}} on {{math_focus}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-compensation-grade2
    vars:
      math_focus: "adding 9 and 19 by adding 10 or 20 and adjusting"
      grade_level: Grade 2
      minutes: 15
    assert:
      - {type: contains-all, value: ["## Problem string", "## Anticipated strategies and recording", "## Teacher moves"]}
      - {type: llm-rubric, value: "Problem string of 4 to 6 related problems where early helper problems (e.g. 25 + 10) lead to compensation problems (25 + 9, 47 + 19); each problem lists named student strategies including a less efficient one and an error, with how to record them on an open number line; all arithmetic is correct; the strategy is not simply told to students."}
  - name: edge-middle-school-proportional
    vars:
      math_focus: "multiplying by scaling up and down in a ratio table"
      grade_level: Grade 7
      minutes: 10
    assert:
      - {type: llm-rubric, value: "Fits 10 minutes with only 3 to 5 problems; uses ratio tables for recording; problems build on each other (e.g. 12 x 5 from 12 x 10, then 12 x 15); arithmetic is correct and suited to Grade 7."}
  - name: negative-too-broad
    vars:
      math_focus: "fractions"
      grade_level: Grade 4
      minutes: 15
    assert:
      - {type: llm-rubric, value: "Narrows 'fractions' to one specific relationship (e.g. comparing to a benchmark like 1/2, or equivalent fractions) and says so, rather than planning a scattered set of unrelated fraction problems."}
