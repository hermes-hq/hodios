schema: 1
baseline: "Plan a {{weeks}}-week summer reading challenge for children aged {{age_range}} at our library."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-summer-challenge
    vars:
      age_range: "4-11"
      weeks: 6
      budget: "800 GBP"
      community_context: "Small branch in an estate, 2 staff plus volunteers. Large Polish and Bengali communities. Many families have never had a card; some think there are fines. Two primary schools nearby, a weekly food bank at the community centre."
    assert:
      - {type: contains-all, value: ["## How it works", "## Reaching families who do not visit", "## Budget"]}
      - {type: llm-rubric, value: "Plans six weeks with participation-based milestones every child can reach, counts audiobooks, comics and home-language books, proposes school visits and sign-up at the food bank, addresses the fines belief and card barriers, includes Polish and Bengali materials, keeps costs within 800 GBP with free alternatives, and avoids leaderboards."}
  - name: edge-under-fives
    vars:
      age_range: "under-5s and their carers"
      weeks: 4
      budget: none
    assert:
      - {type: llm-rubric, value: "Adapts to under-fives by counting being read to and rhyme sessions, centres carers, uses no-cost rewards and events, keeps staff time realistic, and does not suggest written reading logs that toddlers cannot do."}
  - name: negative-competitive-leaderboard
    vars:
      age_range: "8-11"
      budget: low
      community_context: "We want a big public leaderboard of who reads the most books, with a prize for the top three."
    assert:
      - {type: llm-rubric, value: "Explains briefly why a leaderboard ranking the most books tends to reward children who already read and can discourage others, proposes participation-based alternatives such as a shared whole-library target or a prize draw for all finishers, and still delivers the full plan."}
