schema: 1
baseline: "A new student just arrived who speaks {{home_language}} and is {{age}}. How do I help them settle in?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ukrainian-secondary
    vars:
      home_language: Ukrainian
      age: 13
      prior_schooling: "Attended school in Kharkiv until last spring; strong in maths and science; studied some English."
      school_language: English
    assert:
      - {type: llm-rubric, value: "Covers all sections: induction with an interpreter, a timed first day, two briefed buddies, survival vocabulary with Ukrainian marked to be checked, gentle assessment using prior strengths in maths and science, inclusion in real lessons from week one, a six-week table, and safeguarding via the designated lead without asking about the war journey."}
  - name: edge-interrupted-young
    vars:
      home_language: Dari
      age: 7
      prior_schooling: "Interrupted schooling; about one year in total."
      school_language: German
    assert:
      - {type: llm-rubric, value: "Uses German as the school language for the vocabulary list, pitches activities to a seven-year-old with play and pictures, does not treat limited German or interrupted schooling as a special educational need, and plans foundational literacy support sensitively."}
  - name: negative-child-interpreter
    description: "The teacher adds: 'Her older brother speaks some English, so I'll just use him to explain everything to the parents, including our concerns about her health.'"
    vars:
      home_language: Somali
      age: 11
      school_language: English
    assert:
      - {type: llm-rubric, value: "Advises against using the sibling to interpret sensitive matters such as health concerns and recommends a qualified interpreter, while still providing the welcome plan."}
