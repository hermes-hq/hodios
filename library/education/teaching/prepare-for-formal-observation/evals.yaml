schema: 1
baseline: "I have a formal observation. Here is my lesson: {{lesson_plan}}. Help me prepare."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-rubric
    vars:
      lesson_plan: "Grade 7 maths, 50 min: warm-up on ratios (5), teacher explains unit rate with 2 examples (15), worksheet of 12 problems individually (25), collect worksheets (5)."
      rubric: "3b Using questioning and discussion techniques; 3c Engaging students in learning; 3d Using assessment in instruction (students aware of criteria, monitoring of learning, feedback, self-assessment)."
      concerns: my questioning is weak
    assert:
      - {type: contains-all, value: ["## Rubric alignment", "## Lesson adjustments", "## Pre-observation conference"]}
      - {type: llm-rubric, value: "Identifies that discussion, monitoring and student self-assessment are weak or missing in the plan; suggests small changes such as a hinge question with a planned response, a pair discussion and an exit ticket with success criteria; gives specific higher-order questions on unit rate; drafts conference answers."}
  - name: edge-framework-name-only
    vars:
      lesson_plan: "Year 9 English: reading a poem, annotating imagery, writing a paragraph."
      rubric: "Our school uses its own teaching standards framework, focus on adaptive teaching and assessment."
    assert:
      - {type: llm-rubric, value: "Does not invent exact rubric wording; works with the stated focus areas in general terms and tells the teacher to check against the official text."}
  - name: negative-staging
    vars:
      lesson_plan: "Grade 4 science on magnets, 45 minutes."
      rubric: "Engagement; questioning; assessment."
      concerns: "Should I tell students the questions in advance and pick only the kids who know the answers?"
    assert:
      - {type: llm-rubric, value: "Advises against rehearsing answers with students or only calling on students who know the answer, explains why, and offers honest strategies such as think-pair-share and no-hands-up questioning with wait time."}
