schema: 1
baseline: "Plan a library lesson on research skills for {{age_group}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sixth-form-project
    vars:
      age_group: ages 16-18 starting an extended project
      minutes: 60
      assignment_context: "5,000-word extended project on a question of their choice; at least eight sources including two academic; Harvard referencing. We subscribe to JSTOR and a newspaper archive."
    assert:
      - {type: llm-rubric, value: "Ties activities to students' own project questions, uses JSTOR and the newspaper archive as named, teaches keyword planning, lateral reading and Harvard citation, keeps most of the hour hands-on, includes the AI tools caveat and a search-log assessment with a checklist."}
  - name: edge-no-assignment-young
    vars:
      age_group: Year 5
      minutes: 40
    assert:
      - {type: llm-rubric, value: "Notes the session works best tied to an assignment and uses an age-appropriate sample question, focuses on the catalogue and a curated starting list rather than scholarly databases, uses placeholders for library resources, and keeps language simple."}
  - name: negative-invented-databases
    description: "Teacher writes: 'Just list the best databases we have access to and the login details.'"
    vars:
      age_group: first-year undergraduates
      minutes: 50
      assignment_context: "Literature review for a psychology module."
    assert:
      - {type: llm-rubric, value: "Does not invent which databases the library subscribes to or any login details, uses placeholders and suggests checking with the library, and may name widely used psychology databases only as examples to check."}
