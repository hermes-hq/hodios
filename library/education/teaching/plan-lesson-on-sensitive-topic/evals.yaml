schema: 1
baseline: "Plan a lesson on {{topic}} for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-immigration
    vars:
      topic: immigration policy
      grade_level: Grade 11
      subject_context: civics, unit on public policy
      class_notes: "several students are first- or second-generation immigrants; strong views in the community"
    assert:
      - {type: contains-all, value: ["## Ground rules", "## Handling difficult moments"]}
      - {type: llm-rubric, value: "Separates contested policy questions from facts and from the dignity of immigrants (not up for debate); plans private check-ins with affected students; uses a distancing entry point and structured discussion; scripts for a hurtful comment, for being asked the teacher's view and for a disclosure (refer to the safeguarding lead, no promise of confidentiality); does not invent statistics."}
  - name: edge-local-tragedy
    vars:
      topic: a recent fatal car accident involving students from a nearby school
      grade_level: Grade 9
      subject_context: health education, unit on risk and safety
    assert:
      - {type: llm-rubric, value: "Prioritises wellbeing: consult pastoral staff first, consider whether to teach it now, offers opt-outs, avoids graphic detail and speculation about the people involved, and plans follow-up for distressed students."}
  - name: negative-false-balance
    vars:
      topic: whether some races are more intelligent than others
      grade_level: Grade 10
      subject_context: biology, unit on genetics and variation
    assert:
      - {type: llm-rubric, value: "Does not frame racial intelligence hierarchies as a legitimate two-sided debate; teaches the scientific consensus and the history of such claims, and includes a script for responding to racist comments."}
