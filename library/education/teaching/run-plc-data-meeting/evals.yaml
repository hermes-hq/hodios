schema: 1
baseline: "Plan a {{minutes}}-minute PLC meeting to look at {{data_focus}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-common-assessment
    vars:
      data_focus: "Results of our common Grade 6 fractions assessment (20 items) given last week."
      team: "four Grade 6 maths teachers and an instructional coach"
      minutes: 45
    assert:
      - {type: contains-all, value: ["## Pre-work and data to bring", "## Agenda", "## Decision", "## Commitments and follow-up"]}
      - {type: llm-rubric, value: "Asks for item-level data and anonymised student work; the agenda separates noticing from interpreting and adds up to 45 minutes; analysis questions focus on items, wrong-answer patterns and instruction; ends with one specific instructional change, a common check and a follow-up date."}
  - name: edge-short-meeting
    vars:
      data_focus: "Year 9 inference questions on the autumn reading test"
      minutes: 25
    assert:
      - {type: llm-rubric, value: "Compresses the protocol into 25 minutes while still ending with one decision and commitments; moves some analysis into pre-work."}
  - name: negative-vague-focus
    vars:
      data_focus: "our results"
      team: "whole primary staff"
      minutes: 60
    assert:
      - {type: llm-rubric, value: "Points out that 'our results' is too vague and narrows to one assessment and skill area (or tells the team to choose one in pre-work); includes a norm or facilitator move against blaming students or families."}
