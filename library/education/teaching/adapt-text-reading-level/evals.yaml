schema: 1
baseline: "Rewrite this text for these reading levels: {{levels}}. {{text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-grades
    vars:
      levels: "grade 3, grade 5, grade 8"
      key_vocabulary: "photosynthesis, chlorophyll, glucose"
      text: "Photosynthesis is the process by which green plants convert light energy into chemical energy. Chlorophyll, a pigment in the chloroplasts, absorbs mainly red and blue light. Using this energy, the plant combines carbon dioxide from the air with water drawn up from the soil to produce glucose, releasing oxygen as a by-product. The glucose is used for respiration or stored as starch."
    assert:
      - {type: llm-rubric, value: "All three versions keep photosynthesis, chlorophyll and glucose with in-context support at lower levels, keep the core ideas in the same order without changing facts, each has a glossary and four questions including one identical shared big question, and reading levels are described as approximate."}
  - name: edge-cefr-idioms
    vars:
      levels: "CEFR A2, B1"
      text: "When the factory closed, the town was hit hard. Hundreds lost their jobs overnight, and many families had to tighten their belts. Some saw the writing on the wall years earlier and had already moved away."
    assert:
      - {type: llm-rubric, value: "Replaces or explains the idioms ('hit hard', 'tighten their belts', 'writing on the wall') in the A2 version, keeps the facts (hundreds of jobs lost, some moved away earlier), and provides a glossary and questions per version."}
  - name: negative-too-far-apart
    vars:
      levels: "grade 1"
      text: "The Treaty of Westphalia (1648) established the principle of state sovereignty, ending the Thirty Years' War and the Eighty Years' War, and is often cited as the origin of the modern international system, although historians dispute how far it created the norms later attributed to it."
    assert:
      - {type: llm-rubric, value: "Produces a very simple version and explicitly notes what had to be cut (such as the historiographical dispute) and why, rather than pretending all content survives; does not invent facts."}
