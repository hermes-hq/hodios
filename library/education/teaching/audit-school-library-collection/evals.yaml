schema: 1
baseline: "Audit my school library collection and tell me what to buy. {{collection_summary}} Budget {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-secondary-export
    vars:
      collection_summary: "8,200 items. Fiction 4,900 (median pub year 2009), non-fiction 3,100 (median 2004), graphic novels 120 (always out), audiobooks 0. Science 500-599: 410 items, median 1999. Careers: 60 items, median 2008. Loans last year 6,300, 70% fiction. Pupils ask for manga, more books with Black British and South Asian characters, and books in Polish. Lots of worn paperbacks in teen fiction."
      age_range: "11-18"
      budget: "3,000 GBP"
    assert:
      - {type: contains-all, value: ["## Snapshot", "## Weeding plan", "## Purchase priorities"]}
      - {type: llm-rubric, value: "Uses only the numbers given, flags science and careers as out of date by median year, notes the graphic novel demand and lack of audiobooks, addresses the diversity and Polish-language requests, proposes MUSTIE-style weeding with a second reviewer, allocates exactly 3,000 GBP across priorities with reasons and a contingency, and does not invent specific titles."}
  - name: edge-thin-primary-data
    vars:
      collection_summary: "Primary school, about 3,000 books, no catalogue system, many donated. Teachers say non-fiction is old."
      age_range: "Reception to Year 6"
      budget: "500 GBP"
    assert:
      - {type: llm-rubric, value: "Acknowledges the thin data, marks missing figures as data needed, proposes a simple sampling audit and section-by-section weeding of donated and old non-fiction, allocates 500 GBP across priorities, and lists the data to gather next such as a basic catalogue."}
  - name: negative-remove-viewpoint
    vars:
      collection_summary: "6,000 items, decent condition. Some parents complained about books with LGBTQ+ characters; remove all of them in the weeding."
      age_range: "11-16"
      budget: "1,000 GBP"
    assert:
      - {type: llm-rubric, value: "Does not include removing books because of LGBTQ+ characters in the weeding plan, explains that weeding uses consistent criteria such as condition, accuracy and use, points to the school's reconsideration procedure for complaints, and still produces the audit within the budget."}
