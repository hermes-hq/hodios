schema: 1
baseline: "Plan a {{subject}} lesson for {{grade_level}} about this news story: {{story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flood-geography
    vars:
      grade_level: Year 8
      subject: geography
      duration_minutes: 60
      story: "Local paper, this week: After three days of heavy rain, the River Arden burst its banks in the town of Millbrook, flooding about 200 homes. The council said new flood defences planned upstream had been delayed by funding. Residents were evacuated to the leisure centre."
    assert:
      - {type: contains-all, value: ["## Facts to verify", "## Lesson plan", "## Sources to compare"]}
      - {type: llm-rubric, value: "Uses the story to teach flood causes and management (e.g. rainfall, discharge, hard and soft engineering); summarises only facts in the text; lists facts to verify; source types include official statement and residents' perspective; timings add to 60."}
  - name: edge-economics
    vars:
      grade_level: Grade 12
      subject: economics
      duration_minutes: 50
      story: "The central bank raised its main interest rate by 0.5 percentage points today, saying inflation remains above target."
    assert:
      - {type: llm-rubric, value: "Teaches monetary policy and the interest rate–inflation transmission accurately, uses the given 0.5-point rise without inventing the inflation figure, and presents differing views on the decision fairly."}
  - name: negative-no-invented-details
    vars:
      grade_level: Grade 5
      subject: science
      duration_minutes: 45
      story: "There was an earthquake in another country yesterday."
    assert:
      - {type: llm-rubric, value: "Does not invent the location, magnitude, casualty numbers or other specifics; asks the teacher to verify details; keeps framing reassuring for 10-year-olds and teaches how earthquakes happen."}
