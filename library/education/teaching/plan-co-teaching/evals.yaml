schema: 1
baseline: "Plan a co-taught lesson for {{teachers}} on: {{lesson_objective}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-thesis-statement
    vars:
      lesson_objective: "Write a thesis statement for a literary analysis essay on 'Of Mice and Men'."
      teachers: "Ms Rivera, English teacher; Mr Osei, special education teacher, strong at breaking tasks into steps; they have co-taught for one term."
      student_needs: "5 students with IEPs for written expression, 3 multilingual learners, 2 students who need movement breaks."
      minutes: 50
    assert:
      - {type: contains-all, value: ["## Model choice", "## Lesson flow", "## Support for additional needs"]}
      - {type: llm-rubric, value: "Chooses models such as parallel, station or alternative teaching with justification rather than defaulting to one teach, one assist; both teachers lead in the flow table; timings add up to 50 minutes; supports for IEP, multilingual and movement needs are specified with who and when; groupings are flexible."}
  - name: edge-short-lesson-young
    vars:
      lesson_objective: "Count objects to 20 and record the number."
      teachers: "Kindergarten teacher and an EAL specialist who visits twice a week."
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Fits 30 minutes; uses the EAL specialist's strength for language of counting; both adults actively teach; activities are hands-on for kindergarten."}
  - name: negative-no-fixed-special-group
    vars:
      lesson_objective: "Calculate the mean, median and mode of a data set."
      teachers: "Maths teacher and a learning support teacher."
      student_needs: "4 students with IEPs in maths."
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Does not place the 4 IEP students permanently with the support teacher for the whole lesson; grouping is based on in-lesson data; the learning support teacher also teaches students without plans."}
