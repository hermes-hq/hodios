schema: 1
baseline: "Design a {{duration_minutes}}-minute classroom activity for {{class_size}} students about: {{objective}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-jigsaw-revolutions
    vars:
      objective: "Students compare the causes of the American, French and Haitian revolutions and identify one cause common to all three."
      class_size: 27
      duration_minutes: 45
    assert:
      - {type: contains-all, value: ["## Run sheet", "## Teacher script", "## If things go wrong"]}
      - {type: llm-rubric, value: "Chooses a structure that distributes content (such as a jigsaw with three expert topics), gives grouping arithmetic that works for 27 students, run sheet times that sum to 45 minutes, and individual accountability such as a personal written comparison."}
  - name: edge-awkward-class-size-short-time
    vars:
      objective: "Students explain why the moon has phases."
      class_size: 31
      duration_minutes: 10
    assert:
      - {type: llm-rubric, value: "Picks a short structure suited to 10 minutes (e.g. think-pair-share or peer instruction), handles the odd number of students explicitly, and run sheet times sum to 10."}
  - name: negative-vague-objective
    vars:
      objective: learn about plants
      class_size: 25
      duration_minutes: 30
    assert:
      - {type: llm-rubric, value: "Restates the vague objective as a measurable one and says it did so before designing the activity."}
