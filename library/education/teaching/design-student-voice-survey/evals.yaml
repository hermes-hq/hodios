schema: 1
baseline: "Write a student feedback survey for {{course}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-year10-chemistry
    vars:
      course: Year 10 chemistry, 28 students, lots of practicals
      focus: pace, homework load, whether practicals help understanding
      grade_level: Year 10
    assert:
      - {type: contains-all, value: ["## Survey", "## Reading the results", "## Responding to the class"]}
      - {type: llm-rubric, value: "Has 6-10 single-idea, non-leading questions including the three focus areas and 2-3 open questions, explains how to keep responses anonymous, and gives a 'you said, I'll do' script that includes what will not change and why."}
  - name: edge-young-children
    vars:
      course: Grade 2 class, reading and maths
      grade_level: Grade 2
    assert:
      - {type: llm-rubric, value: "Uses very simple wording, fewer questions, and a 3-face or yes/sometimes/not-yet scale, with a note about reading the questions aloud."}
  - name: negative-no-personal-judgement
    vars:
      course: online MBA finance module, 60 students
      focus: "whether students like me as a lecturer"
    assert:
      - {type: llm-rubric, value: "Reframes the focus toward specific, changeable teaching behaviours (clarity, responsiveness, feedback) rather than personal popularity, and avoids demographic questions that could identify students."}
