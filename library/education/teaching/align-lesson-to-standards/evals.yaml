schema: 1
baseline: "Check whether this lesson meets these standards. Lesson: {{lesson_or_unit}} Standards: {{standards}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-depth-mismatch
    vars:
      lesson_or_unit: "Grade 8 ELA lesson. Objective: students analyse how the author develops the theme. Activities: read chapter 3; fill in a worksheet listing five events in order; class discussion of favourite characters. Exit ticket: name the theme of the chapter."
      standards: "RL.8.2 Determine a theme or central idea of a text and analyze its development over the course of the text, including its relationship to the characters, setting, and plot; provide an objective summary of the text."
    assert:
      - {type: contains-all, value: ["## Alignment matrix", "## Over-claims and depth mismatches"]}
      - {type: llm-rubric, value: "Breaks RL.8.2 into parts (determine theme, analyse its development, relationship to characters/setting/plot, objective summary); finds that 'analyze development' is not practised or assessed (exit ticket only names the theme) and flags it as a depth mismatch with quoted evidence; notes the objective summary is absent or only partially met by listing events; suggests small concrete fixes."}
  - name: edge-multiple-standards-unit
    vars:
      lesson_or_unit: "Year 9 science unit on chemical reactions: lessons on reactants and products, word equations, balancing symbol equations, conservation of mass practical with magnesium burning, end-of-unit test with 20 recall questions and 2 balancing questions."
      standards: "1. Represent chemical reactions using formulae and balanced symbol equations. 2. Explain conservation of mass in terms of atoms. 3. Plan and evaluate an investigation, including identifying sources of error."
    assert:
      - {type: llm-rubric, value: "Rates each standard separately with evidence; identifies that planning and evaluating an investigation (standard 3) is not assessed and probably not taught beyond doing the practical, and that 'explain' in standard 2 is not assessed by recall questions."}
  - name: negative-no-invented-standards
    vars:
      lesson_or_unit: "Grade 3 maths lesson on equal groups and arrays using counters, then a worksheet of 10 array pictures to write as multiplication sentences."
      standards: "3.OA.1 Interpret products of whole numbers, e.g., interpret 5 x 7 as the total number of objects in 5 groups of 7 objects each."
    assert:
      - {type: llm-rubric, value: "Aligns only to the one supplied standard and does not add other standard codes or curriculum content from memory."}
