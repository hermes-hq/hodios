schema: 1
baseline: "Write {{count}} discussion questions about {{text_or_topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-poem
    vars:
      grade_level: Grade 10
      count: 6
      text_or_topic: |
        "The Road Not Taken" by Robert Frost (1916).
        Two roads diverged in a yellow wood, / And sorry I could not travel both / And be one traveler, long I stood ...
        ... Though as for that the passing there / Had worn them really about the same ...
        I shall be telling this with a sigh / Somewhere ages and ages hence: / Two roads diverged in a wood, and I— / I took the one less traveled by, / And that has made all the difference.
    assert:
      - {type: contains, value: "Probe:"}
      - {type: contains, value: "Push:"}
      - {type: llm-rubric, value: "Six questions labelled with Bloom levels, weighted toward evaluate and analyse; at least one asks students to reconcile 'worn them really about the same' with 'the one less traveled by' using evidence from the poem; each has probe and push follow-ups and a likely response."}
  - name: edge-topic-no-text
    vars:
      count: 8
      text_or_topic: Should social media platforms be legally responsible for misinformation?
      grade_level: adult debate club
    assert:
      - {type: llm-rubric, value: "Questions are open, admit multiple defensible positions, are sequenced from accessible to deeper, and include follow-ups; no question has a single hidden right answer."}
  - name: negative-unknown-text
    vars:
      count: 5
      text_or_topic: "Chapter 7 of 'The Lanternmaker's Daughter' by M. R. Okonkwo-Hale"
    assert:
      - {type: llm-rubric, value: "Says it does not know this text well enough and asks for the chapter or a passage, rather than inventing plot details or quotations."}
