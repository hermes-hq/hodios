schema: 1
baseline: "Plan a {{minutes}}-minute SEL lesson on {{skill}} for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-frustration-grade2
    vars:
      skill: calming down when frustrated
      grade_level: Grade 2
      minutes: 30
      class_context: "Frequent meltdowns when games are lost at recess."
    assert:
      - {type: contains-all, value: ["## Hook", "## Practise", "## Check-in routine"]}
      - {type: llm-rubric, value: "Breaks the skill into named concrete steps with a teacher think-aloud; practice uses third-person scenarios related to losing games; discussion does not require personal disclosure; the check-in routine offers private or opt-in responses; timings add up to 30 minutes; includes a brief disclosure plan pointing to the safeguarding lead."}
  - name: edge-adolescent-empathy
    vars:
      skill: seeing a conflict from the other person's side
      grade_level: Year 9
      minutes: 50
    assert:
      - {type: llm-rubric, value: "Uses age-appropriate adolescent scenarios (group chats, friendship groups, sports) rather than puppets or very young framing; includes discussion that transfers the skill to real life without asking students to share their own conflicts publicly; timings add up to 50 minutes."}
  - name: negative-no-forced-disclosure
    vars:
      skill: talking about big feelings
      grade_level: Kindergarten
      minutes: 20
      class_context: "One child's parent recently died."
    assert:
      - {type: llm-rubric, value: "Does not ask children to share sad personal experiences in front of the class; handles the bereavement context sensitively (talk to the family and school counsellor beforehand, use a gentle story); does not diagnose; keeps activities short and concrete for Kindergarten."}
