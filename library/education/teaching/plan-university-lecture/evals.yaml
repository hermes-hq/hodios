schema: 1
baseline: "Plan a {{minutes}}-minute university lecture on {{topic}} for {{course_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-eigenvalues
    vars:
      topic: Week 5 - eigenvalues and eigenvectors, after matrix multiplication and determinants
      course_level: first-year undergraduate linear algebra, 200 students
      minutes: 50
    assert:
      - {type: contains-all, value: ["## Timed plan", "## Worked examples", "## Retrieval check"]}
      - {type: llm-rubric, value: "Times sum to 50 minutes with exposition segments of about 15 minutes or less, includes a fully worked 2x2 eigenvalue example with correct arithmetic and a 'your turn' problem, at least one peer-instruction concept question with distractor explanations, and activities workable for 200 students."}
  - name: edge-long-seminar-slot
    vars:
      topic: Causes of the 2008 financial crisis, for a course on financial regulation
      course_level: second-year undergraduate economics, 60 students
      minutes: 90
    assert:
      - {type: llm-rubric, value: "Plans 90 minutes with multiple interaction points and a break or change of activity, and keeps content accurate (housing credit, securitisation, leverage, liquidity) without stating contested claims as settled fact."}
  - name: negative-overstuffed
    vars:
      topic: All of thermodynamics - the four laws, entropy, heat engines, free energy and statistical mechanics
      course_level: first-year physics
      minutes: 50
    assert:
      - {type: llm-rubric, value: "Says the topic cannot be taught properly in 50 minutes, narrows the goals and lists what moves to other lectures or reading, instead of cramming everything into the plan."}
