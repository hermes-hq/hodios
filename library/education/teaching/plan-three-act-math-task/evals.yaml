schema: 1
baseline: "Plan a three-act math task about {{topic}} for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rates
    vars:
      topic: rates and proportional reasoning
      grade_level: Grade 7
      duration_minutes: 60
    assert:
      - {type: contains-all, value: ["## Act one", "## Act two", "## Act three", "## Sequels"]}
      - {type: llm-rubric, value: "Act one scene hides the numbers; students give too-low, too-high and best-guess estimates; act two lists information students would request with consistent example values and a correct worked solution using rates; sequels extend the maths; the timing table sums to 60."}
  - name: edge-given-idea
    vars:
      topic: volume of cylinders
      grade_level: Year 9
      duration_minutes: 50
      idea: "filling a cylindrical vase from a jug"
    assert:
      - {type: llm-rubric, value: "Builds the task around filling a cylindrical vase, the calculation uses V = pi r^2 h correctly with consistent example values, and the reveal discusses why the real result differs (e.g. vase thickness, measurement error)."}
  - name: negative-numbers-in-scene
    vars:
      topic: area of rectangles
      grade_level: Grade 3
      duration_minutes: 45
    assert:
      - {type: llm-rubric, value: "The act one scene does not show the dimensions; students must ask for them in act two; the maths stays at Grade 3 level (no formulas beyond counting or multiplying side lengths)."}
