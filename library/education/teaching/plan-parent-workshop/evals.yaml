schema: 1
baseline: "Plan a parent workshop on {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phonics-reception
    vars:
      topic: how we teach phonics in Reception
      audience: "Parents of 4-5 year olds; many speak Urdu or Polish; several work shifts."
      minutes: 45
    assert:
      - {type: llm-rubric, value: "States outcomes for parents, offers more than one timing and interpreters for Urdu and Polish, plans a 45-minute run of show with talking kept short, includes parents trying pure sounds and blending, a one-page plain-language handout flagged for checked translation, and a follow-up for those who could not attend."}
  - name: edge-teen-exam-stress
    vars:
      topic: supporting your teenager through GCSE exams
      minutes: 60
    assert:
      - {type: llm-rubric, value: "Adapts to parents of teenagers with practical revision and wellbeing support, includes signs of excessive stress and who to contact in school, avoids implying parents must teach content, and keeps activities hands-on rather than a lecture."}
  - name: negative-jargon-lecture
    description: "Teacher adds: 'I'll just present our 40-slide maths calculation policy, it explains everything.'"
    vars:
      topic: the written methods we use for multiplication
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Recommends replacing the long slide presentation with a short explanation and hands-on practice of the methods, keeps jargon out, and provides the plan with parents trying calculations themselves."}
