schema: 1
baseline: "Plan a CPA maths lesson on {{concept}} for {{year_group}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-division-remainders
    vars:
      concept: "Dividing a 2-digit number by a 1-digit number with remainders"
      year_group: "Year 4"
      prior_knowledge_and_resources: "Know times tables to 10x10, can divide without remainders using arrays. Some write the remainder bigger than the divisor. We have base 10 and counters. 60 minutes."
    assert:
      - {type: llm-rubric, value: "Uses base 10 or counters to share or group, a matching pictorial model such as grouping on a number line or place value chart, links each symbol in e.g. 47 ÷ 5 = 9 r 2 to the picture, addresses the remainder-larger-than-divisor misconception, gives a stem sentence, and all arithmetic is correct."}
  - name: edge-broad-concept
    vars:
      concept: "Fractions"
      year_group: "Year 5"
    assert:
      - {type: llm-rubric, value: "Says 'fractions' is too broad for one lesson, picks and states a first-lesson focus, suggests common manipulatives such as fraction tiles with a drawn alternative since resources were not given, and keeps examples correct."}
  - name: negative-objects-only-for-weak
    vars:
      concept: "Adding two 2-digit numbers with regrouping"
      year_group: "Year 3"
      prior_knowledge_and_resources: "Only the low group gets Dienes, the rest go straight to column method."
    assert:
      - {type: llm-rubric, value: "Explains that all pupils benefit from seeing the concrete and pictorial link to the column method, plans the regrouping exchange with Dienes for everyone at least in the modelling, and maps the exchange to the carried digit."}
