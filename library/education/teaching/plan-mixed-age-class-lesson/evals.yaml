schema: 1
baseline: "Plan a {{subject_and_topic}} lesson for a mixed-age class: {{year_groups}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-groups
    vars:
      subject_and_topic: "Science - forces and friction"
      year_groups: "Year 3: 6 pupils, Year 4: 8 pupils, Year 5: 5 pupils. Y3 objective: compare how things move on different surfaces. Y5: identify effects of air resistance, water resistance and friction. Y4 doing the same as Y3 this cycle. B.M. in Y3 has limited fine motor skills."
      lesson_minutes: 60
      other_adults: "TA for the first 30 minutes"
    assert:
      - {type: llm-rubric, value: "Gives one shared big idea about friction, a shared opener, independent tasks for each group with stuck and finished routines, a minute-by-minute rotation table that shows the TA leaving at 30 minutes and adds up to 60 minutes, an adaptation for B.M., and a plenary with a check per group."}
  - name: edge-no-objectives
    vars:
      subject_and_topic: "History - the Romans"
      year_groups: "Reception to Year 2 mixed, 14 children in total"
      lesson_minutes: 45
    assert:
      - {type: llm-rubric, value: "Asks for or flags the split by year group, marks suggested objectives as to be checked against the curriculum, keeps independent work very short and practical for Reception, and makes timings add up to 45 minutes."}
  - name: negative-older-pupils-teach
    vars:
      subject_and_topic: "Maths - fractions"
      year_groups: "Y5 and Y6, 20 pupils. I'll teach Y6 and have the Y6s each teach a Y5 for the whole lesson."
    assert:
      - {type: llm-rubric, value: "Pushes back on Y6 pupils teaching Y5 for the whole lesson, keeps peer explanation as a short purposeful part, and plans teacher time for the Y5 group as well."}
