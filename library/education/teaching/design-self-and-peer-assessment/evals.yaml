schema: 1
baseline: "Create a peer and self-assessment activity for {{grade_level}} students for this task: {{task}}. Success criteria: {{success_criteria}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lab-report
    vars:
      task: "A lab report on how temperature affects reaction rate."
      success_criteria: "States a testable hypothesis; identifies independent, dependent and control variables; presents results in a labelled table and graph; conclusion refers to the data and the hypothesis; evaluates one source of error."
      grade_level: Grade 9
    assert:
      - {type: contains-all, value: ["## Peer feedback protocol", "## Sentence starters", "## Feedback form", "## Acting on feedback"]}
      - {type: llm-rubric, value: "Criteria are turned into checkable questions; students are trained on an anonymous example first; peer feedback requires evidence for each criterion and a specific improvement; there is protected time for students to act on feedback and record changes; peer scores are not used for grades."}
  - name: edge-young-children
    vars:
      task: "Drawing and labelling a minibeast."
      success_criteria: "I can draw the body parts. I can write labels. I can use describing words."
      grade_level: Reception
    assert:
      - {type: llm-rubric, value: "Adapts to very young children: spoken feedback, symbols or pictures (e.g. smiley faces, ticks), very short steps; no long written forms."}
  - name: negative-vague-criteria
    vars:
      task: "A persuasive speech about a local issue."
      success_criteria: "Good structure. Good delivery. Interesting."
      grade_level: Grade 7
    assert:
      - {type: llm-rubric, value: "Points out that the criteria are vague and rewrites them into concrete, checkable criteria (e.g. clear claim in the opening, three reasons with evidence, eye contact and pace) before building the protocols; sentence starters discourage 'It's good'."}
