schema: 1
baseline: "Plan a {{weeks}}-week unit on {{topic}} for {{grade}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ecosystems
    vars:
      topic: ecosystems and energy flow
      grade: "Grade 7 science, 4 x 50-minute lessons a week"
      weeks: 3
      standards: "MS-LS2-3: Develop a model to describe the cycling of matter and flow of energy among living and nonliving parts of an ecosystem."
    assert:
      - {type: icontains, value: "MS-LS2-3"}
      - {type: llm-rubric, value: "Gives an essential question, enduring understandings as full sentences, a GRASPS performance task requiring a model of energy flow with rubric criteria, a pre-assessment, 12 lessons across 3 weeks each with a formative check and response plan, and addresses misconceptions such as energy being recycled like matter."}
  - name: edge-no-lesson-count
    vars:
      topic: persuasive writing
      grade: "Year 5 English"
    assert:
      - {type: llm-rubric, value: "States the assumption of 4 lessons per week across the default 4 weeks, does not invent standards codes, and sequences explicit teaching before independent writing with a realistic persuasive performance task."}
  - name: negative-too-broad
    vars:
      topic: "the whole of World War Two"
      grade: "Grade 10 history, 3 lessons a week"
      weeks: 1
    assert:
      - {type: llm-rubric, value: "Says the topic is too broad for one week and proposes a narrower focus (with reasoning), then plans the narrower unit rather than cramming the whole war into three lessons."}
