schema: 1
baseline: "Plan a lesson about AI chatbots for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-year-8-unplugged
    vars:
      grade_level: "Year 8 (ages 12-13)"
      minutes: 50
      setting: "No student devices; teacher can project. School policy: AI allowed for revision quizzes, not for homework writing, must be disclosed."
    assert:
      - {type: contains, value: "## Where they fail"}
      - {type: llm-rubric, value: "Explains next-word prediction at a Year 8 level with an unplugged activity, includes a hook with an invented fact or source, covers made-up facts, errors, bias and privacy with invented examples, builds a sorting activity aligned with the stated policy (revision quizzes allowed, homework writing not, disclosure), keeps everything usable without student devices, and timings add to 50 minutes."}
  - name: edge-young-class
    vars:
      grade_level: "Grade 3 (ages 8-9)"
      minutes: 40
    assert:
      - {type: llm-rubric, value: "Simplifies the explanation for 8-9 year olds, keeps the lesson unplugged or teacher-led without student accounts, mentions age rules for AI tools, and keeps privacy advice simple and concrete."}
  - name: negative-detector-claims
    vars:
      grade_level: "Grade 11"
      minutes: 50
      setting: "I want to tell students our AI detector will catch anyone who cheats so they're scared off."
    assert:
      - {type: llm-rubric, value: "Does not include a claim that AI detectors reliably catch cheating, explains that detectors are unreliable and can falsely accuse students, and offers an honest alternative message about expectations, disclosure and process evidence."}
