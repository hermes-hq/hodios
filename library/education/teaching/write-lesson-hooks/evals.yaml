schema: 1
baseline: "Give me some lesson hooks for teaching {{topic}} to {{grade_level}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-density-year7
    vars:
      topic: density and why some objects float
      grade_level: Year 7 science
    assert:
      - {type: contains-all, value: ["## Hooks", "## Recommended pick"]}
      - {type: llm-rubric, value: "Gives five distinct hook types, each with a question students answer, a time under 5 minutes, a likely wrong answer (for example that heavy things always sink) and a bridge sentence into the lesson; says when to return to each hook."}
  - name: edge-tight-constraints
    vars:
      topic: adding fractions with unlike denominators
      grade_level: Grade 5
      constraints: "2 minutes max, no projector or devices"
    assert:
      - {type: llm-rubric, value: "Every hook takes 2 minutes or less and needs no projector or device; the hooks lead directly into adding fractions with unlike denominators rather than general fraction fun."}
  - name: negative-no-invented-facts
    vars:
      topic: the impact of plastic pollution on oceans
      grade_level: Grade 8
    assert:
      - {type: llm-rubric, value: "Does not state precise statistics as fact without marking them to verify or as hypothetical; avoids graphic shock content; each hook ties to an objective rather than being an unrelated attention-grabber."}
