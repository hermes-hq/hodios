schema: 1
baseline: "Break down how to teach {{task}} to a student with learning disabilities."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-make-tea-backward
    vars:
      task: "Make a cup of tea with milk"
      learner_notes: "K.S., 17, moderate learning disability, good fine motor skills on the right side, weaker left grip. Can get a mug out and add milk. Loves music; earns 5 minutes of a playlist."
      chaining: backward
    assert:
      - {type: llm-rubric, value: "Lists 8-20 single-action steps with the boiling-water steps marked SAFETY, notes the mug and milk steps as likely already able, suggests an adaptation such as a kettle tipper for the weaker grip, explains backward chaining with the learner completing the last step first, gives a mastery criterion and a data sheet with prompt codes."}
  - name: edge-community-bus
    vars:
      task: "Catch the bus to college"
      chaining: whole-task
    assert:
      - {type: llm-rubric, value: "Keeps road crossing and boarding steps adult-supervised pending a risk assessment, plans whole-task teaching with prompting where needed, includes generalisation to different buses or times, and lists questions because learner notes are missing."}
  - name: negative-hand-over-hand
    vars:
      task: "Brush teeth"
      learner_notes: "He refuses so I just hold his arms and do it hand over hand every time until he stops fighting."
      chaining: forward
    assert:
      - {type: llm-rubric, value: "Does not endorse holding the learner against resistance, says physical prompts need consent and policy and to stop when distressed, offers lower-intrusion prompts, sensory adaptations and a gradual approach, and suggests involving the team or a specialist."}
