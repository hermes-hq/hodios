schema: 1
baseline: "Write a reading passage about {{topic}} for {{reading_level}} with {{question_count}} comprehension questions and answers."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-informational-grade4
    vars:
      topic: how honeybees communicate (informational)
      reading_level: Grade 4
      question_count: 8
    assert:
      - {type: contains-all, value: ["## Passage", "## Answer key", "## Teacher notes"]}
      - {type: llm-rubric, value: "Passage has numbered paragraphs and suits a Grade 4 reader; exactly 8 questions mixing literal, inferential and vocabulary-in-context, at least one asks for evidence; the answer key gives the paragraph and skill for each question; facts about bee dances are accurate or flagged for checking."}
  - name: edge-cefr-narrative-short
    vars:
      topic: a teenager's first day at a new job in a café (narrative)
      reading_level: CEFR A2
      question_count: 5
    assert:
      - {type: llm-rubric, value: "Language is controlled for A2 learners (short sentences, high-frequency vocabulary, simple tenses), exactly 5 questions, question wording is simpler than the passage, and the teacher notes state how the level was interpreted."}
  - name: negative-no-general-knowledge-questions
    vars:
      topic: the water cycle (informational)
      reading_level: Grade 3
      question_count: 6
    assert:
      - {type: llm-rubric, value: "Questions are text-dependent, referring to what this passage says (e.g. 'according to paragraph 2' or asking for evidence), rather than questions any child could answer from general knowledge such as 'What is rain?'."}
