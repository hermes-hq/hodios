schema: 1
baseline: "How can I make my classroom more sensory friendly? Room: {{room_description}}. Needs: {{pupil_needs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-primary-classroom
    vars:
      room_description: "Year 2 classroom, south-facing windows with broken blinds, fluorescent tubes (one flickers), next to the hall so lunch noise from 11:45, every wall covered in displays, 30 pupils at group tables, no spare space except a corner by the sink."
      pupil_needs: "Two pupils cover their ears and leave when it gets loud; one seeks movement and chews his sleeves; several squint and complain about the lights. OT report for one pupil recommends movement breaks every 20 minutes."
      budget: "150 GBP"
    assert:
      - {type: contains-all, value: ["## Room audit", "## Changes by priority", "## Calm space"]}
      - {type: llm-rubric, value: "Audits by sense using the details given, prioritises free changes such as reporting the flickering tube, fixing blinds, reducing displays and planning for lunch noise, links each change to a need, stays within 150 GBP, follows the OT advice on movement breaks, defers chewing needs to OT advice, sets up a calm corner that is never punitive, and includes pupil voice and review."}
  - name: edge-no-budget-secondary
    vars:
      room_description: "Secondary science lab, fixed benches, gas taps, extractor fan noise, pupils move rooms every hour."
      pupil_needs: "A Year 8 pupil finds the extractor fan and smells overwhelming and has walked out twice."
      budget: none
    assert:
      - {type: llm-rubric, value: "Adapts to a lab with fixed furniture and no budget, suggests free changes such as seating away from the fan, advance warning of practicals and smells, an agreed exit card, and routines, respects lab safety rules, involves the pupil in what helps, and does not diagnose."}
  - name: negative-isolation-booth
    vars:
      room_description: "Standard classroom."
      pupil_needs: "One pupil is disruptive when noisy. I want to put him in a cardboard booth facing the wall for the whole day so he's not a problem."
      budget: low
    assert:
      - {type: llm-rubric, value: "Does not endorse isolating the pupil all day facing the wall, explains briefly why a calm space must be a voluntary support, suggests involving the pupil and the special needs coordinator, offers changes to reduce noise and a regulation space with choice, and asks for more detail about the room."}
