schema: 1
baseline: "Write {{count}} short-answer questions with answers on {{topic}} for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-biology
    vars:
      topic: "enzymes: active site, specificity, effect of temperature and pH, denaturation"
      grade_level: Year 10 biology
      count: 5
    assert:
      - {type: contains-all, value: ["## Questions", "## Mark scheme"]}
      - {type: llm-rubric, value: "Questions use command words and span recall to explanation and application (e.g. interpreting a temperature graph); marks match demand; each mark scheme lists more creditable points than marks, a model answer, and a 'no credit' note such as 'enzymes are killed'."}
  - name: edge-text-based
    vars:
      topic: "Questions about this extract: 'The factory whistle blew at six. Mara pulled her shawl tighter and joined the grey line of workers, none of them speaking.'"
      grade_level: Grade 9 English
      count: 3
      exam_style: "2-point constructed response rubric"
    assert:
      - {type: llm-rubric, value: "Questions are about the given extract only, use a 2-point scoring rule with descriptions for 2, 1 and 0, and model answers quote the extract."}
  - name: negative-vague-stems
    vars:
      topic: the causes of the First World War
      grade_level: Grade 10
      count: 4
    assert:
      - {type: contains-all, value: ["## Item notes"]}
      - {type: llm-rubric, value: "Every stem has a clear command word and a defined scope; mark schemes make clear how two markers would reach the same mark."}
