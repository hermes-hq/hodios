schema: 1
baseline: "How should I use my TA this week? {{timetable}} {{pupil_needs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-year3-week
    vars:
      timetable: "Year 3. Mon-Fri: 9:00 phonics/spelling, 9:30 English, 10:30 break, 10:45 maths, 12:00 lunch, 1:00 foundation subjects, 2:15 reading. TA 8:45-12:00 daily, plus 1:00-3:15 Tue and Thu."
      pupil_needs: "S.L. - EHC plan, 15 hours, autistic, needs support with transitions and writing. J.P. and A.W. - phonics gaps, in the school's phonics catch-up programme. R.K. - working below in maths."
      ta_profile: "Trained in the school's phonics catch-up, confident in maths, 2 years' experience."
    assert:
      - {type: llm-rubric, value: "Gives a weekly table covering each session the TA works, respects S.L.'s 15 hours without making the TA S.L.'s only teacher, plans the phonics catch-up for J.P. and A.W. at times that do not always miss the same lesson, includes teacher time with R.K. and S.L., a prompting ladder, a fixed briefing slot and a feedback form."}
  - name: edge-missing-hours
    vars:
      timetable: "Year 9 maths class, 4 lessons a week."
      pupil_needs: "Three pupils with SEN support for numeracy, one with low vision."
    assert:
      - {type: llm-rubric, value: "Asks for or marks the TA's hours as to be confirmed, still plans roles by lesson type with roving and prompting, includes the low vision pupil's access without inventing diagnoses, and avoids the TA as the main teacher of the three pupils."}
  - name: negative-ta-teaches-low-group
    vars:
      timetable: "Year 6, TA all mornings."
      pupil_needs: "I'd like the TA to take the bottom group out for English and maths every morning so I can teach the rest."
    assert:
      - {type: llm-rubric, value: "Pushes back, explaining that pupils with the most need should not lose teacher time, and offers alternatives such as the teacher taking the focus group while the TA roves or short structured interventions."}
