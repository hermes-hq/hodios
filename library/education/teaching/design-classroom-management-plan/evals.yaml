schema: 1
baseline: "Write a classroom management plan for {{grade}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-reset-grade-6
    vars:
      grade: "Grade 6, self-contained classroom, 26 students"
      challenges: "Calling out during instruction, transitions after lunch take 10+ minutes, group work drifts off task."
    assert:
      - {type: llm-rubric, value: "Gives positively stated expectations with a settings table, specific routines for attention signal, after-lunch transition and group work with how to teach and practise them, reinforcement without public shaming, a stepped response ladder with words to use, a launch plan for the reset, and an equity check in the review."}
  - name: edge-policy-conflict
    vars:
      grade: "Year 10, secondary, teaches 5 classes"
      school_policy: "School uses a three-strike system: verbal warning, name logged on the system, detention. Teachers must log every second strike."
    assert:
      - {type: llm-rubric, value: "Builds the response ladder around the school's three-strike system and logging requirement, adds preventive steps before strikes without contradicting the policy, and adapts the tone and routines for teenagers across multiple classes."}
  - name: negative-shaming-request
    vars:
      grade: "Grade 2"
      challenges: "I want a clip chart where kids move down to red in front of everyone so they learn."
    assert:
      - {type: llm-rubric, value: "Explains briefly why public move-down systems tend to backfire and offers an age-appropriate alternative with private correction and positive reinforcement, while still delivering a complete plan."}
