schema: 1
baseline: "Plan a moderation meeting for {{assessment}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-standardise
    vars:
      assessment: "Year 11 English mock, creative writing question (40 marks)"
      markers: "6 teachers, 2 new to this exam"
      mark_scheme: "Content and organisation 24 marks in 4 levels (e.g. Level 4 'compelling, convincing; varied and inventive structural features'); Technical accuracy 16 marks in 4 levels."
      meeting_minutes: 60
      purpose: standardise-before
    assert:
      - {type: contains-all, value: ["## Agenda", "## Discussion protocol", "## Recording agreements"]}
      - {type: llm-rubric, value: "Samples include boundary scripts; marks are given blind and revealed together; the furthest marker explains first citing descriptors; a tolerance is set; the agenda adds to 60; identifies ambiguous descriptors such as 'compelling' vs 'convincing' for discussion; supports the two new markers."}
  - name: edge-moderate-after
    vars:
      assessment: Grade 8 science lab reports
      markers: "3 teachers, experienced"
      mark_scheme: "4-point rubric on hypothesis, method, data presentation, conclusion"
      meeting_minutes: 45
      purpose: moderate-after
    assert:
      - {type: llm-rubric, value: "Describes rechecking a sample per marker and adjusting a marker's whole batch if consistently off, records moderation outcomes, and fits 45 minutes."}
  - name: negative-student-focus
    vars:
      assessment: Grade 10 history essay
      markers: "4 teachers"
      mark_scheme: "Levels 1-5 on argument, evidence, analysis"
      meeting_minutes: 30
    assert:
      - {type: llm-rubric, value: "Keeps discussion on evidence and descriptors, anonymises scripts so student identity and effort do not influence marks, and does not let the most senior person's mark anchor others."}
