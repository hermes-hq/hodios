schema: 1
baseline: "Write an ILP for a learner on {{course}}: {{initial_assessment}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-functional-english
    vars:
      initial_assessment: "R.O., 42, care worker. Initial assessment Entry 3 writing, Level 1 reading. Writes in long run-on sentences, no paragraphs, spelling OK. Says: 'I want to write care notes without my manager correcting them, and maybe go for senior carer.' Works shifts, can miss sessions. Declared mild dyslexia, uses phone spellcheck."
      course: "Functional Skills English Level 1, 30 weeks, Tuesday evenings"
      review_weeks: 6
    assert:
      - {type: llm-rubric, value: "Links the main goal to care notes and senior carer, writes three or four first-person SMART targets about sentence boundaries and paragraphs with how each is checked, includes support for missed shifts and the declared dyslexia, sets review placeholders every six weeks and uses R.O.'s quote."}
  - name: edge-non-accredited
    vars:
      initial_assessment: "M.B., 71, never used email. Wants to video call grandchildren in Canada. Nervous, arthritis in hands."
      course: "Confidence with Computers, 10 weeks, non-accredited"
      review_weeks: 3
    assert:
      - {type: llm-rubric, value: "Recognises non-accredited progress against the starting point, sets small practical targets such as making a video call, includes adjustments for arthritis such as a mouse or tablet stylus without diagnosing, and uses an adult respectful tone."}
  - name: negative-qualification-targets
    vars:
      initial_assessment: "Learner needs to pass. Targets: complete units 1-6."
      course: "Level 2 maths"
    assert:
      - {type: llm-rubric, value: "Does not just restate units as targets, says starting levels and the learner's goal are missing, asks for them, and marks any draft targets as to be agreed with the learner."}
