schema: 1
baseline: "Make a knowledge organiser for {{unit}} for {{year_group}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-norman-conquest
    vars:
      unit: "The Norman Conquest (history)"
      unit_content: "Lessons: claimants to the throne in 1066 (Harold Godwinson, William of Normandy, Harald Hardrada, Edgar Aetheling); Battle of Stamford Bridge 25 Sept 1066; Battle of Hastings 14 Oct 1066; why William won (luck, leadership, tactics - feigned retreat); William crowned 25 Dec 1066; Harrying of the North 1069-70; motte and bailey castles; Domesday Book 1086; feudal system. Key words: claimant, heir, fyrd, housecarl, feigned retreat, motte, bailey, feudal system, tenant-in-chief, Domesday."
      year_group: "Year 7"
    assert:
      - {type: llm-rubric, value: "Includes numbered vocabulary with short pupil-friendly definitions, numbered core facts grouped logically, a timeline with the 1066, 1069-70 and 1086 dates exactly as given, a look-cover-write-check routine with five sample questions and answers, and adds no facts beyond the unit content."}
  - name: edge-too-much-content
    vars:
      unit: "Cell biology (GCSE science)"
      unit_content: "40 key terms including eukaryotic, prokaryotic, mitochondria, ribosome, chloroplast, diffusion, osmosis, active transport, mitosis, stem cells, magnification formula... plus 30 facts."
      year_group: "Year 10"
    assert:
      - {type: llm-rubric, value: "Cuts to about 10-15 terms and essential facts, includes the magnification formula as the structured element if relevant, and lists what was left out and why."}
  - name: negative-thin-content
    vars:
      unit: "Volcanoes"
      unit_content: "volcanoes"
      year_group: "Year 5"
    assert:
      - {type: llm-rubric, value: "Does not invent a full set of facts and dates as if from the scheme of work; asks for the unit content or clearly labels any suggested content as to be checked."}
