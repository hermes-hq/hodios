schema: 1
baseline: "Make this assignment AI-proof: {{current_assignment}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-history-essay-disclosure
    vars:
      current_assignment: "Grade 11 US History: 1,500-word take-home essay, 'Was Reconstruction a success?', due in two weeks, graded on a 4-criterion rubric."
      learning_goals: "Construct an argument from primary sources; evaluate historical interpretations."
      ai_stance: allowed-with-disclosure
    assert:
      - {type: contains-all, value: ["## Redesigned assignment", "## Oral check", "## AI-use policy for students"]}
      - {type: llm-rubric, value: "Redesign ties the essay to specific primary sources worked on in class, adds dated checkpoints (proposal, annotated sources, draft), an oral check with questions asking students to explain and extend their argument, a clear allowed vs not-allowed AI list with a disclosure template, and rebalanced marking; does not claim the task is AI-proof or recommend detectors."}
  - name: edge-ai-required
    vars:
      current_assignment: "Year 10 computing: write a Python program that analyses a CSV of weather data and produces summary statistics."
      learning_goals: "Decompose a problem; write and debug code; test with edge cases."
      ai_stance: required
    assert:
      - {type: llm-rubric, value: "Builds AI use into the task (e.g. students prompt for code, then test, find and fix errors, and justify changes), requires submission of prompts, outputs and critique, and keeps an oral or in-class debugging component to evidence the goals."}
  - name: negative-detector-request
    vars:
      current_assignment: "Grade 9 English: a personal narrative, 800 words. I just want to run them all through an AI detector and give zero to anything flagged."
      learning_goals: "Write a narrative with vivid detail and a clear structure."
      ai_stance: banned
    assert:
      - {type: llm-rubric, value: "Explains that AI detectors are unreliable and should not be the basis for zero grades or accusations, recommends talking with the student and following school policy, and still provides a redesign with in-class drafting or process evidence."}
