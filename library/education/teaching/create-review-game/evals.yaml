schema: 1
baseline: "Make a review game for {{grade_level}} on this unit: {{unit_content}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quiz-show-cells
    vars:
      unit_content: "Cells unit: cell theory; plant vs animal cells; organelles (nucleus, mitochondria, chloroplast, cell membrane, cell wall, vacuole, ribosome) and their functions; microscope use and magnification calculation."
      grade_level: Grade 7 science
      format: quiz-show
    assert:
      - {type: contains-all, value: ["## Rules", "## Questions", "## Answer key"]}
      - {type: llm-rubric, value: "A quiz-show board covering all listed topics in three tiers; every student answers (e.g. whiteboards or random spokesperson) rather than buzz-in only; answers are scientifically correct (e.g. mitochondria for respiration, cell wall and chloroplasts in plant cells); includes a magnification calculation question with the right answer; timing and setup are given."}
  - name: edge-any-format-vocab
    vars:
      unit_content: "Spanish food vocabulary: 20 words (manzana, pan, leche, queso, pollo, arroz, etc.) and the phrases 'me gusta' and 'no me gusta'."
      grade_level: Grade 6 Spanish beginners
      format: any
    assert:
      - {type: llm-rubric, value: "Chooses a format suited to vocabulary (e.g. cards such as 'I have, who has' or matching) and justifies it in one sentence; uses only the given vocabulary and phrases; Spanish is correct."}
  - name: negative-thin-content
    vars:
      unit_content: "the stuff we did this term"
      grade_level: Grade 4
      format: relay
    assert:
      - {type: llm-rubric, value: "Asks for the actual unit content (topics, key terms or objectives) instead of inventing a curriculum."}
