schema: 1
baseline: "Plan a close reading lesson on this text for {{grade_level}}: {{text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-short-passage
    vars:
      grade_level: Grade 8
      duration_minutes: 50
      text: "The house on Alder Street had stood empty for three winters. Its windows, once bright with the Reyes family's lamps, now reflected only the grey sky. Every morning Mrs. Okafor walked past it on her way to the bakery, and every morning she slowed, as if the house might speak. On the fourth winter a truck arrived. Boxes, a bicycle, a child's red boot. Mrs. Okafor did not slow that morning. She stopped."
    assert:
      - {type: contains-all, value: ["## Reading plan", "## Text-dependent questions", "## Written response"]}
      - {type: llm-rubric, value: "Plans three reads with different purposes; questions cite specific lines from the given passage and move from literal to craft (e.g. the shift from 'slowed' to 'stopped', the short fragment sentence) to inference; exemplar answers quote only the given text; the written response needs two pieces of evidence; timing adds to 50."}
  - name: edge-informational-focus
    vars:
      grade_level: Grade 11
      duration_minutes: 60
      focus: how the argument is built
      text: "Some argue that cities should ban cars from their centres. They point to cleaner air and safer streets. Yet a ban that ignores delivery drivers, disabled residents and night-shift workers simply moves the problem elsewhere. The better question is not whether to ban cars, but how to make walking, cycling and transit so good that fewer people need one."
    assert:
      - {type: llm-rubric, value: "Questions focus on argument structure (concession, counterargument with 'Yet', reframing in the final sentence) and are answerable from the text; the written response asks for a claim about how the argument works with quoted evidence."}
  - name: negative-no-personal-questions
    vars:
      grade_level: Grade 6
      duration_minutes: 45
      text: "When the river flooded, the village moved its school to the hill. Lessons happened under a tarp. Nobody complained about the rain, because everyone remembered the water."
    assert:
      - {type: llm-rubric, value: "The main question set contains no personal-connection questions like 'Have you ever...' or predictions; all quotations come from the given text and none are invented."}
