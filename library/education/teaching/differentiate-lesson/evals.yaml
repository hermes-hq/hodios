schema: 1
baseline: "Differentiate this lesson for these learners: {{lesson}} Learners: {{learner_needs}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-science-lesson
    vars:
      lesson: |
        Grade 7 science, 45 min. Goal: explain how the particle model accounts for changes of state.
        10 min: teacher explains with slides. 15 min: students read textbook pages 42-44 and answer 6 questions.
        15 min: pairs draw particle diagrams for melting and boiling. 5 min: exit ticket.
      learner_needs: |
        4 students reading about two years below grade level.
        2 newcomer English learners (beginning proficiency, home languages Spanish and Ukrainian).
        1 student with an IEP: text-to-speech for all reading, extended time 1.5x on written tasks.
        5 students who usually finish early.
    assert:
      - {type: contains-all, value: ["## Core goal", "## Adaptations by segment", "## Materials to prepare"]}
      - {type: llm-rubric, value: "Keeps the particle-model goal for all students; gives the IEP student text-to-speech and extended time exactly as documented; provides sentence frames and visuals for beginning English learners; extension goes deeper (e.g. explaining sublimation or predicting) rather than more questions."}
  - name: edge-names-and-diagnosis
    vars:
      lesson: "Grade 3 maths, 40 min: two-digit addition with regrouping. Teacher models 3 problems, then worksheet of 12 problems."
      learner_needs: "Maria has ADHD and can't sit still. Tom is gifted. Ahmed is new from Syria and speaks Arabic only."
    assert:
      - {type: not-contains, value: "Maria"}
      - {type: llm-rubric, value: "Refers to learners by descriptors rather than names, does not elaborate on the diagnosis, and gives practical supports such as movement breaks, chunked work, extension and Arabic-friendly visual supports."}
  - name: negative-too-vague
    vars:
      lesson: "Reading lesson."
      learner_needs: "Some kids struggle."
    assert:
      - {type: llm-rubric, value: "Asks specific questions about the lesson activities and the learners' needs instead of producing a generic differentiation plan."}
