schema: 1
baseline: "Write {{count}} multiple choice questions about {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-forces
    vars:
      topic: "Newton's first and second laws: balanced and unbalanced forces, F = ma, inertia, friction."
      count: 5
      level: "Grade 9 physics"
    assert:
      - {type: not-icontains, value: "all of the above"}
      - {type: llm-rubric, value: "Five items with complete stems, mostly application rather than recall, distractors based on real misconceptions (e.g. motion requires a net force, heavier objects have more inertia so fall faster), a rationale for every option, correct keys, and key positions spread across letters."}
  - name: edge-too-little-material
    vars:
      topic: "The capital of Australia is Canberra."
      count: 10
    assert:
      - {type: llm-rubric, value: "Writes far fewer than 10 items (or one) and explains the material cannot support 10 distinct non-trivial questions, rather than padding with near-duplicates or outside facts."}
  - name: negative-objective-alignment
    vars:
      topic: "Pasted notes on the causes and effects of the Dust Bowl in the 1930s US: drought, over-ploughing of the Great Plains, wheat prices, soil conservation, migration to California."
      learning_objectives: "Explain how farming practices made the drought's impact worse."
      count: 4
    assert:
      - {type: llm-rubric, value: "All items map to the given objective about farming practices and drought (not dates or trivia), the blueprint shows that alignment, and every distractor has a misconception rationale."}
