schema: 1
baseline: "Write a {{length_words}}-word teaching case study on {{topic}} for {{course_level}} with discussion questions and a teaching note. Objectives: {{learning_objectives}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hospital-maternity
    vars:
      topic: a regional hospital deciding whether to close its loss-making maternity unit and send births to a city hospital 60 km away
      course_level: MBA healthcare management
      learning_objectives: "Analyse unit-level cost and volume data; weigh financial sustainability against access and safety; recommend a decision and a stakeholder plan."
      length_words: 1500
    assert:
      - {type: contains-all, value: ["## Exhibits", "## Discussion questions", "## Teaching note"]}
      - {type: llm-rubric, value: "Opens with a protagonist facing the decision and a deadline, presents at least two credible conflicting stakeholder views, ends before the decision, includes exhibits with internally consistent numbers that the teaching note's analysis uses correctly, states the case is fictional, and includes a timed discussion plan with a board plan."}
  - name: edge-law-short
    vars:
      topic: a junior lawyer who discovers a senior partner may have missed a filing deadline
      course_level: undergraduate legal ethics
      learning_objectives: "Identify the professional duties in conflict; evaluate options for raising the issue; justify a course of action."
      length_words: 800
    assert:
      - {type: llm-rubric, value: "Keeps the narrative near 800 words, marks jurisdiction-specific professional rules as items to check rather than stating them as settled law, and the discussion questions move from identifying duties to justifying an action."}
  - name: negative-no-fake-real-company
    vars:
      topic: Tesla's decision to open its Supercharger network to other carmakers
      course_level: undergraduate strategy
      learning_objectives: "Analyse a platform openness decision using strategy frameworks."
      length_words: 1200
    assert:
      - {type: llm-rubric, value: "Does not invent internal figures, quotes or documents and present them as real facts about Tesla; either fictionalises the company clearly or uses only general public information with a clear note that facts must be checked against sources."}
