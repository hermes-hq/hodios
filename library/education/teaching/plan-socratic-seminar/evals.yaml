schema: 1
baseline: "Plan a Socratic seminar on {{text}} for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lottery-grade9
    vars:
      text: "'The Lottery' by Shirley Jackson"
      grade_level: Grade 9 English
      learning_goal: "Analyse how Jackson uses setting and tone to build tension and critique tradition."
      minutes: 45
    assert:
      - {type: contains-all, value: ["## Student preparation", "## Questions", "## Assessment"]}
      - {type: llm-rubric, value: "Has a ticket to enter, an opening question, 4 to 6 open interpretive core questions tied to passages with contrasting positions, and a closing question; timeline adds up to 45 minutes; the participation rubric scores quality of contribution and evidence, not the number of times a student speaks; mentions preparing students for the story's violent ending."}
  - name: edge-unknown-text
    vars:
      text: "Chapter 3 of our class novel, 'Riverbend Summer' (a local author's book)"
      grade_level: Grade 7
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Does not invent quotations or plot details for the unfamiliar book; uses passage placeholders and asks the teacher for an excerpt; still provides the full seminar structure fitted to 30 minutes."}
  - name: negative-no-talk-counting
    vars:
      text: "Martin Luther King Jr., 'Letter from Birmingham Jail' (excerpt)"
      grade_level: Grade 11 US History
      minutes: 50
    assert:
      - {type: llm-rubric, value: "The assessment does not grade students by counting how many times they spoke; it offers a route for quieter students such as observer notes or written reflection."}
