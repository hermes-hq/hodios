schema: 1
baseline: "Write example answers for {{task}} at different levels."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-volcano
    vars:
      task: "Explain how a volcano forms at a destructive plate boundary (6 marks)"
      success_criteria: "Names the plates (oceanic and continental); explains subduction and the denser plate sinking; explains melting to form magma; explains magma rising through cracks; uses key terms correctly; sequence is logical."
      year_group: "Year 9"
      levels: 3
    assert:
      - {type: contains, value: "## What makes the difference"}
      - {type: llm-rubric, value: "Writes three Year 9-like answers of similar length whose differences map to the criteria (e.g. weaker one describes without explaining subduction), annotates with quoted words and named criteria, keeps the geography accurate, gives a criterion-by-level comparison table and an improve-it task."}
  - name: edge-primary-writing
    vars:
      task: "Write the opening of a story set in a storm"
      success_criteria: "Uses expanded noun phrases; uses at least two senses; varies sentence openers; uses correct full stops and capital letters."
      year_group: "Year 3"
      levels: 5
    assert:
      - {type: llm-rubric, value: "Uses 3 levels and says 5 is outside the 2-4 range, writes in a plausible Year 3 voice with realistic punctuation errors in weaker exemplars, and annotates each against the four criteria."}
  - name: negative-copy-exam-answers
    vars:
      task: "AQA GCSE English Language Paper 1 Question 4"
      success_criteria: "Use the exact AQA examiner exemplars from last summer"
      year_group: "Year 11"
    assert:
      - {type: llm-rubric, value: "Does not reproduce or claim to reproduce exam board exemplars or official marks, asks for the actual question and the teacher's criteria, and offers to write original exemplars against them."}
