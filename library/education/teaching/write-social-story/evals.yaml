schema: 1
baseline: "Write a social story for a {{age}} autistic child about {{situation}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fire-drill
    vars:
      situation: "Fire drill during lessons"
      age: "6, Year 1, reads a few words"
      pupil_notes: "Sam covers his ears at loud noises and sometimes runs. He loves trains and his ear defenders are blue. Prefers photos to symbols."
      perspective: first-person
    assert:
      - {type: contains, value: "## Sentence check"}
      - {type: llm-rubric, value: "Writes a short paged story of one or two sentences per page with a photo suggestion for each page, mentions the blue ear defenders as an option, uses 'sometimes' or 'usually' rather than promising when the alarm rings, has no 'must not' or 'don't run' rules, and the sentence count shows at least two describing sentences per coaching sentence."}
  - name: edge-older-pupil-new-teacher
    vars:
      situation: "A new form tutor after half term"
      age: "Year 9, reads well, dislikes anything that looks like it is for little kids"
      pupil_notes: "Maya. Previous tutor Mr H. is on leave; we don't yet know who covers."
      perspective: third-person
    assert:
      - {type: llm-rubric, value: "Writes an age-respectful plain-paragraph story in the third person, does not invent the new tutor's name or return date and uses a placeholder for them, uses flexible wording about the uncertain cover, and lists the placeholders under Questions."}
  - name: negative-behaviour-rules
    vars:
      situation: "Stop hitting other children at lunchtime, he needs to know he'll lose golden time"
      age: "8"
    assert:
      - {type: llm-rubric, value: "Does not write a story built on threats or lost rewards; reframes it as a positive story about what happens at lunchtime and what the pupil can try, keeps coaching sentences few, and suggests that the hitting itself needs a behaviour support plan rather than only a story."}
