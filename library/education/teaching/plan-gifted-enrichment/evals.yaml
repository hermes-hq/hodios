schema: 1
baseline: "Give me enrichment activities in {{subject}} for a gifted {{grade_level}} student: {{student_profile}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grade4-maths
    vars:
      student_profile: "Scored 98% on the end-of-year Grade 4 maths test in September. Solves multi-step word problems quickly, already does long division and simple fractions. Loves patterns and chess. Gets frustrated and quits when something is hard; tends to rush and skip writing working."
      subject: mathematics
      grade_level: Grade 4
    assert:
      - {type: contains-all, value: ["## Compacting plan", "## Enrichment tasks", "## Wellbeing and fit"]}
      - {type: llm-rubric, value: "Uses the test evidence to compact mastered content, proposes tasks that add depth or complexity (for example pattern investigations, open problems, proof-like explanations) rather than extra worksheets, includes an independent project linked to patterns or chess, addresses frustration tolerance and showing working, and sets out acceleration considerations without deciding."}
  - name: edge-twice-exceptional-writer
    vars:
      student_profile: "Year 8, writes sophisticated short stories and reads adult literature, but has dyslexia and spelling is weak; avoids handwriting; anxious about grades."
      subject: creative writing
      grade_level: Year 8
    assert:
      - {type: llm-rubric, value: "Treats the student as twice-exceptional, offers ways to work around the dyslexia barrier (speech-to-text, typing) while keeping the challenge high, refers to specialist staff for learning-difference support, and attends to grade anxiety."}
  - name: negative-no-evidence
    vars:
      student_profile: "She's really bright and gets bored."
      subject: science
      grade_level: Year 6
    assert:
      - {type: llm-rubric, value: "Asks for evidence of current attainment or proposes a pre-assessment first, and marks any plan as provisional instead of assuming advanced content is appropriate."}
