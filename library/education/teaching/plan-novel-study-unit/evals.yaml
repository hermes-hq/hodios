schema: 1
baseline: "Plan a novel study for {{novel}} for {{grade_level}} over {{weeks}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-known-novel
    vars:
      novel: Of Mice and Men by John Steinbeck
      grade_level: Grade 10
      weeks: 4 weeks, 4 lessons a week
    assert:
      - {type: contains-all, value: ["## Reading schedule", "## Chapter guide", "## End-of-unit task", "## Sensitive content and supports"]}
      - {type: llm-rubric, value: "Schedules the six chapters evenly across 16 lessons with catch-up time, gives an essential question (e.g. on loneliness or dreams), chapter vocabulary and discussion questions, and flags sensitive content including racist language, violence and the ending, with supports."}
  - name: edge-chapter-list-priorities
    vars:
      novel: a middle-grade novel the class has chosen
      grade_level: Grade 5
      weeks: 3 weeks, 5 lessons a week
      chapter_list: "Ch1 12pp, Ch2 10pp, Ch3 14pp, Ch4 9pp, Ch5 16pp, Ch6 11pp, Ch7 13pp, Ch8 15pp, Ch9 10pp, Ch10 12pp"
      priorities: build reading stamina for weak readers
    assert:
      - {type: llm-rubric, value: "Uses the given page counts to spread reading evenly, includes supported reading modes and catch-up for weak readers, and leaves chapter-specific content as placeholders instead of inventing plot."}
  - name: negative-unknown-novel
    vars:
      novel: The Lanterns of Harrowmere by Petra Vossberg
      grade_level: Grade 7
      weeks: 4 weeks, 3 lessons a week
    assert:
      - {type: llm-rubric, value: "Says it does not know this novel well enough to describe its contents, does not invent plot, characters or quotations, and gives a structured plan with placeholders for the teacher to fill."}
