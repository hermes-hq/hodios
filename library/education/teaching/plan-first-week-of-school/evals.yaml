schema: 1
baseline: "Plan my first week of school for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grade2
    vars:
      grade_level: Grade 2
      class_context: "24 students, 6 multilingual learners, 2 new to the school, school values are Respect, Responsibility, Kindness."
      schedule: "Full days Monday to Friday, 8:30-3:00, specials 11:00-11:45 daily."
    assert:
      - {type: contains-all, value: ["## Routines to teach", "## Day-by-day plan", "## Family welcome message"]}
      - {type: llm-rubric, value: "Routines are written as observable steps with modelling and practice; daily plans respect the 11:00-11:45 specials block; expectations are co-created and linked to the three school values; includes support for multilingual and new students; family message is short and invites families to share about their child."}
  - name: edge-secondary-multiple-classes
    vars:
      grade_level: "Year 10 maths, five classes"
      schedule: "Three 50-minute lessons with each class this week."
    assert:
      - {type: llm-rubric, value: "Plans by lesson rather than full days, fits three 50-minute lessons, starts some real maths early, includes a non-graded diagnostic, and explains how to keep routines consistent across five classes."}
  - name: negative-inclusive-activities
    vars:
      grade_level: Grade 5
    assert:
      - {type: llm-rubric, value: "Avoids 'what I did on my summer holiday' style tasks or activities that expose family income or private details, and states any assumptions about the schedule."}
