schema: 1
baseline: "Help me set up literature circles for {{grade_level}} with {{class_size}} students over {{weeks}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-books
    vars:
      grade_level: Grade 6
      class_size: 27
      weeks: 4 weeks, 2 sessions a week
      books: "Book A (6 copies, easier), Book B (6 copies, on level), Book C (5 copies, on level), Book D (6 copies, harder), Book E (5 copies, harder)"
    assert:
      - {type: contains-all, value: ["## Roles", "## Schedule", "## Assessment"]}
      - {type: llm-rubric, value: "Forms about 5 to 6 groups that fit the copy counts, includes a book pass or ranking routine, roles with a plan to fade them, a fishbowl model discussion, discussion-skill minilessons and an assessment of the talk itself; fixes for a student who has not read."}
  - name: edge-class-notes
    vars:
      grade_level: Year 9
      class_size: 30
      weeks: 3 weeks, 3 sessions a week
      class_notes: "J.M. and T.R. should not be in the same group. Three students read well below age level. A.K. is new to English."
    assert:
      - {type: llm-rubric, value: "Respects the separation, plans support for the weaker readers and the student new to English (e.g. audio, accessible title, pre-teaching), and does not restate the notes in a judgemental way."}
  - name: negative-no-invented-titles
    vars:
      grade_level: Grade 4
      class_size: 24
      weeks: 5 weeks, 2 sessions a week
    assert:
      - {type: llm-rubric, value: "With no books given, offers criteria for choosing titles rather than presenting a list of specific titles and authors as the plan."}
