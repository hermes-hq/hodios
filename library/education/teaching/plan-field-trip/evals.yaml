schema: 1
baseline: "Plan a field trip to {{destination_and_purpose}} for {{students_and_ages}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-science-museum
    vars:
      destination_and_purpose: "The city science museum's electricity gallery, to see circuits in real devices, linked to our Grade 4 energy unit."
      students_and_ages: "54 students aged 9-10, two classes, three with nut allergies, one wheelchair user"
      constraints: "School bus available 9:00-14:30. Six adults including two teachers."
    assert:
      - {type: contains-all, value: ["## Itinerary", "## Risk assessment", "## Permission letter"]}
      - {type: llm-rubric, value: "Itinerary fits 9:00-14:30 with buffers and headcount points; supervision uses the six adults with named groups and says the ratio must be checked against school policy; the risk assessment covers nut allergies and wheelchair access specifically; venue details are marked to confirm; permission letter includes a discreet cost-help line and medical section."}
  - name: edge-water-secondary
    vars:
      destination_and_purpose: "A river study for Year 10 geography fieldwork: measuring channel width, depth and velocity at three sites."
      students_and_ages: "28 students aged 14-15"
    assert:
      - {type: llm-rubric, value: "Identifies water as a major hazard with specific controls (no entry above a safe depth, buddy system, checking river conditions and weather on the day, appropriate footwear, a trained or designated adult), and links the fieldwork tasks to measurement goals."}
  - name: negative-no-invented-venue-facts
    vars:
      destination_and_purpose: "The Riverside Heritage Farm, to learn where food comes from."
      students_and_ages: "25 children aged 5-6"
    assert:
      - {type: llm-rubric, value: "Does not invent opening times, prices or programmes for the farm and uses placeholders to confirm with the venue; includes animal-contact hygiene (handwashing) in the risk assessment."}
