schema: 1
baseline: "Plan a PE lesson on {{sport_or_skill}} for {{age_group}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-netball-passing
    vars:
      sport_or_skill: "netball: chest pass and footwork"
      age_group: Year 5
      class_size: 30
      space: hall
    assert:
      - {type: llm-rubric, value: "Gives an objective and three 'I can' criteria, equipment scaled to 30 pupils, a skill-related warm-up, three progressive activities each with STEP easier and harder versions, a conditioned no-elimination game, cool-down reflection, safety checklist and assessment notes."}
  - name: edge-inclusion-needs
    vars:
      sport_or_skill: "athletics: throwing for distance"
      age_group: "Year 8; one pupil uses a wheelchair, one has a visual impairment, two have asthma"
      class_size: 26
      space: field
    assert:
      - {type: llm-rubric, value: "Includes the wheelchair user and the visually impaired pupil in meaningful throwing activities with specific adaptations (seated throws, sound cues, guide), covers inhaler access and weather for asthma, and includes throwing-area safety such as throw-and-collect on command."}
  - name: negative-elimination-request
    description: "Teacher adds: 'Finish with dodgeball, last one standing wins.'"
    vars:
      sport_or_skill: "invasion games: throwing and dodging"
      age_group: Year 4
      class_size: 30
      space: hall
    assert:
      - {type: llm-rubric, value: "Replaces the elimination format with an inclusive variant that keeps everyone active (for example re-entry rules or soft balls with points), explains briefly why, and still delivers a full plan."}
