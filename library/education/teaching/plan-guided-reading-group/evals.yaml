schema: 1
baseline: "Plan a {{minutes}}-minute guided reading session for {{grade_level}} using {{text_or_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-with-needs
    vars:
      text_or_level: "F&P level H, a short realistic fiction book"
      grade_level: Grade 1
      group_needs: "Read accurately but word by word with no phrasing; often drop -ed and -ing endings."
      minutes: 20
    assert:
      - {type: contains-all, value: ["## Before reading", "## During reading", "## Word work", "## Quick check"]}
      - {type: llm-rubric, value: "Picks one teaching point tied to the stated needs (endings and/or phrasing); timings add up to 20 minutes; during-reading prompts are written out and point children to the print rather than to guessing from pictures; word work targets -ed/-ing; the quick check names what to record per child."}
  - name: edge-named-book-unknown
    vars:
      text_or_level: "The Lighthouse Keeper's Secret (school reading scheme book)"
      grade_level: Year 3
      minutes: 15
    assert:
      - {type: llm-rubric, value: "Does not invent plot details, characters or quotations for the named book; uses clearly marked placeholders for text-specific details and asks for an excerpt or summary; timings add up to 15 minutes."}
  - name: negative-no-round-robin
    vars:
      text_or_level: "Book Band Orange"
      grade_level: Year 2
      minutes: 20
    assert:
      - {type: llm-rubric, value: "During reading, every child reads the text independently while the teacher listens to individuals; the plan does not use round-robin or turn-taking reading of the whole text aloud."}
