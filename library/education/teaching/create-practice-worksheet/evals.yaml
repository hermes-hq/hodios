schema: 1
baseline: "Make a worksheet with {{item_count}} questions on {{skill}} for {{grade_level}}, with answers."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rounding-grade3
    vars:
      skill: rounding to the nearest 10 and 100
      grade_level: Grade 3
      item_count: 12
    assert:
      - {type: contains-all, value: ["## Worksheet", "## Answer key"]}
      - {type: llm-rubric, value: "Has a worked example, 12 practice items in three graduated sections with at least two formats, a spot-the-mistake item (e.g. rounding 450 or 35 incorrectly), an extension, and an answer key in which every rounding answer is correct (including halfway cases rounded up)."}
  - name: edge-secondary-science
    vars:
      skill: balancing chemical equations
      grade_level: Year 10
      item_count: 8
    assert:
      - {type: llm-rubric, value: "Exactly 8 practice items, progressing from simple equations to harder ones; every balanced equation in the key is correct with atoms conserved; the spot-the-mistake item shows a typical error such as changing subscripts instead of coefficients."}
  - name: negative-too-broad
    vars:
      skill: fractions
      grade_level: Grade 4
      item_count: 10
    assert:
      - {type: llm-rubric, value: "Narrows 'fractions' to one specific skill appropriate for Grade 4, says so in the teacher notes, and keeps all items on that skill rather than mixing unrelated fraction skills."}
