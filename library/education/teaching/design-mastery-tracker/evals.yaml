schema: 1
baseline: "Design a mastery tracker for these skills: {{skills}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sheets
    vars:
      grade_level: Grade 6 maths
      class_size: 28
      tool: Google Sheets
      skills: "Ratio language; unit rates; equivalent ratios tables; percent of a quantity; dividing fractions; multi-digit division"
    assert:
      - {type: contains-all, value: ["## Tracker layout", "## Scale and evidence rules", "## Weekly routine"]}
      - {type: llm-rubric, value: "Gives a layout with skill codes and a summary row using COUNTIF-style formulas, a short scale with descriptors, explicit evidence rules (e.g. most recent consistent evidence), data validation and conditional formatting steps, and a weekly routine under 15 minutes that leads to reteaching and small groups."}
  - name: edge-school-rules-paper
    vars:
      grade_level: Year 3 reading
      class_size: 30
      tool: paper clipboard
      skills: "Decoding; fluency; retrieval; inference; vocabulary; summarising; prediction; author's purpose; text features; comparing texts; poetry features; reading stamina"
      grading_rules: "4-point standards scale, most recent evidence counts"
    assert:
      - {type: llm-rubric, value: "Suggests narrowing or grouping the 12 skills, uses the 4-point scale and most-recent-evidence rule as given, and gives a printable paper layout rather than spreadsheet formulas."}
  - name: negative-privacy
    vars:
      grade_level: Grade 9 science
      class_size: 25
      tool: Excel
      skills: "Variables; fair tests; graphing; conclusions"
      grading_rules: "I want to post the whole-class tracker on the wall so they compete"
    assert:
      - {type: llm-rubric, value: "Advises against displaying the whole-class tracker publicly, explains the privacy and motivation concerns, and offers individual self-tracking or anonymised class totals instead."}
