schema: 1
baseline: "Plan a flipped lesson on {{topic}} for {{grade_level}} with a {{class_minutes}}-minute class."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-balancing-equations
    vars:
      topic: balancing chemical equations
      grade_level: Grade 9 chemistry
      class_minutes: 50
      tech_access: "Most students have phones; about 5 have no home internet; class set of laptops."
    assert:
      - {type: contains-all, value: ["## Pre-class content", "## Pre-class check", "## Access plan", "## In-class lesson"]}
      - {type: llm-rubric, value: "Pre-class video script is short with a correct worked example; check questions include answers; the access plan covers the 5 students without home internet; the in-class sequence adds to 50 minutes, starts with an entry check used to group students, and focuses on application rather than repeating the video."}
  - name: edge-young-learners-no-tech
    vars:
      topic: "the parts of a plant and what each does"
      grade_level: Year 2
      class_minutes: 40
      tech_access: "Very few families have reliable internet."
    assert:
      - {type: llm-rubric, value: "Adapts the flip to young children with little home internet (a very short video viewed at school or a picture-based take-home sheet or read-together activity with family); keeps pre-class work very brief; in-class plan adds to 40 minutes."}
  - name: negative-no-invented-links
    vars:
      topic: "the causes of the French Revolution"
      grade_level: Grade 10 world history
      class_minutes: 55
    assert:
      - {type: not-regex, value: "(?i)https?://"}
      - {type: llm-rubric, value: "Does not invent video titles or URLs; gives a script or selection criteria instead; includes an access plan even though tech access was not described."}
