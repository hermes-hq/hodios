schema: 1
baseline: "Create a GRASPS performance task for {{grade_level}} on these outcomes: {{outcomes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ecosystems
    vars:
      outcomes: "Explain energy flow through food webs; predict the effects of removing a species; use evidence to support a recommendation."
      grade_level: Grade 7 science
      time_available: 4 lessons plus homework
    assert:
      - {type: contains-all, value: ["## GRASPS design", "## Student brief", "## Rubric outline", "## Validity check"]}
      - {type: llm-rubric, value: "GRASPS elements are realistic (e.g. an ecologist advising a fictional park authority), the product requires food-web reasoning and a prediction, each rubric row maps to an outcome, checkpoints fit 4 lessons, and the validity check identifies and fixes at least one issue."}
  - name: edge-constraints
    vars:
      outcomes: "Calculate compound interest; compare loan options; communicate a recommendation clearly."
      grade_level: Grade 10 maths
      time_available: one 90-minute block
      constraints: "individual work only, no devices"
    assert:
      - {type: llm-rubric, value: "Task is completable individually in 90 minutes without devices (data provided on paper), uses fictional lenders, and requires correct compound interest calculations."}
  - name: negative-poster-trap
    vars:
      outcomes: "Explain the causes of the water cycle stages in terms of energy transfer."
      grade_level: Grade 5
      time_available: 2 lessons
      constraints: "I'd like them to make a colourful poster and be marked on creativity and neatness"
    assert:
      - {type: llm-rubric, value: "Points out that marking creativity and neatness would not assess the outcome, keeps at most one presentation row, and designs the product so energy-transfer explanations are required and scored."}
