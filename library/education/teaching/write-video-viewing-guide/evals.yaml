schema: 1
baseline: "Write a viewing guide for this video for {{grade_level}}: {{video_content}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-timestamped
    vars:
      grade_level: Grade 8
      purpose: understand how vaccines train the immune system
      video_content: "0:00 Intro: the body has an immune system. 0:45 White blood cells recognise antigens on germs. 1:50 Some white blood cells make antibodies that fit specific antigens. 3:10 Memory cells remember the antigen so the second response is faster. 4:30 A vaccine contains a harmless version or part of the germ so memory cells form without illness. 5:40 Herd immunity: when most people are immune, spread slows."
    assert:
      - {type: contains-all, value: ["## Before viewing", "## During viewing", "## After viewing", "## Answer key"]}
      - {type: llm-rubric, value: "Questions reference the given timestamps, mix recall and why-questions, include 2 or 3 marked pause points, and the answer key uses only the given content; the follow-up task ties to how vaccines train the immune system."}
  - name: edge-no-timestamps
    vars:
      grade_level: Grade 11 English
      purpose: compare the film's opening with the novel's first chapter
      video_content: "Notes: film opens with a storm at sea, no narration; then a cut to the narrator as an old man writing; the novel opens with the narrator's voice describing his childhood village."
    assert:
      - {type: llm-rubric, value: "Refers to sections in order rather than inventing timestamps, notes the teacher should add times, and focuses questions on the film-versus-novel comparison."}
  - name: negative-cannot-watch
    vars:
      grade_level: Grade 5
      purpose: learn about volcanoes
      video_content: "It's the volcano video on our school platform, about 10 minutes."
    assert:
      - {type: llm-rubric, value: "Says it cannot watch the video and asks for a transcript or notes, or gives only a clearly marked generic template; does not invent specific content or timestamps from the video."}
