schema: 1
baseline: "Design a {{weeks}}-week project-based learning unit for {{grade_level}} on: {{topic_and_standards}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ecosystems-grade7
    vars:
      topic_and_standards: "Ecosystems. MS-LS2-1 analyze data on resource availability and populations; MS-LS2-4 construct an argument that changes to physical or biological components of an ecosystem affect populations."
      grade_level: Grade 7 science
      weeks: 4
    assert:
      - {type: contains-all, value: ["## Driving question", "## Week-by-week plan", "## Assessment checkpoints"]}
      - {type: llm-rubric, value: "Driving question is open-ended and needs both standards to answer; the 4-week table has a milestone each week, critique and revision, and mini-lessons placed when needed; both standards are assessed individually, not only through the team product; includes roles and individual accountability."}
  - name: edge-short-project-young-students
    vars:
      topic_and_standards: "Community helpers and needs and wants (social studies). Speaking and listening: take part in collaborative conversations."
      grade_level: Grade 1
      weeks: 2
    assert:
      - {type: llm-rubric, value: "Scope fits two weeks and six-year-olds: simple product and audience (e.g. families or another class), adult-supported roles, short work periods, and pictorial or oral assessment rather than written reports."}
  - name: negative-no-dessert-project
    vars:
      topic_and_standards: "The American Revolution: causes, key events and perspectives of different groups."
      grade_level: Grade 8
      weeks: 3
    assert:
      - {type: llm-rubric, value: "The content is learned through the project (inquiry and mini-lessons during the weeks), not taught first with a poster or diorama made at the end; individual assessment of historical understanding is included."}
