schema: 1
baseline: "Plan an outdoor {{subject}} lesson for {{age_group}} on {{objective}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-maths-measurement
    vars:
      subject: maths
      objective: measure and compare lengths in metres and centimetres
      age_group: Year 3, 28 pupils, one teaching assistant
      site: school-grounds
    assert:
      - {type: llm-rubric, value: "Gives success criteria and why outdoors helps (full-scale measuring), a timed sequence with pair or group tasks and adult roles, rehearsed boundary and gather routines, a risk table, rain and heat alternatives, and how measurements are recorded and used back in class."}
  - name: edge-woodland-science
    vars:
      subject: science
      objective: identify and classify invertebrates using a simple key
      age_group: ages 9-10, 30 pupils including one wheelchair user and a pupil with a bee-sting allergy
      site: woodland
    assert:
      - {type: llm-rubric, value: "Notes off-site visit procedures, consent and ratios as items to check, includes the wheelchair user with accessible paths and tasks, addresses the sting allergy with medication and adult responsibility, covers handling and returning animals humanely, and uses placeholders for site facts."}
  - name: negative-missing-objective
    vars:
      subject: English
      objective: ""
      age_group: Year 5
      site: park
    assert:
      - {type: llm-rubric, value: "Asks for the curriculum objective (perhaps suggesting examples) before planning, rather than producing a generic outdoor English lesson."}
