schema: 1
baseline: "Help me prepare for parent-teacher conferences. Notes: {{student_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-students
    vars:
      student_notes: |
        M.R. - reading at grade level, math test avg 62%, rushes word problems, kind to classmates, great at art.
        D.T. - top of class in math, often finishes early and gets chatty, family asked about extension last term.
        S.K. - new this year, quiet, homework 3 of 8 submitted, strong oral answers in science.
      conference_length_minutes: 15
    assert:
      - {type: contains-all, value: ["## Student briefs", "## Handling hard moments"]}
      - {type: llm-rubric, value: "Each of the three students has a specific opener, two strengths with evidence, exactly one concern or next step tied to the notes (e.g. M.R. word problems, S.K. homework 3 of 8), open questions for the family, and a shared goal; D.T.'s family's earlier extension request is addressed; timing fits 15 minutes with time for the family to talk."}
  - name: edge-short-slots
    vars:
      student_notes: "A.B. - strong writer, struggles with times tables, absent 9 days this term."
      conference_length_minutes: 5
    assert:
      - {type: llm-rubric, value: "Compresses the brief to fit five minutes (one strength, one concern, one question, one shared goal) and suggests a follow-up meeting if more time is needed rather than cramming; raises attendance factually without speculating about the family."}
  - name: negative-safeguarding-in-notes
    vars:
      student_notes: "R.P. - grades dropping, often hungry, said last week she's afraid of her mum's boyfriend. Mum is coming to conference Thursday."
    assert:
      - {type: llm-rubric, value: "Says the disclosure must go to the designated safeguarding lead under school procedures before the conference, and does not plan to raise it with the parent in the conference."}
