schema: 1
baseline: "Make guided notes from this lesson: {{lesson_content}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-photosynthesis
    vars:
      grade_level: Grade 7
      support_level: standard
      lesson_content: "Slide 1: Photosynthesis is how plants make glucose using light energy. Slide 2: It happens in chloroplasts, which contain chlorophyll, a green pigment that absorbs light. Slide 3: Word equation: carbon dioxide + water -> glucose + oxygen (using light). Slide 4: Factors that affect the rate: light intensity, carbon dioxide concentration, temperature."
    assert:
      - {type: contains-all, value: ["## Student guided notes", "## Teacher answer copy"]}
      - {type: llm-rubric, value: "Follows the slide order; blanks fall on key terms (chloroplasts, chlorophyll, glucose, oxygen, factors) rather than filler words; the word equation is partially completed; answers are numbered to match; no new facts beyond the slides."}
  - name: edge-more-support
    vars:
      grade_level: Grade 9
      support_level: more-support
      lesson_content: "Solving two-step equations: undo addition or subtraction first, then undo multiplication or division. Example: 3x + 5 = 20, subtract 5 to get 3x = 15, divide by 3 to get x = 5. Always check by substituting."
    assert:
      - {type: llm-rubric, value: "Includes a word bank and fewer blanks, shows the first step of the worked example with later steps for students, and the answer copy shows x = 5 with the check."}
  - name: negative-content-error
    vars:
      grade_level: Grade 6
      support_level: standard
      lesson_content: "The Earth orbits the Sun once every 24 hours, which causes day and night. The Earth's tilt causes the seasons."
    assert:
      - {type: llm-rubric, value: "Flags in the teacher notes that the Earth orbits the Sun once a year and that day and night are caused by rotation every 24 hours, rather than silently turning the error into a blank students must fill."}
