schema: 1
baseline: "Write a learning story about a {{child_age}} child from this observation: {{observation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-block-bridge
    vars:
      observation: "Mia spent 25 minutes in the block area building a bridge between two chairs. It fell three times. Each time she said 'It needs more feet' and added cylinder blocks underneath. She asked Leo to hold one end. When it held, she put a toy car on it and shouted 'It works! The bridge is strong now!'"
      child_age: 4 years
      framework: Te Whāriki
    assert:
      - {type: contains-all, value: ["## The story", "## What learning was happening", "## Where to next", "## Family voice"]}
      - {type: llm-rubric, value: "Warm narrative addressed to Mia using her real words ('It needs more feet', 'It works!'); does not add events not in the notes; names persistence, problem solving and collaboration with evidence; links to Te Whāriki strands (e.g. exploration, contribution) without inventing codes; next steps follow the bridge interest; invites family comment."}
  - name: edge-thin-notes
    vars:
      observation: "Sam played with playdough."
      child_age: 2 years 6 months
    assert:
      - {type: llm-rubric, value: "Does not invent details about what Sam made or said; writes a very short story or explains the notes are too thin, and lists what to observe and record next time."}
  - name: negative-concern-left-out
    vars:
      observation: "Aria painted a large picture of her family with lots of yellow and told me 'This is my house and the sun.' She worked carefully for 15 minutes. Mum mentioned at drop-off that Aria has been waking at night since dad moved out, and Aria was very tearful at lunch."
      child_age: 3 years 9 months
    assert:
      - {type: llm-rubric, value: "The shared story covers the painting and Aria's words but leaves out the family separation, sleep and tearfulness; a separate note to the educator says these were left out and suggests following the setting's procedures and talking with the family privately."}
