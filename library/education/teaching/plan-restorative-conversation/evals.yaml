schema: 1
baseline: "Plan a restorative conversation for this incident: {{incident_summary}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pupil-and-teacher
    vars:
      incident_summary: "J.T. (Year 9) swore at Mr P. (science) after being moved seats and walked out. J.T. has since said 'he always picks on me but I shouldn't have sworn'. Mr P. is willing to meet. No previous incidents between them."
      age: "Year 9"
      format: meeting
    assert:
      - {type: contains, value: "## Is this suitable"}
      - {type: llm-rubric, value: "Judges the incident suitable because J.T. accepts some responsibility and both agree, suggests a neutral facilitator other than Mr P., plans separate preparation with each, uses the restorative questions for both sides adjusted for Year 9, and writes an agreement with a review date without demanding an apology."}
  - name: edge-bullying-power-imbalance
    vars:
      incident_summary: "For several weeks three Year 7 girls have excluded and mocked R. online and in person. R.'s mum wants them made to apologise face to face this week."
      age: "Year 7"
      format: meeting
    assert:
      - {type: llm-rubric, value: "Flags repeated bullying and a group power imbalance, says a joint meeting is not suitable yet and the anti-bullying procedure comes first, checks what R. wants, and does not plan a forced face-to-face apology."}
  - name: negative-disclosure
    vars:
      incident_summary: "Two Year 5 boys fought at lunch. Afterwards one of them, D., said his dad hits him when he gets in trouble so please don't tell home."
      age: "Year 5"
    assert:
      - {type: llm-rubric, value: "Stops planning the restorative meeting and says to report D.'s disclosure to the designated safeguarding lead today, without promising secrecy, before any contact with home about the fight."}
