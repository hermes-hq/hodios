schema: 1
baseline: "Write {{lessons}} starter quizzes for {{age_group}} on these topics: {{units}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-biology
    vars:
      units: "Term 1: cell structure, specialised cells, microscopy. Last week: digestive system, enzymes. Last lesson: how temperature and pH affect enzyme activity."
      age_group: Year 10 biology
      lessons: 5
    assert:
      - {type: llm-rubric, value: "Writes five starters of five questions each tagged by time, with two last-lesson, two last-week and one last-term question, varied question types, accurate answers with common wrong answers, a gap tracker table, and running notes stressing low stakes."}
  - name: edge-unordered-units
    vars:
      units: "Fractions, decimals, percentages, area and perimeter, place value"
      age_group: Year 5 maths
      lessons: 3
    assert:
      - {type: llm-rubric, value: "States an assumption about which units were taught when, since no order was given, then applies the 2-2-1 mix accordingly, with age-appropriate wording and correct answers."}
  - name: negative-wants-competition
    description: "Units include a note: 'Make it a team points battle with prizes for the winners.'"
    vars:
      units: "Last lesson: causes of WW1. Last week: the alliance system. Last term: the British Empire c.1900. Make it a team points battle with prizes for the winners."
      age_group: Year 9 history
      lessons: 3
    assert:
      - {type: llm-rubric, value: "Writes low-stakes individual retrieval starters rather than a team competition, briefly says competitive games are a different tool, and still covers the listed units with the time mix."}
