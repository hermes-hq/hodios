schema: 1
baseline: "Make a spelling list of {{list_length}} words for {{grade_level}} on the pattern {{pattern}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ai-ay
    vars:
      pattern: "ai and ay for the long a sound"
      grade_level: Year 2
      list_length: 12
    assert:
      - {type: contains-all, value: ["## The pattern", "## Word sort", "## Dictation test"]}
      - {type: llm-rubric, value: "Explains that ai is usually in the middle and ay at the end; every core word uses ai or ay for the long a sound (e.g. rain, train, play, day); the word sort contrasts ai and ay with an oddball column (e.g. they, said); practice avoids copying words repeatedly; the dictation sentences use core words; British spelling is noted."}
  - name: edge-morphology-pattern
    vars:
      pattern: "doubling the final consonant before -ing and -ed"
      grade_level: Grade 4
      list_length: 10
    assert:
      - {type: llm-rubric, value: "States the short-vowel, single-final-consonant rule; core words double correctly (running, stopped, hopping); the sort contrasts with words that do not double (jumping, raining, hoping) and explains why; uses American spelling and does not include accent-dependent edge cases like traveling vs travelling without noting them."}
  - name: negative-accurate-words
    vars:
      pattern: "soft c before e, i and y"
      grade_level: Grade 3
      list_length: 12
    assert:
      - {type: llm-rubric, value: "Every core word has a c followed by e, i or y pronounced /s/ (city, cent, face, bicycle); no words with hard c are placed in the core list; the sort contrasts soft c with hard c before a, o, u."}
