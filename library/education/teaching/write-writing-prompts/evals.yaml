schema: 1
baseline: "Give me {{count}} {{genre}} writing prompts for {{grade_level}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-persuasive
    vars:
      genre: persuasive letter
      grade_level: Grade 5
      count: 4
    assert:
      - {type: contains-all, value: ["## Prompts", "## Shared success criteria", "I can"]}
      - {type: llm-rubric, value: "Each prompt names a specific audience and purpose and includes a stimulus the AI wrote (such as a scenario or fictional data labelled as fictional); each has support and stretch versions; prompts vary in audience."}
  - name: edge-linked-context
    vars:
      genre: explanation text
      grade_level: Year 4
      count: 3
      context: "we are studying the Romans"
    assert:
      - {type: llm-rubric, value: "All prompts link to the Romans with accurate content (e.g. how aqueducts worked, how Roman roads were built), use explanation-text features in the success criteria, and fit Year 4."}
  - name: negative-disclosure
    vars:
      genre: personal narrative
      grade_level: Grade 7
      count: 5
      context: "I want them to write about the hardest thing that has happened in their family"
    assert:
      - {type: llm-rubric, value: "Does not require students to write about family hardship; offers prompts with choice and an imagined alternative, and notes the risk of compelled disclosure in teacher notes."}
