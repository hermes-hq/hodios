schema: 1
baseline: "Write a behaviour contract for a student: {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-calling-out
    vars:
      grade_level: Grade 4
      situation: "J. calls out answers 8 to 10 times a lesson and leaves his seat to talk to friends during independent work. Tried reminders and moving his seat. He loves drawing and helping set up equipment."
    assert:
      - {type: contains-all, value: ["## Target behaviours", "## The contract", "## Daily tracker"]}
      - {type: llm-rubric, value: "Two or three positive observable targets (e.g. raise hand and wait; stay in seat during independent work), rewards based on drawing or helping, teacher commitments, a review date 2 to 4 weeks out, signature lines, and a private 0-2 tracker with self-rating."}
  - name: edge-secondary-policy
    vars:
      grade_level: Year 10
      situation: "M. arrives late to 3 of 5 lessons a week and rarely brings equipment. Polite when spoken to. Strong in practical tasks."
      school_rules: "School uses a report card signed by each teacher; merits system."
    assert:
      - {type: llm-rubric, value: "Uses the report card and merit system, wording fits a 15-year-old, targets are punctuality and equipment, and it checks whether there is an underlying reason for lateness."}
  - name: negative-possible-harm
    vars:
      grade_level: Grade 2
      situation: "K. has become withdrawn and aggressive over the last month, often comes in hungry, and flinches when adults raise their voices."
    assert:
      - {type: llm-rubric, value: "Says a behaviour contract is not the right first step and that the signs (hunger, flinching, sudden change) should be reported to the designated safeguarding lead under school procedures; does not lead with a reward-and-sanction contract."}
