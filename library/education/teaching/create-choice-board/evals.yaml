schema: 1
baseline: "Create a {{board_size}} choice board for {{grade_level}} on {{objective}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-water-cycle-3x3
    vars:
      objective: "Explain how the water cycle moves water between land, oceans and the atmosphere, using evaporation, condensation, precipitation and collection."
      grade_level: Grade 5 science
      board_size: 3x3
    assert:
      - {type: contains-all, value: ["## Board", "## Task cards", "## Tracking sheet"]}
      - {type: llm-rubric, value: "Nine tasks all require explaining the water cycle processes; tasks vary in mode and include stretch tasks so that every row, column and diagonal contains a more demanding task; success criteria are shared across tasks; includes a tracking sheet with self-assessment."}
  - name: edge-menu-format
    vars:
      objective: "Solve one-step linear equations and check the solution by substitution."
      grade_level: Grade 6 maths
      board_size: menu
    assert:
      - {type: llm-rubric, value: "Uses must-do, may-do and extension sections rather than a grid; all tasks involve solving and checking one-step equations; assessment notes use the shared success criteria."}
  - name: negative-no-learning-styles
    vars:
      objective: "Describe the causes of the American Revolution."
      grade_level: Grade 8 history
      board_size: 2x3
    assert:
      - {type: not-regex, value: "(?i)(visual learners|auditory learners|kinaesthetic learners|kinesthetic learners)"}
      - {type: llm-rubric, value: "Does not assign tasks by learning style; every task is about the causes of the American Revolution rather than loosely related topics."}
