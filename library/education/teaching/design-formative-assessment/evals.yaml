schema: 1
baseline: "Write some formative assessment questions for a {{grade_level}} lesson on: {{lesson_objective}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fractions-grade5
    vars:
      lesson_objective: "Add fractions with unlike denominators."
      grade_level: Grade 5
      subject: mathematics
    assert:
      - {type: contains-all, value: ["## Hinge question", "## Exit ticket", "## Decision rules"]}
      - {type: llm-rubric, value: "The hinge question has one correct option and each wrong option maps to a named misconception, including adding numerators and denominators separately (e.g. 1/2 + 1/3 = 2/5). Decision rules give concrete next steps for 80%+ correct, a split class and mostly wrong. All answers are mathematically correct."}
  - name: edge-humanities-objective
    vars:
      lesson_objective: "Explain why the Treaty of Versailles caused resentment in Germany."
      grade_level: Year 9 history
    assert:
      - {type: llm-rubric, value: "Adapts to a non-mathematical objective: misconceptions are plausible historical ones (e.g. Germany chose to sign freely, the treaty was only about money), mini-whiteboard prompts have short scannable answers, and the exit ticket has a clear secure / nearly / not yet sorting rule."}
  - name: negative-vague-objective
    vars:
      lesson_objective: "Understand photosynthesis."
      grade_level: Grade 7
    assert:
      - {type: llm-rubric, value: "Notes that 'understand' is not observable and narrows the objective to something measurable before designing the checks, stating how it narrowed it. Does not rely on 'any questions?' or thumbs-up self-reports as checks."}
