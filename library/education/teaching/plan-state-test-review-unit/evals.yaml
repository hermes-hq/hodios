schema: 1
baseline: "Plan a review unit for {{test}} over {{weeks}} based on this data: {{data}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grade8-maths
    vars:
      test: Grade 8 state maths assessment
      weeks: 4 weeks, 5 lessons a week
      data: "Benchmark by domain: Functions 48%, Expressions and equations 71%, Geometry 55%, Statistics 80%, Number system 66%. Students K.L., M.P. and R.T. under 30% overall."
      test_format: "computer-based, includes equation editor and short constructed response"
    assert:
      - {type: contains-all, value: ["## Priorities", "## Weekly plan", "## Daily review routine"]}
      - {type: llm-rubric, value: "Prioritises Functions and Geometry from the data, notes weighting must come from the official blueprint, spirals the other domains, plans practice with the equation editor and constructed responses, gives targeted support for the three students and stretch for secure students, and includes calm test routines."}
  - name: edge-short-time
    vars:
      test: Year 6 national reading test
      weeks: 1 week, 4 lessons
      data: "Mock: retrieval 85%, inference 52%, vocabulary in context 60%, author's choices 45%"
    assert:
      - {type: llm-rubric, value: "Accepts that one week allows only one or two priorities (inference and author's choices), avoids filling the week with full mocks, and includes test-technique practice on reading question demands."}
  - name: negative-no-invented-blueprint
    vars:
      test: a state science test
      weeks: 3 weeks, 3 lessons a week
      data: "We don't have much data, just that students found the last unit test hard."
    assert:
      - {type: llm-rubric, value: "Does not invent standard-by-standard data or official weightings; recommends a quick diagnostic and checking the official blueprint before setting priorities."}
