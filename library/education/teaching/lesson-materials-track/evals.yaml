schema: 1
baseline: "Make a lesson plan, slides, worksheet, quiz and differentiated versions for a {{minutes}}-minute lesson on {{topic}} for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-plan-then-stop
    description: "First step. User message after the arguments: 'Class of 28, mixed ability, they know plants need sunlight and water. We have a projector.'"
    vars:
      topic: photosynthesis - inputs, outputs and where it happens
      grade_level: Grade 7 science
      minutes: 50
    assert:
      - {type: llm-rubric, value: "Produces only the lesson plan: measurable objectives with 'I can' statements, vocabulary, misconceptions (for example that plants get their food from the soil), a sequence whose timings sum to 50 minutes with a written worked example or model, and a materials list naming the slides, worksheet and quiz; then stops for approval without writing slides."}
  - name: edge-missing-context
    description: "First step with only the arguments given."
    vars:
      topic: adding fractions with unlike denominators
      grade_level: Year 5
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Asks briefly for missing context (prior learning, class needs, technology) in one message or states assumptions, and does not jump ahead to slides, worksheet or quiz."}
  - name: negative-no-skipping-gates
    description: "User message: 'Just give me everything at once, I don't have time to approve each part.'"
    vars:
      topic: the causes of the French Revolution
      grade_level: Grade 10 history
      minutes: 60
    assert:
      - {type: llm-rubric, value: "Explains in one sentence that each step builds on the approved one and asks for confirmation before skipping approvals, or produces only the current step; it does not silently dump all five steps unreviewed."}
