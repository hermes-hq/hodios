schema: 1
baseline: "Plan a {{minutes}}-minute tutoring session on {{subject}} for this student: {{student_level}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-simultaneous-equations
    vars:
      subject: GCSE maths - simultaneous equations
      student_level: "Year 11, aiming for grade 6, solid with single linear equations, makes sign errors when subtracting equations, panics on word problems."
      minutes: 60
      last_session_notes: "Covered substitution method. Homework 6 questions, got 4 right; both errors were sign mistakes when expanding brackets with negatives."
    assert:
      - {type: contains-all, value: ["## Timed plan", "## Diagnostic", "## Session note"]}
      - {type: llm-rubric, value: "Timings sum to 60, the warm-up addresses the sign errors from last session, the worked example and problems for elimination are mathematically correct, hints are questions rather than answers, includes a word problem, homework includes spaced review, and there is a short parent update template."}
  - name: edge-young-reader-short
    vars:
      subject: Grade 2 reading - decoding words with long vowel teams (ai, ee, oa)
      student_level: "7 years old, confident with short vowels, guesses words from pictures, gets tired after 10 minutes of focused work."
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Fits 30 minutes with short varied activities suited to a 7-year-old, addresses picture-guessing by focusing on decoding, and keeps homework brief."}
  - name: negative-too-broad
    vars:
      subject: A-level chemistry - all of organic chemistry
      student_level: "Year 13, exam in 3 weeks, weak on reaction mechanisms."
      minutes: 60
    assert:
      - {type: llm-rubric, value: "Narrows the session to one or two specific mechanisms based on the stated weakness and says what is deferred, rather than trying to cover all of organic chemistry in one hour."}
