schema: 1
baseline: "Write my professional growth goals for this year. {{context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-secondary
    vars:
      context: "Year 9 and 10 science teacher, 4 years. Last observation: strong subject knowledge, questioning mostly recall and directed at volunteers. Year 9 end-of-unit tests: 40% of students below 50% on extended-answer questions."
      requirements: "One student-learning goal and one professional-practice goal."
    assert:
      - {type: contains-all, value: ["## Goal options", "## Goal plans", "## Evidence log"]}
      - {type: llm-rubric, value: "Recommends a practice goal on questioning (e.g. no-hands-up, higher-order questions) and a student-learning goal on Year 9 extended answers with the 40% baseline; each has timed actions, observable practice measures and realistic student measures; nothing invented beyond the context."}
  - name: edge-thin-context
    vars:
      context: "Primary teacher, Grade 2."
      interests: "supporting multilingual learners"
    assert:
      - {type: llm-rubric, value: "Builds goals around multilingual learners, says what baseline data to collect because none was given, and does not invent observation feedback or results."}
  - name: negative-uncontrollable-measure
    vars:
      context: "Head of English, 12 years. I want my goal to be that the school's overall exam results go up 10%."
    assert:
      - {type: llm-rubric, value: "Explains that whole-school results are not a fair or controllable measure for one teacher's goal and reframes it into practice and student-learning measures within the teacher's influence (e.g. department practice or their own classes)."}
