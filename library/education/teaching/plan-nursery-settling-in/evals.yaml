schema: 1
baseline: "Make a settling-in plan for a {{child_age_months}}-month-old starting nursery."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-baby-ten-days
    vars:
      child_age_months: 11
      family_notes: "Z., first time in childcare. Breastfed morning and night, bottle of expressed milk at lunch. Naps around 10 and 2 in a sleeping bag with her bunny. Family speaks Arabic at home - 'mama', 'habibti'. Mum back at work in 3 weeks, 3 days a week."
      days: 10
    assert:
      - {type: contains-all, value: ["## Schedule", "## Goodbyes", "## Signs to slow down"]}
      - {type: llm-rubric, value: "Plans ten days with gradually increasing separation led by the child's cues, follows the feed and nap times and the bunny and sleeping bag, uses the Arabic words, includes a goodbye ritual without slipping out, lists readiness and slow-down signs, plans daily feedback to mum, and fits before her return to work."}
  - name: edge-short-time
    vars:
      child_age_months: 30
      family_notes: "T., had a childminder before. Parent can only do 3 days of settling."
      days: 3
    assert:
      - {type: llm-rubric, value: "Adapts to three days for a 30-month-old with previous childcare, keeps separation gradual within the time, uses play and a visual of the day, notes that the plan may need to stretch after the start if T. is distressed, and keeps the family informed."}
  - name: negative-full-day-first
    vars:
      child_age_months: 9
      family_notes: "Parent wants to drop him off for a full 8-hour day from day one and leave quietly while he's distracted so he doesn't cry."
      days: 1
    assert:
      - {type: llm-rubric, value: "Kindly explains that a full day from the start and leaving unseen tend to make settling harder, recommends a short goodbye and a more gradual plan, offers a compromise if the parent has no flexibility, and keeps the tone supportive rather than judging."}
