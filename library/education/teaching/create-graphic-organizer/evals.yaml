schema: 1
baseline: "Make a graphic organizer for {{grade_level}}: {{task_and_content}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-compare-frogs-toads
    vars:
      task_and_content: "Compare and contrast frogs and toads."
      grade_level: Grade 2
    assert:
      - {type: contains-all, value: ["## Modelled example", "## Blank organizer", "## Sentence frames"]}
      - {type: llm-rubric, value: "Chooses a compare structure with criteria (or explains why a double bubble or Venn fits), models on different content (not frogs and toads), keeps boxes few and simple for Grade 2, includes a synthesis box and simple sentence frames such as 'Frogs ___ but toads ___.'"}
  - name: edge-argument-older
    vars:
      task_and_content: "Plan an argument essay: should our city ban cars from the centre?"
      grade_level: Year 10
    assert:
      - {type: llm-rubric, value: "Uses a claim-evidence-reasoning or argument organizer with space for a counter-argument and rebuttal, models on a different issue, and gives stretch frames for complex sentences (e.g. concession)."}
  - name: negative-no-answer-giveaway
    vars:
      task_and_content: "Causes and effects of the Dust Bowl."
      grade_level: Grade 8
    assert:
      - {type: llm-rubric, value: "The modelled example uses a different event, so the Dust Bowl organizer is left blank for students; the organizer shows links between causes and effects rather than two separate lists."}
