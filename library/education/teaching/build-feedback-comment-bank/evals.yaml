schema: 1
baseline: "Write a bank of feedback comments for marking this assignment: {{assignment_and_rubric}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-persuasive-essay
    vars:
      assignment_and_rubric: "Grade 8 persuasive essay: should the school day start later? Rubric (4 levels: exceeds, meets, approaching, beginning) on Claim, Evidence, Counter-argument, Organisation, Conventions."
      student_level: Grade 8
      tone: warm
    assert:
      - {type: contains-all, value: ["## Comment bank", "## Whole-class feedback", "## Re-draft tasks"]}
      - {type: llm-rubric, value: "Covers all five criteria at the four levels with coded comments; each comment has a specific description with a slot for the student's detail and an actionable next step; no generic phrases like 'good effort' or 'add more detail' without saying what; re-draft tasks link to codes."}
  - name: edge-direct-tone-no-rubric
    vars:
      assignment_and_rubric: "Year 11 physics: write up the pendulum experiment (method, results table, graph, conclusion with uncertainty)."
      tone: direct
    assert:
      - {type: llm-rubric, value: "Derives 3-5 criteria from the brief and labels them derived, uses three levels, and writes brief, frank, action-first comments without being harsh or personal; includes comments on uncertainty and graph conventions."}
  - name: negative-too-thin
    vars:
      assignment_and_rubric: "Essays."
    assert:
      - {type: llm-rubric, value: "Asks for the task, criteria and student level instead of producing a generic comment bank."}
