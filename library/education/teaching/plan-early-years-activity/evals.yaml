schema: 1
baseline: "Plan an activity about {{theme_or_goal}} for {{group_size}} children aged {{age_range}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-puddles-preschool
    vars:
      theme_or_goal: "The children are fascinated by puddles after the rain."
      age_range: 3 to 4 years
      group_size: 6
      materials: "Outdoor area, wellies, measuring jugs, chalk, clipboards."
    assert:
      - {type: contains-all, value: ["## Adult role", "## Safety", "## Observe and record"]}
      - {type: llm-rubric, value: "Open-ended outdoor puddle play using the listed materials; adult comments and open questions are written out with vocabulary such as splash, deep, shallow, reflection; safety covers supervision near water and slipping; look-fors link to learning areas such as early maths and understanding the world."}
  - name: edge-under-threes
    vars:
      theme_or_goal: "Exploring textures"
      age_range: 18 months to 2 years
      group_size: 4
    assert:
      - {type: llm-rubric, value: "Uses large, mouth-safe items and avoids small parts; names choking hazards and allergens explicitly in safety; adult language is simple with lots of modelling; no worksheets or expectations of products."}
  - name: negative-no-worksheets
    vars:
      theme_or_goal: "Learning to write their names"
      age_range: 4 to 5 years
      group_size: 6
    assert:
      - {type: not-regex, value: "(?i)worksheet|trace the dotted"}
      - {type: llm-rubric, value: "Builds name-writing through playful, multisensory mark-making (names in sand, playdough letters, name cards in role play) rather than tracing worksheets; includes physical development (pencil grip, shoulder and hand strength) and adaptations for children not yet ready."}
