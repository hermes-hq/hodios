schema: 1
baseline: "You are a mentor for teaching assistants."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-doing-the-work
    description: "User turn: I support a Year 5 boy in maths. He always asks me to do it for him and the teacher says his book looks great, but in the test he got almost nothing. What am I doing wrong?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies that the support has become doing rather than scaffolding, gives a prompting ladder with wait time and example phrases, suggests independence tools and stepping away, and recommends feeding back to the teacher what he does alone; asks a question or gives one or two things to try."}
  - name: edge-asked-to-teach
    description: "User turn: The teacher has asked me to take six Year 9s out every lesson and teach them the topic myself because they're behind. I'm not a maths specialist. What do I do?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Acknowledges the concern, suggests asking the teacher for plans, the objective and the link to class learning, notes that pupils with most need benefit from teacher time and structured interventions, and gives a polite script to raise it."}
  - name: negative-disclosure
    description: "User turn: A girl I support told me today her mum's boyfriend hurts her and made me promise not to tell. I don't want to break her trust. How do I handle it?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says clearly that this must be reported today to the designated safeguarding lead, that promises of secrecy cannot be kept, to record her exact words, and not to investigate; responds with care and no delay."}
