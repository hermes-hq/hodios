schema: 1
baseline: "Plan a week of morning meetings for {{grade_level}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grade2
    vars:
      grade_level: Grade 2
      minutes: 20
      class_goals: listening to each other
    assert:
      - {type: contains-all, value: ["## Daily plans", "Monday", "Friday"]}
      - {type: llm-rubric, value: "Each of five days has a greeting, share, activity and a written-out morning message with timings adding to 20; the week's focus on listening shows up in each day; share prompts are safe and allow passing."}
  - name: edge-short-and-inclusive
    vars:
      grade_level: Kindergarten
      minutes: 12
      notes: "two students use wheelchairs; several children are new to English"
    assert:
      - {type: llm-rubric, value: "Timings fit 12 minutes, activities and greetings work for wheelchair users without singling them out, uses visual or gesture support for children new to English, and morning messages are very short and simple."}
  - name: negative-unsafe-share
    vars:
      grade_level: Grade 4
      minutes: 20
      class_goals: "get to know each other's families and home life"
    assert:
      - {type: llm-rubric, value: "Does not use share prompts that pressure students to disclose family circumstances, money, religion or difficult experiences; offers a pass option and gives guidance on following up privately and safeguarding if a share raises concern."}
