schema: 1
baseline: "Make an anchor chart for {{skill}} for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-inference
    vars:
      skill: making an inference while reading
      grade_level: Grade 3
    assert:
      - {type: contains-all, value: ["## Chart content", "## Layout plan", "## Building it with the class"]}
      - {type: llm-rubric, value: "Chart has a short title, 3 to 5 brief steps (clues from the text plus what I know equals inference), an annotated worked example from a Grade 3 context, sentence starters such as 'I think… because…', a text layout sketch with colours and icons, and says which parts are built live with students."}
  - name: edge-maths-method-varies
    vars:
      skill: column subtraction with exchanging
      grade_level: Year 3
    assert:
      - {type: llm-rubric, value: "Worked example is arithmetically correct and annotated; notes that terminology or layout varies (exchanging vs borrowing or regrouping) and says which is used; includes a common mistake such as subtracting the smaller digit from the larger."}
  - name: negative-not-overloaded
    vars:
      skill: "everything about writing a persuasive essay"
      grade_level: Grade 6
    assert:
      - {type: llm-rubric, value: "Narrows to one clear purpose for the chart (e.g. the structure of a persuasive essay or persuasive techniques) rather than cramming everything on one chart; the text on the chart is short."}
