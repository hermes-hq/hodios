schema: 1
baseline: "Plan a {{minutes}}-minute lesson teaching {{skill}} to {{grade_level}} students."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retrieval-science
    vars:
      skill: retrieval-practice
      grade_level: Grade 8 science
      minutes: 45
    assert:
      - {type: contains-all, value: ["## Why it works", "## Model", "## Guided practice", "## Reflection"]}
      - {type: llm-rubric, value: "Explains honestly why rereading feels effective but is weaker than retrieval; includes a hook that shows the gap between confidence and recall; the teacher think-aloud uses real Grade 8 science content; students practise on their own current content; timings add up to 45 minutes; no invented statistics."}
  - name: edge-planning-younger
    vars:
      skill: planning
      grade_level: Grade 4
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Adapts planning to Grade 4 (breaking a project into a few steps, a simple visual planner, estimating time with teacher support); short steps and plenty of modelling; timings add up to 30 minutes."}
  - name: negative-no-myths
    vars:
      skill: revision
      grade_level: Year 11
      minutes: 50
    assert:
      - {type: not-regex, value: "(?i)(visual learner|learning style|left[- ]brain|right[- ]brain|10% of (your|the) brain)"}
      - {type: llm-rubric, value: "Teaches spaced and interleaved revision with practice questions and using mistakes to guide study; avoids learning-styles and brain myths; includes a plan to reuse the skill in later lessons."}
