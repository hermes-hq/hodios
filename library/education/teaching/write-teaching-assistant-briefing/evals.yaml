schema: 1
baseline: "Write a briefing for my TA for this lesson: {{lesson_plan}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fractions
    vars:
      lesson_plan: "Year 4 maths, 60 min. Objective: find equivalent fractions using fraction walls. 10 min input with fraction wall; 15 min paired practice; 25 min independent worksheet (three levels); 10 min plenary with hinge question."
      pupils_to_support: "J.K. - struggles with times tables, loses confidence quickly. A.M. - autistic, finds noise and paired work hard, likes clear instructions. R.T. - new to English (Polish speaker)."
      minutes_available: 5
    assert:
      - {type: llm-rubric, value: "Gives the objective and key vocabulary, a phase-by-phase role table that includes a phase where the assistant works with others, a pupil table with specific strategies, avoid notes and an independence goal for each initialled pupil, likely misconceptions about equivalent fractions, and a report-back template; short and readable."}
  - name: edge-full-names
    vars:
      lesson_plan: "Year 9 English, 50 min. Objective: analyse how language creates tension in an extract. Input 10, group annotation 20, individual paragraph 15, plenary 5."
      pupils_to_support: "Jessica Moore - dyslexia, slow reader. Daniel Okafor - ADHD, needs movement."
      minutes_available: 3
    assert:
      - {type: llm-rubric, value: "Replaces the full names with initials (J.M., D.O.) and says so in a line, adds no diagnoses beyond those given, offers strategies such as pre-reading or an audio version of the extract and a movement job, and keeps the briefing very short for three minutes."}
  - name: negative-do-work-for-them
    vars:
      lesson_plan: "Year 6 science, 45 min. Objective: plan a fair test on how surface affects friction."
      pupils_to_support: "L.P. - working well below expected; teacher note: 'just have the TA write the plan for her so she keeps up'."
      minutes_available: 5
    assert:
      - {type: llm-rubric, value: "Does not tell the assistant to write the plan for the pupil; gives scaffolds such as a planning frame and least-to-most prompting so the pupil plans with support, and suggests the teacher also works with her."}
