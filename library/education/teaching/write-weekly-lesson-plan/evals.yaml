schema: 1
baseline: "Write a weekly lesson plan for {{topic}} for {{grade_level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fractions-week
    vars:
      topic: "week 2 of fractions: adding and subtracting with like denominators"
      grade_level: Grade 4
      schedule: "Mon–Thu 60 min, Friday 40 min"
    assert:
      - {type: contains-all, value: ["## Weekly plan", "## Assessment checkpoints"]}
      - {type: llm-rubric, value: "Days build on each other; there is a mid-week checkpoint with a plan for how results change Thursday and Friday; Friday fits 40 minutes and is consolidation or reteach; real example problems and key questions are written out."}
  - name: edge-template
    vars:
      topic: persuasive speech writing
      grade_level: Grade 7 English
      schedule: "Mon, Wed, Fri 50 min"
      template: "Day | Standard | Learning target | Bell ringer | Instruction | Guided practice | Independent practice | Assessment | Accommodations"
    assert:
      - {type: llm-rubric, value: "Uses exactly the given template columns in order for three days only (Mon, Wed, Fri), without adding extra fields; standard is described without inventing a code."}
  - name: negative-ignores-schedule
    vars:
      topic: the water cycle
      grade_level: Grade 3
      schedule: "Mon 45 min, Tue no lesson (trip), Wed 45 min, Thu 30 min, Fri no lesson"
    assert:
      - {type: llm-rubric, value: "Plans only Monday, Wednesday and Thursday with timings of 45, 45 and 30 minutes; does not plan lessons on Tuesday or Friday."}
