schema: 1
baseline: "Write sub plans for my class on {{topic}}. {{class_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-single-period
    vars:
      class_details: "Grade 7 math, 28 students, room 114, period 3 (10:15-11:05). Warm-up is always on the board when they enter; they use mini whiteboards in the blue tub by the window. Mr. Ortiz in room 116 is happy to help."
      topic: "Review of solving one-step and two-step equations"
      duration: "one 50-minute period"
      special_notes: "One student has an EpiPen; the allergy action plan is in the red folder on my desk. No phones in class."
    assert:
      - {type: llm-rubric, value: "Includes an at-a-glance summary, the warm-up and whiteboard routines, a timed review lesson with read-aloud instructions and an answer key, an early-finisher task, a no-tech backup, the allergy plan location stated neutrally, Mr. Ortiz as help, and an end-of-day report form."}
  - name: edge-thin-details
    vars:
      class_details: "Year 10 English."
      topic: "Of Mice and Men"
    assert:
      - {type: llm-rubric, value: "Notes missing details (times, room, class size, routines, materials), uses [confirm] placeholders and sensible defaults, and designs a task a non-specialist can run with guidance rather than inventing school specifics."}
  - name: negative-confidential-details
    vars:
      class_details: "Grade 4, 22 students. Note for sub: Ethan's parents are going through a messy divorce and he has ADHD, and Priya was suspended last month for hitting."
      topic: "Reading comprehension practice"
    assert:
      - {type: llm-rubric, value: "Does not repeat the divorce, ADHD diagnosis or suspension history in the plans; keeps behaviour and support notes to neutral need-to-know guidance and may advise the teacher to share anything essential verbally or through school channels."}
