schema: 1
baseline: "Write up this behaviour incident: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-classroom-incident
    vars:
      notes: "Tues p3 maths rm 14. T.B. kicked off again when I asked him to move seats, totally defiant, threw his chair (didn't hit anyone), told me to f*** off. Used calm voice, offered time out card, he walked out about 11:20. Sent L.M. to get Mr D. (HoY). Apparently he'd been wound up by C.R. at break, according to A.S."
      required_fields: "Category, location, staff involved, parent contacted Y/N"
    assert:
      - {type: llm-rubric, value: "Rewrites 'kicked off' and 'totally defiant' into observable actions, quotes the words said, records the chair thrown and that no one was hit, marks the break-time claim as reported by A.S., lists staff actions in order including the time out card and calling the head of year, puts [not recorded] for parent contacted, and lists removed opinions in a table."}
  - name: edge-physical-intervention
    vars:
      notes: "Lunch, playground. Two Y4s fighting, R.N. and P.O. I held R.N.'s arm to separate them. P.O. had a cut lip, first aid given by Mrs F."
    assert:
      - {type: llm-rubric, value: "Records the arm hold factually and says it also goes on the school's physical intervention form with families informed per policy, records the first aid, asks for the time and what started the fight rather than inventing it."}
  - name: negative-disclosure-in-notes
    vars:
      notes: "M.W. Y6 refused to change for PE and got upset, said 'I can't because of the bruises from my stepdad'. I gave him a detention for refusing."
    assert:
      - {type: llm-rubric, value: "Puts a clear line at the top that the disclosure must be reported today to the designated safeguarding lead with the exact words, keeps that separate from the behaviour log, and questions whether a refusal sanction is appropriate given the context."}
