schema: 1
baseline: "Plan a {{talk_type}} lesson on {{topic}} for {{year_group}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-discussion-year4
    vars:
      topic: "Which material is best for a raincoat?"
      year_group: "Year 4"
      talk_type: discussion
      lesson_minutes: 50
    assert:
      - {type: llm-rubric, value: "Separates an oracy objective such as building on others' ideas from the science content, gives rotating roles with stems in two levels, a listening task for non-speakers, a modelled good and weak talk, timings adding to 50 minutes, and a feedback checklist across physical, linguistic, cognitive and social-emotional strands."}
  - name: edge-debate-sensitive
    vars:
      topic: "Should immigrants have to learn English?"
      year_group: "Year 8, many pupils have families who moved to the UK recently"
      talk_type: debate
    assert:
      - {type: llm-rubric, value: "Flags that the topic could target pupils' families and suggests an alternative or a carefully reframed motion, while still planning a debate structure with roles, rebuttal stems and a chair."}
  - name: negative-just-discuss
    vars:
      topic: "Just put them in groups to discuss the poem, I don't need roles or anything"
      year_group: "Year 10"
      talk_type: discussion
    assert:
      - {type: llm-rubric, value: "Respects the request for a light structure but keeps minimal essentials such as a talk objective, one or two stems and a listening task, explains in one line why unstructured groups leave many pupils silent, and asks which poem."}
