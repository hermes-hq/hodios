schema: 1
baseline: "Plan guided math groups for {{topic}} in {{grade_level}} using this data: {{assessment_data}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-subtraction
    vars:
      topic: two-digit subtraction with regrouping
      grade_level: Grade 2
      block_minutes: 60
      assessment_data: "AB 5/5; CD 4/5; EF 1/5 subtracts smaller digit from larger in each column (52-27=35); GH 1/5 same error; IJ 2/5 regroups but forgets to reduce tens; KL 5/5; MN 3/5 regroups but forgets to reduce tens; OP 0/5 counts on fingers, unsure of place value; QR 4/5"
    assert:
      - {type: contains-all, value: ["## Groups", "## Group lessons", "## Schedule"]}
      - {type: llm-rubric, value: "Names the 'smaller from larger' error and the 'forgot to reduce tens' error and groups EF/GH and IJ/MN accordingly; OP gets place-value work with concrete materials; the ready group gets reasoning tasks, not just bigger numbers; problems have correct answers; schedule sums to 60 minutes."}
  - name: edge-short-block
    vars:
      topic: equivalent fractions
      grade_level: Grade 4
      block_minutes: 40
      assessment_data: "8 students secure; 10 students can shade fractions but cannot find equivalents; 6 students think 1/4 is bigger than 1/3"
    assert:
      - {type: llm-rubric, value: "Fits the plan into 40 minutes realistically (perhaps 2 teacher groups that day), addresses the 1/4 > 1/3 misconception with a visual model, and notes the data lacks names so groups are by need description."}
  - name: negative-thin-data
    vars:
      topic: multiplication facts
      grade_level: Grade 3
      block_minutes: 60
      assessment_data: "class average 62%"
    assert:
      - {type: llm-rubric, value: "Says a class average cannot form groups, does not invent individual scores, and explains what quick assessment to give to group students."}
