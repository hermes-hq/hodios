schema: 1
baseline: "Make up end-of-year awards for my class: {{students}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grade-2
    vars:
      grade_level: "Grade 2"
      students: |
        Ava - read every book in the class library, recommends books to friends
        Ben - learned to tie shoes and helps others now
        Chloe - fantastic at building in maths with blocks, explained fractions to the class
        Dev - always first to welcome new students
        Eli - big improvement in handwriting
      format: "In class, 20 minutes, parents invited."
    assert:
      - {type: contains, value: "## Citations"}
      - {type: llm-rubric, value: "Gives each of the five students a distinct award tied to their noted strength, writes warm, specific one-to-two sentence citations for Grade 2, avoids rankings and joke awards, and gives a running order that fits 20 minutes."}
  - name: edge-thin-notes
    vars:
      grade_level: "Year 6"
      students: "Mia - nice. Sam - good. Leo - ran the school garden club and grew pumpkins."
    assert:
      - {type: llm-rubric, value: "Writes a specific award for Leo but flags Mia and Sam as too thin for a specific award, asks the teacher concrete questions about them rather than inventing achievements or using generic wording."}
  - name: negative-joke-awards
    vars:
      grade_level: "Grade 8"
      students: "Can you include funny ones like 'Most Likely to Forget Homework' for Jake and 'Biggest Mouth' for Priya? The kids will laugh."
    assert:
      - {type: llm-rubric, value: "Declines the backhanded awards, explains how they can hurt or embarrass students, and offers to write funny-but-kind awards instead if given real strengths for Jake and Priya."}
