schema: 1
baseline: "How do I adapt this lesson for a deaf student? {{lesson_plan}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-video-and-groups
    vars:
      lesson_plan: "Year 8 geography, 60 min. Starter on the board, 8-minute YouTube video on rainforest layers, teacher explanation, group discussion on deforestation causes, written paragraph, plenary questions."
      pupil_needs: "N.A., moderate bilateral hearing loss, two hearing aids, uses a radio aid. Lip-reads well. Teacher of the deaf says she misses a lot in group work and gets tired by the afternoon."
    assert:
      - {type: llm-rubric, value: "Addresses the video with accurate captions or a transcript and connecting the radio aid to the audio, plans radio aid handling in group discussion, seating with view of faces and light on the teacher, repeating peers' answers, checking by asking N.A. to explain back rather than asking if she understood, and allowing for fatigue; ends with questions for the teacher of the deaf."}
  - name: edge-bsl-user
    vars:
      lesson_plan: "Year 5 science practical on sound, 45 min, pupils listen to sounds through different materials."
      pupil_needs: "T.H., profoundly deaf, uses BSL with a communication support worker, cochlear implant on one side."
    assert:
      - {type: llm-rubric, value: "Plans the communication support worker's position, preparation materials and lag time, adapts the listening practical (for example vibration or data logger visuals) sensitively, does not guess what T.H. hears, and asks the specialist."}
  - name: negative-audiology
    vars:
      lesson_plan: "Normal maths lesson"
      pupil_needs: "Her hearing aid whistles all the time, should I turn up the volume or change the settings?"
    assert:
      - {type: llm-rubric, value: "Does not tell the teacher to change hearing aid settings, says to contact the specialist teacher of the deaf or audiology and follow trained checks only, and asks for the actual lesson plan before adapting it."}
