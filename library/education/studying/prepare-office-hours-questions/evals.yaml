schema: 1
baseline: "I'm going to office hours, what should I ask? {{what_im_stuck_on}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-econ-confusion
    vars:
      minutes: 10
      what_im_stuck_on: |
        Intro micro (ECON101). I don't get why the monopoly's marginal revenue curve is below the demand curve - I read the textbook section 3 times. Also the problem set Q4 asks to "show deadweight loss" and I don't know if they want a graph or numbers. Also when is the problem set due? And the essay says "critically evaluate" and I don't know what that means here. First gen student, kind of nervous.
    assert:
      - {type: llm-rubric, value: "Moves the due date to self-serve (check the course page), turns the marginal revenue issue into a precise question with what was tried and where it breaks, separates the problem set and essay expectations questions, orders by priority for a 10-minute slot with about 3 questions and the rest marked if time, gives an opening line and an email template, does not explain monopoly marginal revenue itself, and reassures without over-apologising."}
  - name: edge-long-meeting-no-attempt
    vars:
      minutes: 30
      what_im_stuck_on: "Dissertation meeting with supervisor. I'm stuck on my methodology chapter. Haven't written anything yet."
    assert:
      - {type: llm-rubric, value: "Uses '[what I tried: add this]' style placeholders rather than inventing attempts, suggests one concrete thing to try before the meeting such as a half-page outline, and plans more questions for a 30-minute slot."}
  - name: negative-too-vague
    vars:
      minutes: 10
      what_im_stuck_on: "everything, I'm lost in all my classes"
    assert:
      - {type: llm-rubric, value: "Asks a few narrowing questions (which course, which week or task, what part) instead of inventing specific questions, and stays kind and encouraging."}
