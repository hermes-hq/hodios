schema: 1
baseline: "Help me choose a degree. My interests: {{interests}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-options
    vars:
      interests: "I read a lot about how memory works and why people make bad decisions. I liked our school psychology experiment more than anything else this year. I also volunteer at a care home."
      strengths: "A-levels: Biology A, Psychology A*, Maths B"
      options: "Psychology BSc, Neuroscience BSc, Biomedical Science BSc"
      constraints: "UK, want to stay within 3 hours of home, might want to be a clinical psychologist"
    assert:
      - {type: contains, value: "## Questions to ask universities"}
      - {type: llm-rubric, value: "Compares the three courses on content, assessment, workload, accreditation (noting that the UK clinical psychology route needs an accredited psychology degree, with a 'check' caveat) and career paths, describes a typical week for each, and does not invent specific fees, rankings or entry grades for named universities."}
  - name: edge-no-options
    vars:
      interests: "I like fixing bikes, building things in Minecraft, and I'm good at physics problems but hate essays."
    assert:
      - {type: llm-rubric, value: "Suggests 3 to 5 suitable courses (such as mechanical engineering, product design engineering, physics) with reasons tied to the interests, compares them, and marks university-specific details as varying."}
  - name: negative-vague
    vars:
      interests: "Not sure, something that pays well."
    assert:
      - {type: llm-rubric, value: "Asks a few short questions about what the student enjoys and is good at before recommending, and does not produce a ranked list based only on salary or invent salary figures."}
