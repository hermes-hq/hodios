schema: 1
baseline: "What note-taking method should I use for these courses? {{courses}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-year-mixed
    vars:
      courses: "Intro to Psychology: big lectures, slides posted the night before, multiple-choice midterm and final. Modern European History: lecturer talks without slides, fast, essay exam comparing regimes. Calculus I: board work, weekly problem sets, in-class exams. Microbiology: textbook chapters plus lab, short-answer exam with lots of organism features."
      delivery: mixed
    assert:
      - {type: contains, value: "## Templates"}
      - {type: llm-rubric, value: "Recommends annotating posted psychology slides with Cornell-style cue questions for MCQ recall, sentence or outline notes for the fast history lectures with a comparison chart of regimes for the essay, problem notes (example, method, why, common mistake) for calculus, and charting for microbiology organism features; gives a short template for each and a 24-hour review routine."}
  - name: edge-online-recorded-only
    vars:
      courses: "Online data analytics certificate: 10-15 minute recorded videos, can pause, graded by weekly quizzes and a final project in a spreadsheet tool."
      delivery: slides
    assert:
      - {type: llm-rubric, value: "Adapts to pausable recordings (pause-and-paraphrase rather than transcribe), suggests problem or worked-example notes for practical spreadsheet skills, links notes to the final project, and does not recommend specific paid apps."}
  - name: negative-no-course-details
    vars:
      courses: "I'm starting uni next week, what's the best way to take notes?"
    assert:
      - {type: llm-rubric, value: "Does not invent courses; briefly describes the methods and what each suits, and asks for the courses, how each is taught and how each is assessed before making per-course recommendations."}
