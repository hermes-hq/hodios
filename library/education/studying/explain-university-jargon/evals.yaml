schema: 1
baseline: "Explain university terms in the {{country}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-email-terms
    vars:
      country: UK
      terms_or_situation: "I failed one module. My email says I've been offered a 'reassessment' in August, that the 'mark will be capped at 40', and that I could have submitted 'mitigating circumstances' but the 'deadline has passed'. I'm first in my family at uni."
    assert:
      - {type: contains, value: "## Quick answer"}
      - {type: llm-rubric, value: "Leads with the August reassessment as the action item, explains that a capped mark means the resit mark is limited to the pass mark regardless of performance and what that means for the overall result, explains mitigating circumstances and that late claims may still be possible in some cases to ask about, tells the student to check their handbook and contact the student advice centre, and does not state specific university rules as fact."}
  - name: edge-essentials-usa-international
    vars:
      country: USA
    assert:
      - {type: llm-rubric, value: "Covers about 12 to 15 essentials grouped by theme (credits, major and minor, GPA, office hours, syllabus, add/drop, transcript, academic probation, incomplete grade and so on), flags terms that mean something different elsewhere such as 'college' and 'course', mentions attendance and visa matters only as something to check with the international student office, and gives where to ask."}
  - name: negative-missing-country
    vars:
      country: ""
      terms_or_situation: "What's a viva?"
    assert:
      - {type: llm-rubric, value: "Asks which country (and ideally which level, such as PhD or undergraduate) because the meaning and format of a viva varies, or gives a brief general meaning while clearly asking for the country before the full explanation."}
