schema: 1
baseline: "Turn these notes into a script I can record and listen to: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-forces-notes
    vars:
      minutes: 6
      notes: |
        Forces. Newton's 1st law: object stays at rest or constant velocity unless resultant force acts.
        2nd law: F = ma (F in N, m in kg, a in m/s^2). Resultant force = sum of forces taking direction into account.
        Weight W = mg, g = 9.8 N/kg on Earth. Mass is amount of matter (kg), weight is a force (N).
        3rd law: when A exerts a force on B, B exerts an equal and opposite force on A, same type, act on different objects.
        Terminal velocity: falling object speeds up until air resistance = weight, resultant force zero, constant speed.
    assert:
      - {type: llm-rubric, value: "Produces a spoken script of roughly 600 to 750 words with part signposts, short sentences, questions followed by pause markers and then answers; F = ma and W = mg are written as spoken words, units are spelt out, the third-law pairs are explained as acting on different objects, there are no tables or bullet lists inside the script, and it ends with a rapid-fire round."}
  - name: edge-diagram-heavy
    vars:
      minutes: 5
      notes: "Structure of the heart - see labelled diagram: right atrium, right ventricle, left atrium, left ventricle, aorta, pulmonary artery, pulmonary vein, vena cava, valves. Blood flow route: body - vena cava - RA - RV - pulmonary artery - lungs - pulmonary vein - LA - LV - aorta - body. Left ventricle wall thicker - pumps to whole body."
    assert:
      - {type: llm-rubric, value: "Turns the blood flow route into speakable chunks of no more than three items at a time rather than reading a long arrow chain, explains the thicker left ventricle with a question and pause, and refers the listener to the diagram where a spatial layout cannot be spoken."}
  - name: negative-too-short
    vars:
      minutes: 20
      notes: "Photosynthesis: carbon dioxide + water -> glucose + oxygen, needs light and chlorophyll."
    assert:
      - {type: llm-rubric, value: "Writes a short script based only on the one-line note and says it is much shorter than 20 minutes because the notes are brief, instead of padding with facts not in the notes."}
