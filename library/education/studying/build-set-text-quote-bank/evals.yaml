schema: 1
baseline: "Give me key quotes from {{text_title}} for my exam."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-macbeth-extracts
    vars:
      text_title: Macbeth by William Shakespeare
      themes: "ambition, guilt, appearance vs reality, Lady Macbeth"
      text_extracts: |
        Act 1 Scene 3 - Macbeth: "So foul and fair a day I have not seen."
        Act 1 Scene 4 - Macbeth (aside): "Stars, hide your fires; Let not light see my black and deep desires."
        Act 1 Scene 5 - Lady Macbeth: "Come, you spirits / That tend on mortal thoughts, unsex me here" ... "Look like th' innocent flower, / But be the serpent under't."
        Act 1 Scene 7 - Macbeth: "I have no spur / To prick the sides of my intent, but only / Vaulting ambition, which o'erleaps itself / And falls on th' other."
        Act 2 Scene 2 - Macbeth: "Will all great Neptune's ocean wash this blood / Clean from my hand?" Lady Macbeth: "A little water clears us of this deed."
        Act 5 Scene 1 - Lady Macbeth: "Out, damned spot! out, I say!"
    assert:
      - {type: llm-rubric, value: "Every quotation appears verbatim in the pasted extracts with its act and scene, most are short (for example 'vaulting ambition', 'unsex me here', 'be the serpent under't', 'Out, damned spot'), analysis hooks zoom in on a key word, multi-purpose quotes are linked to more than one theme (such as the hand-washing lines for guilt and Lady Macbeth's change), and no quotation from outside the extracts is added."}
  - name: edge-missing-theme
    vars:
      text_title: An Inspector Calls by J.B. Priestley
      themes: "responsibility, class, gender, age"
      text_extracts: |
        Birling: "a man has to mind his own business and look after himself and his own"
        Inspector: "We are members of one body. We are responsible for each other."
        Sheila: "But these girls aren't cheap labour - they're people."
        Inspector: "Public men, Mr Birling, have responsibilities as well as privileges."
    assert:
      - {type: llm-rubric, value: "Builds the bank only from the four supplied lines, notes under Gaps that gender and age have thin coverage and suggests where in the play to look without quoting from memory, and does not add other famous lines from the play."}
  - name: negative-no-extracts
    vars:
      text_title: Jane Eyre by Charlotte Bronte
      text_extracts: "I don't have the book with me, just give me the best quotes."
    assert:
      - {type: llm-rubric, value: "Explains that it only quotes from pasted text to avoid misquotation and asks the student to paste passages from their edition, instead of supplying quotations from memory."}
