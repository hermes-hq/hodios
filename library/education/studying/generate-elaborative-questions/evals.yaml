schema: 1
baseline: "Make some study questions from these notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-enzymes-connected
    vars:
      depth: connected
      notes: |
        Enzymes - biological catalysts, proteins. Active site has a specific shape complementary to the substrate (lock and key; induced fit model is more accurate - active site changes shape slightly when substrate binds).
        Enzymes lower activation energy. Rate increases with temperature up to optimum (~37C for human enzymes) then falls sharply - denaturation, active site shape changes, permanent.
        pH: each enzyme has optimum pH, pepsin ~2, amylase ~7. Extreme pH denatures.
        Substrate concentration: rate increases then plateaus when all active sites occupied.
        Competitive inhibitors bind active site; non-competitive bind elsewhere and change active site shape.
    assert:
      - {type: llm-rubric, value: "Questions require reasoning (for example why rate plateaus at high substrate concentration, why the fall above the optimum is sharper than the rise, how a non-competitive inhibitor and high temperature both reduce rate through active-site shape, why increasing substrate overcomes competitive but not non-competitive inhibition); includes Link or Contrast questions across sections; each model answer has key points for self-marking; nothing is presented as from the notes that is not."}
  - name: edge-error-in-notes
    vars:
      depth: basic
      notes: |
        Supply and demand. When price goes up, demand goes up because people want it more.
        Supply curve slopes upward because producers want to sell more at higher prices to earn more profit.
        Equilibrium is where supply meets demand. If price is above equilibrium there is a surplus, below there is a shortage.
        A shift in demand is caused by income, tastes, price of substitutes and complements.
    assert:
      - {type: llm-rubric, value: "Flags that 'when price goes up, demand goes up' confuses the law of demand (quantity demanded falls as price rises) and does not build questions or model answers on that error; the remaining questions are why or how questions about supply slope, surplus and shortage and demand shifters."}
  - name: negative-too-short
    vars:
      depth: challenge
      notes: "photosynthesis"
    assert:
      - {type: llm-rubric, value: "Asks for fuller notes or the textbook section instead of generating a full question set and model answers from general knowledge."}
