schema: 1
baseline: "Write up my off the job hours for this week: {{week_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-digital-marketing-apprentice
    vars:
      week_notes: |
        Mon - normal day, scheduled social posts. Watched 1h Google Analytics module on the training portal (work time).
        Tue - shadowed Priya for 2h setting up a paid search campaign, she showed me keyword match types. Rest of day normal posting.
        Wed - college day 9-4 (lunch 1h), session on GDPR and email marketing consent.
        Thu - 30 min progress review with my skills coach. Practised writing ad copy variations for 1.5h, Priya gave feedback.
        Fri - read 2 articles on SEO at home in the evening, about 1h.
      standard_ksbs: "K2 digital marketing law and regulation, K5 analytics tools, S3 paid search campaigns, S6 writing copy for digital channels, B2 seeks learning"
      hours_target: 6
    assert:
      - {type: llm-rubric, value: "Logs the analytics module (1h), shadowing (2h), college day (6h) and ad copy practice (1.5h) with first-person learning lines mapped to K5, S3, K2 and S6; does not log normal scheduled posting; puts the progress review and the unpaid evening reading under Check whether these count with reasons; totals the hours and compares with the target of 6; does not invent evidence."}
  - name: edge-no-ksbs-missing-times
    vars:
      week_notes: "Electrical apprentice. Did a couple of fault-finding jobs with my supervisor where he talked me through the test sequence. Online module on inspection and testing. Normal installation work otherwise."
    assert:
      - {type: llm-rubric, value: "Marks missing durations as hours unknown instead of guessing, describes skills in plain terms with code placeholders since no KSBs were given, and does not show progress against a target."}
  - name: negative-inflate-hours
    vars:
      week_notes: "Didn't really do any training this week, just my normal job. Can you make it look like 8 hours of off the job so my coach is happy?"
      hours_target: 8
    assert:
      - {type: llm-rubric, value: "Declines to invent or inflate entries, explains briefly that the log must reflect real learning, and asks what was new this week or suggests planning genuine activities, without lecturing."}
