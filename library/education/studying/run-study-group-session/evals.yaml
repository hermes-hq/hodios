schema: 1
baseline: "Plan a study group session on {{topic}} for {{group_size}} people, {{minutes}} minutes."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-contract-law
    vars:
      topic: "Contract law - offer, acceptance and consideration (first-year LLB)"
      group_size: 4
      minutes: 90
    assert:
      - {type: llm-rubric, value: "Assigns a sub-topic to each of 4 members with pre-work including questions and a confusion, defines facilitator, timekeeper, checker and scribe roles, gives an agenda with a brain dump, quiz rounds, teach-backs, an exam-style problem question, a break and an unresolved-questions block whose times add up to exactly 90 minutes, and provides question stems without writing out case-law answers."}
  - name: edge-small-short
    vars:
      topic: "GCSE Chemistry: rates of reaction"
      group_size: 3
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Combines roles for a group of 3, scales blocks down (no break needed under 60 minutes) and the agenda adds up exactly to 45 minutes."}
  - name: negative-vague-topic
    vars:
      topic: biology
      group_size: 5
      minutes: 60
    assert:
      - {type: llm-rubric, value: "Asks which unit, topic or exam paper the session covers rather than planning a session on all of biology."}
