schema: 1
baseline: "Explain this assignment brief to me: {{brief}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-report-with-rubric
    vars:
      brief: "Module BUS204. Assessment 2 (60%). Write a 2,500-word business report (excluding references and appendices) critically evaluating the sustainability strategy of a FTSE 100 company of your choice. Use at least 8 academic sources. Harvard referencing. Submit as PDF via Turnitin."
      rubric: "Analysis and evaluation 40%: First class shows critical evaluation weighing evidence and alternative perspectives. Use of literature 25%: wide range of relevant academic sources integrated into argument. Structure and presentation 20%: report conventions followed, executive summary, clear headings. Referencing 15%: accurate Harvard throughout."
      due_date: "14 March 23:59; today is 20 February"
    assert:
      - {type: contains, value: "## Pre-submission checklist"}
      - {type: llm-rubric, value: "Explains that critically evaluating means weighing evidence and alternatives rather than describing the strategy, notes report conventions (executive summary, headings) and that 8 academic sources is a minimum, builds a dated plan from 20 February to 14 March with a buffer, and does not write any of the report."}
  - name: edge-no-rubric-no-date
    vars:
      brief: "Discuss the extent to which the Treaty of Versailles caused the Second World War. 2,000 words."
    assert:
      - {type: llm-rubric, value: "Explains that 'discuss the extent' requires a judged argument weighing Versailles against other causes, labels hidden expectations as inferred, uses countdown dates such as D-14 and says why, and lists questions for the tutor such as referencing style and source expectations."}
  - name: negative-thin-brief
    vars:
      brief: "Assignment: climate change."
    assert:
      - {type: llm-rubric, value: "Says the brief is too thin to decode, lists what is missing (task, command word, format, length, criteria) as questions for the tutor, and does not invent a word count, format or thesis."}
