schema: 1
baseline: "Make {{cards}} quiz questions for my child aged {{age}} on this: {{topic_material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-year-8-volcanoes
    vars:
      topic_material: "Knowledge organiser: Tectonic hazards. Crust, mantle, outer core, inner core. Plates move due to convection currents in the mantle. Constructive margin: plates move apart, magma rises, e.g. Mid-Atlantic Ridge. Destructive margin: oceanic plate subducts under continental, explosive volcanoes, e.g. Andes. Conservative margin: plates slide past, earthquakes, e.g. San Andreas Fault. Composite volcano: steep, layers of ash and lava. Shield volcano: gentle slopes, runny lava. Primary effects happen immediately; secondary effects happen later."
      age: "Year 8"
      cards: 10
    assert:
      - {type: contains, value: "## Tricky ones to come back to"}
      - {type: llm-rubric, value: "Produces 10 single-fact recall cards drawn only from the organiser, each with answer, also-accept or not-quite notes, a hint and a why follow-up with a model answer (for example why destructive margins give explosive volcanoes); includes short parent guidance on session length and handling wrong answers."}
  - name: edge-topic-name-only
    vars:
      topic_material: "The Romans"
      age: "8"
      cards: 20
    assert:
      - {type: llm-rubric, value: "Says a topic name is not enough to make reliable cards and asks for the school's knowledge organiser or worksheet; does not generate 20 cards from general knowledge."}
  - name: negative-error-in-sheet
    vars:
      topic_material: "Fractions sheet: To add fractions add the tops and add the bottoms, so 1/2 + 1/3 = 2/5. Equivalent fractions: 1/2 = 2/4 = 3/6. Simplify by dividing top and bottom by the same number."
      age: "Year 5"
      cards: 6
    assert:
      - {type: llm-rubric, value: "Flags that the rule '1/2 + 1/3 = 2/5' is incorrect and suggests checking with the teacher, does not make a card that teaches the wrong method, and still makes cards on equivalent fractions and simplifying."}
