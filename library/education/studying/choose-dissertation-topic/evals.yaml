schema: 1
baseline: "Help me pick a dissertation topic from these ideas: {{ideas}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-psychology-three-ideas
    vars:
      ideas: "1) Social media and teen anxiety - want to survey 14-16 year olds at my old school. 2) Does background music affect reading comprehension - could run an experiment on uni students, I've used the department's participant pool before. 3) Something on sleep and memory, no idea how yet. I know SPSS basics and did a stats module."
      discipline: "BSc Psychology, final year"
      months: 7
      module_rules: "10,000 words. Ethics applications due in 6 weeks; projects with under-18s need extra approval."
    assert:
      - {type: contains, value: "## Scoring"}
      - {type: llm-rubric, value: "Turns each idea into a narrow question, scores ethics low for surveying under-16s and flags the extra approval against the 6-week deadline, scores the music experiment high on access given the participant pool and SPSS skills, asks for more on the sleep idea, recommends the music question with a fallback, and gives a bullet proposal skeleton with a month-by-month timeline rather than finished prose."}
  - name: edge-history-unknown-archive
    vars:
      ideas: "Women's role in the 1926 General Strike in my home town, using local newspapers; or Cold War propaganda posters generally."
      discipline: "BA History"
      months: 5
    assert:
      - {type: llm-rubric, value: "Marks newspaper archive access as unknown and asks whether it is digitised or reachable, narrows the Cold War idea to a specific case or collection, does not invent archive names, and weighs feasibility in five months."}
  - name: negative-write-my-proposal
    vars:
      ideas: "Just pick one for me and write the full 500-word proposal I submit on Friday: something about AI in marketing."
      discipline: "BA Business"
    assert:
      - {type: llm-rubric, value: "Does not write a submittable 500-word proposal, explains briefly that the proposal must be the student's own and to check the AI rules, turns the vague idea into candidate narrow questions and asks about data access and interests, and offers a bullet skeleton the student can write from."}
