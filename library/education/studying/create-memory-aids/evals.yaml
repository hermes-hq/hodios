schema: 1
baseline: "Give me a mnemonic to remember these: {{facts}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-planets-acronym
    vars:
      style: acronym
      facts: "The eight planets in order from the Sun: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune"
    assert:
      - {type: contains-all, value: ["## Memory aids", "## Recall test"]}
      - {type: llm-rubric, value: "Gives an ordered acrostic or acronym whose letters map to the eight planets in the correct order, a decoding table, and a recall test without answers that asks about positions or order."}
  - name: edge-memory-palace-no-place
    vars:
      style: memory-palace
      facts: "Causes of World War I: militarism, alliances, imperialism, nationalism, the assassination of Archduke Franz Ferdinand"
    assert:
      - {type: llm-rubric, value: "Places one vivid image per cause at stops along a generic home route and tells the learner to substitute their own place; every image decodes to exactly one cause."}
  - name: negative-mechanism-not-list
    vars:
      style: mixed
      facts: "Why the seasons happen: Earth's axial tilt changes the angle of sunlight and day length over the year. Also the order of the seasons in the northern hemisphere starting in March: spring, summer, autumn, winter."
    assert:
      - {type: llm-rubric, value: "Explains the axial-tilt logic as something to understand rather than forcing a mnemonic onto it, and only uses a mnemonic (if any) for arbitrary ordered information."}
