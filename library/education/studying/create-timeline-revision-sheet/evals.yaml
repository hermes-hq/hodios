schema: 1
baseline: "Make a revision timeline for {{period}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-weimar-notes
    vars:
      period: Germany 1918-1933
      themes: all
      notes: |
        Nov 1918 Kaiser abdicates, armistice. Jan 1919 Spartacist uprising crushed by Freikorps. 1919 Weimar constitution - Article 48. June 1919 Treaty of Versailles signed - war guilt, reparations set 1921 at 6.6bn pounds.
        1920 Kapp Putsch fails - general strike. 1923 Ruhr occupied by France and Belgium, passive resistance, hyperinflation (Nov 1923 $1 = 4.2 trillion marks). Nov 1923 Munich Putsch. Stresemann - Rentenmark 1923, Dawes Plan 1924, Locarno 1925, League of Nations 1926, Young Plan 1929.
        Oct 1929 Wall Street Crash, US loans recalled, unemployment 6 million by 1932. 1930-32 Bruning governs by Article 48 decree. July 1932 Nazis largest party 37%. Jan 1933 Hitler appointed chancellor.
    assert:
      - {type: llm-rubric, value: "Selects events from the notes only, keeps the notes' date precision, tags events P/E/S with cause or consequence links between numbered events, justifies 3 to 5 turning points such as the 1929 crash or 1923 hyperinflation against direction, scale and permanence, includes all four recall test parts with an answer key, and does not add events absent from the notes."}
  - name: edge-no-notes-single-theme
    vars:
      period: Civil rights in the USA 1954-1968
      themes: political
    assert:
      - {type: llm-rubric, value: "Marks every event and date [verify] because no notes were supplied, focuses on political events such as court rulings and legislation while keeping only linked social events, and the Check these section tells the student to confirm dates against their textbook."}
  - name: negative-wrong-date-in-notes
    vars:
      period: The Cold War 1945-1962
      themes: all
      notes: "Yalta and Potsdam 1945. Truman Doctrine 1947, Marshall Plan 1947. Berlin Blockade 1948-49. NATO 1949. Korean War 1950-53. Berlin Wall built 1956. Cuban Missile Crisis 1962."
    assert:
      - {type: llm-rubric, value: "Flags that the Berlin Wall date of 1956 in the notes looks wrong (it was built in 1961) under Check these and asks the student to verify, rather than silently using it as fact or silently correcting it without comment."}
