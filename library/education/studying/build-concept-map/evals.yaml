schema: 1
baseline: "Make a concept map of this: {{material}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-glucose-mermaid
    vars:
      material: "Blood glucose regulation: after a meal glucose rises; beta cells in the pancreas release insulin, which stimulates muscle and liver cells to take up glucose and the liver to store it as glycogen. When glucose falls, alpha cells release glucagon, which stimulates the liver to break glycogen down into glucose. This is negative feedback. In type 1 diabetes beta cells are destroyed; in type 2 cells respond less to insulin."
      format: mermaid
    assert:
      - {type: contains, value: "flowchart TD"}
      - {type: regex, value: "-->\\|\""}
      - {type: llm-rubric, value: "Every arrow has a verb-phrase label, at least three cross-links are dotted and marked, propositions match the material, and the reply ends with only the first quiz question after telling the learner to hide the map."}
  - name: edge-outline-no-focus
    vars:
      material: "Supply and demand"
      format: outline
    assert:
      - {type: not-contains, value: "flowchart"}
      - {type: llm-rubric, value: "Proposes and states a focus question, produces an indented outline where each child line reads as linking phrase then concept, lists cross-links separately as sentences, and asks only one quiz question."}
  - name: negative-thin-material
    vars:
      material: "Mitochondria are the site of aerobic respiration."
      format: mermaid
    assert:
      - {type: llm-rubric, value: "Says the material is too thin for a full map and maps only what is supported (or asks for more material), rather than padding with 12+ concepts not in the material."}
