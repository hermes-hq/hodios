schema: 1
baseline: "Help me prepare for my seminar on this reading: {{reading_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sociology-reading
    vars:
      seminar_question: "Does the 'McDonaldization' thesis still describe work today?"
      reading_notes: |
        Ritzer, The McDonaldization of Society, ch.1 (my notes)
        - Takes Weber's rationalisation idea and applies it to fast food (p.1-3)
        - 4 dimensions: efficiency, calculability, predictability, control (p.12-15)
        - Control via non-human technology - scripts, machines (p.14)
        - 'Irrationality of rationality' - rational systems produce irrational results, dehumanising for workers and customers (p.16)
        - Spreads to education, healthcare, etc (p.18-20)
        - Uses lots of examples, not much systematic data
    assert:
      - {type: llm-rubric, value: "States the argument in two lines (rationalisation in Weber's sense spreading via the four dimensions, with irrational consequences), notes reliance on examples over systematic data as the method, gives an agree point and a tentatively phrased push-back point using the notes' page numbers, writes an open question linked to work today (for example gig work or algorithmic management), and gives joining phrases in the five groups."}
  - name: edge-no-page-numbers-second-language
    vars:
      reading_notes: "Article by Ostrom about commons. She says people can manage shared resources without government or privatisation. She studied fisheries, forests. Design principles - clear boundaries, monitoring, sanctions. English is my second language and I never talk in class."
    assert:
      - {type: llm-rubric, value: "Uses 'p. __' placeholders rather than inventing page numbers, keeps sentences short and in plain English with phrases suitable for a second-language speaker, and suggests making the easiest contribution early in the seminar."}
  - name: negative-no-notes
    vars:
      reading_notes: "Foucault Discipline and Punish. Haven't read it."
    assert:
      - {type: llm-rubric, value: "Does not invent the argument, quotations or page numbers as if from the student's reading; asks for notes or key passages or suggests how to read the key parts quickly before preparing contributions."}
