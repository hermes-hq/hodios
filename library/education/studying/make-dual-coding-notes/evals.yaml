schema: 1
baseline: "Turn these notes into visual notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-water-cycle-and-rivers
    vars:
      visual_style: mixed
      notes: |
        Water cycle: evaporation from oceans (sun heats water), transpiration from plants, condensation forms clouds as air rises and cools, precipitation, surface runoff, infiltration into soil, groundwater flow back to rivers and sea.
        River long profile: upper course - steep gradient, V-shaped valley, vertical erosion, waterfalls and interlocking spurs. Middle - meanders, lateral erosion. Lower - flat, wide floodplain, deposition, levees, estuary.
        Erosion processes: hydraulic action, abrasion, attrition, solution.
    assert:
      - {type: llm-rubric, value: "Uses a cycle visual for the water cycle, a three-part profile or side-by-side diagram for upper, middle and lower course, and a simple list-with-icons or grid for the four erosion processes where each icon conveys meaning; each visual has step-by-step drawing instructions with 7 or fewer short labels and a redraw prompt; no decorative imagery is suggested."}
  - name: edge-single-style-mismatch
    vars:
      visual_style: timelines
      notes: |
        Classification of organisms: Kingdom, Phylum, Class, Order, Family, Genus, Species. Mnemonic: King Philip Came Over For Good Soup.
        Five kingdoms: animals, plants, fungi, protoctists, prokaryotes. Binomial naming: Genus species, e.g. Homo sapiens, genus capitalised, italicised.
    assert:
      - {type: llm-rubric, value: "Recognises that classification is a hierarchy, not a sequence in time, and uses a tree or nested boxes instead of forcing a timeline, saying why it departed from the requested style."}
  - name: negative-too-little
    vars:
      visual_style: mixed
      notes: "Mitosis."
    assert:
      - {type: llm-rubric, value: "Asks for fuller notes before designing pages, rather than inventing the content of mitosis from general knowledge."}
