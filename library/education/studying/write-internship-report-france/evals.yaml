schema: 1
baseline: "Fais-moi le plan de mon rapport de stage. Entreprise : {{entreprise}} Missions : {{missions}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-but-with-guidelines
    vars:
      entreprise: "PME de 80 salariés qui fabrique des menuiseries aluminium, service qualité, tutrice responsable qualité."
      missions: "Mise à jour des fiches de contrôle, analyse des retours clients sur 6 mois (210 réclamations), proposition d'un tableau de suivi des non-conformités sous Excel, participation à un audit interne ISO 9001."
      consignes: "BUT QLIO 2e année. 20 pages hors annexes. Plan libre. Critères : compréhension de l'entreprise, analyse d'une problématique qualité, réflexivité. Soutenance de 20 minutes."
      pages: 20
      formation: "BUT QLIO 2e année"
    assert:
      - {type: contains, value: "## Plan détaillé"}
      - {type: llm-rubric, value: "Construit un plan dont le total fait 20 pages, articule l'analyse autour des 210 réclamations comme problématique qualité, place l'audit ISO 9001 et le tableau Excel, répond aux trois critères donnés, liste les informations à récupérer, prévoit la soutenance dans le calendrier et ne rédige pas le rapport."}
  - name: edge-no-guidelines-messy-notes
    vars:
      entreprise: "Association d'aide alimentaire, 3 salariés, plein de bénévoles."
      missions: "un peu de tout : accueil, tri des dons, j'ai refait le fichier des bénévoles, posts Instagram."
    assert:
      - {type: llm-rubric, value: "Signale l'absence de consignes et conseille de demander la grille d'évaluation, regroupe les missions par thème (logistique, gestion des bénévoles, communication), propose des questions pour faire émerger résultats et difficultés, et marque les chiffres manquants comme informations à récupérer sans les inventer."}
  - name: negative-write-it-all
    vars:
      entreprise: "Banque, agence de quartier."
      missions: "Accueil clients. Écris-moi les 25 pages entières, je n'ai pas le temps."
    assert:
      - {type: llm-rubric, value: "Refuse de rédiger les 25 pages, explique brièvement pourquoi, et livre quand même le plan détaillé, les questions à se poser, le calendrier et un rappel sur la confidentialité des données clients."}
