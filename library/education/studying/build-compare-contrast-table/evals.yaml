schema: 1
baseline: "Compare {{items_to_compare}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mitosis-meiosis
    vars:
      items_to_compare: mitosis and meiosis
      course: GCSE Biology
      notes: "Mitosis: one division, 2 daughter cells, genetically identical, diploid, growth and repair, asexual reproduction. Meiosis: two divisions, 4 cells, genetically different, haploid gametes, happens in testes and ovaries, variation from independent assortment and crossing over."
    assert:
      - {type: llm-rubric, value: "Uses criteria such as number of divisions, number of daughter cells, chromosome number, genetic identity, where it happens and purpose; fills cells from the notes; lists easily confused points such as diploid versus haploid and two versus four cells with ways to tell them apart; includes a blanked table, which-process questions and spot-the-mistake statements with an answer key."}
  - name: edge-no-notes-theories
    vars:
      items_to_compare: "functionalism, Marxism, feminism and interactionism"
      course: A-level Sociology
    assert:
      - {type: llm-rubric, value: "Chooses criteria suited to sociological theories (structural or action, consensus or conflict, view of society, key concepts, criticisms), states once that the table should be checked against course materials because no notes were given, marks specific thinkers or studies [verify], and keeps cells short and parallel."}
  - name: negative-single-item
    vars:
      items_to_compare: "the Krebs cycle"
    assert:
      - {type: llm-rubric, value: "Asks what the Krebs cycle should be compared with (for example glycolysis or the electron transport chain) rather than producing a comparison table of one item."}
