schema: 1
baseline: "Is my explanation of {{concept}} correct? {{learner_explanation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-vaccine-jargon
    vars:
      concept: how vaccines produce immunity
      level: high school biology
      learner_explanation: "A vaccine puts antigens in your body which triggers the immune response, so then you have antibodies and you're immune forever."
    assert:
      - {type: llm-rubric, value: "Flags 'triggers the immune response' as jargon doing the explaining, identifies missing memory cells / secondary response, and corrects 'immune forever' as an overstatement; asks targeted follow-up questions and does not provide a full model explanation."}
  - name: edge-correct-explanation
    vars:
      concept: opportunity cost
      level: first-year economics
      learner_explanation: "Opportunity cost is the value of the best alternative you give up when you choose something. If I spend Saturday working a shift for 80 dollars instead of going to a course that would have been worth more to me, the cost of working isn't zero just because I got paid - it's the value of that course I didn't take. It only counts the best alternative, not all of them."
    assert:
      - {type: llm-rubric, value: "Recognises the explanation as correct and complete for the level without inventing errors, and asks a stretch question (for example about sunk costs or non-monetary alternatives)."}
  - name: negative-circular
    vars:
      concept: inflation
      learner_explanation: "Inflation is basically when prices inflate and everything gets more expensive because of inflation in the economy."
    assert:
      - {type: llm-rubric, value: "Identifies the explanation as circular and vague, quotes the circular phrases, asks questions about what causes a general rise in prices and what it means for purchasing power, and does not write the explanation for the learner."}
