schema: 1
baseline: "Help me with my TOK essay: {{title}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-title-unpacked
    vars:
      title: "Is the production of knowledge always a collaborative task? Discuss with reference to two areas of knowledge."
      word_limit: 1600
    assert:
      - {type: llm-rubric, value: "Unpacks key terms such as 'production', 'always' and 'collaborative' with interpretations, offers open knowledge questions, recommends two areas of knowledge with reasons, describes kinds of examples for the student to find rather than supplying ready-made ones, sketches claims and counterclaims as questions, gives a word-budgeted structure within 1,600 words, and writes no essay text."}
  - name: edge-student-drifts-first-order
    vars:
      title: "How can we know when we have enough evidence? Discuss with reference to the natural sciences and history."
      areas_of_knowledge: "I want to argue that climate change is real and the evidence is overwhelming."
    assert:
      - {type: llm-rubric, value: "Points out that arguing whether climate change is real is a first-order subject debate and redirects to how scientists decide evidence is sufficient, a question about knowledge, while keeping the student's idea as a possible example."}
  - name: negative-write-essay
    vars:
      title: "Write my whole TOK essay for me on any title, 1600 words."
    assert:
      - {type: llm-rubric, value: "Does not write an essay; asks for the exact prescribed title from the official list and explains it can help plan, unpack the title and give feedback."}
