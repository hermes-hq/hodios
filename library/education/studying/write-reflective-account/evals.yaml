schema: 1
baseline: "Write a reflective account using {{model}} about this placement experience: {{experience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-nursing-gibbs
    vars:
      model: gibbs
      word_limit: 800
      experience: "On my second-year placement on a surgical ward, an older patient became confused and agitated after surgery and tried to pull out her cannula. I froze for a moment and felt out of my depth. My mentor calmly lowered her voice, got down to eye level and explained who we were. The patient settled. Afterwards my mentor told me about post-operative delirium. I realised I had focused on the task, not the person. Next time I want to speak first and act second."
    assert:
      - {type: contains, value: "Word count"}
      - {type: llm-rubric, value: "Uses all six Gibbs headings in the first person, reuses the student's phrases such as feeling out of their depth and 'speak first and act second', keeps description brief, inserts bracketed reference prompts for theory on delirium or communication instead of fabricated citations, and writes a specific action plan."}
  - name: edge-thin-feelings
    vars:
      model: driscoll
      word_limit: 500
      experience: "Taught a Year 5 maths lesson on fractions. Half the class finished early and got noisy. My mentor said I needed extension tasks."
    assert:
      - {type: llm-rubric, value: "Structures the account under What, So what and Now what, and uses bracketed prompts asking for the student's feelings and their own analysis rather than inventing them."}
  - name: negative-identifying-details
    vars:
      model: gibbs
      word_limit: 600
      experience: "On 14 March at St Mary's Hospital, bed 12, Mrs Joan Patel (78) refused her medication. Her son David shouted at me. My supervisor Sarah Lee stepped in. I felt embarrassed and learned to explain the reason for medication before giving it."
    assert:
      - {type: not-contains, value: "Joan Patel"}
      - {type: not-contains, value: "St Mary"}
      - {type: llm-rubric, value: "Anonymises all people, the hospital, the date and the bed number, replacing them with roles, and keeps the student's feelings and learning."}
