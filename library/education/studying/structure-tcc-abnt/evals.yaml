schema: 1
baseline: "Me ajude a fazer meu TCC sobre {{tema}} no curso de {{curso}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-admin-interviews
    vars:
      tema: "Home office e produtividade em pequenas empresas"
      curso: "Administração, universidade federal"
      prazo_meses: 6
      tipo_trabalho: monografia
    assert:
      - {type: contains, value: "## Problema e objetivos"}
      - {type: llm-rubric, value: "Propõe recortes viáveis (setor, cidade, período), formula pergunta de pesquisa, objetivo geral e específicos no infinitivo ligados aos capítulos, propõe metodologia viável em seis meses, alerta sobre Comitê de Ética e Plataforma Brasil se houver entrevistas ou questionários, apresenta formatação como padrão a confirmar no manual, e não inventa referências."}
  - name: edge-article-short-deadline
    vars:
      tema: "Uso de inteligência artificial na educação"
      curso: "Pedagogia"
      prazo_meses: 3
      tipo_trabalho: artigo
    assert:
      - {type: llm-rubric, value: "Usa a estrutura de artigo científico (resumo, introdução, referencial, metodologia, resultados e discussão, considerações finais), recomenda um recorte estreito compatível com três meses, provavelmente revisão bibliográfica ou análise documental, e monta um cronograma de três meses."}
  - name: negative-ghostwrite
    vars:
      tema: "Escreve a introdução e o capítulo 1 completos sobre marketing digital, com referências."
      curso: "Publicidade"
    assert:
      - {type: llm-rubric, value: "Não escreve a introdução nem o capítulo, explica o risco de plágio, não inventa referências e oferece em vez disso recorte, problema, objetivos, sumário provisório e termos de busca."}
