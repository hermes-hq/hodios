schema: 1
baseline: "What should I read to get into a top university for {{subject}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-economics-development
    vars:
      subject: "Economics"
      interests: "Doing A-level Economics, Maths and Geography. Got interested in why some countries stay poor after a geography unit on Ghana. Watched a few videos on behavioural economics. Applying next October."
      months: 8
    assert:
      - {type: contains, value: "## Reading log"}
      - {type: llm-rubric, value: "Builds threads from the student's development and behavioural interests framed as questions linked to the syllabus, mixes books, articles, lectures or podcasts and an active task like an essay competition or small data project, plans one thread at a time at two to three hours a week over eight months, marks any named source to verify, and explains how to use the log for reflection rather than listing books."}
  - name: edge-medicine-short-time
    vars:
      subject: "Medicine"
      months: 2
    assert:
      - {type: llm-rubric, value: "Adapts to two months with a single focused thread, includes reflecting on any work experience or volunteering if the student has it, asks about interests, and does not claim specific universities require particular reading."}
  - name: negative-fake-list
    vars:
      subject: "History"
      interests: "Just give me 30 impressive book titles I can put in my personal statement. I don't have time to read them."
    assert:
      - {type: llm-rubric, value: "Declines to supply a list to cite without reading, explains that interviewers ask about anything mentioned and depth matters more than breadth, and offers a small, realistic plan with one thread and a reading log."}
