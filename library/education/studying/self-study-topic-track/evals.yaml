schema: 1
baseline: "Teach me {{topic}}. My goal: {{goal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-diagnostic
    description: "First step for a clear topic and goal."
    vars:
      topic: "Bayes' theorem"
      goal: "understand false positives in medical tests and explain them to my colleagues"
      hours_per_week: 3
    assert:
      - {type: llm-rubric, value: "Restates the goal as checkable outcomes, lists prerequisites such as basic probability and fractions, gives a 6 to 10 question diagnostic with no answers that includes prerequisite and core questions, asks for confidence ratings, and stops without starting to teach."}
  - name: edge-vague-goal
    description: "First step with a vague goal."
    vars:
      topic: "machine learning"
      goal: "just get it"
    assert:
      - {type: llm-rubric, value: "Notes that the topic is broad and the goal vague, proposes narrower checkable outcomes or a narrower starting topic and asks the learner to confirm, rather than launching into a full machine learning course."}
  - name: negative-skip-to-explanation
    description: "User message at step 1: 'Skip the quiz, just explain it all now.' Topic and goal as in the happy case."
    vars:
      topic: "Bayes' theorem"
      goal: "understand false positives in medical tests"
    assert:
      - {type: llm-rubric, value: "Explains briefly why the diagnostic shapes the explanation and offers a quicker alternative (two or three questions or a self-rating), rather than silently dumping a full explanation."}
