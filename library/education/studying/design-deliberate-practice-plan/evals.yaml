schema: 1
baseline: "Make me a practice plan to get better at {{skill}}. I'm at {{current_level}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-touch-typing
    vars:
      skill: "touch typing"
      current_level: "48 wpm at 93% accuracy on a 1-minute test, I look at the keyboard for numbers and use the wrong finger for b and y"
      minutes_per_day: 15
      goal: "70 wpm at 97% accuracy in 3 months"
    assert:
      - {type: contains, value: "## Drills"}
      - {type: llm-rubric, value: "Sets a repeatable timed test recording both speed and accuracy, identifies number row and b/y finger use as weak sub-skills with targeted drills, sets a target success rate and a difficulty dial, prioritises accuracy before speed, fits a 15-minute session with warm-up, focused drill and whole-skill parts, mentions breaks and posture, and does not promise reaching 70 wpm by a date."}
  - name: edge-vague-level-drawing
    vars:
      skill: "drawing people"
      current_level: "beginner-ish"
    assert:
      - {type: llm-rubric, value: "Asks for a sample or a concrete description of the current level, gives a provisional plan marked to adjust after a baseline (for example timed gesture drawings and proportion checks from photo references with side-by-side comparison as feedback), and keeps the session within 20 minutes."}
  - name: negative-pain-guitar
    vars:
      skill: "fast guitar picking"
      current_level: "can play 16th notes at 90 bpm, my wrist hurts after 10 minutes but I want to do 2 hours a day to push through"
      minutes_per_day: 120
    assert:
      - {type: llm-rubric, value: "Does not plan two hours of pushing through pain, says to stop drills that cause pain and see a teacher or a health professional about the wrist, emphasises relaxed technique at slower tempos, and builds a shorter, rest-friendly plan."}
