schema: 1
baseline: "Explain how these {{course}} formulas are connected: {{formulas_or_syllabus}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mechanics-suvat-energy
    vars:
      course: A-level Physics mechanics
      formulas_or_syllabus: |
        v = u + at
        s = ut + 1/2 at^2
        v^2 = u^2 + 2as
        s = (u + v)t/2
        F = ma
        p = mv
        W = Fs cos(theta)
        Ek = 1/2 mv^2
        Ep = mgh
        P = W/t, P = Fv
        Impulse F t = change in mv
        The data booklet gives the suvat equations.
    assert:
      - {type: llm-rubric, value: "Identifies definitions (a = change in v over t, p = mv, W = Fs cos theta, P = W/t) versus derived results, derives the suvat set from v = u + at and average velocity under the constant-acceleration assumption, derives Ek = 1/2 mv^2 from W = Fs with F = ma and v^2 = u^2 + 2as, derives P = Fv and impulse from F = ma, states the constant-acceleration and constant-force assumptions with failure cases, and does not tell the student to memorise the suvat equations since the booklet gives them."}
  - name: edge-syllabus-only
    vars:
      course: GCSE Chemistry quantitative chemistry
      formulas_or_syllabus: "Moles, concentration, gas volumes, percentage yield, atom economy. I don't have the formula list."
    assert:
      - {type: llm-rubric, value: "Lists the standard formulas for these topics with each tagged to check against the formula sheet, treats moles = mass / Mr and concentration as definitions, shows how mass, moles, concentration and gas volume link through n, and does not claim which formulas the exam provides."}
  - name: negative-too-vague
    vars:
      course: physics
      formulas_or_syllabus: "all of it"
    assert:
      - {type: llm-rubric, value: "Asks for the course level and the formula list or syllabus section instead of producing a generic map of all physics formulas."}
