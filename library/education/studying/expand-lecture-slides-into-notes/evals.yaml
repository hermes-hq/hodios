schema: 1
baseline: "Turn these lecture slides into notes: {{slides}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-market-failure
    vars:
      course_context: "First-year microeconomics."
      slides: |
        Slide 1: Market failure
        Slide 2: Efficient markets: MB = MC
        Slide 3: Externalities - MSC vs MPC - overproduction - [graph]
        Slide 4: Pigouvian tax - set t = MEC at Q*
        Slide 5: Public goods: non-rival, non-excludable - free rider
        Slide 6: Next week: government failure
    assert:
      - {type: contains, value: "## What the slides leave unexplained"}
      - {type: llm-rubric, value: "States the lecture's argument (markets are efficient when marginal benefit equals marginal cost, and externalities and public goods break that, motivating intervention), explains MSC, MPC and MEC in full, labels added background as standard explanation, flags the slide 3 graph as not described, and writes check questions that test reasoning such as why a tax equal to marginal external cost restores efficiency."}
  - name: edge-own-notes-conflict
    vars:
      slides: "Slide 7: Memory - Working memory capacity: 7 ± 2"
      own_notes: "Lecturer said the 7 plus or minus 2 figure is outdated and current estimates are about 4 chunks (Cowan)."
    assert:
      - {type: llm-rubric, value: "Uses the student's notes to explain that the lecturer treated 7 ± 2 as outdated and about 4 chunks as the current estimate, marks this as from the student's notes, and does not present the slide's figure as the current view."}
  - name: negative-titles-only
    vars:
      slides: "Slide 1: Week 4. Slide 2: [image]. Slide 3: [image]. Slide 4: Questions?"
    assert:
      - {type: llm-rubric, value: "Says the slides contain no content to expand and asks for the slide text, speaker notes, recording or the student's notes, instead of inventing a lecture topic and notes."}
