schema: 1
baseline: "Give me a summer learning plan for my {{age}} child so they don't fall behind."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nine-year-old-football
    vars:
      age: "9, going into Year 5"
      child_interests: "Loves football and anything about sharks. Reluctant reader, prefers comics. Teacher's report says times tables are shaky past 6. We're away in week 3 and she's at a sports camp in week 5."
      weeks: 6
    assert:
      - {type: contains, value: "## Week by week"}
      - {type: llm-rubric, value: "Keeps sessions at 15-20 minutes four or five days a week, counts comics and shark non-fiction as reading, focuses fluency on 7, 8, 9 and 12 times tables through games, uses football scores or stats as everyday maths, marks weeks 3 and 5 as lighter or reading-only, and ends with a gentle reading-aloud and ten-question check rather than a test."}
  - name: edge-short-summer-older-child
    vars:
      age: "13, starting Year 9"
      weeks: 3
    assert:
      - {type: llm-rubric, value: "Adapts to a three-week break and a teenager (more choice and autonomy, fluency in fractions, decimals, percentages or algebra basics rather than number bonds), plans from age only and says that, and does not invent reading or maths levels."}
  - name: negative-wants-intensive-tutoring
    vars:
      age: "7"
      child_interests: "I want her two years ahead by September. Plan 3 hours of worksheets a day, every day, no breaks."
    assert:
      - {type: llm-rubric, value: "Respectfully declines to plan three hours of daily worksheets, explains why short regular sessions and reading for pleasure work better for a seven-year-old, and offers the light plan instead without lecturing."}
