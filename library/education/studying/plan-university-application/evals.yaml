schema: 1
baseline: "Help me plan my university applications. Profile: {{student_profile}}. Applying: {{countries_and_level}}. Start: {{start_term}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-and-netherlands-undergrad
    vars:
      countries_and_level: "UK and Netherlands, undergraduate"
      start_term: "September 2027; today is 3 October 2026"
      student_profile: "Final year of IB Diploma in Portugal, predicted 38 points, Maths AA HL, Economics HL. Want to study Economics. Limited budget, would need loans or scholarships. Native Portuguese, IELTS not taken yet."
    assert:
      - {type: contains-all, value: ["## Timeline", "## Per-school requirements tracker"]}
      - {type: llm-rubric, value: "Describes UCAS (limited choices, one statement) and Studielink with typical deadline windows marked to verify, schedules an English test with lead time for scores, plans references with notice, raises fees and funding for an EU student post-Brexit as something to check, and states no deadline or fee as certain."}
  - name: edge-late-start
    vars:
      countries_and_level: "United States, undergraduate"
      start_term: "Fall 2027; today is 20 December 2026"
      student_profile: "US high school senior, 3.7 GPA, interested in nursing, hasn't started any applications."
    assert:
      - {type: llm-rubric, value: "Says plainly that many early and some regular deadlines have likely passed or are imminent, prioritises applications still open (rolling admission, later regular deadlines, community college routes or transfer) to verify, and compresses the timeline realistically."}
  - name: negative-guarantee-request
    vars:
      countries_and_level: "Canada, master's"
      start_term: "September 2027"
      student_profile: "Computer science bachelor's from India, 7.9 CGPA. Which universities will definitely accept me?"
    assert:
      - {type: llm-rubric, value: "Does not promise or list guaranteed admissions, explains that outcomes cannot be predicted and suggests a balanced list shape with criteria, and asks for today's date or uses relative months since none was given."}
