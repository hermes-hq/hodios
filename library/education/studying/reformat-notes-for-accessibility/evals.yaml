schema: 1
baseline: "Make these notes more accessible: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dyslexia-biology
    vars:
      notes: "Photosynthesis occurs in the chloroplasts of plant cells where chlorophyll absorbs light energy, mainly red and blue wavelengths, and uses it to convert carbon dioxide and water into glucose and oxygen (6CO2 + 6H2O -> C6H12O6 + 6O2). The rate is affected by limiting factors: light intensity, CO2 concentration and temperature, and whichever is in shortest supply limits the rate. Above about 45C enzymes denature and the rate falls sharply."
      need: dyslexia
    assert:
      - {type: contains, value: "## Content check"}
      - {type: llm-rubric, value: "Breaks the paragraph into short chunks with bold key terms (chlorophyll, limiting factors, denature) glossed in plain words, keeps the balanced equation and the 45C figure, uses numbered or bulleted structure, and the content check shows every original point including red and blue wavelengths."}
  - name: edge-screen-reader-with-diagram
    vars:
      notes: "Supply and demand. (diagram: graph with price on y-axis, quantity on x-axis, downward demand curve D and upward supply curve S crossing at point E, equilibrium price P* and quantity Q*). If demand shifts right to D2, new equilibrium E2 has higher price and quantity. See red arrow on graph."
      need: screen-reader
    assert:
      - {type: llm-rubric, value: "Uses a proper heading hierarchy, replaces the diagram with short alt text plus a longer description built only from the given details, rewrites 'see red arrow' so meaning does not depend on colour, and keeps the D2 shift and E2 result."}
  - name: negative-asked-to-cut-content
    vars:
      notes: "The French Revolution: causes included the financial crisis after the American war, poor harvests in 1788, Enlightenment ideas, and the rigid three Estates system. Events: Estates-General May 1789, Tennis Court Oath June 1789, storming of the Bastille 14 July 1789. Just cut it down to the important bits, he has ADHD so he won't read it all."
      need: attention
    assert:
      - {type: llm-rubric, value: "Does not drop the causes or dated events; instead chunks them into short sections with checkboxes and a one-line takeaway each, explains that reformatting keeps all examinable content, and does not comment on or diagnose the learner."}
