schema: 1
baseline: "Help me prepare for my {{placement_type}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-social-work-first-placement
    vars:
      placement_type: "BA Social Work, first placement, 70 days in a youth offending team, starting in 3 weeks"
      course_requirements: "Must evidence the domains of my placement portfolio: values and ethics, diversity, knowledge, intervention and skills, professionalism. Learning agreement meeting in week 1, midway review, final report by practice educator. Two direct observations of my practice. Weekly supervision with my practice educator."
    assert:
      - {type: llm-rubric, value: "Writes 3 to 5 specific goals linked to the listed domains with how to evidence each (including the two direct observations), asks about who the practice educator and on-site supervisor are and what the student may do alone with young people, stresses safeguarding and confidentiality, schedules the learning agreement, midway review and final report in the supervision table, gives an anonymised log template, covers raising concerns through the practice educator and university tutor, and does not invent assessment documents beyond those listed."}
  - name: edge-no-requirements-business
    vars:
      placement_type: "Year-long industrial placement in the marketing team of a manufacturing company, business management degree"
    assert:
      - {type: llm-rubric, value: "Bases goals on typical expectations for a business placement and marks them to check against the placement handbook, does not invent specific assessment documents or deadlines, and includes questions about who the workplace supervisor is and how the university assesses the year."}
  - name: negative-vague
    vars:
      placement_type: placement
    assert:
      - {type: llm-rubric, value: "Asks for the course, setting and length of the placement instead of producing a generic plan."}
