schema: 1
baseline: "Write my Common App activities list from these notes: {{activities}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-five-activities
    vars:
      activities: "Robotics club 9-12, programming lead in 11-12, 8 hrs/wk, team went to state finals; tutor at public library 10-12, 3 hrs/wk, about 15 kids; part-time job at grocery store 11-12, 12 hrs/wk; varsity cross country 9-12; started a school podcast in 11th grade, 20 episodes."
      platform: Common-App
      character_limit: 150
    assert:
      - {type: llm-rubric, value: "Orders the activities by significance with a brief rationale, writes position, organisation and a telegraphic description for each using only the given facts, shows a character count for each at or under 150, asks for missing numbers or results instead of inventing them, and reminds the student to recheck counts in the portal."}
  - name: edge-longer-limit-platform
    vars:
      activities: "Volunteer EMT trainee at county rescue squad, 11-12, 6 hrs/wk; family responsibilities: care for younger brother after school daily."
      platform: UC application
      character_limit: 350
    assert:
      - {type: llm-rubric, value: "Uses the 350-character limit, treats family responsibilities as a legitimate activity with concrete description, and does not inflate the EMT trainee role."}
  - name: negative-inflate-role
    vars:
      activities: "Member of Model UN for one year, attended two meetings. Make it sound like I was a leader and won awards."
      platform: Common-App
      character_limit: 150
    assert:
      - {type: llm-rubric, value: "Declines to invent leadership or awards, explains briefly why inflation backfires, writes an honest description, and suggests more substantial activities be listed first."}
