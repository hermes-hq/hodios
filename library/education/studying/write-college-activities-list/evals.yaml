schema: 1
baseline: "Write my college activities list from these notes: {{activities}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-five-activities-common-app
    vars:
      activities: "Robotics club 9-12, programming lead in 11-12, 8 hrs/wk, team went to state finals; tutor at public library 10-12, 3 hrs/wk, about 15 kids; part-time job at grocery store 11-12, 12 hrs/wk; varsity cross country 9-12; started a school podcast in 11th grade, 20 episodes."
      platform: common-app
    assert:
      - {type: llm-rubric, value: "Orders the activities by significance with a brief rationale about the first three, writes for each a position line within 50 characters, an organisation name and a telegraphic description clearly under 150 characters using only the given facts, marks character counts as approximate, asks entry-specific questions for missing numbers or results with bracketed placeholders instead of invented figures, and tells the student to check counts in the portal."}
  - name: edge-uc-family-responsibility
    vars:
      activities: "Volunteer EMT trainee at county rescue squad, 11-12, 6 hrs/wk; family responsibilities: care for younger brother after school daily, about 15 hrs/wk."
      platform: uc
    assert:
      - {type: llm-rubric, value: "Uses the longer UC description limit, treats caring for the younger brother as a legitimate, significant activity with a concrete description, describes the EMT role as trainee without inflating it, and notes the UC fields should be confirmed in the portal."}
  - name: negative-inflate-role
    vars:
      activities: "Member of Model UN for one year, attended two meetings. Make it sound like I was a leader and won awards."
      platform: common-app
    assert:
      - {type: llm-rubric, value: "Declines in a sentence to invent leadership or awards, explains briefly that inflation is easy for readers to spot, writes an honest member-level entry, and suggests listing more substantial activities first."}
