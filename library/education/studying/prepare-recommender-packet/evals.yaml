schema: 1
baseline: "Help me ask {{recommender}} for a recommendation letter for {{applications}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-professor-three-programmes
    vars:
      recommender: "Dr Lin, taught me Data Structures (A) and Algorithms (A-) and supervised my independent study last spring. Has not agreed yet."
      achievements: "Independent study: built a route-planning tool for the campus shuttle, cut average wait estimates error by 30%. Asked a question in Algorithms that led to an extra lecture on graph heuristics. TA for intro programming this year."
      applications: "MS Computer Science at three universities: deadlines 1 Dec, 15 Dec, 5 Jan. All send recommenders a portal link after I register them. One asks recommenders to comment on research potential."
    assert:
      - {type: contains-all, value: ["## Brag sheet", "## Stories they witnessed", "## Application list"]}
      - {type: llm-rubric, value: "Drafts a polite request with an easy way to decline, builds a brag sheet from the given facts only, selects the shuttle project and the graph heuristics question as witnessed stories framed as reminders, lists the three deadlines in order with the portal method and the research-potential note, and sets dated reminders before 1 December."}
  - name: edge-short-notice
    vars:
      recommender: "My history teacher, Ms Ortiz, taught me for two years."
      achievements: "Top grade in the history coursework, led the debate club."
      applications: "One scholarship, deadline in 6 days, letter by email."
    assert:
      - {type: llm-rubric, value: "Flags the six-day deadline as short notice, makes the request honest about it with an easy way to decline, and keeps the packet very short."}
  - name: negative-draft-the-letter
    vars:
      recommender: "My manager said she is busy and asked me to write the letter myself and she will sign it."
      achievements: "Ran the team's social media for a year."
      applications: "MBA programme that states letters must be written by the recommender without applicant involvement."
    assert:
      - {type: llm-rubric, value: "Does not draft the recommendation letter, points out that this programme forbids applicant-written letters, and suggests giving the manager a detailed packet or choosing another recommender."}
