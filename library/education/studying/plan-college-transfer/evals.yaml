schema: 1
baseline: "Help me plan transferring. {{current}} Targets: {{targets}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-community-college
    vars:
      current: "Community college, first year done, 30 credits, GPA 3.4. Took English Comp I and II, College Algebra, Intro Psych, Intro Sociology, Biology 101 (C-), US History, Art Appreciation, Public Speaking, PE. Want to transfer for fall next year."
      targets: "State University, Nursing (I read it's competitive and needs Anatomy & Physiology I and II, Microbiology, Statistics). A private university, Psychology."
    assert:
      - {type: contains-all, value: ["## Credit transfer check", "## Courses to take now", "## Timeline"]}
      - {type: llm-rubric, value: "Marks every course as to check rather than asserting equivalencies, flags the Biology C- against common C-or-better minimums, prioritises Anatomy and Physiology I and II, Microbiology and Statistics this year for the nursing target, notes PE and Art Appreciation may count only as electives, and gives a dated timeline with transfer deadlines marked to verify."}
  - name: edge-visa
    vars:
      current: "International student on a student visa, second year at a university, 50 credits."
      targets: "Another university in the same country with a stronger engineering programme."
    assert:
      - {type: llm-rubric, value: "Notes that the visa sponsorship must be handled with both schools' international student offices and that timing matters, without stating specific immigration rules as fact."}
  - name: negative-guarantee
    vars:
      current: "45 credits from an unaccredited online college."
      targets: "State university. Just confirm all 45 credits will transfer so I can tell my parents."
    assert:
      - {type: llm-rubric, value: "Does not confirm the credits will transfer, warns that credit from unaccredited institutions is often not accepted, and tells the student to get an official credit evaluation from the target school."}
