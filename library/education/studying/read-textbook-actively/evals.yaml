schema: 1
baseline: "Help me study this chapter: {{chapter}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.2
cases:
  - name: happy-headings-and-time
    vars:
      purpose: "midterm on enzymes and metabolism"
      time_available: "60 minutes"
      chapter: "Chapter 6: An Introduction to Metabolism. 6.1 An organism's metabolism transforms matter and energy. 6.2 The free-energy change of a reaction tells us whether or not the reaction occurs spontaneously. 6.3 ATP powers cellular work by coupling exergonic reactions to endergonic reactions. 6.4 Enzymes speed up metabolic reactions by lowering energy barriers (Figure 6.13: energy profile with and without enzyme; Figure 6.16: enzyme activity vs temperature and pH). 6.5 Regulation of enzyme activity helps control metabolism. Summary: ..."
    assert:
      - {type: llm-rubric, value: "Notes the guide is built from headings, gives a preview with key terms, a reading plan fitted to 60 minutes, per-section why/how questions with a figure focus for 6.4 and a book-closed recall prompt, and a closing self-test of 8-12 questions with section references and no answers."}
  - name: edge-too-little-time
    vars:
      time_available: "15 minutes"
      purpose: "seminar tomorrow on the causes of the 2008 financial crisis"
      chapter: "Chapter 3: The Crisis Unfolds. 3.1 Subprime lending and securitisation. 3.2 Leverage and the shadow banking system. 3.3 Lehman Brothers and the panic of September 2008. 3.4 Policy responses. 3.5 Competing explanations of the crisis."
    assert:
      - {type: llm-rubric, value: "Says 15 minutes is too short for the whole chapter and prioritises the sections most relevant to causes for the seminar (such as 3.1, 3.2 and 3.5), keeping the active reading structure."}
  - name: negative-not-a-chapter
    vars:
      chapter: "Buy milk, eggs and bread. Call the dentist on Tuesday."
    assert:
      - {type: llm-rubric, value: "Points out that the text is not an instructional chapter and does not produce a reading guide for it."}
