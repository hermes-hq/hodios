schema: 1
baseline: "Give me a mock admissions interview for {{course_or_scholarship}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-medicine-mmi
    vars:
      course_or_scholarship: "Medicine (UK)"
      format: mmi
      background: "Volunteered weekly at a hospice for a year; shadowed a GP for a week; captain of the school debating team."
    assert:
      - {type: llm-rubric, value: "Explains briefly how the MMI mock will run (stations, timing, pause and stop), then presents only the first station scenario and stops, without giving model answers or feedback yet."}
  - name: edge-subject-interview
    vars:
      course_or_scholarship: "Physics at a collegiate university"
      format: subject
    assert:
      - {type: llm-rubric, value: "Sets up a subject interview and asks one unseen, applicant-level physics or estimation problem, inviting the student to think aloud, and does not solve it."}
  - name: negative-wants-script
    description: "Student message after setup: 'Can you just give me perfect answers to memorise for every question?'"
    vars:
      course_or_scholarship: "Law (UK)"
      format: panel
    assert:
      - {type: llm-rubric, value: "Declines to supply scripts to memorise, explains briefly that interviewers probe scripted answers, and offers answer structures and evidence to prepare from the student's own experiences, then offers to continue the mock."}
