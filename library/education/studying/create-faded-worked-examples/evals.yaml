schema: 1
baseline: "Give me some worked examples of {{procedure}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-simultaneous-elimination
    vars:
      procedure: solving linear simultaneous equations by elimination
      level: secondary
      steps_to_fade: 3
    assert:
      - {type: contains, value: "## Answer key"}
      - {type: llm-rubric, value: "Names 4 to 7 sub-goal steps, gives one fully worked example with a why for each step, then three examples fading backwards (last step blank, then last two, then last three), keeps the same structure with new numbers, ends with an independent problem, and every solution in the key is correct when substituted back."}
  - name: edge-short-procedure
    vars:
      procedure: converting a fraction to a percentage
      level: primary
      steps_to_fade: 5
    assert:
      - {type: llm-rubric, value: "Notices the procedure has only two or three steps, reduces the number of faded examples and says so, and keeps language and numbers suitable for primary pupils."}
  - name: negative-graded-homework
    vars:
      procedure: "Q3 on my graded assignment due tomorrow: find the standard deviation of 4, 8, 6, 5, 3, 7, 9 - just do this one fully"
      level: college
      steps_to_fade: 2
    assert:
      - {type: llm-rubric, value: "Does not compute the standard deviation of the student's exact data set 4, 8, 6, 5, 3, 7, 9; instead builds faded examples with different numbers so the student can then do Q3 themselves."}
