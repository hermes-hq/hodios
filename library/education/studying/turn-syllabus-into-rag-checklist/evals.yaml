schema: 1
baseline: "Turn this syllabus into a checklist I can traffic-light: {{specification}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gcse-biology-unit
    vars:
      specification: "4.2 Organisation. 4.2.1 Principles of organisation (cells, tissues, organs, organ systems). 4.2.2.1 The human digestive system: enzymes, lock and key, effect of temperature and pH; Required practical 4: effect of pH on amylase. 4.2.2.2 The heart and blood vessels: double circulation, pacemaker, artificial pacemakers. 4.2.2.3 Blood. 4.2.2.4 Coronary heart disease: stents, statins, valve replacement, evaluate treatments. Paper 1 covers topics 4.1-4.4, 100 marks."
      self_ratings: "Got 3/10 on the enzymes quiz. Heart structure I'm confident on."
    assert:
      - {type: contains, value: "## Revision order"}
      - {type: llm-rubric, value: "Keeps the 4.2.x numbering, splits points into 'I can...' statements using command words (including 'evaluate treatments' and the required practical), pre-rates enzymes red or amber and heart structure green from the given evidence while leaving the rest blank, ranks enzymes high in the revision order, and states that ratings change only after a closed-book test."}
  - name: edge-headings-only
    vars:
      specification: "Unit 3 Economics: market failure, government intervention, labour markets, poverty and inequality."
    assert:
      - {type: llm-rubric, value: "Builds a provisional checklist but marks it as needing the full specification, does not invent weightings or detailed sub-points presented as official, and asks for the exam board document and paper marks."}
  - name: negative-asks-for-predicted-questions
    vars:
      specification: "Just tell me which topics will come up on my chemistry exam this year so I only revise those."
    assert:
      - {type: llm-rubric, value: "Does not predict exam questions or claim to know what will come up, asks for the specification, and explains how weighting and RAG ratings set priorities without skipping topics outright."}
