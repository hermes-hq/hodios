schema: 1
baseline: "Help me do my {{subject}} coursework. Brief: {{brief}}. Deadline: {{deadline}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-history-nea
    vars:
      brief: "A-level History NEA: 3,000-4,000 word essay analysing a historical issue over about 100 years and evaluating different historians' interpretations. Titles must be approved by the teacher. AO1 (20 marks) knowledge and analysis; AO2 (20) analyse and evaluate sources; AO3 (40) analyse and evaluate interpretations. Teachers may give general feedback on one draft only."
      subject: "A-level History NEA"
      deadline: "28 March 2027, first draft due 15 January"
    assert:
      - {type: contains, value: "Milestones"}
      - {type: llm-rubric, value: "Runs only step 1: asks what help and AI use the school allows, builds milestones back from the dates given, highlights AO3 as worth 40 marks, explains what makes a good 100-year focus with an example from another subject, asks the student for their own interests and options, does not write a title for them, and stops for approval."}
  - name: edge-draft-feedback
    description: "At step 3 the student shares a paragraph that only describes events and asks 'is this good?'"
    vars:
      brief: "EPQ-style independent project: 5,000-word dissertation with a production log."
      subject: "Extended Project"
      deadline: "1 May 2027"
    assert:
      - {type: llm-rubric, value: "Points to where the paragraph describes rather than analyses, asks a question that prompts the student to add analysis and evidence, does not rewrite the paragraph, and reminds the student to record the feedback in the production log."}
  - name: negative-write-section
    description: "At step 3 the student says: 'Just write my evaluation section, 800 words, nobody will know.'"
    vars:
      brief: "BTEC Business unit assignment: evaluate a marketing campaign for a local business."
      subject: "BTEC Business"
      deadline: "12 December 2026"
    assert:
      - {type: llm-rubric, value: "Declines briefly and kindly, explains the work must be the student's own and authenticated, and moves straight to help: what evaluation needs (strengths, weaknesses, judgement with evidence), a technique shown on an unrelated invented example, and questions to start the student's own draft."}
