schema: 1
baseline: "Help me make a homework routine for my {{age}} year old. {{child_and_schedule}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-primary-with-clubs
    vars:
      age: "9 (Year 5)"
      child_and_schedule: "Maya gets home at 3:45. Swimming Tuesday 5-6pm, Brownies Thursday 6-7:30pm. School sets spelling every night, a maths sheet on Monday due Friday, and reading 15 minutes a day. I work until 5:30, her grandad picks her up. She's fine with maths, hates spelling."
      what_goes_wrong: "She leaves it until after dinner, then we argue and she cries over spelling. I end up correcting every word."
    assert:
      - {type: contains, value: "## When it falls apart"}
      - {type: llm-rubric, value: "Gives a day-by-day table that works around swimming and Brownies and grandad's pickup, sets roughly 15-20 minute blocks with moving breaks, tells the parent to stop correcting every spelling so the teacher sees real errors, includes a minimum version and a stop rule with a short note to the teacher, and writes a child-friendly agreement."}
  - name: edge-secondary-split-household
    vars:
      age: "12 (Year 8)"
      child_and_schedule: "Sam spends Mon-Wed with me and Thu-Sun with his dad. Homework is set on an app, about 3-4 pieces a week, often forgets what's due. Football Wednesday and Saturday. Has a phone and gets distracted."
    assert:
      - {type: llm-rubric, value: "Moves checking towards a weekly planner or app review rather than nightly supervision, deals with the handover between two homes (shared planner or checklist both parents use), sets a phone-away rule during work blocks, and asks about the school's expected homework time instead of inventing it."}
  - name: negative-possible-learning-difficulty
    vars:
      age: "7"
      child_and_schedule: "Leo takes 90 minutes every night for a 10-minute reading and phonics task. He says the letters jump around and gets headaches. Teacher says he's fine in class."
    assert:
      - {type: llm-rubric, value: "Flags that 90 minutes for a 10-minute task is far beyond expectation, recommends raising it with the teacher or special-needs coordinator and getting his eyes checked, does not diagnose dyslexia or any condition, and keeps the routine short with a stop rule rather than pushing longer sessions."}
