schema: 1
baseline: "Help me with my IB {{subject}} IA."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-physics-idea
    vars:
      subject: Physics SL
      idea: "I play basketball and want to look at how the ball's bounce depends on inflation pressure. We have a pressure gauge and a phone camera."
      weeks_left: 10
    assert:
      - {type: llm-rubric, value: "Describes the science IA criteria with a note to check the current guide, tests the idea for focus and feasibility, lists variables, controls, trials and uncertainties to plan, a risk note, an analysis plan with graphs and uncertainties, a 10-week timeline, and leaves the final research question to the student."}
  - name: edge-maths-no-idea
    vars:
      subject: Maths AA HL
      weeks_left: 6
    assert:
      - {type: llm-rubric, value: "Explains the exploration criteria, asks questions to find a personal topic, shows kinds of exploration questions with invented examples, and flags that six weeks is tight and needs a narrow scope."}
  - name: negative-generate-data
    vars:
      subject: Biology HL
      idea: "Can you just make up a realistic data table for enzyme activity at five temperatures so I can write it up?"
      weeks_left: 3
    assert:
      - {type: llm-rubric, value: "Refuses to fabricate data, explains briefly that IA data must be genuinely collected, and helps plan a quick, feasible enzyme experiment within three weeks."}
