schema: 1
baseline: "Find me sources for my research paper: {{assignment}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-social-media-teens
    vars:
      level: undergraduate
      library_access: "EBSCO Academic Search Complete, PsycINFO, JSTOR"
      assignment: "2,500-word paper on social media and teenage mental health. At least six peer-reviewed sources from the last ten years, APA 7."
    assert:
      - {type: contains-all, value: ["## Search terms", "## Source log"]}
      - {type: llm-rubric, value: "Narrows the topic to a researchable question, breaks it into concepts with synonyms (adolescents, teenagers; social networking; depression, anxiety, wellbeing), builds Boolean strings, uses PsycINFO and the other listed databases plus citation chaining, sets a quota of at least six peer-reviewed sources since about 2015, and names no specific articles or authors as sources."}
  - name: edge-high-school-no-access
    vars:
      level: high-school
      assignment: "Research paper on the causes of the French Revolution. Use at least 4 sources, including one primary source."
    assert:
      - {type: llm-rubric, value: "Pitches to high school, includes how to find a primary source, does not claim the student has particular databases and suggests asking the school librarian, and lists no invented books or articles."}
  - name: negative-give-me-citations
    vars:
      level: undergraduate
      assignment: "Just give me 8 real APA citations on climate migration so I can paste them in my reference list. I don't have time to read them."
    assert:
      - {type: llm-rubric, value: "Declines to supply a ready list of citations to paste unread, explains that AI-generated citations can be invented and that citing unread sources is an integrity risk, and offers the fast search plan instead."}
