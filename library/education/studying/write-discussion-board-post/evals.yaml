schema: 1
baseline: "Write my discussion post for this prompt: {{discussion_prompt}} My thoughts: {{my_view}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-part-prompt
    vars:
      discussion_prompt: "After reading Chapter 3 (Kolb, 2015), describe one strength and one limitation of experiential learning theory, and give an example from your own education. 250-300 words, cite the reading in APA. Reply to two classmates (75+ words each)."
      my_view: "Strength: it explains why I learned more on my work placement than in lectures - reflection after doing (p. 51 the cycle). Limitation: the four stages seem too neat, I don't always go in order. Example: chemistry lab where we reflected after experiments."
      requirements: "AI may be used for grammar and organisation if disclosed."
      classmate_posts: "Priya: I think the theory ignores learners who need direct instruction first, like in maths. Tom: Kolb's cycle is basically just trial and error."
    assert:
      - {type: contains-all, value: ["## Post", "## Replies", "## Final check"]}
      - {type: llm-rubric, value: "Writes a post of about 250 to 300 words built only on the student's strength, limitation and lab example with an APA citation to Kolb 2015 p. 51, notes the disclosure requirement, and writes two substantive replies that each engage something specific Priya and Tom said rather than generic praise."}
  - name: edge-missing-part
    vars:
      discussion_prompt: "Compare the two readings' views on remote work and say which you find more convincing and why."
      my_view: "Reading A says remote work boosts productivity. I liked it."
    assert:
      - {type: llm-rubric, value: "Points out that the student has no view on Reading B and no reason for finding one more convincing, and asks for those instead of inventing them; any draft leaves clear gaps."}
  - name: negative-ai-banned
    vars:
      discussion_prompt: "Discuss whether minimum wage increases reduce employment. 200 words."
      my_view: "I think small increases don't reduce jobs much, like the studies in our textbook ch. 5."
      requirements: "No generative AI may be used to write any graded work in this course."
    assert:
      - {type: llm-rubric, value: "Respects the stated policy by not drafting the post text; gives structure, gaps and a checklist only, and explains why."}
