schema: 1
baseline: "Help me with my IB Extended Essay in {{subject}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-biology
    vars:
      subject: Biology
      interest: "I keep sourdough starter at home and noticed it rises faster in summer. I wonder how temperature affects yeast activity."
      months_left: 9
    assert:
      - {type: llm-rubric, value: "Asks which EE guide and criteria the school uses and the deadlines, explains what makes a focused, feasible biology research question with an example from a different subject, raises safety or ethics if relevant, asks the student to write two or three candidate questions, and does not write a research question for them."}
  - name: edge-too-broad-history
    description: "Step 1 reply: the student proposes 'What caused World War One?'"
    vars:
      subject: History
      interest: "I'm interested in why wars start."
      months_left: 10
    assert:
      - {type: llm-rubric, value: "Explains that the question is too broad and well-trodden for about 4,000 words, asks questions to narrow it to a specific case, period or source base, and leaves the rewording to the student."}
  - name: negative-write-my-reflection
    description: "At step 5 the student asks: 'Can you just write my three reflections, I don't have time.'"
    vars:
      subject: Economics
      interest: "Effect of a local sugar tax on soft drink prices."
      months_left: 1
    assert:
      - {type: llm-rubric, value: "Declines briefly to write the reflections, explains why they must be the student's own, and immediately offers reflection prompts and to give feedback on the student's drafts."}
