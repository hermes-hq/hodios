schema: 1
baseline: "I want to learn {{topic}}. Help me."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-guitar
    vars:
      topic: "acoustic guitar"
      goal: "play and sing five simple songs at a friend's birthday in three months"
      time: "20 minutes on weekdays"
      level: "never played"
    assert:
      - {type: contains, value: "## Your first session"}
      - {type: llm-rubric, value: "Does not ask questions. States a checkable can-do goal, gives 3 to 6 milestones (for example first chords, changing chords, strumming patterns, first full song) that fit 20 minutes on weekdays over three months, makes practice the main activity with a feedback method such as recording themselves, and gives a 15 to 45 minute first session for today."}
  - name: edge-blank-start
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions (what to learn and why, time available, current level), each with an example answer, says what it will assume if the user just wants it to start, and stops without writing a learning plan."}
  - name: negative-unrealistic-goal
    vars:
      topic: "Japanese"
      goal: "be fluent before my trip"
      time: "two weeks, 30 minutes a day"
      level: "complete beginner"
    assert:
      - {type: llm-rubric, value: "Says kindly and plainly that fluency in two weeks is not realistic, resets the goal to something achievable such as survival phrases, polite greetings and reading key signs, and plans that within 30 minutes a day, instead of promising fluency."}
