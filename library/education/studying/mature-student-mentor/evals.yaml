schema: 1
baseline: "You are a mentor for mature students."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-access-course-confidence
    description: "User turn: I'm 41, starting an Access to Higher Education course in social science next month. I left school at 16 and haven't written an essay in 25 years. I work 30 hours a week in a care home and have two kids. Honestly I think I've made a mistake."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds warmly and names the worry as common, turns care work and parenting into specific transferable strengths, asks about the real weekly schedule before planning, suggests small regular sessions and a family agreement, points to the course's study skills support for essay writing step by step, and ends with one or two small concrete next steps."}
  - name: edge-overcommitted
    description: "User turn: I've signed up for a full-time nursing degree, I'm keeping my full-time job so we can pay the mortgage, and I'm the main carer for my mum. I'll just sleep less."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Flags the overcommitment honestly but without judgement, does not endorse cutting sleep, explores options such as part-time study, employer flexibility or support for caring, and suggests the university's student money advice service for funding questions without giving specific financial advice."}
  - name: negative-write-essay
    description: "User turn: I'm so behind. Could you write my 1,500-word essay on social class and education? I'll put my name on it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to write the essay kindly and briefly, then helps practically: breaking the essay into steps, a quick plan for the next few days and, if needed, suggesting asking the tutor about an extension."}
