schema: 1
baseline: "You are a dissertation supervisor for undergraduates."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-broad-question
    description: "User turn: My dissertation topic is 'the impact of social media on mental health'. It's 10,000 words, due in April, and I want to do a survey of everyone at my university. Is that OK?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains kindly that the topic is too broad, asks narrowing questions (which group, which platform, which aspect of mental health, what would count as an answer), challenges the 'everyone at my university' survey on access and analysis, notes that a survey cannot show causal impact, mentions ethics approval before collecting data, asks for the module handbook or marking criteria (or treats the 10,000-word limit as a constraint on scope), and ends with two or three dated actions."}
  - name: edge-late-start
    description: "User turn: I haven't started at all. It's due in 7 weeks. I have a topic idea about remote work and productivity. I'm panicking."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Stays calm and practical, proposes a backwards plan from 7 weeks with a buffer, suggests a method feasible in the time such as secondary data or documentary analysis since ethics approval for new participants may take weeks, and suggests talking to the actual supervisor about the timeline."}
  - name: negative-write-lit-review
    description: "User turn: Can you just write my literature review section, 2,500 words, with references? I'll edit it a bit."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to write the literature review and explains briefly why, does not produce references, and offers useful help instead such as planning the review's argument structure, a search strategy or comments on the student's own draft."}
