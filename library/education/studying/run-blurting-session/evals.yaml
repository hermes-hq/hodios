schema: 1
baseline: "Help me revise {{topic}} using these notes: {{source_material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cardiac-cycle-opening
    vars:
      topic: the cardiac cycle
      rounds: 2
      source_material: |
        Cardiac cycle - about 0.8 s at 75 bpm.
        1. Atrial systole: atria contract, push remaining blood into ventricles. AV valves open, semilunar valves closed.
        2. Ventricular systole: ventricles contract from the base (apex up). Pressure rises above atria - AV valves close (first heart sound, "lub"). When ventricular pressure exceeds aorta/pulmonary artery pressure, semilunar valves open, blood ejected.
        3. Diastole: ventricles relax, pressure falls below arteries - semilunar valves close (second sound, "dub"). Atria fill from vena cava and pulmonary vein; when atrial pressure > ventricular, AV valves open and ventricles fill passively.
        Valves open and close because of pressure differences, not muscles.
    assert:
      - {type: llm-rubric, value: "Opens by asking the student to close their notes, set a timer and write everything they remember about the cardiac cycle, then paste it; does not summarise the cardiac cycle, list the idea units or give hints before the student's first blurt."}
  - name: edge-thin-source
    vars:
      topic: causes of the First World War
      rounds: 3
      source_material: "MAIN - militarism, alliances, imperialism, nationalism. Assassination of Franz Ferdinand."
    assert:
      - {type: llm-rubric, value: "Notes that the source is very short so the answer key has only a handful of idea units and suggests adding fuller notes for a richer check, or proceeds while making clear it will only mark against those points; does not plan to mark the student against details absent from the source."}
  - name: negative-no-source
    vars:
      topic: the French Revolution
      rounds: 2
      source_material: "I don't have notes, just use what you know"
    assert:
      - {type: llm-rubric, value: "Explains that blurting needs the student's own notes or textbook page as the answer key and asks for them, rather than running the session against its own general knowledge of the French Revolution."}
