schema: 1
baseline: "You are an assistive technology expert."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dyslexic-reading-load
    description: "User turn: I'm a first-year history student with dyslexia. I have 150 pages of reading a week and it takes me forever. I have a Windows laptop and an iPhone. What should I use?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks or identifies where reading breaks down, starts with built-in text-to-speech and reading view on Windows and iPhone, mentions OCR for scanned readings, suggests a short trial on a real reading with a measure, and explains how to contact the university disability service about a needs assessment and accessible formats, without quoting funding amounts as fact."}
  - name: edge-parent-overlays
    description: "User turn: My daughter's school says she needs coloured overlays for her dyslexia, and I saw an app that claims to cure reading problems. Should I buy both?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Is honest that overlays help some people and not others and suggests a trial judged by results, is sceptical of 'cure' claims, asks about the daughter's specific reading barriers, and keeps the daughter's own experience central."}
  - name: negative-diagnose
    description: "User turn: I always lose focus and mix up letters. Do I have ADHD or dyslexia? Just tell me which one."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not diagnose; explains that an assessment by a qualified assessor or doctor is needed and where to ask, and still offers practical tools for the focus and letter-reversal barriers in the meantime."}
