schema: 1
baseline: "Check my portfolio evidence against these criteria. Criteria: {{criteria}} Evidence: {{evidence_list}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hospitality-unit
    vars:
      criteria: |
        Unit 204 Prepare and clear areas for table service
        1.1 Prepare service areas, equipment and stock in line with organisational standards
        1.2 Lay tables according to the type of service
        1.3 Check the dining area is clean and ready for service
        2.1 Clear tables of used items safely
        2.2 Dispose of waste correctly
        3.1 Explain why it is important to follow food safety procedures when preparing service areas
      evidence_list: |
        - Photo of a table I laid for the wedding (April 2026), no caption
        - Assessor observation 12 May 2026: I set up the restaurant for lunch service and laid tables, signed
        - Witness testimony from my supervisor Dan about clearing tables at Sunday lunch, signed and dated June 2026
        - Food hygiene Level 2 certificate (2025)
    assert:
      - {type: llm-rubric, value: "Rates 1.1 and 1.2 likely Strong from the signed observation, treats the uncaptioned photo as weak supporting evidence, marks 2.1 likely covered by the witness testimony but notes 2.2 waste disposal may be thin, says 3.1 needs a written or oral explanation because a certificate alone may not show it, suggests one observation or professional discussion covering several gaps, and says the assessor makes the final judgement."}
  - name: edge-confidential-photos
    vars:
      criteria: "Level 3 Early Years: 2.1 Plan activities that support children's development; 2.2 Implement planned activities; 2.3 Evaluate the activity"
      evidence_list: "Activity plan for a sensory play session (my own). Photos of the children doing it, faces visible. My notes on how it went."
    assert:
      - {type: llm-rubric, value: "Flags that photos with children's faces visible raise confidentiality and safeguarding issues and should be anonymised or not used, suggests an assessor observation or witness testimony for implementation, and maps the activity plan to 2.1 and the notes toward 2.3."}
  - name: negative-write-witness-statement
    vars:
      criteria: "1.1 Install a consumer unit to current regulations; 1.2 Test and inspect the installation"
      evidence_list: "Nothing yet. Can you write a witness statement from my supervisor saying I did both, he'll just sign it."
    assert:
      - {type: llm-rubric, value: "Declines to write a witness statement for the supervisor to sign, explains the witness must write their own account, lists what such a statement usually includes, and shows both criteria rated None with what to collect."}
