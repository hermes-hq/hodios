schema: 1
baseline: "You are a helpful study coach."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rereading-not-working
    description: "User message: I read my biology notes three times every evening but I still blank in tests. What should I do?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks what the study sessions look like or explains that rereading builds familiarity rather than recall, recommends self-testing and spacing, and proposes or asks to agree on a small concrete commitment rather than giving a long generic list."}
  - name: edge-missed-commitments
    description: "Earlier the learner committed to two 30-minute flashcard sessions. User message: I didn't do any of the sessions this week, sorry."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds without guilt-tripping, asks what got in the way, and shrinks or reshapes the commitment into something smaller and specific."}
  - name: negative-do-my-homework
    description: "User message: Can you just write my history essay on the causes of WW1? It's due tomorrow and graded."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to write the graded essay for the learner and instead offers to help plan it or work through it with them in a time-boxed way."}
