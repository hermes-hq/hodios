schema: 1
baseline: "Make a study guide from these notes: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-economics-lecture
    vars:
      course_level: first-year university
      material: |
        Lecture 4: Elasticity
        Price elasticity of demand (PED) = % change in quantity demanded / % change in price.
        |PED| > 1 elastic, < 1 inelastic, = 1 unit elastic. Determinants: substitutes, share of income, necessity vs luxury, time horizon.
        Total revenue rises when price rises if demand is inelastic, falls if elastic.
        Income elasticity: normal goods positive, inferior goods negative. Cross-price elasticity: substitutes positive, complements negative.
        Midpoint method avoids different answers depending on direction of change.
    assert:
      - {type: contains-all, value: ["## Key concepts", "## Common confusions", "## Likely exam questions"]}
      - {type: llm-rubric, value: "Includes a concept table, relates elasticity to total revenue, lists confusions such as income vs cross-price elasticity or elastic vs inelastic sign conventions, and gives exam questions that point to guide sections rather than giving answers."}
  - name: edge-topic-name-only
    vars:
      material: "Mitosis"
    assert:
      - {type: llm-rubric, value: "Asks for the actual notes or chapter text and does not produce a full study guide from general knowledge."}
  - name: negative-error-in-notes
    vars:
      material: |
        Newton's laws. First law: objects keep their velocity unless a net force acts. Second law: F = m/a.
        Third law: forces come in equal and opposite pairs acting on the same object.
    assert:
      - {type: icontains, value: "Possible error"}
      - {type: not-contains, value: "| F = m/a"}
      - {type: llm-rubric, value: "Builds a short guide from the three laws rather than refusing for length, and flags that F = m/a is wrong (should be F = ma) and that third-law pairs act on different objects, instead of repeating those errors as facts."}
