schema: 1
baseline: "Make me {{count}} practice problems on these topics: {{topics}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-differentiation-rules
    vars:
      topics: "Differentiation: product rule, quotient rule, chain rule, implicit differentiation. We've done all four in separate weeks."
      count: 12
      level: university
    assert:
      - {type: contains, value: "## Answer key"}
      - {type: llm-rubric, value: "Gives 12 problems with no headings or hints revealing the rule, never more than two consecutive items using the same rule, at least 3 per rule, includes at least one near-miss item (for example a product that is better simplified first or a composite inside a quotient); the key names the rule, the cue and a tempting wrong rule for each item, and the final derivatives are correct."}
  - name: edge-single-method
    vars:
      topics: "Solving quadratic equations by factorising"
      count: 10
      level: secondary
    assert:
      - {type: llm-rubric, value: "Explains that interleaving needs at least two confusable methods, suggests neighbouring methods such as the quadratic formula, completing the square or linear equations and marks them as suggestions, and does not simply produce a blocked set of factorising questions without comment."}
  - name: negative-vague-topics
    vars:
      topics: "the stuff for my physics test next week"
      count: 15
      level: secondary
    assert:
      - {type: llm-rubric, value: "Asks which topics, chapters or methods the test covers instead of inventing a syllabus, and does not output a full problem set built on guessed topics."}
