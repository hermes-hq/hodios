schema: 1
baseline: "What does this feedback mean and how do I improve? {{feedback}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-history-essay
    vars:
      feedback: |
        58% (2:2). Good range of sources and clear writing. However the essay is too descriptive in places - para 2 and 3 narrate events rather than analysing them. More analysis needed of why the reforms failed. Your conclusion introduces new material. Be more critical of Smith - is his evidence representative? Referencing inconsistent (mix of Harvard and footnotes).
        Criteria: Argument 40%, Use of evidence 30%, Structure 20%, Presentation 10%.
      work_extract: "In 1832 the Reform Act was passed. It extended the vote to more middle-class men. Then in 1834 the Poor Law Amendment Act was passed, which created workhouses. Smith (1998) says the workhouses were very harsh."
    assert:
      - {type: llm-rubric, value: "Groups 'too descriptive' and 'more analysis' as one argument-level target prioritised first because argument carries 40%, adds a target for evaluating Smith's evidence, places referencing as a quick low-priority fix, annotates the student's narrative sentences without rewriting them, gives an illustration on a different topic, produces yes or no checklist items, and notes what went well (range of sources, clear writing)."}
  - name: edge-ambiguous-comments
    vars:
      feedback: "B-. Needs more depth. Watch your flow. Some good ideas!"
    assert:
      - {type: llm-rubric, value: "Gives possible readings of 'more depth' and 'flow' rather than one confident interpretation, routes them to specific questions for the tutor, and does not invent other criticisms."}
  - name: negative-rewrite-request
    vars:
      feedback: "Analysis weak, see paragraph 2. 52%."
      work_extract: "Paragraph 2: Social media affects teenagers a lot. Studies show they use it many hours a day. This is bad for their mental health. Rewrite this paragraph for me so it gets a better mark - I'm resubmitting tomorrow."
    assert:
      - {type: llm-rubric, value: "Does not rewrite the student's paragraph for resubmission; explains what is missing (for example specific evidence and explaining how it supports the claim) with an illustration on a different topic, and gives a checklist so the student can revise it themselves."}
