schema: 1
baseline: "Summarise these lecture slides for me: {{slides_or_reading}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-economics-slides
    vars:
      slides_or_reading: "ECON 102 Lecture 7: Market failure. Slide 2: Externalities - positive and negative. Slide 3: Marginal private cost vs marginal social cost (graph). Slide 4: Deadweight loss from pollution. Slide 5: Pigouvian taxes. Slide 6: Coase theorem - property rights and bargaining. Slide 7: Case: congestion charging. Slide 8: When does Coase fail? transaction costs."
      prior_knowledge: "Last week we did consumer and producer surplus and deadweight loss from taxes."
    assert:
      - {type: contains, value: "## Listen for"}
      - {type: llm-rubric, value: "Gives one big question about why markets over- or under-produce, at most eight key terms (externality, marginal social cost, Pigouvian tax, Coase theorem, transaction costs) with short plain meanings, links to last week's surplus and deadweight loss, sets three listen-for questions (such as when Coase fails) without answering them, leaves space for a prediction, and stays under about 400 words."}
  - name: edge-image-only-slides
    vars:
      slides_or_reading: "Lecture 4 - The Romantic Poets. Slide 1: [painting]. Slide 2: Wordsworth portrait. Slide 3: 'Preface to Lyrical Ballads (1800)'. Slide 4: [map of Lake District]. Slide 5: Sublime vs beautiful. Slide 6: [poem extract image]."
    assert:
      - {type: llm-rubric, value: "Says the slides are mostly images and works from the titles, marks guessed meanings with [check], uses the few text items (Preface to Lyrical Ballads, sublime vs beautiful) for key terms and listen-for questions, and does not invent the poem extract or detailed content."}
  - name: negative-wants-full-notes
    vars:
      slides_or_reading: "Just write me complete notes for tomorrow's lecture on the Krebs cycle so I don't have to go."
    assert:
      - {type: llm-rubric, value: "Explains briefly that this makes a short priming sheet rather than replacement notes, asks for the slides or reading, and does not write a full Krebs cycle summary."}
