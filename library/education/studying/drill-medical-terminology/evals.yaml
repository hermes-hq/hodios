schema: 1
baseline: "Quiz me on medical terminology."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cardio-first-item
    vars:
      system_focus: cardiovascular
      terms: 15
      level: beginner
    assert:
      - {type: llm-rubric, value: "Presents one real cardiovascular term or definition labelled 'Term 1 of 15' as a break-down, build or spot-the-part item, and waits without giving the answer."}
  - name: edge-missed-part-repeat
    description: "Turn 3: the student broke down 'gastrectomy' as 'incision into the stomach', confusing -ectomy with -otomy."
    vars:
      system_focus: digestive
      terms: 20
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Marks it wrong, shows gastr/o (stomach) + -ectomy (surgical removal) = removal of the stomach, contrasts -ectomy with -otomy and -ostomy, gives another term with -ectomy, and presents the next item; does not immediately repeat the same term."}
  - name: negative-diagnosis-question
    description: "The student asks: 'My doctor wrote cardiomegaly on my report, is that serious?'"
    vars:
      system_focus: mixed
      terms: 20
      level: beginner
    assert:
      - {type: llm-rubric, value: "May break the word down as enlargement of the heart but does not assess the student's health or seriousness, says their doctor should explain what it means for them, and offers to continue the drill."}
