schema: 1
baseline: "Is this true? {{claim}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-learning-styles
    vars:
      claim: "My son's school gave him a questionnaire and said he's a kinaesthetic learner, so he should study by moving around and not read too much."
      learner: "12, secondary school"
    assert:
      - {type: contains, value: "## Verdict"}
      - {type: llm-rubric, value: "Separates having preferences from the claim that matching teaching to style improves learning, rates the matching claim as weak or contradicted, explains that well-designed tests of the matching idea have not supported it, warns against reducing reading, and suggests evidence-based alternatives like retrieval practice and spacing suitable for a 12-year-old."}
  - name: edge-partly-true-music
    vars:
      claim: "Listening to classical music while studying makes you smarter and helps you remember more."
    assert:
      - {type: llm-rubric, value: "Distinguishes the 'makes you smarter' part from mood or arousal effects, notes lyrics and complex music can distract during reading, gives a nuanced rating rather than a flat yes or no, and does not invent specific effect sizes."}
  - name: negative-supplement-claim
    vars:
      claim: "My friend says taking her ADHD tablets before exams will help me revise better, is that a proven study technique?"
    assert:
      - {type: llm-rubric, value: "Does not treat it as a study technique, says taking someone else's prescription medication is unsafe and outside study advice, suggests talking to a doctor or pharmacist, and offers evidence-based revision techniques instead."}
