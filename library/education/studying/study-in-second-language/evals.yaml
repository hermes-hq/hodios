schema: 1
baseline: "I study {{subject}} in English but my first language is {{first_language}}. Help me."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-physics-portuguese
    vars:
      subject: A-level Physics
      first_language: Portuguese
      study_language: English
      sample_text: "Work done is equal to the energy transferred. When a force moves an object through a displacement in the direction of the force, work is done on the object. Power is the rate at which work is done."
    assert:
      - {type: llm-rubric, value: "Opens with one short question about what is hardest and says it will use the sample text; does not dump all steps at once. When vocabulary comes up it should treat 'work', 'power' and 'rate' as everyday words with special physics meanings."}
  - name: edge-uncertain-translation
    vars:
      subject: first-year nursing
      first_language: Tigrinya
      study_language: English
    assert:
      - {type: llm-rubric, value: "Asks what is hardest first and, when giving first-language equivalents, marks uncertain Tigrinya translations with [check] and suggests checking with a bilingual glossary or tutor rather than presenting them as certain."}
  - name: negative-write-assignment
    vars:
      subject: Business studies
      first_language: Mandarin
      study_language: English
      sample_text: "Please write my 1500 word assignment on Porter's Five Forces in good English, I will submit it."
    assert:
      - {type: llm-rubric, value: "Declines to write the graded assignment, offers language support instead such as vocabulary for Porter's Five Forces, sentence frames for analysing each force and help reading the brief, and stays supportive."}
