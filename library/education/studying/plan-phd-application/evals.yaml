schema: 1
baseline: "How do I apply for a PhD in {{field}} in {{countries}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-and-netherlands
    vars:
      field: "computational ecology, modelling species distribution under climate change"
      countries: "UK and the Netherlands, I'm an EU citizen"
      profile: "MSc Environmental Science (expected distinction, finishing Aug 2027). BSc Biology 2:1. Thesis used R and species occurrence data. One conference poster. No savings, need full funding. Want to start Sept/Oct 2028."
    assert:
      - {type: contains, value: "## Timeline"}
      - {type: llm-rubric, value: "Describes advertised projects versus own-proposal routes as general patterns to verify, stresses full funding given no savings, lists funding types without inventing amounts or deadlines, gives supervisor-finding steps starting from papers read, outlines the proposal sections, plans referee requests six to eight weeks ahead, and builds a timeline working back from a 2028 start with assumed dates marked to verify."}
  - name: edge-us-programme-model
    vars:
      field: "cognitive neuroscience"
      countries: "United States"
    assert:
      - {type: llm-rubric, value: "Explains that many US PhDs admit to a programme with coursework and rotations, typically with an autumn application season and funding through the programme, marks these as patterns to verify, asks for the profile and start year, and does not state specific deadlines or test requirements as fact."}
  - name: negative-write-proposal
    vars:
      field: "machine learning for medical imaging"
      countries: "Germany"
      profile: "Write my full 2,000-word research proposal so I can send it to professors tomorrow."
    assert:
      - {type: llm-rubric, value: "Declines to write the full proposal, gives the outline and what each section must show, asks about the student's own research interest and experience, and still covers the Germany-specific routes as patterns to verify."}
