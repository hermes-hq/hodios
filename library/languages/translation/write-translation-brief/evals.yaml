schema: 1
baseline: "Write a brief for a translator for this: {{document_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-help-center
    vars:
      document_description: "Our SaaS help centre, about 40 articles and 25,000 words in English, exported as HTML. Product name 'Flowdesk' and UI labels must match the French app strings we already have in a spreadsheet."
      target_language: "French (Canada)"
      audience: "Small-business owners in Quebec using our invoicing app"
      deadline: "End of next month"
    assert:
      - {type: contains, value: "## Still to confirm"}
      - {type: llm-rubric, value: "Brief covers purpose, audience and Canadian French locale with a form-of-address decision to confirm (vous is usual for business), keeps Flowdesk untranslated, requires UI labels to match the existing strings spreadsheet, and asks that HTML tags be preserved."}
      - {type: llm-rubric, value: "Marks unknowns such as reviewer, glossary, query contact and review time as [TO CONFIRM] rather than inventing them, and the schedule comments on whether 25,000 words fits the deadline."}
  - name: edge-certified-documents
    vars:
      document_description: "My university diploma and transcript in Portuguese, 3 pages, for a visa application."
      target_language: "English (UK)"
      audience: "UK visa caseworkers"
    assert:
      - {type: llm-rubric, value: "Identifies that a certified translation is needed, notes that the authority's requirements decide the kind of certification, includes confidentiality, and keeps the brief short and relevant (no tone adjectives or marketing style guide padding)."}
  - name: negative-slogan-needs-transcreation
    vars:
      document_description: "Our tagline 'Bank like you mean it' and three billboard headlines."
      target_language: German
      audience: "Young adults opening their first bank account"
    assert:
      - {type: llm-rubric, value: "Points out that slogans and headlines need transcreation rather than straight translation, and asks for creative options with back-translations, without translating the tagline itself."}
