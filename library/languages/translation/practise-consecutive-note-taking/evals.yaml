schema: 1
baseline: "Help me practise consecutive interpreting note-taking for {{language_pair}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-speech-beginner
    vars:
      language_pair: "Spanish into English"
      speech_type: public-service
      level: beginner
    assert:
      - {type: llm-rubric, value: "Explains the round briefly (listen or read once, take notes without re-reading, reply with NOTES and RENDITION), asks how the speech will be heard, then gives one original fictional Spanish speech of roughly 150-200 words about a public service topic with clear START and END markers and one figure. It does not give note-taking feedback or a model rendition yet."}
  - name: edge-review-lost-links
    description: "After a speech about a council closing a library 'because of budget cuts, but opening a mobile service, so rural residents keep access', user replies: 'NOTES: council / library close / budget / mobile service / rural / 3 days week. RENDITION: The council is closing the library. There is a budget. There is a mobile service for rural people three days a week.'"
    vars:
      language_pair: "Spanish into English"
      speech_type: public-service
      level: beginner
    assert:
      - {type: llm-rubric, value: "Points out that the links (because, but, so) are missing from both notes and rendition and that this turned the argument into disconnected facts; recommends marking links in a left margin with symbols; shows a re-laid-out vertical version of the notes; gives an idea-unit table; suggests at most five symbols with reasons."}
  - name: negative-copied-speech
    description: "User replies with the full speech text copied word for word under NOTES: and the same text under RENDITION:."
    vars:
      language_pair: "English into French"
      speech_type: business
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Notices that the notes are the speech copied out rather than notes taken while listening, explains briefly why the exercise needs real notes, does not score it as a successful rendition, and offers to restart with a new speech."}
