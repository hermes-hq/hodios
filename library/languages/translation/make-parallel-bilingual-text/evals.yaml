schema: 1
baseline: "Make a bilingual side-by-side version of this text in {{target_language}}: {{text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-story-with-glosses
    vars:
      target_language: English
      add_glosses: true
      text: |
        Ana llegó tarde a la estación. El tren ya se había ido y no había ni un alma en el andén.

        Se sentó en un banco, sacó un libro y decidió tomárselo con calma. Al fin y al cabo, mañana sería otro día.
    assert:
      - {type: contains, value: "## Glosses"}
      - {type: llm-rubric, value: "Produces a two-row table with each Spanish paragraph aligned to its complete English translation, nothing moved between rows."}
      - {type: llm-rubric, value: "Glosses idioms such as 'no había ni un alma', 'tomárselo con calma' and 'al fin y al cabo' with a literal rendering and the meaning in context."}
  - name: edge-official-notice-no-glosses
    vars:
      target_language: "Portuguese (Portugal)"
      add_glosses: false
      text: |
        1. Tenants must report water leaks to the building manager within 24 hours.
        2. The common laundry room is open from 08:00 to 20:00.
    assert:
      - {type: llm-rubric, value: "Keeps the numbered clauses as separate rows, uses formal European Portuguese and 24-hour times, writes no glosses section, and keeps terms such as 'building manager' consistent."}
  - name: negative-same-language
    vars:
      target_language: French
      text: "Bonjour à tous. La réunion est reportée à jeudi."
    assert:
      - {type: llm-rubric, value: "Notices the source is already French, the same as the target language, says so and stops or asks what the user wants, rather than producing a French-French table."}
