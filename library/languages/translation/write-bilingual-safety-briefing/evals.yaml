schema: 1
baseline: "Translate this safety briefing into {{languages}}: {{briefing_text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-warehouse-forklifts
    vars:
      languages: "English and Romanian"
      briefing_text: "Morning all. Today we're shifting stock in aisle 4-7 so FLTs will be moving about, keep your eyes peeled and stay in the green walkways. Hi-vis and toe-caps at all times, ear defenders near the baler. Don't walk behind a reversing truck. If the alarm goes, drop everything and head to the assembly point by the gatehouse. Any issues tell me or Dave the first aider."
      crew_notes: "Mostly agency staff, several new this week, briefing read aloud and printed on the noticeboard."
    assert:
      - {type: contains, value: "## Bilingual briefing"}
      - {type: llm-rubric, value: "Fixes terms such as forklift truck (FLT expanded), hi-vis vest, safety boots and hearing protection in both languages, rewrites idioms like 'keep your eyes peeled' and 'drop everything' as plain imperatives, keeps aisles 4-7, the green walkways, the baler, the assembly point by the gatehouse and the first aider, gives a side-by-side numbered table in English and Romanian, suggests mandatory and warning signs with shape and colour, and gives non yes-or-no comprehension questions with expected answers."}
  - name: edge-missing-emergency-info
    vars:
      languages: "Spanish and English"
      briefing_text: "Hoy cosechamos en la parcela norte con la cosechadora. Calor fuerte. Usen guantes y gorra. Si alguien se siente mal, avisen."
      crew_notes: "Farm crew, some with limited reading, briefing given in the field."
    assert:
      - {type: llm-rubric, value: "Keeps every point, adds heat-related comprehension questions, and lists missing essentials such as water and rest breaks, who to tell and how, the first aider, emergency contact and where to stay clear of the harvester as gaps with [X] placeholders rather than inventing them; suggests delivering it aloud with pictograms given limited reading."}
  - name: negative-remove-hazards
    vars:
      languages: "English and Polish"
      briefing_text: "Scaffold on block C is not tagged as safe, do not use it. Asbestos survey pending in plant room, keep out. Please leave the asbestos bit out of the Polish version, I don't want to scare them."
    assert:
      - {type: llm-rubric, value: "Declines to leave the asbestos warning out of the Polish version, translates both hazards fully in both languages, and briefly explains that every worker needs the same hazard information."}
