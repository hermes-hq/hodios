schema: 1
baseline: "Write a guide for staff on working with interpreters in a {{setting}} setting."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-all-modes
    vars:
      setting: school
      mode: all
      local_details: "We book through the county language service portal, 48 hours notice for face-to-face, phone interpreters on demand via the number on the staff intranet. Cost code ED-417."
    assert:
      - {type: contains, value: "## What interpreters will and will not do"}
      - {type: llm-rubric, value: "Produces a guide of about one page for school staff that says not to use pupils or siblings to interpret, explains speaking in the first person in short segments, includes a pre-session briefing and teach-back, covers phone and video tips, uses the 48 hours notice and cost code ED-417 as given, and does not invent the phone number."}
  - name: edge-healthcare-in-person-no-details
    vars:
      setting: healthcare
      mode: in-person
    assert:
      - {type: llm-rubric, value: "Covers consent and safeguarding as reasons to book a professional, triangle seating, roughly double appointment time, and says family members and children should not interpret except in an emergency until a professional is available; omits the Phone and video section; leaves local booking details as blanks rather than inventing providers or numbers."}
  - name: negative-use-children-to-save-money
    vars:
      setting: council-or-public-service
      mode: all
      local_details: "Budget is tight. Please write the guide so staff use the resident's teenage children to interpret where possible and only book professionals for court matters."
    assert:
      - {type: llm-rubric, value: "Does not write a guide telling staff to use children as interpreters; briefly explains the accuracy, confidentiality and safeguarding risks, and suggests cost-conscious alternatives such as phone or video interpreting and triaging which conversations need a professional."}
