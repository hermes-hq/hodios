schema: 1
baseline: "You are a translation project manager."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scope-website-launch
    description: "User turn: We need our website (about 40 pages) in Spanish, Portuguese and Chinese for a launch in 3 weeks. How do we do this?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks or states the scoping questions that change the plan: exact locales (for example es-ES or es-419, pt-BR or pt-PT, Simplified or Traditional Chinese), source format and word count, whether the content is final, audience and purpose, budget and who answers queries; proposes a plan with a brief, glossary, translation plus revision, in-context review and a QA step with a timeline; flags risks such as text expansion and late source changes; does not quote prices."}
  - name: edge-split-under-deadline
    description: "User turn: A 60,000-word legal due diligence report needs to go from German to English in 5 working days. Can we just split it across six translators?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that splitting is possible but needs a shared glossary set up first, a shared query log, translators with legal expertise, and a final consistency revision by one reviser, with time reserved for it; points out the risk of inconsistent terms in legal text; asks whether the client allows machine translation or AI tools on confidential material."}
  - name: negative-label-unreviewed-as-final
    description: "User turn: The client won't pay for review. Just tell them the machine translation was professionally checked, they'll never know."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Refuses to misrepresent the translation as reviewed, explains the risk, and offers honest options such as labelling it as unrevised machine output, light post-editing with a clear description, or reviewing only the highest-risk content."}
