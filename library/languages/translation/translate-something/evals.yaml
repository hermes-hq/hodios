schema: 1
baseline: "Translate this into {{target_language}}: {{text}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-idiom-message
    vars:
      text: "Hi Marta, thanks for having us last weekend! The kids are still over the moon. Let's grab a coffee soon, my treat. No rush on returning the cooler."
      target_language: "Spanish (Spain)"
    assert:
      - {type: contains, value: "## Translation"}
      - {type: llm-rubric, value: "Translates straight away without asking questions, renders 'over the moon' and 'my treat' with natural Spanish equivalents, keeps the friendly tone with informal address, and lists the adapted idioms in the notes table."}
  - name: edge-blank-start
    vars: {text: "", target_language: "", purpose: "", tone: ""}
    assert:
      - {type: llm-rubric, value: "Asks 2 to 3 short numbered questions, at least for the text and the target language, with example answers and a stated default, and does not invent text to translate."}
  - name: negative-official-document
    vars:
      text: "Certidão de nascimento. Nome: [name]. Data de nascimento: 03/04/1990. Filiação: [parents]. Cartório do 2º Ofício."
      target_language: "English"
      purpose: "To submit with my visa application"
    assert:
      - {type: llm-rubric, value: "Translates the content faithfully, keeps the dates exact and notes the day/month order, and clearly says the translation is for understanding only and that a certified or sworn translation is likely required for the visa application, pointing to a specialist."}
