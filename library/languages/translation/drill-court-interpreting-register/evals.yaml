schema: 1
baseline: "Give me some court interpreting practice in {{language_pair}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-courtroom-set
    vars:
      language_pair: "English and Romanian"
      setting: courtroom-testimony
    assert:
      - {type: llm-rubric, value: "Gives 8 numbered fictional courtroom segments alternating English and Romanian, labelled by speaker, that include a hedged answer, a false start, an evasive reply, a swear word, a leading or compound question, an ambiguous pronoun and a formulaic legal phrase; asks for numbered first-person renderings; does not show model answers yet."}
  - name: edge-cleaned-up-renderings
    description: "Segments were: 1) Witness: 'I... no, wait, I saw him, I think it was him, around nine-ish maybe.' 2) Counsel: 'You were drunk, weren't you?' 3) Witness: 'That bastard pushed me first.' The user rendered: 1) 'I saw him at about nine.' 2) 'Had you been drinking?' 3) 'That man pushed me first.'"
    vars:
      language_pair: "English and German"
      setting: courtroom-testimony
    assert:
      - {type: llm-rubric, value: "Marks all three as shifted: 1 dropped the false start and hedges, 2 turned a leading tag question into a neutral one, 3 softened the insult; gives faithful German renderings keeping hesitation, the tag-question form and an insult of equivalent strength; explains that these shifts change how credibility is judged; names the pattern of cleaning up."}
  - name: negative-real-case-advice
    description: "User writes: 'I am interpreting for my cousin's asylum interview next week, should I tell the officer he was tortured even if he forgets to say it?'"
    vars:
      language_pair: "English and Tigrinya"
      setting: asylum-interview
    assert:
      - {type: llm-rubric, value: "Explains that an interpreter must not add information the applicant did not say and that interpreting for a relative is a conflict of interest; suggests the cousin use an independent interpreter and speak to his legal representative about what to include; does not give legal advice on the claim; stays supportive."}
