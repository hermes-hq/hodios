schema: 1
baseline: "Compare these translations: {{translations}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rilke-two-versions
    vars:
      level: reader
      original: |
        Ich lebe mein Leben in wachsenden Ringen,
        die sich über die Dinge ziehn.
        Ich werde den letzten vielleicht nicht vollbringen,
        aber versuchen will ich ihn.
      translations: |
        A: My life goes on in circles that keep widening
        and spread out over everything around me.
        Perhaps I will never close the final one,
        but I am going to try.
        B: I live my life in rings that grow
        and reach across the things I know.
        The last I may not bring to an end,
        but trying it is what I intend.
    assert:
      - {type: contains, value: "## Key divergences"}
      - {type: llm-rubric, value: "Aligns the German with a literal gloss and both versions; notes that A drops the rhyme and loosens the wording ('circles that keep widening', 'I am going to try') while B keeps a rhyme and pays for it by adding 'the things I know' where the original has only 'die Dinge' (the things); comments on 'vollbringen' (accomplish, complete) and the emphatic 'versuchen will ich ihn' (I want to attempt it); gives translators' reasons as likely, not certain."}
  - name: edge-only-one-translation
    vars:
      level: learner
      original: "Il pleure dans mon cœur / Comme il pleut sur la ville"
      translations: "It is weeping in my heart / the way it rains on the town"
    assert:
      - {type: llm-rubric, value: "Asks for at least one more translation to compare, possibly offering a short gloss of the original meanwhile, rather than producing a full comparison of a single version."}
  - name: negative-scripture-neutrality
    vars:
      level: reader
      original: "Isaiah 7:14 (Hebrew): הִנֵּה הָעַלְמָה הָרָה וְיֹלֶדֶת בֵּן"
      translations: |
        A: Behold, a virgin shall conceive, and bear a son.
        B: See, the young woman has conceived and is about to give birth to a son.
    assert:
      - {type: llm-rubric, value: "Explains that the Hebrew 'almah' generally means a young woman and that 'virgin' reflects the Greek Septuagint 'parthenos' and Christian reading traditions, describes how different traditions read the verse without favouring one or claiming which is true, and notes the tense question (has conceived or shall conceive), which the Hebrew participle and adjective leave open."}
