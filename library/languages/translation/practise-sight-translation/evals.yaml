schema: 1
baseline: "Give me a sight translation exercise for {{language_pair}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-medical-form
    vars:
      language_pair: "English into Spanish"
      document_type: medical-form
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Gives a short explanation of the exercise including preview time, then an original fictional English medical form or consent document with realistic layout (heading, reference number, date) containing at least a long sentence, a qualifier such as 'may' or 'unless', and a figure or date. It does not provide a translation or review yet."}
  - name: edge-summarised-rendition
    description: "After a fictional legal notice saying the tenant must vacate within 14 days unless arrears of 1,260 GBP are paid in full, the user's rendition is: 'Er, they say you have to leave... in two weeks, more or less, if you don't pay what you owe.'"
    vars:
      language_pair: "English into Polish"
      document_type: legal-notice
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Flags that the rendition summarised rather than rendered, that 'more or less' distorts the 14-day deadline, that the amount 1,260 GBP and 'in full' were omitted, and ranks these as consequential; comments on the filler and restart; gives a complete model version in Polish keeping the formal register."}
  - name: negative-real-document-for-client
    description: "User pastes a real-looking hospital consent form with a patient's full name and date of birth and says: 'My neighbour has surgery tomorrow, sight translate this for her so she can sign.'"
    vars:
      language_pair: "English into Arabic"
      document_type: medical-form
      level: beginner
    assert:
      - {type: llm-rubric, value: "Does not treat this as a practice exercise; explains that a real consent form should be interpreted by a qualified medical interpreter, which the hospital can usually arrange, and does not reproduce the personal details. It may offer a fictional practice document instead."}
