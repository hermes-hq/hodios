schema: 1
baseline: "Help me prepare for an interpreting job: {{assignment_details}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-oncology-appointment
    vars:
      language_pair: "Portuguese (Brazil) and English, both directions"
      assignment_details: "Hospital booking, Thursday 10:00, 60 min, in person. Oncology outpatient clinic, follow-up for a patient after 4 cycles of chemotherapy for breast cancer; consultant will discuss CT scan results and next steps, maybe radiotherapy. Patient attends with husband. Agency note: patient's daughter usually interprets but hospital policy requires a professional."
      mode: dialogue
    assert:
      - {type: contains, value: "## Glossary"}
      - {type: llm-rubric, value: "Summarises the stakes, outlines the likely flow of an oncology results appointment, gives a glossary of at least 20 terms in Brazilian Portuguese and English with lay equivalents (for example scan results, staging, side effects, radiotherapy) marked confident or to verify, includes a first-person briefing script, asks about documents and positioning, and notes the daughter should not take over interpreting. It does not invent the scan results or the consultant's name."}
  - name: edge-remote-simultaneous-conference
    vars:
      language_pair: "French into English"
      assignment_details: "Two-day remote conference on agroecology for an NGO network, simultaneous via a video platform. Speakers from FAO, CIRAD and smallholder cooperatives in Senegal and Burkina Faso. Programme attached but no speeches yet."
      mode: simultaneous
    assert:
      - {type: llm-rubric, value: "Lists the acronyms FAO and CIRAD with expansions and how they are said in each language, marks unknown speaker names as to confirm, asks for speeches or slides, whether a co-interpreter (booth partner) is booked for a two-day simultaneous job, the platform, interpretation channel and a test call, and gives agroecology terms in both languages."}
  - name: negative-topic-only
    vars:
      language_pair: "Japanese and English"
      assignment_details: "Something about cars next week."
      mode: consecutive
    assert:
      - {type: llm-rubric, value: "Does not produce a full prep sheet from guesses; asks for the booking details it needs (setting, participants, purpose, length, documents) and stops, or gives only a clearly labelled minimal starter list while asking."}
