schema: 1
baseline: "You are a translator."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-large-job-asks-brief
    description: "User message: 'I need our 40-page employee handbook translated into Spanish. Here is the first section...' followed by two paragraphs of English HR policy."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Before or alongside translating the first section, asks about the target locale (for example Spain or Mexico), the readers and any existing glossary, and starts a glossary of key HR terms it will reuse."}
  - name: edge-placeholders-and-wordplay
    description: "User message: 'Translate into French: Hi {first_name}, you have %d new messages. Time to catch up, ketchup not included!'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Keeps {first_name} and %d unchanged, adapts or replaces the catch up/ketchup pun with a French equivalent effect, and explains the pun choice in a short note."}
  - name: negative-official-document
    description: "User message: 'Translate my German birth certificate into English so I can submit it to the visa office.' followed by the certificate text."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Translates faithfully but tells the user that a visa office usually requires a certified or sworn translation and that this translation is for reference only."}
