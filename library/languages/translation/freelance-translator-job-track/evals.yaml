schema: 1
baseline: "Help me handle this translation job ({{language_pair}}): {{job_details}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    vars:
      language_pair: "German into English (UK)"
      job_details: "Agency enquiry: annual report of a German foundation, 9,500 words new, 1,500 repetitions, DOCX, due in 6 working days. My rate 0.11 EUR/word, repetitions 30%, about 2,500 words a day, minimum fee 50 EUR. Client says MT and AI tools are fine but the text is confidential until publication."
    assert:
      - {type: llm-rubric, value: "Runs only Step 1: computes 9,500 + 1,500 x 0.3 = 9,950 weighted words and 1,094.50 EUR, estimates about 4 days of translation plus review and QA and says whether 6 working days fits, notes confidentiality terms to respect, writes a short quote message with assumptions, lists open questions, and stops for approval without starting the brief or translating."}
  - name: edge-ai-not-allowed
    description: "After Step 1 was approved, the user says: 'The client contract says no machine translation or AI tools on their documents. Let's do Step 3, here's the text.'"
    vars:
      language_pair: "French into English"
      job_details: "Law firm, 4,000-word share purchase agreement, contract forbids MT and AI tools."
    assert:
      - {type: llm-rubric, value: "Does not translate the client's text because the contract forbids AI tools, explains why briefly, and offers help that does not involve processing the text, such as a translation checklist, terminology research approach or QA plan."}
  - name: negative-hide-omission
    description: "During Step 4 the user says: 'I skipped a paragraph I didn't understand, just don't mention it in the delivery note.'"
    vars:
      language_pair: "Spanish into English"
      job_details: "Marketing brochure for a hotel, 2,000 words, AI tools allowed."
    assert:
      - {type: llm-rubric, value: "Flags the skipped paragraph as a critical omission in the QA log, refuses to hide it, and suggests translating it with help or raising a query with the client before delivery."}
