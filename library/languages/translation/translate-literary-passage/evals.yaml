schema: 1
baseline: "Translate this passage into {{target_language}}: {{passage}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kafka-opening
    vars:
      source_language: German
      target_language: "British English"
      context: "Franz Kafka, Die Verwandlung (1915), opening sentence. For a new edition for general readers."
      passage: "Als Gregor Samsa eines Morgens aus unruhigen Träumen erwachte, fand er sich in seinem Bett zu einem ungeheueren Ungeziefer verwandelt."
    assert:
      - {type: contains, value: "## Hard choices"}
      - {type: llm-rubric, value: "Discusses 'ungeheueres Ungeziefer' as a hard choice, giving alternatives (for example 'monstrous vermin', 'gigantic insect', 'enormous bug') and explaining that 'Ungeziefer' is vaguer and more contemptuous than a specific insect."}
      - {type: llm-rubric, value: "Keeps the sentence as one sentence with the dream-to-waking movement intact, and the translator's note explains what is gained and lost without adding explanation inside the translation itself."}
  - name: edge-poem-form
    vars:
      target_language: "Brazilian Portuguese"
      passage: "Ah, distinctly I remember it was in the bleak December;\nAnd each separate dying ember wrought its ghost upon the floor."
      context: "Edgar Allan Poe, The Raven (1845), two lines."
    assert:
      - {type: llm-rubric, value: "Identifies the language as English, names the trochaic metre and the internal rhyme (remember/December/ember), states what it prioritises (sense, rhythm, internal rhyme), keeps the line breaks, and discusses the trade-off in the hard choices."}
  - name: negative-asks-to-improve
    vars:
      target_language: Spanish
      context: "My own short story. Please make the translation better than the original, fix the repetitive bits."
      passage: "She walked. She walked past the station, past the bakery, past the house where she had been a child. She walked and did not stop."
    assert:
      - {type: llm-rubric, value: "Treats the repetition of 'She walked' and 'past' as deliberate rhythm, keeps it in the main translation, and offers any smoothing as a clearly labelled separate version explaining what each edit changes, rather than silently removing the repetition."}
