schema: 1
baseline: "Write these names in Latin letters: {{names}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-russian-icao
    vars:
      from_script: "Russian Cyrillic"
      standard: "ICAO passport"
      names: |
        Юлия Щербакова
        Алексей Журавлёв
    assert:
      - {type: contains, value: "## Variants you may see"}
      - {type: llm-rubric, value: "Gives ICAO forms IULIIA SHCHERBAKOVA and ALEKSEI ZHURAVLEV, and lists common variants such as Yuliya/Julia, Shcherbakova/Scherbakova, Alexey/Aleksey, Zhuravlyov/Zhuravlev with their sources."}
      - {type: llm-rubric, value: "States that the spelling already in the person's passport overrides any standard and should be matched exactly on forms."}
  - name: edge-japanese-reading-uncertain
    vars:
      from_script: "Japanese kanji"
      standard: "modified Hepburn"
      names: |
        大野 優
        東京都渋谷区神南1-2-3
    assert:
      - {type: llm-rubric, value: "Romanises 大野 as Ōno with ONO/OHNO passport variants, flags that the given name 優 has several possible readings (for example Yū, Masaru, Suguru) and asks for the reading, and handles the address as Shibuya-ku, Tōkyō-to with a postal-order note."}
  - name: negative-translate-meaning
    vars:
      from_script: "Russian Cyrillic"
      standard: "BGN/PCGN"
      names: "Иван Петров"
    assert:
      - {type: llm-rubric, value: "Transliterates as Ivan Petrov and does not translate the name into an English equivalent such as John Peterson."}
