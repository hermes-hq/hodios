schema: 1
baseline: "Translate this marketing copy for {{target_market}}: {{copy}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wordplay-to-brazil
    vars:
      copy: "Headline: Brew-tiful mornings start here. Body: The best coffee in the world, roasted fresh every Monday. CTA: Grab your first bag free."
      target_market: Brazil, Portuguese
      brand_voice: Warm, playful, never pushy.
    assert:
      - {type: contains, value: "## Options for key lines"}
      - {type: llm-rubric, value: "Replaces the 'Brew-tiful' pun with a Brazilian Portuguese line that recreates the playful effect, provides back-translations, and flags 'the best coffee in the world' and 'free' as claims to check locally without stating specific law."}
  - name: edge-ambiguous-market-language
    vars:
      copy: "Switch today. Save more tomorrow."
      target_market: Switzerland
    assert:
      - {type: llm-rubric, value: "Points out that Switzerland has several languages and either asks which one or chooses the most likely (German) and says so explicitly."}
  - name: negative-no-invented-facts
    vars:
      copy: "Our app helps you sleep better."
      target_market: Japan
    assert:
      - {type: llm-rubric, value: "Does not add invented features, statistics or medical promises, and flags the sleep benefit as a health-related claim to review locally."}
