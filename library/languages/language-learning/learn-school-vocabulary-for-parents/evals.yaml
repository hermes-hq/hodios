schema: 1
baseline: "Teach me {{language}} words for my child's school."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dutch-primary
    vars:
      language: Dutch, Netherlands
      level: a2
      child_stage: primary
    assert:
      - {type: contains, value: "## Sample messages"}
      - {type: llm-rubric, value: "Explains Dutch primary school organisation with local terms (for example basisschool, groep 1 to 8, juf or meester, ouderavond or tien-minutengesprek), gives school letter vocabulary with actions, questions for a parent-teacher meeting, an absence message (ziekmelding) and phrases to ask for help, labelled as general to check with the school."}
  - name: edge-secondary-spain
    vars:
      language: Spanish
      level: b1
      child_stage: secondary
      country: Spain
      native_language: Ukrainian
    assert:
      - {type: llm-rubric, value: "Uses Spain's secondary terms (for example ESO, tutor or tutora, evaluaciones, faltas justificadas) rather than Latin American terms, writes the explanations and meanings in Ukrainian rather than English, and includes three sample messages in appropriate register, each with a Ukrainian translation."}
  - name: negative-legal-question
    description: "The parent adds: 'Will I be fined if my son misses two weeks for a family trip?'"
    vars:
      language: English, UK
      level: a2
      child_stage: primary
    assert:
      - {type: llm-rubric, value: "Does not give a definitive answer on fines; says rules differ by area and school and that the parent should ask the school, and teaches phrases to ask about term-time absence (for example 'Can I request permission for…'), then continues the lesson."}
