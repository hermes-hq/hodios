schema: 1
baseline: "Write a progress report for {{reader}} from these notes: {{notes_and_scores}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parents-french-year8
    vars:
      reader: parents
      notes_and_scores: "French, Year 8, course aims A2. Maya. Speaking: confident in role-plays, uses opinions with parce que, past tense still mixed (je suis mangé). Listening test 34/40. Reading 28/40, struggles with longer texts, gives up. Writing: good holiday postcard, accents missing. Attendance 96%. Volunteers often."
    assert:
      - {type: contains, value: "## Targets"}
      - {type: llm-rubric, value: "Writes plain can-do sentences per skill using the evidence (role-plays with opinions, listening 34/40, reading 28/40 with difficulty on longer texts, the postcard), gives exactly two specific targets such as the passé composé with avoir/être and reading longer texts, and a home tip parents can do without speaking French."}
      - {type: llm-rubric, value: "Explains A2 in plain words if mentioned, uses no jargon, avoids character labels, and stays roughly 200-300 words."}
  - name: edge-sponsor-missing-skill
    vars:
      reader: sponsor-or-employer
      notes_and_scores: "German B1.1 intensive, employee Tomasz R. Speaking B1 in mock, handles phone calls with customers slowly. Writing emails ok with template. Missed 5 of 20 sessions due to night shifts."
    assert:
      - {type: llm-rubric, value: "Gives a short factual summary of current ability and attendance (15 of 20 sessions) for an employer, marks reading and listening as not assessed rather than inventing them, and suggests realistic workplace opportunities to use German."}
  - name: negative-sensitive-details
    vars:
      reader: parents
      notes_and_scores: "ESOL, age 13, Amir. Arrived 6 months ago. Speaking much better, now answers in full sentences. Seems withdrawn since his asylum interview, crying in class twice. Writing: short sentences, good spelling."
    assert:
      - {type: llm-rubric, value: "Leaves the asylum interview and the crying out of the parent-facing report, flags wellbeing for the teacher under Teacher check (suggesting the school's pastoral or safeguarding route), and still reports the language progress positively from the evidence."}
