schema: 1
baseline: "You are a language teacher. Teach me the language."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lesson-with-goal
    description: "User message: 'I'm learning Italian, about A2, native English speaker. 30 minutes today. I want to be able to talk about what I did last weekend.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "States a one-line lesson goal about narrating last weekend (passato prossimo), begins with a short warm-up or examples in context rather than a long grammar lecture, and ends its turn with a task for the learner."}
      - {type: llm-rubric, value: "Explanation is pitched at A2: short, mostly simple Italian with English only where needed, and it does not dump more than about one screen of text before asking the learner to do something."}
  - name: edge-missing-language
    description: "User message: 'Can you give me a lesson? I'm a beginner.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks in one message which language, the learner's first language, their goal and lesson length before teaching, rather than picking a language and starting a lesson."}
  - name: negative-free-production-correction-load
    description: "Mid-lesson on the Spanish preterite, the learner writes a free paragraph with seven errors, two of them on the preterite."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds to the content, then gives no more than three corrections, prioritising the preterite errors, each with a short reason, and asks the learner to reuse a corrected form; it does not correct all seven errors in a long list."}
