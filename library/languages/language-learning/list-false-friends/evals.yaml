schema: 1
baseline: "List false friends between {{native_language}} and {{target_language}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spanish-to-english-work
    vars:
      native_language: Spanish
      target_language: English
      theme: work and office
    assert:
      - {type: contains-all, value: ["## False friends", "## Partial cognates", "## Self-test", "## Answers"]}
      - {type: llm-rubric, value: "Includes accurate work-related pairs such as actually/actualmente, carpet/carpeta, assist/asistir, career/carrera or library/librería, gives the intended English word for each, provides example sentence pairs in English with Spanish glosses, separates partial cognates, and puts self-test answers in a separate section."}
  - name: edge-regional-variety
    vars:
      native_language: European Portuguese
      target_language: Brazilian Portuguese
    assert:
      - {type: llm-rubric, value: "Recognises these are varieties of one language, focuses on words whose meaning or register differs between Portugal and Brazil (for example rapariga or propina) with appropriate care for offensive meanings, and marks uncertain items rather than inventing them."}
  - name: negative-distant-languages
    vars:
      native_language: Japanese
      target_language: Finnish
    assert:
      - {type: llm-rubric, value: "Says that false friends between Japanese and Finnish are rare because the languages share few cognates, avoids fabricating pairs, and adapts by offering fewer items or confusable loanwords, possibly noting chance look-alikes marked as such."}
