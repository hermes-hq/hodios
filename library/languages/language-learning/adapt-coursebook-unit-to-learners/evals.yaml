schema: 1
baseline: "Adapt this coursebook unit for my learners. Unit: {{unit_summary}} Learners: {{learners}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-holiday-unit-engineers
    vars:
      unit_summary: "English B1 Unit 5 'Getting away'. Aims: present perfect for experience vs past simple; travel vocabulary; making recommendations. L1 reading about gap-year backpackers; grammar gap-fill. L2 listening: couple choosing a cruise; vocabulary of hotels. L3 speaking: plan a dream holiday with a partner; writing: postcard."
      learners: "8 software engineers at a German company, 4 lessons of 90 minutes, they travel to client sites and conferences, write status emails, never do holidays together. They find the cruise and postcard pointless."
    assert:
      - {type: contains, value: "## Change list"}
      - {type: llm-rubric, value: "Keeps the present perfect vs past simple and recommendations aims, replaces contexts with business travel and conferences (for example 'Have you ever presented at...'), replaces the postcard with an email or travel recommendation for a colleague, and gives change type, reason and prep time per change with the top three marked."}
      - {type: llm-rubric, value: "Writes 2-4 original replacement materials in full at B1 and does not reproduce the coursebook texts."}
  - name: edge-teens-sensitive-content
    vars:
      unit_summary: "Spanish A2 Unidad 3 'Mi familia'. Aims: possessives, ser/tener for description, family vocabulary. Lessons: family tree of a celebrity; describe your family photo; write about your family."
      learners: "Year 9, 26 students, several in foster care and some newly arrived refugees."
    assert:
      - {type: llm-rubric, value: "Flags that describing one's own family could be painful, keeps the possessives and description aims, and offers alternatives such as a fictional or TV family, a chosen 'important people' approach or student choice, without singling out any student."}
  - name: negative-no-unit-content
    vars:
      unit_summary: "Unit 7"
      learners: "Retirees learning Italian"
    assert:
      - {type: llm-rubric, value: "Asks for the unit's aims and lesson contents and stops, rather than inventing what Unit 7 contains."}
