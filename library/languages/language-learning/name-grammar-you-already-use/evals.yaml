schema: 1
baseline: "Explain the grammar of these {{target_language}} sentences: {{sentences_or_topic}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spanish-subjunctive-teaching
    vars:
      target_language: Spanish
      sentences_or_topic: "I grew up speaking Spanish in Texas and I'm training to be a Spanish teacher. I say things like 'Quiero que vengas', 'Cuando llegue te aviso', 'Si tuviera dinero, me compraba un carro', 'Ojalá que no llueva' without thinking. I don't know the names."
      purpose: teaching
    assert:
      - {type: contains, value: "## Terms to know"}
      - {type: llm-rubric, value: "Names present subjunctive after querer que and ojalá, subjunctive in future-time cuando clauses, and imperfect subjunctive in si-clauses; notes that 'me compraba' in the main clause is common in speech while formal writing prefers the conditional 'me compraría', without calling it wrong; gives terms in English and Spanish (modo subjuntivo, pretérito imperfecto de subjuntivo, oración condicional) and teaching-style check tasks with answers."}
  - name: edge-russian-aspect-exam
    vars:
      target_language: Russian
      sentences_or_topic: "verb aspect pairs, I always just know which one, but the exam asks me to name and justify"
      purpose: exam
    assert:
      - {type: llm-rubric, value: "Explains imperfective and perfective aspect (несовершенный и совершенный вид) with typical pair formation (prefixes, suffix changes, suppletive pairs), rules for completed versus repeated or ongoing actions, and exam-style tasks that ask the learner to name and justify the aspect."}
  - name: negative-too-broad
    vars:
      target_language: German
      sentences_or_topic: "all German grammar"
      purpose: exam
    assert:
      - {type: llm-rubric, value: "Asks the learner to narrow the request to one area (for example cases, word order, verb tenses, or sentences they actually use) instead of attempting to cover all German grammar, and stops."}
