schema: 1
baseline: "Teach me these {{language}} characters: {{characters_or_level}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chinese-shared-components
    vars:
      characters_or_level: "休 体 林 森 明 好"
      language: chinese
    assert:
      - {type: contains, value: "## Compounds"}
      - {type: llm-rubric, value: "Breaks 休 into 亻 (person) and 木 (tree), 林 and 森 into repeated 木, 明 into 日 and 月, 好 into 女 and 子, gives pinyin with tone marks (xiū, tǐ, lín, sēn, míng, hǎo), and labels the stories as memory aids rather than history."}
      - {type: llm-rubric, value: "Every compound word is a real, common Mandarin word with correct pinyin, and the quiz answers are kept in a separate block."}
  - name: edge-japanese-level
    vars:
      characters_or_level: "JLPT N5, start with nature words"
      language: japanese
      native_language: spanish
    assert:
      - {type: llm-rubric, value: "Picks 6 to 8 N5 kanji related to nature (for example 山, 川, 木, 林, 森, 雨, 日, 月), explains in Spanish, gives on'yomi in katakana and kun'yomi in hiragana, and uses Japanese compounds rather than Chinese ones."}
  - name: negative-hangul-not-characters
    vars:
      characters_or_level: "한국어 사랑"
      language: japanese
    assert:
      - {type: llm-rubric, value: "Notices that the text is Korean hangul, not kanji, and asks what the learner meant instead of inventing kanji breakdowns."}
