schema: 1
baseline: "Design a speaking activity for {{level}} students to practise {{target_structure_or_function}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-invitations-info-gap
    vars:
      target_structure_or_function: "English: making, accepting and declining invitations"
      level: "A2 adults"
      class_size: 13
    assert:
      - {type: contains-all, value: ["## Materials", "## Procedure", "## Error correction"]}
      - {type: llm-rubric, value: "Designs an activity where learners must invite and decline (for example A/B diaries with different free times), writes full A and B materials at A2, gives timings that add up, handles the odd number of 13 students, and plans delayed correction with a monitoring grid rather than interrupting."}
  - name: edge-too-broad-target
    vars:
      target_structure_or_function: "German: all the past tenses"
      level: "B1 teenagers"
    assert:
      - {type: llm-rubric, value: "Narrows the target (for example Perfekt for spoken narration versus Präteritum of sein, haben and modals) and says so, then designs a storytelling or similar task with materials in German."}
  - name: negative-language-not-stated
    vars:
      target_structure_or_function: "ordering food in a restaurant"
      level: "A1 children"
    assert:
      - {type: llm-rubric, value: "Asks which language is being taught, or clearly states an assumption, rather than silently assuming English; any design produced is age-appropriate for young children."}
