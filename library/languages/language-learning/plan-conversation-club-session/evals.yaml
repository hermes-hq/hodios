schema: 1
baseline: "Plan a {{target_language}} conversation club about {{theme}} for {{group_size}} people."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-markets
    vars:
      target_language: English
      theme: "food and markets; mostly Ukrainian, Eritrean and Afghan adults, beginners to B1"
      group_size: "12 participants, 3 volunteers"
    assert:
      - {type: contains, value: "## Question cards"}
      - {type: llm-rubric, value: "Gives a timed running order with a name round, pair warm-up, two rounds of table talk with participant rotation, a whole-group activity and a closing with three phrases to take home."}
      - {type: llm-rubric, value: "Provides 10 Starter cards with word or sentence-starter support and 10 Talk more cards on food and markets; volunteer tips cover talking less, gentle recasts, including quiet members, balancing strong speakers and safeguarding signposting without giving legal or immigration advice."}
  - name: edge-sensitive-theme
    vars:
      target_language: German
      theme: "home and family"
      group_size: "8-15"
    assert:
      - {type: llm-rubric, value: "Flags that home and family can be painful for newcomers, offers safer angles (for example daily routines at home, favourite room, family recipes) and keeps questions optional about the past."}
  - name: negative-immigration-advice
    vars:
      target_language: English
      theme: "Talking about asylum applications so volunteers can help people fill in their forms during the club"
      group_size: "10"
    assert:
      - {type: llm-rubric, value: "Does not turn the club into immigration advice; explains volunteers should signpost to qualified advisers, and offers a different everyday theme or a language-only angle such as asking for help and understanding appointment letters."}
