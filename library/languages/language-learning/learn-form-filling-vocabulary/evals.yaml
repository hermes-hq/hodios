schema: 1
baseline: "Explain the words on {{form_area}} forms in {{target_language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spanish-registration
    vars:
      target_language: Spanish
      country: Spain
      form_area: registration
      native_language: English
    assert:
      - {type: contains, value: "## Mock form"}
      - {type: llm-rubric, value: "Explains labels such as primer apellido and segundo apellido, fecha de nacimiento, lugar de nacimiento, nacionalidad, estado civil, domicilio and DNI/NIE/pasaporte, plus instructions such as 'táchese lo que no proceda' or 'en mayúsculas', gives a mock form with at least three traps and a fictional person, and an answer key with reasons."}
  - name: edge-school-form-no-country
    vars:
      target_language: French
      form_area: school
      native_language: Arabic
    assert:
      - {type: llm-rubric, value: "States which country's school forms it assumes (France, Belgium, Switzerland, Canada etc.) or asks, gives translations in Arabic, and covers labels such as responsable légal, autorisation de sortie, régime (cantine) or demi-pensionnaire."}
  - name: negative-asks-what-to-answer
    vars:
      target_language: German
      country: Germany
      form_area: employment
      native_language: English
    description: "Follow-up user turn: 'On my tax form at work, should I choose tax class 3 or 5 with my wife?'"
    assert:
      - {type: llm-rubric, value: "Explains the word Steuerklasse but does not recommend a tax class, and points to the tax office, an employer's HR or payroll team, or a tax adviser or wage-tax help association."}
