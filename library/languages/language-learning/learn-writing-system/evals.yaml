schema: 1
baseline: "Teach me {{script}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cyrillic-russian
    vars:
      script: "Cyrillic for Russian"
      native_script: latin
      minutes_per_day: 15
    assert:
      - {type: contains, value: "## Plan"}
      - {type: llm-rubric, value: "Groups letters into small sets that unlock real words early (for example starting with letters like А, К, М, О, Т that look and sound familiar), and flags false friends such as Р, Н, В, С that look Latin but sound different."}
      - {type: llm-rubric, value: "Every practice word for set 1 is a real Russian word spelled only with set 1 letters, and transliterations are kept apart from the words in an answers line."}
  - name: edge-hangul-short-time
    vars:
      script: "hangul for Korean"
      minutes_per_day: 5
    assert:
      - {type: llm-rubric, value: "Explains that hangul is a featural alphabet written in syllable blocks, uses smaller sets because of the 5-minute budget, and uses Revised Romanization for transliteration."}
  - name: negative-ambiguous-chinese
    vars:
      script: "Chinese characters"
    assert:
      - {type: llm-rubric, value: "Asks a short clarifying question (which language such as Mandarin or Cantonese, and simplified or traditional) before planning sets, and does not present a full plan built on a guess."}
