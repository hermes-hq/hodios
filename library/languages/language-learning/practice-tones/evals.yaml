schema: 1
baseline: "Help me practise {{language}} tones."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mandarin-beginner
    vars:
      language: Mandarin
      level: beginner
    assert:
      - {type: contains, value: "## Tone pairs"}
      - {type: llm-rubric, value: "Describes the four tones with Chao contours (55, 35, 214, 51) plus the neutral tone, uses pinyin with tone marks, and explains third-tone sandhi and the tone changes of 一 and 不."}
      - {type: llm-rubric, value: "Minimal pairs are real words with correct tones (for example mǎi/mài, mā/mǎ), the response says it cannot hear the learner, and the quiz answers are in a separate block."}
  - name: edge-vietnamese-northern
    vars:
      language: "Vietnamese (Northern)"
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Teaches six Northern tones (ngang, huyền, sắc, hỏi, ngã, nặng) with diacritics, mentions the glottalised or creaky quality of ngã and nặng, notes that Southern Vietnamese merges hỏi and ngã, and focuses drills on difficult pairs and short phrases."}
  - name: negative-non-tonal
    vars:
      language: Spanish
    assert:
      - {type: llm-rubric, value: "Says Spanish is not a tonal language and does not invent a tone system; it may offer stress or intonation practice instead, and stops."}
