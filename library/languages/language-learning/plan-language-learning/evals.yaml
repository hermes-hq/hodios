schema: 1
baseline: "Make me a study plan to go from {{current_level}} to {{goal_level}} in {{target_language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-german-b1-exam
    vars:
      target_language: German
      current_level: A2
      goal_level: B1, Goethe-Zertifikat
      minutes_per_day: 45
      deadline: in 6 months
    assert:
      - {type: contains, value: "## Weekly routine"}
      - {type: llm-rubric, value: "Shows an hours calculation (45 minutes a day over about 26 weeks is roughly 135 hours) compared with an estimated range for A2 to B1, gives a weekly table whose minutes add up to about 45 a day, includes speaking at least twice a week and daily review, and adds Goethe exam practice late in the plan."}
  - name: edge-unrealistic-goal
    vars:
      target_language: Japanese
      current_level: complete beginner
      goal_level: C1
      minutes_per_day: 20
      deadline: in 1 year
    assert:
      - {type: llm-rubric, value: "States plainly that C1 Japanese from zero in a year at 20 minutes a day is not realistic, shows why with numbers, and offers options such as more time, a later date or a narrower goal, without promising success."}
  - name: negative-no-deadline
    vars:
      target_language: Portuguese
      current_level: B1
      goal_level: B2
      native_language: Spanish
    assert:
      - {type: llm-rubric, value: "Uses the default of 30 minutes a day, computes a likely completion date instead of inventing a deadline, and lists at most three follow-up questions at the end rather than asking them before answering."}
      - {type: llm-rubric, value: "Lowers the hour estimate because the learner speaks Spanish, and says so, rather than applying an English-speaker figure unchanged."}
