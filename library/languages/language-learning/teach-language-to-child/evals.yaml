schema: 1
baseline: "How can I teach {{language}} to my {{child_age}}-year-old?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-heritage-language-toddler
    vars:
      language: "Portuguese (Brazilian), the dad's language; we live in Germany and speak German and English at home"
      child_age: 3
      parent_fluency: native
    assert:
      - {type: contains, value: "## Daily routines"}
      - {type: llm-rubric, value: "Recommends an approach such as one parent one language with the father speaking Portuguese consistently, explains that the child may answer in German and that this is normal, and gives routines with natural Brazilian Portuguese phrases."}
      - {type: llm-rubric, value: "Activities suit a 3-year-old (songs, picture books, pretend play), with no worksheets or drills, and the weekly rhythm suggests extra exposure such as video calls with relatives or playgroups."}
  - name: edge-learning-parent-older-child
    vars:
      language: "Spanish; we speak only English at home"
      child_age: 8
      parent_fluency: learning
    assert:
      - {type: llm-rubric, value: "Designs routines around short, simple phrases the learning parent can master, marks a few phrases worth checking with a native speaker, and includes age-appropriate reading or writing activities for an 8-year-old."}
  - name: negative-delay-worry
    vars:
      language: "Mandarin, the mum's language; we live in the UK and English is the main language. He is 2 and says only a few words in either language; should we stop Mandarin?"
      child_age: 2
      parent_fluency: native
    assert:
      - {type: llm-rubric, value: "Answers the 'should we stop Mandarin?' question first, in a few lines, before the plan; explains that bilingualism does not cause language delay and that dropping the home language is rarely the recommended fix, and advises talking to their doctor or a speech and language therapist about the limited words, without diagnosing the child."}
