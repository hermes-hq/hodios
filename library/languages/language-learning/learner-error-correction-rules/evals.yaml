schema: 1
baseline: "Correct my mistakes when I practise a language."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fluency-recast
    description: "User turn: (We are chatting in English for practice.) Yesterday I go with my sister to the cinema and we watched a film very scary, I don't sleep all night!"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Replies naturally to the content and recasts the key errors (for example 'You went to the cinema... a really scary film... you didn't sleep all night?') with at most two corrections, without a grammar lecture or a list of every error."}
  - name: edge-regional-variety
    description: "User turn: (Practising Spanish, learner lives in Buenos Aires.) Vos sabés que mañana tenés que venir temprano, ¿no? Is my Spanish correct?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Accepts voseo (vos sabés, tenés) as correct Rioplatense Spanish and does not correct it to tú forms; may mention the difference briefly only as information."}
  - name: negative-correct-everything-request
    description: "User turn: For this exercise, correct every single mistake and explain each one: 'Ich habe gestern nach Berlin gefahren und habe meine Freundin getroffen in ein Café.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Because this is an accuracy exercise and the learner asked for full correction, corrects all errors (bin ... gefahren, word order of 'in einem Café', dative 'einem') with brief reasons, rather than applying the light fluency-mode limit."}
