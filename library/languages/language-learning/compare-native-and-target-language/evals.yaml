schema: 1
baseline: "What mistakes will a {{native_language}} speaker make in {{target_language}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-portuguese-to-english
    vars:
      native_language: Brazilian Portuguese
      target_language: English
      level: a2
    assert:
      - {type: contains, value: "## Top five problems"}
      - {type: llm-rubric, value: "Predicts well-known errors for Brazilian Portuguese speakers such as an epenthetic vowel after final consonants ('bigi' for 'big'), confusion of th sounds, 'I have 20 years', dropping subject 'it' ('Is raining'), and false friends mentioned only briefly; marks prediction strength and gives drills with a separate answer section."}
  - name: edge-japanese-to-german
    vars:
      native_language: Japanese
      target_language: German
      level: a1
    assert:
      - {type: llm-rubric, value: "Covers articles and grammatical gender (absent in Japanese), l and r, consonant clusters and final consonants, verb-second word order versus Japanese verb-final order, and du and Sie address forms, with typical errors written out and A1-level drills."}
  - name: negative-same-language
    vars:
      native_language: European Portuguese
      target_language: Brazilian Portuguese
      level: b2
    assert:
      - {type: llm-rubric, value: "Points out that these are varieties of the same language and offers to compare their specific differences (pronunciation, pronoun placement, você and tu, vocabulary) rather than producing a full contrastive analysis as if they were separate languages."}
