schema: 1
baseline: "Give me a 45-minute {{language}} study session at {{level}} level."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-warm-up-then-stop
    vars:
      language: French
      level: A2
      topic: "weekend plans"
    assert:
      - {type: llm-rubric, value: "Runs only the warm-up: asks for recent material to review or says it will use high-frequency A2 language about weekend plans, gives a short retrieval round of about 6 to 8 items without answers, and stops to wait for the learner instead of presenting a new text or exercises."}
  - name: edge-no-topic
    vars:
      language: Japanese
      level: "upper beginner"
    assert:
      - {type: llm-rubric, value: "Offers two or three topics suited to an upper beginner for the learner to choose from and does not jump into new input before a topic is chosen."}
  - name: negative-skip-to-recap
    description: "After step 2, the learner writes: 'I'm out of time, just give me the recap now.'"
    vars:
      language: German
      level: B1
      topic: "job interviews"
    assert:
      - {type: llm-rubric, value: "Respects the request and produces a recap based only on the warm-up and input actually covered, saying briefly that practice and production were skipped, and does not invent errors or performance from steps that did not happen."}
