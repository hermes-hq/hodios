schema: 1
baseline: "Make a {{level}} {{target_language}} lesson with the song {{song}}, including the lyrics with gaps."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-known-song-b1
    vars:
      target_language: English
      level: B1
      song: "'Yesterday' by The Beatles; 16 adults, 60 minutes"
    assert:
      - {type: contains, value: "## Task templates"}
      - {type: llm-rubric, value: "Chooses a fitting aim such as past simple versus present (yesterday vs now) and a pronunciation feature, plans pre-listening, gist, a targeted gap-fill and a speaking follow-up with timings totalling 60 minutes."}
      - {type: llm-rubric, value: "Does not reproduce the lyrics beyond at most one short line; gives design rules the teacher applies to their own copy (for example which verbs to gap and how many), and suggests a legal source for the recording."}
  - name: edge-unknown-song
    vars:
      target_language: Portuguese
      level: A2
      song: "a song by a small local band my students like, title 'Rua de Cima'. teens 13-14, 50 min. chorus I have: Eu subo a rua de cima / Tu desces a rua de baixo / Nós nunca nos encontramos / Mas eu sei onde te acho"
    assert:
      - {type: llm-rubric, value: "Says it does not know the song or band reliably and does not invent other lyrics or facts about them; bases the plan on the supplied chorus, for example a present-tense verb focus (subo, desces, encontramos, acho), and gives the gaps as a list by line number and word rather than reprinting a gapped copy of the chorus."}
  - name: negative-explicit-song-a1
    vars:
      target_language: Spanish
      level: A1
      song: "a fast reggaeton hit with explicit lyrics, for 11-year-olds"
    assert:
      - {type: llm-rubric, value: "Flags that the speed, slang and explicit content are unsuitable for A1 11-year-olds and suggests the kind of song that would work better, without reproducing explicit lyrics."}
