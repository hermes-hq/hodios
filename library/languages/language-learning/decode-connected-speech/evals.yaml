schema: 1
baseline: "Explain how native speakers talk fast in {{target_language}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-french-b1
    vars:
      target_language: "French (France)"
      level: B1
      native_language: English
    assert:
      - {type: contains, value: "## Slow and fast side by side"}
      - {type: llm-rubric, value: "Names French processes such as ne-dropping, schwa deletion, liaison and enchaînement, 'il y a' to 'y a', 'tu es' to 't'es', 'je suis' to 'chuis', 'je sais pas' to 'chais pas', labels register, shows full and fast forms side by side, then gives one fast-version drill item and waits without revealing the answer."}
  - name: edge-partly-right-answer
    description: "Mid-drill in Brazilian Portuguese. The item was 'Cê tá aonde?' and the learner wrote 'Você está onde?' without noting 'aonde'."
    vars:
      target_language: "Brazilian Portuguese"
      level: B1
    assert:
      - {type: llm-rubric, value: "Marks the answer right or partly right with explanation, gives the full form (Você está aonde/onde?), names the reductions você to cê and está to tá, comments on aonde as a common informal variant, updates the score and gives the next single item."}
  - name: negative-unclear-variety
    vars:
      target_language: Spanish
      level: B2
    assert:
      - {type: llm-rubric, value: "Asks in one line which variety (for example Spain, Mexico, Caribbean, Rioplatense) or states an assumption before teaching, since reductions such as s-aspiration differ by region, rather than mixing varieties."}
