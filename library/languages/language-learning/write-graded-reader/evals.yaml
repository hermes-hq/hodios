schema: 1
baseline: "Write a {{level}} story in {{target_language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-a2-italian-with-words
    vars:
      target_language: Italian
      level: A2
      interests: cooking, football
      target_words: "la ricetta, assaggiare, il mercato, dimenticare, la partita"
    assert:
      - {type: contains, value: "## Target words used"}
      - {type: llm-rubric, value: "The story is roughly 250 to 400 words of A2 Italian, connects to cooking or football, uses each of the five target words at least twice with the first use bolded, and has a glossary, six questions in Italian and their answers."}
  - name: edge-a1-no-optional-args
    vars:
      target_language: Japanese
      level: A1
    assert:
      - {type: llm-rubric, value: "Produces a very short, simple A1 Japanese story with heavy repetition and a glossary that includes readings, and reports that no target words were given rather than inventing a list."}
  - name: negative-unfittable-word
    vars:
      target_language: Spanish
      level: A1
      target_words: "desoxirribonucleico, la casa, comer"
    assert:
      - {type: llm-rubric, value: "Uses la casa and comer naturally and states that desoxirribonucleico does not fit an A1 story instead of forcing it in."}
