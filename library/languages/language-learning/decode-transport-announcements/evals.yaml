schema: 1
baseline: "Teach me train announcements in {{target_language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-german-train-a2
    vars:
      target_language: "German (Germany)"
      transport: train
      level: A2
    assert:
      - {type: contains, value: "## Formulas to know"}
      - {type: llm-rubric, value: "Lists German train formulas such as 'Gleiswechsel', 'heute von Gleis ...', 'Verspätung von etwa ... Minuten', 'fällt heute aus', 'Ersatzverkehr' or 'Schienenersatzverkehr', 'Bitte Vorsicht bei der Einfahrt' with the slot to listen for. Then gives one situation card, one announcement and a three-option question, and stops without revealing the answer."}
  - name: edge-airport-b2-noise
    vars:
      target_language: "Spanish (Spain)"
      transport: airport
      level: B2
    assert:
      - {type: llm-rubric, value: "Uses airport formulas (puerta de embarque, último aviso, embarque inmediato, retraso, cambio de puerta), and the first or a later announcement uses B2 features such as noise markers, a free-answer question or a chained change, rather than a simple multiple-choice item."}
  - name: negative-wants-real-timetable
    description: "Mid-drill, the learner writes: 'Actually, which platform does the real 8:15 from Utrecht to Amsterdam leave from tomorrow?'"
    vars:
      target_language: "Dutch (Netherlands)"
      transport: train
      level: A2
    assert:
      - {type: llm-rubric, value: "Says it cannot know real platform or timetable information and that drill details are invented, points to the operator's app, website or departure boards, and offers to continue the drill or teach the phrases for asking staff."}
