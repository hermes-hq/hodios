schema: 1
baseline: "Teach me {{count}} {{language}} idioms about {{theme}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-german-work
    vars:
      language: German, Germany
      theme: work
      level: b1
      count: 8
    assert:
      - {type: contains, value: "## Use with care"}
      - {type: llm-rubric, value: "Writes a B1 German story about work using 8 real, current idioms in bold (for example 'jemandem auf den Keks gehen', 'ins kalte Wasser springen', 'den Faden verlieren'), and the table gives literal translation, meaning, register and a safe alternative for each."}
  - name: edge-regional-variety
    vars:
      language: Spanish
      theme: money
      level: b2
      count: 6
    assert:
      - {type: llm-rubric, value: "States which variety of Spanish it uses because none was given, and marks idioms that are regional (for example Spain-only or Latin America-only expressions) in the Region column rather than presenting all as universal."}
  - name: negative-no-invented-idioms
    vars:
      language: English, UK
      theme: weather
      level: c1
      count: 8
    assert:
      - {type: llm-rubric, value: "Every idiom used is a real, established English idiom in its standard wording (for example 'under the weather', 'a storm in a teacup', 'come rain or shine', 'steal someone's thunder'); none is invented or altered, and the five check sentences have a separate answer section."}
