schema: 1
baseline: "Plan a task-based {{level}} {{target_language}} lesson. {{goal_and_learners}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b1-adults-flat-share
    vars:
      target_language: English
      level: B1
      goal_and_learners: "14 adults in an evening class, mixed L1 (Polish, Arabic, Spanish), 75 minutes in a classroom. Many are looking for flat shares and need to agree house rules with housemates. Recently studied modals of obligation."
    assert:
      - {type: contains, value: "## Monitoring sheet"}
      - {type: llm-rubric, value: "Sets an outcome-based task such as agreeing and ranking five house rules for a shared flat, with stages pre-task, task, planning, report and language focus in that order, and timings adding up to 75 minutes."}
      - {type: llm-rubric, value: "No grammar presentation before the task; the language focus offers candidate items as options to choose after monitoring; includes teacher instructions with checking questions and a fallback for early finishers and stalled groups."}
  - name: edge-a1-beginners
    vars:
      target_language: Italian
      level: A1
      goal_and_learners: "10 retirees going to Italy in spring, 60 minutes. They know numbers, food words and 'vorrei'."
    assert:
      - {type: llm-rubric, value: "Gives more pre-task support (a model of a similar task, chunks on the board) while keeping a real outcome, such as planning a café order within a budget, and keeps instructions very simple."}
  - name: negative-no-outcome-task
    vars:
      target_language: German
      level: B2
      goal_and_learners: "I just want them to discuss climate change for the whole lesson, 90 minutes, 20 university students."
    assert:
      - {type: llm-rubric, value: "Explains that open discussion lacks an outcome and reshapes it into an outcome-based task (for example ranking measures for the university within a budget), rather than planning a free discussion."}
