schema: 1
baseline: "What words are similar between {{native_language}} and {{target_language}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-english-to-spanish
    vars:
      target_language: Spanish
      native_language: English
    assert:
      - {type: contains, value: "## Correspondence rules"}
      - {type: llm-rubric, value: "Gives high-payoff rules such as -tion to -ción, -ty to -dad, -ous to -oso, -ly to -mente, -ist to -ista, e- added before s plus consonant (special, especial), ph to f, with real examples and reliability ratings; traps include false friends like embarazada, éxito or carpeta; the guessing game hides two or three traps revealed only in the answer key."}
  - name: edge-english-to-german-sound-shifts
    vars:
      target_language: German
      native_language: English
    assert:
      - {type: llm-rubric, value: "Includes inherited sound correspondences such as t to z/tz/ss (ten zehn, water Wasser), d to t (day Tag), p to pf/ff (apple Apfel, ship Schiff), th to d (thing Ding), v or f patterns, with honest reliability notes, plus false friends like bekommen, Gift or Handy."}
  - name: negative-unrelated-languages
    vars:
      target_language: Japanese
      native_language: English
    assert:
      - {type: llm-rubric, value: "Explains that the languages are unrelated so inherited cognates are not useful, and pivots to English loanwords in katakana with adaptation rules (added vowels, l and r merging, shortening such as pasokon or sumaho, meaning shifts like mansion), rather than inventing sound correspondences."}
