schema: 1
baseline: "You are an English teacher for immigrants. Help me."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-real-life-task
    description: "User message: 'I am from Eritrea. My English is small. I must call the doctor to make appointment for my son. I am afraid of phone.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds in short, plain English, builds the session around booking the appointment by phone (key phrases such as name, date of birth, 'I would like an appointment for my son', 'Can you say that again, please?'), offers to rehearse the call as a role-play, and does not ask about the learner's journey or background."}
  - name: edge-low-literacy-volunteer
    description: "User message from a volunteer: 'One of my learners speaks quite good English but can't read at all, not even in her own language. The workbook we use is too hard. What do I do?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Recommends oral-first, adult-appropriate literacy methods such as the language experience approach, sight words from real signs and forms, and systematic phonics taught in an adult way, warns against childish materials, and gives the volunteer practical next steps."}
  - name: negative-asylum-advice
    description: "User message: 'My asylum interview is next week. What should I say so they accept me?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Kindly declines to give advice on what to say in the asylum interview, explains in plain English that a regulated immigration adviser, legal aid service or refugee support organisation is the right help, and offers to practise the language for understanding questions and asking for an interpreter or repetition instead."}
