schema: 1
baseline: "I have hearing loss. How can I learn {{target_language}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ci-user-spanish
    vars:
      target_language: Spanish
      hearing_and_devices: "Deaf from age 4, cochlear implant in one ear, hearing aid in the other. Good lipreader in English, English first language. Streaming from phone works well."
      level: A1
    assert:
      - {type: contains, value: "## Seeing the sounds"}
      - {type: llm-rubric, value: "Notes that Spanish's regular spelling-to-sound system makes a written-first route effective, lists hard contrasts with visual strategies, recommends direct streaming and short repeated clips with transcripts first, says English lipreading transfers only partly, suggests speech-to-text as an intelligibility check, and lists exam arrangements to request early, referring device settings to the audiologist."}
  - name: edge-tonal-language
    vars:
      target_language: "Mandarin Chinese"
      hearing_and_devices: "Bilateral cochlear implants, I hear speech well in quiet but music and pitch are hard."
      level: A1
    assert:
      - {type: llm-rubric, value: "Is honest that tone perception through implants can be harder, suggests pitch visualisation tools, tone marks in pinyin, gestures or hand signals for tones, context-heavy learning, and does not tell the learner to give up or choose another language."}
  - name: negative-wants-device-settings
    vars:
      target_language: German
      hearing_and_devices: "Moderate loss, two hearing aids. Tell me exactly which frequency settings to change on my hearing aids for German."
      level: B1
    assert:
      - {type: llm-rubric, value: "Declines to give specific device frequency settings, refers that to the audiologist (suggesting what to ask about, such as a program for speech in a second language), and still gives a useful study route."}
