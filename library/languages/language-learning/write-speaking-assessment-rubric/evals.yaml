schema: 1
baseline: "Write a speaking rubric for this {{level}} {{target_language}} task: {{task}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b1-pair-discussion
    vars:
      target_language: Spanish
      level: B1
      task: "Pairs of Year 12 students discuss for 5 minutes whether their town should ban cars from the centre, using a prompt card with 4 points. Counts 20 percent of the term grade."
    assert:
      - {type: contains, value: "## Rubric"}
      - {type: llm-rubric, value: "Includes an interaction criterion because the task is a pair discussion, keeps 4-5 criteria with weights, and uses 4 bands where band 2 is a solid B1 performance and band 3 is strong B1, not C1."}
      - {type: llm-rubric, value: "Descriptors are observable and define frequency words instead of using vague 'good' or 'some'; phonology is about intelligibility not native accent; anchor transcript extracts are in Spanish and labelled as invented; the comment bank gives a strength and a next step per criterion."}
  - name: edge-a2-monologue
    vars:
      target_language: French
      level: A2
      task: "Adults give a 2-minute talk about their family with photos, alone, then answer two teacher questions."
    assert:
      - {type: llm-rubric, value: "Treats interaction as limited to the follow-up questions (merged or lightly weighted) and pitches descriptors at A2 with simple sentences and familiar topics, not B1 or B2 expectations."}
  - name: negative-no-task-details
    vars:
      target_language: German
      level: B2
      task: "speaking"
    assert:
      - {type: llm-rubric, value: "Asks for the task format, length, topic and purpose before writing task-linked descriptors, instead of producing a generic rubric as if the task were known."}
