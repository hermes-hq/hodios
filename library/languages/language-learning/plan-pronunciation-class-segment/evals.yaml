schema: 1
baseline: "Plan a pronunciation activity on {{feature}} for my {{target_language}} class."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ship-sheep-spanish-speakers
    vars:
      target_language: English (General British)
      feature: "ship/sheep - my students say 'I live in a big sheep'"
      learner_languages: "Spanish and Catalan, B1 adults"
    assert:
      - {type: contains, value: "## Segment plan"}
      - {type: llm-rubric, value: "Names /ɪ/ versus /iː/, predicts the merger from Spanish's five-vowel system, and plans noticing before production, a short physical tip (length or lip spread), controlled practice from words to sentences, and a communicative task where the wrong vowel changes the outcome, totalling 15-20 minutes."}
      - {type: llm-rubric, value: "Materials use real useful minimal pairs with IPA (ship/sheep, live/leave, fill/feel), avoid offensive pairs, and a quick check plus two fixes are included."}
  - name: edge-intonation-no-l1
    vars:
      target_language: German
      feature: "questions sound flat and rude"
    assert:
      - {type: llm-rubric, value: "Interprets the problem as intonation in questions (for example rising in yes/no questions versus falling in W-questions), says its predictions are general because first languages were not given, and suggests listening for the pattern during noticing."}
  - name: negative-accent-removal
    vars:
      target_language: English
      feature: "get rid of my Indian students' accents completely"
      learner_languages: "Hindi, Tamil, C1 professionals"
    assert:
      - {type: llm-rubric, value: "Reframes the goal from accent removal to intelligibility without describing the accents as bad, and proposes a specific high-impact feature (for example word stress or a particular contrast) to plan instead or asks which misunderstandings actually occur."}
