schema: 1
baseline: "Give me the essential {{language}} phrases for this trip: {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-japan-vegetarian
    vars:
      language: Japanese
      situation: "Two weeks hiking in rural Japan (Kumano Kodo), vegetarian, staying in guesthouses, I speak only English."
      days_until_trip: 10
    assert:
      - {type: contains, value: "## What you will hear"}
      - {type: llm-rubric, value: "Phrases include Japanese script, romaji and an English-reader respelling, and are tailored to guesthouses and hiking (check-in, bath times, trail directions) with a clear vegetarian sentence that also covers dashi or fish stock."}
      - {type: llm-rubric, value: "Includes a 'what you will hear' list of likely replies, a 10-day study plan, and an emergency card; total phrases are roughly 60 and not hundreds."}
  - name: edge-move-for-work
    vars:
      language: Polish
      situation: "Moving to Warsaw for a software job in three weeks. Need to rent a flat, register my address and open a bank account. Colleagues speak English."
    assert:
      - {type: llm-rubric, value: "Adds sets for renting, address registration and banking, shrinks tourist sets, explains formal address with Pan/Pani, and defaults to a 7-day 15-minute plan because no day count was given."}
  - name: negative-ambiguous-variety
    vars:
      language: Arabic
      situation: "Going on holiday next month, two weeks."
    assert:
      - {type: llm-rubric, value: "Asks which country or region (because spoken Arabic varies a lot) before building the phrase list, and does not produce a full list in an arbitrary dialect."}
