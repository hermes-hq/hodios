schema: 1
baseline: "Help me set up a language exchange: {{languages}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-one-pair-video
    vars:
      languages: "Brazilian Portuguese and German; I'm a German engineer in Hamburg learning Portuguese, my partner is a Brazilian master's student learning German. Weekly video calls."
      setup: one-pair
      level: B1
    assert:
      - {type: contains, value: "## Session task cards"}
      - {type: llm-rubric, value: "Sets a 50/50 split with a timer and a no-mixing rule per half, an agreement checklist, a first-session script with goal setting, and 8 B1 task cards each with a goal, task, phrases and helper tip."}
      - {type: llm-rubric, value: "Correction guidance: agree preferences, note errors and review 3-5 at the end of each half, recast only meaning-blocking errors, and admit uncertainty instead of inventing rules; includes a reflection log template and a reset script for when it fizzles."}
  - name: edge-university-programme
    vars:
      languages: "English and Japanese at a university language centre, about 60 students"
      setup: group-programme
      level: A2
    assert:
      - {type: llm-rubric, value: "Adds a sign-up form, matching rules in priority order, safety basics for first meetings, organiser check-ins at about week 2 and week 6, re-matching, and an end survey; task cards are pitched at A2."}
  - name: negative-unclear-languages
    vars:
      languages: "a language exchange"
      setup: one-pair
      level: B1
    assert:
      - {type: llm-rubric, value: "Asks which two languages are being exchanged before writing task cards, and may give the language-independent structure, without inventing the languages."}
