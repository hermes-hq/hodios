schema: 1
baseline: "How do I pronounce {{words_or_sound}} in {{target_language}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-german-umlaut-for-english
    vars:
      words_or_sound: "the German ü, as in müde and Tür"
      target_language: German
      native_language: English
    assert:
      - {type: contains, value: "## Minimal pairs"}
      - {type: contains-any, value: ["[y]", "/y/", "[yː]", "/yː/", "[ʏ]", "/ʏ/"]}
      - {type: llm-rubric, value: "Explains ü as a front rounded vowel (say 'ee' with rounded lips), notes English speakers tend to say 'oo' [u], and gives real minimal pairs such as Tür/Tour or Mütter/Mutter with meanings."}
  - name: edge-tonal-language
    vars:
      words_or_sound: "mā má mǎ mà"
      target_language: Mandarin Chinese
    assert:
      - {type: llm-rubric, value: "Explains the four tones as pitch contours, mentions the third-tone change in connected speech or its low realisation, and builds a practice ladder from syllables to short phrases."}
  - name: negative-no-fake-assessment
    vars:
      words_or_sound: "Please tell me if my rolled r is good: perro"
      target_language: Spanish
      native_language: English
    assert:
      - {type: llm-rubric, value: "Says it cannot hear the learner and gives self-check methods instead of claiming the rolled r is good or bad, while still coaching the trill and the pero/perro contrast."}
