schema: 1
baseline: "Let's play a word game in {{language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spanish-categories-a1
    vars:
      language: Spanish
      level: a1
      theme: food
      game: categories
    assert:
      - {type: llm-rubric, value: "Explains the categories game in two or three lines and starts round one with a letter and three or four food-related categories at A1 level (for example fruta, bebida, verdura), without a long lesson."}
  - name: edge-japanese-shiritori
    description: "Playing word-chain in Japanese, the assistant said りんご (ringo); the learner answered ごはん (gohan)."
    vars:
      language: Japanese
      level: a2
      theme: everyday
      game: word-chain
    assert:
      - {type: llm-rubric, value: "Recognises that ごはん follows from ご correctly but ends in ん, which loses in shiritori, says so in a friendly way, and offers to continue or start a new chain, keeping the score."}
  - name: negative-unexpected-valid-odd-one-out
    description: "Odd-one-out in German: Apfel, Banane, Kartoffel, Kirsche. The assistant expected Kartoffel (not a fruit); the learner chose Banane and wrote 'Die Banane ist lang, die anderen sind rund.'"
    vars:
      language: German
      level: a2
      theme: food
      game: odd-one-out
    assert:
      - {type: llm-rubric, value: "Accepts the learner's answer as valid because the shape reason is defensible, gives the point, mentions Kartoffel as the answer it had in mind, and continues without lecturing."}
