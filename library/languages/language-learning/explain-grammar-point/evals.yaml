schema: 1
baseline: "Explain {{grammar_point}} in {{target_language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ser-estar-for-english
    vars:
      grammar_point: ser vs estar
      target_language: Spanish
      native_language: English
      level: A2
    assert:
      - {type: contains, value: "## Compared with your language"}
      - {type: contains, value: "## Answers"}
      - {type: llm-rubric, value: "Explains that English 'to be' maps to both verbs, gives the core distinction in plain A2 language with translated examples, lists typical English-speaker errors, and includes a 6-item exercise whose answers come after it."}
  - name: edge-ambiguous-subjunctive
    vars:
      grammar_point: the subjunctive
      target_language: French
      native_language: German
      level: B1
    assert:
      - {type: llm-rubric, value: "Picks a core B1 use (for example after il faut que or expressions of wish and emotion), says which other uses were left out, and contrasts with the German Konjunktiv rather than with English."}
  - name: negative-nonexistent-point
    vars:
      grammar_point: the ablative case
      target_language: Italian
      native_language: English
      level: B1
    assert:
      - {type: llm-rubric, value: "Says that modern Italian has no ablative case and explains the closest real point instead (for example prepositions such as da or di), without inventing case endings."}
