schema: 1
baseline: "What is the difference between {{words}} in {{language}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-por-para
    vars:
      language: Spanish
      words: "por / para. I wrote 'Estudio español por trabajar en México.'"
      native_language: English
    assert:
      - {type: contains, value: "## Test yourself"}
      - {type: llm-rubric, value: "Corrects the learner's sentence to 'para trabajar' first, gives a rule of thumb (para for purpose, destination, deadline or recipient; por for cause, means, exchange, duration or route), and includes contrasting pairs where swapping the word changes the meaning (for example 'Lo hice por ti' vs 'Lo hice para ti')."}
      - {type: llm-rubric, value: "Explains that English 'for' covers both, which causes the confusion, lists fixed expressions such as 'por favor' or 'por fin' as traps, and gives 8 test items with answers and reasons."}
  - name: edge-english-since-for
    vars:
      language: English
      words: "since / for / ago"
      native_language: Portuguese
    assert:
      - {type: llm-rubric, value: "Distinguishes since (starting point), for (duration) and ago (time back from now, with past simple), and links the typical Portuguese-speaker error ('since three years', from 'há três anos' or 'desde') to the tense used with each word."}
  - name: negative-not-confusable
    vars:
      language: French
      words: "chat"
    assert:
      - {type: llm-rubric, value: "Notes that only one word was given and asks which word the learner confuses it with, instead of writing a full comparison."}
