schema: 1
baseline: "Teach me to read and write {{target_language}}. {{what_you_can_already_do}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spanish-latin-script
    vars:
      target_language: "Spanish, family from El Salvador"
      what_you_can_already_do: "I grew up in Houston. I talk to my mom and abuela in Spanish every day, understand telenovelas, but I never learned to write it. I don't know where accents go and I mix up b and v and when to use h. Words I say a lot: ahorita, pupusas, vos, ¿qué onda?, ya voy."
      new_script: "no"
    assert:
      - {type: contains, value: "## Read your own words"}
      - {type: llm-rubric, value: "Treats the learner as a fluent speaker, maps sounds to spelling using their own words (for example silent h, b and v, accent marks), treats voseo as a legitimate regional form, gives a short family-themed reading text with bold tricky spellings, five graded writing tasks with an answer key, and a five-session plan using real family material."}
  - name: edge-new-script-korean
    vars:
      target_language: Korean
      what_you_can_already_do: "Korean-Australian, speak Korean with parents and grandma, a bit childish vocab. Cannot read hangul at all. Words I use: 엄마 (I only know it as 'umma'), halmeoni, bap, saranghae, gwaenchana."
      new_script: "yes"
    assert:
      - {type: llm-rubric, value: "Introduces a first chunk of about 8-12 hangul letters chosen so the learner can write family words like eomma, halmeoni or bap, explains syllable-block building and stroke notes, and builds the reading and writing tasks on those known words rather than starting a generic beginner course."}
  - name: negative-too-vague
    vars:
      target_language: "my family language"
      what_you_can_already_do: "I speak it okay."
      new_script: "no"
    assert:
      - {type: llm-rubric, value: "Does not invent a language or a lesson; asks which language and regional variety it is and for about five everyday words the learner says at home, then stops."}
