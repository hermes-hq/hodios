schema: 1
baseline: "How do you pronounce {{target_language}} words from their spelling?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-french-for-english
    vars:
      target_language: "French (France)"
      native_language: english
    assert:
      - {type: contains, value: "## Minimal pairs"}
      - {type: llm-rubric, value: "Covers silent final consonants (with exceptions like the CaReFuL letters), nasal vowels, digraphs such as ou, eau, ai, gn, ch, c and g before e/i, final-syllable stress and liaison, each with IPA, examples and exceptions."}
      - {type: llm-rubric, value: "Minimal pairs include contrasts English speakers merge, such as tu/tout (y versus u) or vin/vent (nasal vowels), with meanings, and the read-aloud section has real words, labelled made-up words and answers in a separate block."}
  - name: edge-spanish-shallow
    vars:
      target_language: "Spanish (Latin America)"
      native_language: portuguese
    assert:
      - {type: llm-rubric, value: "Says Spanish spelling is highly regular, states seseo for Latin America, covers stress rules and the written accent, b/v, j/g, ll/y, and r/rr, and focuses minimal pairs on contrasts relevant to Portuguese speakers (for example no nasal vowels, open versus closed e and o not distinguished)."}
  - name: negative-chinese-characters
    vars:
      target_language: Mandarin Chinese
    assert:
      - {type: llm-rubric, value: "Explains that characters do not map reliably from spelling to sound, offers to teach pinyin (or zhuyin) instead, and stops rather than inventing spelling rules for characters."}
