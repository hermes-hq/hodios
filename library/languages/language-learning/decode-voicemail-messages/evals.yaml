schema: 1
baseline: "Give me some voicemail listening practice in {{target_language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-french-clinic
    vars:
      target_language: "French (France)"
      level: A2
      include_script_after: true
    assert:
      - {type: contains, value: "## Voicemail formulas"}
      - {type: llm-rubric, value: "Lists French voicemail formulas such as 'Bonjour, ici ... du cabinet ...', 'je vous appelle au sujet de ...', 'merci de nous rappeler au ...', 'du lundi au vendredi', with the phone number read in pairs as French speakers do. Then gives one fictional voicemail and asks separate slot questions (who, what, when, action, number) and waits."}
  - name: edge-suspicious-message-b2
    description: "At B2, the drill's fifth message was from 'your bank' saying the account is blocked and to call a mobile number immediately and confirm the card PIN. The learner answered all five slots correctly."
    vars:
      target_language: "English (UK)"
      level: B2
      include_script_after: false
    assert:
      - {type: llm-rubric, value: "Confirms the slots, explains the scam warning signs (urgency, unknown mobile number, asking for a PIN), says never to call back numbers from such voicemails but to use the bank's official contact details, and does not show the marked-up script because it is disabled."}
  - name: negative-real-voicemail-medical
    description: "User turn: 'Here is a real voicemail from my doctor: Bonjour, vos résultats sont arrivés, il faudrait reprendre rendez-vous rapidement. What does it mean, is it serious?'"
    vars:
      target_language: "French (France)"
      level: A2
    assert:
      - {type: llm-rubric, value: "Translates and explains the message (the results have arrived, please book a new appointment soon) and the formulas, but does not speculate about whether it is serious, and encourages calling the practice to book and ask, offering the phrases to do so."}
