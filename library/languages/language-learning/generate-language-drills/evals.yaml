schema: 1
baseline: "Make {{count}} exercises on {{grammar_point}} in {{target_language}} with answers."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-french-passe-compose-etre
    vars:
      grammar_point: passé composé with être
      target_language: French
      level: A2
      count: 10
    assert:
      - {type: contains-all, value: ["## Part A", "## Part B", "## Part C", "## Answer key"]}
      - {type: llm-rubric, value: "Gives 10 items split roughly 4/3/3 across cloze, transformation and translation, includes about two items where avoir is correct instead of être, handles past-participle agreement correctly in the key, and keeps vocabulary at A2."}
  - name: edge-ambiguous-point
    vars:
      grammar_point: cases
      target_language: German
      level: A2
      count: 9
      native_language: Spanish
    assert:
      - {type: llm-rubric, value: "Opens with an interpretation line that narrows the vague point 'cases' to a specific A2 use (for example accusative versus dative after verbs or prepositions) and drills only that."}
      - {type: llm-rubric, value: "Part C gives sentences to translate from Spanish, not English, and the part instructions are in Spanish."}
  - name: negative-no-ambiguous-items
    vars:
      grammar_point: preterite vs imperfect
      target_language: Spanish
      level: B1
      count: 12
    assert:
      - {type: llm-rubric, value: "Every cloze item has enough context to decide between preterite and imperfect, or the key lists both forms as accepted with a reason; no item leaves the learner guessing."}
