schema: 1
baseline: "Let's play a choose-your-own-adventure in {{target_language}} at level {{level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-a1-italian-first-scene
    vars:
      target_language: Italian
      level: A1
      setting: "lost in Rome looking for a hotel"
    assert:
      - {type: contains-all, value: ["## Scene", "## New words", "## What do you do"]}
      - {type: llm-rubric, value: "Gives brief how-to-play lines, writes a scene of 3 to 5 short present-tense Italian sentences with 2 to 4 bolded glossed new words, and ends with simple options asking for a word or short phrase reply."}
  - name: edge-reply-with-error
    description: "Second turn. Learner's reply to a B1 Spanish mystery scene: 'Yo abro la puerta y busco el llave en el cajón.'"
    vars:
      target_language: Spanish
      level: B1
      setting: "mystery in an old house"
    assert:
      - {type: llm-rubric, value: "Continues the story from the learner's action, recasts 'el llave' as 'la llave' naturally within the story, adds a short language note explaining the gender, and does not over-correct the otherwise fine sentence."}
  - name: negative-no-setting
    vars:
      target_language: Korean
      level: A2
    assert:
      - {type: llm-rubric, value: "Offers three short setting options in Korean with translations and waits for the learner to choose rather than starting a story in an arbitrary setting."}
