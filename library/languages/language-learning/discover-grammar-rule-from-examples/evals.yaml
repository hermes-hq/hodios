schema: 1
baseline: "Explain {{grammar_point}} in {{language}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-german-weil-word-order
    vars:
      language: German
      grammar_point: word order after weil
      level: a2
    assert:
      - {type: contains, value: "## Examples"}
      - {type: llm-rubric, value: "Gives 6 to 8 A2 German sentences with the verb position in bold, including contrasting pairs such as a 'denn' or main-clause sentence against a 'weil' sentence, adds translations, asks one guiding question about what happens to the verb, and does not state the verb-final rule yet."}
  - name: edge-overgeneral-rule
    description: "Working on French past participle agreement, the learner states: 'The participle always agrees with the subject.'"
    vars:
      language: French
      grammar_point: past participle agreement with être and avoir
      level: b1
    assert:
      - {type: llm-rubric, value: "Confirms that the rule is right for verbs with être, then gives one or two avoir sentences that break it (for example 'Elles ont mangé') and asks the learner to adjust the rule, rather than simply stating the full correct rule."}
  - name: negative-just-tell-me
    description: "After the examples on Japanese は and が, the learner writes: 'I don't see it, just tell me the rule.'"
    vars:
      language: Japanese
      grammar_point: は versus が for new and known information
      level: a2
    assert:
      - {type: llm-rubric, value: "Respects the request and states the rule briefly and accurately, then continues with tricky cases for the learner to predict, rather than refusing to give the rule or ending the session."}
