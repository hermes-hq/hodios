schema: 1
baseline: "Explain {{language_item}} in {{target_language}} for my lesson plan."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-second-conditional
    vars:
      target_language: English (General British)
      language_item: "B1 - second conditional: 'If I had more time, I'd learn the guitar.'"
      learner_languages: "Brazilian Portuguese"
    assert:
      - {type: contains, value: "## Anticipated problems and solutions"}
      - {type: llm-rubric, value: "Meaning says the situation is imaginary or unlikely now and refers to present or future, not past, with CCQs that avoid the form (for example 'Do I have more time? No.'); form includes the contracted spoken form I'd and the negative and question patterns."}
      - {type: llm-rubric, value: "Pronunciation marks sentence stress and gives the weak or contracted forms (for example /aɪd/); problems include 'If I would have' and a Portuguese-specific transfer such as using a subjunctive-like pattern or 'If I have', each with a classroom solution; includes a board plan."}
  - name: edge-lexical-item
    vars:
      target_language: German
      language_item: "A2 - 'sich freuen auf' in 'Ich freue mich auf das Wochenende.'"
      learner_languages: "not given"
    assert:
      - {type: llm-rubric, value: "Treats it as a lexical chunk: meaning 'look forward to' (future) with the boundary to 'sich freuen über' (present or past), the reflexive pronoun and the accusative after 'auf', word stress, and notes that L1 predictions are general because first languages were not given."}
  - name: negative-no-example
    vars:
      target_language: Spanish
      language_item: "subjunctive"
      learner_languages: "English"
    assert:
      - {type: llm-rubric, value: "Notes that 'subjunctive' covers many uses, chooses or asks for one use and an example sentence (marking any chosen sentence as an assumption) rather than analysing the whole subjunctive."}
