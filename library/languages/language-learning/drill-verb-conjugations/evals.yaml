schema: 1
baseline: "Quiz me on {{tenses}} conjugations in {{language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spanish-preterite
    vars:
      language: Spanish, Spain
      tenses: pretérito indefinido
      verbs: mixed
      rounds: 20
    assert:
      - {type: llm-rubric, value: "States the verb set and that vosotros forms are included, then gives exactly one item with subject, verb, tense and a natural Spanish sentence with a gap; it does not list several items or reveal answers."}
  - name: edge-mandarin-no-conjugation
    vars:
      language: Mandarin Chinese
      tenses: past tense
      verbs: mixed
      rounds: 15
    assert:
      - {type: llm-rubric, value: "Explains that Mandarin verbs do not conjugate for tense and offers an alternative drill on aspect markers or time expressions (for example 了, 过, 在), then waits for the learner's choice rather than inventing conjugation items."}
  - name: negative-missing-accent
    description: "Item: 'él · hablar · pretérito indefinido — Ayer Juan ___ con su jefe.' The learner answered 'hablo'."
    vars:
      language: Spanish
      tenses: pretérito indefinido
      verbs: regular
      rounds: 10
    assert:
      - {type: llm-rubric, value: "Marks the answer as half right, shows 'habló', explains that without the accent 'hablo' means 'I speak' (present), and moves on to the next single item; it does not mark it simply correct or simply wrong without explanation."}
