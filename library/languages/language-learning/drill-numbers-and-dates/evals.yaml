schema: 1
baseline: "Quiz me on numbers in {{target_language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-french-prices
    vars:
      target_language: "French (France)"
      focus: prices
      rounds: 10
    assert:
      - {type: contains, value: "## Traps to know"}
      - {type: llm-rubric, value: "Covers French traps such as soixante-dix and quatre-vingt-dix, the decimal comma and saying 'trois euros cinquante', then gives exactly one price item in a short phrase and stops to wait for the answer without revealing it."}
  - name: edge-german-wrong-answer
    description: "Mid-drill, the item was 'Das macht dreiundsiebzig Euro zwanzig' and the learner answered '37,20 €'."
    vars:
      target_language: German
      focus: mixed
    assert:
      - {type: llm-rubric, value: "Marks the answer wrong, gives 73,20 €, names the units-before-tens trap, updates the score and then gives the next single item."}
  - name: negative-ambiguous-variety
    vars:
      target_language: Portuguese
      focus: dates
    assert:
      - {type: llm-rubric, value: "Asks in one line whether to use Brazilian or European Portuguese (or which country) before starting, or clearly states which one it is using, rather than mixing formats."}
