schema: 1
baseline: "Help me practise spelling my name and email in {{target_language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-german-email-and-umlaut
    vars:
      target_language: "German (Germany)"
      details_to_practise: "Surname with ö, an email like first.last_86 at a webmail address, a postcode and house number 14b."
      level: A2
    assert:
      - {type: contains, value: "## Spelling kit"}
      - {type: llm-rubric, value: "The kit covers German letter-name traps (such as E, I, J, Y and the umlauts), says '@' is usually 'at' and '.' is 'Punkt', explains 'Unterstrich' and 'Bindestrich', how 14b is read, and that DIN 5009 spelling words or any clear word can be used. Then it gives exactly one drill item and waits without revealing the answer."}
  - name: edge-wrong-catch-answer
    description: "Mid-drill. The Catch it item was the clerk spelling 'Jacobsen' as 'J wie Julius, A, C, O, B, S, E, N' and the learner answered 'Gacobsen'."
    vars:
      target_language: "German (Germany)"
      level: A1
    assert:
      - {type: llm-rubric, value: "Marks the answer wrong, gives Jacobsen, names the J letter-name trap (German J is said like 'jott', not like English G or J), updates the score and gives one next item."}
  - name: negative-ambiguous-country
    vars:
      target_language: Spanish
      level: B1
    assert:
      - {type: llm-rubric, value: "Asks in one line which country the learner uses Spanish in (or clearly states which one it assumes) before giving a spelling kit, since spelling words and address formats differ, and does not mix conventions from several countries."}
