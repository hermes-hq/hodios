schema: 1
baseline: "Teach me some English phrasal verbs."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-work-meetings-b1
    vars:
      level: b1
      topic: "work meetings"
      native_language: Portuguese
    assert:
      - {type: contains, value: "## Word order"}
      - {type: llm-rubric, value: "Teaches 8 to 12 meeting-related phrasal verbs (for example set up, put off, call off, bring up, go over, follow up) grouped by particle meaning, marks separability and gives formal equivalents."}
      - {type: llm-rubric, value: "Explains the pronoun rule (put it off, not put off it), lists mistakes typical of Portuguese speakers or of learners generally, and keeps practice answers in a separate block."}
  - name: edge-c1-no-topic
    vars:
      level: c1
    assert:
      - {type: llm-rubric, value: "Chooses idiomatic, multi-meaning verbs suited to C1 (for example come across, put up with, bring about, make out) rather than basic ones like get up, and says where meaning does not follow the particle."}
  - name: negative-answer-correction
    description: "Second turn: the learner answers the practice and writes 'I will pick up you at 8' and 'We called the meeting off because the boss was ill.'"
    vars:
      level: b1
    assert:
      - {type: llm-rubric, value: "Corrects 'pick up you' to 'pick you up' with the pronoun rule, accepts the correct second sentence as correct, and does not invent errors in it."}
