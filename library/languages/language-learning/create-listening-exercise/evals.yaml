schema: 1
baseline: "Make a {{language}} listening exercise for level {{level}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b1-spanish-phone-booking
    vars:
      language: "Spanish (Spain)"
      level: B1
      topic: "booking a table by phone for a birthday dinner"
    assert:
      - {type: contains, value: "## Audio script"}
      - {type: contains, value: "## Answer key"}
      - {type: llm-rubric, value: "The dialogue sounds natural for Castilian Spanish at B1 (vosotros where natural, fillers, reactions), includes at least one detail that is changed mid-conversation (time or number of people), and the answer key quotes the supporting line for each answer."}
      - {type: llm-rubric, value: "Includes 2 gist and 4 to 6 detail questions in Spanish, a pre-listening vocabulary list, and 3 to 5 dictation sentences each labelled with what it trains."}
  - name: edge-a1-no-topic
    vars:
      language: Korean
      level: A1
    assert:
      - {type: llm-rubric, value: "Chooses and names a simple everyday situation, keeps the script short (roughly 80 to 150 words or equivalent) with very simple Korean, and writes instructions and questions in English because the level is below B1."}
  - name: negative-unclear-level
    vars:
      language: German
      level: "pretty good I think"
      topic: "at the doctor's"
    assert:
      - {type: llm-rubric, value: "Asks for a CEFR level or a short description of what the learner can do instead of guessing a level and writing the full exercise."}
