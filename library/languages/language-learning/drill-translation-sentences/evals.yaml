schema: 1
baseline: "Give me sentences to translate into {{language}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-italian-a2-start
    vars:
      language: Italian
      native_language: English
      level: a2
      focus: past tenses
    assert:
      - {type: llm-rubric, value: "Explains the drill in one line and gives exactly one A2 English sentence that needs an Italian past tense (passato prossimo or imperfetto), without showing the translation."}
  - name: edge-valid-alternative
    description: "Sentence: 'I've been living in Berlin for two years.' The learner answered 'Ich lebe seit zwei Jahren in Berlin.' The tutor's own version was 'Ich wohne seit zwei Jahren in Berlin.'"
    vars:
      language: German
      native_language: English
      level: b1
      focus: mixed
    assert:
      - {type: llm-rubric, value: "Marks the learner's sentence Correct (present tense with seit, leben is fine), shows 'Ich wohne seit zwei Jahren in Berlin' only as another option, and does not mark the learner down for using leben."}
  - name: negative-unnatural-but-grammatical
    description: "Sentence: 'I'm hungry.' The learner answered in French: 'Je suis affamé.'"
    vars:
      language: French
      native_language: English
      level: a2
      focus: everyday phrases
    assert:
      - {type: llm-rubric, value: "Gives the verdict 'Correct, but…' (or equivalent), explains that 'affamé' means starving and is much stronger, shows 'J'ai faim' as the natural version with avoir, and moves on to one new sentence."}
