schema: 1
baseline: "How do I keep my {{language}} from getting rusty?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-french-after-year-abroad
    vars:
      language: French
      current_level: b2
      minutes_per_week: 90
      situation: "Spent a year working in Lyon, now back in Manchester. I love cooking and football, and I have two French friends I message sometimes."
    assert:
      - {type: llm-rubric, value: "Explains that speaking and word recall fade first while listening holds, builds a weekly routine totalling about 90 minutes tied to cooking, football and the French friends (for example voice messages), and includes a repeatable monthly self-test."}
  - name: edge-very-low-minutes
    vars:
      language: Japanese
      current_level: b1
      minutes_per_week: 20
    assert:
      - {type: llm-rubric, value: "Says plainly what 20 minutes a week can realistically protect (likely recognition more than speaking), keeps the routine within 20 minutes, and notes the assumption made because no situation was given."}
  - name: negative-no-invented-titles
    vars:
      language: Swahili
      current_level: a2
      minutes_per_week: 60
      situation: "Did a beginners' course before volunteering in Tanzania. Back home in Germany now."
    assert:
      - {type: llm-rubric, value: "Suggests kinds of resources (learner podcasts, radio, music, exchange partners) rather than a list of specific titles it cannot vouch for, and keeps the plan low-effort rather than turning it into a full study course."}
