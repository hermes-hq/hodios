schema: 1
baseline: "Translate and explain this {{language}} passage: {{passage}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-caesar-beginner
    vars:
      language: latin
      level: beginner
      passage: "Gallia est omnis divisa in partes tres, quarum unam incolunt Belgae, aliam Aquitani, tertiam qui ipsorum lingua Celtae, nostra Galli appellantur."
    assert:
      - {type: contains, value: "## Your turn"}
      - {type: llm-rubric, value: "Identifies Caesar, De Bello Gallico 1.1, splits the sentence into numbered clauses, and for clause 1 parses every word (Gallia nom. sg. fem.; divisa est as perfect passive, or est with divisa as a predicate participle, with the choice explained; omnis; in partes tres acc. pl.) with dictionary forms."}
      - {type: llm-rubric, value: "Stops and asks the learner to translate clause 1 without giving the translation of the clause or the whole passage."}
  - name: edge-greek-men-de
    vars:
      language: ancient-greek
      level: intermediate
      passage: "οἱ μὲν Ἀθηναῖοι ἐμάχοντο, οἱ δὲ Λακεδαιμόνιοι ἔφυγον."
    assert:
      - {type: llm-rubric, value: "Explains the μέν ... δέ contrast, parses ἐμάχοντο as imperfect middle (deponent) 3rd plural of μάχομαι and ἔφυγον as aorist active 3rd plural of φεύγω, comments on the aspect contrast between imperfect and aorist, and asks for the learner's translation."}
  - name: negative-modern-greek
    vars:
      language: ancient-greek
      passage: "Καλημέρα, τι κάνεις σήμερα;"
    assert:
      - {type: llm-rubric, value: "Recognises the text as Modern Greek, not Ancient Greek, says so and stops rather than parsing it as a classical text."}
