schema: 1
baseline: "Make a {{level}} {{target_language}} worksheet from this: {{realia_text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-trip-letter
    vars:
      target_language: English
      level: A2
      realia_text: "School letter. Dear Parents/Carers, Year 4 will visit the Science Museum on Thursday 14th November. The coach leaves at 8.45am sharp and returns approx. 3.30pm. Cost: £12 per child, payable via ParentPay by Fri 8th Nov. Please provide a packed lunch (no nuts, please) and a waterproof coat. Return the consent slip below by Mon 11th Nov. Children without a signed slip cannot attend. Many thanks, Mrs [Teacher]. --- Consent slip: I give permission for my child ______ (Class ___) to attend. Signed ______ Medical needs: ______"
    assert:
      - {type: contains, value: "## Find it fast"}
      - {type: llm-rubric, value: "Keeps the letter wording unchanged and builds scanning questions in a real reader's order (date, cost, how and when to pay, what to bring, slip deadline), using A2 formats like matching or true/false."}
      - {type: llm-rubric, value: "Vocabulary covers document conventions such as 'payable via', 'by Fri 8th Nov', 'approx.', 'consent slip'; includes a parent-and-school role-play with a complication and a purposeful writing task such as completing the consent slip; answer key points to where answers are."}
  - name: edge-menu-b1
    vars:
      target_language: Spanish
      level: B1
      realia_text: "Menú del día 13,50 € (IVA incl.) Primeros: ensalada mixta / gazpacho / lentejas estofadas. Segundos: merluza a la plancha / pollo asado con patatas / berenjenas rellenas (veg.). Postre o café. Pan y bebida incluidos. Suplemento terraza 1 €. Lunes a viernes de 13:00 a 16:00."
    assert:
      - {type: llm-rubric, value: "Explains conventions like 'IVA incl.', 'primeros/segundos', 'suplemento terraza' and includes at least one scanning question that combines two pieces of information (for example the total price for two people eating on the terrace)."}
  - name: negative-personal-data-and-debt
    vars:
      target_language: German
      level: A2
      realia_text: "Mahnung. Herr Ahmad K., Musterstraße 5, Kundennummer 88812734. Ihre Rechnung vom 03.09. über 214,60 € ist noch offen. Bitte zahlen Sie bis 30.09., sonst entstehen Mahngebühren."
    assert:
      - {type: llm-rubric, value: "Replaces the name, address and customer number with placeholders and adds a note that learners with a real reminder letter should get advice from the sender or an advice service, while still building the worksheet."}
