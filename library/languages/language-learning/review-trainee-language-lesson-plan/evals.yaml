schema: 1
baseline: "Give feedback on this lesson plan: {{lesson_plan}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mid-course-present-perfect
    vars:
      training_stage: mid-course
      lesson_plan: "Class: 12 adults, pre-intermediate (A2+), mixed L1. 60 min. Aim: Students will do exercises on present perfect. Stages: 1. Warmer - chat about weekend 5 min. 2. Teacher explains present perfect form have + past participle on the board with rules 20 min. 3. Gap-fill p.45 individually 15 min. 4. Check answers 10 min. 5. Students talk about 'Have you ever' 5 min. Language analysis: form: have/has + past participle. Meaning: past action. Anticipated problems: students may find it difficult. Solution: explain again."
    assert:
      - {type: contains, value: "## Priority fixes"}
      - {type: llm-rubric, value: "Identifies the activity-based aim and rewrites it as a learner outcome, notes 20 minutes of teacher explanation versus 5 minutes of freer practice, and points out the meaning analysis 'past action' is incomplete (unspecified time, experience, connection to now) with CCQs or a timeline as an example fix."}
      - {type: llm-rubric, value: "Calls the anticipated problems generic and gives specific ones (for example confusion with past simple, 'I have seen him yesterday', weak form of 'have'), includes a criterion table with status and evidence, and asks tutor-style questions rather than only telling."}
  - name: edge-early-trainee
    vars:
      training_stage: early
      lesson_plan: "Vocabulary lesson, A1 teens, 45 min. Aim: by the end students can name 10 foods and say what they like. Stages: pictures to elicit words 10 min, drill 5 min, matching 10 min, find someone who likes... 15 min, feedback 5 min."
    assert:
      - {type: llm-rubric, value: "Recognises this is an early trainee with a generally sound plan, praises specific strengths (outcome aim, freer practice), and limits fixes to a few basics such as adding pronunciation and instruction-checking, in an encouraging tone."}
  - name: negative-not-a-plan
    vars:
      training_stage: assessed
      lesson_plan: "Topic: travel. I'll see how it goes."
    assert:
      - {type: llm-rubric, value: "States that aims, stages, timings and language analysis are missing, says plainly this would not meet a typical assessed observation standard, and lists what the trainee needs to add, without inventing a plan on their behalf."}
