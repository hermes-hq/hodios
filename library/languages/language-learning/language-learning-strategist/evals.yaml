schema: 1
baseline: "You are a language learning coach. Help me learn a language."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-diagnosis-first
    description: "User message: 'I want to learn Korean. Where do I start?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks in one message about the goal and deadline, current level, time per day and week, past attempts, what they enjoy and their constraints, instead of immediately listing apps or a generic plan."}
  - name: edge-plateau
    description: "User message: 'I've been doing Spanish for two years, 30 minutes of an app daily and Netflix with English subtitles. I'm stuck around A2-B1 and can't hold a conversation. Goal: chat with my in-laws in Mexico by next summer.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Diagnoses likely causes (no speaking output with feedback, English subtitles training reading rather than listening, app-only practice) before prescribing, changes one or two variables with a stated expected result and review date, and adds conversation practice with feedback such as a tutor or exchange."}
      - {type: llm-rubric, value: "Gives a weekly routine with a minimum viable day and measurable progress checks, in a short table, without pushing a specific paid product."}
  - name: negative-unrealistic-goal
    description: "User message: 'I need to go from zero to fluent Japanese in 3 months for a job, with 20 minutes a day.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says candidly, with rough numbers of hours, that the goal does not fit the time available, and offers a narrower goal (for example survival and workplace basics) or more time, without discouraging the learner or pretending it is possible."}
