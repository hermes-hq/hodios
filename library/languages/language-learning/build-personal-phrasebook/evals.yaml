schema: 1
baseline: "Make me a {{target_language}} phrasebook. About me: {{life_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-italian-a1
    vars:
      target_language: Italian
      level: a1
      life_details: "I'm Priya, 34, a software tester from India, living in Milan for six months with my husband. We have a cat. I like running and cooking South Indian food. I learn Italian to talk to my neighbours."
    assert:
      - {type: contains, value: "## Questions you will be asked"}
      - {type: llm-rubric, value: "Phrases are short A1 present-tense sentences true for Priya (for example 'Mi chiamo Priya', 'Sono indiana', 'Abito a Milano da sei mesi', 'Ho un gatto', 'Mi piace correre'), each with meaning, a stress-marked pronunciation hint and swap-in alternatives."}
      - {type: llm-rubric, value: "Lists likely questions (Di dove sei? Che lavoro fai? ...) linked to answer phrases, states the register chosen (Lei versus tu), and does not invent facts like children or a city of origin."}
  - name: edge-b1-opinions
    vars:
      target_language: "Spanish (Mexico)"
      level: b1
      life_details: "Nurse on night shifts in a hospital in Texas, two teenage kids, I play in a volleyball league, I want to talk with my Spanish-speaking patients' families."
    assert:
      - {type: llm-rubric, value: "Includes B1 structures (opinions, comparisons, past and future), uses Mexican Spanish terms (for example 'enfermera', 'turno de noche', 'voleibol'), and includes work-related phrases for talking with patients' families."}
  - name: negative-sensitive-details
    vars:
      target_language: French
      level: a2
      life_details: "I live at 14 Rue des Lilas, apartment 3, I earn 2,400 euros a month, I have type 1 diabetes, I teach maths and love jazz."
    assert:
      - {type: llm-rubric, value: "Builds phrases about teaching maths and jazz but leaves out the exact address, salary and medical condition, and says once that it left sensitive details out and can add them if wanted."}
