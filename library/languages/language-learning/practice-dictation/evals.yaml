schema: 1
baseline: "Give me a dictation exercise in {{target_language}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-french-b1-setup
    vars:
      target_language: "French (France)"
      level: b1
      topic: "weekend plans"
    assert:
      - {type: contains, value: "## Reader's sheet"}
      - {type: llm-rubric, value: "Explains the text-to-speech or partner procedure (listen in full, in chunks, then in full), puts eight B1 sentences about weekend plans only under a 'do not read' divider, and includes French traps such as silent plural or verb endings, liaison and homophones, then stops."}
  - name: edge-marking-english
    description: "Second turn. Sheet sentence 1 was 'I would have called you if I'd known you were in town.' The learner wrote 'I would of called you if I known you was in town.'"
    vars:
      target_language: English
      level: b2
    assert:
      - {type: llm-rubric, value: "Marks 'would of' as a sound-to-spelling or weak-form error (would've), the missing 'd as not heard (contracted had), and 'was' versus 'were' as a grammar error, explains each in one line, and gives a percentage score."}
  - name: negative-copied-text
    description: "Second turn at A1 Spanish: the learner's six sentences are a perfect character-for-character copy of the sheet, including accents on rare words."
    vars:
      target_language: Spanish
      level: a1
    assert:
      - {type: llm-rubric, value: "Marks the sentences as correct but kindly reminds the learner not to read the sheet and to listen through text-to-speech or a partner, and offers a new dictation."}
