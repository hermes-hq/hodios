schema: 1
baseline: "Explain this {{language}} text to me: {{text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spanish-news-b1
    vars:
      language: Spanish
      level: B1
      text: "El Gobierno ha aprobado este martes una subida del salario mínimo interprofesional del 4,4%, que se aplicará con carácter retroactivo desde el 1 de enero. La patronal, que no ha firmado el acuerdo, considera que la medida pone en jaque a las pequeñas empresas, mientras que los sindicatos la califican de insuficiente."
    assert:
      - {type: contains, value: "## Sentence by sentence"}
      - {type: llm-rubric, value: "Glosses 'salario mínimo interprofesional', 'con carácter retroactivo', 'la patronal', 'sindicatos' and the idiom 'poner en jaque', explains the context (Spain's minimum wage negotiations between government, employers and unions), and does not gloss basic B1 words like 'martes' or 'empresas'."}
      - {type: llm-rubric, value: "Includes a comprehension check with at least one question on the opposing positions of employers and unions, plus answers that cite sentence numbers."}
  - name: edge-song-lyrics-a2
    vars:
      language: French
      level: A2
      text: "J'suis pas d'ici, j'suis pas d'ailleurs, j'ai l'cœur qui bat à cent à l'heure. Et toi tu ris, tu fais semblant, comme si l'amour c'était du vent."
    assert:
      - {type: llm-rubric, value: "Glosses line by line, explains the spoken contractions (j'suis, l'cœur) and the dropped 'ne' as informal song style rather than errors, explains the idioms 'à cent à l'heure' and 'c'est du vent' simply for A2, and writes the comprehension questions in English because the level is below B1."}
  - name: negative-wrong-language
    vars:
      language: Italian
      level: B2
      text: "Die Bundesregierung hat am Dienstag neue Regeln für Mietverträge beschlossen."
    assert:
      - {type: llm-rubric, value: "Points out that the text is German, not Italian, and asks how to proceed instead of glossing it as Italian."}
