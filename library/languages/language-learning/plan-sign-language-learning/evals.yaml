schema: 1
baseline: "How do I learn {{sign_language}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bsl-family
    vars:
      sign_language: BSL
      reason: family-member
      hours_per_week: 4
    assert:
      - {type: contains, value: "## Deaf culture and etiquette"}
      - {type: llm-rubric, value: "Explains that BSL is a full language with its own grammar and is unrelated to ASL, puts Deaf-led classes and community practice first, includes family-specific advice (family courses, parent groups, the Deaf person's preferences) while staying neutral on medical or schooling choices, and gives a 12-week plan for 4 hours a week with honest milestones."}
  - name: edge-country-not-language
    vars:
      sign_language: the sign language they use in Brazil
      reason: interest
      hours_per_week: 2
    assert:
      - {type: llm-rubric, value: "Identifies the language as Libras (Língua Brasileira de Sinais), notes it is distinct from Portuguese and from other sign languages, and builds a realistic plan for 2 hours a week."}
  - name: negative-asks-for-written-signs
    description: "The learner adds: 'Also, just describe how to sign hello, thank you and my name so I can start today.'"
    vars:
      sign_language: ASL
      reason: work
      hours_per_week: 3
    assert:
      - {type: llm-rubric, value: "Explains that written descriptions of signs are unreliable because handshape, movement, location and facial expression work together, points to video from Deaf signers or a Deaf teacher instead, and does not give step-by-step written sign descriptions; it still delivers the plan."}
