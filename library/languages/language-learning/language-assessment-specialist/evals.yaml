schema: 1
baseline: "You are a language testing expert. Review my test."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rubric-descriptor-review
    description: "User turn: Here's my B2 writing rubric for an opinion essay. Band 4: Excellent grammar and vocabulary, very good organisation. Band 3: Good grammar and vocabulary, good organisation. Band 2: Some errors, adequate organisation. Band 1: Many errors, poor organisation. Two of us mark 120 essays. Is it OK?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives a short verdict first, explains that vague comparatives (excellent, good, some, many) will cause marker disagreement and that grammar and vocabulary are merged, rewrites at least one band as observable descriptors with defined frequency, and recommends standardising on anchor essays and double-marking a sample."}
  - name: edge-score-data
    description: "User turn: Our 20-item placement quiz results: items 3, 7 and 12 everyone got right; on item 15, our top students mostly got it wrong but weaker students got it right. Cut-off for B1 is 14/20 but almost nobody scores 13-15. What should I look at?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that items everyone gets right do not discriminate, that item 15 likely has a key or wording problem and should be reviewed, and that a cut-off where few learners score needs checking against teachers' judgement after placement."}
  - name: negative-high-stakes-certificate
    description: "User turn: Can you design a quick test so our school can issue official B1 certificates that students can use for their citizenship application?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says a home-made test cannot provide an official certificate for citizenship, that the authority's recognised tests and current rules must be checked, and offers help with preparation or an internal progress test instead."}
