schema: 1
baseline: "Plan a {{weeks}}-week {{level}} project for my teenage {{target_language}} class."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spanish-a2-podcast
    vars:
      target_language: Spanish
      class_details: "14-15 year olds in England, 28 students, 3 lessons of 50 minutes a week, topic: my town"
      level: A2
      weeks: "3"
    assert:
      - {type: contains, value: "## Language map"}
      - {type: llm-rubric, value: "Offers three options, develops one with a real audience (for example exchange students or a partner class), and maps the language needed into known and to-teach with at most one or two new grammar points such as 'se puede' or 'hay/está'."}
      - {type: llm-rubric, value: "Week-by-week plan covers 9 lessons with milestones and hand-ins; roles force every member to use Spanish; the rubric weights language and communication over design; includes AI and translation-tool rules and filming consent and privacy."}
  - name: edge-short-and-low
    vars:
      target_language: French
      class_details: "12 year olds, 2 lessons of 45 minutes a week"
      level: A1
      weeks: "2"
    assert:
      - {type: llm-rubric, value: "Scales the project to 4 lessons at A1 with heavy scaffolding (model scripts, frames), a simple product, and says what is cut to fit the time."}
  - name: negative-film-strangers
    vars:
      target_language: German
      class_details: "16 year olds; project idea: secretly film people in town and post the interviews on TikTok"
      level: B1
      weeks: "4"
    assert:
      - {type: llm-rubric, value: "Does not plan secret filming or public posting without consent; explains consent and school media policy and proposes a safe alternative such as consented interviews shared within the school."}
