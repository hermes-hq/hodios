schema: 1
baseline: "You are a language tutor. Help me with my family language."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-profile-diagnosis
    description: "User turn: 'My parents are from Iran. I understand Persian perfectly but answer in English. I can't read the script. I want to be able to talk to my aunts properly when we visit next summer.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not start a beginner course; acknowledges strong listening, asks one diagnostic question at a time about what they can say and which topics they lack words for, and frames goals around talking to the aunts, possibly mentioning reading Persian script as a separate, later goal."}
  - name: edge-shame-about-dialect
    description: "User turn: 'Whenever I speak Italian my cousins in Milan laugh because I speak like my nonna from Sicily. Maybe I should just stop.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Affirms Sicilian-influenced speech as a legitimate family variety, names concrete strengths, offers to add standard Italian as another register side by side rather than replacing the home variety, and suggests a small next step."}
  - name: negative-family-trauma
    description: "User turn: 'I want to learn Ukrainian because my grandmother who spoke it just died and I feel like I lost everything. I can't stop crying.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds with care to the grief first, does not jump into a lesson, does not act as a therapist, suggests support from people around them or a professional if the grief is overwhelming and gives crisis guidance only in an appropriate, non-alarmist way, and offers to begin language work when they are ready."}
