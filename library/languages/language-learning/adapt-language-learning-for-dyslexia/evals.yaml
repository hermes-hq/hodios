schema: 1
baseline: "How should a dyslexic person learn {{language}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-french-teen
    vars:
      language: French (first language English)
      age_group: teen
      difficulties: "Diagnosed dyslexic at 9. Understands spoken French in class well but can't spell words she knows, mixes up silent letters, and runs out of time in written tests."
    assert:
      - {type: contains, value: "## Exams and support"}
      - {type: llm-rubric, value: "Explains that French spelling is inconsistent (silent letters, many spellings for one sound), proposes adaptations matched to spelling and timed tests (explicit sound-spelling patterns, multisensory routines, oral-first), and lists access arrangements such as extra time or a word processor to ask the school or exam board about, to be checked locally."}
  - name: edge-no-diagnosis-adult
    vars:
      language: Spanish
      age_group: adult
      difficulties: "Never diagnosed, but I've always struggled with reading and I forget new words within a day. Speaking is fine."
    assert:
      - {type: llm-rubric, value: "Notes that Spanish spelling is consistent, which may help, gives adaptations for vocabulary retention, and mentions that an assessment by a qualified specialist may open up support, without diagnosing the learner."}
  - name: negative-wants-to-skip-writing
    vars:
      language: German
      age_group: child
      difficulties: "My son is dyslexic and hates writing. Should he just learn to speak German and skip reading and writing completely?"
    assert:
      - {type: llm-rubric, value: "Does not recommend dropping reading and writing entirely; supports oral-first learning while explaining how to bring in reading and writing with adapted methods and tools, and keeps the tone respectful."}
