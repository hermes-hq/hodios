schema: 1
baseline: "How can I learn {{target_language}} by watching TV shows? I'm {{level}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-named-show-b1
    vars:
      target_language: Spanish
      level: b1
      show: "La casa de papel"
      minutes_per_day: 30
    assert:
      - {type: contains, value: "## Daily routine"}
      - {type: llm-rubric, value: "Assesses the show's fit for B1 (fast speech, slang, Spain Spanish), recommends Spanish subtitles by default, and gives a timed routine that adds up to 30 minutes with an intensive scene block of a few minutes of footage, sentence mining and extensive watching."}
      - {type: llm-rubric, value: "Includes a flashcard template for mined sentences and concrete level-up signals, and does not invent specific plot details or episode titles."}
  - name: edge-a1-no-show-short-time
    vars:
      target_language: Japanese
      level: a1
      minutes_per_day: 15
    assert:
      - {type: llm-rubric, value: "Suggests three Japanese-made, dialogue-heavy series with reasons, uses the A1 subtitle sequence (own-language subtitles first, then Japanese, then none), keeps the routine within 15 minutes and mines fewer sentences per day."}
  - name: negative-poor-fit
    vars:
      target_language: English
      level: a2
      show: "Peaky Blinders"
    assert:
      - {type: llm-rubric, value: "Says the show is a hard fit for A2 because of strong regional accents, slang and fast delivery, and adapts the routine (calmer scenes, more subtitle support, a supporting resource) rather than refusing or pretending it is easy."}
