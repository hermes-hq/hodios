schema: 1
baseline: "Turn this lesson into an online lesson: {{lesson_plan}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mingle-lesson
    vars:
      class_size: "14 adults, most on laptops, two on phones"
      lesson_plan: "A2 English, 60 min. Aim: ask and answer about past weekends with past simple questions. 1. Warmer: picture on board, guess my weekend 5 min. 2. Reading: short text about Tom's weekend, true/false 10 min. 3. Grammar on board: question form did + base verb 10 min. 4. Controlled: matching questions and answers worksheet 10 min. 5. Find someone who mingle: students walk around asking 'Did you...?' 15 min. 6. Feedback and error correction 10 min."
    assert:
      - {type: contains, value: "## Tech fallback"}
      - {type: llm-rubric, value: "Converts the mingle into breakout pairs with rotation and a visible task, moves board work to a shared document or screen, adds instruction-checking questions before breakouts, and adds time for transitions while keeping the past simple question aim, cutting content if needed to fit 60 minutes."}
      - {type: llm-rubric, value: "Every whole-class stage has a way for all learners to respond (chat waterfall, poll, ordered unmuting); gives phone-friendly versions of materials and camera-off alternatives that still require output."}
  - name: edge-low-bandwidth
    vars:
      class_size: "20 teenagers, mostly phones, unstable connection, some share a room with siblings"
      lesson_plan: "B1 Spanish, 50 min, debate on school uniforms in groups of four, then a class vote."
    assert:
      - {type: llm-rubric, value: "Plans for low bandwidth (audio or chat options, materials sent in advance, minimal screen share), keeps cameras optional, and gives a fallback if breakout rooms fail."}
  - name: negative-missing-plan
    vars:
      class_size: "10"
      lesson_plan: "my usual Tuesday lesson"
    assert:
      - {type: llm-rubric, value: "Asks for the actual plan (aims, level, stages, timings, materials) instead of inventing the Tuesday lesson; may offer general principles while waiting."}
