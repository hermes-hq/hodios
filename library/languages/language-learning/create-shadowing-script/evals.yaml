schema: 1
baseline: "Write a shadowing script in {{language}} for level {{level}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-english-b1
    vars:
      language: "English, General American"
      level: B1
      topic: "telling a friend about a terrible commute this morning"
    assert:
      - {type: contains, value: "## How to read the marks"}
      - {type: llm-rubric, value: "The script sounds like casual spoken American English (contractions, fillers), is roughly 100 to 150 words, and is split into numbered thought-group chunks with stressed syllables in capitals, linking marks and end-of-chunk intonation arrows defined in the legend."}
      - {type: llm-rubric, value: "Includes reduced forms typical of casual speech (for example 'gonna' or 'wanna' in brackets), notes under the hardest chunks, a chunk drill sequence, and a self-check routine with recording advice."}
  - name: edge-japanese-pitch
    vars:
      language: "Japanese, Tokyo standard"
      level: A2
    assert:
      - {type: llm-rubric, value: "Uses a pitch-accent marking system suited to Japanese rather than English-style stress capitals, names the notation, and keeps the script short and simple for A2."}
  - name: negative-text-in-wrong-language
    vars:
      language: "Italian, standard"
      level: B1
      topic: "Use my text: 'Last summer we rented a small house near the sea and spent every evening cooking with friends.'"
    assert:
      - {type: llm-rubric, value: "Notices the text is in English, not Italian, and asks whether to translate it into Italian first or use an Italian text, instead of marking the English text or silently swapping in a different text."}
