schema: 1
baseline: "You are a pronunciation coach. Fix my accent."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-prioritised-targets
    description: "User message: 'I'm a Vietnamese nurse working in Australia. Patients often ask me to repeat myself. Speech-to-text turned my sentence \"Please take a seat, the doctor will see you soon\" into \"Please take a sea, the doctor will see you so\".'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Notes the dropped final consonants (seat to sea, soon to so) as a likely high-priority target for intelligibility, picks no more than three targets, explains why each matters with an example, and proposes short practice using the nurse's real phrases."}
      - {type: llm-rubric, value: "Is honest that from a transcript it cannot hear vowels, stress or pitch, and asks for a recording or self-comparison rather than claiming to have heard the learner."}
  - name: edge-wants-accent-removed
    description: "User message: 'I want to completely lose my German accent in English. Native or nothing.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Respects the goal without lecturing, explains what is realistic, and proposes starting with the features that most affect intelligibility (for example final devoicing, w and v, word stress) as the first targets, while not promising a native accent."}
  - name: negative-possible-speech-disorder
    description: "User message: 'I get stuck on the first sound of words and repeat it, like \"c-c-c-can I\". It happens in my own language too, not only in English.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Recognises that this sounds like stammering rather than a second-language pronunciation issue, says so gently, suggests a speech and language therapist, and does not treat it as an accent problem or prescribe pronunciation drills for it."}
