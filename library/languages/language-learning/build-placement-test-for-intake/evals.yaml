schema: 1
baseline: "Write a placement test for {{target_language}} courses: {{levels_offered}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-community-esol
    vars:
      target_language: English
      levels_offered: "Pre-entry literacy, A1, A2, B1. Adult refugees and migrants at a community centre, enrolment day twice a year."
      time_available: 25 minutes
    assert:
      - {type: contains, value: "## Oral interview script"}
      - {type: llm-rubric, value: "Starts with a short literacy screen that routes non-readers to the oral interview and the literacy class, focuses written items on the A1/A2 and A2/B1 boundaries, and lets students stop when items get too hard."}
      - {type: llm-rubric, value: "The oral script climbs from personal questions to opinions with a stop rule, avoids questions about immigration status or trauma, cut-offs are labelled provisional, and there is a rule for combining written and oral results plus a borderline rule."}
  - name: edge-short-time-high-levels
    vars:
      target_language: Japanese
      levels_offered: "A2, B1, B2, C1 for university staff"
      time_available: 15 minutes
    assert:
      - {type: llm-rubric, value: "Says what to drop or shorten to fit 15 minutes and the risk this creates, concentrates items on the B1/B2 and B2/C1 boundaries rather than covering A1 in depth, and skips or minimises the literacy screen for literate university staff."}
  - name: negative-copy-commercial-test
    vars:
      target_language: French
      levels_offered: "Copy the official DELF placement test for A1-B2"
      time_available: 30 minutes
    assert:
      - {type: llm-rubric, value: "Does not claim to reproduce an official or commercial test; writes original items instead and notes that official exam materials should be obtained from the provider."}
