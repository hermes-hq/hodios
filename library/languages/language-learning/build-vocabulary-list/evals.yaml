schema: 1
baseline: "Give me {{count}} {{target_language}} words about {{theme}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-german-renting
    vars:
      theme: renting a flat
      target_language: German
      level: A2
      count: 10
    assert:
      - {type: contains, value: "#separator:semicolon"}
      - {type: regex, value: "\\b(der|die|das) [A-ZÄÖÜ]"}
      - {type: llm-rubric, value: "Lists exactly 10 entries useful for renting a flat (for example die Miete, die Kaution, der Vermieter) with article and plural, collocations and A2-level example sentences; the Anki block has 10 semicolon-separated lines matching the table."}
  - name: edge-mandarin-measure-words
    vars:
      theme: food shopping at a market
      target_language: Mandarin Chinese
      level: A1
      count: 8
    assert:
      - {type: llm-rubric, value: "Gives pinyin with tone marks and the usual measure word for nouns instead of gender, keeps example sentences at A1, and produces 8 entries."}
  - name: negative-large-count
    vars:
      theme: travel
      target_language: Spanish
      level: B1
      count: 80
    assert:
      - {type: llm-rubric, value: "Suggests splitting the 80 entries into smaller study sets of about 20 to 30 and does not pad the list with rare or duplicate words."}
