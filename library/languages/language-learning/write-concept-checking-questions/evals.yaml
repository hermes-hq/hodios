schema: 1
baseline: "Write CCQs for these {{target_language}} items: {{language_items}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-english-grammar-and-icq
    vars:
      target_language: English
      language_items: "B1 class. 1) used to - 'I used to play football every Saturday.' 2) should have - 'You should have called me.' 3) Activity: 'Work with a partner. Student A has a map, Student B has a list of places. Don't show your paper. Ask and answer to find the places. 8 minutes.'"
    assert:
      - {type: contains, value: "## Instruction-checking questions"}
      - {type: llm-rubric, value: "For 'used to' and 'should have' writes 2-4 short yes/no or either/or CCQs that do not contain the target form, include at least one 'no' answer each (for example 'Do I play football now?' No; 'Did you call me?' No), give expected answers and what a wrong answer reveals, and adds a timeline for at least one item."}
      - {type: llm-rubric, value: "ICQs check pair work, not showing the paper, speaking and 8 minutes, with answers."}
  - name: edge-vocabulary-near-synonym
    vars:
      target_language: Spanish
      language_items: "A2: 'quedar' as in 'Quedamos a las ocho en la plaza.'"
    assert:
      - {type: llm-rubric, value: "Identifies the meaning 'arrange to meet' from the example, writes CCQs in simple Spanish that do not use 'quedar' (for example whether two people decided a time and place together), and checks the boundary with a near meaning such as 'encontrar' or 'quedarse'."}
  - name: negative-no-context
    vars:
      target_language: English
      language_items: "get"
    assert:
      - {type: llm-rubric, value: "Notes that 'get' has many meanings, writes or asks for an example sentence and marks any chosen sentence as an assumption, rather than writing CCQs that mix several meanings."}
