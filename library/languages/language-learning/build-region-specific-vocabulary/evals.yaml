schema: 1
baseline: "What words are different in {{region}} compared to standard {{target_language}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-swiss-german-food
    vars:
      target_language: "German, learned standard German from Germany"
      region: Zurich
      theme: food-and-shopping
    assert:
      - {type: contains, value: "## Word swaps"}
      - {type: llm-rubric, value: "Distinguishes Swiss Standard German (used in writing, for example Rahm for Sahne, Velo, parkieren, Znüni, grillieren) from spoken Swiss German dialect to recognise (for example Grüezi, Merci vilmal, Rüebli, Chuchichäschtli-type words), marks use versus recognise, says newcomers are usually answered in Standard German, and includes a quick check with answers."}
  - name: edge-rioplatense-meaning-clash
    vars:
      target_language: "Spanish, learned from a Spain-based course"
      region: "Buenos Aires"
      theme: all
    assert:
      - {type: llm-rubric, value: "Covers voseo and the absence of vosotros, swaps such as colectivo, subte, palta, frutilla, pileta, and flags a same-word-different-meaning item such as 'coger' being vulgar in Argentina, briefly and without dwelling."}
  - name: negative-vague-region
    vars:
      target_language: Spanish
      region: "Latin America"
      theme: daily-life
    assert:
      - {type: llm-rubric, value: "Explains that everyday vocabulary differs a lot between Latin American countries and asks which country or city before giving a list, rather than producing one list for all of Latin America."}
