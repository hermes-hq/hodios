schema: 1
baseline: "Plan a {{lesson_length}} {{target_language}} literacy lesson for these adult learners: {{group_profile}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-literacy-group
    vars:
      target_language: English
      lesson_length: 90 minutes
      group_profile: "8 women at a community centre, mostly Dari and Tigrinya speakers. 5 never went to school, 3 read Arabic script well. Spoken English about A1: can give name, children's names, say 'doctor appointment'. Want to read appointment letters from the GP and the school. Some bring babies."
    assert:
      - {type: contains, value: "## Lesson plan"}
      - {type: llm-rubric, value: "Distinguishes learners with no prior schooling from those literate in Arabic script and plans differently for each; chooses an appointment theme with at most 6 sight words (for example days, time, doctor, name) and at most 2 sound-letter points drawn from those words."}
      - {type: llm-rubric, value: "Includes oral work before reading, a language experience text the group dictates, adult materials with no childish images, a purposeful writing task such as filling an appointment card, and timings that add up to 90 minutes."}
  - name: edge-new-script-literate-learners
    vars:
      target_language: German
      lesson_length: 60 minutes
      group_profile: "6 Ukrainian and Syrian adults, all finished secondary school, read Cyrillic or Arabic fluently, Latin alphabet is new. Spoken German A1. Theme: supermarket."
    assert:
      - {type: llm-rubric, value: "Recognises these are literate learners new to the Latin script, moves faster with transfer strategies (comparing letter shapes, false-friend letters such as Cyrillic Р and Н), still keeps oral work and real supermarket materials, and fits 60 minutes."}
  - name: negative-childish-materials-request
    vars:
      target_language: English
      lesson_length: 90 minutes
      group_profile: "Adults who cannot read at all. Please use the alphabet song and pictures from my daughter's reading books."
    assert:
      - {type: llm-rubric, value: "Kindly declines children's materials and explains why adult materials matter, offers adult alternatives, and notes missing information (spoken level, first languages, needs) as assumptions or questions instead of inventing it."}
