schema: 1
baseline: "Write this message in {{target_language}}: {{purpose}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-landlord-email-a2
    description: "Second turn: the learner replied 'just draft it'."
    vars:
      purpose: "Email to my landlord, Herr Becker, in Berlin. The heating in my flat has not worked since Monday 3 November. Ask him to send a technician this week. My flat is 4B."
      target_language: German
      level: a2
    assert:
      - {type: llm-rubric, value: "Writes a short email with a subject line, uses 'Sie' and a formal greeting such as 'Sehr geehrter Herr Becker', keeps sentences simple enough for A2, and includes every given fact (heating, since Monday 3 November, technician this week, flat 4B) without inventing others."}
      - {type: llm-rubric, value: "Explains each key choice in English without heavy grammar jargon and lists likely replies (for example a proposed appointment) with a phrase to answer each."}
  - name: edge-learner-draft-b1
    description: "Second turn: the learner sends the draft 'Hola Marta, mañana no puedo venir a la reunión porque estoy enfermo, puedes decir al equipo? Gracias' for a Slack message to a colleague."
    vars:
      purpose: "Slack message to my colleague Marta saying I can't come to tomorrow's meeting because I'm sick, and asking her to tell the team."
      target_language: "Spanish (Spain)"
      level: b1
    assert:
      - {type: llm-rubric, value: "Keeps the learner's informal tone and most of their wording, fixes the problems (for example 'puedes decírselo al equipo'), shows a You wrote | Now | Why comparison, and does not turn it into a formal email."}
  - name: negative-missing-facts
    vars:
      purpose: "Complain to the airline about my lost bag."
      target_language: French
      level: b1
    assert:
      - {type: llm-rubric, value: "Asks for the missing facts (flight number, date, file or reference number, what was lost, what the learner wants) and the channel before writing, and does not invent a flight number or reference."}
