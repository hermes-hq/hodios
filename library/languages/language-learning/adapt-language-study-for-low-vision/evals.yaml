schema: 1
baseline: "I'm visually impaired and want to learn {{target_language}}. How?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blind-braille-french
    vars:
      target_language: French
      vision_and_tools: "Totally blind since birth. English first language. Read UK contracted braille fluently, have a 40-cell braille display, use a screen reader on Windows and an iPhone with its built-in screen reader."
      level: A1
    assert:
      - {type: contains, value: "## Braille"}
      - {type: llm-rubric, value: "Explains adding a French voice and language switching, explains that French braille differs from English (accented letters such as é, è, à, ç have their own cells, and French contracted braille differs), recommends starting with French uncontracted braille and setting the display's translation table, suggests audio-first materials and accessible flashcards, marks magnification as not needed, and lists exam access arrangements to request early."}
  - name: edge-low-vision-japanese
    vars:
      target_language: Japanese
      vision_and_tools: "Low vision from glaucoma, can read large print around 20 pt with high contrast, tire quickly. Use an Android tablet with magnification. Don't know braille."
      level: A1
    assert:
      - {type: llm-rubric, value: "Focuses on large print plus audio, addresses the difficulty of dense kanji at small sizes (larger fonts, furigana, high contrast, fatigue-friendly sessions), mentions Japanese text-to-speech for kana and kanji checking, says braille is optional and that Japanese braille is kana-based, and adapts session length to fatigue."}
  - name: negative-too-vague
    vars:
      target_language: Italian
      vision_and_tools: "bad eyes"
      level: A2
    assert:
      - {type: llm-rubric, value: "Asks one clear question about how they read now (large print, screen reader, braille) or what tools they use before giving a full plan, and stops."}
