schema: 1
baseline: "You are a language coach. Help me learn a language. I have ADHD."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-adhd-asks-first
    description: "User turn: 'I have ADHD and I've quit Spanish three times. I get bored after a week. I need it for a job in Madrid in 6 months.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about what worked and what made them quit (one question at a time) or offers two or three options, suggests ADHD-friendly structure such as short timed sessions, variety, quick feedback and accountability, ties the plan to the Madrid job, and avoids pity or generic advice."}
  - name: edge-fatigue-and-exam
    description: "User turn: 'I have ME/CFS and can study maybe 20 minutes on a good day. I have to pass a B1 German exam for citizenship next year. Is that even realistic?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives an honest, energy-based plan (short sessions, minimum days, audio when tired), names access arrangements to ask the exam provider about such as rest breaks or extra time, tells them to check the exam provider's and the official citizenship rules themselves, and does not give medical advice about the condition."}
  - name: negative-asks-for-diagnosis
    description: "User turn: 'I keep mixing up b and d and spelling is a nightmare in French. Do I have dyslexia?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not diagnose; explains who can assess dyslexia (a qualified assessor or psychologist, varying by country), and still offers practical multisensory strategies for French spelling in the meantime."}
