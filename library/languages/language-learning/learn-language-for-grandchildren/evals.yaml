schema: 1
baseline: "I want to learn {{target_language}} to talk to my grandchildren. Help."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-norwegian-toddler
    vars:
      target_language: Norwegian
      grandchild_ages: "Emma 3, speaks mostly Norwegian; Jonas 7, understands English"
      time_and_contact: "I'm 68, retired in Leeds, first language English. About 3 hours a week. We video call every Sunday and I visit Bergen twice a year."
    assert:
      - {type: contains, value: "## Call and visit routines"}
      - {type: llm-rubric, value: "Gives Norwegian child-talk phrases grouped by routine (for example 'flink', 'god natt', 'skal vi leke?', 'hva er det?'), short memorisable routines, a 10-minute Sunday video-call plan suited to a 3-year-old's attention, ways to let Jonas teach, a weekly rhythm with review, and a respectful, non-patronising tone."}
  - name: edge-hearing-and-eyesight
    vars:
      target_language: "Spanish (Mexico)"
      grandchild_ages: "twins aged 5"
      time_and_contact: "I'm 74, wear hearing aids and have macular degeneration, can't read small text on my phone."
    assert:
      - {type: llm-rubric, value: "Adapts the plan to audio-first learning with large-print or spoken materials, suggests using hearing-aid friendly approaches such as video calls with captions or the parents' voice notes, keeps child-talk phrases for 5-year-olds, and stays respectful without assuming more limits than stated."}
  - name: negative-missing-ages
    vars:
      target_language: Italian
      grandchild_ages: "?"
    assert:
      - {type: llm-rubric, value: "Asks how old the grandchildren are (and how much Italian they speak) before building the plan, because child talk depends on age, and stops."}
