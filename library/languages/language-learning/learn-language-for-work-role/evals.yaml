schema: 1
baseline: "Make me a {{target_language}} course for my job as {{job_role}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-care-assistant-german
    vars:
      target_language: "German (Germany)"
      job_role: "care assistant (Pflegehelferin) in a nursing home"
      level: a2
      weeks: 6
    assert:
      - {type: contains, value: "## Safety-critical language"}
      - {type: llm-rubric, value: "Builds six weekly care scenarios (for example greeting residents, meals, personal care, reporting changes or falls to the nurse, handover, talking with relatives) with can-do goals, and Week 1 has a phrase table, an A2-level dialogue, three practice tasks and a reading or writing item."}
      - {type: llm-rubric, value: "Includes safety-critical phrases (pain, falls, allergies, emergencies) and a line that the course does not replace employer training and that registration may need a specific language exam."}
  - name: edge-construction-english-short
    vars:
      target_language: "English (UK)"
      job_role: "labourer on construction sites"
      level: a1
      weeks: 3
    assert:
      - {type: llm-rubric, value: "Produces exactly three weeks, prioritises site safety and instructions from supervisors, teaches chunks rather than grammar at A1, and uses UK site terms (for example hi-vis, hard hat, toolbox talk)."}
  - name: negative-vague-role
    vars:
      target_language: Dutch
      job_role: "healthcare"
      level: b1
    assert:
      - {type: llm-rubric, value: "Asks for the exact role and workplace, who they speak with, what they read or write and what worries them, then stops instead of building a course for a guessed role."}
