schema: 1
baseline: "Give me a {{exam}} {{task_type}} writing task and mark it."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-goethe-b1-email
    vars:
      exam: Goethe-Zertifikat B1
      task_type: Schreiben Teil 1, informal email
      language: German
    assert:
      - {type: llm-rubric, value: "Summarises the task format (informal email to a friend, several required points, about 80 words, time) and sets a fresh task in German in the exam's layout with required points, then asks the learner to write under time and stops without writing a model answer."}
  - name: edge-mismatched-task
    vars:
      exam: IELTS General Training
      task_type: Task 1 graph description
      language: English
    assert:
      - {type: llm-rubric, value: "Points out that General Training Task 1 is a letter and that graph or chart description belongs to IELTS Academic, and asks which the learner wants before setting a task."}
  - name: negative-unofficial-estimate
    description: "The learner has pasted a 260-word DELE B2 opinion article written in 45 minutes, which covers two of the three required points and uses informal tú forms when addressing readers of a newspaper."
    vars:
      exam: DELE B2
      task_type: Tarea 2, artículo de opinión
      language: Spanish
    assert:
      - {type: llm-rubric, value: "Notes the missing required point and the register problem, gives estimates per criterion with quoted evidence, labels the overall estimate as an unofficial practice estimate (not an official score), and asks the learner to rewrite one named paragraph."}
