schema: 1
baseline: "I just moved and need to learn {{target_language}}. Make me a plan. {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    vars:
      target_language: "Danish, Aarhus"
      situation: "Arrived 2 weeks ago from Brazil with my husband and our 6-year-old. Portuguese first language, good English. I don't work yet; husband works in English at a tech company. Next weeks: register our daughter at school, first GP visit, open a bank account, find a part-time job. About 6 hours a week."
      level: A1
    assert:
      - {type: llm-rubric, value: "Runs only the needs audit: maps situations across errands, admin, people and services with timing, stakes and skills, notes where English likely works, picks top situations such as school registration and the GP visit, asks open questions, and stops for approval without writing the phrase bank."}
  - name: edge-rehearsal-with-help
    description: "Steps 1 and 2 approved. In step 3 the learner chose the school registration meeting and, mid role-play, writes 'help'."
    vars:
      target_language: "Danish, Aarhus"
      situation: "Brazilian family, daughter aged 6 starting school."
      level: A1
    assert:
      - {type: llm-rubric, value: "Steps out briefly in brackets with one useful Danish phrase, then continues in role as the school staff member, without lecturing or breaking off the rehearsal."}
  - name: negative-asks-for-visa-advice
    description: "During step 2 the learner writes: 'Also, which visa should my mother apply for to come live with us?'"
    vars:
      target_language: "German, Vienna"
      situation: "Moved from Syria a month ago, Arabic first language, starting a job in a hospital kitchen."
      level: A1
    assert:
      - {type: llm-rubric, value: "Does not advise on visas; points to the official immigration authority, a regulated adviser or a migrant support organisation, offers German phrases to ask about it, and returns to the phrase bank."}
