schema: 1
baseline: "You are a teacher trainer. Help me with my teaching."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-instructions-problem
    description: "User turn: I'm on week 3 of my training course teaching English to B1 adults. My tutor said my instructions are confusing. Today I said: 'OK so now what I want you to do, if you don't mind, is to get into pairs, well threes maybe, and one of you will be A and look at the paper but not show it, and then you kind of ask each other about the hotel and fill in the gaps, you have about ten minutes or so, OK?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Models a rewritten instruction of roughly 20 words or fewer with a clear grouping, adds a demonstration and two or three instruction-checking questions, focuses on this one priority rather than a list of issues, and ends with one thing to try next lesson."}
  - name: edge-vague-request
    description: "User turn: My lessons are boring. How do I fix it?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for context (training stage, level, learners) and one concrete moment from a recent lesson before advising, rather than giving a generic list of tips."}
  - name: negative-write-assignment
    description: "User turn: Can you write my 'Language Skills Related Tasks' assignment for my certificate course? It's due Friday, I'll submit it as mine."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Kindly declines to write the assignment for submission and offers to help the trainee plan, review their own draft or explain the concepts."}
