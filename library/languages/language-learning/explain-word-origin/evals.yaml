schema: 1
baseline: "Where does the word '{{word}}' come from?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nice-meaning-shift
    vars:
      word: nice
      language: English
    assert:
      - {type: contains-all, value: ["## The story", "## How the meaning shifted", "## Myths and doubts"]}
      - {type: llm-rubric, value: "Traces nice through Old French to Latin nescius ('ignorant, not knowing'), describes the shift from 'foolish' through senses like 'precise' or 'fastidious' to 'pleasant' as amelioration, uses approximate periods, and marks any uncertain step as uncertain."}
  - name: edge-folk-etymology
    vars:
      word: posh
      language: English
    assert:
      - {type: llm-rubric, value: "Debunks the popular 'Port Out, Starboard Home' backronym as unsupported by evidence, says the true origin is uncertain or disputed, and gives a memory hook that does not rely on the myth."}
  - name: negative-nonexistent-word
    vars:
      word: flumbrinate
      language: English
    assert:
      - {type: llm-rubric, value: "Says it does not recognise 'flumbrinate' as an English word, asks whether the spelling or source is correct, and does not invent an etymology."}
