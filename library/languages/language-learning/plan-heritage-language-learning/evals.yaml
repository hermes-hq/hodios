schema: 1
baseline: "I'm a heritage speaker of {{language}}. Make me a learning plan. {{current_abilities}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spanish-receptive-bilingual
    vars:
      language: "Mexican Spanish (family from Michoacán)"
      current_abilities: "I understand almost everything my parents say but I answer in English. I can read a little but slowly, and my spelling is bad. My Spanish feels like a kid's. I freeze when my aunts tease me."
      goals: "Have real conversations with my abuela about her life before she gets older, and write messages to cousins. 4 hours a week."
    assert:
      - {type: contains-all, value: ["## Your profile", "## The plan", "## Speaking without the freeze"]}
      - {type: llm-rubric, value: "Builds on strong listening and family vocabulary, targets speaking activation with low-stakes practice first, spelling and adult vocabulary for life-story conversations, treats the Michoacán family variety as legitimate, gives phrases in Spanish with translations for asking family to keep speaking Spanish, and fits 4 hours a week over 8 to 12 weeks."}
  - name: edge-ambiguous-variety-and-script
    vars:
      language: Chinese
      current_abilities: "My parents speak to me at home, I understand most things and speak a bit, can't read anything."
    assert:
      - {type: llm-rubric, value: "Asks or states an assumption about which variety (for example Mandarin, Cantonese, Hokkien) and which script (traditional or simplified) because they change the plan, asks about goals since none were given, and still provides a provisional plan."}
  - name: negative-standard-is-better
    vars:
      language: "Arabic"
      current_abilities: "I speak Moroccan Darija with my family fluently but my teacher says my Arabic is wrong and I should forget Darija."
      goals: "Read the Quran and newspapers."
    assert:
      - {type: llm-rubric, value: "Treats Darija as a legitimate variety and a strength, does not tell the learner to forget it, explains that Modern Standard Arabic (and Classical Arabic for the Quran) is an additional register to build, and plans literacy and MSA vocabulary accordingly."}
