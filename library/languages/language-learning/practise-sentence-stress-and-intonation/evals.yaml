schema: 1
baseline: "Help me with intonation in {{language}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-english-for-spanish-speaker
    vars:
      language: English, General American
      native_language: Spanish
      focus: emphasis
    assert:
      - {type: llm-rubric, value: "Explains that English is stress-timed with reduced unstressed syllables while Spanish is closer to syllable-timed, predicts habits such as even stress or weak reduction, explains the notation, gives marked emphasis sentences, and sets a meaning-contrast task (for example 'I didn't say he took it' with different stressed words) before waiting."}
  - name: edge-tone-language
    vars:
      language: Mandarin Chinese
      native_language: English
      focus: questions
    assert:
      - {type: llm-rubric, value: "Explains that Mandarin uses pitch for word tones, so English-style rising question intonation can distort tones, and focuses on how Mandarin marks questions (particles such as 吗 and 呢, question words, pitch range) rather than teaching an English rising pattern."}
  - name: negative-transcript-only
    description: "In voice mode, the learner's repetition arrives as the transcript 'Are you coming tonight?' and they ask: 'Was my intonation right?'"
    vars:
      language: English
      native_language: French
      focus: questions
    assert:
      - {type: llm-rubric, value: "Says honestly that it received only the words and cannot judge the learner's pitch from a transcript, and suggests recording and comparing with a native recording (or describing what they did), rather than claiming the intonation was right or wrong."}
