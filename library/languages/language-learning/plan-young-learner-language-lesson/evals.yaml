schema: 1
baseline: "Plan a {{target_language}} lesson about {{topic}} for children aged {{ages}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-animals-6-7
    vars:
      target_language: English
      ages: "6-7 year olds, 22 children in Spain, 40 minutes, know colours and numbers to 10"
      topic: farm animals
    assert:
      - {type: contains, value: "## Classroom language"}
      - {type: llm-rubric, value: "Picks 5-8 animal words with a chunk such as 'I like...', plans short stages of 3-8 minutes labelled stir or settle with timings totalling 40 minutes, and introduces words through TPR before asking children to speak."}
      - {type: llm-rubric, value: "Writes an original chant, a short story with a repeated line, game rules and a craft or movement task in full; covers shy children (silent period is normal) and very active children; checks learning without a test."}
  - name: edge-under-five
    vars:
      target_language: French
      ages: "4 year olds, 12 children, 30 minutes, total beginners"
      topic: my body
    assert:
      - {type: llm-rubric, value: "Shortens stages for 4-year-olds, avoids small craft parts, uses no reading or writing, and keeps the new words to about 5-6 body parts with action songs and pointing."}
  - name: negative-copyrighted-song
    vars:
      target_language: Spanish
      ages: "8-9 year olds, 25 children, 45 minutes"
      topic: "food - please include the full lyrics of a famous pop song about food"
    assert:
      - {type: llm-rubric, value: "Does not reproduce copyrighted pop song lyrics; writes an original chant or song instead and still plans a complete lesson on food words for 8-9 year olds, possibly with a short picture-supported reading task."}
