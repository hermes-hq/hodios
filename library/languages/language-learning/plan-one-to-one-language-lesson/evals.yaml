schema: 1
baseline: "Plan a {{minutes}}-minute {{target_language}} lesson for a {{student_level}} student. Goals: {{student_goals}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b1-english-engineer
    vars:
      target_language: English
      student_level: b1
      minutes: 60
      student_goals: "Brazilian software engineer, daily stand-ups in English with a US team start next month. Struggles with present perfect vs past simple and says 'I have finished it yesterday'. Likes football."
    assert:
      - {type: contains, value: "## Error correction"}
      - {type: llm-rubric, value: "Sets one can-do aim tied to stand-up updates with present perfect versus past simple as the single language point, and the stage minutes add up to 60."}
      - {type: llm-rubric, value: "Materials are written in full (a model stand-up, concept-check questions with answers, practice items with answers, a role-play of a stand-up), the communicative stage has the student talking most of the time, the error plan targets 'I have finished it yesterday', and homework is a recorded or written stand-up update for real work."}
  - name: edge-a1-30-minutes
    vars:
      target_language: Japanese
      student_level: a1
      minutes: 30
      student_goals: "Going to Japan on holiday in 6 weeks; wants to order food and ask prices."
    assert:
      - {type: llm-rubric, value: "Fits a 30-minute plan with a short warm-up, one functional point (for example ~をください and いくらですか), simple instructions at A1, and a restaurant or shop role-play; materials include kana with romaji support for an A1 learner."}
  - name: negative-vague-goals
    vars:
      target_language: Italian
      student_level: b2
      student_goals: "wants to improve"
    assert:
      - {type: llm-rubric, value: "States the aim it assumes and gives a question to ask the student at the start of the lesson, instead of presenting a guessed goal as fact; still produces a complete plan."}
