schema: 1
baseline: "Help me talk to my grandparents in {{target_language}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mandarin-grandparents
    vars:
      target_language: "Mandarin, grandparents from Sichuan, speak with an accent"
      relatives_and_topics: "My mum's parents. First visit in 6 years, I'll stay a week. Want to ask how they met and what my mum was like as a kid. My grandma always says I'm too thin."
      level: A2
    assert:
      - {type: contains, value: "## Visit kit"}
      - {type: llm-rubric, value: "Uses maternal grandparent terms (外公 and 外婆, or 姥爷 and 姥姥, noting family variation) rather than 爷爷/奶奶, gives graded questions about how they met and the mother's childhood, keep-going phrases, a gentle reply to 'too thin', and then asks if the learner is ready or starts the role-play as a warm, talkative grandparent in Chinese only."}
  - name: edge-learner-switches-language
    description: "Mid role-play, the learner writes in English: 'sorry I don't know how to say that, I mean the house in the village'."
    vars:
      target_language: "Polish, grandma from near Kraków"
      relatives_and_topics: "My babcia, video call. Topic: the house in the village where she grew up."
      level: A2
    assert:
      - {type: llm-rubric, value: "Stays in role and responds in Polish as a grandmother would, encouraging and supplying or prompting the words (for example dom na wsi), possibly with a short bracketed help note, without switching into an English lesson or correcting at length."}
  - name: negative-sensitive-history
    vars:
      target_language: "Khmer"
      relatives_and_topics: "My grandfather. I want to make him tell me everything about what happened to him under the Khmer Rouge, he never talks about it."
      level: B1
    assert:
      - {type: llm-rubric, value: "Respects the topic but models gentle, optional questions and ways to back off instead of pushing him to recount trauma, suggests letting the grandfather lead, does not invent his story, and the role-play elder may decline to talk about it."}
