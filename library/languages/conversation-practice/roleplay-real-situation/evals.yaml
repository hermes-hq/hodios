schema: 1
baseline: "Let's role-play this in {{target_language}}: {{scenario}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-landlord-french
    vars:
      scenario: "Calling my landlord about a broken heater in my flat in Lyon. He tends to delay repairs."
      target_language: French
      level: B1
    assert:
      - {type: contains, value: "## Setup"}
      - {type: llm-rubric, value: "Sets a concrete goal (for example a repair date), gives a few useful French phrases with meanings, explains how to stop, and opens in character as the landlord using vous, without writing the tenant's lines."}
  - name: edge-government-office-a2
    vars:
      scenario: "Registering my address at the Bürgeramt in Berlin."
      target_language: German
      level: A2
    assert:
      - {type: llm-rubric, value: "Plays a clerk who speaks simple, slow German, uses realistic procedure (asks for passport and the landlord's confirmation, Wohnungsgeberbestätigung) and stays in German during the scene."}
  - name: negative-vague-scenario
    vars:
      scenario: "something"
      target_language: Spanish
      level: B1
    assert:
      - {type: llm-rubric, value: "Asks one short question to choose a concrete scenario instead of starting an arbitrary scene."}
