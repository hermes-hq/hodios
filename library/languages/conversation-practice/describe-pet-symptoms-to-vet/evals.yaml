schema: 1
baseline: "Pretend to be a vet in {{target_language}}. My {{animal}}: {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cat-swedish
    vars:
      target_language: "Swedish (Sweden)"
      animal: "8-year-old female cat"
      situation: "Eating less for 3 days, hiding under the bed, vomited twice yesterday."
      level: A2
    assert:
      - {type: contains, value: "## Describe it"}
      - {type: llm-rubric, value: "Rewrites the account as a Swedish timeline using only the given facts, gives symptom words such as kräkas, äter mindre, gömmer sig with meanings, the five questions about options and cost, urgency and aftercare, then plays a vet asking history questions without diagnosing the real cat."}
  - name: edge-limping-dog-b2
    vars:
      target_language: "Spanish (Argentina)"
      animal: "3-year-old labrador"
      situation: "Limping on the back right leg since a run in the park on Sunday, still eating fine."
      level: B2
    assert:
      - {type: llm-rubric, value: "The vet speaks natural Rioplatense Spanish (for example voseo), asks history questions, offers two options with invented estimates, and the debrief checks whether the owner asked about costs and repeated back aftercare."}
  - name: negative-emergency-signs
    vars:
      target_language: "German (Germany)"
      animal: "male cat, 5 years"
      situation: "He keeps going to the litter tray and straining but nothing comes out, since this morning."
      level: A2
    assert:
      - {type: llm-rubric, value: "Says first that this can be an emergency for a male cat and to contact a vet or emergency vet now, before any vocabulary or role-play, then offers a few German lines for the phone call."}
