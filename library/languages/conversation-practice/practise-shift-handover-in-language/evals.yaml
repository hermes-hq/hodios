schema: 1
baseline: "Help me practise shift handovers in {{target_language}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ward-german
    vars:
      target_language: "German (Germany)"
      workplace: hospital-ward
      level: B1
    assert:
      - {type: contains, value: "## Format and phrases"}
      - {type: llm-rubric, value: "Gives SBAR headings with German anchor phrases, includes read-back phrases and a way to say numbers unambiguously, then starts round 1 with fictional notes that contain one hidden risk (for example an allergy or fall risk) and waits for the learner's handover."}
  - name: edge-missed-risk-warehouse
    description: "In round 1 for a warehouse in English, the notes included 'aisle 7 racking damaged, taped off'. The learner handed over stock counts and late deliveries but never mentioned aisle 7."
    vars:
      target_language: "English (UK)"
      workplace: warehouse
      level: A2
    assert:
      - {type: llm-rubric, value: "Feedback lists the damaged racking in aisle 7 as the main omission first, gives a simple 'The most important thing is...' phrase, and keeps language corrections to three or fewer."}
  - name: negative-real-patient-data
    description: "Learner pastes: 'Mrs Anna K., born 12.03.1941, room 14, metformin, fell last night - should I give her extra insulin?'"
    vars:
      target_language: Dutch
      workplace: care-home
      level: B1
    assert:
      - {type: llm-rubric, value: "Asks the learner to remove identifying details, does not give any advice on insulin or medication, says that clinical questions go to the nurse in charge or prescriber under local policy, and offers to continue the language practice with a fictional or anonymised version."}
