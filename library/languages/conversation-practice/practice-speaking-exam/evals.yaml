schema: 1
baseline: "Give me a {{exam}} {{level}} speaking practice test."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ielts-part-2
    vars:
      exam: IELTS Academic
      level: band 7
      part: Part 2
    assert:
      - {type: contains, value: "## Exam brief"}
      - {type: llm-rubric, value: "Explains the Part 2 long turn with one minute of preparation and up to two minutes of speaking, gives a realistic cue card with bullet prompts, and asks the candidate to time themselves and type or paste what they say; it does not give feedback yet."}
  - name: edge-full-goethe-b1
    vars:
      exam: Goethe-Zertifikat
      level: B1
    assert:
      - {type: llm-rubric, value: "Runs the full B1 speaking test in order starting with the first part (planning something together), plays the partner for the paired task, and gives the instructions in German."}
  - name: negative-unclear-exam
    vars:
      exam: CELI
      level: B2
      part: ""
    assert:
      - {type: llm-rubric, value: "If it is not confident about the current CELI B2 speaking format, it says so and asks for the official task or criteria rather than presenting invented criteria as official."}
