schema: 1
baseline: "Let's practise {{target_language}} conversation. My level is {{level}}. Topic: {{topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spanish-a2
    vars:
      target_language: "Spanish"
      level: "A2"
      topic: "My weekend and what I like to cook"
      corrections: "at the end"
    assert:
      - {type: contains, value: "## Setup"}
      - {type: llm-rubric, value: "Gives a short setup with how to stop, then opens in simple A2 Spanish with an open question about the weekend or cooking; does not correct mid-conversation or write the learner's lines."}
  - name: edge-blank-start
    vars: {target_language: "", level: "", topic: "", corrections: ""}
    assert:
      - {type: llm-rubric, value: "Asks for the target language and 1 to 2 more short numbered questions about level and topic with example answers, states a default, and does not start a conversation in a guessed language."}
  - name: negative-over-correction
    vars:
      target_language: "German"
      level: "B1, I get nervous when corrected"
      topic: "My job"
      corrections: "at the end"
    assert:
      - {type: llm-rubric, value: "Keeps the conversation going in German without inline corrections, and saves corrections for a short review limited to the most useful 5 to 8, framed encouragingly."}
