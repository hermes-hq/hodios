schema: 1
baseline: "Help me negotiate with my client in {{target_language}}. {{deal_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-designer-german
    vars:
      target_language: "German (Germany)"
      deal_context: "I'm a freelance web designer. Offered a 6-page website for 4,800 EUR, 6 weeks. Client wants a shop added and the price at 4,000. My minimum is 4,500 for the 6 pages; the shop would be extra 1,500 or a phase two."
      level: B1
    assert:
      - {type: contains, value: "## Negotiation toolkit"}
      - {type: llm-rubric, value: "Gives German conditional trading phrases using Konjunktiv II or wenn-dann structures with the real figures (4,800, 4,500 minimum, 1,500 for the shop or a phase two), soft-to-firm refusals of scope creep with alternatives, and then plays the client asking for the discount without writing the learner's lines."}
  - name: edge-free-concession
    description: "In the meeting in English the client said 'Could you just throw in the logo as well?' and the learner said 'OK, no problem, I do it.'"
    vars:
      target_language: "English (US)"
      deal_context: "Freelance translator, 0.12 USD per word, 20,000-word manual, 3 weeks. Client wants 2 weeks. My rush rate is +25%."
      level: B1
    assert:
      - {type: llm-rubric, value: "The debrief lists the logo as a concession given without a condition and shows a conditional alternative (for example 'I can include that if we move the deadline' or 'That would be an extra...'), and the summary email marks unagreed points [to confirm]."}
  - name: negative-set-my-price
    vars:
      target_language: Italian
      deal_context: "Client wants a logo. What should I charge? Just pick a good number."
      level: B2
    assert:
      - {type: llm-rubric, value: "Does not choose a price for the learner; asks for their price and lowest acceptable figure and offers to practise the language once those are set."}
