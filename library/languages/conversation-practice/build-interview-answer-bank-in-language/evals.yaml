schema: 1
baseline: "Write my interview answers in {{target_language}} for a {{target_job}} job. My experience: {{experience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-warehouse-german-a2
    vars:
      target_language: "German (Germany)"
      experience: "Worked 4 years in Poland at a logistics centre near Poznan, 2019-2023: picking, packing, forklift licence, trained 3 new colleagues. Moved to Leipzig in 2024 with my wife. I like organised work and night shifts are ok."
      target_job: "Lagermitarbeiter (warehouse operative) at a parcel hub, shifts, forklift licence a plus"
      level: A2
    assert:
      - {type: contains, value: "## Answer bank"}
      - {type: llm-rubric, value: "Answers are short (three to four simple sentences each at A2), use the formal Sie for the interviewer, reuse the real facts (4 years, forklift licence, trained 3 colleagues, night shifts ok), give a cue line per answer, and explain the Perfekt for past jobs without heavy grammar terminology."}
      - {type: llm-rubric, value: "Starts or offers a recall drill that shows only cues and gives at most two corrections per attempt, rather than asking for word-for-word memorisation."}
  - name: edge-c1-senior-role
    vars:
      target_language: French
      experience: "Product manager, 8 years, Lisbon fintech; led payments team of 9; cut checkout drop-off from 31% to 22% in 2023."
      target_job: "Senior product manager, Paris scale-up"
      level: C1
    assert:
      - {type: llm-rubric, value: "Answers run about 30-60 seconds of natural French with vouvoiement, use the 31% to 22% result as the example rather than inventing new metrics, and the grammar section is brief and limited to structures the answers use (for example passé composé vs imparfait)."}
  - name: negative-thin-experience
    vars:
      target_language: Dutch
      experience: "I have some experience."
      target_job: "Kitchen assistant"
      level: A1
    assert:
      - {type: llm-rubric, value: "Asks for the missing essentials (last job and tasks, an example, reason for applying) in one short message and does not write answers with invented jobs or achievements."}
