schema: 1
baseline: "Let's debate {{topic}} in {{language}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spanish-start
    vars:
      language: Spanish
      level: B2
      topic: "¿Deberían prohibirse los coches en el centro de las ciudades?"
    assert:
      - {type: llm-rubric, value: "Asks which side the learner wants to argue (or takes the opposite side once known), states a clear position with one reason in natural B2 Spanish, and invites the learner's view without correcting or reviewing yet."}
  - name: edge-review-after-debate
    description: "After a ten-turn debate in German on remote work, the learner gave reasons but never conceded a point or asked for evidence, and repeatedly wrote 'Ich denke, dass ist besser'."
    vars:
      language: German
      level: B1
      topic: "Homeoffice oder Büro?"
    assert:
      - {type: contains, value: "### Debating moves"}
      - {type: llm-rubric, value: "Corrects 'dass ist' to 'das ist' and the word order after 'dass', notes that the learner never conceded or asked for evidence, and gives B1-level phrases for those moves (for example 'Da hast du recht, aber…', 'Woher weißt du das?') plus a rewritten turn."}
  - name: negative-a1-learner
    vars:
      language: Italian
      level: A1
      topic: "Is social media bad for teenagers?"
    assert:
      - {type: llm-rubric, value: "Explains that the debate works best from B1 and offers a simpler opinion exchange, rather than launching a full debate in complex Italian."}
