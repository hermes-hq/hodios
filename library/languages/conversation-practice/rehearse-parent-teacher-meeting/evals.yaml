schema: 1
baseline: "Pretend to be my child's teacher in {{target_language}}. Topic: {{topic}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-maths-german
    vars:
      target_language: "German (Germany)"
      topic: "Elternsprechtag for my 9-year-old daughter in Grundschule; her maths is weak and I want to know how to help at home."
      level: A2
    assert:
      - {type: contains, value: "## Prepare"}
      - {type: llm-rubric, value: "Lists German school terms such as Noten (noting 1 is the best grade), Förderunterricht or Lernziel with meanings, gives three prepared questions plus a 'Was bedeutet...?' line and a next-step line, then plays the teacher with one positive point, one concern and a time limit, without writing the parent's lines."}
  - name: edge-behaviour-b2
    vars:
      target_language: "English (UK)"
      topic: "The school says my 13-year-old son is disruptive and has had several detentions; they mention a behaviour plan."
      level: B2
    assert:
      - {type: llm-rubric, value: "Teacher uses UK school jargon (detention, behaviour plan, form tutor) at natural speed; debrief checks whether a next step and contact were agreed and notes the parent can ask for the written behaviour policy and a named contact."}
  - name: negative-vague-topic
    vars:
      target_language: Swedish
      topic: "school"
      level: A2
    assert:
      - {type: llm-rubric, value: "Asks one question about the child's age and what the meeting is about before starting, instead of inventing a full scene."}
