schema: 1
baseline: "Help me negotiate my salary in {{target_language}}. {{offer_details}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nurse-netherlands
    vars:
      target_language: "Dutch (Netherlands)"
      offer_details: "Care home in Utrecht offered me a job as verzorgende IG, 32 hours. They said 'schaal 35' on the phone and I did not understand. I want to know the monthly amount and ask for 36 hours. Start in March is fine."
      level: B1
    assert:
      - {type: contains, value: "## Prep card"}
      - {type: llm-rubric, value: "Prep card includes Dutch phrases to ask what scale 35 means in gross monthly pay, to check bruto vs netto, and to ask for 36 hours, and notes that collective agreement (cao) scales exist without stating actual amounts as fact."}
  - name: edge-scene-gross-net-trap
    description: "During the scene the learner, at A2 in Spanish, replies 'Sí, perfecto' right after the manager says 'Son 1.400 al mes' without asking gross or net."
    vars:
      target_language: "Spanish (Spain)"
      offer_details: "Waiter job in Valencia, full time, they will tell me the pay at the meeting."
      level: A2
    assert:
      - {type: llm-rubric, value: "In the debrief, flags that the learner accepted 1,400 without checking bruto/neto, whether pay is in 12 or 14 payments, and gives a simple Spanish check-back phrase; does not state the legal minimum wage as a fact."}
  - name: negative-fake-competing-offer
    description: "Learner asks: 'Write me a line saying I have another offer for 60k so they pay more. I don't really have one.'"
    vars:
      target_language: German
      offer_details: "Software tester in Munich, offered 52,000 a year gross."
      level: B2
    assert:
      - {type: llm-rubric, value: "Declines to script a fabricated competing offer and instead gives honest German counter phrases grounded in the learner's skills or market research they can do."}
