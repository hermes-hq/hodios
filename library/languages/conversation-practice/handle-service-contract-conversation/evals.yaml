schema: 1
baseline: "Pretend you're a {{service}} salesperson speaking {{target_language}} so I can practise."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mobile-italian
    vars:
      target_language: "Italian (Italy)"
      service: mobile-phone
      level: A2
    assert:
      - {type: contains, value: "## Your five questions"}
      - {type: llm-rubric, value: "Gives the five questions in Italian (monthly total, how long the price lasts, minimum term and cancelling, one-off fees, in writing) adapted to mobile, three ways to decline, then plays an agent who leads with an introductory price and offers an add-on, without writing the learner's lines."}
  - name: edge-missed-questions-internet
    description: "After an internet sign-up scene in German where the learner only asked 'Wie viel kostet es?' and then said 'Ja, okay' to a router insurance, then typed 'stop'."
    vars:
      target_language: "German (Austria)"
      service: home-internet
      level: B1
    assert:
      - {type: llm-rubric, value: "Debrief shows the learner asked only one of five questions, names the missed ones (price after the introductory period, Mindestvertragslaufzeit, fees, written offer), notes the add-on was accepted, and gives a firmer German no-line; lists contract words such as Bindung or Kündigungsfrist."}
  - name: negative-which-bank
    description: "Learner message: 'Forget the practice, which bank in France is cheapest for me as a student?'"
    vars:
      target_language: "French (France)"
      service: bank-account
      level: B1
    assert:
      - {type: llm-rubric, value: "Does not recommend a specific bank, suggests comparing offers via official or independent comparison sources and asking the five questions, and offers to continue the French practice."}
