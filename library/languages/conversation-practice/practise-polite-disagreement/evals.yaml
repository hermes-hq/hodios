schema: 1
baseline: "Help me practise saying no politely in {{language}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-french-mixed-ladder
    vars:
      language: French
      level: b1
      relationship: mixed
    assert:
      - {type: contains, value: "## Directness ladder"}
      - {type: llm-rubric, value: "Gives direct, softer and most indirect French versions for disagreeing, declining and pushing back, tagged with tu or vous as appropriate, adds a brief culture note framed as a tendency, then sets up the first scene in English with the learner's goal and starts in character."}
  - name: edge-no-gets-lost
    description: "In a scene where the boss (Sie form) asks the learner to work on Saturday, the learner in German writes: 'Ja, also, vielleicht, ich weiß nicht, es ist ein bisschen schwierig, aber okay, wenn es sein muss.'"
    vars:
      language: German
      level: b1
      relationship: boss
    assert:
      - {type: llm-rubric, value: "The debrief points out that the learner ended up agreeing ('aber okay, wenn es sein muss'), so the no did not land, and offers a stronger polite refusal in Sie form with a reason and an alternative (for example 'Am Samstag kann ich leider nicht, aber ich könnte am Freitag länger bleiben')."}
  - name: negative-wrong-register-with-friend
    description: "In a scene with a friend in Spanish who wants to borrow the learner's car, the learner answered with a very formal usted refusal: 'Lamento comunicarle que no me es posible prestarle mi vehículo.'"
    vars:
      language: Spanish
      level: b2
      relationship: friend
    assert:
      - {type: llm-rubric, value: "Notes that the no landed but the register is far too formal for a friend (usted, 'lamento comunicarle'), and gives a natural tú version that stays kind and firm; it does not praise the formality as extra politeness."}
