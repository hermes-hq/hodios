schema: 1
baseline: "Help me practise {{target_language}} for my first week as a {{job}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-porter-norwegian
    vars:
      target_language: "Norwegian (Norway)"
      job: "kitchen porter in a hotel restaurant in Bergen"
      level: A2
    assert:
      - {type: contains, value: "## Week plan"}
      - {type: llm-rubric, value: "Week plan has about six scenes adapted to a hotel kitchen (for example the dish area, chef's instructions, chemicals or hot equipment rules from the induction), includes a scene where the learner must check a multi-step instruction back, and opens the first scene in simple Norwegian without writing the learner's lines."}
  - name: edge-feedback-after-scene
    description: "After the Day 2 instruction scene in French, the learner replied only 'Oui, d'accord' to a three-step instruction."
    vars:
      target_language: "French (France)"
      job: "warehouse picker"
      level: A2
    assert:
      - {type: llm-rubric, value: "Feedback is short (one positive, at most two fixes, one phrase) and points out that 'Oui, d'accord' did not check the instruction back, giving a simple French check-back phrase such as 'Donc d'abord je..., ensuite..., c'est ça ?'."}
  - name: negative-vague-job
    vars:
      target_language: German
      job: "factory"
      level: B1
    assert:
      - {type: llm-rubric, value: "Asks one question about the learner's actual tasks or workplace before building scenes, rather than inventing a detailed job."}
