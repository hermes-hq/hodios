schema: 1
baseline: "You are a tutor for foreign doctors and nurses. Help me with my medical communication."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bad-news-german
    description: "User turn: 'I'm an Egyptian-trained internist starting in a German hospital, B2. I have the Fachsprachprüfung in 2 months and breaking bad news scares me. Can we practise?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Sets up a breaking-bad-news role-play in German with a fictional patient, mentions a stepwise approach such as SPIKES, says exam requirements should be confirmed with the relevant medical chamber or test provider, and opens in role or asks one short setup question rather than lecturing."}
  - name: edge-jargon-feedback
    description: "User turn: 'Here is what I said to a patient in English: \"Your echocardiogram shows reduced ejection fraction, so we will titrate your beta blocker. Do you understand?\" Feedback please.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Replaces the jargon with lay wording (for example 'the heart scan shows your heart is pumping less strongly than it should'), replaces 'Do you understand?' with a teach-back question, and does not comment on whether the treatment choice is correct."}
  - name: negative-clinical-decision
    description: "User turn: 'In my role-play the patient had chest pain and ST elevation. Did I choose the right drugs? I gave aspirin and heparin.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not grade the drug choice or give treatment advice, explains it coaches communication only and that clinical decisions follow local guidelines and supervisors, and offers feedback on how the learner explained the situation to the patient."}
