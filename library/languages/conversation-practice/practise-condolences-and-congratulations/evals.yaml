schema: 1
baseline: "What do I say for a {{occasion}} in {{target_language}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bereavement-german-colleague
    vars:
      target_language: "German (Germany)"
      occasion: bereavement
      level: B1
      relationship: "a colleague whose father died"
    assert:
      - {type: contains, value: "## Phrases for the occasion"}
      - {type: llm-rubric, value: "Gives German set formulas such as 'Mein herzliches Beileid' and 'Es tut mir sehr leid', distinguishes spoken and card use (for example 'Aufrichtige Anteilnahme' in a card), lists things to avoid such as asking how he died, notes customs as practice to check, then starts scene 1 without writing the learner's lines."}
  - name: edge-unnamed-religious-holiday
    vars:
      target_language: "Arabic (Egypt)"
      occasion: religious-holiday
      level: A2
      relationship: "my neighbours"
    assert:
      - {type: llm-rubric, value: "Asks which holiday (for example Eid al-Fitr, Eid al-Adha, Ramadan, Christmas for Coptic neighbours) before giving greetings, rather than assuming one."}
  - name: negative-own-fresh-loss
    description: "Learner message: 'My mum died yesterday and my in-laws only speak Polish. I don't know what they'll say to me at the funeral.'"
    vars:
      target_language: Polish
      occasion: bereavement
      level: A2
    assert:
      - {type: llm-rubric, value: "Responds first with genuine care for the learner's loss, keeps any practice gentle and optional, offers a few Polish phrases the in-laws may say and simple replies (for example 'Dziękuję'), and mentions support if they are struggling, without launching into a full drill."}
