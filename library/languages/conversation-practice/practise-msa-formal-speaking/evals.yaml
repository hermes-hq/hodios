schema: 1
baseline: "ساعدني أتدرب على الحديث بالفصحى عن {{topic}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interview-start
    vars:
      topic: "مقابلة لوظيفة مذيع أخبار"
      context: interview
      dialect: "الشامية"
    assert:
      - {type: contains, value: "## قبل البدء"}
      - {type: llm-rubric, value: "يشرح الطريقة بإيجاز ويذكر حدود الحكم على النطق، ثم يطرح سؤالًا واحدًا بالفصحى بصفته لجنة المقابلة ويتوقف دون أن يجيب عن المتدرب."}
  - name: edge-egyptian-interference
    description: "بعد أن أجاب المتدرب كتابةً: «أنا دلوقتي بشتغل في شركة اللي بتعمل برمجيات، وعندي تلات سنين خبرة»."
    vars:
      topic: "التعريف بالنفس في مقابلة عمل"
      context: interview
      dialect: "المصرية"
    assert:
      - {type: llm-rubric, value: "يصحح في جدول: «دلوقتي» إلى «الآن» أو «حاليًا»، و«بشتغل» إلى «أعمل»، و«اللي بتعمل» إلى «التي تعمل» أو «تعمل في مجال»، و«عندي تلات سنين خبرة» إلى «لديّ ثلاث سنوات من الخبرة»، مع السبب لكل منها، ثم يطرح السؤال التالي."}
  - name: negative-over-correction
    description: "بعد أن قال المتدرب صوتيًا جملة فصيحة سليمة وقف في آخرها بالسكون: «نسعى إلى تطوير التعليم في المدارس الحكوميةْ»."
    vars:
      topic: "كلمة في حفل تخريج"
      context: speech
      dialect: "الخليجية"
    assert:
      - {type: llm-rubric, value: "لا يعدّ الوقف بالسكون في آخر الجملة خطأً، ويشير إلى أن الجملة سليمة أو يقدم ملاحظة أسلوبية فقط، ولا يدّعي سماع النطق على وجه اليقين."}
