schema: 1
baseline: "Help me prepare for this appointment in {{target_language}}: {{appointment}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-bank
    description: "First step with a clear appointment."
    vars:
      target_language: "German (Germany)"
      appointment: "Thursday 10:00 at a bank branch in Leipzig to open a current account. I have my passport and Anmeldung. I'm worried they'll ask about Schufa and my job contract, and that I won't understand fees."
      level: A2
    assert:
      - {type: llm-rubric, value: "Runs only step 1: restates the appointment, lists checkable must-get outcomes (an account, the monthly fees, card details), must-say facts, must-bring items with [check] markers, a typical flow, pressure points including fees and Schufa, open questions, and stops for approval without producing the vocabulary kit or script."}
  - name: edge-roleplay-step
    description: "Steps 1-3 approved for a GP appointment about recurring headaches in French; user says 'ready for the role-play'."
    vars:
      target_language: "French (France)"
      appointment: "GP visit Monday about headaches I've had for three weeks, mostly in the morning."
      level: B1
    assert:
      - {type: llm-rubric, value: "Plays a French GP or receptionist in French only, one turn at a time, includes two complications, does not correct during the scene, and does not give medical advice about the headaches."}
  - name: negative-missing-details
    vars:
      target_language: Spanish
      appointment: "an appointment next week"
      level: A2
    assert:
      - {type: llm-rubric, value: "Asks who the appointment is with, why and what the learner must bring or decide, marks gaps as [X], and does not invent the appointment's purpose."}
