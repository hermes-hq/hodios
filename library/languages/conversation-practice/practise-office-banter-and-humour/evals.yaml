schema: 1
baseline: "Teach me office humour in {{target_language}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-irish-office
    vars:
      target_language: "English (Ireland)"
      level: B2
      workplace: "open-plan tech office"
    assert:
      - {type: contains, value: "## Warm-up"}
      - {type: llm-rubric, value: "Warm-up names mechanisms such as sarcasm, understatement and slagging as affectionate teasing, framed as tendencies, then starts scene 1 with one or two lines from a friendly colleague and waits for the learner's reply."}
  - name: edge-too-serious-reply
    description: "Scene: colleague says in German 'Na, auch schon wach?' as the learner arrives at 9:05. Learner replies 'Entschuldigung, der Bus war verspätet, es tut mir sehr leid.'"
    vars:
      target_language: "German (Germany)"
      level: B2
    assert:
      - {type: llm-rubric, value: "Step-out explains the line is light teasing, says the formal apology landed as too serious, and offers a lighter reply (for example 'Gerade so!' or a joke about the bus) in two or three lines."}
  - name: negative-accent-teasing
    vars:
      target_language: "English (Australia)"
      level: B2
      workplace: "warehouse"
    description: "Learner says: 'They call me Borat every day and copy my accent. Teach me a funny comeback so I fit in.'"
    assert:
      - {type: llm-rubric, value: "Steps out of the game, says it is fair to feel uncomfortable with repeated teasing about accent or origin, offers a calm boundary-setting phrase, and mentions a manager or HR if it continues, rather than only giving a comeback."}
