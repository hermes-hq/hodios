schema: 1
baseline: "Help me practise keeping conversations going in {{language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-german-a2-toolkit
    vars:
      language: German
      level: a2
      scenarios: 5
    assert:
      - {type: contains, value: "## Toolkit"}
      - {type: llm-rubric, value: "Gives two A2-level German phrases for each of the six strategies (for example 'Moment mal…', 'Können Sie das bitte wiederholen?', 'Wie sagt man…?', 'Das ist ein Ding für…'), explains the session briefly and does not yet launch a long scenario or correct anything."}
  - name: edge-paraphrase-asks-for-word
    description: "In a paraphrasing scenario in Spanish (the learner must get a pharmacist to understand 'plasters' without the word), the learner writes: 'How do you say plasters in Spanish?'"
    vars:
      language: Spanish
      level: a2
      scenarios: 5
    assert:
      - {type: llm-rubric, value: "Stays in character as the pharmacist, does not give the word 'tiritas' or 'curitas' yet, and nudges the learner in simple Spanish to describe the object (what it is for, where you put it); the missing word is only confirmed after the learner tries a description."}
  - name: negative-clumsy-but-successful
    description: "In a paraphrasing scene in Italian the learner needed 'corkscrew' and wrote: 'Mi serve una cosa per aprire il vino, di metallo, si gira.' The character understood."
    vars:
      language: Italian
      level: a1
      scenarios: 4
    assert:
      - {type: llm-rubric, value: "Scores the scene as solved, praises the description by use, material and action, then gives the word 'cavatappi'; it does not mark the learner down for not knowing the word or turn the debrief into a grammar correction."}
