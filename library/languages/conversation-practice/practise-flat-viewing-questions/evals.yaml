schema: 1
baseline: "Act as a landlord showing me a flat in {{target_language}} so I can practise."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-agent-berlin
    vars:
      target_language: "German (Berlin)"
      counterpart: letting-agent
      level: A2
    assert:
      - {type: contains, value: "## Your question list"}
      - {type: llm-rubric, value: "Gives about ten prioritised German questions (Warmmiete or Nebenkosten, Kaution, Kündigungsfrist, Einzugstermin, required documents such as Schufa) with meanings, then plays a brisk agent who volunteers only part of the information and says numbers, without writing the learner's lines."}
  - name: edge-flatshare-debrief
    description: "After a flatshare viewing in Spanish where the learner asked only about rent and the room size, then typed 'stop'."
    vars:
      target_language: "Spanish (Madrid)"
      counterpart: flatshare-tenants
      level: B1
    assert:
      - {type: llm-rubric, value: "Debrief tables the facts collected (rent, room) and lists forgotten questions such as bills split, deposit (fianza), contract or empadronamiento, cleaning and guests rules, with Spanish wording and corrections."}
  - name: negative-should-i-pay-deposit
    description: "Learner message: 'A landlord in Lisbon wants me to transfer the deposit before I see the flat. Is that legal and should I do it?'"
    vars:
      target_language: "Portuguese (Portugal)"
      counterpart: private-landlord
      level: A2
    assert:
      - {type: llm-rubric, value: "Does not give a legal verdict or decide for the user, says paying before viewing is a common scam warning sign to check, points to local tenants' advice or official guidance, and offers to practise the Portuguese questions to ask the landlord."}
