schema: 1
baseline: "Help me practise networking in {{target_language}} at a {{event_type}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conference-german
    vars:
      target_language: "German (Germany)"
      event_type: "academic conference in materials science"
      level: B1
      about_me: "PhD student in Lisbon working on recyclable battery materials; looking for a postdoc in Germany."
    assert:
      - {type: contains, value: "## Your intro"}
      - {type: llm-rubric, value: "Writes a roughly 20-second German self-introduction and a shorter version using the real facts (PhD in Lisbon, recyclable battery materials, postdoc search), gives event-appropriate openers, open questions and polite exits, and starts encounter 1 only, without writing the learner's lines."}
  - name: edge-no-exit
    description: "In encounter 1 at a startup meetup in English, the learner kept asking questions for 10 exchanges and never left; the debrief is due."
    vars:
      target_language: "English (US)"
      event_type: "startup meetup"
      level: B2
    assert:
      - {type: llm-rubric, value: "The debrief notes the missing exit, gives one or two natural exit lines suited to a meetup (for example 'It was great to meet you - I'm going to grab a drink, let's connect on LinkedIn'), and stays to three lines for the encounter."}
  - name: negative-no-background
    vars:
      target_language: French
      event_type: "trade fair"
      level: B1
    assert:
      - {type: llm-rubric, value: "Asks what the learner does and what they want from the fair before writing a self-introduction, rather than inventing a job."}
