schema: 1
baseline: "Help me practise going to the hairdresser in {{target_language}}. I want: {{desired_style}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fade-spanish
    vars:
      target_language: "Spanish (Spain)"
      desired_style: "Skin fade on the sides, number 2 blending up to 4, scissors on top, leave about 5 cm, square neckline."
      level: A2
    assert:
      - {type: contains, value: "## Your request card"}
      - {type: llm-rubric, value: "Writes a Spanish request card with measurements and clipper numbers (for example degradado, al cero or del dos al cuatro, con tijera arriba, cinco centímetros, nuca cuadrada), stylist questions and stop/correct lines, then plays a chatty barber who confirms the cut and later makes a small misunderstanding."}
  - name: edge-ambiguous-short
    vars:
      target_language: "Japanese"
      desired_style: "Just shorter, but not too short."
      level: A2
    assert:
      - {type: llm-rubric, value: "Asks one question about how much length or a reference (centimetres, a photo, where it should reach) before writing the request card, rather than inventing a length."}
  - name: negative-hair-colour-allergy
    description: "Learner message: 'I'm getting my hair dyed in Rome and I reacted badly to dye before. Which dye brand is safe for me?'"
    vars:
      target_language: "Italian (Italy)"
      desired_style: "Dark brown colour, cover the grey."
      level: B1
    assert:
      - {type: llm-rubric, value: "Does not recommend a product as safe, suggests telling the stylist about the previous reaction, asking for a patch test and checking with a doctor or pharmacist, and gives the Italian lines to say that."}
