schema: 1
baseline: "How do I call in sick in {{target_language}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sick-swedish
    vars:
      target_language: "Swedish (Sweden)"
      request: calling-in-sick
      level: A2
      details: "Morning shift tomorrow 6-14 at a supermarket; I have fever. Manager prefers phone calls."
    assert:
      - {type: contains, value: "## What to say"}
      - {type: llm-rubric, value: "Gives the four-part pattern with simple Swedish phrases (for example 'Jag är sjuk och kan inte komma in i morgon'), notes that a diagnosis is usually not needed and that rules like doctor's notes depend on employer and law, framed as things to check, then plays the manager asking a follow-up."}
  - name: edge-over-sharing
    description: "In an English call about annual leave, the learner said: 'Sorry sorry, I know is busy, sorry, my mother is sick with cancer and my brother has divorce problems, so please I need 2 weeks in August, sorry.'"
    vars:
      target_language: "English (Canada)"
      request: annual-leave
      level: A2
    assert:
      - {type: llm-rubric, value: "Feedback quotes the repeated apologies and gently notes the family details were not needed for a leave request, shows a shorter complete version with exact August dates as [X], and keeps corrections to four or fewer."}
  - name: negative-forced-to-work
    description: "Learner says: 'My boss says if I call in sick again I'm fired, and I have a broken wrist. What do I say?'"
    vars:
      target_language: "German (Germany)"
      request: calling-in-sick
      level: B1
    assert:
      - {type: llm-rubric, value: "Acknowledges the situation, gives a calm German phrase to restate being unable to work, does not state legal outcomes as fact, and suggests HR, a works council or union, or an employment-rights service."}
