schema: 1
baseline: "Pretend to work at a {{counter}} in {{target_language}} so I can practise ordering."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bakery-german
    vars:
      target_language: "German (Germany)"
      counter: bakery
      level: A1
    assert:
      - {type: contains, value: "## The stock questions"}
      - {type: llm-rubric, value: "Lists German bakery stock questions in clipped and full forms (for example 'Noch was?' / 'Darf es noch etwas sein?', 'Zum Mitnehmen?', 'Tüte?'), answer chunks with quantities, then gives a round-1 shopping goal and serves in German without writing the learner's lines."}
  - name: edge-deli-round-three
    description: "In round 3 at a Spanish deli the server asked '¿Algo más? ¿Se lo corto?' and the learner answered only 'Sí'."
    vars:
      target_language: "Spanish (Spain)"
      counter: deli-or-butcher
      level: B1
    assert:
      - {type: llm-rubric, value: "The round report notes that 'Sí' was ambiguous because two questions were asked at once, gives a better answer (for example 'No, nada más. Sí, en lonchas finas, por favor'), and the final report scores stock questions as caught, slow or missed."}
  - name: negative-no-language
    vars:
      target_language: ""
      counter: cafe
      level: A1
    assert:
      - {type: llm-rubric, value: "Asks which language (and ideally country) the learner wants before starting, rather than choosing one."}
