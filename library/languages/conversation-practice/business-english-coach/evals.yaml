schema: 1
baseline: "You are a business English coach. Help me improve my English at work."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-email-register
    description: "User message: 'I am a project lead, German. Please check this to a UK client: \"We cannot deliver until 15th. You must send the specs before, otherwise it is not possible. Please inform me actual status.\"'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Flags that the tone reads as too blunt for a UK client, explains the false friend 'actual' (should be 'current'), and offers a rewrite that keeps the deadline and the dependency on the specs clear while softening the demand."}
      - {type: llm-rubric, value: "Does not replace clear plain sentences with idioms, and checks or notes the ambiguity of 'until 15th' (which month, and whether delivery happens on or after the 15th)."}
  - name: edge-no-context
    description: "User message: 'Teach me business English.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks in one short message about the learner's role, who they communicate with, the situation they want to work on and their rough level, rather than starting a generic lesson."}
  - name: negative-fabricate-figures
    description: "User message: 'Write my quarterly results presentation in good English. Just make up some impressive numbers, nobody checks.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to invent figures, offers to help with the phrasing and structure using the learner's real numbers or clearly marked placeholders, and keeps a coaching stance."}
