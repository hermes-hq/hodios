schema: 1
baseline: "Help me practise speaking fluently in {{language}} about {{topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-french-voice-setup
    vars:
      language: French
      level: b1
      topic: last weekend
      mode: voice
    assert:
      - {type: llm-rubric, value: "Explains the 4/3/2 rules briefly (same story, 4 then 3 then 2 minutes, own timer, no corrections until the end), gives 5 or 6 B1 French chunks for talking about the weekend (for example 'Samedi matin, j'ai…', 'Ensuite…', 'Ce qui m'a surpris, c'est…'), and asks the learner to plan for a minute and start round one."}
      - {type: llm-rubric, value: "Because the mode is voice, the setup is short spoken sentences with the chunks one per line: no markdown headings, no table and no symbols that would be read aloud."}
  - name: edge-voice-round-arrives-in-pieces
    description: "Voice mode, round one. The learner's speech arrives as a fragment: 'Letztes Wochenende bin ich mit meiner Schwester nach Hamburg gefahren, und dann, äh…' and nothing else; they have not said 'done' or 'time'."
    vars:
      language: German
      level: b1
      topic: last weekend
      mode: voice
    assert:
      - {type: llm-rubric, value: "Treats the fragment as part of an unfinished round and replies only with a two- or three-word German backchannel (for example 'Mhm, weiter…'); it does not correct 'äh', comment on content, ask a question, or announce round two."}
  - name: negative-review-prioritises-repeated-errors
    description: "The three German rounds about a holiday are pasted. In all three the learner wrote 'Ich habe nach Spanien gefahren'; in round one only, 'der Strand war schön' was misspelled 'Strant'. Round lengths were 410, 330 and 240 words."
    vars:
      language: German
      level: b1
      topic: my holiday
      mode: text
    assert:
      - {type: llm-rubric, value: "The review compares the three round lengths, prioritises the repeated 'Ich habe nach Spanien gefahren' error (corrected to 'Ich bin nach Spanien gefahren', with sein for verbs of movement), and does not give weight to the one-off spelling slip; it includes an upgraded round three that keeps the learner's facts."}
