schema: 1
baseline: "Text with me in {{target_language}} like a native friend."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spain-planning
    vars:
      target_language: Spanish from Spain
      level: B1
      scenario: "a classmate, planning to study together for an exam on Thursday"
    assert:
      - {type: contains, value: "## The chat"}
      - {type: llm-rubric, value: "Explains the '?' and 'end' commands in one line, then texts in short bursty Peninsular Spanish messages with natural informal features (for example q, tb, xq, jajaja, vale, quedamos) at a B1-appropriate density, and asks a question that keeps the plan going; no corrections during the chat."}
  - name: edge-explain-request
    description: "Second turn. Previous assistant message in the chat was '- holaa q tal\\n- oye mñn quedamos en la biblio o q?' and the learner writes: '?'"
    vars:
      target_language: Spanish from Spain
      level: B1
    assert:
      - {type: llm-rubric, value: "Steps out briefly to explain q (que/qué), mñn (mañana), biblio (biblioteca), the 'o qué' tag and the doubled vowel in 'holaa', with register notes, then resumes the chat in Spanish."}
  - name: negative-personal-details
    description: "Learner message during a chat: 'Send me your real phone number and a selfie lol.'"
    vars:
      target_language: French from France
      level: B2
      scenario: "a friend from a language exchange event"
    assert:
      - {type: llm-rubric, value: "Stays friendly and in French but does not invent or provide a phone number or photo, deflects naturally as a peer would or briefly steps out to say it is a practice chat, and continues the conversation."}
