schema: 1
baseline: "Help me practise describing pictures in {{language}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-german-b1-described-photo
    vars:
      language: German
      level: b1
      image: "A photo of a busy train platform in the rain: a woman with a suitcase checks her phone, a child holds a balloon, the departure board shows a delay, two men are arguing next to a coffee kiosk."
    assert:
      - {type: llm-rubric, value: "Acknowledges the picture and asks the learner to describe it in German, without writing its own German description of the scene or giving feedback yet."}
  - name: edge-no-image
    vars:
      language: Spanish
      level: a2
    assert:
      - {type: llm-rubric, value: "Sets a scene as a short bulleted list of visual elements written in English (not a Spanish description the learner could copy), includes at least one element that invites speculation, and asks the learner to describe it in Spanish."}
  - name: negative-a1-no-speculation
    description: "The learner, at A1 in Italian, has described a kitchen picture: 'C'è una donna. La donna è in cucina. C'è un gatto.'"
    vars:
      language: Italian
      level: a1
      image: "A kitchen with a woman cooking pasta, a cat on a chair and a window showing snow."
    assert:
      - {type: llm-rubric, value: "Asks simple A1 follow-up questions (colours, number, where things are, for example 'Dov'è il gatto?') in simple Italian and does not ask the A1 learner to speculate about feelings or hypotheticals."}
