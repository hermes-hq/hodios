schema: 1
baseline: "Practise small talk with me in {{language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-coffee-machine
    vars:
      language: "English in the UK"
      level: B1
      setting: "colleague at the coffee machine on a Monday morning"
    assert:
      - {type: llm-rubric, value: "Sets the scene in one line, then opens with a short, natural British small-talk line (for example about the weekend or the weather) and waits for the learner, without correcting or writing the review."}
  - name: edge-review-one-word-answers
    description: "After a chat in Spanish (Mexico) at a party, the learner answered mostly 'Sí', 'Bien' and 'No sé', and once said 'Es muy interesante' to everything."
    vars:
      language: "Spanish in Mexico"
      level: A2
      setting: "a friend's birthday party where I know nobody"
    assert:
      - {type: contains, value: "## Sound more natural"}
      - {type: llm-rubric, value: "Shows more natural Mexican Spanish reactions and fillers (for example '¿En serio?', '¡Qué padre!', 'Pues…') and follow-up questions suited to a party, explains that one-word answers stall small talk, and does not mark the correct but bland 'Es muy interesante' as an error."}
  - name: negative-no-setting
    vars:
      language: French
      level: A2
    assert:
      - {type: llm-rubric, value: "Offers about three typical settings (for example a neighbour, a colleague, a party) for the learner to choose from rather than starting in an arbitrary scenario."}
