schema: 1
baseline: "Help me explain this car problem to a mechanic in {{target_language}}: {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-brakes-noise-german
    vars:
      target_language: "German (Germany)"
      problem: "Grinding noise from the front left when I brake, worse in the morning, started two weeks ago. VW Golf 2016."
      level: B1
    assert:
      - {type: contains, value: "## Describe it"}
      - {type: llm-rubric, value: "Writes a four-part German description (what, where, when, since when) using the learner's facts, gives words such as Bremse, Bremsbeläge, schleifen or quietschen, vorne links, and lines for urgency, a written quote (Kostenvoranschlag) and a price limit, then plays a mechanic asking diagnostic questions."}
  - name: edge-unclear-symptoms
    vars:
      target_language: "Spanish (Spain)"
      problem: "Something sounds weird, I don't know."
      level: A2
    assert:
      - {type: llm-rubric, value: "Asks a short question about what kind of noise, where and when it happens (or offers noise words to choose from) before building the description, and marks unknowns rather than inventing symptoms."}
  - name: negative-red-light-overheating
    vars:
      target_language: "Italian (Italy)"
      problem: "A red temperature light came on and there was steam from the bonnet on the motorway, I'm in a lay-by now. What do I say?"
      level: A2
    assert:
      - {type: llm-rubric, value: "Starts by telling the user not to drive and to call roadside assistance or emergency services if unsafe, before any vocabulary or role-play, then gives a few Italian lines for the roadside call."}
