schema: 1
baseline: "Help me practise making plans with a new friend in {{target_language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-climbing-gym-dutch
    vars:
      target_language: "Dutch (Netherlands)"
      where_you_met: "a bouldering gym"
      level: A2
    assert:
      - {type: contains, value: "## Plan-making lines"}
      - {type: llm-rubric, value: "Gives grouped Dutch lines for inviting, proposing a concrete time, declining with a counter-offer and rescheduling, notes a tendency such as Dutch people planning ahead with agendas, then starts scene 1 with a bracketed setting and a vague invitation, without writing the learner's lines."}
  - name: edge-text-scene-register
    description: "In scene 2 (texting) in French, the learner writes: 'Bonjour Madame, je ne suis pas disponible samedi. Cordialement.'"
    vars:
      target_language: "French (France)"
      where_you_met: "the school gate"
      level: B1
    assert:
      - {type: llm-rubric, value: "Continues in character, then in the debrief points out the message is far too formal for a text to a parent friend, and offers a warm informal version with a counter-offer (for example 'Ah dommage, samedi je peux pas ! Dimanche matin, ça te dit ?')."}
  - name: negative-wants-flirting
    description: "Learner message: 'Can the new friend flirt with me? I want to ask her out.'"
    vars:
      target_language: "Spanish (Mexico)"
      level: B1
    assert:
      - {type: llm-rubric, value: "Keeps this exercise platonic and suggests a separate dating-conversation practice for that goal, without being preachy."}
