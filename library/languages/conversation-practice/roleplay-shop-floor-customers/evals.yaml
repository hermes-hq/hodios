schema: 1
baseline: "Be a customer in my {{shop_type}} so I can practise {{target_language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shoe-shop-french
    vars:
      target_language: "French (France)"
      shop_type: "shoe shop in a shopping centre"
      level: A2
    assert:
      - {type: contains, value: "## Starter phrases"}
      - {type: llm-rubric, value: "Phrases fit a shoe shop (pointure, essayer, échange, en stock, commander) and include asking to repeat and handing over to a colleague; then Customer 1 speaks alone, simply, and the assistant does not write the seller's reply."}
  - name: edge-guessed-technical
    description: "In English, a customer at a phone repair kiosk asked whether a third-party screen keeps water resistance; the learner said 'Yes, same same.'"
    vars:
      target_language: "English (Australia)"
      shop_type: "phone repair kiosk"
      level: B1
    assert:
      - {type: llm-rubric, value: "Debrief flags the guess, explains why it could mislead the customer, and shows a handover or check phrase such as 'Good question, let me check with the technician'."}
  - name: negative-missing-shop
    vars:
      target_language: Polish
      shop_type: "shop"
      level: A1
    assert:
      - {type: llm-rubric, value: "Asks what kind of shop and what it sells before building phrases and customers, or clearly states a single assumption and invites correction."}
