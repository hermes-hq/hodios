schema: 1
baseline: "Help me practise telling stories in {{target_language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spanish-setup-b1
    vars:
      target_language: Spanish
      level: b1
      topic: "a trip that went wrong"
    assert:
      - {type: llm-rubric, value: "Explains in two lines that the imperfect carries background and the preterite carries events, gives a grouped connector bank pitched at B1 (for example primero, luego, mientras, de repente, sin embargo, por eso, al final) and 4 to 6 guiding questions in Spanish, then asks the learner to tell the story."}
      - {type: llm-rubric, value: "Does not tell a sample story or correct anything yet; it stops after the request."}
  - name: edge-feedback-french-a2
    description: "After the follow-up, the learner's story was: 'Samedi je vais au marché. Il fait beau. Je achète des pommes et je rencontre mon ami. Après nous mangeons ensemble.'"
    vars:
      target_language: French
      level: a2
      topic: "my weekend"
    assert:
      - {type: llm-rubric, value: "Corrects the present tense to passé composé for events (je suis allé, j'ai acheté, j'ai rencontré, nous avons mangé) and imparfait for background (il faisait beau), fixes 'je achète' elision, keeps to at most 6 errors, and the upgraded version keeps the same facts without adding events."}
  - name: negative-no-topic
    vars:
      target_language: Italian
      level: b2
    assert:
      - {type: llm-rubric, value: "Offers three topic choices and waits, instead of choosing a topic and launching the full exercise."}
