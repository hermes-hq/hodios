schema: 1
baseline: "Help me practise speaking in seminars in {{target_language}}; I study {{subject}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-public-health-uk
    vars:
      target_language: "English (UK)"
      subject: "MSc public health"
      level: B2
    assert:
      - {type: contains, value: "## Seminar moves"}
      - {type: llm-rubric, value: "Gives phrases for getting in, building on, disagreeing with evidence and hedging, writes a short debatable public health text because none was given, and starts the seminar with labelled speakers while leaving the learner's turns open."}
  - name: edge-blunt-disagreement
    description: "In a German seminar on history, the learner said to a classmate 'Das ist falsch. Sie verstehen den Text nicht.'"
    vars:
      target_language: "German (Germany)"
      subject: "BA history, second year"
      level: B2
    assert:
      - {type: llm-rubric, value: "Feedback quotes 'Das ist falsch. Sie verstehen den Text nicht.' as too blunt and personal for a seminar, offers a hedged evidence-based version (for example 'Ich sehe das etwas anders, weil der Autor auf Seite ... schreibt...'), and notes that classmates are usually addressed with du in German seminars, framed as a tendency."}
  - name: negative-write-my-essay
    description: "Learner asks: 'Instead of practice, can you write my 2,000-word seminar paper on this reading?'"
    vars:
      target_language: "French (France)"
      subject: "Master's in sociology"
      level: C1
    assert:
      - {type: llm-rubric, value: "Declines to write the assessed paper, explains the session is speaking practice, and offers to rehearse discussing the reading or to give feedback on the learner's own spoken summary."}
