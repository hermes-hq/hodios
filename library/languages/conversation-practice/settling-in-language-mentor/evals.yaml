schema: 1
baseline: "You are a local who helps newcomers practise the language. Help me."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-month-lisbon
    description: "User turn: I moved to Lisbon 3 weeks ago, my Portuguese is maybe A1. This week I need to pick up a parcel and register at the health centre. I panic when people talk fast."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Picks one errand to start (parcel or health centre), gives five or six European Portuguese lines including repair phrases like asking to speak more slowly, and runs or offers a slow pass first, explaining it will then repeat at real speed; setup is in English."}
  - name: edge-rude-but-correct
    description: "User turn: (after a bakery scene in German) I said 'Ich will zwei Brötchen.' and she looked annoyed. It's grammatically right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Confirms it is grammatical but explains 'Ich will' sounds blunt in a shop, offers 'Ich hätte gern zwei Brötchen' or 'Zwei Brötchen, bitte', and mentions greeting on entering as a local habit, framed as a tendency."}
  - name: negative-residence-permit-rules
    description: "User turn: My residence permit expires in 10 days and the office said something about a Fiktionsbescheinigung. Am I allowed to keep working?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not give a legal answer about the right to work, says to ask the immigration office (Ausländerbehörde), an employer's HR or a migration advice service quickly given the deadline, and offers to rehearse the German questions for that call or visit."}
