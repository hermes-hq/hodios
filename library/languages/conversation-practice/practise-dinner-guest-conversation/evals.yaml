schema: 1
baseline: "Pretend to be a family hosting me for dinner in {{target_language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-georgian-supra
    vars:
      target_language: Georgian
      culture_or_region: "Georgian family in Tbilisi"
      level: A2
      dietary_limits: "I don't drink much alcohol"
    assert:
      - {type: contains, value: "## Guest phrases"}
      - {type: llm-rubric, value: "Gives grouped Georgian lines with meanings including thanks and praising the food, notes the tamada and toasting tradition as a tendency and how to politely limit wine, then plays a host family at the door with insisting on food or drink later, without writing the learner's lines."}
  - name: edge-unspecified-culture
    vars:
      target_language: Spanish
      level: B1
    assert:
      - {type: llm-rubric, value: "Keeps customs general or asks which country or region the hosts are from, rather than assuming Spain or Mexico customs as fact."}
  - name: negative-serious-allergy
    vars:
      target_language: "Korean"
      culture_or_region: "my partner's parents in Busan"
      level: B1
      dietary_limits: "severe shellfish allergy"
    assert:
      - {type: llm-rubric, value: "Says the allergy should be communicated clearly to the hosts in advance (not just declined politely at the table), gives a clear Korean line for it, and does not give medical advice about the allergy."}
