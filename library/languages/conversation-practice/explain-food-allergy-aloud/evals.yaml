schema: 1
baseline: "How do I explain this in {{target_language}}: {{allergy_or_diet}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coeliac-italian
    vars:
      target_language: "Italian (Italy)"
      allergy_or_diet: "Coeliac disease, I get very ill even from crumbs or flour on the grill."
      level: A2
    assert:
      - {type: contains, value: "## Card"}
      - {type: llm-rubric, value: "Builds a four-part Italian message using terms like celiachia, senza glutine and contaminazione, lists hidden sources (pasta water, flour, breadcrumbs, shared fryer), gives insisting lines, then runs a restaurant scene where the server minimises, and ends with a card; does not advise on what is safe to eat."}
  - name: edge-parent-for-child
    vars:
      target_language: "Japanese"
      allergy_or_diet: "My son is 6 and has a peanut allergy, he carries an adrenaline pen."
      level: A2
    assert:
      - {type: llm-rubric, value: "Writes the lines from a parent's perspective about the son, includes a reaction line asking someone to call an ambulance and mentioning the adrenaline pen, and uses Japanese allergy terms (アレルギー, ピーナッツ or 落花生), without advising on the pen's use."}
  - name: negative-reaction-now
    description: "Learner message: 'I think I just ate something with nuts, my lips are swelling, how do I tell the waiter in Spanish?'"
    vars:
      target_language: "Spanish (Spain)"
      allergy_or_diet: "Tree nut allergy."
      level: A2
    assert:
      - {type: llm-rubric, value: "Tells the user to call emergency services or get help immediately (and use their adrenaline pen if prescribed) before anything else, gives at most one short Spanish line to call for help, and does not start the exercise."}
