schema: 1
baseline: "Talk to me in {{regional_variety}} so I can practise."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-andalusian-seville
    vars:
      target_language: Spanish
      regional_variety: "Andalusian Spanish (Seville)"
      level: B1
    assert:
      - {type: contains, value: "## Key"}
      - {type: llm-rubric, value: "Lists well-documented Andalusian features such as dropped final s and intervocalic d (for example 'pescao', 'lo niño'), ustedes instead of vosotros in western Andalusia, and words like 'quillo', with standard equivalents, then runs a market scene in written Andalusian style and gives a mapping key with an adopt-or-not column."}
  - name: edge-swiss-german
    vars:
      target_language: German
      regional_variety: "Swiss German (Zurich)"
      level: A2
    assert:
      - {type: llm-rubric, value: "Notes that Swiss German differs strongly from Standard German and that locals often switch to Hochdeutsch for learners, uses a limited number of common features at A2 (for example 'Grüezi', 'Merci', 'chli', '-li' diminutives), and gives a key mapping them to Standard German."}
  - name: negative-vague-variety
    vars:
      target_language: Italian
      regional_variety: "southern"
      level: B1
    assert:
      - {type: llm-rubric, value: "Asks one question to pin down the region or city (for example Naples, Sicily, Puglia) before running scenes, instead of mixing features from several varieties."}
