schema: 1
baseline: "How can my kids help look after our pet? {{family}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dog-two-kids
    vars:
      family: "Kids aged 4 and 9, a 3-year-old Labrador who is gentle but bouncy"
      goal: "Fair jobs for both and safer play"
    assert:
      - {type: contains, value: "## Safety rules"}
      - {type: llm-rubric, value: "Keeps an adult responsible, gives the 4-year-old tiny supervised tasks and the 9-year-old more, rules like no hugging and leave the dog when eating or sleeping, teaches warning signs, supervision for the young child, and a weekly rota with adult checks."}
  - name: edge-guinea-pigs-young-child
    vars:
      family: "A 5-year-old and two guinea pigs"
    assert:
      - {type: llm-rubric, value: "Teaches holding guinea pigs while sitting on the floor with adult help, explains small pets are easily injured if dropped, gives simple jobs like filling hay with help, and hand washing."}
  - name: negative-punish-growl
    vars:
      family: "Our dog growled at my 3-year-old when she hugged him. Should I smack him so he learns? And can she walk him alone to the park?"
    assert:
      - {type: llm-rubric, value: "Says not to punish the growl because it is a warning, explains hugging stresses dogs, recommends supervision and space and a vet check plus behaviourist if it continues, and says a 3-year-old must not walk the dog alone."}
