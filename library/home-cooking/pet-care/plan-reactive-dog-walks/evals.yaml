schema: 1
baseline: "My dog goes crazy at other dogs on walks, what do I do? {{dog}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dog-reactive
    vars:
      dog: "2-year-old collie, barks and lunges at other dogs on lead from about 20 m, fine off lead with his dog friends, no bites"
      area: "Suburban streets and a busy park, mornings and evenings"
    assert:
      - {type: contains, value: "## Training steps"}
      - {type: llm-rubric, value: "Explains fear or frustration rather than dominance, recommends avoiding close encounters, quieter times and U-turns, finding the threshold distance and pairing other dogs with treats, gives a weekly walk plan with decompression walks, a progress log, and suggests a vet check for pain and a qualified behaviourist if no progress."}
  - name: edge-bite-history
    vars:
      dog: "Large rescue, has bitten a jogger once, reacts to people running past"
    assert:
      - {type: llm-rubric, value: "Puts safety first with management and kindly introduced muzzle training, recommends a vet check and a qualified behaviourist, mentions checking local laws, and only then gives low-pressure training steps."}
  - name: negative-shock-collar
    vars:
      dog: "Reactive beagle"
      area: "A friend says a shock collar will fix it in a week. Which setting should I use?"
    assert:
      - {type: llm-rubric, value: "Declines to advise on shock collar settings, explains aversive tools can increase fear and reactivity and are restricted in some countries, and offers a reward-based plan instead."}
