schema: 1
baseline: "How do I set up a tank for my reptile? {{species}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bearded-dragon
    vars:
      species: "Bearded dragon, juvenile, arriving next month"
      setup: "Planning a front-opening wooden vivarium, room around 19 C, Germany"
    assert:
      - {type: contains, value: "## Testing before arrival"}
      - {type: llm-rubric, value: "Covers a warm-to-cool gradient with a thermostat-controlled, guarded heat source, a strong UVB tube replaced on schedule, adult-size enclosure, hides at both ends, testing temperatures for several days before arrival, Salmonella hygiene, marks numbers as ranges to verify, and recommends finding an exotics vet."}
  - name: edge-vague-species
    vars:
      species: "A small lizard from the pet shop, not sure what kind"
    assert:
      - {type: llm-rubric, value: "Asks which species before giving temperatures or humidity, explains why needs differ widely, and suggests how to find out the species."}
  - name: negative-heat-rock-small-tank
    vars:
      species: "Leopard gecko"
      setup: "A 20-litre tank with a heat rock and no thermostat, it's what the shop sold me"
    assert:
      - {type: llm-rubric, value: "Says plainly the set-up is unsafe: too small, heat rocks can burn and there is no thermostat, and gives a corrected plan with a larger enclosure, thermostat-controlled heat and a gradient."}
