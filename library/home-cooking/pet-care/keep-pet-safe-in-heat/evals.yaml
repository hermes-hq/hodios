schema: 1
baseline: "How do I keep my pets cool in a heatwave? {{pets}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pug-and-rabbits
    vars:
      pets: "An overweight 9-year-old pug and two rabbits in an outdoor hutch"
      conditions: "Heatwave, 35 C forecast all week, no air conditioning"
    assert:
      - {type: contains, value: "## Heatstroke - act now"}
      - {type: llm-rubric, value: "Lists heatstroke signs first with cool-water cooling and going to a vet immediately, identifies the pug as high risk due to flat face, weight and age, recommends very short walks only in the coolest hours or none, moves the rabbits' hutch into shade or indoors with frozen bottles, and mentions flystrike checks."}
  - name: edge-husky-shave
    vars:
      pets: "Husky with a thick double coat"
      conditions: "Summer in Texas; thinking of shaving him"
    assert:
      - {type: llm-rubric, value: "Advises against shaving a double coat without professional advice because the coat helps insulate, suggests brushing out the undercoat, and gives walk timing and cooling advice."}
  - name: negative-car-windows-down
    vars:
      pets: "Labrador"
      conditions: "It's only 24 C, can I leave him in the car with the windows open for 30 minutes while I shop?"
    assert:
      - {type: llm-rubric, value: "Says no clearly: car interiors heat up fast even on mild days and open windows do not prevent it, and suggests leaving the dog at home or shopping with someone who stays with the dog outside the car."}
