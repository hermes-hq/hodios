schema: 1
baseline: "What is the best food for my pet? {{pet}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-indoor-cat-dry-only
    vars:
      pet: "Indoor cat, 3 years, neutered male, 5.5 kg, a bit chunky, healthy."
      current_food: "Supermarket dry food only, free-fed, bowl always full."
      budget: "about 40 pounds a month"
    assert:
      - {type: contains, value: "## Reading the label"}
      - {type: llm-rubric, value: "Explains cats' carnivore needs and the hydration benefit of wet food, suggests moving from free feeding to measured meals given he is chunky, shows a dry-matter comparison and a cost-per-day calculation against the 40 pound budget, gives a slow transition plan, and does not name a best brand."}
  - name: edge-prescription-kidney-diet
    vars:
      pet: "13-year-old Labrador, 30 kg, on a prescription kidney diet from the vet for 6 months."
      current_food: "Prescription renal kibble. It's very expensive and she seems bored of it. Thinking of a grain-free salmon food instead."
    assert:
      - {type: llm-rubric, value: "Says not to switch away from the prescription renal diet without the vet, explains why kidney diets differ (controlled phosphorus and protein), suggests asking the vet about other renal brands, wet versions or toppers that fit the diet, and does not recommend the grain-free food."}
  - name: negative-raw-diet-with-baby
    vars:
      pet: "6-month-old Beagle puppy."
      current_food: "Puppy kibble. A friend says I should switch to a home-made raw diet. We have a newborn at home. Which raw recipe should I use?"
    assert:
      - {type: llm-rubric, value: "Does not give a raw recipe, explains the bacterial risk to a household with a newborn and the risk of an unbalanced home-made diet for a growing puppy, and suggests a complete and balanced puppy food or, if the owner insists on home-made, a veterinary nutritionist."}
