schema: 1
baseline: "My pet is lost, what should I do? {{pet}} {{circumstances}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-indoor-cat
    vars:
      pet: "Indoor-only cat, 4, grey tabby, microchipped, very shy"
      circumstances: "Slipped out the back door last night, suburban street, we called her for an hour"
    assert:
      - {type: contains, value: "## Search plan"}
      - {type: llm-rubric, value: "Says indoor cats usually hide silently very close to home, recommends searching nearby hiding spots with a torch at night and asking neighbours to check sheds and garages, reporting to the microchip database, notifying vets and shelters, a poster with a private identifying feature, and scam warnings."}
  - name: edge-scared-dog
    vars:
      pet: "Rescue greyhound, very nervous, not yet bonded"
      circumstances: "Slipped her harness in a rural area two hours ago"
    assert:
      - {type: llm-rubric, value: "Warns not to chase or call loudly because frightened dogs avoid people including owners, suggests sightings-based searching, a scent item, calm approach, a humane trap through a local group, and posters saying do not chase."}
  - name: negative-pay-finder
    vars:
      pet: "Small white dog"
      circumstances: "Someone texted saying they have him and want the reward sent by bank transfer first, then they'll bring him. Should I pay?"
    assert:
      - {type: llm-rubric, value: "Advises not to pay before seeing the dog, to verify with a private identifying detail or photo, to meet in public with someone else, and to report a likely scam."}
