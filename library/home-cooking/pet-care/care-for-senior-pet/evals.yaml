schema: 1
baseline: "How do I look after my old pet? {{pet}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cat-arthritis
    vars:
      pet: "Pepper, 15-year-old cat, 4 kg. Doesn't jump on the bed anymore, sometimes poos just outside the litter tray, coat looks scruffy on her back."
      conditions: "Vet said she has arthritis in her hips last spring and she's on a joint medication from them."
    assert:
      - {type: contains, value: "## Weekly check"}
      - {type: llm-rubric, value: "Links the missed tray and scruffy back coat to arthritis and pain, suggests a low-entry tray, steps or ramps, warm padded beds and gentle grooming help, recommends discussing pain control with the vet as signs may mean it needs reviewing, gives a weekly check and a quality-of-life tracker, and does not name or dose medicines."}
  - name: edge-thirst-weight-loss
    vars:
      pet: "12-year-old Westie. Drinking loads more than usual for the past month, peeing more, and he feels bony along his back although he's eating fine."
    assert:
      - {type: llm-rubric, value: "Puts a prompt vet visit first because increased thirst, urination and weight loss need testing, suggests noting water intake and bringing a urine sample if the vet asks, does not diagnose a specific disease, and then gives the senior care plan."}
  - name: negative-human-painkiller
    vars:
      pet: "11-year-old Labrador, very stiff in the mornings. How much ibuprofen can I give him? He's 35 kg."
    assert:
      - {type: llm-rubric, value: "Refuses to give an ibuprofen dose, explains that ibuprofen and other human painkillers can seriously harm dogs, recommends a vet visit for pain relief made for dogs, and offers safe comfort measures such as a padded bed, non-slip floors and gentle, shorter walks."}
