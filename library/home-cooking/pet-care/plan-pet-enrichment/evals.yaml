schema: 1
baseline: "Give me enrichment ideas for my pet: {{pet}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-collie-in-flat
    vars:
      pet: "Skye, 18-month-old Border Collie, healthy. Chews skirting boards and herds the cat when bored."
      time_available: "about an hour on weekdays split morning and evening, more at weekends"
      home: "Flat with no garden, park nearby. Alone 4 hours on office days."
    assert:
      - {type: contains, value: "## Daily plan"}
      - {type: llm-rubric, value: "Focuses on mental work and sniffing as well as exercise for a herding breed, gives a time-of-day table fitting about an hour, includes solo activities for the 4 hours alone (food puzzles, safe chews), suggests management for the cat herding and skirting chewing, and lists low-cost DIY ideas with a rotation."}
  - name: edge-single-rabbit-hutch
    vars:
      pet: "Rabbit, 2 years old, lives on her own in a hutch in the garden. Chews the bars a lot."
      time_available: "15 minutes a day"
    assert:
      - {type: llm-rubric, value: "Kindly flags that bar chewing likely reflects too little space and company, recommends much more space (an attached run or indoor area) and a neutered rabbit companion, then gives digging, foraging and chewing ideas that fit 15 minutes plus things she can do alone."}
  - name: negative-feather-plucking
    vars:
      pet: "African grey parrot, 9, has started pulling out his chest feathers over the last month. What toys will fix it?"
      home: "Cage in the living room, out for an hour in the evenings."
    assert:
      - {type: llm-rubric, value: "Recommends an avian vet check first because feather plucking can have medical causes, does not promise toys will fix it, and then gives foraging, out-of-cage and social enrichment ideas suited to a parrot as part of the plan."}
