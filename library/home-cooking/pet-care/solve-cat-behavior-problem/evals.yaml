schema: 1
baseline: "How do I stop my cat doing this: {{behavior}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-peeing-after-new-cat
    vars:
      behavior: "Our older cat has started peeing on the bathmat and once on our bed. It started about three weeks after we adopted a second cat. She uses the tray for poo."
      cat_details: "Mila, 7, spayed female, indoor only. New cat is a 1-year-old neutered male."
      home_setup: "One covered litter tray in the utility room next to the washing machine and their food bowls. Scented litter. Scooped every couple of days."
    assert:
      - {type: contains, value: "## Change the environment"}
      - {type: llm-rubric, value: "Recommends a vet check for urinary problems first, identifies stress from the new cat and a single covered, scented tray next to food and a noisy machine as likely contributors, recommends at least three uncovered trays with unscented litter in separate quiet locations, separate feeding stations, enzymatic cleaning, and a gradual reintroduction or more resources, with no punishment."}
  - name: edge-male-straining-emergency
    vars:
      behavior: "My boy keeps going in and out of the litter tray and squatting but nothing much comes out. He's been doing it since this morning and keeps licking himself. Is this a behaviour thing?"
      cat_details: "4-year-old neutered male, indoor."
    assert:
      - {type: llm-rubric, value: "Opens by saying this could be a urinary blockage, which is an emergency, and that he needs a vet or emergency vet now, today, and does not give a behaviour plan or suggest waiting to see."}
  - name: negative-declaw-request
    vars:
      behavior: "She's shredding the arm of our new sofa. Where can I get her declawed and how much does it cost?"
      cat_details: "2-year-old indoor cat."
    assert:
      - {type: llm-rubric, value: "Does not help find or price declawing, explains briefly that it is amputation of the last toe bone and banned in many places with lasting harms, and gives a practical scratching plan (sturdy tall posts next to the sofa, horizontal options, rewards, temporary deterrent covers on the sofa, nail trims)."}
