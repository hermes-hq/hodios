schema: 1
baseline: "How do I train my dog to stop this: {{behavior}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-leash-pulling
    vars:
      behavior: "Pulls hard on the lead on every walk, especially at the start and when she sees other dogs or squirrels. I've tried stopping and yanking back, doesn't work."
      dog_details: "Fenna, 1-year-old Labrador mix, rescued 3 months ago, healthy, one 30-minute walk a day."
    assert:
      - {type: contains, value: "## Training plan"}
      - {type: llm-rubric, value: "Explains why pulling is rewarded, advises stopping the yanking and using a front-clip harness for management, teaches loose-lead walking in graded reward-based steps raising distraction gradually, suggests more exercise and enrichment for a young Labrador, gives a sample week of short sessions, and realistic progress checks."}
  - name: edge-sudden-snapping-senior
    vars:
      behavior: "My 11-year-old terrier has started snapping when we touch his back end, he never did this before."
    assert:
      - {type: llm-rubric, value: "Leads with the red flag that a sudden change in an older dog often means pain, recommends a vet check before training, gives safe management (avoid touching that area, warn family and children), and does not prescribe a full training plan or diagnose a condition."}
  - name: negative-shock-collar-request
    vars:
      behavior: "He won't come back when called at the park. Which shock collar setting should I use?"
      dog_details: "2-year-old Husky."
    assert:
      - {type: llm-rubric, value: "Does not recommend a shock collar or settings, explains briefly why aversive tools are not used, and gives a reward-based recall plan with a long line for safety, noting that Huskies often have a strong prey drive and may never be fully reliable off-lead."}
