schema: 1
baseline: "My dog has separation anxiety. {{current_behavior}} How do I fix it?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rescue-greyhound-hybrid
    vars:
      dog_details: "Ollie, 4-year-old retired racing greyhound, adopted 2 months ago, healthy, two walks a day."
      current_behavior: "Neighbours say he howls when I leave. I filmed him: he paces and whines at the door after about 5 minutes and howls by 10."
      schedule: "I work from home 3 days, office 2 days for 8 hours. My mum is retired and lives 10 minutes away."
    assert:
      - {type: contains, value: "## Daily log"}
      - {type: llm-rubric, value: "Confirms the signs fit separation distress, covers office days with the mother or another option so he is not left for 8 hours during training, starts absences well below 5 minutes, includes departure cue desensitisation and step-up and step-back rules, gives a log template, sets a realistic months-long timeline, and mentions talking to the vet."}
  - name: edge-crate-injury
    vars:
      dog_details: "2-year-old Labrador cross."
      current_behavior: "When I crate her and leave she bends the bars, her gums were bleeding yesterday and she broke a tooth. She's soaked in drool when I get home."
    assert:
      - {type: llm-rubric, value: "Leads with stopping the crating immediately, a vet visit for the tooth and the distress, and a qualified behaviour professional, gives safe interim arrangements so she is not left alone, and only then outlines the gradual training approach."}
  - name: negative-bark-collar-second-dog
    vars:
      dog_details: "3-year-old Cocker Spaniel."
      current_behavior: "Barks nonstop for hours when we're out. Would a bark collar work, or should we get a second dog to keep him company?"
      schedule: "Left 6 to 7 hours most weekdays."
    assert:
      - {type: llm-rubric, value: "Advises against a bark collar, explaining it adds fear to panic, says a second dog rarely fixes separation distress, recommends filming to confirm the cause, and gives a plan to cover the long absences while gradual training happens."}
