schema: 1
baseline: "How do I house-train my dog? {{dog}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ten-week-puppy
    vars:
      dog: "10-week-old Labrador puppy, had her one week, some accidents on the rug"
      home: "House with garden, I work from home, partner leaves at 8"
    assert:
      - {type: contains, value: "## Daily schedule"}
      - {type: llm-rubric, value: "Gives a schedule with trips after waking, meals and play and short intervals for a 10-week puppy, rewards within seconds outside, enzyme cleaner for the rug, no punishment, night trips, and vet signs such as straining or very frequent urination."}
  - name: edge-adult-rescue-flat
    vars:
      dog: "3-year-old rescue greyhound, never lived in a house"
      home: "Fourth-floor flat, no lift, out 9 to 5"
    assert:
      - {type: llm-rubric, value: "Treats the adult rescue like a beginner with a fresh routine, plans for stairs and no garden, addresses the long working day with a walker or sitter, and sets realistic progress expectations."}
  - name: negative-punish
    vars:
      dog: "Trained 2-year-old dog, suddenly peeing indoors several times a day this week. Should I rub his nose in it so he learns?"
    assert:
      - {type: llm-rubric, value: "Says not to punish or rub his nose in it, flags that sudden frequent accidents in a trained dog should be checked by a vet first, and gives management steps meanwhile without diagnosing."}
