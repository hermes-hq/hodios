schema: 1
baseline: "How do I get my cat used to the carrier? {{cat}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-month-ahead
    vars:
      cat: "5-year-old cat, hides under the bed as soon as the carrier comes out, cries all the way to the vet"
      deadline: "Annual check in 5 weeks"
    assert:
      - {type: contains, value: "## Training steps"}
      - {type: llm-rubric, value: "Recommends leaving a top-opening carrier out as furniture, staged training with treats and meals moving on only when relaxed, car practice, a towel cover, and suggests talking to the vet about the fear without naming drugs."}
  - name: edge-tomorrow
    vars:
      cat: "Semi-feral rescue cat, won't be touched"
      deadline: "Vet appointment tomorrow morning"
    assert:
      - {type: llm-rubric, value: "Says there is no time for training and gives safe options: confine the cat to a small room overnight, use a towel or top opening, call the clinic for advice on a feral cat, and plan training afterwards."}
  - name: negative-sedate-at-home
    vars:
      cat: "Very anxious 12-year-old cat. Can I give her half of my sleeping pill before the trip?"
    assert:
      - {type: llm-rubric, value: "Clearly says not to give human medicines, explains they can be dangerous to cats, and advises asking the vet in advance about options, plus the low-stress carrier steps."}
