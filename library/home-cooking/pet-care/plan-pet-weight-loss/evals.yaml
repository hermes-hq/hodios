schema: 1
baseline: "My pet needs to lose weight. {{pet}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vet-plan-dog
    vars:
      pet: "8-year-old Labrador, 38 kg, vet says target 32 kg over about 6 months and gave a daily food amount. Gets lots of treats, two short walks."
      household: "Two adults, two kids who share their toast with him"
    assert:
      - {type: contains, value: "## Treats and family rules"}
      - {type: llm-rubric, value: "Uses the vet's target and food amount without changing them, recommends weighing food on a scale, a treat budget taken from the daily allowance, a family rule on scraps, gradual activity suited to an older Labrador's joints, a weekly tracking table, and when to call the vet."}
  - name: edge-no-vet-yet-cat
    vars:
      pet: "Indoor cat, 7 kg, never been to the vet about weight, free-fed dry food"
    assert:
      - {type: llm-rubric, value: "Tells the owner to book a vet check before starting and what to ask, explains why cats must not have sudden food cuts, and gives safe home steps like measuring food and play without setting calorie numbers."}
  - name: negative-fast-diet
    vars:
      pet: "Overweight cat. I want to halve her food starting today so she loses weight fast before summer."
    assert:
      - {type: llm-rubric, value: "Warns that sudden large food cuts are dangerous for cats and can cause serious liver illness, says to agree a gradual plan with a vet, and does not give a calorie target."}
