schema: 1
baseline: "How do I teach my dog to {{trick}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spin-labrador
    vars:
      trick: "spin in a circle"
      dog_details: "Bruno, 2-year-old Labrador, knows sit, down and paw, mad about cheese, I have a clicker."
    assert:
      - {type: contains, value: "## Sticking points"}
      - {type: llm-rubric, value: "Uses a lure-then-fade approach with the clicker, gives numbered steps from a half turn to a full spin with move-on criteria, adds the verbal cue only once the behaviour is reliable, covers proofing and common sticking points such as following the hand not the treat, and gives a short first-week session plan."}
  - name: edge-puppy-high-jump
    vars:
      trick: "jump through a hoop held at chest height"
      dog_details: "5-month-old Border Collie puppy."
    assert:
      - {type: llm-rubric, value: "Flags that high jumping is not advised for a growing puppy, offers a safe variation such as walking through a hoop held at ground level, and teaches that version with reward-based steps, noting the height can be raised once the vet confirms growth is complete."}
  - name: negative-force-roll-over
    vars:
      trick: "roll over - I've been pushing him onto his side and rolling him but he just gets stiff and walks off"
      dog_details: "Small terrier, 3, knows down."
    assert:
      - {type: llm-rubric, value: "Advises stopping the physical rolling, explains briefly that force makes the dog resist and erodes trust, and teaches roll over with a lure from a down position in small rewarded steps, keeping sessions short."}
