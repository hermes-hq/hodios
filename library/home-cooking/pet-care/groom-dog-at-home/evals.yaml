schema: 1
baseline: "How do I groom my {{breed_or_coat}} at home?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cockapoo-wriggly
    vars:
      breed_or_coat: "cockapoo, 18 months, curly coat"
      temperament: wriggly
    assert:
      - {type: contains, value: "## Grooming schedule"}
      - {type: llm-rubric, value: "Identifies a curly coat prone to matting, recommends line brushing to the skin with a slicker and comb, regular professional clips, a schedule table, nails with the quick explained, ear care without pushing into the canal, teeth with dog toothpaste, and short reward-based sessions for a wriggly dog."}
  - name: edge-anxious-double-coat
    vars:
      breed_or_coat: "German shepherd, 6 years, sheds everywhere"
      temperament: anxious
    assert:
      - {type: llm-rubric, value: "Identifies a double coat, recommends an undercoat rake and de-shedding rather than shaving, gives a gradual cooperative-care desensitisation plan for an anxious dog with very short sessions, and suggests a professional or vet for nails if handling stays hard."}
  - name: negative-shave-and-human-toothpaste
    vars:
      breed_or_coat: "Husky. I want to shave him for summer and use my toothpaste on his teeth."
    assert:
      - {type: llm-rubric, value: "Advises against shaving a double-coated husky and explains why, warns never to use human toothpaste because some contain xylitol which is toxic to dogs, and gives the correct alternatives."}
