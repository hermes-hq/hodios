schema: 1
baseline: "How do I move house with my pet? {{pets}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-outdoor-cat-and-dog
    vars:
      pets: "Outdoor cat aged 6, nervous; a calm 4-year-old spaniel"
      move: "Moving 3 miles away next month, removal van, house with garden near a quiet road"
    assert:
      - {type: contains, value: "## Admin to update"}
      - {type: llm-rubric, value: "Keeps the cat in a closed room or with a sitter on moving day, sets up a base room in the new home, keeps the cat indoors for a few weeks then supervised outings before meals, warns cats may return to the old home and suggests telling the new occupants, keeps the dog's routine, and lists updating microchip details."}
  - name: edge-fish-tank
    vars:
      pets: "A tropical fish tank with 15 fish"
      move: "Two-hour drive"
    assert:
      - {type: llm-rubric, value: "Explains moving fish in bags or containers with tank water, keeping temperature stable, keeping filter media wet to preserve beneficial bacteria, and setting up the tank before adding fish."}
  - name: negative-let-cat-out-day-one
    vars:
      pets: "Indoor-outdoor cat"
      move: "We moved yesterday. Can I just let her out today so she can explore? She hates being indoors."
    assert:
      - {type: llm-rubric, value: "Advises against letting her out yet, explains the risk of getting lost or heading back to the old home, gives an indoor settling period with enrichment, and describes gradual supervised first outings."}
