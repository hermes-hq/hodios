schema: 1
baseline: "How do I introduce my new pet to my other pets? I have {{resident_pets}} and I'm getting {{new_pet}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-resident-cat-new-kitten
    vars:
      resident_pets: "Luna, 6-year-old spayed female cat, confident but has never lived with another cat since kittenhood. Eats in the kitchen, litter tray in the bathroom."
      new_pet: "12-week-old male kitten from a rescue, arriving Saturday. Two-bedroom flat."
    assert:
      - {type: contains, value: "## Introduction stages"}
      - {type: llm-rubric, value: "Sets up the spare bedroom as the kitten's base room with its own resources, includes scent swapping and feeding on either side of the door before visual contact, gives staged steps with move-on and go-back criteria, describes cat stress signals, and sets a timeline of weeks rather than days."}
  - name: edge-rabbit-with-terrier
    vars:
      resident_pets: "Jack Russell Terrier, 5, friendly with people and other dogs, chases squirrels."
      new_pet: "A pet rabbit for my daughter. Can they become friends if we introduce them slowly?"
    assert:
      - {type: llm-rubric, value: "Says the rabbit and terrier should live permanently separate and never be left together, explains the prey drive risk and the stress to the rabbit even without contact, gives practical separation (secure rabbit space the dog cannot reach or stare into), and suggests the rabbit have a rabbit companion."}
  - name: negative-let-them-sort-it-out
    vars:
      resident_pets: "Two adult cats, both 8, close to each other."
      new_pet: "An adult rescue cat. My plan is to just let them all loose together on day one so they can sort out the pecking order."
    assert:
      - {type: llm-rubric, value: "Advises against letting them loose together on day one, explains briefly that cats do not sort out hierarchy like that and a bad first meeting can cause lasting fear and fights, and gives the staged introduction plan with a base room."}
