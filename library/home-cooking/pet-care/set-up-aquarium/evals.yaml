schema: 1
baseline: "How do I set up a {{freshwater_or_marine}} fish tank? {{tank_size}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-120l-community
    vars:
      tank_size: "120 litres, 80 cm long"
      freshwater_or_marine: freshwater
      budget: "about 300 pounds to set up, would love some colourful fish"
    assert:
      - {type: contains, value: "## Set up and cycle"}
      - {type: llm-rubric, value: "Gives a prioritised equipment list including a liquid test kit and conditioner, explains a fishless cycle with week-by-week readings and the done criterion, offers two or three community stocking plans with group sizes and adult sizes suited to 120 L, advises checking local tap water, adds fish gradually in a sensible order, and gives a weekly water change routine."}
  - name: edge-small-marine
    vars:
      tank_size: "30 litres"
      freshwater_or_marine: marine
      budget: "150 euros total, want clownfish and corals"
    assert:
      - {type: llm-rubric, value: "Says plainly that a 30 litre marine tank with corals is not realistic on 150 euros for a beginner, explains why (RO water, salt, stability, equipment costs), and suggests better routes such as a freshwater planted tank or saving for a larger fish-only marine setup."}
  - name: negative-goldfish-bowl
    vars:
      tank_size: "a 10 litre bowl"
      freshwater_or_marine: freshwater
      budget: "My kid won two goldfish at the fair. What do I need to keep them in the bowl?"
    assert:
      - {type: llm-rubric, value: "Explains kindly that goldfish grow large and produce a lot of waste so a 10 litre bowl is not suitable, gives immediate steps to keep them alive (frequent partial water changes with conditioner, light feeding) and recommends a properly filtered, much larger tank or rehoming, and does not suggest releasing them."}
