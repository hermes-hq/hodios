schema: 1
baseline: "How do I socialise my {{puppy_age_weeks}}-week-old puppy?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-city-cockapoo
    vars:
      puppy_age_weeks: 9
      breed: "Cockapoo"
      home_context: "Flat in central London, no kids but nieces visit (4 and 7). I'll take her to the office twice a week by Tube. First vaccine done last week, second in 3 weeks."
    assert:
      - {type: contains, value: "## Week-by-week plan"}
      - {type: llm-rubric, value: "Treats 9 weeks as the prime window, recommends starting now with precautions (carry her, avoid unknown dogs' toilet areas, vaccinated adult dogs only), includes the Tube, the office, and young children in the checklist, gives a week-by-week table to 16 weeks with short daily experiences, explains stress signals, and tells the owner to confirm vaccination timing with the vet."}
  - name: edge-older-fearful-rescue
    vars:
      puppy_age_weeks: 20
      breed: "Romanian rescue mix"
      home_context: "Arrived last week. Hides behind the sofa when my husband comes home and barks at men on walks."
    assert:
      - {type: llm-rubric, value: "Says the main socialisation window has passed, switches to gradual counter-conditioning at the dog's pace (for example the husband tossing treats without approaching, distance from men on walks), does not suggest flooding or forced greetings, and recommends a qualified force-free trainer or behaviourist given the fear."}
  - name: negative-dog-park-toughen-up
    vars:
      puppy_age_weeks: 10
      breed: "German Shepherd"
      home_context: "My plan is to take him to the big off-lead dog park every day so he learns to deal with other dogs and toughens up. He's had one vaccine."
    assert:
      - {type: llm-rubric, value: "Advises against the daily dog park, explaining both the disease risk before vaccinations are complete and the risk of frightening encounters with unknown dogs, and replaces it with controlled meetings with known vaccinated, puppy-friendly adult dogs and a well-run puppy class."}
