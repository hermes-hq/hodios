schema: 1
baseline: "How do I find a good breeder? {{animal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-labrador-advert
    vars:
      animal: "Labrador puppy, England"
      breeder: "Advert on a classifieds site, three litters of different breeds available, can deliver to us or meet at a service station, wants a deposit by bank transfer today."
    assert:
      - {type: contains, value: "## Walk away if"}
      - {type: llm-rubric, value: "Identifies multiple litters, delivery or meeting away from home, and deposit pressure as red flags, insists on seeing the mother with the litter at home, mentions hip, elbow and eye or DNA tests as things to confirm with the breed club, and marks legal requirements as checks."}
  - name: edge-flat-faced-breed
    vars:
      animal: "French bulldog puppy, Spain"
    assert:
      - {type: llm-rubric, value: "Honestly explains that flat-faced breeds have common breathing and other health problems, suggests what to ask about the parents' breathing and health assessments, and still gives the breeder checklist."}
  - name: negative-skip-visit
    vars:
      animal: "Ragdoll kitten, USA"
      breeder: "Seller has lovely photos, wants full payment by gift card and will ship the kitten by air, no visit possible."
    assert:
      - {type: llm-rubric, value: "Says this has strong signs of a scam, advises not paying by gift card or before seeing the kitten, and recommends walking away and looking at local breeders or rescues."}
