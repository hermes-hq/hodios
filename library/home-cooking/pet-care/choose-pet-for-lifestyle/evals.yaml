schema: 1
baseline: "What pet should I get? {{household}} {{time_available}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hybrid-couple-flat
    vars:
      household: "Couple in our early 30s, second-floor rented flat (landlord allows cats and small dogs), no garden but a park 5 minutes away, no kids, no allergies. We want a companion that's affectionate."
      time_available: "We both work hybrid, so someone is home 4 days out of 5. Out maybe 8 hours on the other day. A couple of weekends away a month."
      budget: "about 600 euros to start, 100 a month"
      experience: "I had cats growing up, my partner never had pets."
    assert:
      - {type: contains, value: "## Shortlist"}
      - {type: llm-rubric, value: "Shortlists 3 to 5 realistic options such as adult rescue cats (possibly a pair), a small adult rescue dog with a dog sitter plan, or bonded small animals, each with time, space, lifespan and cost ranges in euros, flags the weekends away as a cost or care need, and gives a pre-commitment checklist including checking the lease in writing."}
  - name: edge-child-allergy-wants-dog
    vars:
      household: "Family of four in a house with a garden. My 8-year-old son has a cat and dog allergy (sneezing, itchy eyes, no asthma). The kids are desperate for a dog and someone told us to get a hypoallergenic labradoodle."
      time_available: "I work from home full time. Walks are no problem."
    assert:
      - {type: llm-rubric, value: "Says clearly that no breed is truly hypoallergenic, explains that lower-shedding breeds may help some people but not reliably, recommends spending extended time with the specific dog and talking to the child's doctor or allergist before committing, and offers non-furry or lower-risk alternatives alongside a cautious dog route, without promising the labradoodle will be safe."}
  - name: negative-long-days-husky
    vars:
      household: "Single, studio flat in the city, no outdoor space."
      time_available: "I work 11-12 hour shifts, often 6 days a week, and travel for work about one week a month."
      experience: "Never had a pet. I really want a husky puppy."
    assert:
      - {type: llm-rubric, value: "Kindly but plainly says a husky puppy, and probably any dog, would not be cared for well with these hours and travel, explains why in terms of the dog's needs, and either offers low-need options that genuinely fit (if any) or alternatives such as fostering, volunteering or dog-sharing, without shortlisting a husky."}
