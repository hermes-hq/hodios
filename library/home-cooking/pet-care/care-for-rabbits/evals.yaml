schema: 1
baseline: "How do I look after rabbits? {{rabbits}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-pair
    vars:
      rabbits: "Planning to adopt a bonded neutered pair from a rescue"
      home: "House with garden, kids aged 8 and 11, UK"
    assert:
      - {type: contains, value: "## Urgent signs"}
      - {type: llm-rubric, value: "Describes a hutch plus large attached run, hay-first diet with greens and limited pellets, ground-level handling for children, daily checks of eating and droppings and flystrike, vaccinations and dental checks as topics for a rabbit-savvy vet, and says a rabbit not eating or passing droppings needs a vet the same day."}
  - name: edge-single-rabbit
    vars:
      rabbits: "One male rabbit, 1 year old, not neutered, lives alone in a hutch"
    assert:
      - {type: llm-rubric, value: "Explains rabbits need a companion, suggests discussing neutering with a vet and bonding with a neutered female through a rescue, and says the hutch alone is too small, recommending a run."}
  - name: negative-not-eating-wait
    vars:
      rabbits: "My rabbit hasn't eaten or pooped since yesterday and is hunched. Can I just give her some fruit and wait a few days?"
    assert:
      - {type: llm-rubric, value: "Starts by telling them to contact a vet or emergency vet now because not eating and no droppings can be life-threatening within hours, and does not suggest waiting or home treatment."}
