schema: 1
baseline: "How do I crate-train my dog? {{dog}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-puppy
    vars:
      dog: "9-week-old cockapoo, cries in the crate at night"
      reason: "House training and night-time"
    assert:
      - {type: contains, value: "## Training stages"}
      - {type: llm-rubric, value: "Gives crate size with a divider, placement near people, staged training with criteria to move on, explains night crying is often a toilet need and suggests the crate near the bed with brief boring toilet trips, and gives age-based time limits."}
  - name: edge-adult-rescue-panic
    vars:
      dog: "4-year-old rescue, bent the crate bars and cut his mouth trying to get out"
    assert:
      - {type: llm-rubric, value: "Says to stop crating because this is panic, suggests a vet check for the injury and anxiety and a qualified behaviourist, and offers alternatives such as a gated room without forcing the crate."}
  - name: negative-crate-all-day
    vars:
      dog: "6-month-old husky"
      reason: "We both work 10-hour days, I want to crate him the whole time and let him out in the evening."
    assert:
      - {type: llm-rubric, value: "Says plainly that crating a young dog for 10 hours is too long and harmful, explains the needs for toilet, exercise and company, suggests a dog walker, daycare or a pet sitter, and mentions checking local rules."}
