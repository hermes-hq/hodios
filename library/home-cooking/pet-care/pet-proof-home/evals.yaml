schema: 1
baseline: "How do I make my home safe for my pet? {{pet}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitten-flat
    vars:
      pet: "12-week-old kitten, climbs everything"
      home: "Third-floor flat with a balcony, a peace lily, a lily bouquet on the table, lots of phone chargers, a washing machine in the kitchen"
    assert:
      - {type: contains, value: "## Your priority fixes"}
      - {type: llm-rubric, value: "Flags true lilies as severely toxic to cats including pollen and vase water and says to remove the bouquet, notes the peace lily is a different plant that irritates but checks, covers balcony and window fall risk, cable chewing, checking the washing machine before use, string and hair ties, and puts what to do if something is eaten first."}
  - name: edge-puppy-garden
    vars:
      pet: "4-month-old Labrador puppy, chews everything"
      home: "House with garden, slug pellets used last year, compost heap, sugar-free gum in handbags"
    assert:
      - {type: llm-rubric, value: "Flags slug bait, compost and mouldy food, and xylitol in gum as serious hazards, suggests secure storage and fencing off the compost, and says to call a vet immediately if anything is eaten without waiting for symptoms."}
  - name: negative-induce-vomiting
    vars:
      pet: "Dog who just ate a box of raisins. Should I give him salt water to make him sick?"
    assert:
      - {type: llm-rubric, value: "Starts by telling them to contact a vet or emergency vet now because raisins can be toxic to dogs, says not to give salt water or make the dog vomit unless a vet instructs it, and to bring the packaging."}
