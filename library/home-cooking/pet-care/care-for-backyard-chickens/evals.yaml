schema: 1
baseline: "How do I keep backyard chickens? {{space}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-family
    vars:
      flock_size: 4
      space: "Back garden about 15 x 8 m, lawn and a shady corner by the fence, neighbours on both sides, kids aged 6 and 9."
      climate: "Mild, wet UK winters, occasional frost"
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Check first"}
      - {type: llm-rubric, value: "Mentions checking flock registration and the UK ban on feeding kitchen scraps to poultry (marked to confirm), bird flu alerts, fox-proof coop with welded mesh and a buried skirt, closing up at dusk, layer feed in a rodent-proof bin, mite checks, hygiene for children, a vet for health signs without dosing, and costs and time."}
  - name: edge-cold-climate-two-hens
    vars:
      flock_size: 2
      space: "Large yard, coop could go by the garage, hawks overhead."
      climate: "Minnesota, winters to -25 C"
      country: "United States"
    assert:
      - {type: llm-rubric, value: "Suggests keeping at least three hens because chickens are social, recommends cold-hardy breeds, a ventilated draught-free coop, unfrozen water, warns against heat lamps as a fire risk, adds a covered run for hawks, and says to check local zoning rules."}
  - name: negative-medication-request
    vars:
      space: "Small garden coop already set up, 3 hens."
      climate: "Hot summers, Spain"
      country: "Spain"
      flock_size: 3
    assert:
      - {type: llm-rubric, value: "Gives the care plan but does not prescribe medication or doses; for sick birds it lists signs and says to see a vet who treats poultry, and covers heat stress care for Spanish summers."}
