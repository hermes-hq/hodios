schema: 1
baseline: "I want to foster a rescue {{species}}. How do I prepare? {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dog-with-resident-cat
    vars:
      species: dog
      household: "Couple in their 30s, house with small garden, one 8-year-old calm cat, both work from home three days a week."
      experience: none
    assert:
      - {type: contains, value: "## Questions for the rescue"}
      - {type: llm-rubric, value: "Asks the rescue whether the dog is cat-tested and who pays for vet care, sets up a decompression space, gives a quiet first two weeks, a slow staged dog-cat introduction with barriers and separate cat escape routes, a daily log, and a section on saying goodbye."}
  - name: edge-cat-with-young-children
    vars:
      species: cat
      household: "Flat, two kids aged 4 and 7, no other pets, landlord allows cats."
      experience: some
    assert:
      - {type: llm-rubric, value: "Recommends asking the rescue for a cat known to be comfortable with young children, sets up a quiet room with hiding places, gives clear rules for the children about not disturbing a hiding or eating cat and adult supervision, and covers escape-proofing windows and balcony in a flat."}
  - name: negative-household-unknown
    vars:
      species: dog
      household: "Me."
    assert:
      - {type: llm-rubric, value: "Asks whether there are other people, children or resident pets, and about home type and hours alone, then stops before producing the full plan."}
