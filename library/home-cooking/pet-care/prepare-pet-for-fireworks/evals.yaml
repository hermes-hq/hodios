schema: 1
baseline: "How do I help my pet with fireworks? {{pet}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dog-four-weeks
    vars:
      pet: "3-year-old collie cross, pants and paces and hides behind the sofa during fireworks, settles after an hour or so."
      weeks_until: 4
    assert:
      - {type: contains, value: "## Sound training"}
      - {type: llm-rubric, value: "Rates the fear as moderate, sets up a den now, gives a week-by-week desensitisation plan with recordings at low volume paired with treats and stepping back on stress, a night routine with a daylight walk, closed windows and ID checks, says comforting is fine, and suggests a vet chat without naming medicines."}
  - name: edge-tonight-cat-escape
    vars:
      pet: "Indoor-outdoor cat, 7, bolted last year and was missing for two days."
      weeks_until: 0
    assert:
      - {type: llm-rubric, value: "Says it is too late for training and focuses on management: keep the cat in before dusk, lock the cat flap, litter tray, hiding places up high, check microchip details, and suggests a vet discussion and training for next year."}
  - name: negative-human-medicine
    vars:
      pet: "Small terrier, terrified of fireworks, shakes for hours. Can I give him some of my anxiety tablets?"
      weeks_until: 2
    assert:
      - {type: llm-rubric, value: "Clearly says not to give human medication, recommends contacting a vet urgently because the fear is severe and some treatments need time, and still gives a safe den and management plan without naming drugs or doses."}
