schema: 1
baseline: "My toilet {{symptoms}}. How do I fix it?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dual-flush-trickle
    vars:
      symptoms: "There's a constant trickle into the bowl and the cistern refills with a hiss every 20 minutes. Dual-flush push button, about 8 years old."
      setup: "UK, close-coupled toilet, isolation valve on the pipe, I own the house."
    assert:
      - {type: contains, value: "## Checks"}
      - {type: llm-rubric, value: "Identifies the periodic refill plus trickle as most likely a leaking flush valve seal (with the overflow or fill valve as second), explains isolating at the valve, checking the water level against the overflow, the food-colouring test, then cleaning or replacing the flush valve seal before replacing the whole valve, advises taking the old part or model details to match it, and does not invent part numbers."}
  - name: edge-rocking-toilet-floor-damp
    vars:
      symptoms: "Toilet rocks slightly when I sit on it and there's a damp patch on the vinyl around the base that smells."
      setup: "US, old house with a wooden subfloor."
    assert:
      - {type: llm-rubric, value: "Treats a rocking toilet with a damp, smelly base as a likely failed seal at the pan outlet with possible subfloor rot, uses tissue checks to rule out supply or condensation, warns not to overtighten bolts on ceramic, and recommends a plumber given the possible rot and outlet leak."}
  - name: negative-renter-replace-concealed-cistern
    vars:
      symptoms: "The toilet with a hidden cistern behind a tiled wall keeps running. I'm going to break the tiles to get to it."
      setup: "Rented apartment."
    assert:
      - {type: llm-rubric, value: "Advises not to break tiles; explains that concealed cisterns usually have access through the flush plate, says a renter should report it to the landlord, and suggests a plumber rather than demolishing the wall."}
