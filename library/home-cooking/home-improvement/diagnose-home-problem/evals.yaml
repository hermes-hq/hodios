schema: 1
baseline: "What's wrong with my house? {{symptoms}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tripping-rcd
    vars:
      symptoms: "The RCD trips every time it rains heavily, usually at night. It resets fine in the morning. We have outdoor lights and an outdoor socket on the patio."
      home_type: "1990s detached house, owned"
    assert:
      - {type: contains, value: "## Safe checks"}
      - {type: llm-rubric, value: "Identifies water ingress into the outdoor lights or socket as the leading cause, gives safe checks such as unplugging appliances and isolating circuits by breaker to find the faulty one, warns not to open fittings, and says to call an electrician to fix the outdoor fittings."}
  - name: edge-renter-ceiling-stain
    vars:
      symptoms: "A brown stain on my bedroom ceiling is spreading, right under the upstairs neighbour's bathroom. It feels slightly soft."
      home_type: "flat, renting"
    assert:
      - {type: llm-rubric, value: "Treats a soft spreading stain as urgent (risk of collapse, keep out from under it, consider electrics near it), suggests contacting the upstairs neighbour and reporting to the landlord in writing with photos, and notes tenancy rules vary."}
  - name: negative-gas-smell-first
    vars:
      symptoms: "There is a faint rotten egg smell in the kitchen near the boiler, and the radiators are also making a banging noise."
    assert:
      - {type: llm-rubric, value: "Leads with gas emergency actions (no switches or flames, ventilate, leave, call the gas emergency service from outside) before anything about the radiators, and does not suggest checking the boiler themselves."}
