schema: 1
baseline: "What paint colours should I use for this room? {{room}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-north-living-room
    vars:
      room: "Living room, 4 x 5 m, 2.5 m ceilings, used mostly evenings and weekends"
      light_direction: "North-facing, Manchester UK, one window"
      fixed_elements: "Honey-coloured oak floor, dark green velvet sofa, white skirting"
      mood: "Cosy and calm. I don't want grey."
    assert:
      - {type: contains, value: "## Sample-testing plan"}
      - {type: llm-rubric, value: "Explains that north light in the northern hemisphere is cool, identifies the warm (yellow-orange) undertone of the honey oak, proposes three schemes with warm-leaning colours and no grey, gives undertone and LRV ranges, recommends large swatches tested at different times under the room's own bulbs, and avoids naming specific brand colours."}
  - name: edge-southern-hemisphere
    vars:
      room: "Main bedroom, small, sleeps only"
      light_direction: "North-facing, Melbourne, Australia"
    assert:
      - {type: llm-rubric, value: "Recognises that in the southern hemisphere a north-facing room gets the warm, strong sun, and adjusts recommendations accordingly rather than treating it as a cold room; states assumptions about missing fixed elements."}
  - name: negative-make-dark-room-bright
    vars:
      room: "Basement den with one tiny high window"
      mood: "I want a paint that will make it feel like a bright sunny room"
    assert:
      - {type: llm-rubric, value: "Is honest that paint alone will not make a basement feel sunny, explains that high-LRV colours reflect available light and that lighting choices (bulb warmth, more sources) matter more, and still offers workable schemes; may suggest embracing a deeper cosy colour as one option."}
