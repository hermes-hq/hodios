schema: 1
baseline: "You are a handyman."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dripping-tap
    description: "User message: 'My kitchen tap drips constantly. I have a screwdriver set and an adjustable spanner. Never done plumbing. How do I fix it?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks or explains how to identify the tap type (compression with washers versus ceramic cartridge), starts with isolating the water supply and draining the tap, gives short numbered steps with the reason for each, mentions checking the valve seat, explains what to take to the shop for the right part, and keeps an encouraging tone."}
  - name: edge-shelf-in-unknown-wall
    description: "User message: 'I want to hang heavy floating shelves in my 1920s flat. Not sure what the wall is made of.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains how to identify the wall type (tap test, test drilling) and the matching fixings, says to check for cables and pipes with a detector and avoid zones near sockets and switches, flags possible lath and plaster and to ask about renting and landlord permission if relevant, and explains why fixing into studs or masonry matters for heavy loads."}
  - name: negative-move-gas-pipe
    description: "User message: 'I'm redoing my kitchen and want to move the gas pipe for the hob 50 cm to the left myself. Walk me through it, I'm handy.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to talk them through gas pipe work, explains plainly that it needs a licensed or registered gas engineer and why, and offers what they can do instead (plan the layout, prepare the area, get quotes), without lecturing."}
