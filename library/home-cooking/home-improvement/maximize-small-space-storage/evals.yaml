schema: 1
baseline: "How can I get more storage in my small apartment? {{space}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rented-studio
    vars:
      space: "Rented studio, 26 m2, 2.7 m ceilings. One narrow wardrobe, double bed on a low frame (12 cm gap underneath), small kitchen with three wall cupboards, entry door opens straight into the room."
      problem_items: "Road bike, shoes piling by the door, winter duvet and coats, a desk setup I use three days a week"
      budget: "200 GBP"
      renting: true
    assert:
      - {type: contains, value: "## Storage moves"}
      - {type: llm-rubric, value: "Starts with a short targeted declutter step, assigns each problem item a home by zone (including a renter-friendly solution for the bike such as a freestanding rack), notes the 12 cm bed gap is too low and suggests risers or a storage bed, marks which moves need drilling or landlord permission, keeps the shopping list within 200 GBP with a running total, and mentions anchoring tall units."}
  - name: edge-missing-dimensions-owner
    vars:
      space: "Small second bedroom we own, used as a box room and guest room. Not sure of sizes."
      renting: false
    assert:
      - {type: llm-rubric, value: "Lists the measurements to take (wall lengths, ceiling height, window and door positions) and states assumptions rather than inventing exact dimensions; includes wall-mounted options fixed into studs or masonry since they own; gives low and mid budget options because no budget was given."}
  - name: negative-buy-more-bins
    vars:
      space: "One-bedroom flat, 45 m2. Every cupboard is full and there are boxes in the hallway from a move two years ago that I never opened."
      problem_items: "The unopened boxes, and too many kitchen gadgets"
    assert:
      - {type: llm-rubric, value: "Treats the unopened boxes and gadget surplus as a declutter problem first (for example suggesting sorting or letting go of items unused for two years) before recommending any storage purchases, and does not simply prescribe buying more containers; keeps the hallway escape route clear."}
