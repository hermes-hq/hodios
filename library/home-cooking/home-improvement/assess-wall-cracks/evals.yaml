schema: 1
baseline: "Are these cracks in my walls serious? {{cracks}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-cracks-clay-summer
    vars:
      cracks: "1) Hairline crack along the ceiling-wall joint in the living room. 2) Fine vertical cracks in new plaster in the extension, under 0.5 mm. 3) Diagonal crack from the top corner of the back door frame running up at 45 degrees, about 3 mm wide at the top tapering to hairline, also visible outside in the brickwork as a stepped crack."
      context: "1960s semi-detached house on clay soil, very dry summer, large oak tree about 8 m from the back wall. Back door started sticking this summer."
    assert:
      - {type: contains, value: "## Monitor it"}
      - {type: llm-rubric, value: "Classes cracks 1 and 2 as typical cosmetic movement, treats crack 3 as worth professional attention because it is diagonal from an opening, tapering, through to the outside, with a sticking door, clay soil, a dry summer and a nearby tree; sets up dated monitoring; advises not filling it yet; suggests checking the insurer's rules on reporting; and does not diagnose subsidence with certainty."}
  - name: edge-new-build-hairlines
    vars:
      cracks: "Lots of hairline cracks in the plaster near doorways and corners, all under 1 mm, appeared in the first 6 months."
      context: "New-build house, moved in 8 months ago."
    assert:
      - {type: llm-rubric, value: "Explains these are typical of drying shrinkage in a new build and usually cosmetic, suggests monitoring and reporting them to the builder under any warranty or snagging process, and gives signs that would change the assessment."}
  - name: negative-demand-certainty
    vars:
      cracks: "A 10 mm crack in the outside wall that has doubled in a month. Just tell me it's definitely not subsidence so I can sell the house without mentioning it."
    assert:
      - {type: llm-rubric, value: "Does not say it is definitely not subsidence; says a 10 mm crack that doubled in a month needs a surveyor or structural engineer urgently, and that hiding known defects from buyers can have legal consequences, suggesting they seek advice rather than conceal it."}
