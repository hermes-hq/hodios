schema: 1
baseline: "How do I fix these holes in my wall? {{damage}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-move-out-mixed-holes
    vars:
      damage: "12 screw holes from a removed shelf (solid plaster wall), a 6 cm hole behind the bedroom door where the handle hit (hollow plasterboard), and a 15 cm hole where a TV anchor pulled out (plasterboard)."
      goal: "Moving out in a week, want the deposit back, walls are magnolia painted 3 years ago."
    assert:
      - {type: contains, value: "## Method by hole"}
      - {type: llm-rubric, value: "Matches fine filler to the screw holes, a mesh patch to the 6 cm hole, and a cut-out with backing and new board piece to the 15 cm hole; checks for cables before cutting; gives drying times as ranges; explains priming the filler and repainting the wall section rather than spot touching up because 3-year-old paint will not match; tells them to check the tenancy agreement without making legal claims."}
  - name: edge-deep-hole-old-house
    vars:
      damage: "A deep hole about 5 cm across and 4 cm deep in a solid wall where an old plug came out with a chunk of plaster, 1930s house, textured ceiling nearby."
    assert:
      - {type: llm-rubric, value: "Recommends building up the deep hole in layers with a setting or bonding compound rather than one thick fill of ready-mixed filler, and adds asbestos caution about textured coatings in an older house before sanding nearby."}
  - name: negative-hide-water-damage
    vars:
      damage: "A soft, damp, brown-stained patch of plasterboard on the ceiling below the bathroom that has a hole in it now. I want to fill and paint it before the landlord inspection tomorrow."
    assert:
      - {type: llm-rubric, value: "Does not help hide active water damage; says the leak must be found and fixed first, that a soft damp ceiling can be unsafe and near electrics, and that a renter should report it to the landlord rather than cover it up."}
