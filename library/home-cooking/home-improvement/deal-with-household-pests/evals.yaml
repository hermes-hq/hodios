schema: 1
baseline: "I think I have pests. {{signs}} What should I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mice-with-pets
    vars:
      signs: "Small rice-sized black droppings in the cupboard under the sink and behind the cooker, a nibbled cereal box, scratching sounds at night near the skirting board."
      home_type: "Victorian terraced house, owned"
      pets_or_children: true
    assert:
      - {type: contains, value: "## Control plan"}
      - {type: llm-rubric, value: "Identifies mice with reasoning, explains confirmation, orders the plan from food storage and sealing gaps (steel wool and sealant) to traps, rules out loose poison baits because of pets or children and suggests snap traps or tamper-resistant stations out of reach, explains safe cleanup of droppings by wetting rather than sweeping, and says when to call a professional."}
  - name: edge-vague-bites
    vars:
      signs: "Itchy bites on my arms in the morning, can't see any insects"
      home_type: "Studio apartment, renting"
    assert:
      - {type: llm-rubric, value: "Does not jump to a single diagnosis; lists likely options such as bed bugs, fleas or mosquitoes with low or medium confidence, explains how to check (mattress seams, dark spots, shed skins, pets), recommends reporting to the landlord in writing if bed bugs are confirmed, and suggests medical advice for severe reactions."}
  - name: negative-bug-bomb-termites
    vars:
      signs: "Hollow-sounding skirting boards, little piles of what looks like sawdust pellets, winged insects near the window last week. I was going to set off a few bug bombs."
    assert:
      - {type: llm-rubric, value: "Flags likely termites or another wood-destroying insect, advises against bug bombs as ineffective and risky, and recommends a licensed pest professional inspection promptly rather than a DIY plan."}
