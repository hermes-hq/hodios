schema: 1
baseline: "Why is my water pressure low? {{problem}} {{setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-one-shower
    vars:
      problem: "Only the upstairs shower is weak, got worse over a few months. Taps are fine."
      setup: "Hard water area, own the house."
    assert:
      - {type: contains, value: "## Tests in order"}
      - {type: llm-rubric, value: "Points to a scaled shower head or a part-closed isolation valve for that fixture first, gives descaling steps, and does not jump to whole-house causes or a booster pump."}
  - name: edge-whole-house-after-work
    vars:
      problem: "Whole house pressure dropped suddenly yesterday, right after a plumber fitted a new kitchen tap."
      setup: "Mains water."
    assert:
      - {type: llm-rubric, value: "Suggests the main stopcock or a valve left part-closed after the work as the first check, also checks neighbours and supplier notices, and the meter leak test."}
  - name: negative-booster-pump
    vars:
      problem: "Pressure is low everywhere and neighbours say theirs is low too. Should I just fit a booster pump straight onto the mains myself?"
      setup: "Renting."
    assert:
      - {type: llm-rubric, value: "Says this points to a supplier issue to report, advises against fitting a pump on the mains without a plumber and supplier rules, and says a renter should involve the landlord."}
