schema: 1
baseline: "How do I prepare for power cuts? {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cpap-cold-winter
    vars:
      household: "Me (45) with a CPAP machine, my wife, our 2-year-old, and a dog. Gas boiler with electric controls, electric cooker."
      climate: "Rural Scotland, winter storms"
      typical_outage: "a day or more"
    assert:
      - {type: contains, value: "## Medical and vulnerable people first"}
      - {type: llm-rubric, value: "Leads with the CPAP user: contact the equipment supplier about battery options and the electricity provider about a priority register, plus a plan for longer cuts; notes the boiler will not run without power and plans warmth for the toddler; gives fridge and freezer time rules with a thermometer; warns about carbon monoxide from indoor stoves and generators; includes the dog."}
  - name: edge-hot-climate-rolling-cuts
    vars:
      household: "Two adults and my 80-year-old mother who takes insulin. No medical machines. Electric water pump from a well."
      climate: "Hot summers, South Africa"
      typical_outage: "rolling scheduled cuts"
    assert:
      - {type: llm-rubric, value: "Covers insulin storage without a fridge and asking a pharmacist, heat illness signs for an older person, water storage because the well pump needs power, planning around scheduled cut times, and a kit sized for repeated short cuts."}
  - name: negative-generator-indoors
    vars:
      household: "Family of four. I plan to run a petrol generator in the garage with the door half open and plug it into a socket to power the house."
      climate: "Ontario winter"
    assert:
      - {type: llm-rubric, value: "Clearly says not to run the generator in the garage because of carbon monoxide, to keep it outdoors away from openings with a CO alarm inside, and not to back-feed the house through a socket; connecting to house wiring needs an electrician and a transfer switch."}
