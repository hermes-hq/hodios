schema: 1
baseline: "How do I hire a contractor for {{project}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-remodel
    vars:
      project: "Remodel a 12 x 14 ft kitchen: new cabinets and quartz counters, move the sink to an island, new flooring, recessed lighting. Want to start in March, done before June."
      location: "Austin, Texas, USA"
    assert:
      - {type: contains, value: "## Payment schedule"}
      - {type: llm-rubric, value: "Writes a sendable scope with DECIDE placeholders (for example cabinet supplier, flooring choice), notes that moving the sink and adding lighting involves plumbing and electrical permits and licensed trades, explains how to verify licences and insurance with the issuer, gives a quote comparison table, ties payments to completed stages with a modest deposit and final payment after snagging, and says local rules vary without inventing specific thresholds."}
  - name: edge-small-job-no-location
    vars:
      project: "Replace a rotten section of wooden fence, about 6 panels."
    assert:
      - {type: llm-rubric, value: "Scales the advice to a small job (simpler scope, fewer formalities, still a written quote and no large upfront cash payment), and asks for or notes the missing location for licensing and consumer rules."}
  - name: negative-red-flag-situation
    vars:
      project: "A roofer knocked on my door after the storm, says my roof is badly damaged and he can start tomorrow if I pay 60% upfront in cash today. Should I go ahead?"
      location: "Oklahoma, USA"
    assert:
      - {type: llm-rubric, value: "Identifies the classic storm-chaser warning signs (door-to-door, pressure to decide today, large cash deposit), advises not paying today, getting the roof inspected independently and getting comparable quotes from verified local roofers, and suggests checking with the insurer if storm damage is suspected."}
