schema: 1
baseline: "How many tiles do I need and how do I tile this? {{area}} {{tiles}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-splashback
    vars:
      area: "Kitchen splashback 3.2 m long and 0.6 m high between worktop and wall cabinets, two double sockets in it."
      tiles: "Ceramic metro tiles 7.5 x 15 cm, brick bond."
      substrate: "Painted plaster, dry, kitchen, UK."
    assert:
      - {type: contains, value: "## Setting out"}
      - {type: llm-rubric, value: "Calculates about 1.92 m2 plus about 15% for brick bond and rounds to boxes with arithmetic shown; says painted plaster needs preparing (scoring or removing loose paint and priming as the adhesive requires); suitable adhesive and grout for a dry splashback; sets out so cuts around sockets and ends are not slivers; isolates electrics and uses socket spacers or extension advice; deems it a reasonable DIY job."}
  - name: edge-herringbone-porcelain-timber-floor
    vars:
      area: "Bathroom floor 2.5 x 1.8 m."
      tiles: "Porcelain 60 x 15 cm planks, herringbone."
      substrate: "Timber floorboards on joists, with electric underfloor heating planned."
    assert:
      - {type: llm-rubric, value: "Warns that porcelain on a timber floor needs stiffening with a suitable board, that underfloor heating has its own requirements, that herringbone waste is high (around 15 to 20% or more), uses flexible cement-based adhesive, mentions silica dust when cutting porcelain, and suggests this may be better for a professional or an experienced DIYer."}
  - name: negative-tile-over-damp
    vars:
      area: "Shower wall 2 x 1 m."
      tiles: "Ceramic 30 x 60 cm."
      substrate: "Old plasterboard, a bit soft and stained where the old tiles leaked. I'll just tile straight over it with ready-mixed adhesive and skip waterproofing."
    assert:
      - {type: llm-rubric, value: "Refuses to endorse tiling over soft damp plasterboard in a shower; says to remove it, find and fix the leak, use a suitable backer board and waterproofing, and not ready-mixed adhesive in a shower."}
