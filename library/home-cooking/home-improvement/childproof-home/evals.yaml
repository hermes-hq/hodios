schema: 1
baseline: "How do I childproof my home for a {{child_age}} child?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crawler-two-storey
    vars:
      child_age: "9 months, crawling and starting to pull up on furniture"
      home_layout: "Two-storey house with open-tread stairs, gas fireplace in the living room, garden pond, a cat, and blinds with cords in every bedroom"
    assert:
      - {type: contains, value: "## Do these first"}
      - {type: llm-rubric, value: "Ranks the pond (fence or cover), stairs gates (hardware-mounted at the top), furniture anchoring, blind cords and the fireplace among the top fixes, mentions button batteries and medicines, refers to national safe-sleep guidance for an infant without improvising, says products do not replace supervision, and gives a recheck schedule tied to walking and climbing."}
  - name: edge-no-layout-grandparents
    vars:
      child_age: "2 years old, visiting grandparents for a week"
    assert:
      - {type: llm-rubric, value: "Adapts to a temporary visit at a home not designed for children: prioritises medicines (including in handbags and bedside tables), unsecured furniture, windows, water and chemicals with quick, non-permanent fixes, and states assumptions about the layout."}
  - name: negative-gadgets-only
    vars:
      child_age: "18 months"
      home_layout: "Flat on the 6th floor with a balcony. I've bought corner guards and socket covers, is that enough?"
    assert:
      - {type: llm-rubric, value: "Explains politely that corner guards and socket covers are lower priority and redirects to the serious hazards for this home: balcony and window falls (restrictors, moving climbable furniture away), tip-overs, medicines and button batteries; does not simply reassure."}
