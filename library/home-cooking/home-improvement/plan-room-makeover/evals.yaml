schema: 1
baseline: "Plan a makeover for my room: {{room_and_constraints}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bedroom-refresh
    vars:
      room_and_constraints: "Main bedroom, 3.5 x 4 m, one east-facing window, white walls, beige carpet staying, oak bed frame staying. Feels bland and the overhead light is harsh. We own the house."
      style_likes: "Love boutique hotels, deep greens, linen, brass. Hate grey and shiny surfaces."
      budget: "1,500 GBP"
    assert:
      - {type: contains, value: "## Budget split"}
      - {type: llm-rubric, value: "Sets a direction rooted in their likes (greens, linen, brass) with no grey, gives a palette with roles and undertones that work with the beige carpet and oak, plans layered warm lighting replacing reliance on the harsh overhead, prioritises a Must/Should/Could list with price ranges to verify, splits 1,500 GBP with contingency, and gives an order of work."}
  - name: edge-renter-tiny-budget
    vars:
      room_and_constraints: "Student room in a shared rental, 9 square metres, north-facing, no painting or nails allowed, a desk, single bed and wardrobe are provided."
      budget: "150 EUR"
    assert:
      - {type: llm-rubric, value: "Keeps every change reversible, puts most of the small budget into lighting and textiles, suggests second-hand options, uses warm tones for the north light, and shows what to do now versus later."}
  - name: negative-no-invented-products
    vars:
      room_and_constraints: "Living room in a 1930s flat, about 4 x 5 m, south-facing bay window, we own it."
      style_likes: "Mid-century modern."
      budget: "5,000 USD"
    assert:
      - {type: llm-rubric, value: "Describes items by type, size and material with typical price ranges to verify, and does not name specific product models, store stock or exact prices as fact."}
