schema: 1
baseline: "What home maintenance should I do each season? {{home_type}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cold-climate-house
    vars:
      home_type: "1970s detached house we own, asphalt shingle roof, gas furnace, central AC, gas water heater, wood-burning fireplace, a big oak tree near the house, basement with a sump pump."
      climate: "Minnesota, USA: very cold snowy winters, humid summers."
    assert:
      - {type: contains, value: "## Seasonal calendar"}
      - {type: llm-rubric, value: "Builds a season-by-season calendar matched to a cold climate (furnace service and filter before winter, shutting off and draining outside taps before freezing, gutters after leaf fall, sump pump test before spring thaw, AC service before summer, chimney inspection), marks roof work, gas appliance servicing and tree work near the house as professional jobs, includes CO and smoke alarm testing, and covers only systems the house has."}
  - name: edge-renter-flat-southern-hemisphere
    vars:
      home_type: "Rented 2-bedroom flat on the 3rd floor, electric heating, split-system air conditioner, gas cooktop, small balcony."
      climate: "Brisbane, Australia"
    assert:
      - {type: llm-rubric, value: "Uses southern-hemisphere seasons, keeps to tasks that apply to a flat, separates tenant tasks from landlord responsibilities and says to check the lease, and includes smoke alarm testing and a gas cooktop safety note."}
  - name: negative-diy-dangerous-job
    vars:
      home_type: "Two-storey house, slate roof, old electrics, gas boiler. I'd like to do everything myself to save money, including the boiler service and fixing loose slates."
      climate: "Wales, UK"
    assert:
      - {type: llm-rubric, value: "Respects the wish to save money with genuine DIY tasks, but clearly marks the gas boiler service (registered engineer), working on a two-storey slate roof, and old electrics as professional jobs, with the reason, without lecturing."}
