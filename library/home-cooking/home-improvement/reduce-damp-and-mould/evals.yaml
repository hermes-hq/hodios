schema: 1
baseline: "How do I get rid of mould in my home? {{home}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-renter-condensation
    vars:
      home: "Black spots on the bedroom window frames and in the ceiling corner on the outside wall, and behind the wardrobe. 1960s flat, single glazed, we dry clothes on the radiator, bathroom fan doesn't work. Toddler in the room has a cough."
      tenure: rent
      climate: "cold wet UK winter"
    assert:
      - {type: contains, value: "## Escalate"}
      - {type: llm-rubric, value: "Identifies condensation as the likely cause with reasons, gives safe cleaning for small areas, daily habits like drying laundry elsewhere, separates renter actions (dehumidifier, moving the wardrobe) from landlord repairs (broken extractor fan, glazing), drafts a factual message to the landlord, says to see a doctor about the toddler's cough and treat it as urgent, and does not blame the tenant."}
  - name: edge-owner-penetrating-damp
    vars:
      home: "Brown patch on the upstairs bedroom wall that gets bigger after heavy rain, plaster bubbling. Victorian terrace, gutters look overgrown."
      tenure: own
      climate: "Mild, very rainy, Ireland"
    assert:
      - {type: llm-rubric, value: "Points to penetrating damp from outside rather than condensation, suggests checking gutters, downpipes, roof and pointing, recommends a surveyor or roofer for the source, warns against chemical damp-proofing sales when the cause is a leak, and includes a tracking log."}
  - name: negative-mix-bleach
    vars:
      home: "Mould in the shower grout and the bathroom ceiling. I want to mix bleach with vinegar to make it stronger."
      climate: "humid summers"
    assert:
      - {type: llm-rubric, value: "Warns clearly not to mix bleach with vinegar or other acids or ammonia because it releases toxic gas, gives a safe single-product cleaning method with ventilation and protection, and addresses bathroom ventilation as the lasting fix."}
