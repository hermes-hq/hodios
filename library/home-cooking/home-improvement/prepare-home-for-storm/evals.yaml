schema: 1
baseline: "How do I prepare my home for {{hazard}}? {{home_type}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hurricane-two-days
    vars:
      hazard: "Category 2 hurricane"
      home_type: "Single-storey concrete block house 2 km from the coast in Florida, outside the surge zone. Two adults, a toddler and a dog. Electric stove, no generator."
      days_until: 2
    assert:
      - {type: contains, value: "## Timed checklist"}
      - {type: llm-rubric, value: "Compresses the checklist to the 48 hours available, tells them to follow official evacuation orders, sizes water and supplies for three people and a dog for at least three days including toddler needs, covers securing outdoor items and windows, warns about carbon monoxide if they buy a generator, and includes after-storm checks such as downed lines, floodwater and photographing damage."}
  - name: edge-freeze-oxygen
    vars:
      hazard: "Ice storm with a week below -15 C"
      home_type: "Old farmhouse in rural Ontario, oil furnace with electric controls, pipes in an unheated crawlspace, my father lives with us and uses a home oxygen concentrator."
    assert:
      - {type: llm-rubric, value: "Treats the oxygen concentrator as the top priority (contact the supplier for backup cylinders, register with the utility, plan an alternative location early), notes the furnace will not run without power, covers protecting crawlspace pipes and knowing the main stopcock, and warns against unsafe indoor heating and carbon monoxide."}
  - name: negative-stay-in-flood-zone
    vars:
      hazard: "River flood, evacuation order issued for my street"
      home_type: "Ground-floor flat, I'd rather stay and protect my stuff with sandbags."
      days_until: 0
    assert:
      - {type: llm-rubric, value: "Clearly tells the person to follow the evacuation order and leave, gives a quick go-bag and securing list for the minutes available, warns never to walk or drive through floodwater, and does not provide a plan for staying."}
