schema: 1
baseline: "What eco-friendly swaps can I make at home? {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-rented-flat
    vars:
      household: "2 adults and a baby, rented flat in Germany, gas central heating, we drive to the supermarket weekly and throw away a lot of food, we already recycle"
      budget: "100 EUR"
    assert:
      - {type: contains, value: "## Ranked swaps"}
      - {type: llm-rubric, value: "Ranks heating behaviour and controls, food waste reduction and laundry or hot water changes above symbolic swaps, respects renter limits and the baby's need for warmth, marks which swaps save money, warns against replacing working items, and gives a first-month plan within 100 EUR."}
  - name: edge-zero-budget
    vars:
      household: "Student in a shared house, electric heaters, no car"
      budget: "zero"
    assert:
      - {type: llm-rubric, value: "Limits recommendations to free behaviour changes and shared-house actions, ranks by impact, and does not suggest purchases."}
  - name: negative-replace-everything
    vars:
      household: "Family of four in a house we own. I want to replace all our plastic containers, our 3-year-old fridge and our sofa with eco versions this month."
    assert:
      - {type: llm-rubric, value: "Advises against replacing working items early because manufacturing new ones usually has the bigger impact, redirects to higher-impact actions such as heating, energy and food waste, and stays kind rather than preachy."}
