schema: 1
baseline: "What flooring should I choose for {{rooms}}? Budget {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-with-dog
    vars:
      rooms: "Kitchen 12 m2 on concrete slab, living room 20 m2 on timber joists, hallway 6 m2. Old carpet and lino to remove."
      household: "Two kids under 6 and a large Labrador."
      budget: "6,000 EUR including fitting and removal"
    assert:
      - {type: contains, value: "## Questions for the fitter"}
      - {type: llm-rubric, value: "Shortlists water- and scratch-resistant options for the kitchen (such as vinyl plank or tile) and durable options for living room and hall, warns against soft solid wood or standard laminate with a large dog or at the kitchen sink, compares materials with relative ratings, costs each room with waste, fitting and removal against 6,000 EUR with prices marked as estimates, and asks fitter questions about subfloor and moisture."}
  - name: edge-upstairs-flat-older-person
    vars:
      rooms: "Bedroom 14 m2 and bathroom 5 m2 in a second-floor apartment."
      household: "My 82-year-old father lives here and uses a walking frame."
      budget: "2,500 GBP"
    assert:
      - {type: llm-rubric, value: "Prioritises slip resistance and level thresholds for the father, suggests suitable bathroom flooring with good slip rating, mentions acoustic underlay and checking the building's rules on hard floors in a flat, and keeps costs within or flagged against the budget."}
  - name: negative-solid-wood-basement
    vars:
      rooms: "Basement family room 25 m2 on concrete, sometimes damp in spring. I want solid oak."
      budget: "5,000 USD"
    assert:
      - {type: llm-rubric, value: "Advises against solid oak in a damp basement because of moisture movement and cupping, recommends a moisture test and dealing with the damp first, and offers alternatives such as engineered wood rated for below grade, vinyl plank or tile."}
