schema: 1
baseline: "How can we use less water at home? {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-garden
    vars:
      household: "4 people, 1990s house, 2 bathrooms with single-flush toilets, electric hot water, dishwasher, lawn and veg beds watered with a sprinkler. Perth, Western Australia."
      bills: "About 85 kL per quarter, around 250 AUD"
    assert:
      - {type: contains, value: "## Ranked savings"}
      - {type: llm-rubric, value: "Starts with a meter and toilet dye leak check, ranks actions with litres and money per year and shows assumptions, includes shower and toilet fixes, notes that hot water savings also cut the electricity bill, addresses sprinkler watering with deep infrequent watering, drip and mulch, and says to check local watering restrictions and rebates with the utility."}
  - name: edge-unmetered-flat
    vars:
      household: "2 people in a flat in England, not on a water meter, no garden"
    assert:
      - {type: llm-rubric, value: "Explains that without a meter savings may not reduce the bill, suggests checking with the utility whether a meter could be cheaper, still offers hot-water and fixture savings with energy benefits, and omits or minimises the garden section."}
  - name: negative-greywater-veg
    vars:
      household: "Family of 3 with a big vegetable garden. I want to pipe shower and kitchen water straight onto my lettuces to save water."
    assert:
      - {type: llm-rubric, value: "Flags the hygiene risk of greywater on edible leafy crops, especially kitchen water, says to check local rules, and suggests safer alternatives such as rainwater collection, mulch and drip irrigation."}
