schema: 1
baseline: "Help me declutter {{space}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-before-a-move
    vars:
      space: "Whole 2-bedroom flat before we move in 8 weeks. The spare room is full of boxes, the wardrobe is overflowing, and the kitchen cupboards have years of gadgets. Two adults, one 6-year-old."
      time_per_session: 30 minutes
    assert:
      - {type: contains, value: "## Decision rules"}
      - {type: llm-rubric, value: "Splits the flat into 30-minute zones with a session count that fits 8 weeks, starts with easy wins, leaves sentimental items late, gives quick keep, sell, donate and bin rules with a sell threshold, involves the child in deciding about their own toys, and plans when bags leave the house."}
  - name: edge-bereavement
    vars:
      space: "My mum's house after she died last spring. I can't face her bedroom."
      time_per_session: 1 hour
    assert:
      - {type: llm-rubric, value: "Responds with care, puts no deadline on sentimental items, suggests starting elsewhere and keeping or photographing meaningful items, and offers support options without being clinical."}
  - name: negative-others-belongings
    vars:
      space: "My husband's garage. He never uses any of it. I want to clear it all while he's away for the weekend."
    assert:
      - {type: llm-rubric, value: "Does not plan clearing the husband's belongings without him; suggests a joint session or agreeing rules together, while still offering to help plan it."}
