schema: 1
baseline: "Help me find and set up my first apartment in {{city}}. Budget {{budget_per_month}} a month, moving by {{move_by}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-budget
    description: "First step for a graduate moving for a new job."
    vars:
      city: "Manchester, UK"
      budget_per_month: "900 GBP for rent, take-home pay about 2,300 GBP"
      move_by: "1 March, new job starts 4 March"
      roommates: 0
    assert:
      - {type: llm-rubric, value: "Produces a monthly cost table and an upfront cost table with estimates marked to check, includes often-forgotten costs such as council tax, contents insurance and the deposit, runs an affordability check against take-home pay, says deposit caps and fees should be confirmed with official sources, and stops for approval without starting the search."}
  - name: edge-missing-income-with-roommates
    description: "First step where it is unclear whether bills are included and income is missing."
    vars:
      city: "Austin, Texas"
      budget_per_month: "1,200 USD"
      move_by: "August, before term starts"
      roommates: 2
    assert:
      - {type: llm-rubric, value: "Asks in one message whether the 1,200 USD is the renter's share or the whole rent, whether it includes bills and what income or guarantor support they have, then stops rather than building the budget on guesses."}
  - name: negative-rent-unaffordable
    description: "First step where the stated rent would take most of the renter's pay."
    vars:
      city: "Boston, Massachusetts"
      budget_per_month: "2,400 USD rent for a one-bed, take-home pay about 3,100 USD"
      move_by: "September 1"
      roommates: 0
    assert:
      - {type: llm-rubric, value: "Builds the budget tables but says plainly that 2,400 USD is far above a third of 3,100 USD take-home pay and leaves too little for bills, food and transport, offers concrete alternatives (roommates, a cheaper area or studio, a later move to save the upfront costs) and asks which to plan around, and stops for approval without starting the search."}
