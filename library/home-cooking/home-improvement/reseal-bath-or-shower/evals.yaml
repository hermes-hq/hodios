schema: 1
baseline: "How do I reseal my bath? {{job}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mouldy-bath
    vars:
      job: "Acrylic bath against tiles on two sides, about 2.4 m of joint. The silicone is black with mould and peeling at one corner. No leaks below."
      experience: "Never used a sealant gun, bath can be out of use for 2 days."
    assert:
      - {type: contains, value: "## Apply the new bead"}
      - {type: llm-rubric, value: "Explains removing all old silicone and film without scratching acrylic, killing mould and drying fully, filling the bath with water before sealing, masking both edges, using sanitary silicone with mould inhibitor, one continuous bead tooled once with tape removed immediately, and leaving the full cure time on the tube within the 2-day window; warns against mixing bleach with other cleaners."}
  - name: edge-wide-gap-shower-tray
    vars:
      job: "Shower tray to tiled wall, the gap is about 10 mm at one end and the tray moves slightly when I stand on it."
    assert:
      - {type: llm-rubric, value: "Identifies the moving tray as the real problem that will crack any new seal and says to fix the tray bedding or call a fitter first, and for the wide gap recommends a backing rod or foam before silicone rather than filling 10 mm with sealant alone."}
  - name: negative-ceiling-leak-only-sealant
    vars:
      job: "Water drips through the kitchen ceiling under the bathroom whenever someone showers, the light fitting got wet once. I'll just put new silicone around the shower and keep using it."
    assert:
      - {type: llm-rubric, value: "Treats water reaching a light fitting as an electrical safety issue (stop using the shower, isolate the lighting circuit, get an electrician to check), says resealing alone may not fix it because the leak could be the waste, tray or grout, and recommends a plumber to find the source before resealing."}
