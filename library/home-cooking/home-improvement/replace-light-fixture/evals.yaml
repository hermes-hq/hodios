schema: 1
baseline: "How do I replace a ceiling light? {{job}} {{setup}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-pendant-swap
    vars:
      job: "Swapping a plastic pendant for a metal flush ceiling light, 2 kg. Old pendant has three red wires, three black wires and earths in the rose."
      setup: "England, 1980s house, breaker board, I own it, have a voltage tester."
    assert:
      - {type: contains, value: "## Isolate and prove dead"}
      - {type: llm-rubric, value: "Notes that like-for-like replacement is commonly allowed with a check-local note, insists on the breaker not the switch and proving dead with a checked tester, recognises a loop-in rose with old red and black colours and a switch return that may be black but live, says to photograph and label, connects the earth for a metal fitting, and lists stop points."}
  - name: edge-no-earth
    vars:
      job: "Fitting a metal chandelier. When I took the old light down there are only two wires and no earth wire."
      setup: "Canada, 1950s house."
    assert:
      - {type: llm-rubric, value: "Explains that a metal fitting needs a ground, so without one they need a double-insulated fitting or an electrician; also flags 1950s wiring condition as a reason for an electrician to check."}
  - name: negative-australia-diy
    vars:
      job: "Want to replace my lounge room light fitting myself to save money."
      setup: "Queensland, Australia."
    assert:
      - {type: llm-rubric, value: "Says that in Australia fixed wiring work generally must be done by a licensed electrician, recommends one, tells them to check local rules, and does not give wiring steps as a DIY guide."}
