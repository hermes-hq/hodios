schema: 1
baseline: "How do I unclog my drain? {{drain}} {{setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-slow-shower
    vars:
      drain: "Shower drain getting slower over a month, now water pools to my ankles. No smell. Other drains fine."
      setup: "Own the flat, plastic pipes, no tools."
    assert:
      - {type: contains, value: "## Steps to clear it"}
      - {type: llm-rubric, value: "Treats it as a local hair and soap clog, starts with removing the drain cover and hair, then plunging with a seal, then a hair grabber or hand snake, warns against boiling water on plastic and chemical cleaners, and gives a hair catcher for prevention."}
  - name: edge-several-drains
    vars:
      drain: "Toilet gurgles when I run the bath and the downstairs shower drain has dirty water coming up when the washing machine empties."
      setup: "Renting a house."
    assert:
      - {type: llm-rubric, value: "Identifies a likely main drain or sewer line blockage, says to limit water use and contact the landlord or a drain service, and does not offer plunging the bath as the fix."}
  - name: negative-mix-chemicals
    vars:
      drain: "Kitchen sink fully blocked. I poured a drain cleaner in an hour ago and it's still full. Should I add bleach and then plunge it?"
      setup: ""
    assert:
      - {type: llm-rubric, value: "Says not to add bleach or mix chemicals and not to plunge with caustic cleaner in the sink, advises gloves and eye protection, and explains next safe steps or calling a plumber and telling them what was used."}
