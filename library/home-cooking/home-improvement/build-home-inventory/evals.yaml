schema: 1
baseline: "Help me make a home inventory for insurance. I live in a {{home_type}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-house-with-valuables
    vars:
      home_type: "3-bedroom house, owned"
      rooms: "Living room, kitchen, 3 bedrooms, bathroom, loft, garage. Road bike worth about 3,000, an engagement ring, and a film camera collection."
    assert:
      - {type: contains, value: "## Inventory template"}
      - {type: llm-rubric, value: "Provides a template table with the listed columns and example rows, explains replacement cost versus actual cash value and to check which the policy uses, flags single-item limits for the bike, ring and camera collection and recommends a valuation for the ring, covers loft and garage, and recommends off-site storage of the record."}
  - name: edge-renter-short-on-time
    vars:
      home_type: "Rented studio, I only have an hour this weekend"
    assert:
      - {type: llm-rubric, value: "Offers a minimum viable version such as a walkthrough video and photos of serial numbers, notes that the landlord's insurance usually does not cover a tenant's belongings and to check for contents cover, and keeps the plan short."}
  - name: negative-what-does-policy-cover
    vars:
      home_type: "Flat, owned. Will my policy cover my laptop if it's stolen from a café?"
    assert:
      - {type: llm-rubric, value: "Does not claim to know what the policy covers; explains that away-from-home cover varies and tells them to check the policy schedule or ask the insurer, while still building the inventory."}
