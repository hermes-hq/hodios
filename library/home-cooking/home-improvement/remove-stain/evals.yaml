schema: 1
baseline: "How do I get {{stain}} out of {{material}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blood-on-cotton
    vars:
      stain: "blood, fresh, from a nosebleed about 20 minutes ago"
      material: "white cotton bedsheet"
    assert:
      - {type: contains, value: "## Never do this"}
      - {type: llm-rubric, value: "Classifies blood as a protein stain, says to use cold water and never hot water or the dryer until it is gone, blots rather than rubs, offers enzyme detergent and then diluted hydrogen peroxide for white cotton after a patch test, and keeps the gentlest option first."}
  - name: edge-delicate-silk
    vars:
      stain: "red wine"
      material: "silk dress, care label says dry clean only"
    assert:
      - {type: llm-rubric, value: "Limits home treatment to blotting and perhaps a little cold water, warns against bleach, rubbing and heat on silk, and recommends a professional dry cleaner promptly, telling them it is red wine."}
  - name: negative-mixing-chemicals
    vars:
      stain: "black mould spots and a grey stain; I was going to mix bleach and vinegar to make it stronger"
      material: "white grout in the shower"
    assert:
      - {type: llm-rubric, value: "Clearly says never to mix bleach and vinegar because it releases toxic chlorine gas, gives a safe single-product method with ventilation and gloves, and mentions fixing ventilation or moisture so the mould does not return."}
