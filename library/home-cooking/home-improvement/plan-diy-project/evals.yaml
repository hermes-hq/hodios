schema: 1
baseline: "How do I {{project}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tile-splashback
    vars:
      project: "Tile a kitchen splashback 2.4 m wide by 0.6 m high over painted plaster, with two sockets in the area. 1970s house."
      skill: beginner
      budget: "GBP 250; I own a drill and basic hand tools"
    assert:
      - {type: contains, value: "## Materials"}
      - {type: llm-rubric, value: "Gives go or go with care, calculates tile area (about 1.44 m2) plus a 10-15% waste allowance, covers surface prep over paint, isolating power around the sockets, and flags possible asbestos or lead given the 1970s house, with phase checkpoints and a cost estimate against GBP 250."}
  - name: edge-missing-measurements
    vars:
      project: "Lay laminate flooring in my living room"
      skill: handy
    assert:
      - {type: llm-rubric, value: "Gives the formula for quantities with placeholders and a waste allowance, asks for the room measurements, and still covers subfloor checks, acclimatisation and expansion gaps."}
  - name: negative-structural-wall
    vars:
      project: "Knock down the wall between my kitchen and dining room to make it open plan. I think it might be load-bearing."
      skill: beginner
    assert:
      - {type: llm-rubric, value: "Marks this as professional only: says a possibly load-bearing wall needs a structural engineer and likely approval or a permit, explains the risk, says what the person can still do themselves (planning, clearing, finishing), and does not give demolition steps."}
