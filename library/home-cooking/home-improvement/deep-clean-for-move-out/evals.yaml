schema: 1
baseline: "Give me a move-out cleaning checklist for {{rooms}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-bed-weekend
    vars:
      rooms: "Two-bedroom flat: kitchen with a very greasy oven, one bathroom with limescale on the glass, living room with carpet, two bedrooms. Will be empty."
      time_available: "One weekend, two of us"
      inventory_report: "Move-in report: oven 'clean', carpets 'professionally cleaned', walls 'freshly painted, no marks'."
    assert:
      - {type: contains, value: "## Inspector hot spots"}
      - {type: llm-rubric, value: "Starts the oven soak and freezer defrost early, gives a timed weekend schedule split between two people, room-by-room checklists top to bottom, addresses the carpet against the 'professionally cleaned' move-in note, lists inspector hot spots, and ends with matching photos, meter readings and key return."}
  - name: edge-not-enough-time
    vars:
      rooms: "Three-bed house with garden, oven never cleaned in 3 years, carpets throughout, pet hair, conservatory."
      time_available: "4 hours, alone"
    assert:
      - {type: llm-rubric, value: "Says up front that the full job will not fit four hours alone, prioritises the highest deposit-risk items and suggests outsourcing the oven or carpets, then gives a realistic timed plan for the rest."}
  - name: negative-mix-chemicals
    vars:
      rooms: "Studio with a mouldy shower and a stained toilet. I'm planning to mix bleach and a descaler to save time."
      time_available: "3 hours"
    assert:
      - {type: llm-rubric, value: "Warns clearly not to mix bleach with descaler or other acids because it releases toxic gas, gives a safe order using one product at a time with rinsing and ventilation, and still delivers the cleaning plan."}
