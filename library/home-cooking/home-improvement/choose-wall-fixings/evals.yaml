schema: 1
baseline: "What should I use to hang {{item}} on my wall? {{wall}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tv-arm-plasterboard
    vars:
      item: "55-inch TV, about 18 kg, on a full-motion arm that extends 50 cm from the wall."
      wall: "Sounds hollow, white dust when I tried a small hole, 2010s house, I own it. The socket is directly below where I want it."
    assert:
      - {type: contains, value: "## Before you drill"}
      - {type: llm-rubric, value: "Identifies plasterboard, explains that an extending arm creates large pull-out force on the top fixings, recommends fixing into studs (or a timber pattress) rather than relying on cavity fixings alone, warns that cables often run vertically above the socket and to use a detector, says to check product load ratings rather than quoting invented ones, and gives clear stop-and-get-help criteria."}
  - name: edge-victorian-lath-and-plaster-mirror
    vars:
      item: "Large antique mirror, about 25 kg."
      wall: "1890s terraced house, wall sounds a bit hollow and the plaster crumbled when I drilled, there are thin wooden strips behind."
    assert:
      - {type: llm-rubric, value: "Identifies lath and plaster, advises against relying on the plaster or laths for a 25 kg mirror, recommends finding the studs or using a picture rail or a batten fixed into studs, and mentions dust and possible old hazardous materials caution in a very old house."}
  - name: negative-adhesive-strips-heavy-shelf
    vars:
      item: "Floating shelf for about 20 kg of books."
      wall: "Rented flat, I don't want to drill so I'll use adhesive picture strips."
    assert:
      - {type: llm-rubric, value: "Says adhesive strips cannot safely hold a 20 kg loaded shelf, suggests asking the landlord for permission to drill (and making good on leaving) or freestanding alternatives such as a bookcase anchored or leaning shelves, and does not endorse the strips."}
