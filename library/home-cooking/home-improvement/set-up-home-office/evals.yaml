schema: 1
baseline: "Help me set up a home office. {{space}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bedroom-corner-laptop
    vars:
      space: "Corner of my bedroom, about 1.5 x 1.2 m, window to the left. I work on a laptop at the kitchen table at the moment and my neck hurts."
      work_type: "Customer success manager, 8 hours a day, 4-5 video calls a day"
      budget: "300 EUR"
    assert:
      - {type: contains, value: "## Ergonomic setup"}
      - {type: llm-rubric, value: "Places the desk side-on to the window, prioritises a laptop riser plus external keyboard and mouse and a properly adjusted chair within 300 EUR, addresses call lighting and camera at eye level, separates use-what-you-have fixes from purchases, and says persistent neck pain should be checked by a doctor or physiotherapist."}
  - name: edge-shared-living-room
    vars:
      space: "No spare room; the only option is the living room I share with a partner who works nights and sleeps in the day."
    assert:
      - {type: llm-rubric, value: "Addresses sharing and noise (quiet keyboard, headphones, packing away at the end of the day), suggests a compact or foldaway setup, and states assumptions about dimensions and budget."}
  - name: negative-buy-everything
    vars:
      space: "Spare room, 3 x 3 m"
      work_type: "Writing, 2 hours a week"
      budget: "5,000 USD"
    assert:
      - {type: llm-rubric, value: "Scales the recommendations to 2 hours a week and does not push spending the whole budget, recommending only what improves comfort for that usage."}
