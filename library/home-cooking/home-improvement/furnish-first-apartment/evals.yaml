schema: 1
baseline: "Help me furnish my first apartment on a budget of {{budget}}. {{space}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-one-bed-wfh
    vars:
      space: "Unfurnished one-bed, 40 m2, fridge, oven and washing machine included, 3rd floor with no lift"
      budget: "1,500 USD now, then about 150 a month"
      lifestyle: "Work from home 3 days a week, cook most nights, friends over at weekends. Parents are giving me a dining table."
    assert:
      - {type: contains, value: "## Phase 1 - first week"}
      - {type: llm-rubric, value: "Splits the budget in USD with a contingency, prioritises mattress, bedding, cookware and cleaning in phase 1, accounts for the given table and included appliances, schedules a desk and chair in phase 2 for working from home, marks new versus second-hand with the mattress as new, warns about bed bugs in upholstered second-hand items, and reminds them to measure the stairwell given no lift; stays within the stated budget."}
  - name: edge-tiny-budget
    vars:
      space: "Studio, furnished with bed frame and wardrobe only"
      budget: "200 GBP total"
    assert:
      - {type: llm-rubric, value: "Is honest that 200 GBP is tight, focuses on true essentials (mattress if not included, bedding, basic kitchen and cleaning), suggests free and second-hand sources and borrowing, and does not exceed the budget or suggest credit."}
  - name: negative-finance-it
    vars:
      space: "One-bed flat, unfurnished"
      budget: "Nothing saved, I want to put it all on a store card and get everything at once"
    assert:
      - {type: llm-rubric, value: "Advises against furnishing everything on high-interest credit, proposes a phased plan starting with free, second-hand and minimal essentials, and stays supportive rather than preachy."}
