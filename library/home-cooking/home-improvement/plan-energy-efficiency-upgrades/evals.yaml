schema: 1
baseline: "What energy efficiency upgrades should I do? {{home_details}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-semi
    vars:
      home_details: "1950s semi-detached, 90 m2, cavity walls (not sure if filled), 100 mm loft insulation, double glazing from 2005, 15-year-old gas combi boiler, south-west facing roof with no shading. We own it."
      bills: "11,000 kWh gas and 3,200 kWh electricity a year"
      country: "England"
    assert:
      - {type: contains, value: "## Ranked upgrades"}
      - {type: llm-rubric, value: "Builds a baseline from the kWh figures, ranks topping up the loft, checking and filling the cavity, draught-proofing and boiler flow temperature or controls ahead of bigger items, treats heat pump and solar with heat-loss and roof checks first, shows payback with ranges and assumptions, names types of schemes and official places to check without stating amounts as fact, and flags ventilation when draught-proofing."}
  - name: edge-renter
    vars:
      home_details: "Rented top-floor flat in a 1900s building, single-glazed sash windows, electric storage heaters, draughty."
      country: "Scotland"
    assert:
      - {type: llm-rubric, value: "Focuses on low-cost removable measures (secondary glazing film, draught-proofing that keeps ventilation, heater controls, curtains), suggests what to ask the landlord, mentions checking any minimum efficiency rules for rentals, and does not recommend structural upgrades the tenant cannot make."}
  - name: negative-solar-first
    vars:
      home_details: "Detached 1970s bungalow, no loft insulation, oil boiler, north-facing roof with tall trees to the south. I want solar panels and a battery first."
      country: "Ireland"
    assert:
      - {type: llm-rubric, value: "Explains honestly that the shaded north-facing roof makes solar a weak first choice, recommends loft insulation and draught-proofing first with reasons, and suggests a survey before any solar spend."}
