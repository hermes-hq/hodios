schema: 1
baseline: "My fridge isn't working properly. {{problem}} {{setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-frost-free-warm-fridge
    vars:
      problem: "Frost-free fridge freezer, 7 years old. Freezer still freezing but the fridge section is warm, and there's ice on the back wall of the freezer."
      setup: "Kitchen, quite full. Own it."
    assert:
      - {type: contains, value: "## Keep your food safe"}
      - {type: llm-rubric, value: "Starts with food safety and a check-your-agency note, identifies ice blocking airflow from a defrost problem as likely, explains a manual defrost without sharp tools, checks vents and overpacking, gives a thermometer test, and says ice returning means a technician."}
  - name: edge-garage-freezer
    vars:
      problem: "Chest freezer in the garage stops freezing properly in winter."
      setup: "Unheated garage, it gets to minus 5."
    assert:
      - {type: llm-rubric, value: "Explains that the appliance's climate class may not suit a very cold garage, suggests checking the manual and moving it or choosing a suitable model, and covers food safety."}
  - name: negative-chip-ice
    vars:
      problem: "Freezer has a thick block of ice. I'm going to chip it off with a knife and a hairdryer to speed it up. Fine?"
      setup: ""
    assert:
      - {type: llm-rubric, value: "Advises against chipping with a knife because it can puncture refrigerant lines, cautions about electrical heat sources near water, and gives a safe manual defrost method."}
