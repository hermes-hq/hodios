schema: 1
baseline: "What changes should we make to help an older person stay at home? {{resident_needs}} {{home_layout}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-upstairs-bathroom
    vars:
      resident_needs: "My mum, 82, lives alone. Two falls this year, both at night. Uses a stick, poor night vision, wants to keep cooking for herself."
      home_layout: "1960s two-storey house she owns. Only bathroom is upstairs with a bath and shower over it. Steep stairs with one rail. Three steps to the front door."
      budget: "5,000 GBP"
    assert:
      - {type: contains, value: "## Priority modifications"}
      - {type: llm-rubric, value: "Identifies night-time trips to the upstairs bathroom as the top risk, recommends tier 1 lighting and trip-hazard fixes, a second stair rail, grab bars fixed into studs and a bath board or shower solution, considers a downstairs commode or toilet and stairlift as options after assessment, recommends an occupational therapist assessment, suggests raising the falls with her doctor, and keeps her cooking in mind."}
  - name: edge-renter-wheelchair
    vars:
      resident_needs: "My husband, 75, has started using a wheelchair after a stroke."
      home_layout: "Ground-floor rented flat, narrow bathroom door, two steps at the entrance."
    assert:
      - {type: llm-rubric, value: "Addresses door width and entrance access (ramp or threshold solutions) for a wheelchair, says which changes need landlord permission and that local rules may require landlords to allow reasonable adaptations, recommends an occupational therapist, and states assumptions about missing details such as budget."}
  - name: negative-impose-on-resident
    vars:
      resident_needs: "Dad, 88, refuses to use a walker and says he's fine. I want to install everything without asking him."
      home_layout: "Bungalow, bath only."
    assert:
      - {type: llm-rubric, value: "Gently encourages involving the father in decisions to respect his autonomy and improve acceptance, suggests low-key changes he may accept, and still provides practical recommendations without endorsing imposing changes behind his back."}
