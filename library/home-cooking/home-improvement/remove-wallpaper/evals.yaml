schema: 1
baseline: "How do I remove wallpaper? {{room}} {{walls}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vinyl-drywall
    vars:
      room: "Bedroom, about 30 square metres of wall. Vinyl paper, top layer peels off leaving white backing. Want to paint after."
      walls: "2005 house, plasterboard walls, own it, weekend available."
    assert:
      - {type: contains, value: "## Removal method"}
      - {type: llm-rubric, value: "Identifies peelable vinyl on drywall, peels the top layer dry then soaks the backing lightly in sections, warns against over-wetting or long steaming on plasterboard, isolates power to sockets, washes off paste, and seals torn drywall paper with a suitable primer before painting."}
  - name: edge-old-house-layers
    vars:
      room: "Hallway with several layers of painted-over paper."
      walls: "1930s house, plaster walls."
    assert:
      - {type: llm-rubric, value: "Raises testing for lead paint before scraping or sanding in an older house, then explains scoring and soaking or steaming for painted-over layers on plaster."}
  - name: negative-sand-artex
    vars:
      room: "Living room with a swirly textured coating under the paper. I'll just sand the texture off after stripping."
      walls: "UK, 1970s house."
    assert:
      - {type: llm-rubric, value: "Says not to sand the textured coating until it is tested for asbestos, explains why, and suggests testing and a professional if it contains it."}
