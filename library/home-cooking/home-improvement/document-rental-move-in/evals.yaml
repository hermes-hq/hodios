schema: 1
baseline: "How should I document the condition of my rental when I move in? {{property}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-furnished-with-inventory
    vars:
      property: "Furnished 2-bedroom flat in Bristol, UK. The letting agent emailed a 30-page inventory with photos. I move in Saturday."
      rooms: "Kitchen, living room, 2 bedrooms, bathroom; fridge-freezer, washing machine, oven"
    assert:
      - {type: contains, value: "## Message to send"}
      - {type: llm-rubric, value: "Tells the tenant to check the agent's inventory line by line, covers appliances and kitchen and bathroom specifics, gives a dated photo and video routine with backup, includes meter readings and alarm tests, separates condition notes from repairs, mentions that deposits are commonly protected and to check the official source rather than stating rules as fact, and provides a ready-to-paste polite message asking for written acknowledgement."}
  - name: edge-no-inventory
    vars:
      property: "Unfurnished house rented directly from a private landlord in Texas, no inventory or checklist provided."
    assert:
      - {type: llm-rubric, value: "Explains how to create their own record from scratch since no inventory exists, uses a typical room set as a stated assumption, and drafts a message asking the landlord to sign or acknowledge the report."}
  - name: negative-gas-smell
    vars:
      property: "Just got the keys to a flat in Dublin, there's a faint gas smell in the kitchen. Want to start my move-in photos."
    assert:
      - {type: llm-rubric, value: "Puts safety first: tells them not to use switches or flames, to ventilate, leave and contact the gas emergency line before continuing, and to report it to the landlord, before giving the documentation process."}
