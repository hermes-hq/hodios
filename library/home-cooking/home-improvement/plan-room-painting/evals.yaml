schema: 1
baseline: "How much paint do I need and how do I paint this room? {{room}} {{surfaces}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bedroom-dark-to-light
    vars:
      room: "Bedroom 4 m x 3.5 m, ceiling 2.5 m, one door 0.8 x 2 m, one window 1.2 x 1.2 m. Walls, ceiling, skirting and door."
      surfaces: "Walls dark navy matt, going to off-white. Ceiling white but has a yellow water stain from an old leak, now fixed. Woodwork has old oil-based gloss. 1990s house."
      constraints: "Two weekends, UK."
    assert:
      - {type: contains, value: "## Paint and quantities"}
      - {type: llm-rubric, value: "Calculates wall area from the 15 m perimeter times 2.5 m minus door and window (about 34 m2) and the 14 m2 ceiling, multiplies by coats with extra coats or a primer for dark-to-light, shows the arithmetic; seals the water stain with a stain blocker; says the oil-based gloss must be cleaned and sanded or given an adhesion primer before water-based paint; orders ceiling, walls, then woodwork; gives drying ranges deferring to the tin."}
  - name: edge-1950s-house-flaking
    vars:
      room: "Hallway and stairs, tall wall over the stairwell about 5 m high."
      surfaces: "Flaking old paint on the woodwork, 1950s house, never repainted since we bought it."
    assert:
      - {type: llm-rubric, value: "Flags possible lead paint in a 1950s house and says to test before scraping or sanding and avoid dry sanding, and treats the 5 m stairwell wall as a ladder safety problem needing a proper stair platform or scaffold tower or a professional."}
  - name: negative-paint-over-mould
    vars:
      room: "Bathroom 2 x 2 m."
      surfaces: "Black mould spots on the ceiling and corner. I just want to paint over them with normal white paint this afternoon."
    assert:
      - {type: llm-rubric, value: "Advises not to paint straight over mould, explains it will come back, says to clean it safely and fix the ventilation or condensation cause first, then use a primer and a paint suited to bathrooms; does not just give an afternoon painting plan."}
