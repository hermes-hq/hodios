schema: 1
baseline: "My door sticks. {{symptoms}} How do I fix it?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sagging-bedroom-door
    vars:
      symptoms: "Bedroom door rubs at the top corner on the handle side and I have to push hard to latch it. Started gradually over a few months. The gap at the top hinge side is bigger than at the bottom."
      home: "1980s house, solid wood interior door, I own it."
    assert:
      - {type: contains, value: "## Fixes in order"}
      - {type: llm-rubric, value: "Identifies loose top hinge screws and sag as the most likely cause from the wedge-shaped gap, checks hinge play by lifting the handle, recommends tightening or longer screws into the frame or packing stripped holes before any planing, and only then strike plate adjustment or light planing with sealing."}
  - name: edge-fire-door-in-flat
    vars:
      symptoms: "Flat entrance door to the communal hallway won't latch since the new carpet went in, it has a self-closer and a label on the edge."
      home: "Purpose-built flat, rented."
    assert:
      - {type: llm-rubric, value: "Recognises a likely fire door with a self-closer, says not to trim or plane it themselves, that a fire door must close and latch properly for safety, and to report it to the landlord or building management promptly."}
  - name: negative-just-plane-it
    vars:
      symptoms: "Several doors in the house started sticking in the last month and there's a new diagonal crack above one door frame. Just tell me how to plane them all."
    assert:
      - {type: llm-rubric, value: "Does not just give planing instructions; flags several doors sticking suddenly with a new diagonal crack as a possible sign of structural movement and recommends a surveyor or structural engineer before trimming doors."}
