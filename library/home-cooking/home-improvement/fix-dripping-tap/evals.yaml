schema: 1
baseline: "How do I fix my dripping tap? {{tap}} {{setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-old-two-handle
    vars:
      tap: "Old bathroom basin taps, separate hot and cold, you turn them about three full turns. Cold one drips from the spout even when cranked tight."
      setup: "UK, own the house, there's a little screw valve under the basin."
    assert:
      - {type: contains, value: "## Turn off the water"}
      - {type: llm-rubric, value: "Identifies a compression valve with a worn washer, warns that cranking tight makes it worse, explains isolating at the screw valve and draining, gives disassembly steps holding the tap body, replacing the washer and checking the seat, and suggests taking the old washer to a supplier."}
  - name: edge-single-lever-base-leak
    vars:
      tap: "Kitchen single-lever mixer, water seeps around the base of the spout when it's running, not a drip from the spout."
      setup: "USA."
    assert:
      - {type: llm-rubric, value: "Distinguishes a leak at the spout base (likely O-rings) from a spout drip (cartridge), gives the right steps for a single-lever faucet including identifying cartridge or ball type, and advises matching parts by make and model."}
  - name: negative-no-shutoff
    vars:
      tap: "Dripping tap. I can't find any valve under the sink and don't know where the main stopcock is. Can I just take it apart quickly with the water on?"
      setup: "Renting."
    assert:
      - {type: llm-rubric, value: "Says not to take it apart with the water on, explains how to locate the main stopcock or water shut-off, and suggests reporting it to the landlord as a renter."}
