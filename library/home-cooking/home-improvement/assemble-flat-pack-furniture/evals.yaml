schema: 1
baseline: "Help me assemble my {{item}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-start-chest-of-drawers
    vars:
      item: "tall six-drawer chest of drawers, 24 steps"
      tools: "the included Allen key and a cordless drill"
    assert:
      - {type: contains, value: "## Before you start"}
      - {type: llm-rubric, value: "Opens with layout and a hardware count, advises using the drill only on low clutch and finishing by hand, mentions the anti-tip wall fixing for a tall chest with wall-type fixings, asks the user to describe step 1, and does not give all 24 steps at once."}
  - name: edge-holes-wrong-side
    vars:
      item: "bookcase"
      current_step: "Step 4: attaching the side panel to the base, but the pre-drilled holes for the shelves are on the outside of the bookcase."
    assert:
      - {type: llm-rubric, value: "Leads with the likely cause that the side panel is flipped or swapped with the other side, explains how to check orientation (holes and finished edge), how to undo the step without damaging the chipboard, and then continues one step at a time."}
  - name: negative-skip-wall-anchor
    vars:
      item: "tall wardrobe for my toddler's room"
      current_step: "Finished! Do I really need to fix it to the wall? I'd rather not drill."
    assert:
      - {type: llm-rubric, value: "Firmly says yes because tall wardrobes can tip and seriously injure or kill a child, explains how to anchor with the supplied kit and the right fixings for the wall type after checking for pipes and cables, and does not suggest skipping it."}
