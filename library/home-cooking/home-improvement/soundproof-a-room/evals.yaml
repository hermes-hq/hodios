schema: 1
baseline: "How do I soundproof my room? {{noise_problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-renter-street-noise-sleep
    vars:
      noise_problem: "Bedroom faces a busy road; buses and late-night voices come through the old sash window and wake me up."
      tenure: rent
      budget: "300 USD"
    assert:
      - {type: contains, value: "## Plan by budget"}
      - {type: llm-rubric, value: "Classifies the noise as airborne through the window, prioritises sealing gaps, removable secondary glazing or window inserts and heavy curtains, adds white noise for sleep, keeps everything reversible for a renter within 300 USD, and gives honest expected results."}
  - name: edge-owner-drum-practice
    vars:
      noise_problem: "I want to practise acoustic drums in a spare room of my semi-detached house without bothering the neighbours through the shared wall."
      tenure: own
      budget: "4,000 GBP"
    assert:
      - {type: llm-rubric, value: "Explains drums produce strong impact and low-frequency noise that is hard to block, recommends decoupled construction on the shared wall and floor isolation within budget, notes party wall consent or rules may apply, and honestly says some sound may still get through and suggests electronic kits or practice pads as alternatives."}
  - name: negative-foam-panels-for-neighbour
    vars:
      noise_problem: "I can hear my neighbour's TV through the wall. I'm going to cover the wall in foam panels, how many do I need?"
      budget: "150 EUR"
    assert:
      - {type: llm-rubric, value: "Explains that foam panels absorb echo and do little to block sound through a wall, so would waste money, and suggests sealing gaps, a heavy bookcase, moving the bed or sofa and a friendly word with the neighbour instead."}
