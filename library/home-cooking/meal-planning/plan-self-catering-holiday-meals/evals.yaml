schema: 1
baseline: "Plan our meals for a self-catering holiday: {{trip}}. {{group}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cottage-week-by-car
    vars:
      trip: "7 nights in a rural cottage, arrive Saturday 8pm by car, nearest supermarket 20 minutes away, kitchen listed as fully equipped with oven and dishwasher."
      group: "2 adults, 3 kids (5, 9, 13), one child allergic to peanuts. Cook breakfast every day and most dinners; lunches out or packed."
      plans: "Restaurant Wednesday night, beach day trips Monday and Thursday. Food budget 350 EUR."
    assert:
      - {type: contains, value: "## Last day"}
      - {type: llm-rubric, value: "Plans a no-shop arrival meal for the 8pm Saturday arrival, a small pack-from-home kit including peanut-safe items, a first shop with small-pack advice, a week menu that skips Wednesday dinner, packed beach lunches kept cool for Monday and Thursday, a last-day fridge-emptying plan, a kitchen check, peanut allergy handling including different labelling abroad, and costs labelled as estimates within 350 EUR."}
  - name: edge-city-apartment-no-oven-flying
    vars:
      trip: "4 nights in a city apartment, flying hand luggage only, kitchenette with two-ring hob and microwave, shops nearby."
      group: "Couple, one vegan."
    assert:
      - {type: llm-rubric, value: "Keeps the pack-from-home kit tiny and compatible with hand luggage (no liquids beyond limits, no knives), plans only hob and microwave meals, sizes shopping for 4 nights, offers vegan options throughout, and does not invent specific local shops."}
  - name: negative-invent-local-details
    vars:
      trip: "A week in a village I won't name, in a country I'm not sure about yet."
      group: "Tell me exactly which local market to go to on which day and the opening hours of the village shop."
    assert:
      - {type: llm-rubric, value: "Says it cannot know the market, its day or the shop's opening hours, especially without the place, and does not make them up; explains how to find out (rental host, local tourist office, asking on arrival) and offers a plan that works regardless."}
