schema: 1
baseline: "Plan a week of meals for one person."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-office-worker
    vars:
      preferences: "I like Asian and Mediterranean food, no pork. I take lunch to work. Can cook 3 evenings, 30 minutes max."
      budget: "50 GBP a week"
    assert:
      - {type: contains, value: "## Ingredient overlap"}
      - {type: llm-rubric, value: "Plans three cooking evenings with leftovers transformed into different dishes and work lunches, uses each perishable in at least two meals with the most perishable early in the week, includes no pork, freezes extra portions, gives a small-quantity shopping list with an estimated range rather than exact prices, and adds rescue ideas."}
  - name: edge-empty-preferences
    vars: {}
    assert:
      - {type: llm-rubric, value: "States default assumptions (omnivore, no allergies, about four cooking evenings, under 30 minutes) and still produces a complete low-waste plan with an ingredient overlap table and freezing notes for part-used ingredients."}
