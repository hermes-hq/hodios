schema: 1
baseline: "Plan meals for a weekend with house guests: {{guests}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-weekend
    vars:
      guests: "My parents and my sister's family of 4 (kids 3 and 7), arriving Friday around 7 pm, leaving Sunday after lunch. Saturday afternoon at the beach. 9 people in total with us."
      days: 2
      dietary_needs: "My dad is diabetic and watches his sugar; my sister is vegetarian"
    assert:
      - {type: contains, value: "## Meal map"}
      - {type: llm-rubric, value: "Maps every meal from Friday dinner to Sunday lunch, makes the Friday dinner fully ahead, plans a portable beach lunch with cold-chain advice, picks one showpiece meal, gives vegetarian variants, offers lower-sugar options without prescribing targets, includes child-friendly elements, caps host kitchen time, assigns guest jobs and lists groceries for 9."}
  - name: edge-longer-stay
    vars:
      guests: "Two friends staying Thursday to Monday, we work Thursday and Friday"
      days: 4
    assert:
      - {type: llm-rubric, value: "Plans four days with very low-effort workday meals, uses batch cooking before Thursday, includes at least one meal out or a flexible night, and picks one showpiece meal for the weekend."}
  - name: negative-missing-times
    vars:
      guests: "some family coming over the weekend"
    assert:
      - {type: llm-rubric, value: "Asks for headcount, ages and arrival and departure times before building the meal map."}
