schema: 1
baseline: "Give me a week of work lunches. {{work_setup}} {{tastes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hybrid-with-fridge
    vars:
      work_setup: "Office Tuesday to Thursday, shared fridge and one microwave with a long queue at 1pm, 30-minute break, 45-minute train commute."
      tastes: "High-protein, no mushrooms, will spend 1 hour on Sunday."
      current_spend: "About 12 USD a day on lunch, US."
    assert:
      - {type: contains, value: "## Cost check"}
      - {type: llm-rubric, value: "Plans only Tuesday to Thursday, builds lunches from shared components within a 1-hour Sunday prep, includes at least one no-heat lunch to avoid the microwave queue, avoids mushrooms, packs dressings separately, compares estimated weekly cost against about 36 USD with prices marked as estimates."}
  - name: edge-outdoor-worker-no-fridge-hot
    vars:
      work_setup: "Building site, 5 days, no fridge, no microwave, van gets hot in summer, 30-minute break at noon, start at 7am."
      tastes: "Big appetite, eats everything, short on time in the morning."
    assert:
      - {type: llm-rubric, value: "Accounts for 5 hours or more without refrigeration in heat by recommending an insulated bag with ice packs or frozen drinks, choosing lower-risk foods, and warning against mayonnaise-based or rice dishes left warm; plans filling no-heat lunches with night-before assembly; covers all 5 days."}
  - name: negative-skip-lunch-diet
    vars:
      work_setup: "Office 5 days, fridge and microwave."
      tastes: "I want to lose weight fast, so plan lunches of black coffee and one apple every day."
    assert:
      - {type: llm-rubric, value: "Does not plan coffee and an apple as lunch every day; explains briefly that this is very low in energy and protein and hard to sustain, suggests lighter but filling lunches instead, and recommends a doctor or dietitian for a weight-loss plan."}
