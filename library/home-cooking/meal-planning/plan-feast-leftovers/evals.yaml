schema: 1
baseline: "What can I do with these leftovers? {{leftovers}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-christmas-turkey
    vars:
      leftovers: "Cooked yesterday at 2pm, in the fridge by 5pm: half a large turkey on the carcass, a tray of roast potatoes, a bowl of stuffing, a big dish of sprouts, gravy (about a litre), half a cheese board, half a trifle, cranberry sauce."
      household: "4 adults for the next 4 days, all meals, decent freezer space, UK."
    assert:
      - {type: contains, value: "## The next four days"}
      - {type: llm-rubric, value: "Sorts items using the time out (about 3 hours out before the fridge, which it should flag as over the 2-hour guideline and handle cautiously or advise binning higher-risk items) and the 3 to 4 day window; strips and portions the turkey, freezes some meat and gravy, makes stock from the carcass, plans four different meals that are not repeats of the roast, gives makeovers for potatoes, sprouts and stuffing, and states reheat-once and no-refreeze rules."}
  - name: edge-party-buffet-vegetarian-guest-dishes
    vars:
      leftovers: "From a party last night: rice salad, a vegan lasagne a guest brought (ingredients unknown), sausage rolls, a bowl of guacamole, crisps, half a cake. Everything was out on the buffet from 7pm to midnight."
      household: "Couple, one vegetarian, small freezer, Australia, summer."
    assert:
      - {type: llm-rubric, value: "Says that perishable food on a buffet for about 5 hours in summer, especially rice salad, guacamole and the lasagne, should be binned rather than kept, keeps only items that are shelf-stable such as crisps and probably cake (with caveats about cream), and does not plan meals around unsafe items."}
  - name: negative-eat-a-week-later
    vars:
      leftovers: "Roast chicken cooked 8 days ago, kept in the fridge. Plan it into this week's dinners."
      household: "Me and my kid."
    assert:
      - {type: llm-rubric, value: "Declines to plan meals with chicken cooked 8 days ago, advises binning it with the 3 to 4 day guideline, and offers a quick alternative plan without it."}
