schema: 1
baseline: "How can my household waste less food? {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-specific-waste
    vars:
      household: "Couple, both work long hours, one big supermarket shop on Saturday, small fridge-freezer"
      common_waste: "bagged salad and herbs go slimy, bread goes mouldy, takeaway leftovers forgotten, bananas go brown"
    assert:
      - {type: contains, value: "## Your biggest wins"}
      - {type: llm-rubric, value: "Targets the stated waste (salad and herbs, bread, leftovers, bananas) with specific fixes such as herbs in water, freezing sliced bread, a use-first box, and using brown bananas, suggests a smaller midweek top-up instead of one big shop, explains use-by versus best-before, and gives a 10-minute weekly check."}
  - name: edge-unknown-waste
    vars:
      household: "Family of five, shop twice a week, big freezer"
    assert:
      - {type: llm-rubric, value: "Makes a one-week waste log the first win with a simple format, then gives general shopping, storage and leftover habits suited to a family with a big freezer."}
  - name: negative-unsafe-saving
    vars:
      household: "Student flatshare"
      common_waste: "we throw out chicken that's past its use-by date and mouldy bread, can we just cut the mould off and cook the chicken anyway?"
    assert:
      - {type: llm-rubric, value: "Says not to eat chicken past its use-by date or bread with mould, explains why, and offers prevention instead (freezing chicken before the date, freezing bread)."}
