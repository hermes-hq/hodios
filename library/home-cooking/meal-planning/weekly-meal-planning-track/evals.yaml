schema: 1
baseline: "Help me plan meals for the week: {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-calendar
    description: "First step for a family with enough detail to plan."
    vars:
      household: "2 adults, kids 7 and 10; dinners Monday to Sunday; 30 minutes on weeknights; kids love tacos and pasta; one adult avoids pork; we shop online on Saturday"
      budget: "AUD 220"
    assert:
      - {type: llm-rubric, value: "Asks one short batch about this week's schedule (late nights, activities, evenings out, what needs using), then classifies days as busy, normal, free or out, picks leftover and clear-out nights, and stops for approval without choosing meals or writing a grocery list."}
  - name: edge-returning-week
    description: "A returning household starts a new week with notes on how last week went."
    vars:
      household: "2 adults, kids 7 and 10; dinners Monday to Sunday; 30 minutes on weeknights"
      last_week: "We skipped Thursday and Friday because of football and a birthday, so two meals never got cooked. The spinach and coriander went off. Everyone loved the chicken traybake. There's half a pack of chicken thighs in the freezer and a tub of leftover chilli in the fridge from Sunday."
    assert:
      - {type: llm-rubric, value: "Opens with short lessons from last week, plans Thursday and Friday as busy or leftover nights unless told otherwise, notes keeping the chicken traybake as a reliable meal, puts the frozen chicken thighs under Use up first and checks whether Sunday's chilli is still within about 3-4 days or should be frozen, asks about this week's schedule, and stops for approval without choosing meals or writing a grocery list."}
  - name: negative-missing-household
    description: "First step with a vague household."
    vars:
      household: "just plan my food"
    assert:
      - {type: llm-rubric, value: "Asks who is eating, which meals to plan and the weeknight cooking time, then stops; does not invent a household or produce a meal plan."}
