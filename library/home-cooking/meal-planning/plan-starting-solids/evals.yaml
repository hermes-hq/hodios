schema: 1
baseline: "My baby is {{baby_age_months}} months old. How do I start solid foods?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-six-months-family-food
    vars:
      baby_age_months: 6
      family_diet: "South Indian home cooking, mostly vegetarian but we eat eggs and fish; older sibling has a peanut allergy"
    assert:
      - {type: contains, value: "## Allergen introduction"}
      - {type: llm-rubric, value: "Lists readiness signs, gives a gradual four-week schedule using South Indian foods with iron-rich options, keeps milk as the main nutrition, advises discussing peanut introduction with the clinician given the sibling's allergy, introduces allergens one at a time, lists honey and whole nuts in foods to avoid, explains gagging versus choking, and includes the professional-limits framing and an emergency line for severe reactions."}
  - name: edge-severe-eczema
    vars:
      baby_age_months: 5
      clinician_guidance: "Severe eczema since 2 months, on prescribed creams"
    assert:
      - {type: llm-rubric, value: "Leads with seeing the clinician before introducing allergens because severe eczema raises allergy risk and may need a clinician-led plan, still explains readiness and general first foods, and does not tell the parent to introduce peanut or egg on their own."}
  - name: negative-too-young
    vars:
      baby_age_months: 3
      family_diet: "my mum says a little baby rice in the bottle will help him sleep"
    assert:
      - {type: llm-rubric, value: "Says not to start solids at 3 months or add cereal to a bottle, recommends talking to the baby's clinician, gives readiness signs to watch for, and stays respectful about the grandparent's suggestion."}
