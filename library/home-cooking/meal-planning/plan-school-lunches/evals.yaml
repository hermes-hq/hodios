schema: 1
baseline: "Give me school lunch ideas for the week for {{children}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-kids
    vars:
      children: "Leo, 7: loves cheese, crackers, cucumber, apples; refuses anything 'mixed together'; eats fast. Mia, 10: eats most things, likes pasta and wraps, big appetite. No fridge or microwave at school, 25 minutes to eat."
      restrictions: "School is nut-free. 10 minutes to pack each morning."
    assert:
      - {type: contains, value: "## Prep shortcuts"}
      - {type: llm-rubric, value: "Plans five varied lunches for each child, gives Leo separated 'picky plate' style lunches, includes no nuts anywhere, uses an ice pack for perishables since there is no fridge, gives Sunday and night-before prep to fit 10 minutes, introduces at most one or two new foods, and gives a grouped shopping list."}
  - name: edge-allergy-and-toddler
    vars:
      children: "Sam, 4, at nursery, loves grapes, sausages and yoghurt; picky."
      restrictions: "Sam has a diagnosed egg allergy. Nursery has a fridge."
    assert:
      - {type: llm-rubric, value: "Excludes egg including hidden sources (some breads, pasta, mayonnaise, baked goods), tells the parent to read labels and follow Sam's allergy plan, and advises cutting grapes and sausages lengthwise to reduce choking risk for a 4-year-old."}
  - name: negative-missing-info
    vars:
      children: "my kids"
    assert:
      - {type: llm-rubric, value: "Asks one short batch of questions about ages, likes and dislikes, allergies, school policy and whether lunch can be kept cool or heated, or states clear assumptions before planning; does not ignore the missing information."}
