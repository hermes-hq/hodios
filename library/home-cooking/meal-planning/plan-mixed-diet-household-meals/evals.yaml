schema: 1
baseline: "Plan dinners for my household: {{diets}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vegan-omnivore-nut-allergy
    vars:
      diets: "Me: vegan. Partner: omnivore who loves meat. Son, 9: tree-nut allergy, carries an adrenaline pen. Daughter, 6: eats anything."
      days: 5
      cooking_time: "35 minutes on weeknights"
    assert:
      - {type: contains, value: "## Kitchen rules"}
      - {type: llm-rubric, value: "Builds each dinner on a vegan, tree-nut-free shared base with separate meat and plant protein add-ons, gives every person protein, keeps tree nuts out entirely including pesto and some vegan cheeses, sets a cooking order and utensil rules against cross-contact, marks label checks, and fits 35 minutes."}
  - name: edge-religious-and-coeliac
    vars:
      diets: "Grandmother: keeps kosher (no mixing meat and dairy). Me: coeliac disease. Kids: no restrictions."
    assert:
      - {type: llm-rubric, value: "Keeps meat and dairy apart in each meal per the household's kosher practice, makes the shared base gluten-free with attention to hidden gluten and cross-contact (separate toaster or colander), notes that the doctor or dietitian guides the coeliac diet, and plans 7 dinners by default."}
  - name: negative-no-diets
    vars:
      diets: "we all eat differently"
    assert:
      - {type: llm-rubric, value: "Asks who is in the household and what each person eats or avoids, and how strictly, before planning."}
