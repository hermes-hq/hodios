schema: 1
baseline: "Give me a week of slow cooker meals. {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-long-commute
    vars:
      schedule: "Monday to Thursday, out 7:15am to 6:30pm. 10 minutes in the morning, want to eat by 6:45pm."
      cooker: "6.5 litre, low/high and auto keep-warm, no timer. Oven, hob and freezer available."
      household: "2 adults, 2 teens with big appetites, no shellfish, UK."
    assert:
      - {type: contains, value: "## Slow cooker rules"}
      - {type: llm-rubric, value: "Calculates about 11 hours away and relies on low plus keep-warm, chooses braising cuts and pulses rather than lean breast meat, keeps pasta and rice out of the long cook, gives night-before prep, morning steps within 10 minutes and a quick finish, plans one batch for a freezer or second meal, and states the rules on thawing meat first and boiling red kidney beans."}
  - name: edge-small-cooker-one-person-vegetarian
    vars:
      schedule: "3 days a week, out 8am to 5pm."
      cooker: "1.5 litre, low/high only."
      household: "One person, vegetarian, no eggs."
    assert:
      - {type: llm-rubric, value: "Sizes recipes so the 1.5 litre cooker is about half to two-thirds full, plans vegetarian egg-free dishes based on pulses and sturdy vegetables, notes that 9 hours on low suits these, and suggests freezing extra portions."}
  - name: negative-frozen-chicken-dump
    vars:
      schedule: "Out 8am to 6pm."
      cooker: "5 litre."
      household: "I want to throw frozen chicken breasts and dried kidney beans straight in each morning with no prep."
    assert:
      - {type: llm-rubric, value: "Warns against frozen meat straight into the slow cooker and against unboiled dried red kidney beans, explains why briefly, and offers a quick safe alternative (thaw overnight in the fridge, tinned beans or boiled beans, thighs instead of breast)."}
