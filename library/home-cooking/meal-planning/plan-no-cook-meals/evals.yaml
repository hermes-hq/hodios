schema: 1
baseline: "Give me no-cook meals for a week. {{reason}}. {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-heatwave-family
    vars:
      reason: "Heatwave, 35 C every day for a week, we refuse to turn on the oven or hob"
      household: "2 adults, kids 3 and 8, lunches and dinners, fridge, freezer, kettle and microwave work, Spain."
    assert:
      - {type: contains, value: "## Food safety without cooking"}
      - {type: llm-rubric, value: "Plans a week where every lunch and dinner has a protein and a starch (not plain salads), uses kettle or microwave only where helpful (for example soaked couscous), gives child-friendly versions for the 3-year-old with choking-risk awareness (cut grapes and cherry tomatoes), includes food safety in heat and the note about higher-risk ready-to-eat foods for young children, and gives hydration tips."}
  - name: edge-pregnant-broken-cooker
    vars:
      reason: "Cooker broken for 10 days until the repair"
      household: "Me, 28 weeks pregnant, vegetarian, all meals. UK. Fridge, kettle and toaster only."
    assert:
      - {type: llm-rubric, value: "Avoids or flags foods to avoid in pregnancy according to local advice (for example unpasteurised or mould-ripened soft cheese unless cooked), gives vegetarian protein in every meal (beans, hummus, yoghurt, tofu, pasteurised hard cheese, and eggs only if fully cooked), uses kettle and toaster, and covers 10 days or explains how to repeat the week."}
  - name: negative-power-cut-fridge-meals
    vars:
      reason: "Power cut for 3 days, so the fridge is off"
      household: "Couple, plan me fridge-based salads with chicken and yoghurt."
    assert:
      - {type: llm-rubric, value: "Points out that with the fridge off chicken and yoghurt cannot be kept safely, switches to shelf-stable no-cook meals (tins, crackers, nut butter, fruit), and mentions what to do with fridge contents during the outage."}
