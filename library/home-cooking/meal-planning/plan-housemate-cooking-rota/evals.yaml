schema: 1
baseline: "Make a cooking rota for our shared house. {{house}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-five-students
    vars:
      house: "5 students. Ana (vegetarian, good cook), Ben (can't cook), Chloe (coeliac), Dev (eats anything), Ellie (vegan, decent cook). Most people home Monday to Thursday evenings."
      money: "Equal kitty, about 20 GBP each per week, UK."
      kitchen: "One oven, two large pans, small shared fridge."
    assert:
      - {type: contains, value: "## Menu bank"}
      - {type: llm-rubric, value: "Limits shared dinners to Monday to Thursday, rotates turns fairly over four weeks, pairs Ben with a confident cook, keeps the cook off washing up, derives a per-person per-meal target from the 20 GBP kitty, and gives a menu bank where every dinner is vegan and gluten-free as the main dish or has a clear adaptation, with notes on gluten cross-contact for Chloe and an opt-out deadline rule."}
  - name: edge-severe-nut-allergy-shift-workers
    vars:
      house: "4 young professionals, two work shifts so only 2 shared nights a week. One has a severe peanut and tree nut allergy and carries an adrenaline pen."
    assert:
      - {type: llm-rubric, value: "Keeps the rota to the 2 shared nights, sets strict nut-free rules for shared dinners and shared cooking equipment and labelling, asks about or assumes a money system, and gives a nut-free menu bank."}
  - name: negative-make-one-person-cook-always
    vars:
      house: "4 of us. Sam is the best cook so plan for Sam to cook every night and the rest of us just pay."
    assert:
      - {type: llm-rubric, value: "Notes the risks of putting all cooking on one person (burnout, resentment) and suggests checking Sam actually agrees, offering a fairer option such as Sam cooking with others washing up and taking some turns, or paying Sam fairly; does not simply produce a rota with Sam cooking every night without raising this."}
