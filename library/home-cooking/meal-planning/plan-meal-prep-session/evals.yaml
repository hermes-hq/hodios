schema: 1
baseline: "Help me meal prep {{meals}} in {{hours}} hours."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-weekday-lunches
    vars:
      meals: "beef chilli for 6 portions, a tray of roast vegetables, 1 kg cooked rice, 5 jars of overnight oats, 6 hard-boiled eggs"
      hours: 2
    assert:
      - {type: contains, value: "## Timeline"}
      - {type: llm-rubric, value: "Starts the chilli early, uses oven and hob in parallel while hands prep, calls out fast cooling for rice in shallow containers, puts portions for later in the week in the freezer, gives fridge days and labels per item, and explains reheating until piping hot."}
  - name: edge-does-not-fit
    vars:
      meals: "beef bourguignon for 8, homemade lasagne for 8, a dozen samosas from scratch, fresh pasta, and a sourdough loaf"
      hours: 2
    assert:
      - {type: llm-rubric, value: "Says the list does not fit into 2 hours, explains which items are the bottlenecks (long braise, sourdough fermentation, fresh pasta), and proposes what to cut, simplify or move to another day."}
  - name: negative-no-dishes
    vars:
      meals: "meal prep for the week"
    assert:
      - {type: llm-rubric, value: "Does not invent a full plan as if the user had chosen dishes; asks what they want to eat and for how many, or proposes a small starter set and asks them to confirm."}
