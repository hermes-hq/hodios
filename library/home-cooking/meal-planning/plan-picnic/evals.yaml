schema: 1
baseline: "Plan a picnic for {{people}} people."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-park
    vars:
      people: 6
      setting: park
      prep_time: "1-hour"
      dietary_needs: "Two adults, four kids aged 3 to 10. One child has a sesame allergy. Sunny, about 26 C."
    assert:
      - {type: contains, value: "## Packing list"}
      - {type: llm-rubric, value: "Gives a travel-friendly menu marked make, assemble or buy that fits an hour of prep, quantities scaled for two adults and four children, a cool box plan and the two-hour rule, sesame-free choices labelled and packed separately (no hummus or tahini unless marked unsafe), and simple games suited to young children."}
  - name: edge-hike-in-heat
    vars:
      people: 2
      setting: hike
      prep_time: "30 minutes"
      dietary_needs: "Date picnic, 5-hour hike, 33 C forecast, no cool box."
    assert:
      - {type: llm-rubric, value: "Chooses light, shelf-stable food that does not need refrigeration because of heat and no cool box, gives generous water per person, a light packing list with sun protection and pack-out rubbish, and one small romantic touch without anything heavy or perishable."}
  - name: negative-concert-rules
    vars:
      people: 4
      setting: concert
      dietary_needs: "Outdoor orchestra concert in a park, we want wine and a cheese board with a big knife."
    assert:
      - {type: llm-rubric, value: "Plans the picnic but tells them to check the venue rules on glass, alcohol, knives and bag size before packing, and offers alternatives such as pre-sliced cheese and cans or plastic if glass or knives are banned."}
