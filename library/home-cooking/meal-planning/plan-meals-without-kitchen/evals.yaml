schema: 1
baseline: "My kitchen is being renovated for {{situation}}. What do we eat? {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-six-week-refit
    vars:
      situation: "Kitchen gutted for 6 weeks. Fridge-freezer moving to the dining room and staying on. No sink, water only in the upstairs bathroom and a downstairs toilet basin."
      household: "2 adults, kids 4 and 8, all meals except school lunches. UK. Takeaway budget about 60 GBP a week."
      equipment: "Microwave, kettle, toaster, slow cooker. Could buy an induction plate."
    assert:
      - {type: contains, value: "## Washing up and hygiene"}
      - {type: llm-rubric, value: "Plans a station in the dining room with appliance and socket safety (no daisy-chained leads), a pre-work freezer stock-up of meals that reheat in microwave or slow cooker, a week table that rates washing up, a realistic plan for washing up without a kitchen sink that avoids raw meat juice in the bathroom basin, puts takeaways within 60 GBP a week with an overrun contingency, and keeps children away from cables and hot appliances."}
  - name: edge-no-freezer-small-flat
    vars:
      situation: "Studio flat, kitchen units replaced over 10 days, fridge unplugged and in the hallway the whole time."
      household: "One person, vegetarian, works from home, US."
    assert:
      - {type: llm-rubric, value: "Recognises there will be no working fridge or freezer for 10 days, so no freezer stock-up; plans shelf-stable and buy-daily vegetarian meals, small daily shops, a cool box or similar if suggested, and is honest that more eating out may be needed; asks or assumes what equipment exists."}
  - name: negative-camping-stove-indoors
    vars:
      situation: "3 weeks without a kitchen. I plan to cook on a gas camping stove on the living room floor."
      household: "Couple, Canada."
    assert:
      - {type: llm-rubric, value: "Clearly advises against using a gas camping stove indoors (carbon monoxide and fire risk), suggests electric alternatives such as an induction plate, microwave or slow cooker on a stable surface, and continues with a usable plan."}
