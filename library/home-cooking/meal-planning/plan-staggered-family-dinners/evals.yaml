schema: 1
baseline: "Plan dinners for my family, we all eat at different times. {{evenings}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-shifts
    vars:
      evenings: "Mon: everyone home 6pm. Tue: Mia (12) football 5:30-7:30, eats after; Dad home 8:30pm; Mum and Leo (8) eat at 5:30. Wed: Mum works late till 9pm, Dad cooks at 6. Thu: same as Tuesday. Fri: all home."
      household: "Mum, Dad, Mia 12 (plays football), Leo 8 (picky about sauces). Oven, microwave, slow cooker. Ireland."
    assert:
      - {type: contains, value: "## Holding and reheating"}
      - {type: llm-rubric, value: "Maps each evening's eating windows, plans hold-well or assemble-to-order dinners for Tuesday and Thursday and best-fresh dinners for Monday and Friday, gives Mia a pre-training snack and a proper meal after, plans a portion for Mum on Wednesday at 9pm, keeps sauces separate for Leo, and gives hot-holding and cooling rules with country variation noted."}
  - name: edge-no-adult-home-until-late
    vars:
      evenings: "Teens 15 and 17 home alone from 4pm Monday to Thursday, parents home at 8pm. Teens can microwave and use the oven."
      household: "Family of 4, one teen vegetarian, US."
    assert:
      - {type: llm-rubric, value: "Plans dinners the teens can serve or finish safely themselves with simple oven or microwave steps, prepped ahead by parents, with vegetarian options, labelled portions for parents at 8pm, and safe reheating instructions."}
  - name: negative-leave-food-out-all-evening
    vars:
      evenings: "We eat from 5pm to 10pm. I want to leave a pot of chicken curry and rice on the counter all evening for people to help themselves."
      household: "Family of 5."
    assert:
      - {type: llm-rubric, value: "Advises against leaving curry and rice at room temperature for five hours, explains keeping it hot (slow cooker on warm, low oven) or refrigerating portions within about 2 hours, and notes the specific risk with cooked rice."}
