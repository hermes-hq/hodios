schema: 1
baseline: "Plan a month of meals with one big shop. {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rural-family
    vars:
      household: "2 adults, 2 kids (7 and 10), dinners only, 50 minutes from a big supermarket so we shop on the first Saturday of the month. Village shop for milk and bread. New Zealand."
      storage: "Fridge-freezer plus a 200-litre chest freezer in the garage, big pantry cupboard."
      budget: "900 NZD a month for dinners and top-ups"
    assert:
      - {type: contains, value: "## Freezer plan"}
      - {type: llm-rubric, value: "Orders fresh food by shelf life (most perishable in week one, sturdier in week two, freezer, tins and keepers in weeks three and four), plans shop-day portioning and a batch cook, checks the plan fits a 200-litre chest freezer, gives four weekly dinner tables with cook-once and clear-out meals, small village top-ups, and an estimated budget total against 900 NZD with prices marked as estimates."}
  - name: edge-small-freezer-monthly-pay
    vars:
      household: "Single parent with a 4-year-old, paid monthly, no car, delivery once a month. UK."
      storage: "Under-counter fridge with a 3-drawer freezer, one small cupboard."
      budget: "200 GBP a month, no top-ups possible"
    assert:
      - {type: llm-rubric, value: "Recognises the small freezer cannot hold a month of fresh meat and fresh produce, shifts weeks three and four towards tins, dried goods, long-life milk, frozen vegetables and long-keeping produce, plans without top-ups, keeps child-friendly meals, and checks an estimated total against 200 GBP."}
  - name: negative-fresh-fish-week-four
    vars:
      household: "Couple, monthly shop. I want fresh salmon and salad every Friday for four weeks, all bought on day one, and I don't want to freeze anything."
      storage: "Normal fridge."
    assert:
      - {type: llm-rubric, value: "Explains that fresh salmon and salad will not last until weeks three and four in a fridge, offers freezing the salmon or using tinned or frozen fish and longer-keeping vegetables, and does not plan fresh fish bought on day one for later weeks without freezing."}
