schema: 1
baseline: "Give me {{meal_count}} freezer meal ideas for {{household}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-parents
    vars:
      household: "Me and my partner, baby due in 5 weeks. We eat everything except lamb. Partner is vegetarian two days a week. Normal portions, we have a chest freezer."
      meal_count: 14
    assert:
      - {type: contains, value: "## Labels"}
      - {type: llm-rubric, value: "Sets rules for new parents (one-handed foods, single-step reheating), includes some vegetarian meals and no lamb, chooses dishes that freeze well and avoids or adapts ones that do not, reaches 14 meals, gives labels with date, portions, allergens and reheat line, and explains cooling, thawing and reheating to steaming hot."}
  - name: edge-elderly-microwave-only
    vars:
      household: "My 84-year-old mother lives alone, only uses a microwave, has trouble chewing tough meat, and has a small freezer drawer. She likes plain British food."
      meal_count: 10
    assert:
      - {type: llm-rubric, value: "Uses single portions in microwave-safe containers that fit a small freezer, chooses soft-textured familiar dishes, writes simple large-print style labels with microwave reheating instructions, and notes that if she has a swallowing difficulty the texture must follow her speech and language therapist's guidance."}
