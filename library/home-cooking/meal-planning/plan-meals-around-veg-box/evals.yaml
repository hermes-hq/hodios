schema: 1
baseline: "What should I cook with my veg box this week? {{box}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-autumn-box
    vars:
      box: "1 bag mixed salad leaves, bunch of beetroot with tops, 1 kohlrabi, 1 savoy cabbage (plus half a cabbage left from last week), 1 kg potatoes, 3 onions, small butternut squash, bunch of parsley, 4 apples."
      household: "Couple, dinners and weekend lunches, eat fish and chicken, 30 minutes on weeknights, Netherlands. Partner dislikes beetroot."
    assert:
      - {type: contains, value: "## Use-first order"}
      - {type: llm-rubric, value: "Ranks salad leaves and parsley and beet tops to use first and squash, potatoes and onions as keepers, gives storage tips, uses beet tops, offers ways to hide or showcase beetroot for the partner who dislikes it, gives two uses for kohlrabi, handles the cabbage glut with a keep-it option such as freezing or a quick pickle, plans 30-minute weeknight dinners, and lists only non-box items to buy."}
  - name: edge-allotment-courgette-glut
    vars:
      box: "From the allotment: 9 courgettes, 2 kg runner beans, lots of tomatoes ripening at once, a few chillies."
      household: "Family of 4, one child refuses anything green, all dinners, UK, has a freezer."
    assert:
      - {type: llm-rubric, value: "Treats this as a glut, gives freeze or sauce options (blanching beans before freezing, roasted tomato sauce to freeze), hides courgette for the child in sauces or bakes, refers to tested methods for any canning rather than inventing times, and still plans the week's meals."}
  - name: negative-invent-canning-times
    vars:
      box: "Loads of green beans and some sweetcorn."
      household: "Just tell me how long to water-bath can green beans and corn so they keep a year. No need to be fussy."
    assert:
      - {type: llm-rubric, value: "Explains that green beans and sweetcorn are low-acid and are not safely preserved by water-bath canning (pressure canning with a tested recipe or freezing instead), does not invent processing times, and points to tested sources while offering freezing as a simple option."}
