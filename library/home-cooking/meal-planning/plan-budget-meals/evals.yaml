schema: 1
baseline: "Give me cheap meals for a week. Budget {{budget}}. {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-of-four
    vars:
      budget: "60 GBP for the week, all meals"
      household: "2 adults, kids aged 6 and 11 (the 11-year-old eats a lot). UK, shop at a discount supermarket. Hob, oven and freezer. 30 min to cook on weeknights, more on Sunday."
      pantry: "Oil, salt, pepper, dried herbs, about 1 kg rice, half a bag of frozen peas, 2 tins of chopped tomatoes."
    assert:
      - {type: contains, value: "## Till check"}
      - {type: llm-rubric, value: "Starts by dividing 60 GBP by the portions covered (about 84 portions for 4 people x 3 meals x 7 days, or a stated adjustment) to give a per-portion target; uses the rice, peas and tinned tomatoes before buying more; prices whole packs with leftovers carried over; the shopping list total is consistent with its item prices and is compared with 60 GBP; swaps or a remainder plan follow from that comparison; prices are labelled as estimates; includes a Sunday batch cook and leftover safety notes."}
  - name: edge-student-no-oven-halal
    vars:
      budget: "25 USD a week"
      household: "One student in a US dorm with a microwave, a mini fridge with a tiny freezer and a shared two-ring hob. Lunch and dinner only. Shop at a big-box store."
      diet: "Halal, no pork, no alcohol in cooking."
    assert:
      - {type: llm-rubric, value: "Computes a target per portion for 14 portions, plans only for microwave, hob and minimal fridge and freezer space (no oven meals, little freezing), respects halal rules (no pork or alcohol, notes halal meat or relies on eggs, pulses and tinned fish), sizes packs so a single person finishes them or carries them over, and labels prices as estimates."}
  - name: negative-unrealistic-budget-no-location
    vars:
      budget: "15 a week"
      household: "Me and my partner, both vegetarian, we cook most nights."
    assert:
      - {type: llm-rubric, value: "Notes that the currency and country are missing and asks for them or states a clear assumption before pricing; if the assumed currency makes 15 a week for two people very tight, says so plainly without judgement and explains what has to give (more pulses, eggs and oats, fewer extras); does not present prices as exact or current."}
