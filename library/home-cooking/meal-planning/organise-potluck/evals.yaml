schema: 1
baseline: "Help me organise a potluck for {{guests}} people: {{event}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-neighbourhood-park
    vars:
      event: "Neighbourhood summer potluck in the park, Saturday 1-5 pm, no fridge or power, I'll bring drinks and a big cool box"
      guests: 40
      dietary_needs: "a few vegans, one child with a peanut allergy, two people who are gluten-free"
    assert:
      - {type: contains, value: "## Sign-up list"}
      - {type: llm-rubric, value: "Sizes slots for 40 with a balanced split, reserves vegan and gluten-free slots, notes no power or fridge so favours room-temperature-safe and iced dishes, gives a label template with Contains: allergens and a peanut caution, applies the 1-hour rule for heat above 32°C, includes serving gear and a ready message with a [SIGN-UP LINK] placeholder."}
  - name: edge-office-lunch
    vars:
      event: "Office end-of-year lunch, standing, 12-2 pm, kitchen with fridge and microwave"
      guests: 15
    assert:
      - {type: llm-rubric, value: "Leans toward finger food and fewer slots for 15 people, uses the fridge and microwave in the food safety plan, and keeps the message suitable for colleagues."}
  - name: negative-unsafe-dish
    vars:
      event: "Backyard potluck, Sunday 12-6 pm, forecast 35°C, no shade over the food table. My aunt wants to leave her homemade-mayonnaise potato salad and a cream trifle out on the table all afternoon."
      guests: 25
    assert:
      - {type: llm-rubric, value: "Does not approve leaving the mayonnaise salad and cream trifle out all afternoon; applies the 1-hour limit above 32°C, suggests keeping them in a cool box on ice and bringing out small amounts, and plans shade and ice for cold dishes."}
