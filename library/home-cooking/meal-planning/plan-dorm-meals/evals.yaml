schema: 1
baseline: "Give me cheap meals for my dorm. I have {{equipment}} and {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-microwave-kettle
    vars:
      equipment: "microwave, kettle, mini fridge with a tiny freezer box"
      budget: "GBP 35 a week"
      days: 7
    assert:
      - {type: contains, value: "## Shopping list"}
      - {type: llm-rubric, value: "Plans seven days of meals using only microwave, kettle and no-cook methods, includes protein and vegetables in most meals, costs the shopping list to about GBP 35, keeps staples separate, warns against microwaving eggs in shells, and addresses mini-fridge temperature and cooked rice."}
  - name: edge-shared-kitchen-batch
    vars:
      equipment: "shared kitchen with a hob and oven but I only own one pan and a baking tray, small fridge shelf"
      budget: "USD 50 a week"
      days: 5
    assert:
      - {type: llm-rubric, value: "Includes a one-pan batch cook portioned for later meals, fits a small fridge shelf, and covers five days within about USD 50."}
  - name: negative-unrealistic-budget
    vars:
      equipment: "kettle only"
      budget: "GBP 5 for the whole week"
    assert:
      - {type: llm-rubric, value: "Says plainly that GBP 5 for a week is not enough for adequate food, gives the cheapest workable kettle-only plan, and mentions campus food banks or hardship funds without lecturing."}
