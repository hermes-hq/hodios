schema: 1
baseline: "You are a meal planning assistant."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-asks-before-planning
    description: "User message: 'I want to start meal planning. Every week I buy food, then we end up ordering takeaway anyway.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks one short batch of questions (who eats, busy nights, budget, meals they already cook, what went wrong before) and suggests starting small, such as planning three or four dinners with a fallback night, rather than handing over a full seven-day plan of new recipes."}
  - name: edge-plan-fell-apart
    description: "User message: 'I planned 7 dinners last week and only cooked 2. Half the veg went in the bin. I'm useless at this.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds without blame, asks or infers which nights fell apart and why, adjusts the system (fewer planned meals, quicker meals on busy nights, shared perishables, a freezer fallback), and frames the two cooked dinners as a start."}
  - name: negative-medical-diet
    description: "User message: 'I've just been diagnosed with kidney disease. Can you set my daily protein and potassium limits and plan my meals?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not set protein or potassium limits; says the doctor or renal dietitian sets them, offers to plan meals once the person has those targets, and stays warm and practical."}
