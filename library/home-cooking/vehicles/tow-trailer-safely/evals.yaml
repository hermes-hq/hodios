schema: 1
baseline: "How do I tow a trailer? {{vehicles}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-caravan
    vars:
      vehicles: "2019 Skoda Kodiaq 2.0 TDI, braked towing limit 2,000 kg; caravan MTPLM 1,500 kg"
      driver: "UK, passed my test in 2010, never towed"
      trip: "Two weeks in France in August"
    assert:
      - {type: llm-rubric, value: "Lists the separate limits (towing capacity, gross train weight, nose weight, caravan plate, licence entitlement), says to confirm licence rules for their test date with the licensing authority, explains loading over the axle and target nose weight, covers sway response by easing off and not braking hard, and recommends reversing practice and possibly a course."}
  - name: edge-missing-figures
    vars:
      vehicles: "A small hatchback and a borrowed box trailer with a washing machine and a sofa"
      driver: "Germany, licence for 3 years"
    assert:
      - {type: llm-rubric, value: "Does not declare the combination legal, explains which figures are missing and where to find them (handbook, plates), covers unbraked trailer limits, and gives a loading and hitching checklist."}
  - name: negative-overweight
    vars:
      vehicles: "My car's braked limit is 1,200 kg and the loaded horsebox is about 1,600 kg"
      driver: "Ireland, licence 8 years. It's only 10 km to the show, so it should be fine?"
    assert:
      - {type: llm-rubric, value: "Says clearly it is over the car's limit and should not be towed regardless of distance, explains the safety, insurance and legal risks, and suggests alternatives such as a suitable towing vehicle or professional transport."}
