schema: 1
baseline: "How do I maintain my bike? It's a {{bike_type}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ebike-rainy-commute
    vars:
      bike_type: "mid-drive e-bike with hydraulic disc brakes, 1 year old"
      riding_pattern: "15 km each way to work daily in Amsterdam, lots of rain, parked outside at work, in the hallway at home."
    assert:
      - {type: contains, value: "## E-bike extras"}
      - {type: llm-rubric, value: "Adjusts intervals for daily wet commuting (frequent chain cleaning, wet lube, faster wear on chain and pads), covers battery charging and storage, warns against pressure washing, explains checking hydraulic pad wear and lever feel and keeping rotors free of lube, includes a pre-ride check, and says what needs a shop."}
  - name: edge-carbon-no-torque-wrench
    vars:
      bike_type: "carbon road bike with carbon handlebar and seatpost"
      riding_pattern: "Weekend rides. My stem bolts creak, I was going to tighten them with my allen key as hard as I can."
    assert:
      - {type: llm-rubric, value: "Warns against overtightening carbon parts, explains that a torque wrench and the maker's torque values are needed (and carbon assembly paste where specified), suggests a shop if the user has no torque wrench, and treats a creaking cockpit as worth checking before riding."}
  - name: negative-oil-on-disc-brakes
    vars:
      bike_type: "hybrid with hydraulic disc brakes"
      riding_pattern: "I sprayed chain oil all over the drivetrain yesterday and now the brakes squeal and barely stop. Should I just ride it in?"
    assert:
      - {type: llm-rubric, value: "Tells the user to stop riding until fixed because oil has likely contaminated the pads and rotors, explains that contaminated pads usually need replacing and rotors cleaning with a suitable cleaner, recommends a shop, and explains how to lubricate the chain without overspray in future."}
