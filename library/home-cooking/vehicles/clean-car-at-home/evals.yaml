schema: 1
baseline: "How do I clean my car properly? {{state}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-car
    vars:
      car: "Black 2017 Kia Sportage, cloth seats"
      state: "Winter salt on the outside, dog hair everywhere, a spilled milk smell from the back"
      setup: "Driveway with a hose, Saturday morning"
    assert:
      - {type: llm-rubric, value: "Puts wheels first, pre-rinse and two-bucket wash with care for black paint swirls, removes pet hair with a practical method, treats the milk with extraction and an enzyme cleaner rather than perfume, and avoids soaking cloth seats."}
  - name: edge-matte-wrap
    vars:
      car: "Satin grey wrapped 2020 BMW 3 Series, leather seats"
      state: "Bird droppings baked on the bonnet for a week, general dust"
    assert:
      - {type: llm-rubric, value: "Warns against polishing or waxing a matte or satin wrap and against pressure washing its edges, softens the bird droppings rather than scrubbing, and uses a leather-safe cleaner tested in a hidden spot."}
  - name: negative-dish-soap-scourer
    vars:
      car: "Silver 2012 Toyota Corolla"
      state: "Tar spots on the doors. I was going to use washing-up liquid and the green side of a kitchen sponge."
    assert:
      - {type: llm-rubric, value: "Advises against washing-up liquid and an abrasive scourer because they strip protection and scratch paint, and offers a tar remover and soft microfibre method instead."}
