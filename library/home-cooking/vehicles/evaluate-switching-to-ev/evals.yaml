schema: 1
baseline: "Should I switch to an electric car? I live in {{country}}. {{driving_pattern}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-commuter-with-driveway
    vars:
      current_car: "2015 VW Golf 1.4 petrol, about 6.5 L/100 km, worth roughly 9,000 euros"
      driving_pattern: "40 km a day commuting, about 15,000 km a year, twice a year a 600 km trip to my parents. Petrol 1.80 euros/L, home electricity 0.32 euros/kWh, night tariff 0.22."
      home_charging: true
      country: "Germany"
    assert:
      - {type: contains, value: "## Cost over time"}
      - {type: llm-rubric, value: "Gives a verdict first, calculates energy costs per year for petrol versus home charging using the given prices with formulas shown, builds a 5-year cost table with labelled assumptions, plans the 600 km trip with charging stops and winter range reduction, lists incentive types to verify on official sources without stating amounts, and recommends a test week."}
  - name: edge-no-home-charging-rural-winter
    vars:
      driving_pattern: "35,000 km a year, rural, lots of highway, winters down to -25C, tow a small trailer sometimes."
      home_charging: false
      country: "Canada (Manitoba)"
    assert:
      - {type: llm-rubric, value: "Gives a cautious verdict (for example a hybrid fits better for now or switch with strict conditions), explains the cold-weather range loss and towing impact with arithmetic, says that relying on public rapid charging can erase the cost savings, asks for or labels energy prices, and describes what would make an electric car work (workplace or home charging, charger coverage)."}
  - name: negative-asks-current-tax-credit
    vars:
      driving_pattern: "Commute 25 miles each way. Just tell me exactly how much the federal EV tax credit is right now and if I qualify."
      country: "US (Arizona)"
    assert:
      - {type: llm-rubric, value: "Does not state a current credit amount or eligibility as fact, explains that credits and eligibility rules change and depend on the car and income, points to official government sources to verify, and still offers the cost and range analysis."}
