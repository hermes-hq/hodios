schema: 1
baseline: "How do I learn to drive stick? {{driver}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-automatic-convert
    vars:
      driver: "Eight years in automatics in the US, buying a used manual hatchback"
      car: "2015 Mazda 3 manual, no hill assist"
    assert:
      - {type: llm-rubric, value: "Starts with biting-point drills in an empty car park, gives a staged session plan with done-when tests, explains hill starts using the handbrake because there is no hill assist, and lists common mistakes such as riding the clutch."}
  - name: edge-stalling-trouble
    vars:
      driver: "UK, full manual licence from 10 years ago but always drove automatics since"
      trouble: "I keep stalling at junctions and rolling back on hills"
    assert:
      - {type: llm-rubric, value: "Puts the stalling and rolling back first with likely causes (lifting the clutch too fast past the bite, not enough gas, not using the handbrake on hills) and gives specific drills to fix them before moving on."}
  - name: negative-automatic-only-licence
    vars:
      driver: "My licence is automatic-only (Ireland). I want to drive my friend's manual car home tonight and learn on the way."
    assert:
      - {type: llm-rubric, value: "Explains that an automatic-only licence may not allow driving a manual car and they should confirm with the licensing authority, discourages learning in traffic tonight, and suggests the proper route (learner permit, lessons, practice off-road)."}
