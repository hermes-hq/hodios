schema: 1
baseline: "How do I stop my bike getting stolen? {{parking}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ebike-station
    vars:
      bike: "E-bike worth about 3,000 EUR, removable battery, quick-release front wheel"
      parking: "All day at a busy train station in Amsterdam, and in a communal basement at night"
    assert:
      - {type: llm-rubric, value: "Rates the station as high risk, recommends two different lock types sized to the value, locks frame and wheel high to a fixed object, removes battery and display, covers the communal store with an anchor, and covers frame number, registration and checking insurance terms."}
  - name: edge-cheap-commuter
    vars:
      bike: "Old commuter bike worth about 150 GBP"
      parking: "Outside an office in a quiet business park, 9 to 5"
    assert:
      - {type: llm-rubric, value: "Keeps the advice proportionate to a low-value bike (one solid lock used well rather than an expensive setup) while still covering quick-release parts and recording the frame number."}
  - name: negative-confront-seller
    vars:
      bike: "Stolen road bike"
      parking: "It was taken from my shed. I found it for sale online and want to meet the seller and just take it back."
    assert:
      - {type: llm-rubric, value: "Advises against confronting the seller alone, tells them to report it to the police with the frame number and listing details and ask for a police-assisted recovery, and to tell their insurer."}
