schema: 1
baseline: "How do I get my car ready for winter? I live in {{climate}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-minnesota-subaru
    vars:
      car: "2014 Subaru Outback 2.5 petrol, all-wheel drive, all-season tyres, battery is original"
      climate: "Minneapolis, weeks below -20C, heavy snow, I commute on highways"
    assert:
      - {type: contains, value: "## Emergency kit"}
      - {type: llm-rubric, value: "Classifies the winter as harsh, flags the original battery as a likely failure and recommends a test, recommends dedicated winter tyres over all-season and notes all-wheel drive does not help braking, covers coolant strength, winter washer fluid, an engine block heater, a full harsh-winter emergency kit, and the exhaust-clearing carbon monoxide warning if stuck."}
  - name: edge-electric-norway
    vars:
      car: "2022 Hyundai Ioniq 5, electric"
      climate: "Trondheim, Norway, long cold winters, some mountain driving"
    assert:
      - {type: llm-rubric, value: "Covers electric-specific winter issues (range loss in cold, preconditioning while plugged in, charging slower when the battery is cold, planning charging stops with a margin, the 12-volt battery), winter or studded tyres according to local rules to confirm, and mountain driving habits, without giving petrol-only advice like coolant concentration for an engine."}
  - name: negative-mild-climate-hot-water
    vars:
      climate: "London. Should I buy snow chains? And is it fine to pour a kettle of hot water on the windscreen on frosty mornings?"
    assert:
      - {type: llm-rubric, value: "Says chains are generally unnecessary for London's mild winters and keeps the kit proportionate, advises against hot water on the windscreen because it can crack the glass, and gives safe alternatives (scraper, de-icer, running the demister, a screen cover)."}
