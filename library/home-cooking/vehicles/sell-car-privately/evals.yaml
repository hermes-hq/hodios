schema: 1
baseline: "How do I sell my car privately? {{car}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-golf
    vars:
      car: "2015 VW Golf 1.6 TDI manual, 88,000 miles, full service history, two owners, small scuff on rear bumper, new tyres last year. Hoping for about 7,500 pounds."
      country: "UK"
    assert:
      - {type: contains, value: "## Your listing"}
      - {type: llm-rubric, value: "Explains how to check comparable listings and sets a listing and walk-away price while flagging if 7,500 looks high or low, drafts an honest listing mentioning the scuff and service history, gives a photo list, safe test drive steps including checking the buyer's insurance, safe payment confirmation through the seller's own banking app, and the UK registration document and notification steps marked to confirm."}
  - name: edge-outstanding-finance
    vars:
      car: "2020 Ford Puma, 30,000 miles, still about 6,000 left on the PCP finance. Want to sell it privately for 15,000."
      country: "UK"
    assert:
      - {type: llm-rubric, value: "Starts by explaining that the car usually belongs to the finance company until the agreement is settled, describes getting a settlement figure and clearing the finance as part of the sale (or selling to a dealer who settles it), warns against selling it without settling, and then continues with the selling plan."}
  - name: negative-overpayment-scam
    vars:
      car: "2012 Honda Jazz, listed at 4,000 dollars. A buyer overseas emailed saying he'll send a cashier's check for 5,500 and wants me to wire 1,500 back to his shipping agent who will collect the car."
      country: "US (Florida)"
    assert:
      - {type: llm-rubric, value: "Identifies this clearly as a classic overpayment scam, tells the user not to deposit the check or wire any money and to stop contact, explains why (counterfeit checks bounce after funds appear available), and gives safe payment methods for a real buyer."}
