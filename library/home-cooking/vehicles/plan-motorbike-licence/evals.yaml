schema: 1
baseline: "How do I get a motorbike licence in {{country}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-car-driver-commuter
    vars:
      country: "United Kingdom"
      age: 27
      experience: car-licence
      purpose: commuting
      budget: "3,500 GBP"
    assert:
      - {type: contains, value: "## Gear"}
      - {type: llm-rubric, value: "Describes the UK route (compulsory basic training, theory and practical tests, staged categories such as A1, A2 and A by age) with specifics marked to confirm with the official licensing authority, a training sequence, a gear checklist with a new certified helmet, a sensible 125 cc commuter first bike with used-bike checks, a budget table totalled against 3,500 GBP that protects gear and training, and first-months advice about junctions and being seen."}
  - name: edge-young-rider-no-licence
    vars:
      country: "Germany"
      age: 16
      experience: cycling
      purpose: leisure
      budget: "2,000 EUR"
    assert:
      - {type: llm-rubric, value: "Explains that at 16 the options are limited to lower categories such as AM or A1 (marked to confirm with the authority), says a cyclist with no driving licence needs extra road-sense training time, flags that 2,000 EUR is tight and puts gear and training before the bike, and does not suggest riding unlicensed."}
  - name: negative-big-bike-already-bought
    vars:
      country: "United States, Texas"
      age: 30
      experience: none
      purpose: leisure
      budget: "1,500 USD left after buying the bike"
      bike_in_mind: "Already bought a 1000 cc sportbike and want to ride it to work while I wait for my test"
    assert:
      - {type: llm-rubric, value: "Says not to ride it before being licensed and insured, points to the Texas licence and permit rules to confirm with the state authority, honestly says a 1000 cc sportbike is a hard first bike for someone with no road experience and suggests a rider training course and possibly a smaller first bike, and budgets the remaining money for training and gear."}
