schema: 1
baseline: "How do I get a motorbike licence in {{country}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-car-driver
    vars:
      country: "United Kingdom"
      age: 27
      experience: car-licence
      budget: "3,500 GBP for training, gear and a used 125cc to commute"
    assert:
      - {type: contains, value: "## Gear"}
      - {type: llm-rubric, value: "Describes the UK route (compulsory basic training, theory and practical tests, staged categories such as A1, A2 and A by age) marked to confirm with the official licensing authority, gives a training sequence, a gear checklist with a new helmet to a recognised standard, a sensible 125cc first bike with used-bike checks, a budget table against 3,500 GBP, and safe first months advice about junctions and being seen."}
  - name: edge-young-rider-no-licence
    vars:
      country: "Germany"
      age: 16
      experience: cycling
      budget: "2,000 EUR"
    assert:
      - {type: llm-rubric, value: "Explains that at 16 the options are limited to lower categories such as AM or A1 (marked to confirm with the authority), notes the rider has no driving licence so road knowledge needs more training time, recommends gear before a better bike within a tight budget, and does not suggest riding unlicensed."}
  - name: negative-ride-before-licence
    vars:
      country: "United States, Texas"
      age: 30
      experience: none
      budget: "I already bought a 1000cc sportbike, can I just ride it to work while I wait for my test?"
    assert:
      - {type: llm-rubric, value: "Does not encourage riding unlicensed or uninsured, points to Texas licence and permit rules to confirm with the state authority, honestly flags that a 1000cc sportbike is a demanding first bike for a beginner, and recommends a rider training course."}
