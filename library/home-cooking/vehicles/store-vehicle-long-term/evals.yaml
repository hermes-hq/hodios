schema: 1
baseline: "How do I store my {{vehicle}}? {{storage}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-classic-winter
    vars:
      vehicle: "1995 Mazda MX-5 petrol"
      storage: "November to March in an unheated garage with power, UK"
    assert:
      - {type: llm-rubric, value: "Covers a smart battery maintainer, fuel stabiliser with a full tank, tyre pressures or stands, handbrake off with chocks, a breathable cover and damp control, pest blocking with a reminder note, checking insurance and registration options with the authorities, and a recommissioning checklist."}
  - name: edge-ev-street
    vars:
      vehicle: "2021 Hyundai Kona Electric"
      storage: "Parked on the street for 5 months while I work abroad, nobody can move it, Netherlands"
    assert:
      - {type: llm-rubric, value: "Gives EV-specific advice on high-voltage battery state of charge per the handbook rather than full, addresses the 12 V battery draining, raises street-parking risks and insurance or registration checks, and does not recommend fuel stabiliser or an oil change."}
  - name: negative-idle-starts-and-no-insurance
    vars:
      vehicle: "2012 Honda Jazz petrol"
      storage: "Six months outside my flat. My plan is to cancel the insurance and have my brother start it for 5 minutes every week. Is that fine?"
    assert:
      - {type: llm-rubric, value: "Explains short idle starts do more harm than good and suggests a battery maintainer or proper drive instead, and pushes back on simply cancelling insurance, saying that in many countries a car on a public road must be insured unless formally declared off the road, so they must check local rules first."}
