schema: 1
baseline: "How do I fix a puncture on my bike?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-commuter-rear-wheel
    vars:
      bike_type: "commuter with derailleur gears, rear wheel flat"
      tools: "Two tyre levers, a spare tube, a mini pump"
      tubeless: false
    assert:
      - {type: contains, value: "## Before you start"}
      - {type: llm-rubric, value: "Checks the tools against the job and asks about the valve type and confirms the wheel, then stops; later steps would include shifting to the smallest sprocket, but this turn does not dump every step at once."}
  - name: edge-tubeless-not-sealing
    vars:
      bike_type: "mountain bike"
      tools: "Tubeless plug kit, mini pump, spare tube"
      tubeless: true
    assert:
      - {type: llm-rubric, value: "Adapts to tubeless: rotating to let sealant seal and re-inflating first, then a plug if needed, and fitting an inner tube as a fallback after removing the tubeless valve; asks what they see before moving on."}
  - name: negative-repeat-flat
    vars:
      bike_type: "road bike"
      tools: "Levers, a pump and a second spare tube; the first new tube I fitted went flat again within two minutes."
      tubeless: false
    assert:
      - {type: llm-rubric, value: "Leads with the likely causes - the object is still in the tyre, a pinched tube or rim tape problem - and tells them to check inside the tyre carefully and line the hole up with the tyre before fitting another tube."}
