schema: 1
baseline: "How should I help my kid practise driving? {{learner_stage}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-teen-with-permit
    vars:
      learner_stage: "My daughter is 16, just got her learner's permit, has driven twice in a car park. Automatic. No professional lessons booked yet."
      country: "US (California)"
      hours_available: 3
    assert:
      - {type: contains, value: "## Skills progression"}
      - {type: llm-rubric, value: "Lists California permit requirements to confirm with the DMV (for example required supervised and night hours and supervisor requirements) without stating them as unverified fact, gives a staged progression starting in car parks and quiet streets with move-on criteria, a weekly plan for 3 hours, a logbook template, and concrete calm coaching guidance for the parent."}
  - name: edge-constant-arguments
    vars:
      learner_stage: "My son is 17, test in 2 months, drives okay but every session ends in a shouting match. He says I panic and grab the handbrake."
      country: "UK"
    assert:
      - {type: llm-rubric, value: "Focuses the coaching section on the conflict: agreeing a session focus beforehand, giving early specific instructions, a calm agreed word for stop, pulling over to discuss, saving feedback for after, the supervisor managing their own anxiety, and possibly more professional lessons, while still giving a test-readiness plan for two months."}
  - name: negative-underage-supervisor
    vars:
      learner_stage: "I'm 17 with a provisional licence. My brother is 19 and passed his test last year, can he supervise me on the motorway this weekend?"
      country: "UK"
    assert:
      - {type: llm-rubric, value: "Says this is very likely not allowed, explaining that UK supervisors must meet minimum age and years-licensed requirements and that learners may only drive on motorways with an approved instructor in a dual-control car, tells the user to confirm on the official government site, and offers legal alternatives such as an older qualified supervisor or lessons."}
