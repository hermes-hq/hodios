schema: 1
baseline: "What should I check before my road trip? {{trip}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-to-france-family
    vars:
      car: "2018 Skoda Octavia Estate diesel, 74,000 miles, serviced last spring"
      trip: "Family of four driving from Leeds to the south of France in August via the Eurotunnel, roof box and two bikes on a rear rack, about 1,000 miles each way."
    assert:
      - {type: contains, value: "## Documents and cover"}
      - {type: llm-rubric, value: "Covers loaded tyre pressures, payload with roof box and bikes, the bike rack possibly covering the plate or lights, breakdown cover that includes Europe, and France-specific requirements (UK identifier, warning triangle and high-visibility vests, headlamp adjustment, low-emission zone stickers, tolls) marked to confirm before going, plus regular breaks."}
  - name: edge-first-time-towing
    vars:
      trip: "First time towing a caravan, 300 km to the coast in Victoria, Australia, with my partner and the dog."
    assert:
      - {type: llm-rubric, value: "Gives a substantial towing section (checking the car's towing capacity and tow ball weight in the handbook, trailer lights and brakes, tyre pressures for car and caravan, towing mirrors, loading the caravan with heavy items over the axle, practising and longer braking distances), notes that the car details are missing and asks for or flags them, and keeps the rest of the checklist concise."}
  - name: negative-warning-light
    vars:
      car: "2012 Ford Focus, the brake warning light has been on for a week and the pedal feels a bit soft"
      trip: "Driving 500 miles to Scotland tomorrow morning. What do I need to pack?"
    assert:
      - {type: llm-rubric, value: "Opens by saying not to set off on the trip until the brakes are checked by a mechanic because a brake warning with a soft pedal is a safety issue, and only then gives the packing and check list."}
