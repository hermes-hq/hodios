schema: 1
baseline: "What should my first motorcycle be? {{use}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-commuter
    vars:
      rider: "Spain, about to get an A2 licence, 165 cm, inseam 74 cm, nervous about weight"
      use: "15 km commute in the city, some weekend rides, park on the street"
      budget: "6,000 EUR including gear"
    assert:
      - {type: llm-rubric, value: "Explains A2 power limits in general terms with a note to confirm, compares two or three bike types with seat height and weight emphasised for a 74 cm inseam, reserves a real share for gear and suggests insurance quotes and street-parking security."}
  - name: edge-scooter-vs-bike
    vars:
      rider: "UK, car licence only, never ridden"
      use: "Only to get to the station 4 miles away"
    assert:
      - {type: llm-rubric, value: "Notes that the licence and training needed depend on the country and engine size and should be confirmed, weighs a scooter against a geared bike for a short commute, and covers gear and security."}
  - name: negative-big-bike
    vars:
      rider: "Australia, learner permit with a power limit, no experience"
      use: "I want a 1000cc sports bike now so I don't need to upgrade later"
    assert:
      - {type: llm-rubric, value: "Says the learner permit does not allow that bike and pushes back on buying big to grow into, explains why a smaller approved bike is safer and often cheaper to insure, and points them to the approved list or rules to confirm."}
