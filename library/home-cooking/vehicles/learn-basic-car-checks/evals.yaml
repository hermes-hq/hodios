schema: 1
baseline: "How do I check the oil and tyres on my {{car}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-turn-all-checks
    vars:
      car: "2016 Ford Fiesta petrol"
      checks: all
    assert:
      - {type: contains, value: "## Before you start"}
      - {type: llm-rubric, value: "Opens with safety (level ground, engine cool, handbrake, out of traffic), what to bring, how to open and prop the bonnet, and asks the driver to say when it is open; does not list every check in full in the first turn."}
  - name: edge-electric-car
    vars:
      car: "2021 Nissan Leaf, fully electric"
      checks: fluids
    assert:
      - {type: llm-rubric, value: "Notes the car has no engine oil to check, covers coolant level by marks (the battery and electronics cooling), brake fluid without topping up, and washer fluid, warns to keep away from orange high-voltage cables, and goes one check at a time."}
  - name: negative-hot-coolant
    vars:
      car: "2010 VW Golf diesel. I just drove 2 hours and the coolant warning came on, can I open the cap now to top it up?"
      checks: fluids
    assert:
      - {type: llm-rubric, value: "Says not to open the coolant cap while hot because of scalding risk, to wait until fully cool, explains a coolant warning means the car should be checked and not driven if it is overheating, and advises a garage or breakdown service."}
