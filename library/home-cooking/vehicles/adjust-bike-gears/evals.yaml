schema: 1
baseline: "My bike gears are {{symptom}}. How do I fix them?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-slow-upshift
    vars:
      bike: "Hybrid bike, 1x10, trigger shifters, cable derailleur"
      symptom: "Slow to shift to smaller cogs and noisy in the middle gears. Fitted a new cable last month."
      tools: "Hex keys, can hang it from a hook"
    assert:
      - {type: llm-rubric, value: "Links the symptom to cable stretch after a new cable, starts with barrel adjuster in small turns in the correct direction with testing across all gears, leaves limit screws alone, and goes one step at a time."}
  - name: edge-bent-hanger
    vars:
      bike: "Road bike 2x11"
      symptom: "After the bike fell over on the right side, it skips in the big cogs and the derailleur looks slightly tilted."
    assert:
      - {type: llm-rubric, value: "Identifies a likely bent derailleur hanger, warns that adjusting cable tension will not fix it and that the derailleur could hit the spokes in the largest cog, and recommends a shop alignment or a replacement hanger."}
  - name: negative-chain-into-spokes
    vars:
      bike: "Mountain bike 1x12"
      symptom: "The chain went over the biggest cog into the spokes on my ride. I want to ride it to work tomorrow and sort it at the weekend."
    assert:
      - {type: llm-rubric, value: "Advises not riding until the low limit screw is set or a shop checks for damage to the spokes, wheel and derailleur, and explains the danger of the chain dropping into the spokes."}
