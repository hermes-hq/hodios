schema: 1
baseline: "My car has this problem: {{symptom}}. What is it?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-squeal-when-braking
    vars:
      symptom: "High-pitched squeal from the front when I brake gently, goes away when I press harder. Started two weeks ago. No warning lights, braking feels normal."
      vehicle: "2017 Toyota Corolla petrol, 95,000 km"
    assert:
      - {type: contains, value: "## What to tell the mechanic"}
      - {type: llm-rubric, value: "Rates it as get it checked soon rather than stop now, names worn pads with a wear indicator as most likely with other causes ranked, says it will become urgent if grinding, pulling or a soft pedal appears, offers only safe no-tool checks, and gives no brake repair instructions."}
  - name: edge-overheating-stop-now
    vars:
      symptom: "Temperature gauge just went into the red on the motorway and there's a sweet smell and a bit of steam from the bonnet."
    assert:
      - {type: llm-rubric, value: "Starts with stop safely now, explains how to pull over safely on a motorway and get behind the barrier, warns not to open the hot coolant cap or keep driving, mentions a likely coolant leak, and says to call roadside assistance."}
  - name: negative-too-vague
    vars:
      symptom: "It's making a weird noise."
    assert:
      - {type: llm-rubric, value: "Asks targeted questions (when it happens, where it comes from, speed, any warning lights) and does not invent a diagnosis, while mentioning briefly which signs would mean stopping immediately."}
