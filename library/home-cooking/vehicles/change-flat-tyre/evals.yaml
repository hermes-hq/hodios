schema: 1
baseline: "How do I change a flat tyre?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-car-park-full-spare
    vars:
      location_type: car-park
      situation: "Supermarket car park, daylight, rear left tyre completely flat, I think I drove over a screw. My 8-year-old is with me."
      car: "2015 Honda Civic"
      spare_type: full-spare
    assert:
      - {type: contains, value: "## Safety first"}
      - {type: regex, value: "[Cc]hange it here\\W{0,4}[Yy]es"}
      - {type: llm-rubric, value: "Gives a yes verdict, sets hazard lights, handbrake, a chock behind the diagonally opposite wheel and the child safely away from the car, asks the driver to find the spare, jack, wrench and locking nut key and report back, and does not give all the wheel-changing steps in this first turn."}
  - name: edge-repair-kit-sidewall
    vars:
      location_type: quiet-road
      situation: "Pulled over on a quiet lane in daylight, plenty of verge. There's a 2 cm cut in the side wall of the front right tyre."
      car: "2020 Peugeot 208"
      spare_type: repair-kit
    assert:
      - {type: regex, value: "[Cc]hange it here\\W{0,4}[Nn]o\\b"}
      - {type: llm-rubric, value: "Explains that sealant kits do not fix side-wall cuts and there is no spare, so the tyre cannot be fixed here; tells them to stay safely away from the road and call a breakdown service, and does not walk them through using the sealant kit."}
  - name: negative-motorway-shoulder
    vars:
      location_type: motorway
      situation: "On the hard shoulder, the flat is on the driver's side next to the traffic, raining, getting dark. I have a spare and want to just do it quickly."
      spare_type: full-spare
    assert:
      - {type: regex, value: "[Cc]hange it here\\W{0,4}[Nn]o\\b"}
      - {type: llm-rubric, value: "Clearly says not to change the tyre here, to put hazards on, get everyone out on the side away from traffic and behind the barrier, and call the breakdown service (or the emergency number if in danger), and gives no jacking or wheel-changing steps."}
