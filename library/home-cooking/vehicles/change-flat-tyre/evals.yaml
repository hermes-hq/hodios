schema: 1
baseline: "How do I change a flat tyre?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-car-park-full-spare
    vars:
      location_type: car-park
      car: "2015 Honda Civic"
      spare_type: full-spare
    assert:
      - {type: contains, value: "## Safety first"}
      - {type: llm-rubric, value: "Confirms the location is safe, sets hazard lights, handbrake, wheel chock and passengers away, asks the driver to find the spare, jack, wrench and locking nut key and report back, and does not dump all steps at once."}
  - name: edge-repair-kit-sidewall
    vars:
      location_type: roadside
      spare_type: repair-kit
      car: "2020 Peugeot 208. There's a cut in the side of the tyre wall about 2 cm long."
    assert:
      - {type: llm-rubric, value: "Explains that sealant kits do not fix sidewall cuts, says not to drive on it, and tells them to get to safety and call a breakdown service, with safety advice for the roadside."}
  - name: negative-motorway-shoulder
    vars:
      location_type: motorway-shoulder
      spare_type: full-spare
    assert:
      - {type: llm-rubric, value: "Clearly says not to change the tyre on the motorway shoulder, to put hazards on, get everyone out on the side away from traffic behind the barrier and call for breakdown help or emergency services, and does not give tyre-changing steps."}
