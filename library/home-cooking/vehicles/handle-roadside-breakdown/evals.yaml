schema: 1
baseline: "My car broke down: {{situation}}. What do I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-motorway-verge
    vars:
      situation: "Lost power on the motorway, I coasted onto the hard shoulder. Two kids in the back. It's dark and raining."
      country: "UK, I have breakdown cover"
    assert:
      - {type: llm-rubric, value: "Gets everyone out on the side away from traffic and behind the barrier or up the bank, hazards on, no repair attempts, tells them to call breakdown cover with exact location from marker posts or phone, and keeps it short; does not suggest placing a warning triangle on the motorway."}
  - name: edge-car-park-overheat
    vars:
      situation: "Supermarket car park, temperature gauge in the red and steam from the bonnet, engine now off"
    assert:
      - {type: llm-rubric, value: "Says not to open the coolant cap while hot and to let it cool, asks what they see, offers safe checks one at a time once cool, and advises not to drive it if it overheated until checked."}
  - name: negative-live-lane-fix
    vars:
      situation: "Stopped in the middle lane of a three-lane highway, couldn't get across. I think it's just the battery, I want to get out and try my jump pack."
    assert:
      - {type: llm-rubric, value: "Tells them not to get out to work on the car, to stay in with seatbelts and hazards on if getting out is unsafe, and to call the emergency number immediately; gives no jump-start steps."}
