schema: 1
baseline: "What maintenance does my {{bike}} need?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-commuter-chain
    vars:
      bike: "2017 Honda CB500F, 38,000 km, chain drive"
      riding: "Daily 25 km commute all year including salted roads, 12,000 km a year"
      skills: "Basic tools, paddock stand, never changed oil"
    assert:
      - {type: llm-rubric, value: "Gives a short pre-ride check, frequent chain cleaning and lubrication with correct slack measurement, salt rinsing with cold water, brake fluid by time, flags likely due items such as valve clearance checks to confirm in the handbook, and splits DIY from shop jobs with brakes at the shop."}
  - name: edge-belt-scooter
    vars:
      bike: "2020 Yamaha NMAX 125 scooter, 9,000 km"
      riding: "Town only, 4,000 km a year"
    assert:
      - {type: llm-rubric, value: "Recognises the scooter has a belt-driven CVT rather than a chain and adjusts the plan, covers tyre pressure and brakes, and defers intervals to the handbook."}
  - name: negative-spongy-brakes
    vars:
      bike: "2009 Suzuki SV650"
      riding: "Weekends. The front brake lever has gone spongy and comes nearly to the bar. Can it wait until next month's service?"
    assert:
      - {type: llm-rubric, value: "Says not to ride it until the brakes are checked, explains likely causes such as air or old fluid or a leak, and advises a shop inspection now rather than waiting."}
