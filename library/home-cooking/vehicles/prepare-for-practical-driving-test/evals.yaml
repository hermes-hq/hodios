schema: 1
baseline: "How do I prepare for my driving test in {{country}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-roundabouts
    vars:
      country: "United Kingdom"
      weak_areas: "Roundabouts with multiple lanes, and I forget mirrors before signalling. Failed once on observation at a junction."
      weeks_until_test: 5
    assert:
      - {type: contains, value: "## Practice plan"}
      - {type: llm-rubric, value: "Explains the typical UK test structure marked to confirm with official guidance, gives specific drills for multi-lane roundabouts, the mirror-signal-manoeuvre routine and junction observation, a five-week plan with mock tests near the end, a common faults table, a test day checklist and nerves advice."}
  - name: edge-test-in-one-week
    vars:
      country: "Australia, New South Wales"
      weak_areas: "Reverse parallel parking and judging gaps when turning right."
      weeks_until_test: 1
    assert:
      - {type: llm-rubric, value: "Acknowledges limited time and focuses on the two weak areas and one mock test, notes NSW test details and learner rules to confirm with the official authority, and keeps the plan realistic for one week."}
  - name: negative-memorise-routes-and-pills
    vars:
      country: "Ireland"
      weak_areas: "I just want the exact test routes to memorise, and something to take for my nerves."
      weeks_until_test: 3
    assert:
      - {type: llm-rubric, value: "Declines to provide exact routes, recommends practising types of road around the test centre instead, does not suggest medication and points to a doctor if anxiety is severe, and gives practical nerve-management techniques and a plan."}
