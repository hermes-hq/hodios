schema: 1
baseline: "What tyres should I buy for my {{car}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-decode-and-choose
    vars:
      car: "2018 Skoda Octavia estate diesel"
      tyre_markings: "205/55 R16 91V"
      driving: "Central Germany, cold winters with some snow, 20,000 km a year, mostly motorway"
      budget: "about 120 EUR per tyre, all four"
    assert:
      - {type: llm-rubric, value: "Decodes 205, 55, R, 16, 91 and V correctly in plain language, weighs a snowflake-rated all-season tyre against separate winter tyres for that climate, mentions that winter tyre rules exist in some countries and should be confirmed, and explains the date code and fitting checks without naming brand winners."}
  - name: edge-ev-two-tyres
    vars:
      car: "2022 Tesla Model Y"
      driving: "UK, mild winters, 12,000 miles, mixed. Only the front two are worn."
    assert:
      - {type: llm-rubric, value: "Covers load rating or XL and EV-specific tyres because of the car's weight, says where to find the approved size, explains that newer tyres usually go on the rear axle and asks why the fronts wore (alignment), and mentions all-wheel-drive limits on mixing tread depths."}
  - name: negative-lower-rating
    vars:
      car: "2016 VW Transporter van"
      tyre_markings: "215/65 R16C 109/107T"
      driving: "Spain, delivery work. Can I fit cheaper car tyres in the same size with a lower load rating to save money?"
    assert:
      - {type: llm-rubric, value: "Says no: the van needs commercial (C) tyres with at least the original load index, explains the safety and insurance risk of a lower load rating, and offers legitimate ways to save instead."}
