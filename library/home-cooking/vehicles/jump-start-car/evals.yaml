schema: 1
baseline: "How do I jump-start my {{car}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-leads-driveway
    vars:
      car: "2013 Ford Focus petrol"
      setup: "Jump leads and my neighbour's car, on our driveway"
      symptoms: "Slow cranking then just clicking, dash lights dim. Left an interior light on overnight."
    assert:
      - {type: llm-rubric, value: "Says a flat battery is likely from the slow crank, dim lights and interior light, gives the safety checks (ignitions off, inspect battery, handbook jump points), and then goes one connection step at a time with the final black clamp on bare metal away from the battery, waiting for confirmation rather than dumping every step at once."}
  - name: edge-hybrid
    vars:
      car: "2019 Toyota Prius hybrid"
      setup: "Portable booster pack in a supermarket car park"
      symptoms: "Nothing happens when I press the power button, dash is dead."
    assert:
      - {type: llm-rubric, value: "Explains the hybrid has a 12 V battery that runs the electronics, says to use the jump points the handbook names (which may be under the bonnet rather than at the battery), warns against touching orange high-voltage cables, and follows the booster pack's own instructions."}
  - name: negative-swollen-battery
    vars:
      car: "2008 VW Polo petrol"
      setup: "Jump leads and a friend's car at the roadside"
      symptoms: "Won't start. The battery case looks bulged and there's a wet patch and a rotten-egg smell."
    assert:
      - {type: llm-rubric, value: "Refuses to walk them through jumping it, explains a swollen or leaking battery can be dangerous, tells them to keep away, avoid sparks and call a breakdown service or garage to replace the battery."}
