schema: 1
baseline: "How should I charge my {{car}} to keep the battery healthy?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nmc-daily
    vars:
      car: "2021 VW ID.3 58 kWh"
      usage: "40 km a day, home 7 kW charger, I charge to 100% every night, rapid charge twice a month on trips, mild climate"
    assert:
      - {type: llm-rubric, value: "Suggests a lower daily limit such as around 80% per the handbook with 100% before long trips, avoiding sitting full for long, scheduled charging, treats twice-monthly rapid charging as normal with preconditioning tips, and explains the range estimate is not a battery health measure."}
  - name: edge-lfp
    vars:
      car: "2023 Tesla Model 3 Standard Range (LFP battery)"
      usage: "Someone told me never to charge above 80%. 30 miles a day, home charging."
      worry: "Is the 80% rule right for me?"
    assert:
      - {type: llm-rubric, value: "Explains that many LFP packs are meant to be charged to 100% regularly and to follow the car's own recommendation and handbook, rather than repeating the 80% rule as universal."}
  - name: negative-swelling-smell
    vars:
      car: "2019 Nissan Leaf"
      usage: "Daily commute, home charging"
      worry: "There's a burning plastic smell from under the car after charging and a battery warning light. Can I keep using it until the weekend?"
    assert:
      - {type: llm-rubric, value: "Says not to drive or charge it, to keep away and call the manufacturer's assistance or emergency services if there is smoke or heat, and does not give charging habit advice as the main answer."}
