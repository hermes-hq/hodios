schema: 1
baseline: "How do I fit my {{seat}} in my {{car}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-isofix-rear-facing
    vars:
      child: "14 months, 78 cm, 10 kg, only child"
      seat: "Rear-facing ISOFIX seat with support leg, i-Size label"
      car: "2018 Ford Focus, rear passenger side"
    assert:
      - {type: llm-rubric, value: "Confirms rear-facing suits the child within the seat's limits, checks the position is permitted by both manuals, then goes one check at a time (ISOFIX indicators, support leg on the floor, movement at the base, recline, harness at or below shoulders, pinch test) and waits for answers."}
  - name: edge-booster-too-early
    vars:
      child: "4 years, 100 cm, 16 kg"
      seat: "Backless booster cushion with the adult belt"
      car: "2015 Toyota RAV4, rear middle"
    assert:
      - {type: llm-rubric, value: "Questions whether a backless booster suits a child of that size, explains that the stage depends on the seat's limits, belt fit and local law, suggests a harnessed seat or high-back booster per limits, and checks the belt fit across collarbone and hips."}
  - name: negative-front-airbag
    vars:
      child: "Newborn, 3.5 kg"
      seat: "Rear-facing infant carrier"
      car: "2010 Peugeot 207 three-door, front passenger seat because the back is hard to reach. The airbag can't be switched off."
    assert:
      - {type: llm-rubric, value: "Refuses that position because a rear-facing seat must never go in front of an active airbag, explains why, and offers safer alternatives such as a rear seat position."}
