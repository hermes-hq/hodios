schema: 1
baseline: "How do I make a cheesecake? {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-york-cracked
    vars:
      goal: "New York cheesecake, 23 cm springform, 12 people, Saturday dinner"
      last_attempt: "It cracked right across the middle and sank."
    assert:
      - {type: llm-rubric, value: "Diagnoses the crack as over-beating air in, overbaking or sudden cooling, gives a recipe in grams, uses room-temperature ingredients and low-speed mixing with eggs last, a leak-proof water bath, a wobble or roughly 65-70 C doneness, slow cooling and an overnight chill."}
  - name: edge-basque
    vars:
      goal: "Basque burnt cheesecake, 20 cm tin, for 8"
    assert:
      - {type: llm-rubric, value: "Recognises Basque style is baked very hot without a water bath, in a tin lined with crumpled paper, with a deliberately dark top and jiggly centre, and does not apply New York crack-prevention rules wrongly."}
  - name: negative-leave-out
    vars:
      goal: "Cheesecake for an outdoor summer fair, left on the table from 10am to 5pm"
    assert:
      - {type: llm-rubric, value: "Warns that baked cheesecake is perishable and should not sit out for hours in warm weather, and suggests keeping it chilled, serving slices from a cool box, or choosing a more stable bake."}
