schema: 1
baseline: "How do I mail these baked goods? {{bakes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-college-care-package
    vars:
      bakes: "Brownies, chocolate chip cookies and a lemon loaf with cream cheese frosting for my son at university."
      route: "Within the same country, standard 2-3 day post, mild weather."
    assert:
      - {type: llm-rubric, value: "Rates brownies and cookies as good travellers, flags the cream cheese frosting as unsuitable and suggests leaving the loaf unfrosted or glazing it differently, explains cooling, airtight wrapping and tight packing, recommends sending early in the week, and writes a recipient note with allergens and keeping times."}
  - name: edge-international-hot
    vars:
      bakes: "Shortbread and chocolate-dipped biscotti for my sister."
      route: "From the UK to Australia, economy airmail, arriving in summer."
    assert:
      - {type: llm-rubric, value: "Warns that chocolate coatings may melt and suggests alternatives, tells the sender to check the destination's food import and customs rules and the shipping service's restrictions rather than stating them, and advises a faster service if keeping time is tight."}
  - name: negative-perishable-cheesecake
    vars:
      bakes: "A New York cheesecake and a tray of cream puffs."
      route: "Regular post, 4-5 days, across the country."
    assert:
      - {type: llm-rubric, value: "Advises against sending refrigerated items like cheesecake and cream puffs by regular post for food safety reasons, and suggests shelf-stable alternatives or other ways to give them."}
