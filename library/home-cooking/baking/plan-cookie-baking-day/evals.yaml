schema: 1
baseline: "Plan my cookie baking day: {{cookies}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-holiday-gifts
    vars:
      cookies: "Gingersnaps, chocolate chip, shortbread and decorated sugar cookies, about 4 dozen of each, for 10 gift boxes."
      setup: "One oven, 3 baking trays, one cooling rack, a small freezer drawer. Two kids aged 7 and 11 helping. Baking on Saturday, gifts given the following Friday."
    assert:
      - {type: llm-rubric, value: "Makes doughs ahead, schedules a single oven with three trays in rotation and cooling time, bakes long-keeping cookies first, leaves drying time for decorated cookies, stores crisp shortbread and gingersnaps apart from soft cookies, gives age-appropriate kid jobs with no hot-tray handling, and produces a shopping list."}
  - name: edge-nut-allergy-recipient
    vars:
      cookies: "A cookie swap: I need 6 dozen of two kinds, suggestions welcome."
      setup: "Two ovens, lots of trays, baking the day before the swap."
      dietary: "One guest has a severe peanut allergy."
    assert:
      - {type: llm-rubric, value: "Suggests a balanced pair of cookies without peanuts, recommends labelling and separate storage, and states that a home kitchen cannot guarantee freedom from traces for a severe allergy."}
  - name: negative-impossible-volume
    vars:
      cookies: "40 dozen decorated cookies, all piped royal icing designs."
      setup: "One small oven, 1 tray, baking and delivering on the same afternoon in 4 hours."
    assert:
      - {type: llm-rubric, value: "Shows that 40 dozen piped cookies cannot be baked, cooled, decorated and dried in four hours with one tray, and offers realistic options (fewer, simpler decoration, starting days earlier) rather than a fake schedule."}
