schema: 1
baseline: "Give me a recipe for {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cinnamon-rolls-brunch
    vars:
      goal: "12 cinnamon rolls out of the oven at 10am Sunday for brunch"
      kitchen: "Stand mixer, 21 C kitchen, fridge space"
    assert:
      - {type: llm-rubric, value: "Gives a formula in grams with baker's percentages, adds butter after building strength, uses an overnight fridge proof so the morning work is short, gives a schedule backwards from 10am, and a doneness temperature."}
  - name: edge-dairy-free-challah
    vars:
      goal: "Two six-strand challahs for Friday dinner"
      kitchen: "By hand, warm kitchen 27 C, must be dairy-free"
    assert:
      - {type: llm-rubric, value: "Uses oil instead of butter with no milk, gives braiding guidance for six strands, adjusts for the warm kitchen with cooler water or less yeast, and recommends a double egg wash."}
  - name: negative-rush
    vars:
      goal: "Brioche from scratch, starting now, ready in 90 minutes for guests"
    assert:
      - {type: llm-rubric, value: "Says honestly that real brioche cannot be made well in 90 minutes because of slow enriched-dough proofing, and offers a quicker alternative (a quick bread, a shortcut sweet bun with more yeast and smaller shapes, or baking brioche tomorrow)."}
