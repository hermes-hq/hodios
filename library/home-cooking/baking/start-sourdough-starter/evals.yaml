schema: 1
baseline: "How do I make a sourdough starter?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cool-kitchen-rye
    vars:
      flour_available: "strong white bread flour and wholemeal rye"
      kitchen_temperature: "about 18°C, it's winter"
    assert:
      - {type: contains, value: "## Troubleshooting"}
      - {type: llm-rubric, value: "Starts with rye or a rye blend, uses grams at 1:1:1, warns about the quiet phase around days 4-6 so the baker does not give up, adapts to 18°C with a warm spot and slower timeline, defines readiness as reliably doubling within about 4-8 hours, calls the float test unreliable, and gives a troubleshooting table."}
  - name: edge-hot-kitchen
    vars:
      kitchen_temperature: "30°C, no air conditioning"
    assert:
      - {type: llm-rubric, value: "Adjusts for heat by feeding more often or using a higher ratio such as 1:2:2 or cooler water, and explains how a fast, soupy or very sour starter at that temperature relates to hunger rather than failure."}
  - name: negative-self-raising-flour
    vars:
      flour_available: "only self-raising flour, the shop was out of everything else"
    assert:
      - {type: llm-rubric, value: "Says self-raising flour, with its added raising agents and often salt, will not work well for a starter and names a plain, bread or wholemeal flour to buy instead, rather than building the day-by-day plan on self-raising flour; the troubleshooting still tells the baker to discard a starter with pink, orange or fuzzy mould."}
