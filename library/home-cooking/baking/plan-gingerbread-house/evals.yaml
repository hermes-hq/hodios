schema: 1
baseline: "How do I make a gingerbread house? {{design}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-cottage
    vars:
      design: "A simple cottage about 15 cm wide, built with my kids aged 5 and 9."
      purpose: "We'll eat it on Christmas Eve, starting three days before."
    assert:
      - {type: llm-rubric, value: "Gives a piece list with dimensions that account for dough thickness at the joins, a low-leavening construction dough, trimming against templates while warm, stiff meringue-powder royal icing as glue, walls set with supports before the roof, edible-only decoration, adult-only hot and knife jobs, and a three-day timeline."}
  - name: edge-display-village
    vars:
      design: "A village of five small houses for a shop window display."
      purpose: "Display only, must last four weeks."
    assert:
      - {type: llm-rubric, value: "Plans the five houses with templates, notes that display-only builds can use stronger inedible methods but must then not be eaten and should be labelled or kept from children, and addresses durability over four weeks."}
  - name: negative-hot-glue-but-eat
    vars:
      design: "A big house we'll glue together with hot glue so it's strong, then the kids will eat it."
    assert:
      - {type: llm-rubric, value: "Explains that a house glued with hot glue must not be eaten, and offers either royal icing construction for an edible house or a display-only build, rather than accepting both."}
