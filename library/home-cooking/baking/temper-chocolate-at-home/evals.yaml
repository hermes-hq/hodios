schema: 1
baseline: "How do I temper chocolate for {{project}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bonbon-moulds
    vars:
      project: "Moulded dark chocolate bonbons, about 30, for gifts next week"
      chocolate: "70% dark couverture callets"
      kitchen: "19 C, instant-read thermometer, microwave"
    assert:
      - {type: llm-rubric, value: "Recommends seeding or microwave tempering with amounts, gives working temperatures around 31-32 C for dark with a note to follow the packet curve, the smear test, shell-and-tap-out moulding technique, and cool dry storage rather than the fridge."}
  - name: edge-chips
    vars:
      project: "Chocolate-dipped pretzels for a party"
      chocolate: "Milk chocolate chips"
    assert:
      - {type: llm-rubric, value: "Explains that chips contain stabilisers and temper poorly, suggests bars or couverture for a proper temper or a compound coating that needs no tempering, and gives milk chocolate working temperatures."}
  - name: negative-water-seized
    vars:
      project: "Bark. I added a splash of milk to the melted chocolate to thin it and now it's a grainy lump. Can I still temper it?"
    assert:
      - {type: llm-rubric, value: "Explains the chocolate seized from the liquid and cannot be tempered now, suggests using it for ganache, sauce or brownies, and says to start again with dry tools."}
