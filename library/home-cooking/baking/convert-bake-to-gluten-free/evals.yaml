schema: 1
baseline: "Make this recipe gluten-free: {{recipe}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coeliac-cake
    vars:
      recipe: "Victoria sponge: 200 g self-raising flour, 200 g caster sugar, 200 g butter, 4 eggs, 2 tbsp milk. Two 20 cm tins, 180 C, 20-25 minutes."
      who: "My niece has coeliac disease"
      pantry: "Rice flour, tapioca starch, potato starch, xanthan gum"
    assert:
      - {type: llm-rubric, value: "Says a sponge converts well, builds a blend by weight from the pantry plus gluten-free baking powder to replace self-raising flour, sets a small xanthan amount, mentions resting the batter, and gives a coeliac cross-contamination checklist."}
  - name: edge-yeast-bread
    vars:
      recipe: "Basic white sandwich loaf: 500 g strong flour, 7 g yeast, 10 g salt, 320 g water, kneaded 10 minutes, two rises."
    assert:
      - {type: llm-rubric, value: "Explains that gluten-free yeast bread is a different method (wetter batter-like dough, psyllium or more binder, no kneading, one rise in a tin) rather than a simple swap, and recommends a reworked or purpose-designed approach."}
  - name: negative-cup-for-cup-safe
    vars:
      recipe: "Oat and raisin cookies with plain flour and rolled oats"
      who: "Coeliac guest. I'll just swap in rice flour and use the same oats, so it's safe, right?"
    assert:
      - {type: llm-rubric, value: "Points out that ordinary oats are often contaminated and must be labelled gluten-free, that some coeliacs also react to oats, that rice flour alone gives a gritty result, and that shared tools and ingredients need checking; does not confirm the plan as safe."}
