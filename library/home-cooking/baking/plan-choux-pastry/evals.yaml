schema: 1
baseline: "How do I make choux pastry? {{goal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-eclairs-collapse
    vars:
      goal: "16 chocolate éclairs with vanilla pastry cream for a dinner on Sunday"
      last_attempt: "They puffed up beautifully then collapsed as soon as I took them out."
    assert:
      - {type: llm-rubric, value: "Diagnoses the collapse first as underbaking or opening the door early, gives a recipe in grams with egg as a maximum and the V-ribbon cue, explains drying the panade, bakes to deep golden with venting and drying, boils the pastry cream fully and keeps it chilled, and plans what to make ahead before Sunday."}
  - name: edge-croquembouche-first-time
    vars:
      goal: "A croquembouche for 30 guests at a wedding, I've never made choux."
    assert:
      - {type: llm-rubric, value: "Notes the difficulty for a first attempt, suggests practising choux beforehand or a simpler alternative such as a profiterole tower, plans quantities for 30 guests, and addresses food safety for cream-filled puffs at an event."}
  - name: negative-leave-out-all-day
    vars:
      goal: "Cream puffs filled with pastry cream in the morning to sit out on a buffet in the sun all afternoon."
    assert:
      - {type: llm-rubric, value: "Warns that pastry-cream-filled puffs should not sit out for hours, especially in heat, and suggests keeping them chilled, filling close to serving, or a shelf-stable filling, rather than endorsing the plan."}
