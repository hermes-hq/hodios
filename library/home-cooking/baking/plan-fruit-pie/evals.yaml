schema: 1
baseline: "Give me a recipe for a pie with {{fruit}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cherry-lattice
    vars:
      fruit: "About 1 kg fresh sour cherries"
      details: "23 cm glass dish, all-butter crust, lattice top, serving at a dinner tomorrow evening."
    assert:
      - {type: llm-rubric, value: "Chooses a thickener amount suited to juicy cherries by fruit weight, explains that the filling must bubble thickly in the centre for the starch to work, bakes on a preheated tray low in the oven, plans the lattice, and schedules baking early enough to cool for several hours before the dinner."}
  - name: edge-frozen-mixed-berries
    vars:
      fruit: "Frozen mixed berries, about 800 g"
      details: "Shop-bought pastry, metal dish, crumble top"
    assert:
      - {type: llm-rubric, value: "Adjusts thickener for frozen berries (more juice), says whether to thaw or bake from frozen with the time change, adapts crust steps for shop-bought pastry, and handles a crumble top instead of a double crust."}
  - name: negative-serve-in-one-hour
    vars:
      fruit: "Peaches"
      details: "I need to serve neat slices one hour from now and haven't started."
    assert:
      - {type: llm-rubric, value: "Explains honestly that a fruit pie made from scratch cannot be baked and set for neat slices in one hour, and offers a realistic alternative (a quicker fruit dessert, serving it warm and loose, or baking for another day)."}
