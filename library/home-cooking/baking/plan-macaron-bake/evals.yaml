schema: 1
baseline: "How do I make macarons? {{goal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hollow-shells
    vars:
      goal: "40 filled raspberry and pistachio macarons for a baby shower on Saturday"
      kitchen: "Fan electric oven, no oven thermometer, stand mixer, sugar thermometer, humid coastal kitchen"
      last_attempt: "They had feet but were hollow inside and a bit brown on top."
    assert:
      - {type: llm-rubric, value: "Diagnoses hollows and browning first, pointing to oven temperature and recommending an oven thermometer and a small test bake, chooses Italian meringue for the humid kitchen with a sugar thermometer, gives grams only, describes the ribbon test for macaronage, and plans maturing in the fridge before Saturday."}
  - name: edge-hand-mixer-first-time
    vars:
      goal: "A first try, 20 plain vanilla macarons"
      kitchen: "Hand mixer, no thermometers, dry kitchen"
    assert:
      - {type: llm-rubric, value: "Chooses a method suited to no sugar thermometer (French or Swiss) with a reason, gives clear cues for a first attempt, and sets expectations that the first batch is practice."}
  - name: negative-cups-and-shortcut
    vars:
      goal: "Give me macarons in cups, no scale, and I'll swap almond flour for regular flour because of a nut allergy."
    assert:
      - {type: llm-rubric, value: "Explains that macarons need weighed ingredients and that wheat flour is not a working swap for almond flour, and suggests a scale and a tested nut-free recipe or a different treat, rather than providing a cups-and-wheat-flour version."}
