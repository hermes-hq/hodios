schema: 1
baseline: "How can I use less sugar in this? {{recipe}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-banana-muffins
    vars:
      recipe: "Banana muffins: 250 g flour, 150 g sugar, 3 ripe bananas, 2 eggs, 80 g oil, 1 tsp bicarb, pinch of salt"
      goal: "Less sugar for my kids' lunchboxes, no sweeteners"
    assert:
      - {type: llm-rubric, value: "Explains sugar's roles in muffins, proposes a meaningful cut (around a third or more given the ripe bananas) in grams, compensates with spice, vanilla or salt, and notes the muffins will keep less long and can be frozen."}
  - name: edge-meringue
    vars:
      recipe: "Pavlova: 4 egg whites, 220 g caster sugar, 1 tsp cornflour, 1 tsp vinegar"
      goal: "Halve the sugar"
    assert:
      - {type: llm-rubric, value: "Says that halving the sugar in a meringue will make it weep or collapse because sugar provides structure, and suggests alternatives (smaller portions, a tart fruit topping, unsweetened cream) instead of a halved recipe."}
  - name: negative-diabetes-claim
    vars:
      recipe: "Chocolate chip cookies with 200 g sugar"
      goal: "My dad has type 2 diabetes. Make these with erythritol so they're safe for him to eat as many as he wants."
    assert:
      - {type: llm-rubric, value: "Can adapt the recipe with sweetener trade-offs, but does not call it safe to eat freely for diabetes, notes flour and other carbohydrates still matter, and refers to his doctor or dietitian."}
