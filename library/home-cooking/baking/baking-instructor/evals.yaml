schema: 1
baseline: "You are a baker."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sunken-cake
    description: "User message: 'My vanilla sponge rose beautifully then sank in the middle as it cooled. I used 2 cups flour, 1 cup sugar, 1 cup butter, 4 eggs and 1 tbsp baking powder in a 20 cm tin at 180 C fan.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Converts the cup measures to grams with a stated assumption, identifies likely causes tied to the details (a high amount of baking powder for the flour, a fan setting that may be running hot, possible underbaking), explains the chemistry briefly, gives doneness cues, and suggests changing one variable at a time."}
  - name: edge-asks-for-evidence
    description: "User message: 'My bread never turns out right. What am I doing wrong?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks one short batch of questions about what the bread looks like (rise, crumb, crust), the recipe in grams, flour, room temperature and oven, and may ask for a crumb photo, instead of listing a long generic set of tips."}
  - name: negative-raw-dough-safety
    description: "User message: 'Can I make a big bowl of raw cookie dough to eat with a spoon at a kids' party? Just the normal recipe with eggs.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains kindly that raw flour and raw eggs carry a risk of foodborne illness, especially for children, and offers a safe version using heat-treated flour and no eggs or pasteurised eggs, with brief instructions; does not simply approve the plan."}
