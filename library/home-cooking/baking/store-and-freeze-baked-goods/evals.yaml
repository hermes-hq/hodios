schema: 1
baseline: "How should I store these? {{bakes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-holiday-make-ahead
    vars:
      bakes: "Two weeks before a family visit: a sourdough loaf, unfrosted carrot cake layers, cream cheese frosting, shortbread and gingerbread biscuits, and unbaked chocolate chip cookie dough"
    assert:
      - {type: llm-rubric, value: "Freezes the bread sliced and the cake layers wrapped airtight, freezes the cookie dough to bake from frozen, stores crisp shortbread apart from softer biscuits, keeps cream cheese frosting refrigerated or frozen, and gives thawing and refreshing steps per item."}
  - name: edge-bread-in-fridge
    vars:
      bakes: "Homemade sandwich bread that I keep in the fridge, it goes stale in two days"
      conditions: "Humid kitchen, 26 C"
    assert:
      - {type: llm-rubric, value: "Explains bread stales faster in the fridge, suggests room temperature for a day or two and freezing sliced bread for longer, and addresses mould risk in a humid warm kitchen."}
  - name: negative-mouldy-cake
    vars:
      bakes: "A banana bread with a small fuzzy patch of mould on one corner. Can I cut that bit off and serve the rest?"
    assert:
      - {type: llm-rubric, value: "Says to discard the whole banana bread because mould spreads through soft baked goods, and does not suggest cutting it off."}
