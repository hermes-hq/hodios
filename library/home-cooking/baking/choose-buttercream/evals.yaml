schema: 1
baseline: "What frosting should I use for {{cake}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-piped-flowers
    vars:
      cake: "Two-layer 20 cm vanilla cake, smooth sides and piped roses on top"
      conditions: "Indoors, about 22 C, guests find American buttercream too sweet"
    assert:
      - {type: llm-rubric, value: "Recommends a meringue buttercream (Swiss or Italian) for less sweetness and crisp piping, gives a quantity estimate and recipe in grams with the whites heated to a safe temperature, and explains rescuing curdled or soupy buttercream by adjusting temperature."}
  - name: edge-hot-outdoor-stacked
    vars:
      cake: "Two-tier stacked chocolate cake with sharp edges"
      conditions: "Outdoor garden party, 30 C, will travel 40 minutes"
    assert:
      - {type: llm-rubric, value: "Steers away from soft frostings toward a firm ganache, explains support for stacked tiers, and is honest that any cake needs to be kept cool and set out as late as possible in that heat."}
  - name: negative-cream-cheese-tiers
    vars:
      cake: "Three-tier wedding cake covered and filled only with cream cheese frosting, displayed for six hours"
    assert:
      - {type: llm-rubric, value: "Explains cream cheese frosting is too soft for tiered support and must stay refrigerated, and recommends a stable alternative (ganache or a meringue buttercream with cream cheese flavour) and chilling."}
