schema: 1
baseline: "Help me make a cake for {{occasion}} for {{servings}} people."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kids-birthday-summer
    vars:
      occasion: "my son's 7th birthday, dinosaur theme, outdoor garden party in July, one child is allergic to nuts"
      servings: 25
      skill: beginner
    assert:
      - {type: contains, value: "## Timeline"}
      - {type: llm-rubric, value: "Sizes tins for 25 party slices with the slice arithmetic, avoids whipped cream for an outdoor July party and picks a more stable frosting, spreads baking and decorating over days, keeps decoration beginner-friendly (rustic finish, toy dinosaurs on a barrier or posy pick), excludes nuts including in sprinkles or marzipan, and gives refrigeration and time-out guidance."}
  - name: edge-advanced-tiered
    vars:
      occasion: "intimate wedding, elegant, indoors in October"
      servings: 80
      skill: advanced
    assert:
      - {type: llm-rubric, value: "Uses wedding-size slices, proposes stacked tiers with sizes that reach about 80 slices plus spare, includes dowels and cake boards, a multi-day timeline, and techniques suited to an advanced baker."}
  - name: negative-beyond-skill
    vars:
      occasion: "a 3-tier sculpted castle cake with sugar-glass windows for my niece's party tomorrow"
      servings: 20
      skill: beginner
    assert:
      - {type: llm-rubric, value: "Explains that a three-tier sculpted cake with sugar work is not realistic for a beginner in one day and offers a simpler castle-themed cake sized for 20 that keeps the theme."}
