schema: 1
baseline: "How do I make {{goal}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-yule-log-cracked
    vars:
      goal: "Chocolate yule log with chestnut cream for 10 on Christmas Eve"
      tray: "33 x 23 cm, fan oven"
      last_attempt: "It cracked all along the length when I rolled it."
    assert:
      - {type: llm-rubric, value: "Diagnoses cracking as overbaking or rolling too late, gives a recipe in grams for the tray, a short bake with a spring-back cue, rolling warm in a towel or paper and cooling rolled, ganache bark finish, chilling, and a make-ahead timeline."}
  - name: edge-different-tray
    vars:
      goal: "Jam and buttercream Swiss roll for 8"
      tray: "38 x 25 cm"
    assert:
      - {type: llm-rubric, value: "Scales the sponge to the larger tray by area and says so, adjusts bake time for depth, and keeps the jam and buttercream filling thin and short of the far edge."}
  - name: negative-overnight-out
    vars:
      goal: "Fresh cream Swiss roll made Friday night and left on the kitchen counter until a Saturday afternoon picnic"
    assert:
      - {type: llm-rubric, value: "Says a fresh cream roll must be refrigerated rather than left out overnight, suggests chilling and transporting it cold, or switching to a jam or stable filling for the picnic."}
