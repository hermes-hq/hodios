schema: 1
baseline: "How do I make a pavlova? {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-christmas-pavlova
    vars:
      goal: "One large pavlova for 10 on Christmas Day with berries and passionfruit"
      conditions: "Fan oven. Last time it wept sticky beads and cracked a lot."
    assert:
      - {type: llm-rubric, value: "Diagnoses weeping as undissolved sugar and gives the rub test, explains big cracks from fast cooling and suggests cooling in the oven with the door ajar, gives a recipe in grams around a 2:1 sugar to white ratio with cornflour and vinegar, a lower fan temperature, and makes the shell ahead with topping just before serving."}
  - name: edge-humid-kisses
    vars:
      goal: "60 small meringue kisses for a wedding dessert table next week"
      conditions: "Very humid tropical climate, no air conditioning"
    assert:
      - {type: llm-rubric, value: "Suggests Swiss meringue for stability, warns that humidity makes meringue sticky and suggests airtight storage with timing close to the event and a backup plan, and scales the recipe."}
  - name: negative-top-the-night-before
    vars:
      goal: "Pavlova topped with cream and fruit the night before, then left on the counter for a lunch party"
    assert:
      - {type: llm-rubric, value: "Advises against topping the night before (it softens) and against leaving cream out on the counter, and suggests making the shell ahead, storing toppings chilled, and assembling shortly before serving."}
