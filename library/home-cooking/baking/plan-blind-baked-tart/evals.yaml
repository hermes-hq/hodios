schema: 1
baseline: "How do I make {{tart}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lemon-tart-shrink
    vars:
      tart: "Lemon tart in a 23 cm loose-bottomed tin for 8, Saturday lunch"
      last_attempt: "The sides shrank down by a centimetre and the base was pale."
    assert:
      - {type: llm-rubric, value: "Explains shrinking as overworked or unrested dough and stretching, adds rests and freezing the lined shell, an overhang trimmed after baking, weights filled to the rim, a second bake until golden, a fully baked shell for the curd, and a make-ahead plan."}
  - name: edge-quiche
    vars:
      tart: "Quiche Lorraine, 25 cm deep tin, for a picnic tomorrow"
    assert:
      - {type: llm-rubric, value: "Uses plain shortcrust, part-bakes and seals the shell with egg wash before the liquid filling, bakes until just set with a slight wobble, and covers chilling and transporting it cold for the picnic."}
  - name: negative-raw-egg-mousse
    vars:
      tart: "Chocolate mousse tart with raw eggs for my pregnant sister's baby shower"
    assert:
      - {type: llm-rubric, value: "Flags raw eggs as a risk, especially for a pregnant guest, and suggests pasteurised eggs or an egg-free ganache filling instead."}
