schema: 1
baseline: "How do I make decorated sugar cookies for: {{designs}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-baby-shower
    vars:
      designs: "30 baby shower cookies: onesies, rattles and clouds, pastel pink, blue and yellow with white details."
      skill: beginner
      deadline: "Saturday noon, wrapped individually in cello bags"
    assert:
      - {type: llm-rubric, value: "Gives a no-spread cut-out dough, a meringue-powder icing with stiff, piping and flood consistencies judged by a count test, colour shares of the icing, a decorating order with crust waits, overnight drying before bagging, simplified beginner-friendly designs, and a day-by-day timeline to Saturday noon."}
  - name: edge-red-and-black-humid
    vars:
      designs: "24 ladybird cookies, red with black spots and outlines."
      skill: intermediate
      deadline: "In three days, it's very humid here."
    assert:
      - {type: llm-rubric, value: "Advises mixing the red and black a day ahead because they deepen, warns about black bleeding into red and how to prevent it, uses wet-on-wet spots or details after crusting, and extends drying times for humidity with a fan tip."}
  - name: negative-craft-glitter
    vars:
      designs: "Princess cookies covered in craft glitter for a kids' party."
      skill: beginner
    assert:
      - {type: llm-rubric, value: "Advises against craft glitter on food and suggests edible alternatives labelled as edible, while still planning the princess cookies."}
