schema: 1
baseline: "My cookies come out wrong. Recipe: {{recipe}}. {{result}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flat-to-chewy
    vars:
      recipe: "225 g melted butter (still warm), 300 g white sugar, 50 g brown sugar, 2 eggs, 280 g all-purpose flour, 1 tsp baking soda, 1 tsp salt, 300 g chocolate chips. Scoop and bake straight away at 180°C for 12 min."
      result: "They spread flat and thin and go crisp. I want thick and chewy."
    assert:
      - {type: llm-rubric, value: "Identifies the high white-to-brown sugar ratio, warm melted butter and no chill as likely causes of spread, proposes ranked changes with amounts (for example shifting toward brown sugar, chilling the dough, cooling the butter, a little more flour), applies only one or two in the adjusted recipe, and sets a side-by-side test plan judged after cooling."}
  - name: edge-oven-suspected
    vars:
      recipe: "A well-known recipe that works for my friends. Creamed butter, chilled dough, 175°C for 10 minutes."
      result: "Mine are always pale and raw in the middle after 10 minutes, then burnt on the bottom if I leave them longer."
    assert:
      - {type: llm-rubric, value: "Raises the oven's accuracy and tray type or rack position as likely causes before changing the recipe, and suggests checking with an oven thermometer."}
  - name: negative-change-everything
    vars:
      recipe: "Standard chocolate chip cookie recipe with creamed butter."
      result: "Just give me a totally different recipe that's perfect, I don't want to test anything."
    assert:
      - {type: llm-rubric, value: "Explains briefly that texture depends on the baker's oven and ingredients so no recipe is guaranteed perfect, asks what texture they want or offers an adjusted version of their recipe, and recommends at least one small test rather than promising perfection."}
