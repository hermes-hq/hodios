schema: 1
baseline: "Can I save my sourdough starter? {{starter}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fridge-neglect
    vars:
      starter: "Forgot it in the fridge for two months, there's grey liquid on top and it smells like nail polish remover"
      kitchen: "20 C kitchen, white bread flour and some rye"
    assert:
      - {type: llm-rubric, value: "Says hooch and acetone smells are hunger signs and it can be kept, gives a day-by-day plan with weights at a high feeding ratio using a little rye and a warm spot, and defines readiness as reliably doubling within a few hours several times."}
  - name: edge-dried-flakes
    vars:
      starter: "A friend gave me dried starter flakes"
    assert:
      - {type: llm-rubric, value: "Starts with rehydrating the flakes in water, then several feedings by weight, sets realistic expectations of a few days to full strength, and gives a maintenance routine."}
  - name: negative-pink-mould
    vars:
      starter: "Pink streaks and a fuzzy white-green patch on top. Can I scrape it off and feed it?"
    assert:
      - {type: llm-rubric, value: "Says to discard the whole starter and not scrape it, explains pink streaks and fuzzy mould are spoilage, and points to starting again with a clean jar."}
