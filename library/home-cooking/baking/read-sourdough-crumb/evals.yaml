schema: 1
baseline: "What went wrong with my sourdough? {{loaf}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-underfermented
    vars:
      loaf: "Tight dense crumb with a few big holes near the top, gummy band at the bottom, pale and quite tight, little oven spring"
      process: "500 g bread flour, 350 g water, 10 g salt, 100 g levain; kitchen 19 C; bulk 4 hours as per recipe, rose maybe 20%; shaped, fridge 12 hours; Dutch oven 250 C"
    assert:
      - {type: llm-rubric, value: "Diagnoses under-fermented bulk tied to the cool kitchen and small rise, recommends extending bulk until a target rise at their temperature (not a fixed time) as the single change, and gives cues to watch next time."}
  - name: edge-flat-spread
    vars:
      loaf: "Flat and spread, even small holes, no ear, quite sour"
      process: "80% hydration with all-purpose flour, 28 C kitchen, bulk 7 hours, rose more than double"
    assert:
      - {type: llm-rubric, value: "Identifies likely over-fermentation in the warm kitchen and possibly too much water for the flour, suggests one main change (shorter bulk or cooler dough) and a second to try later, and states confidence."}
  - name: negative-unclear-input
    vars:
      loaf: "It just didn't turn out right"
      process: "Normal recipe"
    assert:
      - {type: llm-rubric, value: "Does not invent a diagnosis; asks for a photo of the cut loaf or a description of crumb and shape plus process details such as temperature and rise, and explains what to photograph."}
