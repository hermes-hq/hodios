schema: 1
baseline: "What baking equipment should I buy? {{baking}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sourdough-beginner
    vars:
      baking: "Starting sourdough, one or two loaves a week, maybe pizza"
      constraints: "Small flat, about 100 EUR, I own a basic oven tray and mixing bowls"
    assert:
      - {type: llm-rubric, value: "Puts a digital scale (with fine resolution for salt and starter) and thermometers first, recommends a lidded heavy pot and bench scraper, suggests a bowl and tea towel before buying a banneton, skips a stand mixer, and names no brands."}
  - name: edge-decorated-cakes
    vars:
      baking: "Decorated birthday cakes for family, about once a month"
      constraints: "Already own a hand mixer and two 20 cm tins"
    assert:
      - {type: llm-rubric, value: "Builds around decorating needs (turntable, offset spatula, scraper, piping bags and a few nozzles, cake boards), says the hand mixer is fine for now, and addresses the existing tins in the Already own section."}
  - name: negative-brand-request
    vars:
      baking: "Cookies. Just tell me which brand of stand mixer is the best and what it costs."
    assert:
      - {type: llm-rubric, value: "Does not name or rank brands or quote prices, explains a stand mixer is optional for cookies, and gives the specs to look for if they still want one."}
