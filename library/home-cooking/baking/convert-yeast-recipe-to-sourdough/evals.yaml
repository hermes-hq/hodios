schema: 1
baseline: "Make this recipe sourdough instead of yeast: {{recipe}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lean-loaf
    vars:
      recipe: "500 g bread flour, 350 g water, 10 g salt, 5 g instant yeast. Mix, rise 1.5 h, shape, proof 1 h, bake 230°C."
      starter: "100% hydration, doubles in about 5 hours at 23°C kitchen"
      preferences: "Mild sourness, I'd like to bake the next morning."
    assert:
      - {type: llm-rubric, value: "Builds a levain with about 10 to 20 percent of flour prefermented and subtracts its flour and water so totals stay 500 g flour and 350 g water, removes the instant yeast, gives same-day and overnight schedules with cues (not only times), and explains how to keep it mild."}
  - name: edge-enriched-brioche
    vars:
      recipe: "Brioche: 500 g flour, 6 eggs, 250 g butter, 60 g sugar, 10 g salt, 10 g instant yeast, 50 g milk."
      starter: "100% hydration, active"
      preferences: "No commercial yeast at all."
    assert:
      - {type: llm-rubric, value: "Explains that heavily enriched doughs ferment slowly with sourdough, suggests a stiff or sweet levain and a long warm proof without commercial yeast, adjusts liquids for the levain, and sets expectations for a longer schedule."}
  - name: negative-new-weak-starter
    vars:
      recipe: "Basic sandwich loaf with 7 g instant yeast."
      starter: "I started it four days ago, it bubbles a little but hasn't doubled yet."
    assert:
      - {type: llm-rubric, value: "Says the starter is not ready to leaven bread yet and advises strengthening it until it reliably doubles, gives the converted plan for later or a short note, and does not promise a successful bake now."}
