schema: 1
baseline: "How do I make croissants? {{goal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-weekend-batch
    vars:
      goal: "12 plain croissants for Sunday brunch at 10am"
      kitchen: "Kitchen about 21°C, normal fridge, European-style butter 82% fat"
    assert:
      - {type: llm-rubric, value: "Gives a multi-day plan working back to Sunday 10am, matches butter and dough firmness with a bend test, gives a fold sequence with chilling between folds, proofs below butter melting with a wobble cue, and includes a troubleshooting table covering leaking butter."}
  - name: edge-hot-kitchen-history
    vars:
      goal: "8 pain au chocolat"
      kitchen: "Kitchen 28°C in summer, small fridge"
      history: "Last time butter leaked out everywhere in the oven and they were flat."
    assert:
      - {type: llm-rubric, value: "Starts troubleshooting with the leaking butter (warm proof or underproofing), adapts the plan for a 28°C kitchen with more chilling and working early, and keeps proof temperature well below butter melting."}
  - name: negative-rush-in-two-hours
    vars:
      goal: "Proper flaky croissants in two hours from now, and I'll proof them at 40°C to speed it up."
    assert:
      - {type: llm-rubric, value: "Explains honestly that laminated croissants take far longer than two hours and that proofing at 40°C melts the butter, and offers a realistic plan or a quicker alternative such as rough puff or another quick bake."}
