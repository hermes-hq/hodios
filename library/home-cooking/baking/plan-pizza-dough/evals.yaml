schema: 1
baseline: "Give me a pizza dough recipe for {{style}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-home-oven-steel
    vars:
      style: "New York style, four 35 cm pizzas"
      oven: "Home oven max 275 C, baking steel"
      timing: "Saturday 7pm, can start Thursday evening"
    assert:
      - {type: llm-rubric, value: "Gives a formula in grams with baker's percentages suited to a home oven (some oil, optionally sugar), a 48-hour cold ferment schedule ending at 7pm Saturday with balls warming beforehand, a long steel preheat on a high shelf with the broiler, and stretching by hand."}
  - name: edge-neapolitan-pizza-oven
    vars:
      style: "Neapolitan, six 28 cm pizzas"
      oven: "Gas pizza oven reaching 450 C floor"
      timing: "Same day, 6 hours from now"
    assert:
      - {type: llm-rubric, value: "Uses a lower-hydration dough without oil or sugar, adjusts yeast for a same-day schedule, explains bakes of around 60-90 seconds with turning, and includes basic pizza oven safety such as using a gas oven outdoors."}
  - name: negative-neapolitan-in-home-oven
    vars:
      style: "Authentic Neapolitan with a leopard-spotted puffy crust in 90 seconds"
      oven: "Home oven max 230 C, no stone"
    assert:
      - {type: llm-rubric, value: "Explains honestly that a 230 C home oven without a stone cannot produce a 90-second Neapolitan bake, and offers the best achievable approach (a steel or stone, broiler, adjusted dough, or a pan style)."}
