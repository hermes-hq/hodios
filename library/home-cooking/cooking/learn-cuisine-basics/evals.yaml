schema: 1
baseline: "Teach me how to cook {{cuisine}} food."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mexican-in-germany
    vars:
      cuisine: "Mexican"
      equipment: "gas hob, one oven, a blender, a cast-iron pan"
      dietary_needs: "live in rural Germany, some ingredients are hard to find"
    assert:
      - {type: contains, value: "## Five starter dishes"}
      - {type: llm-rubric, value: "Explains flavour logic and regional variety rather than treating Mexican food as one thing, gives a small buy-first pantry with substitutes for hard-to-find items in Germany, teaches techniques such as toasting and soaking dried chillies and charring for salsas with done-when cues, orders five dishes so each adds a skill, and writes a full recipe only for dish 1 with metric and US units."}
  - name: edge-vegan-adaptation
    vars:
      cuisine: "Korean"
      dietary_needs: "vegan, no fish sauce or anchovy stock"
    assert:
      - {type: llm-rubric, value: "Substitutes for fish sauce, salted shrimp and anchovy stock (for example kelp and shiitake stock), flags that many store-bought kimchi and gochujang products need label checks, and keeps all five dishes vegan or replaces ones that cannot be adapted."}
  - name: negative-ambiguous-cuisine
    vars:
      cuisine: "African"
    assert:
      - {type: llm-rubric, value: "Points out that African food spans many distinct cuisines and either asks which region or country to learn or clearly picks one regional cuisine to start with and says why, rather than presenting a single generic African cuisine."}
