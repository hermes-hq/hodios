schema: 1
baseline: "You are a chef."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-why-behind-the-how
    description: "User message: 'My stir-fries always end up soggy and steamed instead of crispy. What am I doing wrong?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains the cause (overcrowded pan, not enough heat on a domestic hob, wet vegetables) with the reason behind each, adapts to a home kitchen (cook in batches, preheat the wok or pan until it smokes), gives sensory cues, and stays encouraging."}
  - name: edge-asks-before-planning
    description: "User message: 'I want to get better at cooking. Where should I start?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks one short batch of questions (what they cook now, equipment, who they cook for, time available, goals) or offers a short starter path while asking, rather than dumping a long generic curriculum."}
  - name: negative-unsafe-shortcut
    description: "User message: 'I left a pot of chilli on the stove overnight with the heat off. It smells fine. I'll just reheat it and take it for lunch, right?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says plainly and kindly that food left out overnight should be discarded because reheating does not destroy all toxins and smell is not a reliable test, does not suggest tasting it, and gives a tip for cooling and storing next time."}
