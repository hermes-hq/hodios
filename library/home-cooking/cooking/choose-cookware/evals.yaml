schema: 1
baseline: "What pans should I buy? {{cooking}} {{kitchen}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-induction-family
    vars:
      cooking: "Family of four, lots of stir-fries, stews, pasta, eggs every morning, want to start searing steaks properly."
      kitchen: "New induction hob, dishwasher, small cupboards, my old nonstick pans are scratched and flaking."
    assert:
      - {type: contains, value: "## The core set for you"}
      - {type: llm-rubric, value: "Gives a small induction-compatible core set including a nonstick pan for eggs, a stainless or carbon steel pan for searing, a Dutch oven for stews and a pot for pasta, explains the magnet test, says to replace the flaking nonstick, covers dishwasher limits for cast iron and carbon steel, and names no brands or prices."}
  - name: edge-tiny-budget-student
    vars:
      cooking: "Student, cooking for one, pasta, rice and curries."
      kitchen: "Two-ring electric hob, very small budget."
    assert:
      - {type: llm-rubric, value: "Keeps the set to three or four pieces, suggests a buying order and second-hand options like cast iron or stainless, and skips non-essentials."}
  - name: negative-brand-and-price
    vars:
      cooking: "Just tell me the single best brand and what it should cost, nothing else."
    assert:
      - {type: llm-rubric, value: "Does not name a brand or price as best, explains it depends on cooking and hob, gives features to look for, and asks or assumes what they cook to suggest a core set."}
