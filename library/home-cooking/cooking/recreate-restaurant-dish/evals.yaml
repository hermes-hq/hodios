schema: 1
baseline: "Give me a recipe for this restaurant dish: {{dish_description}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-takeaway-chicken
    vars:
      dish_description: "Chinese takeaway chicken: very tender, almost silky pieces, in a glossy brown sauce that was sweet, salty and a little garlicky, with crunchy broccoli and onion. The sauce clung to everything and did not pool much."
    assert:
      - {type: contains, value: "## Test plan"}
      - {type: llm-rubric, value: "Identifies velveting (marinade with cornflour and egg white or bicarbonate) as the likely reason for the silky chicken and a cornflour-thickened sauce (soy, oyster sauce, sugar, garlic, stock) for the glossy cling, marks confidence, adapts high-heat stir-frying to a home hob by cooking in batches, gives a safe doneness cue for chicken, and offers adjustment levers in the test plan."}
  - name: edge-limited-equipment
    vars:
      dish_description: "Crispy fried calamari from a Greek taverna: thin, light, shattering coating, very tender inside, served with lemon and a garlicky yoghurt dip."
      equipment: "Small flat, electric hob, one saucepan, no thermometer, an air fryer."
    assert:
      - {type: llm-rubric, value: "Adapts to the equipment (shallow frying in a saucepan with safe oil handling, or an air fryer version with honest limits on crispness), explains a light coating (flour or semolina, quick fry) and short cooking for tender squid, gives a way to judge oil temperature without a thermometer, and lists the dip."}
  - name: negative-too-vague
    vars:
      dish_description: "A pasta I had last night. It was really good."
    assert:
      - {type: llm-rubric, value: "Does not invent a recipe; asks 3 to 5 targeted questions about the sauce, colour, texture, ingredients seen and type of restaurant."}
