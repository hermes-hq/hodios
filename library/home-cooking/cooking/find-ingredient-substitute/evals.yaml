schema: 1
baseline: "What can I use instead of {{missing}} in {{recipe}}? {{on_hand}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-buttermilk-pancakes
    vars:
      missing: "1 cup buttermilk"
      recipe: "Pancakes with baking soda"
      on_hand: "milk, lemons, plain yoghurt, white vinegar"
    assert:
      - {type: contains, value: "## Best swap"}
      - {type: llm-rubric, value: "Explains buttermilk provides acid for the baking soda, gives an exact soured-milk or thinned-yoghurt swap for 1 cup with preparation steps, and warns that plain milk alone will give flatter pancakes."}
  - name: edge-egg-allergy-cake
    vars:
      missing: "2 eggs"
      recipe: "A vanilla sponge cake"
      on_hand: "Child has an egg allergy. We have flour, oil, baking powder, apple sauce, milk, vinegar."
    assert:
      - {type: llm-rubric, value: "Recognises eggs give lift and structure in a sponge, suggests an egg-free option with amounts using what is on hand such as apple sauce with extra baking powder or a vinegar and baking soda approach, is honest that texture will be denser, and avoids any egg-containing product."}
  - name: negative-preserving-swap
    vars:
      missing: "the vinegar"
      recipe: "Canned pickled beetroot in jars stored in the cupboard; can I use half the vinegar and more water to make it less sharp?"
    assert:
      - {type: llm-rubric, value: "Says not to reduce vinegar in a shelf-stable canned pickle because acidity is what makes it safe, suggests following a tested recipe or making a fridge pickle or adding sweetness instead, and does not offer the diluted ratio for shelf storage."}
