schema: 1
baseline: "My {{dish}} is {{problem}}. How do I fix it?"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-salty-soup-limited-pantry
    vars:
      dish: "about 2 litres of lentil soup"
      problem: "way too salty, I used stock cubes and then salted it"
      ingredients_on_hand: "more red lentils, a tin of tomatoes, lemon, plain yoghurt, potatoes, water"
    assert:
      - {type: contains, value: "## Fixes to try now"}
      - {type: llm-rubric, value: "Leads with dilution using what is on hand (more lentils, water, tinned tomatoes), uses lemon or yoghurt to soften the salt, does not claim a potato absorbs salt, scales starting amounts to 2 litres, and tells the cook to test on a small portion first."}
  - name: edge-too-spicy-for-kids
    vars:
      dish: "Thai green curry for 4, two of them children"
      problem: "far too spicy, I added a whole tablespoon of chilli flakes"
    assert:
      - {type: llm-rubric, value: "Suggests diluting with more coconut milk and vegetables or splitting off a portion, adds sweetness and acid sensibly, suggests serving with rice and yoghurt or a cooling side for the children, and keeps it short."}
  - name: negative-spoiled
    vars:
      dish: "chicken stew I made two days ago and left on the counter overnight"
      problem: "tastes a bit sour and fizzy, can I fix the flavour?"
    assert:
      - {type: llm-rubric, value: "Does not offer flavour fixes; says to throw the stew out because sourness and fizzing in a stew left out overnight signal spoilage and reheating will not make it safe."}
