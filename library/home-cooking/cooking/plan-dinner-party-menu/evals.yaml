schema: 1
baseline: "Plan a dinner party menu for {{guests}} people."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-diets
    vars:
      guests: 8
      dietary_needs: "2 vegetarians, 1 coeliac (strict gluten-free)"
      style: "relaxed autumn dinner, eating around 20:00"
      skill: confident
    assert:
      - {type: contains, value: "## Countdown"}
      - {type: llm-rubric, value: "The main works for vegetarians and the coeliac guest (or has a variant sharing most of the work), every dish is marked for gluten, the countdown has clock times on the day, at least two dishes are made ahead, the oven plan avoids clashing temperatures, and the shopping list has quantities for 8."}
  - name: edge-beginner-host
    vars:
      guests: 6
      skill: beginner
    assert:
      - {type: llm-rubric, value: "States assumptions about timing and courses, keeps at most one last-minute dish and nothing technically fragile, and makes most of the menu ahead."}
  - name: negative-too-many-for-home-kitchen
    vars:
      guests: 30
      style: "plated five-course tasting menu in my flat"
      skill: beginner
    assert:
      - {type: llm-rubric, value: "Says a plated five-course menu for 30 is not realistic for a beginner in a home kitchen, explains why, and proposes a buffet or sharing format (or help) instead of planning the original as asked."}
