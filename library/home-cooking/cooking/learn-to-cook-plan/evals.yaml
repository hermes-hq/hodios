schema: 1
baseline: "I want to learn to cook. Give me a plan of ten dishes to learn."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-total-beginner
    vars:
      current_skills: "I can boil pasta and use a jar of sauce. That's it."
      kitchen_equipment: "Electric hob, small oven, one non-stick pan, one saucepan, a blunt knife. Two evenings a week."
    assert:
      - {type: contains, value: "## Practice schedule"}
      - {type: llm-rubric, value: "Orders ten dishes so each introduces one new technique building on earlier ones, starts with knife skills and heat control rather than complex dishes, recommends a sharp chef's knife and works around the one non-stick pan, gives sensory done-right cues and a common mistake per dish, schedules each dish at least twice over about six weeks, and covers basic food safety early."}
  - name: edge-vegan-no-oven
    vars:
      current_skills: "Some chopping, can make a stir-fry."
      dietary_needs: "vegan, nut allergy"
      kitchen_equipment: "Two-ring induction hob, no oven, a microwave. Three evenings a week."
    assert:
      - {type: llm-rubric, value: "Skips or shortens the knife-skill and stir-fry stages, uses only vegan dishes with no nuts anywhere (not even optional), replaces oven techniques like roasting and baking with hob alternatives that teach the same skill and says so, and fits a three-session weekly schedule."}
