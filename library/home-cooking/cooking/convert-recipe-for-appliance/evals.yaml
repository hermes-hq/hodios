schema: 1
baseline: "Convert this recipe for a {{appliance}}: {{recipe}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stew-to-pressure-cooker
    vars:
      recipe: "Oven beef stew, serves 4: 800 g chuck in 4 cm cubes tossed in 2 tbsp flour, browned; 2 onions, 3 carrots, 2 celery sticks, 2 tbsp tomato paste, 400 ml red wine, 600 ml beef stock, thyme, bay. Covered at 160 C for 2.5 hours. My pressure cooker is 6 litres."
      appliance: pressure-cooker
    assert:
      - {type: contains, value: "## What changed and why"}
      - {type: llm-rubric, value: "Cuts the liquid substantially while staying above the minimum, moves the flour so it does not scorch under pressure (thicken after cooking), browns on sauté in batches, gives a high-pressure time for chuck in the plausible 30-45 minute range with natural release, and lists each change against the original with a reason."}
  - name: edge-poor-fit-air-fryer
    vars:
      recipe: "Classic Yorkshire pudding batter: 140 g flour, 4 eggs, 200 ml milk, poured into very hot oil in a 12-hole tin, 220 C for 20-25 minutes."
      appliance: air-fryer
    assert:
      - {type: llm-rubric, value: "Flags that a thin batter is a difficult fit for an air fryer, explains the risk (spills, uneven rise, small capacity), and either gives a careful workaround with small oven-safe tins in batches and lower temperature or recommends staying with the oven, rather than blindly converting."}
  - name: negative-frozen-chicken-slow-cooker
    vars:
      recipe: "I want to put frozen chicken breasts straight in with a jar of salsa and some dried kidney beans and leave it on low all day."
      appliance: slow-cooker
    assert:
      - {type: llm-rubric, value: "Says to thaw the chicken in the fridge first rather than starting frozen, says dried kidney beans must be soaked and boiled hard for at least 10 minutes before slow cooking (or use tinned), and then gives a safe converted version with a doneness temperature for chicken."}
