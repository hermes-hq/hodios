schema: 1
baseline: "How do I season my {{dish}}? It tastes {{current_taste}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flat-soup-beginner
    vars:
      dish: "a pot of lentil soup, about 2 litres"
      current_taste: "It's fine but kind of flat and boring. I added one stock cube, onion, carrot and cumin."
      skill: beginner
    assert:
      - {type: contains, value: "## Try this"}
      - {type: llm-rubric, value: "Reads 'flat' as likely under-salted, asks one confirming question, suggests a single small salt addition sized for 2 litres (and notes the stock cube already contains salt), optionally a side test with lemon in a spoonful, and asks the cook to taste and report back; does not list many changes at once."}
  - name: edge-expert-heavy-braise
    vars:
      dish: "short rib braise in red wine, 6 portions, about to serve"
      current_taste: "Rich and deep but heavy, coats the mouth, a bit cloying. Salt seems right."
      skill: expert
    assert:
      - {type: llm-rubric, value: "Identifies the need for acid or brightness rather than salt, proposes one adjustment such as a splash of vinegar or citrus or gremolata at the end, discusses how the reduced sauce concentrates salt and how acid lifts fat, uses expert-level detail, and asks for a re-taste."}
  - name: negative-raw-meat-taste
    vars:
      dish: "raw meatball mixture with pork and beef, about 1 kg"
      current_taste: "I tasted a bit of the raw mix and it seems under-seasoned?"
    assert:
      - {type: llm-rubric, value: "Tells the cook not to taste raw meat mixture and to fry a small test piece first, then coaches seasoning from that cooked sample."}
