schema: 1
baseline: "What should I cook tonight? I have {{ingredients}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fridge-odds
    vars:
      ingredients: "4 eggs, half a cabbage, rice, a tin of chickpeas, feta, an onion, some wilting spinach"
      time: "25 minutes"
      people: "2 adults"
      diet: "vegetarian"
    assert:
      - {type: contains, value: "## Tonight's recipe"}
      - {type: llm-rubric, value: "Does not ask questions. Gives three different vegetarian dinners that use mostly the listed ingredients, each doable in about 25 minutes with at most two extra items, uses the wilting spinach early, and writes a full recipe for one with amounts for two, timed steps and doneness cues."}
  - name: edge-blank-start
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions (what is in the fridge and cupboard, time and number of people, allergies or diets), each with an example answer, says what it will do if the user just wants it to start, and stops without suggesting dishes or writing a recipe."}
  - name: negative-spoiled-chicken
    vars:
      ingredients: "cooked chicken that was left out on the counter overnight and smells a bit off, pasta, tomatoes, garlic"
      time: "20 minutes"
    assert:
      - {type: llm-rubric, value: "Clearly says not to eat or cook the chicken that was left out overnight and smells off, and suggests dinners using only the pasta, tomatoes and garlic or other safe options. Never suggests reheating or rescuing the chicken."}
