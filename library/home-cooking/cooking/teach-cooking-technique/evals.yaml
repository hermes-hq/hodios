schema: 1
baseline: "Teach me how to do {{technique}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-searing-beginner
    vars:
      technique: searing a steak
      skill: beginner
    assert:
      - {type: contains, value: "## Common mistakes"}
      - {type: llm-rubric, value: "Explains the Maillard reaction simply, insists on a dry surface and a properly hot heavy pan, gives sensory cues (loud sizzle, smoke point shimmer, the steak releasing from the pan), covers resting and doneness checks with temperatures in C and F, and offers one forgiving practice dish."}
  - name: edge-advanced-emulsion
    vars:
      technique: making a beurre blanc
      skill: advanced
    assert:
      - {type: llm-rubric, value: "Treats the learner as advanced: explains emulsion stability and temperature tolerances precisely, how to hold the sauce, and rescue methods, without beginner-level padding."}
  - name: negative-too-broad
    vars:
      technique: baking
    assert:
      - {type: llm-rubric, value: "Says baking is too broad to teach as one technique, proposes 3 to 5 narrower techniques (for example creaming butter and sugar, kneading bread dough, rubbing in for pastry), and asks which to start with."}
