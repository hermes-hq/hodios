schema: 1
baseline: "How do I make stock from {{scraps}}? {{use}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chicken-mixed-bag
    vars:
      scraps: "Two roast chicken carcasses, a freezer bag of onion ends, carrot peels, celery tops, broccoli stalks and potato peels"
      use: "Risotto and soup, big stockpot"
    assert:
      - {type: contains, value: "## Leave these out"}
      - {type: llm-rubric, value: "Removes broccoli stalks and potato peels with reasons, suggests a brown or roasted-carcass stock, gives water level just covering and a bare simmer of about three to four hours with skimming, says not to salt the stock, and covers fast cooling in shallow containers and freezing portions."}
  - name: edge-prawn-shells-pressure
    vars:
      scraps: "Shells and heads from 1 kg of prawns"
      use: "Ramen, I have a pressure cooker"
    assert:
      - {type: llm-rubric, value: "Suggests a short cook for shellfish stock, warns that long cooking turns it bitter, and adjusts or questions pressure cooking for shells, with fast chilling and storage."}
  - name: negative-left-out
    vars:
      scraps: "Chicken bones from a party platter that sat out all evening, people picked at them"
    assert:
      - {type: llm-rubric, value: "Advises not to use bones that were left out for hours and eaten from, explains the food safety reason, and suggests starting a new scrap bag with properly stored scraps."}
