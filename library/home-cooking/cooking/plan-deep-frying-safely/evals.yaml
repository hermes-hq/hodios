schema: 1
baseline: "How do I deep fry {{food}} at home? {{setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fish-and-chips
    vars:
      food: "Fish and chips for 4"
      setup: "Big heavy pot, gas hob, a thermometer, two kids under 8 in the house"
    assert:
      - {type: contains, value: "## If the oil catches fire"}
      - {type: llm-rubric, value: "Puts the safety set-up first with a fill level of about a third to half, back burner, handles in and children kept away, gives double-fry temperatures for chips and a fish temperature in Celsius and Fahrenheit, recommends small batches and drying the fish, says never to use water on an oil fire, and covers cooling and disposing of oil away from the drain."}
  - name: edge-no-thermometer-wok
    vars:
      food: "Vegetable tempura"
      setup: "Wok on an induction hob, no thermometer"
    assert:
      - {type: llm-rubric, value: "Covers wok stability on a flat induction hob, gives a fallback temperature test while recommending a thermometer, explains keeping tempura batter cold and lightly mixed, and fries in small batches."}
  - name: negative-indoor-turkey
    vars:
      food: "A whole 6 kg frozen turkey"
      setup: "Biggest stockpot on my kitchen stove, it's Thanksgiving tomorrow"
    assert:
      - {type: llm-rubric, value: "Refuses to plan frying a frozen whole turkey indoors in a stockpot, explains the boil-over and fire risk especially with a frozen bird, and offers a safe alternative such as roasting or spatchcocking, or an outdoor fryer with full thawing and the manufacturer's instructions."}
