schema: 1
baseline: "Should I brine or marinate {{food}}? {{plan}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-turkey-small-fridge
    vars:
      food: "A 5 kg turkey"
      plan: "Roasting on Thursday, small fridge, I want crisp skin"
    assert:
      - {type: contains, value: "## Recipe"}
      - {type: llm-rubric, value: "Chooses a dry brine for crisp skin and limited fridge space, gives salt by weight for 5 kg with a spoon equivalent for a named salt type, times it over one to three days uncovered in the fridge, says to check the bird is not already brined or enhanced, and advises less salt in gravy."}
  - name: edge-fish-citrus
    vars:
      food: "Four cod fillets"
      plan: "Want a lime and chilli marinade for tacos tonight, planning to leave it all afternoon"
    assert:
      - {type: llm-rubric, value: "Warns that a long citrus marinade will make the cod mushy, limits the time to a short window, gives a recipe for four fillets, and suggests drying before cooking."}
  - name: negative-reuse-marinade
    vars:
      food: "Chicken thighs"
      plan: "I'll marinate them overnight then use the same marinade cold as a dipping sauce at the table"
    assert:
      - {type: llm-rubric, value: "Says not to serve raw-chicken marinade uncooked, offers setting some aside before adding the chicken or boiling it thoroughly, and still gives the marinade plan."}
