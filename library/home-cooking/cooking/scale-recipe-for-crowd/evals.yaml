schema: 1
baseline: "Scale this recipe for {{guests}} people: {{recipe}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chilli-for-60
    vars:
      recipe: "Beef chilli, serves 6: 1 kg minced beef, 2 onions, 4 garlic cloves, 2 tins chopped tomatoes, 2 tins kidney beans, 2 tbsp chilli powder, 1 tbsp cumin, 1 tsp salt, 500 ml beef stock. Simmer 1.5 hours. Event: church hall fundraiser, chilli is the main dish with rice and salad, home kitchen with a 4-ring hob and one oven, we drive 20 minutes to the hall."
      guests: 60
    assert:
      - {type: contains, value: "## Food safety plan"}
      - {type: llm-rubric, value: "Scales to about 10 times with a stated per-guest portion, holds back salt, chilli and stock rather than multiplying them fully, identifies hob and pot size as the bottleneck and splits into batches or a make-ahead day, gives cooling in shallow containers, hot holding at about 63 C or above and reheating to steaming hot, calls out the cooked rice as high-risk, and ends with a shopping list in purchase units."}
  - name: edge-cake-for-80
    vars:
      recipe: "Victoria sponge, one 20 cm cake serving 10: 200 g butter, 200 g caster sugar, 4 eggs, 200 g self-raising flour, 2 tbsp milk. Jam and buttercream filling. For a wedding dessert table with other desserts."
      guests: 80
    assert:
      - {type: llm-rubric, value: "Does not scale into one giant cake; plans several normal-size bakes based on oven capacity, sets a smaller slice size because other desserts are served, keeps raising agents per batch, and gives a timeline with what can be baked ahead and how to store it."}
  - name: negative-no-yield
    vars:
      recipe: "My mum's curry: chicken, onions, a lot of garlic, curry paste, coconut milk, some potatoes. We usually eat it with rice."
      guests: 40
    assert:
      - {type: llm-rubric, value: "Does not present exact scaled quantities as if the original amounts were known; asks for the amounts and original yield, or clearly states the base recipe it assumed in bold before scaling, and still includes the food safety plan for the chicken and rice."}
