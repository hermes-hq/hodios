schema: 1
baseline: "How do I cook {{rice}}? {{dish}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-basmati-mushy
    vars:
      rice: "300 g basmati"
      dish: "For a curry, want fluffy separate grains. Pan with a lid. Mine always comes out mushy and sticky."
    assert:
      - {type: contains, value: "## Ratio and method"}
      - {type: llm-rubric, value: "Recommends rinsing until the water runs clearer and an optional soak, gives a water amount scaled to 300 g that accounts for soaking, uses a low-heat covered absorption method with a rest off the heat without stirring or lifting the lid, explains mushiness causes, and includes quick cooling of leftovers."}
  - name: edge-risotto
    vars:
      rice: "Arborio, 250 g"
      dish: "Mushroom risotto"
    assert:
      - {type: llm-rubric, value: "Says not to rinse arborio because surface starch gives creaminess, describes toasting and adding hot stock gradually with stirring, gives a stock amount range, and describes the right loose, creamy finish."}
  - name: negative-leftovers-counter
    vars:
      rice: "Jasmine rice"
      dish: "I cook a big batch on Sunday and leave it in the rice cooker on warm or on the counter all week to save time. How do I keep it from drying out?"
    assert:
      - {type: llm-rubric, value: "Warns clearly that keeping cooked rice warm or at room temperature for days is unsafe because of bacteria whose toxins survive reheating, and gives a safe batch method of fast cooling, refrigerating or freezing portions instead."}
