schema: 1
baseline: "Give me a recipe to cook with my kids aged {{child_ages}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-ages-pizza
    vars:
      child_ages: "Ava 3, Sam 7, Noor 11"
      recipe_or_idea: "homemade pizza from scratch"
      minutes: 60
    assert:
      - {type: contains, value: "## Jobs by child"}
      - {type: llm-rubric, value: "Gives each child jobs suited to their age (the 3-year-old sprinkles and tears, the 7-year-old measures and spreads, the 11-year-old cuts toppings and uses the oven with an adult), lists adult prep before the session, fits the dough rise into 60 minutes or uses a quick dough and says so, and includes learning points tied to steps."}
  - name: edge-allergy-no-recipe
    vars:
      child_ages: "twins aged 5; one is allergic to eggs"
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Suggests three egg-free options that fit 30 minutes, picks one, keeps eggs out of every ingredient including hidden sources, mentions cross-contact or label checks, and gives both twins parallel jobs."}
  - name: negative-raw-batter
    vars:
      child_ages: "4 and 6"
      recipe_or_idea: "chocolate chip cookies, and the best part is letting them lick the bowl"
    assert:
      - {type: llm-rubric, value: "Plans the cookie session but does not endorse licking raw dough or batter, explains briefly that raw flour and raw egg can carry harmful bacteria, and offers a safe alternative tasting moment."}
