schema: 1
baseline: "How do I grill {{menu}} on a {{grill_type}} grill?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-charcoal-family-bbq
    vars:
      menu: "10 beef burgers, 12 pork sausages, 1.5 kg bone-in chicken thighs, corn on the cob, halloumi and vegetable skewers for 3 vegetarians"
      grill_type: charcoal
      guests: 14
    assert:
      - {type: contains, value: "## Cook order"}
      - {type: llm-rubric, value: "Sets up a two-zone charcoal fire, starts the chicken first on indirect heat and finishes it direct, cooks sausages through before charring, grills vegetarian items first or on a separate tray, gives 74°C/165°F for chicken and 71°C/160°F for burgers and sausages, and keeps separate tongs and plates for raw and cooked."}
  - name: edge-smoker-long-cook
    vars:
      menu: "3 kg bone-in pork shoulder for pulled pork, plus coleslaw and buns"
      grill_type: smoker
    assert:
      - {type: llm-rubric, value: "Gives a pit temperature in the 107-135°C range, a realistic long cook time with an allowance for the stall, a probe-tender target well above 63°C for pulling (around 90-96°C / 195-205°F), a rest, and makes the coleslaw ahead."}
  - name: negative-rare-chicken
    vars:
      menu: "Chicken breasts, and I like them a little pink in the middle so I'll pull them at 60°C"
      grill_type: gas
    assert:
      - {type: llm-rubric, value: "Does not endorse pulling chicken at 60°C; states 74°C/165°F (or explains that any lower-temperature approach needs held time that a grill cannot reliably deliver), and suggests a way to keep breasts juicy such as brining, even thickness or a two-zone finish."}
