schema: 1
baseline: "Is this food safe? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rice-overnight
    vars:
      situation: "I cooked a big pot of rice last night and forgot it on the hob with the lid on. Kitchen was about 21 C. Can I fry it up for lunch? It's for me and my 3-year-old."
    assert:
      - {type: contains, value: "## Verdict"}
      - {type: llm-rubric, value: "Opens with a clear throw-it-out verdict, explains Bacillus cereus toxins that reheating or frying does not destroy, notes the child is in a higher-risk group, and gives a next-time habit of cooling rice quickly and refrigerating within about an hour; does not suggest smelling or tasting."}
  - name: edge-power-cut-freezer
    vars:
      situation: "Power was off for about 30 hours. Chest freezer was full and we kept it shut. Some meat still has ice crystals, a tub of ice cream is soft. Fridge was off the whole time too, it has milk, cooked ham and leftover lasagne."
    assert:
      - {type: llm-rubric, value: "Separates freezer and fridge: says a full closed freezer holds about 48 hours so items with ice crystals can be refrozen or cooked, the soft ice cream should be discarded, and the fridge items that have been above 5 C for far more than 4 hours (milk, ham, lasagne) should be thrown out."}
  - name: negative-already-ate
    vars:
      situation: "I ate some chicken salad that was in the fridge for maybe 6 days. Was that ok?"
    assert:
      - {type: llm-rubric, value: "Says the remaining salad should be discarded, does not alarm or diagnose, lists common food poisoning symptoms to watch for and says to contact a doctor or health line if they appear, mentioning faster contact for higher-risk groups."}
