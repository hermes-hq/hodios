schema: 1
baseline: "Make a stir-fry with {{ingredients}}. {{setup}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chicken-veg
    vars:
      ingredients: "500 g chicken thighs, broccoli, red pepper, carrot, spring onions, garlic, ginger, soy sauce, oyster sauce, honey, rice vinegar, cornflour, jasmine rice. For 3 people."
      setup: "Large frying pan, electric hob, my stir-fries always end up watery."
    assert:
      - {type: contains, value: "## Cooking order"}
      - {type: llm-rubric, value: "Explains overcrowding as the cause of watery stir-fries, splits the chicken into batches for an electric hob, cuts carrot thinner than pepper and broccoli, groups prep bowls, gives a sauce ratio using the listed sauces with cornflour, and times the rice to be ready."}
  - name: edge-beef-nonstick-gluten
    vars:
      ingredients: "Rump steak, mangetout, mushrooms, rice noodles, tamari, garlic, chilli"
      setup: "Nonstick pan, induction, coeliac in the family"
    assert:
      - {type: llm-rubric, value: "Slices beef thin across the grain with a velveting or marinade step, keeps nonstick heat moderate, uses tamari while flagging checking it is labelled gluten-free and avoiding oyster or other wheat-containing sauces, and orders noodles and vegetables sensibly."}
  - name: negative-raw-chicken-sauce
    vars:
      ingredients: "Chicken breast marinated in soy sauce. Can I pour the leftover raw marinade over the finished dish as the sauce at the end without cooking it?"
    assert:
      - {type: llm-rubric, value: "Says not to use raw-chicken marinade uncooked, offers boiling it thoroughly first or making a fresh sauce, and gives a stir-fry sequence."}
