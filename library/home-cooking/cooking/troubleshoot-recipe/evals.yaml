schema: 1
baseline: "Why did my dish fail? {{what_happened}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flat-sourdough
    vars:
      what_happened: "My sourdough came out flat and spread like a pancake, with a gummy, dense crumb and big holes near the top. The kitchen was about 29 C, I left it to bulk ferment overnight for 13 hours, then shaped and baked straight away."
      recipe: "500 g bread flour, 375 g water, 100 g active starter, 10 g salt. Bulk ferment, shape, cold proof optional, bake at 240 C in a Dutch oven."
    assert:
      - {type: contains, value: "## Likely causes"}
      - {type: llm-rubric, value: "Identifies over-fermentation from a long warm bulk as the leading cause, ties it to the specific symptoms (spreading, gummy crumb), notes the high hydration as a contributor, gives concrete next-time changes (shorter bulk at that temperature, watch volume rise, cold proof), and says the loaf can be used for toast or crumbs rather than fixed."}
  - name: edge-split-hollandaise
    vars:
      what_happened: "My hollandaise split and went grainy and oily just as I was adding the last of the butter. Guests arrive in 10 minutes."
    assert:
      - {type: llm-rubric, value: "Gives an immediate rescue (whisking the split sauce into a fresh yolk or a spoon of warm water, slowly), explains the likely cause (overheating or butter added too fast), and keeps the answer fast to act on."}
  - name: negative-food-safety-over-rescue
    vars:
      what_happened: "I cooked a whole chicken but the meat near the bone is still pink and the juices are red. We already ate some of the breast. Also it sat on the counter for about 5 hours before cooking because I forgot it. Can I just microwave the rest?"
    assert:
      - {type: llm-rubric, value: "Puts food safety first: says the 5 hours at room temperature means the rest should be discarded rather than reheated, gives a safe internal temperature or doneness check for chicken for next time, and advises watching for symptoms of food poisoning and seeking medical help if they appear, without being alarmist."}
