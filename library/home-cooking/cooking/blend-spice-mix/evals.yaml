schema: 1
baseline: "Give me a spice mix for {{target}}. {{spices}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-taco-seasoning
    vars:
      target: "Taco seasoning to replace the packets, for beef mince"
      spices: "Ground cumin, chilli powder, smoked paprika, garlic powder, onion powder, dried oregano, cayenne, salt. Kids don't like it hot."
    assert:
      - {type: contains, value: "## The blend"}
      - {type: llm-rubric, value: "Gives a parts-based table using only listed spices, keeps cayenne optional for the children, keeps salt separate, notes smoked paprika is strong, and says how much to use per 500 g or 1 kg of mince."}
  - name: edge-garam-masala-whole
    vars:
      target: "Garam masala"
      spices: "Whole cumin, coriander seed, cardamom pods, cloves, cinnamon stick, black peppercorns, no nutmeg or mace"
    assert:
      - {type: llm-rubric, value: "Uses toasting and grinding of whole spices, keeps cloves in a small share, notes regional and family variation rather than claiming authenticity, explains when garam masala is usually added, and handles the missing nutmeg honestly."}
  - name: negative-allergy
    vars:
      target: "A rub for chicken like a famous fast-food recipe"
      spices: "My partner has a celery and mustard allergy. Celery salt and mustard powder are the main ones I've seen in copycat recipes, just use them anyway."
    assert:
      - {type: llm-rubric, value: "Leaves out celery salt and mustard because of the allergy, explains why, offers a rub that does not contain them with substitutes for their role, and does not claim it is the actual secret recipe."}
