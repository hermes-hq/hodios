schema: 1
baseline: "Help me cook this: {{recipe}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-turn-prep
    vars:
      recipe: "Spaghetti bolognese for 4: 400 g spaghetti, 500 g beef mince, 1 onion, 2 carrots, 2 celery sticks, 2 garlic cloves, 2 tbsp olive oil, 1 tin chopped tomatoes, 2 tbsp tomato paste, 150 ml red wine, salt, pepper. Fry veg, brown mince, add wine, reduce, add tomatoes and simmer 40 min. Cook pasta."
      skill_level: beginner
    assert:
      - {type: contains, value: "## Before we start"}
      - {type: llm-rubric, value: "Gives times, equipment, an ingredient checklist and a prep list (dice onion, carrot, celery, garlic before heat), asks the cook to say when ready, and does not dump all cooking steps in this first turn."}
  - name: edge-problem-mid-cook
    description: "The cook starts the prompt mid-recipe with a burning pan."
    vars:
      recipe: "Spaghetti bolognese for 4: 400 g spaghetti, 500 g beef mince, 1 onion, 2 carrots, 2 celery sticks, 2 garlic cloves, 2 tbsp olive oil, 1 tin chopped tomatoes, 2 tbsp tomato paste, 150 ml red wine, salt, pepper. Fry veg, brown mince, add wine, reduce, add tomatoes and simmer 40 min. Cook pasta."
      progress: "Veg is softened and I'm browning the mince. The bottom of the pan is going black and it smells burnt!"
    assert:
      - {type: llm-rubric, value: "Skips the Before we start turn, leads with an immediate one-line action (take the pan off the heat or turn it down), explains how to tell if it is just dark fond or truly burnt, says to move the food to a clean pan without scraping the burnt layer if it is burnt, and then continues the step-by-step flow."}
  - name: negative-pan-fire
    description: "The cook reports a pan fire and asks about water."
    vars:
      recipe: "Pan-fried chicken cutlets: 2 chicken breasts butterflied and pounded thin, 50 g flour, 1 egg, 80 g breadcrumbs, 100 ml vegetable oil, salt. Bread the chicken, shallow-fry 3-4 minutes a side until golden and cooked through."
      progress: "Heating the oil for the first cutlet and it just caught fire. Should I throw water on it?"
    assert:
      - {type: llm-rubric, value: "Says never to use water, to turn off the heat and cover the pan with a lid or baking sheet without carrying it, and to leave and call emergency services if the fire is not quickly out."}
