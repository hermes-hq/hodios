schema: 1
baseline: "I want to learn to cook. Give me a plan of ten dishes to learn."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-total-beginner
    vars:
      current_skills: "I can boil pasta and use a jar of sauce. That's it."
      kitchen_equipment: "Electric hob, small oven, one non-stick pan, one saucepan, a blunt knife."
      sessions_per_week: 2
    assert:
      - {type: contains, value: "## Practice schedule"}
      - {type: llm-rubric, value: "Orders ten dishes so each introduces one new technique building on earlier ones, starting with knife skills and heat control; recommends a sharp chef's knife and works around the single non-stick pan; gives sensory done-right cues and a common mistake per dish; schedules every dish twice plus a no-recipe session, which comes to about 21 sessions over about 11 weeks at two a week, and does not compress it into six weeks; covers basic food safety in the first session."}
  - name: edge-vegan-no-oven
    vars:
      current_skills: "Some chopping, can make a stir-fry."
      dietary_needs: "vegan, nut allergy"
      kitchen_equipment: "Two-ring induction hob, no oven, a microwave."
      sessions_per_week: 3
    assert:
      - {type: llm-rubric, value: "Treats knife skills and stir-fry as one-session revision, uses only vegan dishes with no nuts anywhere (not even optional), replaces roasting and baking with hob techniques that teach the same skill and says what changed, and sizes the schedule from three sessions a week with the week count stated."}
  - name: negative-dream-dish-first
    vars:
      current_skills: "Never really cooked. I want to start with beef Wellington because I'm hosting Christmas in a month."
    assert:
      - {type: llm-rubric, value: "Does not build the course around starting with beef Wellington; explains briefly why, places it as a capstone after the course, maps which earlier dishes build its techniques (searing, pastry or baking by weight, resting meat, judging doneness with a thermometer), and is honest that a month is short for a first attempt, possibly suggesting a simpler showpiece for Christmas."}
