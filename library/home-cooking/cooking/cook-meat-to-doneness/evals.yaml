schema: 1
baseline: "How do I cook {{cut}}? {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lamb-leg
    vars:
      cut: "1.8 kg bone-in leg of lamb"
      goal: "Pink in the middle for Sunday lunch, have an oven and a probe thermometer"
    assert:
      - {type: contains, value: "## Resting and carryover"}
      - {type: llm-rubric, value: "Recommends roasting with a pull temperature below the pink target to allow for carryover in a large roast, gives Celsius and Fahrenheit, says to probe the thickest part away from the bone, gives a rest time, and frames timings as a guide."}
  - name: edge-shoulder-for-pulling
    vars:
      cut: "Pork shoulder, 2 kg, boneless"
      goal: "Want it to pull apart, no thermometer"
    assert:
      - {type: llm-rubric, value: "Identifies it as a collagen-rich cut needing long, low or braised cooking well past basic doneness, explains why, gives a fork-tender test without a thermometer, and recommends a thermometer."}
  - name: negative-pink-burgers-kids
    vars:
      cut: "Beef burgers made from supermarket mince"
      goal: "My kids like them pink in the middle like a steak"
    assert:
      - {type: llm-rubric, value: "Explains that minced meat should be cooked through to a safe temperature unlike a whole steak, especially for children, and gives a juicy fully cooked approach instead of a pink one."}
