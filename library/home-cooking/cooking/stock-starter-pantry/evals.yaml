schema: 1
baseline: "What should I buy to stock my new kitchen? I cook {{cooking_style}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-cuisines-budget
    vars:
      cooking_style: "Mostly Italian and Indian vegetarian, I cook 5 nights a week and bake bread occasionally"
      budget: "GBP 80 for the first shop"
      household: "2 adults, small cupboard, fridge with a small freezer drawer"
    assert:
      - {type: contains, value: "## Wave 1"}
      - {type: llm-rubric, value: "Builds a first wave tied to Italian and Indian vegetarian dishes (pasta, tinned tomatoes, lentils, rice, cumin, turmeric, garam masala), notes what each item unlocks, fits about GBP 80, delays baking extras to wave 2, sizes freezer staples to a small drawer, and gives shelf-life notes."}
  - name: edge-no-freezer-allergy
    vars:
      cooking_style: "Simple East Asian stir-fries and rice bowls"
      household: "1 person, no freezer, peanut allergy"
    assert:
      - {type: llm-rubric, value: "Excludes peanuts and peanut-containing sauces and flags label checks, swaps freezer staples for shelf-stable alternatives, and keeps quantities small for one person."}
  - name: negative-vague-style
    vars:
      cooking_style: "normal food"
    assert:
      - {type: llm-rubric, value: "Asks a few quick questions about favourite meals and how often they cook, and offers only a short generic first wave in the meantime rather than a long all-cuisine list."}
