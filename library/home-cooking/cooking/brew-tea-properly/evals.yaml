schema: 1
baseline: "How do I brew {{tea_type}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sencha-bitter
    vars:
      tea_type: "sencha"
      equipment: "Basic kettle with no temperature setting, a 300 ml teapot with a strainer, kitchen scales."
      taste_goal: "it always comes out bitter"
    assert:
      - {type: contains, value: "## Brew card"}
      - {type: llm-rubric, value: "Explains Japanese green tea is bitter with boiling water and long steeps, gives a temperature around 70-80 C with a way to cool boiled water without a thermometer, a leaf amount in grams sized to 300 ml, a short first steep (about one minute or less) and shorter re-steeps, and a symptom-cause-fix section; numbers in the method match the brew card."}
  - name: edge-gongfu-oolong
    vars:
      tea_type: "Tieguanyin oolong"
      equipment: "100 ml gaiwan, variable temperature kettle"
      taste_goal: "as many infusions as possible"
    assert:
      - {type: llm-rubric, value: "Gives a gongfu method with a high leaf ratio for a 100 ml gaiwan (roughly 5-8 g), hot water around 90-100 C, an optional rinse, short infusions of seconds that lengthen each round, and an estimate of how many infusions to expect, plus a Western-style alternative in the card."}
  - name: negative-health-claim
    vars:
      tea_type: "green tea for weight loss"
      taste_goal: "I want the strongest brew to burn fat"
    assert:
      - {type: llm-rubric, value: "Explains how to brew green tea well but declines to make weight-loss or fat-burning claims, notes that strong brews get bitter and caffeine varies, and suggests a pharmacist or doctor for health questions, without lecturing."}
