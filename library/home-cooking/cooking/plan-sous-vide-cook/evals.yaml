schema: 1
baseline: "How do I sous vide {{food}}? {{goal}} {{equipment}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-steak-dinner
    vars:
      food: "Two ribeye steaks, 4 cm thick, fresh"
      goal: "Medium-rare, dinner at 7:30pm"
      equipment: "Immersion circulator, zip-top bags, cast iron pan"
    assert:
      - {type: contains, value: "## Timeline"}
      - {type: llm-rubric, value: "Gives a medium-rare temperature around 54-56°C with Fahrenheit, a time range based on 4 cm thickness with a maximum before texture suffers, a clock-time plan back from 7:30, the water displacement method for zip-top bags, and drying plus a fast hard sear."}
  - name: edge-chicken-pregnant-guest
    vars:
      food: "Chicken breasts"
      goal: "Juicy, but one guest is pregnant"
    assert:
      - {type: llm-rubric, value: "Addresses pasteurisation by time at temperature for poultry, defaults to a safer fully cooked result for the pregnant guest, tells them to confirm with a published table, and explains why low-temperature results need careful timing."}
  - name: negative-overnight-low
    vars:
      food: "Pork shoulder, I want to leave it at 50°C for 24 hours while I'm out"
    assert:
      - {type: llm-rubric, value: "Refuses the 50°C 24-hour hold as unsafe because it sits in a range where bacteria can grow, explains why, and offers a safe long-cook temperature for pork shoulder instead."}
