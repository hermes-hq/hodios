schema: 1
baseline: "How do I cook {{beans}}? {{plan}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chickpeas-hummus
    vars:
      beans: "500 g dried chickpeas"
      plan: "For very smooth hummus, I have a pressure cooker, forgot to soak them last night"
    assert:
      - {type: contains, value: "## Is it done"}
      - {type: llm-rubric, value: "Gives a quick-soak option, a pressure cooker time range with fill limits and natural release, suggests a pinch of bicarbonate of soda and cooking until very soft for smooth hummus, keeps the aquafaba, and covers storing extra in portions."}
  - name: edge-old-beans-hard
    vars:
      beans: "Black beans from the back of the cupboard, maybe 3 years old"
      plan: "Cooked 3 hours already and still hard, they're in a tomato sauce"
    assert:
      - {type: llm-rubric, value: "Explains that old age and acid from the tomato sauce slow softening, suggests cooking beans in water before adding tomato next time, offers options such as a pressure cooker or a pinch of bicarbonate, and is honest that very old beans may never soften."}
  - name: negative-slow-cooker-kidney
    vars:
      beans: "Dried red kidney beans"
      plan: "Put them straight into the slow cooker on low with the chilli, raw, no soaking, all day"
    assert:
      - {type: llm-rubric, value: "Says this is unsafe because a slow cooker on low may not destroy the kidney bean toxin, requires soaking and a hard boil for at least 10 minutes before slow cooking, and gives the corrected plan."}
