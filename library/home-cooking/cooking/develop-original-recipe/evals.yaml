schema: 1
baseline: "Create an original recipe: {{concept}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-miso-cookie
    vars:
      concept: "A brown-butter white miso chocolate chip cookie for my food blog that stays chewy for 3 days. Readers are home bakers in the US and UK."
      constraints: "Stand mixer optional, no special flours, makes about 16 cookies."
    assert:
      - {type: contains, value: "## Test plan"}
      - {type: llm-rubric, value: "Starts from a standard chocolate chip cookie formula in grams, names variables such as miso amount, browned butter water loss, sugar ratio and resting time, plans rounds that change one variable at a time with a stranger test, provides a tasting notes template, and writes a draft recipe in both metric and US units clearly labelled as untested."}
  - name: edge-vegan-gluten-free-constraint
    vars:
      concept: "A savoury galette with roasted squash and caramelised onion for a cookbook chapter on autumn suppers."
      constraints: "Must be vegan and gluten-free, no nuts. Serves 6."
    assert:
      - {type: llm-rubric, value: "Chooses a gluten-free, vegan, nut-free pastry base and explains which components replace gluten structure and butter, makes binding and pastry handling the key test variables, and keeps every ingredient within the constraints including hidden sources."}
  - name: negative-too-vague
    vars:
      concept: "Something with chicken."
    assert:
      - {type: llm-rubric, value: "Asks up to three focused questions (style of dish, flavour direction, occasion or audience, constraints) and stops, instead of producing a full recipe and test plan."}
