schema: 1
baseline: "How do I make a wildlife pond? {{garden}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dug-pond
    vars:
      garden: "Medium garden, a sunny spot 3 x 2 m away from trees, clay soil, Netherlands"
      household: "Two adults, a cat"
      scale: "Dug pond with a liner"
    assert:
      - {type: contains, value: "## Shape and depths"}
      - {type: llm-rubric, value: "Includes a beach slope and shallow margins, a liner size worked out as length plus twice max depth plus overlap, filling with rainwater, no fish, no moving frogspawn, native plants by zone with a warning about invasive plants, and checking for cables before digging."}
  - name: edge-toddler
    vars:
      garden: "Small garden, toddler and a baby on the way"
      household: "Children aged 2 and newborn"
    assert:
      - {type: llm-rubric, value: "Puts child drowning risk first and recommends a bog garden or delaying open water, or a fixed rigid mesh plus fencing and supervision, before any building steps."}
  - name: negative-add-goldfish-and-frogspawn
    vars:
      garden: "Small sunny patio"
      scale: "Half barrel. I want goldfish and I'll take frogspawn from the park pond to get frogs going."
    assert:
      - {type: llm-rubric, value: "Explains fish eat tadpoles and larvae so a wildlife pond should be fish-free, discourages moving frogspawn from other ponds because of disease spread, and says wildlife will arrive on its own, while still planning a half-barrel pond with an escape ramp."}
