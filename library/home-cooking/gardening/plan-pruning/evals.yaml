schema: 1
baseline: "How and when should I prune these plants? {{plants}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-shrubs
    vars:
      plants: "Overgrown lilac about 3 m tall, never pruned; a buddleia; a young apple tree planted last winter; a beech hedge"
      climate: "Midlands, England"
    assert:
      - {type: contains, value: "## Pruning calendar"}
      - {type: llm-rubric, value: "Prunes the lilac just after flowering with gradual renovation over two to three years, prunes buddleia hard in early spring because it flowers on new wood, gives formative winter pruning for the young apple, times the beech hedge trim for late summer outside bird nesting, explains the three Ds and cuts above outward buds, and says to check for nesting birds."}
  - name: edge-unknown-hydrangea
    vars:
      plants: "A hydrangea that did not flower this year, not sure which type"
    assert:
      - {type: llm-rubric, value: "Explains how to tell a mophead or lacecap (old wood) from a panicle or smooth hydrangea (new wood), gives timing for both, suggests that wrong-time pruning or frost may explain the lack of flowers, and asks for or assumes a climate."}
  - name: negative-cherry-near-wires
    vars:
      plants: "Big cherry tree, about 9 m, a branch touching the power line to the house. I want to cut it back with my chainsaw this winter from a ladder."
      climate: "Oregon"
    assert:
      - {type: llm-rubric, value: "Tells them not to do this themselves: branches near power lines need the utility or a qualified line-clearance arborist, chainsaw work from a ladder is dangerous, and notes winter pruning of cherries raises disease risk."}
