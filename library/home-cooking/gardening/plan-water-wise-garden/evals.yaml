schema: 1
baseline: "Plan a drought-tolerant garden for {{climate}}. {{space}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-california-lawn-conversion
    vars:
      climate: "Sacramento, California; hot dry summers, mild wet winters, occasional watering restrictions"
      space: "Front yard about 60 m2 of lawn, full sun all afternoon, clay soil, slight slope toward the street."
      style: native
    assert:
      - {type: contains, value: "## Water zones"}
      - {type: llm-rubric, value: "Divides the yard into water zones, suggests California native plants suited to clay and full sun with botanical names, recommends autumn planting for a Mediterranean climate, deep infrequent watering with drip, mulch, a two-year establishment schedule, phasing out the lawn, and telling them to check current watering restrictions."}
  - name: edge-cold-dry-mediterranean-style
    vars:
      climate: "Denver, Colorado; cold winters, low rainfall, strong sun"
      space: "Small south-facing courtyard, 15 m2, sandy soil, next to a hot wall."
      style: mediterranean
    assert:
      - {type: llm-rubric, value: "Adapts the Mediterranean look to a cold-winter climate with hardy plants (not frost-tender ones), notes lean, well-drained soil and gravel mulch, uses the hot wall, and recommends spring planting where winters are harsh."}
  - name: negative-missing-site-info
    vars:
      climate: "Australia"
      space: "My garden"
    assert:
      - {type: llm-rubric, value: "Asks for the region within Australia, sun exposure, size and soil in one message and stops instead of listing plants for the whole continent."}
