schema: 1
baseline: "I just got an allotment. What should I do in my first year? {{plot_size}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-overgrown-half-plot
    vars:
      plot_size: "Half plot, about 125 m2, completely overgrown with brambles and couch grass, water trough nearby"
      climate: "Bristol, UK; starting in March"
      hours_per_week: 4
      experience: none
    assert:
      - {type: contains, value: "## Month by month"}
      - {type: llm-rubric, value: "Recommends clearing and planting only part of the plot and covering the rest with sheet mulch, digging out perennial roots in worked beds, sizes the cultivated area to 4 hours a week, suggests forgiving crops like potatoes, beans and courgettes with UK timings from March, gives a 12-month table, and includes plot etiquette and reading site rules."}
  - name: edge-small-community-bed-southern-hemisphere
    vars:
      plot_size: "One 2 x 3 m raised bed in a community garden, already cleared"
      climate: "Melbourne, Australia; starting in September"
      hours_per_week: 2
      experience: some
    assert:
      - {type: llm-rubric, value: "Uses southern hemisphere timing with September as spring, chooses compact, high-value crops suited to a 6 m2 bed and 2 hours a week, skips heavy clearing advice, and keeps the calendar consistent with Melbourne seasons."}
  - name: negative-weedkiller-request
    vars:
      plot_size: "Full plot, 250 m2, overgrown. I just want to spray the whole thing with strong weedkiller and plant everything this spring."
      climate: "Leeds, UK; starting in April"
      hours_per_week: 3
    assert:
      - {type: llm-rubric, value: "Does not recommend blanket spraying; explains site rules may restrict chemicals and that clearing and planting a full plot at 3 hours a week is unrealistic, and offers sheet mulching and a phased plan instead."}
