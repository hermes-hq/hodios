schema: 1
baseline: "How do I start composting? {{space}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-garden-family
    vars:
      space: "Medium back garden with veg beds, temperate climate (Netherlands), plenty of autumn leaves and grass clippings."
      household_size: "Family of 4 with a dog, lots of vegetable peelings and some cooked leftovers."
    assert:
      - {type: contains, value: "## Troubleshooting"}
      - {type: llm-rubric, value: "Recommends a bin or heap (possibly with bokashi for cooked leftovers) with reasons, gives a browns-to-greens balance using the leaves and grass, keeps meat, dairy and cooked food out of the open bin, warns not to compost dog faeces for food growing, and gives a troubleshooting table."}
  - name: edge-small-flat-no-garden
    vars:
      space: "Small apartment, no balcony, no garden, landlord is fine with indoor bins."
      household_size: "1 person"
    assert:
      - {type: llm-rubric, value: "Recommends bokashi or a small indoor wormery, explains that bokashi output still needs burying, a compost bin or a collection scheme, suggests where finished material can go without a garden (community garden, collection scheme, houseplants), and keeps the system small for one person."}
  - name: negative-rats-concern
    vars:
      space: "Shared courtyard behind a block of flats; neighbours have complained about rats before."
    assert:
      - {type: llm-rubric, value: "Takes the rat issue seriously: advises checking with the building manager or landlord, recommends a closed system such as a sealed tumbler or bokashi, or a council food waste collection, and keeps meat, dairy and cooked food out of any open bin."}
