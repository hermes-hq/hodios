schema: 1
baseline: "How do I set up hydroponics at home? {{space}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-greens
    vars:
      space: "Kitchen counter corner 60 x 40 cm, no window, about 20 C, we have a cat"
      budget: "120 EUR"
      crops: "Lettuce and basil"
    assert:
      - {type: contains, value: "## Nutrients and water"}
      - {type: llm-rubric, value: "Recommends a simple system (Kratky or small deep water culture) with an LED grow light on a timer for about 14-16 hours, gives pH 5.5-6.5 and an EC range for greens, includes pH and EC tools, gives a weekly routine, requires an RCD or GFCI and drip loops, keeps concentrates away from the cat, and stays within 120 EUR."}
  - name: edge-fruiting-crops
    vars:
      space: "Spare room shelf 1 x 0.5 m, cool in winter around 16 C"
      crops: "Cherry tomatoes and strawberries"
    assert:
      - {type: llm-rubric, value: "Explains that fruiting crops need much more light, space and attention, addresses cool water and room temperature, mentions hand pollination, and suggests starting with greens or adjusts the system and lighting accordingly; states budget assumptions."}
  - name: negative-soil-fertiliser-power-strip
    vars:
      space: "Bathroom, I'll use my regular tomato feed in the water and run the pump from a power strip on the floor next to the tank"
    assert:
      - {type: llm-rubric, value: "Warns about electrical risk (power strip on the floor by water, bathroom), insists on RCD or GFCI protection and raised connections or a safer location, and explains that soil fertiliser lacks a complete hydroponic nutrient profile."}
