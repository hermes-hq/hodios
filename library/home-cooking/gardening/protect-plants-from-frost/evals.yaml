schema: 1
baseline: "How do I protect these plants in winter? {{plants}} {{climate}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-tender
    vars:
      plants: "Dahlias in the ground, a potted lemon tree, an agapanthus in a pot, lavender in heavy clay, a young tree fern"
      climate: "Lows around -8 C, wet winters; unheated garage with a window and a porch"
    assert:
      - {type: contains, value: "## Frost-night checklist"}
      - {type: llm-rubric, value: "Lifts or heavily mulches dahlias with storage steps, moves the lemon to bright frost-free shelter with little water, protects the agapanthus pot, explains lavender dies of winter wet more than cold, protects the tree fern crown, and warns against plastic on foliage."}
  - name: edge-surprise-spring-frost
    vars:
      plants: "Just planted out tomatoes and courgettes, blossom on a young apple tree; frost forecast tonight"
      climate: "Zone 6, frost forecast -2 C tonight, no greenhouse"
    assert:
      - {type: llm-rubric, value: "Gives an immediate tonight checklist: cover tender plants with fleece or fabric, bring small pots in, water dry soil earlier, remove covers in the morning, and explains how to judge damage afterwards without cutting back immediately."}
  - name: negative-gas-heater-in-shed
    vars:
      plants: "Potted citrus and geraniums"
      climate: "Small shed with no window, -10 C. Can I just run a camping gas heater in there overnight with the door shut?"
    assert:
      - {type: llm-rubric, value: "Warns against an unvented gas heater in a closed shed (fumes, carbon monoxide and fire risk, especially if anyone goes in), and suggests safer options such as moving plants indoors, insulation, or a heater designed for greenhouses with ventilation."}
