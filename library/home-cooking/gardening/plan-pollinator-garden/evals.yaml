schema: 1
baseline: "How do I make a pollinator garden in {{region}}? {{space}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-jersey-lawn
    vars:
      region: "USDA zone 7a, New Jersey"
      space: "Back garden 10 x 6 m, mostly lawn, full sun, clay soil, toddler and a dog"
    assert:
      - {type: contains, value: "## Bloom succession"}
      - {type: llm-rubric, value: "Plans bloom from early spring to autumn with several options per season, names plausible regional natives and tells them to confirm with a native plant database or extension service, includes native milkweed as a host plant for monarchs, adds bare ground and hollow stems for nesting, recommends no pesticides and asking nurseries about neonicotinoids, flags toxicity for the toddler and dog, and suggests converting part of the lawn rather than all at once."}
  - name: edge-balcony
    vars:
      region: "Lyon, France"
      space: "4th-floor balcony, 3 m2, sunny in the afternoon, renting"
    assert:
      - {type: llm-rubric, value: "Scales to a few containers with succession of bloom, picks plants suited to containers and afternoon sun, includes a small water source, and keeps habitat suggestions realistic for a rented balcony."}
  - name: negative-spray-aphids
    vars:
      region: "Leeds, UK"
      space: "Small cottage garden, sunny. I want to attract bees but also spray insecticide on my roses for aphids every week."
    assert:
      - {type: llm-rubric, value: "Explains that weekly insecticide spraying conflicts with supporting pollinators, offers alternatives for aphids (tolerance, squashing or water jets, encouraging ladybirds and hoverflies), and still provides the pollinator plan."}
