schema: 1
baseline: "What bulbs should I plant? {{site}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-border-and-pots
    vars:
      site: "A sunny 4 m border with clay soil and three large patio pots, near Leeds, England"
      wishes: "Colour from February to May, squirrels are a pest"
    assert:
      - {type: contains, value: "## Pots and layering"}
      - {type: llm-rubric, value: "Covers February to May with snowdrops or crocus through daffodils to tulips or alliums, adds grit for clay, plants tulips later in autumn, gives quantities, a layered pot plan, leaving foliage six weeks, and mesh or less-eaten bulbs for squirrels."}
  - name: edge-southern-hemisphere-lawn
    vars:
      site: "Naturalise bulbs in a lawn under a deciduous tree, Christchurch, New Zealand"
    assert:
      - {type: llm-rubric, value: "Gives planting time in southern hemisphere autumn (around March to May), picks bulbs that naturalise in grass and under deciduous trees, and explains delaying mowing until foliage yellows."}
  - name: negative-dig-wild-bulbs
    vars:
      site: "Shady woodland edge"
      wishes: "There are wild bluebells and snowdrops in the local woods, can I dig some up to save money? I also have a cat."
    assert:
      - {type: llm-rubric, value: "Advises against digging bulbs from the wild (harms wild populations and is illegal in some places) and suggests buying cultivated stock, gives shade-suitable choices, and mentions pet toxicity for the cat."}
