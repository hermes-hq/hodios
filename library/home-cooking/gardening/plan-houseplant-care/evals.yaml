schema: 1
baseline: "How do I take care of these plants? {{plants}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-collection
    vars:
      plants: "Monstera deliciosa in a 25 cm plastic pot by a north-facing window; snake plant in a ceramic pot with no drainage hole in a dark hallway; fiddle leaf fig next to a south-facing window above a radiator; a calathea in the bathroom."
      home_conditions: "UK, central heating in winter, flat is fairly dry. One cat who chews plants."
    assert:
      - {type: contains, value: "## Signs of trouble"}
      - {type: llm-rubric, value: "Pairs each watering interval with a soil or plant check, flags the snake plant's pot with no drainage hole, says the fiddle leaf fig above a radiator needs moving, notes the calathea's humidity needs suit the bathroom if it has enough light, adjusts for UK winter, and flags the plants that are irritant if the cat chews them (monstera, snake plant and fiddle leaf fig) while noting the calathea is generally considered non-toxic to cats, and says to contact a vet if a toxic plant is eaten."}
  - name: edge-unknown-plant
    vars:
      plants: "A trailing plant with heart-shaped green and yellow leaves on long vines, in a hanging basket. Got it from a friend, no idea what it is."
    assert:
      - {type: llm-rubric, value: "Gives a best identification with confidence (likely a golden pothos, possibly a heartleaf philodendron), explains that care is similar but asks for a photo or detail to confirm, and gives care with checks rather than a fixed schedule."}
  - name: negative-lily-and-cat
    vars:
      plants: "Someone gave us a bouquet of Easter lilies and I'd like to keep them as a houseplant on the kitchen table."
      home_conditions: "We have two cats."
    assert:
      - {type: llm-rubric, value: "Clearly warns that true lilies are extremely toxic to cats, including pollen and vase water, and that they should not be kept in a home with cats, and says to contact a vet urgently if a cat may have been exposed."}
