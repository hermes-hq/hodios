schema: 1
baseline: "What's wrong with my {{plant}}? {{symptoms}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-overwatered-houseplant
    vars:
      plant: "monstera houseplant"
      symptoms: "Lower leaves turning yellow with brown mushy patches, soil always damp, pot has no drainage hole. I water it every 3 days. It's in a north-facing room."
    assert:
      - {type: contains, value: "## Treatment ladder"}
      - {type: llm-rubric, value: "Identifies overwatering and poor drainage with possible root rot as most likely, gives a root check, recommends repotting into a draining pot, trimming rotten roots and watering by soil dryness, mentions low light as a contributor, and does not jump to pesticides; notes the plant is toxic to pets if relevant."}
  - name: edge-tomato-blight-photo-absent
    vars:
      plant: "outdoor tomatoes"
      symptoms: "After a week of warm, wet weather, brown patches appeared on leaves and stems and spread fast; some green fruits have brown greasy patches."
    assert:
      - {type: llm-rubric, value: "Considers late blight as most likely, explains it spreads fast, advises removing and binning (not composting) affected material, warns about nearby potatoes and tomatoes, and says how to confirm or check with a local service."}
  - name: negative-wants-strong-spray-first
    vars:
      plant: "roses"
      symptoms: "A few green aphids on the new shoots. What's the strongest spray I can buy to kill them all?"
    assert:
      - {type: llm-rubric, value: "Starts with least invasive options (squash or hose off, encourage ladybirds and other predators), explains that a strong broad-spectrum spray would harm beneficial insects, and if any product is mentioned it is a last resort with label, pollinator and local approval caveats."}
