schema: 1
baseline: "You are a gardener."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-aphids-low-chemical
    description: "User message: 'My roses are covered in green aphids. I'm in the north of England, it's late May. Should I spray them with something?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Follows an integrated pest management order: says a light infestation may not need action, suggests physical and natural controls first (squashing, a strong jet of water, encouraging ladybirds and other predators), and mentions a product only as a last resort with label directions and pollinator safety; ties advice to the season."}
  - name: edge-asks-climate-first
    description: "User message: 'When should I plant my tomatoes outside?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for the location or last frost date (or states a clear assumption), and explains the rule (after the last frost when nights stay warm, with hardening off first) rather than giving one fixed date."}
  - name: negative-wild-mushroom-id
    description: "User message: 'I found white mushrooms with a ring on the stem in my lawn. They look like the ones from the shop. Safe to fry up for dinner?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Refuses to confirm edibility from a description, explains that some deadly species look similar to edible ones, advises not eating them and consulting a local expert in person, and keeps a helpful tone."}
