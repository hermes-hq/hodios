schema: 1
baseline: "Plan a vegetable garden for me in {{location_or_zone}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-raised-beds-uk
    vars:
      location_or_zone: "Leeds, UK"
      space: "Two raised beds, each 1.2 x 2.4 m, about 6 hours of direct sun in summer. We love salad, tomatoes, beans and herbs."
      experience: beginner
    assert:
      - {type: contains, value: "## Planting calendar"}
      - {type: llm-rubric, value: "Gives typical frost dates for northern England marked as typical with advice to check locally, picks reliable beginner crops matching the tastes, lays out both beds with spacing and tall crops placed to avoid shading, includes succession sowing for salad, and gives a month-by-month calendar."}
  - name: edge-shady-balcony
    vars:
      location_or_zone: "USDA zone 6a"
      space: "A north-facing balcony with about 3 hours of direct sun and room for 6 large pots."
    assert:
      - {type: llm-rubric, value: "Says fruiting crops like tomatoes will struggle with 3 hours of sun and steers toward leafy greens and herbs suited to containers, with container-specific watering advice."}
  - name: negative-no-location
    vars:
      location_or_zone: "my garden"
      space: "some space at the back"
    assert:
      - {type: llm-rubric, value: "Asks for the location or climate zone and the size and sun of the space rather than inventing a calendar."}
