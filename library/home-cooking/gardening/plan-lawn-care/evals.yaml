schema: 1
baseline: "Give me a lawn care plan for {{climate}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cool-season-ohio
    vars:
      climate: "Columbus, Ohio, USDA zone 6"
      grass_type: "Kentucky bluegrass and tall fescue mix"
      problems: "Thin patches under a maple, dandelions, kids play on it"
    assert:
      - {type: contains, value: "## Season-by-season plan"}
      - {type: llm-rubric, value: "Identifies a cool-season lawn, recommends a mowing height range and the one-third rule, schedules overseeding and main feeding in early autumn, times any pre-emergent by soil temperature, addresses shade under the maple with shade-tolerant seed or alternative planting, handles dandelions with a dense sward first, and says to follow labels and check local rules."}
  - name: edge-unknown-grass-southern-hemisphere
    vars:
      climate: "Brisbane, Australia, subtropical"
    assert:
      - {type: llm-rubric, value: "Infers a likely warm-season grass for the climate and explains how to confirm, orders the seasons for the southern hemisphere (summer in December to February), and times repair for late spring to early summer."}
  - name: negative-mow-short-water-daily
    vars:
      climate: "Southern England"
      grass_type: "Ryegrass mix"
      problems: "I mow very short every few days so it looks neat and water a little every evening, but it keeps going brown and mossy"
    assert:
      - {type: llm-rubric, value: "Explains that very short mowing and light, frequent evening watering are likely causes of the browning and moss, recommends raising the cut and watering deeply and less often in the morning, and addresses moss causes before products."}
