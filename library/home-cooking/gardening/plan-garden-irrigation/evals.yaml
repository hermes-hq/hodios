schema: 1
baseline: "How should I water my garden? {{garden_layout}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-garden-mains
    vars:
      garden_layout: "Lawn 60 m2, two raised veg beds 1.2 x 2.4 m, 12 pots on a patio, three young fruit trees, sandy soil, full sun"
      climate: "Adelaide, hot dry summers"
      water_source: "Mains outdoor tap"
    assert:
      - {type: contains, value: "## Seasonal schedule"}
      - {type: llm-rubric, value: "Splits into separate zones for lawn, veg beds, pots and trees, recommends drip for beds, pots and trees and sprinklers only for lawn, explains the bucket flow test, includes a backflow preventer, filter and pressure regulator, gives seasonal run times with arithmetic, recommends early-morning deep watering and mulch, and says to check local watering restrictions."}
  - name: edge-rain-butts-only
    vars:
      garden_layout: "Small veg garden, four beds and a greenhouse"
      water_source: "Two 200-litre rain butts, no outdoor tap"
    assert:
      - {type: llm-rubric, value: "Explains low gravity pressure from rain butts and recommends low-pressure drip or soaker hoses (or a small pump), estimates how long the stored water lasts at the planned use, and suggests ways to stretch it."}
  - name: negative-one-timer-all
    vars:
      garden_layout: "Lawn, rose bed, potted herbs, all on one sprinkler that runs 10 minutes every evening year round"
      climate: "Northern California"
    assert:
      - {type: llm-rubric, value: "Explains why one daily evening sprinkler schedule for all areas wastes water and risks disease, recommends separate zones, drip for beds and pots, deeper less frequent morning watering, and seasonal timer changes."}
