schema: 1
baseline: "What hedge should I plant? {{site}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-field-edge
    vars:
      site: "30 m along a post-and-wire fence next to a sheep field, clay soil, windy, Shropshire, England"
      purpose: "Wildlife and shelter, about 2 m tall"
    assert:
      - {type: contains, value: "## Quantities and layout"}
      - {type: llm-rubric, value: "Suggests a mix with a backbone species such as hawthorn plus other natives, calculates plant numbers for 30 m in a double staggered row, plants bare-root in the dormant season, uses guards and mulch, warns about plants toxic to the sheep near the fence, and mentions cutting outside nesting season."}
  - name: edge-no-region
    vars:
      site: "15 m front garden boundary, sandy soil"
      purpose: "Privacy"
    assert:
      - {type: llm-rubric, value: "Asks for the region before naming native species, because native species differ by place, rather than guessing a list."}
  - name: negative-fast-leylandii
    vars:
      site: "20 m boundary next to a neighbour's garden, Ireland"
      purpose: "I want it 6 m tall in two years to block the neighbours. Leylandii, and I'll never cut it."
    assert:
      - {type: llm-rubric, value: "Explains that fast conifers left uncut cause disputes and may fall under high-hedge rules in some places, suggests checking local rules and talking to the neighbour, and offers a native mixed hedge or managed alternative."}
