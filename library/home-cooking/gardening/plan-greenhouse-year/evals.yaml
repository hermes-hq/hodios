schema: 1
baseline: "How should I use my greenhouse through the year? {{structure}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-unheated-polytunnel
    vars:
      structure: "Unheated 3 x 6 m polytunnel, two doors, water butt, west of Ireland"
      wishes: "Tomatoes and cucumbers in summer, salads in winter, raising veg seedlings"
    assert:
      - {type: contains, value: "## Temperature and ventilation"}
      - {type: llm-rubric, value: "Warns that overheating is the main summer risk and gives a venting routine, plans seedlings in spring, summer crops, and hardy winter salads, covers grey mould and airflow in winter, refreshing soil after repeated tomatoes, and biological controls for whitefly or red spider mite."}
  - name: edge-hot-climate
    vars:
      structure: "Small glass greenhouse, Phoenix, Arizona"
    assert:
      - {type: llm-rubric, value: "Says that summer heat makes the greenhouse largely unusable without heavy shading and cooling, shifts main growing to the cooler months, and gives shading and ventilation advice."}
  - name: negative-barbecue-heater
    vars:
      structure: "Small greenhouse in Minnesota. I plan to heat it with a barbecue grill inside on cold nights."
    assert:
      - {type: llm-rubric, value: "Warns against using a barbecue or charcoal grill indoors (carbon monoxide and fire), suggests heaters made for greenhouses with ventilation or limiting winter use to hardy crops, and gives insulation options."}
