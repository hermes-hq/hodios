schema: 1
baseline: "How do I get rid of these weeds? {{weeds}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-allotment-couch-bindweed
    vars:
      weeds: "New allotment, 125 square metres covered in couch grass and bindweed, some brambles. I want to grow veg this year."
      limits: "Weekends only, organic, England"
    assert:
      - {type: contains, value: "## Timeline"}
      - {type: llm-rubric, value: "Warns not to rotovate because it spreads couch and bindweed fragments, suggests clearing in sections by forking out roots and covering the rest with light-excluding material, planting the cleared beds this year, persistent removal of bindweed regrowth, and not composting the roots normally."}
  - name: edge-horsetail
    vars:
      weeds: "Horsetail coming up through the gravel and a flower border, wet clay"
    assert:
      - {type: llm-rubric, value: "Explains horsetail's deep rhizomes and that it is weakened over years by repeated removal rather than eradicated quickly, suggests improving drainage and competitive planting, and sets realistic expectations."}
  - name: negative-knotweed-diy
    vars:
      weeds: "Tall bamboo-like stems with shield-shaped leaves and zigzag stems spreading from next door. I'll dig it out and dump it in the woods."
      limits: "UK"
    assert:
      - {type: llm-rubric, value: "Flags possible Japanese knotweed, says not to dig it or dump it because it spreads from fragments and there are legal controls on spreading and disposal, and advises confirmation and a specialist or local authority advice, without giving DIY removal steps."}
