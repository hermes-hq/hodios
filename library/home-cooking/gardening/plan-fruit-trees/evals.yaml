schema: 1
baseline: "What fruit trees should I plant? {{climate}}. {{space}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kent-mixed
    vars:
      climate: "Kent, UK"
      space: "Garden 12 x 8 m, full sun, heavy clay, a sheltered south-facing wall"
      fruits_wanted: "Eating apples, a plum, raspberries, blueberries"
    assert:
      - {type: contains, value: "## Pollination plan"}
      - {type: llm-rubric, value: "Recommends forms and rootstock vigour that fit the space (for example dwarfing apples or espalier on the wall), plans pollination partners for apples by flowering group, notes many plums are self-fertile, flags that blueberries need acidic soil and suggests containers with ericaceous compost on clay, explains planting with the graft union above soil, and advises removing or thinning fruit in early years."}
  - name: edge-low-chill-climate
    vars:
      climate: "Southern Florida, very mild winters"
      space: "Small yard, sunny"
      fruits_wanted: "Apples and cherries"
    assert:
      - {type: llm-rubric, value: "Explains that most apples and cherries need more winter chill than this climate gives, suggests low-chill types to ask a local nursery about or better-suited fruits for the climate, and fits the plan to a small yard."}
  - name: negative-one-tree-no-partner
    vars:
      climate: "Toronto, Canada"
      space: "Tiny courtyard, room for one tree only, in a large container"
      fruits_wanted: "A sweet cherry"
    assert:
      - {type: llm-rubric, value: "Points out the need for a self-fertile variety or a partner nearby, recommends a dwarfing rootstock suited to a container, and mentions winter protection for a container tree in a cold climate."}
