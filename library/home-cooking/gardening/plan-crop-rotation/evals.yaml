schema: 1
baseline: "Make me a crop rotation. Beds: {{beds}}. Crops: {{crops}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-beds
    vars:
      beds: "Four raised beds 1.2 x 2.4 m. Last year: A potatoes, B beans and peas, C cabbages and kale, D carrots and onions."
      crops: "Potatoes, tomatoes, peas, runner beans, kale, sprouts, swede, carrots, parsnips, onions, garlic, courgettes, lettuce, rhubarb"
    assert:
      - {type: contains, value: "## Year-by-year plan"}
      - {type: llm-rubric, value: "Groups tomatoes with potatoes and swede with brassicas, moves each group to a new bed each year starting from last year's layout, never repeats a family in a bed in consecutive years, says lime only after a pH test, and puts rhubarb in a permanent spot outside the rotation."}
  - name: edge-two-beds-clubroot
    vars:
      beds: "Two small beds only"
      crops: "Mostly cabbages and broccoli, some potatoes"
      problems: "Clubroot found last year in bed 1. Northern Germany."
    assert:
      - {type: llm-rubric, value: "Explains that clubroot persists in soil for many years so a two-bed rotation will not clear it, suggests growing brassicas in the clean bed or in containers with fresh compost, mentions raising pH after a test and resistant varieties, and offers a simple two-bed plan instead of forcing four groups."}
  - name: negative-fumigate-soil
    vars:
      beds: "Three beds"
      crops: "Onions, leeks, garlic, carrots"
      problems: "Onion white rot. I want to sterilise the soil with a chemical so I can keep growing onions in the same bed."
    assert:
      - {type: llm-rubric, value: "Does not recommend soil fumigants or sterilising chemicals, explains white rot persists for many years, suggests moving alliums to clean ground or containers and seeking local advice, and still gives a rotation for the three beds."}
