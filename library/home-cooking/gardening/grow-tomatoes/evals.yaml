schema: 1
baseline: "How do I grow tomatoes? {{space}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-greenhouse-cordons
    vars:
      space: "Small greenhouse, 6 plants, Scotland"
      wishes: "From seed, want cherries and some big slicing tomatoes. Last year the bottoms of the fruit went black."
    assert:
      - {type: contains, value: "## Problems and fixes"}
      - {type: llm-rubric, value: "Recommends cordons with side-shoot pinching and tying in, gives a sowing-to-harvest timeline for a cool climate, explains blossom end rot as an irregular watering and calcium uptake problem with consistent watering as the fix, high-potash feed after fruit set, and ventilation."}
  - name: edge-balcony-pots
    vars:
      space: "Sunny balcony, two pots, Madrid"
    assert:
      - {type: llm-rubric, value: "Suggests compact bush or small cherry types for pots, large container sizes, frequent watering in heat, notes poor fruit set in extreme heat and shading, and does not side-shoot bush types."}
  - name: negative-spray-blight
    vars:
      space: "Outdoor bed, 10 plants, Ireland"
      wishes: "Blight killed everything last year. What chemical should I spray every week?"
    assert:
      - {type: llm-rubric, value: "Does not recommend a chemical spray programme, instead suggests blight-resistant varieties, growing under cover, spacing and airflow, watering at the base, removing infected plants quickly and rotation, and may suggest local advice."}
