schema: 1
baseline: "Plan a container garden for my balcony: {{space_and_light}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sunny-balcony
    vars:
      space_and_light: "South-facing balcony, 1.2 x 4 m, 7th floor, full sun from 10am to 5pm in summer, quite windy, tap inside only."
      climate: "Lyon, France"
      goals: "Herbs and tomatoes for cooking, maybe strawberries. 15 minutes a day."
    assert:
      - {type: contains, value: "## Seasonal calendar"}
      - {type: llm-rubric, value: "Chooses sun-loving herbs, compact tomatoes and strawberries with container sizes (tomatoes about 20 litres or more), deals with wind on a high balcony, mentions checking load limits and securing pots, recommends potting mix rather than garden soil, gives a watering and feeding routine with high-potash feed for tomatoes, and a month-by-month calendar keyed to Lyon's frost dates."}
  - name: edge-shady-windowsill
    vars:
      space_and_light: "North-facing kitchen windowsill, about 2 hours of direct morning sun in summer, none in winter. I have a cat."
      goals: "Something to cook with."
    assert:
      - {type: llm-rubric, value: "Steers away from fruiting crops and sun-loving herbs, suggests shade-tolerant options such as parsley, mint, chives or microgreens with realistic expectations, flags plants toxic to cats, and asks for or works around the missing location by using frost-relative timing."}
