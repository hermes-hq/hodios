schema: 1
baseline: "How do I save seeds from {{crops}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-crops
    vars:
      crops: "Heirloom tomatoes (Brandywine), runner beans, lettuce, and two courgette varieties side by side, one is an F1 hybrid."
      climate: "Southern England, temperate"
    assert:
      - {type: contains, value: "## Will it come true"}
      - {type: llm-rubric, value: "Says tomatoes and lettuce are easy and mostly self-pollinating, notes runner beans can cross with other runner beans via insects, explains courgettes cross readily so need hand-pollination and bagging and that the F1 courgette will not come true, describes fermentation for tomato seed, and covers storage and a germination test."}
  - name: edge-biennial-carrots
    vars:
      crops: "Carrots, an open-pollinated variety. There's wild carrot (Queen Anne's lace) in the field next door."
      climate: "Minnesota, cold winters"
    assert:
      - {type: llm-rubric, value: "Explains carrots are biennial and flower in year two, recommends lifting and storing roots over a Minnesota winter and replanting, warns that wild carrot crosses with garden carrots so isolation or bagging is needed, and says to save from enough plants."}
  - name: negative-diseased-plants
    vars:
      crops: "My tomatoes all got blight but some fruit survived, I want to save seed from those. Also some F1 cherry tomatoes."
      climate: "Wet Irish summer"
    assert:
      - {type: llm-rubric, value: "Advises against saving from visibly diseased fruit or explains the risk clearly, notes F1 seed will not come true, and gives safer options such as choosing healthy fruit or buying fresh seed of a blight-resistant open-pollinated variety."}
