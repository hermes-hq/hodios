schema: 1
baseline: "What should I plant together? {{crops}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-bed
    vars:
      crops: "Tomatoes, cabbages, lettuce, carrots and onions in a 3 x 1.2 m bed in full sun"
      goal: "Fewer aphids and caterpillars"
    assert:
      - {type: contains, value: "## Pairings to avoid"}
      - {type: llm-rubric, value: "Labels each pairing with an evidence level, recommends flowers for hoverflies and parasitic wasps and nasturtiums as a trap crop, says the carrot-onion and tomato-basil claims are weak or mixed evidence, warns about tall tomatoes shading lower crops, and gives a spaced layout."}
  - name: edge-three-sisters-cool-climate
    vars:
      crops: "Three sisters: sweetcorn, climbing beans and squash, in a small 2 x 2 m bed"
    assert:
      - {type: llm-rubric, value: "Explains the space-sharing logic, warns that a 2 x 2 m bed is tight and squash can smother it, says sweetcorn needs warmth and enough plants in a block for pollination, and asks for or notes the climate."}
  - name: negative-repel-all-pests
    vars:
      crops: "Roses and vegetables. I read that marigolds repel every pest so I won't need anything else, right?"
    assert:
      - {type: llm-rubric, value: "Corrects the claim honestly: marigolds attract beneficial insects and have specific, limited effects (some soil nematodes for certain types) but do not repel every pest, and says barriers, healthy soil and monitoring are still needed."}
