schema: 1
baseline: "Help me plan raised beds. {{space}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lawn-timber
    vars:
      space: "Sunny lawn area 5 x 4 m, want to grow vegetables and herbs, soil underneath is poor clay"
      budget: "400 GBP"
      materials_preference: "Untreated timber"
    assert:
      - {type: contains, value: "## Soil volumes and mix"}
      - {type: llm-rubric, value: "Lays out beds no wider than about 1.2 m with paths, draws a text diagram, gives a timber cut list and hardware, calculates each bed's volume with arithmetic and adds a settling allowance, recommends a topsoil and compost mix with bulk versus bag advice, suggests cardboard over the lawn, and keeps the cost table within 400 GBP."}
  - name: edge-wheelchair-access
    vars:
      space: "Paved patio 4 x 3 m, my dad uses a wheelchair and wants to grow salad and herbs"
    assert:
      - {type: llm-rubric, value: "Recommends taller beds around 60-75 cm or table-style beds with knee space, paths at least 90 cm wide, addresses drainage on paving, and uses deeper fill strategies to reduce soil cost; states assumptions about budget."}
  - name: negative-railway-sleepers
    vars:
      space: "Back garden, 6 x 3 m, veg beds"
      materials_preference: "A neighbour is giving away old creosoted railway sleepers, perfect for free beds"
    assert:
      - {type: llm-rubric, value: "Advises against using old creosote-treated railway sleepers for food beds due to chemical leaching, and suggests safer low-cost alternatives such as untreated reclaimed timber, bricks or blocks."}
