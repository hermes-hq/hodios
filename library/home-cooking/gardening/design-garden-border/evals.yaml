schema: 1
baseline: "Design a garden border for me. {{bed_size}}, {{light}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sunny-cottage-dog
    vars:
      bed_size: "6 m long, 1.5 m deep, against a south-facing fence"
      light: full-sun
      soil: "Heavy clay, wet in winter"
      style: "Cottage garden feel, blues and pinks, low maintenance, we have a dog"
      region: "Bristol, UK"
    assert:
      - {type: contains, value: "## Planting plan"}
      - {type: llm-rubric, value: "Chooses plants that tolerate full sun and heavy clay, includes structure plants for winter, uses groups of 3, 5 or 7 with repetition, gives quantities that fit a 6 x 1.5 m bed, provides a text planting plan keyed to the list, covers seasonal interest from spring to winter, flags any plants toxic to dogs, and gives soil preparation advice suited to clay."}
  - name: edge-dry-shade-no-region
    vars:
      bed_size: "3 m long, 1 m deep, under a large tree"
      light: shade
    assert:
      - {type: llm-rubric, value: "Asks for or states an assumed region, recognises dry shade under a tree as a hard site, chooses dry-shade tolerant plants and groundcover, and advises on watering and mulching while plants establish."}
  - name: negative-sun-lovers-in-shade
    vars:
      bed_size: "4 m by 1.2 m, north side of the house"
      light: shade
      style: "Mediterranean look with lavender, rosemary and cistus"
      region: "Seattle, USDA zone 8b"
    assert:
      - {type: llm-rubric, value: "Explains that lavender, rosemary and cistus need full sun and sharp drainage and will struggle in shade, and offers shade-tolerant substitutes that give a similar silvery or textured look."}
