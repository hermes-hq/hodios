schema: 1
baseline: "When should I start my seeds? Crops: {{crops}}. Last frost: {{last_frost_date}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-crops-windowsill-light
    vars:
      crops: "Tomatoes, sweet peppers, basil, lettuce, courgettes, carrots"
      last_frost_date: "10 May"
      setup: "South-facing windowsill and one LED shop light, no greenhouse"
    assert:
      - {type: contains, value: "## Dated schedule"}
      - {type: llm-rubric, value: "Converts weeks-before-frost into actual dates counted from 10 May with arithmetic shown, starts peppers earliest and courgettes late, puts carrots as direct sow, recommends 14-16 hours of light close to the seedlings and bottom heat for peppers, includes a 7-14 day hardening-off plan, explains damping off prevention, and says the seed packet overrides general timings."}
  - name: edge-location-only-southern
    vars:
      crops: "Tomatoes and pumpkins"
      last_frost_date: "I don't know, I live in Canberra, Australia"
    assert:
      - {type: llm-rubric, value: "Estimates a last frost date for Canberra in the southern hemisphere spring (around October or later), says it is approximate with risk of later frosts and to confirm locally, and builds the schedule from that date."}
  - name: negative-sow-everything-january
    vars:
      crops: "Tomatoes, beans, carrots, sunflowers"
      last_frost_date: "late May"
      setup: "Dark north windowsill. I want to sow everything indoors in January to get ahead."
    assert:
      - {type: llm-rubric, value: "Explains that January sowing on a dark windowsill gives leggy weak seedlings, recommends later sowing dates or grow lights, and notes that carrots and usually beans are better direct sown."}
