schema: 1
baseline: "Make me a garden calendar for {{climate}}. I grow: {{plants}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dublin-mixed
    vars:
      climate: "Dublin, Ireland"
      plants: "Lawn, 2 apple trees, roses, a lavender hedge, 3 veg beds with tomatoes, beans and garlic, tulips in pots"
      start_month: "October"
    assert:
      - {type: contains, value: "## Month by month"}
      - {type: llm-rubric, value: "States northern-hemisphere assumptions with approximate frost dates, covers twelve months starting from October, includes winter apple pruning, garlic planting in autumn, tulip planting in late autumn, lavender trimmed after flowering and not into old wood, tomatoes planted out after the last frost, marks priority jobs per month, and only includes the plants listed."}
  - name: edge-southern-hemisphere
    vars:
      climate: "Christchurch, New Zealand"
      plants: "Citrus in pots, roses, a vegetable bed"
    assert:
      - {type: llm-rubric, value: "Adjusts seasons for the southern hemisphere (winter in June to August, rose pruning in winter around July to August), includes frost protection for potted citrus, and treats dates as approximate."}
  - name: negative-pad-with-extras
    vars:
      climate: "Phoenix, Arizona"
      plants: "Two citrus trees and a few cacti in pots"
    assert:
      - {type: llm-rubric, value: "Keeps the calendar to citrus and cacti only, organises around heat and monsoon rather than frost-based temperate jobs, covers summer heat protection and watering, and does not pad months with jobs for plants the user does not have."}
