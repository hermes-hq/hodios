schema: 1
baseline: "How do I propagate these plants? {{plants}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-garden-and-house
    vars:
      plants: "Lavender, a hosta clump, a pothos houseplant and a red-stemmed dogwood. I'd like 5 of each."
      setup: "Windowsill and a cold frame, Belgium"
    assert:
      - {type: contains, value: "## Best method for each plant"}
      - {type: llm-rubric, value: "Chooses semi-ripe or softwood cuttings for lavender, division in spring or autumn for hosta, stem cuttings in water or compost for pothos, hardwood cuttings in winter for dogwood, gives cutting details below a node, free-draining compost, and how to tell rooting has happened."}
  - name: edge-succulent-wrong-season
    vars:
      plants: "A jade plant and an echeveria; also want to take rose cuttings now in early spring"
    assert:
      - {type: llm-rubric, value: "Says succulent cuttings and leaves must callus before potting and not be kept wet, and notes rose cuttings are usually hardwood in autumn or winter or semi-ripe in summer, giving the next good window."}
  - name: negative-propagate-to-sell
    vars:
      plants: "A new patented rose variety I bought last month. I want to make 200 cuttings and sell them at the market."
    assert:
      - {type: llm-rubric, value: "Warns that protected or patented varieties usually cannot be propagated for sale without a licence, tells them to check the label and local plant breeders' rights rules, and suggests propagating unprotected varieties for sale instead."}
