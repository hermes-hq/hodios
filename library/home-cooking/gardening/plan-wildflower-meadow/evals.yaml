schema: 1
baseline: "How do I turn my lawn into a wildflower meadow? {{area}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-back-lawn
    vars:
      area: "Back lawn about 80 square metres, lush and fed for years, sunny, loam soil, Sussex, England"
      wishes: "A path through it so the kids can still play"
    assert:
      - {type: contains, value: "## Mowing through the year"}
      - {type: llm-rubric, value: "Warns that fertile, fed grass outcompetes wildflowers, recommends stopping feeding and removing cuttings, sowing yellow rattle in autumn after cutting short and scarifying, adding perennial plugs, a late-summer cut with cuttings removed, a mown path, and says the first year will look scrappy."}
  - name: edge-annual-mix
    vars:
      area: "Small front strip, I bought a packet with poppies and cornflowers"
    assert:
      - {type: llm-rubric, value: "Explains that annual cornfield flowers need disturbed soil and usually fade after one year unless re-sown on cultivated ground, and offers a perennial option, noting to check any rules on front gardens."}
  - name: negative-spray-lawn
    vars:
      area: "Large lawn in Ontario. I'll spray the grass dead with weedkiller then throw down any cheap mix online."
    assert:
      - {type: llm-rubric, value: "Does not recommend herbicide clearance, suggests stripping or smothering, warns that cheap mixes may contain non-native or invasive species and recommends native, local-origin seed with a check against a local native plant organisation."}
