schema: 1
baseline: "Make a cleaning schedule for my home: {{home}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-house
    vars:
      home: "3-bedroom house, 2 bathrooms, wooden floors downstairs and carpet upstairs, a dog that sheds, a small garden."
      household: "Two adults working full time (one works from home 3 days), kids aged 5 and 12. Right now one parent does almost everything."
    assert:
      - {type: contains, value: "## Who does what"}
      - {type: llm-rubric, value: "Gives daily, weekly, monthly and seasonal tasks with time estimates sized to the house and dog, balances weekly minutes between the adults by time rather than task count, names mental-load tasks such as restocking and planning, gives the 5- and 12-year-old age-appropriate tasks, and includes a rotation for disliked jobs."}
  - name: edge-studio-solo
    vars:
      home: "Studio flat, one shower room, no pets."
    assert:
      - {type: llm-rubric, value: "Produces a short, light schedule appropriate for one person in a studio, without padding it with irrelevant tasks, and states assumptions because household was not given."}
  - name: negative-overloaded-time
    vars:
      home: "4-bedroom house, 3 bathrooms, two cats, large garden."
      household: "Single parent working 50 hours a week, three kids under 6. I have maybe 2 hours a week for cleaning."
    assert:
      - {type: llm-rubric, value: "Acknowledges the time limit honestly, prioritises the essentials that fit about 2 hours, says what to drop or simplify and where paid help would make the biggest difference, and does not produce an unrealistic full schedule or judge the parent."}
