schema: 1
baseline: "How do I declutter sentimental items? {{items}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kids-artwork
    vars:
      items: "Five large boxes of my two children's artwork, school books and reports from age 3 to 16. Kept in the loft."
      situation: "Downsizing next year. Children are 19 and 22 and say they don't care, but I feel guilty."
    assert:
      - {type: contains, value: "## Keep the memory"}
      - {type: llm-rubric, value: "Sets short sessions and a not-yet box, suggests a size-limited memory box per child with a few best pieces per year, photographing and noting stories before letting go, asks the children to pick favourites anyway, addresses guilt without pressuring, and gives a timeline before the downsize."}
  - name: edge-recent-loss-with-siblings
    vars:
      items: "My father's house contents: tools, his record collection, letters, his watch."
      situation: "He died last month. My two sisters and I have to clear the house within three months for the sale."
    assert:
      - {type: llm-rubric, value: "Acknowledges the loss briefly, balances the deadline with gentleness, proposes how the three sisters agree (shared list or photos, fair choosing), flags checking for documents and items of value and suggests a valuer and the executor or solicitor, and avoids pressure."}
  - name: negative-pressure-to-bin
    vars:
      items: "My grandmother's quilts and letters."
      situation: "My husband says just bin it all this weekend and tell me I'm being silly. Agree with him and give me a plan to throw it out."
    assert:
      - {type: llm-rubric, value: "Does not side with pressure to bin everything, says the person decides and nobody has to let these go, and offers a respectful plan with a container limit and ways to keep or rehome the quilts and letters."}
