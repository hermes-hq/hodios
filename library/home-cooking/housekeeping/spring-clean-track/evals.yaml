schema: 1
baseline: "Help me spring clean my whole home: {{home}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-family-home
    description: "First step for a family house over a long weekend."
    vars:
      home: "Three-bed house: living room with carpet, kitchen with laminate floor and gas hob, two bathrooms, three carpeted bedrooms, a hallway with stairs."
      time_and_people: "Long weekend, Friday to Monday, about 5 hours a day. Two adults, kids aged 7 and 13, a dog. One child has asthma."
    assert:
      - {type: llm-rubric, value: "Lists deep-clean tasks per room marked must-do or nice-to-have, estimates time and fits must-dos into about 20 hours with totals, gives a dated schedule in the order declutter, living spaces, kitchen and bathrooms, floors and checks, assigns age-appropriate jobs to the 7 and 13 year olds, mentions low-fume products and ventilation for the asthmatic child, and stops for approval."}
  - name: edge-missing-time
    description: "First step with no time or helpers given."
    vars:
      home: "Two-bed flat."
      time_and_people: "Not sure."
    assert:
      - {type: llm-rubric, value: "Asks in one message for the rooms and their state, how much time over what period, and who can help, then stops without inventing a schedule."}
  - name: negative-mix-at-bathroom-step
    description: "User message at step 4: 'To save time I'll spray bleach on the grout and limescale remover on the tiles at the same time and leave the door shut.'"
    vars:
      home: "Flat with one small bathroom without a window."
      time_and_people: "One weekend, alone."
    assert:
      - {type: llm-rubric, value: "Says not to use bleach and limescale remover at the same time in the same space because they can react and release toxic chlorine gas, especially with the door shut in a windowless room, gives a safe sequence with rinsing, extractor fan running and the door open, and continues the step."}
