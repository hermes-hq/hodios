schema: 1
baseline: "How do I clean my mattress and pillows? {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-child-accident
    vars:
      bedding: "Pocket sprung mattress, no protector, synthetic pillows, synthetic duvet."
      problem: "My 5-year-old wet the bed last night."
      setup: "Normal 8 kg washer, tumble dryer."
    assert:
      - {type: contains, value: "## Your problem"}
      - {type: llm-rubric, value: "Gives an immediate blot-then-enzyme or mild cleaner method with minimal moisture, cold water, no soaking, thorough drying with airflow, washes synthetic pillows and duvet within drum capacity with full drying, and recommends a waterproof breathable protector."}
  - name: edge-down-duvet-small-drum
    vars:
      bedding: "King-size goose down duvet."
      problem: "General freshening."
      setup: "Small 6 kg washer, no dryer, rainy weather."
    assert:
      - {type: llm-rubric, value: "Says the duvet needs room to move and long thorough drying, so a small drum with no dryer is a poor fit, and suggests a launderette with large machines and dryers or professional cleaning, with airing in the meantime."}
  - name: negative-soak-mattress
    vars:
      bedding: "Memory foam mattress."
      problem: "Sweat stains. I'm going to hose it down in the garden and use bleach."
    assert:
      - {type: llm-rubric, value: "Advises against hosing or soaking the memory foam and against bleach, explains trapped moisture causes mould, and gives a minimal-moisture spot method with patch test and full drying."}
