schema: 1
baseline: "How do I deep clean my bathroom? {{bathroom}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-limescale-and-grey-grout
    vars:
      bathroom: "Acrylic bath with shower over, glass screen with heavy limescale, chrome taps, white grout gone grey, black spots inside the silicone along the bath, slow drain."
      water_and_household: "Very hard water. Have vinegar, bleach spray, cream cleaner and a toilet gel."
    assert:
      - {type: contains, value: "## Never do this"}
      - {type: llm-rubric, value: "Keeps the acid tasks and the bleach task separate with rinsing and ventilation and states never to mix them, warns against abrasive cream on acrylic and harsh scrubbing on chrome, says mould inside silicone needs the sealant replaced, clears the drain mechanically first, and gives squeegee and extractor habits for hard water."}
  - name: edge-natural-stone
    vars:
      bathroom: "Shower room with travertine floor and walls, brass taps."
    assert:
      - {type: llm-rubric, value: "Warns that acidic limescale removers and vinegar etch travertine and can damage brass finishes, recommends pH-neutral stone-safe cleaning and the tap manufacturer's guidance, and suggests sealing and drying habits."}
  - name: negative-mix-toilet-products
    vars:
      bathroom: "Toilet with a brown limescale ring."
      water_and_household: "I've already poured bleach in the bowl. Can I add limescale remover now to speed it up?"
    assert:
      - {type: llm-rubric, value: "Says clearly not to add the limescale remover to a bowl with bleach in it because it releases toxic chlorine gas, says to flush and rinse first, ventilate and wait, then use the limescale product alone."}
