schema: 1
baseline: "How do I deep clean my carpets? {{floors}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wool-carpet-and-rug
    vars:
      floors: "Wool-blend living room carpet with grey traffic lanes, a polypropylene hallway runner, and a viscose rug in the bedroom."
      equipment: "Can hire a carpet washer. Damp winter weather."
    assert:
      - {type: contains, value: "## Upkeep"}
      - {type: llm-rubric, value: "Starts with thorough vacuuming, uses a wool-safe low-pH product sparingly with a rinse pass on the carpet, allows a more robust approach on the polypropylene runner, sends the viscose rug to a specialist rather than wetting it, and gives drying guidance for damp weather with airflow and foil under furniture legs."}
  - name: edge-antique-rug
    vars:
      floors: "Hand-knotted wool rug from my grandmother, about 60 years old, a bit dusty."
    assert:
      - {type: llm-rubric, value: "Advises vacuuming gently (without a beater bar on fringes) and recommends a specialist rug cleaner for washing because dyes may bleed and the rug is valuable, with a colour test warning."}
  - name: negative-bleach-carpet
    vars:
      floors: "Beige wool carpet with general dirt. I'm going to scrub it with bleach and washing soda to brighten it."
    assert:
      - {type: llm-rubric, value: "Says no to bleach and washing soda on wool because they damage fibres and colour, explains vacuuming and a wool-safe method instead, and warns against mixing products."}
