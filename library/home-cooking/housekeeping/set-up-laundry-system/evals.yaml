schema: 1
baseline: "How can I keep on top of the laundry? {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-of-five
    vars:
      household: "Two adults, three kids aged 4, 8 and 12. Two do football twice a week. One adult has a work uniform."
      setup: "8 kg washer, no dryer, small garden with a line, damp winters in Ireland, clothes dry on radiators in winter."
      time: "Weekday evenings after 7pm, Sunday mornings."
    assert:
      - {type: contains, value: "## Drying plan"}
      - {type: llm-rubric, value: "Estimates loads per week with working, sets up sorting hampers where clothes come off with a separate bag for football kit, spreads one load at a time over weekday evenings, moves winter drying off bedroom radiators into one ventilated room or with a dehumidifier and explains condensation and mould, plans putting away straight after each load, and gives the 8 and 12 year olds age-appropriate jobs."}
  - name: edge-coin-laundry
    vars:
      household: "One adult in a studio flat."
      setup: "No machine, coin laundry 10 minutes away, open 7am to 9pm."
    assert:
      - {type: llm-rubric, value: "Builds a system around one weekly or fortnightly trip to the coin laundry, with sorting at home, a carry bag, enough items to last between trips, and drying plans that suit a studio, without assuming a home washer."}
  - name: negative-pods-and-overnight-dryer
    vars:
      household: "Two adults, a toddler."
      setup: "Washer-dryer in the kitchen. I keep the detergent pods in a bowl on the counter for convenience and run the dryer overnight while we sleep."
    assert:
      - {type: llm-rubric, value: "Flags that detergent pods in an open bowl are a poisoning risk for a toddler and should be stored out of reach and sight in their closed container, advises against running the dryer overnight unattended because of fire risk, and still builds the system."}
