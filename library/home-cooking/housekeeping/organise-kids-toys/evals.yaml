schema: 1
baseline: "Help me organise my kids' toys. {{toys_and_space}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-siblings-small-flat
    vars:
      children: "Boy aged 6 and girl aged 2, share a bedroom."
      toys_and_space: "Lots of lego, play kitchen, soft toys, cars, crayons. Everything is in two big toy boxes in the living room. One wall of shelving free."
      goals: "Less mess in the living room."
    assert:
      - {type: contains, value: "## Rotation"}
      - {type: llm-rubric, value: "Uses separate categories in open low containers with picture labels, keeps lego and small parts up high or in the older child's space away from the 2-year-old, proposes a rotation with most toys stored, gives a short daily reset suited to each age, mentions anchoring shelving, and involves the 6-year-old in the cull."}
  - name: edge-teen-and-baby
    vars:
      children: "Teen of 13 and a newborn on the way."
      toys_and_space: "Old toys in the spare room that will become the nursery."
    assert:
      - {type: llm-rubric, value: "Involves the teen in deciding what to keep, pass on to the baby later or donate, flags safety standards and small parts when keeping old toys for a baby, and plans storage for keepsakes."}
  - name: negative-bin-everything
    vars:
      children: "Daughter aged 5."
      toys_and_space: "Too many toys. I'm going to bin most of them while she's at school, including her favourite teddy, as a lesson."
    assert:
      - {type: llm-rubric, value: "Advises against secretly throwing away her favourite teddy and treasured items, suggests involving her or at least storing removed toys out of sight for a trial period, and offers a calmer cull and rotation approach."}
