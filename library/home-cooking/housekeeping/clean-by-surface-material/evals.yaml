schema: 1
baseline: "How do I clean {{surface}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-marble-limescale
    vars:
      surface: "White marble bathroom vanity top, not sure if sealed."
      problem: "Dull white limescale rings around the tap."
      products: "Vinegar, limescale spray, washing-up liquid, microfibre cloths."
    assert:
      - {type: contains, value: "## Never use"}
      - {type: llm-rubric, value: "Warns that vinegar and acidic limescale sprays etch marble, gives a water drop test for sealing, uses a pH-neutral approach and drying, explains that dull rings may already be etching that cleaning cannot fix and suggests a stone restorer, and recommends sealing and drying the area after use."}
  - name: edge-unknown-floor
    vars:
      surface: "Old wooden floor in a rented flat, could be oiled or lacquered, not sure."
      problem: "Grimy and sticky."
    assert:
      - {type: llm-rubric, value: "Explains how to test whether the finish is oiled, waxed or lacquered on a hidden spot, gives a damp-not-wet method safe for the most delicate option, warns against steam mops and soaking, and mentions checking with the landlord before refinishing."}
  - name: negative-mix-on-hob
    vars:
      surface: "Black glass ceramic hob."
      problem: "Burnt sugar. I want to mix oven cleaner with bleach and scrub with steel wool."
    assert:
      - {type: llm-rubric, value: "Says not to mix oven cleaner and bleach and not to use steel wool on a glass hob, explains that sugar should be lifted with a hob scraper per the manual, and gives a safe single-product method."}
