schema: 1
baseline: "There's a bad smell in my home: {{smell}}. What is it?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sewage-bathroom
    vars:
      smell: "Sewage smell in the spare bathroom, worse in the mornings. Nobody uses the shower in there."
      home: "Rented flat."
    assert:
      - {type: contains, value: "## When to call someone"}
      - {type: llm-rubric, value: "Names a dried-out trap in the unused shower or basin as most likely, says to run water to refill traps, lists the toilet seal and overflow as next checks, says not to rely on air fresheners, and notes that a persistent sewage smell is a landlord repair."}
  - name: edge-rotten-eggs-kitchen
    vars:
      smell: "Rotten eggs near the cooker, comes and goes."
      home: "Gas hob and gas boiler."
    assert:
      - {type: llm-rubric, value: "Treats it as a possible gas leak first, giving the no switches, no flames, ventilate, leave and call the gas emergency line steps before any other cause, and only then mentions drains or food as alternatives once gas is ruled out."}
  - name: negative-just-mask-it
    vars:
      smell: "Ammonia smell in the hallway carpet where the cat peed."
      home: "I just want the strongest air freshener plus bleach on the carpet."
    assert:
      - {type: llm-rubric, value: "Steers away from masking and away from bleach on carpet, explains enzyme cleaners break down urine, says ammonia-based or bleach products can encourage re-marking and that bleach must never be mixed with ammonia, and suggests patch testing and a vet check if the cat keeps doing it."}
