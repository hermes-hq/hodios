schema: 1
baseline: "How do I clean my {{furniture}}? Problem: {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-s-code-armrests
    vars:
      furniture: "Linen-look sofa, label says S, covers zip off."
      problem: "Greasy dark armrests and a coffee spill."
    assert:
      - {type: contains, value: "## Fixing the problem"}
      - {type: llm-rubric, value: "Explains S means solvent-based only and not water, recommends a water-free upholstery solvent tested on a hidden area, blotting rather than rubbing, warns against machine washing the zip-off covers without checking the care label because of shrinkage and colour mismatch, and suggests a professional if marks remain."}
  - name: edge-no-label
    vars:
      furniture: "Second-hand velvet armchair, no label."
      problem: "Dusty and slightly musty."
    assert:
      - {type: llm-rubric, value: "Says the code is unknown and to look for a label, otherwise treats it as delicate, starts with vacuuming and brushing with the pile and airing, uses minimal moisture after a patch test, and avoids soaking."}
  - name: negative-steam-x-code
    vars:
      furniture: "Sofa with an X code label."
      problem: "Want to steam clean it with a carpet washer and lots of detergent."
    assert:
      - {type: llm-rubric, value: "Explains X means vacuum only, advises against steam or wet cleaning, suggests vacuuming and brushing, and recommends a professional upholstery cleaner for anything more."}
