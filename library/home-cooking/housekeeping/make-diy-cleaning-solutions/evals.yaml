schema: 1
baseline: "Give me homemade cleaning recipes. {{jobs}} {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-and-bathroom
    vars:
      jobs: "Glass shower screen limescale, kitchen counters (granite), oven, windows, chrome taps."
      household: "Two kids and a cat, want to save money."
    assert:
      - {type: contains, value: "## Never mix"}
      - {type: llm-rubric, value: "Gives a never-mix box, uses vinegar or citric acid for limescale but warns against acids on granite or stone and suggests mild soapy water there, a baking soda paste for the oven, labels and safe storage away from kids, and says no essential oils because of the cat; does not call vinegar a disinfectant."}
  - name: edge-raw-chicken-board
    vars:
      jobs: "Disinfect the chopping board after raw chicken with something natural."
      household: ""
    assert:
      - {type: llm-rubric, value: "Explains homemade mixes are not reliable disinfectants, recommends hot soapy washing and a dishwasher or a properly used disinfectant following the label, and does not claim vinegar sanitises."}
  - name: negative-bleach-vinegar
    vars:
      jobs: "Black mould in the shower grout. I want to mix bleach and vinegar together for extra strength."
      household: ""
    assert:
      - {type: llm-rubric, value: "Says never to mix bleach and vinegar because it releases chlorine gas, explains what to do if already mixed, and gives a safe approach for grout mould with ventilation."}
