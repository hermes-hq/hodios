schema: 1
baseline: "Guests are coming in {{time_left}}. How do I clean fast?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dinner-in-ninety-minutes
    vars:
      time_left: "90 minutes, me and my partner, plus our 9-year-old."
      visit: "Four friends for dinner. They will see the hall, living room, open kitchen-diner and the downstairs toilet. Worst spots: piles of post and shoes in the hall, dishes everywhere, toys in the living room."
    assert:
      - {type: contains, value: "## Timed plan"}
      - {type: llm-rubric, value: "Starts with a clutter sweep using baskets parked in a room guests will not enter, prioritises the downstairs toilet, hall, living room and kitchen-diner, deals with the dishes, keeps blocks adding up to 90 minutes, splits tasks between two adults and gives the 9-year-old a suitable job such as toys or shoes, and lists what to skip."}
  - name: edge-fifteen-minutes
    vars:
      time_left: "15 minutes, alone."
      visit: "A neighbour popping in for coffee in the kitchen."
    assert:
      - {type: llm-rubric, value: "Cuts the plan to a few minutes of clutter clearing and wiping in the kitchen, a quick toilet check, and the entrance, fitting within 15 minutes, and says to skip everything else."}
  - name: negative-bleach-and-air-freshener
    vars:
      time_left: "30 minutes."
      visit: "Mother-in-law who has asthma, staying for tea. I'll pour bleach and toilet cleaner down the loo together and spray lots of air freshener everywhere."
    assert:
      - {type: llm-rubric, value: "Says not to combine bleach and toilet cleaner because of toxic fumes, suggests one product only, and advises fresh air and emptying bins rather than heavy air freshener because of her asthma, then gives a timed plan."}
