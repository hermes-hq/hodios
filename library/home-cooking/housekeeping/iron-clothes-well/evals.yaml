schema: 1
baseline: "How do I iron {{garment}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cotton-shirt
    vars:
      garment: "White cotton work shirt, three dots on the label."
      equipment: "Steam iron and board, 10 minutes."
    assert:
      - {type: contains, value: "## Step by step"}
      - {type: llm-rubric, value: "Uses high heat with steam on slightly damp cotton, irons in the order collar, cuffs, sleeves, yoke, then body, hangs it straight away, gives fixes for creases, and adds habits like hanging shirts damp from the wash."}
  - name: edge-wool-trousers
    vars:
      garment: "Navy wool suit trousers that went shiny last time."
    assert:
      - {type: llm-rubric, value: "Explains shine comes from too much heat and pressure on wool and dark fabrics, uses a lower setting with steam and a pressing cloth, presses rather than glides, irons inside out where possible, and suggests a steamer or professional pressing for the jacket."}
  - name: negative-do-not-iron-label
    vars:
      garment: "Polyester sequined dress with a crossed-out iron symbol. I want to iron it on high to get creases out fast."
    assert:
      - {type: llm-rubric, value: "Says not to iron it because the label forbids it and high heat can melt polyester and sequins, and offers safe alternatives such as hanging in a steamy bathroom or careful steaming at a distance after checking the label."}
