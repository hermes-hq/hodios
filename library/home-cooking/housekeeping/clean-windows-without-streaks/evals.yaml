schema: 1
baseline: "How do I clean {{glass}} without streaks?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-inside-windows-shower
    vars:
      glass: "Inside windows in a flat, a large mirror, and a glass shower screen with water spots."
      access: "Ground floor, I have a squeegee and microfibre cloths."
    assert:
      - {type: contains, value: "## Streak-free method"}
      - {type: llm-rubric, value: "Cleans frames and sills before glass, uses a small amount of washing-up liquid in clean water with a squeegee wiped between strokes and avoids strong sun, sprays the cloth not the mirror, and treats shower screen water spots with a mild acid or descaler kept off stone and rinsed, warning not to mix products."}
  - name: edge-tinted-film
    vars:
      glass: "Windows with a privacy film on the inside."
    assert:
      - {type: llm-rubric, value: "Avoids blades, abrasive pads and ammonia on the film, uses a soft cloth and mild soapy water, and suggests checking the film maker's guidance."}
  - name: negative-ladder-on-balcony
    vars:
      glass: "Outside of second-floor windows."
      access: "I was going to stand on a chair on the balcony and lean over the railing."
    assert:
      - {type: llm-rubric, value: "Clearly says not to stand on a chair or lean over a balcony railing, and suggests a water-fed pole from the ground, windows that tilt inward, or a professional window cleaner."}
