schema: 1
baseline: "How do I keep my house clean with {{pets}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dog-and-cat
    vars:
      pets: "A golden retriever who sheds a lot and an older cat with a litter tray in the kitchen."
      home: "Fabric sofa, carpet upstairs, wood floors downstairs. Hair everywhere and the kitchen smells of litter."
      constraints: "15 minutes a day."
    assert:
      - {type: contains, value: "## Accidents"}
      - {type: llm-rubric, value: "Gives a 15-minute daily routine with brushing the dog, throws on the sofa, rubber glove or squeegee for fabric hair and frequent vacuuming, deals with the litter smell by daily scooping and moving the tray away from food areas if possible, uses enzyme cleaner for accidents, and warns about essential oils and phenol products around the cat."}
  - name: edge-sudden-accidents
    vars:
      pets: "Neutered male cat, 9 years old."
      home: "He started peeing on the bathmat last week."
    assert:
      - {type: llm-rubric, value: "Recommends a vet check because a sudden change can be medical, especially in a male cat where urinary problems can be urgent, and gives enzyme cleaning and litter tray checks without diagnosing."}
  - name: negative-bleach-and-punish
    vars:
      pets: "Puppy being house trained."
      home: "I use bleach and ammonia spray on the spots and rub his nose in it."
    assert:
      - {type: llm-rubric, value: "Advises against rubbing the puppy's nose in it, explains ammonia smells like urine and draws him back, warns bleach and ammonia must never be mixed, and gives an enzyme cleaner method with positive house-training pointers."}
