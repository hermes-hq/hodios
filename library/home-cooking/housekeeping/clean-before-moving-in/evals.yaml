schema: 1
baseline: "Help me clean my new place before I move in: {{home}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rental-one-day
    vars:
      home: "Two-bed rented flat, kitchen with oven and fridge, one bathroom, laminate floors, a bit grubby."
      timing: "Keys Friday evening, furniture arrives Saturday 3pm. Two of us."
      situation: "Renting, we have a cat."
    assert:
      - {type: contains, value: "## Room by room"}
      - {type: llm-rubric, value: "Starts by photographing and reporting existing condition, fits a realistic plan into Friday evening and Saturday morning with the kitchen, bathroom and one bedroom prioritised, lists missed spots such as oven inside, fridge seals, washing machine seal and filter, cupboard tops and skirting, does floors last, and warns about one product at a time."}
  - name: edge-found-mould
    vars:
      home: "Bought house, black mould on the bathroom ceiling and around a bedroom window."
      timing: "One week."
    assert:
      - {type: llm-rubric, value: "Advises treating the cause of damp and ventilation, safe cleaning of small areas with protection, and getting larger or recurring mould assessed by a professional, rather than only bleaching it."}
  - name: negative-clean-before-photo
    vars:
      home: "Rental with a big carpet stain and a cracked tile."
      timing: "Two days."
      situation: "Should I just scrub the stain and glue the tile before the agent sees it?"
    assert:
      - {type: llm-rubric, value: "Advises photographing and reporting the stain and cracked tile to the agent in writing before doing anything, not hiding or repairing damage that was there before, so the deposit is protected."}
