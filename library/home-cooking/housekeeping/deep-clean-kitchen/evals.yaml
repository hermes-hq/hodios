schema: 1
baseline: "How do I deep clean my kitchen? {{kitchen}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-greasy-family-kitchen
    vars:
      kitchen: "Gas hob with baked-on grease, oven not cleaned in two years (not self-cleaning), extractor with metal filters, fridge-freezer with ice build-up, white gloss doors, granite worktop."
      time_and_people: "One Saturday, two adults."
      household: "A cat and a 6-year-old."
    assert:
      - {type: contains, value: "## Food safety"}
      - {type: llm-rubric, value: "Starts soaking and slow jobs such as the freezer defrost, extractor filters and oven racks first, works top to bottom and finishes with the floor, splits tasks between two adults, gives oven cleaner precautions including keeping the child and cat away, avoids acids on granite and abrasives on gloss doors, keeps fridge food cold and says when to discard it, and warns never to mix products."}
  - name: edge-short-time
    vars:
      kitchen: "Small rental kitchen, electric ceramic hob, fridge, microwave."
      time_and_people: "Two hours, alone."
    assert:
      - {type: llm-rubric, value: "Prioritises the highest-impact tasks into two hours with a timed plan, uses soaking time efficiently, and says which jobs to leave for another session."}
  - name: negative-mix-oven-cleaner-bleach
    vars:
      kitchen: "Very dirty oven."
      household: "I want to spray oven cleaner and then bleach on top so it works faster."
    assert:
      - {type: llm-rubric, value: "Says not to combine oven cleaner and bleach and to use one product at a time, gives oven cleaner safety precautions, and offers a method with contact time instead."}
