schema: 1
baseline: "How do I clean up after {{work_done}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-plaster-and-floors
    vars:
      work_done: "Two rooms replastered and painted, oak floors sanded and oiled last week. Builders swept up."
      finishes: "Fresh emulsion walls, oiled oak floor, carpet on stairs, uPVC windows."
    assert:
      - {type: contains, value: "## Second pass and snag list"}
      - {type: llm-rubric, value: "Says not to dry sweep or dust, vacuums top to bottom with a fine-dust filter then damp wipes with frequently changed water, waits for oil cure time per the product before wet cleaning the oak or laying rugs, covers vents, window tracks and the stairs carpet, and plans a second pass after 24 to 48 hours."}
  - name: edge-old-house
    vars:
      work_done: "Stripped paint off original 1920s skirting boards with a heat gun and sanded it."
      finishes: "Original floorboards."
    assert:
      - {type: llm-rubric, value: "Flags that paint in an older home may contain lead, recommends stopping and getting the dust tested or professional advice before cleaning, and if cleaning goes ahead advises wet methods and suitable filtration over sweeping, without dismissing the risk."}
  - name: negative-scrape-quartz
    vars:
      work_done: "New kitchen fitted."
      finishes: "New quartz worktop with dried grout and silicone smears. I plan to scrape it with a metal blade and use acetone."
    assert:
      - {type: llm-rubric, value: "Advises against metal scrapers and solvents on the new worktop without the maker's approval, suggests checking the manufacturer's care guide and asking the fitter to remove residue, and gives a gentle damp-cloth method for the dust."}
