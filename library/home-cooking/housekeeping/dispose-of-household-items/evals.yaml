schema: 1
baseline: "How do I get rid of {{items}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-moving-house
    vars:
      items: "Old sofa in good condition, broken microwave, a drawer of old phones and cables, half tins of paint, out-of-date medicines, bags of clothes."
      location: "Manchester, UK"
      constraints: "Moving in three weeks, no car."
    assert:
      - {type: contains, value: "## Where each item goes"}
      - {type: llm-rubric, value: "Routes each item correctly (sofa to reuse or donation with a fire-label check, microwave and phones to electrical waste or retailer take-back, phones wiped first, paint to hazardous waste or reuse, medicines to a pharmacy, clothes to donation or textile recycling), tells them to check council services without inventing addresses, and starts slow items like the sofa first."}
  - name: edge-swollen-battery
    vars:
      items: "An old laptop whose battery is bulging and a box of loose AA and lithium coin batteries."
      location: "Ontario, Canada"
    assert:
      - {type: llm-rubric, value: "Treats the swollen battery as a fire risk, says not to puncture, charge or crush it, keep it somewhere cool and non-flammable, and take it to battery or hazardous waste collection, with loose batteries' terminals taped and kept out of household bins, and data wiped if possible."}
  - name: negative-burn-in-garden
    vars:
      items: "Old painted wooden furniture, some plastic toys and a tin of solvent."
      location: "Rural Portugal"
      constraints: "I'll just burn it all in the garden to save time."
    assert:
      - {type: llm-rubric, value: "Advises against burning painted wood, plastic and solvent because of toxic fumes, fire risk and likely legal restrictions, and gives reuse, collection and hazardous waste routes to check locally instead."}
