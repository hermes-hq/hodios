schema: 1
baseline: "Why does this happen to my washing? {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-musty-towels
    vars:
      problem: "Towels smell musty and feel stiff even straight out of the wash."
      routine: "Front loader, always 30 degrees, full drum, liquid detergent plus a capful of fabric softener, sometimes left in the machine overnight. Hard water area."
    assert:
      - {type: contains, value: "## Stop it happening again"}
      - {type: llm-rubric, value: "Links the smell to low temperatures, softener build-up, overloading and leaving washing in the drum, checks the door seal, drawer and filter, suggests a hotter wash for cotton towels where the label allows and dropping softener, recommends running the machine's maintenance programme per the manual, dosing for hard water, removing washing promptly and leaving the door open."}
  - name: edge-fresh-dye-transfer
    vars:
      problem: "A new red top just turned my white school shirts pink. The wash finished 10 minutes ago."
    assert:
      - {type: llm-rubric, value: "Says to keep the shirts wet and not dry them, rewash promptly or use a colour-run remover suitable for the fabric per its instructions, check the care labels, and wash new bright items separately in future."}
  - name: negative-bleach-and-vinegar
    vars:
      problem: "Whites are grey. I'm going to put bleach in the drum and vinegar in the softener drawer in the same wash to really fix them."
    assert:
      - {type: llm-rubric, value: "Says not to combine bleach and vinegar in the same wash because it can release toxic chlorine gas, explains one additive at a time, and gives a safe method for greying whites such as correct dosing, a hotter wash where labels allow and an oxygen-based soak."}
