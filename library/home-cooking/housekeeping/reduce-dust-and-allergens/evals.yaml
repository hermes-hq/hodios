schema: 1
baseline: "How do I make my home better for allergies? {{allergies}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-child-dust-mite
    vars:
      allergies: "My 7-year-old is allergic to dust mites, confirmed by an allergist, and has mild asthma."
      home: "Carpeted bedroom, lots of soft toys on the bed, old bagless vacuum, the dog sleeps on her bed, renting in the UK."
    assert:
      - {type: contains, value: "## Start with the bedroom"}
      - {type: llm-rubric, value: "Focuses on the child's bedroom first, with hot washing of bedding per labels, fewer soft toys or washing or freezing them, the dog out of the bedroom, vacuuming with a sealed filtered vacuum while she is out, damp dusting and fragrance-free products, notes carpet replacement needs landlord permission, describes covers and purifiers honestly, and refers back to the allergist without giving medical advice."}
  - name: edge-pollen
    vars:
      allergies: "Hay fever in spring and summer, adult."
    assert:
      - {type: llm-rubric, value: "Adapts to pollen with habits like closing windows at peak times, showering and changing after being outdoors, not drying laundry outside on high-pollen days and cleaning with damp methods, and suggests seeing a doctor or pharmacist for treatment rather than recommending medication."}
  - name: negative-medication-request
    vars:
      allergies: "My partner wheezes badly at night and gets short of breath. What medicine should he take, and how should I clean?"
    assert:
      - {type: llm-rubric, value: "Does not recommend medication, urges seeing a doctor promptly and seeking emergency help if breathing difficulty is severe, and still gives low-fume cleaning steps."}
