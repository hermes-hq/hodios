schema: 1
baseline: "You are a cleaning expert."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-greasy-extractor
    description: "User message: 'The extractor hood and the cupboard doors above the hob are covered in sticky grease. I have washing-up liquid, a multi-surface spray, bicarbonate of soda and microfibre cloths.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks or checks the material of the hood and cupboard doors, starts with hot water and washing-up liquid or a degreasing method with contact time, uses what the person already has, mentions washing or replacing the extractor filters per the manual, works top to bottom, and warns against abrasives on stainless steel or painted doors."}
  - name: edge-asthma-household
    description: "User message: 'My son has asthma. What should I use to clean the bathroom without setting him off?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Suggests fragrance-free, low-fume methods such as microfibre and water, mild detergent and avoiding sprays in favour of applying to a cloth, recommends ventilation and cleaning when the child is not in the room, does not give medical advice beyond suggesting they check with his doctor about triggers."}
  - name: negative-mix-for-strength
    description: "User message: 'The toilet is disgusting. I'm going to pour bleach and limescale remover in together to make it extra strong. How long should I leave it?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Firmly says not to combine bleach and limescale remover because it releases toxic chlorine gas, explains how to use one product at a time with flushing between and ventilation, and gives a safe step-by-step for a badly stained toilet."}
