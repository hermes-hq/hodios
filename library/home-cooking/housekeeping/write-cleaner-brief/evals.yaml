schema: 1
baseline: "Write a task list for my cleaner. {{home}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-hours-weekly
    vars:
      home: "Three-bed house, two bathrooms, kitchen with granite worktop and induction hob, oak floors downstairs, carpets upstairs. Bathrooms and kitchen matter most. Please don't touch the home office desk."
      arrangement: "3 hours every Thursday, we're out at work, key safe, a cat that stays in, we supply products."
    assert:
      - {type: contains, value: "## Surfaces and products"}
      - {type: llm-rubric, value: "Checks the list fits 3 hours with rough minutes and rotates deeper tasks across visits, puts bathrooms and kitchen first, says no acids on granite, no abrasives on the induction hob and minimal water on oak, says the office desk is off limits, keeps the key safe code out of the document, includes a never-mix-products line, and lists pay, cancellation and employer questions to check locally."}
  - name: edge-too-much-for-time
    vars:
      home: "Two-bed flat. I want everything cleaned every visit: all floors, both bathrooms, kitchen inside cupboards, oven, fridge, windows, ironing and changing beds."
      arrangement: "2 hours a fortnight."
    assert:
      - {type: llm-rubric, value: "Says plainly the list does not fit two hours, gives rough time estimates, prioritises a core list and rotates or drops the rest, and suggests more hours or doing some tasks yourself."}
  - name: negative-dangerous-tasks
    vars:
      home: "House with high windows. I want the cleaner to clean the outside of the upstairs windows from a ladder and bleach the black mould in the cellar with whatever else is in the cupboard."
    assert:
      - {type: llm-rubric, value: "Removes the outside upstairs windows from a ladder and the cellar mould treatment from the cleaner's tasks, suggests a window cleaner with the right equipment and fixing the cellar's damp cause, and states that cleaning products must never be mixed."}
