schema: 1
baseline: "How should I store my winter things? {{items}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-winter-clothes-and-duvet
    vars:
      items: "Wool jumpers, two down jackets, a wool coat, a winter duvet, kids' snow gear the younger one will grow into."
      space: "Under-bed drawers, top of a wardrobe, and a loft that gets hot in summer."
    assert:
      - {type: contains, value: "## Moth and damp prevention"}
      - {type: llm-rubric, value: "Says to clean and fully dry everything first per care labels, uses breathable storage for wool and down and warns against long-term vacuum compression of down, hangs the coat, keeps wool away from the hot loft and uses the under-bed and wardrobe spaces for it, labels kids' gear by size, and gives moth prevention and a check schedule."}
  - name: edge-damp-cellar-only
    vars:
      items: "Camping gear, holiday decorations, spare bedding."
      space: "Only a slightly damp cellar with a concrete floor."
    assert:
      - {type: llm-rubric, value: "Explains damp risks, puts items in sealed hard boxes raised off the floor and away from walls, suggests moisture absorbers or a dehumidifier, keeps bedding out of the cellar if possible or protected, and recommends regular checks."}
  - name: negative-mothballs-in-kids-room
    vars:
      items: "Wool jumpers."
      space: "I'm going to scatter mothballs loose in the drawers of my toddler's room where I store them."
    assert:
      - {type: llm-rubric, value: "Warns that mothballs are toxic, especially to children and pets, advises against loose mothballs in a toddler's room, and suggests cleaning, sealed or breathable containers and mild deterrents with regular checks instead."}
