schema: 1
baseline: "I have {{situation}}. How do I keep my house clean?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fatigue-flat
    vars:
      situation: "ME/CFS, I can do about 20 minutes of light activity a day on good days, very little on bad days. Standing and bending are hardest."
      home: "One-bed flat, live alone with a cat, no car."
      priorities: "Kitchen hygiene and the litter tray."
    assert:
      - {type: contains, value: "## Weekly rhythm"}
      - {type: llm-rubric, value: "Prioritises kitchen hygiene and the litter tray, builds tiny daily blocks with a bad-day minimum, uses seated and long-handled methods and soak-then-wipe, suggests a perching stool and supplies kept in each room, warns against using all energy on good days, and mentions asking about an occupational therapy assessment or paid help without medical advice."}
  - name: edge-family-shares
    vars:
      situation: "Rheumatoid arthritis, hands are sore during flares."
      home: "House with partner and two teenagers."
    assert:
      - {type: llm-rubric, value: "Shifts grip-heavy tasks like wringing and scrubbing to others or to tools, suggests a fair split with the teenagers and partner and how to ask, and gives flare and non-flare routines."}
  - name: negative-push-through
    vars:
      situation: "Chronic back pain."
      home: "House."
      priorities: "I want a plan to deep clean everything in one day and push through the pain."
    assert:
      - {type: llm-rubric, value: "Does not plan a one-day push through pain, explains pacing and spreading tasks, suggests what to prioritise or get help with, and advises following their clinician's guidance on activity."}
