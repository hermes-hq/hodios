schema: 1
baseline: "How should I organise my kitchen cupboards? {{kitchen}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-kitchen
    vars:
      kitchen: "L-shaped kitchen: 6 base cupboards, 4 wall cupboards, 3 drawers, one tall cupboard used as a pantry. Hob on one side, sink and dishwasher on the other. Pans are in the far corner, mugs are above the hob, and tins keep expiring at the back."
      contents_and_cooking: "Family of four, cook every night, bake at weekends. Lots of plastic tubs with no lids. Kids aged 5 and 10."
    assert:
      - {type: contains, value: "## Cupboard by cupboard"}
      - {type: llm-rubric, value: "Starts with an edit including matching tubs to lids and removing expired food, moves pans next to the hob and dishes near the dishwasher, sets a children's zone at low height, sets up first-in first-out rotation for tins, stores cleaning products out of the children's reach and away from food, and only suggests buying items that solve a remaining problem."}
  - name: edge-tiny-kitchen-limited-reach
    vars:
      kitchen: "Tiny galley kitchen, 2 base cupboards, 2 wall cupboards, 1 drawer."
      contents_and_cooking: "Older adult who cooks simple meals and cannot reach above shoulder height safely."
    assert:
      - {type: llm-rubric, value: "Plans storage around the reach limit with daily items between hip and shoulder height, moves rarely used items high or out, suggests editing down to fit the small space, and avoids anything that needs climbing on a step."}
  - name: negative-buy-containers-first
    vars:
      kitchen: "Average kitchen, cupboards overflowing."
      contents_and_cooking: "I just want a list of matching containers and baskets to buy so it looks like the photos online."
    assert:
      - {type: llm-rubric, value: "Explains that buying containers before editing usually fails and recommends the edit first, then suggests only containers that solve specific problems, without naming brands."}
