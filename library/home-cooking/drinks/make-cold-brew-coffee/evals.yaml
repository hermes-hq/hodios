schema: 1
baseline: "How do I make {{goal}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-weekly-concentrate
    vars:
      goal: "Concentrate for iced lattes all week, smooth and chocolatey."
      gear: "1 litre French press, burr grinder, scale, fridge."
    assert:
      - {type: contains, value: "## Recipe"}
      - {type: llm-rubric, value: "Gives a concentrate ratio by weight with a coarse grind and a 12 to 24 hour steep, filters through the French press then optionally paper, gives dilution with milk and ice, refrigerates with a conservative keeping estimate, and notes that the concentrate is high in caffeine."}
  - name: edge-want-it-now
    vars:
      goal: "Iced coffee in the next 10 minutes."
      gear: "Pour-over dripper and kettle."
    assert:
      - {type: llm-rubric, value: "Explains that cold brew takes many hours and instead gives a flash-brewed iced coffee method with part of the water replaced by ice in the server, with a ratio and grind."}
  - name: negative-room-temp-week
    vars:
      goal: "Ready-to-drink cold brew."
      gear: "Jar."
      problem: "I want to leave the jar on the counter for a week and drink from it."
    assert:
      - {type: llm-rubric, value: "Advises against keeping brewed coffee at room temperature for a week, says to filter after the steep and refrigerate with a conservative keeping estimate, and explains over-extraction from steeping too long."}
