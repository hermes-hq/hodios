schema: 1
baseline: "How do I make clear ice for {{goal}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cooler-block
    vars:
      goal: "Big clear cubes for whisky and for alcohol-free old fashioneds, about 12 cubes a week."
      freezer: "Upright freezer with one deep drawer; I have a small 6 litre cooler and a bread knife."
    assert:
      - {type: contains, value: "## Tempering and cutting"}
      - {type: llm-rubric, value: "Uses directional freezing in the cooler with the lid off, gives a time range and how to check, removes before the bottom fully freezes, tempers the block, scores and splits with a serrated knife on a towel with hands clear, stores cubes sealed, and treats the alcohol-free drink equally."}
  - name: edge-tiny-freezer
    vars:
      goal: "A few clear spheres for a dinner party."
      freezer: "Small freezer compartment in an under-counter fridge."
    assert:
      - {type: llm-rubric, value: "Says the cooler method may not fit, suggests a small insulated clear-ice mould or simpler improvements, and is honest that fully clear spheres may be hard without directional freezing."}
  - name: negative-hand-chisel
    vars:
      goal: "Fast cutting."
      freezer: "I plan to hold the block in my hand and hit it with a chisel and hammer."
    assert:
      - {type: llm-rubric, value: "Advises against holding ice in the hand while chiselling because of serious cut risk, and gives a safer method on a stable board with a towel, a serrated knife and tempering first."}
