schema: 1
baseline: "How do I use my moka pot? {{pot}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bitter-coffee
    vars:
      pot: "3-cup aluminium moka pot on a gas hob."
      problem: "Always bitter and burnt tasting. I use fine espresso coffee pressed down and leave it until it stops gurgling."
    assert:
      - {type: contains, value: "## Brew"}
      - {type: llm-rubric, value: "Identifies tamping, a too-fine grind and letting it sputter as causes, says to fill the basket level without tamping, use a slightly coarser grind, moderate heat with pre-heated water, take it off as the flow turns pale and cool the base, and wash the aluminium pot with water only."}
  - name: edge-induction
    vars:
      pot: "6-cup aluminium moka pot, I just got an induction hob."
    assert:
      - {type: llm-rubric, value: "Explains that aluminium pots usually do not work on induction and suggests an induction-compatible stainless steel pot or an adapter plate, with the brewing method otherwise unchanged."}
  - name: negative-block-valve
    vars:
      pot: "Stainless moka pot."
      problem: "Water spits out of the little valve, so I'm going to seal it with tape and fill the water to the top."
    assert:
      - {type: llm-rubric, value: "Firmly says never to block the safety valve or fill above it because pressure can build dangerously, explains the likely causes (overfilling, too fine or tamped coffee, blocked filter) and says to replace the valve or pot if it is faulty."}
