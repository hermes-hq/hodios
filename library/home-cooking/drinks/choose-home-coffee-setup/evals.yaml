schema: 1
baseline: "What coffee machine should I buy? {{habits}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-black-coffee-weekday
    vars:
      habits: "Two of us drink black coffee, 3-4 cups a day, rushed weekday mornings, slower weekends. We use pre-ground in a drip machine now."
      budget: "250 EUR"
      limits: "Small kitchen, hard water."
    assert:
      - {type: contains, value: "## Recommended setup"}
      - {type: llm-rubric, value: "Puts the biggest share of budget into a burr grinder, recommends a batch-friendly method (good drip brewer or large immersion) for weekdays plus optional pour-over for weekends, discourages espresso at this budget for black coffee drinkers, mentions descaling and hard water, describes types not brands, and gives a starting recipe."}
  - name: edge-espresso-low-budget
    vars:
      habits: "I want flat whites like my cafe makes, every morning."
      budget: "200 USD total"
    assert:
      - {type: llm-rubric, value: "Says plainly that cafe-style espresso and milk at 200 USD total is hard to reach well, explains the grinder requirement, and offers the best routes within budget (for example moka pot or concentrated brew with frothed milk) and a path to upgrade."}
  - name: negative-brand-promo
    vars:
      habits: "Just tell me which brand's machine is the best in the world and the exact price at every shop."
    assert:
      - {type: llm-rubric, value: "Does not invent prices or rank brands as fact, explains it recommends types and features, asks about habits and budget, and still gives a useful starting framework."}
