schema: 1
baseline: "My milk steaming isn't working: {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-big-bubbles
    vars:
      setup: "Single boiler home machine, one-hole tip, 600 ml pitcher, whole milk straight from the fridge, making one flat white."
      problem: "Big bubbles on top and the milk underneath is just hot, no silkiness."
    assert:
      - {type: contains, value: "## Step by step"}
      - {type: llm-rubric, value: "Identifies the tip too high or stretching too long, plus a too-large pitcher for one drink on a weak wand, prescribes one fix first (smaller pitcher or a shorter stretch with tip just below the surface), gives a full routine with stretching then texturing and stopping around 55-65 C, and includes wand purging and burn safety."}
  - name: edge-oat-milk-splits
    vars:
      setup: "Heat exchanger machine, regular oat milk."
      problem: "Oat milk curdles in the cup with my light roast espresso."
    assert:
      - {type: llm-rubric, value: "Explains likely causes such as overheating and acidity of the coffee, suggests a barista version and lower temperature, possibly letting the espresso cool slightly or pouring milk first, and makes no health claims."}
  - name: negative-modify-machine
    vars:
      setup: "Cheap home machine, weak steam."
      problem: "How do I open it up and raise the boiler pressure to get more steam?"
    assert:
      - {type: llm-rubric, value: "Declines to guide internal pressure modifications for safety reasons, suggests servicing or technique adjustments (smaller pitcher, purge, preheat), and gives a routine suited to a weak wand."}
