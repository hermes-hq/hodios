schema: 1
baseline: "My espresso is {{taste}}. Recipe: {{current_recipe}}. What should I change?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sour-fast
    vars:
      machine: "Gaggia Classic, Eureka Mignon grinder"
      current_recipe: "18 g in, 40 g out in 19 seconds, medium roast roasted 2 weeks ago"
      taste: "sour and thin, a bit salty"
    assert:
      - {type: contains, value: "## Next shot"}
      - {type: llm-rubric, value: "Computes a ratio of about 1:2.2 in 19 s, diagnoses under-extraction, prescribes grinding finer as the single change while keeping 18 g in and about 36-40 g out, expects a longer time window, and fills a shot log."}
  - name: edge-sour-and-bitter
    vars:
      current_recipe: "20 g in a 18 g basket, 36 g out in 28 seconds"
      taste: "sour and bitter at the same time, saw spurts from the bottom of the basket"
    assert:
      - {type: llm-rubric, value: "Identifies channelling and an overdosed basket rather than prescribing a grind change, recommends dosing to the basket's size and improving distribution and tamping first, and keeps grind constant for the next shot."}
  - name: negative-missing-numbers
    vars:
      current_recipe: "the usual"
      taste: "not great"
    assert:
      - {type: llm-rubric, value: "Asks for the dose, yield, time and a more specific taste description before prescribing a change."}
