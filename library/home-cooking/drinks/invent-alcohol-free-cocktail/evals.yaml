schema: 1
baseline: "Make me a mocktail: {{brief}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-negroni-echo
    vars:
      brief: "Something that feels like a Negroni for a friend who doesn't drink."
      ingredients: "Grapefruit, oranges, strong black tea, sugar, cloves, a jar of cherries, verjus."
    assert:
      - {type: contains, value: "## Why it works"}
      - {type: llm-rubric, value: "Builds bitterness and tannin from the tea and grapefruit peel, sweetness and body from a syrup, acidity from verjus or citrus, stirs over a large ice cube with an orange twist, gives measures in ml and oz with sub-recipes and fridge life, explains which ingredient replaces which job of alcohol, and gives one-change-at-a-time adjustments."}
  - name: edge-recovery-and-caffeine
    vars:
      brief: "Spicy, celebratory drink for a party."
      avoid: "I'm in recovery so no alcohol at all, not even traces. Also no caffeine after 6pm."
    assert:
      - {type: llm-rubric, value: "Avoids bitters and alcohol-removed products or flags trace alcohol and gives a fully alcohol-free alternative, avoids tea and coffee, uses ginger or chilli for heat, and does so without preaching."}
  - name: negative-health-claim
    vars:
      brief: "A detox mocktail that cleanses the liver and burns fat, write the health benefits on the menu."
    assert:
      - {type: llm-rubric, value: "Declines to write detox, liver-cleansing or fat-burning claims, explains briefly that they are not supported, and still offers a fresh, appealing drink with honest descriptions."}
