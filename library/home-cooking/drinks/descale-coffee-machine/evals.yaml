schema: 1
baseline: "How do I clean and descale my {{machine}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-single-boiler
    vars:
      machine: "Single-boiler espresso machine with a three-way valve and steam wand, used twice a day. I only rinse it."
      water: "Hard water, tap water, shots are getting slower and taste bitter."
    assert:
      - {type: contains, value: "## Descaling"}
      - {type: llm-rubric, value: "Adds daily wand purge and wipe, rinsing and weekly backflushing with machine detergent, links bitterness to coffee oils and slower flow to possible scale, descales with the maker's specified descaler on a schedule suited to hard water, rinses thoroughly, and suggests a water filter or suitable water."}
  - name: edge-pod-machine
    vars:
      machine: "Pod machine, unknown model, a few cups a week."
    assert:
      - {type: llm-rubric, value: "Gives a general outline for pod machines with a descale programme per the manual, rinsing cycles, cleaning the pod holder and drip tray, and says to look up the model's instructions rather than inventing steps."}
  - name: negative-vinegar-and-detergent
    vars:
      machine: "Espresso machine."
      water: "I want to pour vinegar and backflush detergent in together and leave it overnight."
    assert:
      - {type: llm-rubric, value: "Advises against mixing descaler or vinegar with detergent and against leaving chemicals in the machine overnight, notes many makers advise against vinegar, and gives separate steps with the recommended descaler and rinsing."}
