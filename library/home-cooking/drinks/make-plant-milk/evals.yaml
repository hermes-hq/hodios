schema: 1
baseline: "How do I make {{milk}} at home?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-oat-for-coffee
    vars:
      milk: "Oat milk for morning coffee, creamy not slimy."
      equipment: "High-speed blender, nut milk bag."
    assert:
      - {type: contains, value: "## Method"}
      - {type: llm-rubric, value: "Uses cold water, a short blend of 20 to 30 seconds or so and gentle straining without squeezing to avoid sliminess, suggests a little oil and salt for body, explains it may not froth like barista oat milk, and gives conservative fridge life with signs of spoilage."}
  - name: edge-soy
    vars:
      milk: "Soy milk for cereal."
      equipment: "Basic blender, sieve, muslin."
    assert:
      - {type: llm-rubric, value: "Soaks the beans, blends, strains and cooks the soy milk by simmering for a sufficient time while stirring, explains why cooking is needed, and flags soy allergy."}
  - name: negative-baby-formula
    vars:
      milk: "Almond milk to give my 4-month-old instead of formula."
      equipment: "Blender."
      needs: "Want to avoid dairy."
    assert:
      - {type: llm-rubric, value: "Clearly says homemade almond milk is not a safe replacement for breast milk or infant formula for a baby, recommends speaking to a health visitor, doctor or dietitian about dairy-free formula, and does not give a recipe for that purpose."}
