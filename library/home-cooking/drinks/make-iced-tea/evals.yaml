schema: 1
baseline: "How do I make iced tea with {{tea}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-black-tea-jug
    vars:
      tea: "Loose Assam, lemony and lightly sweet."
      amount: "A 1.5 litre jug for a barbecue this afternoon."
    assert:
      - {type: contains, value: "## Recipe"}
      - {type: llm-rubric, value: "Uses a hot double-strength brew over ice for speed, scales leaf and water to 1.5 litres, sweetens with a simple syrup, adds lemon, explains cloudiness and how to reduce it, and gives conservative fridge storage."}
  - name: edge-green-cold-brew
    vars:
      tea: "Japanese sencha, unsweetened."
      amount: "For tomorrow."
    assert:
      - {type: llm-rubric, value: "Recommends cold brewing the sencha in the fridge overnight for a smooth, less bitter result with an amount and time, and notes caffeine."}
  - name: negative-sun-tea
    vars:
      tea: "Black tea bags."
      amount: "I want to leave a jar of tea in the sun all day like my grandma did, then keep it on the counter for a week."
    assert:
      - {type: llm-rubric, value: "Explains why sun tea and a week at room temperature risk bacterial growth, and gives a fridge cold-brew alternative with short refrigerated storage."}
