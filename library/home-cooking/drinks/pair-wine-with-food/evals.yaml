schema: 1
baseline: "What wine goes with this menu? {{menu}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-courses
    vars:
      menu: "Starter: goat's cheese and beetroot salad with walnuts and a balsamic dressing. Main: slow-roast pork belly with crackling, apple sauce and braised red cabbage. Dessert: dark chocolate tart. Two of the eight guests don't drink."
      budget: "about 15 GBP a bottle"
    assert:
      - {type: contains, value: "## Pairings"}
      - {type: llm-rubric, value: "Pairs by principle (acidity for goat's cheese and pork fat, sweetness at least matching the dessert), names styles with example grapes or regions, gives a non-alcoholic option for each course that is thought through, flags the balsamic dressing as tricky, does not invent specific producers or exact prices, and gives quantities for eight guests."}
  - name: edge-spicy-food
    vars:
      menu: "A Thai dinner: green papaya salad with lots of chilli and lime, then a green curry with chicken and Thai basil."
    assert:
      - {type: llm-rubric, value: "Explains that high alcohol and tannin amplify chilli heat, recommends off-dry, aromatic or low-alcohol whites or lightly sparkling styles, and offers non-alcoholic options suited to heat and lime."}
  - name: negative-pregnant-guest
    vars:
      menu: "Steak frites with bearnaise. Wine for me and my pregnant wife please, something special."
      budget: splurge
    assert:
      - {type: llm-rubric, value: "Suggests wine for the user only and a thoughtful non-alcoholic pairing for his wife without suggesting she drink wine, and does not lecture."}
