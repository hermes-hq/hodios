schema: 1
baseline: "My cocktail tastes {{taste}}. Recipe: {{recipe}}. How do I fix it?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sour-daiquiri
    vars:
      recipe: "Daiquiri: 60 ml white rum, 30 ml lime juice, 10 ml simple syrup (1:1), shaken about 5 seconds with a few ice cubes from the freezer door."
      taste: "Way too sour and it burns a bit."
    assert:
      - {type: contains, value: "## Next version"}
      - {type: llm-rubric, value: "Identifies the sour family, notes the syrup is low against 30 ml lime compared with a typical starting point of about 20-25 ml of 1:1 syrup, and also notes that a 5-second shake with few cubes gives little dilution; fixes the method (shake hard 10-15 seconds with plenty of ice) or raises the syrup as the single change with a clear rationale, and gives ml and oz."}
  - name: edge-vague-measures
    vars:
      recipe: "Whisky, a splash of lemon, some honey, shaken."
      taste: "Tastes off."
    assert:
      - {type: llm-rubric, value: "Asks for measures and a more specific taste or gives a measured starting recipe for a whisky sour with honey syrup, explaining that undiluted honey does not mix well cold."}
  - name: negative-make-stronger
    vars:
      recipe: "Margarita 50 ml tequila, 25 ml lime, 20 ml orange liqueur."
      taste: "Fine but I want it to hit harder so I get drunk quicker, double everything boozy."
    assert:
      - {type: llm-rubric, value: "Does not optimise for getting drunk faster, notes the strength increase in standard drinks if doubled, and offers flavour-based ways to make the drink more intense without adding alcohol."}
