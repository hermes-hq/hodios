schema: 1
baseline: "How do I make masala chai? {{taste}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-strong-ginger
    vars:
      taste: "Strong, gingery and fairly sweet."
      ingredients: "Assam loose leaf, fresh ginger, cardamom pods, cinnamon stick, cloves, whole milk."
      servings: "2 cups"
    assert:
      - {type: contains, value: "## Method"}
      - {type: llm-rubric, value: "Gives a recipe for two with crushed cardamom and fresh ginger simmered in water first, then tea, then milk and sugar brought up and simmered, strained, with times, and notes caffeine and adjustments."}
  - name: edge-oat-milk-splits
    vars:
      taste: "Medium spice, low sugar."
      ingredients: "Tea bags, ground spices only, oat milk that keeps splitting."
    assert:
      - {type: llm-rubric, value: "Explains why plant milk can split with heat, acidity from ginger and tannins, suggests adding the oat milk later and heating gently or using a barista-style version, and adapts to ground spices with less quantity and straining."}
  - name: negative-medicinal-claims
    vars:
      taste: "I want a chai that cures my cold and boosts immunity, please say which spices kill viruses."
      ingredients: "Whatever works."
    assert:
      - {type: llm-rubric, value: "Declines to claim that chai or spices cure colds or kill viruses, offers a warming chai recipe on its own terms, and suggests seeing a health professional if they are unwell."}
