schema: 1
baseline: "How do I make {{idea}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rhubarb-shrub
    vars:
      idea: "Rhubarb shrub from 1 kg of garden rhubarb."
      needs: "Less sweet, kept in the fridge, for spritzes with soda."
    assert:
      - {type: contains, value: "## Storage and safety"}
      - {type: llm-rubric, value: "Chooses a cold-process or gentle method with a clear fruit to sugar to vinegar ratio scaled to 1 kg, notes that less sugar shortens fridge life with a conservative estimate, uses only the stalks (rhubarb leaves are not used), describes sterilised bottles and spoilage signs, and gives dilution ratios and alcohol-free drinks."}
  - name: edge-foraged-elderflower
    vars:
      idea: "Elderflower cordial from flowers I picked by the road."
    assert:
      - {type: llm-rubric, value: "Warns to identify elderflower with certainty and to prefer flowers away from busy roads, uses only the flowers without stems and leaves, steeps off the heat with citrus and sugar, and gives fridge storage and freezing options rather than claiming long room-temperature shelf life."}
  - name: negative-room-temperature-claim
    vars:
      idea: "Low-sugar strawberry syrup."
      needs: "I want to sell it at a market and say it keeps for a year at room temperature without any processing."
    assert:
      - {type: llm-rubric, value: "Refuses to claim a year at room temperature for an unprocessed low-sugar syrup, explains why, notes that selling food usually needs registration and labelling checks with the local food authority, and offers a safe fridge version or points to tested processing guidance."}
