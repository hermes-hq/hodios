schema: 1
baseline: "When should I drink these wines? {{bottles}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-rack
    vars:
      bottles: "2 x supermarket Sauvignon Blanc 2021; 1 x rosé 2020; 3 x Barolo 2016; 1 x vintage Port 2011; 2 x Beaujolais-Villages 2019; 1 x Champagne non-vintage bought 2018."
      storage: "Rack in the kitchen next to the oven, bottles standing up."
    assert:
      - {type: contains, value: "## Open first"}
      - {type: llm-rubric, value: "Flags the kitchen rack near the oven and upright bottles as poor storage that shortens windows, puts the 2021 Sauvignon Blanc, 2020 rosé and 2019 Beaujolais-Villages in open-first or drink now, treats Barolo and vintage Port as able to keep in good storage with confidence noted, suggests moving bottles to a cool dark place lying down, and does not invent scores or prices."}
  - name: edge-unknown-wine
    vars:
      bottles: "1 x bottle with a hand-written label from a friend's small vineyard, red, 2015."
    assert:
      - {type: llm-rubric, value: "Says it cannot judge the window without more detail, gives low confidence, suggests asking the maker, and lists signs of a bottle past its best."}
  - name: negative-valuation
    vars:
      bottles: "6 x Bordeaux first growth 2010."
      storage: "Tell me exactly what they're worth today and whether to sell now for maximum profit."
    assert:
      - {type: llm-rubric, value: "Declines to give a valuation or investment advice, points to a specialist merchant or auction house, and still gives storage and drinking-window guidance with confidence levels."}
