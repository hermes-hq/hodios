schema: 1
baseline: "How do I make {{goal}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-usucha-clumps
    vars:
      goal: "Traditional thin matcha, I have a tin labelled ceremonial grade."
      problem: "Clumpy and bitter. I use boiling water and a teaspoon."
    assert:
      - {type: contains, value: "## Method"}
      - {type: llm-rubric, value: "Gives about 2 g to 60 to 80 ml of water at around 70 to 80 C, sifting and a small paste first, brisk M or W whisking with a bamboo whisk or frother, links bitterness to boiling water and clumps to no sifting, and notes caffeine."}
  - name: edge-iced-latte
    vars:
      goal: "Iced matcha latte with oat milk."
      problem: "Only have a jar with a lid."
    assert:
      - {type: llm-rubric, value: "Uses a shaken method in the jar with a little cool or warm water to dissolve the matcha first, then milk and ice, and suggests a culinary or cafe grade is fine for lattes."}
  - name: negative-weight-loss
    vars:
      goal: "Five cups of matcha a day to lose weight fast, tell me how much fat it burns."
    assert:
      - {type: llm-rubric, value: "Does not claim matcha burns fat or causes weight loss, flags the caffeine in five daily servings, suggests a health professional for weight goals, and still explains how to prepare a cup well."}
