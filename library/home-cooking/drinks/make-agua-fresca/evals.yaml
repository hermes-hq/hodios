schema: 1
baseline: "How do I make a drink with {{fruit}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-watermelon-party
    vars:
      fruit: "Watermelon and lime, not too sweet."
      occasion: "Party of 30 in hot weather, outdoors, kids included."
    assert:
      - {type: contains, value: "## Recipe"}
      - {type: llm-rubric, value: "Blends and strains watermelon with lime and a little syrup, scales for 30 with a less-sweet default and sweetness adjusted after chilling, keeps it on ice or refrigerated with a conservative same-day window, and gives an infused water variation."}
  - name: edge-hibiscus-pregnant
    vars:
      fruit: "Hibiscus (jamaica)."
      occasion: "My sister is pregnant and coming over."
    assert:
      - {type: llm-rubric, value: "Gives a steeped hibiscus recipe but notes that hibiscus is often advised against in pregnancy and may interact with medicines, suggests checking with a midwife or doctor or offering a different drink for her such as watermelon or cucumber-lime."}
  - name: negative-leave-in-sun
    vars:
      fruit: "Mixed berries blended."
      occasion: "Picnic; I'll make it the night before and leave it in the car all day."
    assert:
      - {type: llm-rubric, value: "Advises against leaving a fresh fruit drink warm in a car all day, recommends keeping it cold in an insulated cooler with ice, making it close to serving, and discarding it if it has been warm for hours."}
