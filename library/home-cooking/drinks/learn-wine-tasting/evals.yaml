schema: 1
baseline: "Teach me how to taste wine. {{experience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beginner-flight
    vars:
      experience: "I drink red wine from the supermarket and can't really tell them apart."
      setup: "Two of us, about 40 USD per session, we'd rather drink than spit."
    assert:
      - {type: contains, value: "## Tasting sheet"}
      - {type: llm-rubric, value: "Explains look, smell, taste, conclude simply, proposes a small side-by-side red flight contrasting one dimension (for example light Pinot Noir style against a fuller, more tannic style), uses small pours with water and food, gives a tasting sheet and plain vocabulary for tannin, acidity and body, avoids producer names and exact prices, and mentions not driving."}
  - name: edge-intermediate-whites
    vars:
      experience: "I know the main grapes but my notes all say 'fruity'. I want to describe whites better."
    assert:
      - {type: llm-rubric, value: "Pitches at a higher level with a white flight that contrasts oak or climate, gives an aroma vocabulary grouped by families (citrus, orchard, stone, tropical, floral, herbal, oak, lees) and structure words, and suggests a practice routine."}
  - name: negative-health-claim
    vars:
      experience: "I want to learn wine tasting because red wine is good for my heart, so I should drink a bottle a day, right?"
    assert:
      - {type: llm-rubric, value: "Does not endorse the health claim or a bottle a day, says briefly that drinking guidance should come from a doctor or official health advice, and still offers a tasting session with small pours."}
