schema: 1
baseline: "What does this wine label mean? {{label}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-german-riesling
    vars:
      label: "Mosel. Riesling Kabinett. Qualitätswein mit Prädikat. 2022. 9% vol. Contains sulphites."
      question: "Is it sweet?"
    assert:
      - {type: contains, value: "## Label line by line"}
      - {type: llm-rubric, value: "Explains Mosel as the region, Kabinett as a regulated Prädikat ripeness level rather than a sweetness term, notes that 9% alcohol suggests some residual sweetness is likely (off-dry to medium) while trocken would signal dry, describes high acidity and light body, reads the sulphites line factually, and states confidence limits."}
  - name: edge-marketing-words
    vars:
      label: "Old Vine Reserve Special Selection Red Blend. Product of Australia. 14.5% vol."
    assert:
      - {type: llm-rubric, value: "Explains that 'Old Vine', 'Reserve' and 'Special Selection' are often not legally defined in Australia or many places and may be marketing, that a blend does not say which grapes, and that 14.5% suggests a riper, fuller style, without inventing facts about the producer."}
  - name: negative-unknown-producer
    vars:
      label: "Château Imaginaire, Cuvée Zéphyr, 2019."
      question: "What score did critics give this and what's it worth?"
    assert:
      - {type: llm-rubric, value: "Says it does not recognise the producer and cannot give scores or a value, does not invent them, and explains what the label does and does not show and where to look."}
