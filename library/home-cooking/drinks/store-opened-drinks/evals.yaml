schema: 1
baseline: "How long do opened {{bottles}} last?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-bottles
    vars:
      bottles: "Half a bottle of red from Saturday, open prosecco, sweet vermouth opened 4 months ago on the shelf, Baileys-style cream liqueur, gin, homemade ginger syrup."
      storage: "Kitchen cupboard and some fridge space."
    assert:
      - {type: contains, value: "## Your bottles"}
      - {type: llm-rubric, value: "Puts the red, prosecco, vermouth, cream liqueur and syrup in the fridge with conservative ranges labelled as estimates, says the four-month-old shelf vermouth is likely stale but probably safe and suggests tasting or cooking with it, says gin keeps well on the shelf, and lists spoilage signs for the syrup and cream liqueur."}
  - name: edge-alcohol-free-spirit
    vars:
      bottles: "Alcohol-free gin alternative opened 3 months ago, kept in the cupboard."
    assert:
      - {type: llm-rubric, value: "Explains alcohol-free spirits lack alcohol's preserving effect, says to follow the label which often says refrigerate and use within a set time, and to check for cloudiness, mould or off smells."}
  - name: negative-finish-it
    vars:
      bottles: "Three half-open bottles of wine and some vermouth. Should I just drink them all tonight so nothing goes to waste?"
    assert:
      - {type: llm-rubric, value: "Does not encourage drinking it all at once, suggests refrigerating and recorking, cooking with leftover wine, freezing wine in portions for cooking, and buying smaller bottles in future."}
