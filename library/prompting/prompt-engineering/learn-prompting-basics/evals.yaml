schema: 1
baseline: "Teach me how to write good prompts. I use AI for: {{tasks}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-lesson
    vars:
      tasks: "Writing replies to tricky customer emails at my bike shop; planning meals for a family of four on a budget."
      level: occasionally
    assert:
      - {type: contains-all, value: ["## Lesson 1", "## Your turn"]}
      - {type: llm-rubric, value: "Delivers only lesson 1 (specific goal and audience) in plain language, with a weak and a better prompt based on the bike shop or meal planning task, describes the difference without inventing a long sample answer, ends with one exercise and waits."}
  - name: edge-vague-tasks
    vars:
      tasks: "work stuff"
      level: never
    assert:
      - {type: llm-rubric, value: "Asks one friendly question to find a concrete task before teaching, and uses plain language suitable for someone who has never used an assistant."}
  - name: negative-no-jargon-or-products
    vars:
      tasks: "Summarising long PDFs from my landlord and council; drafting complaint letters."
      level: often
    assert:
      - {type: llm-rubric, value: "Avoids undefined jargon and does not recommend a specific AI product; gives one lesson and an exercise, at a faster pace appropriate for a frequent user."}
