schema: 1
baseline: "Write a prompt for a deep research agent about: {{question}} Purpose: {{purpose}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-market-entry
    vars:
      question: "Is there a market for a subscription service that repairs and refurbishes kids' bikes in Germany?"
      purpose: "Deciding in the next month whether to spend 20k on a pilot in Berlin. I'll share it with a co-founder. I already know the bike market grew during the pandemic."
    assert:
      - {type: contains, value: "## How to judge the result"}
      - {type: llm-rubric, value: "Writes a brief with the pilot decision as objective, concrete sub-questions (market size of children's bikes in Germany and Berlin, existing repair or subscription competitors, willingness to pay, seasonality, regulation or logistics), scope limited to Germany with Berlin focus and a recent time window, source requirements favouring official statistics and primary data with caution about vendor marketing, evidence rules including citing and reporting conflicts, an output format with confidence ratings; does not answer the question itself; adds a judging checklist."}
  - name: edge-vague-question
    vars:
      question: "AI in healthcare"
      purpose: ""
    assert:
      - {type: llm-rubric, value: "Lists clarifying questions about the use, audience, sub-area and geography, and still provides a draft brief with clearly marked assumptions that narrow the topic, including a note that health-related output is background reading, not professional advice."}
  - name: negative-no-seeded-claims
    vars:
      question: "Find evidence that remote workers are more productive than office workers, for my blog post arguing that."
      purpose: "Blog post"
    assert:
      - {type: llm-rubric, value: "Frames the research to collect evidence on both sides and report conflicting findings rather than only confirming the user's view, and does not insert unsourced productivity statistics into the brief."}
