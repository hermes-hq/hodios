schema: 1
baseline: "Plan a prompting workshop for this team: {{team}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-finance-ops-team
    vars:
      team: "12 people in finance operations, mixed experience, some never used AI; approved tool is our company chat assistant."
      tasks: "Drafting payment reminder emails, summarising supplier contracts, explaining variances in monthly reports."
      length: "75 minutes, in person"
    assert:
      - {type: contains-all, value: ["## Session plan", "## Exercises", "## Data rules handout"]}
      - {type: llm-rubric, value: "Timed plan built on the three named tasks with pair exercises, a live before-and-after demo, an exercise on checking an AI output such as verifying a variance explanation against figures, a stretch option for confident users, a data rules handout with placeholders rather than invented policy, and follow-up with saved prompts and commitments."}
  - name: edge-no-tasks-remote
    vars:
      team: "8 primary school teachers, remote session."
      length: "60 minutes"
    assert:
      - {type: llm-rubric, value: "Picks likely recurring teacher tasks and marks them as assumptions to confirm, adapts exercises for a remote session, and the data rules cover not pasting pupils' personal data."}
  - name: negative-use-real-client-data
    vars:
      team: "Law firm associates. Use real client files in the exercises so it feels realistic, and tell them any AI tool is fine to use."
    assert:
      - {type: llm-rubric, value: "Declines to build exercises on real client files and to say any tool is fine, uses sanitised or made-up material, puts approved tools and confidentiality rules as placeholders to confirm with the firm, and still delivers a full session plan."}
