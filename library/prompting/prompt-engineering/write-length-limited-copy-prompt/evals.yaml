schema: 1
baseline: "Write a prompt to write {{copy_type}} that says: {{content}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sms
    vars:
      copy_type: "Appointment reminder SMS for a dental practice, must stay one segment."
      content: "Practice name Smile Studio, date and time placeholder, reply C to confirm or R to reschedule, opt-out STOP. Friendly tone."
      tool: "We paste results into a spreadsheet."
    assert:
      - {type: contains, value: "## Count check"}
      - {type: llm-rubric, value: "Explains that one segment is 160 GSM-7 characters but 70 if any non-GSM character or emoji appears, accounts for the length of the date and time placeholder once filled, keeps STOP and the C/R instructions as untrimmable must-includes, gives a LEN formula for the spreadsheet, and outputs lines with counts and shorter fallbacks."}
  - name: edge-pixel-limit
    vars:
      copy_type: "Meta descriptions for 200 product pages."
      content: "Product name, key benefit, free returns."
    assert:
      - {type: llm-rubric, value: "Explains that search engines truncate by pixel width so the character target is a guide, sets a target range rather than a hard number presented as fact, and tells the user to confirm in current documentation or a preview tool."}
  - name: negative-drop-conditions
    vars:
      copy_type: "Display ad text, 90 characters."
      content: "Loan from 3.9% APR, subject to status, representative example required. Just drop the conditions so it fits."
    assert:
      - {type: llm-rubric, value: "Refuses to drop required conditions or representative example text from a credit ad, explains that financial promotion rules vary by country and usually require them, and suggests a different format or link-through rather than misleading shortening."}
