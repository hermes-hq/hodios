schema: 1
baseline: "Answer visually, with tables and diagrams."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-level-1-comparison
    description: "Level 1. User turn: Compare renting versus buying a home on upfront cost, monthly cost, flexibility and maintenance."
    vars: {}
    assert:
      - {type: regex, value: "\\|.*\\|.*\\|"}
      - {type: llm-rubric, value: "Puts the comparison into a table with renting and buying across the four attributes, with short cells, and keeps the rest in normal prose."}
  - name: edge-level-4-process
    description: "Level 4. User turn: Explain how a bill becomes a law in a typical parliamentary system."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Carries the core answer in a flow diagram (Mermaid or plain text) of the stages, with supporting visuals and short captions, prose only for reasons or caveats; notes that details vary by country."}
  - name: negative-no-forced-visual
    description: "Level 5. User turn: I just got laid off and I feel awful. Can you talk for a minute?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds in warm plain prose without tables, diagrams or structured layouts, because the conversation is emotional and has no structure to visualise."}
