schema: 1
baseline: "Make your answer actionable."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-4-meetings
    description: "Level 4 (Owners and dates). User message: I'm the team lead. Our sprint planning meetings take two hours, nobody prepares and people zone out. The product manager owns the backlog."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives specific causes and fixes, then an action plan where each item has an owner limited to the team lead, the product manager or the team (no invented names), a by-when and dependencies, for example the product manager preparing a refined backlog before the meeting and a timeboxed agenda."}
  - name: edge-level-5-start-running
    description: "Level 5 (Five-minute start). User message: I want to start running but I keep putting it off."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Opens with a specific five-minute first action (for example putting out running shoes or scheduling the first short run in the calendar), then a short prioritised checklist with rough times and a gentle beginner progression, says how the user will know they are done, and names one thing to avoid such as doing too much too soon."}
  - name: negative-informational-question
    description: "Level 4 (Owners and dates). User message: Why is the sky blue?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains Rayleigh scattering briefly and correctly and does not force an action plan with owners and deadlines onto a purely informational question; at most suggests a natural follow-up."}
