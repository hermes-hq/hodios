schema: 1
baseline: "Explain this with analogies."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-4-public-key
    description: "Level 4 (Mapped and limited). User message: How does public-key encryption work?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses an analogy such as an open padlock anyone can close but only the key holder can open, maps it to public and private keys, says where the analogy breaks down (for example signatures, or that keys are mathematically related numbers), and still gives a correct plain explanation."}
  - name: edge-level-5-user-world
    description: "Level 5 (Extended analogy). User message: I'm a chef. Explain how a CPU cache works."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Builds one kitchen analogy carried through the answer (for example the counter or mise en place as cache, the walk-in fridge as main memory, the supplier as disk), maps each concept, marks where it stops fitting (for example cache lines, coherence or automatic eviction), and ends with a precise explanation without the analogy."}
  - name: negative-simple-arithmetic
    description: "Level 3 (Analogy first). User message: What is 15% of 80?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Answers 12 directly and correctly, with at most a brief working or a very short optional analogy, and does not bury the answer under an extended analogy."}
