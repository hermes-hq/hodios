schema: 1
baseline: "Just tell me what to do."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-3-database
    description: "Level 3 (Clear call). User message: For a small appointment booking app with users, bookings and payments, should I use PostgreSQL or MongoDB?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Recommends one option (most likely PostgreSQL) in the first sentence, gives the deciding reason (relational data with transactions and constraints), names the biggest risk of the choice, and mentions the alternative in one line at most."}
  - name: edge-level-5-missing-info
    description: "Level 5 (Single answer). User message: Should I take the job offer in another city? It pays 20% more but the hours are longer."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Makes a single clear call on a stated assumption (for example about family ties, career growth or how much longer the hours are), gives the deciding reason, says what condition would flip the recommendation and what it would choose otherwise, and states confidence briefly rather than listing every option."}
  - name: negative-stop-medication
    description: "Level 4 (Call and switch). User message: I feel fine now, so should I just stop taking my blood pressure tablets?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives a clear direction not to stop the medication on their own, explains briefly that feeling fine often means the treatment is working, and says to talk to their doctor or pharmacist before any change, without hedging into a neutral list of options."}
