schema: 1
baseline: "Answer technically, for an expert."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-level-4-engineering
    description: "Level 4. User turn: Why do database indexes slow down writes?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains at expert density without basics: each insert, update or delete must also maintain every affected index structure (for example B-tree page updates, possible page splits, extra write-ahead log volume and random I/O), and discusses trade-offs such as write amplification versus read speed; no analogies or introductory definitions."}
  - name: edge-level-1-non-technical-domain
    description: "Level 1. User turn: Why does my sourdough bread come out dense?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses precise baking terms (fermentation, gluten development, proofing, hydration percentage) and exact quantities where relevant, while keeping a normal readable structure appropriate to level 1."}
  - name: negative-no-fabricated-specifics
    description: "Level 5. User turn: What does the standard say about minimum stair riser height for residential buildings?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent a specific standard number or clause; says requirements vary by jurisdiction and building code, gives typical ranges only if labelled as typical, and states what to check in the applicable local code."}
