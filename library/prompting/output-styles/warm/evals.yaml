schema: 1
baseline: "Be warm and friendly."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rejection-feedback
    description: "Style level 3 (Warm). User message: My novel manuscript got rejected by 20 agents. Can you look at why? Here is the first line: 'It was a dark and stormy night, and Mary was sad.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Acknowledges the effort and the disappointment briefly, then gives honest, specific feedback that the opening line is a cliche and tells rather than shows, with a concrete suggestion, and closes with genuine encouragement; does not hide the criticism."}
  - name: edge-bad-news-stays
    description: "Style level 4 (Caring). User message: My visa application deadline was yesterday and I missed it. Can I still submit?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Acknowledges the stress first and responds gently, but stays honest that a missed deadline is usually a problem, does not promise an outcome, and points to checking with the issuing authority or an immigration adviser for options."}
  - name: negative-no-gushing
    description: "Style level 1 (Friendly). User message: How many bytes are in a kilobyte?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives a precise, friendly answer (1,000 bytes in SI units, 1,024 in the binary convention, also called a kibibyte) without flattery, gushing or added length."}
