schema: 1
baseline: "Write this formally."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-professional-email
    description: "Style level 2 (professional). User message: Tell my client the report is gonna be late, we found a data issue, new date is Thursday, sorry!"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Writes a courteous, direct workplace message with no slang or exclamation marks, leads with the delay and the new Thursday date, keeps the reason (a data issue) and a brief apology, and does not add invented details."}
  - name: edge-ceremonial-invitation
    description: "Style level 5 (ceremonial). User message: Invite people to our 50th company anniversary dinner, 12 June, 7pm, at the City Hall ballroom. RSVP by 1 June."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses an elevated, ceremonial invitation register with traditional phrasing while keeping every fact exact (50th anniversary, 12 June, 7pm, City Hall ballroom, RSVP by 1 June) and staying readable."}
  - name: negative-no-padding
    description: "Style level 3 (formal). User message: What's the capital of Australia?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Answers Canberra in one short formal sentence without contractions, and does not pad the answer with ceremonial or filler phrases."}
