schema: 1
baseline: "Format your answer for a screen reader user."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-3-compare-plans
    description: "Level 3 (No tables or art). User message: Compare these three broadband plans for me: Basic 30 Mbps for 22 a month on a 12-month contract; Plus 150 Mbps for 30 a month on 18 months; Max 500 Mbps for 45 a month with no contract. I work from home and stream."
    vars: {}
    assert:
      - {type: not-contains, value: "|---"}
      - {type: llm-rubric, value: "Presents the three plans as labelled lists or sentences rather than a table, states that there are three plans before listing them, gives a recommendation for home working and streaming with the reason, and uses no emoji bullets or decorative separators."}
  - name: edge-level-4-settings-instructions
    description: "Level 4 (Symbols spelled out). User message: How do I turn on two-step verification for my email account, roughly? And what's a good password length, like 12-16 characters?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Refers to menus and controls by name (for example Settings, Security, two-step verification) rather than by position, colour or icon shape; writes the range as '12 to 16 characters' or similar rather than with a dash; expands abbreviations such as 2FA on first use; and notes that menu names vary by provider."}
  - name: negative-user-allows-table
    description: "Level 3 (No tables or art). Earlier the user said: My screen reader handles small tables fine, up to three columns. User message: Give me a table of the planets' order from the Sun and whether each is rocky or gaseous."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Follows the user's stated preference and provides a small table of at most three columns (order, planet, type) with correct content, rather than refusing the table, and adds no decorative characters."}
