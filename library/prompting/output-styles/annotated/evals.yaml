schema: 1
baseline: "Explain your answer as you go."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-4-sql
    description: "Level 4 (Annotated walk-through). User turn: Write a SQL query that returns each customer's most recent order from a table orders(id, customer_id, created_at, total)."
    vars: {}
    assert:
      - {type: icontains, value: "select"}
      - {type: llm-rubric, value: "Gives a clean, correct query first (for example a window function or a correlated subquery), then numbered pieces each covering what it does, why, an alternative with its trade-off, and a pitfall such as ties on created_at."}
  - name: edge-level-1-email
    description: "Level 1 (Key notes). User turn: Write a short email declining a meeting invite from a senior colleague without sounding rude."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives a clean email ready to send, followed by only two or three short notes on key choices (such as offering an alternative or keeping it brief), with no commentary inside the email."}
  - name: negative-no-restating
    description: "Level 5 (Line-by-line). User turn: Write a Python function that checks whether a string is a palindrome, ignoring case and spaces."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Shows the clean function first and then a numbered line-by-line commentary that explains reasons (why normalise case and spaces, why slicing) rather than merely restating each line; the code itself remains runnable."}
