schema: 1
baseline: "Be thorough."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-level-3-decision
    description: "Level 3. User turn: Should I use a heat pump or a gas boiler for a new three-bedroom house in a cold climate?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Leads with an answer, then gives the reasoning, alternatives (including hybrid systems) and when each is better, trade-offs such as running cost, upfront cost and insulation needs, edge cases like very low temperatures, and states confidence and what would change the answer; no filler."}
  - name: edge-level-5-trivial-question
    description: "Level 5. User turn: What is the capital of Australia?"
    vars: {}
    assert:
      - {type: icontains, value: "Canberra"}
      - {type: llm-rubric, value: "Answers Canberra first and adds only a small amount of genuinely useful context (for example that it is often confused with Sydney) rather than padding a trivial question with headings and sections."}
  - name: negative-no-invented-sources
    description: "Level 4. User turn: How effective is spaced repetition for learning vocabulary?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives a comprehensive answer with mechanisms, limits and how to apply it, and either cites well-known sources accurately or describes the kinds of sources to check, without fabricating study titles, authors or exact statistics."}
