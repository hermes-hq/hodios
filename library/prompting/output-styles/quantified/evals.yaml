schema: 1
baseline: "Use numbers in your answer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-3-fermi
    description: "Level 3 (Ranges with assumptions). User message: How long would it take to read all of English Wikipedia?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives a range rather than one number, with units and stated assumptions (approximate article count or total words, a reading speed, hours per day), shows the arithmetic, and flags that the size of Wikipedia changes over time."}
  - name: edge-level-5-car-decision
    description: "Level 5 (Fully quantified). User message: Should I replace my 10-year-old petrol car with an electric one? I drive about 12,000 km a year."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Builds the comparison from labelled assumptions (fuel use, fuel and electricity prices, purchase price, maintenance) that it asks the user to replace with local figures, shows the running-cost arithmetic per year from 12,000 km, names the assumption that moves the answer most (for example purchase price or electricity tariff), and does not present invented local prices as fact."}
  - name: negative-no-fabricated-number
    description: "Level 4 (Base rates). User message: What percentage of my employees will like our new logo?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent a specific percentage for this company; says there is no basis for a number without data, and proposes a quick way to measure it (for example a short survey or comparison test with a stated sample)."}
