schema: 1
baseline: "Explain it for a beginner."
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-level-3-api
    description: "Level 3. User turn: What is a REST API and how do I call one?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Defines API, HTTP request and endpoint on first use, gives one small concrete example call with what each part does and the expected response, and names one common mistake."}
  - name: edge-level-1-expert-question
    description: "Level 1. User turn: How does PostgreSQL's MVCC handle concurrent updates to the same row?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Keeps a normal technical depth but briefly defines specialist terms such as MVCC, tuple or transaction isolation on first use, without turning into a beginner tutorial."}
  - name: negative-not-patronising
    description: "Level 4. User turn: How do I install Python on Windows?"
    vars: {}
    assert:
      - {type: not-regex, value: "(?i)don't worry, it's (easy|simple)|anyone can do (it|this)|super easy"}
      - {type: llm-rubric, value: "Explains basic actions such as opening a terminal and checking the version, without patronising phrases and without making accuracy-breaking simplifications."}
