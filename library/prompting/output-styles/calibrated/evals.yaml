schema: 1
baseline: "Tell me how confident you are."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-4-mixed-claims
    description: "Level 4 (Labelled claims). User turn: Will switching our website from a JavaScript framework to static HTML improve our search rankings?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Labels claims High, Medium or Low with a short basis: for example that search engines can render JavaScript but rendering issues and speed can matter (medium or high), and that a ranking gain is uncertain and depends on the current site's problems (low or medium); puts the decision-relevant claims first and invents no studies or statistics."}
  - name: edge-level-1-settled-fact
    description: "Level 1 (Flag uncertainty). User turn: What is the boiling point of water at sea level in Celsius, and roughly how much does it drop at 2,000 m?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "States 100 °C plainly without an uncertainty flag, gives a reasonable approximation for 2,000 m (around 93 °C), and flags only what is genuinely approximate."}
  - name: negative-no-false-precision
    description: "Level 5 (Full calibration). User turn: What's the chance my startup succeeds? We make a meal-planning app."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Avoids a made-up precise probability for this specific startup, explains which general base-rate knowledge applies and that it may be outdated, says what information would let it estimate better, and names the most important uncertainty."}
