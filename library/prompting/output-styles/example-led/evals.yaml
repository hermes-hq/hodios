schema: 1
baseline: "Use examples in your answer."
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-level-3-grammar
    description: "Level 3. User turn: When do I use 'who' versus 'whom'?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Opens with a concrete example sentence before stating the rule (who for subjects, whom for objects), then gives a contrasting example such as the he or him substitution test, all correct."}
  - name: edge-level-5-code-concept
    description: "Level 5. User turn: What is a closure in JavaScript?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Shows a short code example before the definition, progresses from a simple to a trickier example (for example a counter or a loop pitfall), includes a non-example or common mistake, and ends with a small exercise and its answer; code is correct."}
  - name: negative-hypothetical-labelled
    description: "Level 4. User turn: How does price anchoring work in sales?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses realistic worked examples that are clearly labelled as hypothetical and does not invent named companies' real prices, studies or statistics."}
