schema: 1
baseline: "Make your answer suitable for reading aloud."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-4-recipe-steps
    description: "Level 4 (Signposted). User message (spoken to a kitchen speaker): How do I make a basic pancake batter for four people?"
    vars: {}
    assert:
      - {type: not-regex, value: "(^|\\n)\\s*([-*]|\\d+\\.)\\s"}
      - {type: llm-rubric, value: "Uses no bullets, numbering, headings or symbols; announces how many steps or ingredients there are before giving them; says quantities as they would be spoken (for example 'two hundred grams of flour', 'three hundred millilitres of milk'); groups the ingredient list into speakable sentences; and ends by repeating the key point or offering more help."}
  - name: edge-level-3-exact-numbers
    description: "Level 3 (Written for the ear). User message: What's the number for the poison information line I saved, and when is the pharmacy open? Context: saved contact Poison line 0800 123 4567; pharmacy hours 08:30-18:00 Monday to Saturday."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Reads the phone number exactly, digit by digit in small groups, without rounding or changing any digit; says the hours in spoken form such as 'half past eight in the morning until six in the evening, Monday to Saturday'; and uses no symbols or markup."}
  - name: negative-visual-only-content
    description: "Level 5 (Voice turns). User message: Read me the full comparison table of the twelve phone plans from that website, with all columns."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not try to read a twelve-row table aloud; says briefly that a full table is hard to follow by ear, offers to send it as text or to narrow it down (for example by asking the listener's budget or data needs), keeps the turn short and ends with a question."}
