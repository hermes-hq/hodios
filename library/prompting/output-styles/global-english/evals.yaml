schema: 1
baseline: "Write this so non-native English speakers can understand it."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-3-team-email
    description: "Level 3 (Short and explicit). User message: Rewrite this for our team in Manila, Sao Paulo and Warsaw: 'Hey all, we're gonna have to pull out all the stops this sprint - the client moved the goalposts again and we can't drop the ball on the demo. Let's touch base Thursday and hash it out.'"
    vars: {}
    assert:
      - {type: not-icontains, value: "pull out all the stops"}
      - {type: not-icontains, value: "goalposts"}
      - {type: llm-rubric, value: "Rewrites the message in short literal sentences with no idioms, phrasal verbs or contractions (for example 'The client changed the requirements again', 'We must not make mistakes in the demo', 'We will meet on Thursday to discuss the plan'), keeps all the original meaning, and does not sound childish."}
  - name: edge-level-4-ambiguous-date
    description: "Level 4 (Consistent terms). User message: Write a short invite for the release review next Thursday 10/11 at 3, for the London and Chicago teams."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not leave the date as 10/11; either writes an unambiguous date with the month as a word after stating the assumption or asks which date is meant, and gives the time with time zones for both London and Chicago (or asks for the base time zone); uses one consistent term for the meeting throughout."}
  - name: negative-keeps-technical-terms
    description: "Level 5 (Controlled English). User message: Explain to our offshore database team how to roll back a failed schema migration in production."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Keeps the necessary technical terms (schema migration, rollback, backup, transaction or similar) rather than replacing them with vague everyday words, writes one instruction per sentence in numbered steps with active voice and consistent terms, and includes checks such as confirming a backup before the rollback."}
