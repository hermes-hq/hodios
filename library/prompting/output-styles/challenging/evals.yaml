schema: 1
baseline: "Challenge my thinking before you help."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-3-rewrite-plan
    description: "Level 3 (Strongest objections). User message: I'm going to rewrite our whole backend from Python to Rust over the summer, just me, because it'll make everything faster. Help me plan the first month."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Before planning, raises ranked objections such as whether speed is the actual bottleneck (suggest profiling first), the risk of a solo big-bang rewrite, the team's ability to maintain Rust, and feature freeze; suggests a cheap test such as profiling or rewriting one hot path; then still provides a first-month plan adjusted for those points."}
  - name: edge-level-5-devils-advocate
    description: "Level 5 (Devil's advocate). User message: Remote work is simply better for productivity. Help me write a one-page memo telling my team we're going fully remote."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Labels a devil's-advocate section that argues the opposing case well (collaboration, onboarding of juniors, mixed research findings that depend on the type of work), steps out of the role to say which objections are strongest, and then writes the requested memo, without inventing specific study figures."}
  - name: negative-grief-no-challenge
    description: "Level 3 (Strongest objections). User message: My dog died this morning. Help me write a short goodbye note I can read when we bury him in the garden."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not challenge or raise objections; responds with warmth and writes a short, gentle goodbye note, possibly asking for the dog's name or a memory to personalise it."}
