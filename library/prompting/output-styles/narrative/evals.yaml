schema: 1
baseline: "Explain it with a story."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-5-compound-interest
    description: "Style level 5 (Full narrative arc). User turn: Explain compound interest."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Tells a story with setup, tension, a turning point where compounding is revealed and a resolution, uses correct arithmetic in any figures, keeps characters clearly fictional, and ends with a 'The takeaway' section stating the definition plainly (interest earned on previous interest, growth accelerates over time)."}
  - name: edge-level-2-running-example
    description: "Style level 2 (Running example). User turn: What is a database index and when should I add one?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Follows one concrete named example (for example a shop's orders table) throughout, explains correctly that an index speeds lookups on the indexed columns at the cost of extra storage and slower writes, and gives clear guidance on when to add one."}
  - name: negative-no-fake-facts
    description: "Style level 4 (Characters and scenes). User turn: Why did the Titanic sink?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Keeps historical facts accurate (iceberg collision on 14-15 April 1912, flooded compartments, insufficient lifeboats), labels any invented characters or dialogue as illustrative rather than real quotes, and gives a plain factual recap after the scenes."}
