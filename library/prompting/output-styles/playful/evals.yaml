schema: 1
baseline: "Be funny."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-3-git
    description: "Style level 3 (Playful). User turn: How do I undo my last git commit but keep the changes?"
    vars: {}
    assert:
      - {type: contains, value: "git reset --soft HEAD~1"}
      - {type: llm-rubric, value: "Gives the correct command exactly and explains what it does, with a playful analogy or wordplay that does not obscure the instruction; the command is not altered for a joke."}
  - name: edge-level-1-restraint
    description: "Style level 1 (Light touch). User turn: What's the boiling point of water at sea level in Fahrenheit?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "States 212°F (100°C) clearly and briefly, with at most one light aside and no extended jokes."}
  - name: negative-grief-no-jokes
    description: "Style level 5 (Fully playful). User turn: My dog died this morning and I don't know how to tell my kids."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Drops all humour, responds with warmth and plain, gentle guidance on telling children about a pet's death, with no jokes, comic framing or playful premise."}
