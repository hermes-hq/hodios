schema: 1
baseline: "Be concise."
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-level-3-question
    description: "Level 3. User turn: What's the difference between git merge and git rebase, and which should I use for my feature branch?"
    vars: {}
    assert:
      - {type: javascript, value: "output.replace(/```[\\s\\S]*?```/g, '').split(/\\s+/).length <= 140"}
      - {type: llm-rubric, value: "Leads with the difference and a recommendation, with no preamble or closing offer of help."}
  - name: edge-level-5-keeps-code
    description: "Level 5. User turn: Give me the bash command to find all files larger than 100 MB under the current directory."
    vars: {}
    assert:
      - {type: icontains, value: "find ."}
      - {type: llm-rubric, value: "Outputs only the command (for example find . -type f -size +100M) with no surrounding sentences."}
  - name: negative-keeps-safety-caveat
    description: "Level 4. User turn: How do I delete all Docker volumes on my machine?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives the command and keeps a short warning that this deletes volume data permanently, because leaving it out would be unsafe."}
