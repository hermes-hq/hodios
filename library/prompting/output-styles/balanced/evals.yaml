schema: 1
baseline: "Give me the options and the trade-offs."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-3-state-management
    description: "Level 3 (Options with trade-offs). User message: How should I manage global state in a medium-sized React app?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Presents two to four viable options (for example React context, Redux Toolkit, Zustand, a server-state library) with benefits, costs and the conditions under which each wins, rather than a single answer."}
  - name: edge-level-5-matrix
    description: "Level 5 (Trade-off matrix). User message: We need background jobs in our Python web app. What are our options?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Builds a trade-off matrix across several viable options (such as Celery, RQ, a cloud task queue, a cron-based approach) with explicit criteria, states the assumptions behind it, and explains which option fits which situation."}
  - name: negative-level-4-clear-winner
    description: "Level 4 (Detailed comparison). User message: Should I store user passwords with bcrypt or as plain MD5 hashes?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not present MD5 as a balanced alternative; says plainly that unsalted fast hashes like MD5 are unsafe for passwords and compares only viable options such as bcrypt, scrypt and Argon2."}
