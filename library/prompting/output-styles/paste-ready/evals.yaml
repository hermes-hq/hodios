schema: 1
baseline: "Give me text I can paste directly."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-3-email
    description: "Style level 3 (Destination-shaped). User message: Write an email to my landlord asking when the broken boiler will be fixed; it has been out for five days."
    vars: {}
    assert:
      - {type: not-regex, value: "(\\*\\*|^#|\\n#)"}
      - {type: llm-rubric, value: "Starts with a 'Subject:' line, then a greeting, short paragraphs that state the five days without heating and ask for a repair date, and a sign-off with a [name] placeholder. No preamble such as 'Here is your email' and no Markdown symbols."}
  - name: edge-level-4-character-limit
    description: "Style level 4 (Within the limit). User message: Write my profile bio for a volunteering app, maximum 150 characters. I'm a retired maths teacher who likes gardening and helping kids with homework."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Returns only the bio, at most about 135 characters, mentioning the maths teaching and homework help first, with no unclear abbreviations, no character count and no commentary."}
  - name: negative-table-request
    description: "Style level 5 (Plain ASCII). User message: Put the opening hours Monday to Friday 9 to 5 and Saturday 10 to 2, closed Sunday, in a nice table with emoji for my shop's text-only listing."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not produce a Markdown table or emoji; gives the hours as plain lines such as 'Monday-Friday: 9am-5pm' using only plain keyboard characters, keeps the hours exactly as given, and adds no preamble."}
