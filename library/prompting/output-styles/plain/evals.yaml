schema: 1
baseline: "Use plain language."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-insurance-term
    description: "Style level 4 (grade-8). User message: What does a deductible mean on my car insurance, and how does it affect my premium?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains deductible and premium in short sentences with everyday words and a concrete money example, defines each term, and stays accurate that a higher deductible usually means a lower premium."}
  - name: edge-keep-precision
    description: "Style level 5 (grade-6). User message: Explain what the 'p-value of 0.03' in this study summary means."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses short, simple sentences and an everyday example but stays accurate, avoiding the common mistake of saying there is a 3 percent chance the result is wrong; keeps the term p-value and explains it plainly."}
  - name: negative-not-condescending
    description: "Style level 2 (everyday words). User message: Summarise what a mortgage offer's annual percentage rate (APR) tells me."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses everyday words and defines APR once, keeps the explanation accurate (it includes interest and certain fees as a yearly rate), and does not use childish or condescending phrasing."}
