schema: 1
baseline: "Make your answer easy to skim."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-compare-options
    description: "Style level 5 (Table first). User message: Compare renting versus buying a home for someone who might move cities in three years."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Opens with a one-line answer, puts the comparison in a table with short cells (for example upfront costs, flexibility, transaction costs, equity), and adds at most three bullets for what the table cannot hold."}
  - name: edge-headed-sections
    description: "Style level 3 (Headed sections). User message: Explain how a heat pump heats a house in winter and what affects its efficiency."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Opens with a two-line summary, uses headings that state conclusions rather than bare topics, keeps paragraphs to three sentences or fewer, and keeps the technical content accurate."}
  - name: negative-simple-answer
    description: "Style level 4 (Bullets first). User message: What year did the Berlin Wall fall?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Answers 1989 in a single line or very short bullet without adding headings, tables or padding."}
