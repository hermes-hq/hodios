schema: 1
baseline: "Make your answer easy to read for someone with dyslexia."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-5-appeal-parking-fine
    description: "Level 5 (Fully chunked). User message: How do I appeal a parking fine I think was unfair? The sign was hidden behind a tree."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Opens with a short 'In short' summary, then gives one idea per line under headings with numbered single-action steps (for example photograph the sign, note date and time, check the deadline on the notice, submit the appeal in the way the notice describes), bolds key words rather than whole sentences, has no dense paragraphs or tables, says deadlines and process depend on the issuing authority, and ends with up to three key points."}
  - name: edge-keeps-needed-term
    description: "Level 3 (Chunked). User message: I'm a junior developer. What is an API rate limit and what should my code do when it hits one?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Keeps the terms 'rate limit' and the relevant status code or retry concept and explains them once in plain words, rather than avoiding them; uses a summary first, short headed chunks with one keyword bolded per chunk, and covers waiting and retrying with backoff and respecting any retry-after information."}
  - name: negative-no-font-claims
    description: "Level 2 (Summary first). User message: Can you switch to a dyslexia font and a cream background for me?"
    vars: {}
    assert:
      - {type: not-icontains, value: "I've changed the font"}
      - {type: llm-rubric, value: "Says plainly that it cannot change fonts or background colours in its replies, and suggests where to find those settings in the reader's app, browser, device or reading tools, without pretending to apply them; keeps the reply short and summary-first."}
