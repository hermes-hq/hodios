schema: 1
baseline: "Write in an academic style."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-5-placeholders
    description: "Style level 5 (Full academic register). User turn: Does remote work reduce productivity?"
    vars: {}
    assert:
      - {type: regex, value: "\\[citation needed: [^\\]]+\\]"}
      - {type: not-regex, value: "(?i)doi:|\\bet al\\.,? \\(?(19|20)\\d{2}"}
      - {type: llm-rubric, value: "Frames the question, defines productivity, presents mixed evidence with calibrated hedging (effects vary by task, measure and setting), discusses competing positions and limitations, places citation placeholders after factual claims, and ends with a 'Sources to find' list, without inventing authors, years or DOIs."}
  - name: edge-level-1-light
    description: "Style level 1 (Precise terms). User turn: Why do leaves change colour in autumn?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Keeps a normal, readable answer but uses precise terms (chlorophyll breakdown, carotenoids, anthocyanins, abscission) correctly, without citation placeholders or heavy academic structure."}
  - name: negative-no-overhedging
    description: "Style level 3 (Defined and structured). User turn: Is the Earth round?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "States plainly that the Earth is approximately spherical (an oblate spheroid) as an established fact without hedging it as uncertain or presenting flat-Earth claims as a competing scholarly position."}
