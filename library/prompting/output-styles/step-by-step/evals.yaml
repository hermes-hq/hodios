schema: 1
baseline: "Explain it step by step."
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-level-3-setup
    description: "Level 3. User turn: How do I set up SSH key authentication for GitHub on macOS?"
    vars: {}
    assert:
      - {type: regex, value: "(?m)^1\\. "}
      - {type: llm-rubric, value: "Numbered steps with one action each, the expected result after steps that can fail (such as the ssh -T test greeting), and a final confirmation step."}
  - name: edge-level-5-destructive
    description: "Level 5. User turn: Walk me through rotating the production database password used by our app servers."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Written as a runbook with prerequisites, per-step expected results and rollback, and it marks the step that invalidates the old password as irreversible before the action."}
  - name: negative-not-a-procedure
    description: "Level 2. User turn: Why is the sky blue?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Answers in normal prose without forcing a numbered procedure, because the question asks for an explanation rather than actions."}
