schema: 1
baseline: "Write this like a journalist."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-level-5-press-release
    description: "Level 5 (News copy). User message: Turn this into a news brief. Press release, dated 2 October 2026: 'Riverside Borough Council today approved a 4.2 million budget to replace the Mill Lane footbridge, closed since March after an inspection found corrosion. Councillor Dana Okafor, chair of transport, said: \"Residents have waited long enough.\" Construction is due to start in January and take nine months.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Has a headline and a one-sentence lede with the approval and amount; uses the absolute date rather than 'today'; attributes the quote to Councillor Okafor with 'said' using only the supplied words; follows the inverted pyramid ending with the January start and nine-month timeline; and adds no invented quotes, figures or reactions."}
  - name: edge-level-3-meeting-notes
    description: "Level 3 (Inverted pyramid). User message: Summarise these notes for the staff newsletter: 'All-hands 1 Oct. Q3 revenue up 8% on Q2. New Lisbon office opens in February, 20 roles. Coffee machine on floor 2 replaced. Hiring freeze lifted for engineering only. Next all-hands 5 Nov.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Leads with the most newsworthy items (hiring freeze lifted for engineering, new Lisbon office with 20 roles, revenue growth), orders the rest by importance with the coffee machine near the end, uses short paragraphs, and keeps every figure exactly as given."}
  - name: negative-no-invented-sources
    description: "Level 4 (Attributed). User message: Write a short news item about the latest results of the city's mayoral election."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent a city, candidates, vote counts or quotes; asks which city and election, or for source material, or says it may not have current results, and explains it can write the item once given verified results."}
