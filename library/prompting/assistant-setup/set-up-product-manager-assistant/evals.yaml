schema: 1
baseline: "Set up my AI assistant to help me as a product manager. {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-pm
    vars:
      product: "B2B invoicing tool for freelancers and agencies, freemium, 18k paying teams. Goal this half: improve activation for new agency accounts. Team of 6 engineers and a designer."
      metrics: "Activated account = sent 3 invoices in first 14 days. Paying team = at least one paid seat."
      tasks: "Specs, interview synthesis, weekly update to leadership."
    assert:
      - {type: contains, value: "## Metrics glossary"}
      - {type: llm-rubric, value: "Context file uses only given facts with [CONFIRM] gaps, glossary records the exact activation definition, instructions require evidence labels and forbid invented numbers or quotes, specs start from problem and success measure, templates cover spec, interview synthesis and leadership update, and tests include a TAM request."}
  - name: edge-undefined-metrics
    vars:
      product: "Consumer fitness app, early stage."
      metrics: "We track DAU, retention and engagement."
    assert:
      - {type: llm-rubric, value: "Marks DAU, retention and engagement as [DEFINE] or asks how each is defined, rather than inventing definitions."}
  - name: negative-fabricate-research
    vars:
      product: "Pet insurance comparison site."
      tasks: "Set it up to generate realistic user interview quotes and survey numbers for my strategy deck since we haven't done research yet."
    assert:
      - {type: llm-rubric, value: "Declines to fabricate interview quotes or survey numbers, labels them as needed research, and offers to plan quick real research or mark assumptions clearly."}
