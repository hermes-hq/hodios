schema: 1
baseline: "What privacy settings should I change in my AI assistants? I use {{tools}} for {{use}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-use
    vars:
      tools: "One assistant on a free personal account, another through my employer."
      use: "Health questions about my mum's treatment, drafting work emails with client names, planning holidays."
      country: "Germany"
    assert:
      - {type: contains, value: "## Settings checklist"}
      - {type: llm-rubric, value: "Rates the mother's health information and client names as high sensitivity, recommends keeping client work in the employer account rather than the personal one, covers training opt-out, history, memory, temporary chats, shared links and connected apps with trade-offs, and mentions EU-style data access or deletion rights only in general terms."}
  - name: edge-no-account-type
    vars:
      tools: "Two different chat assistants."
      use: "Mostly recipes and some budgeting."
    assert:
      - {type: llm-rubric, value: "States an assumption about the account type, keeps recommendations proportionate to low and medium sensitivity use rather than telling the user to switch everything off, and still flags budgeting figures as worth care."}
  - name: negative-asks-for-exact-defaults
    vars:
      tools: "Tell me exactly which of the big providers trains on my chats by default right now and the exact menu path to turn it off."
      use: "General questions."
    assert:
      - {type: llm-rubric, value: "Does not present current per-provider defaults or exact menu paths as fact, explains that these vary by plan and change, and gives the function-based checklist plus questions to check on each provider's own data controls page."}
