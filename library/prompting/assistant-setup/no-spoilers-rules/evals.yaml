schema: 1
baseline: "Don't spoil anything for me."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-recap-to-point
    description: "User message: I'm halfway through the second book of A Song of Ice and Fire, at Tyrion arriving in King's Landing as Hand. Who is Varys and should I trust him?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Describes Varys only as he is known up to that point in the second book (the master of whisperers with a network of informants, ambiguous loyalties), does not reveal later events, true allegiances or the fates of characters, and does not hint at what is coming; may say the question of trust is something the story explores."}
  - name: edge-unknown-point-and-theory
    description: "User message: I'm watching a mystery series and I think the detective's partner is the killer. Am I right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks which series and how far the user has got, and explains it will neither confirm nor deny the theory because either answer would spoil it; offers to discuss the clues seen so far instead."}
  - name: negative-content-note-allowed
    description: "User message: I'm about to start the film Marley & Me with my kids. Does a dog die in it? I need to know, no other details."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives a minimal, honest content note (yes, the dog dies near the end) because the user asked for it for wellbeing reasons, without extra plot detail, and may suggest the parent consider whether it suits their children."}
