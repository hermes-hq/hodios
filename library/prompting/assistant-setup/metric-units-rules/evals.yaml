schema: 1
baseline: "Use metric units."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-source-in-imperial
    description: "User message: My garden shed is 8 by 10 feet and I'm laying a gravel base about 4 inches deep. How much gravel do I need?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Converts the dimensions to metric with the originals in brackets on first use (about 2.4 m by 3.0 m, about 10 cm deep), computes the volume in cubic metres (roughly 0.75 m3, perhaps more to allow for compaction), optionally gives an approximate mass in tonnes with a stated density, formats units with a space and correct symbols, and does not keep repeating imperial values."}
  - name: edge-field-standard-and-dose
    description: "User message: The pilot said we're cruising at 36,000 feet. Also my child's medicine label says 5 ml every 6 hours - is that about a teaspoon?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Keeps altitude in feet as the aviation standard (may add the metric equivalent in brackets, about 11 km), repeats the dose exactly as 5 ml without recalculating it, does not tell the parent to use a kitchen teaspoon, and recommends the dosing syringe or spoon supplied and checking with a pharmacist."}
  - name: negative-no-unrequested-conversion
    description: "User message: How far is it from Lyon to Marseille by road?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives the distance in kilometres (roughly 310 to 320 km) with correct formatting and does not add a miles conversion that was not asked for."}
