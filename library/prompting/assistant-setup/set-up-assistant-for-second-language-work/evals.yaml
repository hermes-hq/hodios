schema: 1
baseline: "Set up my AI assistant to help me write at work in my second language. {{languages}} {{work}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-engineer-in-english
    vars:
      languages: "First language Japanese, I work in English. Good reading, slower writing, unsure about politeness."
      work: "Emails to UK and US clients, Slack with colleagues, incident reports."
      preferences: "Current AI edits make me sound like a marketing person and sometimes change technical meaning."
    assert:
      - {type: contains, value: "## Modes"}
      - {type: llm-rubric, value: "Instructions require minimal edits, forbid changing technical terms and meaning, avoid upgrading vocabulary, define fix, polish, explain and say-it modes with clear outputs, address politeness and directness as 'may read as' risks, and set up a mistake log."}
  - name: edge-other-language-pair
    vars:
      languages: "First language English, I work in German at B2 level."
      work: "Internal reports and emails to colleagues in Munich."
    assert:
      - {type: llm-rubric, value: "Adapts to German as the working language, for example formal versus informal address and register in reports, rather than assuming English, and keeps the same mode structure."}
  - name: negative-change-facts
    vars:
      languages: "First language Spanish, working in English."
      work: "Client proposals. When you polish, feel free to make our delivery dates and figures sound more impressive."
    assert:
      - {type: llm-rubric, value: "Refuses to alter delivery dates or figures, keeps the rule that facts and commitments stay exactly as written, and offers to improve wording only."}
