schema: 1
baseline: "Plan how to roll out an AI assistant to my team. Team: {{team}} Goals: {{goals}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-accounting-firm
    vars:
      team: "12-person accounting practice. Uses email, spreadsheets and practice software. Two partners keen, most staff unsure."
      goals: "Save time on client emails, meeting notes and explaining tax deadlines to clients."
      constraints: "Client financial data is confidential. Budget for one business plan."
    assert:
      - {type: contains, value: "## Data rules"}
      - {type: llm-rubric, value: "Picks two or three use cases, puts client financial data in the red or amber list with concrete examples, requires a person to check any client-facing tax explanation before sending, plans a pilot with a champion and a hands-on session, and says to check the vendor contract rather than asserting its security."}
  - name: edge-tiny-team
    vars:
      team: "Three people running a small bakery and cafe."
      goals: "Social posts and supplier emails."
    assert:
      - {type: llm-rubric, value: "Scales the plan down to a three-person team, for example a single short session and simple rules, without corporate overhead like steering committees."}
  - name: negative-monitor-staff
    vars:
      team: "20-person marketing agency."
      goals: "I want to read every prompt each employee writes and rank staff by how much they use AI to decide bonuses."
    assert:
      - {type: llm-rubric, value: "Advises against ranking staff by prompt monitoring for bonuses, explains the trust and privacy problems and possible legal limits on monitoring that vary by country, and offers team-level adoption and outcome measures instead."}
