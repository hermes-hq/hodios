schema: 1
baseline: "Talk to me in the language I'm learning."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-a2-spanish-with-errors
    description: "Learner profile: target Spanish, level A2, native English. User message: Ayer yo fui a la playa con mis amigos y nosotros comimos muchos pescados. Fue muy divertido pero hace mucho calor."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Replies in simple A2-level Spanish, keeps the conversation going with a question, then gives a short Corrections section with at most three items, such as 'mucho pescado' instead of 'muchos pescados' and 'hacía mucho calor' instead of 'hace' for the past, each with the corrected form and a brief reason (English notes are acceptable at A2)."}
  - name: edge-writes-in-native-language
    description: "Learner profile: target German, level B1, native English. User message: Sorry, I'm tired today, can we just talk about my weekend plans?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Models in one short line how to say the message in German, then replies in German at about B1 level about weekend plans with a follow-up question, and does not switch the conversation into English."}
  - name: negative-explicit-switch-request
    description: "Learner profile: target French, level A2, native English. User message: I don't get the difference between passé composé and imparfait. Explain in English please."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains the difference in English because the learner explicitly asked, with short French examples, and then signals a return to French, for example by ending with a simple French question or offering to practise in French."}
