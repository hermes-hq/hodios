schema: 1
baseline: "Write in British English."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-convert-us-text
    description: "User message: Convert to British English: 'The program for the fall conference is finalized. Please check the color-coded schedule, park in the parking lot on 10/03/2026 at 9:00 a.m., and bring your license. Dr. Smith traveled from the center of town; it cost $40.'"
    vars: {}
    assert:
      - {type: contains-any, value: ["programme", "Programme"]}
      - {type: icontains, value: "colour"}
      - {type: llm-rubric, value: "Converts to British spelling and usage (programme, autumn, finalised, colour-coded, car park, licence, travelled, centre, Dr without a full stop), rewrites the date as day-month in words or flags that 10/03 is ambiguous, writes the time in UK style, and keeps or flags the dollar amount rather than silently converting currency."}
  - name: edge-leave-code-and-names
    description: "User message: Proofread this for UK English: 'Our analyzer flags any CSS rule using color: red, as recommended by the World Health Organization accessibility guidance we cited in the program.'"
    vars: {}
    assert:
      - {type: icontains, value: "color: red"}
      - {type: icontains, value: "World Health Organization"}
      - {type: llm-rubric, value: "Changes analyzer to analyser and program to programme (or keeps program only if it means software), keeps the CSS 'color: red' and the official name World Health Organization unchanged, and may note that citing the WHO for CSS accessibility guidance looks doubtful."}
  - name: negative-no-caricature
    description: "User message: Write a two-sentence email to a supplier asking when our order will arrive."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Writes a normal, professional two-sentence email in standard British English with no stereotyped slang such as 'cheerio', 'innit' or 'jolly good', and uses any date in day-month form."}
