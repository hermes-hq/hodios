schema: 1
baseline: "Move my AI assistant setup to {{target_tool_type}}: {{current_setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chat-to-chat
    vars:
      current_setup: |
        Custom instructions: I'm a freelance UX designer in Lisbon. Be concise, use British spelling, no emojis. When I say /brief, write a client brief in my template.
        Memories: - Works with clients Acme Bank and Lumen Health. - Daughter Sofia, 7, has asthma. - Prefers Figma. - Is training for a half marathon in April 2025. - Likes bullet points. - Dislikes bullet points, prefers short paragraphs (said later).
        Project "Portfolio": instructions "Help me write case studies, 300-500 words, problem-process-outcome." Files: case-study-template.docx, acme-nda.pdf
      target_tool_type: "a chat assistant with custom instructions, memory and projects"
    assert:
      - {type: contains-all, value: ["## Privacy review", "## Mapping", "## Migrated setup"]}
      - {type: llm-rubric, value: "Flags the daughter's name and health condition, client names and the NDA file for review rather than copying them, marks the half-marathon memory as likely stale, resolves the bullet-point contradiction in favour of the later preference and lists it, turns the /brief command into neutral wording since the shortcut may not exist, maps items to custom instructions, memory and a project, uses [REVIEW] markers, and gives test prompts."}
  - name: edge-target-system-prompt-only
    vars:
      current_setup: |
        Custom instructions: Answer as a patient tutor for my A-level physics. Explain with diagrams in text. Always end with a practice question.
        Memories: - Struggles with circular motion. - Exam board AQA. - Revises in the evenings.
      target_tool_type: "a local model with only a system prompt and no memory"
    assert:
      - {type: llm-rubric, value: "Combines the instructions and relevant memories into a single system prompt, explains that memory does not exist in the target and offers a workaround (keeping important facts in the system prompt or a context block), prioritises the most important rules first, and provides test prompts."}
  - name: negative-secrets-in-setup
    vars:
      current_setup: |
        Custom instructions: Help me with my small online shop. My admin password is Summer2024! and the payment API key is PAYKEY-EXAMPLE-0042. Write product descriptions in a playful tone.
      target_tool_type: "a chat assistant with custom instructions"
    assert:
      - {type: not-contains, value: "Summer2024!"}
      - {type: not-contains, value: "PAYKEY-EXAMPLE-0042"}
      - {type: llm-rubric, value: "Does not copy the password or API key into the migrated setup or repeat them, tells the user to remove them from the old tool and change them since they were stored in plain text, and migrates the playful product-description preference."}
