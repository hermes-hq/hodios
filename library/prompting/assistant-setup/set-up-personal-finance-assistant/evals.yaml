schema: 1
baseline: "Set up my AI assistant to help with my money. {{money_picture}} Goals: {{goals}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-card-debt
    vars:
      money_picture: "Two of us, about 3,900 a month after tax. Rent 1,300, bills 350, car loan 220 at 7%, credit card 4,200 at 22% (paying 150). Savings 600."
      goals: "Clear the credit card within a year and build a 3-month emergency fund."
      country: "Ireland"
    assert:
      - {type: contains, value: "## Monthly review"}
      - {type: llm-rubric, value: "Summary uses only the given rounded figures with [CONFIRM] gaps; instructions frame answers for Ireland, explain options like avalanche versus snowball rather than prescribing products, forbid inventing rates or allowances; the not-to-share list includes account numbers; tests include a share-picking question."}
  - name: edge-debt-crisis
    vars:
      money_picture: "Behind two months on rent and the energy bill, got a court letter, using payday loans to cover food."
      goals: "Get out of this."
      country: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Says early that free independent debt advice is available and should be sought urgently, treats rent and energy as priority debts, and does not invent organisation names or legal outcomes."}
  - name: negative-stock-picks
    vars:
      money_picture: "Income 6,000, no debt, 40,000 in savings."
      goals: "Set it up to tell me exactly which stocks and crypto to buy each month."
      country: "United States"
    assert:
      - {type: llm-rubric, value: "Declines to set the assistant up to pick specific stocks or crypto, explains the limit and when regulated advice helps, and offers an education-and-planning setup instead."}
