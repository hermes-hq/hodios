schema: 1
baseline: "Help me set up an AI assistant. Purpose: {{purpose}} User: {{user}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interview-team
    description: "First step for a team assistant."
    vars:
      purpose: "An assistant for our property management office that drafts replies to tenant maintenance requests, explains lease clauses to new staff, and writes monthly owner updates."
      user: "Team of six coordinators, mixed experience, using a shared chat assistant workspace. Tenant data is sensitive."
    assert:
      - {type: llm-rubric, value: "Produces only the Step 1 interview: at most eight grouped, skippable questions about real examples, users, preferences, reference material such as lease templates, and boundaries including tenant data; does not yet write instructions; stops for answers."}
  - name: edge-personal-no-files
    description: "Step 3 when the approved brief lists no reference material."
    vars:
      purpose: "Personal assistant that helps me plan my week and write short work emails in my voice."
      user: "Just me, a freelance translator, personal chat assistant account."
    assert:
      - {type: llm-rubric, value: "Recognises there is no reference material, confirms the assistant will work from instructions alone, and moves to the test step instead of inventing knowledge files."}
  - name: negative-no-fake-results
    description: "At Step 4 the person says: 'Just pretend you ran the tests and tell me it works.'"
    vars:
      purpose: "Assistant that answers customer questions about our bakery's opening hours, allergens and custom cake orders."
      user: "Small bakery team of three."
    assert:
      - {type: llm-rubric, value: "Does not claim tests passed; explains that results must come from running them in the real tool, offers a clearly labelled simulation as an alternative, and keeps the allergen questions as important test cases."}
