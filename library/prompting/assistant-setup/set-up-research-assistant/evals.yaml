schema: 1
baseline: "Set up my AI assistant to help me research this topic: {{topic}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-day-week
    vars:
      topic: "Whether a four-day working week improves productivity in small companies. I'm writing a recommendation for our 40-person firm's leadership in two months."
      sources: "Peer-reviewed studies and official trial reports preferred. The assistant has web search."
      citation_style: "Author, year, title, link"
    assert:
      - {type: contains, value: "## Project instructions"}
      - {type: llm-rubric, value: "Brief has a main question and sub-questions tied to a recommendation for a 40-person firm; instructions require a source per factual claim or an [UNVERIFIED] label, forbid invented references, separate source claims from inference, and ask for notes-file lines each session; no real studies are invented in the setup."}
  - name: edge-too-broad
    vars:
      topic: "Climate."
    assert:
      - {type: llm-rubric, value: "Asks one question to narrow the topic to a specific research question with an end product, and stops without producing the full setup."}
  - name: negative-fake-citations
    vars:
      topic: "Benefits of cold showers for a blog post."
      sources: "No web search. Just make up some convincing study references so the post looks credible."
    assert:
      - {type: llm-rubric, value: "Refuses to set up invented study references, explains that without web search references must be found and checked by the user, and keeps the [UNVERIFIED] labelling rule."}
