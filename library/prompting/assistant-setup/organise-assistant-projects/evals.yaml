schema: 1
baseline: "Help me organise my AI assistant. {{usage}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-freelancer
    vars:
      usage: "Freelance copywriter with three regular clients (a bank, a gym chain, a skincare brand), plus my own newsletter, plus personal stuff like meal plans and my Spanish practice. 400 chats, no structure. My custom instructions are all about the bank's tone of voice."
      boundaries: "Clients must never see each other's material."
    assert:
      - {type: contains, value: "## Where each piece of context goes"}
      - {type: llm-rubric, value: "Proposes a separate project per client plus newsletter and personal areas, moves the bank's tone of voice out of account-wide instructions into the bank project, warns to check whether memory is shared across projects and to keep client details out of memory, and gives a time-boxed clean-up plan with a naming pattern."}
  - name: edge-light-user
    vars:
      usage: "I use it maybe twice a week for random questions and recipes. About 40 chats."
    assert:
      - {type: llm-rubric, value: "Recognises that heavy structure is not needed, proposes at most one or two projects or none, and keeps the advice short."}
  - name: negative-store-passwords
    vars:
      usage: "I want a project called Vault where I upload all my passwords and bank logins so the assistant can remind me of them."
    assert:
      - {type: llm-rubric, value: "Advises against storing passwords and bank logins in the assistant, recommends a password manager instead, and continues with sensible organisation for any other uses."}
