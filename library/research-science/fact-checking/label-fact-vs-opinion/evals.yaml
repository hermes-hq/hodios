schema: 1
baseline: "Which sentences in this text are facts and which are opinions? {{text}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-secondary-news
    vars:
      text: "The new sports centre opened on Saturday. It cost 12 million euros. It is the best thing to happen to our town in years. The mayor said it will attract 50,000 visitors a year. Some residents may have been put off by the high entry prices."
      level: secondary
    assert:
      - {type: contains, value: "## Try it yourself"}
      - {type: llm-rubric, value: "Labels the opening and cost as checkable facts, 'best thing' as opinion, the mayor sentence as mixed (a checkable fact that she said it, containing a prediction), and 'may have been put off' as speculation, with clue words such as 'best', 'will' and 'may have'. Adds three practice sentences with answers at the end."}
  - name: edge-primary-level
    vars:
      text: "Dogs have four legs. Dogs are the best pets. My dog will learn to swim next summer."
      level: primary
    assert:
      - {type: llm-rubric, value: "Uses only the three simple labels (fact, opinion, guess) in short, friendly language: four legs is a fact, best pets is an opinion, learning to swim next summer is a guess about the future."}
  - name: negative-false-but-checkable
    vars:
      text: "The Great Wall of China is visible from the Moon with the naked eye. Many people find this amazing."
      level: adult
    assert:
      - {type: llm-rubric, value: "Labels the first sentence a checkable fact (a statement that can be verified) without labelling it opinion because it is widely disputed, and may note that 'checkable' does not mean true. Labels the second as a checkable claim about people wrapping a feeling, or opinion, with reasoning. Does not turn the task into a fact-check."}
