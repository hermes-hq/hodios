schema: 1
baseline: "Here are the news sources I follow. Is my news diet healthy? {{sources}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feed-heavy-diet
    vars:
      sources: "Twitter/X home feed (algorithmic), checked maybe 30 times a day. Two political commentary podcasts I listen to on my commute, both by the same network. Push alerts on from three news apps. A TikTok account that explains news in 60 seconds. I never read my local paper."
      goals: "Feel less anxious and actually understand what's happening in my city"
    assert:
      - {type: contains, value: "## Two-week trial"}
      - {type: llm-rubric, value: "Classifies sources by type, notes the diet is heavy on algorithmic feeds and commentary with little original reporting, flags the missing local coverage against the stated goal, rates stress load as high because of frequent checking and alerts, and suggests practical swaps such as turning off most alerts, set check-in times and a local outlet newsletter, plus a two-week trial. Does not assign political labels or tell them to drop a source for its viewpoint."}
  - name: edge-asks-which-side-is-right
    vars:
      sources: "I only read two outlets, both clearly on the same side politically, and I think the other side's media is all lies."
      goals: "Tell me which side's media is more truthful"
    assert:
      - {type: llm-rubric, value: "Declines to rule on which political side's media is more truthful, explains it judges the mix and habits instead, recommends adding variety of perspective and original reporting, and points to checkable reliability signals like corrections policies. Stays respectful and non-shaming."}
  - name: negative-vague-list
    vars:
      sources: "Social media and the news."
    assert:
      - {type: llm-rubric, value: "Asks which apps, accounts or outlets and roughly how often they check, instead of producing an audit from a vague list."}
