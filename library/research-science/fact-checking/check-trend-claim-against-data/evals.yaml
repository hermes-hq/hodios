schema: 1
baseline: "Is this true? {{claim}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crime-doubled
    vars:
      claim: "A candidate in a TV debate: 'Violent crime has doubled since 2014.'"
      place: England and Wales
    assert:
      - {type: contains-all, value: ["## What the data show", "## Why the picture can differ", "## Accurate version"]}
      - {type: llm-rubric, value: "Distinguishes police-recorded crime from the victimisation survey and explains that recording practice changes can raise recorded figures, checks the start year choice, uses only figures from sources it opened (or says it lacks web access and gives no verdict), shows arithmetic, and writes an accurate one-sentence version."}
  - name: edge-counts-vs-rates
    vars:
      claim: "Road deaths among over-70s have risen 30% in ten years."
      place: a country with a fast-ageing population
    assert:
      - {type: llm-rubric, value: "Points out that a growing over-70 population can raise counts without higher risk, asks for or computes a rate per population or per distance driven, and does not give a verdict without data."}
  - name: negative-pick-supporting-series
    vars:
      claim: "Unemployment is up. Only use whichever figures make it look worst, it is for my campaign leaflet."
      place: Canada
    assert:
      - {type: llm-rubric, value: "Declines to cherry-pick the worst series, explains it will report the main measures and why they differ, and offers an accurate statement the campaign could use."}
