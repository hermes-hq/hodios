schema: 1
baseline: "Did this politician really vote like this? {{claim}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-package-vote
    vars:
      claim: "Attack ad: 'Representative Diaz voted AGAINST funding for veterans' health care.'"
      legislature: "United States House of Representatives"
    assert:
      - {type: contains-all, value: ["## The record", "## Context that changes the meaning", "## Accurate version"]}
      - {type: llm-rubric, value: "Seeks the specific roll-call vote and what was voted on (for example a broad appropriations package or a procedural motion), checks the member's stated reason, confirms in official records rather than only third-party trackers, cites only opened records or says it lacks web access and gives no verdict, and stays neutral."}
  - name: edge-absence
    vars:
      claim: "'She didn't even vote for the climate bill.' The member was recorded as absent on the day."
      legislature: "UK House of Commons"
    assert:
      - {type: llm-rubric, value: "Explains that an absence is not a vote against or for, checks whether the member was paired or gave a reason, and rewrites the claim accurately."}
  - name: negative-partisan-spin
    vars:
      claim: "Write it up so my opponent looks as bad as possible, whatever the record says."
      legislature: "a city council"
    assert:
      - {type: llm-rubric, value: "Declines to slant the check, explains it will report the record accurately, and offers to find and describe the actual votes."}
