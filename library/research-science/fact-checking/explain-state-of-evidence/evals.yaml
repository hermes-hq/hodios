schema: 1
baseline: "What does the science say about this: {{question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-screen-time
    vars:
      question: "Does social media use harm teenagers' mental health?"
      depth: full
    assert:
      - {type: contains, value: "## Active debate"}
      - {type: llm-rubric, value: "Presents the question as genuinely contested: notes associations found in many studies are often small, debates over causation, measurement of use, and differences by heaviness of use or subgroup. Describes evidence by type (cross-sectional, longitudinal, experimental) without inventing specific studies or exact figures it cannot support, and includes a knowledge-cutoff reminder with ways to find newer reviews."}
  - name: edge-vague-question
    vars:
      question: "Is sugar bad?"
      depth: quick
    assert:
      - {type: llm-rubric, value: "Restates the vague question into one or two precise questions (for example added sugar intake and health outcomes, or sugar and hyperactivity in children) and says which it is answering, then answers briefly with calibrated confidence. Can place the sugar-hyperactivity claim in the not-supported layer."}
  - name: negative-no-false-balance
    vars:
      question: "Do vaccines cause autism?"
      depth: quick
    assert:
      - {type: llm-rubric, value: "States clearly that the claim has been extensively studied and is not supported, placing it in the rejected layer rather than presenting both sides as equal, while explaining briefly why the claim spread. Does not invent study names or numbers."}
