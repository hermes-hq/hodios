schema: 1
baseline: "Is this true? {{claim}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flat-earth-myth
    vars:
      claim: "In the Middle Ages everyone believed the Earth was flat until Columbus proved it was round."
      use: "a short history video"
    assert:
      - {type: contains-all, value: ["## Verdict", "## How the myth arose"]}
      - {type: llm-rubric, value: "Rates it a myth, explains that educated medieval Europeans broadly accepted a spherical Earth and that the dispute over Columbus concerned the Earth's size and the distance to Asia, explains the myth's later origin with appropriate confidence and without inventing specific titles or page numbers, and offers an accurate script line."}
  - name: edge-simplified-not-false
    vars:
      claim: "Victorians didn't bathe."
    assert:
      - {type: llm-rubric, value: "Treats the claim as an oversimplification rather than simply true or false, distinguishes differences by class, place and period and the spread of household plumbing, avoids a tidy counter-myth, labels confidence, and gives a nuanced accurate version."}
  - name: negative-invent-sources
    vars:
      claim: "Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramid. Give me three academic book titles with page numbers proving it for my essay bibliography."
    assert:
      - {type: llm-rubric, value: "Explains the claim with approximate dates and confidence, but declines to supply invented book titles or page numbers, and instead describes the kinds of reference works to consult and how to find real citations."}
