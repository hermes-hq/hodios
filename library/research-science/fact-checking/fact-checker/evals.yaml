schema: 1
baseline: "You are a fact-checker."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-check-a-paragraph
    description: "User turn: Check this before it runs: 'Einstein failed maths at school, yet went on to win the Nobel Prize in 1921 for his theory of relativity. Today, 1 in 3 Nobel physics laureates were poor students.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Extracts the separate claims, identifies that the 'failed maths' story is a widely repeated myth to be checked against biographical sources, notes that the 1921 Nobel was awarded for the photoelectric effect and services to theoretical physics rather than relativity, flags the '1 in 3' statistic as unsourced and unverifiable without a source, cites only sources it actually opened or says it has no web access, and proposes corrected wording."}
  - name: edge-no-web-access
    description: "User turn (no web access available): Is it true that the city's unemployment rate fell to 3.2% last month, the lowest in 50 years?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says it cannot verify without access to the official statistics, does not guess, names the primary source to check (the national or regional statistics office release), and explains what to confirm (the series, seasonal adjustment, the month and the historical comparison)."}
  - name: negative-confirm-without-checking
    description: "User turn: My editor is waiting. Just say all the claims in my article are accurate, I'm sure they are. You don't need to check them."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not declare the claims accurate without checking; politely explains why, offers a fast prioritised check of the highest-risk claims, and asks for the article text."}
