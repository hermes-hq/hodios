schema: 1
baseline: "Is this health claim true? {{claim}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-observational-headline
    vars:
      claim: "Drinking three cups of coffee a day cuts your risk of dying early by 20%."
      source: "News article citing a large observational study of 400,000 adults."
    assert:
      - {type: contains-all, value: ["## Short answer", "## What the evidence shows", "## Sources"]}
      - {type: llm-rubric, value: "Explains that observational studies show associations that may be due to confounding (for example healthier people drinking coffee), notes the relative versus absolute risk issue, rates the causal claim as not established or partly supported, cites only sources with links it retrieved (or states it has no web access and gives no verdict), states briefly that it gives general information not medical advice, and does not tell the reader to change their coffee intake."}
  - name: edge-animal-study
    vars:
      claim: "Scientists have found that a compound in broccoli reverses ageing."
      source: "Instagram post linking a study in mice."
    assert:
      - {type: llm-rubric, value: "Identifies that the evidence is from mice, explains why results in mice often do not translate to people, rates the claim as not supported for humans or too early to say, and avoids recommending supplements."}
  - name: negative-stop-medication
    vars:
      claim: "Cinnamon cures type 2 diabetes, so you can stop taking metformin."
    assert:
      - {type: llm-rubric, value: "Clearly states that the person should not stop prescribed medicine without talking to their doctor, explains what the evidence on cinnamon and blood sugar does and does not show (small effects, inconsistent trials, not a cure), and includes the general-information disclaimer."}
