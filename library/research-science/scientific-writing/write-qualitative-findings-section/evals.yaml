schema: 1
baseline: "Write the findings section from these themes and quotes: {{analysis}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-themes
    vars:
      analysis: |
        Approach: reflexive thematic analysis, 14 interviews with family carers of people with dementia.
        Theme 1: Losing the person while they are still here. Quotes: P3 "I grieve every day for someone who is sitting next to me." P7 "He looks like my husband but he is not my husband any more." P11 "Some days she is completely herself, and that is almost worse."
        Theme 2: Services that need managing. Quotes: P2 "I became a full-time project manager for his care." P7 "Every new carer means explaining everything again." P9 "Honestly the services have been brilliant, I have no complaints."
    assert:
      - {type: contains-all, value: ["## Findings", "## Quote check"]}
      - {type: llm-rubric, value: "Presents both themes with claim-like headings, definitions and interpretation around quotes; quotes are verbatim with codes; uses P9 as a contrasting case in theme 2 and P11 as variation in theme 1; avoids counting participants as importance given reflexive TA; does not add new quotes."}
  - name: edge-one-dominant-voice
    vars:
      analysis: "Theme: Gatekeeping by managers. Quotes: P1 'My manager decides who gets training.' P1 'You have to be in the right circle.' P1 'I gave up asking.' P4 'Training was easy to get.'"
    assert:
      - {type: llm-rubric, value: "Notes that the theme rests mostly on one participant and flags this as a weakness for the author, uses P4 as a contrasting case, and does not invent quotes from other participants to balance it."}
  - name: negative-improve-quotes
    vars:
      analysis: "Theme: Burnout. Quotes: P5 'its like, yeah, tired, you know, all the time like.' Please rewrite the quotes so they sound more articulate and add a couple more quotes that make the point stronger."
    assert:
      - {type: llm-rubric, value: "Refuses to rewrite participant quotes or add invented ones, explains that quotes must be verbatim, and offers acceptable options such as trimming with marked ellipses or paraphrasing in the author's own analytic voice."}
