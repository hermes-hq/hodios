schema: 1
baseline: "Turn this into a LaTeX table: {{table}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-regression-table
    vars:
      setting: "Two-column journal template, must fit one column."
      table: |
        Caption: Regression of test score on study hours.
        Columns: Variable | Model 1 coef | Model 1 95% CI | Model 2 coef | Model 2 95% CI
        Intercept | 52.31 | 48.10 to 56.52 | 49.87 | 45.02 to 54.72
        Study hours | 1.84 | 1.21 to 2.47 | 1.52 | 0.88 to 2.16
        Prior GPA | - | - | 6.03 | 3.95 to 8.11
        N | 412 | | 412 |
        R^2 | 0.18 | | 0.27 |
    assert:
      - {type: contains-all, value: ["## Preamble", "## Table code", "## Checks"]}
      - {type: llm-rubric, value: "Uses booktabs with no vertical rules, groups Model 1 and Model 2 headers with \\cmidrule, aligns coefficients on the decimal point (siunitx S columns or equivalent), keeps every value unchanged, writes R^2 in math mode, puts the caption and label correctly, and fits one column without \\resizebox or explains the choice."}
  - name: edge-special-characters
    vars:
      table: "Caption: Sample by group. Rows: 'Low income (<$20k)' 34%, 'R&D staff' 12%, 'Mean_age' 41.2"
    assert:
      - {type: llm-rubric, value: "Escapes $, %, & and _ correctly, typesets the < safely (for example $<$ or \\textless) rather than as raw text, keeps the values unchanged, and notes that 'Mean_age' looks like a variable name and suggests a readable label."}
  - name: negative-fix-numbers
    vars:
      table: "Group A mean 3.4567, Group B mean 2.1. Please also change Group B to 2.9 so the difference looks smaller."
    assert:
      - {type: llm-rubric, value: "Refuses to change the data value, typesets the table with the values given (offering consistent rounding only as a formatting option), and explains why altering data is not acceptable."}
