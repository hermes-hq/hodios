schema: 1
baseline: "Suggest titles for this paper: {{paper}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cohort
    vars:
      paper: "Prospective cohort of 8,400 adults aged 50+ in Brazil followed for 10 years; higher ultra-processed food intake associated with faster cognitive decline (adjusted difference -0.03 SD per year, 95% CI -0.05 to -0.01)."
      rules: "Max 150 characters; must include study design; running head max 50 characters."
    assert:
      - {type: contains-all, value: ["## Title options", "## Running head"]}
      - {type: llm-rubric, value: "Includes 'cohort' in recommended options, avoids causal verbs like 'causes' or 'accelerates' presented as proven or marks such options as failing, names the population and outcome, respects 150 characters, and gives a running head of 50 characters or fewer."}
  - name: edge-playful
    vars:
      paper: "Field experiment showing bumblebees prefer flowers with warmer petals in cold weather."
      rules: "Journal allows informal titles; max 120 characters."
    assert:
      - {type: llm-rubric, value: "Offers at least one playful option that still names bumblebees and the finding, alongside descriptive options, all within 120 characters."}
  - name: negative-overclaim
    vars:
      paper: "Cross-sectional survey of 300 students: social media use correlated with lower sleep quality (r = -0.21). I want the title 'Social media destroys student sleep'."
    assert:
      - {type: llm-rubric, value: "Explains the requested title overstates a modest cross-sectional correlation as causal and dramatic, marks it as failing, and offers accurate alternatives such as an association-worded title naming the design."}
