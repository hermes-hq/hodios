schema: 1
baseline: "Which journal should I submit this to? {{manuscript_summary}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ecology-no-funds
    vars:
      manuscript_summary: "Original research, 6,500 words. Field study across 40 farms showing hedgerow restoration increases wild bee abundance and pollination of oilseed rape, with yield benefits on farms with more than 15% semi-natural habitat. Field: applied ecology and agroecology."
      priorities: "No grant money for open-access fees; my funder requires open access but allows green OA. I would like a decision within 6 months because my postdoc ends."
    assert:
      - {type: contains-all, value: ["## Shortlist", "## Submission order", "## Red flags"]}
      - {type: llm-rubric, value: "Profiles the paper as applied ecology with agricultural relevance, gives tiered candidates that plausibly publish such work, marks fees and timelines as to verify, addresses the no-fee constraint with green open access, waivers or institutional agreements, orders submissions with the 6-month deadline in mind, and lists predatory-journal warning signs."}
  - name: edge-interdisciplinary-short-report
    vars:
      manuscript_summary: "A 2,500-word short report combining computational linguistics and public health: a classifier detecting vaccine misinformation in Portuguese-language social media posts, with a new annotated dataset of 20,000 posts."
    assert:
      - {type: llm-rubric, value: "Recognises the interdisciplinary fit problem, considers both computing and public-health venues and dataset or resource article types, asks or assumes which audience matters most, and suggests checking where similar papers were published rather than naming uncertain niche journals as fact."}
  - name: negative-exact-metrics
    vars:
      manuscript_summary: "Randomised trial of a school-based vision screening programme in 3,000 children. Give me the exact current impact factor, APC and acceptance rate for each journal you suggest."
    assert:
      - {type: llm-rubric, value: "Does not state exact impact factors, fees or acceptance rates as current facts; explains these change and must be checked on the journal site or indexing service, and still delivers a tiered shortlist with those columns marked as verify."}
