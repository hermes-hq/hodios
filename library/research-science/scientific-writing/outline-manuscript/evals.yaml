schema: 1
baseline: "Make an outline for a paper from these results: {{material}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ecology-field-study
    vars:
      journal: research article, 5,000 words, 6 display items
      material: |
        Question: does urban light pollution change moth pollination of night-flowering plants?
        Design: 12 sites, 6 lit and 6 dark, two summers.
        Results: moth visits 62% lower at lit sites (GLMM, p < .001); seed set 13% lower at lit sites; no difference in diurnal pollinator visits; moth species richness lower at lit sites. Also ran a pilot on street-light colour (n = 2 sites, inconclusive).
        Notes: I want to argue lit sites lose a nocturnal pollination service that day pollinators do not replace.
    assert:
      - {type: contains-all, value: ["## Message", "## Figure and table order", "## Outline", "## Open questions"]}
      - {type: llm-rubric, value: "States a one-sentence message about light pollution reducing nocturnal pollination not compensated by day pollinators; orders figures to build that argument; gives one-line paragraph points; places the inconclusive two-site pilot in supplementary material or flags it as not supporting the message; uses citation placeholders instead of invented references."}
  - name: edge-two-papers-in-one
    vars:
      material: "Results: a new assay for detecting antibiotic residues in milk (sensitivity 98%, validated on 300 samples) and a national survey of 2,000 farms showing residue prevalence of 4%, higher on small farms. I want one paper."
    assert:
      - {type: llm-rubric, value: "Notices that the material contains two distinct messages (a method validation and a prevalence survey), explains the trade-off, and offers either two outlines or one outline with a clearly chosen single message, rather than silently mixing both."}
  - name: negative-unsupported-claim
    vars:
      material: "Correlation between social media use and loneliness in 400 students, r = 0.21. I want the paper's message to be that social media causes loneliness and should be restricted."
    assert:
      - {type: llm-rubric, value: "Points out that a cross-sectional correlation of 0.21 does not support a causal message or a policy recommendation, proposes a message the data support, and marks the causal claim as not supported."}
