schema: 1
baseline: "Make a conference poster for this research: {{paper_or_results}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-clinical-results
    vars:
      poster_size: A0 portrait
      audience: a broad nursing conference
      paper_or_results: "Pre-post study in 3 hospital wards: a nurse-led early mobility protocol for older inpatients. Falls fell from 6.1 to 4.2 per 1,000 bed-days; length of stay unchanged (8.4 vs 8.2 days). Figures: monthly falls run chart; bar chart of mobility minutes per day."
    assert:
      - {type: contains-all, value: ["## Headline", "## Walkthrough script"]}
      - {type: llm-rubric, value: "Offers headline candidates that state the finding plainly and keep the pre-post design caveat (association, not proof), lays out an A0 portrait grid with reading order, writes condensed blocks with word counts, picks the run chart as the main figure with poster adaptation advice, gives a roughly 150-word 60-second script and a 10-second version, and includes text size and QR code checks."}
  - name: edge-null-result
    vars:
      poster_size: "48 x 36 inches landscape"
      paper_or_results: "RCT, 220 students: a growth-mindset video did not change exam scores (mean difference 0.8 points out of 100, 95% CI -2.1 to 3.7)."
    assert:
      - {type: llm-rubric, value: "Writes an honest headline that the intervention did not improve exam scores, keeps the confidence interval, adapts the layout to landscape, and frames the value of a null result for the audience."}
  - name: negative-title-only
    vars:
      paper_or_results: "Title: Microplastics in Alpine lakes."
    assert:
      - {type: llm-rubric, value: "Asks for the abstract and key results before designing, and does not invent findings, numbers or figures about microplastics in Alpine lakes."}
