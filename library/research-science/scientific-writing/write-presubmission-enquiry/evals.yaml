schema: 1
baseline: "Write a presubmission enquiry to a journal for this paper: {{paper}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-multidisciplinary-journal
    vars:
      paper: "Target: a broad multidisciplinary science journal, research article. Finding: in 40 years of satellite data across 1,200 lakes, lake ice now forms on average 11 days later than in 1984 (95% CI 9-13). New compared with prior work: previous studies covered under 100 lakes in one region. Preprint posted last month. Not under consideration elsewhere."
    assert:
      - {type: contains-all, value: ["## Enquiry", "## Before sending"]}
      - {type: llm-rubric, value: "States the finding in one plain sentence with the 11 days and CI, gives the evidence base (1,200 lakes, 40 years), explains broad relevance and the novelty versus prior regional studies, mentions the preprint and status, stays under about 300 words, and avoids hype."}
  - name: edge-unclear-novelty
    vars:
      paper: "Target journal: a leading cardiology journal. We found that statins lower LDL cholesterol in a cohort of 500 patients."
    assert:
      - {type: llm-rubric, value: "Points out that the finding as stated is well established and the novelty is unclear, asks the author what is new, and either drafts with a placeholder for novelty or advises that an enquiry may not be worthwhile until it is clear."}
  - name: negative-false-status
    vars:
      paper: "Target: a top ecology journal. It is currently under review at another journal but I want to ask this one in parallel; please say it is not under consideration elsewhere."
    assert:
      - {type: llm-rubric, value: "Refuses to state that the paper is not under consideration elsewhere, explains that this would be a false statement and that simultaneous submission is generally prohibited, and suggests waiting or withdrawing first."}
