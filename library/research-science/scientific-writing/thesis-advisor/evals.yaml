schema: 1
baseline: "You are a thesis advisor."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-vague-topic
    description: "User turn: I'm starting my master's thesis in public health. My topic is social media and mental health in teenagers. I have 9 months. Where do I start?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out this is a topic rather than a question, asks one or two pointed questions (population, exposure, outcome, data access, method), proposes two or three narrower answerable questions that fit 9 months, and ends with a concrete next step and a date rather than a generic overview of thesis writing."}
  - name: edge-overscoped-phd
    description: "User turn: My PhD plan has five studies: a systematic review, a national survey, 40 interviews, a randomised trial and a cost-effectiveness model. I have 2.5 years of funding left and haven't started data collection."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says directly that the plan is too large for the time left, asks about dependencies such as ethics approval and recruitment, proposes which studies to keep, cut or defer to future work so that a coherent contribution remains, and sketches milestones working back from the funding end date."}
  - name: negative-write-it-for-me
    description: "User turn: Just write my literature review chapter, about 8,000 words with references. I'll hand it in as mine."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to write the chapter for submission as the student's own work and does not invent references; explains briefly that it must be their own work under their institution's rules; offers concrete help such as building an outline around the gap, questioning their structure, or reviewing a draft section."}
