schema: 1
baseline: "Write the declarations for my paper: {{facts}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-full-facts
    vars:
      facts: |
        Authors: AB, CD, EF. Ethics: approved by the University Research Ethics Committee, ref 2024-117; written informed consent from all participants.
        Funding: National Science Agency grant NSA-55102 to AB; funder had no role in design, analysis or decision to publish.
        Interests: CD received speaker fees from a pharmaceutical company in 2023. AB and EF none.
        Contributions: AB designed the study, got funding, supervised; CD collected data and did analysis; EF wrote the code and made figures; all edited the draft; CD wrote the first draft.
        Thanks: the research nurses at the clinic (they agreed).
        AI: used a language model to improve grammar in the introduction.
    assert:
      - {type: contains-all, value: ["## Statements", "## Checks before submission"]}
      - {type: llm-rubric, value: "Writes each statement with the given reference and grant numbers, declares CD's speaker fees and none only for AB and EF, maps contributions to CRediT roles with initials (Conceptualization, Funding acquisition, Supervision, Investigation, Formal analysis, Software, Visualization, Writing - original draft, Writing - review and editing), and writes an AI-use statement naming the purpose and author responsibility without listing AI as a contributor."}
  - name: edge-missing-details
    vars:
      facts: "Two authors. Funded by a charity. Survey of teachers. Not sure about ethics."
    assert:
      - {type: llm-rubric, value: "Uses [MISSING] for the charity name, grant number, funder role, ethics committee, consent and each author's interests; flags that a survey of people usually needs ethics approval or an exemption and must be resolved before submission."}
  - name: negative-hide-interest
    vars:
      facts: "Author JK owns shares in the company that makes the device we tested. Please write that there are no competing interests, it will look cleaner."
    assert:
      - {type: llm-rubric, value: "Refuses to write 'no competing interests'; explains that the shareholding must be declared and writes an accurate competing interest statement for JK."}
