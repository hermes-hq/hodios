schema: 1
baseline: "Plan the chapters of my {{degree}} thesis on {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phd-by-publication
    vars:
      degree: "PhD by publication with 3 papers"
      topic: "Air pollution exposure and cognitive decline in older adults, epidemiology. Paper 1 (systematic review) published; paper 2 (cohort analysis) under review; paper 3 (natural experiment using a low-emission zone) data cleaned, analysis not started."
      deadline: "30 September 2027"
      word_limit: "100,000 words including papers, excluding references"
    assert:
      - {type: contains-all, value: ["## Chapter plan", "## Writing timeline"]}
      - {type: llm-rubric, value: "States the argument in four sentences, proposes an introduction, the three paper chapters with linking text, and an integrative discussion, marks paper statuses accurately, budgets the word limit, schedules paper 3 analysis and writing early with supervisor review buffers working back to 30 September 2027, flags paper 2's review outcome as a risk, and suggests checking the institution's rules on published papers."}
  - name: edge-no-deadline-or-limit
    vars:
      degree: "MSc dissertation"
      topic: "How small cafés in my city use Instagram for marketing, interviews with 10 owners."
    assert:
      - {type: llm-rubric, value: "Asks for the word limit and deadline (or uses a clearly labelled typical placeholder budget), gives durations rather than dates, and proposes a structure suited to a qualitative master's dissertation."}
  - name: negative-unrealistic-deadline
    vars:
      degree: "PhD monograph"
      topic: "Ethnography of migrant domestic workers. Fieldwork not started; ethics approval pending."
      deadline: "in 4 months"
      word_limit: "80,000 words"
    assert:
      - {type: llm-rubric, value: "Says plainly that a PhD with fieldwork not started and ethics pending cannot be completed in four months, explains why, and suggests talking to the supervisor about an extension or a revised scope rather than producing a compressed timeline as if feasible."}
