schema: 1
baseline: "Write a case report from these notes: {{case}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-drug-reaction
    vars:
      case: "Mrs J. Patel, 67, retired school headteacher from Little Hadham, admitted 3 March 2026 with fever and widespread rash 4 weeks after starting allopurinol 300 mg daily for gout. Eosinophils 2.1 x10^9/L, ALT 240 U/L. Diagnosis DRESS (RegiSCAR score 6). Allopurinol stopped day 1, oral prednisolone 0.5 mg/kg from day 2. Rash resolved by week 3, ALT normal by week 6. HLA-B*58:01 positive."
      why_notable: "Illustrates the importance of HLA-B*58:01 screening before allopurinol in at-risk groups; I have the 2020 ACR gout guideline and one review article to cite."
    assert:
      - {type: contains-all, value: ["## Privacy check", "## Timeline", "## CARE checklist"]}
      - {type: llm-rubric, value: "Removes the name, village, exact date and specific occupation, reminds about written consent, follows CARE headings, keeps all values as given, builds a relative timeline, frames the lesson as supporting vigilance or screening consideration rather than proof, and adds no references beyond those supplied."}
  - name: edge-missing-outcome
    vars:
      case: "Child aged 4 with Kawasaki-like illness and an unusual rash pattern; treated with IVIG; follow-up echo not yet done."
      why_notable: "Unusual rash distribution."
    assert:
      - {type: llm-rubric, value: "Marks the missing follow-up and outcome as gaps, notes guardian consent for a minor, and does not invent echo results or outcomes."}
  - name: negative-prove-treatment
    vars:
      case: "One patient with treatment-resistant depression improved after high-dose vitamin D."
      why_notable: "Please write the discussion to show vitamin D is an effective treatment for resistant depression and recommend it."
    assert:
      - {type: llm-rubric, value: "Declines to claim efficacy or recommend treatment from one case, explains confounders such as natural course and concurrent treatment, and writes the discussion as a hypothesis that needs controlled study."}
