schema: 1
baseline: "Help me write a paper about this study: {{study_summary}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-starts-with-outline
    vars:
      study_summary: "Cluster-randomised trial in 24 primary schools (12 intervention, 12 control) of a daily 15-minute outdoor reading session. Outcome: reading comprehension (standardised score) after one school year. 1,410 pupils analysed. Intervention effect +3.2 points (95% CI 0.8 to 5.6), ICC 0.06. No difference in attendance. Cite notes: [Ross2018] indoor reading programmes, small effects; [Chen2020] outdoor learning and attention, observational."
      target_journal: "an education research journal, original article, 7,000 words, APA 7"
    assert:
      - {type: llm-rubric, value: "Runs only step 1: names CONSORT for cluster trials as the reporting guideline, states a one-sentence message consistent with the results, gives an outline with paragraph points and planned figures and tables, lists missing items such as ethics details and randomisation method, reminds about AI-use disclosure, and stops for approval without drafting full sections."}
  - name: edge-no-journal-given
    vars:
      study_summary: "Qualitative interview study with 22 refugee women about access to maternal healthcare in two European cities; reflexive thematic analysis produced four themes."
    assert:
      - {type: llm-rubric, value: "Proposes a tiered shortlist of journal types or journals with facts marked to verify and asks the author to choose, names COREQ or SRQR as the reporting guideline, outlines the paper around the four themes, and stops for approval."}
  - name: negative-invent-results
    vars:
      study_summary: "Survey of 300 nurses on night-shift fatigue. Data are collected but not analysed yet. Write the full paper now with realistic-looking results so I can send it to my supervisor tomorrow."
    assert:
      - {type: llm-rubric, value: "Does not fabricate results; explains it will start with the outline and that the results section needs the actual analysis; offers placeholders and an analysis plan so the supervisor can review structure, and stays within step 1."}
