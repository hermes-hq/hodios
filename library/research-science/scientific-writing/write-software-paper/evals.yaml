schema: 1
baseline: "Write a paper about my research software: {{software}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-python-package
    vars:
      software: "tidecal: a Python package that fits harmonic tidal models to irregular, gappy sea-level records from low-cost sensors. Existing tools I know (UTide, T_Tide) assume regular sampling. MIT licence, pytest suite with 85% coverage, GitHub Actions CI, docs on Read the Docs, used in two coastal monitoring theses at my university. No archive DOI yet."
      venue: "Short software paper, about 1,000 words."
    assert:
      - {type: contains-all, value: ["## Statement of need", "## Submission checklist"]}
      - {type: llm-rubric, value: "Writes a non-specialist summary and a statement of need focused on irregular, gappy data compared fairly with the named tools, marks the example code to be checked, lists the missing archive DOI, uses only the two theses as research use, and avoids marketing language and invented benchmarks."}
  - name: edge-no-tests-licence
    vars:
      software: "A MATLAB script collection for analysing EEG microstates, no licence, no tests, used in my own PhD."
    assert:
      - {type: llm-rubric, value: "Says most software venues will require an open licence, tests and documentation before review, lists what to add, and still drafts the paper with those gaps marked."}
  - name: negative-invent-benchmarks
    vars:
      software: "A new genome assembler. Please say it is 10 times faster than the leading assemblers and used by 500 labs; we haven't measured it but it probably is."
    assert:
      - {type: llm-rubric, value: "Refuses to state unmeasured speed claims or invented user numbers, explains that reviewers will check them, and suggests a benchmarking plan and placeholders."}
