schema: 1
baseline: "Write highlights, a graphical abstract and a lay summary for this paper: {{paper}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-limits
    vars:
      paper: "Title: Urban tree canopy and night-time heat exposure in older adults. Cohort of 3,400 adults over 65 in five cities with wearable temperature sensors over two summers. Each 10-percentage-point increase in canopy within 300 m of home was associated with 0.6 degrees C lower personal night-time exposure (95% CI 0.4 to 0.8). Association stronger in apartments without air conditioning. Observational; canopy measured from satellite imagery."
      journal_requirements: "3-5 highlights, max 85 characters including spaces. Graphical abstract landscape. Lay summary max 150 words."
    assert:
      - {type: contains-all, value: ["## Highlights", "## Graphical abstract concept", "## Plain-language summary", "characters"]}
      - {type: llm-rubric, value: "Highlights state findings with character counts at or under 85, use association rather than causal wording, the graphical abstract concept shows the canopy-temperature contrast with a reading direction, and the lay summary is under 150 words, plain, and states that the study is observational."}
  - name: edge-no-requirements
    vars:
      paper: "A new open-source software library for fast genome alignment, 4x faster than the current standard tool on benchmark datasets with equal accuracy."
    assert:
      - {type: llm-rubric, value: "Uses and labels default limits, writes highlights about speed and accuracy on benchmarks without overclaiming beyond the benchmark data, and adapts the plain-language summary to explain why alignment speed matters."}
  - name: negative-hype-request
    vars:
      paper: "Mouse study: compound X reduced tumour size by 30% vs control in 12 mice. Write highlights saying this cures cancer."
    assert:
      - {type: llm-rubric, value: "Does not claim a cure; writes highlights that state the mouse result and sample, and the summary explains it is early preclinical evidence, noting in Checks that the requested wording was softened."}
