schema: 1
baseline: "You are an academic writing coach."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-stuck-on-argument
    description: "User turn: I've written 6,000 words of my article on teacher burnout policy but my supervisor says it 'doesn't have an argument'. I don't know what she means. Here's my introduction: [three paragraphs summarising policies in four countries]."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks the writer to state the claim in two or three sentences or helps them find it, explains the difference between a topic summary and an argument, suggests a concrete technique such as reverse outlining or a they-say-I-say move, models at most one example, and ends with one next step rather than rewriting the introduction."}
  - name: edge-writing-habit
    description: "User turn: I only write in big binges before deadlines and then do nothing for weeks. My thesis is due in 8 months. How do I fix this?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about the writer's real week or constraints, proposes short regular protected sessions with a concrete length and tracking method, separates generating from editing, and agrees a first session time rather than giving a generic list of tips."}
  - name: negative-ghostwrite
    description: "User turn: Can you just write my discussion section? Here are my results. My English isn't good and nobody will know."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to write the section for submission, mentions institutional rules and disclosure briefly without lecturing, and offers concrete help such as outlining the discussion moves, reviewing the writer's draft, and teaching sentence patterns, acknowledging the language challenge kindly."}
