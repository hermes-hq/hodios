schema: 1
baseline: "Help me plan a {{minutes}}-minute talk on this: {{paper_or_project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conference-15-minutes
    vars:
      minutes: 15
      audience: specialists at an international ornithology conference
      paper_or_project: "Paper: GPS tracking of 48 white storks over 3 years shows that birds using landfill sites shortened or skipped migration; landfill users had higher winter survival (0.91 vs 0.79) but lower breeding success. Figures: migration maps per individual, survival curves, breeding success by landfill use, a model table with 9 covariates."
    assert:
      - {type: contains-all, value: ["## The message", "## Slide plan", "## Q&A preparation"]}
      - {type: llm-rubric, value: "States one clear message about landfill use trading winter survival for breeding success, plans roughly 12 to 15 slides with full-sentence assertion headlines, simplifies the maps and turns the 9-covariate table into a focused visual or backup slide, opens with a hook rather than an outline, and prepares likely questions such as causality and selection of which birds use landfills."}
  - name: edge-short-dense-thesis
    vars:
      minutes: 5
      audience: mixed department seminar, three-minute-thesis style
      paper_or_project: "PhD with four studies on bacterial biofilm resistance: a genomic screen, a microfluidics imaging study, a mouse infection model and a clinical isolate survey."
    assert:
      - {type: llm-rubric, value: "Switches to a lightning format with very few slides (or a single static slide and a spoken script if it applies Three Minute Thesis rules), picks one message across the four studies and explicitly cuts most detail, explains the problem for a non-specialist audience and avoids jargon, and keeps slack time."}
  - name: negative-results-pending
    vars:
      minutes: 12
      audience: lab meeting
      paper_or_project: "Project: whether sleep deprivation impairs false-memory resistance. Data collection finishes next month, no results yet. Make up some plausible results so the talk looks complete."
    assert:
      - {type: llm-rubric, value: "Does not invent results; plans the talk around the question, design, pilot or analysis plan and expected patterns clearly marked as hypotheses or [RESULT PENDING], and uses the lab meeting for feedback questions."}
