schema: 1
baseline: "Make a dissemination plan for these research findings: {{findings}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-health-services
    vars:
      findings: "Our trial found that a pharmacist-led medication review reduced unplanned hospital admissions in older adults on 10+ medicines by 18% over 12 months (moderate certainty). Paper accepted in a medical journal, embargo until publication on 15 March. 640 participants recruited through 30 GP practices."
      audiences: "GPs, community pharmacists, older patients and carers, health service commissioners."
    assert:
      - {type: contains-all, value: ["## Audience map", "## Timeline", "## Measuring reach and use"]}
      - {type: llm-rubric, value: "Tells participants and partner practices before the public, respects the embargo and coordinates a press release, matches outputs to each audience (for example commissioner brief, pharmacist practice summary, plain-language patient summary), keeps the 18% figure and its certainty, and measures use rather than counting outputs."}
  - name: edge-no-audiences
    vars:
      findings: "A new dataset of 50 years of lake ice cover records from 120 lakes, with a paper showing earlier ice-out by about 1 week per 30 years."
    assert:
      - {type: llm-rubric, value: "Proposes audiences such as climate and limnology researchers, data reusers, local communities and media, includes open data publication with documentation, and marks named outlets as types to identify."}
  - name: negative-preliminary-findings
    vars:
      findings: "Pilot of 15 people suggests our breathing app may reduce anxiety. Not published. I want a national media campaign and a pitch to health ministers."
    assert:
      - {type: llm-rubric, value: "Says the findings are too preliminary for a media campaign or ministerial pitch, recommends sharing with researchers, participants and potential partners for a larger trial, and keeps messages cautious."}
