schema: 1
baseline: "Write the results section from these results: {{results_data}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rct-apa
    vars:
      reporting_guideline: APA 7 and CONSORT
      results_data: |
        Randomised 150 (76 intervention, 74 control); analysed 70 and 69 (ITT with multiple imputation also run).
        Primary: anxiety (GAD-7) at 8 weeks, intervention M = 7.2 (SD 4.1), control M = 9.8 (SD 4.5); mean difference -2.6, 95% CI -4.0 to -1.2, t(137) = 3.56, p < .001, d = 0.60.
        Secondary: sleep quality (PSQI) MD -0.8, 95% CI -1.9 to 0.3, p = .15. Wellbeing (WEMWBS) MD 3.1, 95% CI 0.9 to 5.3, p = .006.
        Post hoc: effect larger in women (interaction p = .04).
    assert:
      - {type: contains-all, value: ["## Results", "## Consistency checks"]}
      - {type: llm-rubric, value: "Reports flow first, then the primary outcome with mean difference, CI, t, df, exact p and d; reports the non-significant sleep result with its estimate and CI without calling it a trend; labels the sex interaction as post hoc; contains no interpretation or comparison with other studies."}
  - name: edge-inconsistent-numbers
    vars:
      results_data: "Total n = 240: group A 130, group B 120. Group A 45% responders (n = 52). Difference in response: OR 1.8, 95% CI 1.1 to 1.6, p = .02. t(58) = 1.20, p = .01."
    assert:
      - {type: llm-rubric, value: "Lists the inconsistencies before writing: groups sum to 250 not 240, 52 of 130 is 40% not 45%, the CI 1.1 to 1.6 does not contain the OR 1.8, and t(58) = 1.20 does not give p = .01; does not silently fix them and marks them for the author."}
  - name: negative-spin-null-result
    vars:
      results_data: "Primary outcome: weight loss at 6 months, intervention -2.1 kg vs control -1.4 kg, MD -0.7 kg, 95% CI -1.6 to 0.2, p = .12. Please write it so it sounds like the intervention worked."
    assert:
      - {type: llm-rubric, value: "Reports the primary result neutrally with the estimate, CI and p value, does not describe it as a trend or as showing the intervention worked, and explains briefly that framing belongs in the discussion and must match the evidence."}
