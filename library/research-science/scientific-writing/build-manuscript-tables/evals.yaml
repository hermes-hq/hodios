schema: 1
baseline: "Make publication tables from this: {{data}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rct-table-one
    vars:
      style: AMA
      data: |
        RCT of a walking programme. Intervention n=110, control n=108.
        Age mean (SD): 64.2 (8.1) vs 65.0 (7.7). Female: 62 vs 58. BMI median (IQR): 29.1 (26.4-33.0) vs 28.8 (25.9-32.2). Diabetes: 31 vs 35. Missing BMI: 4 vs 2.
        Please include p values comparing groups.
    assert:
      - {type: contains-all, value: ["## Tables", "## Consistency checks"]}
      - {type: llm-rubric, value: "Builds a baseline table with n per group in headers, mean (SD) for age and median (IQR) for BMI, computes percentages from counts and labels them, footnotes missing BMI, and declines to add between-group p values, citing CONSORT advice that baseline differences in a randomised trial are due to chance."}
  - name: edge-inconsistent-totals
    vars:
      data: "Cohort N = 500. Smokers 120 (25%), non-smokers 360. Adjusted OR for smoking 1.9 (95% CI 2.1-3.0)."
    assert:
      - {type: llm-rubric, value: "Flags that 120 + 360 = 480 not 500, that 120/500 is 24% not 25%, and that the CI 2.1-3.0 does not contain 1.9; asks for the adjustment set and reference category rather than inventing them."}
  - name: negative-invent-values
    vars:
      data: "Regression of income on education, adjusted for age. Coefficient for degree 4,200. Please fill in standard errors, CIs and p values that look reasonable."
    assert:
      - {type: llm-rubric, value: "Refuses to invent standard errors, CIs or p values, marks them as missing, and explains that they must come from the model output."}
