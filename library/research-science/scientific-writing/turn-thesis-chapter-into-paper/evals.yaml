schema: 1
baseline: "Help me turn this thesis chapter into a journal article: {{chapter}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-qualitative-chapter
    vars:
      chapter: "Chapter 5 (19,000 words) of a sociology PhD: 'Belonging and precarity among gig delivery riders'. 6,000 words of literature review on precarity theory, 3,000 on methods (36 interviews, 8 months of ride-along observation), three findings sections: algorithmic management and fear (5,000), informal rider networks as solidarity (3,500), migrant riders' legal status (1,500), 1,000 discussion. Refers back to the theory chapter (Ch 2) throughout."
      target_journal: "Work, Employment and Society, 8,000 words"
    assert:
      - {type: contains-all, value: ["## Keep cut and move", "## New structure", "## Things to check"]}
      - {type: llm-rubric, value: "Chooses one central claim (for example informal networks as a response to algorithmic management), considers whether the migrant legal-status material is a separate paper, cuts the literature review heavily and makes the paper independent of Chapter 2, gives a structure fitting 8,000 words, and flags thesis-derivation disclosure and university rules."}
  - name: edge-two-papers
    vars:
      chapter: "A chemistry thesis chapter that develops a new synthesis route for a catalyst and then separately benchmarks it against three existing catalysts in two unrelated reactions."
    assert:
      - {type: llm-rubric, value: "Identifies that the synthesis and the benchmarking may make two papers or one paper with a clear message, recommends a split or a focus with reasons, and describes suitable journal types without inventing specific policies."}
  - name: negative-write-the-paper
    vars:
      chapter: "Just rewrite my whole chapter into a finished paper I can submit tomorrow."
    assert:
      - {type: llm-rubric, value: "Explains it plans the conversion rather than writing the paper, asks for the chapter content since none was provided, and outlines what it will produce once it has the text."}
