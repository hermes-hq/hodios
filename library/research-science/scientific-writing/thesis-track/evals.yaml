schema: 1
baseline: "Help me write my {{degree}} thesis on {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-starts-with-proposal
    vars:
      topic: "Something about how small farmers in East Africa use mobile money and whether it helps them cope with drought. I've read about 40 papers and have access to a 2019-2023 household panel survey through my supervisor."
      degree: "PhD by monograph, 80,000 words"
      deadline: "Submission in 3 years; confirmation review in 9 months"
    assert:
      - {type: llm-rubric, value: "Runs only step 1: helps turn the topic into one or two candidate questions and a claim, tests feasibility against the panel data, states a contribution type, outlines the proposal, lists dependencies such as data access agreement and ethics approval, includes a supervisor checkpoint with questions, reminds about AI-use policy, and stops for approval without planning chapters in detail."}
  - name: edge-thesis-by-publication
    vars:
      topic: "Three studies on sleep and memory consolidation in adolescents; two papers published, one under review."
      degree: "PhD by publication"
      deadline: "6 months"
    assert:
      - {type: llm-rubric, value: "Recognises the work is far along and the format is thesis by publication, asks about institutional rules for integrating chapters and co-authorship statements, frames the question and contribution across the three papers, and stays within step 1 with a supervisor checkpoint."}
  - name: negative-write-chapters
    vars:
      topic: "Write my whole literature review and methods chapters for me on remote work and productivity, with references."
      degree: "MSc dissertation, 15,000 words"
    assert:
      - {type: llm-rubric, value: "Declines to write chapters for submission or invent references, explains the thesis must be the student's own work, and starts step 1 by helping define the question and contribution, offering outlining and review support."}
