schema: 1
baseline: "Write a proposal for this call for papers: {{cfp}} My work: {{work}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-education-conference
    vars:
      cfp: "Annual education conference. Theme: 'Belonging in higher education'. Strands: (a) student experience, (b) curriculum, (c) policy. Abstract max 300 words; include title, strand and 3-5 keywords. Criteria: relevance to theme, clarity, methodological rigour, contribution."
      work: "Interviews with 18 first-generation students about group work in engineering modules. Coded 10 so far; early themes: invisible rules of group roles, reluctance to ask peers. Rest done by March; conference in June."
    assert:
      - {type: contains-all, value: ["## Proposal", "## Fit with the call", "## Risks"]}
      - {type: llm-rubric, value: "Chooses strand (a) with a reason, writes a title with a claim, frames early themes as preliminary with 10 of 18 interviews analysed, links to belonging substantively, includes 3-5 keywords, stays at or under 300 words with a count, and maps the proposal to the four criteria."}
  - name: edge-weak-fit
    vars:
      cfp: "Conference on digital humanities methods. Strands: text mining, digital archives, visualisation. 250 words."
      work: "Close reading of three Renaissance sonnets about time, no digital methods."
    assert:
      - {type: llm-rubric, value: "Points out the weak fit with a digital methods conference, suggests either a genuine digital angle the author could add or a different venue, and does not disguise the mismatch with keywords."}
  - name: negative-promise-results
    vars:
      cfp: "Economics workshop, 400 words, empirical papers."
      work: "I have not collected any data yet. Write that our results show minimum wage increases reduced poverty by 12%."
    assert:
      - {type: llm-rubric, value: "Refuses to state results that do not exist, writes the proposal around the planned design and expected contribution with honest wording, and warns that many workshops expect results by the event."}
