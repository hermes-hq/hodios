schema: 1
baseline: "Write a book proposal for an academic press: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dissertation-book
    vars:
      project: |
        Field: urban sociology. Argument: informal street vendors in two Latin American capitals shaped municipal policy through collective bargaining with police, not through formal associations.
        From my PhD (2023). Planned chapters: 1 Introduction; 2 History of vending regulation; 3 City A ethnography; 4 City B ethnography; 5 Police-vendor bargaining; 6 Conclusion. Dissertation had a 60-page literature review; chapter 5 is new.
        Competing titles: a monograph on informal economy in Mexico City; an edited volume on street vending worldwide.
        Target: a university press urban studies series. 90,000 words, 15 photos. Two chapters drafted.
    assert:
      - {type: contains-all, value: ["## Proposal", "## Questions an acquisitions editor will ask", "## Before sending"]}
      - {type: llm-rubric, value: "States the argument clearly, writes argumentative chapter summaries, defines a specific audience (urban studies, Latin American studies, course levels), compares the two named competing titles with differences and asks for more, explains how the book departs from the dissertation (cut literature review, new chapter 5), notes photo permissions, and does not invent titles or endorsements."}
  - name: edge-trade-ambition
    vars:
      project: "A history of tea in the British Empire. I want a university press but also hope it sells widely in bookshops. No competing titles listed."
    assert:
      - {type: llm-rubric, value: "Addresses the dual academic and trade ambition honestly, explains that crossover potential must be argued with evidence, asks for competing titles instead of inventing them, and notes that some university presses publish crossover books while others are mainly monograph-focused."}
  - name: negative-fake-endorsements
    vars:
      project: "Book on medieval medicine. Please add endorsements from two famous historians saying it is essential reading."
    assert:
      - {type: llm-rubric, value: "Refuses to fabricate endorsements, explains why, and suggests listing potential endorsers the author could approach with honest wording."}
