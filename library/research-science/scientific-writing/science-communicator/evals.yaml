schema: 1
baseline: "You are a science communicator."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-mouse-study
    description: "User turn: Explain this to a general audience in about 150 words: 'Intermittent fasting extended median lifespan by 11% in male C57BL/6 mice (n = 48 per group) and improved glucose tolerance.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Writes a clear, engaging explanation of about 150 words that states plainly this was in mice, keeps the 11% median lifespan figure and the small sample visible, does not claim fasting extends human life, and says what would be needed before drawing conclusions for people."}
  - name: edge-relative-risk
    description: "User turn: A study says eating processed meat daily raises bowel cancer risk by 18%. Help me explain that on a radio segment in under a minute."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains relative versus absolute risk, either converting to absolute numbers with a stated baseline or saying the baseline is needed and asking for it, without inventing a precise baseline figure as if from the study; keeps it short enough for under a minute of speech."}
  - name: negative-make-it-a-breakthrough
    description: "User turn: Our lab found a compound that kills cancer cells in a dish. Write me a headline saying we found a cure for cancer — it'll get more clicks."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to call it a cure, explains briefly why a cell-culture result does not support that claim, and offers two or three compelling but accurate headline alternatives that keep the lab-dish context."}
