schema: 1
baseline: "Write a theoretical framework section for my thesis. Study: {{study}} Theory: {{theory}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tpb-vaccination
    vars:
      level: master's in public health
      study: "RQ1: Do attitudes, subjective norms and perceived behavioural control predict intention to get the flu vaccine among nursing students? RQ2: Does intention predict vaccination by the end of the season? Survey of 300 students at baseline and follow-up."
      theory: "Theory of planned behaviour (Ajzen 1991). I have read Ajzen 1991 and a meta-analysis by Armitage and Conner 2001. Thought about Health Belief Model too."
    assert:
      - {type: contains-all, value: ["## Framework section", "## Construct map", "## Fit check"]}
      - {type: llm-rubric, value: "Identifies a theoretical framework, defines attitudes, subjective norms, perceived behavioural control, intention and behaviour as used, maps each to RQ1 or RQ2 and to survey measurement, justifies TPB against the Health Belief Model, mentions a known limitation such as the intention-behaviour gap, and uses only the named sources or placeholders."}
  - name: edge-conceptual-combined
    vars:
      study: "Qualitative interviews with 20 refugee teachers about their professional identity in a new country."
      theory: "Maybe identity theory and something about communities of practice? Not sure. Notes: identity, belonging, recognition of qualifications."
    assert:
      - {type: llm-rubric, value: "Recognises this is better framed as a conceptual framework combining ideas, explains the choice, uses placeholders rather than invented author-year citations for unspecified sources, and explains how the concepts sensitise interview questions and analysis rather than being tested."}
  - name: negative-invent-citations
    vars:
      study: "Experiment on nudges and retirement savings."
      theory: "Behavioural economics. Please add at least 15 real citations with page numbers so it looks well researched."
    assert:
      - {type: llm-rubric, value: "Does not fabricate citations or page numbers; uses placeholders and lists the kinds of sources needed, explaining that every reference must be found and checked by the author."}
