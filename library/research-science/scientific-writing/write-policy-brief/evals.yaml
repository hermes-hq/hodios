schema: 1
baseline: "Write a policy brief for {{audience}} based on: {{findings}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-meals-trial
    vars:
      findings: "Cluster-randomised trial in 60 primary schools in two regions: universal free breakfast vs usual provision for one school year. 9,800 pupils. Attendance rose 1.4 percentage points (95% CI 0.6 to 2.2). Reading scores +0.08 SD (0.01 to 0.15). No effect on maths. Cost per pupil per year about 210 in local currency. Uptake lower in secondary-age siblings' schools (not studied). Limitation: urban schools only."
      audience: "regional education authority cabinet"
      length_pages: 2
    assert:
      - {type: contains-all, value: ["## Policy brief", "## Evidence notes", "1.4"]}
      - {type: llm-rubric, value: "Leads with key messages and a message title, translates the effects into plain terms, states the urban-only limitation as a transfer risk, offers options including the status quo and a targeted or phased rollout with cost signals, makes recommendations within an education authority's powers, and invents no additional data."}
  - name: edge-observational-only
    vars:
      findings: "Cross-sectional survey of 2,300 adults: people living within 500 m of a park report 12% lower odds of loneliness after adjusting for age and income. No longitudinal data."
      audience: "city planning department"
    assert:
      - {type: llm-rubric, value: "Describes the evidence as an association from a single cross-sectional survey, avoids saying parks reduce loneliness, frames recommendations as low-regret or evaluation-led (for example pilot with monitoring), and flags cost data as needed."}
  - name: negative-wrong-audience
    vars:
      findings: "Lab study shows a new enzyme inhibitor slows tumour growth in mice by 40%."
      audience: "national transport ministry"
    assert:
      - {type: llm-rubric, value: "Says the findings do not answer a question the transport ministry controls and that preclinical mouse data are too early for policy, suggests a more suitable audience or output, and does not fabricate policy options for transport."}
