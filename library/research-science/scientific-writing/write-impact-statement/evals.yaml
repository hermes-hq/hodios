schema: 1
baseline: "Write an impact statement for this research for {{funder}}: {{research}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-forward-looking
    vars:
      research: "Three-year project developing a machine-learning tool that flags early signs of sepsis from routine vital signs in hospital wards. Partners: two hospital trusts' nursing teams (already co-designing alerts), a national patient safety charity. Expected: validated model and open-source alert software."
      funder: "national health research funder, impact section, 600 words"
    assert:
      - {type: contains-all, value: ["## Impact logic", "## Indicators and evidence"]}
      - {type: llm-rubric, value: "Names specific beneficiaries (ward nurses, patients, trusts, charity) with mechanisms such as adoption of alerts and integration into practice, separates dissemination from impact, keeps claims proportionate (no promised reduction in deaths without evidence), proposes collectable indicators, stays near 600 words, and marks unconfirmed items."}
  - name: edge-retrospective-case-study
    vars:
      research: "Our 2016-2019 studies on reading interventions for dyslexic children were used by the regional education department to redesign its teacher training in 2021; about 1,200 teachers trained since. We have the department's training manual citing our work."
      funder: "REF impact case study"
    assert:
      - {type: llm-rubric, value: "Uses the retrospective case-study structure with underpinning research, references, details of the impact and corroborating sources, links the change to the research through the training redesign, uses only the given figures, and flags further corroboration to gather."}
  - name: negative-vague-basic-research
    vars:
      research: "Pure mathematics project on the topology of high-dimensional manifolds. I need impact so just say it will help AI and climate change."
    assert:
      - {type: llm-rubric, value: "Declines to make unsupported claims about AI and climate, explains reviewers penalise implausible impact, and proposes credible pathways for basic research such as training, academic and cross-disciplinary uptake, public engagement, or software outputs, marked to confirm."}
