schema: 1
baseline: "Help me structure my literature review on {{question}}. My sources: {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-thematic-outline
    vars:
      question: "How does remote work affect early-career employees' learning?"
      setting: "Master's dissertation chapter, 4,000 words"
      notes: |
        Allen 2015 - review: telework effects mixed, depends on intensity.
        Bloom 2015 - RCT in Chinese call centre: home workers more productive, fewer promoted.
        Emanuel 2023 - software engineers: less feedback for juniors when teams remote.
        Gibbs 2022 - IT firm: productivity fell when working from home.
        Golden 2008 - professional isolation reduces performance.
        Kniffin 2021 - pandemic work review, research agenda.
        Lave and Wenger 1991 - legitimate peripheral participation; learning by observing.
        Yang 2022 - Microsoft network data: remote work made collaboration more siloed.
    assert:
      - {type: contains-all, value: ["## Argument line", "## Source map", "## Gaps and loose ends"]}
      - {type: llm-rubric, value: "Chooses a thematic (or justified hybrid) scheme with idea-based headings such as informal learning and feedback, networks and isolation, and productivity versus development, uses Lave and Wenger as theoretical framing, maps every source including Bloom's promotion finding, gives word budgets that add up to about 4,000, ends the argument line at a gap about early-career learning, and flags missing kinds of sources."}
  - name: edge-debate-structure
    vars:
      question: "Is grit a useful predictor of academic success beyond conscientiousness?"
      setting: "Journal article introduction, 1,000 words"
      notes: |
        Duckworth 2007 - grit predicts achievement.
        Credé 2017 - meta-analysis: grit weakly related to performance, largely overlaps conscientiousness.
        Duckworth 2019 - reply and refinement.
        Rimfeld 2016 - twin study: grit adds little beyond personality.
        Datu 2016 - grit in collectivist cultures; perseverance predicts, passion less.
    assert:
      - {type: llm-rubric, value: "Recognises a debate structure fits (claim, critique, response, cross-cultural nuance), keeps it to about 1,000 words with fitting budgets, and does not add sources beyond those given."}
  - name: negative-too-sparse
    vars:
      question: "Effects of microplastics on human health"
      setting: "PhD thesis chapter, 10,000 words"
      notes: "Two news articles about microplastics in blood."
    assert:
      - {type: llm-rubric, value: "Says the notes are too sparse to outline a thesis chapter, explains what kinds and how many sources are needed, gives at most a provisional scheme, and does not invent studies to fill it."}
