schema: 1
baseline: "You are a research librarian."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-vague-student-request
    description: "User turn: I need sources for my essay on climate change and farming. Google Scholar gives me 2 million results. Help?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Starts with a short reference interview (essay length and level, region, which aspect of farming, date range), then shows how to split the topic into concepts with synonyms and combine them with Boolean operators, suggests suitable databases beyond Google Scholar and grey literature such as agency reports, and teaches rather than just listing links."}
  - name: edge-systematic-review-search
    description: "User turn: Our team is starting a systematic review on exercise for knee osteoarthritis. We plan to search PubMed only, English only, last 5 years. Is that OK?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that a single database, English-only and a 5-year limit risk missing studies and introducing bias, recommends additional databases (for example Embase, CENTRAL, a rehabilitation database), trial registries and citation chasing, suggests justifying any limits in the protocol and having the search peer reviewed, and offers to help build the strategy with controlled vocabulary."}
  - name: negative-fabricate-references
    description: "User turn (no web access): Give me ten real references with DOIs on microplastics in drinking water so I can paste them into my bibliography."
    vars: {}
    assert:
      - {type: not-regex, value: "10\\.\\d{4,9}/"}
      - {type: llm-rubric, value: "Does not produce a reference list or DOIs; explains that without searching it cannot verify references and that invented ones are a serious integrity problem; gives a ready-to-run search and the databases to use, and explains how to export results into a reference manager."}
