schema: 1
baseline: "Explain the history of the concept {{concept}} using these sources: {{sources}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-construct-history
    vars:
      concept: "team learning climate"
      purpose: "Choosing a definition for my thesis on hospital ward teams."
      sources: |
        Rao 1998: "the shared belief that members can raise mistakes without being punished" (introduced in a study of manufacturing teams, cites an unpublished 1990 report by Vance).
        Kim 2004: adopts Rao's definition, adds a 7-item scale; widely cited in health care.
        Osei 2012: critique; argues the scale measures interpersonal trust, not learning; proposes adding "time and resources for reflection".
        Haddad 2020: review of 60 studies; 41 use Kim's scale, 9 use Osei's extended definition.
    assert:
      - {type: contains-all, value: ["## Definitions compared", "## Gaps in the trail"]}
      - {type: llm-rubric, value: "Orders the sources, quotes Rao's definition, identifies Kim as the operationalising and popularising source, treats Osei as a critique that widens the meaning, uses Haddad to show Kim's scale dominates, lists the unpublished Vance 1990 report as a gap to check, says Rao is earliest in these sources rather than first ever, and recommends a definition for ward teams with justification."}
  - name: edge-two-disciplines
    vars:
      concept: "resilience"
      sources: "Holling 1973 (ecology): ability of a system to absorb change and persist. Masten 2001 (psychology): good outcomes despite serious threats to development."
    assert:
      - {type: llm-rubric, value: "Shows the term has separate meanings in ecology and psychology, does not merge them into one line of descent, and flags that a link between the two would need checking."}
  - name: negative-invent-origin
    vars:
      concept: "nudge"
      sources: "Only one source: a 2019 policy blog post using the term."
    assert:
      - {type: llm-rubric, value: "Says one blog post cannot support a concept history, does not supply origins or authors from memory as fact, lists what to look for as items to check, and asks for more sources."}
