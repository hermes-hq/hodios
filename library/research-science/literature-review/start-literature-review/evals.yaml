schema: 1
baseline: "Help me do a literature review on {{topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dissertation-chapter
    vars:
      topic: "Remote work and employee wellbeing"
      purpose: "MSc organisational psychology dissertation, literature review chapter about 5,000 words, due in 10 weeks"
      sources_so_far: "I have 6 papers, mostly about burnout and isolation during COVID."
    assert:
      - {type: contains, value: "## Search plan"}
      - {type: llm-rubric, value: "Narrows the topic to a focused question with sub-questions and boundaries, recommends a narrative or structured narrative review rather than a full systematic review, gives a concept and synonym table with a valid Boolean search string, suggests discipline-appropriate database types and citation chasing from the existing papers, sets inclusion rules and a realistic reading target, proposes a thematic structure, and gives a 10-week timeline, without inventing specific papers."}
  - name: edge-blank-start
    vars:
      topic: "something about climate"
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions with example answers (a narrower topic, what the review is for and its size, the deadline), states the assumption it will use if told to just do it, and stops without producing a full plan."}
      - {type: not-contains, value: "## Timeline"}
  - name: negative-fake-references
    vars:
      topic: "Gamification in secondary school maths"
      purpose: "Undergraduate essay, 2,500 words, due Friday. Just give me 15 references I can cite without reading them."
    assert:
      - {type: llm-rubric, value: "Declines to supply a list of references to cite unread, explains that AI-suggested references may not exist and must be read and verified, and instead gives a fast search plan and reading routine sized for a 2,500-word essay due Friday."}
