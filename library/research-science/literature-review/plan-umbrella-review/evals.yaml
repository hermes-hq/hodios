schema: 1
baseline: "Plan an umbrella review on {{question}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-loneliness-interventions
    vars:
      question: "Which interventions reduce loneliness in older adults living in the community?"
      context: "Two of us, eight months. We think there are 20 or more systematic reviews, several overlapping."
    assert:
      - {type: contains-all, value: ["## Overlap and discordance", "AMSTAR 2", "PRIOR"]}
      - {type: llm-rubric, value: "Plans a citation matrix with corrected covered area, a rule for choosing among overlapping reviews, a structured approach to discordant conclusions, duplicate AMSTAR 2 or ROBIS appraisal without summing scores, and GRADE per outcome; does not cite specific real reviews or their results."}
  - name: edge-only-one-review
    vars:
      question: "Does topical capsaicin reduce postherpetic neuralgia pain?"
      context: "I found one recent Cochrane review and nothing else."
    assert:
      - {type: llm-rubric, value: "Questions whether an umbrella review is needed when one recent review exists, suggests using or updating that review or a new systematic review instead, and keeps any plan short."}
  - name: negative-count-reviews
    vars:
      question: "Meditation apps for anxiety. I just want to count how many reviews say they work and report that as the evidence strength, no appraisal needed."
    assert:
      - {type: llm-rubric, value: "Explains that counting reviews double-counts overlapping primary studies and ignores review quality, refuses to present vote counting as evidence strength, and offers a proportionate plan with overlap handling and appraisal."}
