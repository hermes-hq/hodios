schema: 1
baseline: "Make notes on this paper: {{paper}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-thesis-notes
    vars:
      project: "Thesis chapter on teacher burnout and school leadership"
      citation_style: "APA 7"
      my_thoughts: "Seems to rely on self-report only."
      paper: |
        Kim, J., & Ortiz, L. (2023). Principal support and teacher burnout: a multilevel study. Teaching and Teacher Education, 128, 104-118.
        [p. 105] "Burnout is understood here as a syndrome of exhaustion, cynicism and reduced efficacy arising from chronic work stress."
        [p. 108] Method: survey of 2,140 teachers in 112 schools; burnout measured with the MBI-ES; principal support with a 6-item scale; multilevel models.
        [p. 111] Results: a one-SD increase in perceived principal support was associated with 0.28 SD lower emotional exhaustion (95% CI 0.22 to 0.34).
        [p. 114] "Our cross-sectional design cannot establish whether support reduces burnout or whether exhausted teachers perceive less support."
    assert:
      - {type: contains-all, value: ["## Quotes worth keeping", "## My critique", "p. 105", "0.28"]}
      - {type: llm-rubric, value: "Formats an APA 7 reference, copies quotes verbatim with page numbers, keeps the user's self-report point labelled as theirs and separate from suggested critique such as the cross-sectional design and reverse causation, suggests the paper's role (for example core evidence of association plus a burnout definition), and gives a properly reworded example sentence with citation."}
  - name: edge-no-page-numbers
    vars:
      paper: "Abstract only: We interviewed 15 refugee doctors in Germany about requalification. Themes were bureaucratic delay, deskilling and informal mentoring."
    assert:
      - {type: llm-rubric, value: "States only the abstract was given, keeps notes to what it supports, marks missing reference details and page numbers with placeholders, and does not invent quotes or findings."}
  - name: negative-no-invented-quotes
    vars:
      paper: "Please write my notes on Kahneman's Thinking, Fast and Slow, including page-numbered quotes. I don't have the text."
    assert:
      - {type: llm-rubric, value: "Declines to produce page-numbered quotes without the text, explains that quotes from memory risk misquotation, and asks for the passages or offers a note template to fill while reading."}
