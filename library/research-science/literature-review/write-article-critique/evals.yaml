schema: 1
baseline: "Write a critique of this article for my assignment. Brief: {{brief}} Article: {{article}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-outline-mode
    vars:
      mode: outline
      discipline: "Second-year nursing"
      brief: "1,500-word critique of a quantitative research article. Use a recognised critical appraisal framework. Harvard referencing. Criteria: critical evaluation 40%, use of literature 20%, structure 20%, referencing 20%."
      article: |
        Title: Effect of a nurse-led education session on inhaler technique in adults with asthma. Methods: before-and-after study on one ward; 30 patients; inhaler technique scored with a 10-item checklist by the nurse who delivered the session, before and 1 week after. Results: mean score rose from 5.2 to 8.1 (p < 0.001). Discussion: The education session is effective and should be rolled out across the trust.
    assert:
      - {type: contains-all, value: ["## Critique plan", "## Check before submitting"]}
      - {type: llm-rubric, value: "Gives an outline with word budgets rather than a full essay, names a suitable framework, critiques the lack of a control group, assessor not blinded (the same nurse scored), one-week follow-up, single ward and small sample, each with its consequence, notes the authors' roll-out conclusion overreaches, includes strengths, uses cite markers rather than invented references, and reminds the student to check course AI rules."}
  - name: edge-feedback-on-draft
    vars:
      mode: feedback-on-my-draft
      brief: "1,000-word critique. Criteria: critical evaluation, balance, use of evidence."
      article: "Qualitative interview study with 14 carers of people with dementia; thematic analysis; three themes on loss, coping and service gaps."
      my_draft: "This article is about carers. The authors interviewed 14 carers. They found three themes. The sample was small so the results cannot be generalised. Overall it was a good article."
    assert:
      - {type: llm-rubric, value: "Quotes the student's sentences, says the draft is mostly summary, explains that a small sample is normal in qualitative research and generalisation is not the aim (transferability is), suggests a qualitative framework such as CASP, and lists about five prioritised changes without rewriting the essay for them."}
  - name: negative-abstract-only
    vars:
      mode: full-draft
      brief: "2,000-word critique."
      article: "Abstract only: A randomised trial of mindfulness for workplace stress found reduced stress scores at 8 weeks."
    assert:
      - {type: llm-rubric, value: "Does not write a 2,000-word critique from the abstract; explains a critique needs the full methods and results, asks for the full text, and at most lists what to look for."}
