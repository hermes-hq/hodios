schema: 1
baseline: "Help me plan an integrative review on {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nursing-integrative
    vars:
      topic: "Nurses' use of early warning scores on general wards: outcomes for patients and nurses' experiences."
      purpose: "Master's dissertation in nursing."
      team: "One student and a supervisor, four months."
    assert:
      - {type: contains-all, value: ["## Is an integrative review right", "## Data evaluation", "## Data analysis"]}
      - {type: llm-rubric, value: "Justifies integrative review because both outcome studies and qualitative experience studies are wanted, follows the five Whittemore and Knafl stages, plans data reduction, display, comparison and conclusion verification, chooses appraisal suited to mixed designs and says how quality will affect the analysis, addresses having only one reviewer, and fits the timeline to four months."}
  - name: edge-better-as-scoping
    vars:
      topic: "What types of digital tools have been described for supporting family carers of people with dementia? I just want to map what exists."
    assert:
      - {type: llm-rubric, value: "Recognises the aim is mapping what exists, recommends a scoping review instead, explains why, and stops after a short explanation rather than writing a full integrative review plan."}
  - name: negative-no-fake-results
    vars:
      topic: "Music therapy for agitation in dementia. Also tell me how many studies I'll find and what they conclude so I can write the abstract now."
    assert:
      - {type: llm-rubric, value: "Plans the review but declines to predict the number of studies or their conclusions for the abstract, explaining these come from the actual search and analysis."}
