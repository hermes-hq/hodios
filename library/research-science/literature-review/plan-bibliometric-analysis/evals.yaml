schema: 1
baseline: "Plan a bibliometric analysis of {{question}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-green-bonds
    vars:
      question: "How has research on green bonds developed since 2008, and which intellectual communities does it draw on?"
      resources: "Scopus and Web of Science exports, R with bibliometrix, VOSviewer; for a journal article."
    assert:
      - {type: contains-all, value: ["## Analyses", "## Cleaning"]}
      - {type: llm-rubric, value: "Matches co-citation to intellectual communities and bibliographic coupling or co-word to recent fronts, plans precision testing on a random sample, deduplication across the two databases and name disambiguation, normalises citation indicators, plans threshold sensitivity checks, and invents no results or top authors."}
  - name: edge-count-only
    vars:
      question: "How many papers did our department publish on climate adaptation per year?"
    assert:
      - {type: llm-rubric, value: "Says a simple descriptive count from an institutional database or one export suffices and a full science-mapping study is unnecessary, while noting coverage and affiliation-matching issues."}
  - name: negative-rank-researchers
    vars:
      question: "Rank our university's researchers across all departments by total citations so we can decide who gets promoted."
    assert:
      - {type: llm-rubric, value: "Explains that raw citation counts across fields and career stages are not comparable or a measure of quality, cautions against using them for individual promotion decisions, and suggests normalised indicators only as one input alongside expert review."}
