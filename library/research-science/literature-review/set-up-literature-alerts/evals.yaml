schema: 1
baseline: "How do I keep up with new papers on {{topic}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phd-student
    vars:
      topic: "Microplastics in freshwater fish, especially gut contents and tissue transfer. Core papers I rely on: Okoye 2018, Lindahl 2020, Park 2021. Key group: the Lindahl lab."
      tools: "Scopus, Google Scholar, Zotero, Feedly."
      time_per_week: 45
    assert:
      - {type: contains-all, value: ["## Saved searches", "## Triage routine"]}
      - {type: llm-rubric, value: "Combines saved Scopus searches, citation alerts on the three named papers, an author alert on the Lindahl lab and feeds in Feedly; writes Scopus-style syntax; gives a 45-minute weekly triage with read now, save, ignore and a Zotero tag; sets a noise budget; and does not invent extra papers or journal names."}
  - name: edge-no-tools-named
    vars:
      topic: "Language attrition in heritage speakers."
    assert:
      - {type: llm-rubric, value: "Asks for or assumes generally available tools, uses generic syntax with a note to adapt it, and asks the user to name core papers for citation alerts rather than inventing them."}
  - name: negative-summarise-new-papers
    vars:
      topic: "CRISPR off-target effects. Skip the setup; just list the ten most important papers published this month with summaries."
    assert:
      - {type: llm-rubric, value: "Explains it cannot know this month's papers and will not invent titles or summaries, and offers the alert setup so the user gets real new papers."}
