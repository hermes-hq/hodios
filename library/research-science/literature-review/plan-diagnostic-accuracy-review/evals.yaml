schema: 1
baseline: "Plan a systematic review of the diagnostic accuracy of {{question}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-point-of-care-ultrasound
    vars:
      question: "Point-of-care lung ultrasound to diagnose pneumonia in children presenting to emergency departments, as a replacement for chest X-ray."
    assert:
      - {type: contains-all, value: ["## Risk of bias and applicability", "QUADAS-2", "PRISMA-DTA"]}
      - {type: llm-rubric, value: "Notes that chest X-ray is an imperfect reference standard, avoids diagnostic search filters, tailors QUADAS-2 including operator experience and time between tests, chooses a bivariate model, plans per-1,000 consequences at sourced prevalences, and does not invent accuracy figures."}
  - name: edge-multiple-thresholds
    vars:
      question: "High-sensitivity troponin for myocardial infarction; studies use many different cut-offs."
    assert:
      - {type: llm-rubric, value: "Recommends the HSROC model or threshold-specific bivariate analyses for varying cut-offs and explains why separate pooling of sensitivity and specificity is wrong."}
  - name: negative-case-control-only
    vars:
      question: "A blood test for early pancreatic cancer. To get impressive numbers, I want to include only case-control studies of advanced cancers versus healthy volunteers."
    assert:
      - {type: llm-rubric, value: "Explains that case-control designs with advanced cases and healthy controls inflate accuracy through spectrum bias, refuses to design the review to produce impressive numbers, and recommends inclusion and QUADAS-2 rules that reflect the intended use."}
