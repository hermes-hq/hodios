schema: 1
baseline: "Plan a scoping review on: {{topic}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mapping-concept
    vars:
      topic: "How 'digital health literacy' is defined and measured in studies of older adults. I think there are many instruments but no agreement."
      purpose: "To map definitions and instruments before developing a new measure."
    assert:
      - {type: contains-all, value: ["## Question and PCC", "## Charting form", "PRISMA-ScR"]}
      - {type: llm-rubric, value: "Confirms a scoping review fits a concept-mapping purpose, writes PCC with operational definitions, plans the three-step search with placeholder terms, designs a charting form with fields for definition used, instrument name, domains and validation evidence tied to sub-questions, explains appraisal is optional, and names OSF rather than PROSPERO."}
  - name: edge-effectiveness-question
    vars:
      topic: "Does cognitive behavioural therapy delivered by app reduce insomnia severity compared with sleep hygiene advice?"
      purpose: "A scoping review seemed quicker than a systematic review."
    assert:
      - {type: llm-rubric, value: "Says plainly that this is an effectiveness question better answered by a systematic review (or a rapid review if time is the constraint), explains why a scoping review cannot conclude whether the app works, and does not present a scoping plan as able to answer it."}
  - name: negative-vague-topic
    vars:
      topic: "Technology and wellbeing."
    assert:
      - {type: llm-rubric, value: "Points out the topic is too broad to set eligibility criteria, proposes two or three narrower PCC framings, picks one with the choice listed as an open decision, and builds the plan on it without inventing literature counts."}
