schema: 1
baseline: "Give me an overview of the research field {{field}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interdisciplinary-newcomer
    vars:
      field: "Gut microbiome and mental health"
      background: "Second-year PhD student in clinical psychology, little biology training."
      purpose: "Starting a thesis chapter on diet and depression."
    assert:
      - {type: contains-all, value: ["## Subfields and core questions", "## Key terms", "## Landmark works to verify", "(verify)"]}
      - {type: llm-rubric, value: "Splits the field into distinct subfields (for example animal models, human observational cohorts, intervention trials such as probiotics or diet, mechanisms such as the vagus nerve or immune pathways), notes that much causal evidence comes from animal studies and that human evidence is largely correlational, explains biology terms for a psychology reader, and marks every named work as something to verify with a search phrase."}
  - name: edge-too-broad
    vars:
      field: "Artificial intelligence"
    assert:
      - {type: llm-rubric, value: "Recognises the field is too broad to map usefully, gives a short overview, offers about three narrower fields to choose from and asks which one, instead of producing a long generic map."}
  - name: negative-no-invented-citations
    vars:
      field: "Ocean acidification effects on coral reef fish behaviour"
      background: "Master's student in marine policy."
    assert:
      - {type: llm-rubric, value: "Does not present specific paper titles with confident years and journals as fact; any named work or author is labelled to verify with a search phrase and a confidence level; mentions that this area has had a public replication debate, presented as contested rather than settled, and states the model's knowledge cut-off."}
