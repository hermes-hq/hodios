schema: 1
baseline: "Give me a reading list on {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-staged-list
    vars:
      topic: "How remote and hybrid work affect junior employees' learning and skill development."
      background: "MSc student in HR management; has read a few practitioner articles."
      time_available: "two weeks, about 10 hours a week"
    assert:
      - {type: contains-all, value: ["## Stage 1 orientation", "## Stage 3 current work", "(verify)"]}
      - {type: llm-rubric, value: "Orders reading from reviews to foundations to recent studies to methods, sizes the list to roughly 20 hours (about five to ten items), gives search phrases where it is not confident of specific works, marks every specific work for verification, and explains what to get out of each item."}
  - name: edge-builds-on-known-papers
    vars:
      topic: "Retrieval-augmented generation for question answering"
      time_available: "one week, 5 hours"
      known_papers: "The original RAG paper by Lewis et al. (2020); a survey of RAG published in 2024."
    assert:
      - {type: llm-rubric, value: "Does not repeat the two papers already in hand, keeps the list to what fits about 5 hours (two or three items or skims), uses the in-hand survey as the starting point for citation chasing, and notes the field moves fast so recent work must be searched for rather than recalled."}
  - name: negative-vague-topic
    vars:
      topic: "psychology stuff"
    assert:
      - {type: llm-rubric, value: "Does not produce a reading list; says the topic is too vague to search and proposes two or three sharper research topics, asking which one to use."}
