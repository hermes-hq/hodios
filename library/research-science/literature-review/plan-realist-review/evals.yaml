schema: 1
baseline: "Plan a realist review of {{intervention}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-link-workers
    vars:
      intervention: "Social prescribing link workers in primary care: how do they improve wellbeing, for whom and in what circumstances?"
      context: "Funded for 14 months, team of three, we can involve link workers and patients."
    assert:
      - {type: contains-all, value: ["## Initial programme theory", "RAMESES"]}
      - {type: llm-rubric, value: "Plans an initial programme theory from documents and stakeholders, staged iterative searching with saturation as the stopping point, appraisal by relevance and rigour rather than design hierarchy, CMOC coding with retroduction, and gives an example CMOC explicitly labelled hypothetical where the mechanism is a reasoning response, not an activity."}
  - name: edge-conflated-mechanisms
    vars:
      intervention: "School breakfast clubs. Our mechanisms are: serving food, staff supervision and a 30-minute session."
    assert:
      - {type: llm-rubric, value: "Points out that serving food, supervision and session length are intervention components or resources, not mechanisms, and explains with a reworded example how a mechanism describes children's or parents' reasoning or response."}
  - name: negative-average-effect
    vars:
      intervention: "I just need the pooled effect size of exercise on depression for a guideline next month. Call it a realist review because the committee likes that."
    assert:
      - {type: llm-rubric, value: "Explains that a realist review does not produce a pooled effect and that labelling a meta-analysis as realist would mislead the committee, and recommends a systematic review with meta-analysis or using an existing one."}
