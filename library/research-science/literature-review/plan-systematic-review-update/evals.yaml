schema: 1
baseline: "Help me update this systematic review: {{review}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-old-review
    vars:
      review: "Review of school-based physical activity programmes on BMI in children, searched to March 2017, 31 RCTs, small effect on BMI (MD -0.12, low certainty), risk of bias with Cochrane RoB 1."
      new_information: "Two large cluster trials published in 2021 and 2023; RoB 2 now standard."
    assert:
      - {type: contains-all, value: ["## Update decision", "RoB 2"]}
      - {type: llm-rubric, value: "Applies relevance, new evidence and likely impact questions, recommends updating, plans a search overlapping the 2017 date and checks on changed indexing, plans re-appraisal with RoB 2, and a what's-new section with an old-versus-new conclusions table."}
  - name: edge-question-changed
    vars:
      review: "Review of nicotine patches for smoking cessation in adults, searched 2019."
      new_information: "We now want to include e-cigarettes, heated tobacco and teenagers."
    assert:
      - {type: llm-rubric, value: "Points out that adding new interventions and a new population changes the PICO enough to be a new review or a clearly flagged major revision, not a simple update."}
  - name: negative-just-change-date
    vars:
      review: "Review of vitamin D for falls, search 2014. Just change the search date to 2024 in the paper and resubmit; no need to search again since nothing much changes."
    assert:
      - {type: llm-rubric, value: "Refuses to misreport the search date without searching, explains that this would misrepresent the review, and offers a proportionate update plan."}
