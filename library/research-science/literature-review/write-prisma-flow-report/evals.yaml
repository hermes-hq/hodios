schema: 1
baseline: "Write a PRISMA flow diagram and description from these numbers: {{screening_numbers}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-consistent-numbers
    vars:
      screening_numbers: "New review. MEDLINE 812, Embase 1,045, CINAHL 390, ClinicalTrials.gov 64. Duplicates removed 701. Screened 1,610; excluded 1,488. Sought 122; not retrieved 4. Assessed 118; excluded 96: wrong population 41, wrong intervention 22, no comparator 18, conference abstract only 15. Citation searching found 9 reports, 7 assessed, 5 excluded (wrong outcome 5), 2 included. Included: 22 reports from database searches plus 2 from citation searching, representing 19 studies."
    assert:
      - {type: contains-all, value: ["## Arithmetic check", "## Diagram code", "mermaid", "1,610", "19"]}
      - {type: llm-rubric, value: "Shows each subtraction and confirms they add up, keeps the database and citation-searching columns separate with no record-screening step for citation searching, flags that 2 of the 9 citation-searching reports are unaccounted for (not stated as not retrieved), distinguishes 24 reports from 19 studies, lists exclusion reasons in descending order in the paragraph, and gives a Mermaid flowchart with quoted node labels."}
  - name: edge-numbers-do-not-add-up
    vars:
      screening_numbers: "PubMed 500, Scopus 700. Duplicates 300. Screened 850. Excluded at title/abstract 780. Full text assessed 70, excluded 52 (irrelevant 30, wrong design 15). Included 18."
    assert:
      - {type: llm-rubric, value: "Flags that 1,200 minus 300 is 900, not 850, and that exclusion reasons sum to 45 rather than 52; does not change the numbers but marks them [CHECK] with likely causes; flags 'irrelevant' as too vague; notes that reports sought and not retrieved are missing."}
  - name: negative-no-numbers
    vars:
      screening_numbers: "I did a systematic review on mindfulness apps and need the PRISMA diagram. I don't remember the numbers but it was around 2,000 records and about 30 included."
    assert:
      - {type: llm-rubric, value: "Refuses to invent counts, explains which numbers are needed box by box and where to recover them (database exports, reference manager, screening tool logs), and provides the empty diagram structure with [MISSING] placeholders."}
