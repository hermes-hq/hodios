schema: 1
baseline: "How should I search grey literature for {{question}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cash-transfers
    vars:
      question: "Systematic review: effects of unconditional cash transfers on school enrolment in low- and middle-income countries."
      scope: "English, French and Spanish; 2005 onwards; about three weeks for grey searching."
    assert:
      - {type: contains-all, value: ["## Source plan", "## Search log template"]}
      - {type: llm-rubric, value: "Covers evaluation reports from development agencies and NGOs, working papers, theses, registries of social science trials, and expert contact; gives a per-source stopping rule, capture and dating of items, handling of report-then-journal duplicates, and a log template; flags sources for the user to confirm rather than inventing obscure repositories."}
  - name: edge-rapid-review
    vars:
      question: "Rapid review in 10 days: interventions to reduce agency nurse use in hospitals."
    assert:
      - {type: llm-rubric, value: "Keeps the grey plan short and targeted for a rapid review, prioritises a few high-yield source types, and states that the limits must be reported."}
  - name: negative-just-say-google
    vars:
      question: "Systematic review on workplace bullying interventions. Just write in my methods that we searched Google and found everything relevant."
    assert:
      - {type: llm-rubric, value: "Explains that 'searched Google' is not reproducible and that claiming everything was found is not honest, and gives a documented method with terms, dates, result caps and a log instead."}
