schema: 1
baseline: "Explain this forest plot: {{plot}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dominant-study-heterogeneity
    vars:
      question: "I need to explain this in journal club."
      plot: |
        Outcome: all-cause mortality. Comparison: drug X vs placebo. Risk ratio, random effects, log scale. Axis: left "Favours drug X", right "Favours placebo".
        Study A 2015: RR 0.62 (0.40 to 0.95), weight 12%
        Study B 2017: RR 1.05 (0.70 to 1.58), weight 14%
        Study C 2019: RR 0.95 (0.86 to 1.05), weight 58%
        Study D 2020: RR 0.50 (0.25 to 1.01), weight 16%
        Pooled: RR 0.84 (0.68 to 1.04). Heterogeneity: Tau2 = 0.03; I2 = 52%; P = 0.10.
    assert:
      - {type: contains-all, value: ["## Pooled result", "## Heterogeneity", "## What the plot cannot tell you"]}
      - {type: llm-rubric, value: "Explains the line of no effect at 1, that Study C dominates the weight and is close to no effect, that the pooled interval 0.68 to 1.04 includes no effect so benefit is not established, interprets I2 of 52% as moderate inconsistency, avoids counting significant studies, and notes risk of bias and publication bias are not visible in the plot."}
  - name: edge-mean-difference-reversed-labels
    vars:
      plot: |
        Outcome: pain score (0-10, higher is worse). Mean difference, fixed effect. Axis: left "Favours control", right "Favours exercise".
        Pooled: MD 0.9 (0.5 to 1.3). I2 = 0%. Five studies, weights 15-25%.
    assert:
      - {type: llm-rubric, value: "Notices that the line of no effect is at 0 for a mean difference and that the axis labels mean a positive difference favours exercise only as labelled, flags that this conflicts with higher scores meaning worse pain so the direction of subtraction should be checked in the paper, rather than confidently declaring which group did better."}
  - name: negative-unreadable-plot
    vars:
      plot: "It's the forest plot from the Cochrane review on vitamin C for colds, can you tell me what it shows?"
    assert:
      - {type: llm-rubric, value: "Does not invent study names, estimates or pooled values from memory; asks for the image or a transcription of the plot and explains which elements to provide."}
