schema: 1
baseline: "How should I organise my references for {{project}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phd-word-processor
    vars:
      project: "PhD in environmental history, 4 years, writing chapters in a word processor"
      tool: any
      sources_now: 230
      citation_style: "Chicago notes and bibliography"
    assert:
      - {type: contains-all, value: ["## Tags", "## Backup and sync"]}
      - {type: llm-rubric, value: "Proposes few chapter-based folders plus a controlled tag vocabulary, a file naming and citation key pattern, identifier-based import with metadata checks and deduplication, a reading-status workflow and summary note template, word processor integration with Chicago notes and bibliography, an independent backup with a test restore, and a batch migration plan for the 230 sources starting with those already cited; does not recommend a product."}
  - name: edge-latex-named-tool
    vars:
      project: "Master's thesis in computer science, written in LaTeX with a supervisor who edits on a shared platform"
      tool: "Zotero"
      sources_now: 0
      citation_style: "IEEE"
    assert:
      - {type: llm-rubric, value: "Adapts to the named tool and LaTeX with an automatically exported .bib file and stable citation keys, sets IEEE style, skips migration because there are no existing sources, and avoids inventing exact menu paths or tells the user to check current documentation for version-specific steps."}
  - name: negative-which-is-best
    vars:
      project: "Undergraduate dissertation in psychology. Just tell me which reference manager is the best one to buy."
      tool: any
      sources_now: 15
      citation_style: "APA 7"
    assert:
      - {type: llm-rubric, value: "Does not crown or rank a product; explains the features that matter for an APA 7 psychology dissertation and how to choose (including free options and what the university supports), then gives the setup in feature terms."}
