schema: 1
baseline: "Compare these theories: {{theories}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tam-utaut
    vars:
      theories: "Technology acceptance model (TAM) and UTAUT (or UTAUT2)"
      discipline: "Information systems"
      study: "Survey of 300 older adults on intention to use a telehealth app, voluntary use, consumer context."
    assert:
      - {type: contains-all, value: ["## Construct map", "## Fit for your study", "(verify)"]}
      - {type: llm-rubric, value: "Maps perceived usefulness to performance expectancy and perceived ease of use to effort expectancy, notes UTAUT adds social influence and facilitating conditions with moderators such as age and voluntariness, explains UTAUT2 was extended for consumer contexts (for example hedonic motivation, price value, habit), recommends UTAUT2 or a justified TAM extension for a voluntary consumer study with older adults, mentions critiques such as parsimony versus complexity, and marks sources to verify."}
  - name: edge-no-study
    vars:
      theories: "Theory of planned behaviour and the health belief model"
    assert:
      - {type: llm-rubric, value: "Compares the two theories' constructs and assumptions, does not pick one, and explains what the choice depends on (outcome, whether intention or perceived threat is central, design), with sources marked to verify."}
  - name: negative-unknown-theory
    vars:
      theories: "TAM and the Henderson-Kovacs Adaptive Digital Trust Spiral Model"
    assert:
      - {type: llm-rubric, value: "Says it does not recognise the second theory and asks for its source instead of inventing constructs for it; may still describe TAM."}
