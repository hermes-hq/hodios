schema: 1
baseline: "Summarize this paper: {{paper}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-observational-cohort
    vars:
      depth: standard
      purpose: Deciding whether to cite this as evidence that standing desks improve productivity in my office-wellbeing report.
      paper: |
        Title: Sit-stand desk use and self-reported work performance: a 12-month cohort study. Lindqvist A, Okafor B. Occupational Health Review, 2024.
        Methods: We followed 1,204 office workers at three insurance companies in Sweden. Workers chose whether to request a sit-stand desk (n = 412) or not (n = 792). Work performance was measured with the self-reported HPQ scale (0-10) at baseline and 12 months. We used linear regression adjusted for age, sex, job grade and baseline score.
        Results: At 12 months, desk users reported higher performance (adjusted mean difference 0.31 points, 95% CI 0.08 to 0.54, p = 0.008). Sickness absence did not differ (rate ratio 0.94, 95% CI 0.81 to 1.09). 23% of desk users had stopped standing regularly by month 6.
        Discussion: Sit-stand desks improve productivity and should be offered to all office staff. Limitations include self-report measures.
    assert:
      - {type: contains-all, value: ["## Key results", "## Limitations", "0.31", "0.08 to 0.54"]}
      - {type: llm-rubric, value: "Identifies it as an observational cohort with self-selection into desk use, does not say desks cause higher productivity, flags the authors' causal recommendation as going beyond the data, notes the outcome is self-reported, and tells the reader to cite it cautiously as an association."}
  - name: edge-citation-only
    vars:
      paper: "Walker MP et al. (2019). Sleep and memory consolidation. Nature Neuroscience."
    assert:
      - {type: not-contains, value: "## Key results"}
      - {type: llm-rubric, value: "Says it only has a citation, asks for the full text or abstract, and does not invent methods, sample sizes or results."}
  - name: edge-abstract-depth
    vars:
      depth: abstract
      paper: |
        Abstract. We trained a gradient-boosted model on 48,000 retinal photographs from two UK hospitals to detect referable diabetic retinopathy. On an external test set of 6,100 images from a third hospital, sensitivity was 91.2% (95% CI 89.0-93.1) and specificity 87.5% (95% CI 86.5-88.4). Performance dropped in images graded as poor quality (sensitivity 78.4%). Prospective evaluation is needed before clinical use.
    assert:
      - {type: contains-all, value: ["91.2%", "87.5%"]}
      - {type: not-contains, value: "## Method"}
      - {type: llm-rubric, value: "Gives a single short paragraph of roughly 150 words with bold inline labels, states that only the abstract was provided, and mentions the drop in sensitivity on poor-quality images and the need for prospective evaluation."}
