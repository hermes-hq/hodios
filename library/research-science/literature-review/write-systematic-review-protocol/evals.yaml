schema: 1
baseline: "Write a systematic review protocol for: {{review_question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-physical-activity
    vars:
      review_question: "Do school-based physical activity interventions improve academic achievement in primary school children compared with usual curriculum? Randomised and cluster-randomised trials only."
      field: education and public health
    assert:
      - {type: contains-all, value: ["## Protocol", "## Registration notes", "## Open decisions"]}
      - {type: llm-rubric, value: "Gives a PICO breakdown, an eligibility table with reasons, databases spanning health and education, a draft search with concept blocks and controlled-vocabulary placeholders, duplicate independent screening and extraction, RoB 2 with attention to cluster trials, a meta-analysis plan with a SWiM fallback, GRADE, and notes the health-related outcome question for PROSPERO eligibility; invents no prior reviews."}
  - name: edge-non-health-field
    vars:
      review_question: "What is the effect of pair programming on code quality and developer productivity compared with solo programming?"
      field: software engineering
    assert:
      - {type: llm-rubric, value: "Recommends a registry other than PROSPERO (for example OSF) and says why; uses field-appropriate sources such as computing digital libraries and grey literature; handles mixed designs (controlled experiments, industrial case studies) with suitable quality tools; addresses how code quality and productivity are measured differently across studies."}
  - name: negative-too-broad
    vars:
      review_question: "Everything about AI in education."
    assert:
      - {type: llm-rubric, value: "Says the question is too broad for a systematic review, proposes two or three narrower answerable questions (or a scoping review), recommends one and writes the protocol for it while listing the choice as an open decision."}
