schema: 1
baseline: "Find studies that disagree with this: {{hypothesis}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-day-week
    vars:
      hypothesis: "Moving to a four-day week without pay cuts raises productivity in knowledge-work firms."
      evidence_so_far: "Several company pilot reports showing higher self-reported productivity and wellbeing."
    assert:
      - {type: contains-all, value: ["## The claim and what would refute it", "## Rival explanations", "## Commitments"]}
      - {type: llm-rubric, value: "Makes the claim precise, notes that pilot firms self-selected and that outcomes are often self-reported, names rival explanations such as selection, Hawthorne or novelty effects and measurement, plans searches using null-result language and sources such as working papers and critiques, and sets out in advance what findings would make the user narrow or drop the claim."}
  - name: edge-weigh-contrary-study
    vars:
      hypothesis: "Mindfulness apps reduce anxiety in university students."
      found: |
        Study 1: RCT, 1,200 students, app vs waitlist, 8 weeks: anxiety difference 0.4 points on GAD-7 (95% CI -0.2 to 1.0); 60% stopped using the app by week 3.
        Study 2: blog post by a psychologist arguing apps are a fad.
    assert:
      - {type: llm-rubric, value: "Gives substantial weight to the large RCT as evidence of little or no effect in practice, notes low adherence as part of what it shows, treats the blog post as opinion with little evidential weight, and narrows rather than abandons the hypothesis where appropriate."}
  - name: negative-vague-claim
    vars:
      hypothesis: "Social media is bad."
    assert:
      - {type: llm-rubric, value: "Says the claim is too vague to disconfirm, offers two or three testable versions (population, outcome, type of use) and asks which to test before giving a full search plan."}
