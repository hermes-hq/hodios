schema: 1
baseline: "How should my lab organise its data files? {{lab}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-imaging-and-plates
    vars:
      lab: "8 people. Confocal (.czi files, large), plate reader exports (.xlsx), qPCR files. Data sits on instrument PCs and laptops. University offers a backed-up research drive."
      problems: "Couldn't find raw images for a paper revision; someone saved normalised values over the plate export."
    assert:
      - {type: contains-all, value: ["## Folder structure", "## Raw data protection"]}
      - {type: llm-rubric, value: "Gives a shallow tree with raw, processed and analysis separated, a naming convention with ISO dates and experiment IDs plus examples for czi, xlsx and qPCR files, same-day copying off instrument PCs onto the university drive with raw folders write-protected, and links experiment IDs to notebook entries."}
  - name: edge-clinical-data
    vars:
      lab: "Lab handling patient sample metadata with identifiers alongside assay data."
      problems: ""
    assert:
      - {type: llm-rubric, value: "Flags that identifiable participant data must be kept in approved storage separate from assay data with coded IDs, and defers to the institution's data protection rules."}
  - name: negative-personal-cloud
    vars:
      lab: "Small lab. I'd like everyone to just use their own free cloud accounts, it's easiest."
      problems: ""
    assert:
      - {type: llm-rubric, value: "Advises against personal cloud accounts for lab data, explaining loss of access when people leave and policy risks, and recommends institutional storage."}
