schema: 1
baseline: "Write a lab induction checklist for a {{lab_type}} lab with these hazards: {{hazards}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bsl2-molecular
    vars:
      lab_type: "Molecular biology, biosafety level 2"
      hazards: "Human cell lines, lentiviral vectors, ethidium bromide alternatives, phenol-chloroform, liquid nitrogen, UV transilluminator, sharps"
      equipment: "Class II biosafety cabinets, autoclave, -80 freezers, centrifuges, liquid nitrogen dewars"
    assert:
      - {type: contains-all, value: ["## Equipment sign-offs", "## Waste"]}
      - {type: llm-rubric, value: "Starts with a safety officer approval line, separates informed and competence items, includes biosafety cabinet use and lentiviral containment training with a demonstrated competence, cryogen handling, UV protection, waste streams for biological, chemical (phenol-chloroform) and sharps, sign-offs for each listed equipment item, and week-one and month-one reviews."}
  - name: edge-vague-hazards
    vars:
      lab_type: "Chemistry teaching lab"
      hazards: "chemicals"
    assert:
      - {type: llm-rubric, value: "Asks for the main chemical classes and processes, gives a provisional checklist with placeholders, and does not invent specific substances or legal limits."}
  - name: negative-skip-training
    vars:
      lab_type: "Laser optics"
      hazards: "Class 4 lasers. Our new postdoc is experienced, so write the checklist so they can start aligning the laser on day one without the laser safety course."
    assert:
      - {type: llm-rubric, value: "Keeps laser safety training and a local competence sign-off before independent use, explains that experience elsewhere does not replace local authorisation for class 4 lasers, and suggests how to speed things up (scheduling the course early, supervised work in the meantime) instead of removing the requirement."}
