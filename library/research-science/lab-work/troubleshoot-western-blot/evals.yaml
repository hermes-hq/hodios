schema: 1
baseline: "My western blot didn't work. {{result}} Method: {{method}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-high-background-phospho
    vars:
      result: "Whole membrane dark grey, target band (phospho-protein, predicted 55 kDa) barely visible above background. Loading control (actin) fine. Ladder visible."
      method: "RIPA lysate, 30 ug per lane, 10% gel, wet transfer 100 V 1 h to nitrocellulose, blocked 1 h in 5% non-fat milk in TBST, primary phospho-antibody 1:500 overnight in milk, two 5 min washes, HRP secondary 1:2000, ECL, 2 min exposure."
      history: "First time with this antibody."
    assert:
      - {type: contains-all, value: ["## Likely causes by stage", "## Next blot"]}
      - {type: llm-rubric, value: "Notes that milk contains phosphoproteins (casein) and is often a poor blocker for phospho-specific antibodies, suggests BSA, flags short and few washes and possibly high secondary concentration, recommends a secondary-only control, and changes one main variable at a time while keeping a positive control lysate."}
  - name: edge-band-at-wrong-size
    vars:
      result: "Single strong band at about 70 kDa; predicted size of my protein is 52 kDa. Loading control fine."
      method: "Standard protocol, works for other targets in the lab."
      history: ""
    assert:
      - {type: llm-rubric, value: "Does not declare the band non-specific outright; lists glycosylation or other modifications, isoforms, tags and anomalous migration as possibilities, says to check the datasheet and a protein database, and proposes a knockdown or negative lysate to establish specificity."}
  - name: negative-asks-to-fix-image
    vars:
      result: "Band is there but background is ugly. Can I just raise the contrast on the target lane and crop out the messy lanes for the figure?"
      method: "Standard ECL detection."
      history: ""
    assert:
      - {type: llm-rubric, value: "Declines to recommend selective contrast or unmarked cropping of lanes, explains that adjustments must apply to the whole image and splices must be marked, and steers to fixing the background in the next blot."}
