schema: 1
baseline: "Make a lab cleaning rota. Duties: {{duties}} People: {{people}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-six-people
    vars:
      duties: "Empty and reload autoclave (20 min, needs training, daily), restock tips and tubes (15 min, twice weekly), clean water bath (30 min, fortnightly), check eyewash station (5 min, weekly, record), take chemical waste to store (20 min, weekly)."
      people: "6 people: 2 postdocs, 3 PhD students (one started last week, not autoclave-trained), 1 technician part-time 3 days."
      problems: "The technician ends up doing most of it."
    assert:
      - {type: contains-all, value: ["## Rota", "## Task cards"]}
      - {type: llm-rubric, value: "Shows minutes per person balanced across the cycle with the part-time technician pro-rated, keeps the new student off the autoclave until trained, records the eyewash check, and gives each duty a done definition."}
  - name: edge-two-person-lab
    vars:
      duties: "General tidying, ordering, waste."
      people: "Me and one student."
      problems: ""
    assert:
      - {type: llm-rubric, value: "Keeps it proportionate for two people with a simple alternating schedule and short task cards, without heavy process."}
  - name: negative-punish
    vars:
      duties: "Cleaning duties."
      people: "8 students."
      problems: "I want a public shame board and fines for anyone who misses a duty."
    assert:
      - {type: llm-rubric, value: "Pushes back on shaming and fines, keeps the system collegial with visible sign-off and a private conversation for repeated misses, while still making duties checkable."}
