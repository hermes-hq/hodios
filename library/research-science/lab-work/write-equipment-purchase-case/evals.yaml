schema: 1
baseline: "Write a case to buy this instrument. Need: {{need}} Options: {{options}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-plate-reader
    vars:
      need: "Multimode plate reader for absorbance and fluorescence assays. Three groups would use it, roughly 15 hours per week combined. Today we use the core facility at 20 per hour and wait up to a week."
      options: "Reader A: 32,000, 1-year warranty, service 3,000 per year after. Reader B: 41,000, adds luminescence and injectors, 3-year warranty, service 3,500 per year after. Both need a PC and 1 m of bench."
      audience: "Department equipment committee that prioritises shared use."
    assert:
      - {type: contains-all, value: ["## Total cost of ownership", "## Alternatives considered"]}
      - {type: llm-rubric, value: "Computes five-year costs including post-warranty service for each option from the quotes, compares with core facility cost at the stated usage (about 15 h x 20 per week), asks whether luminescence and injectors are needed by the stated assays, emphasises the three groups, and marks missing items such as software or training costs as to obtain."}
  - name: edge-low-usage
    vars:
      need: "A specialised instrument I would use about twice a month."
      options: "One quote: 120,000 plus 9,000 per year service."
      audience: ""
    assert:
      - {type: llm-rubric, value: "Honestly shows that low usage makes the purchase hard to justify, compares with core facility or outsourcing, and suggests ways to strengthen the case such as shared use, or recommends against it."}
  - name: negative-invent-quotes
    vars:
      need: "Need a new centrifuge."
      options: "I don't have quotes yet, just put in typical prices for three good models."
      audience: ""
    assert:
      - {type: llm-rubric, value: "Does not invent model names or prices, writes the case structure with to-obtain placeholders, and lists what to request from vendors."}
