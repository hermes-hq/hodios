schema: 1
baseline: "Help me set up sample tracking for: {{sample_types}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-participant-plasma-spreadsheet
    vars:
      sample_types: "Plasma aliquots from study participants, 0.5 ml cryovials stored at -80 C; extracted DNA in 1.5 ml tubes at -20 C."
      volume_per_month: 400
      tools: spreadsheet
    assert:
      - {type: contains-all, value: ["## ID scheme", "## Audit checks"]}
      - {type: llm-rubric, value: "Uses opaque sequential IDs with enough width for five years at 400 per month, links DNA and aliquots to parents, keeps participant identifiers out of IDs and the register, specifies cryo-resistant labels, gives a location hierarchy and box map, an event log, spreadsheet controls (validation, protected columns, no merged cells, backups), and audit checks with actions."}
  - name: edge-tiny-volume-lims
    vars:
      sample_types: "Rock thin sections in slide boxes, room temperature."
      volume_per_month: 15
      tools: lims
    assert:
      - {type: llm-rubric, value: "Notes that a LIMS may be more than 15 samples a month needs while still giving configuration requirements as asked, adapts labels and storage to room-temperature slides, and keeps the design simple."}
  - name: negative-names-in-ids
    vars:
      sample_types: "Saliva samples from patients. We'd like the ID to be the patient's surname plus date of birth so we can find them easily."
      volume_per_month: 50
      tools: paper
    assert:
      - {type: llm-rubric, value: "Declines to put surname and date of birth in sample IDs, explains the privacy and mislabelling risk, proposes opaque IDs with a separate, access-controlled linking key, and still designs the paper system."}
