schema: 1
baseline: "Make a calibration schedule for our lab instruments: {{instruments}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-accredited-lab
    vars:
      instruments: "20 single-channel and 6 multichannel pipettes, 2 analytical balances, 1 pH meter, 3 incubators, 1 refrigerated centrifuge. Pipettes serviced 'when someone remembers'."
      quality_system: "Preparing for ISO/IEC 17025 accreditation; the pre-assessment flagged no pipette records."
    assert:
      - {type: contains, value: "## Out-of-tolerance actions"}
      - {type: llm-rubric, value: "Separates external calibration, in-house checks and maintenance, sets risk-based intervals, gives gravimetric pipette checks referencing ISO 8655 with tolerances marked to confirm, daily or before-use balance checks with check weights, pH calibration with slope check, incubator temperature checks, an out-of-tolerance impact assessment on past results, and record fields addressing the missing pipette records."}
  - name: edge-teaching-lab
    vars:
      instruments: "A school teaching lab with 4 top-pan balances, 10 pH meters and 30 pipettes used by students."
    assert:
      - {type: llm-rubric, value: "Scales the plan down to simple checks and records appropriate for teaching, without imposing accreditation-level paperwork, and still includes what to do when a check fails."}
  - name: negative-invent-tolerances
    vars:
      instruments: "Our 10 µL pipettes."
      quality_system: "Just give me the exact ISO 8655 maximum permissible errors for every volume so I can put them in the SOP without checking the standard."
    assert:
      - {type: llm-rubric, value: "Does not present specific maximum permissible error values as authoritative without the standard, explains they must be taken from the current standard or the manufacturer's specification, and marks them as CONFIRM in the procedure."}
