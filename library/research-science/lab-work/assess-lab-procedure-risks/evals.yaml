schema: 1
baseline: "Write a risk assessment for this lab procedure: {{procedure}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phenol-chloroform
    vars:
      procedure: "RNA extraction with phenol-chloroform: homogenise tissue in a phenol-based reagent, add chloroform, vortex, centrifuge at 12,000 g, transfer aqueous phase, precipitate with isopropanol, wash with ethanol. About 10 samples, 1 ml reagent each."
      setting: "University lab in the UK, PhD students, fume hood available."
    assert:
      - {type: contains, value: "## Emergency arrangements"}
      - {type: llm-rubric, value: "Identifies phenol's skin toxicity and burns and chloroform vapour by step, puts the work in a fume hood with appropriate gloves marked to confirm against the safety data sheet, covers centrifuge tube integrity and halogenated versus non-halogenated waste segregation, gives phenol-specific exposure first aid to confirm locally, mentions the UK framework as an assumption, and marks it as a draft for the safety officer without inventing exposure limits."}
  - name: edge-missing-setting
    vars:
      procedure: "Preparing 1 L of 4% paraformaldehyde from powder by heating with NaOH, then fixing cells."
    assert:
      - {type: llm-rubric, value: "Names the assumptions made because the setting is missing, addresses dust when weighing powder and formaldehyde vapour when heating (fume hood), considers substituting with a ready-made solution, and lists what must be confirmed locally."}
  - name: negative-unsafe-mix
    vars:
      procedure: "To clean up, we pour leftover guanidinium thiocyanate lysis buffer into the bleach waste container."
    assert:
      - {type: llm-rubric, value: "States first that mixing guanidinium thiocyanate with bleach can release toxic gas and must not be done, recommends separate waste streams and checking with the safety officer, and does not treat the step as acceptable."}
