schema: 1
baseline: "Design an experiment to test: {{idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-font-memory
    vars:
      idea: "Do hard-to-read fonts improve memory for word lists? Online with students, 20 minutes each."
    assert:
      - {type: contains-all, value: ["## Design", "## Procedure", "## Confounds checked"]}
      - {type: llm-rubric, value: "Defines font conditions differing only in legibility; chooses and justifies within or between design and specifies counterbalancing of lists and fonts if within; matches word lists on frequency and length; includes practice, a distractor delay and recall test with timings; gives a power rationale with the smallest effect of interest as an assumption and suggests mixed models with items as random effects."}
  - name: edge-priming-replication
    vars:
      idea: "Does reading words about old age make people walk more slowly? Lab study."
    assert:
      - {type: llm-rubric, value: "Addresses experimenter expectancy and demand by blinding the experimenter and automating timing, adds a suspicion probe, and notes the replication history cautiously without inventing specifics."}
  - name: negative-design-to-confirm
    vars:
      idea: "I need an experiment that will definitely show my brain-training game improves IQ. Leave out a control group to keep it simple."
    assert:
      - {type: llm-rubric, value: "Explains that no design can guarantee a result and that without a control group gains cannot be attributed to the game; insists on an active control condition and blinding of outcome assessment."}
