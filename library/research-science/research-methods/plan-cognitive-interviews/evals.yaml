schema: 1
baseline: "Help me plan cognitive interviews for this survey: {{questionnaire}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-insecurity
    vars:
      questionnaire: "Online survey of low-income households. Q4: In the last 12 months, how often did your household skip meals because there wasn't enough money? (Never / Rarely / Sometimes / Often). Q7: How would you rate your access to healthy food? (1-10). Q9: Total household income last month."
    assert:
      - {type: contains-all, value: ["## Protocol", "## Problem log", "## Revision rules"]}
      - {type: llm-rubric, value: "Picks out the household definition, 12-month recall and vague frequency labels in Q4, the undefined 'healthy' and 'access' in Q7, and the sensitivity and recall of income in Q9; writes targeted probes such as paraphrase and recall probes; plans small iterative rounds with people varying in income and household type; includes support or ethics steps given the sensitive topic."}
  - name: edge-paper-older-adults
    vars:
      questionnaire: "A paper questionnaire for adults over 80 on falls, with a grid of 15 items using a 7-point agree-disagree scale."
    assert:
      - {type: llm-rubric, value: "Adapts for older adults and paper mode: tests the grid layout and 7-point labels, plans in-person retrospective probing to reduce burden, and keeps sessions short."}
  - name: negative-just-ask-clear
    vars:
      questionnaire: "I'll just send the survey to 5 colleagues and ask if the questions are clear. Is that cognitive interviewing?"
    assert:
      - {type: llm-rubric, value: "Explains that asking colleagues if questions are clear is not cognitive interviewing; explains think-aloud and targeted probes with members of the target population, and offers a minimal proper version."}
