schema: 1
baseline: "Which research philosophy should I use for this study? {{study}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interview-study
    vars:
      study: "MBA dissertation. RQ: How do middle managers make sense of a merger in a UK bank? 15 semi-structured interviews, thematic analysis. My supervisor wants the research onion layers covered. I wrote that my findings will generalise to all banks."
      word_limit: "600"
    assert:
      - {type: contains-all, value: ["## Recommended position", "## Draft section"]}
      - {type: llm-rubric, value: "Recommends an interpretivist or constructivist position (or justifies an alternative) tied to the sense-making question; maps to the onion layers; flags the claim of generalising to all banks as inconsistent and suggests transferability language; uses citation placeholders instead of invented references."}
  - name: edge-mixed-methods
    vars:
      study: "Education PhD. Phase 1 survey of 400 teachers on technology use; phase 2 interviews with 12 to explain survey patterns."
    assert:
      - {type: llm-rubric, value: "Compares pragmatism with at least one alternative such as critical realism for an explanatory sequential mixed-methods design, explains how quality criteria differ across phases, and recommends one with reasons."}
  - name: negative-pick-any
    vars:
      study: "I have no research questions yet. Just tell me positivism or interpretivism, whichever sounds smarter, and write 1,000 words."
    assert:
      - {type: llm-rubric, value: "Explains that the philosophy should follow from the questions and that neither sounds smarter; asks for the questions or methods, or explains how the choice would differ under two example questions, rather than writing a generic 1,000-word section."}
