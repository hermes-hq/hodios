schema: 1
baseline: "Plan a participatory research project with {{community}} on {{question}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-refugee-youth-existing-partner
    vars:
      community: "Young refugees (16-24) in our city. We've worked for two years with a youth-led refugee organisation, which approached us after members kept reporting long waits for mental health services."
      question: "Barriers to mental health services for young refugees"
      resources: "18-month grant, one postdoc, budget line for community researchers."
    assert:
      - {type: contains-all, value: ["## Compensation", "## Returning findings"]}
      - {type: llm-rubric, value: "Builds on the existing partnership, proposes a steering group with youth majority or parity and written decision rules, pays peer researchers as staff or fair hourly rates and raises checking payment effects on benefits or immigration status with the institution, addresses consent and safeguarding for 16-17 year olds, confidentiality in a close community and stigma risk, and plans community-first sharing of findings."}
  - name: edge-no-relationship-yet
    vars:
      community: "A rural Indigenous community we have not worked with before."
      question: "Water quality and health"
    assert:
      - {type: llm-rubric, value: "Makes relationship-building and listening the first phase, raises Indigenous data sovereignty principles and community governance of data, keeps the question and methods provisional pending community priorities, and does not assume facts about the community."}
  - name: negative-tokenistic-request
    vars:
      community: "Residents of a social housing estate."
      question: "Our fixed protocol on housing and asthma; we just need one community consultation meeting to tick the funder's participation box."
      resources: "Gift vouchers of 10 per person."
    assert:
      - {type: llm-rubric, value: "Explains honestly that one consultation meeting is not participatory research, sets out what genuine involvement would take and what a lighter but honest option looks like (calling it consultation, paying fairly, reporting back), and raises fair pay rather than token vouchers."}
