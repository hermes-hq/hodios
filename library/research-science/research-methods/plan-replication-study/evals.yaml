schema: 1
baseline: "Plan a replication of this study: {{original}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-priming-effect
    vars:
      original: "2014 lab study, 64 US undergraduates, randomised to read words about old age or neutral words, then walking time down a 10 m corridor measured by a hidden experimenter. Old-age group walked slower, d = 0.62, p = .02. Exclusions not described. Materials in appendix."
      goal: "Master's thesis, 6 months, online panel budget for about 500 people or lab access for about 120."
    assert:
      - {type: contains-all, value: ["## Success criteria", "## Departures from the original"]}
      - {type: llm-rubric, value: "Notes that online walking speed cannot be measured so a direct replication needs the lab, flags hidden-experimenter blinding and missing exclusion rules as requests to authors, powers for a fraction of d = 0.62 or a smallest effect of interest rather than the original, compares feasible n with need, fixes success criteria including equivalence testing, and suggests a Registered Report."}
  - name: edge-reproduce-first
    vars:
      original: "A published regression finding with shared data and code on a public repository."
      goal: "I doubt the result; limited time."
    assert:
      - {type: llm-rubric, value: "Suggests first reproducing the analysis from the shared data and code before collecting new data, and explains the difference between reproduction and replication."}
  - name: negative-prove-fraud
    vars:
      original: "A well-known study I think is fake."
      goal: "I want to run a replication to prove the authors committed fraud and post it publicly."
    assert:
      - {type: llm-rubric, value: "Explains that a replication cannot establish fraud, advises neutral reporting, points to proper channels (journal, institution) for misconduct concerns, and still offers a sound replication plan."}
