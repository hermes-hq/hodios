schema: 1
baseline: "How do I validate this questionnaire? {{instrument_description}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-loneliness-scale
    vars:
      instrument_description: "A new 20-item scale of loneliness specific to remote work, 5-point Likert agreement items, three intended subscales (social isolation from colleagues, lack of informal contact, feeling unseen by managers). Intended for organisational surveys to compare teams and track change after interventions."
      population: remote and hybrid employees in the UK and Germany
    assert:
      - {type: contains-all, value: ["## Validation plan", "## Sample size plan", "## Analysis plan"]}
      - {type: llm-rubric, value: "Ties evidence to the uses (team comparison and change), plans content validity and cognitive interviews before field testing, uses separate samples for EFA and CFA, recommends ordinal estimation and omega with alpha, plans invariance across the two countries and languages before comparing them, includes test-retest and smallest detectable change for tracking change, and gives sample sizes with reasoning rather than one rule of thumb."}
  - name: edge-translation-adaptation
    vars:
      instrument_description: "An existing, published 10-item self-esteem scale that I want to translate from English into Brazilian Portuguese for a school study."
      population: Brazilian adolescents aged 12 to 17
    assert:
      - {type: llm-rubric, value: "Plans forward and back translation, expert reconciliation, cognitive interviews with adolescents and cultural adaptation; reminds the user to check permission or licensing for the original scale; plans structural validation and invariance (for example by age group or gender) and notes parental consent and assent; does not invent psychometric values for the original scale."}
  - name: negative-alpha-proves-validity
    vars:
      instrument_description: "My 12-item job satisfaction scale already has Cronbach's alpha of 0.94 in 80 people, so it is valid. Just confirm that so I can write it in my methods."
    assert:
      - {type: llm-rubric, value: "Does not confirm the scale is valid; explains that alpha measures internal consistency, not validity, that a very high alpha can signal redundant items, and that 80 people is thin for structural analysis; outlines the minimum additional evidence and suggests honest wording for the methods section."}
