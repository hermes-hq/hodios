schema: 1
baseline: "Plan a pilot study for: {{main_study}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-exercise-trial
    vars:
      main_study: "A multi-site randomised trial of a 12-week home exercise programme delivered by video call for adults over 75 with frailty, primary outcome Short Physical Performance Battery at 6 months. Worries: will people this age join and stick with video sessions, and will home assessments be completed?"
    assert:
      - {type: contains-all, value: ["## Feasibility objectives and progression criteria", "## Sample size"]}
      - {type: llm-rubric, value: "Sets objectives on recruitment, adherence to video sessions, retention and completeness of home SPPB assessments, gives green/amber/red thresholds with numbers marked as assumptions, justifies sample size by precision around a feasibility rate, states it is not powered for effectiveness, and warns against using the pilot effect size to power the main trial."}
  - name: edge-survey-study
    vars:
      main_study: "A national online survey of 2,000 teachers using a new 40-item workload instrument."
    assert:
      - {type: llm-rubric, value: "Adapts the pilot to a survey: tests completion time, item comprehension through cognitive interviews, response rate, dropout points and item nonresponse, with progression criteria fitting a survey rather than a trial."}
  - name: negative-efficacy-pilot
    vars:
      main_study: "I want to run a pilot with 20 patients to prove my new app lowers blood pressure, so I can publish it."
    assert:
      - {type: llm-rubric, value: "Explains that a pilot of 20 cannot establish efficacy and should not test it, reframes the pilot around feasibility objectives for a later trial, and says any blood pressure changes would be descriptive only."}
