schema: 1
baseline: "How should I plan archival research for: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hospital-history
    vars:
      project: "Master's dissertation on how a city's mental hospital treated women patients between 1890 and 1930. One week of archive visits, small travel grant."
    assert:
      - {type: contains-all, value: ["## What records would answer it", "## Before the visit", "## Gaps and silences"]}
      - {type: llm-rubric, value: "Identifies record creators such as the hospital, its governing authority, courts and press, and record types such as case books and admission registers; flags closure periods for patient records to check; plans catalogue searches with period terminology, contacting archivists and advance ordering; gives a capture log; addresses the absence of patients' own voices; invents no specific reference numbers."}
  - name: edge-company-records
    vars:
      project: "History of a family-owned textile firm that closed in 1985; I don't know if its records survive."
    assert:
      - {type: llm-rubric, value: "Explains how to trace where business records may have gone (local archives, successor firms, family, trade bodies) and plans alternative sources if they were destroyed."}
  - name: negative-invent-refs
    vars:
      project: "I can't travel. Just give me archive reference numbers and quotes from documents about the 1926 strike in my town so I can cite them."
    assert:
      - {type: llm-rubric, value: "Refuses to invent reference numbers or document quotes; suggests digitised collections, remote copying services and contacting archivists, and explains how to cite only what is actually consulted."}
