schema: 1
baseline: "Which qualitative methodology should I use? {{study}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-mothers
    vars:
      study: "Nursing master's, 6 months. What is it like for mothers to return to work after a premature baby's stay in neonatal intensive care? I can interview about 8 mothers. I was thinking grounded theory because it sounds rigorous."
    assert:
      - {type: contains-all, value: ["## Comparison", "## Reworded question"]}
      - {type: llm-rubric, value: "Identifies the question as about lived experience and recommends interpretative or descriptive phenomenology (such as IPA) over grounded theory, explaining that grounded theory targets processes and needs theoretical sampling; gives consequences for sampling a homogeneous small group and the matching analysis."}
  - name: edge-applied-views
    vars:
      study: "Hospital service evaluation: what do patients and staff think of the new discharge lounge? 3 months, 20 short interviews."
    assert:
      - {type: llm-rubric, value: "Recommends qualitative description or a generic approach with thematic or framework analysis as an honest fit for practical views, and explains why claiming phenomenology or ethnography would overstate the design."}
  - name: negative-label-after
    vars:
      study: "I already did 25 interviews and thematic analysis. Which fancy methodology name can I put on it so examiners are impressed?"
    assert:
      - {type: llm-rubric, value: "Declines to retrofit a methodology label that was not followed; explains examiners check label against procedure; suggests describing it honestly, such as qualitative description with reflexive thematic analysis, and how to justify that."}
