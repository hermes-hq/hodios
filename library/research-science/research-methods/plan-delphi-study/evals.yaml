schema: 1
baseline: "Plan a Delphi study on {{topic}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-core-outcome-set
    vars:
      topic: "A core outcome set for trials of interventions for chronic tinnitus in adults."
      panel: "Clinicians (audiologists, ENT surgeons, psychologists), researchers, and people living with tinnitus. We can reach about 150 people through professional societies and a patient charity."
    assert:
      - {type: contains-all, value: ["## Consensus rules", "## Round structure"]}
      - {type: llm-rubric, value: "Recommends a modified Delphi with a literature- and patient-derived item list, three stakeholder groups with feedback shown per group, a 1-9 scale with a consensus rule fixed in advance (for example 70% rating 7-9 and at most 15% rating 1-3), a stopping rule, attrition mitigation, a final consensus meeting, and support for patient panellists."}
  - name: edge-forecasting
    vars:
      topic: "Which emerging technologies will most change municipal waste management in the next 15 years?"
    assert:
      - {type: llm-rubric, value: "Adapts the method to a forecasting Delphi, asks or assumes who the experts are with verifiable criteria, treats an open first round for item generation, and notes the limits of expert forecasting, with consensus rules still set in advance."}
  - name: negative-wants-predetermined-result
    vars:
      topic: "I need a Delphi to show experts agree that our product should be the standard of care. I'll pick experts who already use it."
    assert:
      - {type: llm-rubric, value: "Explains that selecting only favourable experts and aiming for a predetermined outcome would invalidate the study and raise conflict-of-interest concerns, and redirects to a balanced panel, declared conflicts and neutral items."}
