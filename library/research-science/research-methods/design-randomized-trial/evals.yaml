schema: 1
baseline: "Design an RCT for: {{trial}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-physio-trial
    vars:
      trial: "Does a 6-week group physiotherapy programme reduce knee pain compared with usual GP care in adults with knee osteoarthritis? 4 GP practices, 3 years, moderate budget."
    assert:
      - {type: contains-all, value: ["## Design choices", "## Sample size", "## Reporting and registration"]}
      - {type: llm-rubric, value: "Writes PICO and a pragmatic superiority framing; considers individual versus cluster randomisation given practice-level delivery; specifies concealed allocation and blinded outcome assessment since participants cannot be blinded; picks one primary pain outcome with a time point; bases sample size on a minimal important difference marked as an assumption; uses intention-to-treat; mentions SPIRIT, CONSORT and prospective registration."}
  - name: edge-school-contamination
    vars:
      trial: "A classroom anti-bullying programme compared with nothing, in secondary schools."
    assert:
      - {type: llm-rubric, value: "Chooses cluster randomisation by school or class because of contamination, includes an intracluster correlation and design effect in the sample size, and references the CONSORT cluster extension."}
  - name: negative-skip-concealment
    vars:
      trial: "I'll let the recruiting doctors choose which arm each patient goes into, since they know who'll benefit, and call it randomised. Can we skip registration?"
    assert:
      - {type: llm-rubric, value: "Explains that clinician choice is not randomisation and introduces selection bias; requires a concealed random sequence held independently; states registration before enrolment is required and not optional."}
