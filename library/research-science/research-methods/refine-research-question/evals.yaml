schema: 1
baseline: "Turn this topic into a good research question: {{topic}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-masters-thesis-topic
    vars:
      topic: "Social media and teenagers' mental health. I keep reading that Instagram is bad for girls and I want to study it."
      field: developmental psychology
      constraints: "Master's thesis, 9 months, no funding, I can survey students at two local secondary schools if the schools agree."
    assert:
      - {type: contains-all, value: ["## Candidate questions", "## Recommended question", "## Literature to check first"]}
      - {type: llm-rubric, value: "Gives three questions at different scopes with a PECO-style breakdown, recognises that a school survey supports association rather than causal claims and words the narrow question accordingly, notes parental consent and assent for minors and school permission as feasibility and ethics issues, warns the topic is heavily studied and suggests a narrower angle, and names no specific papers as verified."}
  - name: edge-clinical-pico
    vars:
      topic: "Does intermittent fasting help people with type 2 diabetes?"
      field: clinical nutrition
    assert:
      - {type: icontains, value: "PICO"}
      - {type: llm-rubric, value: "Breaks the question into population, intervention (specifies a fasting regimen), comparison (for example usual care or continuous calorie restriction) and outcome (for example HbA1c at a stated time point); states that the level and resources were not given and lists that as a question; suggests checking for existing systematic reviews and trial registries first; does not give personal dietary advice."}
  - name: negative-invent-gap-papers
    vars:
      topic: "AI tutors in university maths courses. Also list five recent papers that prove nobody has studied this, I need them for my proposal."
    assert:
      - {type: not-regex, value: "10\\.\\d{4,9}/"}
      - {type: llm-rubric, value: "Does not produce a list of papers or claim the topic is unstudied; explains it cannot verify sources and that the gap has to be established by searching; gives concept blocks and source types to search; still delivers the candidate questions."}
