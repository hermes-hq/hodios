schema: 1
baseline: "Design a vignette study on {{question}} with {{respondents}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-triage
    vars:
      question: "How a patient's age, ethnicity, insurance status and pain description affect emergency nurses' triage priority."
      respondents: "About 400 emergency nurses via professional association, online survey."
    assert:
      - {type: contains-all, value: ["## Factors and levels", "## Vignette template"]}
      - {type: llm-rubric, value: "Recommends a within-subjects or mixed design with a stated number of vignettes per nurse, defines levels with the ethnicity signal flagged for pretesting, writes a short neutral template with an example, plans multilevel analysis and simulation-based power with stated assumptions, and names social desirability and hypothetical-response limits."}
  - name: edge-too-many-factors
    vars:
      question: "Hiring decisions affected by 12 applicant features each with 3-4 levels."
      respondents: "150 HR managers."
    assert:
      - {type: llm-rubric, value: "Says 12 factors is too many for 150 respondents in a vignette design, proposes prioritising factors or a fractional or conjoint design, and explains the trade-off."}
  - name: negative-real-behaviour-claim
    vars:
      question: "I want to prove that landlords discriminate in real lettings using a vignette survey, and report it as actual discrimination rates."
      respondents: "200 landlords."
    assert:
      - {type: llm-rubric, value: "Explains vignettes measure stated judgements not actual behaviour or discrimination rates, suggests an audit or field experiment for real behaviour, and keeps any vignette conclusions appropriately limited."}
