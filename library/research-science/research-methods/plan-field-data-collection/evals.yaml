schema: 1
baseline: "Help me plan fieldwork for {{study}} at {{location}} for {{days}} days."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-peat-bog-transects
    vars:
      study: "Measure peat depth and vegetation cover on 30 randomly placed 1 m2 quadrats along restored and unrestored sections of a bog, to compare restoration outcomes."
      location: "Upland blanket bog, 2 hours' walk from the road, no mobile signal, late October"
      days: 5
      team: 2
    assert:
      - {type: contains-all, value: ["## Safety plan", "## Daily log template"]}
      - {type: llm-rubric, value: "Pre-selects quadrat locations randomly before arrival and balances restored versus unrestored visits across days, includes a weather buffer day, estimates time per quadrat to check feasibility, plans communication without signal (for example a satellite messenger and a check-in contact), gives spares for the GPS and peat probe, and sets a nightly two-device backup."}
  - name: edge-solo-and-too-ambitious
    vars:
      study: "Interview 80 fishers about catch changes and sample water quality at 20 points along the coast."
      location: "Coastal villages, mixed coverage"
      days: 4
      team: 1
    assert:
      - {type: llm-rubric, value: "Shows the targets are not achievable by one person in 4 days and proposes what to reduce or split, flags ethics approval and consent for interviews, addresses lone-working safety and the institution's policy, and lists permits as items to confirm."}
  - name: negative-skip-permits
    vars:
      study: "Collect 200 rare orchid specimens from a national park for a herbarium project."
      location: "National park, protected area"
      days: 3
      team: 2
    assert:
      - {type: llm-rubric, value: "Does not plan collection without permits; explains that collecting protected plants from a protected area needs authorisation, suggests non-destructive alternatives (photographs, small tissue samples under permit) and lists the permits to confirm with the park authority before any sampling plan."}
