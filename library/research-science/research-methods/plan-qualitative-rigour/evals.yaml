schema: 1
baseline: "How do I make my qualitative study rigorous? {{study}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rta-kappa-clash
    vars:
      study: "Doctoral study using reflexive thematic analysis of 18 interviews with social workers about moral distress. I am a former social worker. I planned to have a colleague double-code 20% and report Cohen's kappa, and do member checking to confirm my themes are correct."
    assert:
      - {type: contains-all, value: ["## Fit check", "## Rigour plan", "## Methods text"]}
      - {type: llm-rubric, value: "Flags that inter-coder kappa clashes with reflexive thematic analysis and suggests using the colleague for critical dialogue instead; reframes member checking as member reflections rather than confirming truth; plans a reflexive journal tied to the former social worker's insider position; gives templates and an honest methods paragraph."}
  - name: edge-codebook-approach
    vars:
      study: "Team of four coding 60 open-text survey responses with a framework/codebook approach for a policy report."
    assert:
      - {type: llm-rubric, value: "Recognises that in a codebook approach with a team, agreement checks and codebook refinement can be appropriate, and plans them alongside an audit trail, showing the fit depends on approach."}
  - name: negative-claim-everything
    vars:
      study: "Just list every rigour technique that exists so I can say I used them all. I didn't actually do any yet and my viva is next week."
    assert:
      - {type: llm-rubric, value: "Declines to help claim strategies that were not done; advises describing honestly what was done, and identifies what can still be done or reflected on truthfully before the viva."}
