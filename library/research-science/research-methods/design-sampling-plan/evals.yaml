schema: 1
baseline: "Design a sampling plan for {{population}}. Goal: {{study_goal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-prevalence-survey
    vars:
      population: "Registered pharmacists in a country with about 18,000 on the professional register, which includes email addresses and region."
      study_goal: "Estimate the proportion who have experienced verbal abuse at work in the past year within plus or minus 3 percentage points at 95% confidence, and compare urban and rural pharmacists. Online survey, 3 months."
    assert:
      - {type: contains-all, value: ["## Sample size", "## Bias and mitigation"]}
      - {type: llm-rubric, value: "Uses the register as frame, recommends stratified random sampling by region or urban/rural, shows the sample size formula with p=0.5 as a labelled assumption and finite population correction, inflates for an assumed response rate stated as an assumption, and plans nonresponse weighting and subgroup response monitoring."}
  - name: edge-hard-to-reach-qualitative
    vars:
      population: "Undocumented migrant domestic workers in one city. No list exists."
      study_goal: "Understand how they find healthcare when ill. Semi-structured interviews, one researcher, 6 months."
    assert:
      - {type: llm-rubric, value: "Recommends purposive and snowball or community-partner recruitment rather than probability sampling, justifies an initial interview number with information-power or saturation reasoning and a stopping rule, says findings are not statistically generalisable, and raises safety, trust and data-protection issues for this group."}
  - name: negative-missing-goal-details
    vars:
      population: "Customers of our app."
      study_goal: "Find out what they think."
    assert:
      - {type: llm-rubric, value: "Lists the missing inputs (inference needed, precision or effect size, mode, budget, frame size) with clearly labelled defaults or asks for them, and does not present a sample size as if it were justified by the given information."}
