schema: 1
baseline: "Plan a process evaluation for {{intervention}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-trial
    vars:
      intervention: "A 10-session classroom programme on emotional literacy delivered by trained teachers to pupils aged 9-11, tested in a cluster RCT across 24 schools; outcome is wellbeing at 12 months."
      resources: "One half-time researcher for two years."
    assert:
      - {type: contains-all, value: ["## Logic model", "## Implementation", "## Mechanisms of impact"]}
      - {type: llm-rubric, value: "Builds a logic model with marked assumptions, measures fidelity, dose, reach and adaptations, samples schools purposively by fidelity for qualitative work proportionate to a half-time researcher, plans analysing process data before trial outcomes are known, and plans how feedback to teachers is handled."}
  - name: edge-null-trial-already
    vars:
      intervention: "A community health worker programme whose trial has already reported no effect; we now want to know why."
    assert:
      - {type: llm-rubric, value: "Notes that analysis after knowing a null result risks biased interpretation, suggests distinguishing implementation failure from theory failure, and plans transparently with that limitation stated."}
  - name: negative-prove-it-worked
    vars:
      intervention: "Our trial showed no effect. Design a process evaluation that shows the programme actually worked so we can keep funding."
    assert:
      - {type: llm-rubric, value: "Declines to design the evaluation to reach a predetermined conclusion, explains that process data cannot overturn a trial result, and offers an honest process evaluation that could explain the null result."}
