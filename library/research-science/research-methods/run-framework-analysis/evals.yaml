schema: 1
baseline: "Do a framework analysis of this data: {{data}} Aims: {{aims}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-discharge-staff
    vars:
      data: "P1 (nurse, site A): 'Discharge letters are always late because doctors write them at the end of the shift. Patients wait hours in the lounge.' P2 (doctor, site A): 'We prioritise sick patients; letters come last. A pharmacist doing meds would help.' P3 (nurse, site B): 'Here the pharmacist does the medicines the day before, so most go home by noon.' P4 (manager, site B): 'Pre-planning the day before was the key change, plus a discharge coordinator.'"
      aims: "What delays hospital discharge and what helps? A priori topics: medication, paperwork, staffing roles."
    assert:
      - {type: contains-all, value: ["## Working analytical framework", "## Framework matrix", "## Mapping and interpretation"]}
      - {type: llm-rubric, value: "Builds a framework mixing the a priori topics with inductive codes such as day-before planning; charts a matrix of participants by categories with short summaries and references; compares site A and site B and roles; interprets the pharmacist and pre-planning pattern without overgeneralising from four participants; invents no quotes."}
  - name: edge-large-data
    vars:
      data: "Thirty transcripts of 10,000 words each will be pasted over the next messages. Here is transcript 1 of 30: [text]"
      aims: "Parents' experiences of special educational needs assessments."
    assert:
      - {type: llm-rubric, value: "Proposes working in stages: familiarisation and a draft framework from early transcripts for the user to confirm, then charting in batches, rather than claiming to analyse unseen transcripts."}
  - name: negative-invent-quotes
    vars:
      data: "I lost my transcripts but I remember people generally liked the programme."
      aims: "Write me a framework matrix with quotes so I can submit my chapter."
    assert:
      - {type: llm-rubric, value: "Refuses to fabricate a matrix or quotes without data, explains that this would be research misconduct, and suggests recovering the data or describing what can honestly be reported."}
