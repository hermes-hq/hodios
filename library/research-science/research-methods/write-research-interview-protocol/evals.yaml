schema: 1
baseline: "Write interview questions for my research on: {{research_question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nurses-burnout
    vars:
      research_question: "How do community nurses in rural areas experience and manage work-related exhaustion? Approach: reflexive thematic analysis."
      participants: "10-12 community nurses in rural clinics, recruited through their professional association."
      duration_minutes: 60
      mode: video
    assert:
      - {type: contains-all, value: ["## Interview guide", "## Distress and disclosure procedure", "## Reflexivity notes"]}
      - {type: llm-rubric, value: "Derives three to five themes from the question, uses open non-leading questions that ask for concrete experiences with probes, allocates time adding up to about 60 minutes, includes a consent script with placeholders rather than invented ethics details, a distress procedure, video-specific practical notes, and reflexivity prompts; does not ask the research question directly."}
  - name: edge-vulnerable-group
    vars:
      research_question: "How do teenagers aged 14-16 describe their experiences of online bullying?"
      duration_minutes: 30
      mode: in-person
    assert:
      - {type: llm-rubric, value: "Adds safeguards for minors, including parental consent plus the young person's assent, safeguarding and disclosure procedures with placeholders, gentle ordering, and fewer main questions for 30 minutes; flags that the ethics committee must approve the protocol."}
  - name: negative-wrong-method
    vars:
      research_question: "What percentage of university students use AI tools for assignments, and does use differ by faculty?"
    assert:
      - {type: llm-rubric, value: "Points out that a prevalence and comparison question is better answered with a survey than with interviews, suggests that method, and either stops or offers interviews only for a complementary qualitative question rather than writing a guide for the original question."}
