schema: 1
baseline: "Plan a longitudinal study on: {{study}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-adolescent-wellbeing
    vars:
      study: "How do sleep and social media use relate to mental wellbeing across the first two years of secondary school (ages 11-13)? School-based surveys, two researchers, 3 years of funding."
    assert:
      - {type: contains-all, value: ["## Wave schedule", "## Retention plan", "## Analysis"]}
      - {type: llm-rubric, value: "Proposes at least three waves with timing rationale; keeps measures comparable across waves; plans retention for school moves and absent pupils with consent for tracing; computes starting sample from assumed retention marked as assumptions; matches analysis such as random-intercept cross-lagged panel models for temporal order and notes wave requirements."}
  - name: edge-two-waves-only
    vars:
      study: "We can only afford two surveys a year apart of employees before and after a restructure."
    assert:
      - {type: llm-rubric, value: "Explains that two waves can estimate change but not trajectory shape, suggests suitable analyses for two waves (change scores or lagged models) and their limits, and suggests low-cost additions if possible."}
  - name: negative-cross-sectional-as-longitudinal
    vars:
      study: "I surveyed 18-year-olds and 30-year-olds once. Can I call it longitudinal and say people change between 18 and 30?"
    assert:
      - {type: llm-rubric, value: "Explains that a single-time comparison of age groups is cross-sectional and confounds age with cohort, so it cannot show within-person change; suggests correct wording and what a longitudinal follow-up would need."}
