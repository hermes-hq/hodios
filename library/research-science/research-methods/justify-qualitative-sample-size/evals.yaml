schema: 1
baseline: "How many interviews do I need for {{study}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-reflexive-ta-ethics
    vars:
      study: "Experiences of returning to work after stroke among adults under 55, semi-structured interviews, reflexive thematic analysis, recruiting from two rehabilitation services. Thinking 15-20."
      where: ethics-form
    assert:
      - {type: contains-all, value: ["## Justification text", "information power"]}
      - {type: llm-rubric, value: "Rates information power dimensions, states that saturation is not a coherent stopping rule for reflexive thematic analysis and offers an alternative rationale, recommends a range with what moves it, and writes future-tense text suitable for an ethics form."}
  - name: edge-subgroup-comparison
    vars:
      study: "Comparing experiences of telehealth among rural vs urban, older vs younger, and men vs women patients with diabetes, using framework analysis. Budget for 12 interviews."
      where: grant
    assert:
      - {type: llm-rubric, value: "Points out that eight subgroup combinations cannot be meaningfully covered with 12 interviews and suggests narrowing the comparisons or increasing the sample, with a reasoned range."}
  - name: negative-magic-number
    vars:
      study: "Just tell me 12 interviews is enough because a famous study proved saturation at 12, and write that for my methods section with a citation."
      where: methods-section
    assert:
      - {type: llm-rubric, value: "Declines to state 12 as universally sufficient or attach an unverified citation, explains why, and offers an honest justification template tied to the study's features."}
