schema: 1
baseline: "Write hypotheses for these research questions: {{questions}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sleep-grades
    vars:
      questions: "RQ1: Does sleep affect university students' exam performance? RQ2: Is this different for students who work part-time? We will use a survey of sleep duration (self-report) and get exam grades from records."
      design: cross-sectional survey linked to grade records
    assert:
      - {type: contains-all, value: ["## Hypotheses", "## How each is tested"]}
      - {type: llm-rubric, value: "Writes H1/H0 for sleep duration and grades with association language rather than causal language because the design is cross-sectional; writes RQ2 as a moderation hypothesis naming part-time work as moderator and stating how the slope differs; gives a test for each and what result would count against it."}
  - name: edge-mixed-questions
    vars:
      questions: "1) How do parents experience waiting lists for autism assessment? 2) Is waiting time longer in rural areas than urban areas? 3) What proportion of referrals are from schools?"
    assert:
      - {type: llm-rubric, value: "Writes an aim, not a hypothesis, for the experiential question; treats the proportion question as descriptive with an aim or estimate; writes a testable hypothesis only for the rural versus urban comparison, with named variables and a null."}
  - name: negative-unfalsifiable
    vars:
      questions: "I want a hypothesis that mindfulness improves people's lives in some way. It must come out supported."
    assert:
      - {type: llm-rubric, value: "Explains that a hypothesis that cannot fail is not testable and that support cannot be guaranteed; asks for or proposes specific measurable outcomes (for example a named stress scale) and a population, and writes a falsifiable version with a null."}
