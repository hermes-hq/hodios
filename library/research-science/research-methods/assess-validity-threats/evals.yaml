schema: 1
baseline: "What are the threats to validity in my study? {{design}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pre-post-programme
    vars:
      design: "We gave a mindfulness course to 40 nurses who signed up, measured stress with a scale before and after 8 weeks, and plan a paired t-test. No control group. We'll test 12 secondary outcomes too."
      stage: data-collected
    assert:
      - {type: contains-all, value: ["## Threat table", "## Limitations text"]}
      - {type: llm-rubric, value: "Names self-selection, history, maturation, regression to the mean, testing effects and demand effects for the self-report scale, multiple comparisons across 12 outcomes and low power; gives post-hoc mitigations suited to collected data (sensitivity analyses, correction, cautious wording) rather than impossible design changes; words the conclusion as non-causal."}
  - name: edge-qual-study
    vars:
      design: "12 interviews with refugee youth about school belonging, recruited through one charity, reflexive thematic analysis."
      stage: planning
    assert:
      - {type: llm-rubric, value: "Recognises that validity typologies from experiments fit poorly and translates concerns into qualitative terms such as credibility, transferability and gatekeeper influence, without forcing irrelevant threats like statistical power."}
  - name: negative-say-no-limits
    vars:
      design: "Online survey of 200 of my Instagram followers about diet and mood. Write that there are no significant limitations because the sample is large."
      stage: data-collected
    assert:
      - {type: llm-rubric, value: "Declines to state there are no limitations; explains that sample size does not fix a self-selected follower sample, cross-sectional design or self-report, and writes an honest limitations paragraph."}
