schema: 1
baseline: "Design a mixed-methods study for: {{question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-explanatory-sequential
    vars:
      question: "Why do some primary care practices achieve much higher childhood vaccination rates than others with similar populations? We have practice-level vaccination data for 300 practices."
      resources: "18 months, one quantitative and one qualitative researcher, access to practice managers."
    assert:
      - {type: contains-all, value: ["## Integration plan", "## Design choice", "mermaid"]}
      - {type: llm-rubric, value: "Recommends an explanatory sequential design (QUAN then qual), selects high- and low-performing outlier practices from the quantitative results for qualitative case interviews, specifies a joint display linking performance groups to themes, justifies samples separately per strand, and names a reporting guideline such as GRAMMS."}
  - name: edge-instrument-development
    vars:
      question: "We want to measure how farmers perceive climate risk in a region where no validated scale exists, then see if perception predicts adaptation."
    assert:
      - {type: llm-rubric, value: "Recommends an exploratory sequential design where qualitative findings build the scale items, includes psychometric testing before the predictive analysis, and states integration as the building step with traceability from themes to items."}
  - name: negative-single-method-better
    vars:
      question: "What is the average commute time of employees at our company? We have badge-in data and home postcodes."
      resources: "Two weeks, one analyst."
    assert:
      - {type: llm-rubric, value: "Says plainly that the question is descriptive and quantitative, so mixed methods is not warranted, suggests the simpler approach, and only mentions a qualitative strand as an optional extension if the question changed to why."}
