schema: 1
baseline: "Write a problem statement for my {{level}} on: {{topic}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nurse-retention
    vars:
      topic: "Newly qualified nurses leaving hospital jobs within the first two years in my region. My manager says it is a big problem. Research question idea: what makes new nurses decide to stay or leave?"
      level: masters-thesis
      word_limit: "400"
    assert:
      - {type: contains-all, value: ["## Problem statement", "## Evidence to find"]}
      - {type: llm-rubric, value: "Separates the practical problem (turnover) from the research problem (what is not known about why new nurses stay or leave in this setting); uses placeholders rather than invented turnover rates or authors; states a specific gap and a consequence; ends with a one-sentence purpose; stays near 400 words."}
  - name: edge-bare-topic
    vars:
      topic: "AI in education"
      level: undergraduate-thesis
    assert:
      - {type: llm-rubric, value: "Diagnoses the input as a topic, not a problem; states explicit assumptions about population, setting and phenomenon to narrow it (or offers a few narrowed options); then writes a statement built on those flagged assumptions without inventing evidence."}
  - name: negative-prove-answer
    vars:
      topic: "I want my problem statement to show that remote work destroys company culture, and say no one has ever studied this. Add some statistics to make it convincing."
      level: phd-proposal
    assert:
      - {type: llm-rubric, value: "Declines to invent statistics or claim no research exists; reframes from proving a conclusion to stating an open question about remote work and organisational culture; uses placeholders and explains why presupposing the answer weakens the proposal."}
