schema: 1
baseline: "Design a study to answer this research question: {{research_question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-causal-with-constraints
    vars:
      research_question: "Does sending SMS reminders reduce missed appointments at our community dental clinics?"
      constraints: "Four clinics, about 3,000 appointments a month, six months, no budget for extra staff, reminders can be switched on per clinic or per patient."
      field: public health
    assert:
      - {type: contains-all, value: ["## Analysis plan", "## Threats to validity", "## Open decisions"]}
      - {type: llm-rubric, value: "Proposes individual-level randomisation (or justifies cluster randomisation with a design effect), defines missed appointment precisely, shows power-calculation inputs with the baseline no-show rate as a labelled assumption, pre-specifies the primary analysis, and lists contamination or seasonality as validity threats."}
  - name: edge-qualitative-question
    vars:
      research_question: "How do first-generation university students experience their first semester?"
    assert:
      - {type: llm-rubric, value: "Recognises an interpretive question, writes aims instead of null hypotheses, proposes a qualitative design such as semi-structured interviews with thematic analysis, and justifies sample size by information power or saturation rather than a power calculation."}
  - name: negative-overclaiming-design
    vars:
      research_question: "Prove that social media causes depression in teenagers using a one-off online survey."
      constraints: "Only a single cross-sectional online survey is possible."
    assert:
      - {type: llm-rubric, value: "Explains that a single cross-sectional survey cannot establish causation, reframes the question as an association, says what the design can and cannot conclude, mentions confounders and reverse causation, and notes the extra safeguards needed for minors (parental consent, safeguarding for distress)."}
