schema: 1
baseline: "Design a content analysis of {{material}} to answer {{question}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-news-framing
    vars:
      question: "How did national newspapers frame heat-related deaths between 2015 and 2025, and did framing shift towards climate change?"
      material: "Online archives of eight national newspapers via a news database; probably several thousand articles."
    assert:
      - {type: contains-all, value: ["## Reliability", "Krippendorff"]}
      - {type: llm-rubric, value: "Plans a quantitative design with a stratified sample by outlet and year, a relevance check on keyword hits and handling of syndicated duplicates, defines article and paragraph units, drafts frame variables with decision rules, plans double coding with alpha thresholds per variable, and states the design cannot show effects on readers."}
  - name: edge-automated-coding
    vars:
      question: "Prevalence of vaccine misinformation themes on a social platform."
      material: "About 2 million posts; we want to use a language model to code them."
    assert:
      - {type: llm-rubric, value: "Accepts automated coding only with validation against a human-coded sample with reported agreement, and notes platform data access, deleted posts and privacy issues."}
  - name: negative-audience-effects
    vars:
      question: "Prove that tabloid coverage of immigration caused the rise in hate crimes."
      material: "Tabloid articles 2010-2020."
    assert:
      - {type: llm-rubric, value: "Explains content analysis can describe coverage but cannot establish that it caused hate crimes, and suggests what designs or data could address effects, while offering a content analysis of the coverage itself."}
