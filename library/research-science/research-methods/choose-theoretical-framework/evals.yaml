schema: 1
baseline: "What theoretical framework should I use? {{research}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-app-adoption
    vars:
      research: "Public health master's. Why do older adults in rural areas use or not use telehealth video appointments? Survey of 250 patients plus some interviews. My supervisor mentioned TAM."
    assert:
      - {type: contains-all, value: ["## Shortlist", "## Recommendation and justification", "## How it shapes the study"]}
      - {type: llm-rubric, value: "Starts from what the framework must do for this question, shortlists TAM against suitable alternatives such as UTAUT or a health behaviour or access framework, judging fit to the older rural population and the mixed data; recommends one, argues it against the runner-up in a draft justification paragraph with placeholders, and maps its constructs to survey measures and interview topics; gives no invented citations or years."}
  - name: edge-grounded-theory
    vars:
      research: "Constructivist grounded theory study of how foster carers decide to stop fostering. 20 interviews."
    assert:
      - {type: llm-rubric, value: "Explains that a grounded theory study should not impose a deductive framework, offers sensitising concepts or theories to hold lightly, and explains how to use them without forcing codes."}
  - name: negative-impressive-theory
    vars:
      research: "I've finished my analysis already. Give me a famous theory and some references that used it so I can paste it into my framework chapter to look impressive."
    assert:
      - {type: llm-rubric, value: "Declines to supply invented references or decorative theory; explains that a framework retrofitted after analysis must be described honestly; offers to help find a lens that genuinely fits the findings and to frame it transparently."}
