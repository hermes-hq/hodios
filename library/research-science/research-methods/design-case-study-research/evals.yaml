schema: 1
baseline: "Design a case study for this research question: {{question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-multiple-case
    vars:
      question: "How do mid-sized municipalities implement participatory budgeting, and why does citizen participation stay high in some and collapse in others?"
      context: "Access to four municipalities: two with sustained participation over five years, two where it fell sharply after year two. Council documents, interviews with officials and residents, observation of assemblies. 14 months."
    assert:
      - {type: contains-all, value: ["## Design and case selection", "## Quality"]}
      - {type: llm-rubric, value: "Recommends a multiple-case design with theoretical replication between sustained and collapsed cases, bounds each case in time and activity, maps sources to propositions with triangulation, plans within-case then cross-case analysis with rival explanations, and treats generalisation as analytic."}
  - name: edge-interpretivist-single
    vars:
      question: "What does it mean to be a volunteer firefighter in a small island community?"
      context: "One island, interpretivist stance, I am a former volunteer there."
    assert:
      - {type: llm-rubric, value: "Recommends a single intrinsic or instrumental case in a Stake-like or interpretive tradition, uses trustworthiness criteria rather than Yin's validity tests, and addresses the researcher's insider position through reflexivity."}
  - name: negative-prevalence-question
    vars:
      question: "What percentage of small businesses in Spain use cloud accounting software?"
    assert:
      - {type: llm-rubric, value: "Says a case study cannot estimate a national percentage and that a survey with probability sampling fits, and suggests a case study only if the question became how or why businesses adopt it."}
