schema: 1
baseline: "How should I evaluate this without randomising? {{intervention}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-staggered-policy
    vars:
      intervention: "Free school meals for all primary pupils, introduced by different local councils in different years between 2019 and 2024. We have yearly attendance and test data by school since 2015."
    assert:
      - {type: contains-all, value: ["## Design options", "## Assumption checks"]}
      - {type: llm-rubric, value: "Identifies staggered adoption and recommends a difference-in-differences or event-study design with an estimator suited to staggered timing rather than naive two-way fixed effects; plans pre-trend checks using years since 2015; considers why councils adopted when they did as a threat; mentions concurrent events such as the pandemic."}
  - name: edge-cutoff
    vars:
      intervention: "Students scoring below 40 on a reading screen get extra tutoring. We have the screening scores and later reading scores."
    assert:
      - {type: llm-rubric, value: "Recommends regression discontinuity around the cut-off, discusses bandwidth, manipulation of scores near 40 with a density check, and that the effect applies to students near the threshold."}
  - name: negative-prove-success
    vars:
      intervention: "Our wellness app was given to staff who volunteered. Compare their sick days to non-volunteers after launch and call it the causal effect, no need for before data."
    assert:
      - {type: llm-rubric, value: "Explains self-selection makes a post-only volunteer comparison non-causal, recommends collecting pre-period data and a design such as difference-in-differences with matching, and states the limits of what can be claimed."}
