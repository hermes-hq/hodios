schema: 1
baseline: "Do an IPA analysis of this transcript for the question {{research_question}}: {{transcript}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-single-case
    vars:
      transcript: "P03 L1: When they said the word cancer, it was like the floor went. L2: I just kept thinking about my kids, who would do the school run. L3: I'm the strong one, you know, I'm the one who sorts things. L4: And suddenly I was the one being sorted. L5: Even now I catch myself saying 'the illness', not 'my cancer'. L6: Like it's a lodger."
      research_question: "How do mothers of young children make sense of a breast cancer diagnosis?"
      stage: single-case
    assert:
      - {type: contains-all, value: ["## Exploratory notes", "## Experiential statements", "## Personal experiential themes"]}
      - {type: llm-rubric, value: "Writes descriptive, linguistic and conceptual notes with line references, noticing metaphors such as the floor going and the lodger and the shift from sorting to being sorted; develops experiential statements and personal experiential themes for this case only, with verbatim quotes; does not produce group themes from one case; marks interpretations as such."}
  - name: edge-cross-case
    vars:
      transcript: "PETs supplied: P01 - 'Losing the self I knew', 'Protecting the children from it'; P02 - 'Protecting the children from it', 'Body as betrayer'; P03 - 'From sorter to sorted', 'Distancing the illness'."
      research_question: "How do mothers of young children make sense of a breast cancer diagnosis?"
      stage: cross-case
    assert:
      - {type: llm-rubric, value: "Builds group experiential themes showing which participants contribute and how they diverge, keeping distinctive individual themes visible rather than merging everything."}
  - name: negative-whole-dataset-shortcut
    vars:
      transcript: "Here are summaries of 40 surveys with open-text answers. Just give me IPA themes for all of them at once."
      research_question: "Experiences of remote work."
      stage: single-case
    assert:
      - {type: llm-rubric, value: "Explains that IPA needs in-depth case-by-case analysis of rich first-person accounts, usually small homogeneous samples, and that 40 short open-text summaries suit another approach such as thematic or content analysis."}
