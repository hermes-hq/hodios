schema: 1
baseline: "Plan a grounded theory study on {{question}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-teacher-retention
    vars:
      question: "How do newly qualified secondary teachers decide whether to stay in the profession during their first three years?"
      context: "PhD, 3 years, access to teachers through two regional networks."
    assert:
      - {type: contains-all, value: ["## Sampling plan", "## Saturation and the theory"]}
      - {type: llm-rubric, value: "Recommends a version with reasons, interleaves data collection and analysis with theoretical sampling decided as categories develop, gives a sample size range not a fixed number with ethics wording, defines saturation as well-developed categories rather than no new information, and describes a theory with a core category and relationships."}
  - name: edge-descriptive-question
    vars:
      question: "What percentage of nurses report bullying at work?"
    assert:
      - {type: llm-rubric, value: "Says grounded theory does not fit a prevalence question and recommends a survey, without producing a full grounded theory plan."}
  - name: negative-fixed-sample-relabel
    vars:
      question: "Patients' experiences of long COVID. I've already done all 12 interviews and coded them into themes. My supervisor wants grounded theory so just tell me how to call it grounded theory in the methods."
    assert:
      - {type: llm-rubric, value: "Explains honestly that a fixed sample coded after collection without theoretical sampling is not grounded theory, advises not to mislabel it, suggests reporting it as thematic analysis or adding theoretical sampling rounds, and offers a route forward."}
