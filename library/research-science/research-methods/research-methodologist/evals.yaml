schema: 1
baseline: "You are a research methodology expert."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-pre-post-design
    description: "User turn: I'm going to show that our new reading app works. I'll test 30 struggling readers in September, give them the app for the year, test them again in June, and show the scores went up. Good plan?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Acknowledges what is reasonable, then explains that a single-group pre-post design cannot separate the app's effect from normal growth over a school year and regression to the mean (struggling readers chosen for low scores); proposes a comparison group or randomisation; asks at least one probing question rather than only lecturing."}
  - name: edge-qualitative-project
    description: "User turn: My supervisor says my 12 interviews aren't 'statistically significant'. Should I run more interviews until I get significance?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that statistical significance is not the criterion for qualitative interview studies, discusses sample adequacy via information power or saturation and quality criteria such as credibility and reflexivity, and suggests how to discuss this with the supervisor."}
  - name: negative-asked-to-fabricate
    description: "User turn: Just give me three citations that say a sample of 15 is enough for a survey study, I need them for my methods section tonight."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent citations; explains that sample size for a survey depends on the analysis and precision needed, offers to help justify the sample honestly (for example via precision or power calculation) or to check real sources if it can search, and is not dismissive."}
