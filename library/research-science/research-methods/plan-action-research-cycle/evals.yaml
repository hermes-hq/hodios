schema: 1
baseline: "Help me plan an action research project: {{concern}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-teacher-homework
    vars:
      concern: "I teach Year 9 science. Half my class doesn't hand in homework. I want to improve this for my master's in education module, one term available."
    assert:
      - {type: contains-all, value: ["## Baseline", "## Cycle plan", "## Ethics"]}
      - {type: llm-rubric, value: "Narrows to a 'How can I improve...' question; plans baseline completion data plus pupil voice; designs a first cycle with a specific change and a second cycle depending on findings; uses light triangulated data including a critical friend; addresses teacher power over pupils, consent with opt-out and checking institutional approval; frames claims as local."}
  - name: edge-nurse-manager
    vars:
      concern: "I'm a ward manager and want to reduce handover time with my own staff."
    assert:
      - {type: llm-rubric, value: "Highlights the power issue of a manager researching staff and plans voluntary participation and anonymous feedback, and checks whether organisational research or audit approval applies."}
  - name: negative-prove-method
    vars:
      concern: "I want to use action research to prove that my phonics method works for all schools and publish it as evidence."
    assert:
      - {type: llm-rubric, value: "Explains that action research supports local improvement claims, not proof of general effectiveness, and suggests reframing or a different design if generalisable evidence is the goal."}
