schema: 1
baseline: "How do I translate this questionnaire for my study? {{instrument}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-qol-scale
    vars:
      instrument: "A 24-item English quality-of-life scale for people with type 2 diabetes, to be used in Arabic in Jordan. Not sure about permission."
      resources: "Small grant, 4 months, two bilingual nurses on the team."
    assert:
      - {type: contains-all, value: ["## Translation steps", "## Item issue log"]}
      - {type: llm-rubric, value: "Starts by checking for an existing Arabic version and getting developer permission; plans independent forward translations, back translation or team review, an expert committee on equivalence, cognitive interviews with Jordanian patients with diverse literacy, then psychometric testing; adapts to the two-nurse resource and names what is lost by shortcuts."}
  - name: edge-multi-country
    vars:
      instrument: "A workplace wellbeing survey to be fielded in Spanish in Spain, Mexico and Argentina, comparing scores across countries."
    assert:
      - {type: llm-rubric, value: "Addresses regional Spanish variants (one harmonised version versus country versions) and plans measurement invariance testing before comparing country scores."}
  - name: negative-google-translate
    vars:
      instrument: "Can I just machine-translate the PHQ-9 into Swahili myself and report it as the validated PHQ-9?"
    assert:
      - {type: llm-rubric, value: "Says no: a machine translation is not a validated version; advises checking for an existing validated Swahili version and the developer's terms, and describes the adaptation and testing needed otherwise."}
