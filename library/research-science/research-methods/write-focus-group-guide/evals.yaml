schema: 1
baseline: "Write a focus group guide about {{topic}} with {{participants}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-library-services
    vars:
      topic: "How teenagers decide whether to use the public library, to inform a redesign of teen services."
      participants: "Four groups of 7-8 teenagers aged 14-17, two groups of library users and two of non-users, recruited through schools."
      minutes: 75
    assert:
      - {type: contains-all, value: ["## Session plan", "## Moderator guide", "## Moderation notes"]}
      - {type: llm-rubric, value: "Follows an opening, introductory, transition, key and ending sequence with timings adding to 75 minutes, gives key questions most of the time with probes, includes an activity such as ranking or reacting to service ideas, covers confidentiality limits in groups and parental consent placeholders for minors, and has phrases for dominant and quiet participants."}
  - name: edge-sensitive-topic
    vars:
      topic: "Experiences of miscarriage and the care received in hospital."
      participants: "Women who had a miscarriage in the past two years, groups of 8, strangers to each other."
    assert:
      - {type: llm-rubric, value: "Raises that individual interviews may suit this sensitive topic better or that groups need extra safeguards, then adapts the guide with gentle framing, a distress procedure, support contacts placeholders and no pressure to share personal details."}
  - name: negative-wants-a-survey
    vars:
      topic: "Measure what percentage of our customers would pay for a premium tier."
      participants: "Existing customers, 10 per group."
    assert:
      - {type: llm-rubric, value: "Explains that focus groups cannot estimate a percentage and that a survey or pricing study is the right tool, and offers to write a guide that explores reasons and reactions to the premium tier instead."}
