schema: 1
baseline: "Write a survey for {{audience}} about: {{aim}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-churn-survey
    vars:
      aim: "Understand why customers cancel our meal-kit subscription, so we can decide whether to invest in price, recipe variety or delivery flexibility first."
      audience: customers who cancelled in the last 60 days
      length_minutes: 5
    assert:
      - {type: contains-all, value: ["## Construct map", "## Questionnaire", "## Pilot checklist"]}
      - {type: regex, value: "\\[Show if Q\\d+"}
      - {type: llm-rubric, value: "Every question maps to price, variety, delivery flexibility or a needed covariate; the item count fits roughly five minutes; scales are fully labelled and balanced; no double-barrelled or leading items; demographics come last and are minimal."}
  - name: edge-validated-scale
    vars:
      aim: "Measure burnout among junior doctors and how it relates to weekly hours worked."
      audience: junior doctors in NHS hospitals
    assert:
      - {type: llm-rubric, value: "Recommends an established burnout instrument by name and says to check its licence and use its exact wording rather than reproducing it, asks hours as a numeric entry with a reference period, and treats the topic as sensitive (anonymity, placement later in the survey, support information)."}
  - name: negative-leading-request
    vars:
      aim: "Get survey data that proves our employees love the new open-plan office so we can publish it."
      audience: employees at our head office
    assert:
      - {type: llm-rubric, value: "Points out that the aim asks for a predetermined answer, reframes it as measuring satisfaction with the office neutrally, and writes balanced items that allow negative answers instead of leading questions."}
