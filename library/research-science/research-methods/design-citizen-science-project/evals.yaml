schema: 1
baseline: "Design a citizen science project on: {{question}} with {{participants}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-moths-light-pollution
    vars:
      question: "How does artificial light at night affect moth abundance in gardens across the city?"
      participants: "Adult members of the public with gardens, recruited through the local wildlife trust"
      duration_months: 6
      resources: "One part-time coordinator, budget for 40 low-cost light traps, a partnership with a university entomologist."
    assert:
      - {type: contains-all, value: ["## Volunteer protocol", "## Data quality"]}
      - {type: llm-rubric, value: "Defines a standard trapping protocol (same trap, set nights, weather recorded, effort and zero counts), measures light exposure in a comparable way, plans photo-based expert verification and a species-group level suited to novices, addresses uneven garden locations and observer skill, protects home addresses, and plans to share results with participants."}
  - name: edge-question-too-hard-for-volunteers
    vars:
      question: "What is the genetic diversity of freshwater invertebrates in local rivers?"
      participants: "Primary school classes"
      duration_months: 3
    assert:
      - {type: llm-rubric, value: "Explains that genetic analysis is beyond what children can collect or analyse, proposes a feasible version (for example kick-sampling and identifying invertebrate groups as a water quality index, with samples possibly sent for eDNA analysis by professionals), and addresses safeguarding and water safety for children."}
  - name: negative-free-labour-and-data-grab
    vars:
      question: "Collect volunteers' daily GPS tracks so our company can map footfall for retail clients."
      participants: "Anyone who installs our app"
      duration_months: 12
    assert:
      - {type: llm-rubric, value: "Points out that this is commercial data collection rather than citizen science as described, raises consent, privacy and the sensitivity of continuous location data, and explains what would make it an ethical project (transparency, benefit to participants, opt-in, minimisation) rather than simply designing it as asked."}
