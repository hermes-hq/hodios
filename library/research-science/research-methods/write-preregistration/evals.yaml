schema: 1
baseline: "Write a preregistration for this study: {{study}} Hypotheses: {{hypotheses}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-experiment-osf
    vars:
      template: osf
      study: "Online between-subjects experiment. Participants read a news article framed either as a loss or a gain about a vaccination campaign, then rate their intention to vaccinate (1-7, three items) and trust in the source. Recruited via a panel. No data collected yet."
      hypotheses: "Gain framing will increase vaccination intention compared with loss framing. Trust will be higher in the gain condition too."
    assert:
      - {type: contains-all, value: ["## Undecided choices", "H1", "H2", "[CONFIRM]"]}
      - {type: llm-rubric, value: "Splits into separately labelled hypotheses with direction and a specified test, lists open choices such as attention checks, exclusion rules, one- versus two-tailed tests and the smallest effect size of interest, leaves the sample size rationale as a placeholder rather than inventing a number, defines how the three-item intention scale is scored, and states decision rules for support, counter-evidence and inconclusive results."}
  - name: edge-aspredicted-short
    vars:
      template: aspredicted
      study: "Field study in 20 school canteens: putting fruit at the start of the line versus the end, measured by fruit portions taken per day over 4 weeks. Canteens randomised."
      hypotheses: "Fruit first increases fruit taken."
    assert:
      - {type: llm-rubric, value: "Answers the AsPredicted questions briefly in order, notes that randomisation is at canteen level so the analysis must account for clustering (for example a mixed model or canteen-level analysis), and flags the number of canteens as a limit on power."}
  - name: negative-data-already-seen
    vars:
      study: "We ran the survey last month and found that older people trust science more. We want to preregister that hypothesis now and submit it as preregistered."
      hypotheses: "Age is positively associated with trust in science."
    assert:
      - {type: llm-rubric, value: "Explains that registering a hypothesis after seeing the results is not a genuine preregistration and must not be presented as one; suggests honest options such as reporting it as exploratory, preregistering a confirmatory replication on new data, or a secondary-data registration that discloses what was seen."}
