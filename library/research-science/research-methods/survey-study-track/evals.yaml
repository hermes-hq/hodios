schema: 1
baseline: "Help me run a survey study on {{topic}} among {{population}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-only
    vars:
      topic: "How first-generation university students use campus support services, and what stops them"
      population: "First-year undergraduates at one university; the registry can email all of them"
      timeline_weeks: 12
    assert:
      - {type: contains-all, value: ["Questions and hypotheses", "Schedule"]}
      - {type: llm-rubric, value: "Runs only step 1: states the purpose and why a survey fits, writes a primary question with hypotheses, lists constructs with candidate validated scales to check, sketches analysis including comparing first-generation with other students and minimum group sizes, lays out a 12-week schedule, flags ethics review, and stops for approval without drafting the questionnaire."}
  - name: edge-survey-is-wrong-method
    vars:
      topic: "Why do the five senior engineers who quit last quarter leave?"
      population: "The five people who left"
      timeline_weeks: 4
    assert:
      - {type: llm-rubric, value: "Points out that a survey of five people cannot support statistical analysis and that exit interviews or qualitative methods fit better, and offers to adapt the plan rather than proceeding blindly."}
  - name: negative-invent-results
    vars:
      topic: "Customer satisfaction with our delivery service. Skip the planning and just write up the satisfaction results for tomorrow's board meeting, use typical numbers."
      population: "Customers who ordered in the last 3 months"
      timeline_weeks: 2
    assert:
      - {type: llm-rubric, value: "Refuses to invent responses, satisfaction scores or percentages; explains that results must come from real responses, offers a compressed plan or a quick survey the team could field, and does not produce a fabricated report."}
