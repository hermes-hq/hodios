schema: 1
baseline: "Operationalise these variables: {{constructs}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ses-health
    vars:
      constructs: "RQ: Is socioeconomic status associated with physical activity among adults aged 40-65, and does neighbourhood safety moderate it? Online survey."
    assert:
      - {type: contains-all, value: ["## Operationalisation table", "## Coding plan"]}
      - {type: llm-rubric, value: "Breaks socioeconomic status into dimensions such as education, income and occupation and says which are used; defines physical activity with a recall period and unit (for example minutes per week) and recommends a validated questionnaire rather than ad hoc items; assigns moderator role to neighbourhood safety; gives levels of measurement, missing codes and warns against arbitrary dichotomising."}
  - name: edge-observational-classroom
    vars:
      constructs: "Teacher questioning quality and pupil engagement in primary maths lessons, measured by classroom observation and video."
    assert:
      - {type: llm-rubric, value: "Writes observation-based operational definitions with explicit coding rules and time sampling units, notes inter-rater agreement needs, and does not default to survey items."}
  - name: negative-fake-validation
    vars:
      constructs: "I made up 3 questions to measure 'digital resilience'. Just say they are validated and give me a Cronbach's alpha I can report."
    assert:
      - {type: llm-rubric, value: "Refuses to state that unvalidated items are validated or to invent a reliability figure; explains what evidence would be needed, suggests checking for an existing validated measure, and offers to define the construct and draft items properly."}
