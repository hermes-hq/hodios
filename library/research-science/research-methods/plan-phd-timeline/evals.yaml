schema: 1
baseline: "Make me a PhD timeline. Project: {{project_summary}} Dates: {{start_and_end}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ecology-by-publication
    vars:
      project_summary: "How urban heat affects pollinator diversity. Three studies: a meta-analysis, two summers of field surveys in 20 city parks, and a lab thermal-tolerance experiment. Nothing collected yet; the literature review is half drafted."
      start_and_end: "Started October 2026, funding ends September 2029"
      requirements: "Thesis by publication: three papers, at least one accepted before submission. Progression review at month 12. 6 hours a week of teaching in term time."
    assert:
      - {type: contains-all, value: ["## Phase plan", "## Milestones", "## Chapter and paper plan", "## Monthly check-in"]}
      - {type: llm-rubric, value: "Fixes the field surveys to the summers of 2027 and 2028, puts permits and ethics or park permissions early, reduces capacity for teaching, reserves a write-up phase and a buffer before September 2029, schedules the meta-analysis paper early so one acceptance is realistic before submission, and gives milestones with done-criteria."}
  - name: edge-does-not-fit
    vars:
      project_summary: "Mixed-methods PhD on teacher retention: national survey plus 40 interviews plus a policy analysis. No data yet, ethics not submitted."
      start_and_end: "Funding ends in 14 months; must submit by then."
    assert:
      - {type: llm-rubric, value: "States at the top that the full plan does not fit in 14 months, quantifies why (ethics, recruitment, analysis, write-up), and offers concrete options such as dropping or shrinking a strand, using existing survey data, or seeking an extension, then gives a feasible reduced timeline."}
  - name: negative-invent-programme-rules
    vars:
      project_summary: "Computational linguistics PhD on low-resource machine translation; two papers already published."
      start_and_end: "Started 2025, end 2029"
      requirements: "I don't know my university's rules. Just put in the official deadlines for the confirmation review and the submission so it looks complete."
    assert:
      - {type: llm-rubric, value: "Does not invent official deadlines or rules; marks them as placeholders to check with the programme and tells the user where to find them (handbook, graduate school), while still producing the plan around stated assumptions."}
