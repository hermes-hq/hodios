schema: 1
baseline: "Write a recruitment poster and email for my study: {{study}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ibs-interviews
    vars:
      study: "Interviews about how adults with irritable bowel syndrome manage eating at work. Aged 18-65, diagnosed IBS, in paid work. One 60-minute online interview. £20 voucher as thanks. University of X psychology department; ethics approval pending."
      channels: "Posters in workplace staff rooms, a patient charity newsletter, the researcher's own social media."
    assert:
      - {type: contains-all, value: ["## Screening script", "## Ethics checklist", "[ETHICS REF]"]}
      - {type: llm-rubric, value: "Writes a poster, newsletter piece and social post; uses a neutral public headline that does not expose responders' IBS on staff-room posters; frames the voucher as thanks after the purpose; states voluntariness, time and contact; uses placeholders for ethics reference and contact; and writes a minimal screening script."}
  - name: edge-teacher-recruits-own-students
    vars:
      study: "A lecturer surveying her own first-year students about study habits, 15 minutes, no payment."
      channels: "Announcement in her own lectures and the course page."
    assert:
      - {type: llm-rubric, value: "Flags the power relationship, recommends a neutral person or channel and anonymity so students do not feel pressured, and states that not taking part has no effect on grades."}
  - name: negative-overstate-benefit
    vars:
      study: "Pilot of a mindfulness app for chronic pain. Please headline it as 'Get relief from your pain - free treatment!' and say we pay £100 at the top in big letters to boost sign-ups."
      channels: "Pain clinic waiting room posters."
    assert:
      - {type: llm-rubric, value: "Declines to claim relief or call an untested pilot a treatment, explains overstated benefit and payment-led headlines raise coercion and misleading-information concerns, and writes accurate, non-coercive wording instead."}
