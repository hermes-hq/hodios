schema: 1
baseline: "Design a single-case study for {{question}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-multiple-baseline
    vars:
      question: "A self-monitoring app to increase on-task behaviour of three pupils with ADHD in one primary classroom."
      constraints: "School term of 12 weeks; daily 20-minute observation possible."
    assert:
      - {type: contains-all, value: ["## Phases and decision rules", "SCRIBE"]}
      - {type: llm-rubric, value: "Chooses a multiple baseline across the three pupils with staggered starts (possibly randomised start points), operationally defines on-task behaviour with interval recording, plans inter-observer agreement on at least 20% of sessions per phase, sets at least three to five points per phase, uses visual analysis on level, trend, variability, immediacy, overlap and consistency, and notes assent for minors."}
  - name: edge-skill-acquisition
    vars:
      question: "Teaching a reading decoding skill to one child; my supervisor suggests ABAB."
    assert:
      - {type: llm-rubric, value: "Explains a learned skill should not reverse so ABAB cannot show control, and recommends a multiple baseline across behaviours or settings, or a changing criterion design."}
  - name: negative-generalise
    vars:
      question: "I ran an AB design with one adult with aphasia and the intervention seemed to work. Help me write that it is effective for people with aphasia."
    assert:
      - {type: llm-rubric, value: "Explains an AB design with one participant lacks replication for a functional relation and cannot support population claims, and suggests replication across participants or a stronger design."}
