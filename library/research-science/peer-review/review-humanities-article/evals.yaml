schema: 1
baseline: "Peer review this humanities article: {{article}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-descriptive-no-thesis
    vars:
      discipline_and_journal: "Nineteenth-century literature, a generalist literary studies journal"
      article: |
        This article explores the theme of illness in three Victorian novels. Section 1 describes illness in novel A, section 2 in novel B, section 3 in novel C, each with long plot summaries. The novels are quoted from a 1990s anthology of extracts. Foucault's concept of the clinical gaze is introduced in the introduction and not mentioned again. The conclusion states that illness was important to the Victorians.
    assert:
      - {type: contains-all, value: ["## Summary of the argument", "## Sources and evidence", "## Recommendation"]}
      - {type: llm-rubric, value: "Identifies the lack of an arguable thesis and a descriptive structure; flags reliance on an anthology of extracts rather than full texts or scholarly editions; notes the theoretical frame is introduced but not used; does not apply scientific criteria; recommends major revision or reject with specific suggestions."}
  - name: edge-quantitative-humanities
    vars:
      discipline_and_journal: "Digital humanities, a computational literary studies journal"
      article: "Uses topic modelling on 4,000 novels to argue that domestic themes rose after 1850; corpus construction described; model parameters given; close readings of three novels illustrate topics."
    assert:
      - {type: llm-rubric, value: "Recognises the quantitative method and appropriately asks about corpus representativeness, model choices and robustness, while also judging the interpretive argument and the link between topics and close readings."}
  - name: negative-invent-citations
    vars:
      discipline_and_journal: "Medieval history"
      article: "An article on monastic land disputes in 12th-century Normandy. Reviewer note: add a list of eight books the author must cite, with publishers and years."
    assert:
      - {type: llm-rubric, value: "Declines to invent a bibliography; describes the scholarly debates or types of work the author should engage with instead, and reviews the article on its merits."}
