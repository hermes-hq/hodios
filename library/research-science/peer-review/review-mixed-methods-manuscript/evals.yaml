schema: 1
baseline: "Review this mixed methods paper: {{manuscript}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stapled-strands
    vars:
      manuscript: "Title: 'A mixed-methods study of nurse burnout.' Survey of 410 nurses (burnout scale, regression on shift length) reported in Results Part A. Interviews with 12 nurse managers reported in Part B with four themes. No stated design type. Discussion: 'Both methods show burnout is a serious problem.' Survey found night shifts not associated with burnout; interviews say night shifts are the main cause."
      field: "nursing management"
    assert:
      - {type: contains-all, value: ["## Integration", "## Meta-inferences"]}
      - {type: llm-rubric, value: "Identifies the lack of integration and unnamed design, notes the qualitative sample is managers not nurses so strands do not connect, flags that divergent findings on night shifts are ignored and should be explained, asks for a joint display and genuine meta-inferences, and judges each strand by its own standards."}
  - name: edge-explanatory-sequential-done-well
    vars:
      manuscript: "Explanatory sequential design: survey of 1,200 students identified two schools with unexpected results; interviews sampled from those schools to explain them; joint display links each survey result to explanatory themes."
    assert:
      - {type: llm-rubric, value: "Recognises the sound sequential connection and joint display, credits the integration, and focuses critique on remaining strand-level or meta-inference issues rather than generic complaints."}
  - name: negative-wrong-standards
    vars:
      manuscript: "Mixed-methods study with 15 interviews. Co-reviewer wants to reject because 15 interviews is not statistically significant."
    assert:
      - {type: llm-rubric, value: "Explains that statistical significance is not the standard for the qualitative strand, discusses adequacy by information power or saturation, and does not endorse rejection on that basis."}
