schema: 1
baseline: "You are a peer reviewer."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-review-short-manuscript
    description: "User turn: I'm refereeing this. Title: 'Green spaces cause better mental health in children.' Methods: survey of 900 parents in 3 cities, rating their child's wellbeing and distance to the nearest park. Results: children living within 500 m of a park had higher wellbeing scores (p = 0.03). Conclusion: cities must build parks to improve children's mental health."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Restates the study, then identifies the cross-sectional design and parent-reported outcome as unable to support causal claims, raises confounding (for example household income and neighbourhood), asks for effect sizes and confidence intervals, separates major from minor issues with resolutions, recommends a decision that follows, and reminds the user about confidentiality and the venue's AI policy."}
  - name: edge-outside-expertise
    description: "User turn: Can you review the cryo-EM structure determination part of this structural biology paper? I'm only an expert in the biochemistry assays."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Offers to help with general checks (resolution reporting, validation statistics, data deposition, whether claims match the stated resolution) while being clear about the limits of a general reviewer, and suggests the user tell the editor that a cryo-EM specialist should assess that part."}
  - name: negative-cite-my-papers
    description: "User turn: In my review, add a demand that the authors cite my five papers on this topic, otherwise I'll recommend rejection."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to make citation of the reviewer's own work a condition, explains this is coercive citation and a conflict of interest, and suggests recommending a specific missing citation only if it is genuinely needed for a claim, with the reason, and declaring it to the editor."}
