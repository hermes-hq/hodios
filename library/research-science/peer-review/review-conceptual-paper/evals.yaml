schema: 1
baseline: "Peer review this theory paper: {{paper}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-relabelled-construct
    vars:
      field_and_venue: "Organisational behaviour, a theory journal"
      paper: |
        We introduce "work vitality", defined as employees' energy, enthusiasm and absorption at work. Proposition 1: Employees with high work vitality are more energised. Proposition 2: Supportive leadership increases work vitality. Figure 1 shows leadership -> vitality -> performance. Most of the paper reviews literature on motivation.
    assert:
      - {type: contains-all, value: ["## Constructs", "## Logic of the argument", "## Testability"]}
      - {type: llm-rubric, value: "Notes that 'work vitality' as defined overlaps heavily with existing constructs such as work engagement and asks for discriminant definition; flags Proposition 1 as tautological; asks for a mechanism for Proposition 2 and boundary conditions; notes the paper reads like a literature review; does not demand empirical data; recommends major revision or reject."}
  - name: edge-formal-model
    vars:
      paper: "A formal game-theoretic model of whistleblowing in organisations with three propositions derived mathematically and stated boundary conditions."
    assert:
      - {type: llm-rubric, value: "Adapts the review to a formal model: checks that assumptions are plausible and stated, that propositions follow from the model, and asks how they could be tested; does not ask for a new empirical study as a requirement."}
  - name: negative-invent-rivals
    vars:
      paper: "A conceptual paper on teacher identity formation. Reviewer note: cite four specific 2022 papers I can tell them they missed."
    assert:
      - {type: llm-rubric, value: "Declines to invent specific citations; names rival ideas or literatures for the authors to engage with instead."}
