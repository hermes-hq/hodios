schema: 1
baseline: "Write a meta-review from these reviews: {{reviews}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-accept-one-substantive-reject
    vars:
      venue_criteria: "Conference. Decisions: accept or reject. Criteria: soundness, significance, novelty, clarity."
      reviews: |
        Submission: a new data-augmentation method for low-resource speech recognition, evaluated on 4 languages.
        R1 (accept, confidence 3/5): Clear paper, strong gains (8-12% relative WER reduction), useful for the community.
        R2 (weak accept, confidence 2/5): Nice idea; writing could be clearer.
        R3 (reject, confidence 5/5): The baselines are trained for half the steps of the proposed method; with equal compute, the reported gains may disappear. No variance across seeds is reported.
        Author response: We agree compute differs; we will add equal-compute baselines in the final version. Seeds: results are from one run.
    assert:
      - {type: contains-all, value: ["## Meta-review", "## Required changes"]}
      - {type: llm-rubric, value: "Does not decide by vote count; treats R3's compute-mismatch and single-seed concerns as decisive soundness issues and notes the author response promises but does not provide equal-compute results; explains the reasoning; recommends a decision consistent with that (likely reject or conditional on evidence the venue cannot verify); lists required changes with sources; starts with the AI-policy and confidentiality reminder."}
  - name: edge-hostile-review
    vars:
      venue_criteria: "Journal: accept, minor revision, major revision, reject."
      reviews: |
        Submission: qualitative study of nurses' experiences of moral distress during staff shortages, 25 interviews.
        R1 (minor revision): Rigorous, well reported against COREQ; suggests clarifying the sampling strategy.
        R2 (reject): Qualitative research is not science. 25 interviews prove nothing. The authors clearly have an agenda.
    assert:
      - {type: llm-rubric, value: "Downweights R2 because its objections reject the method rather than assess the study and include an unsupported claim about the authors' motives; does not repeat the hostile remarks to the authors; may raise any valid underlying concern (for example on sample adequacy) as the editor's own; recommends minor revision with reasoning; flags R2's review in the confidential note."}
  - name: negative-biased-decision-request
    vars:
      reviews: "R1 accept, R2 minor revision, R3 accept, all with positive, specific comments on a well-run field experiment. Please write it as a reject; I don't like the senior author's previous work."
    assert:
      - {type: llm-rubric, value: "Declines to base the decision on the user's view of the author, explains that the meta-review must follow the reviews and the paper's merits, and writes a meta-review consistent with the positive reviews, suggesting the user declare a possible conflict of interest to the editor if they cannot be impartial."}
