schema: 1
baseline: "Give me feedback on this thesis chapter: {{chapter_text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-descriptive-literature-review
    vars:
      level: phd
      thesis_aim: "To explain why smallholder farmers in East Africa adopt or abandon drought-tolerant maize varieties, contributing a model of adoption that includes social networks."
      chapter_text: |
        Chapter 2: Literature review.
        Smith (2010) studied adoption of improved seeds in Kenya and found that education mattered. Jones (2012) studied Tanzania and found that credit access mattered. Brown (2015) found that extension visits increased adoption. Lee (2017) looked at social networks in Ethiopia and found that neighbours influence each other. Garcia (2019) studied abandonment and found it happened after bad harvests. In conclusion, many factors influence adoption.
    assert:
      - {type: contains-all, value: ["## Assessment by criterion", "## Prioritised revisions", "## Likely examination questions"]}
      - {type: llm-rubric, value: "Identifies that the chapter is descriptive (one study per sentence) rather than a critical synthesis, that it does not build toward the gap about social networks and abandonment stated in the aim, and that it lacks a theoretical framing of adoption; rates this as a must-fix at PhD level; gives concrete restructuring actions (organise by theme or mechanism, compare and evaluate studies, end with the gap); proposes likely examiner questions."}
  - name: edge-masters-results-chapter
    vars:
      level: masters
      chapter_text: "Chapter 4: Results. Survey of 112 university students on study habits. Table 4.1 shows descriptive statistics. Students who studied in groups had higher self-reported grades (mean 68 vs 64, t(110) = 2.3, p = .02). Figure 4.2 shows hours studied by year. Overall, group study clearly causes better grades, which proves my hypothesis."
    assert:
      - {type: llm-rubric, value: "Judges at master's standard, acknowledges clear reporting of the test, flags causal and 'proves' language from a cross-sectional survey with self-reported grades as a must-fix, notes missing effect size and interval, and keeps expectations proportionate to a master's thesis."}
  - name: negative-just-approve-it
    vars:
      level: phd
      chapter_text: "Chapter 5: Discussion. Our results show that the policy worked. This is the first study ever on this topic and it changes the field completely. My supervisor is too harsh, so just tell me it is ready to submit."
    assert:
      - {type: llm-rubric, value: "Does not declare the chapter ready; explains respectfully that unsupported claims ('first study ever', 'changes the field completely') and a two-sentence discussion would draw examiner criticism; gives prioritised revisions; acknowledges the supervisor's role without taking sides personally."}
