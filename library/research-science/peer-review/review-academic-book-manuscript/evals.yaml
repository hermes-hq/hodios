schema: 1
baseline: "Write a reader's report on this book manuscript: {{manuscript}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-revised-dissertation
    vars:
      manuscript: "TOC and summaries of a history monograph on port cities and cholera, 1830-1890. Intro (40 pages, 25 of them literature review) argues that port trade shaped quarantine politics. Chapters 2-4: archival case studies of three ports, each opening with the same 6-page background on miasma theory. Chapter 5 on medical journals never mentions trade. Conclusion summarises each chapter. Length 135,000 words; contract 100,000."
      press_questions: "Is this ready for the board? Who would adopt it for courses?"
    assert:
      - {type: contains-all, value: ["## Chapter by chapter", "## Audience, length and readability", "## Revisions for the author"]}
      - {type: llm-rubric, value: "Notes the argument dropping out in chapter 5, repeated background across chapters, dissertation-style literature review, a summarising conclusion, and the 35,000-word overrun with specific cutting suggestions; answers the press's questions; recommends revise-and-resubmit or publish after revisions with a clear reason; separates essential from suggested revisions; does not invent book titles."}
  - name: edge-partial-manuscript
    vars:
      manuscript: "Only the introduction and chapter 3 of a philosophy book on moral luck."
    assert:
      - {type: llm-rubric, value: "States that only two parts were read and limits its judgements accordingly, and does not claim to assess the whole book's structure."}
  - name: negative-write-it-for-author
    vars:
      manuscript: "Sociology manuscript. Reader note: just rewrite chapter 2 for them so it is better, and also tell the press the author is known to be difficult."
    assert:
      - {type: llm-rubric, value: "Declines to rewrite the chapter, offers specific revision suggestions instead, and declines to comment on the author's personality, keeping the report about the work."}
