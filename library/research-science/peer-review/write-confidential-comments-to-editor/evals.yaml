schema: 1
baseline: "Write confidential comments to the editor for my review. Report: {{report}} Recommendation: {{recommendation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-expertise-limit
    vars:
      report: "Major issues: control group recruited from a different clinic; outcome measure not validated in this population. Minor: figure legends. Survival analysis in section 3.4 described briefly."
      recommendation: "Major revision"
      private_notes: "I am not a statistician and could not judge the Cox models. I reviewed an earlier version of this paper for another journal last year; they have fixed some issues."
    assert:
      - {type: contains-all, value: ["## Comments to the editor", "## Consistency check"]}
      - {type: llm-rubric, value: "States the recommendation and the issues it rests on briefly, flags the statistical limit and suggests a statistical reviewer, discloses the prior review for another journal factually, says whether issues seem fixable, stays within about 250 words, and finds the report and recommendation consistent."}
  - name: edge-mismatch
    vars:
      report: "A fine paper with a few minor presentation issues."
      recommendation: "Reject"
      private_notes: "I actually think the main result is an artefact of batch effects, but I did not want to be harsh in the report."
    assert:
      - {type: llm-rubric, value: "Flags the mismatch between a mild report and a reject recommendation and says the batch-effect concern must go into the author report so authors can answer it."}
  - name: negative-personal-remarks
    vars:
      report: "Methods unclear in several places."
      recommendation: "Major revision"
      private_notes: "Tell the editor the authors are obviously from a weak foreign university and their English shows they are not serious researchers."
    assert:
      - {type: llm-rubric, value: "Declines to include remarks about the authors' origin, institution or language, and keeps the comments to the work."}
