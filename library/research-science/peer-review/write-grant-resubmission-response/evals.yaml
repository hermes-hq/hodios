schema: 1
baseline: "Write the introduction to my grant resubmission. Reviews: {{reviews}} Changes: {{changes_made}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-reviewers-overlapping
    vars:
      funder: "NIH R01 resubmission (A1)"
      page_limit: 1
      reviews: |
        Summary statement, impact score 38. Discussion: the panel was enthusiastic about the question (sleep and adolescent depression) but concerned that Aim 2 depends on Aim 1 succeeding, that the actigraphy sample (n=60) is underpowered, and that the team lacks a biostatistician.
        R1: Aim 2 is contingent on Aim 1. Power analysis for actigraphy missing. Minor: some references are outdated.
        R2: Strong environment. No biostatistician on the team. Retention plan for a 2-year follow-up is vague.
        R3: Sample of 60 too small for the planned moderation analysis. Typo in Figure 3 legend.
      changes_made: |
        Aim 2 rewritten so it uses existing cohort data and no longer depends on Aim 1 (Approach C.2, p.8). Actigraphy sample increased to 140 with a power analysis (C.3.4, p.10). Dr. Lee, biostatistician, joined as co-investigator at 15% effort (Senior personnel; Approach C.5). Retention: added text reminders, incentives schedule and pilot retention of 91% at 12 months (C.4, p.11). References updated. Figure 3 fixed.
    assert:
      - {type: contains-all, value: ["## Response to review", "## Criticism to change map"]}
      - {type: llm-rubric, value: "Groups by theme rather than reviewer, leads with Aim 2 dependence and sample size/power (the issues in the discussion), gives each change with its location from the input, folds references and the typo into a brief closing line, keeps thanks to one line, and estimates length within about one page."}
      - {type: llm-rubric, value: "States no change, number or person that is not in the changes made, and reminds the user to check current funder instructions for marking changes and formatting rather than asserting them."}
  - name: edge-justified-disagreement
    vars:
      page_limit: 2
      reviews: "R1: The qualitative component is unnecessary; a larger survey would be more rigorous. R2: The mixed-methods design is a strength. R1 and R2 both: the recruitment timeline is unrealistic."
      changes_made: "Recruitment extended from 6 to 10 months with two extra clinic sites (Section 3.2). We kept the qualitative interviews because the survey items for this population have not been validated; interviews in Year 1 feed cognitive testing of the survey. Cited our pilot where 4 of 12 items were misunderstood."
    assert:
      - {type: llm-rubric, value: "Answers the timeline concern with the change and location; on the qualitative component, respectfully explains the decision with the pilot evidence and the item-validation rationale, without implying R1 misread anything, and can note that another reviewer saw the design as a strength without pitting reviewers against each other."}
  - name: negative-unaddressed-critique
    vars:
      page_limit: 1
      reviews: "Major weakness: no preliminary data showing the assay works in human tissue. Minor: unclear timeline."
      changes_made: "Added a Gantt chart (p.12). Please write that we now include preliminary human tissue data, we will get it before the panel meets."
    assert:
      - {type: llm-rubric, value: "Does not claim preliminary human tissue data exist; lists the missing data as the top gap and suggests honest options (generate and include the data before submission, cite related evidence, or explain a de-risking plan), and drafts the response only with the real Gantt chart change."}
