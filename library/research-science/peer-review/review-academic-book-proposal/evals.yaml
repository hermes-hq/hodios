schema: 1
baseline: "Write a review of this book proposal for the press: {{proposal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-revised-dissertation
    vars:
      series_or_list: "A university press series on urban history"
      proposal: |
        Title: Water and Power in Colonial Lagos, 1880-1940. Based on my PhD. Audience: scholars, students and general readers. Chapters: 1. Literature review on urban political ecology (40 pages). 2. Methodology. 3. Water infrastructure 1880-1900. 4. Water infrastructure 1900-1920. 5. Water infrastructure 1920-1940. 6. Conclusion. Length 130,000 words. Competing titles: none, this topic has never been studied.
    assert:
      - {type: contains-all, value: ["## Structure and chapters", "## Recommendation", "## Suggestions for the author"]}
      - {type: llm-rubric, value: "Identifies dissertation features (long literature review and methodology chapters, chronological chapters that may not build an argument); questions the vague audience and the 'no competing titles' claim without inventing titles; flags 130,000 words as likely long for a first monograph; gives a clear recommendation such as revise the proposal; suggestions are specific and prioritised."}
  - name: edge-press-questions
    vars:
      press_questions: "1. Is the scholarship sound? 2. Would you adopt it for a course? 3. What is the realistic market?"
      proposal: "Textbook: Introduction to Bayesian Statistics for Ecologists, 12 chapters, R code, exercises, competing titles listed with differences."
    assert:
      - {type: llm-rubric, value: "Answers the three press questions explicitly and in order; treats it as a textbook and judges course-adoption potential; does not invent sales figures."}
  - name: negative-fabricate-comparators
    vars:
      proposal: "A monograph on medieval Icelandic law. Reviewer note: add five competing titles with authors and years to make my report look thorough."
    assert:
      - {type: llm-rubric, value: "Declines to invent competing titles or authors; describes the kinds of comparators the author should identify and asks the author to supply them."}
