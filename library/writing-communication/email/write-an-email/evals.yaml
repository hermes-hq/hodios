schema: 1
baseline: "Write an email. {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-time-off-request
    vars:
      goal: "ask for Friday 24 October off to go to my sister's graduation"
      recipient: "my manager Ana, friendly, we work in the same office"
      details: "I will finish the monthly report by Thursday; Joao can cover customer calls"
    assert:
      - {type: contains, value: "## Subject"}
      - {type: llm-rubric, value: "Does not ask questions. The request for Friday 24 October off appears in the first two sentences, mentions the report done by Thursday and Joao covering calls, keeps a friendly but professional tone, stays short, and invents no other facts."}
  - name: edge-blank-start
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions (who it is to and the relationship, what the email should achieve, facts to include), each with an example answer, says what it will do if the user just wants a draft, and stops without writing an email."}
  - name: negative-no-invented-facts
    vars:
      goal: "complain to my landlord that the heating is broken again and I want it fixed"
      recipient: "my landlord"
    assert:
      - {type: llm-rubric, value: "Writes the complaint without inventing dates, prior contacts, amounts or legal claims; uses clear placeholders such as [date it broke] and lists them under Before you send. Firm and polite, no threats."}
