schema: 1
baseline: "Write an email inviting {{speaker}} to speak at {{event}} for {{audience}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conference-panel
    vars:
      speaker: "Dr Yuki Tanaka, author of the 2024 study on four-day weeks in manufacturing plants; we have never met"
      event: "Panel on flexible work in manufacturing at the Midlands Operations Summit, Birmingham, 45 minutes, in person, three panelists plus moderator"
      audience: "about 300 plant managers and HR directors from mid-size manufacturers"
      offer: "500 GBP honorarium, rail travel and one hotel night; session recorded and published on our members' site"
      dates: "Thursday 12 March 2026, panel at 14:00; reply by 15 December"
    assert:
      - {type: contains-all, value: ["## Email", "## Short version", "## Have ready"]}
      - {type: llm-rubric, value: "Ties the invitation to her 2024 four-day-week study, describes the 300 plant managers and HR directors, states the 45-minute in-person panel on 12 March at 14:00, gives the honorarium, travel, hotel and the fact the session is recorded and published, asks for a reply by 15 December with a simple reply path, and stays under about 200 words with no gushing."}
  - name: edge-unpaid-podcast-via-assistant
    vars:
      speaker: "Former Olympic rower turned leadership author, bookings handled by her assistant Mark"
      event: "Episode of our small-business leadership podcast, 40-minute remote interview, topic: building team culture under pressure"
      audience: "about 1,500 listeners per episode, mostly owners of firms with under 50 staff"
      offer: "unpaid"
    assert:
      - {type: llm-rubric, value: "Addresses Mark, states plainly and early that the episode is unpaid without calling it exposure, gives the 40-minute remote format and audience of about 1,500 small-business owners, uses placeholders for date options and for the specific book or work rather than inventing titles, and is easy to forward."}
  - name: negative-no-reason-why-them
    vars:
      speaker: "someone famous in tech"
      event: "our event"
      audience: "people"
    assert:
      - {type: llm-rubric, value: "Does not draft a generic invitation; asks who the speaker is, why them, and what the event format and topic are."}
