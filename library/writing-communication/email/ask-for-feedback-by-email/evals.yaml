schema: 1
baseline: "Write an email asking {{recipient_relationship}} for feedback on {{work_or_topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-deck-draft
    vars:
      work_or_topic: "Draft of my 12-slide proposal to move customer support to a 24/7 follow-the-sun model. Structure is final; numbers are still being checked by finance."
      recipient_relationship: "two peer managers in other regions"
      deadline: "Wednesday 19 Nov, I present to the COO on the 21st"
      format: email-reply
    assert:
      - {type: contains-all, value: ["## Email", "## Questions"]}
      - {type: llm-rubric, value: "Asks no more than three specific numbered questions tied to the proposal (for example clarity of the recommendation, risks for their region, what to cut), says numbers are being checked so they need not comment on them, states the time needed and the 19 Nov deadline with the reason, invites candid criticism, and stays short."}
  - name: edge-performance-from-reports
    vars:
      work_or_topic: "How I run our weekly team meetings and one-to-ones; I'm a new manager, 4 months in."
      recipient_relationship: "my 6 direct reports"
      format: form
    assert:
      - {type: llm-rubric, value: "Uses behavioural, forward-looking questions about meetings and one-to-ones, offers anonymity because the recipients report to the sender, leaves the form link and deadline as placeholders, and promises to share what will change."}
  - name: negative-vague-topic
    vars:
      work_or_topic: "my stuff"
      recipient_relationship: "a friend"
    assert:
      - {type: llm-rubric, value: "Does not draft a generic feedback request; asks what specifically the feedback is about."}
