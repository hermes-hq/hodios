schema: 1
baseline: "Write an email introducing {{person_a}} to {{person_b}} because {{reason}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-founder-to-investor
    vars:
      person_a: "Nadia Haddad, founder of a 4-person startup making scheduling software for physiotherapy clinics; raising a pre-seed round; we worked together at a previous company."
      person_b: "Chris Moreau, angel investor and former clinic-chain COO; invests in healthcare SaaS; I know him from a founders' dinner; he is busy and gets many intro requests."
      reason: "Nadia wants 20 minutes of feedback on her pitch and to see if Chris is interested in investing; Chris knows clinic operations deeply and has said he wants more healthcare deal flow."
    assert:
      - {type: contains, value: "## Opt-in request"}
      - {type: llm-rubric, value: "Writes a private opt-in request to Chris first with an easy way to decline, then a short intro email with both names in the subject, one specific line on each, the reason tied to Chris's healthcare SaaS interest and clinic background, and a next step where Nadia follows up with times; invents no traction figures or titles."}
  - name: edge-mutual-opt-in
    vars:
      person_a: "Ravi, a senior data engineer at a bank, thinking about moving into climate tech."
      person_b: "Ingrid, head of data at a climate-tech startup, currently hiring two data engineers."
      reason: "Ravi might be a fit for Ingrid's open role, and Ingrid could tell him what climate tech is really like."
    assert:
      - {type: llm-rubric, value: "Considers that Ravi works at a bank and may not want his job search shared, so suggests checking with Ravi before telling Ingrid he is looking (or opting in both), and keeps the intro discreet and specific."}
  - name: negative-vague-reason
    vars:
      person_a: "My friend Sam"
      person_b: "My old boss Dana"
      reason: "They'd get on."
    assert:
      - {type: llm-rubric, value: "Asks one or two questions about what Sam wants, what each does, and why Dana would benefit, instead of writing a vague 'you two should connect' introduction with invented details."}
