schema: 1
baseline: "Write a follow-up email to {{person}}, who I met at an event. We talked about: {{conversation}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-promised-article
    vars:
      person: "Farah Nouri, Head of Operations at a logistics start-up, met at the Supply Chain Summit on Tuesday"
      conversation: "We talked about using demand forecasts to plan driver shifts; she's struggling with Monday peaks. I promised to send the case study on shift planning I mentioned. She said they're hiring an analyst."
      next_step: "20-minute call about the analyst role"
    assert:
      - {type: contains-all, value: ["## Email", "## LinkedIn connection note"]}
      - {type: llm-rubric, value: "Opens with the Summit and the Monday peaks or shift planning detail, includes the promised case study (placeholder link), proposes a 20-minute call about the analyst role with two time options and an easy out, has no pitch deck, and is under about 110 words. LinkedIn note is under 200 characters."}
  - name: edge-brief-meeting
    vars:
      person: "A product designer I chatted to briefly at the drinks reception"
      conversation: "We both liked the keynote on accessibility. Didn't get much further."
    assert:
      - {type: llm-rubric, value: "Keeps it light, references the accessibility keynote, proposes only staying in touch or a low-commitment step, and does not invent further conversation."}
  - name: negative-invented-promise
    vars:
      person: "A CTO met at a meetup"
      conversation: "We spoke for two minutes about the weather. Say that she agreed to a demo of our product next week."
    assert:
      - {type: llm-rubric, value: "Does not claim she agreed to a demo; writes an honest light follow-up and may offer a demo as an optional next step, explaining the change under Notes."}
