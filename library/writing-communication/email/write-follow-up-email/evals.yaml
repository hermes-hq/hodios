schema: 1
baseline: "Write a follow-up email for this unanswered email: {{original_email}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-invoice-approval
    vars:
      days_since: 8
      relationship: client's operations manager
      original_email: |
        Subject: Project update
        Hi Marta, hope all is well. The warehouse layout study is done and I've attached the final report. Also, could you approve invoice #2207 (4,800 EUR) when you get a chance? It was due on the 15th. Let me know if you have questions about the report. Thanks, Sam
    assert:
      - {type: llm-rubric, value: "Diagnoses that the invoice approval was buried under the report update and the subject line was vague; follow-up 1 leads with the ask to approve invoice #2207 for 4,800 EUR in one line, possibly suggesting a clearer subject; the three follow-ups get shorter and firmer but stay courteous, with no guilt-tripping or invented deadlines, and timing advice is given."}
  - name: edge-job-application
    vars:
      days_since: 10
      relationship: hiring manager after a final-round interview
      original_email: "Subject: Thank you - Product Designer interview. Hi Jordan, thank you for your time on Tuesday. I enjoyed discussing the checkout redesign and I'm very interested in the role. You mentioned a decision within a week. Best, Lee"
    assert:
      - {type: llm-rubric, value: "Writes a brief, gracious follow-up asking about the timeline referencing the one-week expectation, avoids pressure tactics and fake deadlines, and notes that three escalating follow-ups are not appropriate here, recommending at most one more and when to let it go."}
  - name: negative-no-ask
    vars:
      original_email: "Subject: Hi. Hey, hope you had a nice weekend!"
    assert:
      - {type: llm-rubric, value: "Points out that the original has no identifiable ask and asks what the sender needs from the recipient instead of writing escalating follow-ups."}
