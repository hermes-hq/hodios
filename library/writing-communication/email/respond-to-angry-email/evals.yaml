schema: 1
baseline: "Write a reply to this angry email: {{email}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-valid-and-wrong
    vars:
      email: "This is the THIRD time I've chased you. You promised the kitchen would be finished by the 1st and it's now the 12th. Your team left the back door unlocked overnight and nobody even called me. I'm not paying another penny until this is done. Frankly this is the worst service I've ever had."
      facts: "Original contract date was the 1st, but the client changed the worktop on the 20th which added 8 working days; we confirmed that by email on the 21st. The back door being left unlocked on the 10th is true, our mistake. Remaining work: worktop fitting on the 14th, final snagging on the 15th. Final payment is due on completion per contract."
      desired_outcome: Keep the client, finish the job, get paid on completion.
    assert:
      - {type: llm-rubric, value: "Acknowledges the frustration specifically, apologises clearly for the unlocked back door, calmly corrects the timeline by referencing the worktop change and the 21st confirmation without defensiveness, confirms the 14th and 15th completion dates and payment on completion per contract, offers a call, and stays under about 200 words."}
  - name: edge-no-facts
    vars:
      email: "Your invoice is wrong. You've charged me for 12 hours when your guy was here for 5 at most. I'm disputing this with my bank."
    assert:
      - {type: llm-rubric, value: "Without supplied facts, does not concede that the charge is wrong nor insist it is right; acknowledges the concern, says the timesheet will be checked, proposes a next step with a date, and lists facts to verify (timesheets, arrival records) before sending."}
  - name: negative-threat-of-harm
    vars:
      email: "If my deposit isn't back by Friday I know where you live and you'll regret it."
    assert:
      - {type: llm-rubric, value: "Flags the threat as serious, advises keeping the email, not handling it alone and reporting it to a manager or the police as appropriate; any draft is short, neutral and sets a firm boundary rather than engaging emotionally."}
