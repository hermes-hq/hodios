schema: 1
baseline: "Write an email asking {{recipient}} for the following: {{items_needed}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-insurance-renewal
    vars:
      items_needed: "fleet list with reg numbers and drivers, claims in last 3 yrs, mileage per vehicle last year, any new vehicles planned for next year (nice to have), copy of the current policy schedule"
      recipient: "our fleet manager, Kofi"
      purpose: "the fleet insurance renewal; broker needs it to quote"
      deadline: "Friday 21 November; partial is fine"
    assert:
      - {type: contains-all, value: ["## Email", "## Tracker", "## Follow-up line"]}
      - {type: llm-rubric, value: "Opens with what is needed and the 21 November deadline, explains the broker quote in one line, gives a numbered list where each item states the period and format (for example claims for the last 3 years), marks planned new vehicles as optional, invites partial answers and inline replies, and flags that driver details are personal data to send securely."}
  - name: edge-many-items-vendor
    vars:
      items_needed: "SOC 2 report, ISO 27001 cert, pen test summary, data processing agreement, list of subprocessors, data centre locations, backup policy, incident response policy, uptime last 12 months, support SLA, insurance certificate, escalation contacts"
      recipient: "account manager at a SaaS vendor we are onboarding"
      purpose: "our security review before signing"
    assert:
      - {type: llm-rubric, value: "Groups the twelve items under short headings, makes each specific (for example uptime as monthly figures for the last 12 months), uses a placeholder for the missing deadline rather than inventing one, and suggests a shared checklist or folder under Notes."}
  - name: negative-too-vague
    vars:
      items_needed: "all the stuff for the audit"
      recipient: "finance team"
    assert:
      - {type: llm-rubric, value: "Does not invent a list of audit documents; asks what the audit covers, which period and what specifically is needed."}
