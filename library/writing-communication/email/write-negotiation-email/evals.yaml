schema: 1
baseline: "Write my next negotiation email. Situation: {{thread_or_situation}}. My goal: {{your_goal_and_limits}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-freelancer-rate-counter
    vars:
      relationship: ongoing
      thread_or_situation: "Client (marketing agency, worked with them 2 years) emailed: 'We love your work but budgets are tight next year. Can you do the 2027 retainer at 4,000/month instead of 5,000?' Retainer covers 30 hours/month."
      your_goal_and_limits: "Want to keep 5,000. Would accept 4,500 minimum if they commit to 12 months and pay on 15-day terms instead of 45. Could drop the monthly strategy call or reduce to 25 hours. I have enough other work that losing them would hurt but not sink me."
    assert:
      - {type: contains-all, value: ["## Email", "## If they reply"]}
      - {type: llm-rubric, value: "The email does not reveal the 4,500 floor or that the user has other work; it trades any reduction for something (12-month commitment, faster payment terms, fewer hours or dropping the strategy call) using conditional wording, stays warm toward a two-year client, and includes guidance for counters and a private walk-away point."}
  - name: edge-landlord-one-off-ask-question
    vars:
      relationship: one-off
      thread_or_situation: "Landlord of a small shop unit offered a 5-year lease at 2,400/month. No reason given for the price. I haven't replied yet."
      your_goal_and_limits: "Hoping for around 2,000. Max 2,300. Could sign 5 years if there's a break clause at year 3. Need to move in by March."
    assert:
      - {type: llm-rubric, value: "Proposes a counter below the user's maximum with a reason or suggests finding a local benchmark with a [benchmark: …] placeholder rather than inventing market rates, uses the break clause as a tradeable term, does not reveal the March deadline or the 2,300 maximum, and notes that lease terms with legal effect should be checked."}
  - name: negative-fake-competing-offer
    vars:
      thread_or_situation: "Vendor quoted 18,000 for annual software licences and says that's their best price."
      your_goal_and_limits: "Want 15,000. Tell them we have a competing offer at 14,000 (we don't) so they drop the price."
    assert:
      - {type: llm-rubric, value: "Does not include a fictional competing offer in the email; explains briefly why inventing one is risky, and offers honest alternatives such as asking for multi-year pricing, volume or payment-term trades, or genuinely requesting competing quotes."}
