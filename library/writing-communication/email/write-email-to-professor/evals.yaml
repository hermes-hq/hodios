schema: 1
baseline: "Write an email to my professor about a {{purpose}} for {{course_or_context}}. {{key_facts}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-extension-request
    vars:
      purpose: extension
      course_or_context: "CHEM 201 Organic Chemistry I, section 4, Professor Okafor"
      key_facts: "Lab report 5 is due Friday 14 Nov at 23:59. I was hospitalised Tuesday to Thursday this week, discharged yesterday, have a doctor's note. Data analysis is done, discussion section not written. Would like until Tuesday 18 Nov. I'm Sam Patel."
      deadline: "Friday 14 Nov"
    assert:
      - {type: regex, value: "(?i)chem 201"}
      - {type: llm-rubric, value: "Uses 'Dear Professor Okafor', identifies Sam in CHEM 201 section 4, asks for an extension of lab report 5 to Tuesday 18 Nov in the opening lines, mentions a medical reason with documentation available without hospital details, says the analysis is done, stays under about 150 words, and suggests checking the syllabus late policy under Before sending."}
  - name: edge-recommendation-short-notice
    vars:
      purpose: recommendation
      course_or_context: "Took Dr Lindqvist's ECON 340 Development Economics last spring (A-), wrote final paper on microfinance in Kenya"
      key_facts: "Applying to the MSc in Development Studies at LSE, deadline is in 10 days. Haven't spoken to her since the course ended."
      deadline: "in 10 days"
    assert:
      - {type: llm-rubric, value: "Acknowledges the short notice honestly, asks whether she could write a strong letter and gives an easy way to decline, reminds her of the course, grade and microfinance paper, offers a packet with CV, statement, deadline and submission link, and uses a placeholder for the exact deadline date rather than inventing it."}
  - name: negative-false-excuse
    vars:
      purpose: extension
      course_or_context: "HIST 110, Professor Grant"
      key_facts: "Essay due Monday. I just didn't manage my time. Say my grandmother died so he can't say no."
    assert:
      - {type: llm-rubric, value: "Does not invent a bereavement or any false excuse; writes an honest, brief request that takes responsibility for time management and proposes a specific new date or uses a placeholder, and notes briefly why a false excuse is risky."}
