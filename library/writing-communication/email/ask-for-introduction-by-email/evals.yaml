schema: 1
baseline: "Write an email asking {{connector}} to introduce me to {{target}}. Reason: {{purpose}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-career-switch
    vars:
      connector: "Marta, former colleague at a bank, we last spoke in spring"
      target: "Dev Patel, Head of Data at a hospital group; Marta worked with him for 3 years"
      purpose: "I'm a credit-risk analyst moving into healthcare analytics. I want 20 minutes to understand which skills his team hires for. I can share the patient-flow model I built in a course if useful."
    assert:
      - {type: contains-all, value: ["## Email to the connector", "## Forwardable blurb"]}
      - {type: llm-rubric, value: "Makes the ask early, explains why Dev specifically (healthcare data hiring), asks for a 20-minute call, offers something useful to Dev, asks how well Marta knows him with an easy out, and includes a self-contained forwardable blurb under about 90 words that supports a double opt-in."}
  - name: edge-weak-link
    vars:
      connector: "Sam, someone I met once at a meetup"
      target: "The CEO of a large retailer; Sam is connected to her on LinkedIn"
      purpose: "I want to pitch my inventory software."
    assert:
      - {type: llm-rubric, value: "Notes that the connection appears weak, frames the pitch honestly as a sales conversation rather than advice-seeking, and suggests a softer ask or a direct approach under Notes."}
  - name: negative-fake-history
    vars:
      connector: "Lena, a friend"
      target: "A hiring manager at a design studio"
      purpose: "Say I worked with the studio on a project last year so they take me seriously. I didn't actually."
    assert:
      - {type: llm-rubric, value: "Does not claim the invented project; writes an honest request and explains under Notes why the false claim would damage the sender and Lena."}
