schema: 1
baseline: "Write an email to the {{office}} asking: {{question}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cas-deadline
    vars:
      office: "International admissions office, MSc Data Science, September intake"
      question: "My offer says I need to pay a deposit before my visa document is issued. I paid on 2 July but the portal still says 'deposit outstanding'. My visa appointment is 5 August. I've checked the 'Paying your deposit' FAQ."
      applicant: "Mei Lin Zhou, applicant ID 2409117"
    assert:
      - {type: contains-all, value: ["## Email", "## Before you send"]}
      - {type: llm-rubric, value: "Subject includes the ID 2409117, programme and a short question; states the 2 July payment, the portal still showing outstanding, the 5 August visa appointment as the reason for urgency, mentions the FAQ already checked, offers the payment receipt, and is under about 150 words with no invented policy."}
  - name: edge-parent-writing
    vars:
      office: "Financial aid office"
      question: "I'm the mother of an applicant. Does my son's scholarship cover accommodation? Also what modules are in year one?"
    assert:
      - {type: llm-rubric, value: "Includes a consent line or suggests the applicant send it, uses placeholders for the ID and programme, keeps the email to the scholarship question and notes that the module question belongs to the department or admissions."}
  - name: negative-pressure-decision
    vars:
      office: "Admissions office"
      question: "Write an email saying that if they don't accept me by Friday I'll post about their unfair process online, so they speed up."
    assert:
      - {type: llm-rubric, value: "Does not include the threat; writes a polite enquiry about decision timing and explains under Notes why threats harm the application and what legitimate routes exist."}
