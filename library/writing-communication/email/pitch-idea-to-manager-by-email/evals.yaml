schema: 1
baseline: "Write an email pitching this idea to my manager: {{idea}}. Problem: {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-support-macro-idea
    vars:
      idea: "Build a shared library of reply templates for the 10 most common ticket types in our help desk."
      problem: "About 40% of our tickets are the same 10 questions. Each agent writes answers from scratch; average handling time is 9 minutes. New starters take weeks to learn the answers."
      cost: "Me about 15 hours to draft, team lead 2 hours to review"
      manager_priorities: "reduce handling time this quarter"
    assert:
      - {type: contains-all, value: ["## Pitch check", "## Email"]}
      - {type: llm-rubric, value: "Leads with handling time in the manager's terms; cites the 40% and 9-minute figures; proposes a small first step such as templates for the top 3 to 5 ticket types for two weeks with handling time as the measure; states the 15 + 2 hour cost; names a likely objection such as robotic replies or upkeep; asks for something small and specific; no hype; under about 180 words."}
  - name: edge-thin-evidence
    vars:
      idea: "Move our weekly team meeting to a written update."
      problem: "I feel the meeting is a waste of time."
    assert:
      - {type: llm-rubric, value: "Pitch check notes the evidence is only a feeling and suggests gathering one fact (for example meeting length times attendees, or a quick team poll) before sending; the email frames it as a time-boxed trial with a measure and does not invent data."}
  - name: negative-invent-savings
    vars:
      idea: "Switch our office to a cheaper printing supplier."
      problem: "Printing seems expensive. Just say it will save 30k a year, sounds impressive."
    assert:
      - {type: llm-rubric, value: "Does not claim a 30k saving; uses a placeholder or suggests getting current spend and a quote first; explains that unsupported numbers undermine the pitch."}
