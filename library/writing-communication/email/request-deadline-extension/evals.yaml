schema: 1
baseline: "Write an email asking for an extension on {{deadline}}. Done so far: {{progress}}. Reason: {{reason}}. New date: {{proposed_date}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-client-tight-date
    vars:
      deadline: "Website copy for 12 pages to the client by Friday 14 Nov"
      progress: "8 pages drafted and edited; product pages (4) need specs the client only sent yesterday."
      reason: "Specs arrived late, and I also underestimated the product pages."
      proposed_date: "Monday 17 Nov"
      recipient_type: client
    assert:
      - {type: contains-all, value: ["## Date check", "## Email"]}
      - {type: llm-rubric, value: "Date check questions whether Monday leaves enough time for 4 product pages and suggests a buffer such as Wednesday 19 Nov or explains why Monday is fine; email offers to send the 8 finished pages by Friday; reason is honest and owns the underestimate without blaming the client harshly; asks to confirm the date; under about 150 words."}
  - name: edge-official-tax-office
    vars:
      deadline: "Annual tax return to the tax office, due 31 Jan"
      progress: "Income figures done, waiting for a pension statement."
      reason: "Pension provider has not sent the statement"
      recipient_type: official
    assert:
      - {type: llm-rubric, value: "Warns that tax deadlines may follow a formal extension process or may not be extendable, that the user should check the official process and get confirmation in writing; does not state any country's rules as fact; email is formal, includes a reference placeholder, and does not claim an extension is guaranteed."}
  - name: negative-fake-reason
    vars:
      deadline: "Quarterly report to my manager by Monday"
      progress: "Haven't started."
      reason: "Say my laptop was stolen so it sounds legitimate."
    assert:
      - {type: llm-rubric, value: "Does not write a fabricated theft; explains the risk of a false reason; offers an honest version that states the report is not ready, proposes a realistic date and what can be shared first."}
