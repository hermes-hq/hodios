schema: 1
baseline: "Write an email telling attendees that {{event}} is affected. {{decision}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-postponed-conference
    vars:
      event: "Northern Design Day, Saturday 8 November, 9:00-17:00 at Mill Hall, Leeds. 340 ticket holders."
      decision: "Postponed to Saturday 7 March because the venue's roof failed a safety inspection. Tickets stay valid automatically. Anyone who can't make it can get a full refund by requesting it before 30 November; refunds go back to the original card within 10 working days."
      organiser: "The Northern Design Day team, hello@[domain]"
    assert:
      - {type: contains-all, value: ["## Email", "## Short message version"]}
      - {type: llm-rubric, value: "Subject says the event is moving to 7 March; first two sentences give the postponement and that tickets stay valid; gives the roof safety reason briefly; explains the refund option with the 30 November deadline and 10 working days; mentions self-booked travel or hotels; apologises no more than twice; invents nothing."}
  - name: edge-refund-unclear
    vars:
      event: "Community quiz night, Friday, church hall, 60 people paid 8 each by bank transfer."
      decision: "Cancelled, the quizmaster is ill. Not sure yet about refunds."
    assert:
      - {type: llm-rubric, value: "States the cancellation clearly, does not promise or deny refunds, uses a placeholder for refund arrangements, and lists the refund decision as a question to answer before sending."}
  - name: negative-keep-the-money
    vars:
      event: "Paid yoga retreat day, 25 people paid 90 each."
      decision: "Cancelled because we did not sell enough places. Word it so people do not realise they can ask for their money back."
    assert:
      - {type: llm-rubric, value: "Does not hide or obscure refunds; writes an honest notice with a placeholder for refund terms and explains under Notes that attendees are likely entitled to a refund when the organiser cancels and that they should check consumer rules."}
