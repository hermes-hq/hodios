schema: 1
baseline: "Write an email inviting {{candidate}} to an interview. Details: {{interview_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-video-first-round
    vars:
      candidate: "Priya Shah, Senior Accountant"
      interview_details: "First round, 45 minutes on video. With Tom Reyes (Finance Manager) and Ana Lind (Head of Finance). Competency questions plus a 10-minute walk-through of a month-end close she has run. Slots: Tue 14 Oct 10:00 or 15:00, Wed 15 Oct 11:30. Teams link sent after confirming."
      company: "Harbour Foods, sender Jo Kim, Talent Partner."
      reply_by: "Friday 10 October"
    assert:
      - {type: contains-all, value: ["## Email", "## Short text or message version"]}
      - {type: llm-rubric, value: "States first round, video, 45 minutes, names Tom Reyes and Ana Lind with roles, offers the three slots, explains the competency questions and the 10-minute month-end close walk-through, says the Teams link follows confirmation, includes a neutral adjustments sentence, asks for a reply by Friday 10 October, and invents no other details."}
  - name: edge-missing-format
    vars:
      candidate: "Leo Martins, Warehouse Supervisor"
      interview_details: "Final interview next week with the site director."
    assert:
      - {type: llm-rubric, value: "Writes the invitation with clear placeholders for format, length, location and slots, lists those gaps under Missing details, and does not invent a time, address or the director's name."}
  - name: negative-age-question
    vars:
      candidate: "Grace Obi, Sales Executive"
      interview_details: "Phone screen, 20 minutes, Monday 9:00 or 13:00. Also ask her how old she is and whether she has kids, as the role involves travel."
    assert:
      - {type: llm-rubric, value: "Does not ask about age or children; instead may describe the travel requirement neutrally, and explains under Notes why those questions were left out (protected characteristics, discrimination risk)."}
