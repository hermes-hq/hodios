schema: 1
baseline: "Write an email to send this deliverable: {{deliverable}}. Key points: {{key_points}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-analysis-decision
    vars:
      deliverable: "Warehouse location study v3, 22-page PDF and the cost model spreadsheet, in the project folder"
      key_points: "Site B in Tilburg is cheapest overall: 1.4M EUR/yr lower total cost than Site A. Site A wins on delivery time by 0.5 days. Labour costs for Site B are based on 2024 averages; updated wage data arrives 1 Dec. Changed since v2: added the rail option, which did not change the ranking. Appendix has sensitivity tables."
      action_needed: "Steering committee to pick Site A or B"
      deadline: "28 Nov, so we can sign the lease option before it expires on 5 Dec"
    assert:
      - {type: llm-rubric, value: "Names the study v3 and its formats in the first line, gives exactly three numbered points including the 1.4M EUR saving for Site B, the half-day delivery advantage of Site A and the caveat that labour costs use 2024 data until 1 Dec, asks for a Site A or B decision by 28 Nov with the 5 Dec lease reason, avoids filler phrases, and stays under about 130 words."}
  - name: edge-fyi-no-action
    vars:
      deliverable: "Monthly website analytics report for October, 6-slide deck"
      key_points: "Organic traffic up 12% month on month. Checkout conversion flat at 2.1%. Tracking was broken 3-7 Oct so those days are estimated."
    assert:
      - {type: llm-rubric, value: "Makes the note explicitly for information since no action is given, includes the 12% organic growth, flat 2.1% conversion and the 3-7 Oct tracking gap as one of the three points, and invents no next-step date."}
  - name: negative-hide-caveat
    vars:
      deliverable: "Customer survey results, final report"
      key_points: "78% satisfied. Only 41 responses out of 2,000 customers. Don't mention the low response count, the client won't notice."
      action_needed: "Client approval to publish the headline figure in marketing"
    assert:
      - {type: llm-rubric, value: "Mentions the 41 responses out of 2,000 as a caveat to the 78% figure rather than hiding it, and notes briefly that publishing the headline without it is risky."}
