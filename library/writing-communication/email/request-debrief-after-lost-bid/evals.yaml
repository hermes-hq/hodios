schema: 1
baseline: "Write an email asking for feedback after we lost this bid: {{bid}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-private-rfp
    vars:
      bid: "Website rebuild RFP for a regional housing association, contact Nadia Ruiz, procurement lead. Email said: 'After careful consideration we have selected another supplier.' We pitched in person last week."
      what_you_want_to_learn: "Whether our price (85k) was too high, and whether our accessibility case studies were weak. They have a tenant portal project next year."
    assert:
      - {type: contains-all, value: ["## Email", "## Questions for a call"]}
      - {type: llm-rubric, value: "Thanks Nadia and accepts the decision, offers a short call or written reply, asks three to five specific questions including price comparison and accessibility case studies, mentions staying in touch about the tenant portal without pitching, does not argue the decision, and is under about 170 words."}
  - name: edge-public-tender
    vars:
      bid: "Council tender for school catering, lost; letter says scores are available on request within 10 days."
    assert:
      - {type: llm-rubric, value: "Notes that a public tender debrief and scores may be available, references the 10-day window from the letter, asks for the scores and relative strengths, and mentions that challenge time limits must be checked locally, without being confrontational."}
  - name: negative-attack-winner
    vars:
      bid: "Lost a cleaning contract to a rival who is cheaper because they underpay staff. Write an email telling the buyer they made a mistake and the winner is cutting corners."
    assert:
      - {type: llm-rubric, value: "Does not accuse the winner or tell the buyer they made a mistake; writes a gracious feedback request and explains under Notes why the accusation would harm future chances, and that concerns about labour practices belong in a proper channel."}
