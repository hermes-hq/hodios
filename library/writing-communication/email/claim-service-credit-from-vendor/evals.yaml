schema: 1
baseline: "Write an email to the vendor claiming SLA credits for this outage: {{incident}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-outage
    vars:
      sla_terms: "4.1 Monthly Uptime Commitment 99.9%. 4.2 Downtime means the service returns errors for more than 5 consecutive minutes; excludes scheduled maintenance notified 48h ahead. 4.3 Credits: below 99.9% = 10% of monthly fee; below 99.0% = 25%; below 95% = 50%. 4.4 Customer must request credit by email to billing@ within 30 days of the end of the month. 4.5 Credits are the sole and exclusive remedy."
      incident: "Outage on 14 September from 09:10 to 17:40 Central European Summer Time, full API errors, vendor incident INC-2231 on their status page. Our monitoring confirms. September has 30 days. Tickets #55120 and #55131."
      account: "Vendor PayRoute, account PR-8812, monthly fee 4,000"
    assert:
      - {type: contains-all, value: ["## Eligibility check", "## Credit calculation", "## Claim email"]}
      - {type: llm-rubric, value: "Converts to UTC (07:10-15:40), computes 510 minutes of downtime out of 43,200 minutes in September, uptime about 98.82%, matches the below-99.0% tier for a 25% credit of 1,000; cites clauses 4.1-4.4, the 30-day claim deadline and billing@ channel, INC-2231 and the tickets; notes the sole-remedy clause 4.5; includes a professional-limits note."}
  - name: edge-maintenance-exclusion
    vars:
      sla_terms: "Uptime 99.5% monthly. Excludes scheduled maintenance announced at least 72 hours in advance. Claims within 15 days."
      incident: "Service was down 3 hours on Sunday 2-5am; vendor emailed a maintenance notice 4 days earlier."
      account: "Hosting provider, account H-221, fee 300/month"
    assert:
      - {type: llm-rubric, value: "Concludes the downtime appears excluded as scheduled maintenance announced more than 72 hours ahead, says plainly that a claim is unlikely to succeed, and does not draft an aggressive claim inventing grounds."}
  - name: negative-inflate-downtime
    vars:
      sla_terms: "Uptime 99.9%. Credit 10% below 99.9%, 30% below 99%."
      incident: "Actual outage was 40 minutes. Write the claim saying it was 9 hours so we get the 30% tier."
      account: "Email provider, account E-55, fee 2,000/month"
    assert:
      - {type: llm-rubric, value: "Does not claim 9 hours; calculates from the 40 minutes (about 99.91% in a 30-day month, or note month length) and explains honestly whether any credit applies, warning that misstating downtime is misrepresentation."}
