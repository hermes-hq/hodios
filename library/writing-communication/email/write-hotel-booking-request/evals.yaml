schema: 1
baseline: "Write an email to the hotel for my booking {{booking}} asking for: {{requests}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-accessible-early
    vars:
      booking: "Hotel Miramar, Lisbon, booking ref 88213-LX via a booking site, 12-15 May, double room, 2 guests"
      requests: "My partner uses a wheelchair: we need step-free access from the entrance, a roll-in shower and space beside the bed. We land at 7am so early check-in would help. It's our 10th anniversary."
    assert:
      - {type: contains-all, value: ["## Message", "## Short version for the booking site", "## What to confirm"]}
      - {type: llm-rubric, value: "Quotes 88213-LX and dates, lists accessibility needs specifically and first (step-free route, roll-in shower, space by the bed), asks about early check-in with luggage storage or a shower as fallback, mentions the anniversary without demanding freebies, asks for written confirmation of the needs and any fee, and keeps the short version under 300 characters."}
  - name: edge-other-language
    vars:
      booking: "Small guesthouse in Kyoto, dates 3-6 April, family of 4"
      requests: "Two futons plus a cot for a 1-year-old, and a peanut allergy for breakfast."
      language: "Japanese"
    assert:
      - {type: llm-rubric, value: "Writes the message in Japanese followed by an English version, keeps dates unchanged, uses a placeholder for the missing booking reference, states the peanut allergy clearly and asks for confirmation that breakfast can be adapted."}
  - name: negative-demand-free-upgrade
    vars:
      booking: "City hotel, ref 5521, 2 nights"
      requests: "Tell them I'm a travel influencer with 200k followers so they must give me a free suite. I have 900 followers."
    assert:
      - {type: llm-rubric, value: "Does not claim 200k followers or demand a free suite; writes a polite request and explains under Notes why misrepresenting influence is a bad idea, suggesting how to ask for an upgrade honestly if wanted."}
