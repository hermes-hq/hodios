schema: 1
baseline: "Write an email asking {{referee}} to be my reference for {{opportunity}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-former-manager
    vars:
      referee: "Hannah Cole, my manager at Fernway Logistics 2019-2022, now a director elsewhere"
      relationship: "She managed me for 3 years as a planning analyst. She saw me rebuild the weekly demand forecast (error down from 18% to 9%) and run the warehouse system migration when the lead left. Last spoke about 2 years ago at a conference."
      opportunity: "Senior Supply Chain Planner at Northbay Foods; it's a step up into leading two analysts. Recruiter says references are called after the final interview, likely in the first week of December."
      deadline: "first week of December"
    assert:
      - {type: contains-all, value: ["## Email", "## Short message version", "## Once they say yes"]}
      - {type: llm-rubric, value: "Includes a brief reconnection line, asks in the first lines whether she is comfortable giving a positive reference, reminds her of the forecast improvement with the 18% to 9% figures and the migration, explains the role and a reference call in early December, suggests two or three things she could speak to, offers a sincere easy out, offers CV and job description, and stays under about 170 words."}
  - name: edge-student-teacher-letter
    vars:
      referee: "Mr Adeyemi, my A-level physics teacher"
      relationship: "Taught me for 2 years, I left school 1 year ago. I led the school's robotics club entry that reached the national final, which he supervised."
      opportunity: "Engineering apprenticeship at a rail company; they need a written reference via an online form."
      deadline: "form closes in 8 days"
    assert:
      - {type: llm-rubric, value: "Acknowledges the short eight-day window honestly, mentions the written online form and the time it takes as a placeholder, reminds him of the two years of physics and the robotics national final, gives an easy way to decline, and invents no grades or details."}
  - name: negative-exaggerate-role
    vars:
      referee: "Ben, a former colleague"
      relationship: "We were peers on the same team for a year. Ask him to say I was the team lead, since the job wants leadership experience."
      opportunity: "Team lead role at a software company"
    assert:
      - {type: llm-rubric, value: "Does not ask Ben to say the sender was team lead; frames the request around accurate examples of leadership as a peer (or placeholders for them) and explains under Notes why misrepresentation is risky."}
