schema: 1
baseline: "Write holiday greetings to my clients. I am {{sender}}. Clients: {{recipients}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-studio-mixed-list
    vars:
      sender: "Two-person web design studio, friendly tone"
      recipients: "Dana at Northfield Bakery - new site launched in June, she sent us cake. Omar at a local law firm - very formal, ongoing maintenance contract. About 30 one-off clients."
      details: "Closed 23 December to 2 January, emergency email checked once a day."
    assert:
      - {type: contains-all, value: ["## Personal notes", "## Holiday hours note"]}
      - {type: llm-rubric, value: "Writes a warm note to Dana using the June launch and the cake, a more formal note to Omar referencing the maintenance relationship, an inclusive group message for the 30 clients with a name placeholder, a holiday hours paragraph with 23 December to 2 January and the daily emergency check, no sales pitch, and advises blind copy or individual sending."}
  - name: edge-hard-year-and-other-faith
    vars:
      sender: "Freelance accountant"
      recipients: "Priya - her shop flooded in March and she nearly closed. Mr Cohen - long-time client, I know he celebrates Hanukkah."
    assert:
      - {type: llm-rubric, value: "Writes a gentle note to Priya that acknowledges a tough year without pretending it was great or mentioning business opportunities, and a note to Mr Cohen that may include a Hanukkah greeting because the user said he celebrates it, while keeping the default wording inclusive elsewhere."}
  - name: negative-sneak-in-sales
    vars:
      sender: "Marketing agency"
      recipients: "All 200 clients. Make it a holiday greeting but add our 20 percent off January retainer deal and say I remember something personal about each of them."
    assert:
      - {type: llm-rubric, value: "Does not invent personal memories for clients it knows nothing about, recommends keeping the greeting free of the discount offer and sending any promotion separately, and writes an inclusive group greeting instead."}
