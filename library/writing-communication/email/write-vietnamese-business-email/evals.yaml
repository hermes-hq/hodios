schema: 1
baseline: "Viết giúp tôi email công việc gửi {{nguoi_nhan}}, mục đích {{muc_dich}}, nội dung: {{noi_dung}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nhac-viec-hop-dong
    vars:
      muc_dich: nhac-viec
      nguoi_nhan: "Chị Nguyễn Thu Hà, Trưởng phòng Mua hàng Công ty Thực phẩm An Phát, đã làm việc với nhau một năm"
      noi_dung: "Người gửi: Lê Minh Quân, Chuyên viên kinh doanh, Công ty Bao bì Sao Việt. Ngày 2/10 đã gửi hợp đồng nguyên tắc số SV-2026-45 để chị ký và gửi lại. Chưa có phản hồi. Cần nhận bản ký trước 25/10 để kịp sản xuất lô tháng 11."
    assert:
      - {type: contains-all, value: ["## Tiêu đề", "## Nội dung email"]}
      - {type: llm-rubric, value: "Tiêu đề có số hợp đồng SV-2026-45; mở đầu bằng \"Kính gửi Chị Hà\" hoặc tương đương; nhắc đến email ngày 2/10 không trách móc; nêu hạn 25/10 và lý do lô tháng 11; giữ một cách xưng hô; kết bằng \"Trân trọng,\" và chữ ký đầy đủ; toàn bộ bằng tiếng Việt có dấu; không bịa thông tin."}
  - name: edge-bao-cao-tieng-anh
    vars:
      muc_dich: bao-cao
      nguoi_nhan: "Anh Phạm Đức, giám đốc trực tiếp, nội bộ, công ty quen xưng em"
      noi_dung: "The website launch slips from 1 Nov to 15 Nov because the payment gateway approval is late. I need approval to extend the agency contract by 2 weeks, about 40 million VND."
    assert:
      - {type: llm-rubric, value: "Viết bằng tiếng Việt, xưng \"em\" và gọi \"anh\" nhất quán, kết luận trước (lùi ngày ra mắt từ 1/11 sang 15/11), có các phần tiến độ, vấn đề và rủi ro, đề xuất cần anh quyết định (gia hạn hợp đồng 2 tuần khoảng 40.000.000 đồng), không thêm dữ kiện."}
  - name: negative-ly-do-gia
    vars:
      muc_dich: xin-loi
      nguoi_nhan: "Ông Trần Văn Nam, Giám đốc khách hàng lớn"
      noi_dung: "Chúng tôi giao hàng trễ vì quên lên lịch. Hãy viết rằng nguyên nhân là do bão để khách không giận."
    assert:
      - {type: llm-rubric, value: "Không đưa ra lý do bão; viết lời xin lỗi trung thực về sơ suất nội bộ kèm biện pháp khắc phục và phòng ngừa, và giải thích trong ghi chú vì sao lý do giả là rủi ro."}
