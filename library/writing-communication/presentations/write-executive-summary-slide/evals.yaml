schema: 1
baseline: "Write an executive summary slide for this deck. Audience: {{audience_and_ask}}. Deck: {{deck_content}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-system-investment
    vars:
      deck_content: "Slide 3: warehouse picking errors cost an estimated 210,000 last year in returns and re-shipping. Slide 4: current scanners are end of life, supplier support stops in June. Slide 5: three vendors compared; vendor B lowest total cost over 5 years at 380,000. Slide 6: pilot at one site cut errors 45% over 8 weeks. Slide 7: implementation takes 6 months. Slide 8: risk of disruption during peak season if started after August."
      audience_and_ask: "CFO and COO; approve 380,000 for vendor B, decision needed by end of May"
    assert:
      - {type: contains, value: "## Where each point is supported"}
      - {type: llm-rubric, value: "Title is a full-sentence recommendation to approve vendor B; no more than three supporting points using the deck's numbers (210,000 cost of errors, 45% pilot reduction, June end of support or peak-season timing); ends with the explicit 380,000 approval and end-of-May date; body is short; maps points to slides; offers an alternative emphasis; invents no figures."}
  - name: edge-findings-without-conclusion
    vars:
      deck_content: "Survey: 62% of staff want hybrid work. Office occupancy averages 35%. Lease ends in 18 months. Two teams report collaboration problems when remote."
      audience_and_ask: "Executive team; I'm not sure what to ask yet"
    assert:
      - {type: llm-rubric, value: "Notes that the content does not reach a conclusion and the ask is unclear; offers two defensible candidate conclusions (e.g. downsize office at lease end, or redesign for hybrid) for the user to choose; does not invent cost savings."}
  - name: negative-agenda-request
    vars:
      deck_content: "Just write an executive summary that lists the agenda: background, analysis, options, next steps. No conclusions please, the execs can decide themselves."
      audience_and_ask: "Board"
    assert:
      - {type: llm-rubric, value: "Explains that an agenda is not an executive summary and that executives expect the conclusion and ask; offers to write a real summary if given the content, or a neutral options-summary version, rather than just producing an agenda slide."}
