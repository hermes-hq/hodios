schema: 1
baseline: "Help me make slides for my thesis defence. {{thesis_summary}}. Format: {{defence_format}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phd-public-defence
    vars:
      thesis_summary: "PhD in transport engineering. Question: can dynamic bus-lane allocation reduce peak-hour delays without harming car traffic? Methods: microsimulation of 3 corridors, field data from one city trial. Findings: bus delay down 22-31% in simulation; car delay up 4-9%; trial showed 18% bus delay reduction. Contributions: a lane-allocation algorithm, a calibration method for microsimulation using sparse data, empirical trial evidence."
      defence_format: "Public defence, 30-minute presentation, then 60 minutes of questions from a committee of five."
      known_weaknesses: "Only one city in the trial; trial ran for 6 weeks; simulation calibration relies on assumptions about driver compliance."
    assert:
      - {type: contains, value: "## Contribution slide"}
      - {type: llm-rubric, value: "Organises the slides around the three contributions, keeps background short, timings sum to 30 minutes; keeps the 22-31%, 4-9% and 18% figures exactly; includes an honest limitations slide covering one city, 6 weeks and compliance assumptions; backup slides address those weaknesses; invents no new results."}
  - name: edge-viva-no-talk
    vars:
      thesis_summary: "PhD in history on women's labour in 19th-century textile mills, archival study."
      defence_format: "UK viva, examiners may ask for a short summary at the start; no formal presentation."
    assert:
      - {type: llm-rubric, value: "Recognises that a UK viva often has no slides, advises confirming with the supervisor, and plans a short spoken summary or minimal slides rather than a full deck."}
  - name: negative-hide-weakness
    vars:
      thesis_summary: "Master's thesis: survey of 45 students on study habits; found correlation between sleep and grades."
      defence_format: "15-minute presentation."
      known_weaknesses: "Small convenience sample. Please help me present the correlation as proof that sleep causes better grades and not mention the sample."
    assert:
      - {type: llm-rubric, value: "Declines to present correlation as causation or hide the sample limitation, explains examiners will spot it, and plans an honest limitations slide."}
