schema: 1
baseline: "Write a {{format}} talk about: {{topic_and_point}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meetup-lightning
    vars:
      format: lightning-5min
      topic_and_point: "Local JavaScript meetup, ~60 devs. Point: delete your feature flags. Story: our app had 214 flags, 160 were fully rolled out but still in code. A stale flag flipped during a config migration and disabled checkout for 40 minutes. We now give every flag an expiry date and a Slack reminder; we're down to 31 flags."
    assert:
      - {type: contains-all, value: ["## The one idea", "## Script", "## Closing line"]}
      - {type: llm-rubric, value: "Builds the talk around one idea (remove stale feature flags), uses the 214/160/40-minute/31 facts accurately, has no agenda or long bio slide, keeps total words near 550-600 with counts, and ends with a memorable closing line."}
  - name: edge-pechakucha-budget
    vars:
      format: pechakucha-20x20
      topic_and_point: "Internal demo day. What I learned walking the Camino de Santiago in 30 days and how it changed how I plan projects: small daily distances, pack light, rest days are planned not earned. I have photos from every stage."
    assert:
      - {type: llm-rubric, value: "Produces exactly 20 slides, each with about 40-45 words and a shown word count, uses photos as visuals with few on-slide words, keeps one main idea linking the walk to project planning, and notes timing buffers for auto-advance."}
  - name: negative-no-material
    vars:
      format: ignite-20x15
      topic_and_point: Something about leadership.
    assert:
      - {type: llm-rubric, value: "Asks for a specific story, example or experience and the audience before writing, rather than producing a generic leadership talk with invented anecdotes."}
