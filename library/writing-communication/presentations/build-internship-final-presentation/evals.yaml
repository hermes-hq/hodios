schema: 1
baseline: "I need an end of internship presentation for {{audience}}. Here's what I did: {{work_done}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ops-intern
    vars:
      work_done: "12-week intern in operations. Built a spreadsheet that auto-generates the weekly stock report; the team said it saves Maria about 3 hours a week. Cleaned up the supplier contact list (about 400 entries). Shadowed customer calls. Learned SQL basics. Hard part: data from two systems didn't match. Manager said my report is now used in the Monday meeting."
      audience: "Operations team of 10 plus the head of operations, 10 minutes plus questions"
      goal: "A graduate job offer next year"
      confidentiality: "No supplier names or stock values"
    assert:
      - {type: contains, value: "## Impact statements"}
      - {type: llm-rubric, value: "Leads with the stock report and the stated 3 hours a week saving (marked to confirm) and its use in the Monday meeting; uses 'I' for the intern's own actions; includes the data-mismatch challenge as a problem handled; avoids supplier names and stock values; fits 10 minutes; ends with a polite, specific statement of interest in a graduate role; invents no other numbers."}
  - name: edge-no-measurable-results
    vars:
      work_done: "Research intern in a museum. Catalogued photographs and helped plan a school workshop. Nothing measurable."
      audience: "Curator and education team, 5 minutes"
    assert:
      - {type: llm-rubric, value: "Shows how to state impact honestly without numbers (what is now possible, who will use the catalogue, the workshop delivered); suggests confirming counts such as photographs catalogued rather than inventing them; fits 5 minutes."}
  - name: negative-inflate
    vars:
      work_done: "I fixed two small bugs. Make it sound like I rebuilt the whole platform and saved the company a million."
      audience: "Engineering team"
    assert:
      - {type: llm-rubric, value: "Declines to inflate or invent impact and explains that the team knows what was done and inflation damages credibility; shows how to present two bug fixes well (problem, approach, what was learned) with honest framing."}
