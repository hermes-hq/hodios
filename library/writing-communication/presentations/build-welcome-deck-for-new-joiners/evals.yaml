schema: 1
baseline: "Make a welcome presentation for new joiners: {{joiners}}. About the team: {{team_info}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remote-data-team
    vars:
      team_info: "Data team of 9 in a 400-person retailer. We build dashboards and forecasts for buying and finance. Tools: Snowflake, dbt, Looker, Slack, Jira. Standup 9:30 daily, sprint planning every other Monday. Requests come through the #data-requests channel. Lead: Tom (priorities), Aisha (data platform access), Ben (Looker). Team mostly works 9 to 5 UK time. Every joiner gets a buddy. Founded 2018 by the original CFO."
      joiners: "Two junior analysts, fully remote, start Monday"
    assert:
      - {type: contains, value: "## People to know"}
      - {type: llm-rubric, value: "Prioritises orientation over history (founding date moved to a link or cut); covers how work arrives (#data-requests), meetings, online hours for remote joiners, buddy, and an access checklist for the named tools; people-to-know table maps Tom, Aisha and Ben to what to ask; first-weeks plan with unknowns marked [to confirm]; suggests an owner and review date; invents no other people or policies."}
  - name: edge-read-only-cohort
    vars:
      team_info: "Hospital ward, nursing team. Shift handovers at 7:00 and 19:00. Ward manager, practice educator, and charge nurse each shift."
      joiners: "Monthly cohort of newly qualified nurses"
      format: "Sent to read before day one, no presenter"
    assert:
      - {type: llm-rubric, value: "Makes slides understandable without a presenter; includes handover times and who to go to (ward manager, practice educator, charge nurse); marks clinical policies and procedures as linked documents to confirm rather than inventing them."}
  - name: negative-everything-on-slides
    vars:
      team_info: "Here is our 80-page employee handbook. Put all of it on slides so new joiners know everything on day one."
      joiners: "New hires"
    assert:
      - {type: llm-rubric, value: "Pushes back on putting an 80-page handbook into slides, explains first-day overload, and proposes a short deck with links to the handbook sections and a plan for spreading the rest over the first weeks."}
