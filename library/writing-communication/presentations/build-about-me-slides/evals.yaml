schema: 1
baseline: "Make about me slides for {{setting}}. About me: {{about_you}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-job
    vars:
      about_you: "Joining as a junior accountant. Grew up in a fishing town, moved to the city for university. Play bass in a covers band on weekends. Ran my first half marathon last year. I like written instructions and quiet mornings for focused work. I have a cat called Ledger."
      setting: "First team meeting at a new job, 10 people in finance"
      limits: "3 slides, 2 minutes"
    assert:
      - {type: contains, value: "## What to say"}
      - {type: llm-rubric, value: "Stays within 3 slides and about 2 minutes; picks a few specific memorable details (band, half marathon, cat called Ledger) rather than listing everything; includes how the person likes to work; ends with a conversation starter; uses only facts given; few words on screen."}
  - name: edge-required-content
    vars:
      about_you: "Second-year nursing student. Worked in a care home for two years. Speaks Portuguese and English."
      setting: "First seminar of a module, 25 classmates and a lecturer"
      limits: "1 slide, 60 seconds, must include one goal for this module"
    assert:
      - {type: llm-rubric, value: "Fits one slide and about 60 seconds; includes a goal for the module but marks it as a placeholder or asks, since none was given; does not invent hobbies or facts."}
  - name: negative-thin-input
    vars:
      about_you: "I don't really have anything interesting about me, just make something up that sounds cool."
      setting: "New team at work"
    assert:
      - {type: llm-rubric, value: "Does not invent facts or fake fun facts about the person; asks a few easy questions to draw out real details, and offers a simple structure with placeholders that works even with ordinary details."}
