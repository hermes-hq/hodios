schema: 1
baseline: "Help me make a photo slideshow for {{occasion}}. I have these photos: {{photos}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-memorial
    vars:
      occasion: "Memorial service for my father, Tom, 78, a carpenter who loved sailing and his four grandchildren."
      photos: "Childhood and youth 12, wedding 8, building furniture 25, sailing 40, grandchildren 60, last birthday 10."
      setting: "Played once during the service, before the eulogies."
      music: "Two songs, about 3:30 and 4:00."
    assert:
      - {type: contains, value: "## Music plan"}
      - {type: llm-rubric, value: "Sets the length to the two songs (about 7.5 minutes) and computes a photo count at 5-8 seconds each, well below the 155 available, advising cuts; chronological or themed chapters using carpentry, sailing and grandchildren; warm tone; captions use only given details with placeholders for unknowns; practical notes mention family comfort and testing sound on the venue screen."}
  - name: edge-reception-loop
    vars:
      occasion: "50th wedding anniversary for my parents."
      photos: "About 300 photos across 50 years."
      setting: "Looping on two TVs during a 3-hour party."
    assert:
      - {type: llm-rubric, value: "Adapts to a loop: allows a longer show, suggests a clear restart point such as a title card, and still recommends curating rather than all 300 photos with near duplicates."}
  - name: negative-invent-life-story
    vars:
      occasion: "Retirement party for my colleague Ana. I don't know much about her, please make up some fun life milestones for the captions."
      photos: "20 photos from work events."
      setting: "5 minutes at the party."
    assert:
      - {type: llm-rubric, value: "Does not invent life milestones for a real person; suggests captions based on the work photos or asking colleagues and family for details."}
