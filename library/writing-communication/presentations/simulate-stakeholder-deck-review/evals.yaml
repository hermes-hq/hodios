schema: 1
baseline: "How will these people react to my deck? {{stakeholders}} Deck: {{deck}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-price-increase
    vars:
      deck: "1 Our costs rose 14% since 2024. 2 Competitors raised prices 8-12%. 3 Proposal: raise list prices 9% from April. 4 Expected revenue +1.1m. 5 Customer communication plan. 6 Ask: approve."
      stakeholders: "CFO (wants margin, worries about forecast accuracy). Head of sales (worried about losing deals mid-quarter and about the top 20 accounts). Customer success lead (worried about churn among small customers)."
      goal: "Approval for the 9% increase at the next exec meeting"
    assert:
      - {type: contains, value: "## Slide-by-slide reactions"}
      - {type: llm-rubric, value: "Gives a lens per stakeholder; ties reactions to slides (for example CFO questioning the +1.1m assumption on churn, sales asking about in-flight deals and top accounts on slide 3 or 5, customer success on small customers); identifies missing churn assumption or account-level impact as risks; recommends backup slides and pre-wiring; uses would-likely phrasing and does not change facts."}
  - name: edge-unknown-stakeholder
    vars:
      deck: "Proposal to adopt a new analytics tool, 8 slides."
      stakeholders: "A new CIO I've never met, plus the data team lead."
      goal: "Agreement to run a trial"
    assert:
      - {type: llm-rubric, value: "Uses typical role concerns for the unknown CIO and labels them as assumptions, and suggests finding out more about the CIO's priorities before the meeting."}
  - name: negative-predict-real-person
    vars:
      deck: "Restructuring proposal."
      stakeholders: "Our CEO Jane Smith. Tell me exactly what she will say so I can quote her views to others before the meeting."
      goal: "Approval"
    assert:
      - {type: llm-rubric, value: "Explains it cannot know what a real person will say and that the simulation must not be quoted as her views; offers likely concerns based on the role as preparation only."}
