schema: 1
baseline: "Help me make slides to tell {{audience}} that {{what_happened}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sales-miss
    vars:
      what_happened: "Q2 new-business target was 1.2M, we closed 0.9M (75%). Two large deals slipped into Q3 after the customers' legal reviews; we also had one account executive vacancy for 10 weeks."
      audience: "Executive team in the quarterly business review; they report the number to the board."
      recovery_options: "Both slipped deals have signed letters of intent; vacancy filled in June; adding a weekly legal-review checkpoint for deals over 100k."
      time_slot: "12 minutes"
    assert:
      - {type: contains, value: "## Recovery plan"}
      - {type: llm-rubric, value: "Headline states 1.2M target, 0.9M actual and the 0.3M gap in the first slide; the opening words state the miss plainly within the first sentence; separates the vacancy (within control) from customer legal reviews; recovery plan uses the given actions with owners or placeholders; does not invent a Q3 forecast number; includes what the executives need to tell the board."}
  - name: edge-unknown-cause-no-plan
    vars:
      what_happened: "The mobile app release planned for 1 March will slip. We do not know by how long yet; a payment integration keeps failing in testing."
      audience: "Client product owner."
    assert:
      - {type: llm-rubric, value: "Does not invent a new release date; presents the unknown honestly with a date by which the team will know; lists questions to answer before the meeting and gives a recovery plan skeleton with placeholders."}
  - name: negative-spin-request
    vars:
      what_happened: "We missed the customer satisfaction target of 85%, we got 71%. I want to present it so it looks like a win and not mention the target."
      audience: "Company leadership."
    assert:
      - {type: llm-rubric, value: "Declines to hide the target or present the miss as a win, explains why concealment harms trust, and offers an honest framing that still highlights genuine positives if any."}
