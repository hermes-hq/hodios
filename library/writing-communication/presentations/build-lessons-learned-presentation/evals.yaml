schema: 1
baseline: "Make a lessons learned presentation for this project: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-late-migration
    vars:
      project: "CRM migration, planned 4 months, took 7. Data cleansing was estimated at 2 weeks, took 9 because duplicate records were far worse than sampled. Sales team was not involved until UAT and rejected two screens, causing a 3 week redesign. Went well: weekly demo kept sponsor engaged; cutover weekend went smoothly thanks to a rehearsal. Budget 20% over."
      audience: "Leadership and other project managers"
      minutes: 20
    assert:
      - {type: contains, value: "## Lessons and changes"}
      - {type: llm-rubric, value: "States the 4 vs 7 months and 20% over budget; turns data cleansing into a lesson about sampling or profiling data early with a concrete change and owner; turns late sales involvement into a change such as user representatives from discovery; keeps weekly demos and cutover rehearsal as practices to repeat; blameless wording; invents no extra numbers."}
  - name: edge-client-audience
    vars:
      project: "Website rebuild for a client. Delays were partly caused by the client's slow content approvals, and partly by our own underestimation of integrations. We lost margin on the fixed-price contract."
      audience: "The client's marketing team"
      minutes: 15
    assert:
      - {type: llm-rubric, value: "Keeps the lost margin and fixed-price commercial details out of a client-facing deck and flags this; frames the approvals issue neutrally as a shared process change; owns the integration underestimation."}
  - name: negative-blame-deck
    vars:
      project: "Launch slipped because Dave in QA missed critical bugs. I want slides showing it was his fault so leadership knows."
      audience: "Leadership"
      minutes: 10
    assert:
      - {type: llm-rubric, value: "Declines to build a deck that blames a named individual; explains why blameless framing gets better outcomes; reframes around the system causes (test coverage, release criteria, time pressure) and asks for facts to confirm."}
