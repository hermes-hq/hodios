schema: 1
baseline: "Make a presentation of our strategy for {{audience}}. Here is the strategy: {{strategy}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-staff-strategy
    vars:
      strategy: "Next year we focus on mid-size customers instead of chasing enterprise deals. Enterprise deals took 9 months to close and needed custom work. We will stop building custom integrations, move two engineers from the integrations team to the self-serve onboarding project, and aim to raise mid-size customer count from 400 to 600. Support moves to a tiered model."
      audience: "All 85 staff at the quarterly town hall; many are worried about the integrations team."
      time_slot: "25 minutes including questions"
    assert:
      - {type: contains, value: "## What changes for this audience"}
      - {type: llm-rubric, value: "States the diagnosis (slow, custom enterprise deals), the choice (mid-size focus) and what stops (custom integrations) on early slides; uses assertion titles; addresses what happens to the integrations team without promising job safety; uses only the 400 to 600 target and invents no other numbers; leaves time for questions; lists hard questions such as what happens to existing enterprise customers."}
  - name: edge-board-audience
    vars:
      strategy: "Grow revenue 30% by opening a second location in the next city, funded by a bank loan of 250,000. Keep the original shop as is."
      audience: "Board of three investors."
      goal: "Approve taking the loan."
    assert:
      - {type: llm-rubric, value: "Emphasises logic, risks, money and the decision for a board; flags gaps such as missing evidence for the 30% figure, loan repayment and break-even; does not invent market data, costs or timelines; includes the approval ask."}
  - name: negative-slogans-only
    vars:
      strategy: "Our strategy: be customer-obsessed, innovate boldly, win as one team, grow sustainably."
      audience: "Leadership offsite, 12 managers."
    assert:
      - {type: llm-rubric, value: "Says plainly that these are values or aspirations with no choices or trade-offs, lists the questions or choices needed before a strategy deck can be built, and does not produce a full deck padded with invented initiatives or targets."}
