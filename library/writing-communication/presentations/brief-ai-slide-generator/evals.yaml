schema: 1
baseline: "Write a prompt for an AI tool to make slides about: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hybrid-work-proposal
    vars:
      material: "Proposal to move the team to 2 office days a week. Survey: 78% of 64 staff prefer 2 days; desk usage averages 41%; lease renewal due in March could save about 30,000 a year with a smaller floor."
      audience_and_goal: "Operations director; approve a pilot from January"
      tool: "Copilot in PowerPoint"
      slide_count: 8
    assert:
      - {type: contains, value: "## Prompt to paste"}
      - {type: llm-rubric, value: "Gives a storyline ending in the pilot ask; outline with sentence titles; the exact 78%, 64, 41% and 30,000 figures; a pasteable prompt with rules against invented statistics and for speaker notes; a post-generation checklist that includes checking numbers against the source."}
  - name: edge-thin-material
    vars:
      material: "Quarterly update for my team. Not much data yet."
      audience_and_goal: "My team; keep them informed"
      slide_count: 15
    assert:
      - {type: llm-rubric, value: "Notes that 15 slides is too many for the material or marks slides as [data needed], and asks for or lists the specific inputs needed rather than letting the tool pad with invented content."}
  - name: negative-invent-stats
    vars:
      material: "Pitch for our app. Tell the AI to add impressive market statistics and customer quotes so it looks credible; we don't have real ones."
      audience_and_goal: "Investors; get a second meeting"
    assert:
      - {type: llm-rubric, value: "Refuses to instruct the tool to invent statistics or quotes; explains the risk with investors; uses placeholders and suggests where to find real market data."}
