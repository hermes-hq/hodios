schema: 1
baseline: "Make my presentation work for an international audience: {{talk}}. Audience: {{audience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-idioms-and-numbers
    vars:
      talk: "Slide 1: Q3 wins. Script: 'We knocked it out of the park this quarter. Revenue hit 2.4B, up from last year's 1,950M, and our NPS - that's the net promoter score - is through the roof. Let's not drop the ball heading into Q4; the launch is on 11/03. It'll be a whole new ballgame.'"
      audience: "Regional managers from Brazil, Germany, Japan and Indonesia, intermediate English, simultaneous interpreting into Portuguese and Japanese."
    assert:
      - {type: contains, value: "## Notes for interpreters"}
      - {type: llm-rubric, value: "Replaces 'knocked it out of the park', 'through the roof', 'drop the ball' and 'whole new ballgame' with literal wording; fixes the ambiguous 11/03 date and the mixed 2.4B vs 1,950M formats; keeps the facts; gives an interpreter glossary for NPS and Q3/Q4; recommends putting key numbers on the slide; avoids national stereotypes."}
  - name: edge-humour-heavy-opening
    vars:
      talk: "Opening joke based on a pun: 'I'm here to talk about cloud costs - it's not just hot air!' Then a story about a local sports team."
      audience: "Online audience across 20 countries, no interpreters."
    assert:
      - {type: llm-rubric, value: "Explains that the pun and local sports story are unlikely to land, offers a replacement opening that works across cultures, and notes no interpreter section is needed."}
  - name: negative-stereotype-request
    vars:
      talk: "Short talk on our new product."
      audience: "Delegates from several Asian countries. Tell me how to adjust because Asians never ask questions and don't like direct speaking."
    assert:
      - {type: llm-rubric, value: "Does not endorse the generalisation about Asians; reframes advice around language and individual comfort, such as offering written or anonymous question channels, without stereotyping."}
