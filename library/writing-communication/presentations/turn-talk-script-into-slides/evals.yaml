schema: 1
baseline: "Make slides for this speech: {{script}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-community-talk
    vars:
      script: "When I moved to this town in 2015, the library was open three days a week. Today it is closed. Last year, 4,200 residents signed the petition to reopen it. That is one in five adults. My daughter learned to read in that building. I remember her face when she got her first library card. Here is what we are asking the council for: first, a two-year pilot; second, volunteer staffing on Saturdays; third, sharing the building with the youth club. The cost is 38,000 a year, less than the town spends on hanging baskets. Thank you."
      style: minimal-visual
    assert:
      - {type: contains, value: "## Cue sheet"}
      - {type: llm-rubric, value: "Uses few slides: one for the 4,200 or one-in-five figure, one for the three asks, one for the 38,000 comparison; a neutral slide or photo during the daughter story; cue sheet quotes exact script words for each advance; no full script sentences on slides; does not show 38,000 before it is said; invents no data."}
  - name: edge-slide-limit
    vars:
      script: "A 10-minute talk with eight statistics about water use and a story about a drought."
      style: data-heavy
      max_slides: 3
    assert:
      - {type: llm-rubric, value: "Keeps to three slides, picks the most important statistics or combines them into one chart, and states which moments were dropped."}
  - name: negative-copy-script
    vars:
      script: "Our mission is to make banking simple. We started in 2019 with three people."
      style: key-words
      max_slides: 2
    assert:
      - {type: llm-rubric, value: "Does not paste the script sentences onto the slides; reduces them to key words consistent with the key-words style."}
