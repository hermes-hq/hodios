schema: 1
baseline: "Create a kickoff presentation for this project: {{project_brief}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-internal-crm
    vars:
      project_brief: "Replace the spreadsheet-based sales tracking with a CRM. Why: lost leads, no pipeline visibility. Deadline: live by 1 April. Team: Priya (PM), 2 sales ops analysts, 1 IT admin. Sponsor: Sales Director. Vendor already chosen. Not yet decided: data migration scope, who owns the CRM after launch."
      kickoff_type: internal-team
      minutes: 60
    assert:
      - {type: contains, value: "## Decisions for the room"}
      - {type: llm-rubric, value: "Includes why-now, success measures (flagged as missing if not given), explicit out-of-scope, roles and decision rights, milestones toward 1 April, risks, ways of working; leaves at least 20 minutes for discussion; turns migration scope and post-launch ownership into decision questions; invents no dates or names beyond the brief."}
  - name: edge-client-kickoff
    vars:
      project_brief: "Website redesign for a client, a regional dental chain. 12 weeks. Our margin is thin, so we must limit revisions to two rounds. Client contacts: marketing manager and the owner."
      kickoff_type: client
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Does not show the margin on a slide; frames the two-round revision limit as an expectation about approvals and change requests; includes client response times and who approves on the client side."}
  - name: negative-thin-brief
    vars:
      project_brief: "New project starting next week."
      kickoff_type: internal-team
    assert:
      - {type: llm-rubric, value: "Does not fabricate goals, dates or roles; produces a skeleton with placeholders and a substantial gaps checklist, or asks for the missing project details."}
