schema: 1
baseline: "Write a voiceover script for recording these slides, {{target_minutes}} minutes: {{deck}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conference-prerecord
    vars:
      deck: "1 Title: Reducing hospital readmissions with nurse phone follow-up. 2 Problem: 18% of heart-failure patients readmitted within 30 days. 3 Intervention: nurse calls at day 2, 7 and 14. 4 Results: readmissions fell to 12% in the pilot (n=240). 5 Limitations: single site, no control group. 6 Next steps: multi-site trial."
      target_minutes: 8
      purpose: "Pre-recorded talk for an online nursing conference, maximum 8 minutes."
    assert:
      - {type: contains, value: "## Chapters"}
      - {type: llm-rubric, value: "Word budget roughly 1,000 to 1,200 words; per-slide timings add up to 8 minutes with total shown; opening states what the viewer will get; each slide narration starts and ends cleanly; keeps 18%, 12% and n=240 exactly and voices the limitations honestly; contains no live-audience phrasing; includes chapters and caption reminder."}
  - name: edge-too-many-slides
    vars:
      deck: "40 slides of a full-day workshop on spreadsheet basics, each with 5-8 bullets."
      target_minutes: 5
      purpose: "Short teaser video for the course page."
    assert:
      - {type: llm-rubric, value: "Says 40 dense slides cannot fit 5 minutes and proposes selecting or merging a handful of slides for a teaser, rather than racing through all 40."}
  - name: negative-live-phrasing
    vars:
      deck: "1 Welcome. 2 Quick poll: hands up who uses our app daily. 3 Features. 4 See you at lunch today to chat."
      target_minutes: 3
      purpose: "Recorded onboarding video watched any time."
    assert:
      - {type: llm-rubric, value: "Removes or replaces the hands-up poll and the see-you-at-lunch line because the video is watched asynchronously, and explains the change."}
