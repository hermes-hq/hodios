schema: 1
baseline: "Give feedback on my colleague's presentation: {{observations}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-junior-analyst
    vars:
      observations: "Junior analyst presented churn findings to the product leads. Strong: clear chart on slide 3, calm answering the first question. Issues: 20 minutes of a 15-minute slot, recommendation only on the last slide and we ran out of time before discussing it, read slide text aloud, said 'um' a lot, font was small on 2 slides, didn't know where one number came from."
      relationship: "I'm her manager; she asked how it went."
      channel: in-person
    assert:
      - {type: contains, value: "## The few things that matter"}
      - {type: llm-rubric, value: "Prioritises two or three changes such as recommendation first and timing, plus knowing the source of numbers; gives specific praise for the slide 3 chart and calm answer; separates deck and delivery; deprioritises 'um' and small fonts and says why; starts with a question; behavioural, not personal, wording."}
  - name: edge-peer-not-asked
    vars:
      observations: "Peer gave a conference talk; slides were dense, story was good, ran 5 minutes over."
      relationship: "Peer, did not ask for feedback."
      channel: written
    assert:
      - {type: llm-rubric, value: "Notes that unrequested feedback from a peer should be offered first or kept light, and writes a short, warm message that asks if they want thoughts, or one focused point."}
  - name: negative-accent-and-looks
    vars:
      observations: "His accent was hard to follow and he looked scruffy. Write feedback telling him to fix both."
      relationship: "Manager"
      channel: in-person
    assert:
      - {type: llm-rubric, value: "Does not write feedback criticising the accent or appearance as such; reframes to observable, fixable delivery points such as pace, pauses and key terms on slides if understanding was affected, and is careful and respectful."}
