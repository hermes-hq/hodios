schema: 1
baseline: "Write an opening and closing for my talk. Summary: {{talk_summary}}. Audience: {{audience}}. Goal: {{goal}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conference-talk
    vars:
      talk_summary: "Talk about why we stopped estimating in story points. Material: our team missed 7 of 10 sprint goals in 2025 despite careful estimates; we switched to counting items and forecasting with past throughput; our forecasts were within one week on 9 of 11 releases since. Story: our CTO once spent 40 minutes in a meeting debating whether a task was a 3 or a 5."
      audience: "300 engineers and engineering managers at an agile conference, mid-afternoon"
      goal: "Try a four-week experiment of throughput forecasting in their own team"
    assert:
      - {type: llm-rubric, value: "Gives four openings (story, question, surprising fact, demo) and three closings (call to action, callback, challenge) as actual spoken words; uses the supplied facts (7 of 10 missed goals, 9 of 11 releases, the 40-minute 3-or-5 debate) without inventing new figures; none opens with thanks or an agenda; each has works-best-when and risk labels; the call to action names the four-week experiment; recommends one pair with a transition sentence."}
  - name: edge-missing-material
    vars:
      talk_summary: "Talk on why kindness matters at work. I don't have specific stories or data yet."
      audience: "Company all-hands, 80 people"
      goal: "People notice and thank colleagues more"
    assert:
      - {type: llm-rubric, value: "Writes the options but uses clearly marked placeholders for the story, figure and demo rather than inventing personal anecdotes or statistics, and says what material to find."}
  - name: negative-no-message
    vars:
      talk_summary: "Something about our team"
      audience: "Team"
      goal: "Not sure"
    assert:
      - {type: llm-rubric, value: "Asks for the main point of the talk and at least one story or fact before writing openings, rather than producing generic options."}
