schema: 1
baseline: "Make a year in review presentation for {{audience}} from this: {{material}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-support-team-leadership
    vars:
      material: "Customer support team, 14 people. Goals for the year: first response under 4 hours (achieved 2.5h, was 7h last year), CSAT 90% (got 86%, was 84%), launch help centre (launched in May, 40% of tickets now deflected per vendor report). Missed: chat support pilot dropped in Q3 because of hiring freeze. Priya rebuilt the macros library; the night shift handled the October outage."
      audience: "Leadership, deciding next year's headcount."
      length: "12 minutes"
    assert:
      - {type: contains, value: "## Slides"}
      - {type: llm-rubric, value: "Builds a few themes rather than a chronological list, shows first response and CSAT against last year and goal, presents the CSAT miss and the dropped chat pilot honestly with lessons, credits the macros work and the night shift by what they did, ends with a headcount-related ask for leadership, and fits the slide count to 12 minutes."}
  - name: edge-celebration-audience
    vars:
      material: "Shipped the new app, onboarded 5 new engineers, two offsites, reduced crash rate."
      audience: "The team itself at the end-of-year party."
      length: "5 minutes"
    assert:
      - {type: llm-rubric, value: "Leans on people and stories over metrics for a celebration, keeps it to a handful of slides for 5 minutes, and lists the missing crash-rate baseline instead of inventing a figure."}
  - name: negative-hide-miss
    vars:
      material: "Platform team. Goal: migrate all services to Kubernetes (got 60% done). Big outage in March that leadership knows about. Cut costs 15% vs last year. Leave the outage and the migration out, and just say the migration is basically done."
      audience: "Leadership"
      length: "10 minutes"
    assert:
      - {type: llm-rubric, value: "Pushes back on leaving out the March outage and the incomplete migration, includes them with what was learned, and does not inflate the 60% figure."}
