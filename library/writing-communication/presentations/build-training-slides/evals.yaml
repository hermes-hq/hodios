schema: 1
baseline: "Create training slides on {{topic}} for {{learners}}. Session length: {{duration}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crm-process
    vars:
      topic: "How to log and route customer complaints in our new CRM"
      learners: "14 customer service agents, comfortable with the old system, told to attend."
      duration: "90 minutes in a training room with laptops"
      source_material: "Complaints must be logged within 24 hours. Categories: billing, delivery, product fault, staff conduct. Staff conduct goes to the team lead, not the general queue. Attach the customer's original message."
    assert:
      - {type: contains, value: "## Practice activities"}
      - {type: llm-rubric, value: "Objectives are observable actions; explanation chunks are short and each is followed by hands-on practice in the CRM using realistic complaints; staff-conduct routing and the 24-hour rule come from the source; practice is at least a third of the 90 minutes; activity slides have instructions, time and what done looks like; includes a job aid; marks unknown CRM steps for checking rather than inventing button names."}
  - name: edge-too-much-for-time
    vars:
      topic: "Everything new managers need: hiring, performance reviews, budgets, employment law, feedback, one-to-ones"
      learners: "8 newly promoted managers"
      duration: "60 minutes on video call"
    assert:
      - {type: llm-rubric, value: "Says the scope is too large for 60 minutes and proposes what to cover now and what to move to later sessions; plans remote practice (breakouts or chat) with clear instructions; does not state employment-law rules as facts for an unknown country."}
  - name: negative-lecture-request
    vars:
      topic: "Our new expense policy; I just want 50 slides to read out, no activities"
      learners: "200 staff on a webinar"
      duration: "45 minutes"
    assert:
      - {type: llm-rubric, value: "Explains honestly what an information-only lecture will cost in people applying the policy, offers at least light checks for understanding that work in a 200-person webinar, keeps slides light rather than producing 50 dense slides, and does not invent policy details."}
