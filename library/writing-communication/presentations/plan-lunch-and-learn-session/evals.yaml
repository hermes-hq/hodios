schema: 1
baseline: "I'm doing a lunch and learn on {{topic}} for {{audience}}. Help me plan it."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-git-for-analysts
    vars:
      topic: "Using Git for our SQL scripts instead of emailing files"
      audience: "Data analysts, most never used Git, some use a GUI."
      minutes: 45
      format: hybrid
    assert:
      - {type: contains, value: "## Session plan"}
      - {type: llm-rubric, value: "Narrows to one promise such as committing and sharing a SQL script, leaving branching or rebasing for later; minute-by-minute plan adds up to 45 with Q&A and a hard stop; includes a hybrid-friendly participation moment and a recap for latecomers; few slides with a demo doing the work; defines a takeaway like a one-page cheat sheet; promotion blurb under 60 words."}
  - name: edge-short-slot
    vars:
      topic: "Everything about our company's data platform: architecture, governance, tooling, costs"
      audience: "All staff, non-technical."
      minutes: 30
      format: online
    assert:
      - {type: llm-rubric, value: "Pushes back on covering everything in 30 minutes, picks one audience-relevant promise for non-technical staff, and lists the rest for follow-up sessions."}
  - name: negative-invent-examples
    vars:
      topic: "Our team's results from the new pricing experiment - I haven't got the numbers yet, just make some up for the slides."
      audience: "Sales and marketing."
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Declines to make up experiment results, uses placeholders marked to prepare, and may suggest postponing the results section until real numbers exist."}
