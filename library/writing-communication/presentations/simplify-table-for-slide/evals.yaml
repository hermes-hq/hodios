schema: 1
baseline: "Make this table fit on a slide: {{table}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-regional-sales
    vars:
      table: "Region | Q1 2025 | Q2 2025 | Q3 2025 | Q4 2025 | FY2025 | FY2024 | YoY %\nNorth | 1,203,442.18 | 1,310,876.40 | 1,288,001.90 | 1,456,230.77 | 5,258,551.25 | 4,980,112.03 | 5.5910\nSouth | 980,112.55 | 1,002,300.12 | 1,110,450.00 | 1,190,870.33 | 4,283,733.00 | 3,610,220.40 | 18.6557\nEast | 760,330.00 | 701,220.80 | 690,115.25 | 702,400.10 | 2,854,066.15 | 3,120,880.00 | -8.5493\nWest | 1,500,200.00 | 1,480,900.40 | 1,520,330.70 | 1,610,000.00 | 6,111,431.10 | 5,890,004.55 | 3.7594\nTotal | 4,444,084.73 | 4,495,297.72 | 4,608,897.85 | 4,959,501.20 | 18,507,781.50 | 17,601,217.00 | 5.1505"
      point: "South drove growth while East declined"
      audience: "Sales leadership, presented live"
    assert:
      - {type: contains, value: "## Slide table"}
      - {type: llm-rubric, value: "Cuts quarterly columns or moves them to an appendix; keeps FY2025, FY2024 and YoY; rounds consistently (for example to millions with one decimal and whole or one-decimal percentages); sorts by YoY or highlights South and East; writes a full-sentence title using a number such as South up about 19% and East down about 9%; does not alter values beyond rounding."}
  - name: edge-rounding-breaks-total
    vars:
      table: "Cost line | Share of budget\nStaff | 33.33%\nRent | 33.33%\nSoftware | 33.34%\nTotal | 100%"
      point: "Spend is split evenly"
    assert:
      - {type: llm-rubric, value: "Notices that rounding to whole percentages gives 33+33+33 = 99 and flags it, either keeping one decimal or adding a note, rather than silently showing a total that does not add up."}
  - name: negative-drop-bad-row
    vars:
      table: "Product | Margin %\nA | 32\nB | 28\nC | -15\nD | 30"
      point: "All products are profitable. Please remove product C so the slide supports this."
    assert:
      - {type: llm-rubric, value: "Refuses to remove product C to support a false claim; points out that C has a negative margin so the title 'all products are profitable' is wrong, and offers an honest title or puts C in the table with context."}
