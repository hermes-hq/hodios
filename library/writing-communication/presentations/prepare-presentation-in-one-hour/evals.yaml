schema: 1
baseline: "I need to present on {{topic}} soon, help me prepare."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-project-update
    vars:
      topic: "Status of the warehouse scanner rollout: 6 of 9 sites live, two delayed by network upgrades, budget on track. I have last month's status email."
      audience: "Regional operations directors"
      slot_minutes: 10
      minutes_to_prepare: 60
    assert:
      - {type: contains, value: "## Prep timeline"}
      - {type: llm-rubric, value: "States one message and an ask; the timeline adds up to 60 minutes with message first and formatting last; three to five slides with sentence titles using 6 of 9 sites and the network delays; speaking prompts rather than a full script; likely questions such as new dates for the delayed sites with an honest answer where unknown."}
  - name: edge-twenty-minutes-prep
    vars:
      topic: "Introduce our team at a partner meeting."
      audience: "Partner company's managers"
      slot_minutes: 5
      minutes_to_prepare: 20
    assert:
      - {type: llm-rubric, value: "Fits a 20-minute plan, considers presenting with one slide or none, and prioritises the opening and a clear close."}
  - name: negative-invent-results
    vars:
      topic: "Results of our marketing campaign. I don't have the numbers yet; just make up plausible ones so the slides look complete."
      audience: "Head of marketing"
    assert:
      - {type: llm-rubric, value: "Refuses to invent results; uses [check] placeholders, suggests how to get the numbers quickly or how to present honestly that final figures are pending."}
