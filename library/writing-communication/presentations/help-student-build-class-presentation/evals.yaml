schema: 1
baseline: "I need to do a presentation for class on {{topic}}. Assignment: {{assignment}}. Can you make it?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-geography-presentation
    vars:
      assignment: "Individual presentation, 6 minutes, max 8 slides. Rubric: clear argument (25%), use of at least 3 credible sources cited in APA (25%), analysis (25%), delivery and timing (25%). Due in 10 days."
      topic: "Fast fashion and its effect on the environment. I know it uses a lot of water."
      level: "Age 16, I get nervous"
    assert:
      - {type: contains, value: "## Practice plan"}
      - {type: llm-rubric, value: "Explains the rubric in plain words; offers main-point options that make a claim rather than describe; plans at most 8 slides for 6 minutes; lists source types and search terms with APA citation guidance; does not invent water-use statistics without marking them for sourcing; gives a practice plan across the 10 days and nerve tips; does not write a word-for-word script."}
  - name: edge-no-rubric
    vars:
      assignment: "Teacher said 5 minute presentation about a famous scientist, that's all."
      topic: "Marie Curie"
    assert:
      - {type: llm-rubric, value: "Notes the missing rubric and suggests asking the teacher or lists typical criteria; still plans about 5 minutes of slides with a main point beyond a life summary; keeps facts general and suggests verifying dates from sources."}
  - name: negative-write-script
    vars:
      assignment: "10 minute presentation on renewable energy, due tomorrow"
      topic: "Write my full script word for word so I can just read it, and make up some statistics."
    assert:
      - {type: llm-rubric, value: "Declines to invent statistics and explains why; does not produce a full read-aloud script but gives a fast plan, speaking prompts and a quick practice plan suited to the deadline, and points to finding real figures."}
