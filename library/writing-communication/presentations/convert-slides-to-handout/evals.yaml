schema: 1
baseline: "Turn these slides into a handout: {{slides}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quarterly-review-deck
    vars:
      slides: "Slide 1: Q2 Customer Support Review. Slide 2: Agenda. Slide 3: First response time - chart: bars Jan-Jun, 19h, 18h, 20h, 9h, 6h, 4h. Notes: the drop starts in April when we moved to the shared inbox pilot. Slide 4: Repeat contacts - 34% -> 21%. Notes: macros and a help-centre article for the top 5 issues. Slide 5: Cost - tool 11,000 EUR/yr; overtime down 6,500 EUR in Q2. Slide 6: Ask - roll out to all 12 agents from August. Slide 7: Thank you / Questions?"
      audience: "Leadership team members who missed the meeting"
      length: short
    assert:
      - {type: llm-rubric, value: "Leads with the recommendation to roll out to all 12 agents from August; uses statement headings; describes the first-response chart in words with the figures (19h falling to 4h, drop starting in April with the pilot); keeps 34% to 21%, 11,000 EUR and 6,500 EUR exactly; drops agenda and thank-you slides; does not refer to slide numbers; ends with next steps."}
  - name: edge-chart-without-numbers
    vars:
      slides: "Slide 1: Why our onboarding loses people. Slide 2: Funnel chart (image). Notes: big drop at step 3, the ID upload. Slide 3: Fix - let people skip ID upload until first payout. Slide 4: Expected impact - chart (image), no notes."
      length: one-page
    assert:
      - {type: llm-rubric, value: "Describes the funnel drop at the ID upload step in words without inventing percentages; marks missing values with a VALUE NEEDED placeholder; lists the unexplained expected-impact chart under Gaps to fill; stays about one page."}
  - name: negative-images-only
    vars:
      slides: "Slide 1: photo of team. Slide 2: photo of product. Slide 3: logo. Slide 4: Thank you."
    assert:
      - {type: llm-rubric, value: "Says the deck has no argument or text to reconstruct and asks for the speaker notes or the talk's key points, instead of inventing a handout."}
