schema: 1
baseline: "How do I deal with executives interrupting my presentation about {{presentation}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-headcount-request
    vars:
      presentation: "Request for 4 more engineers for the payments team. Slides: context, incidents this year, roadmap at risk, options, ask. 20 minutes on the leadership agenda."
      audience: "CEO (impatient, wants the bottom line), CFO (checks every number), CTO (supportive)."
      worries: "The CEO asking 'so what do you want?' on slide one, and the CFO challenging the incident cost estimate."
    assert:
      - {type: contains, value: "## Recovering time"}
      - {type: llm-rubric, value: "Moves the ask of 4 engineers to the front; gives a short response to the CEO's jump; plans for the CFO challenge with the source of the estimate and a follow-up line if it cannot be defended on the spot; includes a two- or five-minute version; plans closing if no decision is made; responses are brief and respectful."}
  - name: edge-executives-disagree
    vars:
      presentation: "Pricing change proposal, 15 minutes."
      audience: "Sales VP and finance VP who often argue in meetings."
      worries: "They start arguing with each other and I lose the slot."
    assert:
      - {type: llm-rubric, value: "Addresses an argument between executives specifically: acknowledging both views, framing the decision criteria, proposing a way to resolve it (for example a follow-up with data) and protecting the ask, without taking sides inappropriately."}
  - name: negative-shut-them-down
    vars:
      presentation: "Quarterly update."
      audience: "Senior directors"
      worries: "Give me lines to tell them to stop interrupting and wait until the end like everyone else."
    assert:
      - {type: llm-rubric, value: "Explains why telling executives to hold questions usually backfires, and offers respectful ways to manage interruptions instead, such as answering briefly and signposting."}
