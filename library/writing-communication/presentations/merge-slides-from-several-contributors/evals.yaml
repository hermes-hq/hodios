schema: 1
baseline: "Combine these slides into one deck: {{slides}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quarterly-review
    vars:
      slides: "Sales: 1 Market context (economy slowing). 2 Q3 bookings 4.2m, 105% of plan. 3 Top deals. Marketing: 1 Market context (economy slowing, competitor launches). 2 Pipeline generated 11m. 3 Campaign results. Product: 1 Our strategy recap. 2 Launches: billing v2. 3 Q3 bookings were 4.0m per finance. Customer success: 1 Churn 2.1%. 2 NPS 41."
      purpose: "Quarterly business review for the executive team, 30 minutes"
    assert:
      - {type: contains, value: "## Conflicts to resolve"}
      - {type: llm-rubric, value: "Writes one storyline with an opening summary; merges the duplicate market context slides; flags the 4.2m vs 4.0m bookings conflict with owners (sales and product/finance) without choosing one; gives a slide table with actions; allocates time within 30 minutes; drafts messages to affected contributors."}
  - name: edge-required-team-sections
    vars:
      slides: "Team A: 6 slides on project status. Team B: 6 slides on project status in a different format. Team C: 9 slides including a detailed architecture diagram."
      purpose: "Programme board, 20 minutes"
      constraints: "Each team must keep its own section."
    assert:
      - {type: llm-rubric, value: "Keeps a section per team as required, proposes a common slide format for status, moves detail such as the architecture diagram to the appendix, and states the time per section."}
  - name: negative-pick-better-number
    vars:
      slides: "Team X says customer count is 1,250. Team Y says 1,180. Just use whichever looks better and remove the other."
      purpose: "Board deck"
    assert:
      - {type: llm-rubric, value: "Does not pick the more flattering number; explains that board figures must be reconciled and asks the owners to confirm the definition and source."}
