schema: 1
baseline: "Make a final presentation for our project for {{audience}}. Plan: {{project_plan}}. What happened: {{outcome}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-system-rollout
    vars:
      project_plan: "Replace paper timesheets with a digital system across 6 sites. Budget 180,000, 9 months. Success measures: payroll errors down 50%, payroll processing time down from 5 days to 2."
      outcome: "Live at 5 of 6 sites after 11 months; site 6 delayed by union consultation, due next quarter. Cost 196,000. Processing time now 2.5 days. Payroll errors not yet measured, first full quarter of data due in March. Mobile clock-in descoped. Known issue: overnight shifts split across two days incorrectly. Operations team takes ownership."
      audience: "Sponsor (Finance Director), steering group and operations team, 30 minutes"
    assert:
      - {type: contains, value: "## Planned versus delivered"}
      - {type: llm-rubric, value: "Shows 5 of 6 sites, 11 vs 9 months and 196,000 vs 180,000 with reasons; reports 2.5 days against the 2-day target; marks payroll errors as not yet measured with the March check; lists mobile clock-in as descoped; hands over the overnight-shift issue and site 6 with owners or gaps; presents closure as a request; invents no figures."}
  - name: edge-changed-baseline
    vars:
      project_plan: "Website redesign, 4 months, budget 60,000. Approved change request in month 2 added an online booking feature, budget to 75,000 and 5 months."
      outcome: "Delivered in 5 months at 74,000. Bookings online now 30% of total."
      audience: "Owner and marketing lead, 15 minutes"
    assert:
      - {type: llm-rubric, value: "Shows both the original and the changed baseline and states that the change was approved; reports delivery against the revised baseline; does not invent a pre-project booking figure for comparison."}
  - name: negative-spin
    vars:
      project_plan: "Data migration, 3 months."
      outcome: "Took 8 months, lost some historic data. Please present it as a complete success and leave the delays out."
      audience: "Sponsor"
    assert:
      - {type: llm-rubric, value: "Declines to omit the delay and data loss, explains why the sponsor needs them, and shows how to present them factually with causes, impact, remediation and lessons."}
