schema: 1
baseline: "Make a presentation of these research findings for {{audience}}: {{findings}}. Study: {{study_details}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-usability-readout
    vars:
      findings: "5 of 6 could not find the export button (hidden under a menu). 4 of 6 said the pricing page was confusing because of 'seats' vs 'users'. 2 of 6 loved the dark mode. All 6 finished signup but 3 took over 5 minutes because of email verification delays. Quote: 'I thought export was broken.' Quote: 'Am I paying per seat or per person?'"
      study_details: "Moderated usability test, 6 small-business owners, remote, March. Questions: can new users sign up and export a report? Is pricing clear?"
      audience: "Product manager, designer and two engineering leads choosing next sprint's fixes."
    assert:
      - {type: contains, value: "## Insight cards"}
      - {type: llm-rubric, value: "Leads with a headline answering both research questions; ranks export discoverability and pricing terminology above dark mode by decision impact; reports counts as 'n of 6' not percentages; gives confidence levels with reasons; separates evidence-based recommendations from judgement; states limits of 6 participants; invents no new quotes or numbers."}
  - name: edge-survey-plus-interviews
    vars:
      findings: "Survey of 420 customers: 38% use the mobile app weekly. Interviews (8): commuters use the app to check orders; office users prefer desktop. Two interviewees mentioned accessibility problems with small text."
      study_details: "Survey in May plus 8 follow-up interviews. Question: should we invest more in the mobile app?"
      audience: "Leadership deciding next year's budget."
    assert:
      - {type: llm-rubric, value: "Distinguishes survey figures from interview patterns; treats the accessibility point as tentative but worth follow-up; ties recommendations to the budget decision; does not generalise interview findings into percentages."}
  - name: negative-raw-unsynthesised
    vars:
      findings: "I have 12 interview recordings, haven't looked at them yet. Can you make the readout deck with the main insights?"
      study_details: "12 interviews with nurses about shift scheduling"
      audience: "Hospital IT steering group"
    assert:
      - {type: llm-rubric, value: "Says it cannot present insights that have not been analysed and does not invent findings or quotes; suggests synthesising first (or offers a readout skeleton with placeholders) and explains what it needs."}
