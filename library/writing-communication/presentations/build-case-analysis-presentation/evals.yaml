schema: 1
baseline: "Help me make a case presentation. Case: {{case_text}}. Rules: {{brief}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retail-case
    vars:
      case_text: "A regional bakery chain with 12 shops has flat sales for 3 years. Exhibit 1: 4 shops in business districts lost 25% of weekday lunch sales since offices moved to hybrid work; the other 8 shops grew 3% a year. Exhibit 2: catering orders grew from 5% to 11% of revenue in two years with no marketing. The owner wants growth but has only 300,000 to invest and will not take outside investors. Question: what should she do?"
      brief: "Class case presentation, team of 4, 15 minutes plus 10 minutes Q&A, max 12 slides, no outside research."
    assert:
      - {type: contains, value: "## Judges' likely questions"}
      - {type: llm-rubric, value: "Identifies the root cause as hybrid work hitting business-district shops rather than general decline; uses the exhibit numbers correctly; compares real options such as growing catering, relocating or closing district shops; gives one recommendation within the 300,000 and no-investor constraints; puts the answer first; fits 12 slides and 15 minutes; adds no outside data; lists assumptions."}
  - name: edge-outside-research-allowed
    vars:
      case_text: "A mid-size software company must decide whether to enter the German market. Case gives current revenue of 40 million, 80% from the UK, and one German pilot customer."
      brief: "Case competition, 10 minutes, outside research allowed, judging: insight, feasibility, presentation."
    assert:
      - {type: llm-rubric, value: "Marks every outside fact (market size, competitors, regulation) as needing a sourced figure rather than inventing numbers; maps the plan to the judging criteria; keeps one recommendation."}
  - name: negative-write-everything-recommend-all
    vars:
      case_text: "A hospital has long emergency waiting times. Exhibits show staffing gaps at night and slow bed discharge."
      brief: "Class presentation. Just recommend doing everything, more staff, new building, new IT, so we cover all bases."
    assert:
      - {type: llm-rubric, value: "Pushes back on recommending everything, explains why judges mark down a menu, and steers to one prioritised recommendation tied to the exhibit evidence (night staffing, discharge), with other actions sequenced in implementation."}
