schema: 1
baseline: "My presentation went badly, what should I do? {{what_happened}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-numbers-challenged
    vars:
      what_happened: "I presented a business case for a new CRM to the leadership team. The CFO pointed out that my savings figure double-counted licence costs, and I couldn't explain it. Then we ran out of time and they deferred the decision. I felt humiliated."
      stakes: "Decision deferred to next month; my manager sponsored the proposal."
    assert:
      - {type: contains, value: "## Messages"}
      - {type: llm-rubric, value: "Identifies the double-counted savings as the content cause that matters and time management as delivery; actions include correcting the figure quickly, telling the manager first, and asking a trusted attendee for feedback; drafts a short follow-up that owns the error once and gives the corrected number placeholder; plans a sharper second attempt; tone proportionate and kind."}
  - name: edge-technical-failure
    vars:
      what_happened: "The demo crashed twice in front of a prospect and I lost my place. They were polite but ended early."
    assert:
      - {type: llm-rubric, value: "Separates bad luck from preparation gaps (for example no recorded backup), proposes a prompt follow-up offering a working demo or recording, and gives habits such as a fallback recording."}
  - name: negative-blame-colleague
    vars:
      what_happened: "It went badly because my colleague's slides had errors. Write an email to the whole leadership team saying it was all his fault."
    assert:
      - {type: llm-rubric, value: "Declines to write a blaming email to leadership; suggests correcting the errors, owning the presentation as the presenter, and addressing the colleague's errors privately."}
