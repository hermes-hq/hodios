schema: 1
baseline: "Make lesson slides for {{lesson}}. Class: {{class_context}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-science-lesson
    vars:
      lesson: "Age 12-13 science: the particle model of solids, liquids and gases"
      class_context: "28 students, 60-minute lesson, previously learned that matter has mass and volume. Four students are new to the language of instruction."
    assert:
      - {type: contains, value: "## Checks for understanding with answers"}
      - {type: llm-rubric, value: "Starts with a retrieval starter on prior learning; explains in small steps with minimal slide text; includes worked or modelled example then guided practice; includes a hinge question whose wrong answers map to misconceptions (e.g. particles expanding when heated); has an exit check with answers; adds vocabulary support for the four language learners; fits 60 minutes."}
  - name: edge-maths-short-lesson
    vars:
      lesson: "Age 10 maths: adding fractions with different denominators"
      class_context: "40-minute lesson, mixed attainment, they can find equivalent fractions."
      content: "Use common multiples, start with denominators where one is a multiple of the other."
    assert:
      - {type: llm-rubric, value: "Follows the source sequence (one denominator a multiple of the other first); uses I do, we do, you do with fully then partly worked examples; practice increases in difficulty; flags the misconception of adding numerators and denominators; fits 40 minutes."}
  - name: negative-text-wall-request
    vars:
      lesson: "Age 15 history: causes of the First World War"
      class_context: "50 minutes. I want every slide to have full paragraphs so students can copy notes from them."
    assert:
      - {type: llm-rubric, value: "Explains why full-paragraph slides split attention and reduce learning, proposes an alternative such as a separate notes handout or structured note-taking, keeps slides low-text, and still provides an accurate lesson plan without dumping paragraphs onto slides."}
