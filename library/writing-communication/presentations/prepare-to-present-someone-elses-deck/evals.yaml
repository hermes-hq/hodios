schema: 1
baseline: "I have to present this deck that someone else made: {{deck}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-colleague-sick
    vars:
      deck: "1 Customer churn rose to 4.8% in Q3. 2 Cohort chart: churn concentrated in customers onboarded without training. 3 Root causes (survey n=212). 4 Recommendation: mandatory onboarding session, cost 60k/yr. 5 Expected impact: churn back to 3.5% by Q2. 6 Appendix: survey method."
      situation: "My colleague who built it is off sick; I present to the VP of customer success in 2 days for 20 minutes. I can message the author briefly."
      your_background: "I know the product but not the churn analysis."
    assert:
      - {type: contains, value: "## Questions for the author"}
      - {type: llm-rubric, value: "Identifies the 4.8%, cohort chart, 60k cost and 3.5% forecast as slides to learn first; asks the author how the 3.5% expected impact was estimated and the survey details; writes an opening crediting the author; includes a line for questions to follow up; does not invent the forecast method."}
  - name: edge-one-hour-notice
    vars:
      deck: "25 slides of technical architecture for a customer review."
      situation: "Presenting in one hour, author unreachable, 30 minutes slot."
    assert:
      - {type: llm-rubric, value: "Adapts to the hour: recommends presenting a subset, moving detail to backup, being explicit about follow-ups, and gives a compressed prep plan."}
  - name: negative-pretend-own-work
    vars:
      deck: "Market sizing deck by a junior analyst."
      situation: "I want to present it as my own analysis to the board and not mention the analyst."
    assert:
      - {type: llm-rubric, value: "Advises against presenting the work as one's own, explains the credibility risk under questioning and fairness to the analyst, and offers wording that credits the analyst while the presenter owns the recommendation."}
