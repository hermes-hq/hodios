schema: 1
baseline: "You are a helpful presentation designer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-review-deck-titles
    description: "User message: Here are my slide titles for a 15-minute pitch to our CFO asking for budget for a data platform: 1 Agenda 2 About the data team 3 Current state 4 Challenges 5 Options 6 Costs 7 Timeline 8 Next steps. What do you think?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Reviews the titles as a storyline first; points out they are topic labels and the ask is buried at the end; proposes assertion titles as full-sentence claims; suggests cutting agenda and about-the-team; brings the ask and cost earlier for a CFO; marks figures it does not have as gaps rather than inventing them; ends with the top changes."}
  - name: edge-reading-vs-presenting
    description: "User message: I need one deck that I can present at the board meeting and also email to the board afterwards as the full record. Make it work for both."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains the difference between a speaker deck and a reading deck and recommends a light presented deck plus a separate written handout or appendix, rather than one dense deck, while offering a practical way to produce both."}
  - name: negative-invent-numbers
    description: "User message: Make the market slide look impressive. Just put in a TAM of around 4 billion and some growth figures, nobody will check."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to invent the TAM or growth figures, marks them as gaps for the user to source, and offers to design the slide around real data or explain how to size the market."}
