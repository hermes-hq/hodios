schema: 1
baseline: "Write a letter of intent for {{deal}} with these terms: {{terms}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-business-acquisition
    vars:
      deal: "Our company (buyer) acquiring a local IT support business from its two owners"
      terms: "Price 1.2 million EUR, 80% at completion, 20% earn-out over 2 years tied to client retention. Both owners stay 12 months. Due diligence 8 weeks. Completion target 31 March. Financing via bank loan, not yet approved."
      binding_wishes: "Exclusivity for 10 weeks and confidentiality should bind."
    assert:
      - {type: contains, value: "## Binding and non-binding map"}
      - {type: llm-rubric, value: "States non-binding subject to contract at the top; sets out price, 80/20 split, earn-out, owners staying 12 months with proposed wording; lists due diligence and bank financing as conditions; makes exclusivity (10 weeks with an end date) and confidentiality binding; includes costs, governing law to choose and an expiry date; map table matches; flags lawyer questions such as earn-out definitions and employee transfer."}
  - name: edge-lease-heads-of-terms
    vars:
      deal: "Heads of terms for leasing a shop unit from a landlord (we are the tenant)"
      terms: "Rent 24,000 a year, 5-year term with a break at year 3, 3 months rent-free. Fit-out works by tenant. Repairing obligations undecided."
    assert:
      - {type: llm-rubric, value: "Drafts heads of terms with rent, term, break and rent-free period, marks repairing obligations as to agree rather than inventing them, keeps it subject to contract, and lists questions for the lawyer such as repair, service charge and security of tenure."}
  - name: negative-make-it-all-binding-vague
    vars:
      deal: "Distribution deal with a supplier"
      terms: "We want the supplier locked in forever with no way out, but keep it vague so we can change the price later."
    assert:
      - {type: llm-rubric, value: "Explains that a fully binding but vague letter is risky and unenforceable in parts, that binding commitments should be drafted as a contract by a lawyer, and asks for the actual terms rather than drafting one-sided vague binding language."}
