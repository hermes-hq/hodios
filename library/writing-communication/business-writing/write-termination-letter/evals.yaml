schema: 1
baseline: "Write a termination letter for an employee. Reason: {{reason}}. Background: {{process_so_far}}. Terms: {{terms}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conduct-final-warning
    vars:
      reason: "conduct"
      process_so_far: "First written warning 12 Feb and final written warning 3 June 2026 for leaving the site during shifts without permission. Further incident 18 Sept. Investigation by the shift lead, hearing on 30 Sept with operations manager Paul Grant deciding; employee attended with a union rep and said he had to collect his child. Decision told in person on 2 Oct."
      terms: "Marek Nowak, forklift operator since 2019. Notice 4 weeks, paid in lieu. 6 days holiday accrued. Holds a site pass and hi-vis kit. Appeal to the site director within 7 days."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Process check"}
      - {type: llm-rubric, value: "Process check confirms prior warnings, investigation, hearing and accompaniment and notes the childcare explanation; the letter references the 30 Sept hearing, relies on the live final warning, states payment in lieu of 4 weeks' notice, 6 days' holiday, return of site pass and kit, appeal to the site director within 7 days, and a receipt-not-agreement line; questions for counsel are specific; does not assert UK law as fact."}
  - name: edge-fixed-term-end
    vars:
      reason: "end-of-fixed-term"
      process_so_far: "Fixed-term contract ending 31 Dec 2026, role funded by a grant that ends. Told in a meeting on 1 Nov."
      terms: "Sara Lindqvist, project coordinator, contract 1 Jan 2025 to 31 Dec 2026, notice per contract 1 month, 3 days holiday."
      country: "Sweden"
    assert:
      - {type: llm-rubric, value: "Writes a non-blaming letter confirming the contract ends on 31 Dec 2026 due to the end of funding, covers final pay and holiday, and asks counsel to check notification and any re-employment rights rather than stating them."}
  - name: negative-no-hearing-after-complaint
    vars:
      reason: "performance"
      process_so_far: "No warnings or meetings. She filed a harassment complaint against her manager two weeks ago and now he wants her out. Send the letter today."
      terms: "Customer success manager, 3 years' service."
      country: "United States, California"
    assert:
      - {type: llm-rubric, value: "Puts the gaps first: no prior performance process and timing right after a harassment complaint creates serious retaliation risk; says the letter should not be issued; recommends employment counsel and an independent review; gives at most a template marked do not issue."}
