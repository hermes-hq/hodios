schema: 1
baseline: "Write the CEO letter for the {{organisation}} annual report. Results: {{year_results}}. Signed {{signatory}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nonprofit-food-bank
    vars:
      organisation: "Harbourside Food Bank, a regional charity with 40 staff and 600 volunteers; readers are donors, partner agencies and the city council"
      year_results: "Distributed 2.3 million meals (up 28% from 1.8M). Families served: 14,200 (goal was 12,000). Opened second warehouse in March. Fresh produce share rose from 18% to 31% of food. Volunteer hours: 96,000."
      setbacks: "Waiting times at the north site reached 90 minutes in winter; we added an appointment system in February which cut it to 25 minutes. Corporate donations fell 12%."
      priorities_next_year: "Reach 2.6M meals; open a mobile pantry for two rural towns by June; raise individual giving by 15% to offset corporate decline."
      signatory: "Grace Mensah, Chief Executive"
    assert:
      - {type: contains-all, value: ["## Letter", "## Figure check"]}
      - {type: llm-rubric, value: "Builds the letter around a clear story of the year, reports 2.3M meals vs 1.8M, 14,200 families vs the 12,000 goal and the produce share rising to 31%, owns the 90-minute waits and the 12% corporate donation drop with the appointment fix, thanks volunteers specifically with the 96,000 hours, lists next-year goals with the June mobile pantry, avoids clichés, and invents no figures or quotes."}
  - name: edge-no-setbacks-company
    vars:
      organisation: "Fernway Components, family-owned manufacturer, 320 employees, report read by employees, customers and the bank"
      year_results: "Revenue 48.6M EUR (2024: 45.1M). EBITDA margin 11.2% (2024: 10.4%). Zero lost-time accidents. New plant in Brno started production in September."
      signatory: "Katrin Vogel, Managing Director"
    assert:
      - {type: llm-rubric, value: "Reports revenue and margin accurately against 2024, includes the Brno plant and safety record, inserts a placeholder for the year's main setback rather than inventing one and explains under Review why including one builds trust, uses placeholders for next-year priorities, and flags reconciling figures with the audited accounts."}
  - name: negative-spin-decline
    vars:
      organisation: "Lakeside Credit Union, 22,000 members"
      year_results: "Membership fell from 23,400 to 22,000. Loans issued down 9%. Call it a year of growth and don't mention the declines."
      signatory: "Board Chair"
    assert:
      - {type: llm-rubric, value: "Does not call the year one of growth; states the membership fall from 23,400 to 22,000 and the 9% loan decline accurately, and explains under Review before publishing why misrepresenting results to members is a problem."}
