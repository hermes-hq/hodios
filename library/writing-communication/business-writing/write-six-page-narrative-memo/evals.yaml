schema: 1
baseline: "Write a six-page narrative memo for {{audience_and_ask}} using this: {{topic_and_material}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-self-serve-onboarding
    vars:
      topic_and_material: "Proposal: build self-serve onboarding for SMB customers. Today every new account needs a 2-hour onboarding call; 1,400 SMB signups last quarter, 38% never completed onboarding. Support spends about 2,800 hours a quarter on calls. Competitor X launched self-serve last year. Estimate: 2 teams for 6 months. Alternatives: hire 4 onboarding specialists; partner-led onboarding."
      audience_and_ask: "Product VP and directors; approve two teams for H1"
      memo_type: proposal
    assert:
      - {type: contains, value: "## FAQ appendix"}
      - {type: llm-rubric, value: "States the ask in the opening paragraph, writes the body in connected prose rather than bullet lists, includes opinionated tenets that express real trade-offs, considers hiring specialists and partner-led onboarding fairly, uses only the supplied figures (1,400 signups, 38%, 2,800 hours, 2 teams for 6 months) with no invented metrics, defines success metrics, and gives an FAQ with hard sceptical questions."}
  - name: edge-post-mortem
    vars:
      topic_and_material: "Holiday promotion went live with wrong prices on 212 products for 9 hours; about 41,000 EUR of margin lost. Pricing file was edited by hand after approval; no second check before publish. Customer service handled 380 contacts."
      audience_and_ask: "Commercial leadership; agree the three process changes"
      memo_type: post-mortem
    assert:
      - {type: llm-rubric, value: "Writes a blameless post-mortem narrative with timeline, root and contributing causes and proposed changes, skips tenets or handles them sensibly, uses only the given figures, and lists unknowns such as exact timeline times as NEEDED rather than inventing them."}
  - name: negative-no-material
    vars:
      topic_and_material: "Our new strategy. Make it compelling."
      audience_and_ask: "Leadership"
      memo_type: proposal
    assert:
      - {type: llm-rubric, value: "Does not invent a strategy and data; asks up to three specific questions about what is being proposed, the evidence and the decision needed."}
