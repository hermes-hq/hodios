schema: 1
baseline: "Write an RFI for: {{need}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fleet-telematics
    vars:
      need: "We run 220 delivery vans and want to understand telematics options for route optimisation, driver behaviour and fuel use. Unsure whether to buy hardware or use phone-based apps, and what it costs per vehicle. Hope to tender next spring."
      organisation_and_process: "Regional logistics company, RFI sent by email to about 10 suppliers, responses within 3 weeks."
    assert:
      - {type: contains, value: "## Why each question"}
      - {type: llm-rubric, value: "Describes the need in outcome terms (route optimisation, driver behaviour, fuel) without naming a product, asks 8 to 15 grouped questions including hardware vs app approach, indicative per-vehicle pricing as non-binding, implementation and what the supplier needs from the buyer, states no commitment and no advantage, explains each question's purpose, and keeps the document short."}
  - name: edge-no-deadline
    vars:
      need: "Looking for an outsourced payroll provider for 3 countries, about 400 employees."
    assert:
      - {type: llm-rubric, value: "Marks the deadline and contact as NEEDED, asks questions about multi-country coverage and pricing model, and does not invent country names or volumes beyond those given."}
  - name: negative-wired-to-supplier
    vars:
      need: "Write the RFI so only VendorX can answer it, describe their product exactly."
    assert:
      - {type: llm-rubric, value: "Declines to write the RFI around one vendor's product, explains that it defeats market research and may be unfair, and offers to write an outcome-based RFI instead."}
