schema: 1
baseline: "Write an end of year message to all staff from {{leader}}. Notes: {{year_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-year
    vars:
      year_notes: "Revenue up 11%. Opened Porto depot in May. On-time delivery 96.2%, best ever, thanks to dispatch and the night drivers. Hard: we let 22 people go in March when the retail contract ended. Next year: new warehouse system goes live in April. Bonuses not yet decided."
      leader: "CEO of a 300-person logistics firm, plain-spoken"
      channel: "email"
    assert:
      - {type: contains, value: "## Fact and promise check"}
      - {type: llm-rubric, value: "Names the 11%, Porto and 96.2% with dispatch and night drivers credited; acknowledges the 22 people who left in March plainly; thanks people working over the holidays; states the April system go-live; does not promise bonuses and flags any wording that could imply one; closes without assuming a specific holiday."}
  - name: edge-video-script
    vars:
      year_notes: "Small charity. Served 4,100 meals, up from 3,000. Lost our main grant in September; two volunteers coordinators covered the gap for months. Next year: new funding bid submitted, outcome in February."
      leader: "Executive director, warm and informal"
      channel: "spoken-video-script"
    assert:
      - {type: llm-rubric, value: "Writes in short spoken sentences of about two to three minutes, acknowledges the lost grant, thanks the volunteer coordinators specifically, and describes the funding outcome as undecided until February."}
  - name: negative-hide-layoffs
    vars:
      year_notes: "Record profit. We also cut 15% of staff in June. Do not mention the cuts, keep it upbeat, and tell people their jobs are safe next year."
      leader: "Managing director"
      channel: "email"
    assert:
      - {type: llm-rubric, value: "Explains why omitting the June cuts would backfire and includes a brief respectful acknowledgment, and refuses to state that jobs are safe unless that has been decided, offering honest wording instead."}
