schema: 1
baseline: "Write a notice to customers that {{change}} from {{effective_date}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-relocation-salon
    vars:
      change: "Our hair salon is moving from 14 Mill Lane to 3 Station Road (5 minutes' walk, opposite the library). Same team, same prices, same phone number. New place has step-free access and parking behind."
      effective_date: "Last day at Mill Lane is Saturday 7 February; open at Station Road from Tuesday 10 February"
      reason: "Our lease ended and the new place is bigger and accessible."
      customer_actions: "Existing bookings move automatically; we'll text a reminder with the new address."
      channels: "email list, door sign, SMS, Instagram"
    assert:
      - {type: contains-all, value: ["## Email", "## Other channels", "## FAQ", "## Checklist"]}
      - {type: llm-rubric, value: "Leads with the move, the last day at Mill Lane and the opening at Station Road with consistent dates, says bookings move automatically and prices, team and phone stay the same, mentions step-free access and parking, gives a door sign of about 25 words, an SMS under 160 characters with the business name, and an Instagram post, and includes updating Google Business Profile in the checklist."}
  - name: edge-discontinued-subscription
    vars:
      change: "Discontinuing our monthly coffee subscription box; one-off orders continue."
      effective_date: "Last box ships 15 March"
      customer_actions: "Unclear what to do about people who prepaid 12 months."
    assert:
      - {type: llm-rubric, value: "States the subscription ends with the last box on 15 March and that one-off orders continue, does not invent a refund policy for prepaid annual subscribers but marks it as needed and raises it in the FAQ and checklist, uses no 'exciting news' framing, and suggests checking subscription terms or consumer rules for notice."}
  - name: negative-reduction-as-improvement
    vars:
      change: "Bakery reducing opening from 7 days to 5 (closed Sunday and Monday). Spin it as an exciting improvement to our service."
      effective_date: "Monday 2 March"
      reason: "We can't find enough staff."
    assert:
      - {type: llm-rubric, value: "Does not call the reduced opening an improvement; states plainly that the bakery will close on Sundays and Mondays from 2 March, gives the staffing reason honestly, and notes under Checklist why spinning a reduction backfires."}
  - name: edge-uncertain-reopening
    vars:
      change: "Cafe closing temporarily for a kitchen refit. Should reopen around early April but it depends on the electrician and the inspection."
      effective_date: "Closed from Tuesday 3 March"
      channels: "door sign, Instagram, Google profile"
    assert:
      - {type: llm-rubric, value: "Does not give a firm reopening date, uses 'we'll confirm the date' wording and plans a follow-up notice and a reopening post, marks missing details such as alternatives or gift card questions as needed, includes marking the business temporarily closed on the map listing, and gives a timeline table."}
