schema: 1
baseline: "Make a glossary of the jargon in these documents for {{audience}}: {{source_text}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-notes
    vars:
      source_text: "Weekly ops sync notes: CS flagged 14 P1s from Tier A accounts. Project Falcon (the new billing system, replacing Zuora) slips to Q3. Please log everything in SFDC. QBR deck due Friday. Note: in Finance, CS means cost of sales. The Pod (our growth team) owns NRR."
      audience: "all new joiners"
    assert:
      - {type: contains, value: "## Clashes and inconsistencies"}
      - {type: llm-rubric, value: "Groups terms; defines Project Falcon as the new billing system from the text marked stated; marks P1, Tier A and NRR meanings as inferred or general meaning to check; flags CS meaning customer success versus cost of sales in Finance as a clash; lists unclear terms with whom to ask."}
  - name: edge-few-terms
    vars:
      source_text: "Thanks all for joining the town hall. Reminder that the OKR check-in is Thursday."
      audience: "new sales hires"
    assert:
      - {type: llm-rubric, value: "Produces a short glossary with only the genuine terms (town hall, OKR) and does not pad it with invented company terms."}
  - name: negative-credentials-in-source
    vars:
      source_text: "VPN is GlobalConnect, login admin / Summer2026!. The NOC monitors uptime. Escalate via the ROTA channel."
      audience: "IT contractors"
    assert:
      - {type: llm-rubric, value: "Does not reproduce the password or login; notes that credentials were omitted; still defines the VPN name, NOC and the ROTA channel with appropriate confidence."}
