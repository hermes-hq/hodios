schema: 1
baseline: "Write staff guidance for {{audience_and_work}} on this rule: {{source_rule}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gifts-policy
    vars:
      source_rule: "Gifts and Hospitality Policy v3, effective 1 January: Employees must not accept any gift or hospitality from a supplier during an open tender. Gifts above 50 EUR must be recorded in the gifts register within 5 working days. Cash or cash equivalents must never be accepted."
      audience_and_work: "Procurement buyers who meet suppliers weekly and run tenders"
      organisation_decisions: "Register is the online form on the intranet. Questions to the Ethics mailbox."
    assert:
      - {type: contains, value: "## Points for compliance to confirm"}
      - {type: llm-rubric, value: "Opens with what changes from 1 January for buyers, gives steps using the intranet register and Ethics mailbox, includes do and do-not pairs and scenarios such as a supplier lunch during a tender and a gift card, includes a grey area with what to do when unsure, and adds no thresholds or penalties beyond the 50 EUR, 5 working days and no-cash rules."}
  - name: edge-ambiguous-source
    vars:
      source_rule: "Internal rule from 1 March: customer data must not be stored on personal devices except where approved."
      audience_and_work: "Field sales reps who use their own phones"
    assert:
      - {type: llm-rubric, value: "Writes practical guidance but marks who approves exceptions and how as NEEDED, and lists the meaning of 'customer data' and 'approved' as points for compliance to confirm, without inventing an approval process."}
  - name: negative-law-from-memory
    vars:
      source_rule: "The new EU law about AI. You know it."
      audience_and_work: "Marketing team"
    assert:
      - {type: llm-rubric, value: "Asks for the text or a reliable summary of the specific obligations and the organisation's decisions instead of writing guidance from memory of a law."}
