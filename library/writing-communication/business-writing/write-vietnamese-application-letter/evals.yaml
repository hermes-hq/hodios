schema: 1
baseline: "Viết giúp tôi đơn {{don_type}} gửi {{recipient}}. Thông tin: {{details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-annual-leave
    vars:
      don_type: "nghi-phep"
      recipient: "Ban Giám đốc Công ty TNHH Minh Phát và Trưởng phòng Kinh doanh"
      details: "Nguyễn Thị Hoa, sinh 12/03/1995, nhân viên kinh doanh, mã NV 0452. Xin nghỉ phép năm 3 ngày từ 18/11 đến hết 20/11/2026 để về quê dự đám cưới em trai ở Nghệ An. Bàn giao khách hàng cho anh Trần Văn Nam. Liên lạc qua số 09xx xxx xxx. Viết ở TP. Hồ Chí Minh."
    assert:
      - {type: contains, value: "## Đơn"}
      - {type: llm-rubric, value: "Có quốc hiệu in hoa, tiêu ngữ, dòng 'TP. Hồ Chí Minh, ngày … tháng … năm …', tên đơn 'ĐƠN XIN NGHỈ PHÉP' in hoa, 'Kính gửi:' liệt kê hai nơi nhận, thông tin cá nhân với mã NV 0452, nghỉ 3 ngày từ 18/11 đến hết 20/11/2026, lý do, bàn giao cho anh Trần Văn Nam, lời cam đoan hoặc cảm ơn và khối chữ ký người làm đơn; không bịa thêm thông tin."}
  - name: edge-student-leave-parent
    vars:
      don_type: "nghi-hoc"
      recipient: "Cô giáo chủ nhiệm lớp 7A3, Trường THCS Nguyễn Du"
      details: "Con là Lê Minh Khang, lớp 7A3. Bị sốt, xin nghỉ học 2 ngày 14 và 15/10/2026. Phụ huynh: Lê Văn Tùng."
    assert:
      - {type: llm-rubric, value: "Viết đơn xin nghỉ học với thông tin học sinh và phụ huynh, nêu 2 ngày 14 và 15/10/2026, lý do sức khỏe chung chung, cam kết chép bài, và chỗ ký của phụ huynh."}
  - name: negative-dates-mismatch
    vars:
      don_type: "nghi-phep"
      recipient: "Trưởng phòng Hành chính"
      details: "Xin nghỉ 5 ngày từ 3/12 đến 4/12."
    assert:
      - {type: llm-rubric, value: "Chỉ ra rằng từ 3/12 đến 4/12 không phải 5 ngày và hỏi lại thời gian chính xác, thay vì viết đơn với ngày tháng mâu thuẫn."}
