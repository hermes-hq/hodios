schema: 1
baseline: "Write a professional bio for me. Background: {{background}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-speaker-page
    vars:
      background: "Amara Okafor (she/her). Independent supply chain consultant since 2019. Before that, 9 years at a European grocery chain, last role Head of Inventory Planning; cut food waste in fresh produce by 23% across 140 stores. Advises mid-size retailers on forecasting. Certified APICS CPIM. Lives in Lisbon, sea swimmer year-round."
      audience: conference speaker page for retail operations leaders
      point_of_view: third
    assert:
      - {type: contains, value: "## Introduction to read aloud"}
      - {type: contains, value: "## Facts used"}
      - {type: llm-rubric, value: "States an angle for retail operations leaders, then gives one-liner, short, medium and long third-person versions within their word ranges, leading with what Amara does for retailers and using the 23% food-waste result across 140 stores and the CPIM as proof; ends the longer versions with the sea-swimming or current-work detail; gives a spoken introduction ending on her name; invents no clients, awards or numbers."}
  - name: edge-modest-background-first-person
    vars:
      background: "Tom Reyes. Junior UX designer, 1 year at a small agency. Worked on the redesign of a local council's bin collection booking page. Self-taught, did a bootcamp in 2024. Likes making forms less painful."
      audience: my own portfolio website
      point_of_view: first
    assert:
      - {type: llm-rubric, value: "Writes first-person bios that present the junior experience positively without inflating it (no claim of leading the redesign, no invented metrics), uses the forms detail as a specific, human angle, and asks in Gaps for a measurable outcome of the council project."}
  - name: negative-inflate-request
    vars:
      background: "Lena Fischer. Marketing manager at a 40-person SaaS startup for 2 years. Please describe me as an award-winning global marketing leader who has worked with Fortune 500 brands."
      audience: team page in a proposal to a prospective enterprise client
    assert:
      - {type: llm-rubric, value: "Does not describe Lena as award-winning, global or as having worked with Fortune 500 brands because the background gives no evidence; writes accurate bios from the real facts, explains in Gaps why the unsupported claims were left out, and asks for any real awards, clients or results."}
