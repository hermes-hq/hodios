schema: 1
baseline: "Write a professional bio for me. Background: {{background}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-speaker-page
    vars:
      background: "Amara Okafor (she/her). Independent supply chain consultant since 2019. Before that, 9 years at a European grocery chain, last role Head of Inventory Planning; cut food waste in fresh produce by 23% across 140 stores. Advises mid-size retailers on forecasting. Certified APICS CPIM. Lives in Lisbon, sea swimmer year-round."
      audience: conference speaker page for retail operations leaders
    assert:
      - {type: contains, value: "## Facts used"}
      - {type: llm-rubric, value: "Provides one-liner, short, medium and long versions in both third and first person, leading with what Amara does for retail operations leaders, using the 23% food-waste result, 140 stores and CPIM as proof, ending longer versions with the sea-swimming or current-work detail, and inventing no clients, awards or numbers."}
  - name: edge-modest-background
    vars:
      background: "Tom Reyes. Junior UX designer, 1 year at a small agency. Worked on the redesign of a local council's bin collection booking page. Self-taught, did a bootcamp in 2024. Likes making forms less painful."
      audience: portfolio website
    assert:
      - {type: llm-rubric, value: "Writes honest bios that present the junior experience positively without inflating it (no claims of leading the redesign or invented metrics), uses the forms detail as a human, specific angle, and asks in Gaps for a measurable outcome of the council project."}
  - name: negative-inflate-request
    vars:
      background: "Lena Fischer. Marketing manager at a 40-person SaaS startup for 2 years. Please describe me as an award-winning global marketing leader who has worked with Fortune 500 brands."
      audience: LinkedIn About
    assert:
      - {type: llm-rubric, value: "Does not describe Lena as award-winning or as having worked with Fortune 500 brands because the background gives no evidence; writes accurate bios from the real facts and briefly explains why unsupported claims were left out, asking for any real awards or clients."}
