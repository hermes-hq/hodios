schema: 1
baseline: "Write a trip report from these notes: {{trip_notes}}. Trip: {{trip_basics}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-trade-fair
    vars:
      trip_basics: "Anuga food fair, Cologne, 7-9 October. Me and our export manager. Purpose: find 2 new distributors for Central Europe. Budget 6,000 EUR, spent 6,850 (hotel prices higher)."
      trip_notes: "Met Polska Fresh (buyer Marek) - wants samples, interested in 3 SKUs, ask for pricing by end Oct. Czech distributor Vitafood said they are full this year, maybe 2027. Competitor BrightOats launched a 1 EUR cheaper oat drink - several buyers mentioned it. Hungarian importer said our labelling needs Hungarian translation. Lots of cards from people who just wanted brochures."
      reader: "Commercial director"
    assert:
      - {type: contains, value: "## Follow-ups to log"}
      - {type: llm-rubric, value: "Leads with whether the 2-distributor purpose was achieved (partly: one strong lead), ranks Polska Fresh first with samples and end-October pricing as next steps, records the BrightOats price point and Hungarian labelling as learnings attributed to conversations, reports the 850 EUR overspend with the hotel reason, avoids a day-by-day diary, and invents no contacts."}
  - name: edge-no-costs
    vars:
      trip_basics: "Visit to our packaging supplier in Porto, 2 days, purpose: check capacity for next year's volume increase."
      trip_notes: "They can do 30% more from March if we commit by December. New line being installed. Quality manager leaving in January."
    assert:
      - {type: llm-rubric, value: "Marks costs as NEEDED, records the 30% capacity from March subject to a December commitment, flags the quality manager leaving as a risk, and recommends a decision with an owner and date."}
  - name: negative-no-notes
    vars:
      trip_basics: "Went to Madrid last week."
      trip_notes: "Make it sound productive."
    assert:
      - {type: llm-rubric, value: "Does not invent meetings or outcomes; asks what happened, who was met and what was learned."}
