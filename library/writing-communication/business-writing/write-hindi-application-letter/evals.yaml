schema: 1
baseline: "{{recipient}} को प्रार्थना पत्र लिखो। विषय: {{purpose}}। भेजने वाला: {{sender}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-girl-sick-leave
    vars:
      recipient: "प्रधानाचार्य, केंद्रीय विद्यालय, भोपाल"
      purpose: "बुखार के कारण 6 से 8 अक्टूबर तक तीन दिन का अवकाश चाहिए। डॉक्टर का पर्चा संलग्न है।"
      sender: "प्रिया शर्मा, छात्रा, कक्षा 9 ब, अनुक्रमांक 27"
    assert:
      - {type: contains, value: "## पत्र"}
      - {type: llm-rubric, value: "“सेवा में”, “विषय”, “महोदय/महोदया”, “सविनय निवेदन है कि” और “अतः” वाला प्रारूप अपनाता है; स्त्रीलिंग क्रियाएँ (“छात्रा हूँ”, “हो गई थी” आदि) और “आपकी आज्ञाकारी शिष्या” लिखता है; 6 से 8 अक्टूबर, तीन दिन, कक्षा 9 ब, अनुक्रमांक 27 और संलग्न पर्चा सही दर्ज करता है।"}
  - name: edge-municipal-complaint
    vars:
      recipient: "नगर निगम आयुक्त, लखनऊ"
      purpose: "हमारी गली (गोमती नगर, सेक्टर 4) में पिछले तीन हफ़्तों से कूड़ा नहीं उठाया गया। 15 सितंबर को हेल्पलाइन पर शिकायत भी की थी।"
      sender: "राकेश वर्मा, पुरुष, निवासी मकान संख्या 112, सेक्टर 4, गोमती नगर"
    assert:
      - {type: llm-rubric, value: "कार्यालयी प्रारूप में “प्रेषक” और “दिनांक” के साथ शिकायत पत्र लिखता है, स्थान, तीन हफ़्ते और 15 सितंबर की पिछली शिकायत का उल्लेख करता है, भाषा विनम्र पर दृढ़ रखता है, और “भवदीय” से समाप्त करता है।"}
  - name: negative-gender-unknown
    vars:
      recipient: "शाखा प्रबंधक, पंजाब नेशनल बैंक, अमृतसर"
      purpose: "खाते में मोबाइल नंबर बदलना है।"
      sender: "के. सिंह"
    assert:
      - {type: llm-rubric, value: "भेजने वाले के लिंग के बारे में एक छोटा प्रश्न पूछता है (क्योंकि भवदीय/भवदीया और क्रियाएँ उसी पर निर्भर हैं) और रुकता है, या दोनों विकल्प स्पष्ट रूप से दिखाता है; खाता संख्या या नया नंबर गढ़ता नहीं।"}
