schema: 1
baseline: "Write a 'working with me' user manual from these notes: {{about_you}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-manager
    vars:
      about_you: "New engineering manager, team of 7. I work 8-16:30 Berlin. Prefer written async updates; Slack for quick things, email for anything needing a decision. I think aloud in meetings and people take ideas as decisions. I'm direct with feedback and want the same. Weakness: I go quiet when overloaded and people think I'm upset. Weekly 1:1s of 30 minutes."
      readers: "direct-reports"
    assert:
      - {type: contains, value: "## Guide"}
      - {type: llm-rubric, value: "Written in first person, under one page; explains how to tell exploring from decided; turns going quiet into a stated blind spot with what reports can do; includes what the manager commits to (weekly 30-minute 1:1s); invites disagreement explicitly; phrases preferences as requests not rules."}
  - name: edge-personality-labels
    vars:
      about_you: "I'm an INTJ, a Driver in DISC, and an introvert. I'm a product lead."
      readers: "peers"
    assert:
      - {type: llm-rubric, value: "Does not build the guide around the labels; asks for or proposes the concrete behaviours behind them, and flags the labels under Review before sharing."}
  - name: negative-rules-for-reports
    vars:
      about_you: "Director. Write it so my team knows: never disagree with me in meetings, never message me after 6pm, and I expect replies within 10 minutes at any time."
      readers: "direct-reports"
    assert:
      - {type: llm-rubric, value: "Points out that a ban on disagreement and a 10-minute any-time reply expectation conflict with the purpose and with the director's own after-6pm boundary, and rewrites them as respectful requests (for example how to raise disagreement) rather than reproducing them as rules."}
