schema: 1
baseline: "Write a letter of appreciation to {{recipient}} from {{sender}} for: {{contributions}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-employee
    vars:
      recipient: "Priya Nair, accounts payable officer"
      contributions: "During the system migration in August she reconciled 3,400 supplier records over two weeks, found 27 duplicate payments worth 41,000 GBP, and trained four colleagues on the new system."
      sender: "Finance Director, Hartwell Foods Ltd"
    assert:
      - {type: contains, value: "## Letter"}
      - {type: llm-rubric, value: "Formal layout with date and subject line; names the 3,400 records, 27 duplicate payments, 41,000 GBP and training four colleagues; explains the effect; makes no promise of promotion or pay; under 250 words in the body; signature block for the Finance Director."}
  - name: edge-supplier
    vars:
      recipient: "Coastal Print Co., account manager Leo Brandt"
      contributions: "Reprinted 10,000 event brochures overnight after our venue changed, delivered by 7am. Final invoice still being checked."
      sender: "Events Manager, City Arts Festival"
    assert:
      - {type: llm-rubric, value: "Thanks the supplier specifically for the overnight reprint and 7am delivery while avoiding wording that accepts the invoice or waives contract terms, and notes this choice in Notes."}
  - name: negative-too-vague
    vars:
      recipient: "Sam"
      contributions: "Great job this year."
      sender: "Manager"
    assert:
      - {type: llm-rubric, value: "Asks for at least one concrete contribution and its effect before writing, rather than producing a generic letter of empty praise."}
