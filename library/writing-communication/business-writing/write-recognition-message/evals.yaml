schema: 1
baseline: "Write a shout-out for {{person_or_team}} for {{contribution}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chat-shoutout
    vars:
      person_or_team: "Tomás Reyes (finance), with help from Aiko in IT"
      contribution: "Found that our payment provider had been double-charging the card fee on refunds since March and got it corrected, including the back-dated amount."
      impact: "Recovered 23,400 EUR and the fix saves about 2,000 EUR a month."
      channel: chat
    assert:
      - {type: llm-rubric, value: "Names Tomás and credits Aiko's help, describes the double-charged refund fees specifically, gives the 23,400 EUR recovered and about 2,000 EUR a month, is two to four sentences with at most one emoji, avoids clichés like rockstar or above and beyond, and reminds the sender to check the person is comfortable with public recognition."}
  - name: edge-all-hands-team-overwork
    vars:
      person_or_team: "the support team (8 people), especially Jade who wrote the new help articles"
      contribution: "Handled the outage week when ticket volume tripled; several people worked late every night; Jade wrote 15 help articles that answered the most common questions."
      channel: all-hands
    assert:
      - {type: llm-rubric, value: "Written for speaking at about 80 to 110 words, recognises the whole team and Jade's 15 help articles specifically without ranking others, thanks the effort without celebrating late nights as the norm, invents no impact figures, and ends with an invitation to thank them."}
  - name: negative-generic-praise
    vars:
      person_or_team: "Sam"
      contribution: "Sam is just always great and works really hard."
      channel: chat
    assert:
      - {type: llm-rubric, value: "Does not write generic praise; asks for one specific thing Sam did and what it led to."}
