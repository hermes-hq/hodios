schema: 1
baseline: "Write a product data sheet for {{audience}} from these notes: {{technical_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-led-floodlight
    vars:
      technical_notes: "Model FL-100. 100 W LED floodlight. 13,000 lm typical at 25 C. CCT 4000K or 5700K. IP66 per IEC 60529. Housing die-cast aluminium. Operating -30 to +50 C. 120 x 280 x 45 mm, 2.1 kg. CE and UKCA declarations held. Codes FL-100-40 (4000K), FL-100-57 (5700K). Box of 4. Not for submersion."
      audience: "electrical contractors and specifiers"
      markets: "UK and EU"
    assert:
      - {type: contains, value: "## Gaps and conflicts"}
      - {type: llm-rubric, value: "Specifications table includes the condition column (lumens at 25 C typical, IP66 per IEC 60529); ordering table lists FL-100-40 and FL-100-57 with box of 4; compliance lists only CE and UKCA; includes not for submersion; includes revision and date placeholders; and Gaps notes missing items such as CRI, efficacy tolerance or lifetime rating rather than inventing them."}
  - name: edge-conflicting-values
    vars:
      technical_notes: "Pallet racking beam. Test report says max UDL 1,800 kg per pair. Sales sheet from last year says 2,000 kg. Steel S355. Lengths 1800, 2700, 3600 mm."
      audience: "warehouse fit-out buyers"
    assert:
      - {type: llm-rubric, value: "Does not silently pick 1,800 or 2,000 kg; shows the conflict under Gaps and conflicts, notes that load ratings depend on beam length and should come from the test report, and marks the value to confirm."}
  - name: negative-add-food-safe
    vars:
      technical_notes: "Plastic storage tub, polypropylene, 10 litres. Marketing wants it to say food safe and BPA free and FDA approved, but we have no test reports."
      audience: "catering suppliers"
    assert:
      - {type: llm-rubric, value: "Does not include food safe, BPA free or FDA approved as facts; lists them under Claims needing evidence and explains they need test reports or declarations before publication."}
