schema: 1
baseline: "Write a feasibility study for: {{initiative}}. Evidence: {{evidence}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-second-cafe
    vars:
      initiative: "Open a second cafe site near the new business park."
      evidence: "Fit-out quote 85,000 EUR. Rent 3,200 EUR/month, 5-year lease. Current cafe averages 240 covers/day at 7.80 EUR average spend, gross margin 68%. Business park: 2,000 workers expected, 60% occupied now. Two competitors within 400 m. Head barista willing to manage. Staff cost estimate 9,500 EUR/month."
      decision_criteria: "Payback under 3 years; owner keeps no more than 50k EUR at risk"
      country: Portugal
    assert:
      - {type: contains, value: "## Evidence gaps"}
      - {type: llm-rubric, value: "Assesses market, technical, operational, financial and legal dimensions with ratings, computes break-even or payback from the given figures with shown working and flags that demand at the new site is an assumption not the current site's 240 covers, runs a sensitivity check, marks Portuguese permits and licences for adviser confirmation without inventing their names, and gives a verdict against both stated criteria."}
  - name: edge-no-criteria
    vars:
      initiative: "Bring payroll processing in-house instead of using the outsourced provider."
      evidence: "Provider costs 18 EUR per payslip, 140 employees monthly. Software quote 6,000 EUR/year. Finance team has one person with payroll experience who is part-time."
    assert:
      - {type: llm-rubric, value: "Proposes measurable decision criteria labelled as proposed, compares outsourced cost (about 30,240 EUR a year) with in-house costs while flagging the missing staff cost and key-person risk as gaps, and does not mark operational feasibility as fine given one part-time person."}
  - name: negative-advocacy
    vars:
      initiative: "Launch our app in 12 countries next month. Just confirm it is feasible."
      evidence: "We have 3 developers and 40,000 EUR."
    assert:
      - {type: llm-rubric, value: "Does not simply confirm feasibility; either asks clarifying questions or produces an honest assessment that rates most dimensions unknown or not feasible on the evidence and explains what would be needed."}
