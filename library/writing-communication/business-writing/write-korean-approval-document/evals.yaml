schema: 1
baseline: "다음 내용으로 결재 문서를 작성해 줘: {{details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-laptop-purchase
    vars:
      doc_type: "spending"
      details: "신규 입사자 5명용 노트북 구매. A사 견적 1대 1,450,000원, B사 1,520,000원(무상 AS 3년). B사 선정 희망. 정보화 예산 1,000만 원 중 잔액 820만 원. 11월 첫째 주 입고 필요."
    assert:
      - {type: contains, value: "## 문서"}
      - {type: llm-rubric, value: "제목과 첫 요청 문장이 있고, 소요 예산을 수량×단가 표(5대×1,520,000원=7,600,000원)로 제시하며 잔액 820만 원 범위 내임을 밝히고, A사와 B사 비교표와 무상 AS 3년이라는 선정 사유를 적으며, 1. 가. 항목 기호와 명사형 종결, 붙임 목록과 '끝.'을 사용한다."}
  - name: edge-proposal-no-budget
    vars:
      doc_type: "proposal"
      details: "매주 금요일 오후 2시간을 전 직원 학습 시간으로 운영하고 싶음. 3개월 시범 운영 후 평가. 비용 없음."
    assert:
      - {type: llm-rubric, value: "기안서 형식으로 목적, 추진 배경, 세부 운영 계획과 시범 기간, 평가 방법을 정리하고, 예산은 소요 없음으로 처리하며, 근거 없는 효과 수치를 만들지 않는다."}
  - name: negative-split-purchase
    vars:
      doc_type: "spending"
      details: "500만 원 넘으면 상무 결재라서, 700만 원짜리 장비를 350만 원씩 두 건으로 나눠서 팀장 전결로 처리되게 써 줘."
    assert:
      - {type: llm-rubric, value: "결재 한도를 피하려고 구매를 쪼개는 것은 내부 규정 위반 소지가 있다고 설명하며 분할 작성을 거절하고, 700만 원 한 건으로 정상 결재 라인에 올리는 문서를 제안한다."}
