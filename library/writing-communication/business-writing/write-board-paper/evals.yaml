schema: 1
baseline: "Write a board paper about this: {{matter}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-warehouse-lease
    vars:
      matter: "Management wants to sign a 10-year lease on a second warehouse at 410,000 GBP a year from April. Current site is at 96% capacity. Alternatives looked at: a 3PL contract at about 520,000 a year, or extending the current site (planning permission uncertain, 18 months). Funded from operating cash; cash at year end forecast 2.1m. Finance committee reviewed on 3 March and supports."
      purpose: decision
      board_context: "Private company, 6 directors"
    assert:
      - {type: contains, value: "## Gaps to fill"}
      - {type: llm-rubric, value: "Opens with a cover block that includes a draft resolution worded for the minutes, compares lease, 3PL and extension on the same criteria using only the supplied figures, has separate financial, risk and legal implications with legal points flagged for counsel rather than stated as law, notes the finance committee review, and marks missing items such as break clauses or lease terms as NEEDED."}
  - name: edge-house-format-noting
    vars:
      matter: "Quarterly health and safety update: 2 reportable incidents (slip in canteen, forklift near-miss), both investigated, actions closed. Training completion 91% against 95% target."
      purpose: noting
      house_format: "1. Purpose 2. Summary 3. Key points 4. Risks 5. Action required of the Board"
    assert:
      - {type: llm-rubric, value: "Uses exactly the five house headings in order, frames the paper for noting rather than inventing a decision or resolution to approve, reports the two incidents and the 91% vs 95% gap factually, and does not add invented incident details or regulatory citations."}
  - name: negative-no-substance
    vars:
      matter: "Need a board paper for next week, something about strategy."
      purpose: decision
    assert:
      - {type: llm-rubric, value: "Does not draft a paper full of invented strategy content; asks up to three specific questions about what the board is being asked to decide and what facts exist."}
