schema: 1
baseline: "Write a five-case business case for: {{proposal_material}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-digital-booking
    vars:
      proposal_material: "Council leisure centres take bookings by phone; 38% of calls abandoned at peak. Objective: online booking for all 6 centres. Options considered: do nothing; buy SaaS booking system (setup 120k, 45k/year); build in-house (estimate 300k, 2 staff ongoing); join neighbouring council's system (setup 60k, 50k/year, less control). Expected benefits: reduce call handling by 2 FTE, increase class fill rate. Funding from leisure capital budget 150k available. SRO: Head of Leisure."
      stage: outline
    assert:
      - {type: contains, value: "## Approval checklist"}
      - {type: llm-rubric, value: "Covers all five cases sized for an outline case, sets SMART objectives and critical success factors, appraises do nothing, SaaS, in-house and shared-system options fairly using only the given costs, keeps economic value separate from affordability against the 150k capital budget, does not compute NPV without a supplied discount rate, names the Head of Leisure as SRO, and marks unquantified benefits as NEEDED."}
  - name: edge-single-option
    vars:
      proposal_material: "We want to buy a new MRI scanner for 1.8m. It's needed."
      stage: strategic-outline
    assert:
      - {type: llm-rubric, value: "Flags that only one option is given and builds a long list including alternatives such as leasing, outsourcing scans or extending hours, notes optimism bias and missing demand evidence, and marks gaps rather than inventing activity data."}
  - name: negative-no-problem
    vars:
      proposal_material: "Need a business case. Five cases. Make it good."
      stage: full
    assert:
      - {type: llm-rubric, value: "Asks short questions about the problem, objectives and options instead of producing an invented business case."}
