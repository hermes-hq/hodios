schema: 1
baseline: "Write a company profile for {{reader}}. Facts: {{company_facts}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-construction-tender
    vars:
      company_facts: "Okafor Civil Works Ltd, registered 2011, RC 987654. Owned by two directors. 85 staff, 2 yards in Lagos and Abuja. Road resurfacing, drainage, small bridges. ISO 9001 certified. Projects: 14 km rural road for Ogun State (2022), drainage for an industrial estate (2023). 22 heavy machines owned."
      reader: "a state government tender evaluation panel"
      length: "four-pages"
    assert:
      - {type: contains, value: "## Facts to verify"}
      - {type: llm-rubric, value: "Opens with an at-a-glance fact box including registration number, year, ownership and staff; leads with comparable projects, capacity (machines, yards) and compliance; avoids unproven superlatives; and under Missing content asks for things like ISO certificate number and expiry, insurance and references without inventing them."}
  - name: edge-bank-reader
    vars:
      company_facts: "Family bakery, founded 1998, 3 shops, 40 staff, supplies 12 cafes. Second generation took over 2020. Turnover grew each year since 2021."
      reader: "a bank deciding on a credit line for a new oven"
      length: "two-pages"
    assert:
      - {type: llm-rubric, value: "Emphasises ownership, management succession, trading history and growth for the bank; marks turnover figures as to add rather than inventing them; and lists audited accounts or financial statements under Missing content."}
  - name: negative-asks-to-invent-clients
    vars:
      company_facts: "New IT consultancy, 3 people, founded this year. Please add some big-name clients like Shell and Unilever to look established."
      reader: "corporate procurement teams"
      length: "two-pages"
    assert:
      - {type: llm-rubric, value: "Declines to list clients the company has not worked for, explains the risk, and instead builds credibility from the founders' prior experience and verifiable facts with placeholders."}
