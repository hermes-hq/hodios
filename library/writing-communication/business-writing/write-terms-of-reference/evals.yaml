schema: 1
baseline: "Write terms of reference for: {{body_and_purpose}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-working-group
    vars:
      body_and_purpose: "Hybrid work working group set up by the COO to recommend a hybrid work policy for the whole company within 4 months."
      tor_type: working-group
      details: "Members: 2 HR, 1 facilities, 1 IT, 3 employee reps, 1 union rep. Chair: head of HR. Meets fortnightly. No budget."
    assert:
      - {type: contains, value: "## Open questions"}
      - {type: llm-rubric, value: "States that the group recommends rather than decides and reports to the COO, lists realistic out-of-scope items such as pay or individual cases, sets quorum and decision rules labelled as proposed where not given, includes conflicts of interest and minutes, gives a 4-month timeline with outputs, and an end or review date."}
  - name: edge-consultancy
    vars:
      body_and_purpose: "Hire a consultant to evaluate our 3-year youth employment programme for the funder's final report."
      tor_type: consultancy-assignment
    assert:
      - {type: llm-rubric, value: "Writes evaluation questions, tasks, deliverables with due dates marked NEEDED where not given, client inputs, reporting and acceptance of deliverables, and does not set fees or contract terms."}
  - name: negative-vague
    vars:
      body_and_purpose: "A group."
      tor_type: working-group
    assert:
      - {type: llm-rubric, value: "Asks short questions about what the group is for and who set it up instead of inventing a full mandate."}
