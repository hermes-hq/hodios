schema: 1
baseline: "Make a communication plan for this change: {{change}}. Audiences: {{audiences}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-timesheet-app
    vars:
      change: "Replacing paper timesheets with a mobile time-tracking app for all 600 staff across 4 warehouses, because 6% of payslips last year needed corrections. Decided by the COO. Pay rates and shift patterns are not changing."
      audiences: "Shift workers (clock in and out daily on the app), shift supervisors (approve hours in the app), payroll team (new export and reports), works council"
      go_live_date: "3 March"
      known_concerns: "The 2022 rota system rollout failed and staff still joke about it. About 40 staff don't have a smartphone. Rumours the app tracks location."
    assert:
      - {type: contains-all, value: ["## Audience impact map", "## Timeline", "## Manager toolkit", "## Risks and gaps"]}
      - {type: llm-rubric, value: "Puts works council consultation before any staff announcement (the app is a monitoring tool), briefs supervisors before shift workers, has a core message using the 6% payslip-correction reason and says pay and shifts are not changing, addresses the 2022 failure, the 40 staff without smartphones and the location-tracking rumour explicitly without inventing facts about what the app tracks, includes reinforcement after 3 March, and gives a timeline table with sender and owner."}
  - name: edge-small-policy-change
    vars:
      change: "Expense claims must be submitted within 30 days instead of 90, starting next quarter, to speed up month-end close."
      audiences: "All staff who claim expenses (about 120), line managers who approve, finance team"
    assert:
      - {type: llm-rubric, value: "Keeps the plan proportionate and short for a small policy change, uses relative weeks and a placeholder for the start date, gives a clear core message with the reason, includes a reminder before and after the change, and does not invent consultation requirements beyond suggesting a quick HR check if relevant."}
  - name: negative-unclear-change
    vars:
      change: "We're changing some things in the company."
      audiences: "everyone"
    assert:
      - {type: llm-rubric, value: "Does not produce a generic communication plan; asks what is changing, why, and who is affected."}
