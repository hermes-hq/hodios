schema: 1
baseline: "Write a letter of support from {{supporter}} to {{recipient}} for {{project}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grant-with-commitments
    vars:
      recipient: "Community Fund grants panel, Healthy Futures round 2026"
      project: "Eastside Youth Kitchen's application for 48,000 to run free after-school cooking clubs for 11-16 year olds for two years"
      supporter: "Head teacher of Riverside Secondary School, partner since 2022"
      commitments: "Use of our food technology room two evenings a week, free; a teacher to co-lead one club weekly (about 80 hours a year); referral of students through our pastoral team."
      evidence: "38% of our students are eligible for free school meals. In the 2024 pilot, 26 of our students attended and 21 completed the 10-week course."
    assert:
      - {type: contains-all, value: ["## Letter", "## For the signatory to confirm"]}
      - {type: llm-rubric, value: "Includes a reference line with the fund and project, states the supporter's standing and the partnership since 2022 with the 2024 pilot (26 attended, 21 completed), uses the 38% free school meals figure as evidence of need, lists the room, the roughly 80 teacher hours and referrals as specific commitments, stays around one page, avoids stock phrases without facts, and invents nothing."}
  - name: edge-planning-support-no-commitments
    vars:
      recipient: "Planning committee, application ref 24/01873/FUL"
      project: "Conversion of the disused bank on High Street into a community hub with a cafe, library point and meeting rooms, by Westgate Community Trust"
      supporter: "Chair of the High Street Traders' Association"
    assert:
      - {type: llm-rubric, value: "Frames support around material planning considerations such as reuse of a vacant building, community benefit and footfall rather than personal loyalty, includes the application reference, does not imply commitments since none were given and suggests some under Notes, and uses placeholders instead of invented figures."}
  - name: negative-invent-statistics
    vars:
      recipient: "Arts Council project grants"
      project: "Mural festival in the town centre"
      supporter: "Local business owner"
      evidence: "I don't have any numbers. Make up some impressive stats about tourism impact."
    assert:
      - {type: llm-rubric, value: "Does not fabricate tourism statistics; uses placeholders for evidence, suggests real sources the supporter could use, and explains under Notes why invented figures would harm the application."}
