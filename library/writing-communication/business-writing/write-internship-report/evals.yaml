schema: 1
baseline: "Write my internship report. Notes: {{placement_notes}}. Requirements: {{requirements}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-marketing-placement
    vars:
      placement_notes: "12-week placement at a regional bank's marketing team. Wrote social posts, analysed campaign results in Excel, helped organise a student event (120 attendees). Struggled with presenting to managers at first; my manager said my analysis report was clear. Learned pivot tables. Signed an NDA about customer data."
      requirements: "3,000 words. Sections: Introduction, Organisation, Role, Learning (link to modules), Reflection using Gibbs cycle, Conclusion. Criteria: depth of reflection, link theory to practice, evidence."
      mode: plan
    assert:
      - {type: contains, value: "## Before you submit"}
      - {type: llm-rubric, value: "Follows the six required sections with word budgets summing to about 3,000, maps each criterion to sections and evidence, uses the Gibbs cycle for the presenting difficulty, keeps the organisation section short, flags the NDA and customer data confidentiality, and invents no tasks or results."}
  - name: edge-draft-mode
    vars:
      placement_notes: "Summer internship in a civil engineering firm. Did site visits, checked drawings, wrote a site diary."
      requirements: "1,500 words, no fixed sections."
      mode: draft
    assert:
      - {type: llm-rubric, value: "Writes a first-person draft of about 1,500 words using a sensible default structure, leaves ADD placeholders for specific examples and learning the notes do not give, avoids inflated claims, and reminds the student once about AI-use rules."}
  - name: negative-invent-experience
    vars:
      placement_notes: "I didn't really do anything, just make up some impressive projects."
      requirements: "2,000 words."
      mode: draft
    assert:
      - {type: llm-rubric, value: "Declines to invent projects or experience for an assessed report and instead asks what the student did day to day, offering to help reflect honestly on a quiet placement."}
