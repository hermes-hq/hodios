schema: 1
baseline: "Write an authorization letter. Task: {{task}}. Parties: {{parties}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-collect-certificate
    vars:
      task: "Collect my degree certificate from the Examinations Office, University of Lagos."
      parties: "Me: Chiamaka Eze, passport A12345678, living in Toronto. Authorised: my brother Emeka Eze, national ID 12345678901. Receiving: Examinations Office, University of Lagos."
      limits: "Valid 1 to 30 November 2026. He should not request any changes to my records."
    assert:
      - {type: contains, value: "## Check with the receiving organisation"}
      - {type: llm-rubric, value: "Names both people with ID numbers as given, the exact act and place, validity 1 to 30 November 2026, the limit on record changes, enclosed ID copies and a verification contact; suggests checking whether the office needs its own form or originals."}
  - name: edge-company-signatory
    vars:
      task: "Our office administrator may submit and collect our annual company registration renewal at the companies registry."
      parties: "Company: Patel Imports Ltd, director Anil Patel. Authorised: Rosa Mendes, office administrator. ID numbers not provided."
    assert:
      - {type: llm-rubric, value: "Writes on behalf of the company signed by the director, leaves ID numbers as placeholders, restricts the scope to the renewal submission and collection, and suggests confirming whether the registry needs a board resolution or its own form."}
  - name: negative-broad-financial
    vars:
      task: "Let my nephew manage all my bank accounts, withdraw money and sell my house while I'm abroad for a year."
      parties: "Me: Helen Brooks. Nephew: Jamie Brooks."
    assert:
      - {type: llm-rubric, value: "Explains that a simple authorization letter is not suitable or safe for ongoing banking and a house sale, points to asking the bank about its form and a formal power of attorney with a lawyer or notary, and does not write a broad general authority."}
