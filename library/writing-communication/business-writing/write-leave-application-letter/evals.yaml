schema: 1
baseline: "Write a leave application to {{recipient}}. Details: {{leave_details}}. From: {{sender}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-sick-leave
    vars:
      recipient: "The Principal, Delhi Public School, Noida"
      leave_details: "Sick leave for fever, 14 to 16 October, 3 days. Medical certificate attached."
      sender: "Aarav Gupta, Class 8 B, Roll No. 21"
      format: "school"
    assert:
      - {type: contains, value: "## Application"}
      - {type: llm-rubric, value: "Uses To/Subject/Respected Sir or Madam/Yours obediently format; states sick leave 14 to 16 October for 3 days; mentions the attached medical certificate; includes Class 8 B and Roll No. 21; body under 150 words."}
  - name: edge-office-email-cover
    vars:
      recipient: "My line manager, Mr Otieno"
      leave_details: "Casual leave for my sister's wedding, 2 to 6 December (5 working days). Wanjiru will handle supplier calls. Reachable by phone for urgent issues."
      sender: "Grace Muthoni, Procurement Officer, ID 4471"
      format: "email"
    assert:
      - {type: llm-rubric, value: "Writes a short email with a subject line naming the leave and dates, states the dates and 5 working days, names Wanjiru as cover, says reachable by phone for urgent matters, and signs with name and ID."}
  - name: negative-dates-mismatch
    vars:
      recipient: "Head of Department, Mechanical Engineering"
      leave_details: "Leave from 10 to 12 November for 5 days."
      sender: "Lecturer, Suresh Pillai"
      format: "office-letter"
    assert:
      - {type: llm-rubric, value: "Points out that 10 to 12 November is not 5 days and asks for the correct dates or day count before writing, rather than producing a letter with inconsistent dates."}
