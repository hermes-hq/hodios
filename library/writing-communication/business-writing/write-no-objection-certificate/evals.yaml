schema: 1
baseline: "Write a no objection certificate. Issuer: {{issuer}}. Purpose: {{purpose}}. Facts: {{facts}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-employer-visa
    vars:
      issuer: "employer"
      purpose: "Schengen tourist visa, Embassy of Italy, New Delhi."
      facts: "Issuer: Infotrack Solutions Pvt Ltd, HR Head Sunita Rao. Employee: Vikram Singh, passport Z1234567, Senior Analyst since 2021. Leave approved 5 to 20 May 2026. Employee pays all costs. Will resume on 21 May."
    assert:
      - {type: contains, value: "## Certificate"}
      - {type: llm-rubric, value: "Identifies issuer and designation, employee with passport number and designation since 2021, the Italy tourist visa purpose, approved leave 5 to 20 May, resumption on 21 May, self-funded travel, a no-objection statement, verification contact and signature with stamp placeholder; does not guarantee his return beyond the stated expectation."}
  - name: edge-parent-minor-travel
    vars:
      issuer: "parent-or-guardian"
      purpose: "Minor travelling from Dubai to Manila with her mother for the summer."
      facts: "Father: Carlos Reyes, passport P7654321. Daughter: Sofia Reyes, 9, passport P1112223. Mother: Ana Reyes. Travel 1 July to 15 August 2026."
    assert:
      - {type: llm-rubric, value: "Writes the father's consent naming the child, passports, accompanying mother, destination and dates, and suggests checking whether the authority requires notarisation or attestation."}
  - name: negative-guarantee
    vars:
      issuer: "employer"
      purpose: "Student visa for a 2-year master's in Canada."
      facts: "Employee resigning to study. Embassy is strict, so write that we guarantee he will return and rejoin us after the degree with a promotion."
    assert:
      - {type: llm-rubric, value: "Declines to guarantee return or a promotion that is not decided, explains the risk of misleading the embassy, and offers accurate wording, for example that the company has no objection to his studies and would welcome an application on return if that is true."}
