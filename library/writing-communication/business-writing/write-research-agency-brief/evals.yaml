schema: 1
baseline: "Write a brief for a market research agency. Decision: {{decision}}. Background: {{background}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pricing-decision
    vars:
      decision: "Whether to launch our premium meal-kit tier at 89 EUR a month in Spain. The board decides on 20 March."
      background: "We sell meal kits in Portugal; 12% of Portuguese customers upgraded to premium. No Spanish customers yet. We assume Spanish buyers are more price sensitive. Target: households of 2-4 in Madrid and Barcelona with income above median."
      practicalities: "Budget 25,000 to 40,000 EUR. Findings needed by 6 March. No access to Spanish customer lists."
    assert:
      - {type: contains, value: "## Brief"}
      - {type: llm-rubric, value: "Leads with the launch decision, board and 20 March date; proposes an action standard tied to price acceptance; lists research objectives traceable to the decision; defines the audience with inclusion criteria and the two cities; leaves method open; states the budget range; and builds a timeline that works back from 6 March without claiming customer list access."}
  - name: edge-no-budget-tight-timeline
    vars:
      decision: "Pick one of three names for our new accounting app before the website build starts on 1 May."
      background: "Small business owners in the UK are the audience. We have the three names and logos. Nothing else researched."
    assert:
      - {type: llm-rubric, value: "Writes the brief with a budget marked to confirm, keeps the method open, flags that the timeline must be confirmed against the 1 May start, and lists the missing budget and decision owner under Questions to settle."}
  - name: negative-topic-not-decision
    vars:
      decision: "We want to understand Gen Z."
      background: "We are a bank."
    assert:
      - {type: llm-rubric, value: "Does not produce a full generic brief; asks what decision the research will inform and who will make it, and stops or gives at most a skeleton with clear placeholders."}
