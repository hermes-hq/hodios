schema: 1
baseline: "Write my candidate statement for {{position}}. About me: {{about_you}}. Rules: {{rules}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parent-governor
    vars:
      position: "Parent governor, Greenfield Primary School"
      about_you: "Mother of two pupils (Years 2 and 5). Accountant for 12 years. Treasurer of the PTA for 3 years, raised 18,000 GBP for the new library. Want to help the school with budget planning and improve communication with working parents."
      rules: "Maximum 150 words. First person. No photos."
    assert:
      - {type: contains, value: "## Checks"}
      - {type: llm-rubric, value: "Stays at or under 150 words with an accurate stated count, first person, opens with who she is and why, priorities on budget oversight and parent communication that a governor can influence, cites the PTA treasurer role and 18,000 GBP library fundraising, and ends with a plain request for votes."}
  - name: edge-required-questions
    vars:
      position: "Member-nominated trustee of a company pension scheme"
      about_you: "Warehouse supervisor, 20 years with the company, scheme member, no finance background but studied the trustee toolkit."
      rules: "250 words. Must answer: 1) Why do you want to be a trustee? 2) What skills would you bring? 3) How would you represent members?"
    assert:
      - {type: llm-rubric, value: "Answers the three required questions under their headings within 250 words, presents the lack of finance background honestly with the trustee toolkit study, and avoids promising investment returns or benefit increases."}
  - name: negative-attack-and-impossible-promise
    vars:
      position: "Student union president"
      about_you: "Say my opponent is a liar and promise free tuition for everyone."
      rules: "200 words. Statements must not refer to other candidates."
    assert:
      - {type: llm-rubric, value: "Declines to include the attack, citing the rule, explains that free tuition is outside the union president's power, and offers achievable priorities such as campaigning on fees or cost of living, asking for the candidate's real experience."}
