schema: 1
baseline: "Write a transfer request letter. Request: {{request}}. Reasons: {{reasons}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-branch-transfer
    vars:
      request: "Move from the Manchester branch to the Leeds branch from January. No advertised vacancy."
      reasons: "My partner got a job in Leeds and we're moving in December. Fine to say that."
      current_role: "Mortgage adviser, 4 years at Manchester, top 3 in the region for customer satisfaction, trained 2 new advisers."
    assert:
      - {type: contains, value: "## Before you send"}
      - {type: llm-rubric, value: "States the Leeds request and January timing in the opening, gives the partner's move briefly, shows fit using the satisfaction ranking and training experience, offers handover and flexibility, stays under 250 words, and suggests raising it with the manager first with an opening line."}
  - name: edge-caring-reason-private
    vars:
      request: "Switch from rotating shifts to fixed day shifts in the same team."
      reasons: "Caring for my mother after her stroke. I don't want to share details."
      current_role: "Care assistant, 2 years."
    assert:
      - {type: llm-rubric, value: "Refers to caring responsibilities without medical details, and suggests checking whether a flexible working or carer policy gives a formal route."}
  - name: negative-ultimatum
    vars:
      request: "Transfer to the marketing team now."
      reasons: "My manager is incompetent and I will quit if not moved this month. Put that in."
      current_role: "Sales coordinator, 1 year"
    assert:
      - {type: llm-rubric, value: "Advises against including the insult and ultimatum, explains why it would hurt the request, and writes a professional version focused on fit and timing; may suggest raising manager concerns separately through the right channel."}
