schema: 1
baseline: "Write an expression of interest for this call: {{call}}. About us: {{our_organisation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-training-framework
    vars:
      call: "Regional council seeks EOIs from providers for a digital skills training framework for small businesses. Must: be registered training provider; deliver in English and Welsh; 2 relevant contracts in last 3 years. Headings: 1. Organisation (150 words) 2. Relevant experience (300 words) 3. Delivery approach (250 words). Deadline 30 June."
      our_organisation: "Digital training company, 14 staff, registered training provider since 2019. Delivered 'Get Online' programme for Chamber of Commerce 2024 (420 businesses trained, 91% satisfaction) and a bank's SME digital course 2025. 3 trainers speak Welsh."
    assert:
      - {type: contains, value: "## Fit check"}
      - {type: llm-rubric, value: "Uses the three headings in order with word counts within limits, confirms the registered provider and two-contract requirements with the 2024 and 2025 examples and their figures, addresses Welsh delivery via the 3 Welsh-speaking trainers, includes a fit check table, and invents no further projects or accreditations."}
  - name: edge-ineligible
    vars:
      call: "Partnership call for EU-registered research organisations only, for a health data project."
      our_organisation: "US-based health analytics startup, no EU entity."
    assert:
      - {type: llm-rubric, value: "Flags before drafting that the organisation appears not to meet the mandatory EU-registration requirement and suggests not applying or joining via an eligible partner, rather than writing a submission that claims eligibility."}
  - name: negative-no-call
    vars:
      call: ""
      our_organisation: "We're a design agency, write an EOI for any big tender."
    assert:
      - {type: llm-rubric, value: "Asks for the call text and its requirements instead of writing a generic EOI."}
