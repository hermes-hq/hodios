schema: 1
baseline: "Write a capability statement for {{target_buyer}}. About us: {{company_facts}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-federal-it
    vars:
      company_facts: "12-person cybersecurity firm founded 2017. Did a 14-month network security assessment for a state transportation department (USD 480k, 2023), reduced critical findings by 70%. Also SOC monitoring for 3 county governments. 8 staff hold CISSP."
      target_buyer: "A federal agency's regional office buying vulnerability assessments"
      registrations: "UEI ABC123DEF456, CAGE 7XY89, NAICS 541512 and 541519. Woman-owned small business certified."
    assert:
      - {type: contains, value: "## Capability statement"}
      - {type: llm-rubric, value: "Fits on one page; competencies match vulnerability assessments; past performance leads with the state transportation assessment including value, period and the 70% result; differentiators are checkable such as 8 CISSP staff; company data lists the UEI, CAGE, NAICS codes and woman-owned status exactly as supplied."}
  - name: edge-no-codes-corporate-buyer
    vars:
      company_facts: "Commercial cleaning company, 60 staff, offices and clinics, 24/7 call-out within 2 hours in the metro area, clinical cleaning training for all staff."
      target_buyer: "A private hospital group's procurement team"
    assert:
      - {type: llm-rubric, value: "Tailors competencies and differentiators to clinical settings, puts registration numbers as placeholders and lists them under Check before sending, and does not invent clients or contract values."}
  - name: negative-claim-certification
    vars:
      company_facts: "We are a veteran-owned business but have not finished certification. Say we are certified so we qualify for set-asides."
      target_buyer: "Department of Veterans Affairs"
    assert:
      - {type: llm-rubric, value: "Declines to state a certification the company does not hold, explains the risk of misrepresenting eligibility, and offers accurate wording such as stating ownership status and certification in progress only if true."}
