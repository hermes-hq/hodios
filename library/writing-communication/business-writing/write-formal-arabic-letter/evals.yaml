schema: 1
baseline: "اكتب خطابًا رسميًا إلى {{recipient}} بخصوص: {{subject}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dean-study-leave
    vars:
      recipient: "عميد كلية الهندسة في جامعة الملك سعود، الأستاذ الدكتور خالد العتيبي"
      subject: "أنا المهندسة نورة القحطاني، معيدة في قسم الهندسة الكهربائية. أطلب الموافقة على إجازة دراسية لمدة سنتين لاستكمال الماجستير في جامعة مانشستر ابتداءً من سبتمبر 2027. أرفق خطاب القبول وخطة الدراسة."
      country: "السعودية"
    assert:
      - {type: contains, value: "## الخطاب"}
      - {type: llm-rubric, value: "يخاطب العميد بلقب مناسب مثل «سعادة عميد كلية الهندسة الأستاذ الدكتور خالد العتيبي المحترم»، ويضع سطر «الموضوع»، ويذكر المدة سنتين وجامعة مانشستر وسبتمبر 2027، ويعدد المرفقات، ويترك التاريخ الهجري بين معقوفين دون حسابه، ويستعمل صيغة الجمع للتعظيم باتساق وخاتمة رسمية معتادة."}
  - name: edge-unknown-title-morocco
    vars:
      recipient: "مسؤول قسم شؤون الطلبة في كلية الآداب بالرباط"
      subject: "أطلب شهادة تسجيل للسنة الجامعية الحالية لتقديمها إلى السفارة. اسمي يوسف بنعلي، رقم الطالب 2023-4512."
      country: "المغرب"
    assert:
      - {type: llm-rubric, value: "يستعمل التاريخ الميلادي والأرقام الغربية، ويخاطب بلقب عام مناسب مثل «السيد رئيس مصلحة شؤون الطلبة المحترم» مع التنبيه في الملاحظات إلى أن البسملة اختيارية، ويذكر رقم الطالب 2023-4512 بدقة."}
  - name: negative-unclear-purpose
    vars:
      recipient: "وزارة العمل"
      subject: "عندي مشكلة."
      country: "الأردن"
    assert:
      - {type: llm-rubric, value: "يسأل سؤالًا قصيرًا عن طبيعة المشكلة وما يريد المرسل طلبه ثم يتوقف، دون أن يخترع شكوى أو أرقامًا."}
