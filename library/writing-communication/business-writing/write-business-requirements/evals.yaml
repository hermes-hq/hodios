schema: 1
baseline: "Write a business requirements document for: {{initiative}}. Current process: {{current_process}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phone-system
    vars:
      initiative: "Replace the office phone system: current provider ends support on 30 June. Goal is to keep customer calls flowing and cut missed calls."
      stakeholders: "COO sponsor; customer service team of 25 (main users); 3 branch offices; IT (2 people); finance approves budget"
      current_process: "Customers call a single number; an auto-attendant routes to sales or service. Calls ring in a hunt group of 25 agents. No call queue, so when all are busy the caller hits voicemail. About 1,800 inbound calls a day; 14% go to voicemail; voicemails checked twice a day. Handsets are desk phones only; agents working from home divert to mobiles, which shows their personal numbers to customers. No call reporting."
      constraints: "Budget up to 40,000 EUR one-off and 2,500 EUR a month. Must keep the existing main number. Go-live by 15 June."
    assert:
      - {type: contains-all, value: ["## Business requirements document", "## Open questions", "## Requirements quality check"]}
      - {type: llm-rubric, value: "Includes measurable objectives such as reducing the 14% missed-call rate with a target or a NEEDED placeholder, in and out of scope lists, a stakeholder table, current and future state steps, a numbered BR table with shall statements, MoSCoW priorities and testable acceptance criteria (for example call queueing, keeping the main number, not exposing personal mobile numbers, reporting), non-functional items such as availability and data protection, names no vendor or product, and uses the 40,000/2,500 budget and 15 June as constraints."}
  - name: edge-solution-as-goal
    vars:
      initiative: "Buy Salesforce for the events team."
      current_process: "Event registrations come via web forms into a shared inbox; two coordinators copy them into Excel; about 4,000 registrations a year across 30 events; duplicates and missed dietary requirements happen at most events; sponsors' leads are sent as CSV after each event, often a week late."
    assert:
      - {type: llm-rubric, value: "Restates the need as managing registrations, attendee data and sponsor leads, records Salesforce as a constraint or candidate rather than a requirement, keeps requirement statements product-neutral, and lists missing stakeholders and budget as open questions."}
  - name: negative-too-thin
    vars:
      initiative: "Improve our processes."
      current_process: "It's slow."
    assert:
      - {type: llm-rubric, value: "Does not write a full BRD from nothing; asks specific questions about which process, its steps, volumes and pain points, and the goal."}
