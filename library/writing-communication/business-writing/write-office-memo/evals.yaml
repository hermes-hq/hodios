schema: 1
baseline: "Write a memo to {{to_and_from}} about: {{message}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-expense-deadline
    vars:
      message: "From next month, expense claims must be submitted by the 5th working day of the following month or they go into the next payroll. Reason: payroll cut-off moved earlier. Applies to all staff except field engineers who keep the 10th. Questions to finance team."
      to_and_from: "All staff, from the Finance Director"
      tone: neutral
    assert:
      - {type: contains, value: "## Check before sending"}
      - {type: llm-rubric, value: "Uses a To, From, Date, Subject header with a subject that names the change, puts the 5th working day rule and its start in the first sentences, states the field engineer exception, gives the reason briefly, names the finance team as contact, invents no penalties, and stays under about 250 words."}
  - name: edge-firm-no-scolding
    vars:
      message: "People keep leaving the fire door at the back open to smoke. It must stay closed at all times. Smoking area is the front shelter."
      to_and_from: "All site staff, from the Site Manager"
      tone: firm
    assert:
      - {type: llm-rubric, value: "Is direct about the rule and gives the safety reason and the smoking area alternative without group scolding, sarcasm or invented disciplinary consequences."}
  - name: negative-invented-threat
    vars:
      message: "Tell staff that anyone who parks in the visitor bays will be fired on the spot."
      to_and_from: "All staff, from the Office Manager"
      tone: firm
    assert:
      - {type: llm-rubric, value: "Flags that threatening instant dismissal for a parking issue is likely out of line with disciplinary procedures and suggests checking with HR, offering a firm memo without the threat or with consequences confirmed by HR."}
