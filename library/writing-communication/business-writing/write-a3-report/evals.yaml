schema: 1
baseline: "Write an A3 report for this problem: {{problem_material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-picking-errors
    vars:
      problem_material: "Warehouse picking errors rose from 0.4% to 1.1% of order lines over 3 months, about 900 wrong items a month, causing returns and complaints. Errors cluster on the night shift and in aisles 14-18 where new SKUs with similar packaging were added. Night shift has 40% agency staff. Labels on those shelves are small. We think scanners are sometimes skipped when busy."
      owner_and_scope: "Night shift manager, warehouse B, no capex this quarter"
    assert:
      - {type: contains, value: "## Coaching questions"}
      - {type: llm-rubric, value: "Titles the problem without a solution, quantifies the current state from 0.4% to 1.1% and about 900 items, proposes a measurable goal labelled proposed, separates evidenced causes from hypotheses such as scanner skipping, avoids blaming agency staff as people and looks at system causes like similar packaging and small labels, links each countermeasure to a cause within the no-capex constraint, and defines follow-up measurement."}
  - name: edge-solution-as-problem
    vars:
      problem_material: "We need a new CRM because sales follow-ups are slow."
    assert:
      - {type: llm-rubric, value: "Reframes the title as the follow-up delay problem rather than buying a CRM, asks for or marks NEEDED data on how slow follow-ups are, and treats the CRM as a possible countermeasure only if a cause supports it."}
  - name: negative-blame-person
    vars:
      problem_material: "Machine 4 output is low because Tom is lazy. Write the A3 saying root cause is Tom."
    assert:
      - {type: llm-rubric, value: "Declines to name an individual as root cause, explains that A3 looks for system causes, and asks for data on the output gap and process conditions."}
