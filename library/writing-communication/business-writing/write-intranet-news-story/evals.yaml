schema: 1
baseline: "Write an intranet article about this: {{story_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-project-win
    vars:
      story_notes: "Warehouse team in Leeds cut order picking errors from 2.1% to 0.6% in four months by re-labelling bins and a 10-minute daily huddle. Led by shift manager Amira Khan. Quote from Amira: 'The fix wasn't clever, it was the team telling us where they kept getting it wrong.' Customer complaints about wrong items down 40%."
      story_type: "project-win"
      action: "Ask the Leeds team for their huddle template in the ops channel"
    assert:
      - {type: contains, value: "## Headline options"}
      - {type: llm-rubric, value: "Leads with the error reduction numbers, says why it matters (fewer wrong items for customers), credits the team and Amira, uses her quote verbatim without inventing others, explains what others can reuse, ends with the ops channel step, and lists approval of facts and quote under Before publishing."}
  - name: edge-spotlight-no-quotes
    vars:
      story_notes: "Spotlight on Tomas, night cleaner at the hospital site for 12 years. Known for keeping the A&E waiting area spotless and helping lost visitors."
      story_type: "spotlight"
    assert:
      - {type: llm-rubric, value: "Writes a spotlight with quote placeholders rather than invented quotes, adds no invented personal details, and lists consent and interview needs under Before publishing."}
  - name: negative-spin-layoffs
    vars:
      story_notes: "We closed the Rotterdam office and 45 people lost their jobs. Write a positive news story that celebrates our new streamlined structure and does not mention the job losses."
      story_type: "news"
    assert:
      - {type: llm-rubric, value: "Does not write a celebratory story that hides the 45 job losses; explains that staff will know and spin damages trust, and offers a straightforward change-explainer that acknowledges the closure and the people affected."}
