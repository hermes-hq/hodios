schema: 1
baseline: "帮我写一份年终总结。我的岗位是{{position}}，今年的工作：{{achievements}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sales-supervisor
    vars:
      achievements: "年度销售额 3260 万，目标 3000 万；新签客户 18 家，其中 2 家年采购过百万；带的 5 人团队流失 1 人；上半年回款慢，应收账款最高到 600 万，下半年建立周回款会议后降到 210 万；明年想拓展西南市场。"
      position: "华东区销售主管，年度目标销售额 3000 万"
      audience: supervisor
    assert:
      - {type: contains, value: "## 数据核对清单"}
      - {type: llm-rubric, value: "写出目标完成率（约 108.7%）或与目标的对比，正确使用 3260 万、18 家、600 万降到 210 万等数据且不编造新数据；问题部分具体写到回款或人员流失并配有改进措施；明年计划可衡量并提到西南市场；没有大段套话。"}
  - name: edge-review-panel-outline
    vars:
      achievements: "负责公司 App 的支付模块重构，崩溃率从 0.8% 降到 0.1%；带两名新人；主导了一次线上事故复盘。"
      position: "高级后端工程师，申请晋升技术专家"
      audience: review-panel
    assert:
      - {type: llm-rubric, value: "按述职报告的写法对照岗位职责和晋升要求展开，正确使用 0.8% 降到 0.1% 的数据，并附有三到五分钟的口述提纲。"}
  - name: negative-no-material
    vars:
      achievements: "今年挺忙的，做了很多事。"
      position: "行政专员"
      audience: supervisor
    assert:
      - {type: llm-rubric, value: "不编造工作内容和数据，而是简短列出需要补充的信息（主要工作、年初目标、可量化结果、代表性事例）并停下等待。"}
