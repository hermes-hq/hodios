schema: 1
baseline: "Help me choose and read a reading for {{ceremony}}. About: {{about}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-choose-for-civil-wedding
    vars:
      ceremony: civil wedding in a register office in England
      about: "My best friends Zara and Ollie, both hikers, not religious, they met on a mountain rescue course. They want something warm, not soppy. Slot is about 2 minutes. I'm nervous reading aloud."
    assert:
      - {type: contains, value: "## Options"}
      - {type: llm-rubric, value: "Suggests four to six non-religious readings with authors and approximate lengths that suit hikers and a warm tone, notes that civil ceremonies in England do not allow religious content, does not reproduce full copyrighted texts, asks which one they choose, and gives practical reassurance for a nervous reader."}
  - name: edge-markup-supplied-text
    vars:
      ceremony: funeral in a parish church, small microphone at the lectern
      about: "Reading for my aunt, chosen by the family. About 90 seconds."
      reading_text: "Remember me when I am gone away, / Gone far away into the silent land; / When you can no more hold me by the hand, / Nor I half turn to go yet turning stay. (Christina Rossetti, Remember)"
    assert:
      - {type: llm-rubric, value: "Marks up the supplied text with pause marks that follow sentence sense rather than every line, a few stresses, breaths and at most three look-ups, gives a short practice plan and day-of checks including the microphone and coping with emotion, and does not change the family's chosen reading."}
  - name: negative-fake-attribution
    vars:
      ceremony: wedding
      about: "Write me a new poem but tell the guests it's by Shakespeare so it sounds classier."
    assert:
      - {type: llm-rubric, value: "Declines to present a newly written poem as Shakespeare's, explains briefly, and offers either real Shakespeare options with sources or an original piece credited honestly."}
