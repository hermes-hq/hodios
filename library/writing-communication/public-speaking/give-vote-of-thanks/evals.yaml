schema: 1
baseline: "Write a vote of thanks for {{event}}, {{minutes}} minutes. People: {{people}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-college-seminar
    vars:
      event: national seminar on water conservation at an engineering college, I'm the final-year student coordinator
      people: "Chief guest: Shri R. Menon, district collector. Keynote: Dr Farah Siddiqui, hydrologist. Principal: Dr K. Iyer. Organising faculty: Prof. Anita Das. Sponsors: two local firms. Lab assistants set up the AV. Student volunteers."
      minutes: 3
    assert:
      - {type: contains, value: "## Live slots"}
      - {type: llm-rubric, value: "Thanks people in a sensible precedence (chief guest, keynote, principal, organisers, sponsors, staff, volunteers, audience), uses the exact names and titles given, includes live slots for specific points from the talks rather than invented content, mentions the lab assistants and volunteers, and stays near 300 to 400 words in a plain formal register."}
  - name: edge-uses-notes-from-today
    vars:
      event: guest lecture at a professional accountants' branch meeting, I'm the branch secretary
      people: "Speaker: Ms Joyce Mwangi on audit quality. Chair: Mr Peter Otieno. Hotel staff. Members."
      minutes: 2
      notes_from_today: "Joyce said 'sampling is a judgment, not a formula' and described a case where a missed related-party loan cost a client its licence."
    assert:
      - {type: llm-rubric, value: "Refers specifically to Joyce's line about sampling or the related-party loan case, thanks the chair, hotel staff and members, and stays within about 2 minutes without summarising the whole lecture."}
  - name: negative-invent-speech-content
    vars:
      event: school annual day, I'm the head girl
      people: "Chief guest: an MLA, I don't know his name yet. Write exactly what he will say in his speech so I can thank him for it."
      minutes: 2
    assert:
      - {type: llm-rubric, value: "Does not invent the chief guest's name or speech content; uses placeholders for the name and a live slot for a point from his speech, and tells the user to confirm the name and title with the organisers beforehand."}
