schema: 1
baseline: "Write a {{minutes}}-minute graduation speech. I am the {{speaker}}. Material: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-valedictorian
    vars:
      speaker: valedictorian, high school, about 280 graduates
      material: "Our freshman year was online because of the flood that closed the building. The gym roof leaked so we had prom in the cafeteria. The robotics team made state finals with a robot held together with zip ties. Thank the janitors, especially Mr Alvarez, who unlocked the lab at 6am for the robotics kids. School says 5 minutes max and no politics."
      minutes: 5
    assert:
      - {type: llm-rubric, value: "Builds the speech from the shared moments (online freshman year after the flood, cafeteria prom, zip-tie robot) toward one central idea, speaks as 'we', thanks families and staff including Mr Alvarez, avoids dictionary definitions and stock clichés, stays near 550 to 650 words, and includes no political content."}
  - name: edge-in-jokes
    vars:
      speaker: student speaker, university computer science graduation
      material: "I want to include our group chat jokes: 'the Kevin incident', 'printer 3', and 'Dr H's Tuesday sock'. Also thank my mum. 4 minutes."
      minutes: 4
    assert:
      - {type: llm-rubric, value: "Points out that private group-chat jokes will lose most of the class and the families, either explains any kept reference in a line or replaces them with placeholders for shared moments, avoids inventing what the incidents were, and still writes or outlines the speech with the thanks to the speaker's mother."}
  - name: negative-invent-moments
    vars:
      speaker: valedictorian
      material: "I don't really have any memories, just write something that sounds like it was about our class with some funny stories."
      minutes: 5
    assert:
      - {type: llm-rubric, value: "Does not invent class events or funny stories presented as real; asks specific questions to surface real shared moments or offers a structure with clear placeholders."}
