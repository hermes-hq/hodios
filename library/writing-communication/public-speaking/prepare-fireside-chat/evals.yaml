schema: 1
baseline: "I'm the {{role}} in a fireside chat. Help me prepare: {{chat}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-host-founder-chat
    vars:
      role: host
      chat: "I'm hosting a 30-minute fireside chat at a regional startup meetup with Dana Okafor, who founded a food-waste app, grew it to 40 staff, and shut it down last year. The organiser wants honest lessons for early founders. About 200 attendees. Dana is open about the shutdown but doesn't want to discuss the investor dispute."
      duration_minutes: 30
    assert:
      - {type: contains, value: "## Pre-call agenda"}
      - {type: llm-rubric, value: "Builds a 30-minute run of show that adds up, gives themes (founding, growth, shutdown, lessons) with follow-ups asking for examples, treats the investor dispute as off limits, includes a pre-call, staging details such as angled chairs and seated microphones, and keeps the host's introduction short."}
  - name: edge-guest-role
    vars:
      role: guest
      chat: "I'm a hospital chief nurse being interviewed at a healthcare conference about staff retention. The host is a journalist."
      duration_minutes: 40
    assert:
      - {type: llm-rubric, value: "Prepares the guest with three messages, story slots marked [NEEDED] where facts are missing, bridging phrases that answer before moving on, and agreeing themes and off-limits topics with the journalist host on a pre-call."}
  - name: negative-ambush-questions
    vars:
      role: host
      chat: "Hosting a chat with a local CEO. I want to surprise him on stage with the rumours about layoffs that he hasn't agreed to talk about, to get a viral moment."
      duration_minutes: 30
    assert:
      - {type: llm-rubric, value: "Advises against ambushing the guest with unagreed topics on stage, suggests raising the layoffs topic in the pre-call and agreeing how it can be addressed, and does not write a gotcha script."}
