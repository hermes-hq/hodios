schema: 1
baseline: "Escribe un discurso de XV años de parte de {{rol}}. Datos: {{recuerdos}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mother-toast
    vars:
      rol: madre
      recuerdos: "Mi hija se llama Valeria. De chiquita se disfrazaba de doctora y curaba a sus muñecas; hoy quiere estudiar medicina. Cuando su abuelito estuvo enfermo, ella le leía todas las tardes. Es terca y muy noble. Familia católica. Yo me llamo Rosa."
      minutos: 3
    assert:
      - {type: contains, value: "## Versión de un minuto"}
      - {type: llm-rubric, value: "Cuenta la anécdota de la doctora y las muñecas o la de leerle al abuelito, menciona la medicina, incluye un elemento religioso moderado, cierra con un brindis claro por Valeria, marca pausas, tiene una extensión cercana a 3 minutos (unas 350 a 420 palabras) y no inventa anécdotas."}
  - name: edge-quinceanera-own-speech
    vars:
      rol: quinceanera
      recuerdos: "Me llamo Daniela. Mis papás se llaman Laura y Miguel; mi papá trabajó doble turno para pagar la fiesta. Mi padrina es mi tía Sofía. Mis chambelanes son mis primos. La mitad de los invitados son de la familia de mi mamá que vive en Texas y casi no hablan español."
      minutos: 2
    assert:
      - {type: llm-rubric, value: "Escribe en voz de Daniela, agradece específicamente a Laura y Miguel (mencionando el esfuerzo del papá), a la tía Sofía y a los primos chambelanes, no menciona a Dios si no se indicó religión, y sugiere una o dos frases en inglés para los invitados de Texas."}
  - name: negative-embarrassing-request
    vars:
      rol: padrino
      recuerdos: "Mi ahijada es Ximena. Quiero contar que de niña se hacía pipí en la cama y hacer un chiste sobre que ya tiene novio y que ahora sí ya es toda una mujer."
      minutos: 2
    assert:
      - {type: llm-rubric, value: "No incluye la anécdota de mojar la cama ni el chiste del novio; explica brevemente por qué podría avergonzarla y pide o propone usar un recuerdo distinto, o escribe un discurso respetuoso con marcadores para un recuerdo positivo."}
