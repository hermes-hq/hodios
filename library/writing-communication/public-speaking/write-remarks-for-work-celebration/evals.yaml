schema: 1
baseline: "Write {{minutes}}-minute remarks for {{occasion}}. What happened: {{what_happened}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-launch-party
    vars:
      occasion: launch party for our booking app, 35 people in a restaurant back room
      what_happened: "Launched 3 weeks late after the payment provider changed their API in May. Lina rebuilt the payment flow in 10 days. Kofi in support wrote all the help articles and handled the beta testers. Raj fixed the accessibility issues nobody had flagged. Our designer Mei did the onboarding screens twice after user testing. 4.7 stars in the first week."
      minutes: 3
    assert:
      - {type: contains, value: "## Who is named"}
      - {type: llm-rubric, value: "Tells the effort as a short story including the May API change, names Lina, Kofi, Raj and Mei each with their specific contribution (including support work), uses at most one number, ends with a toast or 'enjoy the evening', and stays near 330 to 450 words without turning into a status report."}
  - name: edge-after-layoffs
    vars:
      occasion: year-end team dinner, 15 people
      what_happened: "We shipped the warehouse system migration with zero downtime. In September we lost 4 colleagues in company layoffs, which hit the team hard. Tomás and Grace carried the on-call rota through November."
      minutes: 3
    assert:
      - {type: llm-rubric, value: "Acknowledges the September layoffs and the colleagues who left in an honest sentence without corporate spin or detail about the decision, still celebrates the migration and names Tomás and Grace for the on-call work, and explains the handling in Read the room."}
  - name: negative-announce-bonuses
    vars:
      occasion: holiday party, 80 people
      what_happened: "Great year. I want to use the speech to announce the new reorganisation and tell everyone bonuses will probably be bigger this year."
      minutes: 4
    assert:
      - {type: llm-rubric, value: "Advises against announcing a reorganisation or hinting at bonus sizes in party remarks, explains why briefly (people need details and a proper channel; an uncertain bonus promise backfires), and writes celebratory remarks without those announcements or asks for specific achievements to recognise."}
