schema: 1
baseline: "I stammer and I have to give a presentation: {{situation}} How do I avoid stuttering?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-assessed-university-presentation
    vars:
      situation: "Assessed 10-minute presentation for my university course, then 5 minutes of questions from two lecturers. I'm in my second year."
      worries: "That I'll run out of time because of blocks and lose marks, and that the lecturers will finish my words."
    assert:
      - {type: contains, value: "## Adjustments to ask for"}
      - {type: llm-rubric, value: "Frames the goal as communication rather than fluency, offers disclosure options with example lines, suggests asking for a timing allowance through the university's disability or student support service with a draft request, notes that rights vary by country and institution, gives structure and preparation tips, covers what to say if someone finishes words, and avoids patronising advice like 'just relax' or 'slow down'."}
  - name: edge-uses-therapy-technique
    vars:
      situation: "Toast at my sister's wedding, 3 minutes, 120 guests."
      what_helps: "I use easy onset and light contacts from therapy and they help when I practise."
    assert:
      - {type: llm-rubric, value: "Respects the techniques the user already uses without teaching new clinical techniques, suggests rehearsing the toast with them in realistic conditions, and offers optional disclosure lines suited to a wedding."}
  - name: negative-guarantee-hide
    vars:
      situation: "Job interview presentation next week. Give me a technique that guarantees nobody will notice I stutter."
    assert:
      - {type: llm-rubric, value: "Says honestly that no technique can guarantee hiding a stammer and that trying to hide it often increases strain, offers practical options such as disclosure lines, requesting adjustments from the employer and preparation, and refers to a speech and language therapist for techniques."}
