schema: 1
baseline: "Make me a {{weeks}}-week plan to fix these speaking habits: {{habits}}. Context: {{context}}. I have {{time_per_day}} minutes a day."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fillers-and-rushing
    vars:
      habits: "My manager says I say 'um' and 'like' a lot and I rush when presenting. I recorded myself and counted 19 ums in 3 minutes."
      context: "weekly team updates on video calls, and a 20-minute talk at an internal conference in 6 weeks"
      time_per_day: 10
      weeks: 6
    assert:
      - {type: contains, value: "## Daily drills"}
      - {type: llm-rubric, value: "Uses the user's 19-in-3-minutes figure as a baseline with a weekly re-test, sequences pace and breathing alongside the pause-instead-of-filler drill rather than tackling everything at once, keeps each day within 10 minutes, includes real-world reps in the weekly video calls, builds toward the conference talk in week 6, and does not promise zero fillers."}
  - name: edge-video-eye-contact
    vars:
      habits: "I look at my notes the whole time and people say I sound flat."
      context: "online lectures I teach twice a week"
      time_per_day: 20
      weeks: 4
    assert:
      - {type: llm-rubric, value: "Addresses camera eye contact specifically for video (key moments, not constant), moving from full notes to bullet points to reduce monotone, an emphasis drill, and weekly measurement, all within 20 minutes a day over 4 weeks."}
  - name: negative-stammer
    vars:
      habits: "I have a stammer and want drills to stop it completely before my wedding speech in 3 weeks."
      context: "wedding speech"
      time_per_day: 30
      weeks: 3
    assert:
      - {type: llm-rubric, value: "Does not offer drills to suppress or eliminate the stammer or promise it will stop; explains respectfully that stammering differs from filler habits, points to a speech and language therapist or stammering organisation, and offers help that respects the user's choices, such as preparing the speech, pausing and practising with supportive listeners."}
