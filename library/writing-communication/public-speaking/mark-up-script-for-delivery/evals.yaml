schema: 1
baseline: "How should I deliver this speech? {{script}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-best-man-toast
    vars:
      script: "Good evening everyone. For those who don't know me, I'm Tomás, and I've known Niamh since we were seven. Back then she told me she would never, ever get married. She also told me she would be an astronaut. So, Niamh, one out of two isn't bad. When she met Oluwaseun, something changed. She started being on time. She started answering her phone. She started smiling at her phone. Seun, you have done what twenty years of friendship could not. So please raise your glasses: to Niamh and Seun."
      speaking_style: "warm, funny wedding toast"
      minutes: 2
    assert:
      - {type: llm-rubric, value: "Gives a key, a word count and a time estimate compared with 2 minutes; keeps every word of the script; marks a pause before the astronaut punchline and after it for laughter; bolds a small number of contrast words rather than many; places breath points; flags the names Oluwaseun and Niamh with pronunciation help; marks [lift] or similar for the toast; names hardest passages and gives a short rehearsal plan."}
  - name: edge-script-too-long
    vars:
      script: "Good morning. Three years ago, our city council made a promise: that by 2030, no child would need a car to get to school safely. Today I want to tell you how far we have come, where we have fallen short, and what we need from you. First, the progress. We have built twenty-two kilometres of protected bike lanes. We have lowered the speed limit to thirty kilometres an hour on every street around a primary school. And we have trained more than four thousand children to cycle confidently in traffic. Those numbers matter, but they are not the whole story. Last spring I stood at the gates of Riverside Primary at eight fifteen in the morning. I counted forty-one cars dropping children off in ten minutes. I counted three bikes. Three. Parents told me the same thing again and again: the route is fine until the ring road. Then it is not. That is where we have fallen short. A network is only as safe as its most frightening junction, and we still have eleven junctions that parents will not let their children cross alone. So here is what we are proposing. Over the next eighteen months, we will rebuild every one of those eleven junctions, starting with the ring road at Riverside. We will publish the designs before we build them, and we will ask parents and children to walk them with us. But we cannot do this alone. We need businesses along the ring road to accept slower traffic for a few minutes each morning. We need schools to run walking buses. And we need every one of you, councillors, engineers, parents, to hold us to our promise. Because the measure of success is not kilometres of paint. It is the morning when Riverside counts forty-one bikes and three cars. Thank you."
      speaking_style: "measured, persuasive address to a council meeting"
      minutes: 1
    assert:
      - {type: llm-rubric, value: "Counts roughly 300 words and estimates a little over two minutes plus pauses at a measured pace, says this runs well over the 1-minute limit and by roughly how much, and names passages that could go (for example the list of progress figures) without cutting or rewriting the script; still returns the full script marked up with every original word kept."}
  - name: negative-not-a-spoken-script
    vars:
      script: "Table 4.2 (cont.): FY24 opex by cost centre (EUR k): CC-110 1,204.7; CC-120 883.1; CC-130 2,019.4; see footnote 7 for reclassification of IFRS 16 lease items; cf. Appendix C, rows 14-38."
    assert:
      - {type: llm-rubric, value: "Says the text is a written table or report rather than something to be spoken, and suggests turning it into a spoken script first (for example leading with the takeaway and rounding figures), instead of marking up the table line by line."}
