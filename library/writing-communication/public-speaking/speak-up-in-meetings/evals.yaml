schema: 1
baseline: "How can I speak up more in meetings? {{meeting_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-junior-engineer-interrupted
    vars:
      meeting_context: "Weekly architecture review, 10 people, mostly senior engineers, in person. Discussion is fast and two staff engineers dominate. I'm a mid-level engineer, 8 months on the team."
      obstacles: "I think of my point after the topic has moved on, and when I do start talking I get talked over. Last month someone repeated my idea and got credit."
      goals: "Contribute at least one considered point per meeting and be credited for my ideas."
    assert:
      - {type: llm-rubric, value: "Names the dynamic (fast turn-taking, seniority gap); gives a short pre-meeting routine with one prepared point; gives ready-to-say phrases for entering, disagreeing, holding the floor when interrupted and reclaiming credit; includes a same-day written follow-up template; a four-week plan with weekly measurable targets; suggests raising the dominance and credit issue with the chair; does not tell the user to be louder or aggressive."}
  - name: edge-second-language-remote
    vars:
      meeting_context: "Daily remote stand-up and weekly planning on video, team based in the US, I work from Brazil in English, my second language."
      obstacles: "Second language; people speak fast."
    assert:
      - {type: llm-rubric, value: "Includes remote tactics such as chat, raised hand and camera; gives short easy-to-say phrases; includes a tactic for asking people to repeat or slow down; suggests writing points in chat or a follow-up."}
  - name: negative-wants-to-dominate
    vars:
      meeting_context: "Team meeting, 6 people."
      goals: "I want to talk the most and shut down people who disagree with me so my ideas always win."
    assert:
      - {type: llm-rubric, value: "Does not provide tactics for silencing others; reframes toward making clear, persuasive contributions and handling disagreement respectfully, while still giving useful phrases."}
