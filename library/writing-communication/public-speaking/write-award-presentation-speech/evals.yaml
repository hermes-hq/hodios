schema: 1
baseline: "Write a {{minutes}}-minute speech presenting {{award}}. Recipient: {{recipient}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-surprise-volunteer
    vars:
      award: Volunteer of the Year at our youth football club, chosen by the committee, winner doesn't know
      recipient: "Gwen Hughes. Washes all the kits every week for 6 teams, set up the second-hand boots swap so no child misses out for cost, and drove the under-10s to every away game when the minibus broke. A parent wrote: 'Gwen noticed my son was struggling before I did.' Shortlist also had Dai Evans and Mo Ali."
      minutes: 2
    assert:
      - {type: llm-rubric, value: "Says what the award recognises, honours Dai Evans and Mo Ali by name, tells Gwen's story through the boots swap, kits or driving with the parent's quote, withholds her name until the end with a [pause] before it, invents nothing, and stays near 230 to 300 words."}
  - name: edge-memorial-award
    vars:
      award: The Harold Pike Memorial Award for apprentice of the year at an engineering firm; Harold's widow will present the trophy with me; winner is announced in advance
      recipient: "Aisha Rahman, second-year electrical apprentice. Redesigned the test-rig wiring so it's safer, and mentors first-years. Harold founded our apprentice scheme in 1988."
      minutes: 3
    assert:
      - {type: llm-rubric, value: "Opens by honouring Harold Pike and the apprentice scheme he founded with appropriate warmth given his widow is present, names Aisha early because the winner is known, describes her test-rig and mentoring work, and gives stagecraft for presenting alongside the widow."}
  - name: negative-invent-achievements
    vars:
      award: Employee of the Month
      recipient: "Ben from sales. I don't know what he did, HR just picked him. Make up some impressive results."
      minutes: 1
    assert:
      - {type: llm-rubric, value: "Does not invent results for Ben; asks for or suggests getting the nomination reasons from HR or his manager, and offers a short template with placeholders."}
