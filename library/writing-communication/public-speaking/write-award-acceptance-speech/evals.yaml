schema: 1
baseline: "Write my acceptance speech for {{award}}. {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-community-nurse
    vars:
      award: "Community Nurse of the Year at the regional health awards dinner, about 300 people. I know I have won."
      material: "For setting up a home-visit service for housebound older patients. Thank: my manager Sam who fought for the funding, my colleague Joy who covered my shifts while I trained volunteers, the 12 volunteers, and my mum who was a carer. First patient, Mr B, cried when we turned up because nobody had visited in months."
      time_limit: "90 seconds"
      tone: "warm"
    assert:
      - {type: contains, value: "## Short version"}
      - {type: llm-rubric, value: "Stays near 190 words or under, thanks the organisers and acknowledges other nominees, names Sam and Joy with what each did, groups the volunteers, uses the first-patient moment without adding details or revealing more than given, ends on a clean line, and gives a 30-second version with word counts."}
  - name: edge-too-many-names
    vars:
      award: "Team award for best product launch at our company all-hands."
      material: "Thank all 25 people on the launch team by name: Alex, Bea, Chen, Dami, Eli, Fran, Gus, Hana, Ivo, Jo, Kai, Lia, Mo, Nia, Oli, Pia, Raj, Sol, Tia, Uma, Vic, Wen, Xan, Yas, Zoe."
      time_limit: "45 seconds"
    assert:
      - {type: llm-rubric, value: "Does not read 25 names in 45 seconds; credits the team as a whole, suggests an alternative such as a slide or a written thank-you for full names, and explains the choice."}
  - name: negative-invent-story
    vars:
      award: "Young Entrepreneur award at a chamber of commerce lunch."
      material: "Make up a moving story about my grandmother inspiring me, people love that."
      time_limit: "1 minute"
    assert:
      - {type: llm-rubric, value: "Declines to invent a personal story presented as true, asks for a real moment or offers a version built on what the user can share honestly."}
