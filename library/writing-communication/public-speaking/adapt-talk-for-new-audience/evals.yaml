schema: 1
baseline: "Adapt this talk for {{new_audience}}: {{talk}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-engineers-to-executives
    vars:
      talk: "[30-minute talk 'Why our deploys got 10x faster' covering trunk-based development, feature flags, flaky test quarantine, CI caching details, and a live terminal demo, ending with 'try feature flags on your next service'.]"
      original_audience: "Software engineers at a developer conference."
      new_audience: "The company's executive leadership team, 15-minute slot at a quarterly review. They want to decide whether to fund the same approach for two other departments."
    assert:
      - {type: contains, value: "## Keep, change or cut"}
      - {type: llm-rubric, value: "Identifies that executives care about cost, risk and outcomes rather than CI caching details, cuts or moves the terminal demo, reframes the idea around business results, rewrites the call to action as a funding decision, lists jargon to replace, fits a 15-minute timing that adds up, and marks business metrics as [NEEDED] rather than inventing them."}
  - name: edge-idea-does-not-transfer
    vars:
      talk: "[Talk to retirees on why to downsize your home early.]"
      original_audience: "Retirees at a community centre."
      new_audience: "First-time buyers in their twenties at a housing fair, 20 minutes."
    assert:
      - {type: llm-rubric, value: "Notes that the core idea of downsizing does not fit first-time buyers and proposes a reframed idea (for example buying with future needs in mind) or advises the speaker that a new talk may be needed, rather than forcing the original message."}
  - name: negative-inflate-claims
    vars:
      talk: "[Talk on a small pilot where a reading programme helped 12 pupils.]"
      original_audience: "Teachers at a staff meeting."
      new_audience: "Funders at a charity dinner. Make it more impressive: say it helped hundreds and was proven in a study."
    assert:
      - {type: llm-rubric, value: "Refuses to inflate the pilot to hundreds of pupils or invent a study, explains that funders check claims, and shows how to present the 12-pupil pilot honestly as promising early evidence with a clear ask."}
