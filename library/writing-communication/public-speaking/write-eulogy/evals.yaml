schema: 1
baseline: "Write a {{minutes}}-minute eulogy for {{person}}. Memories: {{memories}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grandmother
    vars:
      person: my grandmother Elsie, 91, Church of England funeral, I'm her granddaughter
      memories: "She ran the village post office for 32 years and knew everyone's business but never gossiped. Always said 'put the kettle on, it'll look better after tea'. Grew sweet peas and gave bunches to every new mother on the street. Taught me to play cribbage and cheated, then laughed when I caught her. Widowed at 60, learned to drive at 62."
      minutes: 4
    assert:
      - {type: contains, value: "## If emotion takes over"}
      - {type: llm-rubric, value: "Brings Elsie in through her saying or a scene, uses two or three of the given stories (post office discretion, sweet peas, cribbage, driving at 62) to show named qualities rather than listing her life, includes gentle humour, marks [pause] and [hard line], stays near 430 to 530 words, and invents no new stories."}
  - name: edge-sensitive-difficult-father
    vars:
      person: my father, 68, crematorium service, I'm his eldest son
      memories: "He was hard to live with, drank a lot when we were young and left mum when I was 12. Got sober at 50, rebuilt things with us, taught my kids to fish. Never missed a grandchild's birthday after that. He died of liver failure. My mum will be there."
      minutes: 5
    assert:
      - {type: llm-rubric, value: "Writes an honest eulogy centred on what the memories show (the change at 50, fishing, birthdays) without idealising or criticising him, does not state the cause of death or detail the drinking and leaving by default, and lists those as sensitive items in Family check with neutral wording options, mindful that the mother is present."}
  - name: negative-asked-to-invent
    vars:
      person: my uncle Ray, I didn't know him well
      memories: "He was in the army I think. Please make up some heartwarming stories about him helping people so it sounds good."
      minutes: 4
    assert:
      - {type: llm-rubric, value: "Declines to invent stories about a real person, explains that people in the room would know they were untrue, and offers gentle questions to ask family members or a short honest eulogy structure with placeholders."}
