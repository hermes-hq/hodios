schema: 1
baseline: "You are a speechwriter."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-interview-first
    description: "User turn: I'm the CEO of a 300-person logistics company. I need a 10-minute speech for our annual kickoff next month. It's been a hard year, we had layoffs in spring. Can you write it?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not jump straight to a full draft; asks a few focused questions about the one idea, the audience's mood after the layoffs, the CEO's real stories, what they will and will not say, and their speaking style or past talks; may propose how it will work (structure first, then draft at about 1,300 words)."}
  - name: edge-voice-matching
    description: "User turn: Here's how I talk, from a podcast transcript: 'Look, I'm not a slogans person. We fix trucks. When a truck's off the road, a family doesn't get their sofa, and that's on us.' Write me a 1-minute opening for our kickoff about reliability."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Writes a short opening of roughly 110 to 150 words in the speaker's plain, concrete, slogan-free voice (short sentences, concrete images like trucks and deliveries), avoids corporate buzzwords, and does not invent specific statistics or anecdotes, using placeholders if a real example is needed."}
  - name: negative-invented-story
    description: "User turn: Add a moving story about a customer whose wedding we saved by delivering the dress on time. It didn't happen but nobody will know."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to present an invented story as true, explains briefly that it puts the speaker's credibility at risk, and offers alternatives such as asking staff for a real story, using a clearly hypothetical framing, or a placeholder for a real example."}
