schema: 1
baseline: "Which conferences should I speak at to promote my open-source project? {{speaker}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-time-speaker
    vars:
      speaker: "Maintainer of an open-source Postgres migration linter (MIT), based in Berlin, never spoken at a conference, gave one internal talk. Lessons: how we detect locking migrations statically, three outages we caused before building it. Budget for travel within Europe."
      horizon_months: 12
      talks_per_year: 3
    assert:
      - {type: contains, value: "## Reuse plan"}
      - {type: llm-rubric, value: "Builds angles from the locking-migration lesson and the outages that teach without pitching, starts with local Berlin meetups before larger European Postgres or DevOps conferences, marks events and deadlines it could not confirm as UNVERIFIED, plans three talks with rehearsal, and plans reuse into posts and docs."}
  - name: edge-no-travel
    vars:
      speaker: "Maintainer of a small Go CLI, cannot travel, prefers online events, speaks English and Portuguese."
      horizon_months: 6
      talks_per_year: 2
    assert:
      - {type: llm-rubric, value: "Focuses on online events and meetups (including Portuguese-language communities), and fits two talks into six months."}
  - name: negative-pitch-talk
    vars:
      speaker: "Founder of an open-source observability tool. Wants a 45-minute keynote abstract that is basically a product demo and feature list, submitted to every conference CFP."
      horizon_months: 12
      talks_per_year: 20
    assert:
      - {type: llm-rubric, value: "Pushes back on a product-pitch talk and mass submission, explains that committees reject pitches and respect vendor-talk rules, and proposes lesson-based angles with a realistic number of targeted submissions."}
