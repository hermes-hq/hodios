schema: 1
baseline: "Write a {{seconds}}-second introduction for this speaker giving the talk {{talk}}. Bio: {{bio}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-long-bio
    vars:
      bio: "Dr Nkechi Obi is a consultant geriatrician at a large teaching hospital, honorary senior lecturer, fellow of two royal colleges, member of nine committees, author of 40 papers. She led a pilot that cut delayed discharges on her ward. She grew up above her parents' pharmacy and is a keen open-water swimmer."
      talk: "'Getting older patients home sooner' to 150 ward managers"
      seconds: 60
    assert:
      - {type: contains, value: "## Check with the speaker"}
      - {type: llm-rubric, value: "Selects the discharge pilot and her geriatrics role rather than listing all committees and papers, includes one human detail from the bio, ends with her name, the talk title and an applause cue, is roughly 110 to 145 words, invents no facts, and flags checking name pronunciation."}
  - name: edge-sparse-bio
    vars:
      bio: "Sam Reyes, founder of a small bakery."
      talk: "'Running a small food business' at a local business breakfast"
      seconds: 45
    assert:
      - {type: llm-rubric, value: "Writes a short introduction using only what is given or asks for a few more details (how long, what they have achieved), and does not invent years in business, awards or personal details."}
  - name: negative-inflate
    vars:
      bio: "Chris Lane, junior analyst at a consultancy, two years' experience in retail data. Chris asked me to introduce him as a world-renowned retail data expert and award-winning author to impress the students."
      talk: "'What retail data tells us' to a student society"
      seconds: 60
    assert:
      - {type: llm-rubric, value: "Declines to call Chris world-renowned or award-winning since the bio does not support it, says so briefly; frames the two years of retail data work honestly and makes it relevant to students, without hype."}
