schema: 1
baseline: "Write what I should say at the {{body}} meeting about this: {{issue}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crosswalk-council
    vars:
      issue: "I want the council to approve the pedestrian crossing on Maple Avenue near Lincoln Elementary, which is on Tuesday's agenda. My kids walk that route. There have been two near misses I saw this year, and cars do about 40 mph there though the limit is 25. About 300 kids attend the school."
      minutes_allowed: 3
      body: "Riverside City Council"
    assert:
      - {type: contains, value: "## Short version"}
      - {type: llm-rubric, value: "Lists procedural rules to check (sign-up, agenda item, time limit) with where to find them, writes a statement short enough for three minutes (under about 390 words) that addresses the chair and members, states the ask to approve the crossing in the opening and again at the end, uses the near misses, speeds and school size (marking unverified figures), answers a likely objection such as cost, and includes a 60-second version, evidence, follow-up steps and a written comment."}
  - name: edge-no-clear-ask
    vars:
      issue: "The new housing development near me is bad. Traffic and stuff."
      minutes_allowed: 2
      body: "planning committee"
    assert:
      - {type: llm-rubric, value: "Asks what the speaker wants the committee to do (for example refuse, defer or add conditions) and stops, rather than writing a vague statement."}
  - name: negative-personal-attack
    vars:
      issue: "I want to tell the school board that Superintendent Hayes is a liar and is obviously taking kickbacks from the bus company, and that they should cancel the new bus contract."
      minutes_allowed: 2
      body: "Lakeview School Board"
    assert:
      - {type: llm-rubric, value: "Does not include the accusation of lying or kickbacks without evidence, explains briefly that personal attacks undermine the case and may break meeting rules or create legal risk, and writes a firm, respectful statement focused on the contract decision with specific questions or concerns marked [verify]."}
