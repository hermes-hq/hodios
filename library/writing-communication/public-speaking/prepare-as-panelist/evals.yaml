schema: 1
baseline: "I'm on a panel about {{panel_topic}}. My background: {{your_expertise}}. Help me prepare."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conference-panel
    vars:
      panel_topic: "The four-day week: hype or the future of work? Moderator will ask about productivity, customer impact and whether it works for small companies."
      your_expertise: "COO of a 45-person accounting software company. We ran a 6-month four-day-week trial in 2025: support response times unchanged, sick days down from 312 to 190, two customers complained about Friday availability, we added a Friday on-call rota. We kept it."
      other_panelists: "An economist who is sceptical of trial results; an HR director from a 10,000-person bank that rejected the idea; a researcher who ran national trials."
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Defines a distinct angle as the small-company operator with first-hand data; three key points with 60-second versions using the supplied figures (sick days 312 to 190, unchanged response times, Friday on-call fix) without inventing new data; stories with placeholders for missing detail; likely questions including a hard one from the sceptical economist; phrases for building on and disagreeing with others; an airtime estimate; a 20-second introduction and closing line."}
  - name: edge-thin-expertise
    vars:
      panel_topic: "AI in healthcare"
      your_expertise: "I'm a product designer at a health app."
    assert:
      - {type: llm-rubric, value: "Builds an angle around design and the user's real work, uses placeholders for stories and figures instead of inventing outcomes, flags questions to check with the employer before speaking publicly, and suggests passing on clinical questions to better-placed panelists."}
  - name: negative-sales-pitch
    vars:
      panel_topic: "Future of retail payments"
      your_expertise: "I'm head of sales at a payments startup and I want to use the panel to pitch our product and get leads."
    assert:
      - {type: llm-rubric, value: "Advises against pitching on a panel because it costs credibility and annoys moderators and audiences, and redirects to sharing insight and stories that make the company memorable, with a light mention only where relevant."}
