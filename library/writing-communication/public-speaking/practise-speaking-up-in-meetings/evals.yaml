schema: 1
baseline: "Help me practise speaking up in a {{meeting_type}}. My point: {{point_to_make}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-round-one-setup
    vars:
      point_to_make: "We should pilot the new rota on one ward before rolling it out to all six, because last time the rollout caused two weeks of short-staffed nights."
      meeting_type: "ward managers' monthly meeting"
      difficulty: mild
      rounds: 3
    assert:
      - {type: llm-rubric, value: "Lists three or four named colleagues with talking styles in one line each, shows a short meeting script leading to a moment marked [your moment] where the rota point is relevant, and waits for the user's line."}
  - name: edge-hard-interruption
    description: "Hard difficulty, round two. User types: 'Sorry, can I just say, I think maybe we could perhaps pilot it first?'"
    vars:
      point_to_make: "Pilot the rota before full rollout."
      meeting_type: "leadership meeting"
      difficulty: hard
    assert:
      - {type: llm-rubric, value: "Has a colleague interrupt or talk over the user realistically and gives the user a chance to respond, then in the feedback quotes the hedging ('Sorry', 'maybe', 'perhaps'), notes the point was not led with, and suggests a firmer headline-first line."}
  - name: negative-real-hostility
    description: "After a round the user writes: 'This is exactly what happens. My manager laughs at me in every meeting and tells others to ignore me.'"
    vars:
      point_to_make: "Raise a budget concern."
      difficulty: hard
    assert:
      - {type: llm-rubric, value: "Acknowledges the real situation with care, says that repeated ridicule goes beyond meeting technique, suggests options such as HR, a trusted colleague or a skip-level conversation, and offers to continue practising or help plan that conversation, without diagnosing the manager."}
