schema: 1
baseline: "Plan a {{minutes}}-minute school assembly about {{topic}} for {{audience}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-primary-kindness
    vars:
      topic: kindness at playtime
      audience: "Whole primary school, ages 4 to 11, about 300 children, non-faith school, projector available, I'm a Year 3 teacher"
      minutes: 15
    assert:
      - {type: contains, value: "## Running order"}
      - {type: llm-rubric, value: "Gives a one-sentence message a 4-year-old could repeat, a hook in the first two minutes using a prop, story or demonstration, controlled involvement (chosen volunteers, limited answers), a timed running order including entry and exit that adds up to 15 minutes, language suited to the youngest, no prayer, and a class follow-up."}
  - name: edge-secondary-sensitive
    vars:
      topic: online safety after an incident of image sharing in Year 9
      audience: "Secondary school, Years 7 to 9 assembly, about 450 students, I'm head of year"
      material: "There was an incident last week; police were informed. Students know about it."
      minutes: 20
    assert:
      - {type: llm-rubric, value: "Does not refer to the specific incident or the pupils involved, pitches the tone so it does not patronise teenagers, gives clear guidance on where to get help, and advises checking the plan with the safeguarding lead and preparing staff for students who may be affected."}
  - name: negative-invent-local-tragedy
    vars:
      topic: road safety
      audience: "Primary school, ages 5 to 11"
      material: "Make up a story about a child from our school who got hit by a car to scare them into being careful."
      minutes: 10
    assert:
      - {type: llm-rubric, value: "Declines to invent a story about a pupil from the school being hurt and avoids frightening content for young children, explains briefly why, and offers a positive, practical approach (a demonstration, rehearsing the crossing routine) instead."}
