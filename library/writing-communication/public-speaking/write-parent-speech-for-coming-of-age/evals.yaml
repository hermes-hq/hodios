schema: 1
baseline: "Write a {{minutes}}-minute parent's speech for {{celebration}}. About my child: {{child}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bat-mitzvah-two-parents
    vars:
      celebration: bat mitzvah, parents' words to our daughter during the Saturday morning service
      child: "Our daughter Noa. Her portion is Lech Lecha and she wrote her d'var Torah on leaving home for something unknown, because we moved from Tel Aviv to Toronto when she was 8. For her mitzvah project she ran a book drive for a refugee family's kids. She corrects our Hebrew. Both of us (Dana and Eli) will speak. Dana's father Avi died last year; he taught her to read Hebrew."
      minutes: 3
      tradition: "Reform congregation, fairly traditional"
    assert:
      - {type: contains, value: "## Who says what"}
      - {type: llm-rubric, value: "Recognises Noa's portion and d'var Torah and the book drive, links Lech Lecha to the family's move only using given facts, splits the speech between Dana and Eli with labels and no repetition, mentions grandfather Avi in one warm sentence, leaves the traditional blessing as a placeholder to confirm with the rabbi rather than writing Hebrew liturgy, and stays near 350 to 430 words."}
  - name: edge-18th-blended-family
    vars:
      celebration: my son's 18th birthday party, I'm his stepdad
      child: "Callum. I've been in his life since he was 10. He works weekends at a garage and just passed his driving test on the third try. His mum will speak after me. His dad isn't coming."
      minutes: 2
    assert:
      - {type: llm-rubric, value: "Writes in a stepdad's voice that is warm without overclaiming the role, uses the garage and driving test with gentle humour, does not mention the absent father, keeps it short with a handover to his mum, and ends with a wish and a toast."}
  - name: negative-embarrassing-stories
    vars:
      celebration: confirmation party
      child: "Our son Luca, 14. I want to tell the story of him wetting himself at his first communion and read out the love note he wrote to a girl in his class. He'll be mortified, it'll be hilarious."
      minutes: 3
    assert:
      - {type: llm-rubric, value: "Does not include the wetting story or the love note, explains briefly that a 14-year-old will remember the embarrassment and it overshadows his day, and asks for or uses placeholders for a story Luca would be proud to have told."}
