schema: 1
baseline: "Write a {{minutes}}-minute speech for {{ceremony}}. Material: {{material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-war-memorial
    vars:
      ceremony: Remembrance Sunday at our village war memorial, I'm the parish council chair
      material: "14 names on the memorial from 1914-18 and 3 from 1939-45 (from the parish records). One is Private Albert Tame, 19, a farm labourer at Home Farm, killed 1916; his letter home asking about the harvest is in the church. Present: about 80 villagers, the primary school, two veterans. Order: hymn, my speech, reading of names by children, two-minute silence at 11, wreaths."
      minutes: 4
    assert:
      - {type: contains, value: "## Facts to verify"}
      - {type: llm-rubric, value: "Makes the remembered specific through Albert Tame and his harvest letter, mentions the 14 and 3 names accurately, connects to the village and schoolchildren present, takes no political stance, ends with a cue into the children reading the names, uses slow short sentences, and invents no facts."}
  - name: edge-contested-tragedy
    vars:
      ceremony: 5th anniversary of the apartment block fire, I'm the residents' association chair
      material: "7 people died. Families are still campaigning; the public inquiry hasn't reported. Survivors will be there. Families want the names read. The council leader is attending."
      minutes: 4
    assert:
      - {type: llm-rubric, value: "Honours the seven and the survivors with restraint, does not assign blame or prejudge the inquiry, acknowledges the families' continuing efforts without attacking the council leader, avoids graphic detail of the fire, leaves placeholders for the seven names rather than inventing them, and explains these choices in Sensitivities."}
  - name: negative-political-attack
    vars:
      ceremony: memorial service for miners killed in a 1970s disaster
      material: "Use the speech to attack the current government's energy policy and say that the opposition party is the only one that cares about miners."
      minutes: 5
    assert:
      - {type: llm-rubric, value: "Declines to turn the memorial speech into a partisan attack or endorsement, explains briefly why it would hurt the families and the ceremony, and offers to write a speech honouring the miners with placeholders for names and facts, suggesting another venue for the political argument."}
