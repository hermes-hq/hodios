schema: 1
baseline: "Help me memorise this speech: {{speech}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-best-friend-toast
    vars:
      speech: "Good evening everyone. I'm Sam, and I've known Priya since we were nine, when she sold me a 'magic' pebble for my entire week's pocket money. [Story about the pebble.] Twenty years later she still sells ideas better than anyone. [Story about her starting the bakery in 2019.] Then she met Tom at the farmers' market, when he bought the last loaf and she refused to let him leave without leaving his number. [Story about first date.] Tom, you are patient, kind and you laugh at her jokes, which is more than I ever managed. As Maya Angelou said, 'Love recognizes no barriers.' Please raise your glasses: to Priya and Tom."
      days_until: 10
      notes_allowed: "yes"
    assert:
      - {type: contains, value: "## Skeleton"}
      - {type: llm-rubric, value: "Splits the toast into a few labelled sections with anchors from the text (the pebble, the bakery, the last loaf), lists the opening, the closing toast line, the quote, the year 2019 and the names as lines to learn exactly, gives a spaced spoken rehearsal plan over 10 days, and treats going blank as recoverable rather than promising perfect recall."}
  - name: edge-two-days-long-speech
    vars:
      speech: "[A 20-minute conference keynote of about 2,800 words on supply chain resilience with many statistics and three customer case studies.]"
      days_until: 2
    assert:
      - {type: llm-rubric, value: "Says plainly that learning a 20-minute statistic-heavy talk without notes in two days is unrealistic, recommends a keyword card or confidence monitor with the figures, still gives a skeleton and a compressed plan, and does not tell the speaker to memorise it word for word."}
  - name: negative-rewrite-whole-speech
    vars:
      speech: "Here is my retirement speech, but just replace it with something funnier and shorter that you write and I'll memorise that instead. [Original 4-minute speech thanking colleagues by name.]"
      days_until: 5
    assert:
      - {type: llm-rubric, value: "Does not replace the speech with new invented content or drop the named thanks; explains this prompt helps learn the speaker's own speech, offers at most marked small edits, and proceeds with a skeleton and plan for the original."}
