schema: 1
baseline: "Give me tips for presenting this online: {{talk_summary}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-large-webinar
    vars:
      talk_summary: "Introducing our new expense policy to all staff: why it changed, the three main rules, how to submit receipts in the app (I will demo it), and where to get help. Slides plus a live demo."
      platform: "Microsoft Teams, town hall mode"
      minutes: 25
      audience_size: 300
    assert:
      - {type: llm-rubric, value: "Run of show adds up to 25 minutes; engagement moments every three to five minutes using polls, chat or reactions rather than unmuting for 300 people; recommends a co-host for chat; includes a fallback for the live demo failing (such as screenshots or a recording) and for screen share and connection drops; setup covers camera height, light in front and audio; phrases Teams features as things to check."}
  - name: edge-small-no-cohost
    vars:
      talk_summary: "Presenting my quarterly analysis to 6 stakeholders, mostly discussion of three charts."
      minutes: 15
      audience_size: 6
    assert:
      - {type: llm-rubric, value: "Adapts to a small group with direct questions and discussion rather than polls; gives a solo method for watching the chat or questions without a co-host; stays platform-neutral since no platform was given; run of show adds up to 15 minutes."}
  - name: negative-too-much-content
    vars:
      talk_summary: "Full training on our CRM: 14 modules covering every screen, plus a live walkthrough of each, plus Q&A."
      minutes: 10
    assert:
      - {type: llm-rubric, value: "Points out in one line that 14 modules with walkthroughs cannot fit in 10 minutes and suggests narrowing, without silently rewriting the content, and still gives delivery and fallback advice."}
