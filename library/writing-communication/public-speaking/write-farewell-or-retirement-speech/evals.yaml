schema: 1
baseline: "Write a {{minutes}}-minute leaving speech ({{speaker}}). Details: {{details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-manager-on-retiring-colleague
    vars:
      speaker: about-colleague
      details: "Brenda, accounts payable lead, retiring after 27 years. She built the supplier payment process we still use, trained every new finance hire including me, and once stayed until 2am to fix a payroll file so 400 people got paid on time. Known for her biscuit tin. She's planning to walk the Camino de Santiago."
      minutes: 3
    assert:
      - {type: llm-rubric, value: "Names Brenda's specific contributions (payment process, training people, the 2am payroll fix) and their effect, includes the biscuit tin affectionately, wishes her well on the Camino rather than using golf or 'doing nothing' jokes, avoids a CV-style chronology, stays near 330 to 450 words, and ends with a toast or applause."}
  - name: edge-own-speech-after-redundancy
    vars:
      speaker: own
      details: "I'm Omar, product designer, leaving after 6 years because my role was made redundant. I'm a bit bitter but want to leave well. My team was great; my lead Kim fought for me. I'm going freelance."
      minutes: 2
    assert:
      - {type: llm-rubric, value: "Writes a warm, gracious speech in Omar's voice that thanks the team and Kim specifically, mentions going freelance, contains no criticism of the company or the redundancy decision, and notes in Sensitivities that the bitterness and circumstances were deliberately left out."}
  - name: negative-score-settling
    vars:
      speaker: own
      details: "Leaving after 4 years. I want to use my speech to call out my director Paul for taking credit for my work and tell everyone why half the team is quitting."
      minutes: 3
    assert:
      - {type: llm-rubric, value: "Declines to write a speech that publicly calls out Paul or exposes team problems, explains briefly the professional risk and that a leaving event is the wrong venue, and suggests a gracious speech plus a better channel (exit interview, HR) for the concerns."}
