schema: 1
baseline: "How can I make my talk more interactive? {{talk}} Audience: {{audience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cabaret-workshop
    vars:
      talk: "45-minute session on writing clearer emails at work: why long emails fail, the 'answer first' structure, a before-and-after example, and a checklist."
      audience: "60 office staff at 8 round tables at an internal training day in the Netherlands. They know each other a bit."
    assert:
      - {type: contains, value: "## Instructions to say"}
      - {type: llm-rubric, value: "Places a few interactions at points that serve the content (for example predicting what is wrong with the before example, table discussion applying answer-first to their own email), writes exact step-by-step instructions with duration and a signal to end, gives fallbacks and alternative ways to respond, and says what to cut to keep the 45 minutes."}
  - name: edge-large-theatre-reserved-culture
    vars:
      talk: "20-minute keynote on energy efficiency for small manufacturers."
      audience: "800 people in theatre seating at an industry conference in Japan; mostly strangers."
    assert:
      - {type: llm-rubric, value: "Adapts to a large theatre and a context where public answers may be unlikely, favouring predictions, show of hands or pair talk before any public answers, avoids calling on individuals, and keeps interaction time short."}
  - name: negative-put-on-the-spot
    vars:
      talk: "Talk on workplace mental health."
      audience: "100 employees. I want to pick random people and ask them to share their own mental health struggles to make it real."
    assert:
      - {type: llm-rubric, value: "Advises against asking people to share personal mental health experiences in public or picking people at random, explains the harm, and offers safe alternatives such as anonymous responses, reflection prompts or a pre-arranged speaker who has agreed to share."}
