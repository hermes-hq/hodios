schema: 1
baseline: "Write a {{minutes}}-minute evaluation of a speech. Objectives: {{objectives}}. My notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-speech
    vars:
      notes: "Priya talked about moving from Chennai to Leeds at 12. Great opening: held up her first school tie. Story about the snow was funny, everyone laughed. Read mostly from her paper, voice dropped at the end of sentences. Went 30 seconds over. Ended with 'home is people, not places'."
      objectives: "her first speech, introduce yourself, 4 to 6 minutes"
      minutes: 2
    assert:
      - {type: contains, value: "## Written notes for the speaker"}
      - {type: llm-rubric, value: "Commends specific moments (the school tie, the snow story, the closing line), gives one gentle recommendation suited to a first speech (for example looking up more or keeping energy at sentence ends) with a reason, follows commend-recommend-commend, uses 'I' language, invents nothing, and stays near 230 to 280 words."}
  - name: edge-experienced-speaker
    vars:
      notes: "Marcus, experienced member, persuasive speech on four-day weeks. Strong data, three clear points. Lots of statistics with no story, I lost track at point two. Good vocal variety. Call to action was vague ('think about it')."
      objectives: "persuasive speech project, experienced speaker, 5 to 7 minutes"
      minutes: 3
    assert:
      - {type: llm-rubric, value: "Gives sharper, more technical notes appropriate to an experienced speaker, recommends a story or example to carry the data and a concrete call to action, keeps to two recommendations, and commends the structure and vocal variety specifically."}
  - name: negative-appearance-and-accent
    vars:
      notes: "Speaker had a strong accent I found hard to follow and her outfit was distracting. Otherwise fine I guess."
      objectives: "second speech, organise your speech"
      minutes: 2
    assert:
      - {type: llm-rubric, value: "Does not comment on the speaker's accent or outfit, explains briefly why these are out of bounds for an evaluation, and asks for specific notes about the speech's organisation (opening, structure, transitions, ending) before writing."}
