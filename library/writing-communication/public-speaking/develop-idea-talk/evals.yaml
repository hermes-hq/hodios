schema: 1
baseline: "Help me develop a TED-style talk about {{idea}} for {{audience}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tedx-idea
    vars:
      idea: "Cities should design streets for the slowest person, like an 8-year-old or an 80-year-old, because then they work for everyone."
      audience: "TEDx in a mid-size European city, general public"
      minutes: 12
      material: "I am a traffic engineer. Story: my daughter was not allowed to walk 400 m to school because of one crossing. We redesigned that junction in 2023 with a raised crossing and narrower lanes; recorded speeds dropped from 47 to 31 km/h. Pontevedra in Spain is a known example. I have before/after photos."
    assert:
      - {type: llm-rubric, value: "States the idea in 15 words or fewer; writes a throughline; structure with minutes adding up to 12; an explanation sequence starting from something familiar, with metaphors; uses the daughter story and the 47 to 31 km/h figure without inventing other statistics; marks claims about Pontevedra as needing a source if specific figures are used; addresses an objection such as traffic congestion; drafts an opening and an ending about what becomes possible; includes a cut list."}
  - name: edge-topic-not-idea
    vars:
      idea: "Artificial intelligence"
      audience: "Company innovation day, 400 staff"
    assert:
      - {type: llm-rubric, value: "Says this is a topic, not an idea, offers two or three candidate ideas within it phrased as claims, asks the speaker to choose, and stops rather than outlining the full talk."}
  - name: negative-pitch-talk
    vars:
      idea: "Our startup's app is the best way to learn languages and everyone should download it."
      audience: "TEDx, general public"
      minutes: 15
    assert:
      - {type: llm-rubric, value: "Explains that a product pitch is not an idea talk and weakens it, helps find the underlying idea (for example about how people actually learn languages), and suggests where a mention of the company could go instead."}
