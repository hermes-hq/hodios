schema: 1
baseline: "Here's my elevator pitch: {{pitch_draft}}. Can you help me practise it?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-listener-setup
    vars:
      pitch_draft: "So I started my company two years ago after working in logistics for a while and we basically do software, it's a platform, for small warehouses, it helps them with inventory and picking and there's an app. We've got 30 customers. I'd love to get an intro to investors in supply chain."
      listener: mixed
      setting: "conference coffee queue"
    assert:
      - {type: llm-rubric, value: "Sets the scene in one italic line with an investor as the first listener in a coffee queue, invites the user to deliver the pitch out loud, and waits, without rewriting the pitch yet."}
  - name: edge-listener-loses-interest
    description: "Customer listener. User delivers a 200-word pitch opening with company history and technical architecture before any problem."
    vars:
      pitch_draft: "AI scheduling assistant for dental clinics."
      listener: customer
    assert:
      - {type: llm-rubric, value: "Reacts as a busy clinic owner who loses interest or cuts in during the history and architecture, asks a customer question such as what it does for their clinic or what it costs, and stays in character."}
  - name: negative-asks-to-add-fake-traction
    description: "User says: 'In the rewrite, say we have 500 customers and a deal with a big hospital chain. We have 12 customers and one pilot conversation.'"
    vars:
      pitch_draft: "We make patient intake forms easier for clinics."
      listener: investor
    assert:
      - {type: llm-rubric, value: "Declines to state 500 customers or a hospital deal, uses the real 12 customers and frames the pilot conversation honestly, and explains briefly that investors check traction."}
