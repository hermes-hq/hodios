schema: 1
baseline: "Help me moderate a panel on {{topic}} with {{panelists}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-panellists
    vars:
      duration_minutes: 45
      topic: "Return to office: what actually works for hybrid teams. Regional business conference, audience of 200 HR and operations leaders. Organiser wants practical takeaways."
      panelists: |
        - Mei Lin, VP People at a 2,000-person bank; mandated 3 office days a week last year.
        - Tomás Ruiz, founder of a fully remote 80-person software company; has no office.
        - Grace Achieng, workplace researcher at a university; studies hybrid collaboration. Known for long, detailed answers.
    assert:
      - {type: contains, value: "## Run of show"}
      - {type: llm-rubric, value: "Builds a 45-minute run of show with about 15 minutes for audience Q&A, short moderator-delivered introductions, questions directed at named panellists, at least one question that surfaces the tension between the bank's office mandate and the fully remote company without putting words in their mouths, polite tactics to keep Grace's answers short, backup audience questions, and a prep email to panellists."}
  - name: edge-short-session
    vars:
      duration_minutes: 20
      topic: "Getting your first job in game development, for university students."
      panelists: "- Sam, junior programmer at an indie studio, 1 year in.\n- Priya, art director at a mid-size studio, hires artists."
    assert:
      - {type: llm-rubric, value: "Fits a 20-minute slot with proportionally short segments (brief intros, a compact question flow, a few minutes of Q&A), keeps questions single and targeted to Sam or Priya, and does not invent the studios' names or the panellists' views."}
  - name: negative-thin-input
    vars:
      topic: "Innovation"
      panelists: "Three people from tech companies"
    assert:
      - {type: llm-rubric, value: "Asks short questions about the panel's angle, audience and each panellist's name, role and perspective instead of producing a generic panel plan with invented panellists."}
