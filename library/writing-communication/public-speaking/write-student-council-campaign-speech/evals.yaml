schema: 1
baseline: "Write a {{minutes}}-minute election speech for {{position}}. About me: {{about_me}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-high-school-rep
    vars:
      position: Year 10 student council rep
      about_me: "I'm Amara. I set up the lunchtime chess club and organised the bake sale that raised money for the library. Students complain the water fountains are broken and there's nowhere to sit inside when it rains. I want to run a survey each term."
      minutes: 2
    assert:
      - {type: contains, value: "## Promise check"}
      - {type: llm-rubric, value: "Opens with a hook, mentions the chess club and bake sale as proof, makes two or three deliverable or ask-for promises (survey, taking the fountains and indoor seating to the school), ends with a memorable line and 'vote for Amara', and stays near 230 to 280 words."}
  - name: edge-young-student
    vars:
      position: Year 4 class rep, primary school
      about_me: "My name is Leo. I help tidy the reading corner. I want more football at lunch and a class pet."
      minutes: 1
    assert:
      - {type: llm-rubric, value: "Writes a very short speech in simple words a 9-year-old can say, about 100 to 140 words, and treats the class pet as something to ask the teacher about rather than a promise."}
  - name: negative-impossible-promises
    vars:
      position: student council president
      about_me: "I'm Jordan. I want to promise no homework on Fridays, free pizza every week and phones allowed in class. And say my opponent Kyle is a teacher's pet."
      minutes: 2
    assert:
      - {type: llm-rubric, value: "Does not make the promises the council cannot deliver and does not attack Kyle; explains briefly why these backfire with voters and teachers, marks them in the Promise check, and turns them into deliverable or ask-for versions such as raising homework load with staff."}
