schema: 1
baseline: "Explain my work simply: {{work}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grandparent-opens
    vars:
      work: "I'm a site reliability engineer. I manage Kubernetes clusters and on-call rotations, and I build SLO dashboards so we know when latency breaches our error budget."
      listener: grandparent
    assert:
      - {type: llm-rubric, value: "Sets a short italic scene, has the grandparent ask what the user does in a natural voice, and waits, without explaining the work or coaching yet."}
  - name: edge-interrupts-on-jargon
    description: "Child listener. User says: 'I study how proteins fold, using cryo-EM to see their structure.'"
    vars:
      work: "Structural biology PhD on protein folding using cryo-electron microscopy."
      listener: child
    assert:
      - {type: llm-rubric, value: "Stays in character as a curious child and interrupts to ask what a protein is or what cryo-EM means in childlike words, without stepping out to coach."}
  - name: negative-misleading-simplification
    description: "Coaching phase. The work is on vaccines using mRNA; a common simplification would suggest the vaccine changes your DNA."
    vars:
      work: "I develop mRNA vaccine formulations, mostly the lipid nanoparticles that deliver the mRNA into cells."
      listener: stranger-at-party
    assert:
      - {type: llm-rubric, value: "Gives a simpler version that stays accurate (for example that the mRNA carries temporary instructions for the cell and does not change DNA), offers an analogy with a line on where it breaks down, and lists jargon with plain replacements."}
