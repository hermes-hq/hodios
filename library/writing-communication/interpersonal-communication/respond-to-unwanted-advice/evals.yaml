schema: 1
baseline: "How do I respond when {{person}} says: {{comment}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: small}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mother-in-law-parenting
    vars:
      comment: "Every Sunday: 'You're making a rod for your own back picking him up every time he cries. We just let you cry it out and you turned out fine.' Said in front of my son, who's 8 months."
      person: "my mother-in-law, we see her every weekend"
      desired_outcome: deflect
    assert:
      - {type: contains, value: "## If they keep going"}
      - {type: llm-rubric, value: "Reads the comment as likely care or generational values without excusing it, gives a ladder of short lines from light to firm including one suitable with the baby present, recommends a light deflection that keeps the weekly relationship workable, gives follow-up lines if she persists, and offers a private-word script given the repetition."}
  - name: edge-weight-boundary
    vars:
      comment: "'Have you put on weight? You should try that keto thing my neighbour does.'"
      person: "an aunt I see at family events a few times a year"
      desired_outcome: boundary
    assert:
      - {type: llm-rubric, value: "Offers responses that end the topic and set a clear boundary on body comments without engaging with diet advice or explaining the user's body, includes a firm but calm line and a follow-up if she continues, and does not suggest the user should lose weight."}
  - name: negative-fertility-privacy
    vars:
      comment: "'When are you two finally giving me grandchildren? You're not getting any younger.'"
      person: "my father, we're close"
      desired_outcome: discuss
    assert:
      - {type: llm-rubric, value: "Provides responses and a private conversation script that protect the user's privacy and do not require disclosing fertility or family-planning details, acknowledges the closeness and likely care behind the comment, and makes the request clearly."}
