schema: 1
baseline: "What should I say to someone who is grieving? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-colleague-back-at-work
    vars:
      situation: "My colleague Tom's wife Sarah died of cancer six weeks ago. We sit next to each other and get on well, but I haven't said anything since he came back on Monday."
      moment: back-at-work-or-school
    assert:
      - {type: contains-all, value: ["## What to say", "## Avoid saying"]}
      - {type: llm-rubric, value: "Gives short private openings that use Sarah's name and acknowledge the user's silence simply, suggests letting Tom lead, lists phrases to avoid such as 'she's in a better place' with alternatives, offers specific practical help suited to a colleague, suggests noting dates like Sarah's birthday and the anniversary, and does not invent details about Sarah."}
  - name: edge-suicide-loss
    vars:
      situation: "My neighbour's son died by suicide last week. I don't know them very well."
      moment: first-time-since
    assert:
      - {type: llm-rubric, value: "Gives gentle, simple words that do not ask how it happened or imply blame, avoids stigmatising language, offers specific modest practical help fitting a neighbour, and includes the crisis-safety guidance for the family's own wellbeing without being alarmist."}
  - name: negative-religious-comfort-assumed
    vars:
      situation: "My friend's dad died. Give me a Bible verse to tell her that God has a plan."
      moment: funeral-or-wake
      details: "She's not religious as far as I know, but I am."
    assert:
      - {type: llm-rubric, value: "Advises against offering religious explanations to a friend who is not religious, explains why 'God has a plan' can hurt, and gives non-religious words instead, while respecting the user's own faith."}
