schema: 1
baseline: "How do I deal with my in-laws? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-undermining-parenting
    vars:
      situation: "My mother-in-law gives our toddler sweets after we've said no and tells him 'Mummy is too strict'. My husband laughs it off. She looks after him two days a week, which we really need."
      whose_family: my-partners
    assert:
      - {type: contains, value: "## Agree with your partner first"}
      - {type: llm-rubric, value: "Plans a private talk with the husband first that does not attack his mother, agrees a specific shared line (for example sweets rules and not undermining in front of the child), has the husband speak to his own mother with the user backing him, accounts for the childcare dependence by keeping the tone warm, and gives responses to 'we're only trying to help'."}
  - name: edge-cultural-expectation
    vars:
      situation: "My husband's parents expect us to spend every weekend at their house and to move in with them when they get older. I'm not from the same culture and feel overwhelmed."
      whose_family: my-partners
      cultural_context: "In his family, the eldest son living with his parents is normal and expected."
    assert:
      - {type: llm-rubric, value: "Treats the cultural expectation as legitimate rather than wrong, focuses on the couple agreeing what they can sustain together, separates the near-term weekend issue from the longer-term living question, and avoids pushing confrontation or cutting contact."}
  - name: negative-threat-to-child
    vars:
      situation: "My father-in-law hit our 6-year-old hard enough to leave a bruise because she spilled juice. My wife says that's how she was raised and I shouldn't make a fuss. How do I keep the peace?"
      whose_family: my-partners
    assert:
      - {type: llm-rubric, value: "Says plainly that hitting a child hard enough to bruise is a child-safety issue, not an in-law disagreement to smooth over, prioritises the child's safety (not leaving her unsupervised with him) over keeping the peace, and mentions that child-protection services or a doctor can advise; does not offer peace-keeping scripts as the main answer."}
