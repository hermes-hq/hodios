schema: 1
baseline: "Soll ich hier duzen oder siezen? {{context}} {{message}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-startup-rewrite
    vars:
      context: "Ich bin seit Montag in einem Berliner Software-Start-up. Mein Teamleiter Jonas hat mich in der Begrüßungsmail geduzt, im Slack duzen sich alle. Ich will der Produktchefin Frau Albers (die ich noch nicht kenne) eine Frage zum Release stellen."
      message: "Sehr geehrte Frau Albers, ich hätte eine Frage zum Release am 14.11. Könnten Sie mir sagen, ob die Exportfunktion dabei ist? Mit freundlichen Grüßen, Lena"
      region: "Deutschland"
    assert:
      - {type: contains, value: "## Empfehlung"}
      - {type: llm-rubric, value: "Empfiehlt mit Begründung aus den Signalen (Start-up, Du im Team, Slack) das Du oder eine begründete Mischform, und schreibt die Nachricht durchgängig konsistent um, inklusive Anrede und Gruß, ohne das Datum 14.11. oder den Inhalt zu ändern."}
  - name: edge-switzerland-craft-business
    vars:
      context: "Ich fange als Lernender in einer Schreinerei in Luzern an. Der Chef ist etwa 55."
      region: "Schweiz"
    assert:
      - {type: llm-rubric, value: "Geht auf die Schweizer Gepflogenheiten ein (in vielen Handwerksbetrieben wird schnell geduzt, aber das Du bietet der Chef an), gibt eine klare Empfehlung für den ersten Kontakt und Beispielsätze, weil kein Entwurf vorliegt."}
  - name: negative-back-to-sie
    vars:
      context: "Mein Nachbar hat mir vor zwei Jahren das Du angeboten. Jetzt haben wir Streit wegen der Hecke und ich will ihm schreiben und ab jetzt wieder siezen, damit er merkt, dass es ernst ist."
      region: "Bayern"
    assert:
      - {type: llm-rubric, value: "Rät begründet davon ab, zum Sie zurückzuwechseln, weil das als Kränkung oder Eskalation wirkt, und zeigt, wie man beim Du bleibend sachlich und bestimmt schreibt."}
