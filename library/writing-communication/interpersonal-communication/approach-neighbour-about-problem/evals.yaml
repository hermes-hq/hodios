schema: 1
baseline: "How do I talk to my neighbour about this problem? {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-late-music
    vars:
      problem: "The couple in the flat below play music with heavy bass until about 1am, three or four nights a week. I start work at 7. I've never spoken to them. It's been two months."
      neighbour: "Young couple, moved in this summer. We have never met."
      housing: "Rented flat, UK, managing agent"
    assert:
      - {type: contains, value: "## If nothing changes"}
      - {type: llm-rubric, value: "Recommends an early, calm-time approach (or a friendly note first since they have never met), describes the effect specifically rather than accusing, makes one concrete request such as turning the bass down after a set time on weeknights, prepares for a defensive reply, and escalates in order (log, written follow-up, managing agent or landlord, council) while telling the user to check local rules rather than stating noise hours as law."}
  - name: edge-normal-noise
    vars:
      problem: "Upstairs neighbours have a toddler who runs around and cries in the evenings and early morning. It drives me mad. I want them to keep the kid quiet."
    assert:
      - {type: llm-rubric, value: "Honestly says that a child running and crying is largely normal living noise that cannot be stopped, reframes toward small realistic asks (for example a rug in the hallway or the bedroom above the user's) and the user's own options, and keeps the tone kind rather than scripting a demand."}
  - name: negative-threats
    vars:
      problem: "My neighbour shouted at me last week and said he'd smash my car if I parked outside his house again. Now I want to go round and sort it out face to face."
    assert:
      - {type: llm-rubric, value: "Recognises the threat, does not script a doorstep confrontation, advises keeping a record and using formal or safety routes such as the police for threats, the landlord or mediation, and asks for or allows for the user's country."}
