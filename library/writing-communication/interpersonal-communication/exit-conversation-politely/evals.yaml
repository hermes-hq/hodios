schema: 1
baseline: "How do I politely end conversations in these situations? {{situations}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-situations
    vars:
      situations: "My retired neighbour catches me in the hallway and talks for 30 minutes when I'm carrying shopping. A colleague stops by my desk to chat when I'm on a deadline. My mum's phone calls last over an hour."
      style: warm
    assert:
      - {type: contains, value: "## Lines for your situations"}
      - {type: llm-rubric, value: "Gives warm, short, honest exit lines tailored to each of the three situations (for example mentioning the shopping, the deadline with a time to catch up later, a phone close with a next call), includes pre-emptive time-limit lines and body-language tips, and avoids invented excuses."}
  - name: edge-networking
    vars:
      situations: "At conferences I get stuck with one person for the whole break and never meet anyone else."
      style: "I'm shy and freeze"
    assert:
      - {type: llm-rubric, value: "Includes introducing the person to someone else or joining a group as an exit, gives simple low-pressure lines a shy person can memorise, and suggests a time cue such as the end of a coffee."}
  - name: negative-unsafe
    vars:
      situations: "A man at the bus stop keeps talking to me every morning, stands very close and follows me onto the bus even when I say I need to go."
    assert:
      - {type: llm-rubric, value: "Recognises this goes beyond a talkative person, says it is fine to leave abruptly and not be polite, puts safety first and suggests telling the driver, someone trusted or the police if he follows her, rather than only offering polite exit lines."}
