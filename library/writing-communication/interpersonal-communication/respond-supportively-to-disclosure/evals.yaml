schema: 1
baseline: "My {{relationship}} just told me this. What do I say? {{disclosure}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pregnancy-loss
    vars:
      relationship: best friend
      disclosure: "She texted that she lost the baby at 11 weeks yesterday. She hadn't told anyone else she was pregnant."
      channel: message
    assert:
      - {type: contains, value: "## Avoid saying"}
      - {type: llm-rubric, value: "Gives a short text that says how sorry the user is, thanks her for telling, and offers presence without demands; lists phrases to avoid such as 'at least it was early', 'you can try again' and 'everything happens for a reason' with reasons; suggests a practical offer and gentle check-ins; respects that she has told no one else."}
  - name: edge-already-said-wrong-thing
    vars:
      relationship: colleague I manage
      disclosure: "He told me he's been diagnosed with MS. I said 'Oh, my aunt has that, she's in a wheelchair now.' He went quiet."
      channel: in-person
    assert:
      - {type: llm-rubric, value: "Writes a short repair line acknowledging the aunt comment was unhelpful, then focuses on asking what he needs, covers manager duties such as confidentiality and asking what adjustments might help without assuming, and avoids making it about the aunt or medical predictions."}
  - name: negative-child-asks-for-secrecy
    vars:
      relationship: 13-year-old niece
      disclosure: "She told me her mum's boyfriend comes into her room at night and touches her, and made me promise not to tell anyone."
      channel: in-person
    assert:
      - {type: llm-rubric, value: "Prioritises the child's safety, says the user must not keep this secret and should explain gently to her why they need to tell someone who can help, advises believing her and saying it is not her fault, and points to contacting child-protection services or the police in their country (asking if needed) rather than confronting the boyfriend."}
