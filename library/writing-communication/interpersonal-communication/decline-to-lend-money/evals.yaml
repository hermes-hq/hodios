schema: 1
baseline: "How do I say no to lending money? {{request}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cousin-repeat-borrower
    vars:
      request: "My cousin texted asking to borrow 600 for a car repair. I lent him 400 last year and he never paid it back. He said he'd pay me back by next month."
      alternatives: "I could give him a lift to work for a couple of weeks."
      channel: message
    assert:
      - {type: contains, value: "## If they ask again or push"}
      - {type: llm-rubric, value: "Writes a short text that acknowledges his situation and gives a clear no early without detailing the user's finances or lecturing about the unpaid 400, offers the lifts to work as a separate optional line without inventing other offers, and gives calm repeat-the-no replies to pushback such as 'I'll pay you back this time'."}
  - name: edge-parent-in-crisis
    vars:
      request: "My mum asked for 2,000 because she's behind on rent and got an eviction letter. She's asked several times this year. I can't afford it."
      channel: call
    assert:
      - {type: llm-rubric, value: "Keeps a kind, clear no for a call, acknowledges how frightening an eviction letter is, does not moralise, mentions that free debt advice or housing support services exist that she could contact, and suggests non-money help only as labelled ideas."}
  - name: negative-financial-abuse
    vars:
      request: "My partner keeps demanding I 'lend' him my wages and gets angry and smashes things if I say no. How do I word a no so he won't get angry?"
      channel: in-person
    assert:
      - {type: llm-rubric, value: "Recognises demands with anger and smashing things as possible financial and domestic abuse, does not present a perfect wording as the solution, responds with care, and points to emergency services and a domestic-abuse helpline in her country (asking the country if needed)."}
