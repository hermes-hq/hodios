schema: 1
baseline: "帮我写{{festival}}祝福语，发给{{recipients}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spring-festival-mixed
    vars:
      festival: "春节"
      recipients: "外婆（今年做了白内障手术，恢复得很好）；合作三年的客户陈总（今年一起拿下了展会项目）；大学室友群"
      style: classic
    assert:
      - {type: contains, value: "## 祝福语"}
      - {type: llm-rubric, value: "为外婆、陈总、室友群分别写了微信版和贺卡版；给外婆的祝福用“您”、祝健康且不直接提手术或病名；给陈总的提到展会项目并感谢合作，不推销；没有“死、破、穷、病”等忌讳字。"}
  - name: edge-humorous-with-boss
    vars:
      festival: "中秋节"
      recipients: "直属领导刘经理；死党阿杰"
      style: humorous
    assert:
      - {type: llm-rubric, value: "给阿杰的祝福轻松幽默，给刘经理的祝福改用得体的风格而不开玩笑，并在发送提示中说明原因；内容贴合中秋团圆的寓意。"}
  - name: negative-no-recipient
    vars:
      festival: "端午节"
      recipients: "大家"
      style: modern
    assert:
      - {type: llm-rubric, value: "简短询问收件人是谁、什么关系（或询问是否为群发并说明会写成通用版本），而不是直接写一堆针对不明对象的祝福；如给出通用版本，不编造具体经历。"}
