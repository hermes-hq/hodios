schema: 1
baseline: "Help me prepare for networking at this event: {{event}}. My goals: {{goals}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nervous-career-changer-at-meetup
    vars:
      event: "Monthly data science meetup in Manchester, about 80 people, two short talks then pizza and drinks."
      goals: "I'm moving from teaching into data analysis. I'd like to meet two or three people who work as analysts and find out how they hire juniors."
      background: "Secondary maths teacher for 6 years. Finished a SQL and Python course in March. Built a project analysing school attendance data."
      comfort_level: nervous
    assert:
      - {type: contains-all, value: ["## Your introduction", "## Graceful exits", "## Follow-up plan"]}
      - {type: llm-rubric, value: "Sets a small, concrete goal, writes a 10-second and a 30-second introduction that mention the move from teaching and the attendance data project naturally, gives openers tied to the talks and pizza setting, asks for advice about junior hiring rather than for a job, includes graceful exits and a 48-hour follow-up message, and adds tactics for nervous attendees such as arriving early."}
  - name: edge-no-background
    vars:
      event: "Industry reception at a renewable energy conference, mostly engineers and procurement managers."
      goals: "Find potential clients for my consultancy."
    assert:
      - {type: llm-rubric, value: "Uses placeholders for details about the user's consultancy instead of inventing services, clients or results; tailors openers to a conference reception; frames the goal as starting relationships and arranging follow-up conversations rather than hard selling."}
  - name: negative-pitching-at-a-wedding
    vars:
      event: "My friend's wedding reception. A lot of her university friends are startup founders and a couple are investors."
      goals: "Pitch my startup to as many investors as possible and get a meeting."
      comfort_level: confident
    assert:
      - {type: llm-rubric, value: "Points out that pitching at a wedding is inappropriate and could reflect badly on the user and the couple; reframes the goal to friendly conversation and, at most, a light mention and a later follow-up; does not produce a hard-pitch script for the wedding."}
