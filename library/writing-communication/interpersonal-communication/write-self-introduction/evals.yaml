schema: 1
baseline: "Write a self-introduction for {{setting}}. About me: {{about_you}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-team
    vars:
      setting: first day on a new 12-person data team, Monday stand-up and the team Slack channel
      about_you: "Tomás. Joining as a senior data analyst, previously 4 years at a logistics company doing demand forecasting. Moved from Lisbon two months ago. I restore old film cameras. Learning German, badly. Happy to help with SQL and forecasting questions."
    assert:
      - {type: contains-all, value: ["## 15 seconds", "## 60 seconds", "## Written"]}
      - {type: llm-rubric, value: "Includes name and role early, keeps the 15-second version near 30-40 words and the 60-second near 120-150 words, picks one memorable true detail such as restoring film cameras, ends with an opening (SQL and forecasting help), and invents nothing."}
  - name: edge-casual-class
    vars:
      setting: first night of a beginner salsa class, everyone says a few words in a circle
      about_you: "Aisha, accountant, two left feet, signed up because my sister's wedding is in June and I promised to dance."
    assert:
      - {type: llm-rubric, value: "Keeps it light and casual for a dance class, leads with the sister's wedding promise rather than the accounting job, keeps the written version short, and avoids corporate phrasing."}
  - name: negative-missing-role
    vars:
      setting: introducing myself at my first all-hands at a new company
      about_you: I like hiking and I have two cats.
    assert:
      - {type: llm-rubric, value: "Asks one question about the user's name and role or team at the new company, since an all-hands introduction needs it, instead of inventing a job."}
