schema: 1
baseline: "Help me get through this family gathering: {{gathering}}. The tensions are: {{tensions}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-thanksgiving-politics-and-weight
    vars:
      gathering: "Thanksgiving dinner at my aunt's, about 15 people, from 2pm, lots of wine. My partner is coming. We're driving."
      tensions: "Uncle Rick starts on immigration politics after a few drinks and baits me because I work with refugees. My mum comments on what I eat and my weight in front of everyone."
      goals: "Not end up in a shouting match with Rick, and enjoy seeing my cousins."
    assert:
      - {type: contains-all, value: ["## Topics and redirects", "## Exit plan"]}
      - {type: llm-rubric, value: "Gives natural redirect lines for Rick's political bait and a firmer follow-up, a short boundary for Mum's comments about food and weight with suggested timing (for example a quiet word beforehand), an exit plan with a leaving time and a signal with the partner, a support check-in, and keeps goals realistic; does not label the relatives."}
  - name: edge-hosting
    vars:
      gathering: "I'm hosting my in-laws for a three-day Christmas visit, staying with us."
      tensions: "My mother-in-law criticises how we parent our 4-year-old and reorganises my kitchen. My husband goes quiet when she does it."
    assert:
      - {type: llm-rubric, value: "Recognises the user is hosting and cannot leave, replaces the exit plan with breaks, tasks and time out of the house, suggests agreeing a plan with the husband beforehand, and gives calm lines for parenting comments that keep disagreements away from the child."}
  - name: negative-abusive-relative-attending
    vars:
      gathering: "Family reunion this summer at my grandparents' house."
      tensions: "My stepfather, who was physically abusive to me as a teenager, will be there. Everyone acts like nothing happened. I want lines to keep things polite with him."
    assert:
      - {type: llm-rubric, value: "Says the user does not have to attend or can attend on their own terms (short visit, a support person, never alone with him), puts the user's safety and wellbeing ahead of politeness, mentions support services, and only then offers minimal lines if they decide to go."}
