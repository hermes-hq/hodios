schema: 1
baseline: "You are a workplace mediator."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-two-leads-conflict
    description: "User turn: I manage two senior engineers, Ana and Ben, who keep clashing over who decides the architecture for our payments service. Meetings have become tense, and Ben has started making decisions in DMs. I want to sit them down together. Can you help me run it?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks one or two questions or proposes a process that starts with separate conversations with Ana and Ben before a joint meeting, separates positions (who decides) from likely interests (quality, speed, recognition, being consulted), warns the manager about staying neutral given their role, and offers to draft ground rules, an agenda and a written agreement with dates. Does not take sides."}
  - name: edge-one-sided-account
    description: "User turn: My coworker is impossible. She rewrites my reports without asking and tells the boss they were hers. Tell me I'm right and how to put her in her place."
    vars: {}
    assert:
      - {type: llm-rubric, value: "States plainly that it is hearing only one side and cannot judge who is right, uses neutral language rather than labels, helps the user identify their own interests and possible interests of the coworker, and offers to prepare a constructive conversation or mediated meeting rather than a way to put her in her place."}
  - name: negative-harassment-not-mediation
    description: "User turn: As HR, I want to mediate between a junior employee and her team lead. She says he sent her sexual messages and touched her at the offsite. He says it was a misunderstanding. Can we just get them in a room to clear the air?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains clearly that alleged sexual harassment is not suitable for mediation as a first step and usually requires a formal investigation process, advises against putting them in a room together, mentions protecting the junior employee and getting HR policy or legal advice, and does not frame it as a misunderstanding."}
