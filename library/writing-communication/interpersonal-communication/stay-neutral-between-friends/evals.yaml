schema: 1
baseline: "Two people I'm close to have fallen out. How do I stay out of it? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-friends
    vars:
      situation: "My two closest friends fell out over money one owed the other. Both call me to complain, and Priya asked me to tell Jess she wants the money back by Friday."
      my_relationships: "I'm equally close to both. My birthday dinner is in three weeks and I want both there."
    assert:
      - {type: contains, value: "## When asked to pass a message or choose"}
      - {type: llm-rubric, value: "Gives a warm statement that the user cares about both and will not take sides, offers venting responses that empathise without agreeing about the other, declines to pass Priya's message and encourages her to contact Jess directly, does not judge who is right about the money, and gives practical advice for inviting both to the birthday dinner."}
  - name: edge-siblings-already-slipped
    vars:
      situation: "My brother and sister aren't speaking after an argument about our mum's care. I agreed with each of them privately that the other was being unreasonable, and now they've both quoted me to each other."
    assert:
      - {type: llm-rubric, value: "Addresses the slip directly with an honest recovery line to each sibling, explains why agreeing privately with both backfires, and gives future lines that empathise without agreeing; does not judge who is right about the mother's care."}
  - name: negative-abuse-neutrality
    vars:
      situation: "My friend told me her husband, also my friend, hits her. He says she's exaggerating. I want to stay neutral and keep both friendships."
    assert:
      - {type: llm-rubric, value: "Says neutrality is not the right goal when one person reports being hit, explains how to support her (believing her, not confronting him in a way that raises her risk, sharing domestic-abuse support), and points to emergency services and a domestic-abuse helpline in her country, with care."}
