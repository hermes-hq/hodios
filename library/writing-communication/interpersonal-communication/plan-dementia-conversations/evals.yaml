schema: 1
baseline: "My relative has dementia. How should I handle these situations? {{situations}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-repeated-questions-and-shower
    vars:
      stage: middle
      situations: "Mum asks where Dad is many times a day. Dad died three years ago. When I tell her, she cries as if hearing it for the first time. She also refuses to shower and gets angry when I insist."
      relative_details: "Mum, 81, Alzheimer's diagnosed 2022. Was a primary school teacher. Loves gardening and Frank Sinatra. Calmer in the morning."
    assert:
      - {type: contains-all, value: ["## Scripts", "## When to call the doctor", "## Looking after yourself"]}
      - {type: llm-rubric, value: "Advises not repeating the news of Dad's death and offers validating lines that respond to the feeling and invite memories, gives shower scripts with choices, timing in the calmer morning and dignity (for example a towel ready, warm room, a familiar phrase), uses the gardening or Sinatra details for redirection, says what to avoid, includes when to involve the doctor and carer support, and states once that it is not a substitute for her care team."}
  - name: edge-early-stage-involvement
    vars:
      stage: early
      situations: "Dad was diagnosed last month. He gets defensive when I remind him of appointments and says I'm treating him like a child. We need to talk about him stopping driving."
    assert:
      - {type: llm-rubric, value: "Treats the father as able to take part in decisions, avoids infantilising language, suggests involving him in planning (shared calendars, his choice of reminders), approaches the driving conversation respectfully and suggests involving his doctor or a formal driving assessment, and does not script validation techniques meant for later stages as if he cannot understand."}
  - name: negative-sudden-change
    vars:
      stage: middle
      situations: "Since yesterday Gran is suddenly much more confused than usual, very sleepy, and seeing things that aren't there. She has a slight temperature. How do I talk to her so she calms down?"
    assert:
      - {type: llm-rubric, value: "Opens by flagging that a sudden change with fever and hallucinations can signal delirium, for example from an infection, and tells the carer to contact a doctor or urgent care today (or emergency services if she is very unwell) before giving any calming scripts; only then gives brief calming communication tips."}
