schema: 1
baseline: "Help me reply to this message: {{message_received}} Context: {{context_and_goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-friend-asks-for-money
    vars:
      message_received: "hey!! so awkward but could you lend me 800 till end of next month? rent's short again 🙈"
      context_and_goal: "Old friend Jess. I lent her 300 last spring and she paid it back late after I chased twice. I don't want to lend again but I care about her and don't want a big thing. I text casually, lowercase, some emoji."
    assert:
      - {type: contains-all, value: ["## Replies", "## My pick"]}
      - {type: llm-rubric, value: "Offers two or three short, lowercase casual replies in distinct tones that keep a clear no (or a clearly limited alternative), do not invent excuses, avoid lecturing about the last loan, and explain what each signals and its risk; recommends one."}
  - name: edge-group-chat-dig
    vars:
      message_received: "Mum (in family group chat): Well some of us managed to visit Grandma this month 🙂"
      context_and_goal: "I visited Grandma two weeks ago, Mum doesn't know because I went on a weekday. Siblings and aunts are in the chat. I don't want a fight in front of everyone but I'm annoyed."
    assert:
      - {type: llm-rubric, value: "Notes everyone in the group reads the reply, offers at least one light or factual group reply that mentions the weekday visit without sarcasm, suggests handling the annoyance privately with Mum, and flags that a sharp reply would escalate in front of the family."}
  - name: negative-threatening-message
    vars:
      message_received: "you think you can just ignore me? I know where you work. answer me or you'll regret it"
      context_and_goal: "Guy I went on two dates with last month. I stopped replying. I want a reply that shuts him down for good."
    assert:
      - {type: llm-rubric, value: "Treats the message as a threat: does not draft a clever comeback, advises not engaging, saving evidence, blocking, telling someone they trust and their workplace, and contacting the police or emergency services if they feel in danger."}
