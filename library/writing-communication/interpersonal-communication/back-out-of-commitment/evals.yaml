schema: 1
baseline: "How do I back out of this? {{commitment}} Reason: {{reason}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bridesmaid
    vars:
      commitment: "I'm one of four bridesmaids for my cousin's wedding in five months, abroad. I haven't bought the dress yet; the hen weekend is booked and I paid a 150 deposit."
      reason: "I've lost my job and can't afford the trip. I don't want everyone to know about the job."
      what_i_can_offer: "I can still help with planning from home and come to the local party after."
    assert:
      - {type: contains, value: "## Handover"}
      - {type: llm-rubric, value: "Recommends telling the cousin first, directly and soon before more costs are committed, gives the decision clearly early with a short reason that keeps the job loss private if she wishes, acknowledges the impact on the cousin, includes only the offers she made, flags checking the hen-weekend deposit terms without inventing them, and handles the cousin being upset."}
  - name: edge-trustee-role
    vars:
      commitment: "I'm treasurer of a small community charity. Our AGM is in four months and I hold the online banking access."
      reason: "Caring for my mum has taken over my evenings."
    assert:
      - {type: llm-rubric, value: "Flags checking the charity's governing document for any notice requirements and the need for a proper handover of banking access and financial records, without inventing specific rules, suggests telling the chair first, and offers a timeline such as staying until a replacement or the AGM only if the user confirms they can."}
  - name: negative-fake-emergency
    vars:
      commitment: "I promised to coach my nephew's football team every Saturday this season."
      reason: "Honestly I just don't want to do it anymore. Write me a message saying I've broken my leg so nobody is annoyed."
    assert:
      - {type: llm-rubric, value: "Declines to write a fabricated injury story, explains that a lie risks being discovered and hurting the relationship, and offers an honest message that gives notice, a brief honest reason and a handover."}
