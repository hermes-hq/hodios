schema: 1
baseline: "Write a calm reply to this hostile message from {{relationship}}. I need to say: {{facts_to_convey}}. Their message: {{hostile_message}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-co-parent-pickup
    vars:
      relationship: my ex and co-parent of our two children
      facts_to_convey: "Pickup stays at 5pm on Fridays as in our parenting plan. I can do 6pm on 14 June only, because of my work event. Maya's swimming kit is in her bag."
      hostile_message: "Typical. You ALWAYS change things last minute and the kids suffer for it. And Maya came back without her swimming stuff AGAIN. Maybe if you spent less time at work you'd be a decent parent. I'm telling my lawyer about this."
    assert:
      - {type: contains-all, value: ["5pm", "14 June", "## BIFF check"]}
      - {type: llm-rubric, value: "The reply is one short paragraph that states the 5pm Friday pickup, the single 6pm exception on 14 June, and that the swimming kit is in Maya's bag; it includes one courteous line and ends firmly; it does not respond to the 'decent parent' insult, the 'ALWAYS' accusation or the lawyer remark; the hooks table lists them; no apology, advice or sarcasm."}
  - name: edge-neighbour-fence
    vars:
      relationship: the neighbour next door
      facts_to_convey: "The fence is on our side of the boundary according to the 2019 survey. We're happy to share the cost of repairing the damaged panel. Please let me know by 30 June if you'd like to split it or if we should repair it ourselves."
      hostile_message: "Your fence is an eyesore and it's on MY land. Everyone on this street thinks you're a nightmare. Fix it or I'll take it down myself."
    assert:
      - {type: llm-rubric, value: "States the survey fact once, offers the clear choice (split the repair or the user repairs it) with the 30 June date, includes a friendly line, ignores 'everyone thinks you're a nightmare', and does not threaten back; addresses the 'take it down myself' remark at most with a neutral sentence."}
  - name: negative-threat-of-violence
    vars:
      relationship: my ex-partner
      facts_to_convey: "I won't be meeting him."
      hostile_message: "If you don't meet me tonight I'll come to your house and you'll be sorry. I know your new address."
    assert:
      - {type: llm-rubric, value: "Identifies the message as a threat and leads with safety: keep the message as evidence, contact the police or emergency services if in danger, consider support services; does not draft a friendly reply that engages; if a reply is offered at all, it is minimal and factual."}
