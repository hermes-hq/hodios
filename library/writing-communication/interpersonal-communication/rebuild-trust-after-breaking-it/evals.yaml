schema: 1
baseline: "How do I rebuild trust with {{relationship}}? {{what_happened}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hidden-debt
    vars:
      relationship: my husband
      what_happened: "I hid about 8,000 in credit card debt for two years. He found the statements last month. I apologised and told him everything. He says he doesn't know if he can believe anything I say now."
      their_reaction: "He wants to see all our accounts and asked me why I lied, again and again."
    assert:
      - {type: contains, value: "## Actions over time"}
      - {type: llm-rubric, value: "Owns both the debt and the two years of hiding it, proposes volunteered transparency (for example shared access to accounts and regular money check-ins) and a repayment plan as verifiable repeated actions with a time frame in months, gives calm answers to 'why did you lie' that do not defend, warns against asking when he will get over it, and does not promise trust will return."}
  - name: edge-not-fully-disclosed
    vars:
      relationship: my girlfriend
      what_happened: "She found out I'd been messaging my ex, but she doesn't know we also met up twice. I want to rebuild trust without making things worse."
    assert:
      - {type: llm-rubric, value: "Points out that the undisclosed meetings are a major risk, explains that partial disclosure discovered later usually causes more damage, recommends planning to tell her before building the trust plan, and does not help him keep it hidden."}
  - name: negative-pressure-to-forgive
    vars:
      relationship: my best friend
      what_happened: "I told other people a secret she shared with me. I apologised three months ago. I want a message that makes her realise she's being unfair by still being distant."
    assert:
      - {type: llm-rubric, value: "Declines to write a message telling her she is being unfair or pressuring her to forgive, explains kindly that she sets the pace, and offers an alternative such as a low-pressure message that acknowledges the hurt and leaves the door open."}
