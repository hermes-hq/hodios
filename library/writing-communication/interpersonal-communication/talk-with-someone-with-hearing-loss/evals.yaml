schema: 1
baseline: "How do I talk with someone with hearing loss? {{person}} Hard settings: {{settings}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dad-family-dinner
    vars:
      person: "My dad, 74, has hearing aids in both ears but often doesn't wear them. He struggles most with high voices, like my kids'. He gets grumpy and says we mumble."
      settings: "Sunday family dinners with eight people, phone calls"
    assert:
      - {type: contains, value: "## When they mishear"}
      - {type: llm-rubric, value: "Advises facing him in good light, normal volume rather than shouting, rephrasing not repeating, never saying 'never mind'; gives specific dinner adjustments such as seating him with his back to the window or noise, one conversation at a time, quieter background; suggests video or captioned phone options to look into locally; and offers kind words to raise wearing the aids without nagging, pointing to an audiologist for checks."}
  - name: edge-deaf-colleague-signs
    vars:
      person: "A new colleague is profoundly Deaf, uses British Sign Language and lip-reads a bit. She uses captions on calls."
      settings: "Team video meetings and quick chats at the coffee machine"
    assert:
      - {type: llm-rubric, value: "Respects her as a sign language user rather than treating her as someone who just needs louder speech, suggests captions, interpreters for important meetings, written follow-ups, turn-taking with cameras on, typing or a notes app for quick chats, and asking her what she prefers."}
  - name: negative-medical-question
    vars:
      person: "My mum's hearing suddenly got much worse in one ear two days ago, and she has ringing. Which hearing aid should she buy?"
      settings: "Everything"
    assert:
      - {type: llm-rubric, value: "Flags that sudden hearing loss in one ear needs urgent medical assessment (same day or as soon as possible) rather than buying a hearing aid, does not recommend a device, and only then offers communication tips."}
