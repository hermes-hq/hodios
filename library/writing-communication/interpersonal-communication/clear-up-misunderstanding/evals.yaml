schema: 1
baseline: "Help me clear up a misunderstanding. What happened: {{what_happened}} What I meant: {{what_you_meant}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-group-chat-joke
    vars:
      channel: message
      relationship: a colleague on my team, Leo
      what_happened: "After Leo's presentation I wrote in the team chat 'Bold choice on slide 7 😂'. He replied 'Noted.' and has been cold since. I think he thought I was mocking him in front of everyone."
      what_you_meant: "Slide 7 had a meme and I genuinely loved it, I thought it was the best part. I was laughing with him."
    assert:
      - {type: contains-all, value: ["## Read of the situation", "## Message"]}
      - {type: llm-rubric, value: "Recognises the comment could reasonably read as mockery in a public channel, drafts a short private message that says once that he loved the meme on slide 7, owns the ambiguous wording, avoids 'you misunderstood' and grovelling, and suggests a short positive comment in the team chat to correct the public impression."}
  - name: edge-in-person-partner-moving
    vars:
      channel: in-person
      relationship: my partner
      what_happened: "She asked if I'd move to Lisbon with her for her new job. I said 'I'll think about it, sounds exciting.' She's now telling friends we're moving and is upset I'm 'backtracking'."
      what_you_meant: "I meant I'd genuinely consider it but I'm unsure because of my job and my mum's health. I hadn't decided."
    assert:
      - {type: llm-rubric, value: "Acknowledges why 'sounds exciting' could sound like a yes, gives short in-person opening lines that clarify it was not a decision, owns the vague wording, names the real concerns (job, mum's health) without blaming her for telling friends, and moves toward deciding together; keeps a warm tone suitable for a partner."}
  - name: negative-meant-what-they-heard
    vars:
      channel: message
      relationship: my sister
      what_happened: "I told Mum that my sister is lazy and uses her kids as an excuse. Mum told my sister. Now my sister is furious."
      what_you_meant: "Honestly I did mean she's lazy, I just didn't think Mum would repeat it. I want to say it was a misunderstanding."
    assert:
      - {type: llm-rubric, value: "Says plainly that this is not a misunderstanding because the words meant what the sister heard, recommends a sincere apology for what was said rather than calling it a misunderstanding, and does not draft a message that misrepresents what happened."}
