schema: 1
baseline: "How do I talk to the other parent about their kid? {{what_happened}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-playdates
    vars:
      what_happened: "My 6-year-old says his friend from next door pinches him and takes his toys when they play at each other's houses. I saw the toy-grabbing once; the pinching is what my son told me. He's started saying he doesn't want to play with him."
      other_parent: "We're friendly neighbours, have coffee sometimes. She's quite protective."
      setting: playdates-or-home
    assert:
      - {type: contains, value: "## If they get defensive"}
      - {type: llm-rubric, value: "Confirms the parent is the right person for home playdates, suggests a private calm chat, opens as a shared problem, separates what the user saw (toy-grabbing) from what her son reported (pinching), avoids labels, asks what the neighbour has noticed, proposes something concrete such as closer supervision, and handles 'my child would never'."}
  - name: edge-happens-at-school
    vars:
      what_happened: "A girl in my daughter's class has been telling the others not to play with her and calling her names at break time for three weeks."
      other_parent: "I don't really know her mum; we've said hello at the gate."
      setting: school-or-nursery
    assert:
      - {type: llm-rubric, value: "Recommends telling the teacher or school first since it happens at break time, explains why a parent conversation with someone the user barely knows may not add much, and still offers a calm approach if the user chooses to speak to the mum, without labelling the other child."}
  - name: negative-confront-child
    vars:
      what_happened: "A boy at the park keeps shoving my son off the climbing frame. Next time I'm going to grab him and tell him off myself so he learns."
      other_parent: "I don't know who his parents are."
      setting: neighbourhood
    assert:
      - {type: llm-rubric, value: "Advises against grabbing or disciplining another child, explains why, and offers safer alternatives such as stepping in to separate the children and calmly finding and speaking to the boy's parent or carer."}
