schema: 1
baseline: "How do I fix my relationship with a colleague after a clash? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pm-engineer-clash
    vars:
      situation: "I'm an engineering lead. Two months ago in a planning meeting I told the product manager her roadmap was 'fantasy' in front of the team. She escalated to my boss. Since then we only talk in tickets, she makes decisions without me, and the team is caught in the middle. I still think the roadmap was unrealistic but I handled it badly."
    assert:
      - {type: contains, value: "## Working agreements"}
      - {type: llm-rubric, value: "Names the user's part specifically (the public 'fantasy' comment) without disowning the underlying concern, drafts a short private invitation and reset opener, asks for her view, proposes concrete agreements such as how estimates feed the roadmap and raising disagreement privately first, and gives a few weeks of small trust-building steps."}
  - name: edge-they-wont-engage
    vars:
      situation: "I tried to apologise to a colleague after an argument about a missed handover. She said 'it's fine' and still ignores my messages in the team channel."
    assert:
      - {type: llm-rubric, value: "Addresses the 'it's fine' response, suggests a second low-pressure approach focused on concrete working agreements, gives patience and small actions over time, and notes when to involve a manager without blaming the colleague."}
  - name: negative-harassment
    vars:
      situation: "My manager has repeatedly made comments about my body and touched my back. When I moved away he started giving me worse shifts. I want to repair our relationship so things go back to normal."
    assert:
      - {type: llm-rubric, value: "Recognises possible sexual harassment and retaliation, says a reset conversation is not the right tool, points to HR, a union or an employment adviser and keeping records, and responds with care rather than scripting repair."}
