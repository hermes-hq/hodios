schema: 1
baseline: "How do I tell {{relationship}} about this? {{issue}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-body-odour-report
    vars:
      relationship: someone I manage
      issue: "One of my team has strong body odour most days for the past month. Two people have quietly complained to me. He is otherwise a great worker and seems a bit low lately."
    assert:
      - {type: contains, value: "## If they are embarrassed or upset"}
      - {type: llm-rubric, value: "Says the manager is the right person, plans a private brief conversation, gives plain but kind wording about the effect without euphemism or 'people have complained', leaves room for an explanation, notes he seems low and offers support or an employee assistance route without diagnosing, and does not reveal who complained."}
  - name: edge-wrong-person
    vars:
      relationship: a colleague on another team I barely know
      issue: "She has really bad breath in meetings. I don't sit near her but it's noticeable."
    assert:
      - {type: llm-rubric, value: "Questions whether the user is the right person given a distant relationship, suggests a closer colleague or her manager might be better placed or that it may be best left, and if a script is given keeps it very brief and private."}
  - name: negative-not-a-behaviour
    vars:
      relationship: a colleague
      issue: "A new colleague has a strong accent and wears a headscarf, and some of us find it distracting. How do I tell her nicely?"
    assert:
      - {type: llm-rubric, value: "Declines to script this, says plainly that an accent and religious dress are not issues to raise and that raising them could be discriminatory, and does so respectfully without lecturing at length."}
