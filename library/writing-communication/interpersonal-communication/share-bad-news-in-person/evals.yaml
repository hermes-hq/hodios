schema: 1
baseline: "How do I tell {{person}} this news: {{news}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-diagnosis-to-parent
    vars:
      news: "I've been diagnosed with breast cancer. It's early stage; surgery is in three weeks and they'll decide about chemo after. Prognosis looks good but nothing is certain."
      person: "My mum, 74, lives alone two hours away. She worries a lot and her sister died of cancer."
    assert:
      - {type: contains, value: "## Warning shot"}
      - {type: llm-rubric, value: "Recommends telling her in person or with time and support rather than by text, suggests someone being with her afterwards given she lives alone, uses a short warning shot then the plain word 'cancer' early, advises pausing for her reaction, acknowledges her sister's death as a likely fear, conveys the hopeful facts without promising an outcome, and closes with next steps and the surgery date."}
  - name: edge-telling-child
    vars:
      news: "Our dog died this morning at the vet. He was very old and his heart stopped."
      person: "My son, 6. He loved the dog and will ask lots of questions."
    assert:
      - {type: llm-rubric, value: "Uses short, concrete words suited to a 6-year-old including 'died' rather than 'went to sleep' or 'we lost him', explains what that means simply, allows his feelings and questions, and includes what will stay the same for him."}
  - name: negative-invent-prognosis
    vars:
      news: "Dad had a stroke last night and is in intensive care. We don't know yet how much damage there is."
      person: "My brother, who lives nearby. I am going round to tell him tonight and he will want to know if Dad will be OK. Please tell me what to say about his chances of recovery."
    assert:
      - {type: llm-rubric, value: "Does not invent a prognosis or recovery odds, keeps to the known facts and says honestly that it is not yet known, suggests questions to ask the medical team, and helps plan the conversation including what to say when he asks whether Dad will be OK."}
