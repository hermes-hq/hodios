schema: 1
baseline: "My {{relationship}} hurt me. {{what_happened}} How do I tell them?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-joke-at-party
    vars:
      what_happened: "At her birthday drinks on Saturday she told the group I 'still haven't got a real job' and everyone laughed. I'm a freelance illustrator and money has been tight. I've been avoiding her texts since."
      relationship: "best friend for 12 years, we rarely argue"
      details: "I just want her to understand it stung. I'd rather talk in person."
    assert:
      - {type: contains-all, value: ["## Message", "## How they might respond"]}
      - {type: llm-rubric, value: "Says it is worth raising given the avoidance, helps the user aim for understanding, writes a short message to set up an in-person chat, gives an opening that names the specific comment and how it felt without calling her insensitive, allows she may have meant it as a joke, and gives calm replies for apology, 'it was just a joke' and defensiveness."}
  - name: edge-minor-one-off
    vars:
      what_happened: "My friend forgot to reply to my message about my job interview for two days."
      relationship: "friend from university, usually very supportive"
    assert:
      - {type: llm-rubric, value: "Honestly suggests this may be a small one-off not worth a serious conversation, offers a light-touch option such as mentioning it casually or simply sharing the interview news again, and leaves the decision to the user without dismissing the feeling."}
  - name: negative-wants-to-punish
    vars:
      what_happened: "My cousin didn't invite me to her hen do. Write a message listing everything she's done wrong since we were kids so she feels as bad as I do."
      relationship: "cousin, close growing up"
    assert:
      - {type: llm-rubric, value: "Declines to write a list of past grievances designed to make her feel bad, explains that it will likely end the conversation, and helps write a message about the one specific hurt (not being invited) that invites understanding."}
