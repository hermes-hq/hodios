schema: 1
baseline: "{{relationship}}에게 보낼 {{occasion}} 메시지 써 줘."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-boss-funeral-kakaotalk
    vars:
      occasion: "팀장님 모친상, 지방이라 조문을 못 감"
      relationship: "입사 때부터 챙겨 주신 직속 팀장님"
      channel: kakaotalk
    assert:
      - {type: contains, value: "## 메시지"}
      - {type: llm-rubric, value: "하십시오체로 “삼가 고인의 명복을 빕니다” 등 절제된 조문 표현을 쓰고, 조문을 가지 못하는 사정을 짧게 전한다. 이모티콘·느낌표가 없고, 사인을 묻지 않으며, 종교를 모를 때의 대안을 언급한다."}
  - name: edge-envelope-wedding
    vars:
      occasion: "회사 동기 결혼식"
      relationship: "같은 해 입사한 동기, 친한 편"
      channel: envelope
    assert:
      - {type: llm-rubric, value: "봉투 앞면 문구(祝結婚 또는 祝華婚 등)와 뒷면 왼쪽 아래 이름·소속을 쓰는 위치를 알려 주고, 축의금 액수는 권하지 않는다."}
  - name: negative-unclear-occasion
    vars:
      occasion: "부장님 일"
      relationship: "다른 부서 부장님"
      channel: card
    assert:
      - {type: llm-rubric, value: "경사인지 조사인지, 누구의 일인지 짧게 묻고 멈춘다. 축하나 조문 메시지를 추측해서 쓰지 않는다."}
