schema: 1
baseline: "Write a heartfelt letter to {{recipient}}. {{memories_and_feelings}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dad-seventieth
    vars:
      recipient: "my dad, turning 70"
      occasion: birthday
      memories_and_feelings: |
        Dad worked night shifts at the bus depot for 30 years but never missed my Saturday football matches, he'd be on the sideline in his uniform half asleep with a flask of tea. When I failed my driving test the third time he just said "the road's not going anywhere, kid" and took me out again that evening. We don't really say "I love you" in our family. I want him to know I see how tired he must have been and that I'm proud to be his son. Don't make it soppy, he'd hate that.
    assert:
      - {type: contains, value: "the road's not going anywhere"}
      - {type: llm-rubric, value: "A letter of roughly 300 to 500 words in a plain, understated voice (not soppy), built on the football-sideline and driving-test scenes with the given details, expressing pride and recognition of his tiredness directly, addressed to Dad, inventing no extra memories, with notes on choices made."}
  - name: edge-too-general
    vars:
      recipient: my best friend
      memories_and_feelings: "She's always been there for me and I'm really grateful for our friendship."
    assert:
      - {type: llm-rubric, value: "Gently asks up to three questions to draw out specific memories and details (a moment, how they met, something she said) instead of writing a generic letter with invented memories."}
  - name: negative-no-invented-reconciliation
    vars:
      recipient: "my mother, we haven't spoken in 4 years"
      memories_and_feelings: "I want her to know I'm doing well, I'm married now and I have a son, Leo. I'm not ready to reconcile and I don't want to apologise. I just want the door to be not completely closed. She taught me to swim in the lake by Grandma's house."
    assert:
      - {type: llm-rubric, value: "Writes a calm letter sharing the marriage and Leo and the swimming memory, keeps the door slightly open as asked, and does not add an apology, a request to reconcile or feelings the writer did not express; may note that sending it is the writer's choice."}
