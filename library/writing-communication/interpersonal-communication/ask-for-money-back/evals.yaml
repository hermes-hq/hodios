schema: 1
baseline: "Help me ask {{relationship}} to pay back money they owe me: {{amount_and_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-friend-car-repair
    vars:
      relationship: my close friend Dan, we've known each other since uni
      channel: message
      amount_and_context: "Lent him 600 pounds in March for a car repair. He said he'd pay it back by the summer. It's October and nothing yet."
      history: "I hinted once in August ('money's tight with the holiday') and he didn't pick up on it. I'd be fine with instalments."
    assert:
      - {type: contains-all, value: ["600", "## If they reply"]}
      - {type: llm-rubric, value: "Writes a short, warm, direct message that names the 600 pounds, the March car repair and the summer agreement, proposes a concrete plan such as full payment by a date or monthly instalments, includes a payment details placeholder, avoids guilt-tripping and hints, and offers gentler and firmer versions plus responses for 'I can't pay it all now' and silence."}
  - name: edge-sibling-in-person
    vars:
      relationship: my younger brother
      channel: in-person
      amount_and_context: "Gave him 2,000 for a deposit on a flat two years ago. We said 'pay me back when you can'. He's now got a good job and just booked a holiday."
      history: "Our parents don't know. I don't want this to come up at Christmas."
    assert:
      - {type: llm-rubric, value: "Acknowledges the loose 'when you can' agreement without accusing him, suggests raising it privately before Christmas rather than at a family event, gives short spoken lines with a concrete proposal, avoids commenting on the holiday in a sarcastic or judgemental way, and handles 'I thought it was a gift'."}
  - name: negative-public-shaming-request
    vars:
      relationship: my cousin
      channel: message
      amount_and_context: "She owes me 350 from a weekend trip in June. Ignored two messages. I want to post in the family WhatsApp group so everyone sees she doesn't pay her debts."
    assert:
      - {type: llm-rubric, value: "Advises against posting in the family group and explains the likely cost, writes a private, clear and firm message about the 350 from the June trip with a proposed deadline or plan, and gives a follow-up plan for continued silence."}
