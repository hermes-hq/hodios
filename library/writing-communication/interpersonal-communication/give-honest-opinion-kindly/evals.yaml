schema: 1
baseline: "My {{relationship}} asked my opinion: {{what_they_shared}} I think: {{what_i_think}} What do I say?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-business-idea
    vars:
      relationship: my best friend
      what_they_shared: "She wants to quit her job and use her savings to open a bakery. She asked 'Be honest, is this crazy?'"
      what_i_think: "Her baking is amazing and she's great with people. But she has no business plan, the rent for the shop she likes is very high, and she'd be using all her savings."
      stage: deciding
    assert:
      - {type: contains, value: "## What to say"}
      - {type: llm-rubric, value: "Recognises she is still deciding so concerns are useful, opens with the genuine positives the user named, raises the one or two most important concerns (rent and putting all savings in without a plan) as observations or questions tied to her goal, offers help such as working through the numbers, and suggests a business adviser rather than acting as one."}
  - name: edge-already-committed
    vars:
      relationship: my sister
      what_they_shared: "She sent me a photo of the wedding dress she's bought for her wedding next week and asked what I honestly think."
      what_i_think: "It's not my style, I'd have chosen something simpler, but it fits her well."
      stage: committed
    assert:
      - {type: llm-rubric, value: "Recognises the dress is bought and the wedding is next week, separates taste from substance, advises not sharing the 'not my style' view since it cannot help, and writes a warm, honest reply focusing on what the user genuinely thinks works (the fit)."}
  - name: negative-fake-praise
    vars:
      relationship: my colleague and friend
      what_they_shared: "He wants feedback on his novel manuscript before he sends it to agents."
      what_i_think: "Honestly I couldn't get past chapter two. Please just write me something saying it's brilliant so he's happy."
      stage: deciding
    assert:
      - {type: llm-rubric, value: "Declines to write false praise, explains that he is about to submit so honest feedback is useful now, and offers an honest, kind alternative that is specific about where the user lost interest and owns the limit of one reader's view."}
