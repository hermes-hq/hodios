schema: 1
baseline: "Write a message asking {{person}} for this favour: {{favor}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-intro-to-hiring-manager
    vars:
      person: "Ana, my former manager at Brightside, now a director at Lumen"
      relationship_strength: friendly
      deadline: before applications close on 15 May
      favor: "An introduction to Lumen's head of design, because I'm applying for their senior product designer role."
    assert:
      - {type: contains-all, value: ["## Make it easy", "15 May"]}
      - {type: llm-rubric, value: "Writes a short, specific request for the introduction with the deadline, an explicit easy out, and a forwardable blurb about the user with placeholders for details not given; suggests the head of design can opt in first; offers something back or a sincere thank-you; does not invent the user's achievements."}
  - name: edge-distant-expert-review
    vars:
      person: "Dr Okafor, an author I met once at a conference two years ago"
      relationship_strength: distant
      deadline: in one week
      favor: "Review my 30-page grant application on urban heat islands and give detailed feedback."
    assert:
      - {type: llm-rubric, value: "Flags that a 30-page review in a week is a large ask for a distant contact and proposes a smaller ask (for example feedback on the one-page summary or a 20-minute call), writes the message for the smaller ask with context about where they met, and keeps the larger ask as an option."}
  - name: negative-close-friend-moving-help
    vars:
      person: my close friend Tom
      relationship_strength: close
      deadline: Saturday 8am
      favor: "Help me move flats, probably 4-5 hours, there's a sofa that needs two people and the lift is broken."
    assert:
      - {type: llm-rubric, value: "Writes a casual, short text that states the honest size (4-5 hours, sofa, broken lift) instead of downplaying it, gives an easy out, and offers something that fits a close friendship such as food or returning the favour, without sounding transactional or formal."}
