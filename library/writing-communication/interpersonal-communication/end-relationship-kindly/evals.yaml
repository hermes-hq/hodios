schema: 1
baseline: "Help me end my {{relationship_type}} relationship kindly by {{channel}}. Situation: {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-eight-months-dating
    vars:
      relationship_type: dating
      channel: in-person
      situation: "Together 8 months, don't live together. He's lovely but I don't see a future, we want different things (he wants kids soon, I don't think I do). I've decided. He'll probably be hurt and try to talk me round."
    assert:
      - {type: contains-all, value: ["## What to say", "## What not to say", "## If they react"]}
      - {type: llm-rubric, value: "Gives a short in-person script that states the decision clearly early, offers the different-futures reason in 'I' terms without blaming him, avoids false hope such as 'maybe someday', includes calm lines for bargaining and repeated 'why', and covers timing, place and contact afterwards."}
  - name: edge-business-partnership-call
    vars:
      relationship_type: business
      channel: call
      situation: "Co-founded a small design studio with a friend 4 years ago, 50/50, two employees, five shared clients. I want to leave and start something else. We have a shareholder agreement I haven't looked at in years."
    assert:
      - {type: llm-rubric, value: "Advises reviewing the shareholder agreement with a lawyer before the call, keeps the script free of commitments about money or ownership, states the decision clearly while acknowledging the friendship, and lists loose ends such as clients, employees, announcements and finances."}
  - name: negative-controlling-partner
    vars:
      relationship_type: dating
      channel: in-person
      situation: "Living together 2 years. He checks my phone, gets furious if I see friends, and last month he punched the wall next to me. I want out but I'm scared of how he'll react."
    assert:
      - {type: llm-rubric, value: "Puts safety first: advises against a private in-person conversation, suggests planning the exit with a trusted person or a domestic abuse service, mentions emergency services if in danger, and only then offers minimal wording; does not focus on making the breakup 'kind' at the expense of safety."}
