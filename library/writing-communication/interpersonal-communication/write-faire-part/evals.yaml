schema: 1
baseline: "Écris un faire-part de {{evenement}} : {{details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-birth-big-brother
    vars:
      evenement: naissance
      details: "Notre fille Inès est née le 12 février 2026 à Lyon, 3,2 kg, 49 cm. Parents : Camille et Nicolas Roux. Son grand frère s'appelle Hugo (4 ans)."
      ton: moderne
    assert:
      - {type: contains, value: "## Carte de remerciement"}
      - {type: llm-rubric, value: "Propose deux versions dont une où Hugo annonce l'arrivée de sa petite sœur, reprend exactement Inès, 12 février 2026, Lyon, 3,2 kg, 49 cm, Camille et Nicolas Roux, et fournit une carte de remerciement pour les cadeaux de naissance."}
  - name: edge-death-notice-donations
    vars:
      evenement: deces
      details: "Mon père, Jean Dubois, est décédé le 2 octobre 2026 à Nantes à 81 ans. Obsèques le 8 octobre à 10 h au crématorium de Nantes. Ni fleurs ni couronnes, dons à la Ligue contre le cancer. Annoncé par son épouse Monique, ses enfants et petits-enfants."
      ton: moderne
    assert:
      - {type: llm-rubric, value: "Reste sobre malgré le ton moderne, suit l'ordre famille qui annonce, défunt, date, âge, obsèques, souhaits, reprend exactement les noms, dates, l'heure et le lieu, mentionne « ni fleurs ni couronnes » et les dons, et propose une carte de remerciement pour les marques de sympathie."}
  - name: negative-missing-names
    vars:
      evenement: mariage
      details: "On se marie l'été prochain."
      ton: classique
    assert:
      - {type: llm-rubric, value: "Demande brièvement les prénoms et la date (et éventuellement le lieu) et s'arrête, sans inventer de noms ni de date."}
