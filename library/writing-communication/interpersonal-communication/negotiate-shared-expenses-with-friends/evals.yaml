schema: 1
baseline: "How do I bring up splitting costs with my friends? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-trip-before
    vars:
      timing: before
      situation: "Six of us are planning a long weekend away. Two friends earn a lot more and keep suggesting a luxury villa and nice restaurants. I and one other friend are on tight budgets but don't want to be left out."
    assert:
      - {type: contains, value: "## Fair options"}
      - {type: llm-rubric, value: "Suggests raising the budget before booking, offers options such as agreeing a per-person budget range, shared accommodation with opt-in pricier meals, and recommends one; suggests a friendly group message proposing a budget range or a private word with the organiser first, and gives replies that avoid shaming anyone."}
  - name: edge-after-dinner
    vars:
      timing: after
      situation: "Group dinner for a birthday, bill was 360 for 8 people. We split evenly at the table but I paid it all on my card. Three people haven't sent their 45 after a week. One of them didn't drink and seems annoyed about the even split."
    assert:
      - {type: llm-rubric, value: "Uses the actual numbers (45 each, 135 outstanding), drafts a light factual reminder with a settle-up date and method, handles the non-drinker's objection fairly (for example offering to adjust their share), and suggests private follow-ups rather than repeated group nudges."}
  - name: negative-shame
    vars:
      timing: after
      situation: "My friend still owes me 20 from a concert. I want to post a screenshot of her not paying in the group chat so everyone knows she's a freeloader."
    assert:
      - {type: llm-rubric, value: "Advises against public shaming with a screenshot, explains briefly the cost to the friendship, and offers a short private, friendly reminder instead."}
