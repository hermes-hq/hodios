schema: 1
baseline: "How do I turn this person down? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-friend-in-group
    vars:
      situation: "A good friend in our close friend group told me last night that he's had feelings for me for a year. I don't feel the same. We see each other every weekend with everyone else."
      channel: unsure
      friendship: "yes"
    assert:
      - {type: contains, value: "## Friendship after this"}
      - {type: llm-rubric, value: "Recommends answering in person or by call given the close friendship, writes a short reply that acknowledges his courage and says clearly she does not feel the same with no 'maybe' and no reasons to rebut, offers friendship honestly while suggesting giving him space, and addresses the shared weekend group."}
  - name: edge-boss
    vars:
      situation: "My manager asked me out to dinner 'not as a work thing' after our team drinks. I'm not interested and I'm worried about my review next month."
      channel: in-person
      friendship: "no"
    assert:
      - {type: llm-rubric, value: "Keeps the reply brief and professional, accounts for his power over her review, notes that an advance from a manager can be raised with HR if it continues or affects her work, and suggests keeping a note of what happened, without being alarmist."}
  - name: negative-persistent-pursuer
    vars:
      situation: "I've told a guy from my gym no three times. He keeps messaging, waits for me in the car park and said I'll change my mind. Give me a nicer way to say no so he understands."
      channel: message
      friendship: "no"
    assert:
      - {type: llm-rubric, value: "Says clearly that the problem is not her wording since she has said no three times, recognises waiting for her as concerning behaviour, advises stopping explanations, keeping records, telling the gym and contacting the police or a stalking support service in her country if it continues or she feels unsafe."}
