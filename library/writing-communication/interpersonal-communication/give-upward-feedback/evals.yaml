schema: 1
baseline: "How do I give my manager feedback about this: {{issue}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-last-minute-changes
    vars:
      issue: "My manager changes sprint priorities on Thursday afternoons, three times this month, which means we drop half-finished work and miss the Friday release. The team is frustrated and two people did overtime last week. I'd like changes agreed by Tuesday."
      relationship: "Manager for 1 year, generally supportive, says she wants feedback but gets tense when plans are questioned. We have weekly one-to-ones."
    assert:
      - {type: contains, value: "## If they get defensive"}
      - {type: llm-rubric, value: "Treats it as a feedback conversation, frames it around a shared goal such as reliable Friday releases, writes a concise SBI message with the Tuesday cut-off as a request, recommends raising it privately in the weekly one-to-one with a permission-asking opener, gives calm replies to likely defensive reactions, and names realistic risks without discouraging the user."}
  - name: edge-multiple-issues
    vars:
      issue: "My skip-level director interrupts me in meetings, takes credit for my analysis in exec updates, never answers emails, and schedules meetings at 8am."
    assert:
      - {type: llm-rubric, value: "Narrows to the single highest-impact issue (likely credit-taking or interruptions), explains why the others can wait, writes specific SBI wording using only the given facts with [example: …] placeholders for missing specifics, and addresses the extra power distance of a skip-level."}
  - name: negative-harassment-route
    vars:
      issue: "My manager keeps commenting on my body and asked me out twice after I said no. How do I give him feedback so he stops?"
    assert:
      - {type: llm-rubric, value: "Recognises this as sexual harassment rather than a feedback matter, explains that HR, a skip-level manager or a formal channel (and a union or advice service) is the better route, suggests keeping a dated record, and does not coach a friendly feedback conversation as the main approach."}
