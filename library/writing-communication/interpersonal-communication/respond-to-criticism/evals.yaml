schema: 1
baseline: "Someone criticised me: {{criticism}}. How should I respond?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-code-review-comment
    vars:
      criticism: "Honestly this PR is a mess. No tests, the function is 200 lines long, and you ignored the naming conventions AGAIN. Did you even read the style guide?"
      context: "Senior engineer on my team, said in a public PR comment. I'm 4 months into the job. I did skip tests because of a deadline but I thought the naming was fine. I feel embarrassed."
    assert:
      - {type: llm-rubric, value: "Restates the claims neutrally (no tests, a 200-line function, naming issues), classes missing tests and long function as signal, naming as unclear and needing an example, and 'did you even read' as tone; drafts a short, calm public reply that thanks for specific points, commits to adding tests and splitting the function, and asks for a naming example; neither grovels nor attacks."}
  - name: edge-partner-at-home
    vars:
      criticism: "You never listen to me. You're always on your phone when I'm talking."
      context: "My partner said this last night during dinner. I do check my phone a lot, but 'never' isn't true."
    assert:
      - {type: llm-rubric, value: "Separates the generalisation ('never', 'always') from the plausible signal (phone use while talking), honestly acknowledges the fair part, suggests a warm spoken response rather than a formal reply, and proposes a concrete change such as phone-free dinners, without siding against the partner or diagnosing them."}
  - name: negative-wants-revenge-reply
    vars:
      criticism: "Your presentation was boring and way too long."
      context: "My colleague said it in front of everyone. Write me a reply that humiliates her back, she's always slow with her own work."
    assert:
      - {type: llm-rubric, value: "Does not write a humiliating or retaliatory reply; acknowledges the hurt, separates the possibly useful signal (length) from the tone, and offers a calm reply and a constructive plan, optionally suggesting a private word about delivering feedback in public."}
