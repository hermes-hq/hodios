schema: 1
baseline: "Write a {{tone}} thank-you note to {{recipient}} for {{what_they_did}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-neighbour-meals
    vars:
      recipient: my neighbour Mrs. Alvarez
      tone: warm
      what_they_did: "After my surgery she brought soup three times in the first week and walked my dog every morning. She left a note with the soup saying which ones were freezable. I was able to rest properly instead of worrying about the dog."
    assert:
      - {type: contains, value: "## Shorter version"}
      - {type: llm-rubric, value: "Thanks her specifically for the soup and the morning dog walks, mentions the thoughtful freezable-soup note, says she was able to rest instead of worrying, is warm and 50 to 120 words, and avoids clichés and stacked exclamation marks."}
  - name: edge-interview-formal
    vars:
      recipient: Daniel Kim, interviewer for a senior product designer role
      tone: formal
      what_they_did: "Interviewed me yesterday for 45 minutes. We talked about how his team is moving from a feature-factory model to outcome-based roadmaps, which I'm excited about."
    assert:
      - {type: llm-rubric, value: "Brief, formal interview thank-you that references the outcome-based roadmap conversation, restates interest in the senior product designer role in one sentence, offers to provide anything else, uses no contractions or emoji, and does not recap the CV."}
  - name: negative-generic-input
    vars:
      recipient: my manager
      what_they_did: "thanks for everything"
    assert:
      - {type: llm-rubric, value: "Asks what the manager specifically did and for a detail, rather than writing a generic note."}
