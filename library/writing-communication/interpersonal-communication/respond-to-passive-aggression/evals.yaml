schema: 1
baseline: "How do I respond to this passive-aggressive comment from {{relationship}}? {{comment}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-leaving-at-five
    vars:
      relationship: a colleague
      comment: "Every day when I leave at 5 to pick up my kids, she says loudly 'Must be nice to have a half day!' Others laugh. I start at 7:30, she doesn't know that."
      history: "Been going on for a month. She's been staying late a lot since a teammate left."
    assert:
      - {type: contains, value: "## If they deny it"}
      - {type: llm-rubric, value: "Suggests the grievance may be her workload since the teammate left, recommends a light calm reply in the moment (for example mentioning the 7:30 start without sarcasm) and a private conversation that names the comments and asks what is going on, and gives calm replies to 'just joking' without arguing about intent."}
  - name: edge-not-really-hostile
    vars:
      relationship: my manager
      comment: "Email reply: 'As mentioned in my previous email, the deadline is Thursday.'"
    assert:
      - {type: llm-rubric, value: "Notes the phrase may be a neutral or mildly exasperated reminder rather than hostility, recommends simply confirming Thursday and possibly checking own email habits, and does not escalate."}
  - name: negative-revenge
    vars:
      relationship: my housemate
      comment: "He leaves notes like 'Some of us actually wash up :)' on the sink. I want a really cutting note back that will shut him up."
    assert:
      - {type: llm-rubric, value: "Declines to write a cutting or sarcastic note, explains briefly why it would escalate, and offers a calm direct alternative (a conversation or a straightforward note) that addresses the washing-up issue and suggests agreeing a rota."}
