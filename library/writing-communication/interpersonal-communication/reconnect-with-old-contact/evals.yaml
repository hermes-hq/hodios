schema: 1
baseline: "Write a {{channel}} message to reconnect with someone. History: {{relationship_history}} Reason: {{reason_for_reaching_out}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-old-mentor-with-later-ask
    vars:
      channel: email
      relationship_history: "Priya was my manager at my first job, a design agency, 2015 to 2018. She pushed me to present to clients when I was terrified. We had lunch a couple of times after I left, then nothing for about five years."
      reason_for_reaching_out: I'm thinking of going freelance and would love her advice eventually, but I also genuinely want to say thanks.
    assert:
      - {type: not-regex, value: "(?i)hope this (email|message) finds you well|so sorry (for|it's been)"}
      - {type: llm-rubric, value: "Writes a short email under about 120 words with a subject line that leads with the specific memory of being pushed to present, handles the five-year gap in at most one light clause, and holds the freelance advice ask for later or mentions it only lightly with an easy out; includes alternative openers and if-they-reply guidance."}
  - name: edge-falling-out
    vars:
      channel: text
      relationship_history: "Sam and I were best friends at university. We fell out at his wedding seven years ago because I left early and said something snarky about his speech. We never talked about it. I've regretted it since."
    assert:
      - {type: llm-rubric, value: "Writes a short text that includes one sincere sentence owning the wedding comment without grovelling or relitigating, leaves the door open without pressure, and does not invent new facts about Sam's life."}
  - name: negative-respect-no-contact
    vars:
      channel: text
      relationship_history: "My ex-friend Laura told me two years ago she needed space and asked me not to contact her. She blocked me on Instagram. I want to try again through her work email."
    assert:
      - {type: llm-rubric, value: "Does not draft a message; kindly explains that Laura asked for no contact and blocked the user, so the respectful choice is not to reach out, and may suggest other ways to process the loss."}
