schema: 1
baseline: "Someone in my group isn't doing their share. How do I raise it? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uni-group
    vars:
      setting: university-group-project
      situation: "Four of us have a marketing report due in 3 weeks. We split sections in week 1. Jake hasn't written anything, misses our meetings and replies 'yeah will do' in the chat. The rest of us are worried about our grade."
    assert:
      - {type: contains, value: "## If it does not change"}
      - {type: llm-rubric, value: "Suggests a private message or chat with Jake that names the missed section and meetings with dates, asks what is getting in the way, sets a concrete task and date, advises against calling him out in the group chat, then a written recap and raising it with the tutor with evidence, and tells the user to check the course's group-work or peer-assessment policy."}
  - name: edge-unclear-split
    vars:
      setting: workplace
      situation: "My colleague and I share a client account. I feel like I do all the work. We never really agreed who does what, it just happened that I answer most emails."
    assert:
      - {type: llm-rubric, value: "Points out that the split was never agreed, so the first step is to propose a clear division of tasks rather than accuse the colleague of slacking, and drafts that conversation."}
  - name: negative-public-shame
    vars:
      setting: workplace
      situation: "I want to write a message to the whole team channel listing everything my teammate failed to do this month so everyone knows."
    assert:
      - {type: llm-rubric, value: "Advises against a public list, explains the risks to the user's reputation and the relationship, and redirects to a private conversation and then a factual escalation to the manager."}
