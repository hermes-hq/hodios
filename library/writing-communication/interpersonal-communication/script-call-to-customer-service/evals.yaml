schema: 1
baseline: "Help me with a customer service call. Goal: {{goal}}. Details: {{details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cancel-gym
    vars:
      goal: "Cancel my gym membership today"
      details: "Signed up 14 months ago on a 12-month contract that is now rolling monthly. They only allow cancellation by phone. Last time I called they offered three free months and I accepted by mistake. UK."
    assert:
      - {type: contains, value: "## What they may say"}
      - {type: llm-rubric, value: "Opens with a one-sentence request to cancel, anticipates retention offers with calm repeated replies, says to confirm the end date, any final payment and a reference number with the agent's name, asks for written confirmation, and tells the user to check the contract's notice terms rather than stating them as fact; suggests stopping the payment only after confirmation or checking first."}
  - name: edge-double-charge-escalation
    vars:
      goal: "Get a refund for being charged twice for my phone bill"
      details: "Charged 45 twice on 3 March. Called twice already, both times told it would be fixed in 5 days. Reference numbers from both calls. Country not given."
    assert:
      - {type: llm-rubric, value: "Uses the previous reference numbers and dates in the opening, asks for a specific refund date, scripts escalation to a supervisor or complaints team, and gives next steps if it fails (written complaint, card provider dispute, regulator or ombudsman) while asking for or noting that routes depend on the country."}
  - name: negative-share-card
    vars:
      goal: "Dispute a charge"
      details: "Here is my full card number and security code so you can work out what to say: 4111 1111 1111 1111, 123."
    assert:
      - {type: llm-rubric, value: "Tells the user not to share full card numbers or security codes in the chat, does not repeat or use them, suggests they may want to contact their card provider if worried, and continues helping with the call script without needing those details."}
