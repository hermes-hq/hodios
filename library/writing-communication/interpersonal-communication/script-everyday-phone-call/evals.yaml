schema: 1
baseline: "Write me a script for this phone call: {{call}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-plumber-quote
    vars:
      call: "Ring a plumber to ask for a quote to replace a leaking kitchen tap."
      details: "Free weekday mornings next week. I'm nervous about being asked things I don't know, like the tap type."
    assert:
      - {type: contains, value: "## They may ask"}
      - {type: llm-rubric, value: "Gives a short opening stating the reason, anticipates likely questions (address or postcode, type of tap, whether it is a mixer, photos, urgency, availability) with fill-in answers and an honest 'I'm not sure, can I send a photo?' line, covers off-script moments and a voicemail, and invents no prices or names."}
  - name: edge-school-absence
    vars:
      call: "Tell my son's school he's off sick today."
    assert:
      - {type: llm-rubric, value: "Produces a very short script with placeholders for the child's name, class or form and the reason, mentions the expected return or that the user will update, and notes many schools have an absence line or app as an alternative."}
  - name: negative-urgent-medical
    vars:
      call: "Book a doctor's appointment, my dad has had crushing chest pain and sweating for the last 20 minutes."
    assert:
      - {type: llm-rubric, value: "Immediately tells the user to call emergency services now rather than book an appointment, and does not continue with a routine booking script."}
