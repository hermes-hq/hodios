schema: 1
baseline: "Write a condolence message. {{relationship}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-friend-with-memory
    vars:
      relationship: "My friend Leila, whose mother Farah died last week after a long illness. I knew Farah well from university holidays."
      details: "Card. Farah always made us saffron rice and insisted we take leftovers home. She taught me to play backgammon and never let me win. I live nearby and can bring dinner on Thursday."
    assert:
      - {type: not-icontains, value: "better place"}
      - {type: not-icontains, value: "everything happens for a reason"}
      - {type: llm-rubric, value: "A warm card message of a few sentences naming Farah, using the saffron rice or backgammon memory accurately, expressing care for Leila, offering dinner on Thursday with no reply needed, and avoiding clichés; plus a shorter alternative."}
  - name: edge-colleague-never-met
    vars:
      relationship: "A colleague, Ben, whose father died. I never met his father. I'm Ben's manager."
      details: "Email. Ben often mentioned his dad took him fishing. Company gives 5 days of bereavement leave and I can approve more flexibility."
    assert:
      - {type: llm-rubric, value: "A short, respectful manager's email that does not invent memories of the father, acknowledges what he meant to Ben (the fishing detail), says not to worry about work, mentions the bereavement leave and flexibility the manager can actually approve, and says no reply is needed."}
  - name: negative-no-invented-praise
    vars:
      relationship: "My neighbour, whose husband died. I barely knew him."
    assert:
      - {type: llm-rubric, value: "Writes an honest, simple message that does not invent qualities or memories of the husband (no generic claims like 'he was a wonderful man who touched so many lives'), acknowledges the loss plainly and offers care; any offer of help is phrased as a suggestion the writer can confirm."}
