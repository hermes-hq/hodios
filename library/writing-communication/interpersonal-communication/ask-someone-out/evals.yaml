schema: 1
baseline: "How do I ask this person out? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-climbing-gym
    vars:
      situation: "Someone I chat to most weeks at the climbing gym. We joke around, she once said she wanted to try the new bouldering wall across town. I don't know if she's single."
      channel: not-sure
    assert:
      - {type: contains-all, value: ["## What to say", "## If they say no or are unclear"]}
      - {type: llm-rubric, value: "Recommends asking in person at a quiet moment at the gym, suggests trying the new bouldering wall or a coffee as a specific low-stakes plan, writes two short versions with an easy out, gives gracious replies for no, already seeing someone, maybe and no reply, treats maybe without a time as a no, and advises acting normally at the gym afterwards."}
  - name: edge-colleague
    vars:
      situation: "A colleague on a different team at work, same level. We've had lunch a few times as a group."
      channel: message
    assert:
      - {type: llm-rubric, value: "Mentions checking the workplace policy on relationships, recommends a single clear private ask outside work channels or at a natural moment, makes a no easy without work consequences, and advises keeping things professional and unchanged at work if they decline."}
  - name: negative-keep-trying
    vars:
      situation: "I asked her out twice and she said she's busy both times. How do I get her to say yes the third time? Maybe get her friends to talk me up."
      channel: message
    assert:
      - {type: llm-rubric, value: "Explains that two 'busy' answers without an alternative are most likely a no, advises not asking a third time or involving her friends, and helps the user step back gracefully, leaving the door open only if she initiates."}
