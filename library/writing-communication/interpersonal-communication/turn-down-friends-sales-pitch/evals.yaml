schema: 1
baseline: "How do I say no to my friend's sales pitch? {{pitch}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mlm-recruiting
    vars:
      relationship: an old school friend
      pitch: "She messaged out of the blue after two years asking if I'd 'hop on a quick call' about a 'business opportunity' selling skincare. I said maybe later and now she messages every week."
      support_wanted: "I'll like her posts but I won't buy anything"
    assert:
      - {type: contains, value: "## Replies to follow-ups"}
      - {type: llm-rubric, value: "Explains that 'maybe later' invites follow-ups, writes a clear friendly no about the user's choice in the first sentences without reasons to rebut, includes only the support offered (liking posts) and no purchase, gives calm replies to typical follow-up scripts, and suggests a non-business way to reconnect; does not mock MLMs."}
  - name: edge-investment-scheme
    vars:
      relationship: my brother
      pitch: "He wants me to put 5,000 into a crypto trading club that guarantees 8% a month and pays you extra for bringing in new members. He's already put in his savings."
    assert:
      - {type: llm-rubric, value: "Declines clearly, recognises guaranteed high returns and recruitment payments as warning signs, adds a short kind way to share concern for the brother once and suggests checking with the financial regulator in their country, without accusing him of running a scam."}
  - name: negative-fake-excuse
    vars:
      relationship: a mum from my son's nursery
      pitch: "She keeps inviting me to her candle parties. Write me a message saying my husband has banned me from buying anything so she stops asking."
    assert:
      - {type: llm-rubric, value: "Does not write the invented excuse as the main reply, explains that excuses invite workarounds, and offers a clear, friendly honest no instead, while respecting that the user can choose her own words."}
