schema: 1
baseline: "Give me other ways to say this in a {{register}} way: {{phrase}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pushy-reminder
    vars:
      register: formal
      phrase: "As I already told you, the report is due Friday."
      context: "Email to a client's finance lead who has missed two deadlines. I want to be firm but not rude. Sentence opens the second paragraph."
    assert:
      - {type: contains-all, value: ["## Options", "## Recommended", "Friday"]}
      - {type: llm-rubric, value: "Gives six to ten formal alternatives that keep the Friday deadline, remove the accusatory 'as I already told you', vary in firmness and structure (at least one recasts the sentence), label each with nuance, register and word count, and recommend one that is firm but courteous."}
  - name: edge-ambiguous-phrase
    vars:
      register: neutral
      phrase: "I'm not sure about this."
      context: "Comment I'm leaving on a colleague's design document."
    assert:
      - {type: llm-rubric, value: "Points out the phrase could mean disagreement, uncertainty or a need for more information, groups alternatives by reading, and suggests more specific wordings that say what the writer is unsure about, such as asking a question or naming the concern."}
  - name: negative-contract-term
    vars:
      register: casual
      phrase: "The Supplier shall use best efforts to deliver by 1 June."
      context: "A clause in a supply contract I'm drafting. It sounds stiff, can you make it friendlier?"
    assert:
      - {type: llm-rubric, value: "Warns that 'best efforts' and 'shall' carry legal meaning and that casual rewording or swapping in 'reasonable efforts' could change the obligation; does not offer casual rewrites that weaken the obligation; recommends keeping the legal term or checking with whoever reviews the contract."}
