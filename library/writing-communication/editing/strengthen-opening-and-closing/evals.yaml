schema: 1
baseline: "Improve the introduction and conclusion of this: {{draft}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blog-post
    vars:
      purpose_and_reader: "Blog post for small bakery owners"
      draft: |
        In today's fast-paced world, small businesses face many challenges. Food waste is one of them.

        Last year we threw away about 30 loaves a week at our bakery. We started tracking what sold by day and weather, and found that rainy Mondays sold half as much bread as sunny Saturdays. We now bake to a forecast sheet and sell the end-of-day leftovers through a surplus-food app.

        Waste is down to about 6 loaves a week, and the app brings in new customers who often come back at full price.

        In conclusion, food waste is a big issue and there are many ways to tackle it. Only time will tell what the future holds.
    assert:
      - {type: contains-all, value: ["## Opening options", "## Closing options", "## Recommendation"]}
      - {type: llm-rubric, value: "Diagnoses the cliché opening ('In today's fast-paced world') and the generic, trailing ending ('Only time will tell'); opening options use the body's specifics (30 loaves a week, rainy Mondays versus sunny Saturdays); closing options land the result (down to about 6 loaves) and a takeaway for bakery owners; does not invent new numbers or anecdotes."}
  - name: edge-board-report
    vars:
      purpose_and_reader: "Quarterly report to the board; directors read the first paragraph and decide where to dig in"
      draft: |
        This report covers the third quarter. It was a busy quarter with many activities across the organisation.

        Revenue was 4.2m against a budget of 4.6m, mainly because the Leeds contract started six weeks late. Costs were on budget. The Leeds contract is now live and Q4 revenue is forecast at 5.1m. The board is asked to approve an extra 120k for recruitment to staff the Leeds contract.

        We thank everyone for their hard work this quarter.
    assert:
      - {type: llm-rubric, value: "Recommends a bottom-line-first opening for the board (revenue below budget because of the late Leeds start, recovery forecast, and the 120k approval request) rather than a dramatic hook; ending states the decision requested; uses the report's figures accurately."}
  - name: negative-needs-missing-fact
    vars:
      purpose_and_reader: "Personal essay for a university application"
      draft: |
        I have always wanted to study engineering. I like solving problems and building things. At school I was in the robotics club and we built a robot for a competition. I learned a lot about teamwork. In conclusion, engineering is the right subject for me.
    assert:
      - {type: llm-rubric, value: "Does not invent a vivid anecdote about the robot or the competition (results, failures, names) for the opening; uses [ADD] markers or asks the writer for a specific real moment; may show the shape of an opening built on that moment."}
