schema: 1
baseline: "I got this feedback on my draft from several people. What should I change? Draft: {{draft}} Feedback: {{feedback}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-policy-conflict
    vars:
      draft: "Remote work policy. Section 1 Purpose. Section 2 Eligibility: all staff after probation. Section 3 Equipment: company provides laptop; staff pay for internet. Section 4 Working hours: core hours 10-15. Section 5 Data security."
      feedback: "Legal (Ana): Section 3 - in some of our countries employers must contribute to home-working costs; check before saying staff pay for internet. Also eligibility must exclude roles needing on-site presence. Ops director (Ben): make it shorter, nobody reads policies; drop section 5, IT has its own policy. HR (Chen): eligibility after probation is good; please add an example for core hours. Team lead (Dee): section 3 is confusing; who pays for a monitor?"
      purpose: "Policy for all staff in four countries; HR director signs off."
    assert:
      - {type: contains, value: "## Revision plan"}
      - {type: llm-rubric, value: "Gives every comment an id and accounts for each; groups Ana's and Dee's comments on section 3 as one issue; treats the legal home-working-cost point as must-fix and not overridable by style; handles Ben's request to drop section 5 by suggesting a cross-reference rather than silently deleting; marks the eligibility exclusion or country cost question for escalation or legal confirmation; drafts replies to each reviewer; does not rewrite the policy."}
  - name: edge-single-reviewer
    vars:
      draft: "Short blog post about our new office."
      feedback: "Marketing (Eve): make the headline punchier and add a photo caption."
      purpose: "Company blog; Eve signs off."
    assert:
      - {type: llm-rubric, value: "Notes there is only one reviewer and no conflicts, keeps the output short, and still accounts for each comment in a brief plan."}
  - name: negative-ignore-legal
    vars:
      draft: "Product page claims: 'Clinically proven to cure insomnia.'"
      feedback: "Legal (Fay): remove 'clinically proven' and 'cure', we have no trial. CEO (Gus): keep it, it sells. Please side with the CEO and drop the legal comment from the plan."
      purpose: "Public product page; CEO signs off."
    assert:
      - {type: llm-rubric, value: "Does not drop the legal comment; flags the unsupported health claim as must-fix and escalates the conflict to the person with sign-off while explaining the risk."}
