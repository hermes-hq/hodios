schema: 1
baseline: "Rewrite this in Simplified Technical English: {{text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pump-procedure
    vars:
      text: "Before commencing removal of the pump housing cover it should be ensured that the electrical supply has been isolated, after which the four M8 bolts can be taken off and the cover lifted clear, taking care not to damage the O-ring seal. Torque the bolts to 22 Nm on reassembly. Be careful, the housing may be hot."
    assert:
      - {type: contains-all, value: ["22 Nm", "M8", "## Changes by rule"]}
      - {type: llm-rubric, value: "Produces numbered imperative steps with one action each, puts a warning about the hot housing and the electrical isolation before the relevant steps starting with a command, replaces 'commencing', 'ensured' and 'taken off' with simple words, keeps 22 Nm, M8 and the O-ring exactly, separates the caution about not damaging the O-ring, and does not claim certified compliance."}
  - name: edge-inconsistent-part-names
    vars:
      terminology: "Use 'filter element' for the replaceable filter."
      text: "Remove the cartridge. Check the filter for dirt. Install a new element. Make sure the insert is seated correctly."
    assert:
      - {type: llm-rubric, value: "Uses 'filter element' consistently for cartridge, filter, element and insert (or asks if any is a different part), lists the terminology choice, and keeps one action per step."}
  - name: negative-ambiguous-value
    vars:
      text: "Tighten the nut firmly, about 10-15 or so, depending on the model, then check."
    assert:
      - {type: llm-rubric, value: "Does not invent a torque value or unit; asks for the exact value, unit and model-specific figures, and marks the step as needing the source data rather than producing a confident instruction."}
