schema: 1
baseline: "Format this document so it's easy to scan, in {{output_format}}: {{document}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-policy-wall-of-text
    vars:
      output_format: markdown
      document: |
        From 1 November, all travel must be booked through the TravelDesk portal at least 14 days before departure. To book, first get your manager's approval in writing, then log in to TravelDesk and enter the trip details, then attach the approval and submit. Economy class is required for flights under 6 hours; premium economy is allowed for flights over 6 hours; business class needs director approval. Hotels are capped at 180 euros a night in capital cities and 130 euros elsewhere. Meals are reimbursed up to 45 euros a day with receipts. Claims must be submitted within 30 days of return or they will not be paid. Questions go to travel@example.com.
    assert:
      - {type: contains-all, value: ["14 days", "180", "130", "45", "30 days", "travel@example.com", "Summary:"]}
      - {type: llm-rubric, value: "Adds short headings, turns the booking steps into a numbered list, presents flight classes and/or allowances as a table or list, keeps every fact and the original order, adds a one-line summary, and logs wording changes limited to joins, labels and the summary."}
  - name: edge-word-style-output
    vars:
      output_format: word-style
      document: "Team offsite plan. Day one is in Lisbon on 12 May: arrive by 11, workshop 1-5, dinner at 8. Day two is 13 May: strategy session 9-12, free afternoon, flights home from 6. Bring laptops and chargers. Budget per person is 600 euros including flights."
    assert:
      - {type: llm-rubric, value: "Labels blocks with Word style names in square brackets such as [Heading 1] and [List Bullet], presents the two days as headings or a [Table] with a header row, keeps all times, dates, the 600 euro budget and the packing list, and does not change wording beyond joins and labels."}
  - name: negative-too-short-to-structure
    vars:
      output_format: markdown
      document: "Hi all, the kitchen will be closed on Thursday for cleaning. Please take your food out of the fridge by Wednesday 5pm."
    assert:
      - {type: llm-rubric, value: "Recognises the text is short and needs little or no structure; does not add multiple headings or tables; at most adds a summary line or bolds the deadline; keeps the wording."}
