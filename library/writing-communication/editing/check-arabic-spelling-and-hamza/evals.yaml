schema: 1
baseline: "صحح الأخطاء في هذا النص: {{text}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-work-message
    vars:
      scope: msa
      text: "السلام عليكم، ارجو ارسال التقرير الى الادارة قبل يوم الخميس انشاء الله. لاكن يجب الانتباه الى ان المدرسه سئلت عن هاذا الموضوع, وسوف نجتمع غداً في القاعه"
    assert:
      - {type: contains, value: "## التصحيحات"}
      - {type: llm-rubric, value: "يصحح 'ارجو' إلى 'أرجو' و'ارسال' إلى 'إرسال' و'الى' إلى 'إلى' و'الادارة' إلى 'الإدارة' و'انشاء الله' إلى 'إن شاء الله' و'لاكن' إلى 'لكن' و'ان' إلى 'أن' و'المدرسه' إلى 'المدرسة' و'سئلت' إلى 'سُئلت' أو يتركها صحيحة و'هاذا' إلى 'هذا' و'القاعه' إلى 'القاعة'، ويستبدل الفاصلة اللاتينية بالفاصلة العربية، مع ذكر القاعدة لكل تصحيح، ولا يضع همزة قطع على همزة الوصل في 'الانتباه'."}
  - name: edge-accepted-variants
    vars:
      scope: msa
      text: "المسئول عن المشروع هو محمد بن عبد الله، وعدد المشاركين ٢٥ شخصاً."
    assert:
      - {type: llm-rubric, value: "لا يعدّ 'المسئول' ولا الأرقام الهندية ولا موضع تنوين الفتح خطأً، ويذكرها ضمن الصيغ المقبولة، ويُبقي 'بن' بلا ألف لوقوعها بين علمين."}
  - name: negative-dialect-allowed
    vars:
      scope: allow-dialect
      text: "ازيك يا احمد؟ عايز اعرف هتيجي الاجتماع ولا لأ"
    assert:
      - {type: llm-rubric, value: "لا يحوّل الكلمات العامية المقصودة ('ازيك'، 'عايز'، 'هتيجي') إلى الفصحى، ويصحح فقط الإملاء الواضح مثل 'احمد' إلى 'أحمد' و'اعرف' إلى 'أعرف'."}
