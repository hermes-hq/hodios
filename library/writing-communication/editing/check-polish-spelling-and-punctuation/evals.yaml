schema: 1
baseline: "Popraw błędy w tym tekście: {{text}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-email
    vars:
      register: formal
      text: "Dzień dobry, wczoraj poszłem do biura żeby wziąść dokumenty ale niestety nie były gotowe. Myśle że trzeba będzie przesunąć spotkanie na Poniedziałek, i omówić tą sprawę jeszcze raz."
    assert:
      - {type: contains, value: "## Poprawki"}
      - {type: llm-rubric, value: "Poprawia „poszłem” na „poszedłem”, „wziąść” na „wziąć”, „Myśle” na „Myślę”, „Poniedziałek” na „poniedziałek”, „tą sprawę” na „tę sprawę”, dodaje przecinki przed „żeby”, „ale” i „że”, usuwa przecinek przed pojedynczym „i”, i przy każdej poprawce podaje krótką zasadę."}
  - name: edge-participle-and-residents
    vars:
      register: formal
      text: "Raport jest nie przeczytany przez zarząd. Na spotkanie przyjechali warszawiacy i krakowianie."
    assert:
      - {type: llm-rubric, value: "Zgodnie z zasadami obowiązującymi od 2026 r. poprawia „nie przeczytany” na „nieprzeczytany” oraz nazwy mieszkańców miast na „Warszawiacy” i „Krakowianie”, wyjaśniając, że to zmiany zasad pisowni."}
  - name: negative-informal-and-correct
    vars:
      register: informal
      text: "Nie wiem, czy dam radę przyjść. Kupiłam chleb i mleko."
    assert:
      - {type: llm-rubric, value: "Nie wprowadza zbędnych zmian ani przecinka przed „i”, stwierdza, że tekst jest poprawny, i nie zmienia stylu."}
