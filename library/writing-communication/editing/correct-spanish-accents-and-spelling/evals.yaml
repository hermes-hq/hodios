schema: 1
baseline: "Corrige la ortografía de este texto: {{texto}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-email
    vars:
      texto: "Hola profesora, le escribo porque no entendi porque me puso esa calificacion. Habian muchas preguntas que si conteste bien, a ver si me puede decir cuando podemos hablar. Gracias"
      variante: es-MX
    assert:
      - {type: contains, value: "## Correcciones"}
      - {type: llm-rubric, value: "Corrige « entendi » por « entendí », el segundo « porque » por « por qué », « calificacion » por « calificación », « Habian » por « Había », « si conteste » por « sí contesté », « cuando » por « cuándo », añade la coma del vocativo « Hola, profesora », y explica cada regla brevemente sin reescribir el estilo."}
  - name: edge-argentine-voseo
    vars:
      texto: "Che, vos sabes si mañana tenes que ir a la oficina? Avisame asi me organizo."
      variante: es-AR
    assert:
      - {type: llm-rubric, value: "Mantiene el voseo y corrige « sabes » por « sabés », « tenes » por « tenés », « asi » por « así », añade el signo de apertura « ¿ » y la coma tras « Che », sin cambiar « vos » por « tú »."}
  - name: negative-accepted-variant
    vars:
      texto: "A Juan le vi ayer en el parque. Solo quería saludarle."
      variante: es-ES
    assert:
      - {type: llm-rubric, value: "No marca como error el leísmo « le vi » / « saludarle » referido a un hombre en es-ES, sino que lo anota como variante aceptada, y no añade tilde a « Solo »."}
