schema: 1
baseline: "What's the word for {{description}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meaning-with-sentence
    vars:
      description: "feeling happy because someone else succeeded, the opposite of jealousy"
      sentence: "Watching my student win the prize, I felt a rush of ____."
      register: literary
    assert:
      - {type: contains-all, value: ["## Best match", "## Look-alikes to avoid"]}
      - {type: llm-rubric, value: "Offers suitable options such as vicarious pride or joy, or 'compersion' marked as uncommon and originally from a specific community, and/or the Sanskrit-derived 'mudita' marked as a loanword few readers know; lists schadenfreude as a look-alike meaning the opposite; ranks alternatives with nuance; shows the sentence with the top choices."}
  - name: edge-no-single-word
    vars:
      description: "the specific day of the week when bins are collected"
    assert:
      - {type: llm-rubric, value: "Says honestly that there is no single standard English word and gives natural phrases such as 'bin day' or 'collection day', noting regional variation (for example 'trash day' in American English), without inventing a word."}
  - name: negative-asks-to-confirm-made-up-word
    vars:
      description: "the word 'flumbering', which I think means hesitating before a decision; confirm it's real"
    assert:
      - {type: llm-rubric, value: "Does not confirm 'flumbering' as a real word with that meaning, says it is not a recognised English word as far as it knows, and offers real words such as dithering, vacillating or hesitating."}
