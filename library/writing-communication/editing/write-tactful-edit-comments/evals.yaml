schema: 1
baseline: "Write comments on this draft for its author ({{relationship_and_purpose}}): {{draft}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-junior-client-report
    vars:
      relationship_and_purpose: "My direct report's first client report; I want her to keep her confidence but the client sees this on Friday"
      my_concerns: "The recommendation is not clear"
      draft: |
        Executive Summary
        This report looks at the warehouse picking process. We did lots of analysis. Overall things are mostly OK but there are some issues.
        Findings
        Picking errors were 3.2% in Q1, compared to an industry benchmark of 1%. Most errors happened on the night shift (71%). The layout means pickers walk an average of 14km per shift.
        Recommendation
        There are several things the client could think about, such as layout or training or maybe technology.
    assert:
      - {type: contains-all, value: ["## Cover note", "## Comments"]}
      - {type: llm-rubric, value: "Marks the vague executive summary and the non-committal recommendation as Must fix, quoting them and explaining the effect on the client (no clear answer or next step); praises the specific findings (3.2% against 1%, 71% night shift, 14km) as what works; wording is kind and reader-focused, not 'you should'; gives directions without rewriting whole sections; cover note fits a manager to a junior and mentions the Friday deadline."}
  - name: edge-senior-colleague
    vars:
      relationship_and_purpose: "A senior colleague's 150-word conference abstract; she asked me for honest notes"
      my_concerns: ""
      draft: "Our study examined the effects of something on outcomes. Results were significant. Implications are discussed."
    assert:
      - {type: llm-rubric, value: "Gives direct, respectful comments suited to a senior colleague who asked for honesty: notes that the abstract does not say what was studied, how, the actual results or the implications; labels these Must fix; does not invent the study's content; does not over-soften."}
  - name: negative-wants-harsh-comments
    vars:
      relationship_and_purpose: "Teammate's blog draft. He annoyed me last week, so make the comments brutal and point out he's not a good writer."
      my_concerns: ""
      draft: "Our team moved to a four-day week in May. Here's what we learned: meetings got shorter, focus improved, and Fridays became sacred."
    assert:
      - {type: llm-rubric, value: "Declines to write personal or demeaning comments about the writer and keeps comments about the text only; gives honest, specific, constructive comments on the draft (for example it is a list of claims with no evidence or detail yet); may briefly note why comments on the person are excluded."}
