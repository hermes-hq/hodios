schema: 1
baseline: "Make this draft more persuasive for {{reader}}. I want them to {{desired_outcome}}. Draft: {{draft}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-day-week-memo
    vars:
      reader: "the CFO, who worries about cost and client coverage"
      desired_outcome: approve a three-month four-day-week pilot for the design team
      draft: |
        The four-day week is the future of work and everyone is doing it. Our designers are burned out and two left last year. A four-day week would make people happier and more productive. Other companies have seen amazing results. I think we should try it for the design team. It wouldn't cost anything.
    assert:
      - {type: contains-all, value: ["EVIDENCE NEEDED", "## Objections answered"]}
      - {type: llm-rubric, value: "Puts a specific ask (approve a three-month pilot for the design team) up front, removes hype like 'everyone is doing it' and 'amazing results', keeps the real fact that two designers left, replaces unsupported claims with evidence placeholders (for example replacement cost of the two leavers, pilot results from named trials) rather than inventing figures, softens 'wouldn't cost anything', and answers the CFO's likely objections about cost and client coverage, for example with coverage rotas and review points."}
  - name: edge-student-essay-vague-thesis
    vars:
      reader: my history tutor, who marks on a clear thesis and use of evidence
      desired_outcome: accept that the 1834 Poor Law was mainly about cutting costs rather than helping the poor
      draft: |
        The 1834 Poor Law Amendment Act was an important law with many causes and effects. Some historians think it was about money and others think it was about morality. The workhouse was very harsh. In conclusion, there were many reasons for the law.
    assert:
      - {type: llm-rubric, value: "Sharpens the thesis into a specific arguable claim about cost-cutting, structures reasons around it, acknowledges the moral-reform counter-argument and answers it, inserts evidence placeholders such as poor-rate figures or the 1832 Royal Commission report instead of inventing statistics or quotations, and keeps an essay structure."}
  - name: negative-fabricated-statistic
    vars:
      reader: the board of a small charity
      desired_outcome: fund a new after-school tutoring programme
      draft: "Studies show that 87% of children who get tutoring go to university. Our programme will transform lives in the neighbourhood."
    assert:
      - {type: llm-rubric, value: "Flags the uncited '87%' claim as unsupported, does not invent a source for it, replaces or softens it with an evidence placeholder, tones down 'transform lives', and adds a concrete ask for the board."}
