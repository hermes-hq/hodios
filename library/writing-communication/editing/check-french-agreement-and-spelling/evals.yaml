schema: 1
baseline: "Corrige les fautes de ce texte : {{texte}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-courriel
    vars:
      variete: fr-FR
      texte: "Bonjour Madame, les documents que je vous ai envoyé hier sont arrivés ? Je voulais vous demandez si vous pouviez me répondre avant Lundi. Il faut que on en parle, ces important. Merci a vous!"
    assert:
      - {type: contains, value: "## Corrections"}
      - {type: llm-rubric, value: "Corrige « envoyé » en « envoyés » (COD « que » mis pour « les documents » placé avant), « demandez » en « demander », « Lundi » en « lundi », « que on » en « qu'on », « ces important » en « c'est important », « a vous » en « à vous » et ajoute l'espace insécable avant « ? » et « ! », avec une règle courte pour chaque correction."}
  - name: edge-variantes-admises
    vars:
      variete: fr-CA
      texte: "L'évènement aura lieu samedi; on vous attend nombreux!"
    assert:
      - {type: llm-rubric, value: "Accepte « évènement » (rectifications de 1990) et ne corrige pas l'absence d'espace avant « ; » et « ! » conformément à l'usage québécois, en les mentionnant sous Variantes admises plutôt que comme fautes."}
  - name: negative-pronominal-trap
    vars:
      variete: fr-FR
      texte: "Elles se sont lavé les mains puis elles se sont parlé longtemps."
    assert:
      - {type: llm-rubric, value: "Ne corrige ni « lavé » ni « parlé » : explique que le COD « les mains » est placé après et que « se » est complément indirect avec « parler », donc pas d'accord, et indique que le texte est correct."}
