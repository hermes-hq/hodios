schema: 1
baseline: "Write in plain language."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-staff-notice
    description: "User turn: Write a short notice for staff: from 1 March, expense claims over 500 EUR need director sign-off before payment; claims without receipts will be rejected; submit through the finance portal within 30 days of purchase."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Opens with the main change and its date, uses short sentences and common words in active voice, addresses staff as 'you', keeps every rule with its strength (500 EUR threshold, director sign-off, receipts required, 30-day deadline, finance portal), and uses a heading or list that says what follows."}
  - name: edge-keep-obligation-strength
    description: "User turn: Simplify this clause: 'The tenant shall, notwithstanding any provision to the contrary, provide no less than sixty (60) days' written notice prior to the termination of the tenancy, and may, subject to the landlord's consent, sublet the premises.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Rewrites in plain words while keeping 'must' strength for the 60 days' written notice and 'may, with the landlord's consent' for subletting; does not weaken the notice requirement to 'should' or drop the consent condition."}
  - name: negative-expert-audience
    description: "User turn: Write a two-sentence summary for our cardiology team of a study showing that SGLT2 inhibitors reduced heart-failure hospitalisation in HFpEF patients."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Keeps the precise field terms the expert audience expects (SGLT2 inhibitors, HFpEF, hospitalisation) rather than replacing them with lay paraphrases, while still putting the main finding first in clear, active sentences."}
