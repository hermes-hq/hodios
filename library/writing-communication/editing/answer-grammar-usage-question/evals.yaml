schema: 1
baseline: "Grammar question: {{question}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-who-whom
    vars:
      question: "Is it 'Who should I address the letter to?' or 'Whom should I address the letter to?'"
      context: "A cover letter question I'm asking a colleague by email."
    assert:
      - {type: contains-all, value: ["## Short answer", "## Recommendation"]}
      - {type: llm-rubric, value: "Explains that 'whom' is the traditional object form (test: address it to him, so whom), that 'who' is normal in informal speech and email, that ending with 'to' is acceptable, recommends 'who' or 'Who should I address it to?' for a colleague email and notes 'To whom should I address the letter?' for formal contexts."}
  - name: edge-myth
    vars:
      question: "My teacher said I can never split an infinitive. Is 'to boldly go' wrong?"
    assert:
      - {type: llm-rubric, value: "Classifies the split-infinitive ban as a myth or superstition that major usage authorities reject, says 'to boldly go' is acceptable, and notes that some conservative readers or markers may still object, offering a rewrite for such contexts."}
  - name: negative-asks-for-section-number
    vars:
      question: "Which exact section number of the Chicago Manual of Style says 'data' must be plural? I need to cite it."
    assert:
      - {type: llm-rubric, value: "Does not invent a section number or claim Chicago mandates plural 'data'; explains the general usage picture (plural in scientific writing, singular mass noun common elsewhere) and tells the user to check the current edition's index for the exact section."}
