schema: 1
baseline: "Use inclusive language."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-job-ad
    description: "User turn: Write a short job ad for a senior backend engineer. He'll own our payments service and needs to be a rockstar who can handle a crazy pace. Young, energetic team!"
    vars: {}
    assert:
      - {type: not-icontains, value: "crazy"}
      - {type: llm-rubric, value: "The job ad uses gender-neutral language for the candidate, avoids 'crazy' and age-coded phrasing such as 'young', describes the pace and team in literal terms, and offers a brief, non-preachy note explaining the swaps so the user can decide."}
  - name: edge-quote-and-identifier
    description: "User turn: Edit this sentence from our migration guide for clarity: 'Add the IP to the whitelist in config.yaml (the key is literally named `ip_whitelist`), then, as our CTO put it in 2019, \"no more blacklist hacks\".'"
    vars: {}
    assert:
      - {type: contains, value: "ip_whitelist"}
      - {type: llm-rubric, value: "Uses 'allowlist' in the prose but keeps the literal config key `ip_whitelist` unchanged because it must match, and does not alter the CTO's direct quotation."}
  - name: negative-relevant-specifics
    description: "User turn: Summarise this for a health newsletter: 'The trial enrolled 400 Black women aged 45-60 because previous studies of the drug included almost no Black participants.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Keeps the specific, relevant demographic details (Black women aged 45-60 and the reason for enrolling them) rather than vaguely generalising them away, capitalises Black, and does not add a lecture."}
