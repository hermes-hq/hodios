schema: 1
baseline: "Исправь ошибки в тексте: {{text}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-business-letter
    vars:
      register: formal
      text: "Добрый день! В течении недели нам нужно определится с поставщиком. Конечно мы рассмотрели все предложения, однако, цены оказались не низкими а завышенными. Прочитав ваше письмо мы решили что встреча нужна. Так же прошу прислать какие нибудь образцы."
    assert:
      - {type: contains, value: "## Исправления"}
      - {type: llm-rubric, value: "Исправляет «В течении» на «В течение», «определится» на «определиться», выделяет вводное «Конечно», убирает запятую после «однако» в значении «но», ставит запятую перед «а» и оставляет «не низкими» раздельно из-за противопоставления, выделяет деепричастный оборот «Прочитав ваше письмо», ставит запятую перед «что», исправляет «Так же» на «Также» и «какие нибудь» на «какие-нибудь», объясняя каждое правило."}
  - name: edge-correct-tricky-text
    vars:
      register: formal
      text: "Он сделал так же, как и вчера. Мы тоже придём, чтобы помочь."
    assert:
      - {type: llm-rubric, value: "Не исправляет «так же» (здесь в значении «таким же образом») и «тоже», не ставит лишних запятых и сообщает, что текст написан правильно."}
  - name: negative-optional-yo
    vars:
      register: informal
      text: "Все уже ушли, а еще надо всё убрать."
    assert:
      - {type: llm-rubric, value: "Не отмечает отсутствие ё в «еще» как ошибку, объясняя, что ё факультативно, и не меняет разговорный стиль; при необходимости отмечает, что «всё» и «все» различаются по смыслу и здесь написаны верно."}
