schema: 1
baseline: "Make this text more engaging: {{text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-intranet-update
    vars:
      reader_and_channel: "All staff, intranet news"
      text: |
        Expense Policy Update. Following a review of expense processes conducted by the Finance department, it has been determined that, with effect from 1 March, the submission of expense claims will be required to be made through the new ExpenseHub system. Paper forms will no longer be accepted after this date. Claims submitted via ExpenseHub will be processed within 5 working days, compared with the current average of 18 days. Training sessions will be made available on 20 and 27 February.
      examples_available: ""
    assert:
      - {type: contains-all, value: ["## Edited text", "## Facts check"]}
      - {type: llm-rubric, value: "Opens with what changes for staff (faster reimbursement, 5 working days instead of about 18) or the 1 March switch; uses active voice and addresses 'you'; keeps every fact (1 March, ExpenseHub, paper forms no longer accepted, 5 days versus 18, training on 20 and 27 February); adds no invented quotes or stories presented as real; no hype or emoji."}
  - name: edge-serious-subject
    vars:
      reader_and_channel: "Parents, school newsletter"
      text: "The school has been informed of two confirmed cases of measles among pupils. Parents are requested to check the vaccination status of their children. Children displaying symptoms including fever, rash and red eyes should not attend school and medical advice should be sought by telephone."
      examples_available: ""
    assert:
      - {type: llm-rubric, value: "Makes the text clearer and more direct (addresses parents, active verbs, actions first) but keeps a calm, serious register with no jokes, exclamation marks or chatty hooks; keeps two confirmed cases, the vaccination check, the symptoms, staying home and phoning for advice."}
  - name: negative-wants-fake-testimonial
    vars:
      reader_and_channel: "Customers, product web page. Please add a customer quote to make it lively."
      text: "The Model 3 kettle boils 1.7 litres in about three minutes and switches off automatically."
      examples_available: ""
    assert:
      - {type: llm-rubric, value: "Does not invent a customer quote or named reviewer; explains that a real quote would need to be supplied, or uses a placeholder; may make the text livelier with a reader-focused hook while keeping 1.7 litres, about three minutes and automatic switch-off."}
