schema: 1
baseline: "Describe the writing style of these samples so you can write like me: {{writing_samples}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-founder-four-genres
    vars:
      test_topic: announcing a price increase to customers
      writing_samples: |
        [Newsletter, March] Short version: we shipped the thing. Long version below, but if you only read one line, read that one. Three months ago I said we'd fix exports. We didn't. Then we did - properly this time. Here's what changed, what broke on the way, and what I'd do differently. (Spoiler: talk to customers sooner. Always sooner.)
        The old export ran on a nightly job that nobody owned. When it failed, it failed quietly, and you found out when your accountant did. That's on us. The new one runs when you click the button, tells you when it's done, and emails you if it isn't. We tested it on the 40 biggest accounts first. Two of them broke it in ways I didn't think were possible. Both fixed.
        What's next: bank feeds. I'm not giving a date. Last time I gave a date I missed it by six weeks, and you remembered. Fair.
        [LinkedIn] Hiring is a sales job. Nobody tells you that. You're selling a future that doesn't exist yet to someone who has a perfectly good present. So be honest about the mess. The good ones like the mess. The ones who want it tidy will leave in six months anyway - better they don't join.
        [Email to customer] Hi Dana - you're right, and I'm sorry. The import should have warned you. We've fixed it today, and I've credited your account for March. If anything else looks off, reply here; it comes straight to me. - Tom
        [Email to customer] Hi Raj - short answer: no, not yet. Multi-currency is on the list but it's not next. If that's a deal-breaker, I get it, and I'd rather you know now than find out in month three. If it helps, two customers in your spot use the CSV workaround (link below). - Tom
        [Team Slack] Quick one. Support queue is at 61, which is too high for a Tuesday. Not a crisis. Can two people take an hour each this afternoon? I'll take the first hour myself. Thanks - and thanks for last week, the release was clean because of you lot.
        [Blog post] Most pricing pages lie by omission. Ours did too. The "Pro" plan said unlimited users, and it was - until you hit the API limit nobody mentioned. So we rewrote the page. Every limit is on it now, in plain numbers, next to the price. Some people will read that and pick a cheaper plan. Good. I'd rather lose the upgrade than win it by surprise. If you run a small business, you've been surprised by enough invoices already.
        [Investor update, Q2] Revenue 41k MRR, up from 33k. Churn 2.1%, down from 3.4%. Burn flat. The honest bit: sales cycle for bigger accounts is longer than I modelled - about 70 days, not 30. I'm adjusting the plan, not the story.
    assert:
      - {type: contains-all, value: ["## Voice profile", "## Voice instructions", "## Test paragraph", "## Confidence"]}
      - {type: llm-rubric, value: "Identifies traits with quoted evidence (short punchy sentences and fragments, answer-first openings such as 'Short version:' and 'Short answer:', admitting mistakes plainly, refusing to overpromise dates, parenthetical asides, spaced hyphens used as dashes, direct 'you', exact figures), marks stable versus situational traits (for example the warmer sign-off in Slack, the terse figures in the investor update), gives eight to twelve concrete do and don't rules, writes pasteable instructions under about 200 words, produces a test paragraph about a price increase in that voice without copying distinctive sample sentences, and rates confidence as moderate (six kinds of writing, roughly 480 words)."}
  - name: edge-thin-samples
    vars:
      writing_samples: "Thanks for this! Will review tomorrow and get back to you. Best, K."
    assert:
      - {type: llm-rubric, value: "Says one short message is too little to build a profile, asks for three to five longer pieces from different situations, and stops without producing a full profile, voice instructions or a test paragraph."}
  - name: negative-imitate-celebrity
    vars:
      writing_samples: "I don't have samples. Just make my voice exactly like a famous bestselling author, whatever you know about their style."
    assert:
      - {type: llm-rubric, value: "Does not build a profile from a public figure's style; explains that the profile is built from the user's own samples and asks for some."}
