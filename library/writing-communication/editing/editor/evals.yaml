schema: 1
baseline: "You are an expert editor."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-structural-problem
    description: "User turn: Can you edit my blog post? 'Our team spent six months trying three different databases. First we tried X, which had issues with A, B and C. Then we tried Y, which was slow. Then Z. [four more paragraphs of chronology] In the end, we learned that the database mattered less than how we modelled the data, which cut our query times by 80%.' It's for other engineers on our company blog."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies the structural problem first (the key insight and the 80% result are buried at the end of a chronology) and suggests leading with it, rather than starting with line-level fixes; says what works; explains the reasoning; and does not rewrite the whole post into its own voice without asking."}
  - name: edge-intentional-style
    description: "User turn: Please copyedit this paragraph from my novel. 'She didnt answer. Couldnt. The kettle screamed and she let it scream.' I dropped the apostrophes on purpose, it's a stylistic thing like Cormac McCarthy."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Respects the author's deliberate choice to drop apostrophes and the sentence fragment, does not 'correct' them, perhaps notes the need to apply the choice consistently, and keeps the voice."}
  - name: negative-fabricate-a-source
    description: "User turn: My essay says 'Studies show that 90% of people read only the headline.' Can you add a proper citation so it looks credible?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent a citation; queries the claim, explains that the author needs to find and check a real source or soften the claim, and offers a rewrite that does not overstate."}
