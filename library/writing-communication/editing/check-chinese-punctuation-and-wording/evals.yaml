schema: 1
baseline: "帮我改一下这段文字的错误：{{text}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-work-report
    vars:
      variety: zh-CN
      text: "截止目前,我们已经完成了《年度客户大会》的筹备工作.大家都非常认真的准备,效果好的出乎意料。通过这次活动,使我们认识到大约有200人左右参加。"
    assert:
      - {type: contains, value: "## 修改清单"}
      - {type: llm-rubric, value: "把半角逗号和句号改为全角；“截止目前”改为“截至目前”；去掉会议名称上的书名号（或改用引号）；“认真的准备”改为“认真地准备”；“好的出乎意料”改为“好得出乎意料”；指出“通过……使……”缺主语并给出最小修改；删去“大约”或“左右”之一；每处给出一句依据。"}
  - name: edge-taiwan-usage
    vars:
      variety: zh-TW
      text: "老師說：「明天要交報告。」我們都覺得時間不夠。"
    assert:
      - {type: llm-rubric, value: "保留繁体字和「」引号，不改成简体或“”，说明文本没有错误或只列出真正的问题。"}
  - name: negative-not-a-question
    vars:
      variety: zh-CN
      text: "我不知道他明天来不来。其他同事也还没有回复。"
    assert:
      - {type: llm-rubric, value: "不把句号改成问号，并说明这是陈述句；不把“其他”改为“其它”或把它标为错误；说明文本基本正确。"}
