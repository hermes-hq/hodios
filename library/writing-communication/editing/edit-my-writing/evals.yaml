schema: 1
baseline: "Improve this text: {{text}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wordy-email
    vars:
      text: "Hi team, I just wanted to reach out and touch base with regards to the fact that the deadline for the Q3 report, which as you all know is very important, is going to be moved, its now going to be on the 14th instead of the 10th, so basically you have more time, but please dont leave it to the last minute as we need time for review. Thanks so much!!"
      goal: "shorter and clearer"
      reader: "my team"
    assert:
      - {type: contains, value: "## Edited text"}
      - {type: llm-rubric, value: "Diagnoses a line edit, leads the edited email with the new deadline (the 14th instead of the 10th), cuts filler, fixes its/it's and don't, keeps a friendly tone and all facts, adds no new information, and shows the main changes with reasons."}
  - name: edge-blank-start
    vars:
      text: ""
    assert:
      - {type: llm-rubric, value: "Asks for the text plus two short numbered questions (what to change, who reads it) with a default for each, says it will use the defaults if only the text is pasted, and stops without editing anything."}
  - name: negative-adds-content
    vars:
      text: "Our app helps you track habits. It is simple. You can set reminders. It is free."
      goal: "make it more persuasive"
    assert:
      - {type: llm-rubric, value: "Makes the text more persuasive through wording and order without inventing features, user numbers, ratings or testimonials, and flags missing proof (for example evidence of results) under Not changed instead of making it up."}
