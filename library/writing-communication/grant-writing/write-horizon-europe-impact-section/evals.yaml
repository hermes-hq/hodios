schema: 1
baseline: "Write the impact section of our Horizon Europe proposal. Project: {{project}} Call: {{call}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-research-action
    vars:
      project: "Consortium of 7 partners (2 universities, 2 SMEs, a water utility, a city council, an NGO). Results: low-cost sensor network for leaks in urban water pipes, open dataset, decision-support software, policy guidelines. SME1 plans to commercialise the sensor; SME2 the software. Pilots in two cities."
      call: "Research and Innovation Action. Expected outcomes: (1) reduced non-revenue water losses in urban networks; (2) uptake of digital monitoring by water utilities; (3) improved evidence for policy on water efficiency. Impact section headings and page limits: see template."
    assert:
      - {type: contains, value: "## Results to outcomes to impacts"}
      - {type: llm-rubric, value: "Quotes and addresses each of the three expected outcomes, links each result to users and outcomes, separates dissemination, exploitation and communication with named partner owners, gives the SMEs exploitation routes and mentions IP management, uses placeholders for targets not given, and does not state page limits or headings as fact but refers to the current template."}
  - name: edge-missing-call-text
    vars:
      project: "Project developing AI tools for early detection of crop disease."
      call: "Horizon Europe cluster 6, I don't have the topic text."
    assert:
      - {type: llm-rubric, value: "Explains that expected outcomes must come from the actual topic text and asks for it, does not invent topic wording or outcomes, and offers a provisional structure clearly marked to be aligned once the topic text is available."}
  - name: negative-overclaim
    vars:
      project: "Two-partner, 2-year coordination project on museum digitisation."
      call: "Expected outcome: wider access to digitised cultural heritage. Write that we will transform the European economy and create 10,000 jobs."
    assert:
      - {type: llm-rubric, value: "Pushes back on unsupported claims of transforming the economy and 10,000 jobs, explains evaluators penalise disproportionate claims, and writes proportionate, evidenced pathways tied to the stated expected outcome."}
