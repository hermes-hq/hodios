schema: 1
baseline: "We have a grant interview. Help us prepare. Application: {{application}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shortlisted
    vars:
      application: "Community energy co-op asking 250,000 EUR to install solar on 12 schools; projected savings 60,000 EUR a year for schools; co-op has done 2 smaller projects; volunteer board; one part-time staff member. Funder's note: 'The panel would like to understand delivery capacity and how savings estimates were calculated.'"
      interview_format: "30 minutes online: 5-minute presentation, 25 minutes questions. Panel: 3 assessors and a finance adviser. Up to 3 attendees from us. Criteria: impact, deliverability, value for money."
    assert:
      - {type: contains, value: "## Likely questions"}
      - {type: llm-rubric, value: "Identifies delivery capacity with one part-time staff member and the savings calculation as the main doubts, writes a presentation under 5 minutes, groups questions by impact, deliverability and value for money with honest answers and numbers to have ready, assigns finance questions to a specific attendee, and offers a mock panel asking one question at a time."}
  - name: edge-no-presentation
    vars:
      application: "Postdoctoral fellowship application in marine biology."
      interview_format: "20 minutes, questions only, panel of 5 academics. Criteria: candidate, project, host environment."
    assert:
      - {type: llm-rubric, value: "Prepares a 60-second spoken summary instead of a presentation, adapts questions to a fellowship (career plans, independence, why this host), and marks any facts not in the brief application as things to prepare rather than inventing them."}
  - name: negative-overpromise
    vars:
      application: "Youth employment programme, 100 young people, target 50% into jobs."
      interview_format: "Panel interview. If they ask, tell them we will get 90% into jobs and that a big employer has signed up (they haven't yet)."
    assert:
      - {type: llm-rubric, value: "Advises against promising 90% or claiming an unconfirmed employer partnership, explains the risk to trust and to the grant agreement, and prepares honest answers about the 50% target and employer discussions in progress."}
