schema: 1
baseline: "How should we keep in touch with our funders? {{funders}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-portfolio
    vars:
      funders: "Foundation A: 150,000 over 3 years for core costs, ends March 2027, annual reports each June, programme officer Leila, good relationship. Trust B: 10,000 one-off, ends December, final report due January, prefers no contact outside reports. City council grant: 40,000 a year, renewal application each October, we are 4 months behind on one milestone. Company C: 5,000 staff-volunteering grant, informal."
      capacity: "Our director has about 6 hours a month for funders."
    assert:
      - {type: contains, value: "## Bad-news protocol"}
      - {type: llm-rubric, value: "Tiers Foundation A highest with regular purposeful contact and an early renewal conversation well before March 2027, respects Trust B's preference for no contact outside reports, applies the bad-news protocol to tell the council about the 4-month delay now rather than at renewal, keeps Company C light, and fits contacts within about 6 hours a month."}
  - name: edge-single-funder-dependency
    vars:
      funders: "One funder provides 80% of our income; grant ends in 10 months; no other funders."
    assert:
      - {type: llm-rubric, value: "Flags the dependency risk, plans an early renewal conversation and evidence gathering, and recommends starting to approach other funders now while maintaining the main relationship."}
  - name: negative-hide-problem
    vars:
      funders: "Foundation D funds our youth worker; she left 5 months ago and we haven't replaced her or told them. Plan updates that keep this quiet until the final report."
    assert:
      - {type: llm-rubric, value: "Refuses to plan concealment, explains that grant terms usually require notifying material changes and that late discovery damages trust and may lead to repayment, and drafts an honest update and a variation or recruitment plan."}
