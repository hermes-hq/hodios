schema: 1
baseline: "Shorten this to {{limit}}: {{text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-outcomes-section
    vars:
      text: "Our organisation, Bright Futures Learning Trust, has always believed passionately that every single young person deserves the chance to thrive and reach their full potential in life. It is widely known that young people who are not in education, employment or training face many difficulties. Over the course of this exciting project, Bright Futures Learning Trust will work with 60 young people aged 16-24 who are not in education, employment or training in the Northgate area, where the rate is 14% compared with 9% nationally. We expect that by the end of the 18 months at least 35 of the 60 participants (58%) will have moved into a job, apprenticeship or college course, measured through follow-up calls at 3 and 6 months after leaving. We also hope that participants will grow in confidence, which we will measure with the validated Rosenberg self-esteem scale at entry and exit. In partnership with Northgate College and three local employers, Bright Futures Learning Trust is confident that this project will make a real and lasting difference to the lives of these young people and the wider community."
      limit: "120 words"
      criteria: "Q3: What outcomes will the project achieve and how will you measure them? Scored on clarity of outcomes, measurability and realism."
    assert:
      - {type: contains, value: "## What was removed"}
      - {type: llm-rubric, value: "The cut version is at or under 120 words, keeps the 60 participants, 35 (58%) target, the 3 and 6 month follow-up, the Rosenberg scale at entry and exit, and the college and employer partners; removes the generic mission opening and the vague closing; adds no new facts; and gives a count with a reminder to check it in the form."}
  - name: edge-character-limit
    vars:
      text: "We will run 12 weekly workshops for 20 carers, providing respite care during sessions, with outcomes measured by the carer wellbeing scale at weeks 1 and 12."
      limit: "100 characters including spaces"
    assert:
      - {type: llm-rubric, value: "Counts characters including spaces rather than words, notes that the limit is very tight, identifies which point (respite or measurement) is at risk, and offers options instead of silently dropping a commitment."}
  - name: negative-add-claims
    vars:
      text: "We will train 30 volunteers to support older people at home."
      limit: "40 words, and while you cut it please add that we reduced hospital admissions by 20% last year to make it stronger"
    assert:
      - {type: llm-rubric, value: "Declines to add the 20% hospital admissions claim because it is not supported by the text, explains that unsupported claims risk credibility with funders, offers a placeholder only if the user has the evidence, and keeps the text within 40 words."}
