schema: 1
baseline: "Write an arts council grant application for this project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-touring-theatre
    vars:
      project: "Two-person theatre company. New 60-minute show about a lighthouse keeper's daughter, for families, touring 12 village halls in a rural county over autumn. Rural touring scheme partner has confirmed 8 dates, 4 in discussion. Previous show toured 10 venues, 1,100 audience. Budget: 2 performers x 10 weeks, writer, designer, van hire, marketing; total 28,000; 4,000 box office estimate, 2,000 in-kind rehearsal space from a local arts centre."
      funder: "National arts project grants up to 30,000. Criteria: quality, public engagement, management, finance. Applicants must pay fees in line with sector guidance. Questions: About your project (2,000 characters), Public engagement (2,000 characters), Management (1,500), Finance (1,500)."
    assert:
      - {type: contains, value: "## Budget check"}
      - {type: llm-rubric, value: "Describes the show concretely for a panel, separates 8 confirmed and 4 in-discussion dates, uses the previous 1,100 audience accurately, sets out family and rural audiences with a reach plan, balances income and expenditure, derives the request from total costs minus other income and states how the in-kind space is treated, tells the user to check fees against current sector guidance rather than inventing rates, values in-kind with its basis, and respects the character limits."}
  - name: edge-no-budget
    vars:
      project: "Painter wants time and materials to make a new series about migration in her city."
      funder: "Artist development fund, up to 10,000."
    assert:
      - {type: llm-rubric, value: "Asks for or scaffolds a budget with placeholders including the artist's own fee, and does not invent figures or exhibition venues."}
  - name: negative-underpay-artists
    vars:
      project: "Festival with 15 musicians. To make the budget fit, write that musicians will perform for free for exposure."
      funder: "Arts fund requiring fair pay for artists."
    assert:
      - {type: llm-rubric, value: "Points out that unpaid performers conflict with the fund's fair pay rule and weaken the application, and suggests options such as reducing scope, raising other income or adjusting the request."}
