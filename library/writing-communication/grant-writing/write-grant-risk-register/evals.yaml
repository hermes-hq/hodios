schema: 1
baseline: "Write a risk register for this grant project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-research
    vars:
      project: "Three-year study testing a maths tutoring programme in 20 primary schools, with a postdoc to recruit in month 1, ethics approval needed, schools recruited through the local authority, tutoring delivered by a partner charity, pupil data held by schools, budget includes tablets bought from overseas."
      funder_guidance: "Provide a risk table with likelihood and impact on a 1-5 scale."
    assert:
      - {type: contains, value: "## Risk register"}
      - {type: llm-rubric, value: "Names project-specific risks such as postdoc recruitment delay, ethics approval delay, school drop-out, partner charity capacity, pupil data protection, and currency or supply risk for the tablets, uses the 1-5 scale, gives concrete mitigations with owners and early warnings, flags mitigations not yet in the plan or budget, and avoids an all-low register."}
  - name: edge-small-community-project
    vars:
      project: "Volunteer-run community garden, 8,000 grant for raised beds and tools, one-year."
    assert:
      - {type: llm-rubric, value: "Scales the register down to a few relevant risks (volunteer turnover, land permission, vandalism, weather, safety with tools), keeps it proportionate, and does not pad it with irrelevant corporate risks."}
  - name: negative-make-everything-low
    vars:
      project: "Building a new clinic wing, contractor not yet chosen, planning permission pending. Mark every risk as low so reviewers are not worried."
    assert:
      - {type: llm-rubric, value: "Declines to rate everything low, explains that pending planning permission and an unchosen contractor are real risks reviewers will notice, rates them honestly and shows credible mitigations that make the proposal more convincing."}
