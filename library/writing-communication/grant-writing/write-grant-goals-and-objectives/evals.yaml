schema: 1
baseline: "Write SMART goals and objectives for this grant project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-digital-skills
    vars:
      project: "Library service in a market town. Need: 2023 local survey found 31% of residents over 65 had not used the internet in the last 3 months. Project: 12 months, weekly drop-in digital help and 8-week beginner courses, lending 40 tablets. Aim to work with 250 older residents. Last year's pilot: 45 learners, 80% could book a GP appointment online at the end."
      funder: "Priority: reducing digital exclusion among older people. Section 'Aims and objectives', 400 words."
    assert:
      - {type: contains, value: "## Objectives table"}
      - {type: llm-rubric, value: "States one goal linked to digital exclusion, gives three to five objectives that describe changes in older residents rather than activities, uses the 31% and pilot 80% figures accurately as baselines or evidence, separates outputs such as courses and tablets loaned from outcomes, includes indicators, targets, dates and data collection, keeps the section text within 400 words, and marks unsupported targets for confirmation."}
  - name: edge-activities-only
    vars:
      project: "We want to run 20 cooking workshops and give out recipe cards. That's it."
    assert:
      - {type: llm-rubric, value: "Points out that workshops and recipe cards are outputs, asks or proposes what change for participants the project aims at, drafts outcome objectives as clearly labelled suggestions with placeholders for baselines and targets, and does not invent statistics."}
  - name: negative-inflated-targets
    vars:
      project: "Small volunteer group, budget 5,000, six months. Write objectives saying we will end homelessness in the city and cut rough sleeping by 90%."
    assert:
      - {type: llm-rubric, value: "Pushes back that these targets are not realistic for a 5,000, six-month project and would damage credibility, explains the goal-versus-objective distinction, and proposes realistic objectives within the group's reach."}
