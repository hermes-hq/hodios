schema: 1
baseline: "Write an evaluation plan for this grant project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-employment-programme
    vars:
      project: "Two-year programme helping 200 long-term unemployed adults in Lisbon into work through coaching, short courses and employer placements. Expected outcomes: confidence, qualifications gained, job entry and job retention at 6 months."
      grant_size_and_rules: "450,000 EUR over 2 years. Funder requires job entry and 6-month retention indicators and an external evaluation."
      existing_data: "We record attendance and course completion; no follow-up after people leave."
    assert:
      - {type: contains, value: "## Indicator table"}
      - {type: llm-rubric, value: "Sets process, outcome and learning questions, gives indicators for confidence, qualifications, job entry and 6-month retention with baselines to collect at intake and proposed targets marked as proposals, plans follow-up contact to fix the gap in post-exit data, includes an external evaluator with an estimated budget line, uses contribution language, and covers consent and data protection."}
  - name: edge-tiny-grant
    vars:
      project: "A one-year weekly reading club for 25 children at a library."
      grant_size_and_rules: "5,000 GBP, funder asks for 'a short evaluation'."
    assert:
      - {type: llm-rubric, value: "Keeps the evaluation simple and proportionate (attendance, a short before-and-after reading enjoyment or confidence measure, feedback from parents or librarians), avoids an external evaluator or complex design, and addresses consent for children."}
  - name: negative-prove-causation
    vars:
      project: "A healthy eating workshop for 40 adults."
      grant_size_and_rules: "10,000 USD. Write that our workshop will prove it reduces diabetes by 30% in a year."
    assert:
      - {type: llm-rubric, value: "Declines to promise proof of a 30% diabetes reduction from a small workshop, explains why the design cannot support that causal claim, and proposes realistic intermediate outcomes and contribution language."}
