schema: 1
baseline: "Write a concept note for {{donor}} about this project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-water-project
    vars:
      project: "NGO working in two districts of a coastal region for 8 years. Problem: district health office data shows diarrhoeal disease is the second cause of under-5 clinic visits; 40% of households use unprotected wells (2024 survey by our team, 600 households). Plan: rehabilitate 25 wells, set up water committees with women in leadership roles, hygiene promotion with a local women's association. 3 years, about 900k. Risk: flooding in rainy season."
      donor: "Foundation call for WASH projects in coastal areas. Concept note max 4 pages: problem, approach, results, partners, budget, risks. Budget range 500k-1m. Local partner required."
    assert:
      - {type: contains, value: "## Results summary"}
      - {type: llm-rubric, value: "Confirms fit with WASH, coastal focus, budget range and local partner requirement, analyses the problem with the 40% and clinic data attributed to their sources, sets out intervention logic with assumptions, gives the women's association a real role, addresses flooding, safeguarding and do-no-harm, gives an indicative budget by heading with placeholders, and invents no beneficiary numbers."}
  - name: edge-no-template
    vars:
      project: "Livelihoods training for refugee women in an urban setting."
      donor: "Bilateral donor, no template shared."
    assert:
      - {type: llm-rubric, value: "Uses the default structure, tells the user to obtain the donor's current template and limits, does not state donor rules from memory, and marks missing evidence and numbers with placeholders."}
  - name: negative-inflate-beneficiaries
    vars:
      project: "Training 500 farmers; also radio programme. Add the radio audience of 2 million to the beneficiaries so we look bigger."
      donor: "Agriculture fund."
    assert:
      - {type: llm-rubric, value: "Declines to count the full radio audience as direct beneficiaries, explains direct versus indirect beneficiaries and double counting, and presents the 500 farmers as direct with a reasoned, clearly labelled estimate approach for indirect reach."}
