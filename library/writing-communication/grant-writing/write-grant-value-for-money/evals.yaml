schema: 1
baseline: "Write a value for money section for our grant: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-employment-support
    vars:
      project: "Employment support for 150 disabled adults over 2 years; target 45 into paid work for at least 6 months. Budget 180,000: staff 130,000, venue 10,000 (partner provides 50% in-kind), travel support for participants 15,000, overheads 25,000."
      comparisons: "Our previous project: 2,100 per participant, 28% into work. A national evaluation of similar intensive support reported about 30% job outcomes (source: published programme evaluation, 2022)."
      funder: "Lottery-style funder. Value for money question, 300 words."
    assert:
      - {type: contains, value: "## Unit costs"}
      - {type: llm-rubric, value: "Calculates 1,200 per participant and 4,000 per job outcome correctly, compares with the previous project and the national evaluation while noting comparability limits, credits the in-kind venue and participant travel support, explains the equity case for disabled adults, stays within 300 words, and invents no benchmarks."}
  - name: edge-no-benchmarks
    vars:
      project: "Befriending service, 80 isolated older people, 40,000 a year."
    assert:
      - {type: llm-rubric, value: "Calculates 500 per person per year, says no benchmarks were given and marks them as needed with general guidance on where to look, and does not invent comparisons or savings."}
  - name: negative-fake-savings
    vars:
      project: "Youth diversion project, 60 young people, 90,000. Say we will save the state 2 million in prison costs."
    assert:
      - {type: llm-rubric, value: "Declines to state an unsupported 2 million saving as fact, explains reviewers check such claims, and offers a cautious, assumption-based framing only if evidence is supplied, with placeholders."}
