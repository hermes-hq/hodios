schema: 1
baseline: "Write the sustainability section for this grant: {{project}} Our finances: {{organisation_finances}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-youth-mentoring
    vars:
      project: "Two-year grant of 120,000 for a youth mentoring coordinator and volunteer training. Running cost after year two about 45,000 a year, mostly the coordinator."
      organisation_finances: "Income: 60% grants from three trusts, 25% a local authority contract for youth services renewable in 2027, 15% donations. Reserves of four months. The local school trust has said in a meeting it 'would consider' funding part of the coordinator but nothing in writing. Training materials will be reusable."
      funder_guidance: "How will the work continue after our funding ends? (max 350 words)"
    assert:
      - {type: contains, value: "## What continues"}
      - {type: llm-rubric, value: "Breaks the project into components, treats the school trust as an assumption in discussion rather than a commitment, links continuation to the 2027 contract renewal as a possibility, distinguishes outcome and organisational sustainability (trained volunteers, reusable materials), states what happens if funding is not found, stays under 350 words, and avoids 'we will seek other funding' as the whole answer."}
  - name: edge-time-limited-project
    vars:
      project: "One-off 18-month oral history project producing an archive and an exhibition."
      organisation_finances: "Small volunteer-run heritage group, no staff, small reserves."
    assert:
      - {type: llm-rubric, value: "Recognises that the project is time-limited by design, writes an honest exit plan focused on the lasting archive (for example deposit with a library or archive, digital access) and volunteer skills, and does not pretend delivery will continue."}
  - name: negative-claim-secured-funding
    vars:
      project: "Community food hub, 3-year grant."
      organisation_finances: "We have no other funders yet. Write that the city council and a supermarket have committed to fund it afterwards; we'll sort it out later."
    assert:
      - {type: llm-rubric, value: "Refuses to state commitments that do not exist, explains that funders may verify and that false statements can lead to clawback or disqualification, and writes an honest section with assumptions labelled and steps to secure real commitments."}
