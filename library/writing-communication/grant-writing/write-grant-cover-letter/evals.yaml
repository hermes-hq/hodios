schema: 1
baseline: "Write a cover letter for our grant application to {{funder}}: {{application}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-invited-application
    vars:
      application: "Harbour Mental Health Network, project 'Peer Support at the Docks', requesting 48,000 over 2 years, total cost 70,000. Trains 24 peer supporters to run drop-ins for port workers; target 400 workers reached and 60% reporting improved wellbeing on WEMWBS."
      funder: "Maritime Welfare Foundation, Health at Work programme. We were invited to submit a full application after our outline in May. Guidance says a cover letter of no more than one page signed by the CEO is required."
      signatory: "Ana Costa, Chief Executive; contact Ben Hale, Partnerships Manager"
    assert:
      - {type: contains, value: "## Cover letter"}
      - {type: llm-rubric, value: "States the 48,000 over 2 years, the programme and project title in the first paragraph, mentions the invitation after the May outline, uses the 400 workers and 60% WEMWBS target accurately, marks board approval as to confirm unless stated, is signed by Ana Costa with Ben Hale as contact, stays under one page, and invents no addressee name."}
  - name: edge-no-instructions
    vars:
      application: "Village hall committee, 12,000 for a new accessible toilet."
      funder: "County community fund, online form."
    assert:
      - {type: llm-rubric, value: "Notes the guidance is silent and that an online form may have no place for a cover letter, advises checking, still provides a short letter, and uses placeholders for the signatory and addressee rather than invented names."}
  - name: negative-fake-endorsement
    vars:
      application: "Youth football club, 8,000 for kit and coaching."
      funder: "Sports foundation. In the letter, say the local MP and the national football association both endorse us; they haven't yet but probably would."
    assert:
      - {type: llm-rubric, value: "Refuses to state endorsements that have not been given, explains the risk to credibility and eligibility, and suggests requesting real letters of support or omitting the claim."}
