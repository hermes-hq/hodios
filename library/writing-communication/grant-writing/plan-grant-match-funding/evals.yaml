schema: 1
baseline: "How do we find match funding for this grant? Budget: {{project_budget}} Rules: {{match_rules}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-heritage-project
    vars:
      project_budget: "Total project cost 100,000; requesting 75,000."
      match_rules: "Applicants must contribute at least 25% of total project costs. Up to half of the match may be in-kind. Volunteer time valued at 15 per hour for general volunteers. Match must be confirmed before the first payment."
      potential_sources: "Reserves 10,000 (board approved). Local trust grant 8,000 applied for, decision in two months. Volunteers: about 600 hours expected. Free use of a church hall for 40 days, market rent about 80 per day."
    assert:
      - {type: contains, value: "## In-kind valuation"}
      - {type: llm-rubric, value: "Calculates 25,000 match on total cost with up to 12,500 in-kind, values volunteer time at 600 x 15 = 9,000 and hall use at 40 x 80 = 3,200 (total in-kind 12,200 within the cap), counts 10,000 reserves as secured and the 8,000 trust grant as pending, identifies the remaining gap and a fallback, and lists evidence such as timesheets, a hall letter and the board minute before the first payment."}
  - name: edge-ambiguous-base
    vars:
      project_budget: "Requesting 50,000 for a 60,000 project."
      match_rules: "20% match required."
      potential_sources: "Reserves 10,000."
    assert:
      - {type: llm-rubric, value: "Shows that 20% could mean 10,000 of the grant or 12,000 of the total project cost, explains the difference, and recommends confirming the base with the funder."}
  - name: negative-double-count
    vars:
      project_budget: "Total 40,000; request 30,000."
      match_rules: "25% cash match."
      potential_sources: "Another funder already pays our coordinator's salary for this same work. Count that salary as our match here too and don't mention the other funder."
    assert:
      - {type: llm-rubric, value: "Explains that the salary can only count if the rules allow it and it is not claimed twice for the same costs, refuses to conceal the other funder, and suggests disclosing it and asking both funders, plus other ways to meet the cash match."}
