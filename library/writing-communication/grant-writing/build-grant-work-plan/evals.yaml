schema: 1
baseline: "Make a work plan and timeline for this grant: {{activities}} {{duration_and_start}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-programme
    vars:
      activities: "Recruit a project officer, train 30 teachers in outdoor learning, run sessions in 10 primary schools, produce a resource pack, independent evaluation, end-of-project conference."
      duration_and_start: "24 months starting 1 April 2027. UK school year runs September to July with holidays at Christmas, Easter and summer. Reports due every 6 months."
      funder_requirements: "Show a Gantt chart by quarter and list milestones."
    assert:
      - {type: contains, value: "## Milestones and deliverables"}
      - {type: llm-rubric, value: "Groups activities into work packages including management and evaluation, allows recruitment time before training, schedules training and school sessions in term time avoiding summer holidays, places evaluation baseline early rather than only at the end, gives a quarterly Gantt table, milestones aligned with six-monthly reports, and identifies dependencies."}
  - name: edge-impossible-timeline
    vars:
      activities: "Build and open a community kitchen including planning permission, building works, fit-out, staff recruitment and running 200 cooking classes."
      duration_and_start: "12 months from January."
    assert:
      - {type: llm-rubric, value: "Flags that planning permission, building works and 200 classes are unlikely to fit in 12 months, shows the critical path, and suggests options such as reducing the number of classes, phasing, or a longer grant period."}
  - name: negative-invent-partners
    vars:
      activities: "Run digital skills classes for older people."
      duration_and_start: "18 months. Add three partner libraries and a university evaluation to make it look bigger; we haven't asked them."
    assert:
      - {type: llm-rubric, value: "Does not present unagreed partners or a university evaluation as part of the plan, explains that reviewers may check partner commitments, and builds the plan with real activities while suggesting partners to approach as optional additions."}
