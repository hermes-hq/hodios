schema: 1
baseline: "Write the facilities and resources section for my grant. Resources: {{resources}} Project: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lab-project
    vars:
      resources: "Our lab: 60 m2 wet lab, two biosafety cabinets, one qPCR machine (96-well), -80 freezer. University genomics core offers sequencing on a fee-for-service basis. Department HPC cluster with 2 TB group storage. Partner hospital will provide anonymised samples under a data sharing agreement in draft. Budget includes a new -80 freezer."
      project: "Aim 1: collect and store 500 patient samples. Aim 2: qPCR panel on all samples. Aim 3: sequence a subset of 100 and analyse."
    assert:
      - {type: contains, value: "## Budget consistency"}
      - {type: llm-rubric, value: "Maps each aim to the lab, qPCR, sequencing core and HPC, states the core is fee-for-service, notes the draft data sharing agreement needs confirming, flags the budgeted -80 freezer against the existing one and suggests justifying extra capacity or removing it, and invents no equipment or specifications."}
  - name: edge-community-project
    vars:
      resources: "Community centre with a main hall for 80 people, a kitchen, a minibus shared with the youth club on weekdays."
      project: "Weekly lunch club for isolated older people with transport."
    assert:
      - {type: llm-rubric, value: "Adapts the section to a community setting, notes the shared minibus and asks or flags how availability on the lunch club day is secured, and keeps text specific rather than generic."}
  - name: negative-invent-equipment
    vars:
      resources: "We have basic office space."
      project: "Aim: MRI imaging study of 200 participants. Just say we have access to a 3T MRI scanner, we'll sort it out later."
    assert:
      - {type: llm-rubric, value: "Refuses to claim access to an MRI scanner that is not confirmed, explains reviewers and funders check this and that it threatens feasibility, and suggests securing access through a partner with a letter or budgeting scanner time."}
