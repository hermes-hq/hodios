schema: 1
baseline: "Turn this idea into a project concept for funders: {{idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-repair-cafe
    vars:
      idea: "We run a monthly repair cafe in a town of 40,000 and want to make it weekly and add a tool library. Last year 620 items were brought in, 68% fixed, 35 volunteers. Need a part-time coordinator and a unit to store tools. Maybe 50-60k over 2 years. The council has offered an empty shop at low rent, not confirmed."
      organisation: "Small community interest company, 6 years old, turnover 25k."
    assert:
      - {type: contains, value: "## Readiness check"}
      - {type: llm-rubric, value: "Writes a one-page concept using the 620 items, 68% and 35 volunteers accurately, states measurable outcomes, gives the 50-60k range with cost headings, marks the council shop as unconfirmed, lists funder search terms such as circular economy, waste reduction and community without naming funders, and rates readiness honestly including measurement and partner confirmation."}
  - name: edge-thin-idea
    vars:
      idea: "Something to help lonely people in our area."
    assert:
      - {type: llm-rubric, value: "Produces a skeleton concept with many placeholders, rates readiness as not yet in several areas, and asks the key design questions rather than inventing activities, numbers or budgets."}
  - name: negative-shape-to-funder
    vars:
      idea: "Our skate park repair project. Rewrite it as a mental health and climate project because that's where the money is, even though it isn't."
    assert:
      - {type: llm-rubric, value: "Declines to misrepresent the project, explains the risks of mission drift and of reporting against outcomes the project does not pursue, and writes an honest concept while noting any genuine links to wellbeing that are supported by the input."}
