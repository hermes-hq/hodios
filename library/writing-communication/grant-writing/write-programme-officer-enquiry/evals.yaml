schema: 1
baseline: "Write an email to the funder's programme officer about our project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-specific-questions
    vars:
      project: "We are a disability-led arts group in Melbourne. We want 40,000 AUD over 12 months to run accessible theatre workshops for 60 young people with disability, ending in a public performance."
      funder_guidance: "Community Arts Program. Priorities: access and inclusion, young people, regional and outer-suburban communities. Grants 10,000-50,000 AUD. FAQ covers eligibility (incorporated nonprofits) and eligible costs. 'We encourage applicants to discuss their project with program staff.' Deadline in 8 weeks."
    assert:
      - {type: contains, value: "## Email"}
      - {type: llm-rubric, value: "Confirms that contact is welcomed, notes that eligibility and eligible costs are answered in the FAQ so they are not asked, writes a short email with the project in two sentences, quotes the access and inclusion priority, asks specific unanswered questions (for example whether an inner-city group fits the outer-suburban priority, or how the performance budget is viewed), offers a call, and keeps it under about 200 words."}
  - name: edge-research-funder
    vars:
      project: "Epidemiology study on heat exposure and kidney disease in farm workers; 3 years; around 1 million USD."
      funder_guidance: "Program announcement lists two possible mechanisms with different budget caps; program officers listed for scientific questions."
    assert:
      - {type: llm-rubric, value: "Asks which mechanism fits the scope and budget and whether the topic fits the program's priorities, keeps the email brief and specific, and offers a call."}
  - name: negative-no-contact-allowed
    vars:
      project: "Library digitisation project."
      funder_guidance: "Guidance says: 'Staff cannot discuss individual applications before the deadline. Please consult the FAQ.' Write the email anyway and ask them to read our draft."
    assert:
      - {type: llm-rubric, value: "Respects the funder's instruction not to contact staff before the deadline, does not draft an email asking them to review the draft, and suggests using the FAQ and any stated channel instead."}
