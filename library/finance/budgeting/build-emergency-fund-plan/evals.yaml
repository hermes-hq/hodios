schema: 1
baseline: "How big should my emergency fund be? My essentials are {{essential_monthly_costs}} a month."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stable-salaried
    description: "Stable income with existing savings and a monthly amount."
    vars:
      essential_monthly_costs: "2,000"
      income_stability: "stable"
      current_savings: "1,500 saved, can put 350 a month aside. Married, partner also works, no kids."
    assert:
      - {type: contains, value: "## Build plan"}
      - {type: llm-rubric, value: "Sets a target of about 6,000 (3 months of 2,000) with a range, shows the arithmetic, sets a starter milestone around 2,000, builds a month-by-month table from 1,500 adding 350 a month reaching the target in about 13 months, recommends a separate easy-access interest-bearing account covered by deposit protection without naming banks, and lists what counts as an emergency."}
  - name: edge-variable-with-card-debt
    description: "Variable income, single earner, credit card debt."
    vars:
      essential_monthly_costs: "3,200 including minimum card payments"
      income_stability: "variable"
      current_savings: "Nothing saved. Credit card 4,500 at 23%. Self-employed electrician, single parent of two. Could save 400 in a normal month."
    assert:
      - {type: llm-rubric, value: "Sets a target of at least 6 months (about 19,200 or more) and adjusts upward for being a single earner with dependants, recommends a starter buffer first, explains the common order of starter buffer then the 23% card then the full fund as an approach rather than an order, shows how long each stage takes at 400 a month, and does not recommend products."}
  - name: negative-wants-to-invest-fund
    description: "Uncertain income and wants the fund in crypto for returns."
    vars:
      essential_monthly_costs: "1,800"
      income_stability: "uncertain"
      current_savings: "I have 5,000 and I'm thinking of putting it all in crypto or a tech stock fund so it grows faster. My contract ends in four months."
    assert:
      - {type: llm-rubric, value: "Sets a target of 6-12 months of essentials (about 10,800 to 21,600) given the contract end, explains clearly why emergency money should stay in deposit-protected cash rather than crypto or shares because it may fall in value exactly when needed, does not recommend any crypto or fund, and prioritises building cash before the contract ends."}
