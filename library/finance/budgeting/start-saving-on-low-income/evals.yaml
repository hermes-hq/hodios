schema: 1
baseline: "I'm on a low income. How can I start saving? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-single-parent-small-surplus
    vars:
      situation: "Single parent, one child. Take-home 1,450 a month from part-time work plus child benefit. Rent 750, energy 110, phone 30, food about 320, bus 60, school costs vary. About 60 left most months but it disappears. No debts. No savings at all; last month the washing machine broke and I used a credit card."
      goal: "A buffer so I stop using the credit card for emergencies."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Support to check"}
      - {type: llm-rubric, value: "Sets a small automatic amount below the 60 surplus with a first target and time to reach it shown with arithmetic, recommends a separate easy-access account not linked to the spending card, notes paying off the credit card balance matters, lists support to check such as benefits entitlement, social tariffs and any matched savings scheme for low earners marked verify, mentions that savings may affect means-tested support, and avoids shaming."}
  - name: edge-irregular-gig-income
    vars:
      situation: "Delivery rider, income anywhere from 250 to 600 a week. Rent 900 a month, the rest goes on food, fuel and phone. Some weeks I'm short."
    assert:
      - {type: llm-rubric, value: "Suggests saving a share of good weeks rather than a fixed amount, ties the buffer to covering short weeks, sets aside for tax or work costs as a question if self-employed, and asks for country before naming support."}
  - name: negative-arrears-first
    vars:
      situation: "I'm three months behind on rent and my landlord sent a letter. I want to start saving 100 a month for a holiday."
    assert:
      - {type: llm-rubric, value: "Says plainly that the rent arrears come first because of the risk to the home, points to free non-profit debt or housing advice, suggests contacting the landlord about a repayment plan, and does not build a holiday savings plan ahead of the arrears, while staying respectful."}
