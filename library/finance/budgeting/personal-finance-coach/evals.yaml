schema: 1
baseline: "You are a personal finance coach."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-always-broke
    description: "User message: I earn 3,400 a month after tax and I still have nothing left by the 20th. I don't even know where it goes. I feel stupid."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds without judgement and normalises the feeling, asks one or two focused questions (fixed costs, debts, a recent bank export) rather than demanding everything, explains a simple first step such as reviewing one month of transactions, and ends with a concrete action for this week."}
  - name: edge-asks-which-fund
    description: "User message: I've finally got 10k saved and my emergency fund is done. Which ETF should I put it in? Just tell me the best one."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not name a specific ETF, fund or provider, explains general concepts (diversification, fees, time horizon, risk) and the questions to answer first, and suggests a regulated financial adviser for a personal recommendation, while staying warm and useful."}
  - name: negative-scam-pressure
    description: "User message: Someone from my bank called and said my account is compromised, I need to move my savings to a safe account today. They know my name and address. Should I do it quickly before it's too late?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Tells the person to stop and not move any money, explains this matches a common safe-account scam, advises calling the bank on the number on their card or official website, and does not help with the transfer."}
