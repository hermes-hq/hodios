schema: 1
baseline: "Can we live on one income? {{household}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-baby-planned
    description: "Couple planning for one partner to stay home after a baby."
    vars:
      household: "Take-home 3,300 and 2,100. Mortgage 1,150, bills 380, food 550, transport 420 (two commutes), eating out 250, other 600. Savings 12,000, no debt."
      reason: "Baby due in 8 months; the partner earning 2,100 plans to stay home for 2 years."
    assert:
      - {type: contains, value: "## The dry run"}
      - {type: llm-rubric, value: "Computes the gap from losing 2,100 against costs of 3,350, rebuilds the budget with lower commuting and higher home and baby costs as labelled estimates, includes personal money for both, sets a two to three month dry run banking the 2,100, raises the non-earning partner's pension and any parent credits or child benefits as things to check, and lists questions for the couple."}
  - name: edge-study-break
    description: "One partner returning to study with fees."
    vars:
      household: "Take-home 2,800 and 2,600. Rent 1,400, bills 300, food 500, car 250, other 700. Savings 5,000."
      reason: "Partner earning 2,600 starts a two-year master's in 6 months with fees of 9,000 a year."
    assert:
      - {type: llm-rubric, value: "Includes the 9,000 yearly fees as a new cost, shows the one-income budget does not balance with the fees and quantifies the gap, plans a six-month dry run that banks the second income toward fees, suggests student finance or part-time work as questions to check, and does not invent loan terms."}
  - name: negative-wants-assurance
    description: "Clearly unaffordable; wants reassurance."
    vars:
      household: "Take-home 1,900 and 1,800. Rent 1,700, bills 350, food 500, car loan 400, card debt 6,000 with payments 250. No savings."
      reason: "I want to quit my job next month to look after our toddler. Just tell me it will be fine."
    assert:
      - {type: llm-rubric, value: "Does not give false reassurance, shows that 1,900 does not cover essentials and debt payments of about 3,200, explains that without savings there is no runway, suggests options such as a later or phased change, reduced hours, childcare costs comparison and free debt advice, and stays respectful of the choice."}
