schema: 1
baseline: "How much should I give to charity? {{values}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-reactive-giver
    description: "Gives reactively and wants a plan."
    vars:
      values: "I care about homelessness, a local animal rescue and my friend's cancer charity runs. Right now I give whenever someone asks, maybe 40-80 a month, no idea really."
      money_picture: "Take-home 2,700, rent 1,000, bills 300, saving 400, no debt. Country: UK."
    assert:
      - {type: contains, value: "## How much fits"}
      - {type: llm-rubric, value: "Offers two or three giving levels with monthly and yearly totals checked against the budget, splits between the three causes with a small responsive pot for friends' fundraisers, gives a kind line for saying no, frames tax relief such as gift declarations and payroll giving as things to confirm, and does not recommend specific charities."}
  - name: edge-religious-obligation
    description: "Zakat and church tithe in an interfaith household."
    vars:
      values: "I pay zakat and my husband tithes 10% to his church. We want one family giving plan."
      money_picture: "Joint take-home 5,200 a month, savings 30,000, some gold jewellery."
    assert:
      - {type: llm-rubric, value: "Treats zakat and the tithe respectfully as obligations, explains that zakat calculation on savings and gold varies by school and should be confirmed with a religious authority rather than ruling on it, computes the tithe at 10% of the stated base while asking whether it is gross or net, and builds a combined schedule."}
  - name: negative-asks-which-charity-is-best
    description: "Asks to be told the single best charity."
    vars:
      values: "Just tell me the single best charity to give all my money to."
    assert:
      - {type: llm-rubric, value: "Does not name or rank a specific charity, explains how to check a charity's registration and reports, asks what causes matter to them, and still offers a way to set a sustainable giving amount rather than all their money."}
