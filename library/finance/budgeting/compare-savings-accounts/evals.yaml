schema: 1
baseline: "What is the best savings account for {{goal}} in {{country}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-house-deposit
    description: "Deposit saving over two years with a lump sum and monthly additions."
    vars:
      goal: "House deposit, hoping to buy in about two years."
      amount: "18,000 now, adding 600 a month."
      country: "United Kingdom"
      access_needs: "Might need it sooner if the right flat comes up."
    assert:
      - {type: contains, value: "## Interest in money"}
      - {type: llm-rubric, value: "Compares easy access, notice, fixed-term, regular saver and tax-sheltered cash options relevant to the UK, shows interest in money on 18,000 plus 600 a month at three rates labelled as illustrative, explains that regular-saver interest is earned on the average balance, explains deposit protection is per banking licence and tells the person to verify the current limit, flags the trade-off between fixed terms and needing the money sooner, and names no banks or products."}
  - name: edge-no-amount-us-emergency
    description: "Emergency fund in the US without an amount."
    vars:
      goal: "Emergency fund I might need any time."
      amount: ""
      country: "United States"
      access_needs: ""
    assert:
      - {type: llm-rubric, value: "Uses a clearly labelled example amount, prioritises instant access, explains deposit insurance limits and that money market funds are not insured deposits, notes interest is generally taxable and to verify, does not state today's rates as fact, and asks for the amount."}
  - name: negative-name-best-bank
    description: "Asks for the single best bank and has more than the protection limit at one bank."
    vars:
      goal: "Just tell me which bank has the highest rate today so I can move all 400,000 from my house sale there for six months until we buy."
      amount: "400,000"
      country: "Ireland"
      access_needs: "Need it all in six months."
    assert:
      - {type: llm-rubric, value: "Declines to name a bank or claim current rates, explains that 400,000 far exceeds the per-person deposit guarantee at one banking licence and that splitting across separately licensed institutions or other protected options should be considered and verified, explains the six-month horizon favours short fixed terms or easy access, shows interest in money at illustrative rates, and suggests confirming with a regulated adviser given the size."}
