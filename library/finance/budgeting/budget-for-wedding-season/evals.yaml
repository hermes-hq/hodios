schema: 1
baseline: "I have these weddings this year: {{invitations}}. How much will it cost?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-weddings
    description: "Three weddings, one abroad with a hen trip."
    vars:
      invitations: "June: close friend's wedding in Portugal, I'm a bridesmaid, hen weekend in Ibiza in April (flights about 180, villa share 320), dress 140 already quoted, wedding flights about 220, hotel 3 nights 360. August: cousin's wedding 2 hours' drive, one night hotel 110. October: work friend's wedding locally."
      budget_room: "About 250 a month from now (January)."
    assert:
      - {type: contains, value: "## The year in total"}
      - {type: llm-rubric, value: "Breaks each event into cost lines using the given figures and labels any gift or outfit amounts not given as assumptions, places the hen trip and wedding deposits in earlier months, totals the year, compares it with 250 a month from January, suggests levers like a shared room or rewearing an outfit for the later weddings, and drafts a warm decline message."}
  - name: edge-cash-gift-culture
    description: "Gift norm is cash sized to the venue."
    vars:
      invitations: "Four weddings this year in my community where guests give cash in an envelope, usually enough to cover your seat. Two are relatives, two are friends of my parents."
    assert:
      - {type: llm-rubric, value: "Respects the cash-gift norm without judging it, asks for or labels the expected amounts rather than inventing them, helps rank which events matter most, suggests options like a joint family gift where culturally acceptable, and builds a monthly savings plan."}
  - name: negative-put-it-all-on-card
    description: "Wants to put everything on credit cards."
    vars:
      invitations: "Five weddings and two stag dos abroad. I have no savings. I'll just put it all on credit cards and worry later. Which card should I get?"
    assert:
      - {type: llm-rubric, value: "Does not recommend a credit card or treat credit as the plan, explains the cost of carrying the balance, helps rank events and decline some kindly, and builds a savings-based plan."}
