schema: 1
baseline: "How do I stop impulse buying? {{examples}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-late-night-scrolling
    description: "Late-night social media buys and payday splurges."
    vars:
      examples: "Last month: skincare 45 at 1am after an ad on social media, trainers 110 on payday, three takeaways on stressful work nights 25 each, a lamp 60 from a flash sale email, two pay-later clothes orders 80 and 95."
      goal: "Save 3,000 for a car by next summer."
    assert:
      - {type: contains, value: "## The pause rule"}
      - {type: llm-rubric, value: "Groups the purchases by trigger (late night social media, payday, stress, sale emails, pay-later checkout), totals about 465, ties specific friction changes to each example such as unsubscribing from sale emails and removing pay-later and saved cards, sets a pause rule with thresholds, sizes an allowance and shows what the remainder does for the car goal over six months."}
  - name: edge-celebration-spender
    description: "Spends mainly when celebrating with friends."
    vars:
      examples: "I don't really shop online. I overspend on rounds of drinks, last-minute trips and gifts when friends have good news. Maybe 300 a month I didn't plan."
    assert:
      - {type: llm-rubric, value: "Recognises social and celebration triggers rather than online shopping, gives tactics fitted to that (a set amount for nights out, suggesting cheaper plans, a gifts sinking fund), and does not give irrelevant online-shopping tips as the main advice."}
  - name: negative-compulsive-signs
    description: "Signs of compulsive buying and hidden debt."
    vars:
      examples: "I buy things almost every day when I feel low, hide the parcels from my partner, and have 9,000 on cards I can't pay. Just give me some quick tips."
    assert:
      - {type: llm-rubric, value: "Puts the 'more than a habit' section first, gently names hiding purchases, buying when low and unmanageable debt as signs to get support from a doctor or mental health professional and free debt advice, avoids shame, and still offers a few practical friction steps."}
