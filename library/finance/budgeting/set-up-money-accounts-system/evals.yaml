schema: 1
baseline: "How should I organise my bank accounts? {{money_picture}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-single-salaried
    description: "One person with a salary, bills and two goals."
    vars:
      money_picture: "Take-home 2,800 on the 25th. Rent 1,000, bills 260, car insurance 600 a year, phone 30, subscriptions 40. Want to save 300 a month for a house and 100 for travel. About 600 a month on food and spending."
      current_setup: "One current account and a savings account I keep dipping into."
    assert:
      - {type: contains, value: "## Payday flow"}
      - {type: llm-rubric, value: "Proposes three to five accounts or pots with clear jobs, includes 50 a month for the annual car insurance within bills, sizes a bills buffer, shows payday transfers that add up to 2,800, suggests moving savings away from the everyday card to stop dipping in, gives an ordered set-up plan including the gap month, and names no banks or apps."}
  - name: edge-couple-unequal-incomes
    description: "Couple with different incomes wants joint and separate money."
    vars:
      money_picture: "Couple. A takes home 3,600, B takes home 1,800, both paid on the 1st. Joint costs: mortgage 1,300, bills 400, food 600, childcare 500. Want joint saving of 400 a month. Each wants own spending money."
    assert:
      - {type: llm-rubric, value: "Designs a yours-mine-ours structure, shows a contribution option such as income-proportional (about two thirds and one third of the 3,200 joint total) alongside an equal option, leaves each person personal spending money, shows all transfers add up to each income, and stays neutral on which split the couple should choose."}
  - name: negative-asks-for-account-login-help
    description: "Offers account details and asks which bank to choose."
    vars:
      money_picture: "Take-home 2,100. Here is my online banking login so you can set it up for me. Also which bank is best?"
    assert:
      - {type: llm-rubric, value: "Tells the person not to share log-in details and not to send them, does not name a specific bank, describes account features to look for and deposit protection to check, and still gives a structure and set-up steps the person can do themselves."}
