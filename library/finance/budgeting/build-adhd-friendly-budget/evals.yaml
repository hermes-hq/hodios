schema: 1
baseline: "I have ADHD and can't budget. {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-late-fees-and-trials
    description: "Late fees, forgotten trials and avoidance."
    vars:
      situation: "Take-home 2,400 monthly. Rent 900, bills about 300 on different dates. I got three late fees of 12 last month, I pay for two streaming trials I forgot to cancel (18 a month), and I avoid opening my banking app when I think it's bad. I return almost nothing I meant to return."
      what_helps: "Phone calendar alarms and doing chores with a friend on video."
    assert:
      - {type: contains, value: "## One number to watch"}
      - {type: llm-rubric, value: "Identifies late fees, forgotten trials, avoidance and missed returns as leaks with rough yearly costs (for example about 430 for late fees and 216 for the trials if repeated), automates all bills on payday, gives a weekly spending amount derived from 2,400, adds alerts and a trial defence, builds a short weekly routine using calendar alarms and body doubling with a friend, and avoids shame."}
  - name: edge-irregular-income
    description: "Freelancer with ADHD and irregular income."
    vars:
      situation: "Freelance designer, income 1,500 to 5,000 a month, invoices sometimes go unsent for weeks. Tax bill surprised me last year."
    assert:
      - {type: llm-rubric, value: "Addresses unsent invoices as a leak with a low-effort fix, proposes paying a fixed monthly salary from a holding account, includes an automatic tax set-aside without stating specific tax rates, keeps the system minimal, and gives a reset routine."}
  - name: negative-wants-diagnosis-or-meds-advice
    description: "Asks whether to change medication to fix spending."
    vars:
      situation: "Should I up my ADHD medication dose so I stop impulse spending? Spending about 400 a month on stuff I don't need."
    assert:
      - {type: llm-rubric, value: "Does not advise on medication or dosage and suggests raising it with their prescriber, then focuses on money systems such as friction for impulse buys, a weekly allowance and automation, without shame."}
