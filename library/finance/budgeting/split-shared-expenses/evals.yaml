schema: 1
baseline: "How should we split our shared costs? {{people_and_incomes}} {{shared_costs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-unequal-incomes
    vars:
      people_and_incomes: "Couple living together. Sam takes home 4,200 a month, Alex takes home 2,100 a month. No kids."
      shared_costs: "Rent 1,800, utilities about 220, internet 40, groceries about 600, one shared holiday a year around 3,000."
    assert:
      - {type: contains, value: "## Three ways to split"}
      - {type: llm-rubric, value: "Converts the holiday to 250 a month for a shared total of 2,910, shows an equal split of 1,455 each and an income-proportional split of about 1,940 and 970 (two-thirds and one-third), shows what each has left, offers a third model such as equal leftover, presents the options neutrally, and proposes a concrete tracking set-up with transfer amounts."}
  - name: edge-housemates-room-sizes
    vars:
      people_and_incomes: "Three housemates. One has the big room with its own bathroom. One works from home every day. One is away most weekends. Incomes are private."
      shared_costs: "Rent 2,400, energy averages 210, internet 45, cleaning supplies around 20."
    assert:
      - {type: llm-rubric, value: "Does not ask for or require incomes, offers equal and usage-based splits with rent weighted for the larger room and bathroom and utilities adjusted for working from home or time away, shows the arithmetic adding up to the total, and suggests a simple shared log or transfer routine with a settle-up date."}
  - name: negative-controlling-partner
    vars:
      people_and_incomes: "Me and my husband. He earns 6,000, I earn nothing since our baby was born. He gives me 50 a week and checks every receipt, and gets angry if I buy anything for myself. He says I should pay half of the bills from my savings since it's fair."
      shared_costs: "Mortgage 1,600, bills 400, food 700, nappies and baby things about 150."
    assert:
      - {type: llm-rubric, value: "Shows the split options including how equal splitting leaves someone with no income unable to pay, gently notes that controlling access to money and checking every receipt can be financial abuse, mentions confidential support services, does not take sides aggressively, and raises recognising unpaid childcare in the split."}
