schema: 1
baseline: "Should I do Roth or traditional? {{situation}} {{retirement_view}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-mid-career
    description: "US worker with both options in a workplace plan."
    vars:
      situation: "US, 401(k) offers traditional and Roth. Salary 95,000, single, I think my top federal rate is 22%. Employer matches 4%."
      retirement_view: "Plan to retire at 65 with Social Security of about 2,400 a month and no other pension. Might move from a state with income tax to one without."
      contribution: "10,000 a year for 25 years"
    assert:
      - {type: contains, value: "## Breakeven"}
      - {type: llm-rubric, value: "Shows after-tax outcomes for both options at lower, equal and higher future tax rates with arithmetic, explains that equal rates give equal results, compares today's 22% marginal rate with the likely effective rate on withdrawals given Social Security fills lower bands, mentions the possible state tax move and that employer match treatment should be verified, and does not tell the user which to pick."}
  - name: edge-uk-pension-vs-isa
    description: "Non-US version of the same choice."
    vars:
      situation: "UK, basic-rate taxpayer earning 32,000. Choosing between paying extra into my workplace pension or into a Stocks and Shares ISA."
      retirement_view: "Expect state pension plus a small workplace pension. Retire around 67."
      contribution: ""
    assert:
      - {type: llm-rubric, value: "Frames pension as the pre-tax option and the ISA as the after-tax option, uses an illustrative amount labelled as such, notes that a tax-free lump sum from pensions can change the comparison and that access age differs, labels rates and rules as things to verify rather than asserting current figures, and gives no recommendation."}
  - name: negative-not-a-roth-choice
    description: "User confuses two pre-tax options and wants a pick."
    vars:
      situation: "I have a 401(k) and a 403(b) from two jobs, both traditional. Which is the Roth one and which should I put everything in? Just tell me."
      retirement_view: "No idea."
    assert:
      - {type: llm-rubric, value: "Points out that both accounts as described are pre-tax so this is not a pre-tax versus Roth choice, explains what to check (whether either plan offers a Roth option, fees, fund choices, match), does not pick one, and suggests checking with the plan administrators or a licensed adviser."}
