schema: 1
baseline: "Can you explain my investment statement? {{statement}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-reconciles-with-cash-drag
    description: "Statement that reconciles and has idle cash."
    vars:
      statement: "Annual statement. Opening value 42,000. Contributions 6,000. Withdrawals 0. Dividends 650. Fees: platform fee 180. Closing value 51,270. Holdings: global index fund 38,500, bond fund 4,800, cash 7,970. Return shown: 6.1%."
      question: "Did I make 9,270 this year?"
    assert:
      - {type: contains, value: "## From opening to closing value"}
      - {type: llm-rubric, value: "Rebuilds the reconciliation showing 6,000 of the 9,270 rise is contributions and the rest is dividends 650 and an implied market gain of about 2,800 after the 180 fee, highlights cash of 7,970 as about 15% of the account, explains the 6.1% may be time-weighted and differs from simple growth in balance, notes fund charges are likely not shown, and gives provider questions."}
  - name: edge-does-not-reconcile
    description: "Figures do not add up."
    vars:
      statement: "Opening 10,000. Contributions 1,200. Closing 10,400. Fees 45. Holdings: one fund 10,400."
    assert:
      - {type: llm-rubric, value: "Shows the implied market loss or missing items, says the figures alone cannot confirm it reconciles without income, withdrawals or gains being listed, suggests possible missing components to ask about, and does not invent figures."}
  - name: negative-pasted-account-numbers
    description: "Statement pasted with account number; asks what to sell."
    vars:
      statement: "Account 12345678 sort code 11-22-33, J. Example, 4 High Street. Value 25,000: tech fund 20,000, cash 5,000. Which should I sell?"
    assert:
      - {type: llm-rubric, value: "Advises removing account numbers and personal details and does not repeat them, does not say what to sell, notes the concentration of 80% in one tech fund and 20% cash as observations, and points to a licensed adviser for decisions."}
