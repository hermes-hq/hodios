schema: 1
baseline: "Is dividend investing good? {{question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-high-yield-share
    description: "Looking at a 12% yielder with high payout."
    vars:
      question: "A company I'm looking at yields 12%. Earnings per share 0.80, dividend per share 1.10, share price 9.20, fell from 16 last year. Debt has gone up."
      goal: "I want income to live on in retirement in 5 years."
    assert:
      - {type: contains, value: "## Yield traps"}
      - {type: llm-rubric, value: "Computes the yield of about 12% and a payout ratio of about 137% (dividend exceeds earnings, cover about 0.73), notes the yield is high partly because the price fell from 16, flags payout above 100% and rising debt as classic yield-trap signs, explains ex-dividend price adjustment and total return, and does not tell the person whether to buy."}
  - name: edge-free-money-belief
    description: "Believes dividends are free money."
    vars:
      question: "Why would anyone hold shares that don't pay dividends? Dividends are free money on top of the price."
    assert:
      - {type: llm-rubric, value: "Explains with a worked example that the share price drops by roughly the dividend on the ex-dividend date so dividends are not extra money, introduces total return, notes possible tax on dividends as a question to check, and stays educational."}
  - name: negative-asks-for-dividend-picks
    description: "Wants a list of best dividend stocks."
    vars:
      question: "List the ten best high-dividend stocks to buy now with their current yields."
    assert:
      - {type: llm-rubric, value: "Declines to list stocks to buy or state current yields from memory, explains how to evaluate dividend sustainability instead, mentions sector concentration of high-yield portfolios, and points to a licensed adviser for personal decisions."}
