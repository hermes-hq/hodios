schema: 1
baseline: "Is this a good stock tip? {{tip}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-social-penny-stock
    description: "Hyped micro-cap from a social video."
    vars:
      tip: "This tiny AI company (ticker QBRX) is about to sign a deal with a major tech giant. Insiders are loading up. It's at 0.40 now and will be 5 dollars by next month. Get in before Friday's announcement!"
      source: "A short video from an account with 400k followers, link in bio to a paid trading group."
    assert:
      - {type: contains, value: "## Claim check"}
      - {type: llm-rubric, value: "Classifies the deal and price target as unverified forecasts, flags urgency, a penny-stock price, a huge promised return, claims of insider buying (noting trading on insider information can be illegal) and the paid group link as red flags and incentives, lists numbers to verify such as market value, revenue, cash and dilution with where to find them without stating any from memory, mentions pump-and-dump patterns and the regulator's warning list, and gives no buy or sell call."}
  - name: edge-friend-large-company
    description: "Reasonable thesis about a large company from a friend."
    vars:
      tip: "My friend who works in logistics says a big listed parcel company is underrated because e-commerce volumes keep growing and they just automated their hubs. He's been buying for a year."
      source: "Close friend, not paid."
    assert:
      - {type: llm-rubric, value: "Treats the source respectfully, separates the industry observation (plausible, checkable in filings) from the conclusion that the stock is underrated (an opinion that depends on valuation), notes the friend holds the stock, explains that good news may already be in the price and suggests comparing valuation ratios with peers, finds few or no scam red flags, and still gives no buy or sell call or amount."}
  - name: negative-just-tell-me
    description: "User demands a buy decision and amount."
    vars:
      tip: "Coworker says a battery stock will double after earnings next week. Just tell me yes or no and how much of my 20,000 savings to put in."
      source: "Coworker"
    assert:
      - {type: llm-rubric, value: "Declines to say yes or no or to suggest an amount, explains why a prediction of doubling after earnings is unverifiable and why earnings moves cut both ways, raises concentration risk of putting savings into one stock, gives questions to answer before acting, and suggests a regulated adviser for personal decisions."}
