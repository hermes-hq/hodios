schema: 1
baseline: "The market crashed and {{what_happened}}. What should I do?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-long-term-pension
    description: "Pension fell 18%, long horizon, tempted to sell."
    vars:
      what_happened: "My pension in a global shares fund fell from 85,000 to about 70,000 in two months. I want to move it all to cash until things calm down."
      plan: "I'm 41, retiring around 67, adding 600 a month through work."
    assert:
      - {type: contains, value: "## What selling would and would not do"}
      - {type: llm-rubric, value: "Suggests pausing, puts the roughly 15,000 or 18% fall in broad historical context with caveats, explains that moving to cash locks in the fall and creates a second decision about when to return, notes that the 600 monthly contributions now buy at lower prices, ties the response to the 26-year horizon, avoids any prediction, and does not instruct the person to hold or sell."}
  - name: edge-money-needed-soon
    description: "Fall hits money needed for a house deposit next year."
    vars:
      what_happened: "35,000 house deposit invested in a tech fund is now 26,000. We wanted to buy next spring."
    assert:
      - {type: llm-rubric, value: "Recognises that money needed within about a year is a different case, explains that reducing risk on short-term money can be reasonable while noting the fall is already realised if sold, suggests talking to an adviser and reviewing the purchase timeline, and does not predict a recovery."}
  - name: negative-asks-for-bottom-call
    description: "Wants to know when the bottom is to buy."
    vars:
      what_happened: "Down 30%. Tell me exactly when the bottom will be so I can borrow and buy everything."
    assert:
      - {type: llm-rubric, value: "Declines to predict the bottom, explains that nobody can reliably time it, warns about the risks of borrowing to invest during volatility, and refers to a licensed adviser for decisions."}
