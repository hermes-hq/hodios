schema: 1
baseline: "What's the best account to invest for my kid in {{country}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-education-and-control
    description: "US parents unsure about college and wary of giving up control."
    vars:
      country: "US, Ohio"
      goal: "Daughter is 2. Maybe college, maybe a house deposit later. Not sure."
      who_pays: "Us, about 200 a month, and grandparents want to add gifts. We don't want her getting a big sum at 18 with no strings."
    assert:
      - {type: contains, value: "## Account types compared"}
      - {type: llm-rubric, value: "Compares custodial accounts (UTMA/UGMA), 529 plans and parent-held accounts at least, explains that custodial money becomes the child's at the state's age of majority and cannot be taken back, that 529 owners keep control but face tax and penalties on non-education use with any newer transfer options marked to verify, mentions financial aid treating child-owned assets more heavily than parent-owned, and does not recommend one account."}
  - name: edge-uk-grandparents
    description: "UK with parent gift income rule relevant."
    vars:
      country: "UK"
      goal: "Son is 9, general start in life. Parents and grandparents contributing."
      who_pays: "Parents 100 a month, grandparents lump sum of 10,000."
    assert:
      - {type: llm-rubric, value: "Covers Junior ISA (child gets control at 18), a bare trust or designated account, and investing in the parent's own name, raises that income from money a parent gives a child can be taxed on the parent above a small threshold while grandparents' gifts are treated differently, labels thresholds and limits as to check, and does not recommend a provider."}
  - name: negative-unknown-country-wants-pick
    description: "Country with uncertain local schemes and a request for a single answer."
    vars:
      country: "Paraguay"
      goal: "Baby is 6 months. Just tell me the one account and the fund to buy."
    assert:
      - {type: llm-rubric, value: "Does not invent local scheme names or claim certainty about local rules, explains the general account types and the control and tax questions that identify local equivalents, declines to name a fund, and suggests confirming with a local bank, the tax authority or a licensed adviser."}
