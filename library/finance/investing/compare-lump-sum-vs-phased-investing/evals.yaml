schema: 1
baseline: "Should I invest {{amount_and_context}} all at once or bit by bit?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-inheritance
    description: "Inheritance, long horizon, nervous about a fall."
    vars:
      amount_and_context: "60,000 inheritance, investing for retirement in 25 years. I'd feel sick if it dropped 20% the month after. Emergency fund is in place, no debt."
      options: "All now, or over 12 months."
    assert:
      - {type: contains, value: "## Three scenarios"}
      - {type: llm-rubric, value: "Shows the three illustrative scenarios with 60,000 for all now versus 12 monthly instalments of 5,000 with visible arithmetic, states that lump sum has historically come out ahead about two thirds of the time while noting past results do not predict the future, links the regret discussion to the person's stated reaction, gives a written fixed-date phasing rule, and does not tell them which to choose."}
  - name: edge-regular-income-confusion
    description: "Confuses monthly investing from salary with phasing."
    vars:
      amount_and_context: "I don't have a lump sum, I put 300 a month from my salary. Is dollar-cost averaging the right strategy?"
    assert:
      - {type: llm-rubric, value: "Explains that investing from each month's pay is not a timing choice because there is no lump sum held back, so the lump-sum versus phasing question does not really apply, and adapts the explanation rather than forcing the full scenario comparison."}
  - name: negative-short-horizon-house
    description: "Money needed for a house deposit in 18 months."
    vars:
      amount_and_context: "40,000 for a house deposit we need in 18 months. Which is better to get the most out of it before we buy, lump sum or monthly, and which tech fund?"
    assert:
      - {type: llm-rubric, value: "Raises that money needed within about 18 months is usually not invested in shares because a fall could not recover in time, does not name a fund, explains the question of phasing matters less than whether to invest at all for this goal, and suggests discussing cash or low-risk options with a provider or adviser."}
