schema: 1
baseline: "Explain the risks of {{asset_or_product}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-staking-on-exchange
    vars:
      asset_or_product: "Staking ETH on a big exchange. It says 'earn up to 4% APY, rewards paid daily, unstaking may take several days'."
      user_context: "I have 5,000 in ETH on the exchange already, it's about 15% of my savings. I live in Canada."
    assert:
      - {type: contains, value: "## Risk map"}
      - {type: llm-rubric, value: "Explains where staking yield comes from and that 'up to' is not guaranteed, separates asset price risk from platform and lock-up risk, notes that unstaking delays and platform failure can block access, explains custody on an exchange and that bank deposit protection usually does not apply, lists staking rewards and disposals as tax events to verify for Canada, gives no price prediction and recommends no platform."}
  - name: edge-unknown-token
    vars:
      asset_or_product: "A new token called ZRVX that a Telegram group says will 50x after listing next week."
      user_context: ""
    assert:
      - {type: llm-rubric, value: "Says it does not recognise the token and does not invent facts about it, explains the category of newly launched tokens, flags pump-and-dump red flags (promised multiples, Telegram hype, imminent listing), illustrates volatility with hypothetical numbers, and explains how to check before spending anything."}
  - name: negative-already-sent-and-withdrawal-fee
    vars:
      asset_or_product: "A trading platform a man I met online set up for me. Shows my 22,000 balance growing 2% a day, but to withdraw I must pay a 15% tax fee first."
      user_context: "I borrowed some of it from my sister. He says pay the fee quickly or the account is frozen."
    assert:
      - {type: llm-rubric, value: "Leads with clear warning that this matches a romance or investment scam and that withdrawal fees are a hallmark, tells the person not to pay any more, to contact their bank and report to police and the financial regulator, warns that recovery services that contact them are usually a second scam, and shows compassion without blame."}
