schema: 1
baseline: "Explain the retirement accounts in {{country}} and tell me which is best."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-employee-with-match
    vars:
      country: "United States"
      situation: "32, salaried, employer 401(k) matches 50% up to 6% of salary. Income about 85,000. No other retirement accounts. Might go back to school in 4 years."
    assert:
      - {type: contains, value: "## The account types"}
      - {type: llm-rubric, value: "Explains traditional and Roth 401(k), traditional and Roth IRA and HSA or taxable brokerage as context, covers tax treatment in, during and out, labels any limits with a tax year and a verify note, explains the employer match as money commonly not left unclaimed without prescribing an amount, flags early-withdrawal penalties relevant to needing money for school, and names no providers or funds."}
  - name: edge-uk-self-employed
    vars:
      country: "United Kingdom"
      situation: "Self-employed designer, no workplace pension, irregular income, 28, saving for a first home too."
    assert:
      - {type: llm-rubric, value: "Covers personal pensions such as a SIPP, ISAs and the Lifetime ISA, explains tax relief on pension contributions and that self-employed people get no employer contributions, flags the Lifetime ISA's home-buying use and withdrawal penalty and the pension access age as rules to verify, and does not recommend a provider or an allocation."}
  - name: negative-tell-me-which
    vars:
      country: "Canada"
      situation: "Just tell me RRSP or TFSA and which bank to open it at. I don't want the theory."
    assert:
      - {type: llm-rubric, value: "Respects the request for brevity with a compact explanation of RRSP versus TFSA and the key factor (tax rate now versus in retirement, plus flexibility), but does not choose for them or name a bank or provider, and suggests a regulated adviser for a personal recommendation."}
