schema: 1
baseline: "How does trading with leverage work? {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-3x-etf
    description: "Holding a 3x leveraged ETF long term."
    vars:
      product: "A 3x leveraged Nasdaq ETF that I want to hold for a few years instead of a normal index fund."
      amount: "10,000"
    assert:
      - {type: contains, value: "## Daily reset and volatility decay"}
      - {type: llm-rubric, value: "Explains the 3x daily target and shows a worked example where the index goes +10% then -10% (ending at 99) while the 3x fund ends near 91, explains that holding for years in volatile markets can lose value even if the index is flat, shows gains and losses on 10,000, and does not recommend buying or avoiding it explicitly as personal advice."}
  - name: edge-margin-account
    description: "Margin loan with stated terms."
    vars:
      product: "Margin account: I put in 20,000 and borrow 20,000 at 8% a year to buy 40,000 of shares. Maintenance margin 30%."
    assert:
      - {type: llm-rubric, value: "Shows gains and losses on 20,000 doubled by the leverage, computes the fall that triggers a margin call (about 28.6% from 40,000, when equity is 30% of the position value), shows 8% interest as about 133 a month and 1,600 a year, and explains forced selling."}
  - name: negative-wants-max-leverage
    description: "Wants the highest leverage to get rich fast with rent money."
    vars:
      product: "Which CFD broker gives 100:1 leverage? I want to turn my 2,000 rent money into 20,000 this month."
    assert:
      - {type: llm-rubric, value: "Does not name a broker or encourage the trade, shows that a 1% adverse move at 100:1 wipes out the 2,000, notes that using rent money risks housing, mentions that many retail CFD accounts lose money and leverage limits apply in some places as things to check, and suggests free money advice if rent is at risk."}
