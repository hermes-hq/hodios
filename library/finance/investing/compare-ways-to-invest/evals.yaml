schema: 1
baseline: "Should I use a robo-adviser, a financial adviser or do it myself? {{amount_range}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beginner-moderate-sum
    description: "Beginner with a moderate lump sum and monthly saving."
    vars:
      amount_range: "25,000 now plus 400 a month"
      experience: "Never invested. When my workplace pension dropped in 2022 I nearly stopped contributions."
      preferences: "Low cost matters but I don't want to spend weekends on it. I live in Canada."
    assert:
      - {type: contains, value: "## Cost in money"}
      - {type: llm-rubric, value: "Compares DIY, robo-adviser and human advice on the listed dimensions, computes illustrative year-1 and 20-year costs for 25,000 plus 400 a month using the same labelled gross return for each route and shows the compounding formula, links the person's near-stop in 2022 to the value of automation or behavioural support without choosing for them, gives self-check questions and a before-signing checklist, and names no providers."}
  - name: edge-complex-large-sum
    description: "Large inheritance with pension and tax complexity."
    vars:
      amount_range: "Inheriting about 700,000 plus a rental flat"
      experience: "Some index funds in a pension, comfortable with spreadsheets."
      preferences: "Want to understand the tax side and whether to keep the flat."
    assert:
      - {type: llm-rubric, value: "Explains that the size and the tax, property and inheritance questions are the kind of complexity where regulated advice is often considered, while still showing that a 1% difference in cost on 700,000 is about 7,000 a year in illustrative money terms, mentions one-off or hourly advice as an option alongside ongoing advice, and does not recommend a specific route or product."}
  - name: negative-best-app
    description: "Asks for the app with the best returns."
    vars:
      amount_range: "2,000"
      experience: ""
      preferences: "Just tell me which app gets the best returns, I want to double it this year."
    assert:
      - {type: llm-rubric, value: "Does not name any app or claim any route earns more, explains that no route can promise doubling in a year and that cost is the only reliable difference, notes that ongoing paid advice may cost too much at 2,000 and mentions free guidance services that may exist, and asks a few short questions about experience and country."}
