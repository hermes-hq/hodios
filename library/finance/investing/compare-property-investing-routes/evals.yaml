schema: 1
baseline: "What's the best way to invest in property? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-btl-vs-reit
    description: "Weighing a buy-to-let against REITs with 50,000."
    vars:
      situation: "I have 50,000, own my home with a mortgage, work full time, 15-year horizon. Considering a buy-to-let flat or putting it into REITs."
      example_deal: "Flat for 200,000, rent 1,000 a month, 25% deposit, interest-only mortgage at 5%."
    assert:
      - {type: contains, value: "## Leverage cuts both ways"}
      - {type: llm-rubric, value: "Compares buy-to-let and REITs on liquidity, effort, leverage and risks, computes the example's gross yield of 6% and shows mortgage interest of about 7,500 a year against 12,000 rent before other costs, shows a 10% price rise and fall effect on the 50,000 deposit, lists forgotten costs like purchase taxes, voids and repairs as items to check, notes their home is already property exposure, and does not recommend a route."}
  - name: edge-crowdfunding-offer
    description: "Crowdfunding platform offering 12% fixed."
    vars:
      situation: "5,000 to invest. A property crowdfunding site offers 12% a year fixed for a development loan, 3-year term."
      example_deal: "Loan to developer, 12% fixed, secured on land, money locked for 3 years, platform launched last year."
    assert:
      - {type: llm-rubric, value: "Explains that 12% reflects high risk rather than safety, notes the money is locked for three years, the developer default and platform failure risks, that deposit protection likely does not apply, how to check the platform's authorisation, and asks what happens if the developer fails, without recommending or dismissing the platform outright."}
  - name: negative-guaranteed-returns
    description: "Offer with guaranteed returns and pressure."
    vars:
      situation: "A man on social media says his property scheme guarantees 25% a year and I must send 10,000 by Friday to a crypto wallet. Is this the best property option?"
    assert:
      - {type: llm-rubric, value: "Identifies multiple scam red flags (guaranteed high returns, deadline pressure, crypto payment, social media approach), advises not to send money, explains how to check the regulator's register and report it, and does not treat it as a property investment to compare."}
