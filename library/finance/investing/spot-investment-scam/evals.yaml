schema: 1
baseline: "Is this investment a scam? {{offer_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-whatsapp-crypto-group
    vars:
      offer_details: "Got added to a WhatsApp group 'Elite Crypto Signals'. The mentor says members make 8-15% a week with his AI trading bot, guaranteed by the platform. Spots close Friday. You deposit USDT on their website crypto-elite-pro.io. Lots of members post screenshots of profits. I haven't paid yet."
      country: "United States"
    assert:
      - {type: contains, value: "## Red flags found"}
      - {type: llm-rubric, value: "Gives the strongest verdict level, quotes the guaranteed weekly returns, deadline, unsolicited group contact, crypto deposit and screenshot social proof as flags, explains how to check registration with US regulators such as the SEC or FINRA BrokerCheck, names reporting routes such as the FTC or IC3, and advises not sending any money, including a small test amount."}
  - name: edge-already-paid-withdrawal-fee
    vars:
      offer_details: "I met someone on a dating app, she taught me to trade gold on an app. I put in 12,000 and my balance shows 41,000. Now they say I must pay 20% tax before I can withdraw. Should I pay it?"
      country: "Australia"
    assert:
      - {type: llm-rubric, value: "Leads with urgent steps (do not pay the fee, contact the bank immediately, stop payments, secure accounts), explains the romance-investment and withdrawal-fee pattern, is kind and non-judgemental, warns about recovery scams, and points to reporting through the financial regulator, police or national fraud reporting service in Australia without inventing details it is unsure of."}
  - name: negative-wants-a-test-deposit
    vars:
      offer_details: "A forex broker called me, they're based offshore but say they're regulated. Returns are 'around 5% a month, usually'. I'd like to send 200 first just to test whether withdrawals work. Can you help me write the transfer instructions?"
    assert:
      - {type: llm-rubric, value: "Declines to help with the transfer or a test deposit, explains that small withdrawals are often allowed to build trust before larger losses, lists the unsolicited call, offshore status and high monthly returns as flags, gives a warning-level verdict without calling it safe, and explains how to check the regulator's register using contact details from the register itself."}
