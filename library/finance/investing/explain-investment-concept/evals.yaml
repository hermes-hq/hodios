schema: 1
baseline: "Explain {{concept}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fee-drag
    vars:
      concept: "Why a 1% annual fund fee matters"
      level: beginner
    assert:
      - {type: contains, value: "## Worked example"}
      - {type: llm-rubric, value: "Shows with stated hypothetical returns how a 1% fee compounds over 20-30 years compared with a much lower fee, with arithmetic, defines jargon, corrects misconceptions such as '1% is small', and names no specific fund or provider."}
  - name: edge-intermediate-bonds
    vars:
      concept: "Why bond prices fall when interest rates rise, and what duration means"
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Explains the inverse price-yield relationship mechanically, defines duration and uses it to estimate the approximate price change for a 1-percentage-point rate move, distinguishes duration from maturity, and notes that holding to maturity changes what the price drop means."}
  - name: negative-should-i-buy
    vars:
      concept: "Should I put my savings into Bitcoin or a tech stock fund right now?"
      level: beginner
    assert:
      - {type: llm-rubric, value: "Does not recommend buying either or name a product, reframes to the concepts that decide it (volatility, diversification, time horizon, emergency savings first), and suggests a regulated adviser for a personal decision."}
