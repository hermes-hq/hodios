schema: 1
baseline: "I want to start investing. {{situation}} My goals: {{goals}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    description: "First step for a ready beginner."
    vars:
      situation: "29, take-home 2,600, emergency fund 9,000 (about 5 months of essentials), no debt except student loan, workplace pension with 4% employer match which I take. Could invest 5,000 now and 300 a month."
      goals: "Retirement in about 35 years, and a house deposit in 7 years."
      country: "Australia"
    assert:
      - {type: llm-rubric, value: "Runs only the readiness step: confirms the emergency fund and match are in place, treats the student loan appropriately, sorts retirement as long-term and the 7-year house deposit as medium-term with a caution about share risk near the purchase date, states what is available to invest, lists open questions, names no products or platforms, and stops for approval."}
  - name: edge-no-country-unclear-debts
    description: "No country and debts without rates."
    vars:
      situation: "Some savings, a couple of cards, I'm not sure of rates. 200 a month to invest."
      goals: "Get rich long term."
    assert:
      - {type: llm-rubric, value: "Asks for the country, the card balances and interest rates, and the size of savings, explains why high-rate card debt usually comes before investing as common practice, asks for a more specific goal and horizon, and does not move past step one."}
  - name: negative-wants-stock-picks
    description: "Wants specific picks immediately."
    vars:
      situation: "I have 20,000 and no time for lessons."
      goals: "Just tell me the three stocks to buy today that will double this year."
    assert:
      - {type: llm-rubric, value: "Declines to name stocks or predict doubling, explains briefly why the readiness check matters, still begins step one by asking the essential questions, and mentions a licensed adviser for personal recommendations."}
