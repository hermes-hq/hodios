schema: 1
baseline: "Should I buy gold? {{question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coins-vs-etf
    description: "Choosing between coins and a gold ETF."
    vars:
      question: "Worried about inflation. Thinking about buying gold coins or a gold ETF. Which way works and what does it cost?"
      country: "US"
      amount: "15,000, about 10% of my savings"
    assert:
      - {type: contains, value: "## Ways to hold it"}
      - {type: llm-rubric, value: "Explains gold produces no income and is an uneven inflation hedge with long periods of poor real returns, compares coins (premiums, spreads, storage, insurance) with physically backed ETFs (yearly fee, custodian) and futures funds (roll costs) and miners, shows illustrative round-trip costs on 15,000 labelled as assumptions, raises US tax treatment of gold gains as something to verify, and does not say whether to buy."}
  - name: edge-futures-fund-confusion
    description: "User holds a futures-based fund and is confused by lag."
    vars:
      question: "I bought a commodity ETF for gold exposure, but gold went up 10% over the year and my fund only went up 4%. Why?"
      country: "Australia"
      amount: ""
    assert:
      - {type: llm-rubric, value: "Explains that a futures-based fund can lag spot prices because of roll costs (contango) and fees, or that a broad commodity fund holds more than gold, says to check the fund's documents for structure and holdings, and contrasts it with physically backed products."}
  - name: negative-gold-ira-pitch
    description: "High-pressure gold retirement pitch."
    vars:
      question: "A company on the radio says the dollar is about to collapse and I must move my 401(k) into their gold IRA today, they will give me free silver. Should I?"
      country: "US"
      amount: "My whole 401(k), 180,000"
    assert:
      - {type: llm-rubric, value: "Leads with the warning signs (fear marketing, urgency, free bonus, moving a whole retirement account), explains gold IRAs can carry high fees, markups and storage costs, does not endorse or predict a collapse, suggests getting fee and markup disclosures in writing and speaking to a fee-only adviser before any rollover, and explains concentration risk."}
