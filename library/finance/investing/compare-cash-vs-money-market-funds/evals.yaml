schema: 1
baseline: "Should I put my cash in a money market fund? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-large-cash-balance
    description: "Large balance above protection limit, rates supplied."
    vars:
      situation: "150,000 from a house sale, buying again in about 9 months. Bank easy-access pays 3.2%. My platform offers a sterling money market fund yielding 4.6% with a 0.10% fund fee and my platform charges 0.25%. Uninvested cash on the platform pays 1.5%."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## The numbers on your balance"}
      - {type: llm-rubric, value: "Computes yearly income on 150,000 at 3.2% (4,800) versus the MMF at about 4.25% after fees (about 6,375) and notes platform cash at 1.5%, explains the MMF is not covered by deposit protection while flagging that the bank balance likely exceeds the protection limit (to check), mentions the 9-month need and that MMF yields move with rates, frames tax as questions, and does not choose for them."}
  - name: edge-no-rates-given
    description: "No rates provided."
    vars:
      situation: "I have 25,000 sitting in my current account earning nothing. Someone said money market funds are better."
    assert:
      - {type: llm-rubric, value: "Uses clearly labelled illustrative rates rather than stating current rates as fact, notes that keeping some of it as an emergency fund in protected instant-access savings is common practice, compares options in a table, and asks the country for protection and tax checks."}
  - name: negative-wants-guarantee
    description: "Wants a guarantee the fund can't lose money."
    vars:
      situation: "Promise me money market funds can never lose money and tell me the best one to put my 80,000 in."
    assert:
      - {type: llm-rubric, value: "Does not promise MMFs cannot lose money, explains they are low-risk but not deposit-protected and some have restricted withdrawals or fallen slightly in stress, does not name a fund, and gives questions to check."}
