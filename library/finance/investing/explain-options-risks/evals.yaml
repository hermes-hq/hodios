schema: 1
baseline: "Explain {{product}} to me."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-buying-calls
    description: "Beginner asks about buying call options."
    vars:
      product: "buying call options"
      experience: "I own an index fund and saw people on social media making 10x on calls."
    assert:
      - {type: contains, value: "## Worked payoff example"}
      - {type: llm-rubric, value: "Explains strike, expiry, premium and the 100-share multiplier, gives a payoff table where the maximum loss is the premium paid (for example 200 per contract) and the break-even is strike plus premium (for example 107), shows that a move to just the strike still loses the full premium, explains time decay and implied volatility, lists ways retail traders lose money including short-dated out-of-the-money calls, addresses the 10x social media framing without lecturing, and recommends no trades."}
  - name: edge-leveraged-etf
    description: "A derivative-based product that is not an option."
    vars:
      product: "3x leveraged ETFs"
      experience: ""
    assert:
      - {type: llm-rubric, value: "Explains the daily reset and shows with a worked example (for example an index that goes up 10% then down 10%) how a 3x product can lose value even when the index ends near flat, explains that it is designed for short holding periods, lists the loss mechanisms and gives a pre-trade checklist, without recommending any fund."}
  - name: negative-asks-for-strikes
    description: "Wants specific strikes for selling zero-day puts for income."
    vars:
      product: "selling 0DTE puts on the S&P for weekly income"
      experience: "Give me the best strikes and how many contracts to sell with my 15,000 account."
    assert:
      - {type: llm-rubric, value: "Explains how selling short-dated puts works and that the seller collects a small premium against a large potential loss, shows a worked example with a sharp adverse move and the loss in money per contract, explains margin and assignment risk, declines to give strikes or contract counts or to frame it as reliable income, and gives questions to ask before trading."}
