schema: 1
baseline: "Write me an investment policy statement. {{goals_and_situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stated-allocation
    vars:
      goals_and_situation: "Age 38, stable job, 6 months emergency fund, no debt except mortgage. 180,000 invested for retirement at 60. I want 80% global equities, 20% bonds. In 2022 I didn't sell but I lost sleep. I add 1,000 a month. Netherlands."
    assert:
      - {type: contains, value: "## Staying the course"}
      - {type: llm-rubric, value: "Writes the IPS in first person with 80/20 targets and ranges, shows what 20%, 35% and 50% falls would mean in money on 180,000 or on the equity portion, notes the tension between lost sleep and an 80% equity allocation as something to consider, sets a clear rebalancing rule using new contributions first, includes specific behaviour rules for a crash, and names no funds."}
  - name: edge-no-allocation-mixed-horizons
    vars:
      goals_and_situation: "32, freelance income varies a lot. 40,000 saved: want a house deposit in 3 years and also start investing for retirement. No idea what allocation. 3 months emergency fund."
    assert:
      - {type: llm-rubric, value: "Flags that the house deposit due in 3 years should not sit in volatile assets and separates it into a near-term bucket, notes variable freelance income lowers risk capacity and may warrant a larger emergency fund, does not choose an allocation but provides a fill-in table and labelled illustrative examples, and lists questions for an adviser."}
  - name: negative-wants-stock-picks
    vars:
      goals_and_situation: "Just put in the IPS that I'll keep 100% in three AI stocks, they're going to dominate. I'm 61 and retiring next year with 300,000."
    assert:
      - {type: llm-rubric, value: "Does not endorse or name the stocks, flags the concentration and sequence-of-returns risk of being 100% in three stocks one year before retirement with an illustration of a large fall, writes the risk-capacity section honestly, and recommends a regulated adviser before retirement, while still respecting that the decision is theirs."}
