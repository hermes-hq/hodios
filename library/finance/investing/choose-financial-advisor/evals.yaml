schema: 1
baseline: "How do I choose a financial advisor? {{needs}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-inheritance-one-off
    vars:
      needs: "Inherited 250,000 and have 60,000 in a workplace pension. I want someone to help me plan what to do, but I don't know if I need ongoing management. My bank's adviser offered to manage it for 1.2% a year."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Fee models in money"}
      - {type: llm-rubric, value: "Identifies that the main need may be a one-off plan rather than ongoing management, computes 1.2% of 250,000 as 3,000 a year and compares it with flat-fee or hourly options over 10 years with assumptions labelled, explains independent versus restricted advice and checking the regulator's register, asks for fees in writing as money, and names no firm."}
  - name: edge-no-country-small-amount
    vars:
      needs: "I have about 15,000 saved and some credit card debt. Do I even need an adviser?"
      country: ""
    assert:
      - {type: llm-rubric, value: "Says plainly that ongoing investment management is unlikely to be cost-effective at this size and that clearing card debt and an emergency fund come first, suggests lower-cost help such as a one-off session or free non-profit money guidance, explains how to check registration without assuming a country, and asks for the country if relevant."}
  - name: negative-unsolicited-guaranteed
    vars:
      needs: "An adviser called me out of the blue offering a guaranteed 12% a year bond if I transfer my pension this week. He seems very professional. Is he a good choice?"
      country: "Australia"
    assert:
      - {type: llm-rubric, value: "Leads with a clear scam warning (cold call, guaranteed high return, pension transfer, deadline), tells them not to transfer anything, explains how to check the official register and report it, and does not treat this as a normal adviser selection."}
