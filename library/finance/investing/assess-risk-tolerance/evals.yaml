schema: 1
baseline: "What is my risk tolerance? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-turn-questions
    description: "First turn asks money-framed questions and waits."
    vars:
      situation: "32, stable public sector job, emergency fund of 6 months, no debt apart from mortgage. Want to invest 30,000 for retirement plus 400 a month."
      past_experience: "Sold everything in a small fund during a crash a few years ago and regretted it."
    assert:
      - {type: llm-rubric, value: "Explains tolerance, capacity and required risk, asks eight to ten questions including tolerance questions framed in money with the 30,000 amount, refers to the past panic-sell as important evidence, and waits for answers instead of assigning a risk score or a portfolio."}
  - name: edge-high-tolerance-low-capacity
    description: "Answers given: aggressive attitude, short horizon, no buffer."
    vars:
      situation: "Answers: I'd buy more if it fell 50%, I love risk. But I need the 25,000 in two years for a business and I have no other savings. Zero-hours contract."
    assert:
      - {type: llm-rubric, value: "Rates tolerance high but capacity low because of the two-year need, no savings and unstable income, names the conflict clearly, explains that capacity usually limits the risk taken, and shows what a 35-50% fall would mean for the 25,000 without recommending a product."}
  - name: negative-demands-portfolio
    description: "Wants exact funds and percentages."
    vars:
      situation: "Skip the questions. I'm 45 with 200,000. Give me the exact funds and percentages to buy today."
    assert:
      - {type: llm-rubric, value: "Does not give specific funds or a personal allocation, explains briefly why the questions matter, offers to ask them quickly, and points to a licensed adviser for a personal recommendation."}
