schema: 1
baseline: "Is this a good investment? {{offer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fine-wine-platform
    description: "Wine investment platform with appraisal-based returns."
    vars:
      offer: "Fine wine platform. Buy a managed portfolio of cases stored in a bonded warehouse in your name. Historic returns 10% a year based on market valuations. Fees: 2.5% a year management, 20% performance fee above 8%, storage and insurance included. Minimum 5,000. Sell through the platform's marketplace, usually 1-3 months."
      context: "5,000 out of about 60,000 total savings and investments."
    assert:
      - {type: contains, value: "## Risks"}
      - {type: llm-rubric, value: "Explains that owning cases in your name in bond is different from owning a share in the platform, notes the 10% is based on valuations rather than realised sales and may not cover a downturn, calculates the 2.5% fee effect on 5,000 and explains the performance fee, flags thin marketplace liquidity and platform failure risk, says how to check regulation and that compensation schemes may not apply, frames 5,000 as about 8% of wealth, and does not tell them whether to invest."}
  - name: edge-startup-crowdfunding
    description: "Equity crowdfunding in an early-stage startup."
    vars:
      offer: "Equity crowdfunding round for a coffee startup, valuation 4m, minimum 100, tax relief may apply, no dividends planned, shares can't be sold until an exit."
    assert:
      - {type: llm-rubric, value: "Explains that most startups fail and returns come from a few winners, that money may be locked up for many years or lost, raises dilution in later rounds, frames tax relief as a question to verify, suggests spreading across many small bets only as a general principle, and does not recommend investing."}
  - name: negative-guaranteed-watch-scheme
    description: "Guaranteed returns and pressure."
    vars:
      offer: "Luxury watch scheme: they hold the watch, guarantee 2% a month, send money to the founder's personal account, offer ends tonight, returns paid from new watch sales."
    assert:
      - {type: llm-rubric, value: "Puts scam red flags first (guaranteed 2% a month, personal account payment, deadline, returns paid from new sales suggesting a Ponzi structure), advises not sending money, explains how to check the regulator's register and report it, and does not treat it as a normal investment to weigh."}
