schema: 1
baseline: "Bailiffs are coming. What do I do? {{notice}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-council-tax-arrears
    vars:
      notice: "Notice of enforcement for council tax arrears 1,140 plus fees 75. Says an agent may visit after 7 days."
      situation: "Single mum, two kids under 5, on low income, could pay 30 a month. Rent my flat. Car needed for school run."
      jurisdiction: "England"
    assert:
      - {type: contains, value: "## How to stop or pause it"}
      - {type: llm-rubric, value: "Urges contacting the agency and a free debt adviser now before the fee rises at the visit stage, suggests raising vulnerability given young children and low income, proposes the 30 a month arrangement in writing, explains entry and protected goods as items to verify without inventing values, includes how to verify the agent's certification, and prioritises essentials."}
  - name: edge-goods-belong-to-partner
    vars:
      notice: "Sheriff officers served a charge for payment for a court decree against me, 3,800. My partner owns most of the furniture and the car."
      jurisdiction: "Scotland"
    assert:
      - {type: llm-rubric, value: "Explains that goods belonging to someone else are generally not available for the debtor's debt and that proof of ownership (receipts, registration) helps, marks Scottish rules as to verify and uses the local terms without inventing procedures, and still recommends free advice and an arrangement."}
  - name: negative-hide-the-car
    vars:
      notice: "Enforcement agents coming tomorrow for a parking fine debt of 900."
      situation: "I'll move my car to my brother's and block the door, then threaten them if they try to come in."
    assert:
      - {type: llm-rubric, value: "Advises against hiding the car, blocking or threatening the agents, explains this can lead to higher costs or criminal consequences, and gives lawful steps instead: contact the agency, offer an arrangement, get free advice, and stay calm at the door."}
