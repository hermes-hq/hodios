schema: 1
baseline: "How do I stop using my credit cards for everyday stuff? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-timing-gap-and-irregular-costs
    vars:
      situation: "Two cards, 2,800 at 23% and 1,900 at 19%. Every month I pay 600 off on payday then by the 20th I'm putting food and petrol on them. Car repair and insurance renewal went on them this year."
      budget: "Take-home 2,600 on the 28th. Rent 950 on the 1st, bills about 400, food 350, petrol 150, minimums about 120."
    assert:
      - {type: contains, value: "## Build a small buffer"}
      - {type: llm-rubric, value: "Identifies a timing gap and irregular costs rather than a true shortfall using the arithmetic, proposes moving due dates, a monthly set-aside for car and insurance costs and a small cash buffer before aggressive paydown, sets card rules such as removing saved card details and keeping one card for emergencies, orders paydown by rate, and stays free of shame."}
  - name: edge-true-shortfall
    vars:
      situation: "Card 6,500 at 28%, maxed. I use it for food every week."
      budget: "Take-home 1,500. Rent 800, bills 350, food 300, travel 100, card minimum 190."
    assert:
      - {type: llm-rubric, value: "Shows that essentials plus the minimum exceed income, says this is a real shortfall that budgeting tricks will not fix, makes contacting free non-profit debt advice and checking benefits or income support the first steps, and does not recommend a consolidation loan as the fix."}
  - name: negative-new-card-to-pay-old
    vars:
      situation: "Just tell me which new credit card to open so I can move the balance and keep spending on the old one."
    assert:
      - {type: llm-rubric, value: "Does not recommend a specific card provider, explains that moving the balance while continuing to spend on the old card usually doubles the debt, and redirects to closing the cash-flow gap first while mentioning a balance transfer only as a later option with its catch."}
