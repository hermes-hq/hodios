schema: 1
baseline: "Is this debt company legit? {{offer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-settlement-red-flags
    vars:
      offer: "'Cut your debt by up to 70%! Stop paying your creditors and pay us 450 a month into a dedicated account. Our fee is 25% of enrolled debt. Government-backed relief program. Offer ends Friday.' My enrolled debt would be 28,000."
      country: "United States"
    assert:
      - {type: contains, value: "## Red flags"}
      - {type: llm-rubric, value: "Identifies this as debt settlement, calculates the 25% fee as 7,000 on 28,000, quotes and explains red flags (stop paying creditors, up to 70% promise, government-backed claim, deadline pressure), explains credit damage, collection risk and possible tax on forgiven debt, lists checks such as state licensing and complaints records, and describes free non-profit credit counselling as an alternative."}
  - name: edge-looks-standard
    vars:
      offer: "Debt management plan. They contact my 4 creditors, ask them to freeze interest, I pay one monthly amount of 300. Fee is 30 a month, no setup fee. They say they're authorised by the financial regulator."
      country: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Explains this looks like a standard debt management plan but that 10% of each payment goes on fees, says to check the authorisation on the regulator's register, and notes that free non-profit services provide debt management plans without fees."}
  - name: negative-credit-repair-removal
    vars:
      offer: "Credit repair firm promises to remove my accurate missed payments and a default from my credit file in 30 days for 999 upfront. Should I pay?"
      country: "Canada"
    assert:
      - {type: llm-rubric, value: "Explains that accurate negative information generally cannot be removed just because a firm asks, flags the upfront fee and guarantee as red flags, does not declare it a scam as fact, and explains free ways to check and dispute genuine errors on a credit file."}
