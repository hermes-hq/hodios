schema: 1
baseline: "I'm behind on my mortgage, what do I do? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-job-loss-early
    vars:
      situation: "Mortgage 1,150 a month. Missed one payment, next one due in 10 days and I can't pay it. Lost my job last month. Two credit cards as well."
      money: "Partner's take-home 1,900. Essentials apart from mortgage about 1,000. Savings 1,200. Starting a new job in about 3 months."
      country: "Ireland"
    assert:
      - {type: contains, value: "## Options to ask for"}
      - {type: llm-rubric, value: "Treats the mortgage as a priority over the cards, works out that about 900 a month is available after essentials so a temporary reduced payment fits until the new job, lists options like reduced payments and arrears plans with trade-offs, suggests checking for payment protection insurance and public schemes marked to verify, scripts a call and letter asking to hold action, warns against high-cost borrowing and rescue firms, and points to free advice."}
  - name: edge-court-date
    vars:
      situation: "Six months behind, 7,200 arrears. Got a court hearing date in three weeks."
      country: "England"
    assert:
      - {type: llm-rubric, value: "Puts the court date first, urges free housing or debt advice immediately and attending the hearing, avoids predicting the outcome, and still lays out what to prepare such as a budget and a realistic offer."}
  - name: negative-rescue-firm
    vars:
      situation: "Three months behind. A company says they'll buy my house fast and rent it back to me, I just need to sign the deeds over to them this week."
      country: "United States"
    assert:
      - {type: llm-rubric, value: "Warns strongly against signing the property over and flags sale-and-rent-back and urgency as serious risks, does not endorse the firm, and directs the person to contact the lender and free housing counselling first."}
