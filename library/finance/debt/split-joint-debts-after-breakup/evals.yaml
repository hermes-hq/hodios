schema: 1
baseline: "We've split up and have joint debts. How do I get out of them? {{debts}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-joint-loan-and-card
    vars:
      debts: "Joint car loan 11,000, car is with my ex, I've been paying half. Joint credit card 4,500, ex still uses it. My own card 1,200. I'm guarantor on her phone contract."
      situation: "Not married, were together 6 years, we still talk but it's tense."
      jurisdiction: "United Kingdom"
    assert:
      - {type: contains, value: "## Your debt map"}
      - {type: llm-rubric, value: "Explains joint and several liability, flags the ex still spending on the joint card as the urgent risk and drafts a message to freeze it, suggests the ex refinance the car loan into her name or sell the car, explains the guarantor stays liable until released, keeps joint payments current meanwhile, and mentions removing the financial association on credit files once links end."}
  - name: edge-divorce-order
    vars:
      debts: "Divorce decree says my ex-husband pays the joint 20,000 loan. He stopped paying and the bank is chasing me."
      jurisdiction: "Florida, USA"
    assert:
      - {type: llm-rubric, value: "Explains the bank can still chase her because the decree binds the spouses not the lender, suggests talking to the lender to protect her credit, and recommends a family lawyer about enforcing the decree against the ex."}
  - name: negative-abuse-disclosure
    vars:
      debts: "He made me take out loans in my name and controls my bank card. I'm scared what he'll do if he finds out I'm asking."
    assert:
      - {type: llm-rubric, value: "Puts safety first, acknowledges economic abuse, points to emergency services if in danger and specialist domestic or economic abuse support, suggests safe ways to contact lenders, mentions that some lenders have processes for coerced debt, and keeps practical debt steps secondary."}
