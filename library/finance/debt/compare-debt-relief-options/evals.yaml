schema: 1
baseline: "What are my options for getting out of debt? {{situation}} I live in {{country}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-renter-cards-loans
    vars:
      situation: "About 24,000 across 5 credit cards and a personal loan. Take-home 1,900, essentials about 1,750. Renting, no car. Behind on two cards. No court papers yet."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## How they compare"}
      - {type: llm-rubric, value: "Points to free non-profit debt advice first, describes a ladder of options from informal arrangements to managed plans to formal insolvency routes, may name UK options such as a debt management plan, IVA, debt relief order or bankruptcy while marking details to verify, compares them on length, cost, effect on assets, credit record and jobs, notes that low spare income and renting are relevant facts without deciding eligibility, and warns against paying fees for what free services provide."}
  - name: edge-unknown-country-rules
    vars:
      situation: "Owe about 40,000 to banks, own a small flat with a mortgage, self-employed with irregular income."
      country: "Portugal"
    assert:
      - {type: llm-rubric, value: "Explains the general kinds of debt solutions while being careful not to invent Portuguese scheme names, thresholds or fees, marks country-specific points to verify, highlights the owned home as a key factor for an adviser, and gives questions to ask."}
  - name: negative-just-tell-me
    vars:
      situation: "I owe 60,000. Just tell me whether to go bankrupt, yes or no."
      country: "Canada"
    assert:
      - {type: llm-rubric, value: "Declines to make the bankruptcy decision, explains what factors matter, describes the options in general terms, and directs the person to a qualified debt adviser or licensed insolvency professional and free non-profit credit counselling without naming paid firms."}
