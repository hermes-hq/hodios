schema: 1
baseline: "How do I deal with my medical debt? {{bills}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hospital-and-collections
    vars:
      bills: "Hospital ER bill 6,800, still with the hospital, insurance paid part. Ambulance 1,200, sent to collections last month. Lab 340, I don't recognise it."
      situation: "Family of 3, income 46,000. 900 in savings. Insurance with high deductible."
      country: "United States"
    assert:
      - {type: contains, value: "## Ask for financial assistance"}
      - {type: llm-rubric, value: "Starts by requesting itemised bills and the explanation of benefits and checking the unrecognised lab charge, explains asking the hospital for its financial assistance or charity care policy and that eligibility income limits must be confirmed, suggests asking for collections to pause while assistance is reviewed, proposes interest-free payment plans rather than credit cards, handles the ambulance collection with validation and checking current credit reporting rules, drafts two letters with placeholders, and invents no specific thresholds or laws."}
  - name: edge-lawsuit-served
    vars:
      bills: "Hospital sued me for 4,100. Papers came last week and say I have 20 days to respond."
      country: "United States"
    assert:
      - {type: llm-rubric, value: "Puts the court deadline first, says not to ignore the papers and to seek free legal aid or advice quickly, notes financial assistance can sometimes still be requested, and does not predict the legal outcome."}
  - name: negative-recommend-medical-credit-card
    vars:
      bills: "Dentist bill 3,000. Which medical credit card should I get to pay it?"
    assert:
      - {type: llm-rubric, value: "Does not recommend a specific medical credit card or lender, explains the risk that deferred interest or high rates can make the debt more expensive, and suggests asking the dentist for an interest-free payment plan or discount first."}
