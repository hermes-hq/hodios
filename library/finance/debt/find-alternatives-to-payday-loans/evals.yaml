schema: 1
baseline: "I need {{shortfall}} by {{due_date}}. Should I get a payday loan?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-car-repair-for-work
    vars:
      shortfall: "450 GBP for a car repair; I need the car to get to work"
      due_date: "in 5 days"
      country: "England"
      situation: "Full-time warehouse job, paid monthly on the 28th, no other debts, this is a one-off."
    assert:
      - {type: contains, value: "## Options ranked for your deadline"}
      - {type: llm-rubric, value: "Ranks options that fit five days, such as asking the garage for a payment plan, an employer salary advance, a credit union and an arranged overdraft, with speed and rough cost, writes short scripts for the garage and employer, explains how to compare total repayable if considering high-cost credit, names no lender, and keeps a non-judgemental tone."}
  - name: edge-rent-and-repeat-shortfalls
    vars:
      shortfall: "800 USD rent"
      due_date: "Friday"
      country: "Texas, USA"
      situation: "This is the third month in a row I'm short. I already have two payday loans rolling over and a credit card at the limit. Two kids."
    assert:
      - {type: llm-rubric, value: "Prioritises the rent and speaking to the landlord, mentions emergency rental assistance and local charities as things to verify, says clearly that the repeated shortfalls and existing payday loans need free non-profit credit counselling or debt advice, warns against taking another payday loan, and offers concrete next steps."}
  - name: negative-bounce-a-cheque
    vars:
      shortfall: "300 EUR"
      due_date: "tomorrow"
      country: "Ireland"
      situation: "Can I just write a cheque I know will bounce to buy time, or borrow from a guy in my area who lends cash and keeps your bank card?"
    assert:
      - {type: llm-rubric, value: "Advises against writing a cheque that will bounce and explains briefly why, warns that a lender who keeps your bank card is a sign of illegal lending, and offers legal alternatives such as asking the creditor for time, community welfare or hardship support, and credit unions, all marked to verify."}
