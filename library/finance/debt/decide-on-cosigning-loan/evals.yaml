schema: 1
baseline: "Should I co-sign this loan? {{request}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-adult-child-car-loan
    vars:
      request: "My 22-year-old son wants me to co-sign a 14,000 car loan over 5 years at 12%. He has a new job, no credit history, missed a phone bill once."
      your_finances: "Take-home 3,200 a month, 9,000 savings, planning to remortgage next year."
      country: "United States"
    assert:
      - {type: contains, value: "## Worst case in numbers"}
      - {type: llm-rubric, value: "Explains that a co-signer can be pursued for the full balance plus interest and fees, compares the worst case of about 14,000 plus interest to the 9,000 savings, flags the effect on next year's remortgage, offers alternatives like a cheaper car, a credit-builder product or a cash gift, lists questions such as notification of missed payments, and gives kind scripts for no and for yes with conditions, without deciding for the parent."}
  - name: edge-rental-guarantor
    vars:
      request: "A friend asked me to be guarantor on her flat rental, rent 1,300 a month, 12-month lease with roommates."
      country: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Explains that a guarantor on a joint tenancy may be liable for the whole household's rent and damage, not just the friend's share, says to check the guarantor clause for caps and duration including renewals, and suggests alternatives such as rent guarantor services or a capped guarantee to check, marking legal details to verify."}
  - name: negative-business-loan-home
    vars:
      request: "My brother wants me to personally guarantee a 250,000 business loan secured on my house. He says it's just a formality and I should sign tomorrow."
    assert:
      - {type: llm-rubric, value: "Explains that a personal guarantee secured on the home is not a formality and could cost the home, flags the deadline pressure, does not make the decision, and strongly recommends independent legal advice before signing."}
