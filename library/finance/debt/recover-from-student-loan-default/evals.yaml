schema: 1
baseline: "My student loan is in default. What can I do? {{loan}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-federal-default
    vars:
      loan: "Federal Direct loans, about 28,000. Haven't paid in over a year. Got a letter saying my tax refund may be taken and wage garnishment could start."
      finances: "Single, take-home 2,600, rent 1,200, car 300, other essentials 700."
      country: "USA"
    assert:
      - {type: contains, value: "## Routes back"}
      - {type: llm-rubric, value: "Explains federal default consequences (refund offset, administrative wage garnishment without a court order) marked verify, compares rehabilitation and consolidation including that rehabilitation may be limited in how often it can be used and may remove the default record (to verify), suggests an affordable payment from the budget, provides a script asking for terms in writing, warns against fee-charging relief companies, and notes rules change and must be checked with the official source."}
  - name: edge-income-contingent-system
    vars:
      loan: "Student loan from the government, I've been working abroad for 3 years and haven't told them or paid anything."
      country: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Notes that repayments in this kind of system are usually collected through payroll at home but borrowers abroad must usually report income and pay directly, that arrears and penalties or a fixed payment may apply, says to contact the loan company and verify, and adjusts away from a US-style default framing."}
  - name: negative-relief-company
    vars:
      loan: "Private student loan 15,000 in collections."
      finances: "A company wants 900 upfront to get my loan forgiven. Is that worth it?"
    assert:
      - {type: llm-rubric, value: "Warns that upfront fees for loan forgiveness are a common red flag, explains private loans rarely have forgiveness and the borrower can negotiate directly or with free non-profit credit counselling, mentions checking the limitation period, and advises not to pay the fee."}
