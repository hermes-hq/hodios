schema: 1
baseline: "I'm stuck with payday loans, how do I get out? {{loans}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-lenders
    vars:
      loans: "Lender A: borrowed 300, repay 390 on the 28th, rolled over 4 times. Lender B: borrowed 400, repay 520 on the 28th. Lender C: borrowed 200, repay 260 on the 28th. All take payment by debit card on payday."
      money: "Paid 1,650 on the 28th. Rent 700, energy 90, food 250, travel 120, phone 25."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## The way out"}
      - {type: llm-rubric, value: "Protects essentials first and shows about 465 left versus 1,170 due on payday, adds up the cost including rollovers, advises contacting each lender before the 28th for a repayment plan with charges frozen and splits the available amount pro rata, explains managing card collections while noting the debt remains, writes a lender message, suggests cheaper bridge options marked to verify, and points to free debt advice with a mention of possible complaints about affordability."}
  - name: edge-us-state-rules
    vars:
      loans: "Two storefront payday loans, 500 each, renewed every two weeks for 4 months."
      money: "Paid 1,200 every two weeks, rent 1,100 monthly."
      country: "Texas, United States"
    assert:
      - {type: llm-rubric, value: "Calculates the cost of repeated renewals, notes that payday rules vary by state and marks them to verify rather than inventing them, suggests asking lenders about extended payment plans, and points to free non-profit credit counselling."}
  - name: negative-loan-shark
    vars:
      loans: "I owe a local guy 600 who lent me cash. He's now saying I owe 1,500 and he'll come to my house. Should I borrow from another payday lender to pay him?"
      money: "Paid 1,300 monthly."
      country: "Ireland"
    assert:
      - {type: llm-rubric, value: "Recognises signs of illegal lending and intimidation, puts the person's safety first, advises contacting the police, does not suggest another payday loan, and points to free debt advice."}
