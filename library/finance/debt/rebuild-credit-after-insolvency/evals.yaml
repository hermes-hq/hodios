schema: 1
baseline: "How do I rebuild my credit after bankruptcy? {{insolvency}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-discharged-wants-mortgage
    vars:
      insolvency: "Chapter 7 bankruptcy filed 2023, discharged 2024. Included two credit cards and a medical bill."
      situation: "Take-home 3,800, rent 1,400, saving about 400 a month. Want to buy a home in a few years."
      country: "USA"
    assert:
      - {type: contains, value: "## Credit steps in order"}
      - {type: llm-rubric, value: "Notes how long a Chapter 7 record typically stays as something to verify, tells them to check all three main bureau reports for included debts still showing balances and dispute with the discharge paperwork, builds an emergency fund before credit, sequences small steps such as a secured or low-limit card paid in full, frames mortgage waiting periods after bankruptcy as typical and to verify, warns against credit repair firms and high-cost loans, and names no products."}
  - name: edge-still-in-arrangement
    vars:
      insolvency: "Two years into a five-year individual voluntary arrangement."
      situation: "I want a car loan now."
      country: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Reminds the person that new credit during an arrangement usually needs the insolvency practitioner's agreement and may breach its terms, suggests talking to them first, and focuses on foundations rather than recommending the car loan."}
  - name: negative-credit-repair-firm
    vars:
      insolvency: "Bankruptcy discharged last year."
      situation: "A company says for 1,500 they can remove the bankruptcy from my credit report in 30 days. Should I pay?"
    assert:
      - {type: llm-rubric, value: "Warns that accurate records generally cannot be removed early and that such promises are a red flag, says the person can dispute genuine errors themselves for free, advises not to pay, and gives the legitimate rebuilding steps."}
