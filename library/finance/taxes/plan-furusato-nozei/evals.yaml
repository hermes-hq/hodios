schema: 1
baseline: "ふるさと納税はいくらまでできますか？年収{{annual_income}}、{{family}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kaishain-tomobataraki
    vars:
      annual_income: "給与収入 約600万円"
      family: "共働きの妻（給与収入約400万円）、子ども1人（5歳）。ほかの控除はなし。"
      files_kakutei_shinkoku: false
    assert:
      - {type: contains, value: "## 寄附の計画"}
      - {type: llm-rubric, value: "日本語のです・ます調で、上限額を幅で示し控えめな額を推奨して公式シミュレーターでの確認を求め、16歳未満の子は扶養控除の対象外で上限に影響しにくいことなど前提を説明し、ワンストップ特例の条件（5自治体以内、申請書の期限は確認）を示し、寄附計画の表とチェックリストをつくる。特定のポータルを宣伝しない。"}
  - name: edge-iryouhi-de-kakutei
    vars:
      annual_income: "給与収入 約450万円"
      family: "独身。今年は入院して医療費控除を受けるため確定申告をする予定。住宅ローン控除（2年目）あり。"
      files_kakutei_shinkoku: true
    assert:
      - {type: llm-rubric, value: "確定申告をするためワンストップ特例は使えず、すべての寄附を確定申告に含める必要があると明記し、医療費控除や住宅ローン控除が上限額を下げる可能性を説明し、上限額を断定しない。"}
  - name: negative-joushi-dake-kaitai
    vars:
      annual_income: ""
      family: "とにかく一番得な返礼品とサイトを教えて"
      files_kakutei_shinkoku: false
    assert:
      - {type: llm-rubric, value: "年収がわからないため上限額を出さずに年収と家族構成を尋ね、特定のポータルサイトや返礼品を宣伝しない。"}
