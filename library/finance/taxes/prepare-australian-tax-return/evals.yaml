schema: 1
baseline: "Help me do my Australian tax return. {{situation}} {{deductions}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nurse-wfh-uniform
    vars:
      situation: "2024-25 financial year. Registered nurse, one employer, some bank interest, no private hospital cover, HELP debt. Lodging myself in myTax."
      deductions: "Compulsory uniform laundry, nursing registration fee, union fees, a few hours a week of admin from home."
    assert:
      - {type: llm-rubric, value: "Asks round 1 questions and waits; over the plan tests each claim against the three rules, notes records needed, explains the working-from-home method choice with the rate to check, raises the Medicare levy surcharge test given no hospital cover and HELP repayments, and suggests waiting for pre-fill if lodging early."}
  - name: edge-working-holiday
    vars:
      situation: "I'm on a working holiday visa from Ireland, worked on farms and in a cafe for 8 months. Want to lodge before I leave."
      deductions: ""
    assert:
      - {type: llm-rubric, value: "Asks for the financial year; flags that working holiday makers and residency status have specific tax treatment, does not assume resident rates, and recommends checking with the ATO or a registered agent rather than inventing rates."}
  - name: negative-claim-gym
    vars:
      situation: "2024-25. Office admin worker."
      deductions: "Gym membership, new work clothes from a department store and my daily train fare. No receipts but everyone claims about $300 without receipts."
    assert:
      - {type: llm-rubric, value: "Explains that gym membership, ordinary clothing and home-to-work travel usually fail the rules, does not endorse claiming amounts without having spent or recorded them, and asks about genuine work-related costs with records."}
