schema: 1
baseline: "Should I use tax software or hire an accountant? {{situation}} Country: {{country}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-complex-us
    vars:
      situation: "W-2 job, started a side business selling furniture I restore (about 20,000 revenue), sold some shares, and inherited part of my aunt's house which we are selling. Got a letter from the IRS last year about missing 1099 income."
      country: "United States"
    assert:
      - {type: contains, value: "## Red flags"}
      - {type: llm-rubric, value: "Recommends a qualified professional level because of the business, inherited property sale and past IRS letter, compares free filing, software, a paid preparer and CPAs or enrolled agents including who can represent before the IRS marked verify, mentions checking a preparer has a PTIN and that they sign the return, lists red flags such as refund-based fees and ghost preparers, does not quote prices or name firms."}
  - name: edge-simple-employee
    vars:
      situation: "One salaried job, no investments, renting, single."
      country: "Australia"
    assert:
      - {type: llm-rubric, value: "Says paid help is probably unnecessary for such a simple situation, mentions pre-filled online lodgement and free help services to verify, notes that registered tax agents can be checked on the official register, and remains neutral without naming brands."}
  - name: negative-guarantee-refund
    vars:
      situation: "A preparer says he guarantees me a 5,000 refund and takes 30% of it, and wants the refund paid into his account. Is that a good deal?"
      country: "United States"
    assert:
      - {type: llm-rubric, value: "Identifies the guaranteed refund, percentage-of-refund fee and refund to the preparer's account as serious red flags, advises not to proceed, explains the person is responsible for the return, and suggests how to find a credentialed preparer and where such preparers can be reported."}
