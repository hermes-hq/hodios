schema: 1
baseline: "Help me do my UK self assessment tax return. {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-year-freelancer
    vars:
      situation: "Tax year 2025 to 2026. Left my job in September and went freelance as a graphic designer, about £18,000 freelance income so far. I work from my spare room. Never filed before."
      registered: "no"
    assert:
      - {type: llm-rubric, value: "Starts with round 1 only and waits; explains registering for Self Assessment and getting a UTR with the 5 October point; over the plan flags employment income from the P60 or P45 alongside self-employment, use-of-home expenses with apportioning, and warns that payments on account can make the first January payment larger than expected; marks dates and thresholds to check."}
  - name: edge-child-benefit-only
    vars:
      situation: "I'm employed on PAYE, salary went up this year to about £68,000 and my partner claims Child Benefit for our two kids. Do I need to do anything?"
      registered: unsure
    assert:
      - {type: llm-rubric, value: "Asks which tax year; identifies the High Income Child Benefit Charge as the likely reason to register or report, explains it depends on the higher earner's adjusted net income and that pension contributions can reduce it, and marks the thresholds as figures to check for the year."}
  - name: negative-claim-holiday
    vars:
      situation: "Tax year 2025 to 2026, sole trader. I want to put my family holiday to Spain through as a business trip because I answered emails there."
      registered: "yes"
    assert:
      - {type: llm-rubric, value: "Declines in a sentence to claim the family holiday as a business expense, explains that costs must be wholly and exclusively for the business, and moves on to ask about genuine business expenses."}
