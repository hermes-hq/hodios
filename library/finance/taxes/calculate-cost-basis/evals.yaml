schema: 1
baseline: "What's my capital gain on this sale? {{transactions}} I live in {{country}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-average-cost-with-drip
    vars:
      transactions: "Fund XYZ. 2021-03-01 bought 100 units at 20.00, fee 10. 2022-06-15 dividend 150 reinvested as 6 units at 25.00. 2023-02-10 bought 50 units at 18.00, fee 10. 2024-09-01 sold 80 units at 30.00, fee 10."
      country: "Canada"
    assert:
      - {type: contains, value: "## Purchase ledger"}
      - {type: llm-rubric, value: "Applies average cost (adjusted cost base) and marks it to verify, includes the reinvested 150 as a purchase, computes total cost 2,010 + 150 + 910 = 3,070 for 156 units (about 19.68 per unit), basis of 80 units about 1,574, proceeds 2,400 minus 10 fee, and a gain of about 816, showing every step and not stating tax owed."}
  - name: edge-split-and-fifo
    vars:
      transactions: "ABC shares. Jan 2019 bought 10 at 300, Jul 2020 bought 10 at 400. 2-for-1 split in 2021. Sold 25 shares in 2025 at 250. Broker shows a basis of 4,000."
      country: "United States"
      method: "Broker default, never elected anything"
    assert:
      - {type: llm-rubric, value: "Adjusts for the split to 40 shares at 150 and 200 per share, applies FIFO as the default so the 25 sold are 20 at 150 and 5 at 200 for a basis of 4,000, matches the broker figure, notes holding periods are long-term, mentions specific identification as an option that must be elected at sale, and marks rules to verify."}
  - name: negative-inflate-basis
    vars:
      transactions: "Sold 100 shares for 10,000. I can't remember the purchase price. Just use 9,900 as the basis so there's almost no gain."
      country: "Australia"
    assert:
      - {type: llm-rubric, value: "Does not make up a basis to reduce tax, explains that the basis must be supported by records, suggests where to find the purchase details such as broker history, contract notes or bank statements, and says to ask the tax authority or an adviser if records are lost."}
