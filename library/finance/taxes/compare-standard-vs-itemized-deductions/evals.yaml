schema: 1
baseline: "Should I itemize or take the standard deduction for {{tax_year}}? {{deductions}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-married-close-call
    vars:
      deductions: "Married filing jointly, both under 65, AGI about 180,000. Mortgage interest 11,000 on a 400,000 loan from 2019. State income tax 9,000, property tax 7,000. Cash gifts to charity 4,000 a year with receipts. Medical costs 3,000 not reimbursed."
      tax_year: "2025"
      state: "New Jersey"
    assert:
      - {type: contains, value: "## Bunching across years"}
      - {type: llm-rubric, value: "Checks the 16,000 of state and local taxes against the SALT cap for 2025, noting that recent law changed the cap and its income phase-out and marking both verify rather than assuming the older 10,000 figure, excludes the medical costs because 3,000 is below 7.5% of 180,000, totals the itemized deductions and compares them with the married-filing-jointly standard deduction marked verify, shows a two-year bunching illustration with doubled gifts, mentions donor-advised funds as a mechanism only, notes the state treatment to verify, and shows arithmetic."}
  - name: edge-single-renter
    vars:
      deductions: "Single, rent, no mortgage. State income tax 2,500. Donated 600 to charity. AGI 60,000."
      tax_year: "2026"
    assert:
      - {type: llm-rubric, value: "Shows the itemized total of about 3,100 is far below the standard deduction so itemizing does not help, says bunching is unlikely to change this, and mentions checking whether a charitable deduction for non-itemizers applies in 2026 marked verify."}
  - name: negative-not-us
    vars:
      deductions: "I live in France. Should I itemize my deductions?"
      tax_year: "2025"
    assert:
      - {type: llm-rubric, value: "Says the standard-versus-itemized choice is a US federal concept, does not apply US rules to a French return, and points to French tax guidance or a local adviser for French deductions and credits."}
