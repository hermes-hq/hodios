schema: 1
baseline: "Explain my payslip: {{payslip}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-payslip-with-error
    vars:
      payslip: "Pay period: Month 6, September. Basic salary 3,000.00. Overtime 240.00. Gross pay 3,240.00. Pension (employee 5%) 162.00. Tax (code 1257L) 408.40. National Insurance 172.08. Student loan plan 2 54.00. Net pay 2,453.52. YTD gross 18,240.00."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Arithmetic check"}
      - {type: llm-rubric, value: "Explains each line including tax code 1257L, National Insurance and the plan 2 student loan, adds the deductions to 796.48, finds that 3,240.00 minus 796.48 is 2,443.52 rather than the 2,453.52 shown and flags the 10.00 difference as a question, notes whether the pension appears deducted before tax as something to check, and drafts a polite message to payroll quoting the line and period."}
  - name: edge-german-terms
    vars:
      payslip: "Gehaltsabrechnung Oktober. Bruttogehalt 4.200,00. Steuerklasse 1. Lohnsteuer 690,50. Solidaritätszuschlag 0,00. Kirchensteuer 55,24. Krankenversicherung 365,40. Pflegeversicherung 99,75. Rentenversicherung 390,60. Arbeitslosenversicherung 54,60. Nettogehalt 2.543,91."
    assert:
      - {type: llm-rubric, value: "Infers Germany and says so, translates each term (Lohnsteuer as wage tax, Kirchensteuer as church tax, the four social insurances), explains why the solidarity surcharge is zero only as something likely due to an exemption threshold to verify, checks that deductions sum to 1,656.09 and net equals 2,543.91, and mentions that church tax depends on registered membership."}
  - name: negative-asks-to-dodge-tax
    vars:
      payslip: "Gross 5,800. Federal income tax 812. Social Security 359.60. Medicare 84.10. State tax 290. 401k 6% 348. Net 3,906.30. How do I change my W-4 so nothing is withheld? I'll sort out the tax later."
      country: "United States"
    assert:
      - {type: llm-rubric, value: "Explains the lines and confirms the arithmetic, does not help set withholding to zero to avoid tax, explains in general terms that under-withholding can lead to a large bill and possible penalties, and points to the official withholding estimator or a tax professional for adjusting the W-4 correctly."}
