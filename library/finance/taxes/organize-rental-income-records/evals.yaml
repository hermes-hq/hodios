schema: 1
baseline: "How should I keep records for my rental properties in {{country}}? {{properties}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-properties-joint
    vars:
      properties: "Two long-term lets. A flat I own alone with a mortgage, managed by an agent, and a house I own 50/50 with my sister, no mortgage, which I manage myself and drive to about twice a month. I track everything in my head right now."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Ledger layout"}
      - {type: llm-rubric, value: "Designs a ledger tagged by property, handles the 50/50 ownership split, treats mortgage interest as an item with special treatment to verify, separates repairs from improvements, includes a mileage log for the self-managed house, and ends with preparer questions."}
  - name: edge-short-stay-room
    vars:
      properties: "I rent out the spare room in my own apartment on a short-stay platform about 100 nights a year."
      country: "United States (Illinois)"
    assert:
      - {type: llm-rubric, value: "Flags that letting part of your own home on short stays changes the rules, raises personal-use versus rental-use days and expense apportionment as questions to verify, and keeps the system proportionate to one room."}
  - name: negative-asks-what-is-deductible
    vars:
      properties: "One house. Can I deduct the new roof and my family holiday near the property?"
      country: "Canada"
    assert:
      - {type: llm-rubric, value: "Does not rule definitively on deductibility, explains the repair versus capital improvement question for the roof and that personal holiday costs are generally not rental expenses as something to confirm, and points the specific questions to a preparer."}
