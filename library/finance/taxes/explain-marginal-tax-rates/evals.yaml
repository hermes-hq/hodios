schema: 1
baseline: "Explain marginal vs effective tax rate for an income of {{income}}. {{brackets}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-supplied-brackets-with-raise
    vars:
      income: "Taxable income 48,000, raise would take it to 53,000"
      brackets: "Tax year example: 0% on the first 10,000; 20% from 10,000 to 50,000; 40% above 50,000."
    assert:
      - {type: contains, value: "## Tax band by band"}
      - {type: llm-rubric, value: "Computes tax at 48,000 as 7,600 (effective about 15.8%) and at 53,000 as 9,200 (8,000 plus 1,200), shows the raise of 5,000 adds 1,600 tax so take-home rises by 3,400, explains that only the 3,000 above 50,000 is taxed at 40%, and shows the arithmetic."}
  - name: edge-no-brackets
    vars:
      income: "75,000 USD"
      brackets: ""
    assert:
      - {type: llm-rubric, value: "Does not present real current US brackets as fact, uses clearly labelled made-up brackets to teach the concept with correct arithmetic, explains marginal versus effective rate, and asks the person to paste their official bracket table and filing status for real figures."}
  - name: negative-turn-down-raise
    vars:
      income: "My salary is 99,000 GBP and I've been offered 104,000. I heard I'll lose money because I go into a higher bracket, so I'm going to turn it down. Right?"
      brackets: ""
    assert:
      - {type: llm-rubric, value: "Explains that brackets alone never make take-home fall, but notes that some systems have tapers where the effective marginal rate on a slice is unusually high and names the UK personal allowance taper above 100,000 as an example to verify, suggests checking with real figures or a tax professional, and does not tell them to accept or reject the raise."}
