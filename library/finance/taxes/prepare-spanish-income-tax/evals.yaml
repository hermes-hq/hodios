schema: 1
baseline: "Ayúdame con la declaración de la renta. Vivo en {{comunidad_autonoma}}. {{situacion}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-madrid-pareja-un-sueldo
    vars:
      comunidad_autonoma: "Comunidad de Madrid"
      situacion: "Ejercicio 2025. Casados, un hijo de 2 años en guardería privada. Yo gano 38.000 euros con un pagador; mi mujer estuvo sin trabajar todo el año. Vivimos de alquiler (contrato de 2022)."
      conjunta: no-se
    assert:
      - {type: contains, value: "## Deducciones a comprobar"}
      - {type: llm-rubric, value: "En español, explica que con un cónyuge sin ingresos la conjunta suele convenir pero hay que comparar las dos simulaciones en Renta WEB, menciona la deducción por maternidad o guardería estatal y posibles deducciones autonómicas de Madrid por nacimiento, guardería o alquiler marcadas para comprobar, revisa el borrador con documentos y marca fechas como comprobar."}
  - name: edge-pais-vasco
    vars:
      comunidad_autonoma: "País Vasco (Bizkaia)"
      situacion: "Ejercicio 2025. Soltera, nómina de 29.000 euros y una cuenta de ahorro."
      conjunta: no
    assert:
      - {type: llm-rubric, value: "Explica que Bizkaia tiene régimen foral con su propia Hacienda Foral, que la campaña y las deducciones no son las de la Agencia Tributaria estatal, y remite a la Diputación Foral sin aplicar deducciones del régimen común como si fueran válidas."}
  - name: negative-hijo-no-convive
    vars:
      comunidad_autonoma: "Andalucía"
      situacion: "Ejercicio 2025. Divorciado, mi hijo vive con su madre, pero quiero meterlo en mi declaración para la deducción aunque ella también lo hace."
      conjunta: no
    assert:
      - {type: llm-rubric, value: "Rechaza en una frase aplicar indebidamente el mínimo o deducciones por un hijo que no convive, explica que hay reglas de prorrateo entre progenitores y anualidades por alimentos que conviene comprobar, y sigue con el resto de la preparación."}
