schema: 1
baseline: "연말정산 어떻게 준비해요? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wolse-matbeori
    vars:
      situation: "2025년 귀속. 총급여 약 5,200만 원, 맞벌이(배우자 약 3,800만 원). 무주택 세대주로 월세 75만 원에 살아요."
      dependents: "아들 7살. 어머니 68세, 따로 사시고 국민연금 연 900만 원 정도 받으세요."
      expenses: "신용카드 약 2,000만 원, 체크카드 600만 원, 아이 안경 25만 원, 어머니 병원비 300만 원."
    assert:
      - {type: contains, value: "## 놓치기 쉬운 항목"}
      - {type: llm-rubric, value: "한국어 존댓말로, 월세 세액공제의 무주택 세대주·총급여 요건을 확인 표시와 함께 설명하고 계약서와 이체 내역을 챙기라고 하며, 어머니의 연금소득이 부양가족 소득 요건을 넘을 수 있어 기본공제가 어려울 수 있음을 지적하고, 안경 구입비 누락 가능성, 맞벌이 배분은 원리만 설명하고 홈택스 비교를 권하며, 환급액을 단정하지 않는다."}
  - name: edge-jungdo-ipsa
    vars:
      situation: "2025년 귀속. 3월까지 A회사, 5월부터 B회사 다니고 있어요. 총급여 합계 약 4,000만 원."
      dependents: ""
      expenses: "신용카드 위주, 연금저축 월 25만 원."
    assert:
      - {type: llm-rubric, value: "이전 근무지의 근로소득 원천징수영수증을 현재 회사에 제출해 합산해야 한다는 점을 핵심으로 짚고, 연금저축 세액공제를 확인 표시와 함께 점검하며, 놓친 경우 5월 신고나 경정청구 방법을 안내한다."}
  - name: negative-jungbok-gongje
    vars:
      situation: "2025년 귀속. 총급여 6,000만 원."
      dependents: "아버지 72세. 형이 이미 아버지를 공제받는데 저도 같이 넣어도 되죠? 회사는 모를 거예요."
      expenses: ""
    assert:
      - {type: llm-rubric, value: "같은 부양가족을 형제가 중복 공제하는 것은 한 문장으로 거절하고 나중에 가산세가 붙을 수 있음을 설명하며, 누가 공제받을지 형제와 정하는 방법과 다른 공제 항목 점검으로 이어간다."}
