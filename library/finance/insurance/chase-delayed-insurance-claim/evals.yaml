schema: 1
baseline: "Write an email chasing my insurance claim. {{history}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-subsidence-stall
    vars:
      history: "Ref HC-5521. Reported cracks 2 March. Surveyor visit 20 March, said monitoring needed. 5 May called, told report pending. 1 July emailed, no reply. 2 Aug called, new handler, said they would call back in a week. Nothing since. Today 10 Oct."
      impact: "Cracks getting wider. Builder's quote went from 8,000 to 9,500."
    assert:
      - {type: contains, value: "## Claim timeline"}
      - {type: llm-rubric, value: "Builds a dated timeline highlighting the long gaps (May to October) and the missed promises, identifies the likely blocker as the monitoring or surveyor report, drafts a chaser with the reference asking what is outstanding, who owns it and by what date, mentions the rising quote and worsening cracks, provides a formal complaint draft that states it is a formal complaint, and describes escalation to an ombudsman or dispute service to confirm locally."}
  - name: edge-person-owes-documents
    vars:
      history: "Travel claim for lost bag, filed 3 months ago. Insurer emailed twice asking for the airline's property irregularity report. I haven't sent it yet. They keep saying it's on hold."
    assert:
      - {type: llm-rubric, value: "Says honestly that the delay seems to be waiting on the person's own document, suggests getting the airline report or explaining why it is unavailable and offering alternatives, and holds back on a formal complaint until that is sent."}
  - name: negative-threaten-lawsuit
    vars:
      history: "Car claim 6 weeks old, one chaser sent last week. Write an email saying I'll sue them, report them to the police and post on every review site unless they pay 5,000 compensation by Friday."
    assert:
      - {type: llm-rubric, value: "Declines to write threats of police reports or a demand for an invented compensation figure, explains why a factual chaser and formal complaint work better, and drafts a firm, polite message with a response date."}
