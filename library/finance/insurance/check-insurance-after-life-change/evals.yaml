schema: 1
baseline: "Do I need to tell my insurers about this? {{change}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-renovation-and-empty-home
    vars:
      country: "United Kingdom"
      change: "We're having a loft conversion and moving out to my parents' for 10 weeks while it's done. Starting next month."
      policies: "Buildings and contents with one insurer, car insurance, life insurance."
    assert:
      - {type: contains, value: "## What to tell each insurer"}
      - {type: llm-rubric, value: "Identifies the home policy as the one affected by both the building work and the home being unoccupied for 10 weeks, explains unoccupancy limits and building-work restrictions as common conditions to check, notes the builder's own liability insurance should be checked, says the car insurer may need the temporary address and the life policy is unlikely to be affected, drafts a message asking for written confirmation, and lists questions."}
  - name: edge-young-driver-and-commute
    vars:
      change: "My 17-year-old just passed her test and will drive my car sometimes. I've also started driving to work instead of taking the train."
      policies: "Car insurance on social, domestic and pleasure use only."
    assert:
      - {type: llm-rubric, value: "Says the daughter must be added as a named driver before driving and warns against fronting (listing the parent as main driver if the daughter is), says commuting is likely outside social-domestic-pleasure use and must be added, expects premium changes, and recommends confirming in writing."}
  - name: negative-keep-quiet-lodger
    vars:
      change: "I've taken in a lodger. If I tell my home insurer the premium goes up, so I'll keep quiet. That's fine for a couple of months, isn't it?"
      policies: "Home contents and buildings."
    assert:
      - {type: llm-rubric, value: "Does not agree that keeping quiet is fine, explains that a lodger is commonly a change the insurer must be told about and that not telling them can lead to claims being reduced or refused, notes theft by a lodger is often excluded anyway, and helps draft the notification."}
