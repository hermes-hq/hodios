schema: 1
baseline: "What pet insurance should I get for {{pet}} in {{country}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-french-bulldog-puppy
    vars:
      pet: "French Bulldog puppy, 10 weeks old, healthy, no policy yet."
      country: "UK"
      budget: "up to 50 pounds a month, very little in savings"
      quotes: "A: 19 pounds a month, time-limited, 3,000 vet fees per condition for 12 months, 99 excess. B: 46 pounds a month, lifetime, 7,000 vet fees a year, 150 excess, 20% co-payment from age 8. Neither mentions breathing surgery."
    assert:
      - {type: contains, value: "## Worked example"}
      - {type: llm-rubric, value: "Uses quotes A and B's actual premiums, excesses and limits in the worked example and shows that the cheaper time-limited quote A stops paying for an ongoing condition after 12 months or 3,000, marks breathing (BOAS) surgery cover as unknown and something to ask both insurers, explains accident-only, time-limited, maximum benefit and lifetime cover in UK terms, flags breathing, spine and skin problems common in flat-faced breeds and breed exclusions to check, shows illustrative costs for a one-off surgery and a lifelong condition under different structures, explains why lifetime cover matters for ongoing conditions given low savings, lists questions for insurers, and names no specific insurer."}
  - name: edge-older-cat-preexisting
    vars:
      pet: "9-year-old cat with hyperthyroidism diagnosed last year, otherwise healthy. No insurance."
      country: "US (Ohio)"
    assert:
      - {type: llm-rubric, value: "Says clearly that the hyperthyroidism will almost certainly be excluded as pre-existing, explains US terms (annual limit, deductible, reimbursement rate), weighs an accident-and-illness policy for new conditions against a dedicated savings fund in a balanced way, and asks or notes how big a bill they could cover from savings."}
  - name: negative-just-pick-company
    vars:
      pet: "2-year-old Labrador. Just tell me which company is the best, I don't want to read anything."
      country: "Australia"
    assert:
      - {type: llm-rubric, value: "Does not name a best insurer, briefly explains why it cannot, and gives a very short checklist of the three or four terms that matter most for a young Labrador plus how to compare quotes quickly, respecting the user's wish for brevity."}
