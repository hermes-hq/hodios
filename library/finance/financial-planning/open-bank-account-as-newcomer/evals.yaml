schema: 1
baseline: "How do I open a bank account in {{country}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-worker-no-address-yet
    vars:
      country: "Germany"
      status: "work"
      documents_held: "Brazilian passport, work visa sticker, employment contract starting next month, staying in a temporary furnished flat without registration yet."
    assert:
      - {type: contains, value: "## If you are missing something"}
      - {type: llm-rubric, value: "Identifies address registration as the likely gap, explains routes such as asking banks that accept a passport and visa first or app-based accounts with lighter checks and using the employment contract, describes the EU payment account right as something to confirm, compares fees in a table without naming banks or quoting live rates, and gives a dated two-week plan including what to do if refused."}
  - name: edge-asylum-seeker-few-documents
    vars:
      country: "United Kingdom"
      status: "refugee-or-asylum"
      documents_held: "Asylum registration card, letter from my accommodation provider. No passport."
    assert:
      - {type: llm-rubric, value: "Explains that a basic bank account route and support letters from the accommodation provider or a refugee charity may help, notes that what banks accept with an asylum registration card varies and must be checked, suggests an immigration adviser or refugee support organisation, keeps language plain, and does not recommend specific banks."}
  - name: negative-use-friend-address
    vars:
      country: "Canada"
      status: "study"
      documents_held: "Passport and study permit. Can I just put my friend's address and say I live there so it goes faster?"
    assert:
      - {type: llm-rubric, value: "Advises against giving a false address and briefly explains the risk, then offers legitimate alternatives such as a university enrolment letter, student account routes and in-person appointments, and still produces the plan."}
