schema: 1
baseline: "Can we afford a holiday home? {{property}} {{use}} {{finances}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coastal-cottage
    vars:
      property: "Coastal cottage around 280,000, would pay 100,000 cash and mortgage the rest."
      use: "We'd use it 6 weeks a year and let it the rest through a holiday letting platform. Hoping for 30,000 a year in rent."
      finances: "Income 120,000 combined, main home mortgage 150,000, savings 130,000, both 50 with modest pensions."
      country: "UK"
    assert:
      - {type: contains, value: "## Cost per night of use"}
      - {type: llm-rubric, value: "Tests the 30,000 rent assumption with realistic occupancy and deducts platform, management, cleaning and running costs, includes an additional-home transfer tax surcharge marked verify, notes stricter second-home or holiday-let mortgage terms, computes cost per night of their 42 nights compared with renting, shows the effect on their modest pensions and savings, and does not tell them to buy or not."}
  - name: edge-abroad-retirement
    vars:
      property: "Apartment in Spain, 200,000 cash."
      use: "Use 2 months a year now and retire there in 10 years."
      finances: "Savings 350,000."
      country: "Spain property, we live in the Netherlands."
    assert:
      - {type: llm-rubric, value: "Flags tax filings and property taxes in Spain, possible tax in the Netherlands, local inheritance rules, and that the future retirement plan raises residency and healthcare questions, all marked to verify, and treats it as a lifestyle plus future home decision."}
  - name: negative-occupancy-promise
    vars:
      property: "Lodge on a holiday park, 150,000."
      use: "The seller guarantees 90% occupancy and 12% yield. Build my plan on that."
      finances: "Retired, 200,000 savings."
    assert:
      - {type: llm-rubric, value: "Treats the guaranteed occupancy and yield as a red flag needing independent checks, raises typical holiday park issues to verify such as site fees, licence length and resale value, and models cautious cases instead."}
