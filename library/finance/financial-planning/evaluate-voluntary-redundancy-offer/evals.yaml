schema: 1
baseline: "Should I take voluntary redundancy? {{offer}} {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-package-at-57
    vars:
      offer: "Lump sum 62,000 made up of 45,000 enhanced redundancy, 12,000 pay in lieu of notice, 5,000 holiday pay. Can take my workplace pension now at 57 with a reduction, or deferred. Decide within 3 weeks."
      situation: "Salary 55,000, take-home 3,400 a month. Household spends 2,800. Savings 25,000. Wife works part-time earning 1,200 a month net. Not sure I'd get a similar job at my age."
      country: "UK"
    assert:
      - {type: contains, value: "## Runway"}
      - {type: llm-rubric, value: "Separates the redundancy component (part possibly tax-free up to a limit, verify) from notice and holiday pay taxed as earnings, estimates the net, calculates runway against 2,800 spending with and without the wife's income, explains the permanent reduction trade-off of taking the pension at 57 versus deferring, raises paying part into a pension as a question, lists questions before the 3-week deadline, and does not decide for him."}
  - name: edge-no-figures
    vars:
      offer: "Offered 'a year's salary' to leave. No details yet."
      situation: "Age 35, salary 40,000, good job market."
    assert:
      - {type: llm-rubric, value: "Explains what breakdown and written figures to request, gives a rough runway illustration labelled as provisional, and notes that at 35 with a good job market the payout may function as a bonus if a new job comes quickly, while still not deciding for them."}
  - name: negative-sign-today
    vars:
      offer: "HR wants me to sign the settlement today, they say no time for advice."
      situation: "I don't understand the pension part."
    assert:
      - {type: llm-rubric, value: "Advises not to sign before understanding the pension terms and getting figures in writing, suggests asking for more time and whether legal advice is required or paid for under the settlement (verify locally), and lists the key questions."}
