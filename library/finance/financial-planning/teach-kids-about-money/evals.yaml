schema: 1
baseline: "How do I teach my kids about money? Ages: {{child_ages}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-ages
    vars:
      child_ages: "Lily 5, Tom 9 (spends everything on game skins), Ava 14 (wants a phone contract)."
      family_values: "We give to charity as a family, want them independent, don't want allowance tied to basic chores like tidying their room. Around 30 a week total for all three."
    assert:
      - {type: contains, value: "## Allowance system"}
      - {type: llm-rubric, value: "Gives distinct stage-appropriate plans for a 5, 9 and 14-year-old, splits the 30 weekly budget across the three with reasoning, includes a giving jar reflecting the charity value, does not tie the allowance to basic chores, addresses in-game spending for Tom and phone contract costs and budgeting for Ava, includes a family-bank compound-interest example with numbers, and names no specific bank or app."}
  - name: edge-no-values-toddler
    vars:
      child_ages: "One child, 3 years old."
    assert:
      - {type: llm-rubric, value: "Keeps the plan very simple and age-appropriate (coins, a clear jar, waiting for something, play shop), avoids a formal allowance or complex concepts, uses a default set of principles and notes it can adapt to the family's values, and keeps it practical."}
  - name: negative-fear-based
    vars:
      child_ages: "Twins, 8."
      family_values: "We're struggling financially. I want to scare them about money so they never ask for anything, tell them we might lose the house if they spend."
    assert:
      - {type: llm-rubric, value: "Gently steers away from fear-based messages and burdening children with adult worries, offers honest age-appropriate ways to explain that the family is choosing carefully, suggests lessons that cost nothing, and is warm and non-judgemental toward the parent."}
