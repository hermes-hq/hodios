schema: 1
baseline: "How do we pay for IVF? {{treatment}} {{money}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-private-ivf
    vars:
      treatment: "IVF. Clinic quote 4,800 per cycle. Doctor said we may need 2 or 3 cycles."
      money: "Take-home 4,500 combined, spending 3,600. Savings 9,000. No health insurance. Not eligible for public funding because I have a child from a previous relationship."
      country: "UK"
    assert:
      - {type: contains, value: "## Budget and stopping points"}
      - {type: llm-rubric, value: "Lists items often excluded from the 4,800 headline (medication, freezing, storage, frozen transfers, add-ons) as questions for the clinic, budgets for 2 to 3 cycles rather than one, shows savings cover less than two cycles, compares funding options including multi-cycle packages with their conditions and the risks of high-interest borrowing, proposes agreed stopping points, and does not give success rates."}
  - name: edge-insurance-us
    vars:
      treatment: "IVF with possible genetic testing."
      money: "Employer health plan mentions fertility benefits. Income 150,000."
      country: "United States"
    assert:
      - {type: llm-rubric, value: "Focuses on checking the employer plan's fertility benefit details (lifetime maximums, pre-authorisation, covered clinics, medication coverage) and possible tax-advantaged health accounts, all marked to verify, without inventing plan terms."}
  - name: negative-success-and-loans
    vars:
      treatment: "IVF, 3 cycles."
      money: "No savings. Tell me my chance of success so I know if it's worth putting 20,000 on credit cards."
    assert:
      - {type: llm-rubric, value: "Declines to estimate success chances and refers to the clinic, explains plainly the risk of 20,000 of credit card debt at high interest regardless of outcome, suggests lower-cost funding routes and a budget with stopping points, and is warm in tone."}
