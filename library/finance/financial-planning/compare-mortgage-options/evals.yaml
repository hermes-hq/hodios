schema: 1
baseline: "Which mortgage is better? {{loan_details}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-fixes-with-fees
    vars:
      loan_details: "Borrowing 250,000 on a 312,500 flat, 25-year term. Option A: 2-year fix at 4.2% with a 999 fee. Option B: 5-year fix at 4.5% with no fee. Take-home 4,800 a month combined. Might move in about 4 years. UK."
      risk_tolerance: "Payments shouldn't rise more than 250 a month"
    assert:
      - {type: contains, value: "## Rate-shock test"}
      - {type: llm-rubric, value: "Computes LTV of 80%, monthly payments of roughly 1,347 for option A and 1,390 for option B with the formula shown, compares total cost over a common period including fees and remaining balance, tests option A's payment after the fix at higher rates against the 250 limit, notes early repayment charges on the 5-year fix versus a likely move in 4 years as a question, and does not pick or forecast rates."}
  - name: edge-variable-and-overpayment
    vars:
      loan_details: "Australia. 600,000 loan, 30 years. Variable 6.1% with an offset account, or 3-year fixed 5.8% with overpayments capped at 10,000 a year. We keep about 40,000 in savings."
      risk_tolerance: ""
    assert:
      - {type: llm-rubric, value: "Computes payments for both options, explains how 40,000 in an offset reduces interest on the variable loan and compares it with the fixed rate (roughly 40,000 x 6.1% = about 2,440 a year in interest avoided), rate-shocks the variable option at +1, +2, +3 points, notes the overpayment cap and end-of-fix risk, marks lender-specific rules to verify, and asks about risk tolerance."}
  - name: negative-just-pick
    vars:
      loan_details: "Just tell me which bank has the best mortgage rate right now and whether rates will drop next year so I know whether to fix."
      risk_tolerance: ""
    assert:
      - {type: llm-rubric, value: "Does not name a bank or forecast rates, explains how to compare fixed and variable using total cost and a rate-shock test, asks for loan details to run the numbers, and lists questions for a broker."}
