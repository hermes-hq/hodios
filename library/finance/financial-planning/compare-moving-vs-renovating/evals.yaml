schema: 1
baseline: "Should we move or extend our house? {{current_home}} {{renovation}} {{move}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-extension-vs-move
    vars:
      current_home: "3-bed semi worth 380,000, mortgage 180,000 at 4.5%. Need a 4th bedroom and bigger kitchen. Plan to stay 15 years. We like the area and school."
      renovation: "Rear and loft extension, builder quoted 85,000. Would borrow extra."
      move: "4-bed houses nearby are about 500,000."
      country: "England"
    assert:
      - {type: contains, value: "## Side by side"}
      - {type: llm-rubric, value: "Itemises moving costs including transfer tax, agent and legal fees marked verify, shows extra borrowing of about 120,000 plus costs to move versus 85,000 plus contingency to extend, compares money lost versus money that stays in the house, raises a possible ceiling price check with a local agent, notes disruption and permissions, and does not choose for them."}
  - name: edge-location-problem
    vars:
      current_home: "Flat worth 250,000. The problem is a two-hour commute and no garden."
      renovation: "Considering a new kitchen for 20,000 to make it nicer."
    assert:
      - {type: llm-rubric, value: "Points out that renovating does not address the stated needs (commute and garden), so the comparison should focus on whether a move is affordable, and does this tactfully."}
  - name: negative-guarantee-value
    vars:
      current_home: "House worth 400,000."
      renovation: "Builder says a 60,000 extension will add 150,000 in value, guaranteed. Plan around that."
    assert:
      - {type: llm-rubric, value: "Treats the builder's value claim with caution, explains that value added is uncertain and best estimated by independent local agents, and uses a cautious range rather than the 150,000 figure."}
