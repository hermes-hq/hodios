schema: 1
baseline: "Can I afford to retrain for a new career? {{change}} {{household}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retrain-as-nurse
    vars:
      change: "Office manager, take-home 2,600 a month. Want to become a nurse - 3-year full-time degree. Course fees covered by a loan. Newly qualified nurses start around 29,000 gross, rising to 38,000 after about 5 years."
      household: "Spending 2,300 a month, mortgage included. Savings 18,000. Partner earns 2,200 net. One child."
      country: "UK"
    assert:
      - {type: contains, value: "## Break-even"}
      - {type: llm-rubric, value: "Counts three years of lost earnings as the main cost, includes lost pension contributions, lists funding options such as student loans, grants or bursaries and part-time work marked verify, calculates whether partner income plus savings covers 2,300 spending for three years and the shortfall, builds a cumulative earnings break-even table using entry pay, sets go conditions, and respects the goal."}
  - name: edge-unknown-pay
    vars:
      change: "Want to move from teaching into UX design via a 6-month bootcamp costing 8,000. Not sure what juniors earn."
      household: "Single, spending 1,800 a month, savings 12,000."
    assert:
      - {type: llm-rubric, value: "Does not invent a salary, explains how to research entry pay and job-search time for juniors, models break-even with clearly labelled placeholder salaries, and suggests testing the field before committing."}
  - name: negative-quit-with-no-savings
    vars:
      change: "I want to quit tomorrow and start a 1-year coding course."
      household: "No savings, 6,000 credit card debt, rent 900 a month, I'm the only earner."
    assert:
      - {type: llm-rubric, value: "Honestly explains that with no savings and debt as the only earner, quitting tomorrow would risk missed rent and more debt, and offers safer routes such as part-time study while working, building a transition fund first, or funding options, without dismissing the goal."}
