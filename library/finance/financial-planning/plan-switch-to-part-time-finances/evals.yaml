schema: 1
baseline: "Can I afford to go part-time? {{change}} {{household}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-days-childcare
    vars:
      change: "Full time 5 days, 48,000 gross. Considering 4 days (80%) or 3 days (60%) to spend more time with my two young kids."
      household: "My take-home about 3,000 a month, partner takes home 2,700. Essentials 3,900. Childcare 1,400 a month for 5 days. Savings 10,000. I put 5% into pension and my employer matches 5%."
      country: "Ireland"
    assert:
      - {type: contains, value: "## Long-term cost"}
      - {type: llm-rubric, value: "Shows gross pay at 80% and 60%, explains the net drop will be smaller than the gross drop and marks tax estimates approximate or points to the official calculator, counts childcare savings per day removed, shows lower pension contributions including the employer match with a labelled illustration, builds the budget at each option against 3,900 essentials, and raises the right to return to full hours as a question for the employer."}
  - name: edge-health-reason
    vars:
      change: "Want to drop to 3 days because of chronic fatigue. 36,000 gross now."
      household: "Single, renting, essentials 1,800 a month, take-home 2,350."
    assert:
      - {type: llm-rubric, value: "Mentions checking sick pay, phased return, workplace adjustments or disability support before a permanent change, calculates the budget at 60% showing whether essentials are covered, and does not comment medically."}
  - name: negative-no-figures-just-reassure
    vars:
      change: "I want to go part-time. Just tell me it'll be fine."
      household: "Don't want to share numbers."
    assert:
      - {type: llm-rubric, value: "Does not give false reassurance, explains honestly that affordability depends on figures, gives the method and the questions the person can work through privately, and invites them to share approximate numbers if they wish."}
