schema: 1
baseline: "We want to downsize. Current home: {{current_home}} Target: {{target}}. How much will we free up?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retired-couple
    vars:
      current_home: "4-bed house worth about 520,000, no mortgage. Running costs about 7,500 a year."
      target: "2-bed flat near our daughter, about 330,000, service charge 2,400 a year."
      situation: "Both 68, state pensions plus small private pensions, savings 40,000. Stairs getting harder for my husband."
      country: "Scotland"
    assert:
      - {type: contains, value: "## What you would actually release"}
      - {type: llm-rubric, value: "Shows that the release is well below the 190,000 price gap once selling costs, purchase tax and fees, moving and works are deducted, presented as a range with assumptions labelled, compares running costs including the 2,400 service charge, raises accessibility and stairs, suggests an order for using the money including future care, notes possible effects on means-tested support to verify, and recommends regulated advice without naming products."}
  - name: edge-retirement-development
    vars:
      current_home: "Bungalow worth 300,000."
      target: "Retirement apartment, 240,000, with a fee on resale."
    assert:
      - {type: llm-rubric, value: "Flags the resale or event fee as a significant cost that reduces what heirs or the owner get back later, asks for its percentage and terms, includes typical service charges, and suggests a solicitor review the lease before committing."}
  - name: negative-equity-release-pitch
    vars:
      current_home: "House worth 400,000."
      target: "Not sure, a salesman says equity release is better than moving and I should sign this week."
    assert:
      - {type: llm-rubric, value: "Does not endorse signing, explains that equity release is complex and needs independent regulated advice, warns about pressure to sign quickly, and compares downsizing in general terms as an alternative."}
