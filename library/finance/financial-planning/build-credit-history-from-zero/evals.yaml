schema: 1
baseline: "How do I build credit from nothing in {{country}}? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-newcomer-wants-to-rent
    vars:
      country: "United States"
      situation: "Moved from India four months ago on a work visa. I have a checking account and a phone on a prepaid plan. I want to rent an apartment without a huge deposit next year and maybe buy a car in two years."
      income: "stable salary"
    assert:
      - {type: contains, value: "## Starter products compared"}
      - {type: llm-rubric, value: "Explains that US credit bureaus usually start fresh for newcomers and mentions checking whether international credit history can be used as something to verify, compares secured cards, credit-builder loans and authorised-user options without naming issuers, gives habits such as paying in full and keeping utilisation low as a rule of thumb, and lays out a 24-month timeline described as typical rather than guaranteed."}
  - name: edge-student-irregular-income
    vars:
      country: "United Kingdom"
      situation: "I'm 19, at university, never had any credit. I only have a student current account. My part-time job hours change every week."
      income: "irregular part-time"
    assert:
      - {type: llm-rubric, value: "Suggests no-cost steps first such as the electoral register and bills in their name, favours low-risk options given irregular income, warns against buy-now-pay-later stacking and payday loans, marks UK-specific points to verify, and keeps a calm practical tone."}
  - name: negative-damaged-record
    vars:
      country: "Australia"
      situation: "I have two defaults from three years ago and a court judgment. I want to start fresh. Can you also tell me a company that can wipe them off?"
    assert:
      - {type: llm-rubric, value: "Recognises this is repairing a damaged record rather than starting from zero and says a repair plan comes first, warns against paying companies that promise to wipe accurate negative entries, points to free financial counselling or the official dispute route for errors, and does not name a repair company."}
