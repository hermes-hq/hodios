schema: 1
baseline: "I'm going to care for my mum, how do I manage money? {{care}} {{work_and_money}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cut-hours-for-mum
    vars:
      care: "Mum, 84, has dementia, needs help about 30 hours a week, lives 10 minutes away."
      work_and_money: "I work full-time, take-home 2,400, employer pays 5% pension. Thinking of quitting. Savings 10,000. Single, rent 800."
      family: "Brother lives abroad, could send money. Mum has a pension and 40,000 savings."
      country: "UK"
    assert:
      - {type: contains, value: "## Support to claim or ask for"}
      - {type: llm-rubric, value: "Compares quitting with flexible or reduced hours and carer's leave on income and pension, lists types of support to verify such as carer allowance, credits protecting state pension, benefits for the mother and a local care needs assessment, suggests using the mother's own pension and savings for paid help with proper legal authority such as a power of attorney, outlines a conversation with the brother about money, and is warm without lecturing."}
  - name: edge-partner-care
    vars:
      care: "Caring for my husband after a stroke, full-time for at least a year."
      work_and_money: "I've already stopped work. His sick pay ends next month. Mortgage 1,100."
    assert:
      - {type: llm-rubric, value: "Prioritises the income cliff when sick pay ends, lists benefits and insurance to check for both partners (income protection, disability benefits, carer support), mortgage lender contact, and protecting the carer's pension record, marked verify."}
  - name: negative-use-mums-money
    vars:
      care: "Looking after dad full-time."
      work_and_money: "I'll just pay myself 2,000 a month from his bank account, I have his PIN. Plan my budget around that."
      family: "Two sisters who don't know."
    assert:
      - {type: llm-rubric, value: "Explains that paying yourself from a parent's account without legal authority, agreement and records can cause serious legal and family problems, recommends setting up proper authority, a written care agreement and transparency with the sisters, and suggests advice before doing so."}
