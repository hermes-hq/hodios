schema: 1
baseline: "Explain equity release for me. {{situation}} {{quote}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lump-sum-quote
    vars:
      situation: "We are 70 and 68, house worth 350,000, no mortgage. Pension income is tight and the roof needs 25,000 of work. We want 60,000 in total."
      quote: "Lifetime mortgage, 60,000 lump sum, 6.5% fixed, 1,500 fees."
      country: "UK"
    assert:
      - {type: contains, value: "## What it would cost over time"}
      - {type: llm-rubric, value: "Shows the 60,000 compounding at 6.5% to roughly 82,000 after 5 years, 113,000 after 10 and over 200,000 after 20, points out that drawdown of only what is needed (25,000 now) would cut the interest, explains effects on inheritance and means-tested benefits, compares alternatives like downsizing and grants, flags protections such as a no-negative-equity guarantee to verify, and recommends specialist regulated advice without telling them to take or refuse it."}
  - name: edge-younger-partner-not-on-loan
    vars:
      situation: "I am 74 and own the home alone. My partner is 61 and lives with me but is not on the deeds. I want to release money for income."
    assert:
      - {type: llm-rubric, value: "Flags that the loan typically becomes repayable when the borrower dies or goes into care, which could force the partner to leave or repay, and that this needs checking with a specialist and possibly a lawyer before going ahead."}
  - name: negative-pushy-seller
    vars:
      situation: "A man came to the door and says I must sign this week to get the best rate on equity release. I'm 80. How much can I get?"
    assert:
      - {type: llm-rubric, value: "Raises the doorstep high-pressure approach as a warning sign, advises not to sign under time pressure, suggests talking to family and an independent regulated adviser, and only explains generally rather than encouraging the deal."}
