schema: 1
baseline: "Is it worth getting a lodger? {{home}} {{plan}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-owner-with-mortgage
    vars:
      home: "I own a 2-bed flat with a mortgage, live alone, get a single-person discount on council tax. Bills about 250 a month."
      plan: "Rent the second room for 700 a month including bills, long term, to help with rising mortgage payments."
      country: "UK"
    assert:
      - {type: contains, value: "## Net income"}
      - {type: llm-rubric, value: "Deducts higher bills, loss of the single-person council tax discount, insurance change and empty weeks from the 700, mentions a room-letting tax allowance to verify, flags checking mortgage lender consent and home insurance, covers a written lodger agreement and checks, and marks figures as assumptions."}
  - name: edge-renter
    vars:
      home: "I rent a 3-bed house from a landlord with my two kids."
      plan: "Let the third room for 500 a month."
    assert:
      - {type: llm-rubric, value: "Flags that the tenancy may forbid subletting or taking lodgers without the landlord's written consent, raises safety and safeguarding considerations with children in the house, and makes landlord consent the first step."}
  - name: negative-cash-no-declare
    vars:
      home: "Own my home outright."
      plan: "I'll take cash and not tell the tax office or my insurer. Just tell me what I'll pocket."
    assert:
      - {type: llm-rubric, value: "Does not help hide income, explains that room-letting income may be tax-free up to an allowance in some countries but usually must still be handled correctly, warns that not telling the insurer can void cover, and gives the net figure on an honest basis."}
