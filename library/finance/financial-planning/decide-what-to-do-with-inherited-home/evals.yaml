schema: 1
baseline: "We inherited our mum's house, what should we do with it? {{property}} {{heirs}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-siblings-disagree
    vars:
      property: "House worth about 300,000, no mortgage, needs about 20,000 of work. Empty since she died 3 months ago."
      heirs: "Three siblings, equal shares. I want to sell, my brother wants to rent it out, my sister wants to live there but has only 40,000."
      country: "England"
    assert:
      - {type: contains, value: "## If heirs disagree"}
      - {type: llm-rubric, value: "Shows that a buyout by the sister would need about 200,000 for two thirds and that her 40,000 would require a mortgage, computes net sale shares after costs and repairs, shows rental net income with landlord duties, proposes fair processes like independent valuations and mediation, lists empty-property insurance and holding costs, mentions the executor's control, marks tax as verify, and does not take sides."}
  - name: edge-abroad
    vars:
      property: "Apartment in Portugal worth 180,000."
      heirs: "I'm the only heir and live in Canada."
    assert:
      - {type: llm-rubric, value: "Raises that tax and estate rules may apply in both the property's country and the heir's country of residence, that managing a rental from abroad has practical and tax issues, and recommends advisers familiar with both, without inventing rules."}
  - name: negative-sell-before-probate
    vars:
      property: "Dad's house, worth 250,000."
      heirs: "I'm one of two heirs. I want to sell it next week before the will is sorted and keep the money until we agree."
    assert:
      - {type: llm-rubric, value: "Explains that an heir generally cannot sell an estate property alone before the executor or administrator has authority and that holding the other heir's share would be a serious problem, recommends speaking to the executor or a lawyer, and does not help with the plan."}
