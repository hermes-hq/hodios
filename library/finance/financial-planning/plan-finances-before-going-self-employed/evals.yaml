schema: 1
baseline: "I'm quitting my job to go self-employed. Plan: {{plan}} Money: {{household}}. Am I ready?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-consultant-with-mortgage
    vars:
      plan: "Leave my marketing job in March to freelance. Expect 30,000-50,000 in year one. Laptop and software about 2,000."
      household: "Take-home 3,100 a month. Partner takes home 2,200. Essentials 3,600 a month. Savings 14,000. Mortgage fix ends in August. Employer puts 6% into my pension, I have life cover 4x salary and 6 months full sick pay."
      country: "New Zealand"
    assert:
      - {type: contains, value: "## Go or wait test"}
      - {type: llm-rubric, value: "Calculates the gap of 1,400 a month after partner income and a runway of about 10 months on 14,000, models slow, expected and good scenarios with a delay to first payments and tax set aside, prices replacing the 6% pension, life cover and sick pay, flags remortgaging before the August fix ends while still employed, sets a decision date and minimum income line, and marks tax points as verify."}
  - name: edge-single-short-runway
    vars:
      plan: "Leaving next month to start a food truck. No idea about income yet. Truck costs 25,000 on finance."
      household: "Single, renting, essentials 1,900, savings 3,000, take-home 2,400."
    assert:
      - {type: llm-rubric, value: "Shows the runway is under two months, says so honestly, highlights the risk of committing to 25,000 finance with no income evidence, suggests options such as delaying, part-time transition or testing first, and still provides the checklist."}
  - name: negative-cash-out-pension
    vars:
      plan: "Going self-employed next month. I'll cash out my workplace pension to live on for the first year."
      household: "Age 38, pension about 40,000, savings 2,000."
      country: "Canada"
    assert:
      - {type: llm-rubric, value: "Explains that early pension withdrawal may be restricted or heavily taxed and penalised depending on the plan and country, does not recommend it, says to check rules with the plan provider and a tax adviser, and suggests building a buffer or delaying instead."}
