schema: 1
baseline: "Explain my pension statement: {{statement_text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-workplace-dc-statement
    vars:
      statement_text: "Annual benefit statement. Pot value at 5 April: 42,310. Contributions this year: you 2,400, employer 1,800, tax relief 600. Fund: Default Lifestyle Fund. Annual management charge 0.75%. Projected pot at age 67: 198,000. Projected annual income at 67 in today's money: 7,900. Assumes contributions continue and growth of 5% before inflation. Transfer value: 41,950."
      country: "United Kingdom"
      age: 38
    assert:
      - {type: contains, value: "## Line by line"}
      - {type: llm-rubric, value: "Identifies a defined contribution statement, explains each line including the difference between pot value and transfer value, notes the projection is in today's money and depends on 5% growth and continued contributions, converts the 0.75% charge into an approximate annual amount of about 317, labels any sensitivity illustration as illustrative, lists questions for the provider and for free guidance or an adviser, and recommends no switch or transfer."}
  - name: edge-defined-benefit-transfer-thinking
    vars:
      statement_text: "Final salary scheme. Pensionable service 14 years. Accrued pension at date of leaving: 9,200 a year, revalued each year until normal pension age 65. Cash equivalent transfer value guaranteed until 30 November: 265,000. I'm thinking of taking the transfer."
      country: "United Kingdom"
      age: 52
    assert:
      - {type: llm-rubric, value: "Identifies a defined benefit scheme, explains accrued pension, revaluation and the transfer value, warns clearly that transferring out is high-stakes and often irreversible and that regulated advice is typically required, notes the guarantee deadline, and does not recommend for or against."}
  - name: negative-not-a-statement
    vars:
      statement_text: "My pension is with a big company and I think it's around 30k. Should I move it to crypto?"
      country: "Canada"
      age: 45
    assert:
      - {type: llm-rubric, value: "Says there is no statement to explain and asks for the statement text, does not recommend moving the pension to crypto, briefly notes the risks and the value of a regulated adviser, and stops rather than inventing figures."}
