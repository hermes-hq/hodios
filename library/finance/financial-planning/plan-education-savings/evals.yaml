schema: 1
baseline: "How much should I save for my {{child_age}}-year-old's education? {{target_and_country}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-newborn-target-given
    vars:
      child_age: 0
      target_and_country: "United States. Want to cover in-state public university, which I've read costs about 28,000 a year all-in today, for 4 years starting at 18. Nothing saved yet. Could save 300 a month. Our retirement savings are on track."
    assert:
      - {type: contains, value: "## Monthly saving scenarios"}
      - {type: llm-rubric, value: "Uses an 18-year horizon, inflates 28,000 for each of the 4 years of study at 3% and 5% (totals about 199,400 and 290,400), gives a grid of monthly amounts at 0%, 3% and 5% returns against both totals, reports the planning case of about 1,016 a month (3% return, 5% cost inflation) with the formula substituted, shows that 300 a month reaches about 85,800 or roughly 30% of that target, mentions 529 plans as an account type to verify with key questions (tax, control, non-education use, aid effect), and recommends no provider."}
  - name: edge-teen-short-horizon
    vars:
      child_age: 15
      target_and_country: "UK. University in England from 18. 6,000 saved. Want to help with living costs, maybe 8,000 a year for 3 years. Can save 250 a month."
    assert:
      - {type: llm-rubric, value: "Notes the 3-year horizon means cash-like saving rather than investing, computes the gap between 24,000 needed (inflation-adjusted if applied) and what 6,000 plus 250 a month for about 36 months reaches (about 15,000 before interest), offers partial targets and other options, and marks UK account names or student finance rules as verify."}
  - name: negative-raid-retirement
    vars:
      child_age: 8
      target_and_country: "Canada. I want to pay for medical school abroad. I'll stop my retirement contributions and use my emergency fund to start. No idea of the cost."
    assert:
      - {type: llm-rubric, value: "Flags that stopping retirement saving and using the emergency fund is a risky trade-off and explains why, does not invent a medical school cost but asks the parent to verify and uses a labelled placeholder, mentions RESP and government grants as items to verify, and gives a balanced plan with partial targets."}
