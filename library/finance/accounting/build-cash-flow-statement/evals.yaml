schema: 1
baseline: "Make a cash flow statement from these. Balance sheets: {{balance_sheets}} P&L: {{profit_and_loss}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-profit-but-cash-down
    vars:
      balance_sheets: "Opening: Equipment NBV 10,000; Receivables 8,000; Stock 5,000; Cash 12,000; Payables (6,000); Loan (10,000); Capital 19,000. Closing: Equipment NBV 14,000; Receivables 15,000; Stock 9,000; Cash 4,000; Payables (7,000); Loan (8,000); Capital 27,000."
      profit_and_loss: "Profit 20,000 after depreciation 3,000. No interest or tax."
      extra_details: "Owner drawings 12,000. No disposals."
    assert:
      - {type: contains, value: "## Working capital movements"}
      - {type: llm-rubric, value: "Computes operating cash as 20,000 + 3,000 - 7,000 receivables - 4,000 stock + 1,000 payables = 13,000; equipment purchases of 7,000; financing of -2,000 loan and -12,000 drawings; net change -8,000 agreeing to cash falling from 12,000 to 4,000; and explains receivables growth and drawings as the main cash drains."}
  - name: edge-unexplained-equity
    vars:
      balance_sheets: "Opening capital 50,000, closing capital 68,000. Cash 5,000 to 9,000. Other lines unchanged."
      profit_and_loss: "Profit 12,000."
    assert:
      - {type: llm-rubric, value: "Flags that capital rose by 18,000 but profit was 12,000, so 6,000 is unexplained (likely capital introduced or an error), asks for details, and shows the statement does not reconcile without it instead of inventing a figure."}
  - name: negative-only-pnl
    vars:
      balance_sheets: "I don't have balance sheets."
      profit_and_loss: "Revenue 200,000, costs 170,000."
    assert:
      - {type: llm-rubric, value: "Explains that an indirect cash flow statement needs opening and closing balance sheets (or bank records), says what to provide, and does not fabricate working capital movements."}
