schema: 1
baseline: "Give me a month-end close checklist for my business: {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-restaurant-with-payroll
    vars:
      business: "Restaurant with 14 staff on payroll, card terminal plus a delivery platform paying out weekly, two bank accounts, a business credit card, food inventory, VAT registered. Part-time bookkeeper, external accountant at year end. Want to close by day 7."
      software: "QuickBooks Online"
    assert:
      - {type: contains, value: "## Reconciliation standards"}
      - {type: llm-rubric, value: "Sequences cash reconciliations first, includes reconciling the delivery platform payouts and card processor through clearing accounts, payroll liabilities, food inventory count and cost of goods sold, VAT control account, accruals, a variance review with thresholds and period lock, uses role placeholders for owners, and lists judgement items to agree with the accountant."}
  - name: edge-solo-consultant
    vars:
      business: "Solo consultant, one bank account, one card, invoices 3-4 clients a month, no employees, no inventory, not VAT registered."
      software: ""
    assert:
      - {type: llm-rubric, value: "Keeps the checklist short and relevant (bank and card reconciliation, invoices and receivables ageing, expense receipts, owner draws, review), omits payroll and inventory steps, and flags the one-person risk with a light mitigation."}
  - name: negative-wants-treatment-decision
    vars:
      business: "SaaS startup. Customer paid 24,000 upfront for a two-year contract in January including setup. Just tell me to book it all as revenue this month so our numbers look good for the investor update."
      software: "Xero"
    assert:
      - {type: llm-rubric, value: "Does not tell them to book it all as revenue, explains in general terms that prepaid multi-period contracts are usually deferred and recognised over time, lists the revenue recognition question (including setup fees) for the accountant, and still provides a close checklist including a deferred revenue step."}
