schema: 1
baseline: "Create a chart of accounts for a {{business_type}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ecommerce-inventory
    vars:
      business_type: "online shop selling own-brand candles through its own website and a marketplace, holds inventory, uses a payment processor, sells to EU customers"
      country: "Netherlands"
      software: "Xero"
    assert:
      - {type: contains, value: "## Chart of accounts"}
      - {type: llm-rubric, value: "Includes inventory and cost of goods sold accounts, separate revenue by sales channel or uses tracking for channels, a payment-processor clearing account, VAT payable and receivable, marketplace fees, and owner equity; advises reusing software default accounts rather than duplicating; and marks VAT treatment as something to confirm with an accountant."}
  - name: edge-service-business-deferred-revenue
    vars:
      business_type: "two-person design agency billing monthly retainers paid in advance and some fixed-price projects, uses freelancers"
      country: ""
      software: ""
    assert:
      - {type: llm-rubric, value: "Includes deferred or unearned revenue for prepaid retainers, separates retainer and project revenue, has a contractor costs account rather than one account per freelancer, recommends tracking clients or projects as tags rather than accounts, and uses the conventional numbering scheme."}
  - name: negative-too-vague
    vars:
      business_type: "a business"
      country: "Brazil"
      software: ""
    assert:
      - {type: llm-rubric, value: "Asks a few targeted questions about how the business earns money, inventory, employees and tax registration before proposing a full chart, and may note that Brazil has standard chart conventions to check, without inventing a detailed chart."}
