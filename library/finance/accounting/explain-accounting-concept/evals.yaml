schema: 1
baseline: "Explain {{concept}} in accounting."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-deferred-revenue
    vars:
      concept: "Deferred revenue for annual subscriptions paid upfront"
      level: beginner
    assert:
      - {type: contains, value: "## Journal entries"}
      - {type: llm-rubric, value: "Uses an invented subscription business with an annual payment (for example 1,200 received upfront), records cash and a deferred revenue liability on receipt, recognises one twelfth per month as revenue with balanced entries, shows cash versus profit side by side, explains debits and credits briefly for a beginner, and notes framework differences to check with an accountant."}
  - name: edge-intermediate-depreciation-disposal
    vars:
      concept: "Depreciation and what happens when you sell the asset before it is fully depreciated"
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Shows straight-line depreciation with stated example assumptions (cost, useful life, residual value), computes net book value at the sale date, records the disposal with removal of cost and accumulated depreciation and a gain or loss that ties to the numbers, all entries balance, and notes that tax allowances can differ from accounting depreciation."}
  - name: negative-misconception
    vars:
      concept: "Why does my accountant say I made 40k profit when my bank account only went up 5k? Is the accountant wrong?"
      level: beginner
    assert:
      - {type: llm-rubric, value: "Explains that profit and cash differ without assuming the accountant is wrong, walks through common causes with a worked example (unpaid customer invoices, stock purchases, loan repayments, asset purchases, owner drawings), and suggests asking the accountant for a reconciliation of profit to cash."}
