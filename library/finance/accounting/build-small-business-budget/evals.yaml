schema: 1
baseline: "Make me a budget for next year for my business: {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-seasonal
    vars:
      business: "Independent cafe, 2027 budget. Open 6 days, 2 full-time and 4 part-time staff, rent 3,200 a month. Busy in summer, quiet in January and February."
      last_year_figures: "Revenue 410,000. Food and drink costs 31% of revenue. Wages including employer costs 148,000. Rent 38,400. Utilities 14,000. Other overheads 22,000. Owner took 30,000."
      goals: "Pay the owner 40,000 and save 15,000 towards a new espresso machine."
    assert:
      - {type: contains, value: "## Monthly phasing"}
      - {type: llm-rubric, value: "Uses drivers such as covers and average spend, labels each assumption's source, phases revenue by season, includes owner pay and a contingency, keeps the espresso machine out of the profit budget as a cash item, checks whether the goals are met with figures, and gives a variance routine with thresholds."}
  - name: edge-no-history
    vars:
      business: "New bookkeeping practice starting January 2027, just me, aiming for 12 monthly clients by year end at about 250 a month each, working from home."
    assert:
      - {type: llm-rubric, value: "Builds revenue from a client ramp times monthly fee, labels all figures as user-given or placeholders, includes software, insurance and professional body costs as placeholders to replace, and shows the cumulative profit by month."}
  - name: negative-unreachable-goal
    vars:
      business: "Online print shop, 2027. Revenue last year 90,000 with 45% direct costs and 40,000 fixed costs."
      goals: "Make 150,000 profit next year with no new spending."
    assert:
      - {type: llm-rubric, value: "Shows with numbers that the goal implies an implausible revenue jump at current margins, says so plainly, and offers the levers and assumptions that would need to change instead of producing a budget that pretends to reach it."}
