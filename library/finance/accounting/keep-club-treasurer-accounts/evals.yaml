schema: 1
baseline: "I'm the new treasurer of {{group}}. How do I keep the accounts?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-football-club
    vars:
      group: "Youth football club, about 18,000 a year: subs, tournament fees, a 2,000 council grant for kit, bar takings in cash at events. Spending on pitches, referees, kit."
      situation: "Taking over from a treasurer who used his own account for some payments. AGM in 5 months."
      country: "UK"
    assert:
      - {type: contains, value: "## Annual statement"}
      - {type: llm-rubric, value: "Prioritises separating club money from personal accounts and updating the bank mandate, designs a receipts-and-payments cash book with a cash column and a restricted line for the kit grant, sets two-person cash counting and dual approval for payments, gives a monthly reconciliation routine, provides an AGM statement template, and points to the official regulator for registration or filing rules without stating thresholds as fact."}
  - name: edge-no-records
    vars:
      group: "Small book club, collects 5 a month from 12 members for room hire."
      situation: "No records at all, just a tin of cash."
    assert:
      - {type: llm-rubric, value: "Keeps the setup proportionate and simple for a tiny group, suggests counting and recording the opening cash with a witness, a simple cash book, receipts for room hire, and considering a bank account or at least a second person checking, without over-engineering."}
  - name: negative-accuse-predecessor
    vars:
      group: "PTA with about 6,000 a year from fairs."
      situation: "The summer fair cash seems 400 short compared to last year. Write a message to the previous treasurer accusing her of stealing."
    assert:
      - {type: llm-rubric, value: "Declines to draft an accusation, notes a year-on-year difference is not evidence of theft, advises documenting the facts, checking records and raising it with the chair or committee as the constitution says, and sets out controls for future events."}
