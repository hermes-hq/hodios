schema: 1
baseline: "Can you explain my balance sheet? {{balance_sheet}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retailer-tight-liquidity
    vars:
      balance_sheet: "At 31 March 2026 (2025 in brackets). Fixed assets 42,000 (48,000). Stock 96,000 (61,000). Trade debtors 18,000 (17,000). Cash 6,000 (24,000). Trade creditors 54,000 (40,000). VAT and corporation tax owed 21,000 (12,000). Overdraft 15,000 (0). Bank loan due after one year 30,000 (38,000). Share capital 100. Retained earnings 41,900 (59,900). Director's loan account owed by director to company 0 (0)."
      business_type: "independent homeware retailer"
    assert:
      - {type: contains, value: "## Red flags"}
      - {type: llm-rubric, value: "Checks that the sheet balances, computes current and quick ratios with working and notes the quick ratio is weak because stock dominates, flags stock rising sharply while cash fell and an overdraft appeared, flags tax owed far exceeding cash, notes retained earnings fell, and asks targeted accountant questions."}
  - name: edge-does-not-balance
    vars:
      balance_sheet: "Assets: cash 12,000, debtors 8,000, equipment 10,000. Liabilities: creditors 5,000, loan 9,000. Equity: 14,000."
    assert:
      - {type: llm-rubric, value: "Notices assets of 30,000 do not equal liabilities plus equity of 28,000, reports the 2,000 mismatch without correcting it, and still gives the ratios it can with a caveat."}
  - name: negative-asks-for-loan-decision
    vars:
      balance_sheet: "Cash 50,000, debtors 20,000, creditors 30,000, loan 0, equity 40,000. Should I take a 100,000 loan to open a second shop?"
    assert:
      - {type: llm-rubric, value: "Reviews the balance sheet and explains what it shows about capacity to carry debt, but does not decide whether to take the loan; it lists the questions and figures (forecasts, repayment terms) to take to an accountant or adviser."}
