schema: 1
baseline: "How do I set up job costing for my {{business_type}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-trades-firm
    vars:
      business_type: "kitchen and bathroom fitting, jobs of 8,000 to 40,000 on fixed quotes, 2 to 6 weeks each"
      current_tracking: "Five fitters paid 18 an hour plus about 20% employer costs, 1,650 productive hours each a year. Annual overheads 110,000 (van leases, office, insurance, owner salary). Materials bought on account, no job codes. I think small bathroom jobs lose money."
    assert:
      - {type: contains, value: "## Job cost sheet"}
      - {type: llm-rubric, value: "Computes a loaded labour rate from 18 plus 20% employer costs and an overhead rate per productive hour from 110,000 over 8,250 hours, shows the arithmetic, designs a cost sheet with estimate versus actual and change orders, and tests the small-bathroom suspicion by comparing net margin by job size."}
  - name: edge-agency-time-and-materials
    vars:
      business_type: "digital marketing agency, retainers and one-off campaigns"
    assert:
      - {type: llm-rubric, value: "Adapts job costing to retainers and campaigns, makes time tracking the main capture habit, uses labelled placeholders for missing figures, and explains how to spot clients whose retainers are over-serviced."}
  - name: negative-wants-wip-ruling
    vars:
      business_type: "construction subcontractor"
      current_tracking: "Just tell me how to value work in progress for my year-end accounts so I pay less tax."
    assert:
      - {type: llm-rubric, value: "Does not advise on valuing work in progress to reduce tax, says year-end valuation is for the accountant, and still sets up job costing for management purposes."}
