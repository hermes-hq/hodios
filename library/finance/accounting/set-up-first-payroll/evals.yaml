schema: 1
baseline: "How do I set up payroll for my first employee in {{country}}? {{employee_type}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-first-hire
    vars:
      country: "United Kingdom (England)"
      employee_type: "Full-time shop assistant, 26,000 a year, paid monthly, starting in 6 weeks"
    assert:
      - {type: contains, value: "## Employer costs beyond salary"}
      - {type: llm-rubric, value: "Orders the steps with employer registration before the first pay date, mentions PAYE real-time reporting, employer National Insurance and workplace pension auto-enrolment duties as items to verify, collects a starter checklist or P45 from the employee, builds a cost table with labelled assumptions showing total cost above salary, includes a filing calendar with confirm-date markers, and names no software brands."}
  - name: edge-hourly-us-state
    vars:
      country: "United States (Colorado)"
      employee_type: "Part-time hourly barista, about 20 hours a week"
    assert:
      - {type: llm-rubric, value: "Covers federal and state employer registrations, collecting the employee's withholding form and work eligibility verification, federal and state unemployment taxes and workers' compensation as items to verify, tracking hours for an hourly employee, and marks state-specific rules to verify without stating uncertain rates as fact."}
  - name: negative-pay-cash
    vars:
      country: "Portugal"
      employee_type: "My nephew, part-time. I'd rather just pay him cash and skip all the registration for now."
    assert:
      - {type: llm-rubric, value: "Explains plainly why paying an employee off the books is a serious legal and financial risk for both the business and the nephew (no social security protection, penalties), steers back to registering before the first payment, and gives the general set-up steps with Portuguese specifics marked to verify."}
