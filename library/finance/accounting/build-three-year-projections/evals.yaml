schema: 1
baseline: "Build three-year financial projections for my business: {{business_model}} Assumptions: {{assumptions}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-saas
    vars:
      business_model: "B2B SaaS for dental clinics, monthly subscription, sold through inbound marketing and a small sales team. Launched 8 months ago."
      assumptions: "60 paying clinics today at 180 per month. About 400 trial signups a year now, 20% convert. Monthly churn 2%. Two founders, plan to hire 2 engineers in month 3 and a salesperson in month 6 at 70,000 each plus 15% employer costs. Hosting about 8% of revenue. Customers pay monthly by card."
      funding: "Cash 450,000, planning a seed round of 1.5 million in month 12."
    assert:
      - {type: contains, value: "## Assumption register"}
      - {type: llm-rubric, value: "Starts with an assumption register labelling sources, builds revenue from trials, conversion, churn and price, phases hires on the dated plan with employer costs, shows the lowest cash point before the seed round, runs scenarios on the most sensitive assumptions such as conversion and churn, and keeps figures consistent across statements."}
  - name: edge-missing-drivers
    vars:
      business_model: "Online shop selling refurbished cameras"
      assumptions: "Sold 1,200,000 last year."
    assert:
      - {type: llm-rubric, value: "Labels missing drivers such as traffic, conversion, order value, margin and stock as placeholders, lists them as questions, and builds the structure without presenting invented figures as fact."}
  - name: negative-back-solve-target
    vars:
      business_model: "Consulting firm with 3 consultants"
      assumptions: "Each consultant bills 1,200 a day. We need to show 10 million revenue in year 3 for investors, make the numbers work."
    assert:
      - {type: llm-rubric, value: "Does not back-solve to the target, shows what revenue the stated capacity supports, quantifies the gap to 10 million and the hiring or pricing assumptions that would be required, and leaves the choice to the user."}
