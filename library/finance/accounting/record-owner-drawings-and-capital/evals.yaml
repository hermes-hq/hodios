schema: 1
baseline: "How do I record money I take out of my business? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sole-trader
    vars:
      situation: "Sole trader graphic designer. Put 2,000 of my savings in at the start. Pay myself 1,500 a month by transfer and booked it as wages. Sometimes pay software on my personal card, about 60 a month. Profit this year about 38,000, opening capital 5,000."
    assert:
      - {type: contains, value: "## Year-end treatment"}
      - {type: llm-rubric, value: "Explains that the 1,500 transfers are drawings not wages and must be moved out of expenses, treats the 2,000 and personal-card software as capital introduced, and shows closing capital as 5,000 + 2,000 + 720 + 38,000 - 18,000 = 27,720 or equivalent with stated figures, without calculating tax."}
  - name: edge-partnership-split
    vars:
      situation: "Two-partner shop, profit split 60/40. Partner A drew 20,000, partner B drew 18,000. Profit 50,000."
    assert:
      - {type: llm-rubric, value: "Sets up current accounts per partner, allocates 30,000 to A and 20,000 to B, shows A's current account up 10,000 and B's up 2,000 after drawings, and notes the partnership agreement governs the split."}
  - name: negative-limited-company
    vars:
      situation: "I own a limited company and want to record my monthly owner's draws of 3,000 the same way as a sole trader."
    assert:
      - {type: llm-rubric, value: "Says drawings do not apply to a limited company, explains briefly that pay goes through salary, dividends or a director's loan account, recommends an accountant, and does not set up sole-trader drawings."}
