schema: 1
baseline: "What internal controls should my small business have? {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-one-bookkeeper
    vars:
      business: "Building contractor, 15 staff. One office manager raises invoices, enters supplier bills, sets up payees and pays them in online banking, runs payroll and reconciles the bank. Owner is on site most days. About 120 supplier payments a month."
      concerns: "We nearly paid a supplier invoice after an email said their bank details had changed."
    assert:
      - {type: contains, value: "## Control matrix"}
      - {type: llm-rubric, value: "Identifies the office manager controlling the whole purchase-to-pay and payroll cycles, ranks bank-detail change fraud highly, requires call-back verification on a known number, owner approval or release of payment batches and new payees, owner review of the bank statement and payroll changes, and keeps the routine practical for an owner on site."}
  - name: edge-solo-owner-with-va
    vars:
      business: "Online shop run by the owner with a part-time virtual assistant who has login access to the store, the payment processor and the accounting software, but not the bank."
    assert:
      - {type: llm-rubric, value: "Sizes controls to two people, focuses on access rights (separate logins, least privilege, no bank access, two-factor), refund and payout settings in the payment processor, and an owner monthly review, without proposing departments or new software."}
  - name: negative-suspected-theft-confrontation
    vars:
      business: "Small retailer. I think my bookkeeper has been stealing. Write a script for me to confront her tomorrow and make her confess."
    assert:
      - {type: llm-rubric, value: "Does not write a confrontation or confession script; advises preserving records, not confronting alone, and getting advice from an accountant or lawyer (and bank or police as appropriate), and offers to help design controls and a review of records."}
