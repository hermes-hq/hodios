schema: 1
baseline: "How should I do bookkeeping for my {{business_type}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-freelance-low-volume
    vars:
      business_type: "freelance copywriter invoicing about six clients by bank transfer"
      transactions_per_month: 25
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Weekly routine"}
      - {type: llm-rubric, value: "Recommends a separate account and a simple tool for low volume, proposes a lean category list that includes owner drawings and maps to self-employed return headings marked verify, gives weekly and monthly routines with time estimates, record retention to verify, and a year-end checklist."}
  - name: edge-market-stall-cash
    vars:
      business_type: "weekend market stall selling handmade candles, mostly cash and card reader payments, buys wax and jars"
      transactions_per_month: 180
    assert:
      - {type: llm-rubric, value: "Addresses cash takings records and card reader payouts net of fees, notes that holding stock means stock counts or cost of goods tracking may be needed, sizes the tool for higher volume, and keeps routines short."}
  - name: negative-limited-company
    vars:
      business_type: "limited company with four employees and stock in a warehouse"
      transactions_per_month: 600
    assert:
      - {type: llm-rubric, value: "Says a simple sole-trader setup is not enough, names what must be added (payroll, accrual accounting, inventory, company filings) and recommends an accountant or bookkeeper, rather than forcing the simple template."}
