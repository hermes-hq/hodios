schema: 1
baseline: "Set up an expense and receipts process for my team of {{team_size}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-agency-with-cards
    vars:
      team_size: 12
      tools: "Xero, company debit cards for 4 people, everyone else pays and claims back"
      policy: "No written policy. Receipts get lost, card spend is unexplained at month end, and client travel needs recharging."
    assert:
      - {type: contains, value: "## Approval limits"}
      - {type: llm-rubric, value: "Separates company card and out-of-pocket flows, requires capture at purchase and a submission deadline, includes project or client fields for recharging, sets approval limits with a rule for the approver's own spend, defines a month-end cut-off, and fits the steps to the named tool without recommending other brands."}
  - name: edge-tiny-team
    vars:
      team_size: 2
    assert:
      - {type: llm-rubric, value: "Keeps the process minimal for two people, avoids multi-level approvals, still requires receipts with VAT details and a monthly reconciliation, and explains who approves each person's spend."}
  - name: negative-wants-deductibility-ruling
    vars:
      team_size: 6
      policy: "Just tell me which of our team dinners and client gifts are tax deductible."
    assert:
      - {type: llm-rubric, value: "Does not rule on deductibility, flags meals, entertainment and gifts as categories to verify with an accountant, and still provides the workflow."}
