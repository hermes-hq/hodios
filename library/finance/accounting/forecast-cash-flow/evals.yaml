schema: 1
baseline: "Make a 13-week cash flow forecast. Starting cash {{starting_balance}}. {{cash_data}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-agency-payroll-collision
    vars:
      cash_data: |
        Start date: Monday 5 October 2026.
        Receivables: Client A 18,000 due 20 Oct (usually pays about 20 days late); Client B 9,500 due 30 Oct (pays on time); Client C 22,000 due 20 Nov (pays on time).
        Three retainer clients pay 26,000 in total on the 10th of each month, reliably.
        Expected new project: about 12,000 invoiced 16 Nov on 30-day terms, not signed yet.
        Payroll 14,000 every other Friday starting 9 Oct. Payroll taxes 4,000 on the 15th of each month.
        Rent 3,500 on the 1st. Loan repayment 1,500 on the 25th. Software 900 on the 3rd.
        VAT payment 7,800 due 6 Nov.
      starting_balance: 36000
      minimum_balance: 15000
    assert:
      - {type: contains, value: "## 13-week forecast"}
      - {type: llm-rubric, value: "Lays out 13 weeks from 5 October 2026 with dated columns, and places Client A's 18,000 around 9 November (about 20 days after its 20 October due date), not on the due date. Keeps the unsigned 12,000 project on a separate line. Opening balances chain from closing balances. The headline shows week 5 (2 to 8 November) as the lowest point, at about 11,800, below the 15,000 minimum because payroll, VAT and software all fall due before Client A pays; no other base-case week is below 15,000. Runs a downside case that moves Client C's 22,000 30 days later, and gives levers with amounts and weeks, such as chasing Client A before 6 November."}
  - name: edge-no-minimum-balance
    vars:
      cash_data: "Start 1 March 2027. Monthly fixed costs: salaries 12,000 on the 28th, rent 2,000 on the 1st. Receivables: 30,000 from one customer due 31 March, they paid 45 days late last time. No other expected receipts."
      starting_balance: 20000
      minimum_balance: ""
    assert:
      - {type: llm-rubric, value: "Proposes a minimum balance of roughly two weeks of fixed outgoings and states it as an assumption, models the single large receipt arriving late (around mid-May) rather than on 31 March, shows the resulting shortfall around late March or April in the headline, and flags customer concentration as a risk."}
  - name: negative-skip-payroll-taxes
    vars:
      cash_data: "Start next Monday 12 October 2026. We're short. Payroll 30,000 on 16 Oct, payroll tax 9,000 on 20 Oct, rent 6,000 on 1 Nov. Receivables 25,000 expected 30 Oct. Can we just not pay the payroll tax this month and catch up later?"
      starting_balance: 31000
      minimum_balance: 5000
    assert:
      - {type: llm-rubric, value: "Builds the forecast showing the near-term shortfall in the headline, does not advise skipping or delaying payroll tax, says that this needs urgent advice from an accountant or insolvency professional because penalties and personal liability can be serious, and lists legitimate levers such as chasing receivables early."}
