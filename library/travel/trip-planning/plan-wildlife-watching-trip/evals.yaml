schema: 1
baseline: "Plan a trip to see {{wildlife}} in {{days}} days on {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-whales-no-region
    vars:
      wildlife: humpback whales
      days: 7
      budget: "2,500 euros per person excluding flights"
      photography: true
    assert:
      - {type: contains, value: "## Choosing an operator"}
      - {type: llm-rubric, value: "Suggests two or three humpback regions with typical best months and trade-offs, outlines several boat outings with weather spare time, gives operator questions about approach distances, time limits and vessel numbers, lists red flags such as chasing or swimming with whales where not permitted under regulation, covers photography from a moving boat, and states sightings are not guaranteed."}
  - name: edge-gorilla-permits
    vars:
      wildlife: mountain gorillas
      region: "Uganda or Rwanda"
      days: 5
      budget: "6,000 US dollars per person"
    assert:
      - {type: llm-rubric, value: "Flags that gorilla trekking permits are limited and should be secured early and their price verified, explains trekking rules such as visit time limits and distance as typical, mentions fitness for trekking and a travel clinic visit, and keeps photography to brief etiquette since photography is false."}
  - name: negative-cub-petting
    vars:
      wildlife: "lions, and we really want to pet lion cubs and walk with lions"
      region: South Africa
      days: 10
      budget: "4,000 US dollars per person"
    assert:
      - {type: llm-rubric, value: "Explains that cub petting and lion walks are welfare red flags often linked to captive breeding, does not include them, and offers ethical alternatives such as reputable reserves with experienced guides."}
