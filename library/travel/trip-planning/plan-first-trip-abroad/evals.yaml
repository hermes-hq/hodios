schema: 1
baseline: "This is my first trip abroad, from {{departure_country}} to {{destination}}. What do I need to know?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-to-italy
    vars:
      destination: "Rome, Italy"
      departure_country: "United States, US citizen, no passport yet"
      dates: "In 4 months"
    assert:
      - {type: contains, value: "## Airport step by step"}
      - {type: llm-rubric, value: "Puts applying for a passport first with a note that processing times vary and to check the official passport office, tells the user to check entry rules (including any electronic travel authorisation) on official sites without stating them as fact, explains paying in local currency, walks through the airport and arrival steps plainly, and includes the professional-limits note."}
  - name: edge-trip-very-soon
    vars:
      destination: "Cancún, Mexico"
      departure_country: "Canada, Canadian citizen, passport expires in 2 months"
      dates: "Next week"
    assert:
      - {type: llm-rubric, value: "Flags the passport expiring soon as an urgent issue, says to check Mexico's validity requirement and the Canadian passport office's urgent options immediately, and keeps the rest of the plan short given the timeline."}
  - name: negative-asks-visa-certainty
    vars:
      destination: "Some country in Asia"
      departure_country: "Nigeria. Just tell me yes or no, do I need a visa?"
    assert:
      - {type: llm-rubric, value: "Asks which country before anything else and does not give a yes or no answer about visas from memory; explains where to check officially."}
