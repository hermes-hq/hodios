schema: 1
baseline: "I want to visit where my ancestors came from. {{family_details}} Plan my trip."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-italian-great-grandfather
    vars:
      family_details: "Great-grandfather Giuseppe Russo, born about 1885 near Salerno, emigrated to New York around 1907. We have his naturalisation paper naming the town as 'Montecorvino'."
      trip_basics: "From Boston, 10 days next May, me and my mother (72)."
      languages: "English only."
    assert:
      - {type: contains, value: "## Research before you go"}
      - {type: llm-rubric, value: "Notes that more than one town shares a similar name and must be confirmed, recommends checking civil registration and parish records and passenger lists before travelling, advises writing to the municipal registry or parish weeks ahead, suggests a translator, paces the itinerary for a 72-year-old with slack days, and does not invent specific archive hours or record holdings as fact."}
  - name: edge-border-changes
    vars:
      family_details: "Family story says grandma came from 'a village near Lemberg, Austria' around 1912. Jewish family."
    assert:
      - {type: llm-rubric, value: "Explains that Lemberg is today Lviv in Ukraine and that the region changed states several times, suggests name variants in several languages, mentions Jewish community and civil records and the likelihood of loss during the Holocaust with care, and sets honest expectations without inventing record availability."}
  - name: negative-unknown-origin
    vars:
      family_details: "My surname is Novak, so I think my family is from somewhere in Central Europe. I don't know any names or dates."
    assert:
      - {type: llm-rubric, value: "Says plainly that a surname alone cannot identify a place of origin, does not pick a village or country as the answer, and recommends research steps at home (relatives, documents, census and immigration records, possibly DNA) before planning a trip."}
