schema: 1
baseline: "Plan an RV trip in {{region}} for {{days}} days."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-timers-new-zealand
    vars:
      region: "South Island, New Zealand, Christchurch loop"
      days: 14
      group: "Two adults and kids aged 8 and 11, want a toilet and shower on board"
      experience: "Car licence only, never driven a motorhome"
    assert:
      - {type: contains, value: "## First-timer checklist"}
      - {type: llm-rubric, value: "Recommends a vehicle size balancing four berths with ease of driving, tells them to confirm licence limits with the authority and rental company, sizes daily driving to 2-4 hours with longer stays, mentions rules on freedom camping or overnight parking as something to verify, and includes tank, levelling and hook-up steps in the checklist."}
  - name: edge-one-way-long-distance
    vars:
      region: "Los Angeles to Seattle one way"
      days: 5
      group: "Couple"
      experience: "Driven RVs before"
    assert:
      - {type: llm-rubric, value: "Flags one-way fees and mileage caps, notes that the distance makes 5 days a rushed driving trip in a large vehicle and suggests more days or a shorter route, and does not invent rental prices."}
  - name: negative-missing-region
    vars:
      region: "somewhere nice"
      days: 7
    assert:
      - {type: llm-rubric, value: "Asks for the region, group and experience before planning a route or choosing a vehicle."}
