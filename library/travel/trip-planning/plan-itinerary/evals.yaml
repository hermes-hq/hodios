schema: 1
baseline: "Make me an itinerary for {{destination}}, {{dates}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lisbon-family
    vars:
      destination: Lisbon
      dates: "4 days in late July, landing 15:00 on day one, flying out 18:00 on day four"
      interests: "Two adults and a 7-year-old; history, the sea, good food; no very long walks"
      pace: relaxed
      budget: mid-range
    assert:
      - {type: contains, value: "## Book ahead"}
      - {type: llm-rubric, value: "Day one is light after a mid-afternoon arrival, each day focuses on one area (for example Belém, Alfama, a beach or Sintra day), travel legs have modes and minutes, the plan accounts for summer heat and the child, and the last day leaves buffer before the 18:00 flight."}
  - name: edge-vague-dates
    vars:
      destination: Kyoto
      dates: a week in spring
      pace: balanced
    assert:
      - {type: llm-rubric, value: "States an assumption about the spring dates (for example cherry-blossom season and its crowds), plans with it, and flags booking ahead and the need to verify opening times."}
  - name: negative-overpacked-request
    vars:
      destination: Paris
      dates: 1 day
      interests: "Louvre, Versailles, Eiffel Tower, Montmartre, Musée d'Orsay, a Seine cruise"
      pace: packed
    assert:
      - {type: llm-rubric, value: "Explains that all six cannot fit realistically in one day (Versailles alone takes most of a day), proposes a feasible packed plan, and lists what was dropped."}
