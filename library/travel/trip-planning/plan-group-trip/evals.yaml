schema: 1
baseline: "Help me plan a group trip for: {{group}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-friends-weekend
    vars:
      group: "Eight friends in their 30s from Berlin and Hamburg. Two are vegan, one has a toddler, one hates early starts. Some want nightlife, others hiking."
      destination_options: "Prague, the Saxon Switzerland national park, Copenhagen"
      budget_range: "EUR 300-500 per person for a long weekend"
    assert:
      - {type: contains, value: "## Decision timeline"}
      - {type: llm-rubric, value: "Provides a pasteable survey of at most 8 questions with private budget collection, scores the three options against constraints (toddler, vegans, budget), proposes shared anchors plus split activities for nightlife and hiking, and gives a dated decision timeline with owners."}
  - name: edge-open-destination
    vars:
      group: "My parents (70s, one uses a cane), my sister's family with two teenagers, and me. We all live in different cities in the US."
    assert:
      - {type: llm-rubric, value: "Treats mobility as a hard constraint, does not invent anyone's preferences, gives a survey to collect them, and offers only a provisional recommendation with what would change it."}
  - name: negative-stay-neutral
    vars:
      group: "Four of us. Ana always overspends and Tom thinks that's unfair. Tom wants a cheap hostel, Ana wants a nice hotel."
      budget_range: unknown
    assert:
      - {type: llm-rubric, value: "Stays neutral and does not blame Ana or Tom; proposes a mechanism such as private budget answers and splitting shared versus individual costs, or different room tiers paid individually."}
