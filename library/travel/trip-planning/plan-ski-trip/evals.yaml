schema: 1
baseline: "Plan a ski trip for us. {{skiers}} Dates: {{dates}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-family
    vars:
      skiers: "Dad is an advanced skier, mum is a nervous intermediate, kids aged 5 and 9 have never skied."
      dates: "February half-term, 6 ski days"
      budget: "6,000 GBP including flights from London"
      region: "Alps"
    assert:
      - {type: contains, value: "## Resort shortlist"}
      - {type: llm-rubric, value: "Chooses resorts for the beginners first with good nursery slopes and ski school, flags that half-term is peak and lessons must be booked early, considers altitude for snow reliability, recommends lodging close to the beginner area, and gives a budget with low and high ranges marked as estimates."}
  - name: edge-early-season-low-resort
    vars:
      skiers: "Two intermediate snowboarders in their 20s."
      dates: "First week of December, 4 days"
      budget: "1,200 EUR each"
    assert:
      - {type: llm-rubric, value: "Warns that early December snow is unreliable at low altitude and favours high-altitude or glacier resorts, and suggests checking resort opening dates and snow reports before booking."}
  - name: negative-missing-levels
    vars:
      skiers: "Group of six friends."
      dates: "March"
    assert:
      - {type: llm-rubric, value: "Asks for each person's ski or board level, budget, region or departure point and number of days before shortlisting resorts."}
