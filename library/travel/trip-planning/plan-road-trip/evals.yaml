schema: 1
baseline: "Plan a {{days}}-day road trip from {{start}} to {{end}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ev-munich-to-milan
    vars:
      start: Munich
      end: Milan
      days: 4
      vehicle: ev
      interests: "Lakes and mountain passes; car has about 350 km real-world range"
    assert:
      - {type: contains, value: "## Fuel or charging plan"}
      - {type: llm-rubric, value: "Routes through Austria and/or Switzerland with scenic stops, uses the 350 km range to plan charging stops at about 10-20% arrival and 80% charge, and tells the user to check the Austrian and Swiss motorway vignettes and Italian tolls."}
  - name: edge-loop-motorbike
    vars:
      start: Edinburgh
      end: Edinburgh
      days: 5
      vehicle: motorbike
      interests: Scottish Highlands
    assert:
      - {type: llm-rubric, value: "Plans a loop returning to Edinburgh, keeps daily riding to about 3-4 hours, and notes fuel gaps in remote Highland areas, weather and secure overnight parking."}
  - name: negative-impossible-distance
    vars:
      start: Lisbon
      end: Helsinki
      days: 3
    assert:
      - {type: llm-rubric, value: "States that the distance cannot be driven comfortably in 3 days and offers alternatives such as more days, a shorter route or a flight or train leg, instead of producing 12-hour driving days without comment."}
