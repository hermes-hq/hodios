schema: 1
baseline: "I want to see the northern lights. {{options}} Plan my trip."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-norway-vs-finland
    vars:
      options: "From Madrid, choosing between Tromso and Finnish Lapland, February or March."
      trip_basics: "5 nights, couple, mid budget, never driven on snow."
    assert:
      - {type: contains, value: "## Reading the forecasts"}
      - {type: llm-rubric, value: "Explains that cloud cover is the main factor and that the coast is often cloudier than inland Lapland, recommends a base and window with reasons, says more nights improve odds without giving a percentage, explains checking cloud forecasts before activity indices, recommends guided chasing tours rather than self-driving on snow, and covers cold-weather safety."}
  - name: edge-one-night-only
    vars:
      options: "Business trip to Reykjavik in November, one free evening."
    assert:
      - {type: llm-rubric, value: "Sets expectations honestly that one night is a gamble mainly because of cloud, suggests checking the cloud forecast that day and joining a tour with a re-try policy or heading to a dark spot outside the city lights, and gives a short routine."}
  - name: negative-summer-dates
    vars:
      options: "Iceland in late June, I want to see the aurora for sure."
    assert:
      - {type: llm-rubric, value: "States plainly that late June in Iceland has near-continuous daylight so the aurora will not be visible, refuses to promise anything, and suggests months with darkness (roughly September to March) as an alternative."}
