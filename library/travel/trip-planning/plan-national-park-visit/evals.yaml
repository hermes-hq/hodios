schema: 1
baseline: "Plan a {{days}}-day visit to {{park}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-popular-park-summer
    vars:
      park: "Zion National Park, late June"
      days: 3
      group: "Two adults in their 30s, staying in a gateway town"
      fitness: "Fit, regular hikers, fine with exposure"
    assert:
      - {type: contains, value: "## Permits and reservations"}
      - {type: llm-rubric, value: "Flags that some famous hikes need a permit or lottery and shuttle or entry rules may apply, telling the user to check the official park site for current rules and dates, warns about June heat and flash flood risk in canyons, starts hikes early, gives approximate distances and elevation gain, and includes turnaround times."}
  - name: edge-family-easy-walks
    vars:
      park: "A national park in the Scottish Highlands, August"
      days: 2
      group: "Grandparents and two kids aged 6 and 8"
      fitness: "Easy walks only, under 5 km"
    assert:
      - {type: llm-rubric, value: "Keeps every walk short and gentle with family-friendly options, plans for changeable weather and midges, avoids suggesting long or steep hikes, and frames permits and access in the local context rather than copying US-style permit systems."}
  - name: negative-missing-days-and-park
    vars:
      park: "a national park"
      days: 0
    assert:
      - {type: llm-rubric, value: "Asks which park, the dates and how many days before planning, instead of inventing a park or permits."}
