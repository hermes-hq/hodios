schema: 1
baseline: "Plan a staycation in {{location}} for {{days}} days."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-city
    vars:
      location: "Manchester, UK, happy to take a train up to an hour"
      days: 3
      interests: "Couple in our 30s, love food, live music and walks, we've done the main museums."
      budget: "300 GBP"
    assert:
      - {type: contains, value: "## Ground rules"}
      - {type: llm-rubric, value: "Offers three themes and picks one, sets ground rules against chores and work, builds a 3-day itinerary with new places, a rest block each day and short travel, avoids the main museums they have done, gives a budget with cheaper swaps, includes a rain plan, and does not invent venue names it is unsure of."}
  - name: edge-tiny-budget-family
    vars:
      location: "A suburb of Phoenix, Arizona, no car for the weekend"
      days: 2
      interests: "Single parent with two kids aged 6 and 9, it's July"
      budget: "50 USD"
    assert:
      - {type: llm-rubric, value: "Keeps everything free or very cheap and reachable without a car, plans around July heat with indoor and early-morning activities, and includes kid-friendly rest time."}
  - name: negative-vague-location
    vars:
      location: "home"
    assert:
      - {type: llm-rubric, value: "Asks where home is and how far they will travel before suggesting places."}
