schema: 1
baseline: "Plan my walk of {{route}} in {{days}} days."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-camino-final-stretch
    vars:
      route: "Camino Francés, the last stretch from Sarria to Santiago, in May"
      days: 6
      fitness: "Age 58, walks 8 km most days, no injuries, wants a day pack with luggage transfer, guesthouses"
    assert:
      - {type: contains, value: "## Stage plan"}
      - {type: llm-rubric, value: "Builds a stage table of roughly 100 km over the days with shorter early stages, mentions the pilgrim credential and stamping as something to confirm, advises booking lodging ahead in May, includes luggage transfer and a gradual training plan, and marks distances as approximate."}
  - name: edge-too-ambitious
    vars:
      route: "Tour du Mont Blanc full loop, early June"
      days: 5
      fitness: "Occasional city walker, never done a mountain trek"
    assert:
      - {type: llm-rubric, value: "Says the full loop does not fit 5 days for this walker and offers options such as a shorter section or more days, and warns that early June can bring snow on high passes and that some huts may not yet be open, to check with official sources."}
  - name: negative-unclear-route
    vars:
      route: "a long walk somewhere in Europe"
      days: 10
    assert:
      - {type: llm-rubric, value: "Asks which route or region, the month and the walker's fitness and lodging preference before building stages, or offers a few route options to choose from, instead of inventing a stage plan."}
