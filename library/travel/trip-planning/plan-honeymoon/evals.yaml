schema: 1
baseline: "Plan our honeymoon. {{styles}} Budget {{budget}}. Dates: {{dates}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-split-styles
    vars:
      styles: "I want beaches and reading by a pool; my husband wants food markets, cooking classes and city walks. Neither of us likes long bus rides."
      budget: "8,000 EUR total"
      dates: "Leave 2 days after our 20 September wedding, 12 nights"
      departure_city: "Lisbon"
    assert:
      - {type: contains, value: "## Booking timeline"}
      - {type: llm-rubric, value: "Names the difference in styles and plans a two-base or split-day trip giving each partner their thing, gives 3 destination options with weather notes for late September, builds a slow first day or two, keeps prices as estimates without inventing resort names, and includes a booking timeline working back from the wedding."}
  - name: edge-name-change-and-monsoon
    vars:
      styles: "Both love diving and quiet islands. I'm taking my wife's surname after the wedding."
      budget: "6,000 USD"
      dates: "Wedding 5 July, then 9 nights"
      departure_city: "Singapore"
    assert:
      - {type: llm-rubric, value: "Warns that tickets must match the passport name used for travel and to book in the current name unless a new passport will arrive in time, and checks the July season for each island option (for example monsoon or rough seas on some coasts) rather than recommending a destination that is in its wet season without saying so."}
  - name: negative-missing-budget-and-dates
    vars:
      styles: "We want something romantic."
      budget: "not sure"
      dates: "sometime next year"
    assert:
      - {type: llm-rubric, value: "Asks briefly for a budget range, trip length and dates or season, departure city and what romantic means to each partner, instead of producing a full itinerary for an invented destination and budget."}
