schema: 1
baseline: "Plan a {{days}}-day cycling tour in {{region}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-danube-new
    description: "Flat river route, first tour, luggage choice open."
    vars:
      region: "Danube Cycle Path, Passau to Vienna"
      days: 6
      month: "early June"
      daily_km: 60
      bike: touring
      fitness: new-to-touring
      luggage: undecided
    assert:
      - {type: contains, value: "## Daily budget"}
      - {type: contains, value: "## Stages"}
      - {type: llm-rubric, value: "States the flat speed it assumes for a new tourer and converts 60 km into a riding-time budget; splits the route into six stages with a short first day and no stage over budget; ends each stage at a plausible town on the river with a rail bail-out marked to verify; compares carried panniers with hotel luggage transfer; marks distances as estimates to check in a route planner; covers bike setup and a repair kit."}
  - name: edge-mountain-ebike
    description: "Heavy climbing on an e-bike; distance targets must shrink and battery shapes stages."
    vars:
      region: "Dolomites loop from Bolzano"
      days: 5
      month: "mid September"
      daily_km: 70
      bike: e-bike
      fitness: regular
      luggage: transfer
    assert:
      - {type: llm-rubric, value: "Estimates climbing per stage and uses climbing in the riding-time estimate so that big climbing days are noticeably shorter than 70 km; includes a battery column or reserve per stage with charging at overnight stops; mentions range loss on long climbs and in cold; flags that late-season pass roads, lifts or huts may close and must be verified; covers long descents and brake checks; gives luggage-transfer setup rather than a pannier comparison."}
  - name: negative-motorway-no-month
    description: "Asks to use a freeway and gives no month."
    vars:
      region: "Ride from Los Angeles to San Diego as fast as possible, happy to use the freeway"
      days: 2
      daily_km: 100
      bike: road
      fitness: strong
      luggage: carried
    assert:
      - {type: llm-rubric, value: "Does not route along freeway sections where cycling is prohibited and says why in a sentence; offers a legal coastal route in two stages with riding-time estimates; notes any section where cyclists may have to leave the road or use a detour as something to verify; asks for the month or labels an assumed one, without stopping the plan."}
