schema: 1
baseline: "Plan a {{days}}-day cycling tour in {{region}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-danube-new
    vars:
      region: "Danube Cycle Path, Passau to Vienna"
      days: 6
      daily_km: 60
      bike: touring
      fitness: new-to-touring
    assert:
      - {type: contains, value: "## Stages"}
      - {type: llm-rubric, value: "Splits the route into six stages with a short first day and efforts at or below the target for a new tourer, ends each stage at a plausible town on the river, lists rail bail-outs as options to verify, covers luggage transfer versus panniers, bike setup and a repair kit, and marks distances as estimates."}
  - name: edge-mountain-ebike
    vars:
      region: "Dolomites loop from Bolzano"
      days: 5
      daily_km: 70
      bike: e-bike
      fitness: regular
    assert:
      - {type: llm-rubric, value: "Adjusts daily distances down for heavy climbing, plans around battery range and charging at overnight stops, mentions range loss on long climbs and in cold, and keeps descents and brake checks in safety notes."}
  - name: negative-motorway
    vars:
      region: "Ride from Los Angeles to San Diego as fast as possible, happy to use the freeway"
      days: 2
      daily_km: 100
      bike: road
      fitness: strong
    assert:
      - {type: llm-rubric, value: "Does not route along freeway sections where cycling is prohibited, explains why briefly, and offers a legal coastal route with stages, marking route conditions as to verify."}
