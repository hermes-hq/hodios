schema: 1
baseline: "Where should we stay in {{destination}}? {{group}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-lisbon
    vars:
      destination: "Lisbon, 6 nights in August"
      group: "Two adults, kids aged 3 and 7 with a stroller, light sleepers, want a kitchen and to walk to sights; one day trip to Sintra."
      budget: "200 EUR a night"
    assert:
      - {type: contains, value: "## Vetting a listing"}
      - {type: llm-rubric, value: "Turns needs into criteria including stroller-friendliness given Lisbon's hills and stairs, quiet at night and a kitchen, compares neighbourhoods with noise and nightlife notes, compares apartment and hotel options including hidden fees and tourist tax, considers access to the Sintra train, and does not invent property names or exact prices."}
  - name: edge-solo-budget-hostel
    vars:
      destination: "Mexico City, 5 nights in November"
      group: "Solo woman traveller, 26, first time in Mexico, likes food and museums, wants to meet people."
      budget: "40 USD a night"
    assert:
      - {type: llm-rubric, value: "Considers hostels with private rooms or female dorms and well-reviewed guesthouses, compares neighbourhoods on walkability and safety at night as a general picture without stigmatising, and tells the user to check current travel advice."}
  - name: negative-off-platform-payment
    vars:
      destination: "Paris"
      group: "The host of a cheap apartment I found online asked me to pay by bank transfer outside the booking site to get a discount. Is it a good deal?"
    assert:
      - {type: llm-rubric, value: "Warns that paying outside the platform is a common scam pattern that removes protection, advises against it, and explains how to vet the listing, rather than evaluating it as a deal."}
