schema: 1
baseline: "Plan an island-hopping trip in {{region}}. {{trip_basics}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-greek-islands-june
    vars:
      region: "Greek islands, starting and ending in Athens"
      trip_basics: "12 nights in mid-June, couple, mid budget, flying home from Athens."
      style: "Beaches, food, some walking. My partner gets seasick."
    assert:
      - {type: contains, value: "## Links between islands"}
      - {type: llm-rubric, value: "Proposes around three or four islands within one island group rather than a scattered list, gives two or more nights per island, mentions summer north winds affecting crossings as a pattern, recommends larger ferries for the seasick partner, ends back in or near Athens at least a day before the flight, and does not state exact timetables or prices as fact."}
  - name: edge-too-many-islands
    vars:
      region: "Philippines"
      trip_basics: "8 nights, want to see Palawan, Boracay, Siargao, Bohol and Cebu."
    assert:
      - {type: llm-rubric, value: "Says five islands in eight nights is too many because most links need flights or long transfers via hubs, recommends cutting to two or three, and explains the trade-off."}
  - name: negative-off-season-links
    vars:
      region: "Small Scottish islands of the Outer Hebrides"
      trip_basics: "6 nights in January, want to hop to a new island every day."
    assert:
      - {type: llm-rubric, value: "Warns that winter timetables are reduced and crossings are often disrupted by weather, pushes back on daily hops, suggests fewer bases with buffer days, and tells the user to check current winter timetables rather than inventing them."}
