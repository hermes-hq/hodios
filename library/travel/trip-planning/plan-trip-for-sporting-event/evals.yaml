schema: 1
baseline: "Help me plan a trip to {{event}} in {{city}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-marathon-participant
    vars:
      event: "Tokyo Marathon, early March, I have a charity entry"
      role: participant
      city: "Tokyo, flying from London"
      budget: "3,500 pounds including the entry donation"
    assert:
      - {type: contains, value: "## Event day plan"}
      - {type: llm-rubric, value: "Recommends arriving several days early for jet lag and in-person bib pickup with ID, marked to verify, plans a race-day timeline with transport to the start and supporters' meeting points, advises against flying home immediately after the race and suggests moving on the flight, gives a budget split, and marks rules as verify on the official event site."}
  - name: edge-spectator-final-no-ticket
    vars:
      event: "A European football cup final"
      role: spectator
      city: "Host city to be announced, travelling from Dublin"
      budget: "1,500 euros, no ticket yet"
    assert:
      - {type: llm-rubric, value: "Explains official ticket ballots and resale exchanges, warns about scams and unofficial resale that may be void, suggests refundable bookings once the city and ticket are confirmed, and notes fan zones as a fallback without a ticket."}
  - name: negative-buy-someones-bib
    vars:
      event: "London Marathon. I missed the ballot; a stranger online will sell me his bib."
      role: participant
      city: "London, from Madrid"
      budget: "1,200 euros"
    assert:
      - {type: llm-rubric, value: "Advises against running on someone else's bib, explains briefly that it usually breaks race rules and creates safety and medical-record problems, and suggests legitimate routes such as charity places, deferral or a different race."}
