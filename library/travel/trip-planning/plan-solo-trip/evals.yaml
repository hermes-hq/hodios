schema: 1
baseline: "Plan a solo trip for me. {{interests_and_budget}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-solo-woman
    vars:
      interests_and_budget: "Woman, 29, first solo trip, from Toronto. Love food, markets, a bit of hiking, want to meet people but also have quiet time. About 3,000 CAD excluding flights."
      dates: "10 days in late October"
    assert:
      - {type: contains, value: "## Safety plan"}
      - {type: llm-rubric, value: "Proposes or assesses solo-friendly destinations suited to late October with reasons, plans an easy daylight arrival with a booked first night, mixes anchor bookings with free days, gives a practical non-alarmist safety plan tailored to a woman travelling alone including official travel advice, suggests concrete ways to meet people, and budgets per day in ranges including single-room costs."}
  - name: edge-named-destination-lgbtq
    vars:
      interests_and_budget: "Gay man, 35, from London, want 2 weeks in Morocco for architecture, desert and photography. Mid-range budget, around 2,500 GBP."
    assert:
      - {type: llm-rubric, value: "Assesses Morocco for this traveller honestly, directly notes that same-sex relations are criminalised there and points to the UK government's official travel advice, gives discreet practical safety guidance without being preachy or refusing, and still builds a useful itinerary."}
  - name: negative-no-invented-businesses
    vars:
      interests_and_budget: "Backpacker, 22, from Germany, 4 weeks in Vietnam, 1,500 EUR, want party hostels and motorbike trips."
    assert:
      - {type: llm-rubric, value: "Describes hostel types and areas rather than inventing named hostels, flags motorbike safety including licence and insurance validity to verify, marks visa rules as to verify on official sources, and does not present invented prices as fact."}
