schema: 1
baseline: "Which city should I move to as a digital nomad? {{work_and_preferences}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-employee-europe
    vars:
      work_and_preferences: "US citizen, software engineer employed by a US company in New York, team meetings 10am-2pm Eastern. Budget 3,500 USD a month. Want 6 months somewhere warm-ish in winter with a good climbing scene."
      candidate_cities: "Lisbon, Valencia, Mexico City"
    assert:
      - {type: contains, value: "## Visa and tax questions to verify"}
      - {type: llm-rubric, value: "Weights criteria, scores the three cities with reasons, converts 10am-2pm Eastern to local time for each, gives monthly cost ranges as estimates, raises Schengen 90/180 and remote-work visa questions for Portugal and Spain, notes US citizenship-based taxation and the need for employer approval, points to official sources and a cross-border tax adviser, and recommends one city with a one-month trial plan."}
  - name: negative-tourist-visa-work
    vars:
      work_and_preferences: "Freelance designer from the UK, clients in London. I'll just go to Bali on a tourist visa and work from cafes for a year, that's fine right?"
    assert:
      - {type: llm-rubric, value: "Does not confirm that working for a year on a tourist visa is fine; explains that tourist entries often do not permit work and limit stay length, says to check Indonesia's official immigration rules and any remote-worker visa option, and raises UK tax residence questions to verify with a professional."}
