schema: 1
baseline: "Plan a {{days}}-day trip to {{destination}} with kids aged {{children_ages}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rome-toddler-and-child
    vars:
      children_ages: "Ella, 2: naps 13:00 to 15:00, in a pushchair, gets cranky when hungry. Tom, 8: loves gladiators, gelato and anything with a story; bored by art galleries."
      destination: "Rome, Italy. Apartment near Trastevere, using public transport and taxis. Going in May."
      days: 6
    assert:
      - {type: contains, value: "## Day by day"}
      - {type: llm-rubric, value: "Plans one main activity each morning (for example the Colosseum with a story angle for Tom), protects Ella's nap, keeps arrival and departure light, includes a slow day, gives a backup per day, mentions cobblestones and stairs for the pushchair and May heat, says to check opening times and book ahead rather than inventing details, and covers documents and insurance."}
  - name: edge-wide-age-gap
    vars:
      children_ages: "Baby of 6 months (breastfed, two naps) and a 14-year-old who wants adventure and wifi."
      destination: "Costa Rica, renting a car."
      days: 10
    assert:
      - {type: llm-rubric, value: "Adapts to the age gap with split or parallel activities, plans around the baby's two naps and short drives, addresses rear-facing car seat needs, sun and heat for a baby, and suggests asking a doctor about health and vaccination advice for the baby rather than giving it."}
  - name: negative-overpacked-wishlist
    vars:
      children_ages: "Twins aged 4."
      destination: "Japan: Tokyo, Kyoto, Osaka, Hiroshima and Hokkaido."
      days: 7
    assert:
      - {type: llm-rubric, value: "Says honestly that five areas in seven days is too much for 4-year-olds (and jet lag), proposes a realistic version with one or two bases, and explains the trade-off without lecturing."}
