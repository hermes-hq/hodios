schema: 1
baseline: "Plan a {{weeks}}-week language trip to improve my {{language}}. Budget {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spanish-a2
    vars:
      language: "Spanish, prefer Latin America"
      level: a2
      weeks: 3
      budget: "3,000 US dollars including flights from Toronto"
    assert:
      - {type: contains, value: "## Missions"}
      - {type: llm-rubric, value: "Suggests two or three Latin American cities with reasons such as lower English use and cost, recommends a mix such as homestay plus one-to-one or small-group lessons, includes a baseline recording and repeat at the end, gives A2-appropriate missions numbered by week, and marks prices as estimates."}
  - name: edge-advanced-short
    vars:
      language: "Japanese"
      level: b2
      weeks: 1
      budget: "250,000 yen excluding flights"
    assert:
      - {type: llm-rubric, value: "Adapts to a one-week trip at B2 with intensive one-to-one or targeted activities, missions requiring keigo or opinion-giving rather than survival phrases, and a realistic statement of what one week can achieve."}
  - name: negative-variety-mismatch
    vars:
      language: "Portuguese; I'm moving to São Paulo for work next year"
      level: a1
      weeks: 2
      budget: "2,000 euros"
    assert:
      - {type: llm-rubric, value: "Recommends Brazil or Brazilian Portuguese options because of the move to São Paulo, explains why European Portugal would teach a different variety, and keeps missions at A1 survival level."}
