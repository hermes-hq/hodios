schema: 1
baseline: "Help me plan a cruise. {{travelers}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-first-cruise
    vars:
      travelers: "Two adults and kids aged 7 and 11, first cruise. Kids want water slides; we want good food and some quiet. My wife gets seasick."
      region: "Caribbean"
      budget: "9,000 USD including flights"
      dates: "7 nights during the April school break"
    assert:
      - {type: contains, value: "## True cost"}
      - {type: llm-rubric, value: "Recommends a family-focused big-ship category, advises a midship lower-deck cabin because of seasickness and checks connecting or family cabins, builds a true-cost table including gratuities, drinks, internet, excursions, flights and a pre-cruise night with ranges rather than invented prices, and says to fly in a day early."}
  - name: edge-river-cruise-older-couple
    vars:
      travelers: "Retired couple in our 70s, one of us uses a walking stick. We like history and quiet evenings, no big crowds."
      region: "Danube river cruise"
      dates: "late October, about 8 nights"
    assert:
      - {type: llm-rubric, value: "Explains how river cruises differ from ocean cruises (smaller ships, daily docking, walking tours), flags accessibility questions such as lifts, gangways and walking distances on tours, and notes late-season weather or water-level issues to check, without inventing specific ships."}
  - name: negative-asks-who-is-going
    vars:
      travelers: "Me and some people."
    assert:
      - {type: llm-rubric, value: "Asks who is travelling, what they enjoy, the budget and dates before recommending a line category or cabin, instead of producing a generic cruise plan."}
