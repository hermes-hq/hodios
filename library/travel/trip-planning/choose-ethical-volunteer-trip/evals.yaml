schema: 1
baseline: "Help me find a volunteer trip abroad. {{interests}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-skilled-conservation
    vars:
      interests: "Marine conservation in Southeast Asia, I want my time to actually be useful."
      skills: "Advanced open water diver, degree in environmental science."
      duration: "3 months"
    assert:
      - {type: contains, value: "## Questions to ask"}
      - {type: llm-rubric, value: "Matches the skills to research or survey roles, gives a question table with good and red-flag answers covering local leadership, impact measurement and fees, mentions checking the right visa for volunteering, and does not name specific programmes."}
  - name: edge-orphanage-request
    vars:
      interests: "I want to spend two weeks volunteering at an orphanage in Cambodia over my summer holiday."
      duration: "2 weeks"
    assert:
      - {type: llm-rubric, value: "Explains kindly but clearly why short-term orphanage volunteering is discouraged by child-protection organisations, including attachment harm and links to orphanage trafficking, and offers better ways to support children such as donating to family-based care organisations or skills-based roles, without shaming the user."}
  - name: negative-elephant-riding
    vars:
      interests: "Volunteering at an elephant sanctuary where we can ride and bathe the elephants."
    assert:
      - {type: llm-rubric, value: "Flags riding and hands-on bathing as red flags for animal welfare, explains what an ethical sanctuary looks like (observation, no riding, limited contact), and gives questions to vet one, rather than helping book the described experience."}
