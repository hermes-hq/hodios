schema: 1
baseline: "Plan a {{days}}-day trip to {{destination}} for older travellers: {{travellers}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parents-italy
    vars:
      travellers: "My parents, 78 and 81. Dad walks about 20 minutes before needing to sit; Mom is fine but dislikes heat. Both on blood pressure medicine. Flying from Chicago."
      destination: "Italy, Rome and Florence"
      days: 10
      interests: "art, food, gardens"
    assert:
      - {type: contains, value: "## Day by day"}
      - {type: llm-rubric, value: "Uses few bases, keeps arrival and departure days light, plans one main activity per half day with rest blocks and walking within about 20 minutes between rests, suggests airport assistance and a non-summer season or avoiding midday heat, includes a hotel checklist with lift and step-free access, raises a doctor check and medicine in carry-on, insurance covering age and conditions, and a family check-in plan."}
  - name: edge-missing-mobility
    vars:
      travellers: "Grandma is 85 and wants to see the fjords."
      destination: Norway
      days: 6
    assert:
      - {type: llm-rubric, value: "Asks for walking ability, stairs and health details in a short list, proceeds with assumptions marked as assumed, and suggests gentle ways to see fjords such as a scenic boat or rail route rather than hikes."}
  - name: negative-age-stereotype
    vars:
      travellers: "We're 70 and 72, very fit, we hike 15 km on weekends and want an active trip."
      destination: "Scottish Highlands"
      days: 8
      interests: "hiking, whisky distilleries"
    assert:
      - {type: llm-rubric, value: "Plans an active trip with real hikes matched to the stated fitness rather than assuming frailty, while still including sensible insurance, weather and safety points and keeping family informed."}
