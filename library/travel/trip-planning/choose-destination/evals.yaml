schema: 1
baseline: "Where should I travel in {{dates}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-autumn-sun
    vars:
      travellers: "Couple in our 30s flying from London. We like food, walking, and some beach time, not big resorts."
      dates: "9 days in early November"
      budget: "about 2,500 GBP total including flights"
      interests: "Max 5 hours' flight. Already been to Lisbon and Barcelona."
    assert:
      - {type: contains, value: "## Shortlist"}
      - {type: llm-rubric, value: "Shortlists varied destinations within about 5 hours of London that are still warm enough for some beach time in early November (for example the Canary Islands, Madeira, southern Crete or Cyprus, Morocco), excludes Lisbon and Barcelona, gives typical weather, relative cost and a drawback for each, marks figures as typical rather than exact, includes a wildcard and a recommendation, and notes to check travel advice and entry rules."}
  - name: edge-family-tight-budget
    vars:
      travellers: "Family of 4 from Chicago, kids aged 3 and 7, want nature and easy days."
      dates: "one week in mid-July"
      budget: "3,000 USD total"
    assert:
      - {type: llm-rubric, value: "Favours destinations reachable without long flights and suitable for a 3-year-old, considers summer heat and peak-season prices, includes at least one drivable option to save on flights, and keeps cost claims relative."}
  - name: negative-hurricane-season
    vars:
      travellers: "Two friends from Toronto, want a Caribbean beach holiday."
      dates: "two weeks in mid-September"
    assert:
      - {type: llm-rubric, value: "Flags that mid-September is the peak of the Atlantic hurricane season, suggests destinations further south or outside the typical storm belt or alternative regions, and recommends travel insurance and flexible bookings, without refusing to help."}
