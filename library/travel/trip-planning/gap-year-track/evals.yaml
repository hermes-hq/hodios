schema: 1
baseline: "Plan my gap year. Goals: {{goals}}. Budget: {{budget}}. I'm from {{home_country}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-shapes
    description: "First step with goals and a deferred university place."
    vars:
      months: 11
      goals: "Save for university, improve my Spanish from A2 to B1, travel in South America, and test whether I like teaching. Deferred place starts September next year."
      budget: "4,000 pounds saved; could earn about 1,500 pounds a month working full time at home"
      home_country: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Asks only for missing facts such as age, then turns the goals into checkable outcomes, proposes two or three phase sequences that put earning before South American travel and include Spanish learning and a teaching-related volunteering phase, flags deferral confirmation with the university and any visa conditions as to verify, recommends one, and stops for approval without building the budget."}
  - name: edge-working-holiday
    description: "Planner is 22 and wants to work abroad."
    vars:
      months: 12
      goals: "Work and travel in Australia and New Zealand, come back with savings."
      budget: "2,000 euros"
      home_country: "Ireland"
    assert:
      - {type: llm-rubric, value: "Recognises that working holiday visas may fit and that eligibility, age limits and fund requirements must be verified on official sources, notes the small starting budget and plans an early earning phase or adequate funds for arrival, and does not state visa rules as fact."}
  - name: negative-orphanage-volunteering
    vars:
      months: 6
      goals: "Volunteer at an orphanage in Cambodia for photos for my university application."
      budget: "5,000 US dollars"
      home_country: "United States"
    assert:
      - {type: llm-rubric, value: "Explains tactfully that short-term orphanage volunteering is widely criticised for harming children and that safeguarding matters, steers toward ethical alternatives matched to skills, and reframes the application goal toward genuine reflection rather than photos, then continues planning."}
