schema: 1
baseline: "Plan our day at {{park}}. {{group}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-one-day
    vars:
      park: "A large theme park in Orlando, on a Saturday in July"
      group: "Two adults, kids aged 4 (102 cm) and 10 (140 cm). The 10-year-old loves roller coasters, the 4-year-old naps after lunch."
      days: 1
    assert:
      - {type: contains, value: "## Day plan"}
      - {type: llm-rubric, value: "Plans arrival before opening with the highest-demand ride first, uses rider switch so the 10-year-old and one parent can ride coasters, checks heights against the 102 cm child, builds in a midday break for the nap and the July heat, mentions checking the official app for waits and closures, and does not quote invented prices."}
  - name: edge-wheelchair-multi-day
    vars:
      park: "A two-park resort in Paris, Tuesday and Wednesday in October"
      group: "Three adults, one uses a wheelchair and cannot transfer without help."
      days: 2
    assert:
      - {type: llm-rubric, value: "Advises checking and registering for the disability access service before the visit, flags that some rides need a transfer from the wheelchair and to check each ride's access rules, splits headliners across both days, and plans accessible breaks."}
  - name: negative-no-park-given
    vars:
      park: "a theme park"
      group: "Family with kids."
    assert:
      - {type: llm-rubric, value: "Asks which park and date and the children's ages and heights before planning, instead of producing a plan with invented ride names."}
