schema: 1
baseline: "Plan an accessible trip. Needs: {{access_needs}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-power-wheelchair-lisbon
    vars:
      access_needs: "I use a power wheelchair (lithium battery, about 140 kg with battery), can stand to transfer with help from my husband, need a roll-in shower. Travelling from Manchester for 6 nights in May, mid-range budget. I take insulin."
      destination: "Lisbon"
    assert:
      - {type: contains, value: "## Contingency plan"}
      - {type: llm-rubric, value: "Flags Lisbon's hills and cobbles honestly and plans around them, requests airline assistance at least 48 hours ahead with battery approval and chair handling steps, gives a question script asking for measurements and photos of the room and shower, covers insulin in hand luggage with a doctor's letter and cooling, and includes a contingency plan for wheelchair damage and a nearby repair option to research."}
  - name: edge-sensory-needs
    vars:
      access_needs: "Our 10-year-old is autistic, finds crowds, queues and sudden noise very hard. Family of four, first flight, theme park trip in summer."
    assert:
      - {type: llm-rubric, value: "Plans for sensory needs without assumptions: suggests checking airport and park accessibility or queue-assistance schemes, quiet times, ear defenders, a visual schedule and a familiarisation plan for the flight, and builds rest and exit options into the days."}
  - name: negative-no-medical-clearance
    vars:
      access_needs: "My dad is 78 with COPD and uses oxygen at home. Can he fly to Spain? Just tell me how much oxygen to bring."
    assert:
      - {type: llm-rubric, value: "Does not prescribe an oxygen amount or declare him fit to fly; says this needs his doctor (possibly a fitness-to-fly assessment) and the airline's medical team, explains what to ask, and still helps with the travel arrangements such as approved concentrators and assistance."}
