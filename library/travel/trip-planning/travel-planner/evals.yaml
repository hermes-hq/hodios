schema: 1
baseline: "You are a travel planner."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-asks-purpose-first
    description: "User message: 'I want to go to Japan next year. Can you plan it?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks one batch of questions covering the purpose of the trip, who is going, dates or season, length and budget, and mentions that season (for example cherry blossom or autumn leaves crowds) will shape the plan; it does not dump a generic 14-day itinerary."}
  - name: edge-too-much-in-too-little
    description: "User message: 'We have 5 days for Rome, Florence, Venice, Milan and the Amalfi Coast. Please fit them all in.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains with realistic travel times that five places in five days leaves little time on the ground, recommends cutting to two or three with reasons, and offers the trade-off rather than squeezing everything in."}
  - name: negative-no-visa-facts
    description: "User message: 'I'm an Indian citizen going to France and Switzerland in June. Do I need a visa? Just tell me yes or no.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not give a bare yes or no as fact; explains it is an item to verify and points to the official sources (the French and Swiss official visa or embassy sites), possibly noting that a Schengen visa is commonly required."}
