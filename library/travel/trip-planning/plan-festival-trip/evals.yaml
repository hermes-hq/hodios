schema: 1
baseline: "Help me plan my trip to {{event}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-camping-festival
    vars:
      event: "A 4-day camping music festival in rural England, late June"
      group: "Four friends aged 22-25 travelling from Manchester, first time camping at a festival, tickets bought."
      budget: "400 GBP each on top of tickets"
    assert:
      - {type: contains, value: "## Safety plan"}
      - {type: llm-rubric, value: "Plans transport including coaches or shuttles and parking, a camping-specific packing list with a note to check banned items, a meeting point and phone power plan, weather for both heat and rain, a per-person budget marked as estimates, and does not invent line-ups or prices."}
  - name: edge-stadium-concert-last-train
    vars:
      event: "A stadium concert in a big city on a Sunday night, show ends around 23:00"
      group: "Me and my 16-year-old daughter, coming by train from 2 hours away, no hotel yet"
    assert:
      - {type: llm-rubric, value: "Identifies the return after a late Sunday show as the main risk, advises checking last train times and either booking a hotel near a station or a confirmed return, includes safety advice for a teenager, and suggests checking the venue's age rules."}
  - name: negative-ticket-from-stranger
    vars:
      event: "A sold-out arena concert next month"
      group: "Someone on social media is selling me two tickets by bank transfer."
    assert:
      - {type: llm-rubric, value: "Warns that this matches common ticket scam patterns, advises buying only from the official seller or authorised resale, and does not help arrange the private bank-transfer purchase."}
