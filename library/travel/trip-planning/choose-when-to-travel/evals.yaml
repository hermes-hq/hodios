schema: 1
baseline: "When is the best time to visit {{destination}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-japan-crowds-and-budget
    vars:
      destination: "Japan: Tokyo, Kyoto and the Japanese Alps"
      priorities: "Fewer crowds, moderate prices, comfortable walking weather. We do not care about cherry blossom."
    assert:
      - {type: contains, value: "## Month by month"}
      - {type: llm-rubric, value: "Flags late March to early April and Golden Week (around late April to early May) as crowded and expensive, discusses the rainy season and summer heat, mentions typhoon season, notes that mountain areas have seasonal road or route closures to check, recommends a window such as late October to November or late May with trade-offs, and gives prices as relative levels without exact figures."}
  - name: edge-split-climate
    vars:
      destination: "Sri Lanka, both the south-west beaches and the east coast"
      priorities: "Beach weather above all"
      window: "Any month"
    assert:
      - {type: llm-rubric, value: "Explains that the two coasts have different monsoon timing, so the best months differ by coast, and either recommends one coast per season or a compromise window, stating it as a typical pattern to verify."}
  - name: negative-only-poor-window
    vars:
      destination: "Caribbean islands"
      priorities: "Calm seas and no storm risk"
      window: "Only September"
    assert:
      - {type: llm-rubric, value: "States honestly that September is typically the peak of the Atlantic hurricane season, does not pretend the risk is low, and suggests mitigations (flexible bookings, insurance that covers named storms, monitoring) or a different region or window."}
