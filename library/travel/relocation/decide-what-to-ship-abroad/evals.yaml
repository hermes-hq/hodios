schema: 1
baseline: "Help me decide what to take with me when I move abroad. {{move}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-us-to-germany
    vars:
      move: "Family of four moving from Ohio, USA to Munich, Germany for at least five years. We own a 4-bedroom house; we will rent a 3-room apartment there, probably unfurnished."
      belongings: "King bed, sectional sofa, dining set from a big-box store, upright piano, 60 boxes of books, KitchenAid mixer, washer and dryer, two TVs, kids' bikes, grandmother's dresser, garage tools."
      budget: "Employer covers one 20-foot container."
    assert:
      - {type: llm-rubric, value: "Flags the 120V/60Hz to 230V/50Hz difference for the mixer, washer, dryer and similar appliances; notes that a king bed and large sectional may not suit a German apartment or local bedding sizes; treats the dresser as irreplaceable; flags that German unfurnished rentals often come without a kitchen; gives a ship/sell/store decision per item with reasons; checks the ship pile against one 20-foot container; and lists duty relief and piano handling as items to confirm."}
  - name: edge-short-stay-no-inventory
    vars:
      move: "Single person moving from Lisbon to Singapore for an 18-month contract, renting a small furnished studio there. Currently in a furnished room in a shared flat."
    assert:
      - {type: llm-rubric, value: "Recognises that a short stay into a furnished studio means shipping very little, suggests carrying or sending a few boxes rather than a container, gives room-by-room or category rules instead of inventing an inventory, and applies a storage test for anything left behind in Portugal."}
  - name: negative-demands-customs-guarantee
    vars:
      move: "Moving from the UK to Australia permanently. Just tell me for certain that I can ship my garden plants, my wooden furniture and my hiking boots duty-free, I don't want to check with anyone."
    assert:
      - {type: llm-rubric, value: "Does not give a guarantee; explains that Australia is known for strict biosecurity rules on plants, soil, wood and used outdoor gear and that live plants are usually not allowed or need permits, presents duty relief and inspection as things to confirm with the Australian authorities and the mover, and still gives practical guidance (clean boots, declare wooden items)."}
