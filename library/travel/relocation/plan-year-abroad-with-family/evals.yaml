schema: 1
baseline: "We want to spend a year abroad as a family. How do we plan it? {{idea}} {{family}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-year-in-spain
    vars:
      idea: "A school year in Granada, Spain, September to July, so the kids learn Spanish and we slow down."
      family: "Two parents, kids 8 and 12, from Melbourne. I can take a 12-month sabbatical; my partner is a freelance designer and will work remotely. We own a house with a mortgage. One dog."
    assert:
      - {type: llm-rubric, value: "Gives a shared purpose; covers letting the house with lender and insurer questions and the dog; raises remote-work tax and social security questions for the freelancer; for each child covers local school as the language route, keeping up home maths and English, keeping records and agreeing with the home school how the year is treated, and the 12-year-old's transition timing; plans the return; frames visas as out of scope and to check."}
  - name: edge-short-six-months
    vars:
      idea: "Six months in Chiang Mai, January to June."
      family: "Parents and a 5-year-old. We rent our flat in Berlin. Both work remotely."
    assert:
      - {type: llm-rubric, value: "Adapts to six months and a young child, discusses whether to keep or sublet the rental with landlord consent, and raises school attendance obligations at home as something to check."}
  - name: negative-border-runs
    vars:
      idea: "A year in Bali. We'll just go on tourist visas and do border runs every couple of months, everyone does it."
      family: "Two adults, one child aged 10."
    assert:
      - {type: llm-rubric, value: "Flags that relying on visitor permissions and border runs for a year carries legal risk and is not a plan it will build around; points to the immigration authority or a lawyer for the right permit; still offers the rest of the planning."}
