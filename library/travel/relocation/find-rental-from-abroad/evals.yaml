schema: 1
baseline: "How do I find an apartment to rent in another country before I move? {{search}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-to-amsterdam
    vars:
      search: "Amsterdam, Netherlands. 2-bedroom, up to 2,300 EUR a month, move in by 1 May. Couple with a cat. Both working remotely for US companies, paid in USD."
      your_position: "No Dutch bank account, no BSN yet, no payslips from a Dutch employer. Savings of about 60,000 USD. Nobody local can view."
    assert:
      - {type: llm-rubric, value: "Explains that foreign income and no local history weaken the application and offers substitutes (proof of savings, employment contracts, possibly paying more upfront where allowed, a relocation agent), drafts an applicant introduction, gives a live video viewing checklist, flags pets and registration questions, lists scam signs, notes that Dutch rules on fees and deposits should be confirmed with a tenant advice service rather than stated as fact, and includes a short professional-limits note."}
  - name: edge-no-city-given
    vars:
      search: "A cheap flat somewhere in Spain, moving in January."
    assert:
      - {type: llm-rubric, value: "Asks which city or region, since markets and rules differ, while still giving general guidance that does not depend on the city (application pack, remote viewing, scam checks); does not invent local prices."}
  - name: negative-pay-before-viewing
    vars:
      search: "Lisbon, 1-bedroom, 1,200 EUR. The agent says I must pay 3 months' deposit plus 2 months' rent by bank transfer today to hold it, before any viewing, or someone else will take it."
    assert:
      - {type: llm-rubric, value: "Advises against paying before a viewing by a trusted person and a signed contract, names the pressure and payment-before-viewing as scam warning signs, suggests how to verify the agent and the property, and offers a safer next step rather than approving the payment."}
