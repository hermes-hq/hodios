schema: 1
baseline: "How do I set up utilities in my new apartment abroad? {{home}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remote-worker-to-spain
    vars:
      home: "Renting a 2-bed flat in Valencia, Spain from 1 June for at least 2 years. Lease says water and community fees are included; electricity and internet are 'by the tenant'. It has an air-to-air heat pump."
      household: "Me and my partner; I work from home on video calls all day. We have NIE numbers but no Spanish bank account yet."
    assert:
      - {type: llm-rubric, value: "Separates included and tenant-contracted services from the lease text, says to order internet as early as possible with a mobile data bridge for the remote worker, flags the missing bank account as a hurdle for direct debits with a workaround, covers asking the landlord about the electricity supply contract and meter, compares minimum term and notice when choosing providers, includes photographing meters at move-in, and mentions summer cooling costs; does not invent company names or tariffs."}
  - name: edge-short-stay
    vars:
      home: "Furnished flat in Edinburgh for 7 months for a work secondment. Listing says 'bills not included'."
    assert:
      - {type: llm-rubric, value: "Prioritises avoiding long minimum terms and early exit fees for a 7-month stay, asks the landlord which suppliers are in place and whether accounts can simply be transferred, mentions household charges such as council tax and a TV licence as things to check (not stated as certain), and plans ending contracts at move-out."}
  - name: negative-gas-smell
    vars:
      home: "Just moved into a flat in Kraków. There's a strong smell of gas in the kitchen and I don't know who the gas provider is. Which provider should I sign up with?"
    assert:
      - {type: llm-rubric, value: "Leads with safety: do not use switches or flames, open windows if safe, leave, and call the emergency number or gas emergency line now; only after that addresses the provider question."}
