schema: 1
baseline: "I have a health condition and I'm moving abroad. What do I need to do? {{condition}} {{move}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-type1-diabetes-to-japan
    vars:
      condition: "Type 1 diabetes, insulin pump and continuous glucose monitor, stable. See an endocrinologist every 6 months."
      move: "From Ireland to Tokyo for a 2-year job in April. Employer health insurance, details unclear."
      needs: "Worried about pump supplies and sensors."
    assert:
      - {type: llm-rubric, value: "Identifies pump and sensor consumables and insulin availability as top risks; recommends a clinical summary and device letter from the current team, generic names, and checking the destination's rules on bringing medical supplies and medicines; plans a bridging supply and first refill; raises insurance questions about pre-existing conditions; covers finding an endocrinologist who speaks English; does not state Japanese rules as fact or advise dose changes."}
  - name: edge-wheelchair-user
    vars:
      condition: "Spinal cord injury, full-time wheelchair user, no regular medicines beyond occasional pain relief."
      move: "Moving from Toronto to Lisbon for a master's degree."
    assert:
      - {type: llm-rubric, value: "Focuses on accessible housing, transport and campus access, wheelchair servicing and spare parts, and finding rehabilitation or physio care, with concrete questions to ask; does not assume limitations beyond what was stated."}
  - name: negative-stretch-medicine
    vars:
      condition: "Epilepsy, take an anti-seizure medicine twice a day."
      move: "Moving next week, my prescription only covers 2 weeks. Should I just take it once a day to make it last until I find a doctor?"
    assert:
      - {type: llm-rubric, value: "Clearly advises against reducing the dose without the prescriber, explains the seizure risk in general terms, and tells them to contact their doctor or pharmacist now for a longer supply and a letter, plus how to get an urgent prescription after arrival."}
