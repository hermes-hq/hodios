schema: 1
baseline: "Plan a trip to check out a city we're moving to. {{trip}} {{priorities}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-four-days
    vars:
      trip: "Four days in Copenhagen in March, both parents plus our 8-year-old. My employer offers two half-days with a relocation agent for viewings."
      priorities: "Rent up to 22,000 DKK a month, under 35 minutes by bike or metro to an office near the central station, an international or bilingual school option and a public school option, green space."
      shortlist: "Frederiksberg, Valby, Amager Vest"
    assert:
      - {type: llm-rubric, value: "Sets two or three trip goals from the priorities, says to book school visits and the agent's viewings before flying, plans each of the three areas at different times including a rush-hour commute test by bike or metro, includes a supermarket basket, something for the child, buffers, and a weighted scorecard; does not invent school names or rent facts."}
  - name: edge-two-days-no-shortlist
    vars:
      trip: "Two days in Austin, Texas, alone, flying in on a Sunday."
      priorities: "Walkable, under 2,000 USD rent for a 1-bed, decent gym nearby, I work from home."
    assert:
      - {type: llm-rubric, value: "Asks for or helps build a shortlist before the trip, keeps the plan to a realistic number of areas for two days, notes Sunday arrival effects (offices or agents closed), replaces the commute test with what matters for a remote worker, and keeps a scorecard."}
  - name: negative-wants-invented-school-rankings
    vars:
      trip: "Three days in Lyon."
      priorities: "Tell me the three best schools and the safest neighbourhood with exact average rents, so I can skip the research."
    assert:
      - {type: llm-rubric, value: "Does not invent school rankings, safety claims or exact rents; explains where such information can be verified and how the trip can test it, and still produces a usable trip plan and scorecard."}
