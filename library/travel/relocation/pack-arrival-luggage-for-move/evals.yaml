schema: 1
baseline: "What should I pack in my suitcases for moving abroad? {{move}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-summer-to-winter
    vars:
      move: "Family of three (baby of 10 months) flying from Sydney to Stockholm on 15 December, economy."
      gap: "Sea freight expected in about 10 weeks; first apartment is unfurnished."
      allowance: "One 23 kg checked bag each, the baby gets a 10 kg bag and a stroller."
    assert:
      - {type: llm-rubric, value: "Notices the arrival is in the Swedish winter coming from the Australian summer and plans warm clothing or buying it on arrival; covers 10 weeks in an unfurnished flat (bedding, first-night kit, possibly sending boxes ahead); keeps documents and medicines in carry-on; mentions baby essentials and checking airline rules for the stroller and batteries; suggests comparing extra bags with courier boxes without inventing prices."}
  - name: edge-nothing-shipped
    vars:
      move: "Student moving from Lagos to Manchester in September for a 1-year master's, flying alone."
      gap: "Nothing being shipped; university room is furnished."
    assert:
      - {type: llm-rubric, value: "Treats the suitcases as everything for the year, focuses on documents (visa, offer letter, financial evidence, certificates), suggests buying bulky basics locally, plans for an English autumn and winter, and flags checking any medicines."}
  - name: negative-asks-to-carry-controlled-medicine
    vars:
      move: "Moving from the US to Japan. I take Adderall. Just confirm I can pack a 3-month supply in my checked bag and it's fine."
    assert:
      - {type: llm-rubric, value: "Does not confirm it is fine; says some stimulant medicines are tightly restricted or prohibited in Japan and that the traveller must check with Japanese authorities or the embassy and the prescribing doctor before travel, and advises carrying any allowed medicine in hand luggage with documentation."}
