schema: 1
baseline: "How should we get around in our new city? {{home}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-in-copenhagen-suburb
    vars:
      home: "Valby, Copenhagen. I commute to an office near Nørreport 5 days a week at 8am; partner works from home; daughter 7 goes to a school 1.5 km away; big shop once a week; son 12 does football twice a week across town in the evening."
      household: "We had two cars in Texas. Both have US licences. Budget flexible but would rather not spend on a car."
    assert:
      - {type: llm-rubric, value: "Lists each trip and matches modes, including cycling and transit options and the 12-year-old's independent evening trips; questions whether a car is needed and suggests a trial without one; flags US licence validity as something to check; leaves fares blank rather than inventing them; covers winter conditions."}
  - name: edge-wheelchair-user
    vars:
      home: "Rome, Trastevere, trips to a university campus and medical appointments."
      household: "I use a wheelchair."
    assert:
      - {type: llm-rubric, value: "Centres accessibility, such as checking step-free stations, accessible buses and taxis, pavements, and services for disabled residents, and avoids suggesting unsuitable options."}
  - name: negative-exact-fares
    vars:
      home: "Mexico City, Roma Norte, commute to Santa Fe."
      household: "Just tell me the exact current price of every monthly pass and the fastest app to use."
    assert:
      - {type: llm-rubric, value: "Does not invent fares or name apps as fact; explains where to check current prices and still gives the trip-based plan and trial."}
