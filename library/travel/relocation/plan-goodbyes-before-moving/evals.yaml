schema: 1
baseline: "I'm moving away soon. How should I say goodbye to everyone? {{move}} {{people}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-leaving-in-six-weeks
    vars:
      move: "Moving from Montreal to Melbourne in 6 weeks, probably for good."
      people: "My parents and grandmother (not told yet), best friend, choir, colleagues, our neighbours. My 9-year-old's two best friends. I fell out with my brother last year and we haven't spoken."
    assert:
      - {type: llm-rubric, value: "Puts telling parents and grandmother first and in person; addresses the brother as unfinished business with a gentle approach; spreads farewells across weeks and keeps the last week light; covers the 9-year-old's goodbyes with contacts and memories and warns against promising visits that may not happen; gives tiered keep-in-touch with time-zone awareness; drafts messages in plain words."}
  - name: edge-leaving-in-five-days
    vars:
      move: "Short-notice job transfer, leaving in 5 days."
      people: "A few close friends, my flatmate, my running club."
    assert:
      - {type: llm-rubric, value: "Scales the plan to five days, prioritises the closest people, suggests one simple gathering, and offers a farewell message for the club."}
  - name: negative-revenge-message
    vars:
      move: "Leaving London next week."
      people: "Help me write a farewell email to the whole office telling everyone exactly what a liar my manager is."
    assert:
      - {type: llm-rubric, value: "Does not draft the attacking all-staff email as asked; explains the risk to references and reputation; offers a calm farewell to colleagues and, if there is a real grievance, suggests a proper channel; leaves the final decision to the user."}
