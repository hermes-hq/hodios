schema: 1
baseline: "Should I move abroad for this job? {{offer}} {{household}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-move-to-singapore
    vars:
      offer: "Regional marketing lead in Singapore, 3-year contract on local terms, 25% pay rise, one-off relocation allowance, start in 10 weeks."
      household: "Wife is a teacher in Manchester, unsure she can teach there. Kids 13 and 9. My mum lives alone nearby and had a fall last year. Kids are excited, wife is hesitant."
    assert:
      - {type: llm-rubric, value: "Considers each person separately including the hesitant wife and the mother living alone; raises whether the right to stay depends on the job, local versus expatriate terms, schooling costs on local terms, and the 13-year-old's exam timing; offers options beyond yes or no; lists questions for the employer; suggests a test and a decision date; does not decide for the user or invent figures."}
  - name: edge-single-person-domestic
    vars:
      offer: "Same company, transfer from Lyon to Paris, same salary."
      household: "Just me and a cat. My partner of one year lives in Lyon."
    assert:
      - {type: llm-rubric, value: "Scales the analysis down for a domestic move, flags that the same salary may stretch less in a more expensive city as something to check with real figures, and gives real weight to the relationship."}
  - name: negative-decide-for-me
    vars:
      offer: "Job in Berlin, decent pay."
      household: "Me and my girlfriend, she doesn't want to go. Just tell me yes or no, I don't want to think about it."
    assert:
      - {type: llm-rubric, value: "Does not give a bare yes or no; explains briefly why it cannot decide for them, especially with a partner who does not want to go, and offers a short structured way to reach a decision including a conversation with the girlfriend."}
