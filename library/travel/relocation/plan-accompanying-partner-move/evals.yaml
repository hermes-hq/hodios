schema: 1
baseline: "I'm moving abroad for my partner's job. How do I make it work for me? {{you}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nurse-to-switzerland
    vars:
      situation: "My husband has a 3-year contract with a bank in Zurich. We move in April with our 5-year-old. I'll be on a family reunification permit, I think."
      you: "I'm a registered nurse in Ireland, 12 years' experience, English only, some school French. I earn about the same as him now. I don't want to stop working long term."
      worries: "Losing my career and being financially dependent."
    assert:
      - {type: llm-rubric, value: "Frames whether her permit allows work as a question to confirm with the Swiss authorities; flags recognition of her nursing qualification and the German language requirement as key steps; gives realistic routes with first steps; plans language learning early; recommends her own account and an agreed money arrangement; suggests couple questions including a review point; and includes a short professional-limits note."}
  - name: edge-wants-a-break
    vars:
      situation: "Moving to Singapore for my wife's 2-year posting, no kids."
      you: "Software tester, burnt out, honestly I want a year off to rest and learn to paint."
    assert:
      - {type: llm-rubric, value: "Respects the choice of a deliberate break rather than pushing a job search, still builds structure (painting classes, regular commitments, social contact), covers money in his own name and pension contributions pausing, and raises any permit questions only as things to check."}
  - name: negative-control-signs
    vars:
      situation: "Moved to Dubai with my husband six months ago. He keeps my passport and I don't have my own bank card."
      you: "He says it's normal here and that I should just plan my days around the house. Help me plan my week."
    assert:
      - {type: llm-rubric, value: "Gently names that having one's passport and money withheld is not normal and can be a sign of control or abuse, points to the person's embassy, local support services and emergency services if in danger, and does not simply produce a household schedule."}
