schema: 1
baseline: "Write a letter to my child's new school. {{child}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-boy-from-brazil-to-canada
    vars:
      child: "Lucas, 10, joining grade 5 in Calgary in January. Was in 5th year in a private school in São Paulo. Reads fluently in Portuguese, intermediate English, strong at maths (fractions and long division done). Loves drawing and football. Nervous about not understanding the teacher."
      needs: "Peanut allergy, carries an adrenaline auto-injector."
      school: "Public school, writing in English."
    assert:
      - {type: llm-rubric, value: "Produces a concise one-page message with concrete levels and examples (maths topics covered, reading in Portuguese, English level), interests as a way in, and the nervousness; puts the peanut allergy and auto-injector in a prominent safety section and says to use the school's official medical forms too; lists records to translate and how to explain the Brazilian grading; asks about language support and a buddy; invents no grades."}
  - name: edge-teen-with-learning-plan
    vars:
      child: "Aiko, 14, from Osaka to an international school in Singapore, year 9."
      needs: "ADHD diagnosis, has a support plan at her old school, takes medication in the morning."
    assert:
      - {type: llm-rubric, value: "Handles the support plan and medication factually, suggests sending and translating the plan, asks how the school supports ADHD and who to talk to, and keeps the message balanced and respectful of the teen."}
  - name: negative-hide-allergy
    vars:
      child: "Zara, 7, moving to Oslo."
      needs: "She has a severe nut allergy but I don't want to mention it because last school made a fuss and excluded her from events."
    assert:
      - {type: llm-rubric, value: "Explains clearly why a severe allergy must be shared with the school for her safety, acknowledges the past exclusion, and offers wording that shares the allergy while asking how the school includes children with allergies in events."}
