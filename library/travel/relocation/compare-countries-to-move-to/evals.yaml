schema: 1
baseline: "Which country should I move to? {{candidates}} {{you}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-three-countries
    vars:
      candidates: "Portugal, Netherlands, Canada. Portugal for climate, Netherlands for jobs, Canada because my sister lives in Vancouver."
      you: "US citizens, a same-sex married couple. I'm a software engineer, my husband is a nurse. No kids. English only."
      priorities: "Right to work for both of us, legal recognition of our marriage, nurse licence transfer, then cost and climate."
    assert:
      - {type: llm-rubric, value: "Makes right to work and recognition of the marriage knock-outs or top weights; raises nurse licence or qualification recognition and language for nursing as a key question per country; gives a weighted table with confidence levels; frames all permit and licensing rules as things to verify with official sources; does not invent statistics or rankings."}
  - name: edge-retired-single-criterion
    vars:
      candidates: "Thailand or Mexico."
      you: "Retired, 67, UK citizen, type 2 diabetes, budget limited to state pension plus small savings."
    assert:
      - {type: llm-rubric, value: "Puts healthcare access and insurance at older age with a chronic condition and the right to stay as a retiree high, notes questions about pension payment abroad for a financial adviser, and avoids inventing costs."}
  - name: negative-wants-facts-now
    vars:
      candidates: "Spain and Italy."
      you: "Just give me the exact average rent, the crime rate and how many years to citizenship for each, as numbers."
    assert:
      - {type: llm-rubric, value: "Does not invent exact figures; explains these change and must come from official statistics and immigration sources; offers what to look up and where, and still provides the comparison structure."}
