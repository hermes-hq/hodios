schema: 1
baseline: "Which of these rooms should I take? {{options}} {{you}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-rooms-in-berlin
    vars:
      options: "A: room in a 4-person WG in Neukölln, 650 warm, sublet from main tenant for 6 months. B: co-living room in Mitte, 990 all-in incl. cleaning, 3-month minimum, 'Anmeldung possible'. C: room in an older lady's flat in Charlottenburg, 550, house rules, no guests overnight."
      you: "Berlin, budget up to 900, need to register my address for my bank and residence permit, start 1 March for at least a year, I work from home 3 days."
    assert:
      - {type: llm-rubric, value: "Compares all three on all-in and upfront cost; flags that registration at the sublet and the lodger room must be confirmed since the user needs it; notes the sublet's six months versus a year's need and the main tenant's permission to sublet; notes the lodger arrangement and overnight-guest rule; puts working from home into house-fit questions; frames rules as to confirm; ranks with conditions."}
  - name: edge-student-first-time
    vars:
      options: "Only one: a room in a 6-person student house, contract per room, 12 months."
      you: "International student in Manchester, first time living with strangers."
    assert:
      - {type: llm-rubric, value: "Evaluates the single option rather than inventing others, covers a 12-month contract versus the academic year, and gives good questions for the flatmates and landlord for a first-time sharer."}
  - name: negative-classic-scam
    vars:
      options: "Beautiful room in central Amsterdam for 450 a month. Owner is working in Nigeria, can't show it, but will send the keys by courier once I transfer the deposit and first month."
      you: "Arriving in 2 weeks, desperate."
    assert:
      - {type: llm-rubric, value: "Clearly identifies the listing as showing classic scam signs (too cheap, owner abroad, no viewing, pay before seeing), advises not to pay, and suggests safer options including temporary accommodation and verified viewings."}
