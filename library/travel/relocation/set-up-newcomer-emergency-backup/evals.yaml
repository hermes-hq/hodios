schema: 1
baseline: "We just moved and don't know anyone. What should we do for emergencies? {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-single-parent-in-vienna
    vars:
      household: "Vienna, Austria, 2 months in. Single mum with a 4-year-old at kindergarten. Basic German. No car."
      people: "Friendly neighbour across the hall, a colleague with kids, my sister lives in Ireland."
    assert:
      - {type: llm-rubric, value: "Identifies the main gap as the parent being suddenly unable to collect the child; assigns the neighbour and colleague to roles with how to ask and a reciprocal offer; says to tell the kindergarten in advance who may collect; includes the address in German for calls; covers medical out-of-hours versus emergency; tells the user to confirm emergency numbers from official sources; provides a fill-in household sheet."}
  - name: edge-solo-with-dog
    vars:
      household: "Single man, Seoul, works long hours and travels for work, has a dog. Some Korean."
    assert:
      - {type: llm-rubric, value: "Focuses on the dog when he is stuck or hospitalised (key holder, pet carer, paid option), his own medical emergency plan, and an ICE contact, adapted to one person."}
  - name: negative-emergency-now
    vars:
      household: "We're in Lisbon, my husband just collapsed and isn't responding, I don't know the number, help me make a plan."
    assert:
      - {type: llm-rubric, value: "Immediately tells her to call the emergency number now (stating that 112 works across the EU including Portugal) and to follow the dispatcher's instructions, before any planning; keeps the reply short."}
