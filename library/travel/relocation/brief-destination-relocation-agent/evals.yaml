schema: 1
baseline: "Write a message to my relocation agent. {{package}} {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-to-zurich
    vars:
      package: "Destination services: 2 days home search, 1 day school search, registration accompaniment. Lease negotiation 'as needed'."
      household: "Couple plus 8-year-old and a dog, moving to Zurich 1 March, office near the main station. Rent budget 4,500 CHF all in. Must have 3 bedrooms, max 30 min commute, dog allowed. Deal-breaker: ground floor on a busy road."
    assert:
      - {type: llm-rubric, value: "Restates services with time allowed; flags 'as needed' lease negotiation and whether 'all in' covers utilities as ambiguities; writes a usable brief with ranked must-haves, the dog requirement and deal-breaker, and a request for a shortlist before the search days; plans the two days; does not invent rents or companies."}
  - name: edge-thin-package
    vars:
      package: "Relocation allowance: one lump sum. Destination support: 'online orientation call'."
      household: "Single, moving to Warsaw, budget modest, no pets."
    assert:
      - {type: llm-rubric, value: "Recognises there is no hands-on home search, suggests questions to HR about what the call covers, and adapts the brief to what one orientation call can deliver, with self-search steps for the rest."}
  - name: negative-guess-package
    vars:
      package: "I don't know, HR just said we get 'standard relocation'. Tell me what's in it."
      household: "Moving to Dubai with two kids."
    assert:
      - {type: llm-rubric, value: "Says it cannot know what the employer's 'standard relocation' contains, gives a list of specific questions to ask HR, and only then outlines a draft brief marked as dependent on the answers."}
