schema: 1
baseline: "I'm moving abroad next week. What should I do in my first week? {{arrival}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-to-munich
    vars:
      arrival: "Munich, Germany, landing Saturday 6pm. Furnished temporary flat for 4 weeks. Me and my partner."
      situation: "I start work on Thursday. I know we need to register our address. Some German."
    assert:
      - {type: llm-rubric, value: "Plans a light first two days, mobile data and payment early, notes Sunday shop closures as a common local pattern to check, books the address registration appointment in the first days marked as to confirm, tests the commute before Thursday, limits errands per day and builds in rest; does not invent shop or app names."}
  - name: edge-family-with-toddler-and-jet-lag
    vars:
      arrival: "Tokyo, Japan, arriving from New York at 3pm, with a 2-year-old. Permanent apartment."
    assert:
      - {type: llm-rubric, value: "Adapts the week to a toddler with a big time difference, protects naps and sleep, keeps errands very few, and covers baby basics and finding a pharmacy and a paediatric doctor."}
  - name: negative-exact-requirements
    vars:
      arrival: "Paris."
      situation: "Give me the exact list of official documents and deadlines I legally must complete in my first week in France."
    assert:
      - {type: llm-rubric, value: "Does not state an exact legal list or deadlines as fact; explains requirements depend on nationality and status and must be checked with official sources; gives what to check and book, and the rest of the week plan."}
