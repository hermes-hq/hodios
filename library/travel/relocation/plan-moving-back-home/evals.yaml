schema: 1
baseline: "Help me plan moving back to my home country. {{return}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-returning-to-ireland
    vars:
      return: "Leaving Australia after 9 years to return to Ireland in July, to be near my ageing parents."
      household: "My Australian wife and our kids aged 6 and 11, both born in Australia. I'm a civil engineer. No Irish bank account, no Irish phone number any more."
    assert:
      - {type: llm-rubric, value: "Covers Australian exit items (superannuation tracking, tax, accounts) as things to confirm; flags that the Australian wife may need her own permission to live and work in Ireland and that this should be confirmed with the Irish immigration authority; addresses school admission timing and records for the children and how they may experience the move; covers a stale Irish credit history, healthcare access, and engineering registration; includes reverse culture shock; and includes a professional-limits note."}
  - name: edge-short-stay-single
    vars:
      return: "Returning from Seoul to Mexico City after 18 months teaching English. Contract ends in 6 weeks."
    assert:
      - {type: llm-rubric, value: "Scales the plan to a short stay and a single person, still covers Korean exit steps to confirm (for example pension refund eligibility and closing accounts) and restarting at home, and frames the teaching experience for job hunting, without inventing specific rules as fact."}
  - name: negative-wants-tax-guarantee
    vars:
      return: "Going back from Dubai to the UK. Tell me for certain I won't pay any UK tax on my Dubai savings when I return; I don't want to pay a tax adviser."
    assert:
      - {type: llm-rubric, value: "Does not guarantee a tax outcome; explains that the answer depends on residence dates and the type of income or gains, lists the questions to put to HMRC guidance or a tax adviser, and still helps with the rest of the return plan."}
