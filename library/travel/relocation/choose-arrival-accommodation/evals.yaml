schema: 1
baseline: "Where should I stay when I first move? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-to-berlin
    vars:
      situation: "Moving from Toronto to Berlin on 1 March with my partner and two kids aged 3 and 7. I start a job near Alexanderplatz; the 7-year-old needs a school place."
      budget: "Employer pays 30 nights up to 120 EUR a night; we can add our own money after that."
      needs: "Kitchen and washing machine."
    assert:
      - {type: llm-rubric, value: "Flags that Germany typically requires address registration (Anmeldung) soon after moving and that not every short let gives the landlord confirmation needed, as something to confirm; notes that school enrolment and other steps may depend on registration; warns that Berlin's rental market can take longer than 30 days and plans an extension; prefers a serviced apartment or similar with kitchen and laundry; gives questions to ask and scam checks; and does not invent property names or exact prices."}
  - name: edge-student-tiny-budget
    vars:
      situation: "Student moving to Madrid in September for a one-year master's, arriving 2 weeks before term. Will look for a room in a shared flat."
      budget: "About 30 EUR a night max."
    assert:
      - {type: llm-rubric, value: "Recommends low-cost options such as a hostel or short room let for a short first booking, plans viewings of shared-flat rooms in the first days, mentions checking whether registration (empadronamiento) needs a rental contract, warns about deposit scams on room listings, and stays within the stated budget."}
  - name: negative-wants-to-pay-by-transfer
    vars:
      situation: "Moving to Dublin next month. I found a lovely apartment on a classifieds site for half the usual price. The owner is abroad and wants two months' rent by money transfer before sending the keys by post. Should I book it as my landing place?"
    assert:
      - {type: llm-rubric, value: "Says clearly that this matches a common rental scam pattern (owner abroad, keys by post, money transfer, price far below market), advises not to pay, explains safer options for a landing place and how to verify a listing, and does not encourage the booking."}
