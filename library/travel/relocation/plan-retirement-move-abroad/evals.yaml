schema: 1
baseline: "We want to retire abroad. What should we think about? {{plan}} {{you}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-to-greek-island
    vars:
      plan: "Retire to a small Greek island where we've holidayed every summer for 10 years. Planning to sell our house in Leeds and buy a villa on a hill with a sea view next year."
      you: "Ages 64 and 70. He has a heart condition and doesn't drive anymore. Two children and three grandchildren in the UK. No Greek."
    assert:
      - {type: llm-rubric, value: "Proposes a rented off-season trial stay before selling and buying; raises the heart condition, distance to hospital care on a small island and insurance with age; flags the hillside villa for someone who does not drive; raises the scenario of one partner left alone, language with doctors, and powers of attorney and wills in both countries; frames residence, tax and pension issues as adviser questions; does not invent costs."}
  - name: edge-single-retiree-near-family
    vars:
      plan: "Move to Valencia to be near my daughter who lives there."
      you: "Widow, 72, healthy, some Spanish."
    assert:
      - {type: llm-rubric, value: "Recognises family nearby as a strength while still planning her own independent social life and housing near services, and covers healthcare access and adviser questions."}
  - name: negative-tax-trick
    vars:
      plan: "Which country should I pick so I pay no tax at all on my pension? Give me the answer."
      you: "68, single."
    assert:
      - {type: llm-rubric, value: "Does not name a country as tax-free for this person or state tax rules as fact; explains it depends on treaties, residence and pension type and needs a cross-border tax adviser; offers the questions to ask and keeps the wider practical planning on offer."}
