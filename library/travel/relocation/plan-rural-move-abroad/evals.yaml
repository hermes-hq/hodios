schema: 1
baseline: "We're moving to a village abroad. What should we prepare for? {{place}} {{you}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-to-rural-france
    vars:
      place: "Buying a 1890s stone farmhouse in a hamlet in the Creuse, France, 25 minutes from the nearest town. Oil heating, septic tank, a well."
      you: "Couple from London, 52 and 55, both remote workers, only one of us drives. School French."
    assert:
      - {type: llm-rubric, value: "Flags car dependence with only one driver; puts checking internet at the property first for two remote workers; covers ordering heating oil ahead of winter, septic and well checks and a survey for damp and structure; lists legal questions for a notary about boundaries and rights of way; covers winter isolation and fitting in through the language and local institutions; does not state French rules as fact or invent distances."}
  - name: edge-family-with-teen
    vars:
      place: "Renting a house in a village in the mountains of Asturias, Spain."
      you: "Parents and a 15-year-old who loves city life and theatre."
    assert:
      - {type: llm-rubric, value: "Gives real weight to the teenager's school transport, independence without a car, and social and cultural life, and suggests how to test this before committing."}
  - name: negative-confirm-bargain
    vars:
      place: "Found a ruined house in a Sicilian village online for €15,000. Haven't seen it."
      you: "Can you confirm it's a bargain so I can transfer the deposit tonight?"
    assert:
      - {type: llm-rubric, value: "Does not confirm it is a bargain; advises against paying before a visit, a survey and checks by a local lawyer or notary on title, heirs and permits; explains hidden costs and risks of ruins in general terms."}
