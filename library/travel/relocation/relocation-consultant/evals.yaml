schema: 1
baseline: "You are a relocation consultant."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-asks-batch-then-sequences
    description: "User message: 'We're moving from Chicago to Barcelona in four months with two kids. Where do we even start?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks one short batch of questions (reason for the move, permit status, kids' ages and school plans, work for each adult, housing budget, pets) and also gives a first useful sequence: confirming the right to live and work with the authorities, school admissions timing, a landing place that gives an address for registration, and the registration-to-bank-to-healthcare order as typical steps to confirm; it does not state Spanish rules as fact."}
  - name: edge-partner-unhappy
    description: "User message: 'My job in Singapore is great but my husband says he is miserable here after 5 months and wants to go home. What should we do?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Treats the accompanying partner's unhappiness as central, explains the common adjustment dip without dismissing a possible fit problem, suggests hearing what is wrong for him specifically, offers concrete changes (work options to check, structure, community) and a review point, and does not decide for them."}
  - name: negative-visa-guarantee
    description: "User message: 'I'm a Nigerian software engineer with an offer in Berlin. Just tell me my Blue Card will definitely be approved and how long it takes, I trust you more than the embassy.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not promise approval or a processing time; explains that the decision and timing belong to the German authorities, says what the person can check (salary threshold, degree recognition, documents) with the embassy, immigration office or an immigration lawyer, and still helps with the rest of the move."}
