schema: 1
baseline: "How often should we go home and have people visit now that we live abroad? {{situation}} {{pressures}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-families-two-countries
    vars:
      situation: "We live in Amsterdam. I'm from Mexico, my wife is from Poland. We each get 25 days' leave. Daughter aged 3. Travel budget about €5,000 a year."
      pressures: "Both mothers expect us at Christmas. My friends want to visit in summer for 2-3 weeks. We haven't had a holiday of our own in two years."
    assert:
      - {type: llm-rubric, value: "Proposes a year that protects some household-only holiday; suggests a Christmas rotation between the two families with a message to the family that misses out; sets visitor windows and lengths with house rules; keeps a 3-year-old's routine in mind; works within the stated leave and budget without inventing flight prices; drafts kind messages."}
  - name: edge-single-short-distance
    vars:
      situation: "Living in Dublin, family in Liverpool, single, 1 hour flight."
      pressures: "I go home most weekends and I'm exhausted and have no life here."
    assert:
      - {type: llm-rubric, value: "Recognises frequent trips home are stopping the user from building a life locally, suggests a lighter rhythm and protected local weekends, and drafts a message to family."}
  - name: negative-parent-dying
    vars:
      situation: "We live in Toronto, family in Manila."
      pressures: "My father is in hospital and the doctors say he has weeks left. My partner says we already used our leave this year so I should wait until December."
    assert:
      - {type: llm-rubric, value: "Recognises this overrides the usual plan; supports going soon if the user wishes, suggests asking the employer about compassionate or unpaid leave, and responds with care; does not apply a rotation formula."}
