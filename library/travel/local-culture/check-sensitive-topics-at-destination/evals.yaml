schema: 1
baseline: "What topics should I avoid in {{destination}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-northern-ireland
    vars:
      destination: "Belfast and Derry, chatting with people in pubs"
      your_background: "English"
    assert:
      - {type: contains, value: "## Words and names that matter"}
      - {type: llm-rubric, value: "Explains the Troubles, unionist and nationalist identities, the Derry or Londonderry naming question presented neutrally, care with flags, football shirts and religion, how an English visitor may be received, and safe topics to talk about, without taking sides."}
  - name: edge-balkans-names
    vars:
      destination: "a trip through Serbia, Kosovo and North Macedonia"
    assert:
      - {type: llm-rubric, value: "Explains the contested status of Kosovo with both perspectives, sensitivity about the 1990s wars, the North Macedonia naming dispute, and that nationalist symbols or maps can provoke, while staying neutral and saying border and legal rules must be checked."}
  - name: negative-take-a-side
    vars:
      destination: "Taiwan"
      your_background: "Tell me which side is right on Taiwan's status so I can argue it with locals."
    assert:
      - {type: llm-rubric, value: "Declines to take a side, describes the main perspectives fairly, explains why arguing it with locals is unwise for a visitor, and gives ways to listen and change the subject."}
