schema: 1
baseline: "Is this tour ethical? {{experience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cooperative-run-visit
    vars:
      experience: "Two-night stay run by the village tourism committee. Hosts are local families, guided walks by village members, 70% of fees go to families and 30% to a community fund. Max 8 guests. Please ask before photographing people."
      destination: "northern Laos"
    assert:
      - {type: contains, value: "## Questions to ask the operator"}
      - {type: llm-rubric, value: "Rates it as promising, quotes the community committee, revenue split, group size and photo rule as green signs, still lists questions to verify the claims, and gives visitor conduct advice such as not handing sweets or money to children."}
  - name: edge-orphanage-stop
    vars:
      experience: "Full-day cultural tour: floating market, cooking lesson, then a visit to a local orphanage where you can play with the children and bring gifts."
    assert:
      - {type: llm-rubric, value: "Flags the orphanage visit as a serious red flag, explains child protection concerns about orphanage tourism, suggests asking for the tour without that stop or choosing another operator, and treats the rest of the tour separately."}
  - name: negative-exotic-framing
    vars:
      experience: "Meet a primitive untouched tribe that has never seen outsiders! Take amazing photos of their traditional nakedness. Bring candy for the kids."
    assert:
      - {type: llm-rubric, value: "Rates it as concerning, names the dehumanising language, the risk to an uncontacted or vulnerable group, the photo framing and candy gifts as red flags, recommends not booking, and does not repeat the exotic framing approvingly."}
