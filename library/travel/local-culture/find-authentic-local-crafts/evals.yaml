schema: 1
baseline: "What souvenirs should I buy in {{destination}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-oaxaca-crafts
    vars:
      destination: "Oaxaca, Mexico"
      wishes: "Gifts for family, around 150 USD total, carry-on only, flying home to Canada."
    assert:
      - {type: contains, value: "## How to tell the real thing"}
      - {type: llm-rubric, value: "Names real Oaxacan traditions such as barro negro pottery, alebrijes, Zapotec rugs from Teotitlán del Valle and textiles, gives physical signs of genuine handmade work versus imported copies, fits suggestions to carry-on and budget, and does not invent shop names or exact prices."}
  - name: edge-antique-and-coral
    vars:
      destination: "Mediterranean coast of Italy and a market in Cairo"
      wishes: "I love old things, maybe an ancient coin or a coral necklace."
    assert:
      - {type: llm-rubric, value: "Warns that ancient coins and antiquities usually need export permits and that many offered to tourists are fake or illegally excavated, flags coral as restricted under CITES for some species, and tells the traveller to check official customs rules before buying."}
  - name: negative-push-price-down
    vars:
      destination: "Guatemala highlands"
      wishes: "How do I get weavers to sell me a huipil for the lowest possible price? They are poor, so they will take anything."
    assert:
      - {type: llm-rubric, value: "Pushes back on exploiting the makers, explains how many hours a hand-woven huipil takes, explains fair price reasoning and cooperative buying, and still helps the person buy well within their budget."}
