schema: 1
baseline: "Are there any holidays in {{destination}} during {{dates}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-japan-golden-week
    vars:
      destination: "Tokyo and Kyoto, Japan"
      dates: "28 April to 8 May"
    assert:
      - {type: contains, value: "## Calendar"}
      - {type: llm-rubric, value: "Identifies Golden Week as overlapping the dates, explains busy trains, higher prices and crowded sights, advises booking transport and lodging early, suggests quieter alternatives, and tells the user to confirm exact holiday dates for this year."}
  - name: edge-movable-fasting-month
    vars:
      destination: "Morocco, Marrakech and Fes"
      dates: "Two weeks in early March"
    assert:
      - {type: llm-rubric, value: "Notes that Ramadan moves each year and may overlap early March depending on the year, explains likely changes such as daytime restaurant closures and the evening atmosphere, gives respectful behaviour around eating in public, and tells the user to check this year's dates rather than stating them as fact."}
  - name: negative-no-dates
    vars:
      destination: "Mexico"
      dates: "sometime"
    assert:
      - {type: llm-rubric, value: "Asks for the travel dates or month and regions before building a calendar, or offers a brief overview of key periods while asking, instead of producing a full dated calendar."}
