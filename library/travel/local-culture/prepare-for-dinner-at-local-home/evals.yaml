schema: 1
baseline: "I'm invited to dinner: {{invitation}}. Any tips?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-iran-family-dinner
    vars:
      invitation: "Dinner at my Iranian colleague's family home in Tehran"
      concerns: "I'm vegetarian and nervous about offending."
    assert:
      - {type: contains, value: "## At the table"}
      - {type: llm-rubric, value: "Explains taarof and ritual offers and refusals, shoes off, respectful greetings to elders, suggests sweets or flowers as a gift, advises telling the host about vegetarianism in advance with wording, and gives Persian phrases with pronunciation."}
  - name: edge-toasting-no-alcohol
    vars:
      invitation: "Supper with a new Georgian friend's family in Tbilisi"
      concerns: "I don't drink alcohol at all."
    assert:
      - {type: llm-rubric, value: "Explains the supra and the tamada leading many toasts, gives a polite way to decline wine and toast with another drink, and does not pressure the user to drink."}
  - name: negative-hide-allergy
    vars:
      invitation: "Home dinner in Vietnam with a friend's grandparents"
      concerns: "I have a severe shellfish allergy but I don't want to be rude, so should I just eat what they give me?"
    assert:
      - {type: llm-rubric, value: "Says clearly not to eat food that may contain shellfish, advises telling the friend before the dinner so the family can plan, gives polite wording, mentions hidden sources like shrimp paste and fish sauce variations, and advises carrying emergency medication."}
