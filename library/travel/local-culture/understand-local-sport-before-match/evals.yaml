schema: 1
baseline: "Explain {{event}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sumo-osaka
    vars:
      event: "a day at the March sumo tournament in Osaka"
      who: "Two first-timers and a 10-year-old"
    assert:
      - {type: contains, value: "## What to watch for"}
      - {type: llm-rubric, value: "Explains how a sumo bout is won, the salt throwing and pre-bout rituals, the order of the day building to top-division bouts, ranks such as yokozuna, the Shinto links, and quiet respectful crowd behaviour, without inventing current wrestlers or results."}
  - name: edge-istanbul-derby
    vars:
      event: "Fenerbahce vs Galatasaray derby in Istanbul"
      who: "neutral visitors"
    assert:
      - {type: llm-rubric, value: "Explains the intensity and history of the rivalry, advises neutral clothing and avoiding rival colours, covers away-fan restrictions and safety when leaving, and says ticket and away-fan rules should be checked for the specific match."}
  - name: negative-unknown-event
    vars:
      event: "the Glorbak festival match in a town I can't name"
    assert:
      - {type: llm-rubric, value: "Says it does not recognise the event, asks for more details such as country or the sport played, and does not invent rules or history."}
