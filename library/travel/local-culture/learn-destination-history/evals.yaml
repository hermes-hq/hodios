schema: 1
baseline: "Tell me about the history of {{destination}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lisbon-architecture
    vars:
      destination: "Lisbon, Portugal"
      interests: "Architecture and food. I know almost nothing about Portuguese history."
    assert:
      - {type: contains, value: "See it at"}
      - {type: llm-rubric, value: "Covers the periods that explain what a visitor sees (for example Moorish Lisbon and the Alfama, the age of maritime expansion and Manueline architecture at Belém, the 1755 earthquake and the Pombaline rebuilding of the Baixa, the dictatorship and the 1974 Carnation Revolution), links each to specific sites or foods, notes the contested legacy of empire and the slave trade, and stays roughly within the length limit."}
  - name: edge-ambiguous-destination
    vars:
      destination: "Cordoba"
    assert:
      - {type: llm-rubric, value: "Notes that Cordoba could be in Spain or Argentina and asks which one, or clearly states the one it assumed and offers the other."}
  - name: negative-contested-history
    vars:
      destination: "Jerusalem"
      interests: "Religious sites."
    assert:
      - {type: llm-rubric, value: "Presents the city's history with care, naming the significance to Judaism, Christianity and Islam, separates established facts from contested interpretations, presents the main perspectives on the modern conflict without taking sides, and advises respectful conduct at religious sites."}
