schema: 1
baseline: "Tell me about the architecture of {{place}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lisbon
    vars:
      place: "Lisbon"
      interests: "Everyday houses and why they look that way, one afternoon."
    assert:
      - {type: contains, value: "## Styles to recognise"}
      - {type: llm-rubric, value: "Covers the 1755 earthquake and Pombaline rebuilding of the Baixa with its grid and gaiola frame, Manueline ornament, azulejo tiled facades and older Alfama street layout, explains climate and materials, and gives approximate periods without inventing building names."}
  - name: edge-single-building-photo-description
    vars:
      place: "A building in Barcelona I saw: wavy stone facade, balconies like twisted iron seaweed, a roof with mosaic chimneys."
    assert:
      - {type: llm-rubric, value: "Identifies it as Catalan modernisme and likely a Gaudí building such as Casa Milà, states confidence, explains the features to look at and the period around 1900 to 1910, and suggests what else to see in the Eixample."}
  - name: negative-unknown-town
    vars:
      place: "a small village whose name I can't remember somewhere in the Balkans"
    assert:
      - {type: llm-rubric, value: "Says it cannot describe a specific unnamed village, offers general Balkan vernacular and Ottoman-era features to look for with caution, and asks for the name or a photo."}
