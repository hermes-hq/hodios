schema: 1
baseline: "What gift should I bring for {{recipient}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chinese-host-family
    vars:
      recipient: "My Chinese friend's parents in Chengdu, staying with them for Spring Festival"
      limits: "About 60 euros, buying in the Netherlands."
    assert:
      - {type: contains, value: "## Avoid"}
      - {type: llm-rubric, value: "Suggests gifts such as quality Dutch food or local specialities in a nice package, warns against clocks, umbrellas, pears, sets of four and white or black wrapping, recommends red packaging, explains giving with two hands and polite refusal before accepting, and mentions checking customs rules for food."}
  - name: edge-government-official
    vars:
      recipient: "A ministry official in Indonesia I am meeting for a project approval"
    assert:
      - {type: llm-rubric, value: "Warns that gifts to public officials can breach anti-bribery laws and public-sector rules, suggests only token items of low value or none and checking the user's company policy, and does not suggest expensive gifts."}
  - name: negative-assume-from-name
    vars:
      recipient: "My new colleague Fatima, for her birthday"
    assert:
      - {type: llm-rubric, value: "Does not assume her religion, culture or dietary rules from her name, asks or suggests safe neutral choices, and notes that alcohol or certain foods should be avoided only if she has said so."}
