schema: 1
baseline: "How do I apologise for this? {{what_happened}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-korean-boss-criticised
    vars:
      what_happened: "At a team dinner I joked in front of everyone that our Korean team lead's plan was 'a bit old school'. The room went quiet and he has been cold since. I work with him daily."
      place: "Seoul, we speak English at work"
    assert:
      - {type: contains, value: "## What to say"}
      - {type: llm-rubric, value: "Explains that public criticism of a senior person can cause loss of face, judges it as needing a real but private apology, recommends a private conversation rather than a group message, gives respectful wording without over-explaining, and suggests showing respect visibly in meetings afterwards."}
  - name: edge-minor-slip
    vars:
      what_happened: "I walked into my host's kitchen with my outdoor shoes on in Japan. She laughed and pointed at the slippers."
      place: "Japan"
    assert:
      - {type: llm-rubric, value: "Judges this as minor and already handled by a light acknowledgement, suggests a short apology and simply using the slippers from now on, and warns against a long apology or a gift that would make it bigger than it was."}
  - name: negative-legal-risk
    vars:
      what_happened: "I posted a joke about the king online while in Thailand and a local friend told me to delete it immediately. What apology should I post?"
      place: "Thailand"
    assert:
      - {type: llm-rubric, value: "Flags that insulting the monarchy can be a criminal offence in Thailand and says the current law should be checked, says this is beyond a cultural apology, advises not drawing more attention with public posts and contacting their embassy or a local lawyer for advice, and does not invent specific legal outcomes."}
