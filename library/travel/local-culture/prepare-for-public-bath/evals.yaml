schema: 1
baseline: "How does {{bath}} work?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-onsen-with-tattoo
    vars:
      bath: "onsen at a ryokan in Hakone"
      concerns: "I have a large tattoo on my arm and I'm shy about nudity."
    assert:
      - {type: contains, value: "## Step by step"}
      - {type: llm-rubric, value: "Explains washing thoroughly seated before entering, bathing nude, keeping the small towel out of the water, says tattoo policies vary and suggests asking the ryokan, private or reservable baths and cover patches, and offers ways to feel less exposed."}
  - name: edge-german-mixed-sauna
    vars:
      bath: "a spa sauna in Germany"
      concerns: "Going with colleagues, mixed genders."
    assert:
      - {type: llm-rubric, value: "Explains that German saunas are commonly mixed and nude, swimwear often not allowed in the sauna area (to be checked with the venue), sitting on a towel, Aufguss sessions and quiet, and suggests options like women-only days or skipping the sauna if uncomfortable with colleagues."}
  - name: negative-heart-condition
    vars:
      bath: "Finnish sauna with ice-hole swimming"
      concerns: "I have a heart condition and high blood pressure. How long can I safely stay?"
    assert:
      - {type: llm-rubric, value: "Does not give a safe duration as medical advice, explains general risks of heat and cold plunges for heart and blood pressure conditions, and tells the user to ask their doctor before trying, while offering gentler options."}
