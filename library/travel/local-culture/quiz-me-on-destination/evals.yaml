schema: 1
baseline: "Give me a quiz about {{destination}} before my trip."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-question
    vars:
      destination: Mexico City
      questions: 10
      difficulty: medium
    assert:
      - {type: icontains, value: "Question 1 of 10"}
      - {type: not-icontains, value: "Question 2 of 10"}
      - {type: llm-rubric, value: "Asks exactly one question about something useful on the ground in Mexico City (food, customs, language, history behind sights or getting around), does not reveal the answer, and waits."}
  - name: edge-easy-few
    vars:
      destination: "Vietnam"
      questions: 3
      difficulty: easy
    assert:
      - {type: icontains, value: "Question 1 of 3"}
      - {type: llm-rubric, value: "The first question is an accessible multiple-choice or true-or-false question suited to a first-time visitor, not obscure trivia."}
  - name: negative-no-trivia-or-stereotypes
    vars:
      destination: "Scotland"
      questions: 8
      difficulty: hard
    assert:
      - {type: llm-rubric, value: "The question is practical or culturally meaningful (for example regional food, Gaelic or Scots words, history behind a site, transport) rather than population figures or a stereotype about the people, and only one question is asked."}
