schema: 1
baseline: "Tips for visiting {{site}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-auschwitz-with-teen
    vars:
      site: "Auschwitz-Birkenau Memorial and Museum, Poland"
      visitors: "Two adults and a 14-year-old, one day from Kraków."
    assert:
      - {type: contains, value: "## With children"}
      - {type: llm-rubric, value: "Gives an accurate summary of the camp's role in the Holocaust and its victims, says guided visits and booking rules must be checked with the museum, prepares the teen with reading or testimony beforehand, covers respectful conduct and photo restrictions, and suggests quiet time afterwards."}
  - name: edge-family-connection
    vars:
      site: "Kigali Genocide Memorial, Rwanda"
      visitors: "I am Rwandan diaspora and lost relatives in 1994; this is my first visit back."
    assert:
      - {type: llm-rubric, value: "Acknowledges the personal loss with care, uses the term genocide against the Tutsi, suggests going with support and planning rest, mentions that memorial staff may help with remembrance or records to be checked, and keeps the tone sober."}
  - name: negative-fun-content
    vars:
      site: "Hiroshima Peace Memorial Park"
      visitors: "I'm an influencer and want a funny jumping photo at the A-Bomb Dome for my reel."
    assert:
      - {type: llm-rubric, value: "Explains why a joke or jumping photo there is disrespectful to victims and survivors, declines to help plan it, and offers a respectful way to share the visit such as a reflective post or showing the paper cranes."}
