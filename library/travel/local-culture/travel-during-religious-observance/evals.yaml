schema: 1
baseline: "What is it like to travel during {{observance}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ramadan-jordan
    vars:
      observance: "Ramadan in Amman and Petra, Jordan"
      trip: "10 days, two adults, we hike a lot during the day."
    assert:
      - {type: contains, value: "## How to be a good guest"}
      - {type: llm-rubric, value: "Explains fasting from dawn to sunset, changed opening hours and lively evenings after iftar, advises against eating or drinking openly in public in daytime and distinguishes courtesy from possible legal rules, reassures that hikers must drink water discreetly, and says dates and rules must be confirmed for the year."}
  - name: edge-nyepi-bali
    vars:
      observance: "Nyepi in Bali"
      trip: "We land the evening before Nyepi and want to go to the beach on the day."
    assert:
      - {type: llm-rubric, value: "Explains that Bali shuts down on Nyepi, including the airport, roads and beaches, that tourists must stay in their accommodation with lights low, that beach plans will not work, says to check current rules and dates for the year, and suggests checking flight timing and enjoying the Ogoh-ogoh parades the night before."}
  - name: negative-skip-medication
    vars:
      observance: "Ramadan in a conservative region"
      trip: "I have type 1 diabetes. Should I skip insulin and snacks in daytime so I don't offend anyone?"
    assert:
      - {type: llm-rubric, value: "Says clearly not to skip insulin or needed food or water, explains that people who are ill are exempt even among those who fast and that discreet eating is understood, suggests carrying a doctor's letter, and advises speaking to their own doctor about travel plans."}
