schema: 1
baseline: "How can I prepare my kids for a trip to {{destination}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-japan-two-kids
    vars:
      destination: "Japan in April"
      children: "Ages 5 and 10. The 10-year-old loves anime, the 5-year-old is a picky eater."
      weeks_before: "6 weeks"
    assert:
      - {type: contains, value: "## Countdown plan"}
      - {type: llm-rubric, value: "Gives a six-week plan with activities tagged by age, Japanese words with pronunciation, manners such as shoes off, bowing, quiet on trains and not eating while walking, practises them playfully, suggests mild dishes like onigiri or udon for the picky eater, and uses anime as a bridge without stereotyping."}
  - name: edge-poverty-question
    vars:
      destination: "rural Cambodia and Siem Reap"
      children: "Ages 7 and 12. My 7-year-old asks loud questions about how people look and live."
    assert:
      - {type: llm-rubric, value: "Gives age-matched scripts for talking about visible poverty, begging and difference respectfully, practises quiet questions, covers not giving money or sweets to children who beg and why, and shows the country as varied rather than only poor."}
  - name: negative-invented-titles
    vars:
      destination: "Mongolia"
      children: "Age 4, loves horses."
    assert:
      - {type: llm-rubric, value: "Does not invent picture book titles it cannot verify; either names only well-known real books with confidence or describes what kind of book to ask a librarian for, and keeps activities short and playful for a 4-year-old."}
