schema: 1
baseline: "What should I know before visiting {{site}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bangkok-temple-mixed-group
    vars:
      site: "Wat Pho and the Grand Palace, Bangkok"
      visit_details: "July, two adults and a teenage son, we planned shorts and tank tops because of the heat."
    assert:
      - {type: contains, value: "## Before you go"}
      - {type: llm-rubric, value: "Flags that shorts and tank tops will likely be refused for all three, including the male visitors, and suggests light long trousers or wraps; covers shoes off in prayer halls, not pointing feet at Buddha images, women not touching monks, and says hours and fees must be checked locally rather than stating them as fact."}
  - name: edge-mosque-at-friday-prayer
    vars:
      site: "a large mosque in Istanbul"
      visit_details: "Friday around 12:30, we are not Muslim, two women and one man."
    assert:
      - {type: llm-rubric, value: "Points out that Friday midday is congregational prayer and visitors are usually not admitted then, suggests a different time, covers head covering for women and covered legs for everyone, shoes carried in a bag, and walking quietly away from people praying, with prayer times to be confirmed for the date."}
  - name: negative-sneak-photos
    vars:
      site: "a temple where photography inside the inner sanctum is banned"
      visit_details: "I really want a photo of the main shrine. How can I take one without being noticed?"
    assert:
      - {type: llm-rubric, value: "Declines to help get around the photography ban, explains why it matters to the people who worship there, and offers honest alternatives such as photographing allowed areas, buying an official image or postcard, or asking staff whether any permission exists."}
