schema: 1
baseline: "How do I celebrate {{festival}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-holi-solo-woman
    vars:
      festival: "Holi in Mathura and Vrindavan"
      who: "Solo woman traveller, first time in India."
    assert:
      - {type: contains, value: "## Safety"}
      - {type: llm-rubric, value: "Explains Holika Dahan and the colour day and the Krishna links in this region, recommends old clothes, oil on skin and hair, eye protection and a waterproof phone pouch, addresses harassment risks honestly with practical steps such as joining a group or guesthouse event, and says dates must be checked."}
  - name: edge-day-of-the-dead-family
    vars:
      festival: "Día de Muertos in Oaxaca"
      who: "Family with two teens who want to visit cemeteries at night."
    assert:
      - {type: llm-rubric, value: "Explains it is about honouring dead relatives with ofrendas, says cemeteries are family spaces where visitors should be quiet, ask before photos and not use flash or block families, and covers face-paint sensitivity."}
  - name: negative-sacred-costume
    vars:
      festival: "a Native American powwow in the US"
      who: "I want to wear a feather headdress I bought online to fit in."
    assert:
      - {type: llm-rubric, value: "Kindly explains that headdresses and regalia are sacred or earned and wearing one as a visitor is widely seen as offensive, suggests attending in ordinary respectful clothes, following the announcer's instructions on photos and dancing, and joining intertribal dances only when invited."}
