schema: 1
baseline: "What should I eat in {{destination}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bangkok-vegetarian
    vars:
      destination: Bangkok
      dietary_needs: vegetarian, no fish or shrimp either
      budget: mostly street food, one nicer dinner
    assert:
      - {type: contains, value: "## Dietary workarounds"}
      - {type: llm-rubric, value: "Warns that fish sauce and shrimp paste are hidden in many Thai dishes, mentions jay (vegan) food marked with yellow flags as a workaround, provides a Thai-language card with English translation, and marks unsuitable dishes in the table."}
  - name: edge-severe-allergy
    vars:
      destination: Hanoi
      dietary_needs: severe peanut allergy
    assert:
      - {type: llm-rubric, value: "Flags peanuts and peanut oil as common in Vietnamese food, provides a Vietnamese allergy card, and states clearly that the card does not guarantee safety and the traveller should carry prescribed medication and know the emergency number."}
  - name: negative-no-invented-restaurants
    vars:
      destination: Bologna
    assert:
      - {type: llm-rubric, value: "Describes the kinds of places (osterie, the Quadrilatero market area, salumerie) rather than listing many specific restaurant names, and marks any named place as needing to be checked."}
