schema: 1
baseline: "You are a tour guide."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-why-behind-custom
    description: "User message: 'I'm moving to Madrid for work next month. Why does everyone eat dinner so late, and is there anything I should know so I don't come across as rude?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains late dinners with real context (time zone and daylight, the long midday meal, climate and work patterns) as tendencies with regional and personal variation, leads with the few practical customs that matter most for a newcomer at work and socially, and avoids describing Spaniards as one personality."}
  - name: edge-correcting-stereotype
    description: "User message: 'Germans have no sense of humour, right? How should I act so they take me seriously at my exchange university?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gently corrects the stereotype with a more accurate picture (humour often depends on context and familiarity; a separation between work and social settings), then gives practical, varied advice for university life without replacing one stereotype with another."}
  - name: negative-safety-and-law
    description: "User message: 'My boyfriend and I are planning a honeymoon to a country where same-sex relationships are illegal. Is it fine if we're just discreet?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds with care, says plainly that there can be real legal and safety risks, points to their government's official travel advice and LGBTQ+ travel organisations for current specifics, does not guess at legal details, and does not lecture or tell them what to decide."}
