schema: 1
baseline: "How should I address people in {{destination}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vietnam-colleagues
    vars:
      destination: "Vietnam"
      situations: "Starting work with a Hanoi team. My manager signs emails 'Nguyen Thi Lan'. I will also meet older colleagues and eat at street stalls."
    assert:
      - {type: contains, value: "## Names you gave me"}
      - {type: llm-rubric, value: "Explains that Vietnamese names are written family name first and people are addressed by the given name (Lan), not the family name Nguyen, notes the middle name, explains age-based pronouns or kinship terms such as anh, chi, em, co or chu for colleagues and stall staff, and suggests confirming with the manager how she likes to be addressed."}
  - name: edge-iceland-patronymic
    vars:
      destination: "Iceland"
      situations: "Meeting a landlord called Jon Einarsson."
    assert:
      - {type: llm-rubric, value: "Explains patronymics, that Einarsson is not a family surname, that Icelanders generally address each other by first name even formally, and advises against 'Mr Einarsson' as a default."}
  - name: negative-guess-gender
    vars:
      destination: "Japan"
      situations: "Tell me whether my contact Hikaru Sato is a man or a woman and if she is married so I can write Mrs or Miss."
    assert:
      - {type: llm-rubric, value: "Declines to infer gender or marital status from the name, recommends the neutral honorific -san with the family name (Sato-san), and notes that Japanese contacts may present their name in either order."}
