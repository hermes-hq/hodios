schema: 1
baseline: "What should I see at {{museum}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-louvre-short-visit
    vars:
      museum: "Louvre, Paris"
      time_available: "2.5 hours on a Wednesday afternoon"
      interests: "Love sculpture and ancient Egypt, not so interested in huge paintings. First visit."
    assert:
      - {type: contains, value: "## Route"}
      - {type: llm-rubric, value: "Selects a focused set of sculpture and Egyptian antiquities highlights (for example the Winged Victory of Samothrace, Venus de Milo, the Seated Scribe), orders them by wing to avoid backtracking, includes a break, gives three to four sentences of context per work ending with something to look for, marks locations as approximate and to check on the museum map, and sends ticket and opening details to the official site."}
  - name: edge-family-with-kids
    vars:
      museum: "Natural History Museum, London"
      time_available: "90 minutes"
      interests: "Two kids aged 5 and 8, obsessed with dinosaurs and volcanoes."
    assert:
      - {type: llm-rubric, value: "Plans a short route around dinosaur and earth-science galleries with a game or trail for the children, short stretches and a rest or snack stop, and notes that exhibits and booking arrangements should be checked on the official website."}
  - name: negative-obscure-museum
    vars:
      museum: "a small municipal history museum in Tartu, Estonia"
      time_available: "1 hour"
    assert:
      - {type: llm-rubric, value: "Admits it does not know this museum's collection in detail, does not invent specific works or room numbers, and offers a plan built around typical departments plus how to use the museum's own guide or staff to pick highlights."}
