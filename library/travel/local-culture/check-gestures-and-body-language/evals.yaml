schema: 1
baseline: "What gestures should I avoid in {{destination}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-india-from-us
    vars:
      destination: "India, mostly Rajasthan and Delhi"
      home_habits: "American; I use thumbs up, beckon with my finger, eat with whichever hand."
    assert:
      - {type: contains, value: "## Gestures to avoid"}
      - {type: llm-rubric, value: "Covers using the right hand for eating, giving and receiving, avoiding pointing feet or touching people with feet, explains the head wobble, notes beckoning with palm down rather than a finger, mentions public affection and gender touch norms, and marks forgiveness levels."}
  - name: edge-greece-palm
    vars:
      destination: "Greece"
    assert:
      - {type: llm-rubric, value: "Explains the moutza (open palm pushed toward someone) as an insult, that a downward-tilted nod or raised chin with a click can mean no, and notes generational variation."}
  - name: negative-too-broad
    vars:
      destination: "Asia"
    assert:
      - {type: llm-rubric, value: "Says the region is too broad for reliable gesture advice because norms differ a lot between countries, asks which countries, and gives at most a few cautious general points."}
