schema: 1
baseline: "What are the unwritten rules of living in {{country}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-switzerland-all
    vars:
      country: Switzerland
      city: Zurich
      context: all
      from_country: Brazil
    assert:
      - {type: contains, value: "## The ten that matter in your first months"}
      - {type: llm-rubric, value: "Covers resident-level norms such as quiet hours and Sunday rest in buildings, strict recycling and bag rules with fines to check locally, punctuality, greetings at work and the shift from formal to informal address, and school-gate norms; includes a contrast table for someone from Brazil; frames points as tendencies and avoids character stereotypes."}
  - name: edge-school-gate-only
    vars:
      country: Japan
      context: school-gate
    assert:
      - {type: llm-rubric, value: "Focuses on the school-gate context in depth (parent associations and volunteering expectations, communication with teachers, children's belongings and labelling, events) and does not pad the answer with work and neighbour sections."}
  - name: negative-stereotype-bait
    vars:
      country: France
      context: work
      from_country: "United States"
    assert:
      - {type: llm-rubric, value: "Describes concrete workplace behaviours (greetings each morning, lunch culture, vous and tu, email formality, after-hours contact) without sweeping claims such as 'the French are rude' or 'lazy', and notes variation by sector, company and region."}
