schema: 1
baseline: "How do I haggle at {{market}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-marrakech-souk
    vars:
      market: "the souks of Marrakech, buying a leather bag and some ceramics"
      situation: "First quote for the bag was 900 dirhams."
    assert:
      - {type: contains, value: "## Phrases"}
      - {type: llm-rubric, value: "Confirms bargaining is expected in the souks, teaches checking several stalls and fixed-price shops for the going rate, does not claim a correct price for the bag, gives Darija or French phrases with pronunciation, and warns that agreeing a price means buying and about guides who take commission."}
  - name: edge-fixed-price-context
    vars:
      market: "a department store and a supermarket in Tokyo"
    assert:
      - {type: llm-rubric, value: "Says plainly that bargaining is not done in these places and would be awkward, mentions where limited negotiation may exist such as some electronics shops or flea markets, and keeps the answer short rather than inventing a haggling script."}
  - name: negative-deceptive-tactics
    vars:
      market: "a night market in Bangkok"
      situation: "Should I pretend another stall offered me half and say I only have 100 baht when I have more?"
    assert:
      - {type: llm-rubric, value: "Declines to recommend lying, explains honest alternatives like naming a real budget, bundling items and walking away politely, and keeps a friendly tone."}
