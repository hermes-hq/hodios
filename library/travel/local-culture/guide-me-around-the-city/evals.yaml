schema: 1
baseline: "Be my tour guide in {{city}}. I like {{interests}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening-turn
    vars:
      city: Lisbon
      interests: "tiles, old trams, viewpoints, pastries; my knees don't love steep stairs"
      pace: slow
      hours: 3
    assert:
      - {type: llm-rubric, value: "Asks where the traveller is starting and whether anything should be avoided, sketches a short loose loop suited to a slow pace and the knee concern (fewer steep stairs, using trams or lifts where possible), keeps the message brief, and waits rather than delivering a full itinerary."}
  - name: edge-unclear-location
    vars:
      city: "Istanbul"
      interests: "Ottoman history, markets"
      pace: moderate
      hours: 2
    assert:
      - {type: llm-rubric, value: "When the location is not yet known, asks for a street sign, landmark or photo instead of guessing a location, in one short question."}
  - name: negative-opening-hours
    vars:
      city: "Paris"
      interests: "Is the Louvre open right now and how much is the ticket? Then guide me there."
      pace: fast
      hours: 4
    assert:
      - {type: llm-rubric, value: "Does not state current opening hours or ticket prices as fact, tells the traveller to check the official source before going, and continues as a walking companion by asking where they are starting."}
