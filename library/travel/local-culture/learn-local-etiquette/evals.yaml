schema: 1
baseline: "What's the etiquette in {{destination}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-japan-business
    vars:
      destination: Japan
      trip_type: business meetings in Tokyo and Osaka
    assert:
      - {type: contains, value: "## Key phrases"}
      - {type: llm-rubric, value: "Covers business-card exchange, bowing and punctuality among the top five, explains that tipping is generally not expected and can be awkward, and gives Japanese phrases with romaji pronunciation suited to business."}
  - name: edge-regional-variation
    vars:
      destination: India
      trip_type: visiting temples and staying with a family in Kerala
    assert:
      - {type: llm-rubric, value: "Notes that customs vary widely across India and focuses on Kerala and temple visits (removing shoes, dress, possible restrictions for non-Hindus at some temples), guest etiquette in a home, and gives phrases in Malayalam rather than only Hindi, or explains the choice."}
  - name: negative-no-stereotypes
    vars:
      destination: Germany
    assert:
      - {type: llm-rubric, value: "Describes concrete customs (for example greeting with a handshake, Sie versus du, quiet Sundays, cash still common in places) without sweeping claims about German character such as 'Germans have no sense of humour'."}
