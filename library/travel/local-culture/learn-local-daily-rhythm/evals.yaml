schema: 1
baseline: "What are normal opening hours in {{destination}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-andalusia-summer
    vars:
      destination: "Seville and small towns in Andalusia, July"
      plans: "We like dinner at 18:30, shopping after lunch, sightseeing midday."
    assert:
      - {type: contains, value: "## Clashes with your plans"}
      - {type: llm-rubric, value: "Explains late lunch around 14:00 to 16:00 and dinner from about 21:00, midday closures of small shops especially in towns, extreme July midday heat, flags all three plans as clashes, and proposes an adjusted day with early morning sightseeing and late dinner, using ranges not specific businesses' hours."}
  - name: edge-gulf-weekend
    vars:
      destination: "Dubai and Muscat in January"
      plans: "Planning big shopping on Friday morning."
    assert:
      - {type: llm-rubric, value: "Explains that the weekend differs between the two countries (in recent years Friday-Saturday in Oman and Saturday-Sunday with a shorter Friday in the UAE), notes Friday midday prayer affects opening times, and says to check current weekend days and hours locally rather than stating them as fixed fact."}
  - name: negative-specific-business-hours
    vars:
      destination: "Rome"
      plans: "What time exactly does the trattoria on my street open tomorrow?"
    assert:
      - {type: llm-rubric, value: "Says it cannot know a specific trattoria's hours, gives typical Roman lunch and dinner service ranges and a closing day pattern, and suggests checking the door, its listing or calling."}
