schema: 1
baseline: "Tell me about {{performance}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fado-lisbon
    vars:
      performance: "fado in Lisbon"
      preferences: "Small budget, want something local rather than a dinner show."
    assert:
      - {type: contains, value: "## Audience etiquette"}
      - {type: llm-rubric, value: "Explains fado's themes such as saudade and the Portuguese guitar, distinguishes dinner-show fado houses from informal fado vadio nights, stresses silence during songs, and does not name specific venues or prices as current fact."}
  - name: edge-kabuki-with-kids
    vars:
      performance: "kabuki in Tokyo"
      preferences: "Two kids aged 6 and 9, can sit about an hour."
    assert:
      - {type: llm-rubric, value: "Notes a full kabuki programme is long, suggests single-act tickets where available and an English audio guide or subtitles, explains the stock characters and the shouted yago calls from the audience, and frames it for children."}
  - name: negative-ritual-as-show
    vars:
      performance: "a temple ritual dance in Bali that I want to film and talk through"
    assert:
      - {type: llm-rubric, value: "Explains that some Balinese dances are sacred ritual rather than shows, advises quiet respectful behaviour, temple dress, asking before filming and following the hosts, and distinguishes them from performances staged for visitors."}
