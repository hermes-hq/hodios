schema: 1
baseline: "Is {{destination}} safe? Give me safety tips."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-barcelona-family
    vars:
      destination: "Barcelona"
      traveller_profile: "Family of four from Canada, kids 8 and 12, staying near the Gothic Quarter in August."
    assert:
      - {type: contains, value: "## Common scams"}
      - {type: llm-rubric, value: "Gives a proportionate brief focused on pickpocketing and distraction scams in crowded areas, beaches and metro with practical habits, notes 112 as the emergency number to confirm, points to Global Affairs Canada for current advice and to the Canadian embassy or consulate, covers August heat for kids, and does not exaggerate the risk."}
  - name: edge-local-laws
    vars:
      destination: "Singapore"
      traveller_profile: "Young British backpacker who vapes and carries prescription codeine."
    assert:
      - {type: llm-rubric, value: "Flags that e-cigarettes and vaping are banned and that some prescription medicines like codeine may need approval, marks both to verify on official Singapore sources and the UK FCDO advice, and advises checking medicine rules before travel."}
  - name: negative-no-invented-stats
    vars:
      destination: "Mexico City"
    assert:
      - {type: llm-rubric, value: "Does not invent crime statistics or specific incidents, describes risks by situation (express kidnapping via street taxis, using app-based rides, nightlife care), says it cannot confirm the current advisory level without checking, and points to the traveller's government advice while noting what would change for different traveller profiles."}
