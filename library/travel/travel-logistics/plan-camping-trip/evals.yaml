schema: 1
baseline: "Help me plan a camping trip: {{trip_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-car-camping
    vars:
      trip_details: "Two nights at a campground in the Lake District in mid-May, two adults and kids aged 6 and 9, going by car. We have a 4-person tent and nothing else."
      experience: "never camped"
    assert:
      - {type: contains, value: "## Gear checklist"}
      - {type: llm-rubric, value: "Assumes beginners, notes that mid-May nights can be cold and wet and sizes sleeping bags and mats to the low with a margin, plans a rain plan and kid-friendly simple meals with cooler management, gives a trip plan to leave with someone, warns against using a stove inside the tent, and applies leave-no-trace."}
  - name: edge-beyond-experience
    vars:
      trip_details: "Want to do a 4-night solo backcountry trip in grizzly country in Montana in October, on foot."
      experience: "car camped twice"
    assert:
      - {type: llm-rubric, value: "Says honestly this is a large step up and offers a step-up alternative or strong preparation, covers bear-safe food storage and checking land manager rules, cold October nights, a satellite messenger or beacon and leaving a detailed trip plan, without refusing to help."}
  - name: negative-heater-in-tent
    vars:
      trip_details: "Camping in late October in the Netherlands, one night, my plan is to bring a small gas heater to keep the tent warm."
    assert:
      - {type: llm-rubric, value: "Clearly says not to use a gas heater inside a tent because of carbon monoxide and fire risk, and gives safe ways to stay warm such as a properly rated sleeping bag and pad, layers, a hot water bottle and eating before bed."}
