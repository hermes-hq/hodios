schema: 1
baseline: "What should I pack for {{destination}} ({{dates}})?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-iceland-carry-on
    vars:
      destination: Iceland, Ring Road
      dates: 10 days in October
      activities: "Hiking, hot springs, glacier walk with a guide; washing machine at one guesthouse"
      luggage: carry-on
    assert:
      - {type: contains, value: "- [ ]"}
      - {type: llm-rubric, value: "Describes cold, wet, windy October conditions with short daylight, builds a layering system (base, mid, waterproof shell) with quantities sized for laundry, includes swimwear for hot springs, applies the liquids and power-bank rules while saying to check airport and airline, and notes Iceland uses Type C/F plugs at 230 V."}
  - name: edge-mixed-climates
    vars:
      destination: "Singapore, then Tokyo"
      dates: 2 weeks in January
      activities: business meetings in both cities
      luggage: checked
    assert:
      - {type: llm-rubric, value: "Handles hot humid Singapore and cold Tokyo with a layered business wardrobe, keeps valuables, medication and one outfit in the cabin bag, and avoids duplicate generic items."}
  - name: negative-no-filler
    vars:
      destination: Barcelona
      dates: 2 nights in June
      luggage: carry-on
    assert:
      - {type: llm-rubric, value: "Keeps the list short and specific to a two-night summer city break; does not include irrelevant items such as a rain jacket for heavy rain, hiking gear or a first-aid kit with many medicines."}
