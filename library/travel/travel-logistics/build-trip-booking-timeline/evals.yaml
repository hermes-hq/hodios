schema: 1
baseline: "What should I book first for this trip? {{trip}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-peru-machu-picchu
    vars:
      trip: "Peru in July for 2 weeks, 2 adults from Germany. Must-do: Inca Trail to Machu Picchu. Also Lima, Arequipa, Lake Titicaca."
      today: "2026-10-11"
    assert:
      - {type: contains, value: "## Dependencies"}
      - {type: llm-rubric, value: "Puts the limited Inca Trail permits first as they typically sell out months ahead and fix the dates (release timing to verify), books flights only after permits are confirmed, adds insurance after the first big payment, includes altitude-related health planning, and counts down from the given date."}
  - name: edge-short-notice
    vars:
      trip: "Japan in 3 weeks, 1 adult, my passport expires in 2 months."
    assert:
      - {type: llm-rubric, value: "Flags the passport expiry as urgent and says to check Japan's passport validity requirement and expedited renewal options before booking anything non-refundable, and compresses the timeline realistically."}
  - name: negative-guarantee-availability
    vars:
      trip: "Tell me the exact date Alhambra tickets for next August go on sale and guarantee I'll get them."
    assert:
      - {type: llm-rubric, value: "Does not invent an exact release date or guarantee availability, says to check the official ticket site's release schedule, and gives a fallback plan if timed tickets sell out."}
