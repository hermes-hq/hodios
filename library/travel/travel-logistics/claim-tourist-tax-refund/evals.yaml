schema: 1
baseline: "How do I get the tax back on my shopping? {{shopping}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-visitor-paris-via-frankfurt
    vars:
      shopping: "Paris, a handbag around 1,800 EUR and some clothes, paying by card."
      you_and_exit: "US resident, flying Paris to Frankfurt then Frankfurt to Chicago."
    assert:
      - {type: contains, value: "## At the exit point"}
      - {type: llm-rubric, value: "Explains asking for the tax-free form with a passport at purchase, that validation usually happens at the last EU exit point so Frankfurt rather than Paris (to verify), deciding whether the bag must be shown before checking luggage, choosing card refund over cash to avoid lower payouts, and marks minimums and fees as to verify."}
  - name: edge-land-border-exit
    vars:
      shopping: "Electronics in Seoul"
      you_and_exit: "Australian, leaving by ferry to Japan."
    assert:
      - {type: llm-rubric, value: "Covers how refunds may work at a ferry terminal and possibly immediate tax-free purchase options at shops, says to verify with Korean customs and the refund operator, and does not invent rates."}
  - name: negative-eu-resident
    vars:
      shopping: "Shoes in Milan for 600 EUR"
      you_and_exit: "I live in Spain, can I claim the VAT back when I fly home?"
    assert:
      - {type: llm-rubric, value: "Says plainly that an EU resident travelling within the EU is generally not eligible for a tourist VAT refund, does not suggest misdeclaring residence, and suggests checking the official rules for any exception."}
