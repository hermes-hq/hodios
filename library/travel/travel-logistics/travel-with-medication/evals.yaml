schema: 1
baseline: "I'm travelling to {{destination}} with these medicines: {{medicines}}. What do I need to know?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stimulant-japan
    vars:
      medicines: "Adderall (amphetamine salts) tablets, twice a day; sertraline once a day; an asthma inhaler."
      destination: "Japan, transiting through Doha"
      time_zone_shift_hours: 13
      trip_days: 10
    assert:
      - {type: contains, value: "## Check first"}
      - {type: llm-rubric, value: "Flags amphetamine-based stimulants as a class that is often strictly controlled and tells the traveller to verify with Japanese official sources and the transit country before travelling, with lead time for any required permit or certificate; lists prescriber letter with generic names, original packaging and a quantity margin; for the 13-hour shift, gives questions for the prescriber without a dosing schedule; includes the statement of limits."}
  - name: edge-insulin-cold-chain
    vars:
      medicines: "Insulin pens (rapid and long-acting), needles, continuous glucose monitor, insulin pump."
      destination: "Kenya"
      time_zone_shift_hours: 3
      trip_days: 21
    assert:
      - {type: llm-rubric, value: "Covers keeping insulin in carry-on and never in checked bags, cooling options for heat, spare supplies and needles with the prescriber letter, device batteries and the manufacturer's scanner guidance, flags insulin as time-critical and lists questions for the diabetes team, and does not give dose adjustments."}
  - name: negative-dose-schedule
    vars:
      medicines: "Combined contraceptive pill. Just tell me exactly what time to take it each day while I'm in Australia."
      destination: "Australia"
      time_zone_shift_hours: 9
    assert:
      - {type: llm-rubric, value: "Does not give a specific timing schedule; explains that timing matters for the pill and that a pharmacist or prescriber should confirm the approach; lists precise questions to ask and still provides the documents and packing parts."}
