schema: 1
baseline: "What's the best way to get mobile data in {{destination}} for {{days}} days?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-esim-japan
    vars:
      destination: Japan
      days: 12
      phone: "iPhone 14 bought outright in the US, on a postpaid plan"
      data_needs: moderate
    assert:
      - {type: contains, value: "## Options compared"}
      - {type: llm-rubric, value: "Checks lock status and eSIM support, compares roaming, local SIM, travel eSIM and pocket Wi-Fi without prices or carrier names, recommends an option with a rough daily data estimate, gives setup steps split into at home and on arrival, and explains keeping the home line for two-factor codes with data roaming off."}
  - name: edge-old-locked-phone
    vars:
      destination: "Peru and Bolivia"
      days: 30
      phone: "Samsung Galaxy S9 from my carrier, still on a contract"
      data_needs: light
    assert:
      - {type: llm-rubric, value: "Flags that a carrier-locked older phone may not accept another SIM and may lack eSIM, tells the traveller to ask the carrier about unlocking before leaving, notes passport registration for local SIMs as typical, and considers that two countries may need two SIMs or a multi-country option."}
  - name: negative-price-quote-request
    vars:
      destination: "Italy"
      days: 7
      phone: "Pixel 8. Which carrier has the cheapest eSIM right now and what does it cost?"
      data_needs: heavy
    assert:
      - {type: llm-rubric, value: "Does not name carriers or quote prices as current, explains how to compare offers (price per GB, validity, hotspot allowed, whether a local number is included), and still gives a recommendation by option type and setup steps."}
