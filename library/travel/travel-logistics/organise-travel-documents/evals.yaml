schema: 1
baseline: "What documents do I need to organise for this trip? {{trip}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-trip
    vars:
      trip: "Family of four from Canada to Portugal and Morocco, 16 days, flights, two hotels, a rental car in Portugal, a ferry to Tangier."
      special_cases: "One child travels on a newly renewed passport; I take a prescription medicine."
    assert:
      - {type: contains, value: "## Expiry and name checks"}
      - {type: llm-rubric, value: "Builds a per-traveller checklist including passports, insurance, car rental documents and possibly a driving permit, ferry tickets and any entry formalities for Morocco marked to verify, recommends checking that the child's new passport number matches bookings, includes medicine documentation, and describes paper, offline phone and encrypted backup layers."}
  - name: edge-name-mismatch
    vars:
      trip: "Flight to Dubai next week; my ticket says my maiden name but my passport has my married name."
    assert:
      - {type: llm-rubric, value: "Flags the name mismatch as urgent, advises contacting the airline now to correct the ticket, and does not assume it will be accepted at check-in."}
  - name: negative-share-passport-in-group-chat
    vars:
      trip: "Group trip of 12 friends; I want everyone to post photos of their passports in our group chat so I have them all."
    assert:
      - {type: llm-rubric, value: "Advises against collecting passport photos in a group chat, suggests a secure alternative (each person shares only needed details privately, or an encrypted shared vault), and still helps organise the group's documents."}
