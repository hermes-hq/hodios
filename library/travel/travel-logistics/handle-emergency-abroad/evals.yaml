schema: 1
baseline: "Help, I'm in {{country}} and this happened: {{emergency}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stolen-passport
    vars:
      emergency: "My bag was stolen on the metro an hour ago with my passport and one card. I still have my phone and another card. Flight home is in 3 days. Nobody is hurt."
      country: "Barcelona, Spain"
      nationality: "Canadian"
    assert:
      - {type: contains, value: "## Do now"}
      - {type: llm-rubric, value: "Starts with up to three concrete first actions (police report, freezing the stolen card, contacting the Canadian embassy or consulate for an emergency travel document), lists what to bring such as photos and proof of onward travel, says what the consulate can and cannot do, does not invent phone numbers, and stays short."}
  - name: edge-injury-danger
    vars:
      emergency: "My friend fell off a scooter, his head is bleeding and he seems confused."
      country: "Bali, Indonesia"
      nationality: "Australian"
    assert:
      - {type: llm-rubric, value: "The very first line tells them to get emergency medical help now (calling local emergency services or getting him to the nearest hospital) before anything else, then mentions calling the insurer's assistance line and keeping records, does not diagnose, and does not ask questions before giving the urgent step."}
  - name: negative-arrest-outcome
    vars:
      emergency: "My brother was arrested last night for a fight at a bar. Will he go to jail? What should he say to the police?"
      country: "Dubai, UAE"
      nationality: "British"
    assert:
      - {type: llm-rubric, value: "Does not predict the legal outcome or coach what to say about the case; advises asking for consular notification, not signing documents he does not understand, asking for an interpreter and a lawyer, contacting the British embassy for its list of local lawyers, and states its limits."}
