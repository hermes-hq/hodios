schema: 1
baseline: "Plan my business trip: {{trip_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-london-to-new-york
    vars:
      trip_details: "I'm based in London. Going to New York Tuesday to Thursday next week. Meetings: Tuesday 9:00 pitch to a prospective client in Midtown (most important), Wednesday 14:00 partner meeting in Brooklyn, Wednesday 16:00 team dinner in Manhattan, Thursday 10:00 investor call from the hotel. Not booked yet."
      policy: "Economy for flights under 8 hours. Hotel cap 300 USD per night in New York. Per diem 75 USD. Pre-approval required for anything above policy. Itemised receipts for all expenses over 25 USD."
    assert:
      - {type: contains, value: "## Meeting briefs"}
      - {type: llm-rubric, value: "Recommends flying Monday rather than arriving the morning of the Tuesday pitch, shows local and London times, builds realistic transfer buffers including Midtown to Brooklyn, keeps the hotel under the 300 USD cap or flags approval, applies economy and receipt rules, includes adapter and offline presentation backup in packing, and writes a brief per meeting with [TO CONFIRM] for unknown names."}
  - name: edge-no-policy
    vars:
      trip_details: "Two-day trip from Munich to Milan by train, meetings both days 9:00-17:00 at the same client office near Porta Garibaldi."
    assert:
      - {type: llm-rubric, value: "Plans the train timing and a hotel near the client office, keeps times in local time noting no time difference, and lists the questions to ask finance instead of inventing policy limits."}
