schema: 1
baseline: "I'm going to study in {{destination}}. How do I prepare?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-exchange-semester
    vars:
      destination: "Madrid, Spain"
      program: "Exchange semester through my US university starting late January. US citizen, living in Ohio. Housing not provided. Budget about 1,400 USD a month."
      duration_months: 5
    assert:
      - {type: contains, value: "## Countdown"}
      - {type: llm-rubric, value: "Puts the student visa early in the countdown with typical evidence and tells the student to confirm with the Spanish consulate and university, warns about rental scams and suggests temporary lodging first, mentions residence registration steps with deadlines to confirm after arrival, gives a monthly budget marked as an estimate, and includes the professional-limits note."}
  - name: edge-prescription-medicine
    vars:
      destination: "Tokyo, Japan"
      program: "Direct enrolment for a year, UK citizen. I take a prescription ADHD stimulant."
      duration_months: 12
    assert:
      - {type: llm-rubric, value: "Flags clearly that some stimulant medicines are restricted or banned in Japan and that the student must check with official Japanese government guidance and their doctor well before departure, without stating the exact rules as fact."}
  - name: negative-missing-nationality
    vars:
      destination: "Canada"
    assert:
      - {type: llm-rubric, value: "Asks for nationality, programme type and length of stay before giving visa steps, does not claim a visa is or is not needed, and may still give the general non-visa parts of the plan."}
