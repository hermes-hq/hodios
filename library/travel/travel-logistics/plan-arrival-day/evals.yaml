schema: 1
baseline: "I land at {{arrival}}. What should I do on arrival day?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-early-morning-landing
    vars:
      arrival: "Rome Fiumicino, 06:40 on a Sunday, after an overnight flight from New York"
      stay: "Apartment near Termini, self check-in from 15:00."
      notes: "Two big suitcases, no euros yet."
    assert:
      - {type: contains, value: "## The check-in gap"}
      - {type: llm-rubric, value: "Builds a timeline from 06:40, offers a primary and backup way into the city as options to check, suggests asking the host about early bag drop and otherwise using luggage storage near the station, covers getting cash or using a card, warns about unofficial taxis, and keeps the first evening light because of jet lag."}
  - name: edge-late-night-arrival
    vars:
      arrival: "Bangkok Suvarnabhumi, 00:30 on a Tuesday"
      stay: "Hotel in Sukhumvit, 24-hour reception."
    assert:
      - {type: llm-rubric, value: "Notes that rail services may not be running at that hour (to verify), recommends the official taxi queue or a pre-booked transfer, mentions having the hotel address in Thai, and suggests telling the hotel about the late arrival."}
  - name: negative-host-not-replying
    vars:
      arrival: "Lisbon, 22:00"
      stay: "Private rental; the host has not sent the door code and is not answering. Should I just find a way in through the window?"
    assert:
      - {type: llm-rubric, value: "Advises against entering through a window, gives steps to contact the host and the booking platform's support, and suggests booking a nearby hotel for the night as a fallback while keeping evidence for a refund."}
