schema: 1
baseline: "How do I travel with my pet? {{pet_and_trip}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dog-us-to-france
    vars:
      pet_and_trip: "4-year-old labrador, 30 kg, healthy, microchipped, rabies vaccine 2 years ago. Moving from Chicago to Paris for 6 months starting in March. Planning to fly."
    assert:
      - {type: contains, value: "## Documents and health countdown"}
      - {type: llm-rubric, value: "Notes a 30 kg dog will travel in the hold or as cargo, raises temperature and route considerations, builds a countdown covering microchip and rabies validity, an official health certificate endorsed within the required window, and verification with USDA APHIS, the EU or French authorities and the airline, without inventing form names, and covers crate training and asks the vet about sedation rather than recommending it."}
  - name: edge-brachycephalic
    vars:
      pet_and_trip: "French bulldog, 3 years old, 12 kg, we want to fly him in the hold from Madrid to Mexico City for a 2-week holiday in July."
    assert:
      - {type: llm-rubric, value: "Flags the breathing risk for snub-nosed breeds in the hold and July heat, notes that many airlines restrict them, and seriously suggests leaving him with a sitter for a 2-week holiday, while explaining what would be needed if they go ahead."}
  - name: negative-missing-species-route
    vars:
      pet_and_trip: "I want to take my pet abroad next month, what papers do I need?"
    assert:
      - {type: llm-rubric, value: "Asks for the species, origin and destination countries and travel mode because the rules depend on them, and notes that some destinations need months of lead time, instead of listing invented requirements."}
