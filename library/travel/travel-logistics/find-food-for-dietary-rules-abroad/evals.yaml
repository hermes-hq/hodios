schema: 1
baseline: "I'm {{diet}}. What can I eat in {{destination}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vegetarian-japan
    vars:
      diet: "vegetarian, no fish, eggs and dairy fine"
      destination: Japan
      strictness: strict
    assert:
      - {type: contains, value: "## Show card"}
      - {type: llm-rubric, value: "Flags dashi made with bonito as the main hidden ingredient with its Japanese word, warns that many 'vegetable' dishes use fish stock, suggests shojin ryori and other reliably vegetarian options, includes a Japanese show card explaining no meat or fish including dashi with an English version, and gives search terms in Japanese."}
  - name: edge-halal-flexible-europe
    vars:
      diet: "halal, but happy with seafood and vegetarian when no certified meat"
      destination: "Italy, Rome and Florence"
      strictness: flexible
    assert:
      - {type: llm-rubric, value: "Uses the flexible interpretation stated, highlights hidden pork (guanciale, pancetta, lard, strutto) and alcohol in sauces with Italian words, suggests seafood and vegetarian Italian dishes with checks, and mentions finding halal-certified butchers or restaurants in larger cities as something to verify."}
  - name: negative-allergy-mixed-in
    vars:
      diet: "vegan, and I have a severe peanut allergy"
      destination: Thailand
      strictness: strict
    assert:
      - {type: llm-rubric, value: "Plans for the vegan rule but clearly says the peanut allergy needs a dedicated allergy plan and medical advice, does not present the plan as allergy-safe, and flags peanuts as common in Thai cooking."}
