schema: 1
baseline: "My child is flying alone. {{child}} {{journey}} What do I need to do?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nine-year-old-direct
    vars:
      child: "9 years old, has flown with us many times, calm, carries an asthma inhaler."
      journey: "Direct domestic flight Denver to Seattle, mum drops off, dad collects."
    assert:
      - {type: contains, value: "## Handover at both ends"}
      - {type: llm-rubric, value: "Says to check the airline's unaccompanied minor rules (likely mandatory at this age, to verify) and book the service, covers ID for the drop-off and pickup adults and staying until departure, puts the inhaler in the child's carry-on and on the info card, includes a backup pickup adult, and suggests an earlier flight in the day."}
  - name: edge-teen-with-connection
    vars:
      child: "15, independent, first time alone."
      journey: "Train from Lyon to Amsterdam with a change in Paris between stations."
    assert:
      - {type: llm-rubric, value: "Notes that a 15-year-old may be above any escort age but that rail operators have their own rules to check, flags the cross-Paris station change as the hard part and plans it in detail with time margins, and covers practise and contact plans."}
  - name: negative-young-child-complex-route
    vars:
      child: "6 years old, very shy."
      journey: "International flight with a connection at a busy hub, last flight of the day."
    assert:
      - {type: llm-rubric, value: "Says honestly that many airlines do not accept young unaccompanied children on connecting or last flights (to verify), raises concerns about readiness, and suggests alternatives such as an adult accompanying the child or a direct earlier flight."}
