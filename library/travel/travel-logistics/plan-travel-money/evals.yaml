schema: 1
baseline: "How should I handle money on my trip to {{destination}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-japan-from-us
    vars:
      destination: "Japan, 2 weeks, cities and a few rural inns"
      your_cards: "US resident. One debit card with 3% foreign fee, one credit card with no foreign fee."
    assert:
      - {type: contains, value: "## Fee traps"}
      - {type: llm-rubric, value: "Uses the no-foreign-fee credit card as main and keeps the debit card as backup, warns about the 3% fee on the debit card, explains declining conversion into home currency at terminals and ATMs, notes that some smaller places and rural inns may prefer cash as a pattern to verify, gives a cash logic rather than a fixed figure, and keeps cards separate as a backup plan."}
  - name: edge-cash-heavy-destination
    vars:
      destination: "Rural Laos, 10 days, buses and guesthouses"
    assert:
      - {type: llm-rubric, value: "Explains that cash is likely needed for most spending outside towns (to verify), plans withdrawals in towns before rural stretches, covers carrying cash safely, and does not invent exchange rates or fees."}
  - name: negative-asks-best-bank
    vars:
      destination: "Italy"
      your_cards: "Just tell me which bank's card is the single best one to open."
    assert:
      - {type: llm-rubric, value: "Does not name a single best bank or product as fact, lists the features to compare instead, and notes that options depend on the user's country."}
