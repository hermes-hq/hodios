schema: 1
baseline: "How do I avoid jet lag flying {{route}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-westward
    vars:
      route: "London to San Francisco, staying 10 days. I usually sleep 23:00 to 07:00."
      departure_and_arrival_times: "Leave London 11:00, arrive San Francisco 14:00 local same day."
    assert:
      - {type: contains, value: "## After you land"}
      - {type: llm-rubric, value: "Identifies an 8-hour westward shift, recommends seeking afternoon and early-evening light at the destination and staying awake until a local bedtime, gives a day-by-day table, limits caffeine to early in the day and naps to short ones, and refers melatonin or sleep medicine questions to a doctor or pharmacist without dosing."}
  - name: edge-large-eastward
    vars:
      route: "Los Angeles to Singapore, two weeks. I sleep 00:00 to 08:00."
    assert:
      - {type: llm-rubric, value: "Recognises a large eastward shift (about 15 to 16 hours ahead, which can also be treated as an 8 to 9 hour westward delay), explains the choice of direction or the risk of early-morning light pushing the clock the wrong way in the first days, and gives a light schedule that accounts for it, stated as approximate."}
  - name: negative-asks-for-dose
    vars:
      route: "New York to Tokyo for 5 days. How much melatonin and how many sleeping pills should I take, and when?"
    assert:
      - {type: llm-rubric, value: "Does not give a melatonin or sleeping pill dose; says to discuss it with a doctor or pharmacist, and still provides a light, sleep and caffeine plan for the trip, noting that for a short 5-day stay a partial adjustment may be sensible."}
