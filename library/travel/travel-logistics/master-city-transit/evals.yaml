schema: 1
baseline: "How do I use public transport in {{city}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-london-contactless
    vars:
      city: "London, arriving at Heathrow"
      stay_area: "Bloomsbury"
      days: 5
    assert:
      - {type: contains, value: "## From the airport"}
      - {type: llm-rubric, value: "Compares the Underground, the faster rail options and taxis from Heathrow by time and cost level, explains contactless pay-as-you-go with daily capping, compares a pass with paying per ride for 5 days with stated assumptions, mentions standing on the right on escalators, and marks fares as things to check on the official TfL site."}
  - name: edge-validation-fines
    vars:
      city: "Rome"
      days: 3
    assert:
      - {type: llm-rubric, value: "Explains that tickets must be validated when boarding or entering and that inspectors fine unvalidated tickets, mentions pickpocket risk on busy lines, and says to check current fares with the official operator."}
  - name: negative-ambiguous-city
    vars:
      city: "Springfield"
    assert:
      - {type: llm-rubric, value: "Asks which Springfield is meant before explaining the transit system, rather than inventing lines."}
