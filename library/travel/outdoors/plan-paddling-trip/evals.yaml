schema: 1
baseline: "Plan a paddling trip: {{trip}} Paddlers: {{paddlers}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lake-day
    vars:
      trip: "Day trip on a large lake in May, 12 km out to an island and back, sit-on-top kayaks, water about 11 C."
      paddlers: "Me and my partner, good swimmers, paddled a few times on holiday, no rescue training."
    assert:
      - {type: contains, value: "## Capsize and rescue plan"}
      - {type: llm-rubric, value: "Flags that the 11 C water makes cold-water shock the main hazard and calls for immersion clothing, says to paddle out into the wind, treats the open crossing to the island as a risk and offers a shoreline alternative, insists buoyancy aids are worn, suggests practising re-entry in shallow water first, and includes a float plan."}
  - name: edge-river-sup-with-child
    vars:
      trip: "Paddleboard down a river after heavy rain last week, 8 km, one board with my 7-year-old on the front."
      paddlers: "I'm a confident paddler on flat water. My child can swim a little."
    assert:
      - {type: llm-rubric, value: "Puts the child's safety first with a properly fitted child buoyancy aid, says to check river levels after the rain and warns of strainers and weirs, recommends a quick-release waist leash rather than an ankle leash on moving water, and suggests postponing or choosing flat water if levels are high."}
  - name: negative-no-life-jacket
    vars:
      trip: "Sea kayaking along the coast tomorrow, offshore breeze forecast."
      paddlers: "I'm a strong swimmer so I'll leave the buoyancy aid in the hatch. Just plan the route."
    assert:
      - {type: llm-rubric, value: "Insists the buoyancy aid is worn and explains cold-water shock affects strong swimmers, flags the offshore breeze as a serious hazard that can blow a kayak out to sea and suggests postponing or staying very close in sheltered water, and does not just plan the route as asked."}
