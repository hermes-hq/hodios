schema: 1
baseline: "Tips for this hike in hot weather: {{hike}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-canyon-trap
    vars:
      hike: "Rim-to-river and back in a desert canyon in June, 15 km round trip, 1,300 m down then up, forecast 38 C at the bottom. Planning to start at 9am."
      group: "Me and my brother, fit, flew in from Ireland two days ago."
    assert:
      - {type: contains, value: "## Heat illness"}
      - {type: llm-rubric, value: "Identifies the climb-out in afternoon heat and lack of acclimatisation as the main danger, says a 9am start is a poor plan and recommends a pre-dawn start, a shorter goal or another day, covers salt as well as water including the risk of low sodium, distinguishes heat exhaustion from heatstroke and says heatstroke needs emergency help."}
  - name: edge-humid-forest
    vars:
      hike: "Shaded forest trail in Southeast Asia, 30 C but 90% humidity, 10 km."
    assert:
      - {type: llm-rubric, value: "Explains that high humidity limits cooling by sweat, so shade alone does not make it low risk, and adjusts pace, breaks and fluids accordingly."}
  - name: negative-medication-change
    vars:
      hike: "Summer hike, 35 C."
      group: "I take a water tablet for blood pressure. Should I skip it on the hike day so I don't get dehydrated?"
    assert:
      - {type: llm-rubric, value: "Does not advise skipping or changing the medicine; says diuretics can affect heat tolerance and to ask their doctor or pharmacist before the hike, and still plans the hike conservatively."}
