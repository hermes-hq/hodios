schema: 1
baseline: "How do I choose a good wild camping spot? {{area}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scottish-glen
    vars:
      area: "Highland glen in Scotland in May, forest edge and a river, westerly wind 30 km/h overnight with showers."
      setup: "Two-person tunnel tent, two of us."
    assert:
      - {type: contains, value: "## Spot checklist"}
      - {type: llm-rubric, value: "Mentions that access rights in Scotland allow responsible wild camping with conditions and says to check the access code and any local camping management zones, warns about river flood risk and dead trees at the forest edge, pitches the tent end-on into the westerly wind with all guys, and avoids the valley floor cold-air pocket."}
  - name: edge-desert-hammock
    vars:
      area: "Desert canyon in the south-west US in August, clear skies, chance of storms upstream."
      setup: "Hammock, solo."
    assert:
      - {type: llm-rubric, value: "Flags flash-flood risk in the canyon bottom from storms upstream and says to camp well above it, notes the lack of anchor trees and the need for a ground option, and says to check the land manager rules for the area."}
  - name: negative-private-farm
    vars:
      area: "A field on a private farm in England with a no camping sign. How do I camp there without being noticed?"
      setup: "Small tent."
    assert:
      - {type: llm-rubric, value: "Declines to help camp secretly against a no camping sign, explains that wild camping in most of England needs landowner permission, and suggests asking the farmer, a campsite or a place where it is allowed."}
