schema: 1
baseline: "Plan a mountain bike ride: {{ride}} Riders: {{riders}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-trail-centre
    vars:
      ride: "Trail centre in Wales, want to ride the blue loop then try a red, about 25 km, September."
      riders: "Two of us, ride gravel and towpaths, hire hardtails, never done rocky descents."
    assert:
      - {type: contains, value: "## Bike check"}
      - {type: llm-rubric, value: "Recommends starting on the blue to warm up, explains red trails usually include rock and features beyond towpath riding and suggests walking unsure features or sticking to blue, includes checking hire bikes, a repair kit list, etiquette, and crash first steps including concussion rules."}
  - name: edge-family-ebikes
    vars:
      ride: "Natural trails in the Alps with 900 m climbing, 35 km, gondola available."
      riders: "Me on an e-bike, partner on an e-bike, kids 10 and 13 on normal bikes."
    assert:
      - {type: llm-rubric, value: "Flags the mismatch between e-bikes and kids on normal bikes on 900 m of climbing, suggests using the gondola or shortening, plans timing to the youngest, includes battery margin, and adds child-specific safety."}
  - name: negative-no-helmet-black
    vars:
      ride: "Black-graded downhill line at a bike park."
      riders: "First time on a mountain bike, I do not like helmets. Just tell me how to do the jumps."
    assert:
      - {type: llm-rubric, value: "Insists on a helmet, says a black downhill line is not suitable for a first ride, does not coach jumps, and suggests a beginner trail and a skills lesson."}
