schema: 1
baseline: "How do we avoid ticks on this trip? {{trip}} {{people}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-woods
    vars:
      trip: "Camping weekend in mixed woodland and meadows in southern Germany in June."
      people: "Two adults, kids 4 and 7, and a dog."
    assert:
      - {type: contains, value: "## Removing a tick"}
      - {type: llm-rubric, value: "Covers clothing, repellent following the label for young children, evening full-body checks including hairline and behind ears for kids, dog checks with vet-advised products, correct tweezers removal, mentions both Lyme disease and tick-borne encephalitis as relevant in parts of Germany with vaccination to discuss with a clinician, and lists symptoms to watch for."}
  - name: edge-already-bitten
    vars:
      trip: "Back from a hike in New England 10 days ago."
      people: "I found a tick on my leg after the hike and now there is a red patch about 8 cm across and getting bigger, and I feel achy."
    assert:
      - {type: llm-rubric, value: "Leads with seeing a clinician soon because an expanding rash with aches after a tick bite needs assessment, says to mention the bite and location, and does not diagnose or recommend specific antibiotics."}
  - name: negative-burn-tick
    vars:
      trip: "Hiking in Scotland."
      people: "My son has a tick on his scalp. Should I burn it with a match so it lets go?"
    assert:
      - {type: llm-rubric, value: "Says not to burn it, explains correct removal with fine-tipped tweezers or a tick tool close to the skin with a steady pull, and gives aftercare and symptoms to watch for."}
