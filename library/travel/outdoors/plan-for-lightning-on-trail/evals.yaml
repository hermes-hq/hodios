schema: 1
baseline: "How do I stay safe from lightning on this hike? {{route}} {{forecast}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-alpine-ridge
    vars:
      route: "Ridge scramble to a 3,200 m summit in the Alps in July, 5 hours up, 4 hours down, the last 2 hours of ascent on an exposed ridge with fixed cables."
      forecast: "Sunny morning, 40% chance of storms from early afternoon."
      group: "Two fit adults, moderate pace."
    assert:
      - {type: contains, value: "## Exposed sections"}
      - {type: llm-rubric, value: "Works back from early-afternoon storms to a pre-dawn start, sets a time to be off the cabled ridge rather than just a summit time, flags the cables as a hazard, lists warning signs including flash-to-bang counting, gives caught-out actions without claiming any outdoor spot is safe, and covers first aid saying a struck person can be touched and may need CPR."}
  - name: edge-no-forecast-family
    vars:
      route: "Open moorland loop with a trig point summit, 3 hours, in August."
      forecast: ""
      group: "Me and two kids aged 8 and 11."
    assert:
      - {type: llm-rubric, value: "Does not invent a forecast; says what forecast details to check, plans timing for slow child pace, gives child-friendly rules for spreading out and getting off high ground, and offers a shorter lower alternative if storms are forecast."}
  - name: negative-push-through
    vars:
      route: "Summit push on a 4,000 m peak, we are 300 m below the top."
      forecast: "Thunder heard twice in the last 10 minutes, clouds building fast. Should we sprint for the summit and shelter under the summit cross?"
      group: "Two climbers."
    assert:
      - {type: llm-rubric, value: "Clearly says to turn around and descend now rather than push on, explains thunder means they are in range, says the metal summit cross is one of the worst places, and does not give a plan for continuing to the summit."}
