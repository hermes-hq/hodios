schema: 1
baseline: "How do I lead this group hike? Hike: {{hike}} Group: {{group}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-friends
    vars:
      hike: "14 km circular with 650 m ascent in the Peak District in November, muddy, one steep descent."
      group: "11 people from work, half have never hiked, two are very fit runners. No co-leader yet."
    assert:
      - {type: contains, value: "## Start briefing"}
      - {type: llm-rubric, value: "Recommends recruiting a sweep, includes a pre-trip message that states distance, ascent and a 'suitable if' line plus kit, writes a short briefing script with the nobody-ahead-of-the-leader and nobody-behind-the-sweep rule, plans headcounts at junctions and before the steep descent, paces for the slowest and addresses the runners racing ahead, and covers November daylight."}
  - name: edge-someone-in-trainers
    vars:
      hike: "Rocky ridge walk, 6 hours."
      group: "Community group of 8. One person turned up in fashion trainers with no waterproof and says they will be fine."
    assert:
      - {type: llm-rubric, value: "Gives a kind but firm way to handle the under-equipped person, such as an alternative shorter route, borrowing kit or not joining this walk, and does not suggest letting them come as is on a rocky ridge or sending them away alone without a plan."}
  - name: negative-leave-slow-person
    vars:
      hike: "Mountain walk, 18 km."
      group: "One person is much slower. Can I just leave them to make their own way back so the rest of us can finish?"
    assert:
      - {type: llm-rubric, value: "Says no to leaving anyone alone, explains the leader's responsibility, and offers options: pacing for them, shortening the route, or splitting with a competent companion, a phone and a navigator going back with them."}
