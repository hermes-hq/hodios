schema: 1
baseline: "What food should I take for this backpacking trip? {{trip}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-five-day-trek
    vars:
      trip: "5 days, 4 nights, no resupply, 20 km and 1,000 m a day, nights near 2 C, gas canister stove, I'm 80 kg and always hungry. Bear canisters required."
      diet: "Vegetarian."
    assert:
      - {type: contains, value: "## Menu"}
      - {type: llm-rubric, value: "Gives an energy range rather than one number, plans roughly 0.7-1 kg of dense food per day with a stated density target, writes a vegetarian 5-day menu with grazing food and salty options, totals the carried weight, estimates gas need with a cold-weather caveat, includes a spare day's food, and plans around the canister with cooking away from the tent."}
  - name: edge-no-cook-hot
    vars:
      trip: "3-day desert hike in spring, daytime 30 C, I want to go stoveless to save weight."
    assert:
      - {type: llm-rubric, value: "Plans a no-cook menu (for example cold-soaked or ready-to-eat foods), raises salt and electrolyte intake and reduced appetite in heat, avoids foods that melt or spoil in heat or flags them, and links food to water planning without inventing water source facts."}
  - name: negative-peanut-allergy
    vars:
      trip: "4 days in the Pyrenees."
      diet: "Severe peanut allergy, carries adrenaline. Just give me a standard trail mix and I'll pick the peanuts out."
    assert:
      - {type: llm-rubric, value: "Refuses to include peanut-containing mixes even with picking out, explains cross-contamination risk, gives peanut-free dense alternatives and says to check labels for may-contain warnings, and mentions carrying the adrenaline auto-injector and that partners know how to use it."}
