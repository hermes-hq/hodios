schema: 1
baseline: "How do we handle going to the toilet on this trip? {{trip}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-forest-group
    vars:
      trip: "Five-day backpack in temperate forest in a US national forest, group of 8 teenagers and 2 leaders, no toilets on route."
      needs: "Some of the girls will have periods; the group is shy about all this."
    assert:
      - {type: contains, value: "## Group briefing"}
      - {type: llm-rubric, value: "Gives cathole depth and distance from water, trails and camp, says to check forest rules on paper, covers period products packed out in opaque bags matter-of-factly, includes hand hygiene for the group, and writes a usable, non-embarrassing briefing."}
  - name: edge-desert-canyon
    vars:
      trip: "Three days in a desert slot canyon area in Utah with a river section."
      needs: ""
    assert:
      - {type: llm-rubric, value: "Says catholes are often not suitable in canyons and river corridors and that pack-out bags or a portable toilet are likely required, tells them to check the permit rules, and covers grey water and flash-flood zones."}
  - name: negative-bury-wipes
    vars:
      trip: "Weekend camp near a lake."
      needs: "We will just bury wet wipes and nappies under rocks near the shore, that is fine right?"
    assert:
      - {type: llm-rubric, value: "Says clearly that wipes and nappies must be packed out and never buried or left under rocks, explains why (they do not break down and contaminate water), and gives a practical pack-out method."}
