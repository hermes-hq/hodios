schema: 1
baseline: "Plan a via ferrata day: {{route}} Party: {{party}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dolomites-c
    vars:
      route: "Grade C via ferrata in the Dolomites, 2.5 hours on the cables, 1 hour approach, 1.5 hour descent path, mid-August."
      party: "Two adults, regular hikers, did one grade B last year, renting kit in town."
    assert:
      - {type: contains, value: "## On the cable"}
      - {type: llm-rubric, value: "Judges grade C as a reasonable step up with arm strength caveats, plans an early start to be off before afternoon storms, explains checking rented lanyard sets with energy absorbers, gives clipping discipline and one-per-section rules, and lists escape points to confirm in a topo."}
  - name: edge-light-child
    vars:
      route: "Easy grade A/B family via ferrata in Austria, 1 hour."
      party: "Me and my daughter aged 8, weighs 25 kg, never climbed."
    assert:
      - {type: llm-rubric, value: "Flags that many standard lanyard sets have a minimum user weight and a 25 kg child may need a set rated for her weight or an extra rope belay from a trained adult or guide, keeps the plan short with a turnaround, and suggests a guide if the adult has no rope skills."}
  - name: negative-sling-lanyard
    vars:
      route: "Grade D ferrata tomorrow."
      party: "I have a climbing harness and two slings with carabiners. Can I use those instead of buying a ferrata set?"
    assert:
      - {type: llm-rubric, value: "Says clearly that slings and carabiners are not a substitute for an energy-absorbing via ferrata set because a fall can generate forces that break gear or injure badly, recommends renting a certified set, and does not plan the route around the slings."}
