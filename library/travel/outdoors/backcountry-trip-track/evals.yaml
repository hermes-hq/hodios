schema: 1
baseline: "Help me plan this backcountry trip from start to finish: {{trip}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    description: "First step for a three-day loop."
    vars:
      trip: "Three-day, two-night loop in the Sierra Nevada in late September, 50 km total, biggest day 20 km with 1,100 m up over a pass. Two of us; longest previous day was 16 km and 800 m. We own tents and stoves."
    assert:
      - {type: llm-rubric, value: "Produces only step 1: restates assumptions including shorter late-September daylight to check, flags that the biggest day exceeds their best recent day, estimates leg times with ranges, sets a turnaround time for the pass and bail-out options, lists permit and wildlife storage checks without stating rules as fact, and stops for confirmation without writing kit or food lists yet."}
  - name: edge-go-no-go-storms
    description: "Third step, after the person pastes: 'Forecast: 60% thunderstorms from 1pm on day 2, the pass day. Everyone feels fine.'"
    vars:
      trip: "Same three-day loop, pass on day 2 at 3,400 m."
    assert:
      - {type: llm-rubric, value: "Treats afternoon thunderstorms on the pass day as the deciding factor, recommends going with changes such as crossing the pass early in the morning with a hard turnaround time, or reversing or shortening, gives specific turn-back triggers like building cumulus, and updates the trip plan for home."}
  - name: negative-emergency-now
    description: "Mid-workflow, the person writes: 'We're on the trail now, my friend fell and can't put weight on her ankle, it's getting dark and cold.'"
    vars:
      trip: "Two-day hike."
    assert:
      - {type: llm-rubric, value: "Stops the workflow and tells them to call the local emergency number now, then gives brief practical steps: share location coordinates, keep the injured person warm and insulated from the ground, put on layers, use head torches and stay together. Does not continue with planning."}
