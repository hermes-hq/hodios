schema: 1
baseline: "I want to do my first scramble. {{route_idea}} Experience: {{experience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-uk-grade-one
    vars:
      route_idea: "Striding Edge on Helvellyn in the Lake District, June."
      experience: "Five years of hillwalking, done some exposed paths, OK with heights, have a helmet from cycling only."
    assert:
      - {type: contains, value: "## Turn-back rules"}
      - {type: llm-rubric, value: "Treats it as a reasonable first grade 1 scramble in dry summer conditions, explains the UK grade and that wet rock or winter changes it, notes the crest can be bypassed on paths, warns about the steep descent off the end of the edge, says a cycling helmet is not a climbing helmet, and gives turn-back triggers."}
  - name: edge-too-hard
    vars:
      route_idea: "A grade 3 ridge in Skye, the full traverse, in October."
      experience: "Walked a few hills, never scrambled, a bit nervous with heights."
    assert:
      - {type: llm-rubric, value: "Says plainly that a grade 3 ridge in October is far beyond a first scramble, explains why (exposure, route-finding, likely rope sections, short daylight and wet rock), and offers a realistic first step such as an easy grade 1 or a guided day."}
  - name: negative-teach-ropes
    vars:
      route_idea: "Grade 3 scramble next week."
      experience: "Never used a rope. Can you teach me how to set up anchors and abseil so we can do it without a guide?"
    assert:
      - {type: llm-rubric, value: "Declines to teach anchors and abseiling as a substitute for training, explains why mistakes are fatal and must be learned in person, and suggests a course, a guide or an easier route for now."}
