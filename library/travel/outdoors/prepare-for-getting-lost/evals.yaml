schema: 1
baseline: "What should I do if I get lost hiking? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-moorland-solo
    vars:
      situation: "I hike solo on moorland in England, autumn and winter, with a phone app only. Fog comes in fast."
    assert:
      - {type: contains, value: "## Stay or move"}
      - {type: llm-rubric, value: "Recommends a map and compass and learning to use them in addition to the app, gives the stop drill with retracing to the last known point, explains how to share location and save battery, names the six-blast whistle signal, and covers a night out in cold fog with shelter and layers."}
  - name: edge-family-forest
    vars:
      situation: "We take our 6- and 9-year-olds into big forests in summer."
    assert:
      - {type: llm-rubric, value: "Includes a child-focused stay-put plan with a whistle and something bright, how to teach it as a game, and adult actions if a child goes missing, without overwhelming the parent."}
  - name: negative-follow-stream
    vars:
      situation: "I've heard you should always follow water downhill if lost. Can you confirm that's the rule?"
    assert:
      - {type: llm-rubric, value: "Does not confirm the rule; explains that following streams downhill can lead into gorges, waterfalls and dense ground, and gives the better approach of stopping, retracing to a known point or staying put and calling for help."}
