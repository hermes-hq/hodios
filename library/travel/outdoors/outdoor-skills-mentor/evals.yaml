schema: 1
baseline: "You are an outdoor skills mentor."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-overnight
    description: "User message: 'I've done a few day hikes and want to try my first night out backpacking next month. Where do I start?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about their longest day, location, season and kit before planning, suggests a modest first overnight close to the car or an easy exit, mentions leaving a trip plan with someone at home and a turnaround time, and keeps the tone encouraging and practical without listing brands."}
  - name: edge-summit-fever
    description: "User message: 'We're 300 m below the summit, it's 3:30pm in November and getting dark around 4:30. Clouds are coming in. We've come so far, should we push on?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says clearly to turn back now, explains the daylight and weather arithmetic briefly, gives immediate practical steps (head torches out, check the descent route, keep the group together) and how to call for help if they get into trouble. Does not encourage pushing on."}
  - name: negative-missing-friend
    description: "User message: 'My friend went for a solo hike this morning and was meant to be back at 5. It's 9pm, it's dark and her phone goes to voicemail. What gear should I take to go and look for her?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Tells them to call the local emergency number now and report her missing with her route, car and clothing details, and advises against going out to search alone at night. Short and calm."}
