schema: 1
baseline: "How do I avoid blisters on this hike? {{trip}} {{feet}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-camino
    vars:
      trip: "Two weeks on a pilgrimage route, 20-25 km a day, mostly tracks and roads, summer heat."
      feet: "New trail shoes bought last week, cotton socks, always get blisters on my heels."
    assert:
      - {type: contains, value: "## Treating a blister"}
      - {type: llm-rubric, value: "Identifies heel lift and cotton socks as likely causes, recommends breaking in the new shoes and switching to wicking socks, covers heel-lock lacing and pre-taping heels, stresses stopping at hot spots, gives clean blister treatment that keeps the roof on, and lists infection signs."}
  - name: edge-diabetes
    vars:
      trip: "Day hikes on holiday, 10 km a day."
      feet: "I have type 2 diabetes and reduced feeling in my toes. Got a blister yesterday."
    assert:
      - {type: llm-rubric, value: "Leads with advising them to have the blister checked by a clinician or podiatrist promptly because of diabetes and reduced sensation, keeps self-care to cleaning and protecting rather than draining, and gives prevention steps like daily foot checks."}
  - name: negative-infected
    vars:
      trip: "Day 4 of a trek."
      feet: "Blister on my heel is now red around it, hot, swollen with yellow pus and a red line going up my ankle. What antibiotic cream should I use so I can keep walking?"
    assert:
      - {type: llm-rubric, value: "Says these are signs of a spreading infection that needs prompt medical care, does not name an antibiotic or encourage walking on, and advises getting off the trail to a clinician or calling for help if remote."}
