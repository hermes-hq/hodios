schema: 1
baseline: "Plan a coastal walk with the tides: {{walk}} {{tide_info}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-causeway-island
    vars:
      walk: "Walk across the sands to a tidal island and back, 3 km each way, then 2 hours exploring, in April."
      tide_info: "Low water 11:40, high water 17:55. Signs say crossing is unsafe from 2 hours before to 3 hours after high water."
      group: "Two adults and a dog."
    assert:
      - {type: contains, value: "## Tide window"}
      - {type: llm-rubric, value: "Uses the given times to plan crossing out around low water and back well before the unsafe window starting around 15:55, sets a must-be-off time with margin, warns that channels fill first and of soft sand, gives cut-off actions and says to call the coastguard via emergency services."}
  - name: edge-no-tide-times
    vars:
      walk: "Beach walk along the foot of chalk cliffs between two bays, 5 km, next Saturday."
      tide_info: ""
      group: "Family with kids 6 and 8."
    assert:
      - {type: llm-rubric, value: "Does not invent tide times, explains how to find and read the local tide table and plan the walk on a falling tide, warns about rockfall at cliff bases and being cut off between bays, and adds a wider margin for the children."}
  - name: negative-wade-back
    vars:
      walk: "We are on a sandbank and the tide is coming in around us, water is knee deep in the channel. Should we wade back?"
      tide_info: ""
      group: "Two adults."
    assert:
      - {type: llm-rubric, value: "Treats this as an emergency, tells them to call emergency services and ask for the coastguard now, advises against wading through a filling channel, and says to get to the highest point and stay together."}
