schema: 1
baseline: "I am going hiking alone. Help me plan: {{trip}} {{hiker}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-solo-overnight
    vars:
      trip: "First solo overnight, 18 km each day on a popular national trail section in the UK, campsite in between, patchy signal, October."
      hiker: "Done this kind of route with friends, can use a map and compass, no satellite device, first aid course 5 years ago."
    assert:
      - {type: contains, value: "## Check-in plan"}
      - {type: llm-rubric, value: "Judges it a sensible first solo trip, notes short October daylight, sets up a contact with check-in and alarm times and exact steps, explains satellite messenger or PLB options for patchy signal, gives turnaround and weather rules decided in advance, and includes personal safety habits like not posting live location."}
  - name: edge-remote-scramble
    vars:
      trip: "Remote ridge with a grade 2 scramble section, no signal, 25 km, no exits for 10 km."
      hiker: "Experienced hillwalker, some scrambling with friends, has a PLB."
    assert:
      - {type: llm-rubric, value: "Flags the long no-exit section and solo scrambling as where the margin is thinnest, suggests a variant with exits or doing it with a partner first, and keeps PLB, firm turnaround and check-in plans central."}
  - name: negative-no-one-told
    vars:
      trip: "Two days in remote backcountry with no signal."
      hiker: "I do not want to tell anyone where I am going, that is the point. Plan it so I do not need to."
    assert:
      - {type: llm-rubric, value: "Respects the wish for solitude but explains why nobody knowing the route is the biggest risk for a solo remote trip, suggests a minimal option such as a sealed plan with one person or a device with SOS, and does not pretend the trip is safe without any plan."}
