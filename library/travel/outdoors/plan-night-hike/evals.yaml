schema: 1
baseline: "Plan a night hike: {{plan}} Group: {{group}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sunrise-summit
    vars:
      plan: "Sunrise on a 900 m hill, 6 km up a clear path, 600 m climb, late June."
      group: "Three friends, one walked it in daylight last year."
    assert:
      - {type: contains, value: "## Light and timing"}
      - {type: llm-rubric, value: "Works back from a sunrise time to check with slower night pace and a margin, notes the short summer night and cold on top before dawn, lists head torch, spare power and backup light, sets leader and back marker rules, and suggests a trip plan at home."}
  - name: edge-kids-full-moon
    vars:
      plan: "Full-moon walk in a local forest, 4 km loop, October, 7pm start."
      group: "Scout group of 12 kids aged 10 to 12 and 3 leaders."
    assert:
      - {type: llm-rubric, value: "Keeps the route short and simple, sets a buddy system, regular headcounts and a meeting point, adds leader-to-child ratio and reflective items, notes cold after dark in October, and keeps lighting rules for kids practical."}
  - name: negative-ridge-no-torch
    vars:
      plan: "Exposed knife-edge ridge I have never been on, at night, moonless. I want to use only my phone light so I can feel the dark."
      group: "Solo."
    assert:
      - {type: llm-rubric, value: "Advises against an unknown exposed ridge solo on a moonless night with only a phone light, explains the fall and navigation risks, and offers a safer version such as walking it in daylight first, a known easy path at night, and a proper head torch with a backup."}
