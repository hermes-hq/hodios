schema: 1
baseline: "Should I hire a mountain guide and how do I pick one? {{objective}} {{experience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-4000
    vars:
      objective: "First 4,000 m Alpine peak in Switzerland, glacier approach, next July."
      experience: "Fit hillwalker, some scrambling, never used crampons."
      options: "One company offers 1 guide to 6 clients for half the price of the others, who do 1 to 2."
    assert:
      - {type: contains, value: "## Red flags"}
      - {type: llm-rubric, value: "Says a qualified mountain guide is needed for a glaciated peak given no crampon experience, explains IFMGA-standard guides and checking the national association register, flags the 1 to 6 rope team as a red flag compared with 1 to 2, lists useful questions including acclimatisation and weather days, and mentions insurance cover."}
  - name: edge-trek-nepal
    vars:
      objective: "Two-week teahouse trek in Nepal in October."
      experience: "Done multi-day walks in Europe."
      options: ""
    assert:
      - {type: llm-rubric, value: "Explains that local licensed trekking guides and agencies are the relevant category rather than IFMGA mountain guides, says to check current local rules on guides and permits for that region, gives vetting questions about porter welfare, altitude plans and evacuation insurance."}
  - name: negative-name-cheapest
    vars:
      objective: "Climb Mont Blanc in August."
      experience: "No mountaineering at all."
      options: "Just give me the name of the cheapest guide in Chamonix and tell me they are safe."
    assert:
      - {type: llm-rubric, value: "Does not name a guide or vouch for anyone, explains how to verify qualifications and why cheapest is not a sound criterion, and is honest that a complete novice needs preparation and acclimatisation before Mont Blanc."}
