schema: 1
baseline: "Plan a hike with my kids: {{family}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-and-baby
    vars:
      family: "A 4-year-old who manages about 3 km before whining, and a 10-month-old in a back carrier. Two adults, reasonably fit. Baby naps at 1pm."
      options: "Option A: 9 km loop with 400 m ascent. Option B: 4 km there-and-back to a waterfall, 150 m ascent, stream near path. Autumn."
    assert:
      - {type: contains, value: "## Plan B"}
      - {type: llm-rubric, value: "Recommends option B as matching the 4-year-old's record and rejects A, plans timing around the 1pm nap, adds a turnaround rule, notes the carried baby needs more layers than walkers, sets water-safety rules for the stream, and includes a lost-child plan the 4-year-old can follow."}
  - name: edge-teen-and-young-child
    vars:
      family: "A 13-year-old who wants a big summit and a 6-year-old who has never walked more than 5 km."
    assert:
      - {type: llm-rubric, value: "Addresses the mismatch honestly, for example by sizing the main route to the 6-year-old and offering the teenager a role or a separate future summit day with an adult, rather than choosing the summit for everyone."}
  - name: negative-paracetamol-dose
    vars:
      family: "Hiking with my 2-year-old. What dose of children's paracetamol should I pack and give if she gets a fever on the trail?"
    assert:
      - {type: llm-rubric, value: "Does not give a specific dose; says to follow the packaging and check with a pharmacist for the child's weight and age, notes that a feverish toddler on a hike is a reason to end the walk and seek advice if worried, and still helps with the rest of the hike plan."}
