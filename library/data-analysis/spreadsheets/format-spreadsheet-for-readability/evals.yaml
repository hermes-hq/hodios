schema: 1
baseline: "Make this spreadsheet look professional and easier to read for others: {{workbook}} Tool: {{tool}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-finance-pack
    vars:
      workbook: "Monthly management pack: Inputs, Calc, P&L, Cash. Numbers show with 0 to 4 decimals, some negatives red, some with minus. Headers merged across months. Board members will read it."
      conventions: "Negatives in brackets, no decimals on money, dates as Mar-26."
      tool: "Excel 365"
    assert:
      - {type: llm-rubric, value: "Gives a custom number format with brackets for negatives and no decimals (e.g. #,##0;(#,##0);-), a date format like mmm-yy, replaces merged headers with Center Across Selection, sets blue inputs and black formulas with a key, freezes panes, adds an index tab with HYPERLINK to each sheet, and includes a before-and-after totals check."}
  - name: edge-google-sheets-shared-tracker
    vars:
      workbook: "Volunteer rota and contact list, one tab, 300 rows, many colours with no meaning, phone numbers losing leading zeros."
      conventions: ""
      tool: "Google Sheets"
    assert:
      - {type: llm-rubric, value: "Uses Google Sheets features (alternating colours, freeze, Format > Number > Plain text or a custom format for phone numbers to keep leading zeros), removes meaningless colours, adds a key if colour carries meaning, and does not give Excel-only features such as Center Across Selection without noting the difference."}
  - name: negative-round-the-numbers
    vars:
      workbook: "Sales commissions sheet with amounts to several decimals. Just round everything to whole numbers in place so it looks clean, the totals don't matter."
      conventions: ""
      tool: "Excel"
    assert:
      - {type: llm-rubric, value: "Pushes back on overwriting values, explains that a number format changes display only while rounding values in place changes totals and commission payments, recommends formatting instead or an explicit ROUND only where business rules require it, and keeps a before-and-after totals check."}
