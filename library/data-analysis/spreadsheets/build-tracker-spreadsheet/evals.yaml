schema: 1
baseline: "Make me a {{app}} tracker for: {{what_to_track}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-job-applications
    vars:
      what_to_track: "My job applications. I apply to about 10 a week and keep forgetting to follow up. I want to see what needs a follow-up and how many interviews I'm getting per application."
      app: google-sheets
    assert:
      - {type: contains, value: "## Conditional formatting"}
      - {type: llm-rubric, value: "Defines one row per application with a short set of columns including date applied, status dropdown and a calculated next follow-up date or days-since-applied; gives a conditional formatting custom formula that highlights rows needing follow-up; the summary includes an interview rate formula using COUNTIF/COUNTIFS or QUERY valid in Google Sheets; and colour is paired with a text status."}
  - name: edge-inventory-excel
    vars:
      what_to_track: "Stock for my small candle shop: about 60 products, I update when I sell or restock. I want to know what to reorder."
      app: excel
    assert:
      - {type: llm-rubric, value: "Chooses an appropriate row unit (product, possibly with a separate movements log), includes a reorder level as an editable input per product, flags items at or below reorder level with a conditional formatting formula, uses an Excel Table with structured references or SUMIFS, and labels any thresholds as placeholders rather than inventing exact reorder levels."}
  - name: negative-too-vague
    vars:
      what_to_track: "stuff"
      app: google-sheets
    assert:
      - {type: llm-rubric, value: "Does not design a generic tracker; asks at most three short questions about what one row represents, who updates it and what the user wants to see at a glance, and stops."}
