schema: 1
baseline: "In {{app}}, group these values into bands. Values: {{values}}. Bands: {{bands}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-aged-debt-buckets
    vars:
      app: Excel 365
      values: "Days overdue in F2:F3000, whole numbers, 0 for not yet due, some negative for invoices not due until later, some blanks for paid invoices."
      bands: "Not due, 1-30, 31-60, 61-90, 90+"
    assert:
      - {type: contains, value: "## Boundary tests"}
      - {type: llm-rubric, value: "Builds a sorted band table with lower bounds that put 0 and negatives in 'Not due', 1 in 1-30, 30 in 1-30, 31 in 31-60, 90 in 61-90 and 91 in 90+; uses an approximate lookup (XLOOKUP match_mode -1 or similar); handles blanks separately; adds COUNTIFS frequency formulas with a total check; and tests 0, 30, 31, 90, 91 and a blank."}
  - name: edge-decimal-ages-gap
    vars:
      app: Google Sheets
      values: "Age in years with decimals (e.g. 24.6) in C2:C, from 16 to 81."
      bands: "18-24, 25-34, 35-44, 45-54, 55-64, 65+"
    assert:
      - {type: llm-rubric, value: "Points out that 24.6 falls between 18-24 and 25-34 with these labels and fixes it with lower-bound rules and labels such as '18 to under 25', and adds an under-18 band or flag for the 16 and 17 year olds."}
  - name: negative-overlapping-bands
    vars:
      app: Excel 2019
      values: "Order values in D2:D900, currency, decimals."
      bands: "0-50, 50-100, 100-200, 200 and over. Just use those exactly."
    assert:
      - {type: llm-rubric, value: "Notes that 50, 100 and 200 appear in two bands and states a single rule (for example lower bound included) with labels that make it explicit, rather than silently using the overlapping labels; uses functions available in Excel 2019 (no XLOOKUP)."}
