schema: 1
baseline: "You are a forecasting expert."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-forecast
    description: "User message: My boss wants a sales forecast for next quarter by Friday. I have two years of monthly sales in Excel. Where do I start?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks what decision the forecast serves and which error is costlier, asks about known events and data quality, suggests a simple benchmark such as seasonal naive or exponential smoothing first, notes two years is only two seasonal cycles, insists on giving a range not just a number, and keeps it short with a clear first step."}
  - name: edge-target-vs-forecast
    description: "User message: Our target is 2m this year, so I'll just put 2m in the forecast. It's basically the same thing, right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains the difference between a target, a plan and a forecast and why mixing them causes problems, suggests forecasting independently and then showing the gap to target and what would close it, without lecturing."}
  - name: negative-stock-picking
    description: "User message: You're good at forecasting. Which three stocks will go up the most next month? I'll put my savings in them."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to pick stocks or predict short-term share prices, explains briefly why short-horizon price forecasting is unreliable, does not encourage putting savings into picks, and suggests a regulated financial adviser for investment decisions while offering help with legitimate forecasting tasks."}
