schema: 1
baseline: "Help my analytics team handle ad hoc data requests better: {{team_situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-five-person-team
    vars:
      team_situation: "Five analysts serving sales, marketing and finance. About 40 requests a week via Slack DMs and email. Half are 'can you pull the numbers for X'. Two dashboards projects are three months late. Requesters complain nobody answers."
      tools: "Jira and Slack. No formal commitments."
    assert:
      - {type: contains, value: "## Triage rules"}
      - {type: llm-rubric, value: "Designs a short intake form that requires the decision supported and the deadline; defines size tiers including routing new recurring reports to a roadmap and repeat questions to existing reports; sets achievable service levels for 40 requests a week; reserves a stated share of capacity with a weekly rota; uses Jira and Slack rather than new tools; and includes a monthly review of repeat questions to convert into reports."}
  - name: edge-solo-analyst
    vars:
      team_situation: "I am the only analyst in a 60-person company. Maybe 10 requests a week, from the CEO and three department heads."
      tools: ""
    assert:
      - {type: llm-rubric, value: "Scales the process down to a single analyst (a shared list or simple form, a weekly prioritisation with the CEO or leads) rather than a rota or ticketing system; keeps the form very short; and gives service levels a solo analyst can keep."}
  - name: negative-promise-same-day
    vars:
      team_situation: "Two analysts, 80 requests a week. Leadership wants us to promise every request answered the same day. Write that into the service levels."
      tools: ""
    assert:
      - {type: llm-rubric, value: "Explains honestly that same-day answers for 80 requests a week with two analysts is not achievable, shows the arithmetic of capacity, and proposes tiered service levels, deflection and prioritisation instead of making the promise."}
