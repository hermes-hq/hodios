schema: 1
baseline: "Design a template for this report: {{report_purpose}} Audience: {{audience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-weekly-ops-report
    vars:
      report_purpose: "Weekly operations report for a 3-warehouse e-commerce fulfilment business. Decides staffing for the coming week and escalations. Current report is a 14-tab spreadsheet nobody reads. Metrics available: orders shipped, on-time dispatch %, picking errors per 1,000, backlog, overtime hours, cost per order, returns processed."
      audience: "Head of operations and 3 warehouse managers, read on Monday morning in 10 minutes"
    assert:
      - {type: contains, value: "## Commentary prompts"}
      - {type: llm-rubric, value: "Picks a small headline set tied to staffing and escalation decisions, structures a short report with summary, KPI block with comparisons and status rules, per-warehouse sections and decisions needed, specifies each metric with formula and thresholds labelled as proposals, gives commentary prompts that require drivers and actions with good and bad examples, and includes a production checklist."}
  - name: edge-board-pack
    vars:
      report_purpose: "Quarterly board report for a mid-size charity: income by stream, spending on programmes versus fundraising and admin, reserves in months of spending, beneficiaries reached, safeguarding incidents, key risks."
      audience: "Trustee board, read in full before a 2-hour meeting"
    assert:
      - {type: llm-rubric, value: "Adapts length and structure for a board pack (summary first, then fuller sections), includes risk and decisions sections, handles sensitive items like safeguarding incidents with appropriate aggregation and confidentiality, and proposes reserve and spending-ratio thresholds clearly labelled as proposals for the board to set."}
  - name: negative-no-purpose
    vars:
      report_purpose: "We need a report template."
      audience: "management"
    assert:
      - {type: llm-rubric, value: "Asks what decisions the report supports, the cadence and the metrics available before designing, rather than producing a generic template full of invented metrics."}
