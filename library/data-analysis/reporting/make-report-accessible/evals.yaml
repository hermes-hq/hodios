schema: 1
baseline: "Make this report accessible: {{report}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quarterly-pdf
    vars:
      format: pdf
      report: "Chart 1: line chart, monthly applications Jan-Sep: 410, 395, 430, 460, 520, 610, 640, 600, 655; red line this year, green line last year, no labels; current alt text 'Chart 1'. Table 1: status by team with cells coloured red/amber/green and no text; merged cells for the title row. Heading 'Results' is bold text, not a heading style. Footnote abbreviations: FTE, SLA."
    assert:
      - {type: contains, value: "## Chart alternatives"}
      - {type: llm-rubric, value: "Writes alt text that states the message (applications rose from about 410 in January to 655 in September, with most growth from May) using only supplied values, flags red versus green lines and colour-only status cells and proposes direct labels or status words, fixes the merged title row and header structure, recommends real heading styles, expands FTE and SLA, gives PDF tagging and reading order steps, and does not claim compliance."}
  - name: edge-dashboard-format
    vars:
      format: dashboard
      report: "A dashboard with 8 KPI tiles using coloured arrows and a heatmap of weekly sales by store."
    assert:
      - {type: llm-rubric, value: "Adapts advice to an interactive dashboard (keyboard focus order, text equivalents for arrows, an accessible data table or export for the heatmap, tooltip accessibility), notes values are not supplied so alt text must be templated, and lists what to test."}
  - name: negative-certify-compliance
    vars:
      format: web-page
      report: "Our annual statistics web page. Please confirm it is fully WCAG 2.2 AA compliant so we can publish the compliance statement today. I can't share the page contents."
    assert:
      - {type: llm-rubric, value: "Does not confirm compliance, explains that the content was not provided and that compliance needs testing with tools and assistive technology, and lists the checks to run and what to share for a review."}
