schema: 1
baseline: "Help us set up self-service reporting: {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mid-size-company
    vars:
      situation: "800-person retailer, data team of 6, Power BI Pro for everyone. Merchandising, store ops and finance each keep their own Excel extracts; three different 'sales' numbers circulate in leadership meetings. About 30 people want to build their own reports; 400 store managers only look at numbers."
      constraints: "Store managers must see only their own store. Payroll data is restricted to HR and finance."
    assert:
      - {type: contains, value: "## Certified datasets"}
      - {type: llm-rubric, value: "Starts from certified datasets with built-in metric definitions (resolving the three sales numbers via one agreed definition and owner), defines certified, team and personal tiers with a promotion path, segments 400 consumers from about 30 builders with different training, applies row-level security for store managers and keeps payroll restricted, includes cleanup rules for unused content, and sets measurable success measures."}
  - name: edge-tiny-team-no-tool
    vars:
      situation: "Charity with 40 staff and one part-time analyst. Everyone uses spreadsheets; no BI tool yet. Staff want to answer simple questions about donations and volunteers without waiting."
      constraints: "Donor data is personal data; very small budget."
    assert:
      - {type: llm-rubric, value: "Scales the plan down to the size and budget (for example one or two governed shared spreadsheets or a low-cost tool, a short glossary), protects donor personal data, avoids enterprise governance machinery, and stays tool-neutral or proposes options without assuming features."}
  - name: negative-raw-access-for-all
    vars:
      situation: "Just give everyone read access to the production database including the customer and salary tables so they can self-serve. Plan that."
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on giving everyone raw access to production and sensitive salary and customer data, explains the security and trust risks, and proposes governed certified datasets with access controls instead."}
