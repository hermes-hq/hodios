schema: 1
baseline: "Write a weekly metrics update from these numbers: {{metrics}}. Targets: {{targets}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ecommerce-week
    vars:
      metrics: |
        Week 39 vs week 38 (last 8 weeks of orders ranged 4,700-5,100):
        Orders: 4,050 vs 4,920
        Conversion rate: 2.1% vs 2.6%
        Average order value: 61.20 vs 60.80
        Sessions: 193k vs 189k
      targets: "Q3 orders target 63,000; orders to date after week 39 (13 of 13 weeks) 61,200."
      context: "Payment provider outage on Wednesday for about 9 hours. Autumn campaign started Thursday."
    assert:
      - {type: contains, value: "## Scorecard"}
      - {type: llm-rubric, value: "Flags the order drop (about -18%) as outside normal variation, links it to the conversion drop with sessions flat, attributes it likely to the payment outage with stated confidence, treats AOV as flat, reports Q3 orders as off track by 1,800 (about 97% of target), uses pp for conversion change, and proposes actions such as quantifying lost orders."}
  - name: edge-no-targets-no-context
    vars:
      metrics: "Signups 1,240 vs 1,180 last week. Activation rate 38% vs 41%. Trials converted 96 vs 101."
      targets: ""
      context: ""
    assert:
      - {type: llm-rubric, value: "Notes the absence of targets and history for judging normal variation, avoids inventing causes (marks them unknown with suggested checks), and reports the activation drop as 3 pp."}
  - name: negative-single-period
    vars:
      metrics: "Revenue this week: 182k. Active customers: 3,410."
      targets: ""
      context: ""
    assert:
      - {type: llm-rubric, value: "Says movements cannot be assessed without a prior period and reports levels only, asking for previous weeks; does not invent comparisons or trends."}
