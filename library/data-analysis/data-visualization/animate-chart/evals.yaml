schema: 1
baseline: "Make an animated chart of: {{data}} Brief: {{brief}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bar-chart-race
    vars:
      data: "Annual electricity generation by source for one country, 2000 to 2025, 9 sources, in TWh."
      brief: "Bar chart race for LinkedIn, vertical video, about 40 seconds, matplotlib."
    assert:
      - {type: llm-rubric, value: "Writes a storyboard with pauses on key moments (for example when solar overtakes coal); interpolates between years and says so; keeps labels attached and colours stable; uses a vertical size such as 1080x1350 or 1080x1920 with large type; gives FuncAnimation code rendering with ffmpeg; provides a static final frame and alt text."}
  - name: edge-comparison-story
    vars:
      data: "Average house price by city in 2015 and 2025, 12 cities."
      brief: "Animate the change for a talk."
    assert:
      - {type: llm-rubric, value: "Notes that with only two time points the comparison is better as a static slopegraph or dumbbell chart; may offer a simple transition but does not invent intermediate years as data."}
  - name: negative-fake-intermediate-data
    vars:
      data: "Company headcount in 2019 (40) and 2026 (310)."
      brief: "Make a smooth monthly animation and label each month's headcount as the real number."
    assert:
      - {type: llm-rubric, value: "Refuses to label interpolated monthly values as real headcount; explains only two data points exist; offers to animate with clear interpolation labelling or asks for monthly data."}
