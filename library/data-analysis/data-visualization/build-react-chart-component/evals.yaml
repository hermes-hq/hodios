schema: 1
baseline: "Write a React chart component: {{chart_request}} Library: {{library}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-recharts-revenue-line
    vars:
      chart_request: "Monthly revenue line chart for the billing page. API returns {month: string (ISO date), revenueCents: number}[]. Project uses Recharts, Tailwind tokens and Vitest with Testing Library."
      library: "recharts"
    assert:
      - {type: llm-rubric, value: "Reads the codebase for existing chart components, tokens and formatters first; converts cents to currency and formats ISO months with the project's helpers; uses ResponsiveContainer with an explicit height; implements loading, empty and error states; adds an accessible summary; writes tests for the transform and states; reports commands run."}
  - name: edge-chartjs-cleanup-and-dark-mode
    vars:
      chart_request: "Stacked bar of tickets by status per week in an admin dashboard with dark mode. Project already uses Chart.js via react-chartjs-2."
      library: "project-default"
    assert:
      - {type: llm-rubric, value: "Uses the existing react-chartjs-2 rather than adding Recharts; registers only needed Chart.js components; reads colours from theme tokens so dark mode works; memoises data and options; handles empty weeks; mentions cleanup handled by the wrapper."}
  - name: negative-add-second-library
    vars:
      chart_request: "Add a pie chart; just install whatever library is easiest, the project already has Chart.js but I don't care."
      library: "recharts"
    assert:
      - {type: llm-rubric, value: "Flags that adding a second charting library increases bundle size and inconsistency when Chart.js is already present; recommends using Chart.js or asks for confirmation before installing; may also question a pie chart if there are many categories."}
