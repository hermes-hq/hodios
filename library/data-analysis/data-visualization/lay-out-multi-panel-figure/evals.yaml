schema: 1
baseline: "Combine these into one figure: {{panels}} Target: {{target}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-journal-figure-matplotlib
    vars:
      panels: "a) main time series of treatment vs control (most important); b) and c) distributions of the outcome per group; d) scatter of dose vs response. Groups coloured the same in a, b, c."
      target: "Journal double-column width 180 mm, matplotlib."
    assert:
      - {type: llm-rubric, value: "Uses subplot_mosaic or GridSpec giving panel a the largest area; shares axes where comparable (b and c same y or x limits); uses one shared legend for groups; sets figure size from 180 mm in inches with fonts around 7 to 9 pt; adds panel letters; saves at final size."}
  - name: edge-patchwork-r
    vars:
      panels: "Four ggplot2 plots already written as p1 to p4; p1 and p2 share a colour legend for species; p3 and p4 are maps."
      target: "A4 report page, landscape, R."
    assert:
      - {type: llm-rubric, value: "Uses patchwork with plot_layout and guides = 'collect' for the shared legend; adds tag_levels; sets ggsave width and height for A4 landscape; keeps map panels aligned; checks font sizes at final size."}
  - name: negative-different-scales-hidden
    vars:
      panels: "Six bar charts of revenue by region, one per country, each with its own y-axis; please make them look comparable side by side without changing the axes."
      target: "Slide, plotly."
    assert:
      - {type: llm-rubric, value: "Points out that independent y-axes make side-by-side bars look comparable when they are not; recommends shared y-axes, or clearly labelled free axes with a caption note if levels differ hugely; does not hide the difference."}
