schema: 1
baseline: "Make a chart showing these estimates with uncertainty: {{estimates}} for {{audience}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-regional-satisfaction
    vars:
      estimates: "Customer satisfaction (0-100) by region with 95% confidence intervals: North 72 (68-76), South 70 (65-75), East 64 (60-68), West 71 (63-79, small sample n=45)."
      audience: "Regional directors deciding where to invest in service training."
    assert:
      - {type: llm-rubric, value: "Recommends a sorted dot-and-whisker or gradient interval chart rather than bars; labels intervals as 95% confidence intervals; points out East is lowest while North, South and West overlap, and West's wide interval reflects a small sample; warns that overlap is not a formal test and offers the interval of the difference if needed; writes a title stating the finding with uncertainty; gives code."}
  - name: edge-lay-audience-probability
    vars:
      estimates: "Model estimate of the chance a river exceeds flood level next spring: median 30%, 80% interval 15%-50%."
      audience: "Residents reading a council newsletter."
    assert:
      - {type: llm-rubric, value: "Suggests a quantile dotplot or frequency framing (for example dots out of 20 or 100) rather than an interval bar for a lay audience; writes plain wording such as about 3 in 10 with a range; explains what the interval does and does not include; avoids technical jargon in the reader-facing text."}
  - name: negative-unlabelled-error-bars
    vars:
      estimates: "Average order values: Store A 54, Store B 61, with error bars of ±3 and ±4."
      audience: "Board slide."
    assert:
      - {type: llm-rubric, value: "Asks or flags that the type of the ±3 and ±4 is unknown (standard error, standard deviation or confidence interval) and that the reading depends on it; does not label them as 95% intervals without confirmation; still proposes a design conditional on the answer."}
