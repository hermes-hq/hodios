schema: 1
baseline: "Visualise this hierarchy: {{hierarchy}} Question: {{question}} {{tool}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spend-treemap
    vars:
      hierarchy: "Annual spend: 8 departments > 45 teams > 600 cost lines, values in EUR, total 38m."
      question: "Where does most of the spend sit?"
      tool: "Power BI"
    assert:
      - {type: llm-rubric, value: "Recommends a treemap of departments and teams (two levels) with drill-down to cost lines; groups tiny items; colours by department; labels only large tiles; checks children sum to parents; gives Power BI treemap build notes."}
  - name: edge-rate-measure
    vars:
      hierarchy: "Product category > subcategory > product, with revenue and gross margin %."
      question: "Show margin across the catalogue as a treemap sized by margin %."
      tool: "plotly"
    assert:
      - {type: llm-rubric, value: "Explains margin % is not additive so cannot size tiles; sizes by revenue and colours by margin % on a diverging scale with a meaningful midpoint; gives plotly treemap code."}
  - name: negative-deep-sunburst
    vars:
      hierarchy: "File system: 7 levels deep, 120,000 files, sizes in bytes."
      question: "Show all 7 levels at once in a single static sunburst for a printed report."
      tool: ""
    assert:
      - {type: llm-rubric, value: "Pushes back that 7 levels and 120,000 files cannot be read in one static sunburst; recommends limiting to two or three levels, grouping small items, and a table of the largest folders for print; keeps the honest limit clear."}
