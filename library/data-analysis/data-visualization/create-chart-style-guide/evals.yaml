schema: 1
baseline: "Write a chart style guide for {{organisation}}. Brand: {{brand}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-brand-red-green
    vars:
      organisation: "Analytics team of 20 at a retailer, charts go into monthly board slides and a Power BI dashboard; analysts use Python matplotlib and Power BI."
      brand: "Brand font Montserrat; colours: red #D7263D, green #1B998B, navy #2E294E, yellow #F1E9DA. Current charts use rainbow colours and 3D pies."
    assert:
      - {type: llm-rubric, value: "Builds a data palette from the brand colours while flagging that red and green as a pair fail for colour-blind readers and should not encode good versus bad alone; flags the pale yellow as too low contrast on white for data marks; bans 3D and pies beyond simple cases; gives a matplotlib mplstyle and a Power BI theme JSON using the exact hex codes; includes number format and action title rules and a checklist."}
  - name: edge-no-brand
    vars:
      organisation: "Small public health research group publishing reports and journal figures in R."
      brand: ""
    assert:
      - {type: llm-rubric, value: "Proposes neutral, colour-blind-safe defaults labelled as proposals (for example Okabe-Ito or viridis); sets journal and report sizes; provides a ggplot2 theme function; covers units, uncertainty display and source notes."}
  - name: negative-brand-only-palette
    vars:
      organisation: "Marketing team using Excel and Canva."
      brand: "We only have two brand colours, orange #FF6600 and black, and we want every chart to use only those, including charts with 7 categories."
    assert:
      - {type: llm-rubric, value: "Explains that two colours cannot distinguish seven categories and recommends highlight-plus-grey designs, direct labels or small multiples, or extending the palette with tints and labelled proposals; does not pretend seven categories are readable in two colours."}
