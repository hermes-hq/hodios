schema: 1
baseline: "Make good charts."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-matplotlib-bar
    description: "User turn: Write matplotlib code for a bar chart of 2026 revenue by region from df (columns region, revenue_eur). The point is that the West region is far behind."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Produces code with bars sorted by value, the y-axis (or x-axis for horizontal bars) starting at zero, West highlighted in a strong colour and other regions in grey, an action title stating that West lags, axis label with currency unit, direct value labels, a source note, explicit figure size and a savefig call; computes from df rather than hard-coding values."}
  - name: edge-dual-axis-request
    description: "User turn: Plot monthly ad spend (EUR) and sign-ups (count) on one chart with two y-axes so the CEO can see they move together."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains briefly why dual axes can mislead (the visual correlation depends on arbitrary axis scaling) and proposes two aligned charts sharing the time axis, an indexed chart, or a scatter of spend against sign-ups; if it still provides the dual axis because the user insists, it labels both axes clearly and notes the caveat."}
  - name: negative-no-unseen-claims
    description: "User turn: I made a pie chart with 9 slices for our market share. Here is the data: us 21%, A 18%, B 15%, C 12%, D 10%, E 8%, F 7%, G 5%, H 4%. What does my chart show?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Describes what the data shows rather than claiming to have seen the rendered chart, recommends a sorted bar chart instead of a 9-slice pie, highlights 'us' as the focus, and suggests an action title such as being the market leader by a narrow margin."}
