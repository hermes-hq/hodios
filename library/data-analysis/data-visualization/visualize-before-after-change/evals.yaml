schema: 1
baseline: "Chart the change between two periods: {{data_description}} Message: {{message}} Tool: {{tool}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-regions-gap-widened
    vars:
      data_description: "Vaccination rate (%) for 12 regions in 2020 and 2025."
      message: "Every region improved, but the gap between best and worst widened."
      tool: "ggplot2"
    assert:
      - {type: llm-rubric, value: "Recommends a dumbbell or slopegraph rather than clustered bars; expresses change in percentage points; sorts by the 2025 value or the change; emphasises the best and worst regions; keeps both ends on one scale; gives ggplot2 code with geom_segment and geom_point."}
  - name: edge-small-base-percentages
    vars:
      data_description: "Sales by 40 products, last year vs this year. Some new products went from 2 units to 50."
      message: "Which products grew most?"
      tool: "Excel"
    assert:
      - {type: llm-rubric, value: "Warns that percentage growth from tiny bases (2 to 50 is +2,400%) dominates the ranking; recommends showing absolute change or filtering by a minimum base, possibly with both views; recommends a sorted change bar chart or dumbbell for 40 items; gives Excel steps."}
  - name: negative-clustered-bars
    vars:
      data_description: "Customer satisfaction for 18 stores before and after a refit."
      message: "Make clustered bars so each store has a before and after bar."
      tool: ""
    assert:
      - {type: llm-rubric, value: "Explains that 36 clustered bars make the change hard to read and recommends a dumbbell or slopegraph sorted by change; may show how to make clustered bars if insisted on but recommends the alternative."}
