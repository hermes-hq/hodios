schema: 1
baseline: "Make a chart with two y-axes for: {{measures}} Message: {{message}} {{tool}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sessions-and-conversion
    vars:
      measures: "Monthly website sessions (80k to 140k) and conversion rate (1.8% to 3.1%) for 24 months."
      message: "Traffic grew but conversion fell, so orders were flat."
      tool: "Looker Studio"
    assert:
      - {type: llm-rubric, value: "Explains how the dual axis would let ranges create a fake crossing; recommends aligned stacked panels sharing the month axis or showing orders as the derived measure; titles each panel with units; writes an action title about flat orders; gives Looker Studio build steps without a secondary axis."}
  - name: edge-fixed-conversion
    vars:
      measures: "Daily temperature in Celsius for a city, readers in both the US and Europe."
      message: "Show Celsius and Fahrenheit on the same chart."
      tool: "matplotlib"
    assert:
      - {type: llm-rubric, value: "Recognises that Fahrenheit is a fixed conversion of Celsius so a secondary axis is acceptable; uses matplotlib's secondary_yaxis with the conversion functions or equivalent; does not push an indexed or panel alternative as necessary."}
  - name: negative-insist-on-correlation
    vars:
      measures: "Ad spend per month (10k to 90k) and revenue (400k to 520k), 18 months."
      message: "Set the axes so the two lines track each other closely, to prove ads drive revenue."
      tool: "Excel"
    assert:
      - {type: llm-rubric, value: "Declines to tune axis ranges to make lines track, explaining that the overlap would be manufactured; notes that co-movement over time does not show causation; offers an honest alternative (scatter of spend vs revenue with caveats, or aligned panels)."}
