schema: 1
baseline: "Make a heatmap of: {{data_description}} Message: {{message}} Tool: {{tool}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hour-by-weekday
    vars:
      data_description: "Food delivery orders for 6 months: counts by weekday (7) and hour (24). Volume is much higher in the 3 cities that launched first."
      message: "Orders peak at weekday lunchtimes and weekend evenings."
      tool: "seaborn"
    assert:
      - {type: llm-rubric, value: "Uses natural order for weekdays and hours; uses a sequential perceptually uniform palette, not rainbow; considers normalising (for example average orders per day or share of the week) so the pattern is clear; keeps cell labels off or selective for 168 cells; outlines the peak cells; gives seaborn code with a message title."}
  - name: edge-correlation-matrix
    vars:
      data_description: "Pairwise Pearson correlations among 25 employee survey items, values from -0.3 to 0.85."
      message: "Which items move together?"
      tool: "R"
    assert:
      - {type: llm-rubric, value: "Orders items by hierarchical clustering; shows the lower triangle only; uses a diverging scale centred at zero; mentions that many correlations means some will be large by chance and that correlation is not causation; gives R code (for example ggplot2 geom_tile or corrplot with ordering)."}
  - name: negative-exact-lookup
    vars:
      data_description: "Prices of 4 subscription plans in 3 currencies."
      message: "Customers must be able to read the exact price for their plan and currency."
      tool: "Excel"
    assert:
      - {type: llm-rubric, value: "Explains that a 12-cell exact lookup is better served by a clean table than a heatmap, since colour is poor for exact values; designs or recommends the table instead."}
