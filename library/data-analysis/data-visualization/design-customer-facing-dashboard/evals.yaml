schema: 1
baseline: "Design a dashboard for our customers. Product: {{product}} Goals: {{goals_and_limits}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scheduling-saas
    vars:
      product: "Appointment scheduling SaaS for clinics; data on bookings, no-shows, reminders sent, staff utilisation; admins and practice managers ask support how many no-shows reminders prevent."
      goals_and_limits: "Show value to reduce churn; data refreshes hourly; React front end; Pro plan gets advanced reports."
    assert:
      - {type: llm-rubric, value: "Distinguishes admin and practice manager jobs; leads with outcome metrics such as bookings and no-show rate with comparisons; defines metrics in customer language; designs empty, partial-data and updated-at states; handles Pro gating without fake data; exports that match on-screen numbers; avoids choosing infrastructure."}
  - name: edge-benchmarks-request
    vars:
      product: "Payroll software for small businesses; customers ask how their overtime compares with similar businesses."
      goals_and_limits: "Want a benchmark chart comparing each customer to others in their industry."
    assert:
      - {type: llm-rubric, value: "Allows benchmarks only as aggregates above a minimum group size; flags privacy and legal review and customer contract terms; handles small industries where groups are too small; explains how the comparison is defined."}
  - name: negative-fake-data-preview
    vars:
      product: "Email marketing tool."
      goals_and_limits: "For new accounts, fill the dashboard with realistic made-up numbers so it looks impressive, without labelling them."
    assert:
      - {type: llm-rubric, value: "Declines to show unlabelled fake numbers as the customer's data; proposes a clearly labelled sample preview or an empty state explaining what will appear and how to get started."}
