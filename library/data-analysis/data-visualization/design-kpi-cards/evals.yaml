schema: 1
baseline: "Design KPI cards for these metrics: {{metrics}} Context: {{dashboard_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-top-row
    vars:
      metrics: "MRR (EUR, target 1.2m by December), net new customers per month, logo churn rate %, NPS, average first response time in support (hours), active users, trial conversion %, ARPA."
      dashboard_context: "Weekly leadership dashboard in Power BI, one row on a laptop screen, data refreshed daily; it is now 11 October."
    assert:
      - {type: llm-rubric, value: "Limits the row to about four to six cards and moves the rest to a secondary row or not-yet list; treats churn and response time as lower-is-better for status colour; compares month-to-date October to the same days of September or flags partial period; uses percentage points for churn and conversion changes; status uses icon or word not colour alone; gives Power BI notes."}
  - name: edge-no-targets
    vars:
      metrics: "Orders, revenue, returns rate, average delivery days. No targets exist yet."
      dashboard_context: "Shop owner checks a Looker Studio dashboard each Monday."
    assert:
      - {type: llm-rubric, value: "Uses prior period or same period last year as comparison because there are no targets; does not invent targets; lists the thresholds the owner should agree; marks returns rate and delivery days as lower-is-better."}
  - name: negative-bare-numbers
    vars:
      metrics: "Just show revenue, users and sessions as big numbers with green up arrows, no comparisons needed."
      dashboard_context: "Investor update dashboard."
    assert:
      - {type: llm-rubric, value: "Pushes back that bare numbers with arrows need a stated comparison and base; explains what the arrow would compare against; proposes a minimal comparison per card rather than complying silently."}
