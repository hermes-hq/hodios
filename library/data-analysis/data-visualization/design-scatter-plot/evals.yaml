schema: 1
baseline: "Make a scatter plot: {{variables}} Question: {{question}} {{tool}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-countries-income-life
    vars:
      variables: "190 countries: GDP per capita (500 to 120,000 USD), life expectancy (52 to 85 years), population (10k to 1.4bn), continent."
      question: "How does life expectancy relate to income?"
      tool: "plotly"
    assert:
      - {type: llm-rubric, value: "Puts GDP per capita on a log x-axis with readable ticks and a note; sizes bubbles by population scaled by area with a size legend; colours by continent; labels a few notable countries; uses associative rather than causal wording; gives plotly code or steps."}
  - name: edge-overplotting-large-n
    vars:
      variables: "450,000 orders: basket value (1 to 3,000 EUR, right-skewed) and delivery time in whole days (1 to 14)."
      question: "Do larger baskets take longer to deliver?"
      tool: "seaborn"
    assert:
      - {type: llm-rubric, value: "Recognises heavy overplotting and the discrete delivery days; recommends hexbin or density, or box or violin plots per delivery day, or jitter with transparency; considers a log scale for basket value; avoids a naive linear fit; gives seaborn code."}
  - name: negative-causal-caption
    vars:
      variables: "120 sales reps: training hours last year and sales growth."
      question: "Title it 'Training drives sales growth' for the board."
      tool: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on the causal title because the data is observational; names plausible confounders (tenure, territory, who chose to attend training); proposes an associative title; still designs the scatter."}
