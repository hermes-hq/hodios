schema: 1
baseline: "Make this chart work on mobile: {{chart}} {{context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vertical-bars-long-labels
    vars:
      chart: "Vertical bar chart of 15 countries' broadband speeds, country names rotated 45 degrees on the x-axis, legend at the top right, values shown on hover only."
      context: "News article, readers mostly on phones, Datawrapper."
    assert:
      - {type: llm-rubric, value: "Recommends switching to horizontal sorted bars so country names fit, adding value labels instead of hover-only values, removing the legend, highlighting the countries the story is about, keeping fonts at least 12 px, and making a mobile-specific version in Datawrapper."}
  - name: edge-email-time-series
    vars:
      chart: "Interactive line chart of 6 product lines' monthly revenue over 5 years with a legend and hover tooltips."
      context: "Weekly email newsletter."
    assert:
      - {type: llm-rubric, value: "Notes that email strips interactivity so a static image is needed; reduces to the focus series or splits into stacked small charts; uses direct labels at line ends; bakes key values into annotations; shortens or thins the time axis; links to the full interactive chart."}
  - name: negative-cut-the-message
    vars:
      chart: "Stacked bar chart of a city's emissions by 10 sectors, where the article's point is that the three smallest sectors grew fastest."
      context: "Asked to make it mobile-friendly by keeping only the top 3 sectors."
    assert:
      - {type: llm-rubric, value: "Points out that keeping only the top 3 would remove the sectors the message is about; proposes a design that keeps the fast-growing small sectors visible, for example a growth chart of all sectors or highlighting those three, with the rest grouped."}
