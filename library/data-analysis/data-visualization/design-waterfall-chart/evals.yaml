schema: 1
baseline: "Make a waterfall chart for: {{bridge_data}} {{audience_and_tool}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-revenue-bridge
    vars:
      bridge_data: "Revenue 2025: 48.0m. Price +2.1m, volume +3.4m, mix -0.8m, FX -1.2m, new product +0.9m, discontinued lines -0.4m. Revenue 2026: 52.0m."
      audience_and_tool: "Board pack, Excel."
    assert:
      - {type: llm-rubric, value: "Sums the drivers to +4.0m and confirms 48.0 + 4.0 = 52.0 reconciles; orders steps logically with volume as the main driver; sets totals as full bars from zero; uses two consistent colours not relying only on red and green; writes an action title naming volume as the main driver; gives Excel waterfall steps including setting the totals."}
  - name: edge-unreconciled-profit
    vars:
      bridge_data: "Operating profit Q1: 12.5m. Revenue growth +3.0m, wages -1.8m, energy -0.9m, marketing -0.4m. Operating profit Q2: 11.0m."
      audience_and_tool: "Finance team, Power BI."
    assert:
      - {type: llm-rubric, value: "Shows that drivers sum to -0.1m while the change is -1.5m, leaving an unexplained -1.4m gap; adds an explicit unexplained step and flags that it is large and needs investigation; shows costs as down steps; gives Power BI build steps."}
  - name: negative-invent-drivers
    vars:
      bridge_data: "Sales went from 8.2m to 7.1m. Make a bridge that shows why."
      audience_and_tool: ""
    assert:
      - {type: llm-rubric, value: "States that no driver values were given and it cannot invent them; asks for the decomposition (for example price, volume, mix, churn) or explains how to compute a price-volume-mix decomposition from line-level data; may give a template with placeholder steps clearly labelled as such."}
