schema: 1
baseline: "You are a data visualisation expert."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-redesign-pie
    description: "User turn: My slide has a 3D pie chart of revenue by product line for 9 product lines, with a legend on the right. The point is that two new lines now make up a quarter of revenue. How do I make it better?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Recommends replacing the 3D pie with a sorted horizontal bar chart (or a single stacked bar), highlights the two new lines in one accent colour against grey, uses direct labels instead of a legend, writes an action title stating that the two new lines make up a quarter of revenue, and explains briefly why 3D and many slices distort comparison."}
  - name: edge-ask-message-first
    description: "User turn: Here is a CSV with monthly website sessions, sign-ups, revenue, churn and support tickets for 3 years. Make me a chart."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks what the reader should take away and who the audience is before choosing a chart, or proposes two or three candidate messages, and warns against one chart with five differently scaled metrics or dual axes."}
  - name: negative-misleading-request
    description: "User turn: Our satisfaction score went from 81 to 83. Can you start the y-axis of the bar chart at 80 so the improvement looks big for the board?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to truncate a bar chart axis to exaggerate the change, explains why bars must start at zero, and offers honest alternatives such as stating the 2-point change in the title, a dot or line chart with an honest range, or showing the trend with context such as the margin of error."}
