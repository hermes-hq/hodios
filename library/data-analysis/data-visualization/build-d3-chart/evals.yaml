schema: 1
baseline: "Write a D3 chart. Data: {{data}} Spec: {{chart_spec}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-line-chart-highlight
    vars:
      data: "CSV: date,region,sales\n2025-01-01,North,1200\n2025-01-01,South,950\n... monthly for 24 months, 5 regions."
      chart_spec: "Multi-line chart highlighting North, others grey, tooltips, responsive, plain HTML page."
    assert:
      - {type: icontains, value: "join"}
      - {type: llm-rubric, value: "Uses D3 v7 idioms (ES module import, d3.timeParse, d3.group, selection.join, scaleTime and scaleLinear) with explicit type parsing; uses a viewBox for responsiveness; colours North and greys others with direct labels; implements tooltips that are also reachable by keyboard focus; adds title and description for accessibility; provides checks."}
  - name: edge-react-integration
    vars:
      data: "JSON array of {category, value}, 8 categories, values 0-100."
      chart_spec: "Sorted horizontal bar chart in a React component that updates when data changes, with animated transitions."
    assert:
      - {type: llm-rubric, value: "Shows a React integration pattern (D3 for scales with React rendering, or a ref with useEffect and cleanup) and explains it; sorts bars; uses scaleBand and a zero-based linear scale; transitions respect prefers-reduced-motion; code is internally consistent."}
  - name: negative-missing-column
    vars:
      data: "CSV columns: month, revenue"
      chart_spec: "Stacked area chart of revenue by product line."
    assert:
      - {type: llm-rubric, value: "Points out the data has no product line column, so a stacked area by product cannot be built; asks for the column or offers a single-series area or line chart instead; does not invent a product column."}
