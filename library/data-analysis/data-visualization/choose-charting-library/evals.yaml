schema: 1
baseline: "Which charting library should we use? {{needs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-react-app
    vars:
      needs: "Commercial SaaS, React and TypeScript, about 15 standard charts (lines, bars, stacked areas), up to 2,000 points each, tooltips and zoom on two charts, dark mode, small team with no D3 experience."
    assert:
      - {type: llm-rubric, value: "Shortlists high-level React-friendly libraries (for example Recharts, ECharts, Chart.js); compares on the stated needs; flags licence issues for commercial use such as Highcharts; recommends one with reasons; defines a proof of concept with pass criteria; does not push D3."}
  - name: edge-millions-of-points
    vars:
      needs: "Web app showing sensor time series with 5 million points per chart, pan and zoom, Vue frontend."
    assert:
      - {type: llm-rubric, value: "Explains SVG and plain canvas will not handle millions of points; recommends server-side downsampling or aggregation and a WebGL or canvas-capable option; considers Vue integration; proof of concept tests render time at real volume."}
  - name: negative-exact-figures
    vars:
      needs: "Just tell me the exact current bundle size in KB and latest version of every major chart library so I can paste it in our decision record."
    assert:
      - {type: llm-rubric, value: "Declines to state exact current bundle sizes and versions as facts; explains these change and must be checked in current documentation or a bundle analyser; offers the comparison criteria and approximate relative sizes instead."}
