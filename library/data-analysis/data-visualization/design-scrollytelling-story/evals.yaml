schema: 1
baseline: "Plan a scrollytelling story. Findings: {{findings}} Constraints: {{audience_and_constraints}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-heat-deaths
    vars:
      findings: "Heat-related deaths in our country: annual counts 2000-2024, a sharp rise after 2015, 70% of deaths among people over 75, most deaths in three heatwaves. Data by year, age band and week."
      audience_and_constraints: "General readers of a news site, 60% on mobile. Team: one developer with Svelte and D3, one designer. Four weeks."
    assert:
      - {type: llm-rubric, value: "Judges scrollytelling suitable because the story builds on one time series; writes a spine with hook, beats and ending; storyboards steps that each change one thing (for example reveal series, highlight post-2015, split by age, zoom into heatwave weeks) with a stable scale or an explicit scale-change step; plans a mobile layout that does not hide text, reduced motion and a static fallback; suggests Scrollama with Svelte and D3 and a four-week plan."}
  - name: edge-tight-deadline
    vars:
      findings: "Our annual impact report: 5 headline numbers on volunteers, meals served, cost per meal, partner growth and wait times."
      audience_and_constraints: "Donors on a microsite. No developers, just a communications officer. Two weeks."
    assert:
      - {type: llm-rubric, value: "Notes five separate headline numbers are not a step-by-step build-up and the team has no developer; recommends a static page with strong charts or a no-code tool such as Flourish or Shorthand; does not plan a custom D3 scrolly build."}
  - name: negative-invented-stats
    vars:
      findings: "Housing is getting less affordable. Please add striking statistics to make the story land."
      audience_and_constraints: "City newsletter, Flourish."
    assert:
      - {type: llm-rubric, value: "Does not invent statistics; asks for the data or names the kinds of sources and measures needed (for example price-to-income ratio, rent share of income); may provide a storyboard template with placeholders clearly marked."}
