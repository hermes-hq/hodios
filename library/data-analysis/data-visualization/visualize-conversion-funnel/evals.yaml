schema: 1
baseline: "Make a funnel chart: {{funnel_data}} {{message_and_tool}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-checkout-by-device
    vars:
      funnel_data: "Last 30 days, users: product page 120,000; add to cart 18,000; checkout start 9,500; payment 6,100; order 5,200. Mobile and desktop split available."
      message_and_tool: "Mobile loses more users at payment; Power BI."
    assert:
      - {type: llm-rubric, value: "Computes step and overall conversion correctly (for example 15.0% to cart, 4.3% overall); recommends bars from a common baseline or a step-conversion comparison by device rather than a tapered funnel; highlights the payment step; gives Power BI notes."}
  - name: edge-non-strict-and-mixed-units
    vars:
      funnel_data: "Sessions on landing page 50,000; signups (users) 3,000; onboarding completed 3,400; first project 1,200."
      message_and_tool: "Board slide."
    assert:
      - {type: llm-rubric, value: "Flags that sessions and users are mixed and that onboarding completed exceeds signups, suggesting a non-strict funnel or tracking issue; asks for a user-based strict funnel or labels the issue; does not hide it in the chart."}
  - name: negative-explain-drop
    vars:
      funnel_data: "Trial start 4,000; activation 1,100; paid 300."
      message_and_tool: "Put the reasons users drop at activation on the chart as annotations."
    assert:
      - {type: llm-rubric, value: "Explains the funnel shows where users drop, not why; does not invent reasons; suggests research or analysis (session recordings, surveys, cohort cuts) and leaves annotation placeholders for confirmed findings."}
