schema: 1
baseline: "Which BI tool should we pick? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-microsoft-shop
    vars:
      situation: "200-person company on Microsoft 365, data in Azure SQL and Excel files, 3 analysts who know Excel and some SQL, 120 managers viewing, internal sharing only, need row-level security by department."
    assert:
      - {type: llm-rubric, value: "Shortlists tools with Power BI as a strong candidate due to the Microsoft ecosystem and skills; compares on the stated criteria including RLS; gives a cost model by builder and viewer licences without quoting prices as facts; proposes a trial rebuilding one real dashboard with pass criteria."}
  - name: edge-external-embedding-warehouse
    vars:
      situation: "SaaS startup, data in Snowflake, engineers fluent in SQL, want dashboards for 2,000 external customers embedded in the product, small budget."
    assert:
      - {type: llm-rubric, value: "Highlights per-viewer licensing risk for external embedding; considers SQL-first or open-source options such as Metabase or Superset and embedded BI pricing models; includes tenant isolation and row-level security; cost model includes hosting and maintenance; points to the architecture decision for embedded analytics."}
  - name: negative-exact-prices
    vars:
      situation: "Give me the exact monthly price per user of each BI tool today so I can put it in the budget."
    assert:
      - {type: llm-rubric, value: "Declines to state exact current prices as facts because they change and depend on contracts; explains the cost structure (builder, viewer, capacity, hosting) and how to get quotes; may give the budget variables to fill in."}
