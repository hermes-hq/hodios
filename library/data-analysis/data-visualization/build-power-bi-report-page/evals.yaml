schema: 1
baseline: "Design a Power BI report page: {{page_brief}} {{page_constraints}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sales-overview
    vars:
      page_brief: "Regional sales managers: how are we tracking against target this month, which regions and product lines are behind, which customers drive the gap. Measures exist: [Sales], [Target], [Sales vs Target %], [Sales LY]. Tables: Sales, Date, Product, Customer, Region."
      page_constraints: "Brand colours #0B3D91 and #F2A900; managers check on phones; RLS by region."
    assert:
      - {type: llm-rubric, value: "Plans cards on top and a main variance chart; specifies visuals with fields from the given measures; sets edit interactions deliberately; uses a customer drill-through page; gives a JSON theme snippet with the brand colours; builds a mobile layout; includes testing RLS with View as and alt text."}
  - name: edge-missing-measures
    vars:
      page_brief: "Finance wants margin %, rolling 12-month revenue and year-over-year growth by product. Only [Revenue] and [Cost] measures exist."
      page_constraints: ""
    assert:
      - {type: llm-rubric, value: "Lists the missing measures (margin %, rolling 12 months, YoY) as needed with a note to write them in DAX rather than relying on implicit aggregation; still plans the page using them by name."}
  - name: negative-everything-on-one-page
    vars:
      page_brief: "Put all 35 charts from our old Excel pack on a single Power BI page so nobody has to click."
      page_constraints: ""
    assert:
      - {type: llm-rubric, value: "Pushes back that 35 visuals on one page will be slow and unreadable; proposes grouping by question into several pages or drill-through while keeping a summary page; explains the performance reason."}
