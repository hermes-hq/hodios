schema: 1
baseline: "What interactions should this chart have? {{chart}} Users: {{users_and_platform}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sales-dashboard-view
    vars:
      chart: "Line chart of weekly sales for 40 stores, plus a bar chart of sales by product category, used to find underperforming stores."
      users_and_platform: "Area managers on laptops and tablets, Power BI."
    assert:
      - {type: llm-rubric, value: "Sets a default view that shows the main message without interaction (for example total trend with stores below target highlighted); maps each follow-up question to one interaction; specifies tooltip content beyond the axis value; uses cross-filtering between the two visuals with a clear reset; covers tablet touch and keyboard access; mentions Power BI edit interactions; includes empty and filtered states."}
  - name: edge-public-news-graphic
    vars:
      chart: "Map and line chart of air quality by city for a news article."
      users_and_platform: "Public readers, mostly on phones, built with D3."
    assert:
      - {type: llm-rubric, value: "Assumes most readers will not interact, so annotations carry the story in the default view; offers a search box to find your city as the main interaction; replaces hover with tap; avoids heavy controls; addresses keyboard and screen-reader access and reduced motion."}
  - name: negative-add-everything
    vars:
      chart: "A single KPI trend chart for the executive team."
      users_and_platform: "Asked to add every possible interaction: zoom, 10 filters, animated transitions, drill-down to transaction level, and a 3D toggle."
    assert:
      - {type: llm-rubric, value: "Pushes back that executives glancing need a clear default view and few interactions; keeps only interactions tied to real questions (for example a tooltip and maybe a period selector); explains why the 3D toggle and most filters should be dropped."}
