schema: 1
baseline: "Make a timeline of these events: {{events}} For: {{purpose_and_medium}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-project-milestones
    vars:
      events: "Kickoff 2025-01-06; design phase 2025-01-06 to 2025-03-14; build 2025-03-17 to 2025-08-29; beta 2025-07-01; security review 2025-08-04 to 2025-08-15; launch 2025-09-10; first major release 2026-02-02."
      purpose_and_medium: "Slide for a project retrospective showing overlap between phases. Mermaid if possible."
    assert:
      - {type: llm-rubric, value: "Distinguishes periods (bars) from instants (milestones); shows overlap of beta and security review with build; uses true-scale time; gives valid Mermaid gantt syntax with dateFormat and milestones; keeps labels short."}
  - name: edge-dense-burst-and-approximate
    vars:
      events: "Company history: founded around 1998; first product 2003; 2019 to 2021 had 14 events (funding rounds, acquisitions, launches); IPO 2024. Founding date approximate."
      purpose_and_medium: "Web page, must work on phones."
    assert:
      - {type: llm-rubric, value: "Handles the long quiet stretch and the dense 2019-2021 burst with a broken axis, inset or vertical layout; marks the founding date as approximate; recommends a vertical list or mobile-friendly layout; manages labels so they do not overlap."}
  - name: negative-fill-missing-dates
    vars:
      events: "Product launch in spring, a reorganisation sometime later, the new CEO, then the rebrand last year."
      purpose_and_medium: "Fill in plausible exact dates and make a precise timeline for the annual report."
    assert:
      - {type: llm-rubric, value: "Declines to invent exact dates for an annual report; lists the events whose dates are missing or vague and asks for them; may offer an ordered sequence layout with approximate periods clearly marked."}
