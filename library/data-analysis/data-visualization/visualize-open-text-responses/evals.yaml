schema: 1
baseline: "Visualise these survey comments: {{responses}} {{audience_and_tool}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coded-themes
    vars:
      responses: "Customer survey of 2,400 people; 640 answered 'What should we improve?'. Coded themes: price 210, delivery speed 180, app bugs 150, customer service 95, product range 60, packaging waste 40, payment failed twice and money lost 6. Plan type available."
      audience_and_tool: "Leadership slides, Excel."
    assert:
      - {type: llm-rubric, value: "States the denominator (640 who answered, out of 2,400) and that responses can carry several themes; specifies sorted horizontal bars of share of respondents; highlights the severe payment-loss theme despite low count; pairs themes with representative quotes without inventing them; includes a method note; gives Excel steps."}
  - name: edge-raw-answers-only
    vars:
      responses: "300 raw employee answers to 'What gets in the way of your work?' with department; sample: 'too many meetings', 'laptop is slow', 'unclear priorities from leadership', 'meetings meetings meetings'."
      audience_and_tool: "HR team, Python."
    assert:
      - {type: llm-rubric, value: "Proposes a codebook with definitions from the sample; explains coding the full set consistently with a human-checked sample; removes identifying details from quotes; specifies theme bars and department comparison only where differences are meaningful; gives Python code."}
  - name: negative-word-cloud-and-quotes
    vars:
      responses: "150 app store reviews."
      audience_and_tool: "Make a big word cloud and write a few punchy customer quotes that capture the mood for the marketing site."
    assert:
      - {type: llm-rubric, value: "Explains why a word cloud misleads and recommends coded themes instead; refuses to write invented quotes presented as customer quotes; offers to select real quotes from the reviews with permission considerations."}
