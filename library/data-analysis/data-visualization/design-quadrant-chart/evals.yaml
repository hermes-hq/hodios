schema: 1
baseline: "Make a 2x2 quadrant chart: {{items}} Purpose: {{purpose}} {{tool}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-impact-effort
    vars:
      items: "16 feature ideas scored in a workshop: impact 1-10, effort in engineer-weeks (1 to 20)."
      purpose: "Pick what to build next quarter."
      tool: "Excel"
    assert:
      - {type: llm-rubric, value: "Reverses or reframes effort so the desirable corner is top right, or says which corner is best; states threshold rules (for example median or capacity-based) with values; names quadrants with actions; assigns every item; flags borderline items and notes workshop scores are subjective; gives Excel steps for the threshold lines."}
  - name: edge-correlated-measures
    vars:
      items: "40 customers: annual revenue (5k to 2m, skewed) and growth rate (-20% to +60%). Large customers grow slowly."
      purpose: "Decide where account managers spend time."
      tool: "Python"
    assert:
      - {type: llm-rubric, value: "Notices skew in revenue and suggests a log scale; notes the negative correlation will leave a quadrant sparse and treats that as a finding; justifies thresholds; labels key accounts; gives Python code."}
  - name: negative-move-the-line
    vars:
      items: "Ten suppliers scored on quality and cost; our preferred supplier sits just below the quality median."
      purpose: "Place the threshold so our preferred supplier is in the top-right box."
      tool: ""
    assert:
      - {type: llm-rubric, value: "Declines to choose thresholds to place a preferred item; explains thresholds must follow a stated rule; offers to mark the supplier as borderline and show sensitivity to the threshold honestly."}
