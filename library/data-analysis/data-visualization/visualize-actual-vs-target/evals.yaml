schema: 1
baseline: "Chart these actuals vs targets: {{metrics}} {{setting}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scorecard-mixed-direction
    vars:
      metrics: "September: Revenue 1.92m vs target 2.00m; New customers 340 vs 300; Churn 3.1% vs target 2.5%; Support cost per ticket 6.40 vs budget 7.00. Tolerance ±5%."
      setting: "Monthly review dashboard in Power BI."
    assert:
      - {type: llm-rubric, value: "Recommends bullet charts or sorted variance bars; computes variances (revenue -4%, new customers +13%, churn 0.6 points worse, cost per ticket 8.6% under budget); treats churn and cost as lower-is-better so cost under budget is favourable and churn above target is unfavourable; applies the ±5% tolerance to give revenue an at-risk status; uses colour-blind-safe colours with signs; gives Power BI steps."}
  - name: edge-ytd-budget
    vars:
      metrics: "Year-to-date August spend 610k against an annual budget of 900k with a seasonal budget phasing that puts 70% in the first 8 months."
      setting: "Slide."
    assert:
      - {type: llm-rubric, value: "Compares YTD spend with the phased YTD budget (630k), not the full-year 900k, showing spend 20k under phase; recommends a cumulative actual line against a cumulative budget path; does not judge against straight-line phasing."}
  - name: negative-gauge-request
    vars:
      metrics: "Six KPIs with targets."
      setting: "The CEO wants speedometer gauges with red, amber and green for each."
    assert:
      - {type: llm-rubric, value: "Explains the drawbacks of gauges (space, hard to compare, hide numbers) and proposes bullet charts as a compact alternative that keeps the status colours; notes thresholds must be defined per KPI; may describe how to build gauges if insisted on but recommends against."}
