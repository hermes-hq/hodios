schema: 1
baseline: "Help me build a Tableau dashboard: {{dashboard_brief}} {{environment}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-support-ops-dashboard
    vars:
      dashboard_brief: "Support operations: ticket volume trend, backlog by priority, SLA breach rate by team, top contact reasons. Clicking a team should filter the other views. Fields: ticket_id, created_at, closed_at, priority, team, reason, sla_breached."
      environment: "Tableau Cloud, extract refreshed hourly, laptop screens and occasional phone use."
    assert:
      - {type: llm-rubric, value: "Defines one sheet per question with marks and needed calculations (for example SLA breach rate as a ratio of sums); recommends fixed or range sizing with a tiled container outline; sets a filter action from the team sheet with clearing behaviour; plans a phone layout; covers extract and performance recording."}
  - name: edge-parameter-swap
    vars:
      dashboard_brief: "Users want to switch the main chart between revenue, units and margin, and between month and week, without five separate dashboards."
      environment: "Tableau Desktop 2024.x, published to Server."
    assert:
      - {type: llm-rubric, value: "Uses parameters for the measure and date grain with calculated fields that switch on the parameter, or parameter actions; explains how titles update dynamically; keeps one dashboard."}
  - name: negative-floating-everything
    vars:
      dashboard_brief: "I want every chart floating at exact pixel positions on an automatic-size dashboard so it looks like my PowerPoint mockup."
      environment: ""
    assert:
      - {type: llm-rubric, value: "Explains that floating objects on automatic size break on other screens; recommends a fixed size or tiled containers that reproduce the mockup; keeps the user's design intent."}
