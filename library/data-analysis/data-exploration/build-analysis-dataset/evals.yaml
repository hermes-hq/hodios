schema: 1
baseline: "Combine these sources into one table for analysis using {{tool}}: {{sources}}. Goal: {{analysis_goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-churn-table
    vars:
      tool: pandas
      sources: |
        customers.csv: customer_id, signup_date, current_plan, status (active|cancelled), cancelled_at
        orders.csv: order_id, customer_id, order_date, amount (many per customer)
        tickets.csv: ticket_id, customer_id, opened_at, category (many per customer); ticketing system adopted 2025-03-01
      analysis_goal: Model which active customers on 2026-06-30 cancel in the following 90 days.
    assert:
      - {type: contains, value: "## Column plan"}
      - {type: llm-rubric, value: "Sets the population as customers active on 2026-06-30, computes order and ticket features only from data before that date aggregated per customer before joining, derives the outcome from cancellations in the next 90 days, flags current_plan and status as leakage risks, fills no-orders as zero, notes the ticket system start date as a coverage gap, and checks one row per customer."}
  - name: edge-sql-per-row-reference
    vars:
      tool: bigquery
      sources: |
        trials(account_id, trial_start DATE, converted_at DATE nullable)
        events(account_id, event_name, ts TIMESTAMP) billions of rows
      analysis_goal: Which behaviours in the first 7 days of a trial relate to converting to paid.
    assert:
      - {type: llm-rubric, value: "Uses a per-account reference window of trial_start to trial_start plus 7 days for features, filters events to that window before aggregating (with partition pruning for cost), excludes accounts that converted within the first 7 days or handles them explicitly as leakage, and keeps accounts with no events via a left join."}
  - name: negative-unclear-grain
    vars:
      tool: snowflake
      sources: "sales_data (columns unknown, comes from three regional systems), crm_export (maybe one row per contact?)"
      analysis_goal: One table for analysis.
    assert:
      - {type: llm-rubric, value: "Asks for the columns, grain and keys of each source and the actual analysis question (outcome, unit of analysis) before writing code, rather than inventing columns and joins."}
