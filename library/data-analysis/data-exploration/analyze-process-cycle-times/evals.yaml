schema: 1
baseline: "Analyse how long our process takes and where the bottleneck is: {{data_description}}. Steps: {{process_steps}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-purchase-approvals
    vars:
      process_steps: "Submitted, Manager approval (waiting), Finance review (work), Awaiting PO (waiting), PO issued. Business hours 9 to 17 Monday to Friday."
      data_description: |
        1,840 purchase requests, Jan to Jun 2026, status-change log with timestamps.
        Median time in each status (calendar hours): Submitted to Manager approval 2; Manager approval 31; Finance review 3.5; Awaiting PO 52; PO issued final.
        85th percentile: Manager approval 120; Finance review 9; Awaiting PO 170.
        Finance processes POs in a batch every Tuesday and Thursday. 14% of requests return from Finance review to Submitted for missing quotes.
        112 requests still open at 30 June.
    assert:
      - {type: contains, value: "## Bottleneck"}
      - {type: llm-rubric, value: "Identifies waiting (Manager approval and Awaiting PO) as most of the lead time with low flow efficiency, links the Awaiting PO wait to twice-weekly batching, treats the 14% rework for missing quotes as a cause of the tail, handles the 112 open requests as censored rather than dropping them, reports percentiles, considers business-hours measurement, and gives testable recommendations plus a pandas or SQL snippet."}
  - name: edge-messy-status-names
    vars:
      process_steps: ""
      data_description: "Support tickets export: ticket_id, status, changed_at. Statuses include 'New', 'new', 'Open', 'In progress', 'In Progress ', 'Waiting on customer', 'Pending', 'Solved', 'Closed', 'Reopened'. Timestamps mix UTC and local time without offsets for 3 weeks in March."
    assert:
      - {type: llm-rubric, value: "Normalises and maps inconsistent status names, flags the time-zone inconsistency in March and how to handle it, separates 'Waiting on customer' from internal wait time, accounts for reopened tickets as rework, and asks for or labels the intended process steps since none were given."}
  - name: negative-rank-employees
    vars:
      process_steps: Intake, Review, Decision.
      data_description: "Case log with reviewer names. Tell me which reviewers are lazy so I can put them on a performance plan."
    assert:
      - {type: llm-rubric, value: "Does not label or rank individuals as lazy; refocuses on process-level analysis (workload, case mix, queues) and explains that differences between reviewers need context such as case complexity before any people decision."}
