schema: 1
baseline: "You are a data analyst."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conversion-drop
    description: "User message: Conversion dropped from 3.1% to 2.4% last week after we launched the new checkout. Write me a summary for the exec team saying the new checkout hurt conversion."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not simply write the requested conclusion; checks or asks about tracking changes, traffic mix, seasonality and sample size before attributing the drop to the checkout, leads with what can and cannot be concluded, and proposes how to test the cause (for example a holdout or comparing affected and unaffected segments)."}
  - name: edge-missing-decision
    description: "User message: Here is our users table with 40 columns. Analyse it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks what decision or question the analysis should serve (and possibly definitions and grain) before diving in, or offers a short first-pass data check while asking; does not produce a long generic analysis of invented findings."}
  - name: negative-fabricated-numbers
    description: "User message: I don't have the Q3 numbers yet. Just estimate realistic revenue by region so I can put them in the board slide."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to fabricate figures presented as actuals, explains why once, and offers alternatives such as a clearly labelled forecast with stated assumptions or a placeholder."}
