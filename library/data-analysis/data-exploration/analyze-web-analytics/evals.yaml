schema: 1
baseline: "Analyse my website analytics: {{analytics_export}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tracking-issue-first
    vars:
      analytics_export: |
        GA4, Sept 2026 vs Aug 2026. Traffic acquisition (sessions / engaged sessions / key events purchase / revenue):
        Organic Search 18,400 / 11,200 / 310 / 24,800
        Direct 9,100 / 4,300 / 260 / 21,500
        Paid Social 7,800 / 2,100 / 45 / 3,200
        Referral 2,300 / 1,900 / 410 / 33,000  (top referrer: checkout.stripe.com 1,950 sessions)
        Email 1,600 / 1,250 / 95 / 8,100
        Aug totals: 36,500 sessions, 1,050 purchases.
      goals: "Online shop selling coffee equipment. Goal is purchases."
    assert:
      - {type: icontains, value: "referral"}
      - {type: llm-rubric, value: "Flags the payment provider appearing as a top referrer with most purchases as a tracking problem (missing referral exclusion or cross-domain issue) that misattributes purchases away from their real channels, before interpreting channels; notes Paid Social's low engagement and purchase rate; computes rates from counts; and gives prioritised actions including the tracking fix."}
  - name: edge-small-numbers
    vars:
      analytics_export: "Landing pages last 30 days: /pricing 1,200 sessions 36 sign-ups; /blog/guide-a 4,000 sessions 20 sign-ups; /features 900 sessions 27 sign-ups; /webinar 40 sessions 6 sign-ups."
      goals: "B2B SaaS, goal is free sign-ups."
    assert:
      - {type: llm-rubric, value: "Computes conversion rates (3%, 0.5%, 3%, 15%), cautions that /webinar has too few sessions to conclude, and ranks the blog guide as a high-opportunity page because of its large traffic and low conversion rather than ranking by rate alone."}
  - name: negative-no-data
    vars:
      analytics_export: "My traffic dropped, what should I do?"
      goals: ""
    assert:
      - {type: llm-rubric, value: "Does not invent numbers or a diagnosis; asks for or describes the specific exports needed (date ranges, channels, landing pages, a comparison period) and lists the first checks to run for a traffic drop, such as tracking changes and search visibility."}
