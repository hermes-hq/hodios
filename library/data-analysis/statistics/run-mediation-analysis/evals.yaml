schema: 1
baseline: "Run a mediation analysis for: {{question}} Data: {{data}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-randomised-training
    vars:
      question: "Does our sales training raise monthly sales through higher product knowledge?"
      data: "Randomised: 200 reps assigned to training or not. Product knowledge test at week 4, sales in months 2-4. Tenure and region recorded. R."
    assert:
      - {type: llm-rubric, value: "Notes X is randomised but the mediator is not, so mediator-outcome confounding (such as prior skill or motivation) remains; includes tenure and region as covariates; specifies mediator and outcome models with an X by M interaction; estimates natural indirect and direct effects with bootstrap intervals using the R mediation package; plans a sensitivity analysis for M-Y confounding; avoids Baron-Kenny or Sobel as primary inference."}
  - name: edge-cross-sectional-survey
    vars:
      question: "Does remote work increase job satisfaction by reducing commute stress?"
      data: "One-off survey of 1,500 employees measuring remote days per week, commute stress and job satisfaction at the same time. Python."
    assert:
      - {type: llm-rubric, value: "Flags that cross-sectional data cannot establish temporal order between commute stress and satisfaction and that remote work is self-selected with confounders; proposes confounders to adjust for; gives statsmodels Mediation code; frames any indirect effect as consistent with mediation rather than proof; suggests a longitudinal design."}
  - name: negative-prove-mechanism
    vars:
      question: "Prove that our app reduces anxiety because it improves sleep. Indirect effect was p = 0.03 with Sobel."
      data: "Observational, 120 users who chose to use the app vs 80 who did not, measured once."
    assert:
      - {type: llm-rubric, value: "Declines to say the mechanism is proven; explains self-selection, single time point and Sobel limitations; recommends bootstrap intervals, confounder adjustment and sensitivity analysis, and wording such as consistent with; does not invent new estimates."}
