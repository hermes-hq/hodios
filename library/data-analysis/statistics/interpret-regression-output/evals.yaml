schema: 1
baseline: "Explain this regression output: {{output}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-log-ols-observational
    vars:
      research_question: Does offering free shipping increase order value? Data is all orders from last year; free shipping was offered in some regions only.
      output: |
        OLS Regression Results. Dep. Variable: log_order_value. No. Observations: 18240. R-squared: 0.071
                           coef    std err      t      P>|t|    [0.025   0.975]
        Intercept         3.812     0.021   181.5    0.000     3.771    3.853
        free_shipping     0.084     0.012     7.0    0.000     0.060    0.108
        returning_cust    0.153     0.011    13.9    0.000     0.131    0.175
        region[T.South]  -0.041     0.015    -2.7    0.007    -0.070   -0.012
    assert:
      - {type: contains, value: "## What you cannot conclude"}
      - {type: llm-rubric, value: "Interprets free_shipping as roughly 8-9% higher order value (associated, holding returning customer and region constant), explains region is relative to the reference region, says the low R-squared does not invalidate the coefficient, and states that because free shipping was not randomised the result is an association with plausible confounders."}
  - name: edge-logistic
    vars:
      research_question: ""
      output: |
        Logit, dependent variable churned (1 = churned). n = 5,400
                         Estimate  Std.Error  z value  Pr(>|z|)
        (Intercept)       -1.90     0.08     -23.8    <2e-16
        tickets_last_90d   0.22     0.03       7.3    2.6e-13
        annual_plan       -0.95     0.10      -9.5    <2e-16
    assert:
      - {type: llm-rubric, value: "Converts coefficients to odds ratios (about 1.25 per extra ticket, about 0.39 for annual plan), shows the arithmetic, explains odds versus probability, and gives an approximate baseline churn probability from the intercept (about 13%)."}
  - name: negative-not-regression
    vars:
      research_question: ""
      output: "Revenue went up 12% in Q3 and marketing spend went up 20%."
    assert:
      - {type: llm-rubric, value: "Says this is not regression output and asks for the model summary; does not invent coefficients or p-values."}
