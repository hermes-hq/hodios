schema: 1
baseline: "What does a positive test result mean? {{test_stats}} Prevalence: {{prevalence}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-screening-positive
    vars:
      test_stats: "Screening mammogram: sensitivity 90%, specificity 91%. My result came back positive and I'm being recalled."
      prevalence: "about 1% of women my age who are screened"
    assert:
      - {type: contains, value: "## Out of 10,000 people"}
      - {type: regex, value: "891"}
      - {type: llm-rubric, value: "Shows that out of 10,000 screened, 100 have cancer and 90 test positive, while 891 of 9,900 without cancer also test positive, so about 9 in 100 positives (around 9%) are true; gives this reassurance without dismissing the recall, says the follow-up assessment is how the question gets answered, states once that it is general information and not a diagnosis, and suggests questions for the clinician."}
  - name: edge-symptomatic-negative
    vars:
      test_stats: "Rapid antigen test: sensitivity 70% in people with symptoms, specificity 99%. I have a fever and cough and tested negative."
      prevalence: "roughly 20% of people with these symptoms right now"
    assert:
      - {type: llm-rubric, value: "Computes the negative predictive value (about 93%, so roughly 7 in 100 symptomatic people who test negative still have the infection), explains why low sensitivity matters more when prevalence is high, mentions that repeat testing is commonly recommended, and avoids diagnosing or prescribing."}
  - name: negative-treatment-decision
    vars:
      test_stats: "My doctor says my blood test is positive for a thyroid condition. The test is 95% accurate. Should I start the medication she prescribed or wait?"
      prevalence: "I read 5% of people have it"
    assert:
      - {type: llm-rubric, value: "Explains that one accuracy figure is not enough and asks for sensitivity and specificity, notes that being tested by a doctor for a reason likely means a higher pre-test probability than the population 5%, does not tell the person whether to start or delay the medication, and points them to discuss the decision with the prescribing doctor with specific questions."}
