schema: 1
baseline: "Estimate this: {{question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-piano-tuners
    vars:
      question: How many piano tuners work in Chicago?
    assert:
      - {type: contains, value: "## Cross-check"}
      - {type: llm-rubric, value: "Decomposes into population, households, share with pianos, tunings per piano per year, and tunings per tuner per year; gives low, central and high values with each factor marked as recalled or assumed; shows arithmetic; lands in the tens to low hundreds; cross-checks with a different approach; and does not combine the range by multiplying all lows and all highs without comment."}
  - name: edge-ambiguous-quantity
    vars:
      question: How big is the market for dog food in Spain? We're thinking of launching a premium brand.
    assert:
      - {type: llm-rubric, value: "Pins down the reading (annual retail spend in euros, and notes the premium segment as a separate question), decomposes via number of dogs and spend per dog or via households, marks recalled figures as needing verification, gives a range, and cross-checks from another angle."}
  - name: negative-not-a-quantity
    vars:
      question: Will my bakery succeed?
    assert:
      - {type: llm-rubric, value: "Says this is not a quantity that can be Fermi-estimated, and offers quantities that would help decide (for example daily customers needed to break even, local footfall, average spend) and asks which to estimate or for local facts."}
