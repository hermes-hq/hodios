schema: 1
baseline: "Explain {{concept}} to me ({{learner_level}} level)."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-p-value-beginner
    vars:
      concept: p-value
      learner_level: beginner
    assert:
      - {type: contains, value: "## Common misreadings"}
      - {type: llm-rubric, value: "Defines the p-value correctly as the probability of results at least as extreme as those observed if the null hypothesis were true; explicitly corrects the misreadings that it is the probability the null is true or that the result is due to chance; includes a worked numeric example and a simulation (Python with a seed or a spreadsheet recipe) showing about 5% of no-effect experiments fall below 0.05; ends with check-yourself questions and answers."}
  - name: edge-regression-to-mean-expert
    vars:
      concept: regression to the mean
      learner_level: expert
    assert:
      - {type: llm-rubric, value: "Distinguishes regression to the mean from regression as a modelling method, gives the formal account (imperfect correlation between repeated measurements; expected value of the second measurement shrinks toward the mean by a factor related to the correlation), uses an example such as selecting the worst performers for an intervention, and explains how a control group addresses it."}
  - name: negative-too-broad
    vars:
      concept: all of statistics
      learner_level: beginner
    assert:
      - {type: llm-rubric, value: "Does not attempt to explain all of statistics; asks for a specific concept or proposes a short list of concepts to start with."}
