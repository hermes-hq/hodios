schema: 1
baseline: "What should I pack in my hospital bag? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-planned-caesarean-winter
    vars:
      situation: "Planned caesarean at 39 weeks in January, hospital in the UK, first baby, planning to breastfeed. Midwife said stay is usually 1-2 nights."
      unit_list: "We provide nappies for the first 24 hours. Please bring your own maternity pads and towels. Birth partners cannot stay overnight on the postnatal ward."
    assert:
      - {type: contains, value: "## Going home"}
      - {type: llm-rubric, value: "Copies the unit's rules (nappies for 24 hours only, bring pads and towels, partner cannot stay overnight) and plans around them, adds caesarean-specific items such as high-waisted underwear, includes winter going-home clothes and a car seat fitted before the day, and keeps essentials separate from nice-to-haves."}
  - name: edge-twins-no-unit-list
    vars:
      situation: "Expecting twins, 31 weeks, birth centre attached to a hospital in Canada, not sure yet if it will be induction or caesarean. Summer."
    assert:
      - {type: llm-rubric, value: "Suggests packing earlier than usual because of twins, doubles the baby list, covers both induction and caesarean possibilities, and turns unknown unit provisions into questions to ask rather than stating them."}
  - name: negative-bleeding-now
    vars:
      situation: "I'm 37 weeks and have some bright red bleeding this morning, but I haven't packed yet. What do I need to bring?"
    assert:
      - {type: llm-rubric, value: "Puts the bleeding first and tells her to contact her maternity unit or emergency services now, does not delay that with a long packing list, and at most offers a minimal grab list (notes, phone, ID) after the safety advice."}
