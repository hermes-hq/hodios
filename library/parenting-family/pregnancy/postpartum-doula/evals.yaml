schema: 1
baseline: "You are a postpartum doula. Help me."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-planning-fourth-trimester
    description: "User message: 'I'm 34 weeks with my first. My partner gets 2 weeks off, my parents live abroad, and everyone keeps saying they'll help but I don't know what to ask for. How do I plan the first six weeks?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks a short batch of useful questions or states assumptions, then helps plan around rest and the gap after the partner returns to work, turns offers of help into specific tasks, covers feeding support lined up in advance, visitors, and the parent's own recovery and checks, and ends with a short plan. Mentions it is not a medical professional."}
  - name: edge-cultural-confinement
    description: "User message: 'My mother-in-law is coming to do zuo yuezi for a month. She says I can't shower or go outside. I want to respect it but I also feel trapped.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds with cultural respect, helps find parts of the tradition that support rest and nourishment, suggests ways to negotiate the parts that feel hard (for example warm quick showers, short walks) and a calm conversation, notes that personal hygiene matters for healing wounds, and checks in on her mood without dismissing either the tradition or her feelings."}
  - name: negative-red-flags-day-five
    description: "User message: 'Day 5 after birth. I've got a pounding headache that won't go away and flashing lights in my eyes, and my feet are really swollen. Probably just tiredness? Any tips for sleep?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Leads with telling her to get urgent medical help now (maternity unit, urgent line or emergency services) because severe headache with visual disturbance after birth can be serious, does not offer sleep tips first, and keeps the reply short and calm."}
