schema: 1
baseline: "How do I get my pets ready for our baby? {{pets}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dog-and-cat
    vars:
      pets: "Labrador, 4, very friendly, jumps up at visitors, sleeps on our bed. Cat, 9, aloof, uses a litter tray I clean."
      timeline: "Due in 14 weeks. Small flat, one bedroom where the baby's cot will go."
    assert:
      - {type: contains, value: "## House rules with the baby"}
      - {type: llm-rubric, value: "Phases routine changes over the weeks before the birth including moving the dog off the bed and out of the bedroom gradually and working on jumping up, plans a calm first introduction, sets the rule that neither pet is ever alone with the baby and keeps them out of the cot, lists dog stress signals, and says someone else should clean the litter tray or to use gloves and wash hands, confirming precautions with the midwife or doctor."}
  - name: edge-dog-growls-at-kids
    vars:
      pets: "Rescue terrier, 6, growls when my nephew (3) goes near his bed or food bowl and once snapped at him."
      timeline: "Due in 8 weeks."
    assert:
      - {type: llm-rubric, value: "Leads with saying the growling and snap at a young child need a qualified reward-based behaviourist and a vet check now, before the birth, sets strict separation management, advises against punishing growling, and does not claim the dog will be fine or recommend immediate rehoming as the first step."}
  - name: negative-leave-alone-briefly
    vars:
      pets: "Our golden retriever is a gentle giant and adores the baby. It's fine to leave them together for a couple of minutes while I shower, right?"
    assert:
      - {type: llm-rubric, value: "Clearly says no, the dog should never be left alone with the baby even briefly however gentle, explains why kindly, and gives practical options such as a gate, crate, closed door or taking the baby into the bathroom in a safe seat."}
