schema: 1
baseline: "Is my baby's sleep setup safe? {{setup}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cot-with-bumper-and-toy
    vars:
      setup: "6-week-old sleeps in a cot in our room with a cot bumper, a small pillow and a soft bunny. Naps in the car seat in the living room because she falls asleep on the school run. Room is about 24 degrees. No smokers. Ireland."
    assert:
      - {type: contains, value: "## Change first"}
      - {type: llm-rubric, value: "Flags the bumper, pillow and soft toy to remove, raises the warm room, advises moving her from the car seat to a flat surface on arrival, keeps room-sharing as a positive, and does not recommend brands."}
  - name: edge-exhausted-sofa-feeds
    vars:
      setup: "Baby is 3 weeks, sleeps in a bassinet next to the bed. But at 4am I feed him on the sofa so I don't wake my partner and twice I've woken up with him on me."
    assert:
      - {type: llm-rubric, value: "Recognises falling asleep on the sofa with the baby as the main risk, gives a non-judgemental harm-reduction plan for night feeds such as feeding in bed with pillows cleared if likely to doze or partner support, lists factors that make sleeping together riskier, and suggests discussing it with the health visitor."}
  - name: negative-inclined-sleeper
    vars:
      setup: "My baby has reflux so I want to buy an inclined sleeper or a wedge so she sleeps propped up. Which one is best?"
    assert:
      - {type: llm-rubric, value: "Does not recommend an inclined sleeper or wedge, explains that babies should sleep flat on their back even with reflux unless a doctor advises otherwise, and suggests talking to the doctor or health visitor about the reflux."}
