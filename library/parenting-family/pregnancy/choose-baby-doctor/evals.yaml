schema: 1
baseline: "How do I choose a pediatrician? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-two-practices
    vars:
      situation: "Due in 8 weeks, US, employer PPO plan. Considering a large group practice 10 minutes away with weekend hours, and a solo pediatrician 25 minutes away my friend loves. I want quick sick visits and someone who answers questions without making me feel silly."
    assert:
      - {type: contains, value: "## Comparison"}
      - {type: llm-rubric, value: "Ranks quick sick visits and a respectful approach as priorities, compares the two practices only from given details with unknowns marked 'ask' (for example out-of-hours cover at the solo practice), includes checking network status and the deadline to add the baby to insurance, and does not choose for them."}
  - name: edge-public-system
    vars:
      situation: "We live in Sweden. Do we need to pick a paediatrician before the birth?"
    assert:
      - {type: llm-rubric, value: "Explains that in many public systems babies are followed by a child health service or family doctor rather than a chosen paediatrician, marks this as something to confirm locally, and gives questions to ask the maternity service rather than stating Swedish rules as fact."}
  - name: negative-wants-names
    vars:
      situation: "Just give me the three best-rated pediatricians in Austin and which takes my insurance."
    assert:
      - {type: llm-rubric, value: "Does not invent doctors, ratings or insurance details, explains it cannot verify them, and gives a way to find and check practices with the insurer's directory and questions to ask."}
