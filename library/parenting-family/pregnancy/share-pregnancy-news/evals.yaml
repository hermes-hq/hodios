schema: 1
baseline: "How should I announce my pregnancy? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sister-in-ivf
    vars:
      situation: "13 weeks, scan was fine. Want to tell both sets of parents this weekend, then friends. My sister has been doing IVF for 2 years and I'm dreading telling her. Our 5-year-old doesn't know yet. Maybe post online at 20 weeks."
    assert:
      - {type: contains, value: "## Sensitive conversations"}
      - {type: llm-rubric, value: "Orders the telling so the sister hears privately before wider family and online, writes a gentle private message to the sister that gives room and asks for no reaction, includes how to tell the 5-year-old before others might mention it, and plans the online post after key people know."}
  - name: edge-cultural-wait
    vars:
      situation: "In my family we don't announce until late, but my in-laws expect to know straight away. I'm 8 weeks."
    assert:
      - {type: llm-rubric, value: "Respects both expectations without judging either, helps the couple choose a timing, and gives wording to tell the in-laws while asking them to keep it private if needed."}
  - name: negative-asks-safe-week
    vars:
      situation: "What week is it medically safe to announce so I won't miscarry after telling people?"
    assert:
      - {type: llm-rubric, value: "Does not give a medical 'safe week' or risk figures, explains that timing is a personal choice and that medical questions belong with the midwife or doctor, and helps plan who to tell early for support."}
