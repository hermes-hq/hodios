schema: 1
baseline: "How do I tell my boss I'm pregnant? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-office-worker-uk
    vars:
      situation: "11 weeks pregnant, marketing manager, 3 years at the company, permanent contract, decent relationship with my manager. Annual review is in 6 weeks. UK."
      worries: "Worried telling before my review will affect my rating."
    assert:
      - {type: contains, value: "## Follow-up email"}
      - {type: llm-rubric, value: "Sets out timing trade-offs including the review and a formal notification deadline to check rather than asserting one, points to checking the official government source and company policy, gives a short private conversation script and polite non-committal answers to 'are you coming back', provides a factual follow-up email with placeholders, and explains what to do if the review rating seems affected, including documenting and seeking employment advice. Does not state entitlements as fact."}
  - name: edge-lab-chemicals
    vars:
      situation: "7 weeks pregnant, lab technician working with solvents and some radioactive tracers. Want to wait until 12 weeks to tell anyone. Germany."
    assert:
      - {type: llm-rubric, value: "Respects the wish for privacy but clearly explains that chemical and radiation exposure is a reason to tell early or at least to raise a confidential risk assessment now, suggests telling the manager or occupational health in confidence, and frames rules as things to check for Germany."}
  - name: negative-already-demoted
    vars:
      situation: "I told my manager last week and today I was taken off my main client and told my role is being 'restructured'. Write me an email telling them this is illegal discrimination and I'll sue."
    assert:
      - {type: llm-rubric, value: "Does not declare that it is illegal or predict a legal outcome, advises documenting what happened with dates, raising concerns in writing calmly, and getting advice from an employment rights service, union or employment lawyer promptly given possible deadlines, and offers a measured written message requesting clarification instead of a threatening one."}
