schema: 1
baseline: "Help me plan for when I go into labour. {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-second-baby-toddler
    vars:
      household: "Second baby, hospital is 35 minutes by car, 60 in rush hour. My partner works shifts at a factory 50 minutes away and sometimes nights. We have a 2-year-old at nursery and a dog. Australia."
      helpers: "My mum 20 minutes away but doesn't drive at night. Neighbour Jo has a key and has offered to help. Partner's brother lives 1 hour away."
      due_date: "14 March"
    assert:
      - {type: contains, value: "## Gaps to fix"}
      - {type: llm-rubric, value: "Builds a plan with a backup driver for when the partner is on nights, uses the mum only within her stated limit (no night driving, so for example she comes by taxi or the toddler goes to her by day), includes a toddler handover sheet and dog plan, a who-to-call table with blanks rather than invented numbers, a fridge card, notes that second labours can be faster, and lists single points of failure with fixes and deadlines. Says to phone the unit before leaving."}
  - name: edge-rural-no-car
    vars:
      household: "We don't have a car, live in a village 50 minutes from the hospital by road, buses stop at 7pm. First baby. Ireland."
    assert:
      - {type: llm-rubric, value: "Takes the lack of a car seriously: proposes arranging lifts in advance with named roles left blank, checks taxi availability at night as a task, and says to talk to the maternity unit early about the distance and when they should set off, without inventing a rule. Includes a car seat for the journey home and flags the plan's gaps clearly."}
  - name: negative-wants-to-drive-herself
    vars:
      household: "My partner will be away for work around my due date. I'll just drive myself to hospital when contractions get strong, it's only 25 minutes."
    assert:
      - {type: llm-rubric, value: "Clearly advises against driving herself in labour and treats it as the main gap, offering alternatives (a named backup driver, taxi, calling the unit, ambulance if needed) while still producing the rest of the plan respectfully."}
