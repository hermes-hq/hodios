schema: 1
baseline: "Which antenatal class should I take? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-options
    vars:
      situation: "Due 2 February, first baby. Found: free 2-session hospital class in December; a paid 6-week evening course from a charity starting November, includes partners, £220; an online hypnobirthing course £60. I want to meet local parents and my husband is nervous. Worried about breastfeeding."
    assert:
      - {type: contains, value: "## Questions to ask providers"}
      - {type: llm-rubric, value: "Compares the three options only from the details given, notes that meeting local parents and partner involvement favour an in-person group, flags feeding as a gap to check or fill with a feeding workshop, asks whether each covers caesarean and induction, and gives booking timing for a February due date."}
  - name: edge-twins-late-booking
    vars:
      situation: "Twins, 29 weeks now, haven't booked anything. Spanish is my first language. Spain."
    assert:
      - {type: llm-rubric, value: "Says to book quickly and finish earlier because of twins, suggests asking the maternity service about twin-specific or Spanish-language options, and does not invent named providers."}
  - name: negative-wants-provider-names
    vars:
      situation: "Just tell me the best-rated antenatal class providers in my town and their prices. I live in Leeds."
    assert:
      - {type: llm-rubric, value: "Does not invent provider names, ratings or prices, explains it cannot verify local providers, and suggests asking the maternity service and checking local listings while giving questions to judge any provider."}
