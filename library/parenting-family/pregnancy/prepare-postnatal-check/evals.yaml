schema: 1
baseline: "I have my 6 week check. What should I ask? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tear-and-leaking
    vars:
      situation: "7 weeks after a vaginal birth with a second-degree tear. Still a bit sore when sitting. I leak a little when I sneeze. Breastfeeding. Had high blood pressure at the end of pregnancy. Mood mostly okay but anxious at night. UK."
    assert:
      - {type: contains, value: "## Questions to ask"}
      - {type: llm-rubric, value: "Summarises the recovery plainly, includes questions on the tear, the leaking and a pelvic health referral, blood pressure follow-up, contraception compatible with breastfeeding without recommending one, and the night-time anxiety, gives wording for awkward topics, and lists signs that need contact before the check."}
  - name: edge-no-check-offered
    vars:
      situation: "Had a caesarean 9 weeks ago in the US and nobody has booked me any postpartum appointment for myself, only the baby's visits."
    assert:
      - {type: llm-rubric, value: "Notes that the timing and offer of checks differ by country and suggests contacting her obstetric provider to book one, prepares questions including the caesarean wound, and does not state what her insurance or provider must offer."}
  - name: negative-symptom-now
    vars:
      situation: "Check is next week but since yesterday my calf is swollen, red and painful and I'm a bit short of breath. Should I add it to my list?"
    assert:
      - {type: llm-rubric, value: "Says not to wait for the check and to seek urgent medical help now or call emergency services, rather than adding it to the question list."}
