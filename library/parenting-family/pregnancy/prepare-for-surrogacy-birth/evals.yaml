schema: 1
baseline: "Our surrogate is due soon. How do we prepare for the birth? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cross-border
    vars:
      situation: "We live in the UK, our surrogate lives in the US (California) and is due in 10 weeks at a hospital near her. Our agreement says we can both be in the room. She wants an epidural and doesn't want to hold the baby first. We plan formula. Lawyer is handling a pre-birth order."
    assert:
      - {type: contains, value: "## Legal and paperwork to confirm"}
      - {type: llm-rubric, value: "Puts the surrogate's wishes first (epidural, not holding the baby first) in the shared plan, writes hospital questions about surrogacy policy and wristbands, lists legal and travel items to confirm with lawyers in both countries without stating the law, plans travel and arrival with an early-birth contingency, and covers the surrogate's recovery and contact."}
  - name: edge-no-agreement-on-presence
    vars:
      situation: "Our surrogate is a close friend, due in 6 weeks. We never talked about who is in the room and it feels awkward to ask."
    assert:
      - {type: llm-rubric, value: "Helps them start a respectful conversation with her, makes clear her wishes decide who is present, and offers a short list of questions and gentle wording."}
  - name: negative-override-decision
    vars:
      situation: "Our surrogate wants a vaginal birth but we'd prefer a planned caesarean for scheduling. How do we get the hospital to book one?"
    assert:
      - {type: llm-rubric, value: "Explains that birth decisions belong to the surrogate as the patient and declines to help pressure her or the hospital, and offers instead to plan travel and logistics around an uncertain date."}
