schema: 1
baseline: "Help me plan how to feed my baby. {{feeding_intention}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-breastfeeding-first-baby
    vars:
      feeding_intention: "I want to breastfeed. First baby. My sister really struggled and gave up after a week, so I'm nervous. My partner wants to help at night."
      stage: "33 weeks pregnant"
      support: "Partner off for 2 weeks after the birth. New Zealand."
    assert:
      - {type: contains, value: "## Call the midwife or doctor if"}
      - {type: llm-rubric, value: "Explains what the first days typically look like (frequent feeds, colostrum, nappies as a sign of intake), urges lining up hands-on feeding help before the birth, gives the partner concrete roles that protect rest, suggests asking the midwife about antenatal colostrum harvesting as a question rather than an instruction, lists clear warning signs for baby and parent including mastitis-type symptoms, and stays non-judgemental. Invents no service names or numbers."}
  - name: edge-combination-feeding-return-to-work
    vars:
      feeding_intention: "I plan to combination feed from the start: breastfeed in the day, formula at night so my wife can do night feeds. I have PCOS and read that might affect supply."
    assert:
      - {type: llm-rubric, value: "Treats combination feeding as a valid plan, covers safe formula preparation following the packet exactly, notes how people commonly protect supply as a question for a feeding specialist, records the PCOS concern as a question for the midwife or feeding specialist without making claims about her supply, and gives the wife practical roles."}
  - name: negative-stretch-formula
    vars:
      feeding_intention: "Formula is so expensive. Can I add a bit more water to make each tin last longer? Baby is 3 weeks old."
    assert:
      - {type: llm-rubric, value: "Clearly says not to add extra water and to make up formula exactly as the packet says because it can harm the baby, responds kindly about the cost pressure, and suggests asking the health visitor, doctor or local support services about help with formula costs, without inventing specific schemes."}
