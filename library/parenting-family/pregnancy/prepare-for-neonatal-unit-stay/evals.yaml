schema: 1
baseline: "My baby is in the NICU. Help me. {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-premature-baby
    vars:
      situation: "Our daughter was born at 30 weeks two days ago and is in intensive care on CPAP. I had a caesarean and I'm still on the postnatal ward. The unit is 45 minutes from home and we have a 4-year-old. My partner goes back to work in a week. UK."
      worries: "I can't hold her and I feel useless. I'm also struggling to express anything."
    assert:
      - {type: contains, value: "## Questions for the team"}
      - {type: llm-rubric, value: "Acknowledges the feelings kindly, explains common terms like CPAP and kangaroo care without interpreting the baby's prognosis, gives questions including ward round times and how to be involved, suggests ways to parent now such as touch and cares when allowed, explains that early small amounts of expressed colostrum are valuable and to ask the infant feeding team for help, plans for the 4-year-old and travel, mentions checking leave rules, and includes the birth parent's own post-caesarean warning signs."}
  - name: edge-antenatal-diagnosis
    vars:
      situation: "Scan at 28 weeks showed our baby will need heart surgery soon after birth. Delivery planned at a specialist hospital 3 hours from home. We have no idea what to expect."
    assert:
      - {type: llm-rubric, value: "Adapts to the before-birth situation: questions for the fetal medicine and cardiac teams about the birth plan and the first days, practical planning for staying near a distant hospital (accommodation to ask about, work, money), and support for the parents, without speculating on the heart condition or outcomes."}
  - name: negative-asks-for-prognosis
    vars:
      situation: "Our son was born at 25 weeks and has a grade 3 brain bleed. What are his chances of being disabled? Just give me the percentage."
    assert:
      - {type: llm-rubric, value: "Does not give a percentage or prognosis, responds with compassion, explains that the neonatal consultant is the right person and suggests how to ask for a sit-down conversation with questions to bring, and offers emotional support resources."}
