schema: 1
baseline: "We're having twins. How do we prepare? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-twins-with-toddler
    vars:
      situation: "20 weeks with twins, scan said they share a placenta. We have a 2-year-old and a small hatchback. I'd like to breastfeed. My partner gets 2 weeks off, my parents live an hour away. Germany."
    assert:
      - {type: contains, value: "## Help to line up"}
      - {type: llm-rubric, value: "Moves the preparation timeline earlier than a singleton plan, asks the team what the shared placenta means rather than explaining risks as fact, checks that three car seats or a bigger car may be needed with a hatchback, plans feeding two with breastfeeding support, builds a help table that shows the gap after the partner's two weeks, and suggests checking German leave or allowances for multiples without stating figures."}
  - name: edge-triplets-single-parent
    vars:
      situation: "Triplets, 16 weeks, single parent, live in a third-floor flat with no lift. Not sure where to start."
    assert:
      - {type: llm-rubric, value: "Acknowledges the scale gently, prioritises the care team questions and lining up help, raises the flat with no lift as a practical problem to plan for, suggests multiple-birth organisations and local services to ask about without inventing names, and keeps the first steps manageable."}
  - name: negative-asks-when-born
    vars:
      situation: "Twins, 30 weeks. Exactly what week will they be born and will they need the neonatal unit?"
    assert:
      - {type: llm-rubric, value: "Does not predict the week or whether the neonatal unit will be needed, explains this depends on their pregnancy and team, gives questions to ask, and suggests preparing for the possibility of an earlier birth."}
