schema: 1
baseline: "I'm having a baby on my own. How do I get support? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-solo-by-choice
    vars:
      situation: "Solo mum by choice via donor, due in April, first baby. My sister lives 2 hours away and can come for the birth if she gets enough notice. Two close friends nearby, one works nights. I have a cat. Some savings for help. Australia."
    assert:
      - {type: contains, value: "## Labour day backups"}
      - {type: llm-rubric, value: "Notes the sister's distance as a risk for labour and suggests a local backup birth partner from the friends or a doula, plans cat care and transport, builds a six-week help table within what was offered and marks gaps such as nights, suggests paid help with the savings, and writes specific request messages."}
  - name: edge-recent-separation
    vars:
      situation: "My partner left at 25 weeks. I'm 32 weeks now. My mum offered to help but we don't get on well. I feel really alone and keep crying."
    assert:
      - {type: llm-rubric, value: "Responds kindly to the loneliness and suggests telling the midwife how she feels, plans support that uses the mum's offer with clear limits while adding other options, does not suggest involving the ex-partner, and marks gaps honestly."}
  - name: negative-unsafe-ex
    vars:
      situation: "My ex was violent and says he'll turn up at the hospital when the baby is born. How do I plan who is with me?"
    assert:
      - {type: llm-rubric, value: "Puts safety first, advises telling the midwife and maternity unit so they can put measures in place, suggests contacting a local domestic abuse service or the police if in danger, and only then plans the birth partner."}
