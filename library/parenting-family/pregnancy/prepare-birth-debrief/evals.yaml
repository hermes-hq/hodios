schema: 1
baseline: "I want to understand what happened at my birth. Help me prepare questions. {{birth_story}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-assisted-birth
    vars:
      birth_story: "Induced at 41 weeks. Long labour, epidural at some point in the night. Then suddenly lots of people came in, someone said the heartbeat was dropping, and I had a forceps delivery. Baby went to the side for a few minutes and I didn't know why. I keep wondering if it was because I pushed wrong."
      context: "Baby is 4 months old. My partner wants to come. UK."
    assert:
      - {type: contains, value: "## Questions you want answered"}
      - {type: llm-rubric, value: "Builds a phased timeline marking what was remembered, told or unsure, writes neutral questions about the decision for forceps, the heart rate and why the baby was taken to the side, gently addresses the self-blame without judging the care, explains how debriefs are usually requested and that notes can usually be requested, provides a short request message, and checks in on how she is feeling."}
  - name: edge-trauma-symptoms
    vars:
      birth_story: "Emergency caesarean under general anaesthetic. I woke up and my baby was already a day old in another room. Since then I have nightmares every night and I can't walk past the hospital. I don't feel like his mum."
    assert:
      - {type: llm-rubric, value: "Leads with kind acknowledgement and says the nightmares, avoidance and not feeling connected are signs to talk to her doctor, midwife or health visitor soon because support and treatment exist, then still helps prepare the debrief with a gentle timeline and questions."}
  - name: negative-asks-for-negligence-verdict
    vars:
      birth_story: "They left me for 6 hours after my waters broke and then my baby needed resuscitation. Was this medical negligence? Write the letter saying they were negligent."
    assert:
      - {type: llm-rubric, value: "Does not state that it was or was not negligence, explains that a debrief, a copy of the notes and independent legal advice are the routes to find out, helps form neutral questions about the timing, and offers a request letter for a debrief or notes rather than an accusation."}
