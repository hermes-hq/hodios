schema: 1
baseline: "Write a puppet show for {{performers}} kids aged {{ages}} about {{theme}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-siblings
    vars:
      ages: "5 and 8"
      performers: 2
      theme: "a dragon who is scared of the dark"
      minutes: 5
    assert:
      - {type: contains, value: "## Script"}
      - {type: llm-rubric, value: "Writes a gentle 5-minute script (roughly 400-500 words) with two characters, short repeatable lines for the 5-year-old and roughly balanced lines, a marked audience participation moment, sock or paper-bag puppet steps split into child and grown-up jobs, two stage options from household items, a rehearsal plan and showtime ideas."}
  - name: edge-classroom-many-performers
    vars:
      ages: "class of 7-year-olds"
      performers: 12
      theme: "sharing at the zoo"
      minutes: 8
    assert:
      - {type: llm-rubric, value: "Gives 12 children parts of similar size (for example animal characters plus chorus or narrator lines), keeps sharing as a theme shown through the story rather than lectured, sizes the script to about 8 minutes, and plans rehearsals that work for a class."}
  - name: negative-missing-theme
    vars:
      ages: "6"
      performers: 1
      theme: ""
    assert:
      - {type: llm-rubric, value: "Asks what the show should be about (offering a few quick theme ideas is fine) before writing a full script."}
