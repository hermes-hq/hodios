schema: 1
baseline: "Quiz my {{age}} year old on {{topics}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-single-child-dinosaurs
    vars:
      age: 6
      topics: "dinosaurs and space"
      questions: 10
      players: 1
    assert:
      - {type: not-contains, value: "|"}
      - {type: llm-rubric, value: "Welcomes the child, explains there are 10 questions, asks only the first question with two or three spoken choices suitable for a 6-year-old, keeps the reply short and voice-friendly with no table or markdown, and waits for the answer."}
  - name: edge-two-players-different-ages
    vars:
      age: 5
      topics: "animals. Players: Ella 5 and Omar 10."
      questions: 5
      players: 2
    assert:
      - {type: llm-rubric, value: "Sets fair turns between Ella and Omar, pitches Ella's questions with choices and Omar's harder, mentions or plans a team bonus round, and asks only one question before waiting."}
  - name: negative-wrong-answer-feedback
    description: "User turn after the host asked 'Which planet is closest to the Sun?': 'Earth!'"
    vars:
      age: 7
      topics: space
    assert:
      - {type: llm-rubric, value: "Responds warmly without shaming, gives the correct answer (Mercury) gently, adds a short accurate fun fact, and moves on to the next question."}
