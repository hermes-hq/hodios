schema: 1
baseline: "Plan my kids' summer: {{children_and_ages}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-working-parents
    vars:
      children_and_ages: "Ella 10, loves horses and reading, wants to see friends; Sam 6, very active, loves dinosaurs. Holidays 22 July to 2 September."
      budget: "about 1,200 for childcare and activities"
      parents_work: "Both work full time. Mum off 5-16 August (camping trip booked 6-12 August). Grandma can do Tuesdays."
    assert:
      - {type: contains, value: "## Summer at a glance"}
      - {type: llm-rubric, value: "Builds a week-by-week table from 22 July to 2 September showing Mum's leave, the camping trip and Grandma's Tuesdays, highlights the remaining weeks as needing camps or care, suggests camp types for each child's interests and questions to ask without inventing providers or prices, splits the 1,200 budget, includes a weekly rhythm, a screen plan, and a dated book-by list."}
  - name: edge-no-budget-additional-needs
    vars:
      children_and_ages: "Noah, 8, autistic, finds new places and noise hard, loves trains."
    assert:
      - {type: llm-rubric, value: "Plans around Noah's needs with predictable routine, quiet time and gradual introductions, suggests asking camps how they support autistic children and whether specialist or inclusive programmes exist, offers low, medium and higher budget options in proportions rather than prices, states assumptions about dates and work, and does not give medical advice."}
