schema: 1
baseline: "Make up a game to practise {{skill}} for a {{child_age}}-year-old."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-times-tables
    vars:
      skill: "7 and 8 times tables"
      child_age: 8
    assert:
      - {type: contains, value: "## How to play"}
      - {type: llm-rubric, value: "Invents a game where answering 7 and 8 times-table facts is the main move, not a quiz before the fun, uses simple materials such as dice or cards, gives numbered rules, includes easier and harder variations, handles wrong answers without knocking the child out, and uses correct multiplication facts."}
  - name: edge-social-skill-young
    vars:
      skill: "taking turns and losing without a meltdown"
      child_age: 4
      players: "My 4-year-old and her 7-year-old brother, who wins everything"
    assert:
      - {type: llm-rubric, value: "Designs a short, simple game for a four-year-old and a seven-year-old where turn-taking and losing happen often and in low-stakes ways, adds a handicap or luck element so the four-year-old wins sometimes, has the adult or the older child model losing gracefully with words to say, avoids choking hazards, and keeps rules explainable in a minute."}
  - name: negative-too-broad
    vars:
      skill: "maths"
      child_age: 6
    assert:
      - {type: llm-rubric, value: "Picks a specific maths sub-skill suitable for a six-year-old (for example number bonds to 10 or counting on), says which one it chose, builds the game around it, and suggests other sub-skills to try next."}
