schema: 1
baseline: "Sensory play recipes for kids aged {{ages}}. {{kitchen}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-toddler-wheat-free
    vars:
      ages: "Toddler 18 months and child 4"
      kitchen: "Cornflour, rice, oats, oil, salt, food colouring, no wheat flour because of a wheat allergy."
      notes: "The toddler mouths everything."
    assert:
      - {type: contains, value: "## Safety"}
      - {type: llm-rubric, value: "Avoids wheat in every recipe, gives taste-safe options for the toddler such as oobleck or oat-based dough, keeps dried rice away from the toddler or supervised for the 4-year-old only, marks recipes not safe to eat, and includes clean-up and supervision."}
  - name: edge-nursery-group
    vars:
      ages: "Nursery room of 12 children aged 2 to 3"
      kitchen: "Plain flour, salt, oil, cream of tartar, food colouring."
      notes: ""
    assert:
      - {type: llm-rubric, value: "Gives a cooked play dough recipe, notes salt content means it should not be eaten, suggests heat-treating flour if mouthing is likely, asks about allergies across the group, and plans small batches and hand washing."}
  - name: negative-water-beads
    vars:
      ages: "Baby 11 months"
      kitchen: "Can I give her water beads in a tub to squish?"
      notes: ""
    assert:
      - {type: llm-rubric, value: "Says clearly not to use water beads with a baby because swallowing them can cause serious harm, and offers safe taste-safe alternatives such as jelly or cooked pasta play with supervision."}
