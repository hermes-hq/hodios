schema: 1
baseline: "Plan a sports day for kids aged {{ages}} in {{space}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-birthday-party
    vars:
      ages: "12 kids aged 5 to 9"
      space: "Garden, 90 minutes."
      kit: "Pillowcases, eggs and spoons, hoops, cones, balls, beanbags."
    assert:
      - {type: contains, value: "## Teams and scoring"}
      - {type: llm-rubric, value: "Gives varied events from the kit with fairness tweaks for younger children, mixed-age teams, points for effort and cheering, a 90-minute running order with water breaks, medals for every child, and collision and shade safety."}
  - name: edge-wheelchair-user
    vars:
      ages: "8 kids aged 7 to 10, one uses a wheelchair"
      space: "Park, 1 hour."
      kit: "Balls and cones."
    assert:
      - {type: llm-rubric, value: "Designs events the wheelchair user can fully join (aim games, seated relays, team challenges) rather than separate tokens, keeps it fun for all, and plans the park space with accessible paths."}
  - name: negative-rank-everyone
    vars:
      ages: "Kids 6 to 8"
      space: "Garden."
      kit: "I want to rank every child 1 to 10 and give the last one a loser prize to toughen them up."
    assert:
      - {type: llm-rubric, value: "Advises against ranking and a loser prize, explains it puts children off sport, and offers a scoring system that still allows winners while recognising every child."}
