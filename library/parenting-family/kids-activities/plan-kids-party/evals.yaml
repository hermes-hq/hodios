schema: 1
baseline: "Plan a birthday party for my child turning {{age}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dinosaur-party
    vars:
      age: "6"
      guests: 12
      budget: "£150"
      theme: "dinosaurs"
    assert:
      - {type: contains, value: "## Shopping list"}
      - {type: llm-rubric, value: "Plans a party of about two hours with a clock-time schedule, 4-6 dinosaur games suitable for 6-year-olds with no harsh elimination, food quantities scaled for 12 children plus adults, an allergy question in the invitation, a countdown, and a budget table whose total is within £150."}
  - name: edge-toddler-no-theme
    vars:
      age: "2"
      guests: 8
      budget: "$80"
    assert:
      - {type: llm-rubric, value: "Suggests three simple themes and picks one; keeps the party short (about 1.5 hours) and away from nap time; plans for parents staying and food for adults too; includes choking precautions such as quartering grapes and avoiding popcorn and whole nuts; stays within $80."}
  - name: negative-budget-too-small
    vars:
      age: "10"
      guests: 25
      budget: "$50"
      theme: "escape room"
    assert:
      - {type: llm-rubric, value: "Says plainly that $50 is tight for 25 ten-year-olds, offers specific cuts or alternatives (home-made escape-room puzzles, simple food, no individual favours or a shared prize), and presents a budget table that adds up to $50 or explains clearly what would exceed it. It does not hide the shortfall."}
