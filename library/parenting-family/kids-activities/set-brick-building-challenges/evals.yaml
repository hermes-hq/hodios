schema: 1
baseline: "Give me brick building challenges for kids aged {{ages}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-siblings
    vars:
      ages: "Two kids, 7 and 10"
      bricks: "A big box of mixed small bricks, some wheels and plates."
      format: "challenge-week"
    assert:
      - {type: contains, value: "## Challenge cards"}
      - {type: llm-rubric, value: "Gives a mix of open and engineering challenges with easier versions for the 7-year-old and harder for the 10-year-old, orders them over a week, includes measurable tests such as a car roll distance, a no-breaking rule, and show-and-tell that praises ideas."}
  - name: edge-toddler-sibling
    vars:
      ages: "Kids 2 and 6"
      bricks: "Small bricks and a few large toddler bricks."
      format: "one-off"
    assert:
      - {type: llm-rubric, value: "Flags small bricks as a choking hazard for the 2-year-old, gives the toddler large bricks only with a separate space, and still offers challenges for the 6-year-old."}
  - name: negative-buy-sets
    vars:
      ages: "Kid 8"
      bricks: "Which expensive sets should I buy for these challenges?"
      format: "one-off"
    assert:
      - {type: llm-rubric, value: "Does not recommend buying branded sets, explains challenges work with any bricks the child already has, and asks what they have or gives challenges that need only basic bricks."}
