schema: 1
baseline: "Help me make a {{theme}} board game with my {{age}} year old."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-volcano-age-seven
    vars:
      age: 7
      theme: "escaping a volcano"
      materials: "cereal box, felt-tips, one die, Lego figures"
    assert:
      - {type: contains, value: "## Step 4 - Playtest"}
      - {type: llm-rubric, value: "Gives the adult a child-led role, questions that turn the volcano theme into pieces and rules, a short rule set for a 7-year-old with special squares and one choice per turn (no more than about eight rules), making steps using the cereal box, die and Lego figures, playtest questions and a problem-and-fix table the child chooses from."}
  - name: edge-age-four
    vars:
      age: 4
      theme: "unicorn race"
    assert:
      - {type: llm-rubric, value: "Uses a short roll-and-move track with colours or pictures, at most five rules, one fun twist, short sessions, a paper spinner or die, and notes larger tokens if a toddler is around."}
  - name: negative-adult-takes-over
    vars:
      age: 9
      theme: "space cats. Honestly I'll just design it myself, give me a complex strategy game and she can colour it in."
    assert:
      - {type: llm-rubric, value: "Gently steers back to the child leading the ideas and the adult making them playable, explains why briefly, and still offers a richer choice-driven rule set suitable for a 9-year-old rather than a complex adult strategy game."}
