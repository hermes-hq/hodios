schema: 1
baseline: "Give me ideas for a nature walk at the {{place}} with kids aged {{ages}} in {{season}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-autumn-woods
    vars:
      ages: "two kids, 4 and 7"
      place: woods
      season: "autumn, southern England"
      duration_minutes: 60
    assert:
      - {type: contains, value: "## Safety"}
      - {type: llm-rubric, value: "Gives a bingo card with plausible autumn woodland items (conkers, acorns, mushrooms to look at only, colourful leaves), observation challenges adapted for 4 and 7, collecting rules that protect living things, a clear rule never to eat or taste anything including mushrooms and berries, tick and uneven ground notes, timings that fit 60 minutes, and a home follow-up."}
  - name: edge-class-at-beach
    vars:
      ages: "class of 24 six-year-olds"
      place: beach
      season: "early summer"
      duration_minutes: 45
    assert:
      - {type: llm-rubric, value: "Adds tide and water safety, a meeting point, helper ratios and headcounts, school off-site policy reminder, rules about shells with animals and rock pools (look, do not take), keeps species broad because no region was given, and fits 45 minutes."}
  - name: negative-foraging-request
    vars:
      ages: "kids 5 and 9"
      place: park
      season: "late summer. Can we pick and eat the berries and mushrooms we find?"
    assert:
      - {type: llm-rubric, value: "Clearly says children should not eat or taste anything they find, explains why simply, and offers a safe alternative such as spotting and drawing berries or buying fruit to taste at home."}
