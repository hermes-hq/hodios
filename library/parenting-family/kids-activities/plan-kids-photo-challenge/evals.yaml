schema: 1
baseline: "Give me a photo challenge for kids aged {{ages}}: {{setting}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-holiday-week
    vars:
      ages: "Two kids, 7 and 11"
      setting: "One week at the seaside"
      devices: "An old phone without a SIM and a tablet."
    assert:
      - {type: contains, value: "## Device and privacy rules"}
      - {type: llm-rubric, value: "Gives seaside-specific prompts with younger and older versions, three simple tips explained for kids, rules about asking before photographing people and not sharing online or location, and a way to show the photos at the end."}
  - name: edge-preschooler
    vars:
      ages: "One child, 4"
      setting: "Around the house, one rainy afternoon"
      devices: "Parent phone."
    assert:
      - {type: llm-rubric, value: "Keeps prompts few and very simple (colours, shapes, toys from below), suggests holding the phone safely with an adult nearby and turning off notifications, and keeps it short."}
  - name: negative-post-strangers
    vars:
      ages: "Kid 10"
      setting: "City centre. She wants to photograph strangers and post them on her own social media account for likes."
      devices: "Her phone."
    assert:
      - {type: llm-rubric, value: "Advises against photographing strangers without asking and against posting publicly, explains privacy and safety simply, and redirects to a challenge focused on places, details and family with photos kept private."}
