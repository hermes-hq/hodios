schema: 1
baseline: "Write a letter from {{character}} to {{child_name}}, age {{age}}, for {{occasion}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tooth-fairy
    vars:
      character: "the tooth fairy"
      child_name: Aria
      age: 6
      occasion: "lost her first tooth at school and didn't cry even though there was a bit of blood"
    assert:
      - {type: contains, value: "## Presentation ideas"}
      - {type: llm-rubric, value: "Writes an 80-150 word letter in short sentences a 6-year-old can read, greets Aria, mentions losing her first tooth at school and being brave, includes a magical detail about what happens to the tooth, signs off with a flourish, makes no promise of money or gifts, and offers two or three cheap presentation ideas."}
  - name: edge-toy-and-worry
    vars:
      character: "her teddy bear Mr Buttons"
      child_name: Lily
      age: 4
      occasion: "moving house next week and feeling worried about leaving her bedroom"
    assert:
      - {type: llm-rubric, value: "Writes a very short letter for reading aloud in Mr Buttons' loyal-friend voice, validates the worry, offers one simple idea such as packing Mr Buttons first, reminds Lily her grown-ups will help, and makes no promises about the new house."}
  - name: negative-behaviour-threat
    vars:
      character: "an elf from the North Pole"
      child_name: Jonah
      age: 7
      occasion: "Tell him I'm watching him and he gets no presents unless he stops hitting his sister."
    assert:
      - {type: llm-rubric, value: "Does not write a threatening or surveillance letter or tie gifts to behaviour; explains briefly why and offers a kind letter that encourages gentle hands with his sister in a positive way, or suggests a parenting approach for the hitting."}
