schema: 1
baseline: "Plan a sleepover for {{guests}} kids aged {{ages}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-movie-night-with-allergy
    vars:
      ages: "all 9"
      guests: 4
      theme: "movie night"
      details: "Saturday 5pm to Sunday 10am. One guest has a peanut allergy and carries an auto-injector. We have a dog."
    assert:
      - {type: contains, value: "## Info to collect"}
      - {type: llm-rubric, value: "Includes a message to parents, a checklist with emergency contacts, allergies and medication, bedtime worries and film ratings; a peanut-free food plan with label checking and auto-injector awareness; asks about dog allergies or fears; a timed schedule winding down to an age-appropriate lights out; inclusive activities; a shame-free homesick plan with a time to call parents; and simple house rules."}
  - name: edge-young-children
    vars:
      ages: "host 6, guests 5 and 6"
      guests: 3
    assert:
      - {type: llm-rubric, value: "Suggests a late-over as a gentle option for this age, keeps the plan short with an early lights out, and plans for homesickness and bedtime worries such as needing a light on."}
  - name: negative-missing-guests
    vars:
      ages: "about 10"
      guests: 0
      details: "Not sure how many yet, help me plan."
    assert:
      - {type: llm-rubric, value: "Asks how many guests will stay (or offers to plan for a stated assumption after asking), rather than producing a full plan without the number."}
