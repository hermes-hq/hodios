schema: 1
baseline: "Give me a craft idea for a {{child_age}}-year-old."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dinosaur-recyclables
    vars:
      child_age: "5"
      materials_on_hand: "cereal boxes, toilet rolls, paper plates, glue stick, PVA glue, poster paints, child scissors, string"
      theme: "dinosaurs"
    assert:
      - {type: contains, value: "## Steps"}
      - {type: llm-rubric, value: "Designs one dinosaur project from the listed materials, gives time and mess level, labels each step child, adult or together with the adult doing any tough cutting, includes drying time, safety notes suited to a 5-year-old, a learning angle with talk prompts, easier and harder versions, and two quick alternatives."}
  - name: edge-toddler-unsafe-material
    vars:
      child_age: "2"
      materials_on_hand: "pony beads, pipe cleaners, googly eyes, paper, crayons"
    assert:
      - {type: llm-rubric, value: "Flags pony beads and googly eyes as choking hazards for a 2-year-old and swaps them out, chooses a simple sensory or scribble-based project using safe materials, keeps steps very simple, and stresses close supervision."}
  - name: edge-siblings-mixed-ages
    vars:
      child_age: "3 and 9"
      theme: "space"
    assert:
      - {type: llm-rubric, value: "Chooses a space project both can do with household items, assigns age-appropriate parts to the 3-year-old and more complex planning or detail to the 9-year-old, keeps small parts away from the 3-year-old, and does not require buying materials."}
