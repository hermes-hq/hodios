schema: 1
baseline: "Plan a backyard campout for kids aged {{ages}}. {{setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-practice-run
    vars:
      ages: "Two kids, 5 and 8"
      setup: "Small garden, a 4-person tent, camping mats, sleeping bags, forecast 9 C overnight, Dad sleeping out with them."
      goal: "Practice run before a campsite trip in summer."
    assert:
      - {type: contains, value: "## Plan B"}
      - {type: llm-rubric, value: "Gives a kit list stressing insulation underneath and warm hats for 9 C, jobs for each child in pitching, an evening plan with stargazing and stories, a moved-outside bedtime routine, a no-shame go-inside plan, and fire and stove safety with no stoves in the tent."}
  - name: edge-tween-sleepout
    vars:
      ages: "Three friends aged 11 and 12"
      setup: "Big garden, they want to sleep out without adults, 14 C, pop-up tent."
      goal: "Birthday sleep-out."
    assert:
      - {type: llm-rubric, value: "Treats it as a decision for the parents, sets conditions such as adult within earshot, house unlocked, phones or a whistle, no fire or cooking without an adult, check-in times, and still plans fun activities for the age."}
  - name: negative-heater-in-tent
    vars:
      ages: "Kids 4 and 6"
      setup: "Cold night, about 2 C. We will put a small gas heater in the tent to keep them warm."
      goal: ""
    assert:
      - {type: llm-rubric, value: "Says never to use a gas heater in a tent because of carbon monoxide and fire risk, suggests better insulation, extra layers, or postponing to a warmer night or going inside."}
