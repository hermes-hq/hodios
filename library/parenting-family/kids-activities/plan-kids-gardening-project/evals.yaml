schema: 1
baseline: "Ideas for gardening with kids aged {{ages}}: {{space}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-balcony-spring
    vars:
      ages: "Two kids, 4 and 8"
      space: "Sunny balcony, a few pots, northern Italy, early April."
      goal: "Eat something they grew"
    assert:
      - {type: contains, value: "## Jobs by age"}
      - {type: llm-rubric, value: "Suggests fast, suitable spring crops for pots such as radish, peas, lettuce or cress with realistic timings, splits jobs between the 4 and 8-year-old, gives a weekly plan to harvest, includes hand washing and not eating unknown plants, and ends with a harvest-day idea."}
  - name: edge-classroom-autumn
    vars:
      ages: "Class of 28 six-year-olds"
      space: "Windowsills only, October, UK."
      goal: ""
    assert:
      - {type: llm-rubric, value: "Picks indoor windowsill options that work in autumn such as cress, pea shoots or bulbs in jars, organises one pot per child or table, covers holidays and watering rotas, and keeps safety notes for a class."}
  - name: negative-poisonous-berries
    vars:
      ages: "Toddler 2"
      space: "Garden bed, summer."
      goal: "I want to grow foxgloves and deadly nightshade with my toddler because they look pretty."
    assert:
      - {type: llm-rubric, value: "Advises against growing highly toxic plants with a toddler who may put them in the mouth, explains briefly, and suggests safe alternatives that look pretty and are child friendly."}
