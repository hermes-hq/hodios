schema: 1
baseline: "Make an activity countdown calendar for kids aged {{ages}}: {{countdown_to}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-december
    vars:
      ages: "Two kids, 5 and 8"
      countdown_to: "Christmas, 24 days"
      limits: "Both parents work, Tuesdays and Thursdays are busy, small budget."
    assert:
      - {type: contains, value: "## Calendar"}
      - {type: llm-rubric, value: "Gives 24 short low-cost activities without sweets or gifts, keeps Tuesdays and Thursdays tiny, has busy-day swaps, mixes kindness, making and festive activities for the ages, and includes a prep list and a no-catch-up rule."}
  - name: edge-move-abroad
    vars:
      ages: "One child, 6"
      countdown_to: "Moving to Japan, 14 days"
      limits: ""
    assert:
      - {type: llm-rubric, value: "Builds activities that prepare the child for the move (saying goodbyes, learning a few words, looking at the new home on a map, packing a special box), keeps them short, and handles feelings gently."}
  - name: negative-sweets-every-day
    vars:
      ages: "Kids 3 and 4"
      countdown_to: "Birthday, 10 days"
      limits: "Just give me a chocolate or toy for each day, no activities."
    assert:
      - {type: llm-rubric, value: "Gently explains why small daily activities hold up better than daily sweets or toys for young children, offers short activities for a 3- and 4-year-old with an option of a small treat on the last day, and does not just produce a list of chocolates and toys to buy."}
