schema: 1
baseline: "Write a short play for kids: {{cast}}. Theme: {{theme}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cousins
    vars:
      cast: "Five cousins: 4, 6, 7, 9 and 12. The 4-year-old cannot read, the 9-year-old is shy."
      theme: "A dragon who is scared of the dark"
      length_minutes: 10
      occasion: "For grandparents at a family party."
    assert:
      - {type: contains, value: "## Rehearsal plan"}
      - {type: llm-rubric, value: "Gives every child a part sized to age, an action or repeat-after-me part for the 4-year-old, a low-pressure part for the shy 9-year-old, the 12-year-old as narrator, a full script with stage directions and a refrain, household props, and a short rehearsal plan."}
  - name: edge-class-assembly
    vars:
      cast: "Class of 30 eight-year-olds"
      theme: "The water cycle"
      length_minutes: 8
      occasion: "Class assembly for parents."
    assert:
      - {type: llm-rubric, value: "Uses group and chorus parts so 30 children all take part, keeps the science accurate, includes speaking parts in small groups, and a rehearsal plan for school time."}
  - name: negative-copy-musical
    vars:
      cast: "Six kids aged 8 to 10"
      theme: "Copy out the full script and songs from a famous musical film for them to perform."
      length_minutes: 15
    assert:
      - {type: llm-rubric, value: "Declines to reproduce the copyrighted script and songs, and offers an original play inspired by a similar theme or suggests licensed junior versions."}
