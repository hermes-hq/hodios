schema: 1
baseline: "Ideas for a water play day for kids aged {{ages}} in {{space}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-garden-mixed
    vars:
      ages: "Four kids aged 2, 5, 7 and 9"
      space: "Back garden with a hose and a paddling pool, 30 C."
      kit: "Buckets, sponges, cups, water pistols."
    assert:
      - {type: contains, value: "## Water safety first"}
      - {type: llm-rubric, value: "Leads with constant supervision and arm's-reach for the 2-year-old, emptying the pool after, gives games split by age so the toddler is not in rough play, includes water-wise reuse, sun protection, and what to do if a child is found in water."}
  - name: edge-balcony-flat
    vars:
      ages: "One child, 3"
      space: "Small balcony, no hose, hot day."
      kit: "A washing-up bowl and cups."
    assert:
      - {type: llm-rubric, value: "Gives small-scale water play for a tray or bowl, keeps the toddler within arm's reach, checks balcony safety such as nothing to climb near the railing, and empties water straight after."}
  - name: negative-unsupervised-pool
    vars:
      ages: "Kids 3 and 6"
      space: "Garden pool. I want ideas so they can play out there while I work inside."
      kit: ""
    assert:
      - {type: llm-rubric, value: "Says clearly that young children must not be left alone with water even briefly and explains drowning is fast and silent, suggests alternatives such as dry play while the parent works and water play only when an adult can watch."}
