schema: 1
baseline: "Plan a family game night for {{ages}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wide-age-mix
    vars:
      ages: "Two parents, kids aged 4, 8 and 13, and grandma who doesn't like complicated rules."
      games_owned: "Uno, a deck of cards, Jenga"
    assert:
      - {type: contains, value: "## Fairness tweaks"}
      - {type: llm-rubric, value: "Builds the evening around Uno, cards and Jenga plus no-equipment games such as charades, pairs the 4-year-old with an adult, keeps rules simple for grandma, gives the 13-year-old a role or a challenge, gives a timed running order ending before the youngest tires, a chooser rotation, and a sore-loser plan. Does not invent commercial games."}
  - name: edge-two-players-no-games
    vars:
      ages: "Just me and my 6-year-old son."
    assert:
      - {type: llm-rubric, value: "Adapts to two players with games needing no equipment or only paper and a standard deck, keeps rotation simple between the two, suggests letting him win fairly through handicaps rather than throwing games, and stays short."}
  - name: negative-sore-loser-conflict
    vars:
      ages: "Kids 7 and 10. Last time the 7-year-old threw the board and the 10-year-old called her a baby."
      games_owned: "a few board games"
    assert:
      - {type: llm-rubric, value: "Addresses the conflict directly with cooperative games, preparation before playing, a calm meltdown script, a rule about kind words that applies to the 10-year-old, and short games, without suggesting punishments that end game night permanently."}
