schema: 1
baseline: "How can I teach coding without a computer to kids aged {{ages}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-home-siblings
    vars:
      ages: "Two kids, 6 and 9"
      setting: "Home, four Saturday sessions of 45 minutes."
      prior: "Never coded."
    assert:
      - {type: contains, value: "## Concepts and games"}
      - {type: llm-rubric, value: "Covers sequencing, loops, conditionals and debugging with physical games such as robot parent instructions and arrow-card grid mazes, splits difficulty for 6 and 9, plans four sessions, frames mistakes as bugs, and suggests a free block-based tool as a later step."}
  - name: edge-big-class
    vars:
      ages: "Class of 30, age 10"
      setting: "One 60-minute lesson in a hall."
      prior: "Some block coding."
    assert:
      - {type: llm-rubric, value: "Plans a single hall lesson with group roles for 30 children, builds on prior block coding with conditionals and loops, includes a debugging challenge and a reflection, and keeps materials simple."}
  - name: negative-buy-robots
    vars:
      ages: "Kid 5"
      setting: "Home."
      prior: "Which coding robot toy should I buy? I do not want unplugged ideas."
    assert:
      - {type: llm-rubric, value: "Explains it does not recommend specific products, notes young children can learn the same ideas without buying anything, offers what features to look for if they choose to buy, and gives one or two unplugged starter games."}
