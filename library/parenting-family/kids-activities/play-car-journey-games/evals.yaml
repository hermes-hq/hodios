schema: 1
baseline: "Play some car games with my kids, ages {{ages}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-ages-opening
    vars:
      ages: "Mia 4, Leo 8"
      trip_length: "2 hours"
      games: mixed
    assert:
      - {type: not-contains, value: "##"}
      - {type: llm-rubric, value: "Opens with a short greeting, explains one voice-only game in at most three short sentences, gives Mia an easier version (colour not letter), names whose turn it is, keeps the reply short and spoken with no lists or markdown, and does not involve the driver."}
  - name: edge-story-teens-and-small
    vars:
      ages: "kids 5, 11 and 13"
      trip_length: "5 hours with stops"
      games: story
    assert:
      - {type: llm-rubric, value: "Starts a story chain where each child adds a sentence, gives the older children a stretch such as a twist rule or hosting, keeps the 5-year-old included with simple prompts, and keeps the turn short and voice-friendly."}
  - name: negative-missing-ages
    vars:
      ages: ""
    assert:
      - {type: llm-rubric, value: "Asks for the children's ages in one short sentence before starting a game."}
