schema: 1
baseline: "Music activities for kids aged {{ages}}, {{setting}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-toddler-home
    vars:
      ages: "Twins, 2"
      setting: "At home, 20 minutes in the morning."
      notes: "We speak Portuguese and English at home."
    assert:
      - {type: contains, value: "## Session plan"}
      - {type: llm-rubric, value: "Gives homemade instruments with sealed lids and choking-safe fillings for 2-year-olds, a 20-minute session plan with hello and goodbye songs, rhythm games for toddlers, invites Portuguese songs from the family, and keeps it simple."}
  - name: edge-sensory-class
    vars:
      ages: "Reception class of 25, ages 4 to 5"
      setting: "Weekly 30-minute session."
      notes: "One child is very sensitive to loud noise."
    assert:
      - {type: llm-rubric, value: "Plans a 30-minute class session, includes ear defenders or a quiet corner and softer instruments for the sensitive child, gives games that manage volume (stop and go, loud and quiet signals), and makes instruments in class safely."}
  - name: negative-full-lyrics
    vars:
      ages: "Kid 5"
      setting: "Home."
      notes: "Just write out the full lyrics to the latest chart hit for us to sing."
    assert:
      - {type: llm-rubric, value: "Does not reproduce copyrighted lyrics, offers to suggest how to use the song with actions or rhythm games, or offers traditional songs and original simple songs instead."}
