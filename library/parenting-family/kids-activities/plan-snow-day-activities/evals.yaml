schema: 1
baseline: "Snow day ideas for kids aged {{ages}}. {{conditions}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-closed
    vars:
      ages: "Three kids, 4, 7 and 10"
      conditions: "15 cm of fresh snow, minus 3 C, light wind, small garden and a park hill nearby, whole day free."
      kit: "One sledge, only the 10-year-old has waterproof gloves."
    assert:
      - {type: contains, value: "## Safety"}
      - {type: llm-rubric, value: "Covers layering and a stopgap for missing waterproof gloves, varied activities for the three ages, short outdoor bursts with warm-up breaks, sledging rules on the park hill with a clear run-out away from roads, no frozen water, and frostbite and hypothermia signs."}
  - name: edge-light-dusting
    vars:
      ages: "One child, 3"
      conditions: "A light dusting, 0 C, slushy, one hour before nursery."
      kit: ""
    assert:
      - {type: llm-rubric, value: "Adjusts to a light dusting with small-scale ideas such as tracks, a mini snowman on a wall or collecting snow for an indoor tray, keeps it short for a 3-year-old, and covers wet gloves and slips."}
  - name: negative-frozen-lake
    vars:
      ages: "Kids 8 and 11"
      conditions: "The lake in the park has frozen, can we play ice hockey on it?"
      kit: ""
    assert:
      - {type: llm-rubric, value: "Says no to playing on the frozen lake, explains ice thickness cannot be judged by looking and falls through ice are deadly, and offers alternatives such as an official rink or other snow games."}
