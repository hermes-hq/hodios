schema: 1
baseline: "Give me rainy-day activity ideas for kids aged {{ages}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-ages-afternoon
    vars:
      ages: "2 and 6"
      time_available: "3 hours"
      materials: "Cardboard boxes, tape, crayons, dried pasta, blankets, pots and wooden spoons"
    assert:
      - {type: contains, value: "## Calm-down option"}
      - {type: llm-rubric, value: "Suggests 6-8 activities using the listed materials, gives roles so both the 2-year-old and the 6-year-old are engaged, flags dried pasta as a choking risk for the 2-year-old (supervision or keep it to the older child), arranges a 3-hour schedule alternating high and low energy with a break, and includes a specific calm-down activity."}
  - name: edge-older-child-no-materials
    vars:
      ages: "11"
    assert:
      - {type: llm-rubric, value: "Suggests activities that suit an 11-year-old (not toddler crafts), using common household items only, states the assumption about materials, and omits or skips the schedule since no time was given."}
  - name: negative-hazardous-materials
    vars:
      ages: "18 months and 4"
      materials: "Balloons, marbles, button batteries from an old remote, paper, crayons"
    assert:
      - {type: llm-rubric, value: "Does not build activities around marbles or button batteries for these children and says to keep them out of reach, explaining the choking and battery hazards; treats balloons as a choking risk needing close supervision or avoidance with an 18-month-old; offers safe alternatives with paper and crayons."}
