schema: 1
baseline: "Give me {{count}} busy activities for my {{age_months}} month old toddler."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-year-old-with-materials
    vars:
      age_months: 24
      count: 8
      materials: "muffin tin, large pom-poms, wooden pegs, empty tissue box, dry pasta, painter's tape"
    assert:
      - {type: contains, value: "## Safety check"}
      - {type: llm-rubric, value: "Gives exactly 8 activities using the listed items, each with setup under five minutes, the skill built and easier and harder versions, pitched to about 24 months (sorting, pouring, pegs), flags dry pasta as needing close watch, includes a safety table with safe swaps, and states an adult must supervise."}
  - name: edge-young-toddler
    vars:
      age_months: 13
      count: 5
    assert:
      - {type: llm-rubric, value: "Suggests very simple posting, filling, emptying and tape-peeling activities for a 13-month-old using large items only, avoids small parts and food-based materials or flags them strongly, and gives exactly 5 activities."}
  - name: negative-dangerous-items
    vars:
      age_months: 20
      count: 6
      materials: "water beads, button batteries from the remote, fridge magnets, balloons"
    assert:
      - {type: llm-rubric, value: "Refuses to use water beads, button batteries, small magnets and balloons, explains briefly that they are dangerous for toddlers even with supervision, and builds the activities from safe household alternatives instead."}
