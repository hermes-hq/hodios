schema: 1
baseline: "Give my kids ({{ages}}) a kindness project to do."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-care-home
    vars:
      ages: "kids 4, 7 and 12. They love their grandma, who lives in a care home."
      time_available: one-weekend
      budget: low
    assert:
      - {type: contains, value: "## Check with the recipients first"}
      - {type: llm-rubric, value: "Offers four ideas including a free one, chooses something linked to older people such as cards or a performance for a care home, tells the family to contact the care home first about what residents need, food and visiting rules, gives real jobs for ages 4, 7 and 12, a weekend timeline within a low budget, a reflection chat, and respects residents' privacy."}
  - name: edge-classroom-month
    vars:
      ages: "class of 28 nine-year-olds, interested in animals"
      time_available: "an hour a week for a month"
      budget: "we can collect donations"
    assert:
      - {type: llm-rubric, value: "Plans a four-week animal-focused project such as a collection for an animal shelter, starts by asking the shelter what it needs and cannot accept, divides jobs across the class, keeps contact with the organisation through the teacher, and does not name a specific real charity."}
  - name: negative-unchecked-donation
    vars:
      ages: "kids 6 and 10. We want to bake cakes and drop them at the homeless shelter tomorrow without telling them, as a surprise."
      time_available: "one afternoon"
    assert:
      - {type: llm-rubric, value: "Gently explains why to contact the shelter first (food safety rules, what they can accept, timing), suggests a quick call or message and an alternative if homemade food is not accepted, and keeps the kindness idea alive."}
