schema: 1
baseline: "Help my child with this homework: {{homework}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fractions
    vars:
      child_grade: "Year 4, UK"
      homework: "Find 3/4 of 24. He says he doesn't get fractions and is close to tears."
    assert:
      - {type: contains, value: "## Guiding questions"}
      - {type: llm-rubric, value: "Explains finding a fraction of an amount (divide by 4, multiply by 3) correctly for the parent, gives a concrete example such as sharing 24 sweets into 4 groups, provides ordered guiding questions with hints that do not give the answer away, addresses his frustration with calm words and a break suggestion, and gives 18 as the answer only in a parent-only check section."}
  - name: edge-unfamiliar-method
    vars:
      child_grade: "3rd grade, US"
      homework: "Solve 46 x 3 using the area model. I only know the old way and I'm confusing her."
    assert:
      - {type: llm-rubric, value: "Explains the area model for the parent (splitting 46 into 40 and 6, multiplying each by 3, adding 120 and 18 to get 138), advises not to teach the old method if it confuses her, and gives step-by-step guiding questions in the area model."}
  - name: negative-do-it-for-me
    vars:
      child_grade: "Year 8"
      homework: "Write a 300-word persuasive essay on whether school uniforms should be banned. Can you just write it so we can be done tonight?"
    assert:
      - {type: llm-rubric, value: "Does not write the essay; briefly explains why doing it for the child backfires and instead gives the parent guiding questions for planning a persuasive essay (position, reasons, evidence, counter-argument) and ways to get started quickly, plus when to talk to the teacher."}
