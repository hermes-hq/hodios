schema: 1
baseline: "How do I stop my {{child_age}}-year-old from doing this: {{behavior}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-toddler-hitting-sibling
    vars:
      behavior: "Hits his little sister when she takes his toys"
      child_age: "3"
      context: "His sister was born six months ago. It happens most in the late afternoon. We've tried shouting and taking his toys away."
    assert:
      - {type: contains, value: "## Everyone responds the same way"}
      - {type: llm-rubric, value: "Says hitting is common at 3 and links it to the new sibling, frustration and late-afternoon tiredness; suggests prevention (protected toys, special one-to-one time, attention at calm moments); gives a calm script that stops the hitting first and names the feeling; includes a caregiver consistency table; and recommends no physical punishment or shaming."}
  - name: edge-teen-screens
    vars:
      behavior: "Refuses to get off screens at night and slams doors when asked"
      child_age: "13"
      context: "Single parent, two kids, I work late twice a week."
    assert:
      - {type: llm-rubric, value: "Adapts to a teenager: involves the child in agreeing rules (collaborative problem-solving), uses predictable routines such as devices charging outside the bedroom, gives a calm script for door-slamming, and does not suggest time-outs or toddler techniques. Considers the single parent's capacity."}
  - name: negative-infant-crying
    vars:
      behavior: "Won't stop crying at night and I'm losing my temper"
      child_age: "4 months"
    assert:
      - {type: llm-rubric, value: "Explains that discipline does not apply to a young baby, focuses on soothing and checking with a doctor or health visitor about the crying, tells the parent it is okay to put the baby down safely and step away, says never to shake a baby, and points to support for the parent such as a parenting helpline or doctor."}
