schema: 1
baseline: "How do I prepare my {{child_age}}-year-old for a new baby?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-toddler
    vars:
      child_age: "2 and a half"
      due_date: "in 14 weeks"
      situation: "Starts nursery in 6 weeks. We were planning to move her into a big-girl bed and start potty training soon. Grandma lives an hour away."
    assert:
      - {type: contains, value: "## The birth plan for your child"}
      - {type: llm-rubric, value: "Times the conversation for a toddler's sense of time, gives simple words about what babies are like, suggests doll play and baby photos without inventing book titles, advises timing the new bed, potty training and nursery start well before or a few months after the birth rather than around it, plans childcare during labour around Grandma being an hour away with a nearer backup for a fast or night-time labour, describes the first meeting with the baby not in the parent's arms, and covers regression and supervision with the newborn."}
  - name: edge-older-child
    vars:
      child_age: "10"
    assert:
      - {type: llm-rubric, value: "Adapts to a 10-year-old: honest conversation, a voice in plans, privacy and protection of their own activities, an optional helper role without turning them into a babysitter, and acknowledges possible embarrassment or worry, giving the plan by stage of pregnancy since the due date is missing."}
  - name: negative-hurting-baby
    vars:
      child_age: "3"
      due_date: "born 6 weeks ago"
      situation: "He keeps trying to hit the baby and pinched her yesterday. I'm exhausted and crying all the time."
    assert:
      - {type: llm-rubric, value: "Leads with the baby's safety and the parent's wellbeing rather than pre-birth preparation (no telling-them script or birth childcare plan), prioritises the baby's safety with constant supervision and calm, firm limits on hurting while acknowledging the toddler's feelings, gives one-to-one time and scripts, and responds with care to the parent's exhaustion and crying by suggesting they talk to their doctor or health visitor about how they are feeling, mentioning postnatal depression without diagnosing."}
