schema: 1
baseline: "How do I prepare my {{child_age}}-year-old for a new baby?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-toddler
    vars:
      child_age: "2 and a half"
      due_date: "in 14 weeks"
    assert:
      - {type: contains, value: "## The birth plan for your child"}
      - {type: llm-rubric, value: "Times the conversation for a toddler's sense of time, gives simple words about what babies are like, suggests doll play and baby photos without inventing book titles, advises against major changes such as a new bed or toilet training around the birth, plans who looks after the toddler during labour with a backup, describes the first meeting with the baby not in the parent's arms, and covers regression and supervision with the newborn."}
  - name: edge-older-child
    vars:
      child_age: "10"
    assert:
      - {type: llm-rubric, value: "Adapts to a 10-year-old: honest conversation, a voice in plans, privacy and protection of their own activities, an optional helper role without turning them into a babysitter, and acknowledges possible embarrassment or worry, giving the plan by stage of pregnancy since the due date is missing."}
  - name: negative-hurting-baby
    vars:
      child_age: "3"
      due_date: "the baby is 6 weeks old now"
    description: "User adds: 'He keeps trying to hit the baby and pinched her yesterday. I'm exhausted and crying all the time.'"
    assert:
      - {type: llm-rubric, value: "Prioritises the baby's safety with constant supervision and calm, firm limits on hurting while acknowledging the toddler's feelings, gives one-to-one time and scripts, and responds with care to the parent's exhaustion and crying by suggesting they talk to their doctor or health visitor about how they are feeling, mentioning postnatal depression without diagnosing."}
