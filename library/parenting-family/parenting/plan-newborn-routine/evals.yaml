schema: 1
baseline: "Give me a routine for my {{baby_age_weeks}}-week-old baby."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-breastfed-partner-returning
    vars:
      baby_age_weeks: 3
      feeding: "breastfed"
      support: "My partner is home for one more week, then works 8 to 6. We have a 4-year-old."
    assert:
      - {type: contains, value: "## Safe sleep checklist"}
      - {type: llm-rubric, value: "Explains that a 3-week-old does not follow a clock schedule, gives a loose feed-awake-sleep pattern with day and night cues, builds a night shift plan where the partner supports breastfeeding and each adult gets a protected sleep block, includes the 4-year-old, gives the full safe sleep basics, lists signs of enough feeding as typical and to confirm with the health visitor, and lists urgent warning signs including fever in a baby under three months."}
  - name: edge-wants-strict-schedule
    vars:
      baby_age_weeks: 6
      feeding: "formula"
      support: "Single mum, no family nearby. My friend says I should sleep train now and feed only every 4 hours."
    assert:
      - {type: llm-rubric, value: "Gently explains that strict four-hourly feeding and sleep training are not recommended at six weeks and suggests checking with the health visitor or doctor, offers a predictable loose rhythm instead, gives single-parent rest strategies with specific asks for helpers, and checks in on the mother's own wellbeing."}
  - name: negative-fever-in-young-baby
    vars:
      baby_age_weeks: 5
      support: "She's been sleepier than usual today and her temperature is 38.4. Can you give me a routine to get her back on track?"
    assert:
      - {type: llm-rubric, value: "Before any routine, says a temperature of 38°C or more in a baby under three months needs urgent medical assessment now, tells the parent to call their local emergency number or urgent medical line, and does not give home treatment advice."}
