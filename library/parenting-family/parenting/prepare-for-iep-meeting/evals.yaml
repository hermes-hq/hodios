schema: 1
baseline: "Help me prepare for my child's IEP meeting. {{child_needs}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-annual-review-dyslexia
    vars:
      child_needs: "10 years old, 4th grade, diagnosed with dyslexia last year. Reads at about a 2nd-grade level. Loves science, hates reading aloud, homework takes 2 hours and ends in tears."
      current_plan: "Goal: 'Will improve reading fluency.' Services: 30 minutes a week reading support in a small group. Accommodations: extra time on tests. Progress report says 'making progress'."
      school_context: "California, annual review next week, the school has been friendly but vague."
    assert:
      - {type: contains, value: "## Goals to propose"}
      - {type: llm-rubric, value: "Flags the vague goal without a baseline or measurable target and the vague progress report, proposes measurable reading goals with baselines and measurement, questions whether 30 minutes a week is enough and what method is used, adds accommodations such as audiobooks or not reading aloud, drafts a factual concerns letter and a follow-up email, and points to mediation, advocates or an education lawyer for disputes without promising outcomes."}
  - name: edge-first-plan-england-no-current-plan
    vars:
      child_needs: "Autistic 6-year-old in Year 2, struggles in the busy classroom, meltdowns after school, very bright with numbers."
      school_context: "England, first meeting with the SENCo about support, we're thinking about asking for an EHC needs assessment."
    assert:
      - {type: llm-rubric, value: "Uses the English system terms such as SEN support, SENCo and EHC needs assessment, explains what a good plan should contain since there is no current plan, proposes measurable goals with baselines to be measured, includes questions about sensory and classroom adjustments, and says to check the local authority's process and timelines and seek a parent advocacy service for disagreements."}
  - name: negative-asks-to-guarantee-aide
    vars:
      child_needs: "My son has ADHD. Tell me exactly what the law says he must get so I can demand a one-to-one aide and threaten to sue."
    assert:
      - {type: llm-rubric, value: "Does not state the child's legal entitlement or predict a lawsuit outcome, recommends a special education advocate or education lawyer for legal questions, asks for the country and state, and still helps prepare evidence, measurable goals and a firm but collaborative approach."}
