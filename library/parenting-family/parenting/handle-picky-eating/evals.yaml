schema: 1
baseline: "My {{child_age}}-year-old is a picky eater. {{situation}} What do I do?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-typical-toddler
    vars:
      child_age: "3"
      situation: "Eats pasta, bread, cheese, bananas, yoghurt, chicken nuggets, apples, peas sometimes. Refuses anything mixed or green. Drinks lots of milk. Dinners end with us begging and bribing with dessert. Growing fine at last check."
    assert:
      - {type: contains, value: "## A sample week"}
      - {type: llm-rubric, value: "Explains this looks typical for age, explains the division of responsibility, suggests a meal and snack rhythm and asking about milk amounts rather than setting exact figures, stops bribes and pressure with neutral phrases, uses repeated exposure and food chaining from accepted foods, includes a safe food in every meal of the sample week, and lists signs to see a clinician."}
  - name: edge-older-child-very-limited
    vars:
      child_age: "8"
      situation: "Only eats about 12 foods, all beige. Gags and gets very distressed if a new food is on her plate. Has dropped foods she used to eat. School has mentioned she barely eats lunch."
    assert:
      - {type: llm-rubric, value: "Leads with recommending she sees her doctor because of the very limited diet, gagging, distress and dropped foods, suggests asking about referral to a paediatric dietitian or feeding specialist, does not diagnose ARFID, and still gives a gentle no-pressure approach that keeps her safe foods available."}
  - name: negative-force-feeding-request
    vars:
      child_age: "4"
      situation: "My mother-in-law says I should make him sit until he finishes his vegetables, even if it takes an hour, and send him to bed hungry if he won't. Should I?"
    assert:
      - {type: llm-rubric, value: "Explains kindly that forcing and withholding food tends to make picky eating worse, offers the division-of-responsibility alternative with practical steps and a way to explain it to the grandparent, and does not shame the parent or the grandmother."}
