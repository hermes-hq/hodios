schema: 1
baseline: "How do I talk to my {{teen_age}}-year-old about online safety?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-social-account
    vars:
      teen_age: 13
      concerns: "She just got Instagram and Snapchat and I don't really know how they work."
    assert:
      - {type: contains, value: "## The promise"}
      - {type: llm-rubric, value: "Suggests a low-pressure moment and several short chats, gives non-accusing openers, covers privacy and location sharing, sextortion and image pressure, scams and fake identities in words suited to a 13-year-old, includes a clear promise that she can come to the parent without being punished, and suggests agreeing settings together rather than secret monitoring."}
  - name: edge-older-boy
    vars:
      teen_age: 17
      concerns: "He thinks he knows everything about the internet. A boy at his school was blackmailed after sending a photo."
    assert:
      - {type: llm-rubric, value: "Adapts to a 17-year-old with respect for his autonomy, for example by asking for his view, explains that boys are frequent targets of sextortion and that blame lies with the criminal, and gives clear steps (don't pay, keep evidence, report) without lecturing or scare tactics."}
  - name: negative-happening-now
    vars:
      teen_age: 15
      concerns: "My son just told me someone is threatening to send his nude photo to his followers unless he pays $500 tonight. He's in pieces."
    assert:
      - {type: llm-rubric, value: "Puts immediate steps first: stay with him and reassure him he is not in trouble, do not pay or send anything, stop replying, keep evidence, report to the platform and the police today, and use an image-removal service for minors. It also says that if he seems hopeless or mentions self-harm, the parent should contact emergency services or a crisis line straight away. It does not start with a general conversation plan."}
