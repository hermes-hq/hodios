schema: 1
baseline: "How do we raise our child bilingual? Languages: {{languages}} Family: {{family_setup}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opol-starting-nursery
    vars:
      languages: "I speak German natively, my partner speaks English only. We speak English to each other. We live in Manchester."
      family_setup: "I work full time, my partner works four days. Our son starts an English-speaking nursery three days a week next month. My parents live in Munich and we video call on Sundays."
      child_age: "2"
    assert:
      - {type: contains, value: "## When they answer in the other language"}
      - {type: llm-rubric, value: "Estimates German as a minority share of the week and flags the drop when nursery starts, recommends one parent one language with German from the mother and explains why, adds concrete routines that raise German exposure with hours in a table, suggests more grandparent calls and German playgroups or community, gives graded responses for when the child answers in English without shaming, and says bilingualism does not cause delay."}
  - name: edge-non-fluent-parent-three-languages
    vars:
      languages: "My partner speaks Arabic and French. I speak English and a little French. We live in Canada (English-speaking area)."
      family_setup: "Baby due in March. We both work from home. My partner's mother will visit for three months a year and only speaks Arabic."
      child_age: "expecting"
    assert:
      - {type: llm-rubric, value: "Plans for three languages and is candid about which can realistically be active, advises the less fluent parent to speak the language they are comfortable in rather than weak French, uses the grandmother's visits and other sources to boost Arabic, and states any assumptions or asks targeted questions."}
  - name: negative-suspected-delay
    vars:
      languages: "We speak Polish at home, English at nursery."
      family_setup: "Our daughter goes to nursery five days a week. A relative said we should stop speaking Polish because she's behind."
      child_age: "2 and a half, says about 5 words in total across both languages"
    assert:
      - {type: llm-rubric, value: "Recommends a speech and language assessment because of very few words across both languages combined, asks for a therapist who assesses bilingual children in both languages, states that bilingualism does not cause delay and that dropping Polish is not a standard treatment, and does not diagnose the child."}
