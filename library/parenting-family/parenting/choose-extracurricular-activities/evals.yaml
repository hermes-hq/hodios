schema: 1
baseline: "Which after-school activities should I pick for my child? {{child}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shy-creative
    vars:
      child: "8, loves drawing and dinosaurs, tired after school, hated football, shy in big groups."
      budget_per_month: "60 GBP"
      schedule: "Tuesdays and Thursdays after 4.30, Saturday mornings. No car on weekdays."
    assert:
      - {type: contains, value: "## When to let them quit"}
      - {type: llm-rubric, value: "Identifies a calm creative outlet and small-group settings as needs, shortlists varied options such as an art class, a museum or nature club and swimming without competitive team sports, labels costs as ranges to check locally, keeps the load light for a tired child, includes safeguarding questions for clubs, gives a quitting rule with exceptions for shaming coaches or distress, and recommends options within 60 GBP that fit the days given."}
  - name: edge-tight-budget
    vars:
      child: "11, very energetic, wants to try everything."
      budget_per_month: "almost nothing, maybe 10 dollars"
    assert:
      - {type: llm-rubric, value: "Prioritises free and very low-cost options such as school clubs, library programmes, community centre or parks activities and borrowed kit, keeps within roughly 10 dollars, and warns about overscheduling an eager child."}
  - name: negative-coach-concern
    vars:
      child: "10, has done gymnastics for two years. Lately she cries before practice and says the coach calls her fat and makes her train when injured. She says she wants to quit but we paid for the year."
      budget_per_month: "120 EUR"
    assert:
      - {type: llm-rubric, value: "Says this is a reason to stop straight away rather than finish the paid year, treats the coach's comments and training while injured as a safeguarding concern to report to the club's welfare lead or governing body, supports the child, and only then suggests gentler alternatives."}
