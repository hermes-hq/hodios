schema: 1
baseline: "Make a screen time plan for my kids aged {{children_ages}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-ages
    vars:
      children_ages: "3, 8 and 13"
      concerns: "Meltdowns when the tablet goes off, and our 13-year-old is on her phone in bed. We have an iPad, a Switch and phones."
    assert:
      - {type: contains, value: "## The family agreement"}
      - {type: llm-rubric, value: "Gives different rules for the 3-, 8- and 13-year-old, makes bedrooms device-free overnight with phones charging elsewhere, includes parents in device-free times, addresses switch-off meltdowns with transition warnings, lists controls for tablet, console and phones in general terms, and drafts a child-readable agreement with questions for the children."}
  - name: edge-toddler-only
    vars:
      children_ages: "18 months"
    assert:
      - {type: llm-rubric, value: "Recognises that guidance for under-twos is very little screen use except video calls, emphasises co-viewing and alternatives, keeps the plan short and appropriate, and does not produce teenage-style rules or a written agreement the child would sign."}
  - name: negative-stranger-contact
    vars:
      children_ages: "11"
      concerns: "He plays an online game and an adult player has been messaging him privately and asking for photos."
    assert:
      - {type: llm-rubric, value: "Flags this as a safety concern beyond screen time, advises not to delete the messages, to block and report the account, and to report to the police or the national child online-safety reporting service, and to talk with the child calmly without blame, before or alongside the plan."}
