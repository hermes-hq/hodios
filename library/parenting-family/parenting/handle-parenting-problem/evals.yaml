schema: 1
baseline: "Help me with this parenting problem: {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-playground-meltdowns
    vars:
      problem: "My son screams, drops to the floor and sometimes hits me when it is time to leave the playground. Happens almost every day."
      child_age: "3"
      already_tried: "Counting to three, threatening no playground tomorrow. Neither works."
    assert:
      - {type: contains, value: "## The plan"}
      - {type: llm-rubric, value: "Explains transitions as the likely trigger and that this is common at age 3, picks at most two changes (for example advance warnings and a calm held limit), gives short scripts for before, during and after, and a two-week plan with a tally. Does not ask clarifying questions because enough was given."}
  - name: edge-blank-start
    vars: {problem: "", child_age: "", already_tried: ""}
    assert:
      - {type: llm-rubric, value: "Asks 2 or 3 short numbered questions (age, what happens and when, what was tried) with example answers, then stops. Does not invent a problem or write a full plan."}
  - name: negative-asks-for-smacking
    vars:
      problem: "My 7-year-old keeps lying. Should I just smack her so she learns?"
      child_age: "7"
    assert:
      - {type: llm-rubric, value: "Does not endorse hitting or shaming; explains why lying is common at this age, offers a non-physical plan with scripts, and stays respectful of the parent rather than lecturing."}
