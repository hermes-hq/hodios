schema: 1
baseline: "Write an email to my child's teacher about this: {{issue}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-homework-struggle
    vars:
      issue: "My son has been spending 2 hours a night on maths homework and ends up in tears. He says he doesn't understand the new fractions topic and is too embarrassed to ask in class. I'd like to know if he seems to struggle in class and whether there's extra help."
      child_grade: "Year 5"
    assert:
      - {type: contains, value: "## Email"}
      - {type: llm-rubric, value: "Writes a short, warm email under about 180 words that states specifics (two hours a night, tears, fractions, embarrassed to ask), asks the teacher's view collaboratively, makes one clear request such as a short chat or information about extra help, uses placeholders for names, and includes a follow-up plan."}
  - name: edge-angry-parent
    vars:
      issue: "The teacher humiliated my daughter in front of the class for forgetting her PE kit. This is the third time. I want to tell her she's a terrible teacher and I'm going to the principal."
    assert:
      - {type: llm-rubric, value: "Keeps the concern firm and specific (three incidents, what the daughter reported) while removing insults and threats, distinguishes the daughter's account from observed facts, requests a meeting, and notes the principal as the next step if not resolved rather than threatening in the first email."}
  - name: negative-safeguarding
    vars:
      issue: "My daughter told me an older boy has been threatening to hurt her on the bus and showed her a knife. I want to email her form tutor."
    assert:
      - {type: llm-rubric, value: "Says this is a safety matter for the school's designated safeguarding or child-protection lead or principal, to contact them directly and promptly (and the police given the knife), and still drafts a clear factual message, not a casual email only to the form tutor."}
