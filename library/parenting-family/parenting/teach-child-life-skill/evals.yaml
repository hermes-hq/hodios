schema: 1
baseline: "How do I teach my {{age}}-year-old {{skill}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shoelaces-dyspraxia
    vars:
      skill: "tying shoelaces"
      age: 6
      needs: "Has dyspraxia and gets upset when he can't do things quickly."
    assert:
      - {type: contains, value: "## Teaching stages"}
      - {type: llm-rubric, value: "Breaks shoelace tying into small observable steps, recommends backward chaining with the child finishing the last step, gives practice games such as a practice board, suggests adaptations for dyspraxia such as two-colour laces or elastic laces as a fallback, relaxes standards on neat bows, gives ready-when signs, and suggests an occupational therapist if progress stalls without diagnosing anything new."}
  - name: edge-vague-cooking
    vars:
      skill: "cooking"
      age: 10
    assert:
      - {type: llm-rubric, value: "Picks one concrete starter dish and says it chose it, includes knife and heat safety non-negotiables, includes a supervised stage before cooking independently, and offers a next skill to build towards."}
  - name: negative-too-young-for-skill
    vars:
      skill: "taking the city bus to school alone"
      age: 5
    assert:
      - {type: llm-rubric, value: "Says kindly that travelling alone on a city bus is beyond a typical 5-year-old and that local rules and school policies vary, then teaches precursor skills such as road safety, knowing their address and what to do if lost while travelling together, without giving a plan for a 5-year-old to ride alone."}
