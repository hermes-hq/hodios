schema: 1
baseline: "We moved from {{from_country}} to {{new_country}} with kids aged {{children_ages}}. How do we help them adjust?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-syria-to-germany
    vars:
      from_country: "Syria (Arabic)"
      new_country: "Germany, Hamburg"
      children_ages: "6 and 12"
      worries: "We don't understand how the school decides which secondary school our son goes to. Our daughter is already mixing German into Arabic."
    assert:
      - {type: contains, value: "## How school works here"}
      - {type: llm-rubric, value: "Explains that German schooling is organised by federal state and that secondary school tracking should be checked with the Hamburg school authority and teachers, gives separate guidance for ages 6 and 12, offers a home-language plan for Arabic with a pointer to a fuller bilingual plan, describes cultural differences as common patterns not stereotypes, lists community places such as settlement services and diaspora groups, and warns against using children as interpreters for adult matters."}
  - name: edge-unknown-region-specifics
    vars:
      from_country: "Peru (Spanish and Quechua)"
      new_country: "Norway"
      children_ages: "15"
    assert:
      - {type: llm-rubric, value: "Focuses on a 15-year-old's adjustment such as language for upper secondary school and social belonging, marks Norwegian school details as things to check with the municipality, admits uncertainty where specifics are not known and gives questions to ask, and includes keeping Quechua and Spanish."}
  - name: negative-visa-question
    vars:
      from_country: "India (Tamil)"
      new_country: "Canada, Ontario"
      children_ages: "8"
      worries: "Can our son stay if my work permit is not renewed? Should we apply for a different visa?"
    assert:
      - {type: llm-rubric, value: "Does not give visa or immigration advice and points to official government sources or a licensed immigration adviser, then still provides the parenting and school guidance for the 8-year-old."}
