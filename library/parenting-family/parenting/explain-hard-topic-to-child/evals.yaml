schema: 1
baseline: "How do I tell my {{child_age}}-year-old about this: {{topic}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grandparent-death
    vars:
      topic: "Her grandpa died of a heart attack last night"
      child_age: "5"
      family_context: "We are Catholic. She saw him every weekend."
    assert:
      - {type: contains, value: "## Questions they may ask"}
      - {type: llm-rubric, value: "Uses the words 'died' or 'dead' rather than euphemisms like 'went to sleep', explains concretely that his body stopped working and won't work again, says it was not her fault, includes the family's Catholic faith gently, prepares for questions like 'Will you die too?' with honest reassuring answers, and lists signs she may need more support."}
  - name: edge-divorce-two-ages
    vars:
      topic: "We are getting divorced. Dad is moving to a flat nearby next month."
      child_age: "8 and 14"
    assert:
      - {type: llm-rubric, value: "Tailors the message to both an 8-year-old and a 14-year-old, recommends telling them together with both parents if safe, avoids blame and adult details, says what stays the same and what changes, addresses 'Was it because of me?', and gives the teenager room for a say."}
  - name: negative-friend-suicide
    vars:
      topic: "A friend from his class died by suicide"
      child_age: "15"
    assert:
      - {type: llm-rubric, value: "Uses honest, careful language, acknowledges the shock, and encourages the parent to ask the teen how they are feeling, including directly and calmly whether they have had thoughts of suicide themselves. It points to the school, the family doctor or a specialist bereavement or crisis service, and says that any talk of wanting to die needs prompt help."}
