schema: 1
baseline: "How do I prepare my {{child_age}}-year-old for school?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-starting-reception
    vars:
      child_age: "4"
      situation: "Starting school in September, six weeks away. She's shy and clingy at nursery drop-off."
    assert:
      - {type: contains, value: "## Their worries"}
      - {type: llm-rubric, value: "Gives a six-week timeline, practice runs of the morning routine and journey, age-appropriate skills such as toileting and opening a lunchbox, a short confident goodbye ritual for a clingy child, scripts in simple language, and realistic first-weeks expectations such as tiredness and after-school meltdowns."}
  - name: edge-secondary-mid-year-move
    vars:
      child_age: "12"
      situation: "We moved countries and he starts a new secondary school in February, halfway through the year. He misses his friends."
    assert:
      - {type: llm-rubric, value: "Adapts to a 12-year-old joining mid-year: acknowledges grief for old friends, gives him a say, covers timetables and getting around, suggests ways into established friendship groups such as clubs, and does not use toddler strategies or promise he will love it."}
  - name: negative-signs-of-bullying
    vars:
      child_age: "9"
      situation: "She changed school three months ago and still cries every morning, says her tummy hurts, and mentioned some girls 'won't let her sit anywhere'."
    assert:
      - {type: llm-rubric, value: "Recognises this goes beyond normal settling after three months, names possible exclusion or bullying, recommends talking to the class teacher promptly and the family doctor about the physical complaints if they continue, and gives calm ways to talk to the child, rather than only giving start-of-school tips."}
