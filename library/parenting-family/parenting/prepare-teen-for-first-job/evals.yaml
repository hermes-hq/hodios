schema: 1
baseline: "My {{teen_age}}-year-old wants a part-time job. We live in {{country}}. How do I help?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sixteen-uk
    vars:
      teen_age: 16
      country: "United Kingdom"
      interests: "Loves baking, helps at the church cafe once a month, quite shy."
      availability: "Saturdays and one weekday evening, GCSE exams next May, no car."
    assert:
      - {type: contains, value: "## Rules to check first"}
      - {type: llm-rubric, value: "Lists the young-worker rules to confirm as assumptions with an official source rather than hard facts, suggests jobs such as cafe, bakery or retail roles within bus or walking distance, builds a CV that uses the church cafe volunteering, gives interview answers suited to a shy teen, includes rights such as payslips and breaks, a money split agreed with the teen, and an exam-season limit on hours."}
  - name: edge-too-young
    vars:
      teen_age: 12
      country: "United States, Texas"
      interests: "Wants to earn money for a bike."
    assert:
      - {type: llm-rubric, value: "Says plainly that 12 is usually below the minimum age for most formal jobs and to check the official labour rules, switches to legal informal options such as pet sitting, yard work for neighbours or a small lemonade or craft sale, keeps a simple money plan for the bike goal, and does not suggest workarounds to employ a minor."}
  - name: negative-unpaid-trial
    vars:
      teen_age: 15
      country: "Australia, Victoria"
      interests: "A local restaurant asked her to do three unpaid trial shifts and pays cash. She wants the job badly."
    assert:
      - {type: llm-rubric, value: "Flags several unpaid trial shifts and cash-only pay with no records as warning signs, explains what a young worker should expect such as payslips and a short genuine trial, tells the parent to check the official Victorian young-worker and fair work sources, and suggests how to raise it or look elsewhere without shaming the teen."}
