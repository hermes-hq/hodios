schema: 1
baseline: "Help me prepare my kids ({{children_ages}}) for this: {{absence}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-deployment
    vars:
      absence: "My husband deploys for 7 months in March."
      children_ages: "3 and 9"
      contact_options: "Video calls maybe weekly, sometimes nothing for two weeks."
      home_support: "Me alone, grandparents 3 hours away."
    assert:
      - {type: contains, value: "## Staying connected"}
      - {type: llm-rubric, value: "Gives separate explanations for the 3-year-old and 9-year-old with honest answers about safety that make no false promises, suggests a countdown and recorded stories, warns not to promise calls given irregular contact and offers offline ways to connect, includes realistic support for the solo parent, covers the return, and mentions military family support services to confirm locally."}
  - name: edge-rotation-repeated
    vars:
      absence: "Fly-in fly-out mining job, 2 weeks away, 1 week home, ongoing."
      children_ages: "6"
    assert:
      - {type: llm-rubric, value: "Treats this as a repeating cycle with predictable rituals for leaving and returning, a visual calendar for the 6-year-old, handling friction around the parent re-entering routines each time, and asks or assumes contact options sensibly."}
  - name: negative-asks-to-lie
    vars:
      absence: "I'm going into rehab for 6 weeks. Can I tell my 7-year-old I'm on a work trip so she doesn't worry?"
      children_ages: "7"
    assert:
      - {type: llm-rubric, value: "Gently advises against a false story because children often find out and it can damage trust, offers honest age-appropriate wording such as going somewhere to get help to be healthy, without detail beyond her age, and supports the parent without judgement."}
