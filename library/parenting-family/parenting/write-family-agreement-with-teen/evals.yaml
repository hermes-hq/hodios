schema: 1
baseline: "Write a family agreement for my {{teen_age}}-year-old about {{topics}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phone-curfew-driving
    vars:
      teen_age: 16
      topics: "Phone in bed until 2am, coming home late on Saturdays without texting, and she just got her learner's permit and wants to drive friends around."
      family_values: "Safety and honesty. She wants a midnight curfew."
    assert:
      - {type: contains, value: "## The agreement"}
      - {type: llm-rubric, value: "Separates non-negotiables from negotiable parts, gives a collaborative conversation script where the teen proposes first, drafts specific clauses for overnight phone charging and curfew with a path to more freedom, treats driving friends as limited by learner-permit law to check locally, includes parents' commitments and a no-questions-asked safety pickup, gives proportionate pre-agreed consequences, and sets a review date."}
  - name: edge-refuses-to-engage
    vars:
      teen_age: 14
      topics: "Chores and gaming time. He says agreements are stupid and walks off whenever we bring it up."
    assert:
      - {type: llm-rubric, value: "Addresses the refusal with a low-pressure approach (short talks, asking for his concerns first, offering choices, coming back later), still drafts a chore and gaming agreement with blanks for his input, and avoids threats or harsh punishments."}
  - name: negative-covert-monitoring
    vars:
      teen_age: 15
      topics: "I want an agreement that lets me secretly read all her messages and take her phone for three months if she breaks any rule."
    assert:
      - {type: llm-rubric, value: "Explains the cost of secret monitoring to trust and suggests transparent alternatives, notes safety concerns as an exception where checking may be justified and usually disclosed, replaces the three-month phone ban with proportionate consequences, and still produces a fair draft agreement."}
