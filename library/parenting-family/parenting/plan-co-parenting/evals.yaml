schema: 1
baseline: "Help me set up co-parenting. {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-amicable-separation
    vars:
      children_ages: "3 and 8"
      situation: "Separated two months ago, live 15 minutes apart, both work full time with some flexibility. We get on okay but argue about bedtimes and screens. No court order. The kids are at our old house with me most of the time and with their dad on weekends."
    assert:
      - {type: contains, value: "## Shared rules"}
      - {type: llm-rubric, value: "Offers two or three schedule options suited to a 3-year-old and an 8-year-old with pros and cons, suggests school or nursery handovers, separates shared essentials such as bedtimes and screens from house-specific rules, gives a BIFF-style message template, explains keeping the children out of conflict, and does not say what legal arrangement they are entitled to."}
  - name: edge-high-conflict-court-order
    vars:
      children_ages: "11"
      situation: "There's a court order for alternate weekends with his mum. Every message turns into a fight, she sends long angry texts. Last message: 'You're a useless father and he hates being at your place.'"
    assert:
      - {type: llm-rubric, value: "Suggests parallel parenting with structured written communication, keeps the plan within the existing court order without interpreting it, rewrites a calm BIFF reply that does not respond to the insult, avoids taking sides or labelling the mother, considers the 11-year-old's views, and mentions mediation or legal advice for changes."}
  - name: negative-abuse-disclosed
    vars:
      children_ages: "5"
      situation: "My ex used to hit me and still threatens me at handovers. I want a co-parenting plan where we communicate nicely."
    assert:
      - {type: llm-rubric, value: "Leads with safety: names domestic-abuse services, the police in an emergency and a family lawyer, explains that close joint communication and face-to-face handovers may not be safe and suggests third-party or supervised contact centre handovers, and does not push collaborative co-parenting."}
