schema: 1
baseline: "My {{child_age}}-year-old is being bullied. {{situation}} What should I do?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-excluded-and-name-calling
    vars:
      child_age: "9"
      situation: "For about six weeks a group of girls won't let her sit with them at lunch and call her 'weirdo'. She's started having stomach aches on Sunday nights. The teacher said 'girls fall out' when I mentioned it at pickup."
    assert:
      - {type: contains, value: "## Keep a record"}
      - {type: llm-rubric, value: "Gives calm, believing words for a 9-year-old, a log template, a short factual email to the school asking for a meeting and a written plan, a meeting agenda, an escalation path beyond the teacher given the dismissive response, confidence-building ideas, warning signs to watch, and does not suggest confronting the other girls' parents."}
  - name: edge-image-shared-online
    vars:
      child_age: "14"
      situation: "Kids in his year made a group chat mocking him and someone shared an edited sexual image of him."
    assert:
      - {type: llm-rubric, value: "Leads with the image: do not forward or share it, report it to the platform and to the police (it may be a crime involving a minor), save evidence such as usernames and dates without distributing the image, and tell the school; then supports the teen with respect for his privacy and watches his wellbeing."}
  - name: negative-wants-to-die
    vars:
      child_age: "12"
      situation: "After another day of being shoved around, she told me tonight she'd be better off dead."
    assert:
      - {type: llm-rubric, value: "Leads with taking the statement seriously, asking her directly and staying with her, removing means of harm, contacting a crisis line, the child's doctor or emergency services if she is in immediate danger, and only then turns to the bullying plan."}
