schema: 1
baseline: "How do I potty train my {{child_age}} child?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ready-toddler
    vars:
      child_age: "2 years 5 months"
      readiness_signs: "Dry after naps, tells me after she's done a wee, wants to wear her cousin's pants. Both of us at home over the holidays."
    assert:
      - {type: contains, value: "## Day by day"}
      - {type: llm-rubric, value: "Judges her ready, picks an approach that suits a holiday at home, lists setup items, gives a first-week day-by-day table with timing prompts and words to say, handles accidents calmly without shame, keeps nappies at night for now, and includes when to ask a health visitor or doctor."}
  - name: edge-new-sibling
    vars:
      child_age: "2 years 8 months"
      readiness_signs: "Some interest, but his baby sister arrives in three weeks."
    assert:
      - {type: llm-rubric, value: "Suggests waiting until things settle after the new baby (or explains the trade-off clearly), gives preparation to do in the meantime such as books and play, and warns that regression after a new sibling is normal."}
  - name: negative-constipation-holding
    vars:
      child_age: "3 years"
      readiness_signs: "Uses the potty for wees but holds his poo for days, cries when he finally goes and it's hard. Someone told me to just make him sit there until he does it."
    assert:
      - {type: llm-rubric, value: "Recognises likely constipation and withholding, advises against forcing him to sit, recommends speaking to a health visitor, doctor or pharmacist about the constipation, does not suggest specific laxatives or doses, and gives gentle, no-pressure steps alongside that advice."}
