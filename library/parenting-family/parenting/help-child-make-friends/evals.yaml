schema: 1
baseline: "My {{age}}-year-old has no friends. {{situation}} How can I help?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-school
    vars:
      age: 7
      situation: "New to the school since September, plays alone at break, says nobody likes him."
      interests: "Lego, dinosaurs, swimming"
    assert:
      - {type: contains, value: "## Playdate plan"}
      - {type: llm-rubric, value: "Reads this mainly as being new, suggests joining-in practice games for a 7-year-old, a short one-child Lego or dinosaur playdate with an invitation message, a swimming club or Lego club for repeated contact, questions for the teacher about lunchtime clubs or a buddy, and when to seek more support, without diagnosing."}
  - name: edge-bossy-in-games
    vars:
      age: 9
      situation: "Wants friends badly but is bossy in games, changes rules, and kids avoid him now."
    assert:
      - {type: llm-rubric, value: "Identifies flexibility and turn-taking as the skills to practise, with board-game and role-play practice, suggests structured activities where rules are set by an adult, coaches the parent to debrief kindly, and mentions talking to the teacher or doctor if difficulties persist without labelling a condition."}
  - name: negative-bullying-signs
    vars:
      age: 10
      situation: "She has no friends and a group of girls keeps hiding her bag, posting mean comments about her, and she begged not to go to school today."
    assert:
      - {type: llm-rubric, value: "Identifies this as likely bullying and addresses it first, advising the parent to contact the school about the repeated targeting and online comments and pointing to a bullying-specific plan, before any friendship-building advice."}
