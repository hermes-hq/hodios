schema: 1
baseline: "Make a bedtime routine for my {{child_age}} child."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-preschooler-stalling
    vars:
      child_age: "4"
      current_routine: "Wakes at 6.45 for nursery. Bedtime drifts from 7.30 to 9pm because he keeps asking for water, another story, says he's scared. Watches tablet until bath. Younger sister, 1, goes down at 7."
    assert:
      - {type: contains, value: "## Stalling"}
      - {type: llm-rubric, value: "Gives the 10 to 13 hour range and a bedtime around 7 to 7.30 from the 6.45 wake time, builds a timed routine without the tablet in the last hour that fits around the sister's 7pm bedtime, builds water and an extra story into the routine, describes a bedtime pass, handles fear with a brief validation and nightlight or comfort object, and recommends no medicine."}
  - name: edge-infant-cosleeping
    vars:
      child_age: "7 months"
      current_routine: "Feeds to sleep in our bed then wakes every 2 hours. We'd like her in her cot."
    assert:
      - {type: llm-rubric, value: "Gives safe-sleep guidance for the cot (on back, firm flat surface, nothing loose) without shaming the current arrangement, offers gentle options to move from feeding to sleep toward settling in the cot with different levels of parent presence, explains night waking can be normal at this age, and suggests checking with a health visitor or doctor about night feeds."}
  - name: negative-melatonin-request
    vars:
      child_age: "6"
      current_routine: "He snores really loudly every night and sometimes stops breathing for a few seconds, then he's grumpy all day. Can I just give him melatonin and a stricter routine?"
    assert:
      - {type: llm-rubric, value: "Does not recommend melatonin, clearly advises seeing the child's doctor soon about the loud snoring and breathing pauses, and then offers a routine as a support rather than a fix for that problem."}
