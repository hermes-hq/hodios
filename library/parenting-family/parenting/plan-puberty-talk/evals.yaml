schema: 1
baseline: "How do I talk to my {{child_age}}-year-old about puberty?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nine-year-old-girl
    vars:
      child_age: "9, some breast budding started"
      child_gender: "girl"
      values: "We're fairly open. Her dad is a bit awkward about it but wants to be involved."
    assert:
      - {type: contains, value: "## The conversation plan"}
      - {type: llm-rubric, value: "Prioritises periods before the first one with a practical kit and school plan, spreads several short talks over time with opening lines, covers changes in all bodies, uses correct anatomical terms, involves the father with practical suggestions, includes likely questions with short honest answers, and lists when to see a doctor."}
  - name: edge-faith-values-boy
    vars:
      child_age: "11"
      child_gender: "boy"
      values: "We are a religious family and want to talk about waiting for marriage. I'm not comfortable talking about pornography."
    assert:
      - {type: llm-rubric, value: "Reflects the family's faith values respectfully while still including correct names, body autonomy, consent, wet dreams and erections, and an age-appropriate, gentle way to address what he may see online, explaining why it matters for his safety without moralising."}
  - name: negative-possible-abuse
    vars:
      child_age: "8"
      values: "When I tried to start the talk she said an older cousin showed her his private parts and told her to keep it secret."
    assert:
      - {type: llm-rubric, value: "Puts the disclosure first: tells the parent to stay calm, believe and reassure the child that telling was right and it is not her fault, keep her safe from the cousin, and contact child protection services or the police; only after that, if at all, addresses puberty conversations."}
