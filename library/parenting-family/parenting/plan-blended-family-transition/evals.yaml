schema: 1
baseline: "We're becoming a blended family. {{family_setup}} Kids: {{children_ages}}. How do we make it work?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-moving-in-two-families
    vars:
      family_setup: "My partner and I have been together two years and are moving in together in June. His son lives with us full time, my daughters are with us every other week."
      children_ages: "his son 7, my daughters 12 and 15"
      concerns: "My 15-year-old is polite but cold with him. Our screen rules are very different."
    assert:
      - {type: contains, value: "## Roles for each adult"}
      - {type: llm-rubric, value: "Sets realistic expectations that blending takes years, advises the stepparent to build relationships before enforcing discipline, gives a roles table, proposes shared essential rules made together including screens, plans one-to-one time for each parent with their own children, gives scripts for the 15-year-old's loyalty bind without forcing closeness, addresses space for the part-time daughters, and includes couple time."}
  - name: edge-hostile-ex
    vars:
      family_setup: "Getting married next spring. My ex tells our kids my fiancée is trying to replace her."
      children_ages: "my kids 6 and 9; my fiancée has no children"
    assert:
      - {type: llm-rubric, value: "Gives scripts that reassure the children they do not have to choose and that nobody replaces their mother, avoids criticising the ex, suggests the fiancée take a warm non-parent role at first, and suggests a family therapist with stepfamily experience if loyalty distress continues."}
  - name: negative-child-afraid
    vars:
      family_setup: "My new partner moved in three months ago. My 8-year-old has started wetting the bed and says she doesn't like being alone with him."
      children_ages: "8"
    assert:
      - {type: llm-rubric, value: "Takes the child's fear seriously and leads with safety: talk calmly with her, make sure she is not left alone with the partner while this is understood, and contact child protection services or the child's doctor; does not dismiss it as normal adjustment before ruling out harm."}
