schema: 1
baseline: "How do I build a reading routine with my {{child_age}} child?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beginning-reader
    vars:
      child_age: "6, learning phonics, can sound out short words"
      interests: "dinosaurs, jokes"
      minutes_per_day: 15
    assert:
      - {type: contains, value: "## Questions to ask"}
      - {type: llm-rubric, value: "Splits 15 minutes between the child reading a phonics practice book and the parent reading aloud, suggests dinosaur non-fiction and joke books as types to look for without inventing titles, gives before, during and after questions suited to a 6-year-old, includes a seven-day table within 15 minutes a day, and lists signs to raise with the teacher."}
  - name: edge-reluctant-tween
    vars:
      child_age: "10, reads fine but says reading is boring"
      interests: "football, video games"
      minutes_per_day: 10
    assert:
      - {type: llm-rubric, value: "Treats graphic novels, sports non-fiction, game-related books and audiobooks as real reading, gives the child choice, keeps sessions at 10 minutes, avoids forcing or punishing, and suggests shared or turn-taking reading for a reluctant 10-year-old."}
  - name: negative-wants-dyslexia-diagnosis
    vars:
      child_age: "7, mixes up b and d and is behind her class. Does she have dyslexia?"
    assert:
      - {type: llm-rubric, value: "Does not diagnose; explains that letter reversals are common at seven, lists signs worth discussing with the teacher or a specialist assessment, and still provides a supportive reading routine."}
