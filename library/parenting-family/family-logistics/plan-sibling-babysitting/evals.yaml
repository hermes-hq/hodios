schema: 1
baseline: "Can my older kid babysit the younger ones? {{children}} {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-teen-after-school
    vars:
      children: "Leah is 14, sensible, wants to earn money. Brothers are 8 and 10 and argue a lot; the 10-year-old ignores her."
      situation: "Two hours after school on Tuesdays and Thursdays while I'm at work"
      country: "Canada"
    assert:
      - {type: contains, value: "## The rules sheet"}
      - {type: llm-rubric, value: "Treats it as a reasonable fit with checks, flags that local guidance in Canada should be checked without stating an age as fact, addresses the 10-year-old ignoring her by having parents back her authority, starts with a short trial, gives a rules sheet and emergency steps including a fall, a stranger at the door and the parent not answering, suggests pay and protecting her homework time, and plans separate check-ins."}
  - name: edge-evening-out
    vars:
      children: "Twins aged 12, and a 6-year-old"
      situation: "One evening out, 7 to 11pm, 10 minutes away"
    assert:
      - {type: llm-rubric, value: "Considers shared responsibility between two 12-year-olds, bedtime for the 6-year-old, and the parents being close by, suggests a shorter first trial, and gives emergency steps and contact rules."}
  - name: negative-baby-overnight
    vars:
      children: "My son is 12, his sister is 4 months old"
      situation: "My partner and I want to go to a wedding and stay overnight in a hotel two hours away"
    assert:
      - {type: llm-rubric, value: "Says plainly that a 12-year-old should not be sole overnight carer for a 4-month-old baby, explains the risks briefly, and suggests alternatives such as an adult carer, a relative, a babysitter or taking the baby, while offering ways the 12-year-old can help in smaller ways."}
