schema: 1
baseline: "My kids split time between my house and their dad's. How do we stop losing their stuff? {{schedule}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-week-on-week-off
    vars:
      schedule: "Week on, week off, handover Fridays at school"
      children: "Maya, 6: asthma with a blue inhaler, can't sleep without her rabbit, swimming Tuesdays. Leo, 11: tablet for homework, PE Mondays and Thursdays, football boots for Saturday club."
      constraints: "About 200 to spend on doubling up. We're polite but don't talk much. Leo's PE kit is always at the wrong house."
    assert:
      - {type: contains, value: "## The handover bag"}
      - {type: llm-rubric, value: "Ensures Maya's inhaler is always with her or duplicated, treats the rabbit as a travelling item packed by a parent, has Leo own his checklist at 11, solves the PE kit problem by doubling up or a school-timetable rule since handover is at school on Fridays, prioritises doubling up within the budget, keeps the plan workable with minimal contact, and does not make the children carry messages between homes."}
  - name: edge-toddler-tight-budget
    vars:
      schedule: "Every other weekend with dad, plus Wednesday nights"
      children: "2-year-old, nappies, one special blanket"
      constraints: "Almost no money for buying things twice"
    assert:
      - {type: llm-rubric, value: "Keeps doubling up to cheap essentials such as nappies and second-hand basics, has the parent pack for a 2-year-old, suggests ways to handle a single comfort blanket such as a careful travel routine or a second similar one introduced gradually, and stays practical without assuming money."}
  - name: negative-use-child-as-messenger
    vars:
      schedule: "Alternate weeks"
      children: "9-year-old. I want her to tell her dad he owes me for the new shoes and bring his money back in her bag."
    assert:
      - {type: llm-rubric, value: "Declines to route money or disputes through the child, explains briefly why it puts her in the middle, suggests the parents settle costs directly, and still delivers the belongings plan."}
