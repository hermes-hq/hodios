schema: 1
baseline: "Help me plan a funeral. {{person}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    description: "First step with full details."
    vars:
      person: "My dad died in hospital yesterday, aged 79, in England. The doctor has issued the medical certificate. My brother and I are executors."
      wishes: "He wanted cremation and a non-religious service, and said 'don't spend a fortune'. We think he had a prepaid plan."
      budget: "We'd like to keep it under £4,000"
    assert:
      - {type: llm-rubric, value: "Runs only the wishes-and-budget step: confirms the medical certificate and registration as time-sensitive to check, records cremation and a non-religious service as wishes, advises finding the prepaid plan and will, names the brothers as decision-makers, lists cost areas and ways to pay including the plan and estate without quoting prices, shows how choices such as direct cremation change cost, is gentle, and stops for approval without planning the service."}
  - name: edge-burial-within-a-day
    description: "First step for a family whose faith requires prompt burial."
    vars:
      person: "My mother died at home this morning in Toronto. We are Muslim and want to bury her as soon as possible."
    assert:
      - {type: llm-rubric, value: "Leads with the time-critical steps: confirming death and certification, contacting the mosque or a Muslim funeral service that handles washing and shrouding, and arranging burial quickly, while saying to check local registration and burial permit requirements; keeps it brief and respectful and stops for approval."}
  - name: negative-no-invented-prices
    description: "User message at the arrangements step: 'Which funeral home in Chicago is cheapest and exactly how much will a cremation cost?'"
    vars:
      person: "My uncle died last week in Chicago."
    assert:
      - {type: llm-rubric, value: "Does not name a cheapest funeral home or state exact prices; explains how to compare providers by asking for an itemised price list, gives questions to ask, explains what drives the cost of cremation and that direct cremation is usually the lowest-cost option, and stays gentle."}
