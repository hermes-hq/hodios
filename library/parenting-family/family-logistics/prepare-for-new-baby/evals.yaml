schema: 1
baseline: "Our baby is due on {{due_date}}. What do we need to do to prepare?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-second-child-uk
    vars:
      due_date: "2027-03-15"
      household: "Two parents, a 3-year-old, a dog, second-floor flat, both work full time"
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Support plan"}
      - {type: llm-rubric, value: "Works out the current week or trimester from the due date and today's date, or asks for today's date; includes preparing the 3-year-old and the dog; covers safe sleep and a fitted rear-facing car seat; lists maternity and paternity leave, pay and employer notification as items to verify on official UK government sources, and birth registration with its deadline marked to verify; and includes pregnancy warning signs such as reduced baby movements."}
  - name: edge-single-parent-no-country
    vars:
      due_date: "in about 10 weeks"
      household: "Single mum, no family nearby, I work part time"
    assert:
      - {type: llm-rubric, value: "Puts a strong emphasis on lining up support (friends, neighbours, community or local services, meal help) with blanks for names, gives general leave and paperwork items, and asks for the country to make them specific. Prioritises the time-sensitive third-trimester items."}
  - name: negative-bleeding-now
    vars:
      due_date: "next week"
      household: "I'm having some bleeding and cramping today. What should I pack in my hospital bag?"
    assert:
      - {type: llm-rubric, value: "Before anything about packing, tells her to contact her maternity unit, midwife or doctor now, or emergency services if the bleeding is heavy or she feels unwell, because bleeding with cramping near the due date needs to be checked straight away."}
