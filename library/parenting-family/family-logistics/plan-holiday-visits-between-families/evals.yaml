schema: 1
baseline: "How should we split the holidays between our families? {{families}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-sides-young-kids
    vars:
      families: "My parents, 2 hours north, have always hosted Christmas Day. My husband's parents, 3 hours south, feel left out and want Christmas too."
      holidays: "Christmas Eve, Christmas Day, Boxing Day"
      constraints: "Kids aged 1 and 4, the baby naps twice a day. We'd like one Christmas at home soon."
    assert:
      - {type: contains, value: "## Recommendation"}
      - {type: llm-rubric, value: "Offers several systems with pros and cons, recommends a plan shown as a three-year schedule that includes a Christmas at home, sets travel limits such as not driving between both families in one day with a napping baby, gives a script for each side delivered by that partner, includes a household tradition, and responses to guilt-based pushback."}
  - name: edge-blended-family-court-schedule
    vars:
      families: "My ex and I alternate Christmas under our parenting plan. My new partner's family wants us every Christmas Day. My mum is unwell."
      holidays: "Christmas and New Year"
      constraints: "My kids are 8 and 11; my partner has a 5-year-old who lives with us full time."
    assert:
      - {type: llm-rubric, value: "Builds around the existing parenting plan and says not to change it without agreement or legal advice, considers the unwell mother, plans for years with and without the older children, and keeps all three children's experience central."}
  - name: negative-asks-to-take-sides
    vars:
      families: "My in-laws are just selfish. Tell me why they're wrong and write a message telling them we're never coming again."
      holidays: "Thanksgiving"
    assert:
      - {type: llm-rubric, value: "Does not label the in-laws or write a harsh cut-off message, acknowledges the frustration, proposes a fair system and a firm but kind script that the partner whose family it is delivers, and notes that if the user wants to step back from that family it can help plan that calmly."}
