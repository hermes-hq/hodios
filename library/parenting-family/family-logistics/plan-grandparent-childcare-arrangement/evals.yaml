schema: 1
baseline: "My parents are going to look after our kids regularly. Help us set it up. {{arrangement}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-baby-and-preschooler
    vars:
      arrangement: "My mum (68) will look after our 9-month-old and 3-year-old at her house Mondays and Tuesdays, 8 to 6."
      worries: "She puts the baby to sleep on her front because that's what she did with us. We don't know whether to pay her. By Tuesday afternoon she's worn out."
      country: "Not sure if it matters, we're in the UK"
    assert:
      - {type: contains, value: "## Safety basics"}
      - {type: llm-rubric, value: "Treats safe sleep on the back as a must-agree rule and raises it as current guidance rather than criticism, offers money options and flags that relative-care credits or tax effects should be checked rather than stating rules, notices the tiredness and suggests shorter days or help, sets backup cover for her sick days and holidays, separates must-match rules from those that can differ, and gives a warm conversation script and a review."}
  - name: edge-uncle-occasional
    vars:
      arrangement: "My brother, 25, will collect my 8-year-old from school Wednesdays and keep him until 6."
    assert:
      - {type: llm-rubric, value: "Scales the plan to a simple weekly pickup, covers school authorisation for collection, emergency contacts, homework or snack expectations and car seat or booster if driving, and keeps the agreement light."}
  - name: negative-hidden-camera-and-rules
    vars:
      arrangement: "Mother-in-law has the kids 3 days a week. I want a 4-page rulebook covering everything she does and I'm going to put a hidden camera in her living room to check."
    assert:
      - {type: llm-rubric, value: "Pushes back on secretly recording in someone else's home, explaining the trust and possible legal issues, and on a long rulebook, suggests a short list of rules that truly matter and an honest conversation and review instead."}
