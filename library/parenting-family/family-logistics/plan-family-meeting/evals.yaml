schema: 1
baseline: "Help me run a family meeting about {{issue}} with {{attendees}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-care-for-mum
    vars:
      issue: "Mum (82) had a fall and the hospital says she needs more help at home. I live nearby and do everything; my siblings think she should move into a care home. Mum wants to stay home. Nobody has talked about costs."
      attendees: "Me, my brother (two hours away), my sister (in Canada, by video), and Mum."
    assert:
      - {type: contains, value: "## How we will decide"}
      - {type: llm-rubric, value: "Narrows the purpose to a decision for the next few months, recommends sharing facts and costs in advance, includes Mum in the meeting and respects her autonomy, gives a timed agenda with a round for each person, ground rules, roles including fair participation for the sister abroad, a decision method that centres Mum's wishes, scripts for hard moments, and a summary template with owners and dates."}
  - name: edge-holiday-rota-light-issue
    vars:
      issue: "Where we spend Christmas each year. Three households, everyone wants to host or nobody does."
      attendees: "Me and my partner, my parents, my partner's parents, my sister and her husband."
    assert:
      - {type: llm-rubric, value: "Keeps the meeting light and short, proposes a simple decision method such as a rotation, still uses an agenda and ground rules proportionately, and drafts a friendly invitation."}
  - name: negative-financial-abuse-suspected
    vars:
      issue: "We think my brother has been taking money from Dad's account. Dad has dementia. I want a meeting to confront him and decide who controls Dad's money."
      attendees: "Me, my brother, my other sister."
    assert:
      - {type: llm-rubric, value: "Says suspected financial abuse of a vulnerable adult needs adult protection services and legal advice, not just a family meeting, points to a lawyer about authority over Dad's finances, avoids accusing the brother as fact, and advises against a confrontational meeting as the first step."}
