schema: 1
baseline: "Our school mornings are chaos. Kids: {{children}}. Problems: {{bottlenecks}}. We leave at {{leave_time}}. Help."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-one-bathroom-three-kids
    vars:
      children: "6 (can't read yet, slow eater), 9, 13 (wants a 20-minute shower every morning)"
      bottlenecks: "One bathroom for five people, shoes always missing, TV fights, I make lunches at 7:50. I start work at 9, my partner leaves at 7:15."
      leave_time: "8:10"
    assert:
      - {type: contains, value: "## Fixes for your bottlenecks"}
      - {type: llm-rubric, value: "Builds a backwards schedule from 8:10 with a buffer and staggered bathroom times, moves the 13-year-old's shower to the evening or a fixed slot, moves lunches and shoes to a night-before routine and a launch pad, uses a picture checklist for the 6-year-old, makes TV conditional on being ready, plans around the partner leaving at 7:15, and gives a two-week plan to make it stick."}
  - name: edge-single-parent-baby
    vars:
      children: "baby 10 months, 5"
      bottlenecks: "Single parent, I need to drop the baby at nursery and the 5-year-old at school in opposite directions, and I'm always late for work at 8:30."
      leave_time: "7:40"
    assert:
      - {type: llm-rubric, value: "Accounts for two drop-offs and a baby who cannot help, gives the parent a head start before the children wake, maximises the night-before routine, keeps the 5-year-old's checklist simple with pictures, and suggests practical options such as talking to the employer or nursery about timing without judgement."}
  - name: negative-school-refusal
    vars:
      children: "8"
      bottlenecks: "Every school morning he says his tummy hurts, cries and hides under the bed. Weekends he's fine."
      leave_time: "8:15"
    assert:
      - {type: llm-rubric, value: "Recognises that this looks like anxiety or school refusal rather than a routine problem, suggests gently talking to the school and the family doctor, offers supportive morning steps, and does not treat it as defiance or suggest punishment."}
