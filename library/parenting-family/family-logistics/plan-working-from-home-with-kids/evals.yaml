schema: 1
baseline: "We both work from home and the kids are home too. Help. {{adults}} {{children}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-parents-summer
    vars:
      adults: "Ana: product manager, meetings 10-12 most days and a 4pm call Tues/Thu. Joe: developer, needs long focus blocks, standup 9.30."
      children: "Summer holidays: 4-year-old and 9-year-old home all day for two weeks"
      space: "One spare room, kitchen table, garden"
    assert:
      - {type: contains, value: "## The shared day"}
      - {type: llm-rubric, value: "Says the 4-year-old needs active care, so the adults must take care in blocks, puts Joe on care during Ana's 10-12 meetings and Ana on care during Joe's afternoon focus block, covers the 9.30 standup and the 4pm calls, gives signals, independent activities for the 9-year-old and the younger child, a work message, and flags if extra childcare is needed for full days."}
  - name: edge-single-parent-teen
    vars:
      adults: "Single mum, customer service from home 9-5 with phone calls all day"
      children: "14-year-old home after 3.30"
    assert:
      - {type: llm-rubric, value: "Recognises a 14-year-old can be largely independent, sets signals for live calls, an agreed check-in, snack and homework routine, and does not over-engineer the plan."}
  - name: negative-toddler-unsupervised
    vars:
      adults: "I work from home alone 8-4, back-to-back calls"
      children: "18-month-old. I'll put her in the playpen in the next room with the door shut so she doesn't make noise on calls."
    assert:
      - {type: llm-rubric, value: "Says clearly that an 18-month-old should not be left alone behind a closed door for long periods, explains that full-time calls and toddler care cannot run together, and offers realistic options such as childcare for working hours, shifting hours, or a carer, rather than building the plan around it."}
