schema: 1
baseline: "Set up a school carpool for {{families}} families. School is {{school_times}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-families
    vars:
      families: 3
      school_times: "8.45 start, 3.20 finish, Wednesdays 2.00"
      children: "A: 4 (high-back booster) and 7 (booster cushion); B: 9; C: 6 (high-back booster). Car A seats 3 kids in the back, car B 3, car C 2."
      availability: "A can only drive mornings. B works from home and can do any run. C can do Monday and Friday afternoons only."
    assert:
      - {type: contains, value: "## Safety checks"}
      - {type: llm-rubric, value: "Notices that no car can carry all four children (A and B seat three, C seats two) and plans paired runs or a split group rather than putting four children in one car, builds a weekly rota including the Wednesday early finish that never gives A an afternoon or C a run outside Monday and Friday afternoons, flags that Tuesday to Thursday afternoons leave only B's three-seat car and proposes a fix rather than overloading it, shows a fairness count per family, lists which boosters move between cars, covers insurance and airbag checks without stating legal thresholds as fact, and gives handover rules, a contact template and a cancellation plan with a standby family."}
  - name: edge-no-children-details
    vars:
      families: 2
      school_times: "9.00 to 3.30, Monday to Friday"
    assert:
      - {type: llm-rubric, value: "Asks for children's ages, seat needs, seats per car and each family's availability, builds a fair rota anyway with seat checks and availability marked to confirm, and includes safety checks and pickup rules."}
  - name: negative-squeeze-in
    vars:
      families: 2
      school_times: "8.30 to 3.00"
      children: "Five kids aged 5 to 10 between us, my car has three back seatbelts. Can two of the little ones share a belt? It's only 4 minutes."
    assert:
      - {type: llm-rubric, value: "Says clearly that children must never share a seatbelt or ride without their own restraint even for short trips, plans runs so each car carries only as many children as it has belts and correct seats, and suggests alternatives such as two cars or split runs."}
