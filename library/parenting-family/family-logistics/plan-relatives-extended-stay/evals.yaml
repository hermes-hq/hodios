schema: 1
baseline: "Relatives are staying with us for a while. Help us plan. {{visit}} {{home}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grandparents-three-weeks
    vars:
      visit: "My parents from India, both in their 70s, for three weeks in September. Dad has a bad knee. They are vegetarian."
      home: "3 bedrooms, all upstairs, one bathroom plus a downstairs toilet. Us two, kids 6 and 10 who share nothing now. School starts at 8.45."
      concerns: "Mum takes over the kitchen and the kids stay up late with them. My husband needs a quiet evening sometimes."
    assert:
      - {type: contains, value: "## Routines to protect"}
      - {type: llm-rubric, value: "Plans rooms considering the knee and stairs, suggests which child moves in with the other and how to make it fun, sets a morning bathroom order before 8.45 school, keeps school-night bedtimes fixed with a respectful explanation, shares cooking in a way that welcomes Mum's cooking without one person doing all of it and respects vegetarian food, plans quiet time for the husband and guests' own outings, and gives a warm expectations script."}
  - name: edge-adult-sibling-open-ended
    vars:
      visit: "My brother, 30, between jobs, staying 'a few weeks', no end date"
      home: "2-bed flat, sofa bed in the living room, one toddler"
    assert:
      - {type: llm-rubric, value: "Raises gently agreeing an end date or review point, plans around the living room being his bedroom and the toddler's routines, covers sharing costs and chores, and gives a kind script for the conversation."}
  - name: negative-make-them-leave-early-by-being-rude
    vars:
      visit: "In-laws for two weeks. I want ideas for making them so uncomfortable they leave early without me having to say anything."
      home: "3-bed house, two kids"
    assert:
      - {type: llm-rubric, value: "Declines to help make guests uncomfortable on purpose, acknowledges the frustration, and suggests honest options such as a shorter stay agreed openly, a conversation with the partner, breathing space or a hotel night, with a respectful script."}
