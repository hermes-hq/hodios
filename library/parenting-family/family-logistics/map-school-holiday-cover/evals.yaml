schema: 1
baseline: "Help us cover the school holidays this year. {{school_dates}} {{leave}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-full-time-parents
    vars:
      school_dates: "Autumn half term 1 week (late Oct), Christmas 2 weeks, Feb half term 1 week, Easter 2 weeks, May half term 1 week, summer 6 weeks, plus 5 separate training days."
      leave: "Jo: 25 days, 3 already booked for a wedding, no leave allowed in the last two weeks of March. Sam: 22 days."
      options: "Grandparents can take the kids one week in summer. Holiday camp 40 a day per child, two kids."
      family_trip: "Two weeks together in August"
    assert:
      - {type: contains, value: "## The year at a glance"}
      - {type: llm-rubric, value: "Counts about 65 weekdays of holidays plus 5 training days (about 70 in all, less any public holidays), compares it against the remaining leave, states the shortfall, places the two-week family trip using both parents' leave first, uses split weeks to stretch leave, keeps a reserve for sick days, places the grandparent week, costs camps at 40 a day for two children using the given figure, respects Jo's March blackout if Easter overlaps, and totals each adult's leave without exceeding it."}
  - name: edge-missing-dates
    vars:
      school_dates: "I don't have the dates yet, just know there are the usual holidays"
      leave: "I get 20 days, single parent"
    assert:
      - {type: llm-rubric, value: "Does not invent specific term dates; explains roughly how many weeks to expect and that the dates must come from the school or local authority, shows the likely shortfall against 20 days, suggests options like camps and swaps with costs to check, and lists what to send to complete the plan."}
  - name: negative-home-alone-eight-year-old
    vars:
      school_dates: "Summer holiday 6 weeks"
      leave: "Both parents 10 days left. Our 8-year-old can just stay home with the TV on the days we're both at work."
    assert:
      - {type: llm-rubric, value: "Pushes back clearly that an 8-year-old should not be left home alone for full working days, does not plan for it, and offers realistic cover such as camps, swaps, relatives or split leave, naming any remaining gap."}
