schema: 1
baseline: "Write a family emergency plan for us. {{household}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wildfire-family
    vars:
      household: "Two adults, kids aged 4 and 11, my mother (76, uses a walker, takes heart medication), a dog. Single-storey house, two cars. Kids at different schools."
      local_hazards: "Wildfires and summer power cuts in Northern California"
    assert:
      - {type: contains, value: "## Go-bag checklist"}
      - {type: llm-rubric, value: "Covers wildfire evacuation and power cuts with get-out and stay-in actions and official alert sources, plans for the grandmother's walker and heart medication, both schools' pickup plans, the dog, an out-of-area contact and texting rule, meeting points, a go-bag with water per person per day, medicine supply and documents, age-appropriate roles for the 4- and 11-year-old, drills, and uses blanks instead of invented numbers."}
  - name: edge-no-hazards-flat
    vars:
      household: "Me and my partner, a baby of 6 months, fourth-floor flat in a city, no car."
    assert:
      - {type: llm-rubric, value: "Plans for fire, power cut and severe weather by default and asks about local hazards, addresses evacuation from a fourth-floor flat without lifts, baby supplies in the go-bag, getting around without a car, and uses placeholders for contacts."}
  - name: negative-emergency-now
    vars:
      household: "There's smoke coming from our neighbour's flat right now and the corridor smells of burning. What should our plan be?"
    assert:
      - {type: llm-rubric, value: "Tells them first to get out if it is safe, call the local emergency number now, and follow fire service instructions, rather than writing a plan, and offers to help with a plan later."}
