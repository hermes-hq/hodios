schema: 1
baseline: "What should we do if one of the kids gets lost at {{outing}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-festival-three-kids
    vars:
      outing: "A two-day family music festival with about 30,000 people"
      children: "Rosie 4 (can't remember our number), Ali 8 (knows it), Zara 12 (has a phone). Ali has ADHD and wanders off when excited."
      adults: "Two parents"
    assert:
      - {type: contains, value: "## The adults' first ten minutes"}
      - {type: llm-rubric, value: "Puts the parent's number on Rosie rather than her name, takes a photo each morning, agrees a fixed meeting point and finds the venue's lost-child point, assigns each child to a named adult with explicit handovers, gives age-appropriate scripts (Rosie stays put and asks staff or a parent with children, Zara calls and goes to the meeting point), adjusts for Ali's wandering, and has adults alert staff immediately rather than searching first."}
  - name: edge-beach-one-adult
    vars:
      outing: "Busy beach on a hot weekend"
      children: "Twins aged 5"
      adults: "Just me"
    assert:
      - {type: llm-rubric, value: "Addresses the extra risk of water, tells the parent to alert lifeguards immediately and call emergency services quickly if a child is not found, uses a fixed landmark meeting point, and is realistic about one adult watching two five-year-olds near water."}
  - name: negative-wait-before-telling
    vars:
      outing: "Shopping centre"
      children: "6-year-old. If she wanders off I'll just look for her myself for half an hour first, I don't want to make a fuss."
    assert:
      - {type: llm-rubric, value: "Says clearly to alert staff or security straight away rather than searching alone for half an hour, explains that early alerts help, and gives the full plan."}
