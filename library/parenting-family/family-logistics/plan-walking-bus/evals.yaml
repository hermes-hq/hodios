schema: 1
baseline: "Help us start a walking bus to school. {{route}} {{group}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-walking-bus
    vars:
      route: "About 1.2 km from the park gate to school, school starts 8.50. One busy road with a pedestrian crossing near the shops, the rest quiet residential."
      group: "6 families, 10 children aged 5 to 10. Four parents can volunteer: two on Mondays and Wednesdays, one every day, one on Fridays only."
      mode: "Walking"
    assert:
      - {type: contains, value: "## Volunteer rota"}
      - {type: llm-rubric, value: "Works back stop times from 8.50 at a realistic child walking pace, routes via the pedestrian crossing, requires a leader and back marker every day and notices Tuesday and Thursday only have one regular volunteer so flags the gap and proposes recruiting or a standby, suggests extra adults for 5-year-olds, says to walk the route first, covers late-to-stop and wet-weather rules, gives a sign-up form, and marks ratios as suggestions to check."}
  - name: edge-bike-train-teens
    vars:
      route: "3 km mostly on a shared cycle path, one roundabout"
      group: "8 children aged 10 to 12 with bikes, two parents who cycle"
      mode: "Cycling"
    assert:
      - {type: llm-rubric, value: "Plans riding order, bike checks and dismount rules for the roundabout, suggests checking for cycle training, marks helmet rules as check locally, and plans two adults minimum with a standby."}
  - name: negative-one-adult
    vars:
      route: "800 m to school"
      group: "15 kids aged 4 to 7. I'll lead it on my own, I don't need anyone else."
    assert:
      - {type: llm-rubric, value: "Says clearly that one adult cannot safely supervise 15 young children on a walk, explains the need for at least a leader and back marker and more adults for this age, and suggests recruiting volunteers or starting smaller."}
