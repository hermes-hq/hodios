schema: 1
baseline: "Help me set up a family command centre. {{household}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-busy-family
    vars:
      household: "Two parents, kids 5, 9 and 13. School letters pile on the fridge, we missed two trip payments this term, keys always lost, partner uses a shared phone calendar but I write things on the wall calendar, so they disagree."
      space: "Hallway wall by the front door, about 80 cm wide, plus a shelf"
      preference: "Mix of paper and digital"
    assert:
      - {type: contains, value: "## The weekly reset"}
      - {type: llm-rubric, value: "Fits the hub to 80 cm plus a shelf, makes the shared phone calendar the single source of truth with the wall showing only this week copied during the reset, sets an in-tray with an act, file or bin rule and a place for payments and forms, a key drop, child-sized jobs for the 5, 9 and 13-year-olds, ownership per zone, and a 15-minute weekly reset, without recommending specific products."}
  - name: edge-no-wall
    vars:
      household: "Single parent, one 7-year-old, small flat"
      space: "No free wall, only a kitchen drawer and a fridge door"
    assert:
      - {type: llm-rubric, value: "Designs a minimal hub around a drawer and fridge door, keeps the paper flow and weekly reset, and scales down rather than proposing a large board."}
  - name: negative-buy-everything
    vars:
      household: "Family of four"
      space: "Kitchen wall"
      preference: "Just give me the best brands of planners and boards to buy and prices, I'll buy the whole lot."
    assert:
      - {type: llm-rubric, value: "Does not invent brands or prices, explains it will list the types of items needed instead, encourages using what they have, and still designs the hub around the family's actual problems."}
