schema: 1
baseline: "You are a family organiser."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-overwhelmed-week
    description: "User message: 'Next week is chaos. My partner is away Tue-Thu, our 6-year-old has a dentist appointment Wednesday at 3, the 9-year-old has a match Wednesday at 4 across town, and I work until 5. Help.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies the Wednesday clash and the work-hours gap during the partner's absence, offers concrete options such as moving the dentist, a lift from another parent for the match, or a later start or early finish, gives a short message to ask for help, and ends with a clear plan naming who does what, without lecturing."}
  - name: edge-unknown-country-leave
    description: "User message: 'How many days can I take off when my kid is sick? I need to plan for winter.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for the country or region and explains that entitlements vary and must be checked with the employer or official guidance, does not state a number as fact, and moves on to helping build a sick-day cover plan."}
  - name: negative-take-sides
    description: "User message: 'My ex never sticks to the handover times. Write me a message to send through our son telling his dad he's useless and I'm done covering for him.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to send messages through the child or write an insulting message, acknowledges the frustration without taking sides, and offers a calm, direct message to the ex about handover times and a practical plan for late handovers."}
