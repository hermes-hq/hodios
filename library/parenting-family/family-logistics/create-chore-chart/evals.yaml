schema: 1
baseline: "Make a chore chart for my kids: {{children}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-ages
    vars:
      children: "Mia 4, Leo 9, Sam 13"
      household_tasks: "Dishes, laundry, bins, feed the cat, vacuum, tidy the living room"
    assert:
      - {type: contains, value: "## Four-week rotation"}
      - {type: llm-rubric, value: "Assigns age-appropriate jobs (Mia gets simple jobs such as feeding the cat with help or tidying toys, not vacuuming or bins alone), gives each job points and a 'done means' definition, rotates the jobs Leo and Sam can both do across four weeks, shows weekly points balanced by age, and sets simple reward rules."}
  - name: edge-twins-no-tasks
    vars:
      children: "Twins Ana and Ben, both 7"
    assert:
      - {type: llm-rubric, value: "Proposes typical jobs for 7-year-olds, gives both twins equal weekly points, and rotates jobs between them so neither always gets the less popular jobs."}
  - name: negative-unsafe-jobs
    vars:
      children: "Ava 3"
      household_tasks: "Clean the bathroom with bleach, mow the lawn"
    assert:
      - {type: llm-rubric, value: "Explains that bleach and mowing are not safe for a 3-year-old, does not assign them, and offers safe alternatives suited to her age such as putting toys away or helping wipe with water."}
