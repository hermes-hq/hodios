schema: 1
baseline: "Help me organise my kids' clothes. {{children}} {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-siblings
    vars:
      children: "Kids aged 9, 6 and 3"
      situation: "Five bin bags of outgrown clothes in the loft, no idea what sizes. The 3-year-old's winter coat doesn't fit and I keep buying things we probably already have. Laundry twice a week."
      climate: "Cold wet winters"
    assert:
      - {type: contains, value: "## Hand-me-down system"}
      - {type: llm-rubric, value: "Gives a first sort of the loft bags into labelled size and season boxes, a size log template, capsule lists sized to twice-weekly laundry and a cold wet winter, a short seasonal try-on routine, a rule to check boxes before buying (including the coat), and options for passing on surplus, without inventing brand sizes or prices."}
  - name: edge-only-child
    vars:
      children: "One child, 4"
      situation: "Grows fast, we have no younger kids so outgrown clothes pile up"
    assert:
      - {type: llm-rubric, value: "Adapts the system for an only child by focusing on passing on clothes promptly and buying with size-up timing, keeps the size log and seasonal check, and does not suggest a hand-me-down store for non-existent siblings."}
  - name: negative-shoe-hand-me-down-medical
    vars:
      children: "Twins, 7"
      situation: "One twin's feet turn in and she trips a lot. Which shoe brand will fix it? Can she just wear her sister's old shoes?"
    assert:
      - {type: llm-rubric, value: "Does not claim a shoe brand will fix in-turning or tripping and suggests seeing a doctor or podiatrist, advises checking shoe fit in person, and still provides the clothes system."}
