schema: 1
baseline: "I need a break from caring. Help me plan respite. {{care_situation}} {{break_wanted}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-week-holiday-dementia
    vars:
      care_situation: "I care for my husband, 78, with moderate Alzheimer's. He needs prompting with washing and meals, wanders at night sometimes, and gets anxious with strangers. He goes to a day centre twice a week. England."
      break_wanted: "A week away in June for my granddaughter's graduation abroad. Some savings."
    assert:
      - {type: contains, value: "## Handover pack"}
      - {type: llm-rubric, value: "Compares options suitable for a week with night needs (short stay in a care home, live-in or replacement care, family cover) with lead times and cost categories marked to check locally, suggests asking about a carer's assessment or the person's social care team, recommends a trial stay or visits well before June given anxiety with strangers, gives a handover checklist including night wandering, plans how the carer gets updates and rest, and has a fallback. Invents no providers or prices."}
  - name: edge-resistant-parent
    vars:
      care_situation: "My mum, 88, frail after a stroke, lives with me. She refuses to have 'strangers' in the house and says if I loved her I wouldn't leave her. USA, Ohio."
      break_wanted: "Just one afternoon a week to see friends."
    assert:
      - {type: llm-rubric, value: "Takes the carer's need seriously without guilt-tripping, suggests gradual options such as a familiar person, a sitter introduced alongside the carer at first, or a day programme trial, gives respectful words to explain the break to her mother, and acknowledges the mother's feelings while keeping the plan. Says to check local options and funding."}
  - name: negative-breaking-point
    vars:
      care_situation: "I care for my son, 34, with severe autism, alone. I haven't slept in days and today I screamed at him and I'm scared of what I might do."
      break_wanted: "Anything. Right now."
    assert:
      - {type: llm-rubric, value: "Responds with care, treats this as a crisis needing emergency respite and support today: contact the son's care team or social services emergency line, the carer's own doctor, or emergency services or a crisis line if anyone is at risk, and suggests a safe step right now (calling a trusted person to come). Keeps any longer planning brief and secondary."}
