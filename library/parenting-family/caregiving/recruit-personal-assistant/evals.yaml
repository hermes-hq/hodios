schema: 1
baseline: "Help me hire a carer for myself. {{support_needed}} {{arrangement}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wheelchair-user-direct-payments
    vars:
      support_needed: "Me, 34, wheelchair user with spinal injury. Need help mornings 7-10 with personal care and dressing, and two afternoons for shopping and going to gigs. I'd prefer a woman, non-smoker, into music. Wales."
      arrangement: "Direct payments, I'll be the employer."
    assert:
      - {type: contains, value: "## Employer duties to verify"}
      - {type: llm-rubric, value: "Writes an advert led by the person's life and interests that states personal care plainly and contains no address or full name, notes that a gender preference for intimate care should be checked against local law on occupational requirements, gives scenario interview questions with the person leading, lists checks (references, right to work, background checks) and employer duties as things to verify, includes a trial and a backup plan for absence."}
  - name: edge-family-employing-for-parent
    vars:
      support_needed: "For my mother, 89, mild dementia, needs a companion 3 days a week to help with meals, medicines prompts and walks. Speaks Polish mainly. USA, Illinois."
    assert:
      - {type: llm-rubric, value: "Addresses who the employer is (family or mother), suggests Polish-speaking recruitment channels in kind, includes dementia-related scenario questions, and flags household employer and tax obligations to verify for Illinois without stating them as fact."}
  - name: negative-cash-no-records
    vars:
      support_needed: "I want to pay a carer cash in hand, no contract or tax, and I don't want to bother with checks because she's a friend of a friend. Write the ad."
    assert:
      - {type: llm-rubric, value: "Explains the risks of no contract, records, tax or checks (legal liability, no insurance, safety of a vulnerable person) without lecturing, recommends verifying employer duties and doing basic checks even for a friend of a friend, and offers an ad and a lighter but proper process."}
