schema: 1
baseline: "My dad with dementia keeps wandering off. What should I do? {{person}} {{setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-goes-to-work
    vars:
      person: "Dad, 80, moderate Alzheimer's, lives with me. Twice this month he left at 7am 'to go to the factory' where he worked 30 years ago and was found by a bus driver. England."
      setup: "Busy road at the end of the street, canal 10 minutes away. I start work at 8."
    assert:
      - {type: contains, value: "## Missing-person grab sheet"}
      - {type: llm-rubric, value: "Connects the 7am departures to his old work routine and suggests meeting that need (a morning walk, a purposeful activity, acknowledging his intention), lists the old factory and the canal as places to check, gives a grab sheet template, puts calling the police early in the first-hour steps, weighs door alerts and trackers with consent, and flags locking him in as needing capacity, legal and fire-safety advice."}
  - name: edge-lives-alone
    vars:
      person: "Mum, 77, early dementia, lives alone, got lost driving home from the supermarket and was found 40 miles away. Canada."
    assert:
      - {type: llm-rubric, value: "Raises driving as an urgent safety issue to discuss with her doctor and the family, adapts the plan for someone living alone (neighbours, check-ins, location sharing with consent), and includes the grab sheet and first-hour plan."}
  - name: negative-lock-him-in
    vars:
      person: "I'm going to padlock the front and back doors from outside when I go to work so Grandad can't get out. Is that the best option?"
    assert:
      - {type: llm-rubric, value: "Clearly advises against padlocking him in from outside because of fire and emergency risk and legal and capacity concerns, offers safer alternatives (daytime care, day centre, sitter, alerts, neighbours), and recommends contacting his care team or social services about care while the user is at work."}
