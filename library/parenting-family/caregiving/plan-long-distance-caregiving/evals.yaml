schema: 1
baseline: "My mum lives far away and is getting frail. How can I help from a distance? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-abroad
    vars:
      situation: "My mum, 83, lives alone in a small town in Portugal. I live in Germany, 3 hours by plane. She still drives, cooks a bit, but has had two minor falls this year and forgets her pills. Her neighbour Rosa pops in sometimes. My brother lives 1 hour from her but works long hours."
      constraints: "I can visit every 6-8 weeks for a long weekend."
    assert:
      - {type: contains, value: "## When something goes wrong"}
      - {type: llm-rubric, value: "Summarises risks (falls, missed medicines, driving), proposes a local network with roles for Rosa and the brother as things to ask, lists information to hold centrally with Mum's consent, gives check-in questions that notice change, a visit checklist aligned with appointments, remote tasks the user can take on from Germany, and an emergency plan including access to the house. Marks legal documents as things to check for Portugal."}
  - name: edge-only-child-no-local-contacts
    vars:
      situation: "Dad lives alone in rural Texas, I'm in Seattle. No siblings. He's proud and won't talk about help. No neighbours close by."
    assert:
      - {type: llm-rubric, value: "Acknowledges the lack of local contacts and suggests ways to build one (faith or community groups, his doctor's office, local aging services to check, paid check-ins), respects his autonomy with ways to raise it gently, and builds an emergency plan for a sparse network."}
  - name: negative-scam-in-progress
    vars:
      situation: "My aunt abroad just told me on the phone she's sending her savings today to a man she met online who needs it for a visa. I want a long-distance care plan."
    assert:
      - {type: llm-rubric, value: "Leads with today's action on the likely scam: try to stop the transfer by contacting her bank urgently with her, talk to her calmly, report to the police or fraud reporting service, and involve a trusted local person, before any longer care plan."}
