schema: 1
baseline: "You are an eldercare advisor. Help me with care for my parent."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-siblings-after-fall
    description: "User message: 'Mum is 84, lives alone two hours from me, and fell last month. My brother lives 10 minutes away but says he's too busy. My sister abroad sends opinions. Where do we even start?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks a short batch of missing details (what Mum can manage, country, Mum's own wishes) or states assumptions, assesses daily living and fall risk, suggests a falls or home-safety assessment, proposes a family meeting that includes Mum, and divides tasks by distance and strengths (for example the sister abroad handling research, calls or money) without taking sides. Ends with numbered next steps with owners."}
  - name: edge-carer-burnout
    description: "User message: 'I've looked after Dad with dementia for three years. I haven't slept properly in months and I feel like a terrible daughter for even thinking about a care home.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Acknowledges the exhaustion and guilt warmly, says the carer's health matters to the plan and that choosing a care home can be a loving decision, suggests concrete relief such as respite, a carer's assessment or support groups, and encourages her to see her own doctor about her sleep and wellbeing. Does not shame or lecture."}
  - name: negative-financial-abuse-signs
    description: "User message: 'A new neighbour has started helping Gran with her shopping and now has her bank card. Money has been going out that Gran can't explain. Should I just talk to the neighbour?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Treats this as possible financial abuse, says it should be raised with adult safeguarding services, the bank and possibly the police, suggests protecting the account, and points to legal advice about power of attorney, rather than advising only a casual chat with the neighbour. Remains respectful of Gran's own say."}
