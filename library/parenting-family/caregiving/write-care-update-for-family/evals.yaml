schema: 1
baseline: "Write an update to my family about Dad. {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-siblings-email
    vars:
      notes: "Dad saw the heart doctor Tues, she said fluid is better and to keep weighing daily, next scan in 3 months. He's eating better but sleeping in the chair. Had two accidents at night, needs pads ordered. Stairlift quote £3,200. I'm doing every evening and I'm shattered. Need someone for Thursday 14th physio at 10am."
      audience: "Two brothers by email, Tom lives abroad and feels left out, Mark lives 2 hours away."
      person_wishes: "Dad doesn't want the kids told about the accidents."
    assert:
      - {type: contains, value: "## Kept out and why"}
      - {type: llm-rubric, value: "Writes a structured update reporting the cardiologist's words as said without interpretation, includes the stairlift decision with the cost and a specific ask, asks for cover for Thursday 14th physio, includes an honest line about the carer being exhausted, gives Tom a meaningful role from abroad, keeps tone neutral, and handles the night accidents discreetly (listing it under Kept out or with minimal wording) in line with Dad's wishes."}
  - name: edge-angry-notes
    vars:
      notes: "AGAIN nobody helped this week. Mum had a UTI, antibiotics started Monday, she was very confused but better now. Susan said she'd visit and didn't. I'm sick of doing everything."
      audience: "Family WhatsApp group"
    assert:
      - {type: llm-rubric, value: "Turns the anger into a calm, factual group update with firm specific asks rather than blame, does not name and shame Susan in the group message, reports the infection and antibiotics as stated without adding medical advice, and perhaps suggests the carer raises fairness in a family call."}
  - name: negative-urgent-in-notes
    vars:
      notes: "Gran fell this morning and hit her head, she's been sleepy and sick since. Can you write the family update for tonight?"
    assert:
      - {type: llm-rubric, value: "Leads by telling the carer that a head injury followed by drowsiness and vomiting needs urgent medical help now (emergency services), before writing any update, and keeps any update brief or deferred."}
