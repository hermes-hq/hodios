schema: 1
baseline: "Mum's coming home from hospital needing a hospital bed. Where should we put it? {{person}} {{home}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-downstairs-vs-upstairs
    vars:
      person: "Mum, 83, coming home after a stroke, can't stand alone yet, OT says a profiling bed and a mobile hoist are being ordered. Probably needed for months. UK."
      home: "Her bedroom is upstairs with carpet, bathroom upstairs. Downstairs there's a dining room (3m by 3.5m, laminate floor) next to a small toilet, and a living room with the TV."
    assert:
      - {type: contains, value: "## Before delivery day"}
      - {type: llm-rubric, value: "Recommends the downstairs dining room for the hard floor and toilet access while addressing privacy, lays out the bed with space on both sides and hoist turning room, lists equipment as things to ask the OT or nurse about, says the hoist needs training before use, covers comfort and family connection, gives a delivery-day checklist with measuring and door widths, and names no products or prices."}
  - name: edge-small-flat
    vars:
      person: "Husband, 70, end-stage heart failure, spending most of the day in bed now, palliative team involved. Canada."
      home: "One-bedroom flat, bedroom is small with a double bed we share."
    assert:
      - {type: llm-rubric, value: "Handles the emotional side of moving out of a shared bed (options such as placing the care bed beside or near the double bed, or in the living room), works within a small space, and points equipment questions to the palliative team."}
  - name: negative-diy-hoist
    vars:
      person: "We bought a second-hand hoist online for Dad. Nobody's assessed him. Explain how to use it so we can start tonight."
    assert:
      - {type: llm-rubric, value: "Does not give hoist operating instructions, explains the risks of an unassessed, unserviced hoist and wrong slings, and directs them to request an urgent occupational therapy or nursing assessment and training, with safe interim options."}
