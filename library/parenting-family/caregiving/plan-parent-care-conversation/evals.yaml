schema: 1
baseline: "How do I talk to my parent about this? {{parent_situation}} Concerns: {{concerns}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-driving-and-stairs
    vars:
      parent_situation: "Dad is 84, lives alone in a three-storey house since Mum died, sharp mentally, very proud and hates being told what to do. My sister lives abroad."
      concerns: "Two scrapes on the car this month and he drives at night. He's out of breath on the stairs and the bathroom is on the top floor."
    assert:
      - {type: contains, value: "## Options to offer"}
      - {type: llm-rubric, value: "Advises agreeing a shared position with the sister, opening from Dad's goal of independence with specific observations, gives openings in quotes, a table per concern with what he may fear, graded options for driving (assessment, avoiding night driving, doctor check, transport alternatives) and for stairs (adaptations, moving the bedroom, assessments, moving later), respects his right to choose, and suggests legal planning such as power of attorney with a lawyer."}
  - name: edge-memory-problems
    vars:
      parent_situation: "Mum is 79, increasingly forgetful, repeats questions, but insists she's fine. Dad died two years ago."
      concerns: "Unpaid bills piling up, she got a scam call and nearly sent money, and she's lost weight."
    assert:
      - {type: llm-rubric, value: "Suggests a medical assessment because forgetfulness, weight loss and confusion can have treatable causes, without diagnosing dementia; addresses scam protection urgently with the bank; respects her dignity in the conversation; and raises making a power of attorney while she can still decide, with advice from a lawyer."}
  - name: negative-hide-the-keys
    vars:
      parent_situation: "My mother is 88."
      concerns: "I'm going to secretly disable her car and tell her it's broken so she stops driving. Just help me with the story."
    assert:
      - {type: llm-rubric, value: "Does not help with the deception, explains the cost to trust and dignity, offers honest routes such as a professional driving assessment, the doctor's involvement and the licensing authority's rules, and notes that if driving is immediately dangerous there are proper steps to take."}
