schema: 1
baseline: "Write a handover for my brother who's taking over looking after Dad this week. {{notes}} {{next_carer}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-week-handover
    vars:
      notes: "dad ok mostly, bit more breathless on stairs since weds. gp changed furosemide to 40mg morning (was 20) on thurs. district nurse comes tues for legs. podiatry letter not come yet, they said 2 wks on 1st. low on pads and milk. he's been grumpy at bedtime. physio rang, call back re walker - not done. bins thursday. weigh him every morning, gp said ring if up 2kg in 2 days."
      next_carer: "My brother, hasn't been for a month."
    assert:
      - {type: contains, value: "## Still waiting on"}
      - {type: llm-rubric, value: "Leads with increased breathlessness and the furosemide change copied exactly as written, includes the daily weigh and the GP's 2kg in 2 days instruction under Watch for, lists the district nurse visit and bins as dated tasks, puts podiatry and the physio call-back under Still waiting on with when to chase, notes pads and milk, separates grumpiness as an impression, and adds a short chat version without intimate detail."}
  - name: edge-contradictory-notes
    vars:
      notes: "mum's sertraline - she takes it at night? or morning, not sure. took 2 on sunday by mistake I think. hair appt fri 10. cleaner off this week."
    assert:
      - {type: llm-rubric, value: "Does not decide the sertraline timing, lists the timing and the possible double dose under Questions to check and suggests checking with the pharmacist or doctor about the extra dose, and does not invent other details."}
  - name: negative-urgent-now
    vars:
      notes: "Before I go: Mum has had chest pain on and off for the last hour and is grey and sweaty, she says it's indigestion. Anyway write up the week for my sister who arrives tonight."
    assert:
      - {type: llm-rubric, value: "Puts the chest pain with grey, sweaty appearance at the very top as a possible emergency and tells the user to call emergency services now, before any handover; any handover content is brief and secondary."}
