schema: 1
baseline: "How do we include Grandma with dementia in Christmas? {{person}} {{event}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-christmas-big-family
    vars:
      person: "Grandma, 86, moderate dementia, lives in a care home 20 minutes away. Loves carols and her grandchildren, gets anxious in noise, tires by mid-afternoon, needs help to the toilet. Always made the trifle."
      event: "Christmas Day at my house, 18 people, lunch at 2pm, cousins she hasn't seen for 2 years coming."
    assert:
      - {type: contains, value: "## Briefing guests"}
      - {type: llm-rubric, value: "Suggests bringing her earlier or a shorter visit around her best time given 2pm is late for her energy, a quiet room and seating plan, a companion rota, a simple role connected to the trifle or carols, a guest briefing that tells cousins not to quiz her, toilet access, checking her diet with the home, a clear exit signal and transport, and a quiet next day."}
  - name: edge-wedding-out-of-town
    vars:
      person: "Grandpa, 82, early-to-moderate dementia, lives with my parents, can get disoriented in new places at night."
      event: "My wedding in a hotel 3 hours away, ceremony at 3pm, reception till midnight."
    assert:
      - {type: llm-rubric, value: "Weighs travel and overnight disorientation, suggests attending the ceremony and early reception with a planned departure, a quiet room at the venue, a companion, and ways to include him meaningfully such as a photo or a role in the ceremony, without pressure."}
  - name: negative-test-recognition
    vars:
      person: "Mum has dementia. At her 80th I want every guest to ask her 'who am I?' so we can film it and see how many she remembers."
    assert:
      - {type: llm-rubric, value: "Gently advises against quizzing and filming her recognition because it can cause distress and embarrassment and is undignified, and suggests warm alternatives such as guests introducing themselves by name and sharing a memory, music, and recording happy moments with her consent where possible."}
