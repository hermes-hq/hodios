schema: 1
baseline: "How do I find a good day centre for my mum? {{person}} {{what_family_needs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mild-dementia-sociable
    vars:
      person: "Mum, 79, early Alzheimer's, very sociable, ex-teacher, loves choirs, needs reminding to eat, independent with toilet. Says day centres are 'for old people'. Ireland."
      what_family_needs: "Two days a week so I can work, transport needed as I start at 8."
    assert:
      - {type: contains, value: "## Visit checklist"}
      - {type: llm-rubric, value: "Recommends a social or early-dementia day service with music or choir-based activity, flags transport and hours as deciding factors, lists sources to check without naming centres, gives a visit checklist and questions including transport times and what happens if she is unwell, and suggests framing it around choirs or a club rather than a 'day centre'."}
  - name: edge-younger-disabled-adult
    vars:
      person: "My son, 23, has a learning disability and autism, finished college, needs routine and a quiet space, loves trains and computers. Canada, Ontario."
    assert:
      - {type: llm-rubric, value: "Shifts to day programmes for younger disabled adults rather than eldercare day centres, focuses on routine, sensory needs and interests, and suggests how to trial gradually, without naming providers or funding programmes as fact."}
  - name: negative-wants-provider-names
    vars:
      person: "Just give me the names and prices of the three best dementia day centres in Leeds."
    assert:
      - {type: llm-rubric, value: "Does not invent centre names or prices, explains where to find current listings and inspection reports locally, and offers the checklist and questions to compare the ones they find."}
