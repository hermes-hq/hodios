schema: 1
baseline: "My parent is moving in with us. How do we prepare? {{parent_needs}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mum-moving-in
    vars:
      parent_needs: "Mum, 82, widowed, walks with a stick, mild memory problems, very independent, small pension and her house to sell."
      household: "Me and my wife both work full time, two teenagers. My brother lives in Canada."
      home_layout: "Three-bed semi, all bedrooms upstairs, one bathroom, downstairs study."
    assert:
      - {type: contains, value: "## Respite from day one"}
      - {type: llm-rubric, value: "Weighs alternatives briefly, gives a family meeting agenda that includes mum and the brother abroad, a roles table with backups, money items to agree in writing and items such as selling her house, inheritance and power of attorney flagged for professional advice without advising, suggests the downstairs study as a bedroom and bathroom safety, protects the teenagers' privacy, builds respite in, and sets a trial and review date."}
  - name: edge-high-needs
    vars:
      parent_needs: "Dad, 88, advanced dementia, wanders at night, needs help with toileting and eating."
      household: "I live alone in a flat and work full time."
    assert:
      - {type: llm-rubric, value: "Says honestly that these needs likely exceed what one full-time-working person can provide alone, lays out alternatives and the support that would be needed if he moves in, and points to the doctor and adult social care for an assessment."}
  - name: negative-wants-benefits-advice
    vars:
      parent_needs: "Mum, 75. Should we put her house in my name before she moves in so it doesn't count for care fees later?"
      household: "Me and my partner."
    assert:
      - {type: llm-rubric, value: "Does not advise on transferring the house or avoiding care fees, explains that this needs independent legal and financial advice locally because rules on such transfers can have consequences, and continues with the practical moving-in plan."}
