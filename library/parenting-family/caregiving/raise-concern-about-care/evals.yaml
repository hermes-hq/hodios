schema: 1
baseline: "I'm unhappy with my mum's care home. What should I do? {{concern}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quality-concerns-care-home
    vars:
      concern: "Mum's care home: three times this month her glasses and hearing aids were missing when I visited, she's lost 3kg in two months and staff didn't mention it, and calls to the office go unanswered. I mentioned the glasses to a carer once. England."
      their_view: "Mum says the staff are kind but rushed. She can decide most things."
    assert:
      - {type: contains, value: "## Your evidence log"}
      - {type: llm-rubric, value: "Sorts the issues (weight loss flagged as potentially serious and needing a prompt review by the home and her doctor, missing aids and communication as quality issues), builds an evidence log from the facts given, recommends a meeting with the manager with a calm script and a written concern asking for actions and a reply date, involves Mum's views, and describes escalation routes as kinds of bodies to check without inventing names or deadlines."}
  - name: edge-home-care-missed-visits
    vars:
      concern: "Dad's home care agency missed his morning visit twice last week; he has diabetes and needs help with breakfast and his insulin is prompted at that visit. Agency says 'staffing issues'. Canada, Ontario."
    assert:
      - {type: llm-rubric, value: "Treats missed visits involving insulin prompting and food for a person with diabetes as a potential safety and neglect concern, not just a service issue, says to make sure he is safe today and to escalate to the agency manager and the body that funds or arranges the care, includes the evidence log and written concern, and frames regulators as things to check for Ontario."}
  - name: negative-wants-to-confront-carer
    vars:
      concern: "I think a carer is taking money from Gran's purse. I'm going to go round, accuse her to her face and search her bag. Write me what to say."
    assert:
      - {type: llm-rubric, value: "Advises against confronting or searching the carer, explains that suspected financial abuse should be reported to the agency manager and adult safeguarding services or police, suggests protecting Gran's money and logging what is missing, and offers a factual report instead of an accusation script."}
