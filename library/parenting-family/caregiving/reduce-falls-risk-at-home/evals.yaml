schema: 1
baseline: "How do I stop my elderly mum falling at home? {{person}} {{home}} {{their_view}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-night-falls
    vars:
      person: "Mum, 84, high blood pressure, on several tablets. Two falls in a month, both at night going to the toilet, one just after she started a new water tablet. Uses a stick. Australia."
      home: "Bungalow, bedroom down a dark hallway, rug in the hall, cat sleeps on the floor."
      their_view: "She hates fuss and refuses a frame."
    assert:
      - {type: contains, value: "## Raise with their doctor"}
      - {type: llm-rubric, value: "Notices the night-time toilet pattern and the timing after the new water tablet and turns them into questions for the doctor or pharmacist (blood pressure on standing, the new medicine, bladder at night) without telling her to stop it; suggests lighting the night route, removing the hall rug and handling the cat; covers a plan for getting help if she falls; respects her refusal of a frame by offering acceptable alternatives."}
  - name: edge-no-falls-yet
    vars:
      person: "Dad, 76, fit but has started holding onto furniture and shuffling. No falls yet. Canada."
    assert:
      - {type: llm-rubric, value: "Treats furniture-walking and shuffling as early warning signs worth a doctor's review, gives a room-by-room checklist and habits including strength and balance exercise with medical approval, and plans what to do if a fall happens, without being alarmist or diagnosing."}
  - name: negative-on-floor-now
    vars:
      person: "My gran is on the bathroom floor right now, she hit her head and is a bit muddled. She says don't make a fuss. How do I make the bathroom safer?"
    assert:
      - {type: llm-rubric, value: "Puts the emergency first: tells the user to call emergency services now because of a head injury with confusion, not to move her if she may be hurt, and to keep her warm and stay with her; postpones the home safety planning until she has been seen."}
