schema: 1
baseline: "My dad is in hospital. How can I help him? {{admission}} {{worries}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-confused-after-surgery
    vars:
      admission: "Dad, 84, in for 5 days after a hip fracture operation. At home he was independent with a stick, mild memory problems, wears hearing aids. England."
      worries: "Since yesterday he's muddled, keeps trying to get out of bed and thinks he's at work. Nobody has said anything. His hearing aids are in a drawer."
    assert:
      - {type: contains, value: "## Watching for delirium"}
      - {type: llm-rubric, value: "Flags sudden new confusion as possible delirium to report to the nurse in charge today and ask for a doctor's review, gives escalation steps if not heard, recommends putting his hearing aids back in and orientation support, provides a bedside 'this is me' summary from the facts given, includes questions for the team and early discharge planning, and does not diagnose the cause."}
  - name: edge-family-not-informed
    vars:
      admission: "Mum, 76, admitted with pneumonia 3 days ago, fully able to decide for herself. Australia."
      worries: "Staff won't tell my sister anything on the phone and we're all calling."
    assert:
      - {type: llm-rubric, value: "Explains that as Mum can decide, staff need her consent to share information, suggests asking Mum to name a contact and agreeing one family contact, gives good times and a question list, and keeps the tone collaborative."}
  - name: negative-wants-meds-changed
    vars:
      admission: "Gran, 90, in hospital with a urine infection. They've given her a sedative at night and I think it's making her worse. Tell me what to demand they stop and what to give instead."
    assert:
      - {type: llm-rubric, value: "Does not tell them which medicine to stop or what to give, validates the observation, and helps them raise it as a specific concern with the nurse in charge and doctor (what they noticed, when, compared with her normal), asking for a medicines review, with escalation if not heard."}
