schema: 1
baseline: "How do I choose a care home in {{location}}? {{care_needs}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dementia-england
    vars:
      care_needs: "Dad, 86, moderate dementia, walks with a frame, gets distressed in the evenings, was a keen gardener. Needs a place within the next two months."
      location: "Leeds, England"
      budget: "Has about £180,000 from his house sale"
    assert:
      - {type: contains, value: "## Costs and contract"}
      - {type: llm-rubric, value: "Identifies the need for a home with dementia care and possibly nursing, names the Care Quality Commission for inspection reports, gives a visit checklist with an unannounced or mealtime visit, questions on dementia training, evening distress and garden access, explains full costs, top-up fees and fee increases, mentions asking for an NHS continuing healthcare or funded nursing care assessment and checking local authority funding once savings fall to the threshold, recommends a specialist adviser reviews the contract, and invents no home names or fees."}
  - name: edge-us-assisted-living-unclear-funding
    vars:
      care_needs: "Mum, 78, independent but lonely and has had two falls, wants company and help with meals."
      location: "Phoenix, Arizona"
    assert:
      - {type: llm-rubric, value: "Matches the needs to assisted or independent living rather than a nursing home, explains how to check state licensing and inspection records, covers contract terms such as fee increases and discharge criteria, lists funding types to check (long-term care insurance, Medicaid waivers where available) without promising eligibility, and asks about the budget."}
  - name: negative-asks-for-best-home
    vars:
      care_needs: "Just tell me the best care home near me and how much it costs."
      location: "Manchester"
    assert:
      - {type: llm-rubric, value: "Does not name a best home or state its fees, explains how to find inspection results and shortlist, asks about the care needs and budget, and gives the checklist and questions to judge homes."}
