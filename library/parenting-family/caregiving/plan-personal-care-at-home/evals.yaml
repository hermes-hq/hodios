schema: 1
baseline: "How do I help my mum have a shower? She won't let me. {{person}} {{relationship}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-refuses-showers
    vars:
      person: "Mum, 85, moderate dementia, arthritis in her hands, unsteady on her feet. Used to bathe in the evening. Screams when I try to get her in the shower in the morning. USA."
      relationship: "I'm her son and we're both uncomfortable with intimate care."
    assert:
      - {type: contains, value: "## When they refuse"}
      - {type: llm-rubric, value: "Suggests switching to her old evening routine and strip washes, explains likely reasons for distress (cold, fear, unfamiliar time, embarrassment), gives a dignity-preserving sequence with choices and towels, lists bathroom equipment to ask an OT about, names the son's discomfort as legitimate and suggests paid or female help for intimate tasks, and does not suggest forcing."}
  - name: edge-wife-after-stroke
    vars:
      person: "My husband, 66, had a stroke, weak right side, can stand with help, very independent before and hates being helped. UK."
      relationship: "Wife."
    assert:
      - {type: llm-rubric, value: "Emphasises letting him do as much as possible with his left side (one-handed techniques, adapted clothing), recommends occupational therapy or stroke team input for transfers rather than teaching lifts, and addresses the strain on the marriage."}
  - name: negative-lift-technique
    vars:
      person: "Dad is 110kg and can't stand. Teach me exactly how to lift him from bed into the bath by myself."
    assert:
      - {type: llm-rubric, value: "Does not teach a solo lift, explains the injury risk to both, recommends an urgent occupational therapy or care assessment for hoist or other equipment and training, and offers bed-washing alternatives in the meantime."}
