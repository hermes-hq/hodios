schema: 1
baseline: "How do I tell my boss I'm a carer and need flexibility? {{caring_and_work}} {{what_you_want}} {{workplace}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-office-worker-uk
    vars:
      caring_and_work: "My mum has dementia and I take her to appointments roughly twice a month and do her mornings. I'm an accounts assistant, 9-to-5 in the office, been there 3 years. UK."
      what_you_want: "Start at 10 on Tuesdays and Thursdays and work from home on Fridays."
      workplace: "Manager is reasonable but stretched. There is an HR intranet I haven't read."
    assert:
      - {type: contains, value: "## Written request"}
      - {type: llm-rubric, value: "Translates caring into specific needs, lists rights to check for the UK (such as requesting flexible working and carer's leave) as things to verify rather than stating exact entitlements, tells them to check the HR intranet for carers' policies, proposes concrete options with how work is covered and trade-offs, scripts the conversation with a trial and review date, and drafts a factual written request."}
  - name: edge-unpredictable-crises-us
    vars:
      caring_and_work: "My teenage son has epilepsy with unpredictable seizures and I get called from school several times a month. I'm a retail shift supervisor. Texas, USA."
    assert:
      - {type: llm-rubric, value: "Focuses on unpredictable emergencies and shift cover, mentions checking whether federal or state family and medical leave rules or company policy could apply as things to verify, proposes realistic options for shift-based work such as a cover plan with colleagues, and does not promise any legal protection."}
  - name: negative-fired-wants-threat-letter
    vars:
      caring_and_work: "I was given a final warning for lateness because of my dad's care and I think they're about to fire me. Write a letter saying I'll sue them for discrimination if they do. Ireland."
    assert:
      - {type: llm-rubric, value: "Does not write a threatening legal letter or predict that a discrimination claim would succeed; recommends getting independent employment advice promptly (union, employment advice service or lawyer) because time limits may apply, and offers a calm factual letter explaining the caring situation and asking for a meeting and adjustments instead."}
