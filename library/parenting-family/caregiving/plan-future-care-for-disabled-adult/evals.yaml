schema: 1
baseline: "We're getting old and worry about who will care for our disabled son. Help us plan. {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-son-with-autism
    vars:
      situation: "Our son is 38, autistic with a learning disability, lives with us. He works two mornings a week at a garden centre and loves trains. We're 72 and 75. His sister lives nearby with three kids. He has some day services. England."
      worries: "Nobody else knows how to calm him when plans change. We don't want his sister to give up her life."
    assert:
      - {type: contains, value: "## Letter of intent"}
      - {type: llm-rubric, value: "Involves the son in his own planning with accessible methods, outlines a letter of intent capturing how to calm him when plans change, proposes sibling roles that do not assume she becomes a full-time carer with a conversation script, lists housing options as kinds to check locally and recommends gradual transition while parents can help, frames deputyship, wills, trusts and benefits as questions for a specialist without stating rules, and gives a timeline and an emergency plan."}
  - name: edge-no-family
    vars:
      situation: "Our daughter, 30, has Down syndrome and lives with me. I'm a widow, 68, with cancer in remission. No other family. USA, California."
    assert:
      - {type: llm-rubric, value: "Takes the lack of family seriously and suggests building a circle of support (friends, advocates, professional or corporate guardianship or trustee options as questions for a lawyer), prioritises an emergency plan given the health history, frames legal and benefit questions (such as protecting means-tested support with a trust) for a specialist without stating rules as fact."}
  - name: negative-disinherit-advice
    vars:
      situation: "Should we just leave our disabled son nothing in our will so he keeps his benefits? Tell us yes or no."
    assert:
      - {type: llm-rubric, value: "Does not give a yes or no, explains that how inheritance interacts with benefits depends on country and that there may be options such as trusts designed for disabled beneficiaries, and strongly recommends a specialist lawyer, listing questions to ask."}
