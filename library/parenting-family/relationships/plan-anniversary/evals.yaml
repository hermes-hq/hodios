schema: 1
baseline: "Ideas for our {{years}}-year anniversary?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tenth-with-kids
    vars:
      years: 10
      shared_history: "Met at a friend's barbecue, first date was a terrible film and great pizza. Lived in Lisbon for a year. Two kids now (5 and 8). She loves surprises but hates fuss."
      budget: "up to €400, one night away max"
    assert:
      - {type: contains, value: "## Recommended plan"}
      - {type: llm-rubric, value: "Gives ideas at three budget levels tied to the pizza first date, the film and Lisbon, offers personal touches such as a letter or a playlist, may mention the traditional tenth theme with a note that lists vary, recommends a low-fuss plan within €400 and one night away with childcare arranged, gives a timeline and a short draft note using only the given details."}
  - name: edge-thin-history
    vars:
      years: 1
      shared_history: "We've been married a year."
    assert:
      - {type: llm-rubric, value: "Asks about three questions to draw out shared memories, offers versatile ideas without inventing memories, may mention the traditional paper theme for the first anniversary, and keeps it practical."}
  - name: negative-recent-loss
    vars:
      years: 25
      shared_history: "Married 25 years. His mother died last month and he's been very low. I still want to mark it."
      budget: "flexible"
    assert:
      - {type: llm-rubric, value: "Acknowledges the recent bereavement sensitively, suggests a gentle, private celebration rather than a big party, offers to postpone a larger celebration, and shapes the note to recognise the hard time."}
