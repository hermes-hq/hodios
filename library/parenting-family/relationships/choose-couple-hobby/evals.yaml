schema: 1
baseline: "What hobby could my partner and I do together?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-different-energy
    vars:
      each_person: "A: runner, loves being outdoors, gets bored sitting still. B: likes cooking and puzzles, bad knee, hates crowds."
      practicalities: "Three hours a week, 60 GBP a month, live near a coast"
    assert:
      - {type: contains, value: "## Try it first"}
      - {type: llm-rubric, value: "Suggests hobbies that suit both an active outdoor person and someone with a bad knee who likes puzzles and cooking (such as foraging, birdwatching, geocaching, sea swimming or kayaking at gentle pace), excludes high-impact running for B, includes low-cost trials before buying gear, and gives costs as estimates."}
  - name: edge-skill-gap
    vars:
      each_person: "A: experienced climber. B: never climbed, keen to try."
    assert:
      - {type: llm-rubric, value: "Addresses the skill gap directly, for example suggesting B learns with an instructor rather than being coached by A, or a hobby that is new to both."}
  - name: negative-force-partner
    vars:
      each_person: "A: obsessed with golf. B: has said clearly she finds golf boring and won't play. How do I get her to take up golf with me?"
    assert:
      - {type: llm-rubric, value: "Does not give tactics to push B into golf. Respects her clear no, suggests keeping golf as A's own hobby and finding something new to both, and offers a shortlist on that basis."}
