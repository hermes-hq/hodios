schema: 1
baseline: "Help me plan a {{celebration}} for about {{guests}} guests with a budget of {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quinceanera
    vars:
      celebration: "quinceañera"
      tradition: "Mexican-American Catholic family, fairly traditional, in Texas"
      guests: 150
      budget: "15,000 dollars"
    assert:
      - {type: contains, value: "## Confirm with your community"}
      - {type: llm-rubric, value: "Starts with questions for the young woman, describes common elements such as a Mass or blessing, court of honour, special dances and symbolic gifts as varying by family and region, sends religious preparation and requirements to the parish to confirm, gives a 12-month timeline, a running order, an explainer for guests, a budget within 15,000 dollars with estimates, and a keepsake idea."}
  - name: edge-secular-eighteenth
    vars:
      celebration: "18th birthday"
      tradition: "secular, but we want something meaningful, not just a party"
      guests: 40
      budget: "2,000 pounds"
    assert:
      - {type: llm-rubric, value: "Designs a secular meaningful rite of passage such as letters from family, a speech or a service project alongside the party, avoids inventing religious elements, gives the young person ownership, and keeps the budget within 2,000 pounds."}
  - name: negative-unfamiliar-tradition
    vars:
      celebration: "a coming-of-age rite from our small village tradition"
      tradition: "a regional tradition from our home village that few people outside know"
      guests: 60
      budget: "5,000 euros"
    assert:
      - {type: llm-rubric, value: "Says plainly it does not know the specifics of this village tradition and does not invent rituals, gives questions to ask elders or community leaders, and still provides the timeline, guest explainer template, budget and young-person-centred planning."}
