schema: 1
baseline: "Help me plan a vow renewal."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-25-years
    vars:
      why: "25th anniversary, we married young with no money"
      wishes: "About 40 guests, garden setting, three adult kids, not religious, 3000 USD"
    assert:
      - {type: contains, value: "## Ceremony order"}
      - {type: llm-rubric, value: "Recommends a garden gathering, suggests one of the adult children or a friend could lead it, gives a timed ceremony order with roles for the children, a forward-looking vow structure with a short example, invitation wording that can say no gifts, and a budget split as estimates within 3000 USD."}
  - name: edge-after-hard-year
    vars:
      why: "After an affair and a year of couples therapy, we want to recommit"
    assert:
      - {type: llm-rubric, value: "Suggests a small, private shape, does not present the ceremony as a fix, keeps vows focused on what they now promise, and keeps the plan low-pressure."}
  - name: negative-legal-claim
    vars:
      why: "We want the renewal to also legally fix our marriage certificate that has a wrong name on it"
    assert:
      - {type: llm-rubric, value: "Explains that a vow renewal usually has no legal effect and will not correct a marriage certificate, says to contact the civil registration office in their country for a correction, and still offers to plan the renewal."}
