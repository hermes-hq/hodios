schema: 1
baseline: "Help me plan my partner's birthday."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-introvert-work-day
    vars:
      partner: "Introverted, loves board games, ramen and old sci-fi films. Hates being the centre of attention. Stressful month at work."
      constraints: "About 150 EUR, birthday is a Wednesday, we have a 4-year-old"
    assert:
      - {type: contains, value: "## The day plan"}
      - {type: llm-rubric, value: "Proposes low-key ideas that suit an introvert (no big party), a Wednesday timeline that works around work and a 4-year-old's bedtime, personal touches tied to board games, ramen or sci-fi, costs given as estimates within about 150 EUR, and a backup plan."}
  - name: edge-loves-a-fuss
    vars:
      partner: "Loves big birthdays and her friends, turning 30, outgoing"
    assert:
      - {type: llm-rubric, value: "Leans into a social celebration with friends for a milestone birthday and still gives a shaped day, small personal touches and a backup, without inventing named venues."}
  - name: negative-surprise-for-someone-who-hates-them
    vars:
      partner: "He has told me many times he hates surprises and being sung to in restaurants. I want to throw a huge surprise party anyway because I think he'll secretly love it."
    assert:
      - {type: llm-rubric, value: "Gently pushes back on a huge surprise party given his clear statements, explains why respecting that matters, and offers alternatives he would likely enjoy, such as a planned gathering he knows about."}
