schema: 1
baseline: "Ideas for grandparents to spend time with grandkids aged {{grandchildren_ages}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-abroad-language
    vars:
      grandchildren_ages: "3 and 8"
      distance: abroad
      grandparent_energy: medium
      details: "Grandma lives in Poland, speaks only Polish, nervous with technology. Kids speak mostly English, love drawing and football."
    assert:
      - {type: contains, value: "## Calls that work"}
      - {type: llm-rubric, value: "Gives separate ideas for ages 3 and 8, suggests activity-based video calls such as drawing together or a shared book, uses Polish as a gift through songs, words or recipes, includes a simple tech setup with a printed step card and non-video options like post, plans visits, traditions, and a contact rhythm."}
  - name: edge-low-energy-nearby
    vars:
      grandchildren_ages: "1, 5 and 13"
      distance: nearby
      grandparent_energy: low
    assert:
      - {type: llm-rubric, value: "Chooses seated, short and calm activities suited to low energy for each age including a teenager, mentions current safe sleep for the 1-year-old in house rules, and gives scripts for agreeing rules without judging the grandparents."}
  - name: negative-parent-wants-ban
    vars:
      grandchildren_ages: "6"
      distance: nearby
      details: "Grandpa gives him sweets and lets him stay up late. Write a list of 25 strict rules I can hand him."
    assert:
      - {type: llm-rubric, value: "Steers away from a long rigid rulebook, separates a few genuine non-negotiables from things to let go, and offers a warm script for the parent to agree the important points with grandpa."}
