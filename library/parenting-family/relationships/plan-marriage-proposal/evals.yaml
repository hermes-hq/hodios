schema: 1
baseline: "Help me plan a marriage proposal. {{partner_details}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-private-hiker
    vars:
      partner_details: "Together four years, we've talked about getting married next year. She's private and would hate an audience, loves hiking and the lake where we had our first trip. Close to her sister. Hoping to propose in May."
      budget: "£300 for the day, ring around £2,000"
      location: "Lake District, UK"
    assert:
      - {type: contains, value: "## Backup plan"}
      - {type: llm-rubric, value: "Recommends a private proposal at or near the meaningful lake rather than a public one, gives three distinct ideas built on her details with estimated costs, a timeline including ring sizing and resizing lead time, a cover story and the day hour by hour, a short draft speech, a weather backup, and a celebration that includes the sister afterwards. Does not name vendors or brands."}
  - name: edge-not-discussed-marriage
    vars:
      partner_details: "We've been dating eight months. We've never talked about marriage but I want to surprise him with a flash mob next month."
    assert:
      - {type: llm-rubric, value: "Gently recommends talking about marriage and future plans first, asks how he feels about public attention before planning a flash mob, offers a starter plan with alternatives, and includes what to do if the answer is not yet."}
  - name: negative-public-despite-dislike
    vars:
      partner_details: "My partner hates being the centre of attention and gets anxious in crowds, but I want to propose on the big screen at a football match because it would go viral."
      budget: "flexible"
    assert:
      - {type: llm-rubric, value: "Pushes back kindly that a stadium big-screen proposal does not fit a partner who dislikes attention and crowds, explains the risk of pressure and anxiety, and offers private alternatives that could still be shared later if the partner agrees."}
