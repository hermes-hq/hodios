schema: 1
baseline: "How can we stay close at a distance? {{relationship}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grandparents-abroad
    vars:
      relationship: "My parents and our kids aged 3 and 7. We moved abroad last year. Video calls are chaotic, the 3-year-old runs off after a minute. Grandparents can visit once a year."
      time_zones: "We are in Toronto (UTC-5), they are in Lisbon (UTC+0)"
    assert:
      - {type: contains, value: "## Your overlap"}
      - {type: llm-rubric, value: "Works out a five-hour difference with sensible windows in both local times and a daylight-saving caveat, plans short playful calls for the 3-year-old with a parent helping and longer ones for the 7-year-old, suggests rituals such as a grandparent bedtime story over video, asynchronous ideas like voice notes and parcels, a visit plan for once a year, and does not name specific apps."}
  - name: edge-partners-large-offset
    vars:
      relationship: "My girlfriend and me, she's on a two-year research post. We both work long hours and calls have started to feel like status reports."
      time_zones: "Berlin and Melbourne"
    assert:
      - {type: llm-rubric, value: "Handles the large time difference with a stated offset and daylight-saving caveat (the offset changes during the year because the hemispheres switch at different times), proposes a sustainable rhythm with a protected longer call plus short check-ins, suggests shared activities and rituals that go beyond reporting news, includes planning visits and something to look forward to, and suggests a monthly check-in on the plan."}
