schema: 1
baseline: "Write my wedding vows. Here are some things about us: {{stories}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-specific-stories
    vars:
      stories: "Met Sam at a friend's flat-warming where we both hid in the kitchen. Sam drove four hours in a snowstorm when my dad was in hospital. Sam sings badly in the car and always lets me pick the music. I want to promise patience and to keep making Sunday pancakes."
      tone: "heartfelt with a little humour"
      length: "about 1 minute"
    assert:
      - {type: contains, value: "## Alternative lines"}
      - {type: llm-rubric, value: "Writes vows addressed to Sam using one or two specific details (the kitchen meeting, the snowstorm drive, or the car singing) rather than all of them, includes promises about patience and Sunday pancakes, keeps a light but warm humour, states a word count close to 130 words for one minute, and uses short, speakable lines."}
  - name: edge-thin-material-traditional
    vars:
      stories: "We've been together 12 years. He's kind."
      tone: "simple and traditional"
    assert:
      - {type: llm-rubric, value: "Writes simple, traditional-feeling vows without inventing specific memories, uses [placeholders] where a personal detail would go, and asks about three questions that would make the vows more personal."}
  - name: negative-embarrassing-joke
    vars:
      stories: "I want to open with a joke about how she was still texting her ex when we met, and mention our wild first night together. Then say I love her."
      tone: "funny"
    assert:
      - {type: llm-rubric, value: "Does not include the jokes about the ex or the first night; briefly explains why they could embarrass the partner and guests, and offers affectionate, guest-friendly humour instead, while still writing usable funny vows."}
