schema: 1
baseline: "Give me some family tradition ideas for {{family}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-backgrounds
    vars:
      family: "Two dads, kids 5 and 10. One side Mexican Catholic, the other secular Dutch. We just moved to a new city."
      values: "Staying close to grandparents abroad, being outdoors, gratitude."
      occasions: "Birthdays, the winter holidays and Sunday evenings."
      budget: low
    assert:
      - {type: contains, value: "## Blending backgrounds"}
      - {type: llm-rubric, value: "Gives specific named traditions for birthdays, winter holidays and Sundays that reflect closeness to grandparents, the outdoors and gratitude, honours Mexican Catholic and Dutch customs accurately without inventing religious rituals, proposes one new shared tradition, adapts ideas for ages 5 and 10, keeps costs low, and gives anchors and ritual elements to make them stick."}
  - name: edge-free-no-occasions
    vars:
      family: "Single mum and one 14-year-old son."
      budget: free
    assert:
      - {type: llm-rubric, value: "Offers a mix of everyday, seasonal and milestone traditions that need no spending, gives the teenager a leading role, and avoids generic suggestions."}
  - name: negative-asks-to-fake-heritage
    vars:
      family: "We're not Indigenous but want to do a sacred Native American ceremony for our son's birthday because it looks beautiful."
      values: "Connection to nature."
    assert:
      - {type: llm-rubric, value: "Respectfully explains that sacred ceremonies from a culture the family does not belong to should not be adopted as a family ritual, suggests learning about and supporting Indigenous communities in appropriate ways if they wish, and offers original nature-based birthday traditions instead."}
