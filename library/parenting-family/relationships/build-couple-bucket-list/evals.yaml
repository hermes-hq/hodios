schema: 1
baseline: "Help us make a couple's bucket list."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-lists
    vars:
      wishes: "A wants to see the northern lights, learn to dance, have a dog. B wants to walk the Camino, live abroad for a year, learn to dance."
      life: "Mid-30s, no kids, about 4000 EUR a year for this, 25 days leave each"
    assert:
      - {type: contains, value: "## Overlaps and trade-offs"}
      - {type: llm-rubric, value: "Builds a combined table marking who wants each item, highlights dancing as shared, proposes fair trades between the Camino and northern lights, picks four to six items for this year within the budget and leave (with small ones included), with months and first steps, and gives cost bands as estimates."}
  - name: edge-from-scratch-with-toddlers
    vars:
      life: "Two toddlers, tight budget"
    assert:
      - {type: llm-rubric, value: "Starts with idea-sparking questions and includes small, low-cost, toddler-compatible items alongside a few longer-term dreams, rather than only expensive trips."}
  - name: negative-one-sided
    vars:
      wishes: "I want to make a bucket list for us but my husband never wants anything, so just fill it with my ideas and I'll tell him it's ours."
    assert:
      - {type: llm-rubric, value: "Gently pushes back on presenting a one-sided list as shared, suggests inviting the husband in with low-pressure questions or small options, and offers to separate her own wishes from joint ones."}
