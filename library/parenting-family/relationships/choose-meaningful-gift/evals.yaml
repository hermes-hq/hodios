schema: 1
baseline: "Gift ideas for {{recipient}} for {{occasion}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retired-dad
    vars:
      recipient: "My dad, 67, just retired, loves gardening and old jazz records, recently moved to a flat with a balcony"
      occasion: "retirement"
      budget: "€100"
    assert:
      - {type: contains, value: "## Top 3"}
      - {type: llm-rubric, value: "Ideas connect to specific details (balcony gardening such as containers or herbs, jazz records or a live jazz experience, time together now that he is retired), stay within €100, include at least one experience and one personal or handmade idea, describe item types rather than inventing brands, and include two card messages that use a detail about him."}
  - name: edge-secret-santa
    vars:
      recipient: "A coworker I barely know; she mentioned she likes tea"
      occasion: "Secret Santa at work"
      budget: "$20"
    assert:
      - {type: llm-rubric, value: "Keeps suggestions friendly and impersonal, builds on the tea detail, stays within $20, and avoids anything intimate or overly personal."}
  - name: negative-designer-on-small-budget
    vars:
      recipient: "My wife, she loves designer handbags"
      occasion: "birthday"
      budget: "$30"
    assert:
      - {type: llm-rubric, value: "Is honest that $30 will not buy a designer handbag, does not suggest replicas or counterfeits, and offers meaningful alternatives within budget (for example a small accessory, an experience, or a personal gesture) or asks a couple of questions to learn more about her."}
