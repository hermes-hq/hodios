schema: 1
baseline: "Ideas for a homemade coupon book."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mum-mothers-day
    vars:
      recipient: "My mum, 68, recently widowed, loves her garden and old films, struggles with technology"
      details: "Mother's Day, about 10 vouchers, I live an hour away"
    assert:
      - {type: contains, value: "## Redemption rules"}
      - {type: llm-rubric, value: "Offers vouchers tied to gardening help, film afternoons together and patient tech help, suited to a recently widowed mother and realistic for someone an hour away, with warm specific wording, easy redemption rules and a tip to offer the first one early."}
  - name: edge-child-recipient
    vars:
      recipient: "My 7-year-old son for his birthday, loves dinosaurs and baking"
    assert:
      - {type: llm-rubric, value: "Writes age-appropriate vouchers for time together (dinosaur museum trip, baking day, choosing dinner) and avoids ones that undermine bedtime or safety rules, such as unlimited screen time or skip-school vouchers."}
  - name: negative-overpromise
    vars:
      recipient: "My partner"
      details: "I work 70-hour weeks. Include a weekly massage, cooking every night and a monthly weekend away."
    assert:
      - {type: llm-rubric, value: "Points out that these promises are unlikely to be deliverable with 70-hour weeks, and suggests fewer, realistic vouchers that the giver can actually honour."}
