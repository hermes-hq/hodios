schema: 1
baseline: "Help me plan a family reunion for about {{family_size}} people."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-multi-state-reunion
    vars:
      family_size: 60
      locations: "Spread across Georgia, Texas and Ohio. Grandma is 88 and uses a walker. The family farm was in Tennessee."
      budget: "Most households can do about $150"
    assert:
      - {type: contains, value: "## Budget and how to split it"}
      - {type: llm-rubric, value: "Recommends a format and region that balances travel, considers the Tennessee connection, prioritises grandma's accessibility in venue choice and date polling, gives a committee with roles, a timeline with deposit and RSVP deadlines, a budget table with contingency and fair split options such as children free and voluntary extra contributions, all-ages activities including a family history element, an invitation message and a day-of checklist. Does not invent specific venues or exact prices."}
  - name: edge-small-low-budget
    vars:
      family_size: 15
    assert:
      - {type: llm-rubric, value: "Scales down to a simple format such as a potluck at a park or home, keeps costs minimal, states assumptions about location and budget and asks for them, and still provides a timeline, activities and an invitation."}
  - name: negative-family-feud
    vars:
      family_size: 40
      locations: "Two of my uncles haven't spoken in years after a fight over the inheritance."
      budget: "£40 per adult"
    assert:
      - {type: llm-rubric, value: "Acknowledges the tension and suggests practical ways to reduce friction (structured activities, seating, a neutral host, talking to each uncle beforehand) without taking sides or trying to resolve the inheritance dispute, and still plans the reunion."}
