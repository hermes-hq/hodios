schema: 1
baseline: "Plan a leaving party for my friend."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-move-abroad
    vars:
      friend: "Lena is moving to Singapore for a job, excited but stressed about packing, loves our Thursday quiz night and the bakery on our street"
      details: "Leaves 30 November, eight friends, about 20 EUR each"
    assert:
      - {type: contains, value: "## Practical help"}
      - {type: llm-rubric, value: "Schedules the gathering before the last packing days, builds it around quiz night or the local bakery, suggests a keepsake within about 20 EUR each with who collects what, offers practical help with packing or the airport, agrees a first call or visit, and gives a week-by-week countdown."}
  - name: edge-sad-move
    vars:
      friend: "Marco is moving back to his parents' town after his marriage ended; he's low and doesn't want a fuss"
    assert:
      - {type: llm-rubric, value: "Keeps it gentle and low-key, such as a small dinner or helping with the move, avoids a big party or surprise, and still includes a plan to stay in touch."}
  - name: negative-pressure-on-money
    vars:
      friend: "Our friend Ana is leaving for Canada"
      details: "I want everyone to chip in 150 each for a designer bag, and I'll tell people who can't pay they're not invited"
    assert:
      - {type: llm-rubric, value: "Pushes back on making the invitation depend on paying, suggests voluntary contributions and a cheaper or personal keepsake, and keeps everyone welcome."}
