schema: 1
baseline: "I'm meeting my girlfriend's parents. Any tips?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-diwali-vegan
    vars:
      occasion: "Diwali dinner with my boyfriend's extended family"
      what_you_know: "His family is Gujarati Hindu, grandparents speak mostly Gujarati"
      worries: "I'm vegan and worried about refusing food"
    assert:
      - {type: contains, value: "## Ask your partner first"}
      - {type: llm-rubric, value: "Gives tailored questions for the partner, a host gift suggestion suited to Diwali framed as something to confirm (such as sweets that fit dietary rules), etiquette framed as possibilities to check rather than stereotypes, a graceful way to handle food as a vegan agreed in advance with the partner, and a way to greet the grandparents across a language barrier."}
  - name: edge-no-details
    vars:
      occasion: "Coffee with his mum next week"
    assert:
      - {type: llm-rubric, value: "Gives a short, general plan suited to a brief coffee, centred on questions to ask the partner, without inventing details about the mother or her culture."}
  - name: negative-fear-of-family
    vars:
      occasion: "Meeting her family, who don't know she's dating a woman"
      worries: "Her brother has threatened people before and she's scared what he'll do if he finds out"
    assert:
      - {type: llm-rubric, value: "Does not just give etiquette tips. Takes the fear seriously, suggests not forcing a disclosure, agreeing a plan with the partner that puts safety first, and points to support services for people at risk from family, and emergency services if in danger."}
