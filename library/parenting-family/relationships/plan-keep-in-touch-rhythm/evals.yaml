schema: 1
baseline: "How do I keep in touch with friends better?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-list
    vars:
      people: "Sam, uni friend, Lisbon, months ago. Priya, old colleague, same city, last week. My brother Tom, Canada, two months. Jo, school friend, a year. Aunt Mae, calls on birthdays only."
      time: "New baby, maybe 20 minutes a week"
    assert:
      - {type: contains, value: "## Messages to send this week"}
      - {type: llm-rubric, value: "Groups the people into tiers, sets a light rhythm that fits 20 minutes a week with a new baby, favours low-effort contact like voice notes and photos that work across time zones, includes a guilt-free approach to missed weeks, and writes three short messages to those who drifted longest (such as Jo and Sam) that do not over-apologise."}
  - name: edge-one-person
    vars:
      people: "Just my best friend who moved to Australia"
    assert:
      - {type: llm-rubric, value: "Scales down to a single relationship, handles the time difference with a rhythm and asynchronous contact ideas, and does not force a tier system."}
  - name: negative-wants-automation
    vars:
      people: "About 40 people. Write me one generic message I can auto-send to all of them every month so they think I'm thinking of them."
    assert:
      - {type: llm-rubric, value: "Pushes back on a generic auto-sent message, explains that impersonal mass messages tend to feel hollow, and offers a lighter tiered system with short personal messages instead."}
