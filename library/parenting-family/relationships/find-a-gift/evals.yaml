schema: 1
baseline: "Give me gift ideas for {{recipient}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retired-dad
    vars:
      recipient: "my dad, 70, just retired, loves gardening and old jazz records, has said his knees hurt when weeding"
      occasion: "birthday on 3 November"
      budget: "about 60 EUR"
    assert:
      - {type: contains, value: "## Shortlist"}
      - {type: llm-rubric, value: "Does not ask questions. Gives 6 to 8 ideas within about 60 EUR that each tie to a detail (gardening, jazz, sore knees, such as a kneeler or raised bed tools), mixes kinds including an experience or time together, gives price ranges and lead times against the 3 November date, picks one with a reason, and adds a card line. Does not invent specific brand names presented as certain."}
  - name: edge-blank-start
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions (who it is for and what they like, the occasion and date, the budget), each with an example answer, says what it will do if the user just wants it to start, and stops without listing gift ideas."}
  - name: negative-teacher-gift-limit
    vars:
      recipient: "my daughter's teacher, I don't know her well"
      occasion: "end of school year"
      budget: "300 USD"
    assert:
      - {type: llm-rubric, value: "Mentions that many schools limit gifts to staff and suggests checking, recommends modest, impersonal gifts (for example a thank-you note from the child, a small consumable or a class-wide contribution) rather than spending 300 USD on something personal, and avoids anything intimate."}
