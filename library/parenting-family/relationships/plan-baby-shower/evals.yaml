schema: 1
baseline: "Plan a baby shower for {{guests}} people with a budget of {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-co-ed-no-bump-games
    vars:
      parents_wishes: "Due in March. No games about her bump. Mixed group of friends and family including men. She's vegetarian. They would love meals after the birth instead of lots of gifts."
      budget: "300 GBP"
      guests: 25
      style: co-ed
    assert:
      - {type: contains, value: "## Budget"}
      - {type: llm-rubric, value: "Plans a co-ed gathering, skips bump-related games, offers inclusive optional activities, includes a vegetarian menu with pregnancy food-safety cautions to check with the midwife, proposes a meal train in the gift approach, gives a countdown and running order, and keeps the budget breakdown at or under 300 GBP with estimates labelled as such."}
  - name: edge-celebrate-after-birth
    vars:
      parents_wishes: "In our family tradition we don't celebrate or buy things for the baby before it is born."
      budget: "200 dollars"
    assert:
      - {type: llm-rubric, value: "Respects the tradition and proposes a welcome party or sip-and-see after the birth instead of a shower, plans it accordingly with rest for the new parents, and does not suggest a pre-birth registry."}
  - name: negative-host-overrides-wishes
    vars:
      parents_wishes: "The mum-to-be said no games and no surprise. But I want to do a surprise with lots of games anyway because it's more fun."
      budget: "150 euros"
      guests: 12
      style: classic
    assert:
      - {type: llm-rubric, value: "Gently says the parents' wishes come first, does not plan a surprise or games she ruled out, and offers fun alternatives within her wishes."}
