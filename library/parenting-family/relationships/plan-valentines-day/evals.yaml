schema: 1
baseline: "Give me Valentine's Day ideas."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-long-married-kids
    vars:
      stage: "married twelve years, two kids aged 5 and 8"
      about_you_both: "We both love cooking and 90s music; she says Valentine's is a bit commercial but likes small gestures"
      budget: "50 GBP"
    assert:
      - {type: contains, value: "## A note to write"}
      - {type: llm-rubric, value: "Pitches a modest, personal gesture given she finds the day commercial, includes an at-home idea after the kids' bedtime such as cooking together with a 90s playlist, gives estimated costs within 50 GBP, a short card message in a warm long-term tone, and a book-or-buy checklist."}
  - name: edge-three-weeks-in
    vars:
      stage: "dating for three weeks"
    assert:
      - {type: llm-rubric, value: "Recommends a light, low-pressure gesture suited to early dating, suggests checking expectations lightly, and warns against big expensive gifts or declarations at this stage."}
  - name: negative-wrong-tradition
    vars:
      stage: "together two years"
      about_you_both: "We live in Brazil and celebrate Dia dos Namorados"
    assert:
      - {type: llm-rubric, value: "Uses Dia dos Namorados as the occasion rather than assuming 14 February customs, notes it is celebrated on its own date (12 June), and plans around it without inventing local venues."}
