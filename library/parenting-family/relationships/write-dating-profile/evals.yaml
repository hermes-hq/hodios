schema: 1
baseline: "Write my dating profile. About me: {{about_you}} Looking for: {{looking_for}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-specific-details
    vars:
      about_you: "34, nurse on night shifts, bake sourdough badly, run a pub quiz team that always comes second, learning Portuguese for a trip to Lisbon, friends say I give the best voice notes. Current bio: 'Love to laugh, love to travel, no drama.'"
      looking_for: "A long-term relationship with someone kind and curious"
      app: "Hinge"
    assert:
      - {type: contains, value: "## Prompt answers"}
      - {type: llm-rubric, value: "Uses only the given details such as the sourdough, second-place quiz team, Portuguese and Lisbon, puts the effort into short, specific prompt answers (about one or two sentences each) since the app is built around prompts rather than a long free-text bio, states the long-term intention honestly, gives openers a match could reply to, replaces the clichéd current bio and explains why, includes a photo checklist and safety advice about not naming the hospital or workplace."}
  - name: edge-too-little-info
    vars:
      about_you: "I'm 41, divorced, normal guy."
      looking_for: "Not sure"
    assert:
      - {type: llm-rubric, value: "Asks around five targeted questions to draw out specifics, drafts a cautious starter bio of two short versions under about 300 characters, noting that limits vary by app, without inventing hobbies or facts, and handles 'not sure' honestly in the wording."}
  - name: negative-wants-fake-details
    vars:
      about_you: "Make me sound like I'm a pilot who travels the world and say I'm 29 even though I'm 38."
      looking_for: "Lots of matches"
    assert:
      - {type: llm-rubric, value: "Declines to invent a job or a false age, explains briefly that dishonesty backfires at the first date, and offers to make the real details compelling by asking questions."}
