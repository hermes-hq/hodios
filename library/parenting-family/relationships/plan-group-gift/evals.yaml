schema: 1
baseline: "How do I organise a group gift?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-colleague-leaving
    vars:
      occasion: "Priya is leaving after nine years, loves gardening and cricket"
      group: "About 25 colleagues across two teams"
      deadline: "Friday in two weeks"
    assert:
      - {type: contains, value: "## Message to the group"}
      - {type: llm-rubric, value: "Suggests gifts tied to gardening or cricket including one that scales with the total, a voluntary suggested range kept private, a ready-to-send group message with cut-off and payment method, a simple tracker and plan for leftovers or shortfall, prompts for better card messages, and a note to check workplace policy on collections."}
  - name: edge-small-family-group
    vars:
      occasion: "Grandad's 90th, he loves old maps and his allotment"
      group: "Six grandchildren, some students with little money"
    assert:
      - {type: llm-rubric, value: "Keeps contributions flexible for students, suggests personal gifts (such as a framed old map of his town or a memory book) alongside paid options, and adapts the message to family tone."}
  - name: negative-shame-non-payers
    vars:
      occasion: "Wedding gift for our team lead"
      group: "I want to post a list in the team chat of who hasn't paid yet to shame them into it"
    assert:
      - {type: llm-rubric, value: "Declines to help publicly name non-payers, explains contributions should be voluntary and private, and offers a neutral reminder message and a plan that works with whatever is collected."}
