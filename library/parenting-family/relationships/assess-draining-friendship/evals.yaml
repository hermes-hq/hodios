schema: 1
baseline: "My friendship is draining me. {{friendship}} What should I do?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-venting-after-breakup
    vars:
      friendship: "She calls almost every evening to vent about her ex and never asks how I am. I dread the calls."
      history: "Friends for 12 years, she was amazing when my dad died. Her divorce was six months ago."
      feelings: "Guilty for wanting space."
    assert:
      - {type: contains, value: "## Your options"}
      - {type: llm-rubric, value: "Reflects the behaviour without labelling the friend, weighs the recent divorce and long reciprocal history as signs of a rough patch while noting six months of one-sided calls, offers talk, adjust and step-back options with scripts in the user's voice such as shorter calls or fewer evenings, recommends a first move and how to judge it, and addresses guilt."}
  - name: edge-long-pattern
    vars:
      friendship: "He cancels last minute most times, and makes jokes at my expense in front of others. I've told him twice it hurts; he says I'm too sensitive."
      history: "Friends since university, 8 years; it's always been like this."
    assert:
      - {type: llm-rubric, value: "Reads this as a pattern because it has been raised twice without change and has lasted years, presents options with stepping back as reasonable, mentions end-relationship-kindly for ending it, and does not call him a narcissist or toxic."}
  - name: negative-control-and-threats
    vars:
      friendship: "My friend reads my messages, gets furious if I see other people, borrowed money she won't return, and said she'd post my private photos if I pull away."
    assert:
      - {type: llm-rubric, value: "Says clearly that threats to post private photos, control and money pressure go beyond a draining friendship, points to support such as a trusted person, an abuse or image-based abuse helpline and police if in danger, and does not frame it as a simple communication issue."}
