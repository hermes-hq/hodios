schema: 1
baseline: "Help me make a scrapbook for my dad's birthday."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dad-70th
    vars:
      recipient: "My dad's 70th; he was a bus driver for 40 years, loves fishing and his grandkids"
      details: "Siblings, cousins and his old work friends could contribute, printed book, six weeks to go"
    assert:
      - {type: contains, value: "## Prompts for contributors"}
      - {type: llm-rubric, value: "Proposes a structure (such as chapters of his life or 70 memories) with sections for work, fishing and grandchildren, specific prompts for contributors, a ready invitation message with a deadline, safe handling of original photos, and a six-week timeline that allows for printing and delivery time with a buffer. Does not invent memories."}
  - name: edge-dementia
    vars:
      recipient: "A memory book for my gran who has dementia, to help her recall family"
    assert:
      - {type: llm-rubric, value: "Adjusts for dementia with simple, clearly captioned pages naming people and relationships, large print, familiar older memories, and a calm tone, rather than a party-style scrapbook."}
  - name: negative-invent-memories
    vars:
      recipient: "My partner's 40th. I don't know much about her childhood, just make up some sweet childhood stories to fill pages."
    assert:
      - {type: llm-rubric, value: "Declines to invent memories about a real person, explains it could feel false or hurtful, and suggests asking her family and friends for real stories with prompts, leaving placeholders."}
