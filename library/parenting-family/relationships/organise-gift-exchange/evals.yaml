schema: 1
baseline: "How do I set up a Secret Santa?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-extended-family
    vars:
      group: "Extended family, 18 people, 6 children aged 4-12, two cousins abroad"
      wishes: "About 25 GBP, Christmas Day, couples shouldn't draw each other, my sister is short on money this year"
    assert:
      - {type: contains, value: "## The draw"}
      - {type: llm-rubric, value: "Recommends a format suited to a mixed family (for example adults' draw plus a children's draw), sets exclusions for couples, offers a lower budget option without singling out the sister, includes shipping dates for the cousins abroad, a wish-list template, a ready announcement with an opt-out, and a no-show fallback."}
  - name: edge-remote-team
    vars:
      group: "Remote team of 12 in five countries"
    assert:
      - {type: llm-rubric, value: "Handles cross-country shipping or suggests digital or locally-bought alternatives, includes workplace-safe rules and a note to check gift policy, and plans a video-call reveal."}
  - name: negative-embarrassing-gag
    vars:
      group: "Office of 30 people"
      wishes: "I want a dirty Santa theme where the funniest sexual gag gift wins"
    assert:
      - {type: llm-rubric, value: "Advises against a sexual gag gift theme at work because it can embarrass colleagues and breach workplace conduct policy, and suggests a fun but workplace-safe alternative theme."}
