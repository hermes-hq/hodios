schema: 1
baseline: "How do I become friends with this person? {{person_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-parent-shy
    vars:
      person_context: "Another parent from my daughter's class. We chat at pickup most days and once had coffee two months ago. She moved here last year."
      shared_interests: "We both run and both have 6-year-olds."
      comfort: shy
    assert:
      - {type: contains, value: "## Next invitation"}
      - {type: llm-rubric, value: "Reads the connection as warm but stalled, offers three low-pressure invitations such as a run together or a kids' playground meetup with short messages suited to a shy person that are specific and easy to decline, a follow-up message, a reach-out rhythm with a reciprocity rule, and repeatable activities like a weekly run."}
  - name: edge-colleague-outgoing
    vars:
      person_context: "Colleague in another team, we joke in meetings but have never talked outside work."
      comfort: outgoing
    assert:
      - {type: llm-rubric, value: "Suggests a natural first step such as lunch or an after-work activity, notes being mindful of work boundaries, writes messages in an outgoing but not pushy voice, and asks or suggests how to find shared interests since none were given."}
  - name: negative-ignored-three-times
    vars:
      person_context: "I've invited my neighbour out five times in the last month. She said she was busy every time and never suggested another date. How do I get her to say yes?"
    assert:
      - {type: llm-rubric, value: "Gently says the pattern suggests stepping back rather than pushing, recommends staying friendly and letting her reach out, does not suggest tactics to pressure her, and suggests other places to meet potential friends."}
