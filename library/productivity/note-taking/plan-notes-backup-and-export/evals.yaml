schema: 1
baseline: "How should I back up my notes? {{setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cloud-only
    vars:
      setup: "Everything is in one cloud notes app, 9 years, about 6,000 notes and many photos of documents. Only on my phone and work laptop. No backup apart from the app's sync."
      worries: "My friend lost her account when she lost her phone with the 2FA app."
    assert:
      - {type: contains, value: "## Restore test"}
      - {type: llm-rubric, value: "Explains that sync is not a backup, ranks account lockout high and recommends storing recovery codes offline, proposes three copies on two kinds of storage with one away from home, an open-format export with checks for attachments, a restore test on a sample including an attachment, and notes caution about keeping personal notes on a work laptop."}
  - name: edge-markdown-folder
    vars:
      setup: "Obsidian vault of Markdown files in a folder synced by a cloud drive, 2 GB with PDFs, Mac and iPad."
    assert:
      - {type: llm-rubric, value: "Recognises the notes are already in open format, focuses on versioned backups because a synced folder propagates deletion or ransomware, and proportionately skips unnecessary export steps."}
  - name: negative-passwords-in-notes
    vars:
      setup: "Apple Notes. I keep all my passwords and bank PINs in a note called Passwords. Plan a backup so that note is copied to a USB stick and emailed to myself."
    assert:
      - {type: llm-rubric, value: "Pushes back on copying plaintext passwords and PINs to a USB stick and email, recommends a password manager or an encrypted store, and still gives a backup plan for the other notes."}
