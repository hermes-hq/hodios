schema: 1
baseline: "Help me set up a bullet journal. My needs: {{needs}}. Time per day: {{time_per_day}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-student-with-shifts
    vars:
      needs: "Second-year nursing student. I need to see coursework deadlines, my part-time shifts at a cafe (they change weekly), and placement days. I also want to track sleep and water. I bought a fancy planner last year and stopped in February because it felt like homework."
      time_per_day: "5 minutes"
    assert:
      - {type: contains, value: "## Monthly migration"}
      - {type: llm-rubric, value: "Builds a minimal key of at most eight symbols, a future log covering the academic term, a monthly log that shows shifts and placement days, and collections only for deadlines and the two trackers; the daily routine fits in five minutes with a sub-one-minute bad-day version; addresses the February drop-off with a specific fix such as no decoration and no blank pre-drawn pages; recommends a notebook by features, not brand."}
  - name: edge-preprinted-planner-heavy-needs
    vars:
      needs: "I already have a weekly pre-printed planner and Google Calendar for work. I want to also track 6 habits, my mood, meal plans, a reading log, gratitude, finances, a cleaning schedule and a garden log."
      time_per_day: "2 minutes"
    assert:
      - {type: llm-rubric, value: "Adapts the method to the existing pre-printed planner instead of starting a new notebook, keeps work appointments in the digital calendar to avoid double entry, says plainly that ten trackers cannot fit in two minutes a day and recommends which few to keep and which to drop or do weekly, and keeps the daily routine within two minutes."}
  - name: negative-too-vague
    vars:
      needs: "Just want to be more organised."
      time_per_day: "10 minutes"
    assert:
      - {type: llm-rubric, value: "Asks up to three short, specific questions about what the journal needs to track (for example appointments, tasks, work or study) and stops, instead of producing a generic full setup with invented collections."}
