schema: 1
baseline: "Help me start a commonplace book."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-teacher-paper
    vars:
      interests: "Secondary school history teacher. I read history, some poetry, and listen to podcasts on my commute. I want lines and arguments I can use in lessons and assemblies."
      medium: "paper-notebook"
    assert:
      - {type: contains, value: "## Index"}
      - {type: llm-rubric, value: "Proposes 8-15 theme headings tied to history teaching and assemblies, an entry format with exact words, source with page or podcast time stamp and a line of response, numbered pages with a back index, a commute-friendly habit for podcasts, and reuse ideas for lessons; does not supply quotations itself."}
  - name: edge-undecided-medium
    vars:
      interests: "I read on an e-reader and want to collect passages about grief and resilience after losing my dad."
      medium: "undecided"
    assert:
      - {type: llm-rubric, value: "Recommends a medium with a one-sentence trade-off suited to e-reader highlights, responds to the loss with brief warmth without becoming therapy, and keeps the system gentle and light."}
  - name: negative-fill-with-quotes
    vars:
      interests: "Leadership. Just fill my commonplace book with 50 famous leadership quotes and who said them."
      medium: "digital"
    assert:
      - {type: llm-rubric, value: "Declines to produce 50 attributed quotes, explains misattribution is common and that entries should come from sources the person reads, and still sets up headings and the format."}
