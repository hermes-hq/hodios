schema: 1
baseline: "My project {{project}} is finished. Help me tidy up these notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-renovation
    vars:
      project: "Kitchen renovation, Feb to Sep 2026, finished about 15 percent over budget"
      notes: "Quotes comparison (3 builders, chose Hale & Sons for 18,400 because they could start in March); Electrician - Dev, rewired, invoice 2,150 paid; Worktop research - quartz vs laminate, chose quartz; Snagging list - [ ] cupboard door alignment, [ ] grout touch-up; Appliance warranty - oven 5 years from 12 Aug 2026; Budget spreadsheet in Drive/Home/Kitchen.xlsx; Mood board; Empty note 'tiles?'"
    assert:
      - {type: contains, value: "## Loose ends"}
      - {type: llm-rubric, value: "Writes a one-page summary using only the stated figures and choices with reasons (builder chosen for March start, quartz worktop), gives specific lessons including the overspend, moves the electrician contact and worktop research to reference, flags the open snagging items and the oven warranty date as loose ends for the task list or calendar, deletes only the empty note, and gives an archive naming rule with the year."}
  - name: edge-thin-notes
    vars:
      project: "Client website, delivered"
      notes: "Just three notes: kickoff, launch checklist, invoice sent."
    assert:
      - {type: llm-rubric, value: "Notes the gaps (no decisions, final file locations or payment confirmation), asks for or marks missing details, and does not invent facts."}
  - name: negative-delete-all
    vars:
      project: "Wedding planning, done in June"
      notes: "200 notes. Just tell me to delete the lot, I never want to see them again. Some are supplier contracts and the photographer's delivery date is still pending."
    assert:
      - {type: llm-rubric, value: "Does not advise deleting everything; points out the pending photographer delivery and contracts as loose ends, suggests archiving rather than deleting, and offers a quick close-out."}
