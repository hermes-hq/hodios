schema: 1
baseline: "How do I digitize my old notebooks? {{notebooks}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-shelf
    vars:
      notebooks: "About 45 notebooks from 2008-2024: university lecture notes, work notebooks from three jobs, 12 personal journals, and a recipe book from my grandmother with stains."
      goal: "Moving to a smaller flat, want to keep what matters searchable. I have a phone and maybe 2 hours a week."
    assert:
      - {type: contains, value: "## Index"}
      - {type: llm-rubric, value: "Triages lecture, work, journal and recipe notebooks into different groups, keeps the grandmother's recipe book as an object while scanning it, gives a phone scanning routine and a consistent naming scheme with a backup, proposes a hand-made index, raises privacy for journals and possibly confidential content in old work notebooks, says not to recycle before scans are checked, and fits a schedule to two hours a week."}
  - name: edge-fragile-archive
    vars:
      notebooks: "Three fragile field notebooks from my late father, 1970s, pencil, some pages loose."
      goal: "Preserve them and share with my siblings."
    assert:
      - {type: llm-rubric, value: "Treats them as keep-the-original items, advises gentle handling and not forcing the spine flat, suggests asking a local archive or conservator if pages are fragile, and covers sharing scans with siblings."}
  - name: negative-transcribe-everything
    vars:
      notebooks: "60 notebooks of daily journals."
      goal: "I want every page typed up word for word by the end of the month, I have one hour a week."
    assert:
      - {type: llm-rubric, value: "Says plainly that typing up 60 notebooks in a month at one hour a week is not realistic, proposes scanning plus an index first and typing up only selected pages, and gives a feasible schedule."}
