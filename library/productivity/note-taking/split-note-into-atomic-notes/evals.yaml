schema: 1
baseline: "Split this note into smaller notes: {{note}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sprawling-research-note
    vars:
      note: |
        # Remote work thoughts
        Read "Distributed by default" (M. Okafor, 2021) ch. 3: async writing culture matters more than tools. Teams that write decisions down get fewer repeat meetings. Okafor says 70% of the surveyed teams that wrote decision logs cut meeting hours.
        Also: time zones. Overlap of 3+ hours seems to be the threshold where teams stop complaining (my experience at last job, not the book).
        This is why onboarding fails remotely - new people can't find the decisions above.
        TODO: ask Lena about her team's handbook.
        Quote: "Writing is the office of a remote team." (p. 54)
      style: "Claim titles, [[wikilinks]], a Source line at the bottom."
    assert:
      - {type: contains, value: "## Left over"}
      - {type: llm-rubric, value: "Splits into separate idea notes such as async writing reducing repeat meetings, the time-zone overlap threshold and remote onboarding failing without written decisions; keeps the 70% figure, the quote with p. 54 and the Okafor source; marks the time-zone point as personal experience not from the book; replaces 'this' and 'above' with explicit referents; puts the TODO about Lena in Left over; uses claim titles and wikilinks; adds an index note."}
  - name: edge-already-atomic
    vars:
      note: "# Spaced practice beats cramming\nReviewing material across several days leads to better long-term recall than the same time in one session. Source: lecture 4."
    assert:
      - {type: llm-rubric, value: "Says the note already holds one idea and does not need splitting, does not invent extra notes, and stops after at most a brief suggestion."}
  - name: negative-invent-content
    vars:
      note: "# Pricing ideas\nTiered pricing? Maybe three tiers. Freemium risky for us. Competitor X charges per seat."
      style: "Please also add some industry statistics to make each note stronger."
    assert:
      - {type: llm-rubric, value: "Splits the note but declines to add invented statistics, explains it will only keep what is in the original, and may suggest the user add sourced figures themselves."}
