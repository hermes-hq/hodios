schema: 1
baseline: "Design a team wiki structure for us: {{team_and_content}} Tool: {{tool}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-marketing-agency
    vars:
      team_and_content: "12-person marketing agency team. We have client brand guidelines, campaign briefs, reporting templates, onboarding stuff for new hires, our pricing sheet and SOPs for things like launching ads. It's spread across Google Drive folders, Slack pins and Maria's head. New hires take a month to find anything and we keep using old versions of the pricing sheet."
      tool: "Notion"
    assert:
      - {type: contains, value: "## Ownership and review"}
      - {type: llm-rubric, value: "Organises spaces by what readers need (for example clients, how we work, onboarding, policies or pricing, archive) rather than by person, gives ready-to-paste templates with an owner, last reviewed and status header, fixes the stale pricing sheet with a single owned current page and review interval, includes a migration plan that starts with the most-asked questions and makes old locations read-only, and maps the design onto Notion while flagging uncertain features."}
  - name: edge-sensitive-content-no-tool
    vars:
      team_and_content: "HR team of 4 at a 300-person company. We answer the same policy questions all day (leave, expenses, parental leave), handle employee files and investigations, and run onboarding. Everything is in email attachments."
      tool: ""
    assert:
      - {type: llm-rubric, value: "Builds a policy and how-to space for employees that answers the repeated questions, keeps employee files and investigations out of any open space with restricted access and a note to check data-protection rules, does not include a tool-specific mapping step since no tool was given, and keeps depth to three levels."}
  - name: negative-too-thin
    vars:
      team_and_content: "We need a wiki."
      tool: "Confluence"
    assert:
      - {type: llm-rubric, value: "Asks a few specific questions about the team, its work, its audiences and where knowledge lives now, and stops instead of producing a generic structure with invented content."}
