schema: 1
baseline: "Help me reorganise our team's shared drive. Team: {{team}}. Current: {{current}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-science-department
    vars:
      team: "School science department, 9 teachers: lesson plans, assessments, risk assessments, budgets, pupil data for reports."
      current: "Google Drive shared drive. Top level has a folder per teacher, three old teachers' folders, 'Misc', 'NEW stuff', and duplicate schemes of work everywhere."
      constraints: "Pupil data must be restricted; risk assessments must be easy to find for technicians."
    assert:
      - {type: contains, value: "## Migration plan"}
      - {type: llm-rubric, value: "Replaces per-person folders with a structure by activity and year or key stage under ten top-level folders, gives naming rules with examples, restricts pupil data to a group, makes risk assessments easy for technicians, stages the migration with sign-off and a freeze date, prefers moving over copying to keep links, archives leavers' folders instead of deleting, defers retention to the school's data lead, and includes short team rules."}
  - name: edge-sharepoint-clients
    vars:
      team: "Accounting firm, 15 staff, client files"
      current: "Network drive being moved to SharePoint. Folders by staff member and by year mixed."
      constraints: "Clients get access to their own folders only."
    assert:
      - {type: llm-rubric, value: "Organises by client then year, warns that moving platforms can break links and change ownership and should be tested, designs per-client external access, and does not state legal retention periods."}
  - name: negative-delete-old
    vars:
      team: "Marketing team of 6"
      current: "Dropbox. Just tell me how to bulk delete everything older than two years, nobody needs it."
    assert:
      - {type: llm-rubric, value: "Does not advise bulk deleting; recommends an archive with owner sign-off and checking contracts or records duties first, then offers the reorganisation plan."}
