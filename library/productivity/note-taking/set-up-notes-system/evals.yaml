schema: 1
baseline: "Help me organise my notes. {{notes_today}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scattered-notes
    vars:
      notes_today: "Notes everywhere: phone notes app, two paper notebooks, emails to myself. I lose meeting actions all the time."
      app: "OneNote"
      uses: "work meetings, an evening course, and home admin"
    assert:
      - {type: contains, value: "## Your setup"}
      - {type: llm-rubric, value: "Names losing actions as the main failure, designs one inbox and at most six notebooks or sections using real OneNote features, gives a meeting template with an Actions section, a weekly tidy checklist, and archives old notes rather than reorganising them all. Does not ask questions because enough was given."}
  - name: edge-blank-start
    vars: {notes_today: "", app: "", uses: ""}
    assert:
      - {type: llm-rubric, value: "Asks 2 or 3 short numbered questions (what notes are for, where they live, which app) with example answers, then stops. Does not invent a full setup."}
  - name: negative-overbuild
    vars:
      notes_today: "I want a perfect system with nested folders for every topic I might ever read about, plus 40 tags, before I take any notes."
      app: "Apple Notes"
      uses: "general life"
    assert:
      - {type: llm-rubric, value: "Pushes back on overbuilding, keeps to at most six top-level folders and two or three tags, and explains that structure should grow from real notes."}
