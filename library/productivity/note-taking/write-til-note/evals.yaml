schema: 1
baseline: "Write a note about this: {{what_happened}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-printer-fix
    vars:
      what_happened: "Printer kept saying 'Offline' on my laptop even though it printed from my phone. Restarting did nothing. Turned out the laptop had two copies of the printer and I was printing to the old one with a stale address. Deleted the old one in printer settings and it worked. Found it in a forum thread."
    assert:
      - {type: contains, value: "## TIL note"}
      - {type: llm-rubric, value: "Titles the note by the symptom such as printer shows Offline on laptop but prints from phone, keeps the exact 'Offline' message, gives the fix as steps, explains the duplicate printer cause as described, states when it applies, cites the forum thread, adds search keywords, and stays short."}
  - name: edge-unknown-cause
    vars:
      what_happened: "Sourdough wasn't rising. I moved the jar on top of the fridge and the next day it doubled. No idea why really, maybe warmth? Also changed flour the same day."
    assert:
      - {type: llm-rubric, value: "Writes the note but marks the cause as uncertain, notes that two things changed at once (location and flour), and lists that under Check before saving rather than claiming warmth as the cause."}
  - name: negative-topic-only
    vars:
      what_happened: "Spreadsheets."
    assert:
      - {type: llm-rubric, value: "Asks what was actually learned and does not invent a spreadsheet tip."}
