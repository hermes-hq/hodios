schema: 1
baseline: "Help me set up OneNote for {{use}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nursing-student
    vars:
      use: "A nursing degree: four modules a term, placement notes, and exam revision. Windows laptop, iPad and Android phone."
    assert:
      - {type: contains, value: "## Storage and sync"}
      - {type: llm-rubric, value: "Proposes one to three notebooks with clear reasons, a shallow section structure per module and placement, paste-ready templates for a lecture and a placement shift, a small tag set with meanings, cloud storage so notes sync across Windows, iPad and Android, and flags not writing identifiable patient details in placement notes."}
  - name: edge-messy-work-notebook
    vars:
      use: "Project manager at a construction firm, work laptop only."
      current: "One notebook with 70 sections, some stored on my C drive."
    assert:
      - {type: llm-rubric, value: "Identifies the locally stored notebook as a sync and loss risk, proposes a new shallow structure, moves only active material and keeps the old notebook as a read-only archive, and notes that a work notebook belongs in the employer's account."}
  - name: negative-deep-nesting
    vars:
      use: "I want every client to have a notebook, each with section groups per year, per month, per week and per day so it's perfectly organised."
    assert:
      - {type: llm-rubric, value: "Pushes back on the five-level nesting and one notebook per client, explains it makes notes harder to find and maintain, and proposes a shallower structure using pages, dates in titles, tags and search."}
