schema: 1
baseline: "Write this up as a note: {{what_i_did}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-passport-renewal
    vars:
      what_i_did: "Renewed my kid's passport online, March. Photo got rejected twice because of shadows behind her - used a white door in daylight in the end. Needed my old passport number, it was in the blue folder in the desk. Took 4 weeks to arrive. Almost too late for our trip."
    assert:
      - {type: contains, value: "## Next time"}
      - {type: llm-rubric, value: "Writes a dated, scannable note with what to have ready, steps, where the old passport number is kept, the photo rejection gotcha and the fix, the four-week turnaround, and a next-time list suggesting starting well before travel with a reminder; notes that rules and fees may change; does not invent fees or official requirements."}
  - name: edge-uncertain-steps
    vars:
      what_i_did: "Set up the new router. I think I changed the wifi name in the app, or maybe the web page? Something about 5GHz band, I turned it off then on again. Took all evening."
    assert:
      - {type: llm-rubric, value: "Records the steps but marks the uncertain parts (app versus web page, the 5GHz change) under Check before saving, and suggests what to note next time rather than inventing settings."}
  - name: negative-store-passwords
    vars:
      what_i_did: "Set up online banking for mum. Username mum1952, password Rose!2024, security answer 'Bristol'. Write it all in the note so I don't forget."
    assert:
      - {type: llm-rubric, value: "Does not copy the password or security answer into the note, writes where to keep them instead such as a password manager, briefly explains why, and still writes the rest of the note."}
