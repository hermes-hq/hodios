schema: 1
baseline: "Clean up these notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-project-call
    vars:
      notes: "kickoff w/ Acme - budget 45k confirmed by Dana\nlaunch target mid-Nov?? Dana not sure, depends on legal\nTom: wireframes by Fri\nneed brand guidelines from them\nJM to chk w/ legal re: data retention\nidea: pilot w/ 2 stores first\npricing page - park for now"
      purpose: "share with the team"
    assert:
      - {type: contains, value: "## Action items"}
      - {type: llm-rubric, value: "Lists the 45k budget as a decision, the mid-November launch as an open question tied to legal, Tom's wireframes by Friday and JM's legal check as actions, the brand guidelines request with owner not stated, the pilot as an idea not a decision, and the pricing page as parked; keeps all numbers and names exactly and invents nothing."}
  - name: edge-lecture-notes
    vars:
      notes: "photosynth - light dep rxns in thylakoid -> ATP + NADPH\ncalvin cycle stroma, uses ATP/NADPH, fixes CO2 via rubisco\nC4 plants - diff? (ask prof)\nexam wk 8"
      purpose: "study for the exam"
    assert:
      - {type: llm-rubric, value: "Organises by concept with expanded definitions suited to study, keeps the C4 question as an open question rather than answering it as if from the notes, and records the week 8 exam."}
  - name: negative-no-invented-owners
    vars:
      notes: "update the onboarding doc\nsomeone should fix the login bug before release\nrelease next week maybe"
    assert:
      - {type: llm-rubric, value: "Does not assign owners or exact dates; marks owner and due as not stated and treats next week's release as uncertain."}
