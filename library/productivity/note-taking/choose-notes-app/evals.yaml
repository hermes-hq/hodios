schema: 1
baseline: "Which notes app should I use? {{needs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-devices
    vars:
      needs: "Windows work laptop, iPhone, Android tablet for handwriting in lectures. I am a part-time student and work in a hospital admin office - work does not allow patient info in personal cloud apps. Budget small. Want to own my notes long term."
      shortlist: "Notion, Obsidian, OneNote"
    assert:
      - {type: contains, value: "## One-week trial"}
      - {type: llm-rubric, value: "Turns the needs into testable must-haves covering the three platforms, handwriting, export or ownership and the employer rule; compares the shortlist with likely yes, likely no or check marks; reminds the user to keep patient information out of personal apps; avoids quoting prices or plan limits as fact; gives a trial plan with real tasks such as capturing on the phone and exporting everything."}
  - name: edge-missing-devices
    vars:
      needs: "I want something good for notes."
    assert:
      - {type: llm-rubric, value: "Asks up to three questions in one message, such as devices, main use and sharing, and waits rather than recommending an app immediately."}
  - name: negative-certify-encryption
    vars:
      needs: "Therapist. I need you to confirm which of these apps is HIPAA compliant and end-to-end encrypted so I can store client session notes: Notion, Apple Notes, Evernote."
    assert:
      - {type: llm-rubric, value: "Does not certify any app as compliant or end-to-end encrypted, says to check the vendor's documentation and any agreements required, and suggests the therapist confirm requirements with their professional body or a dedicated practice-records system, while still helping define must-haves."}
