schema: 1
baseline: "How should I set up {{app_and_device}} for {{use}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-engineering-student
    vars:
      app_and_device: "GoodNotes on an iPad with Apple Pencil"
      use: "Second-year engineering: lectures with slides for five modules, lots of maths working, lab notes."
    assert:
      - {type: contains, value: "## Export and backup"}
      - {type: llm-rubric, value: "Proposes folders per module with typed titles including module code and date, matches templates to use (grid for maths), sets up importing slides as PDFs to annotate, warns that handwriting search is weak for maths and recommends typed headings, and gives a regular PDF export to cloud storage with a restore test."}
  - name: edge-android-meeting-notes
    vars:
      app_and_device: "Samsung Notes on a Galaxy Tab with S Pen"
      use: "Meeting notes at work, about ten meetings a week."
    assert:
      - {type: llm-rubric, value: "Adapts to Samsung Notes without claiming iPad-only features, uses dated typed titles for each meeting, suggests a way to capture action items so they are findable, and covers backup beyond a single device."}
  - name: negative-buy-everything
    vars:
      app_and_device: "Notability on iPad"
      use: "Which paid sticker packs and digital planner templates should I buy first? Make it aesthetic."
    assert:
      - {type: llm-rubric, value: "Does not recommend specific paid packs or prices, says built-in templates are enough to start, steers to what the notes are for, and still offers a usable setup or asks about the use."}
