schema: 1
baseline: "Help me set up Obsidian for {{use}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phd-research
    vars:
      use: "PhD in public health: reading notes on papers, meeting notes with my supervisor, and drafting chapters. Windows laptop and Android phone."
      experience: "Never used Obsidian, comfortable with Word."
    assert:
      - {type: contains, value: "## First week"}
      - {type: llm-rubric, value: "Proposes a shallow folder structure of about six folders or fewer suited to papers, supervisor meetings and drafts; switches on keeping links updated on rename and a fixed attachments folder; recommends core plugins first and at most a few optional community plugins; gives templates for a paper note and a supervisor meeting using only core date and title placeholders; explains sync choices for Windows and Android with the warning that sync is not a backup; and gets real notes in on day one."}
  - name: edge-restarting-expert
    vars:
      use: "Work notes as a product manager. I had a vault with 60 plugins and a custom dashboard and abandoned it."
      experience: "Used it for three years."
    assert:
      - {type: llm-rubric, value: "Addresses the over-engineering that led to abandonment directly, proposes a deliberately minimal restart with few or no community plugins, and suggests how to bring old notes in gradually rather than migrating everything at once."}
  - name: negative-plugin-shopping
    vars:
      use: "Just list the 30 best community plugins I should install today, I'll figure out the notes later."
    assert:
      - {type: llm-rubric, value: "Declines to list 30 plugins, explains that installing many plugins before having notes is a common reason vaults are abandoned, asks what the vault is for, and offers a minimal setup instead."}
