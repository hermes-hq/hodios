schema: 1
baseline: "Help me set up a second brain in {{app}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phd-obsidian
    vars:
      goals: "PhD student in sociology. I read a lot of papers and lose the ideas; I want reading to turn into chapters of my thesis. I also teach one seminar."
      app: obsidian
    assert:
      - {type: contains, value: "## Templates"}
      - {type: llm-rubric, value: "Recommends a Zettelkasten-leaning hybrid for thesis writing with a small PARA layer for teaching, uses Obsidian-native features (links, properties, daily notes, templates) without required community plugins, gives a literature note and a permanent note template in Markdown with properties, and a weekly review checklist."}
  - name: edge-notion-work-projects
    vars:
      goals: "Product manager. I want to run projects, keep meeting notes connected to projects, and stop losing decisions."
      app: notion
    assert:
      - {type: llm-rubric, value: "Recommends PARA-style organisation implemented as a few Notion databases (for example Projects, Notes or Meetings, possibly Areas) with relations and properties, a meeting note template with decisions and action items, and keeps it to about three databases."}
  - name: negative-vague-goal
    vars:
      goals: "be more organised"
      app: other
    assert:
      - {type: llm-rubric, value: "Asks which app they use and what they capture or want to produce, and gives at most a light app-neutral starting point instead of a fully specified system."}
