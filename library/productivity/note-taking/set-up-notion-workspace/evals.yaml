schema: 1
baseline: "Help me set up a Notion workspace for: {{use_case}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-freelancer-medium
    vars:
      use_case: "Freelance illustrator, about 15 clients a year. I need to track clients, projects, deadlines, invoices and payments, and keep project briefs and feedback in one place."
      current_tools: "A Google Sheet for invoices, briefs scattered in email, deadlines in my head"
      complexity: medium
    assert:
      - {type: contains, value: "## Relations and rollups"}
      - {type: llm-rubric, value: "Proposes three to five core databases such as Clients, Projects and Invoices with typed properties, relates Projects to Clients and Invoices, includes views answering questions like what is due this week and which invoices are unpaid, gives a new-project template, a beginner build order with a CSV import note for the existing sheet, and keeps the page tree shallow."}
  - name: edge-simple-family
    vars:
      use_case: "Shared life admin for me and my partner: bills, appointments, house maintenance, important documents list"
      complexity: simple
    assert:
      - {type: llm-rubric, value: "Keeps to one to three databases with no formulas or automations, writes 'Not needed at this level' or equivalent for relations, includes sharing advice and a warning not to store sensitive document numbers or IDs in plain pages."}
  - name: negative-too-vague
    vars:
      use_case: "everything"
    assert:
      - {type: llm-rubric, value: "Does not design a sprawling all-purpose workspace from nothing; asks up to three focused questions about what the workspace is for and who uses it before designing."}
