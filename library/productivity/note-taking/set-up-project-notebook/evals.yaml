schema: 1
baseline: "How should I organise notes for this project? {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-renovation
    vars:
      project: "Renovating an old two-bedroom house over 18 months with my partner. Collecting builder quotes, paint and tile choices, measurements, photos of progress, receipts and warranties."
      app: "Shared notes app we both use"
    assert:
      - {type: contains, value: "## Decisions log"}
      - {type: llm-rubric, value: "Proposes five to nine renovation-specific sections including quotes and contractors, measurements, products chosen and receipts and warranties; writes a home page with status and pointers to photos stored elsewhere; designs a decisions log with options and reasons and marks the example as illustrative; assigns who edits what between partners; and covers keeping warranties and receipts at close."}
  - name: edge-family-history
    vars:
      project: "Researching my family history over several years: census records, letters, interviews with older relatives, DNA match notes."
    assert:
      - {type: llm-rubric, value: "Adapts sections to people, records, sources and interviews, emphasises recording where each fact came from, and keeps living relatives' and DNA match details private by default."}
  - name: negative-just-tasks
    vars:
      project: "Something."
    assert:
      - {type: llm-rubric, value: "Asks what the project is and how long it will run instead of producing a generic structure."}
