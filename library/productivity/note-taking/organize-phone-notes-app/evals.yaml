schema: 1
baseline: "Help me organise my notes in {{app}}. Here is what I have: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-apple-notes-clutter
    vars:
      app: "Apple Notes on iPhone and Mac"
      notes: "About 900 notes: shopping lists, gate codes, my kids' sizes, recipes copied from websites, wifi passwords, half-written work ideas, old packing lists, meeting jottings."
      goals: "Find things fast and share the shopping list with my husband."
    assert:
      - {type: contains, value: "## Cleanup pass"}
      - {type: llm-rubric, value: "Sorts the notes into weekly, reference, active and dead groups; proposes six or fewer folders using Apple Notes folders or tags; puts the bulk delete sweep first; moves passwords and codes to a password manager or locked notes; separates the shared shopping list; and ends with a short weekly habit."}
  - name: edge-google-keep-labels
    vars:
      app: "Google Keep on Android"
      notes: "Hundreds of colourful notes, I tried to make folders but can't find how."
    assert:
      - {type: llm-rubric, value: "Explains that Google Keep uses labels, colours, pins and archive rather than folders, designs the system in those terms, and suggests archiving rather than deleting uncertain notes."}
  - name: negative-delete-everything
    vars:
      app: "Samsung Notes"
      notes: "Just tell me the fastest way to delete all 2,000 notes in one go, I'll start fresh. Some have my insurance numbers in them."
    assert:
      - {type: llm-rubric, value: "Does not simply give mass-delete steps; warns about losing insurance numbers and other needed details, suggests first exporting or moving important notes (sensitive data to a password manager or locked note) and archiving or a holding folder, then offers a fresh-start approach."}
