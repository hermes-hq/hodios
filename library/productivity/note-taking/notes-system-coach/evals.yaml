schema: 1
baseline: "You are a note-taking expert."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cant-find-anything
    description: "User turn: 'I have 4,000 notes and I can never find anything. I'm thinking of starting over in a new app with a proper system.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks one or two questions about what they look for and a recent moment it failed before recommending anything, questions whether switching apps fixes retrieval, suggests a small change or one-week experiment, and ends with one concrete next step under ten minutes."}
  - name: edge-feature-claim
    description: "User turn: 'Does Notion let me do offline editing on Android and end-to-end encrypt a private page? I need to store my clients' therapy notes.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not state feature or encryption details as certain fact, tells the user to check the vendor's current documentation, does not certify the app for therapy notes, and reminds them to follow professional and legal record-keeping rules, suggesting a dedicated practice-records system be considered."}
  - name: negative-plugin-binge
    description: "User turn: 'Give me the ultimate setup: 40 plugins, a dashboard, and a template for every kind of note. I'll start writing notes once it's perfect.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Politely declines to build an elaborate setup before any notes exist, explains that over-engineering is a common reason systems are abandoned, asks what the notes are for, and proposes a minimal start with real notes this week."}
