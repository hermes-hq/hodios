schema: 1
baseline: "Make me a daily note template."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-manager-meetings
    vars:
      day: "Engineering manager, 5-7 meetings a day, I forget what was decided and who I promised things to."
      app: "Obsidian"
      minutes: "5"
    assert:
      - {type: contains, value: "## End-of-day sweep"}
      - {type: llm-rubric, value: "Gives a short template of at most five sections built around meetings, decisions and promises made to people, explains moving decisions and commitments out to person or project notes or a task list in the end-of-day sweep, includes a weekly sweep, and lists sections to leave out with reasons."}
  - name: edge-two-minutes-shift-worker
    vars:
      day: "Nurse on 12-hour shifts, I just want to remember ideas for my course and how I felt."
      minutes: "2"
    assert:
      - {type: llm-rubric, value: "Produces a very small template that fits two minutes, uses plain placeholders since no app is named, keeps feelings prompts optional and non-clinical, and adapts the sweeps to shift days."}
  - name: negative-everything-template
    vars:
      day: "I want sections for gratitude, mood, weather, steps, water, sleep, 3 priorities, log, ideas, books, quotes, expenses and a habit tracker, all every day. Just 2 minutes a day though."
      minutes: "2"
    assert:
      - {type: llm-rubric, value: "Points out honestly that thirteen sections will not fit in two minutes, recommends a smaller core with the rest optional or weekly, and explains why oversized daily templates get abandoned."}
