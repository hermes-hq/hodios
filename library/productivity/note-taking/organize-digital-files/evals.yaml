schema: 1
baseline: "Help me organise my files. {{current_state}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-freelancer-chaos
    vars:
      current_state: "Freelance designer. Desktop has about 600 files, Downloads is never emptied, client work is split between Google Drive and email attachments, and I can never tell which logo file is the latest. I also keep invoices and tax documents somewhere in there."
      tools: "macOS, Google Drive"
    assert:
      - {type: contains, value: "## Naming convention"}
      - {type: llm-rubric, value: "Proposes a shallow numbered structure by area and client with Inbox and Archive, a naming pattern with ISO dates and v01-style versions, a backup as the first cleanup step, archiving tax documents rather than deleting them, and a weekly routine."}
  - name: edge-shared-team-drive
    vars:
      current_state: "Our team shared drive is a mess, 12 people use it, and folders are nested 9 levels deep."
      tools: "Microsoft SharePoint and Teams"
    assert:
      - {type: llm-rubric, value: "Warns that moving shared folders can break links and others' workflows, proposes agreeing the structure with the team and migrating in stages, and limits depth to 3-4 levels."}
  - name: negative-too-thin
    vars:
      current_state: "files are messy"
    assert:
      - {type: llm-rubric, value: "Asks what kinds of files, where they live and what is hard to find, rather than producing a full system based on invented details."}
