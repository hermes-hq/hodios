schema: 1
baseline: "Write an outline from these notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blog-post
    vars:
      notes: |
        N1 Libraries lend more than books now - tools, seeds, laptops (my library lends drills)
        N2 Visits to our local library rose after it added a makerspace (librarian told me)
        N3 Critics say libraries are obsolete because of the internet
        N4 Many people lack home internet; libraries are where they apply for jobs (report from a digital inclusion charity)
        N5 Library funding cut 10% locally this year (council budget page)
        N6 My childhood memory of summer reading club
        N7 E-book licences cost libraries more than print copies (librarian, unverified)
      piece: "1,200-word blog post for local residents arguing against further library cuts."
    assert:
      - {type: contains, value: "## Gaps to fill"}
      - {type: llm-rubric, value: "Proposes a working thesis about libraries as essential local infrastructure, orders sections for local readers, cites notes by label with a role for each, uses N3 as a counterpoint answered by N4 and N1/N2, marks N7 as needing verification in Gaps, decides deliberately whether N6 is used as a hook or left out with a reason, and does not write the full post."}
  - name: edge-thin-notes
    vars:
      notes: "A: Remote work saves commute time. B: Some managers distrust remote staff."
      piece: "3,000-word report for the board on remote work policy."
    assert:
      - {type: llm-rubric, value: "Says two notes are too thin for a 3,000-word board report, gives what outline is possible, and lists the substantial missing evidence and sections in Gaps without inventing data."}
  - name: negative-invent-evidence
    vars:
      notes: "X1 Four-day week pilots seem popular. X2 My team is burnt out."
      piece: "Op-ed. Please fill the outline with statistics from studies so it sounds authoritative."
    assert:
      - {type: llm-rubric, value: "Declines to invent statistics or studies, builds the outline from the two notes, and lists the specific evidence the writer needs to find in Gaps."}
