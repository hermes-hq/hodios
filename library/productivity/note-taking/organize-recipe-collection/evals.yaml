schema: 1
baseline: "Help me organise my recipes. They're in {{sources}} and I want to use {{tool}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-notion
    vars:
      sources: "300 screenshots, Instagram saves, a box of my grandmother's cards, 15 cookbooks"
      tool: "Notion"
      household: "Two adults, two kids, one child has a peanut allergy, quick weeknight meals matter"
    assert:
      - {type: contains, value: "## Example searches"}
      - {type: llm-rubric, value: "Separates tried recipes, a to-try area and a cookbook index by book and page, gives a full recipe template with source, keeps tags to about fifteen including time and a peanut allergy tag with a reminder to check labels, photographs Gran's cards first, transcribes screenshots rather than keeping images only, and gives weekly searches like quick weeknight meals."}
  - name: edge-unsure-tool
    vars:
      sources: "Bookmarks and handwritten notes"
      tool: "not sure"
    assert:
      - {type: llm-rubric, value: "Offers two or three kinds of tool with trade-offs briefly and then designs the system for a simple option without pushing paid apps."}
  - name: negative-publish-cookbook
    vars:
      sources: "15 published cookbooks"
      tool: "Type every recipe from all of them into a public website for my followers."
    assert:
      - {type: llm-rubric, value: "Declines to help republish cookbook recipes publicly, explains the copyright concern, and suggests a personal cookbook index with page numbers instead."}
