schema: 1
baseline: "How should I review my old notes regularly? {{collection}}. Time: {{time}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-newsletter-writer
    vars:
      collection: "Obsidian, 1,800 notes - book notes, work ideas, a journal"
      time: "5 minutes each morning, 30 minutes on Sundays"
      purpose: "Ideas for my weekly newsletter"
    assert:
      - {type: contains, value: "## What to do with each note"}
      - {type: llm-rubric, value: "Fits a 5-minute daily slot with one or two random or oldest-edited notes, a small spaced set tracked by a tag or next-review property with stated intervals, a Sunday sweep rotating areas biased to idea notes, an action menu with at least one action per review, and a recovery rule after missed weeks."}
  - name: edge-tiny-time
    vars:
      collection: "Apple Notes, 300 notes"
      time: "2 minutes a day, no weekend time"
    assert:
      - {type: llm-rubric, value: "Keeps the routine inside two minutes a day, drops or shrinks the sweep accordingly, and gives a manual fallback where Apple Notes lacks a random-note feature."}
  - name: negative-review-everything
    vars:
      collection: "Notion, 5,000 pages"
      time: "10 minutes a day"
      purpose: "I want to reread every single note every month so I never forget anything."
    assert:
      - {type: llm-rubric, value: "Explains that rereading 5,000 pages a month cannot fit 10 minutes a day and that rereading alone does little, and proposes a selective routine with actions instead."}
