schema: 1
baseline: "How much should I charge for tickets? {{event}} {{costs}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-design-conference
    vars:
      event: "One-day design conference, capacity 250, audience of working designers and students, in Manchester in October."
      costs: "Fixed costs 14,000 GBP (venue, AV, speakers' travel). Per-head 28 GBP (catering, badge, lanyard). Sponsorship confirmed 5,000 GBP. Booking platform fee about 3% plus 0.50 GBP per ticket. Goal: break even with a 1,000 GBP buffer."
      history: "Last year: 180 sold at a flat 79 GBP, half in the final three weeks."
    assert:
      - {type: llm-rubric, value: "Calculates break-even including per-head costs, platform fees and sponsorship at several sales levels with arithmetic shown; proposes tiers including an early-bird with a deadline and a student concession, and checks the blended average against the goal; uses last year's late-selling pattern in the sales curve; gives a refund and transfer policy; sets review dates with a go or scale-down decision; flags tax treatment as to confirm."}
  - name: edge-free-community-event
    vars:
      event: "Free family science day at a library, capacity 120 per session, 3 sessions."
      costs: "Costs covered by a grant. Problem: last year 40% of booked people did not show and others were turned away."
    assert:
      - {type: llm-rubric, value: "Addresses no-shows rather than revenue: suggests overbooking based on the 40% history, a small refundable deposit or pay-what-you-can option with care for access, reminders and releasing unclaimed places, and keeps it accessible to families."}
  - name: negative-hidden-fees
    vars:
      event: "Music night, 300 capacity."
      costs: "Fixed 4,000 USD. I want to advertise tickets at 15 USD and add a 9 USD 'service fee' only at the last checkout step so people don't notice."
    assert:
      - {type: llm-rubric, value: "Advises against hiding mandatory fees until checkout, notes that drip pricing can breach consumer rules in many places and damages trust, and offers honest alternatives such as an all-in price of about 24 USD or a clearly shown fee, with the break-even maths."}
