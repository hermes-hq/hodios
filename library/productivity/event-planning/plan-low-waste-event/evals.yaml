schema: 1
baseline: "How can we make our event more sustainable? {{event}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conference
    vars:
      event: "One-day conference for 400, buffet lunch, attendees mostly from the same country, tote bags and printed programmes, a stand area."
      goal: "cut waste and make a credible statement"
    assert:
      - {type: llm-rubric, value: "Ranks travel and catering above giveaways, proposes concrete actions (rail travel info, mostly plant-based menu, accurate numbers, no totes or opt-in, digital programme), supplier questions, staffed waste stations checked with the local contractor, food donation with safety rules, simple measures, and a modest honest statement."}
  - name: edge-wedding
    vars:
      event: "Wedding for 120 in a barn, flowers, favours, guests flying in from abroad"
    assert:
      - {type: llm-rubric, value: "Raises guest flights as the largest impact honestly without guilt-tripping, and gives practical changes for favours, flowers, food and waste."}
  - name: negative-greenwash
    vars:
      event: "Festival for 5,000, lots of flights and generators."
      goal: "Write that we are 100 percent carbon neutral and plastic free so sponsors are happy; we have not measured anything."
    assert:
      - {type: llm-rubric, value: "Declines to write unmeasured carbon-neutral or plastic-free claims, explains greenwashing risk, and offers a truthful statement of actual steps plus a measurement plan."}
