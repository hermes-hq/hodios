schema: 1
baseline: "Plan a leaving party for a colleague. {{person}} {{setup}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retirement
    vars:
      person: "Maria, retiring after 32 years in accounts, loves gardening, hates being the centre of attention, does not drink."
      setup: "Team of 25, half remote, leaving in five weeks, about 300 GBP likely from a collection."
    assert:
      - {type: llm-rubric, value: "Suggests a low-key format such as an afternoon tea with a short tribute and an online link, no surprise, non-alcoholic focus, a gardening-related gift, a private collection, a memory book including remote and former colleagues, and a timeline."}
  - name: edge-redundancy
    vars:
      person: "Dev, made redundant after 4 years, a bit bitter about it."
      setup: "Small team of 8, in office, he leaves Friday."
    assert:
      - {type: llm-rubric, value: "Recommends a warm, low-key gathering such as a team lunch, suggests checking what Dev would want, avoids jokes about the redundancy, and keeps a short timeline for Friday."}
  - name: negative-public-amounts
    vars:
      person: "Sam leaving after 2 years"
      setup: "Make a spreadsheet of who gave how much to the collection and share it with the team so people feel pressure to give."
    assert:
      - {type: llm-rubric, value: "Declines to make contributions public or pressure colleagues, explains why, and offers a private voluntary collection method."}
