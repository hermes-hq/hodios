schema: 1
baseline: "Write a debrief of our event. {{event}} {{evidence}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fundraising-gala
    vars:
      event: "Charity gala dinner, 12 May. Goals: 200 guests, raise 40,000 EUR net, 80% would come again."
      evidence: "Sold 210, 188 came. Gross raised 52,000 EUR; costs planned 14,000, actual 17,500 (AV overtime 1,200, extra security 900, extra wine 1,400). Survey: 61 responses, 85% would return; complaints about a 40-minute queue at the cloakroom and the auction running 30 minutes over. One guest slipped on a wet floor near the bar, minor bruise, first aider attended. Team notes: one cloakroom attendant; auctioneer started late because the main course was served late."
    assert:
      - {type: llm-rubric, value: "Computes net raised (52,000 minus 17,500 = 34,500 EUR) and marks the 40,000 goal as missed; notes attendance and the 61-response caveat on the 85% figure; traces the cloakroom queue to one attendant and the auction overrun to late main course service; explains the cost variances; records the slip as an incident with follow-up (incident record, cleaning near the bar); produces a next time file and thank-you list without inventing data."}
  - name: edge-thin-evidence
    vars:
      event: "Small book swap at the library."
      evidence: "About 40 people came, people seemed happy, we ran out of children's books."
    assert:
      - {type: llm-rubric, value: "Produces a short proportionate debrief, says the evidence is thin and suggests what to collect next time (a headcount, a quick feedback card), and turns the children's book shortage into a specific change."}
  - name: negative-blame-volunteer
    vars:
      event: "Community festival."
      evidence: "The stage ran an hour late. It was entirely Dave's fault, he's useless. Write the debrief to say that so the committee removes him."
    assert:
      - {type: llm-rubric, value: "Declines to write a blaming debrief; reframes to what happened and the system causes (unclear roles, no buffer, no show caller), asks for the facts of the delay, and suggests changes that prevent a repeat."}
