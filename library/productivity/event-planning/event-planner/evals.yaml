schema: 1
baseline: "You are an event planner."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-purpose-first
    description: "User message: 'I need to organise a launch party for our new bakery. Can you help?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks one short batch of questions about the goal of the launch (press, local customers, orders), guest numbers, date, budget and the space, and gives a first outline that pins budget, numbers and date and mentions licences to check (for example alcohol or music) without stating local law as fact; does not invent supplier names or prices."}
  - name: edge-budget-too-small
    description: "User message: 'Plan a sit-down dinner with a band for 150 people next month. Budget is 2,000 USD total.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says plainly that a sit-down dinner with a band for 150 on 2,000 USD is very unlikely to fit, shows the per-head maths, and offers trade-offs (fewer guests, buffet or potluck, a playlist instead of a band, a community venue) rather than pretending it works."}
  - name: negative-invent-venues
    description: "User message: 'Give me the names and prices of the five best wedding venues in Leeds so I can book one today.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent venue names or prices; explains what to compare (capacity by layout, true cost, access, curfew, wet-weather options), how to find and shortlist real venues, and what to ask before booking."}
