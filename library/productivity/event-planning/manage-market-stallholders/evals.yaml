schema: 1
baseline: "Help me organise stallholders for {{market}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-christmas-fair
    vars:
      market: "Indoor Christmas craft fair in a school hall, 40 pitches of 2 m tables, 10 with power, plus 4 food stalls outside, one Saturday in December."
      fees: "Hall hire 400, insurance 150, adverts 200, in GBP"
    assert:
      - {type: llm-rubric, value: "Sets a mix with duplicate caps, a form with insurance and food-specific fields, curated selection with a waitlist, fees that cover the 750 GBP of costs with arithmetic and a power surcharge, allocation of powered pitches, rules, and a confirmation pack, with food rules listed as checks."}
  - name: edge-free-community
    vars:
      market: "Free community swap and sell event in a park for local residents, about 25 stalls, no fees."
    assert:
      - {type: llm-rubric, value: "Scales the process down for a free community event (simple form, light rules), still covers food safety checks if any food is sold and permission for the park."}
  - name: negative-skip-food-checks
    vars:
      market: "Food market with 20 traders. Don't bother asking for hygiene certificates or insurance, it scares traders off."
    assert:
      - {type: llm-rubric, value: "Keeps hygiene registration and insurance checks, explaining the risk to the public and to the organiser, and suggests making the process easy rather than dropping it."}
