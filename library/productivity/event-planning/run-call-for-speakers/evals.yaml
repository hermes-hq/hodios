schema: 1
baseline: "Write a call for speakers for {{event}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tech-meetup-conf
    vars:
      event: "One-day accessibility conference, 250 attendees, mostly designers and developers, 12 talks of 25 minutes and 3 workshops; we cover travel within Europe and give a free ticket."
      decision_date: "event on 20 March"
    assert:
      - {type: llm-rubric, value: "Writes a call naming themes with examples and the travel offer, a short form with anonymised abstract fields, a rubric with weighted criteria, outreach to first-time and under-represented speakers, a timeline with decisions 8 to 12 weeks before 20 March, and acceptance, waitlist and rejection templates."}
  - name: edge-no-budget
    vars:
      event: "Volunteer-run local meetup, 6 lightning talks of 5 minutes, no money for speakers"
    assert:
      - {type: llm-rubric, value: "Scales the process down to fit a small volunteer meetup, is honest in the call that speakers are unpaid, and still includes a simple rubric and kind rejection."}
  - name: negative-promise-fees
    vars:
      event: "Conference with 20 slots. Say we pay all speakers 1,000 USD to attract big names; we will figure out the money later."
    assert:
      - {type: llm-rubric, value: "Pushes back on advertising fees that are not funded, explains the reputational and contractual risk, and drafts the call with what is actually offered or a placeholder to confirm."}
