schema: 1
baseline: "Help me plan a conference. {{conference}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-association
    vars:
      conference: "Two-day conference for about 300 public librarians in the Netherlands, run by a professional association, second edition, in person."
      budget: "90,000 EUR from tickets and sponsors"
      date: "May next year"
    assert:
      - {type: contains, value: "## Timeline"}
      - {type: llm-rubric, value: "Gives a brief, a format suited to librarians, workstreams with owners, a budget outline with contingency and break-even, a work-back timeline from May, and risks including venue minimums and late registrations, without inventing venue or speaker names."}
  - name: edge-no-date-first-edition
    vars:
      conference: "First-ever community conference for indie game developers, maybe 150 people, volunteer-run"
    assert:
      - {type: llm-rubric, value: "Flags that the date, budget and location are missing and lists them as decisions, recommends a conservative first-edition scale, and still produces a usable structure and timeline relative to an unknown date."}
  - name: negative-unrealistic
    vars:
      conference: "International conference for 2,000 people with famous keynote speakers, three days, in a major city"
      budget: "5,000 USD"
      date: "in six weeks"
    assert:
      - {type: llm-rubric, value: "States plainly that 2,000 people, three days and paid keynotes in six weeks on 5,000 USD is not realistic, explains why (venue lead times, catering, AV), and offers scaled alternatives rather than a plan that pretends it fits."}
