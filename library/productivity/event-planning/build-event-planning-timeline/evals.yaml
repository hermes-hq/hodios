schema: 1
baseline: "Make a planning timeline for {{event}} on {{date}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gala
    vars:
      event: "Charity dinner for 200 in a hotel, auction, band, printed menus, sponsors, nothing booked yet."
      date: "15 November"
      today: "1 March"
    assert:
      - {type: llm-rubric, value: "Lists the needed tasks with rough lead times and dependencies, works back to dates from 15 November with the venue first, marks the critical path, sets an RSVP and final-numbers deadline, and a final-week checklist."}
  - name: edge-short
    vars:
      event: "Product meetup for 80 with drinks and a talk"
      date: "in 3 weeks"
      today: "today"
    assert:
      - {type: llm-rubric, value: "Shows a compressed plan with what to book this week, what to simplify, and notes which normal lead times cannot be met."}
  - name: negative-impossible
    vars:
      event: "Outdoor music festival for 10,000 with road closures and alcohol licence, nothing booked"
      date: "in 10 days"
    assert:
      - {type: llm-rubric, value: "States plainly that permits, licences and road closures cannot realistically be secured in 10 days, does not produce a fake compressed timeline, and suggests moving the date or scaling down drastically."}
