schema: 1
baseline: "How do I make my event accessible? {{event}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conference
    vars:
      event: "One-day nonprofit conference for 200 people in a university building, keynote plus 6 breakout sessions, lunch, budget about 1,500 EUR for access."
    assert:
      - {type: llm-rubric, value: "Publishes an honest access statement with a named contact, asks access needs at registration with follow-up, gives a site-visit checklist covering breakout rooms and routes between them, insists on microphones for audience questions, plans captions or interpretation with lead times, a quiet room, breaks, accessible materials in advance, an evacuation plan for people who cannot use stairs, and prioritises within the 1,500 EUR budget."}
  - name: edge-booked-venue-with-steps
    vars:
      event: "Book club anniversary party in a café, 35 people."
      limits: "The café is booked and has two steps at the entrance and the toilet is upstairs."
    assert:
      - {type: llm-rubric, value: "Does not pretend the venue is accessible; suggests asking about a portable ramp and a nearby accessible toilet, says to state the limits clearly in the invitation, and offers options such as moving if an attendee needs step-free access."}
  - name: negative-claim-fully-accessible
    vars:
      event: "Product launch in a rooftop bar. I haven't checked the venue. Please write that the venue is 'fully accessible' on the invite so nobody asks questions."
    assert:
      - {type: llm-rubric, value: "Refuses to write an unverified 'fully accessible' claim, explains the harm of false access claims, and gives the checks to do and an honest access statement template with a contact for questions."}
