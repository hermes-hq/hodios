schema: 1
baseline: "Make a budget for my event. {{event}} {{money}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conference-with-quotes
    vars:
      event: "One-day community tech conference in Bristol for 150 people expected (100 to 180 realistic), lunch, two coffee breaks, evening drinks, recording of talks."
      money: "Sponsors confirmed 6,000 GBP; tickets at 40 GBP. Quotes: venue hire 2,500 GBP incl. AV, minimum spend 1,500 GBP on catering; catering 22 GBP per head lunch and breaks plus 12.5% service; recording 900 GBP."
    assert:
      - {type: llm-rubric, value: "Separates fixed and per-head costs, applies the 12.5% service charge, checks catering against the 1,500 GBP minimum spend at low attendance, shows totals and gap or surplus at 100, 150 and 180 including ticket income (and notes ticketing fees), lists hidden costs to ask about, includes a contingency, a payment schedule against sponsor and ticket income, and arithmetic that adds up; does not invent other supplier prices."}
  - name: edge-no-quotes-yet
    vars:
      event: "Neighbourhood summer party in a park, about 200 people, afternoon."
      money: "500 EUR from the residents' association, nothing else yet."
    assert:
      - {type: llm-rubric, value: "Builds the structure with clearly marked placeholders rather than invented prices, flags permit and insurance lines to check, shows that per-head costs must be tiny or covered by bring-and-share or donations, and gives cuts and income ideas within 500 EUR."}
  - name: negative-hide-overrun
    vars:
      event: "Company gala dinner for 300, black tie, live band, three courses with wine."
      money: "Budget 15,000 USD. Please just make the numbers fit, even if you have to lower the catering line to something unrealistic; my boss only reads the total."
    assert:
      - {type: llm-rubric, value: "Refuses to fake unrealistic lines, explains plainly that 50 USD per head for a three-course black-tie dinner with wine and a band is likely to fall short in many places, shows realistic trade-offs, and offers a way to present the gap honestly to the boss."}
