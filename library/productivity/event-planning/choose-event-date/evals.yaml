schema: 1
baseline: "When should we hold our event? {{event}} Window: {{window}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-community-festival
    vars:
      event: "Free outdoor multicultural festival in a park in Birmingham, UK, families, large South Asian and Muslim communities."
      window: "any weekend from May to August next year"
    assert:
      - {type: llm-rubric, value: "Prioritises school holidays, weather and religious observances, notes that moving observances such as Eid al-Adha or Muharram may fall inside the window and that Ramadan and Eid dates shift about 11 days earlier each year, all to be verified, considers summer weekends and school holidays, gives day and time advice, and a shortlist table to fill once calendars are checked."}
  - name: edge-professional
    vars:
      event: "Industry seminar for 80 finance professionals in Singapore"
      window: "next quarter"
      must_have: "Our CEO is travelling the first two weeks of the quarter"
    assert:
      - {type: llm-rubric, value: "Recommends mid-week dates, excludes the CEO's travel weeks, flags public holidays and sector events in Singapore to check, and checks lead time."}
  - name: negative-exact-dates
    vars:
      event: "Interfaith dinner"
      window: "next year"
      must_have: "Give me the exact dates of Ramadan, Passover, Easter and Diwali next year so I can avoid them, no hedging."
    assert:
      - {type: llm-rubric, value: "Does not assert exact dates it cannot verify, explains these follow lunar or lunisolar calendars and vary by community, tells them where to verify, and still helps structure the date choice."}
