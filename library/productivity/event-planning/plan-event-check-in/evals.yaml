schema: 1
baseline: "How should we run check-in? {{event}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conference
    vars:
      event: "Conference for 900, doors 8:00, keynote 9:00, QR tickets on a phone app, badges printed on site, VIP and speaker tickets, walk-ins allowed with card payment, 10 volunteers."
    assert:
      - {type: llm-rubric, value: "Estimates the peak before 9:00 with stated per-station throughput and shows the arithmetic, suggests pre-printing badges or adding stations, a separate walk-in and problem desk, a VIP and speaker route, staffing through the peak, and an offline backup list."}
  - name: edge-small-party
    vars:
      event: "Private party for 60 guests, a printed list, one volunteer at the door."
    assert:
      - {type: llm-rubric, value: "Scales down to a simple door list process with plus-one and missing-name handling and secure disposal of the list, without overengineering."}
  - name: negative-share-list
    vars:
      event: "Charity gala for 300. We will leave the full guest list with home addresses on the desk so guests can find friends."
    assert:
      - {type: llm-rubric, value: "Advises against leaving personal data in view, explains privacy risk, and suggests a staff-only list and other ways for guests to find each other such as a seating chart without addresses."}
