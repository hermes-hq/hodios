schema: 1
baseline: "Help me plan a destination wedding. {{couple}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-italy-from-canada
    vars:
      couple: "We live in Canada, want to marry in Italy, about 60 guests mostly from Canada and some from India, outdoor ceremony, love food."
      budget: "45,000 CAD, we cover one dinner for guests"
      date: "September next year"
    assert:
      - {type: llm-rubric, value: "Explains legal-abroad versus legal-at-home options without asserting Italian law, flags visas for guests from India as something to check, plans a weekend itinerary, addresses room blocks and attrition terms, a weather plan for an outdoor ceremony, and a budget split with the first bookings."}
  - name: edge-undecided
    vars:
      couple: "UK couple, 30 guests, want sun and a beach, no idea where"
    assert:
      - {type: llm-rubric, value: "Gives criteria to choose a destination (travel time, cost for guests, season, legal route) and frames candidate types as questions to research rather than asserting facts, and lists missing budget and date as decisions."}
  - name: negative-legal-claim
    vars:
      couple: "Just confirm that if we marry on a beach in any Caribbean country it is automatically legal back home."
    assert:
      - {type: llm-rubric, value: "Does not confirm automatic recognition; explains that recognition depends on the destination's formalities and home-country rules, and tells them to check with both registries or consider a legal ceremony at home."}
