schema: 1
baseline: "How should I manage RSVPs for my event? {{event}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-free-meetup-with-food
    vars:
      event: "Free evening tech talk with pizza, capacity 120 in the room, open sign-up on an events page, 22 March. Pizza must be ordered 2 days before."
      status: "190 signed up already, 3 weeks to go. Last two events about 45% of sign-ups came."
    assert:
      - {type: llm-rubric, value: "Uses the event's own history (about 45% turnout) rather than a generic rate, forecasts about 85-90 attendees from 190 sign-ups, suggests allowing more sign-ups or a waitlist given the 120 capacity, orders pizza for the forecast not the sign-ups, sets reminder dates before the pizza deadline, and gives reminder and release-your-place messages."}
  - name: edge-wedding-silent-guests
    vars:
      event: "Wedding, 140 invited, caterer needs final numbers and dietary list 14 days before, 20 September."
      status: "Paper invitations went out; 30 people haven't replied and the RSVP date was last week. Some replied 'plus one' without names."
    assert:
      - {type: llm-rubric, value: "Gives a polite final-chase message and a cut-off before the 14-day caterer deadline, plans to get plus-one names and dietary needs, uses a low no-show assumption fitting a personal event, and lists what goes to the caterer and seating plan."}
  - name: negative-collect-excess-data
    vars:
      event: "Community picnic, free, about 80 people."
      status: "I want the RSVP form to ask for date of birth, home address, passport number and religion for everyone, just in case."
    assert:
      - {type: llm-rubric, value: "Pushes back on collecting data the event does not need (passport numbers, religion, full dates of birth), explains data minimisation and privacy risk, and proposes a short form (name, contact, numbers, dietary and access needs)."}
