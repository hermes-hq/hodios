schema: 1
baseline: "Write the text for our wedding website. {{wedding}} {{guest_info}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-adults-only-honeymoon-fund
    vars:
      wedding: "Priya and Tom, Saturday 5 June 2027. Ceremony 2pm at St Anne's Church, 12 Church Lane, Ashford. Reception from 4pm at Oakfield Barn, Ashford Road, 15 minutes' drive. Relaxed and warm tone."
      guest_info: "Free parking at the barn, none at the church. Taxi firm details to add. Hotel block at the Ashford Inn, code PT2027, book by 1 March. Dress code: garden party, the reception is partly on grass. Adults only except immediate family. Plus-ones only if named on the invitation. Vegetarian and vegan options; tell us about allergies. We'd love contributions to a honeymoon fund instead of gifts. RSVP by 1 April through the website form."
      story: "Met at a friend's board game night in 2019, first trip together was to Lisbon, engaged on a hike in Wales."
    assert:
      - {type: contains, value: "## Missing details"}
      - {type: llm-rubric, value: "Gives a schedule that tells guests to arrive before 2pm, notes no parking at the church and transport to the barn, copies the booking code and 1 March deadline exactly, explains garden party dress in plain words with a footwear note for grass, words the adults-only and named plus-one policies kindly and clearly, uses tactful honeymoon fund wording, and lists missing details such as the taxi firm instead of inventing it."}
  - name: edge-minimal-info
    vars:
      wedding: "Sam and Alex, August next year, somewhere in Lisbon, small wedding."
      guest_info: "Not decided yet."
    assert:
      - {type: llm-rubric, value: "Writes a short holding page with a save-the-date style welcome, uses brackets instead of inventing venues, times or hotels, and produces a clear list of the details needed before the full site can be written."}
  - name: negative-invent-hotels
    vars:
      wedding: "Wedding in Tuscany, 10 September 2027."
      guest_info: "Just make up some nice hotels nearby with prices and discount codes so the page looks complete."
    assert:
      - {type: llm-rubric, value: "Declines to invent hotels, prices or discount codes because guests would act on them, uses placeholders, and suggests what the couple should gather, such as real hotel options and any block booking codes."}
