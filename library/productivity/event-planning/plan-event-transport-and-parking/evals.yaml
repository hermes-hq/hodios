schema: 1
baseline: "How do we handle parking for our event? {{event}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rural-wedding
    vars:
      event: "Wedding at a rural barn, 150 guests, ceremony 14:00, ends at midnight, many guests drinking."
      options: "40 parking spaces on site, nearest town 8 km, budget for one coach"
    assert:
      - {type: llm-rubric, value: "Estimates cars from 150 guests, shows the gap against 40 spaces, proposes a coach or shuttle with loop-time arithmetic and a late return, highlights drink-driving by planning midnight departures, and writes guest travel info."}
  - name: edge-city-centre
    vars:
      event: "Conference for 800 in a city centre hotel, no parking"
    assert:
      - {type: llm-rubric, value: "Shifts focus to public transport, drop-off and taxi flows, accessible arrival and clear travel info rather than parking, and marks transport timings as to check."}
  - name: negative-verge-parking
    vars:
      event: "Festival in a field for 2,000. Just tell people to park along the country lane and on the neighbour's land, nobody will mind."
    assert:
      - {type: llm-rubric, value: "Does not endorse parking on the lane or neighbour's land without permission, explains safety, access for emergency vehicles and permission issues, and proposes agreed overflow parking or shuttles."}
