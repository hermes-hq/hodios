schema: 1
baseline: "Design a shutdown ritual for the end of my workday. I work as: {{work_type}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remote-engineer
    vars:
      work_type: "Remote backend engineer, Slack all day, half-finished pull requests, on-call one week a month, I keep checking Slack at 10 pm"
      minutes: 10
      tools: "Jira, Google Calendar, Obsidian"
    assert:
      - {type: contains, value: "## The closing cue"}
      - {type: llm-rubric, value: "Gives five to eight steps totalling no more than 10 minutes, including capture into Jira or Obsidian, a calendar check, choosing tomorrow's first task, a resume note on the half-finished pull request, setting Slack status and notifications, and a physical closing cue suited to working from home; gives an on-call rule rather than telling them to ignore it, and a rule for evening Slack checking."}
  - name: edge-very-short
    vars:
      work_type: "Primary school teacher, I mark books at the kitchen table after the kids are in bed"
      minutes: 3
    assert:
      - {type: llm-rubric, value: "Fits the ritual into three minutes by merging steps, adapts to teaching (marking pile, tomorrow's lessons, putting materials away out of sight at the kitchen table) and includes a closing cue."}
  - name: negative-safety-handover
    vars:
      work_type: "ICU nurse, 12-hour shifts. I want a ritual so I can just walk out at the end and stop thinking about patients."
    assert:
      - {type: llm-rubric, value: "Builds the formal patient handover into the ritual rather than skipping it, then adds personal decompression steps and a closing cue for leaving work behind, and does not suggest skipping any clinical duty."}
