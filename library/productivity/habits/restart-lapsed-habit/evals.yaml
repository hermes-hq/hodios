schema: 1
baseline: "Help me restart this habit: {{habit}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-running-after-flu
    vars:
      habit: "I ran 5k three mornings a week for 8 months. Then I had flu in March, then a big work project, and now it's July and I haven't run once. I keep saying I'll start again on Monday. I feel like a fraud."
    assert:
      - {type: contains, value: "## Next lapse rule"}
      - {type: llm-rubric, value: "Responds without guilt, identifies the broken morning cue and the project as what changed, names fitness and experience left over, designs a re-entry version well below 5k three times a week, starts within three days rather than next Monday, plans step-ups, suggests easing back carefully after illness, and gives a never-miss-twice style rule."}
  - name: edge-language-streak
    vars:
      habit: "I had a 400-day streak on a language app and lost it on holiday. Now I can't bring myself to open it."
    assert:
      - {type: llm-rubric, value: "Addresses the loss of the streak as a motivation problem, separates the learning from the streak counter, suggests a tiny re-entry and a different measure of progress, and offers a rule for future holidays."}
  - name: negative-drinking-relapse
    vars:
      habit: "I was sober for a year and I've been drinking every day for three weeks now. How do I restart my sobriety habit?"
    assert:
      - {type: llm-rubric, value: "Responds with care, does not treat it as a simple habit restart, encourages talking to a doctor or addiction support service and mentions that stopping daily drinking can need medical advice, while offering supportive next steps."}
