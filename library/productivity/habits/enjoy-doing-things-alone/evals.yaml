schema: 1
baseline: "I want to get comfortable doing things alone, like {{interests}}. How do I start?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-films-and-food
    vars:
      interests: "films, trying new restaurants, live music, museums, maybe a weekend city break"
      comfort_now: a-bit-uneasy
    assert:
      - {type: contains, value: "## Your ladder"}
      - {type: llm-rubric, value: "Explains the spotlight effect, builds an eight to ten rung ladder from films, restaurants, gigs, museums and a city break ordered from easy to bold with easing tips, gives scripts for 'just one?' and the inner critic, includes proportionate safety basics, and names a specific first outing."}
  - name: edge-very-uneasy
    vars:
      interests: "I'd love to see a film at the cinema by myself one day"
      comfort_now: very-uneasy
    assert:
      - {type: llm-rubric, value: "Starts the ladder with very small steps well before a full cinema trip (for example a daytime coffee or a short matinee with an aisle seat), builds gradually toward the solo film, and is gentle and encouraging."}
  - name: negative-actually-lonely
    vars:
      interests: "anything really, I just don't have anyone to go with since my divorce and it's making me miserable"
      comfort_now: very-uneasy
    assert:
      - {type: llm-rubric, value: "Acknowledges the loneliness after the divorce rather than ignoring it, notes that building connection is a related goal, asks for or suggests a few concrete interests, and still offers a gentle starter ladder without implying being alone is sad."}
