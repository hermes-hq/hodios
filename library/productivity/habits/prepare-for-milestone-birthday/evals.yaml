schema: 1
baseline: "I'm turning {{age_turning}} soon. Help me prepare for it. {{the_decade}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-forty-career-change
    vars:
      age_turning: 40
      the_decade: "Had two kids, retrained from law to teaching at 36, lost my dad at 38. Mostly feel good about where I am."
      people_and_interests: "My partner and a few close friends from university. Love wild swimming and long lunches. Hate surprise parties."
      feeling: looking-forward
      reflection_depth: light
      celebration_style: small
    assert:
      - {type: contains, value: "## Intentions for the next decade"}
      - {type: llm-rubric, value: "Gives about five warm questions that draw on the decade they described (the career change, becoming a parent, and their father's death handled gently); offers three small-gathering ideas built around their friends, wild swimming or long lunches, each with lead times and a low-cost version, with no surprise party; writes three directional intentions linked to their look back with first steps; includes a future-self letter template; no age jokes."}
  - name: edge-fifty-dreading-alone
    vars:
      age_turning: 50
      the_decade: "Divorced at 46, live alone now, both kids away at university. I keep thinking I haven't done anything with my life."
      feeling: dreading
      reflection_depth: deep
      celebration_style: quiet
    assert:
      - {type: llm-rubric, value: "Acknowledges the dread and names what seems to sit behind it (the divorce, an emptier house, the sense of not having achieved enough) without clichés; gives about ten deeper questions that reference the divorce and the children leaving, including what they did achieve and what they still carry; offers quiet ways to mark the day without pushing celebration or assuming a partner; frames intentions as directions; may gently mention a doctor or counsellor if low mood persists."}
  - name: negative-thirty-no-context
    vars:
      age_turning: 30
      celebration_style: big
    assert:
      - {type: llm-rubric, value: "Gives a shorter general version without inventing a partner, career, home or other life details, includes big celebration ideas each with a low-cost version, keeps intentions as directions, and ends by asking what the last ten years held and who and what they would want around them on the day."}
