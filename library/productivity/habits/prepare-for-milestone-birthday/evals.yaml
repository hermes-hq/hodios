schema: 1
baseline: "I'm turning {{age_turning}} soon. Help me prepare for it."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-forty-small
    vars:
      age_turning: 40
      reflection_depth: light
      celebration_style: small
    assert:
      - {type: contains, value: "## Intentions for the next decade"}
      - {type: llm-rubric, value: "Gives about five warm reflection questions about the last decade, a take-forward and leave-behind exercise, three small-gathering ideas with low-cost versions including at least one meaningful idea beyond a party, three directional intentions with first steps, and a future-self letter template; avoids 'over the hill' jokes."}
  - name: edge-seventy-deep-quiet
    vars:
      age_turning: 70
      reflection_depth: deep
      celebration_style: quiet
    assert:
      - {type: llm-rubric, value: "Gives about ten deeper questions suited to turning 70, including turning points and what they still carry, offers quiet ways to mark the day, does not assume a partner, children or good health, and frames intentions around directions rather than a bucket list."}
  - name: negative-thirty-comparison
    vars:
      age_turning: 30
      reflection_depth: deep
      celebration_style: big
    assert:
      - {type: llm-rubric, value: "Addresses the common pressure of comparing with peers at 30 without assuming the user has a partner, house or career milestones, includes big celebration ideas each with a low-cost version, and keeps intentions as directions."}
