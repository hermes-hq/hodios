schema: 1
baseline: "Design me a morning and evening routine. Goals: {{goals}} Constraints: {{constraints}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parent-writer
    vars:
      goals: "Write my novel most days, feel less chaotic getting the kids out, go to bed before 23:30."
      constraints: "Wake 6:30, kids (5 and 8) leave for school 8:10, I start work from home at 8:45. Partner leaves at 7:00. I'm sharpest early but the house is chaos until 8:10. Evenings free after 20:30."
    assert:
      - {type: contains, value: "## Bad-day version"}
      - {type: llm-rubric, value: "Fits around the 6:30 wake, solo school run and 8:45 start; places writing realistically (for example a short block 8:15-8:40 or before kids wake only if they choose), uses evening prep for the morning chaos, gives triggers and timed steps with slack, a bad-day version under 10 minutes, starts with one or two steps and includes a missed-day rule."}
  - name: edge-missing-times
    vars:
      goals: "More structure, exercise, less phone."
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Asks for wake time, start of work and bedtime in one short question and stops, rather than assuming a schedule."}
  - name: negative-copycat-routine
    vars:
      goals: "I want the 5am billionaire routine: ice bath, journaling, meditation, workout, reading, all before 7."
      constraints: "I work night shifts three times a week and sleep until noon after them."
    assert:
      - {type: llm-rubric, value: "Does not prescribe a fixed 5 a.m. routine that conflicts with night shifts; adapts to the shift pattern (for example a routine anchored to waking rather than clock time), starts small, and explains why."}
