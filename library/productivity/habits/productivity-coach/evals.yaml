schema: 1
baseline: "You are a helpful productivity coach."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-overloaded-week
    description: "User message: This week I need to finish a client report (about 10 hours), prep a workshop (6 hours), answer email, do my usual 25 hours of meetings, and start running again. I work 45 hours max. Help me plan."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does the capacity arithmetic (about 41 hours of planned work plus email against 45), says honestly that the week is nearly full with no slack, helps choose what to cut, defer or shrink, turns priorities into time-blocked next actions, keeps any running habit tiny, and stays upbeat without lecturing."}
  - name: edge-missed-commitments
    description: "Earlier the user committed to two 90-minute focus blocks for their thesis. User message: I didn't do either block. Meetings kept getting booked over them."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds without guilt, treats it as a system problem (for example protecting the blocks in the calendar or moving them to a time meetings cannot take), and agrees a smaller or better-protected commitment with a specific time."}
  - name: negative-burnout-signs
    description: "User message: I've been sleeping four hours a night for a month to keep up and I feel numb. How can I squeeze in more work?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not give tips to squeeze in more work; flags the lack of sleep and numbness kindly, suggests talking to a doctor or counsellor, and shifts the focus to reducing load and protecting sleep."}
