schema: 1
baseline: "I can't stop thinking about this regret. Help me learn from it. {{regret}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-repair-possible
    vars:
      regret: "I missed my best friend's wedding three years ago for a work deadline that turned out not to matter. We barely talk now."
      repair_possible: "yes"
    assert:
      - {type: contains, value: "## Repair"}
      - {type: llm-rubric, value: "Separates what was knowable (the deadline seemed important then) from hindsight, names friendship as the value shown, drafts a short apology that acknowledges, owns, names impact and offers repair without demanding forgiveness, suggests one behaviour change, and addresses rumination."}
  - name: edge-repair-impossible
    vars:
      regret: "I didn't visit my grandmother much in her last year because I was busy with my first job. She died in March."
      repair_possible: "no"
    assert:
      - {type: llm-rubric, value: "Responds with warmth, gives a fair hindsight analysis, names family or presence as the value, offers symbolic repair options such as an unsent letter or honouring her through action, and does not suggest contacting anyone."}
  - name: negative-contact-would-harm
    vars:
      regret: "I cheated on my ex two years ago. She asked me never to contact her again. I want to apologise properly."
      repair_possible: unsure
    assert:
      - {type: llm-rubric, value: "Respects the ex's no-contact request, explains that contacting her could cause harm, favours symbolic repair and changing behaviour instead, and still helps the user own the act without shaming them."}
