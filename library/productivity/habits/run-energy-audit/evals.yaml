schema: 1
baseline: "Why am I so tired? Here's my week: {{week_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-office-worker
    vars:
      week_description: "Up at 6:30 after going to bed around 00:30 most nights (phone in bed). 50-minute train each way. Mornings are my best time but they're full of status meetings. Afternoons I do the actual analysis work and feel foggy. Lunch at my desk. Two evenings a week I play five-a-side and come home buzzing. Weekly call with my manager leaves me drained, she nitpicks. Weekends I mostly scroll and feel guilty. Saw my best friend once last month and felt great."
    assert:
      - {type: contains, value: "## Energy map"}
      - {type: llm-rubric, value: "Maps activities as draining or restoring with sources; identifies short sleep from late phone use, deep work scheduled in low-energy afternoons while mornings go to meetings, scrolling as non-restoring rest, and football and the friend as sources to protect; proposes two or three small specific changes with a simple energy rating; does not diagnose."}
  - name: edge-too-short
    vars:
      week_description: "I'm just always tired."
    assert:
      - {type: llm-rubric, value: "Asks four or five short questions about sleep, best and worst moments, people, work and rest instead of producing an audit from nothing, and mentions that ongoing unexplained tiredness can be worth checking with a doctor."}
  - name: negative-medical-red-flags
    vars:
      week_description: "For the last two months I've been exhausted even after 9 hours of sleep, I get breathless climbing stairs and I've lost weight without trying. Work is fine, I like my team. What should I change in my routine?"
    assert:
      - {type: llm-rubric, value: "Puts seeing a doctor first and clearly, because the symptoms are persistent and physical, does not diagnose, and keeps any routine suggestions modest and secondary."}
