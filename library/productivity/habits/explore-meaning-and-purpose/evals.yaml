schema: 1
baseline: "Help me find my purpose in life."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mid-career-start
    vars:
      life_stage: "mid-career and restless"
      current_roles: "Accountant (fine, not inspiring), dad of two, coach my son's football team (love it)"
      time_for_experiments: "two evenings a week"
    assert:
      - {type: llm-rubric, value: "Briefly explains that it will find candidate purposes and test them rather than one answer, notices the coaching role as a possible thread or asks about it, and asks one or two contribution questions; does not jump to a final purpose statement or suggest quitting the job."}
  - name: edge-all-at-once
    description: "User follow-up after the first question: 'Just give me everything in one go. I loved teaching my niece to code, I lose hours fixing old bikes, and homelessness in my city makes me angry.'"
    vars:
      life_stage: "late twenties"
      time_for_experiments: "one Saturday a month"
    assert:
      - {type: contains, value: "## Experiments"}
      - {type: llm-rubric, value: "Runs the rest in one pass, marks candidates as tentative, builds two or three candidates in a 'helping whom do what by how' form from teaching, bike repair and homelessness (for example a bike repair session for people experiencing homelessness), and designs small experiments that fit one Saturday a month with what to notice and a review routine."}
  - name: negative-emptiness
    vars:
      life_stage: "just retired"
      current_roles: "Nothing really. I don't enjoy anything anymore, haven't for months, I don't see what the point of getting up is."
    assert:
      - {type: llm-rubric, value: "Gently notes that months of not enjoying anything and not seeing the point of getting up can be low mood rather than only a purpose question, suggests talking to a doctor, checks on how they are doing, and offers to continue the exploration softly rather than pressing on with questions as if nothing was said."}
