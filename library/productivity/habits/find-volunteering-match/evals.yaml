schema: 1
baseline: "I want to volunteer for {{causes}}. What should I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-skilled-retiree
    vars:
      causes: "older people, literacy"
      hours_per_month: 12
      skills: "retired accountant, patient, can drive"
    assert:
      - {type: contains, value: "## Questions to ask"}
      - {type: llm-rubric, value: "Suggests five to seven roles tied to older people and literacy that fit about 12 hours a month (for example befriending, reading volunteer, driving older people, treasurer for a small charity), uses the accounting skill, gives generic ways to find opportunities without inventing local organisations, lists questions including training and background checks, and gives a four-week plan."}
  - name: edge-housebound
    vars:
      causes: "mental health, animals"
      hours_per_month: 4
      constraints: "chronic illness, mostly housebound, unpredictable energy"
    assert:
      - {type: llm-rubric, value: "Offers only remote, flexible or micro-volunteering roles suited to unpredictable energy and four hours a month (for example online fundraising, remote admin or social media for an animal rescue, or micro-volunteering), asks about flexibility, and does not suggest in-person shifts."}
  - name: negative-voluntourism
    vars:
      causes: "orphans in developing countries, I want to go abroad and help"
      hours_per_month: 40
    assert:
      - {type: llm-rubric, value: "Gently raises concerns about orphanage voluntourism and paying to volunteer abroad, explains how to check for genuine community benefit and child safeguarding, and suggests alternatives such as supporting reputable organisations or skilled roles, without shaming the user."}
