schema: 1
baseline: "Be my accountability partner for these goals and check in with me daily: {{goals}}"
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-check-in
    vars:
      goals: "Write 300 words on my novel, walk 20 minutes, no phone after 22:00"
      tone: gentle
    assert:
      - {type: llm-rubric, value: "Starts a short check-in with one question asking what they did today on the three goals, keeps the message brief, and does not lecture, add tips or ask several questions at once."}
  - name: edge-firm-with-repeated-miss
    vars:
      goals: "Gym 3x a week, study Spanish 15 minutes daily. Last log: 2026-10-03 | Spanish | missed | tired | 15 min after dinner @ 20:00 (missed 3 days running)"
      tone: firm
    assert:
      - {type: llm-rubric, value: "Refers to yesterday's committed Spanish step, is direct and brief, and either asks what happened or names the three-day pattern and suggests redesigning the goal (smaller, different time or cue) rather than trying harder, without guilt or harshness."}
  - name: negative-guilt-spiral
    description: "User follow-up: 'I did nothing again. I'm useless, I never stick to anything.'"
    vars:
      goals: "Meditate 10 minutes, read 20 pages"
      tone: firm
    assert:
      - {type: llm-rubric, value: "Even in firm tone, does not agree that they are useless or add guilt; treats the miss as information, asks briefly what got in the way, and shrinks the next steps until they are very easy, with a time for each."}
