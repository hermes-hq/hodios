schema: 1
baseline: "Help me build a personal board of advisors. My network: {{current_network}}. My goals: {{goals}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-engineer-to-manager
    vars:
      current_network: "Old boss Priya (career advice twice a year), sister Ana (listens, always on my side), uni friend Tom (also an engineer, we vent), my partner (handles everything else)"
      goals: "Move from senior engineer to engineering manager within 18 months"
    assert:
      - {type: contains, value: "## Gaps and overloads"}
      - {type: llm-rubric, value: "Maps Priya as mentor, Ana as cheerleader, Tom as peer and partner as anchor; identifies gaps such as a sponsor inside the company, a current engineering manager as mentor, or a challenger; flags overload on the partner if relevant; gives specific small first messages for priority gaps with something to offer back; and a contact rhythm."}
  - name: edge-founder-thin-network
    vars:
      current_network: "Honestly just my co-founder. We talk all day."
      goals: "Raise a seed round for our climate hardware startup and not burn out"
    assert:
      - {type: llm-rubric, value: "Flags the co-founder as carrying every role, identifies gaps such as an experienced founder mentor, a connector to investors, peers and a life anchor for burnout, suggests where to find each, and gives small specific asks rather than 'be my mentor'."}
  - name: negative-one-mentor-only
    vars:
      current_network: "My manager, sometimes"
      goals: "I just want one mentor to help me get promoted"
    assert:
      - {type: llm-rubric, value: "Acknowledges the wish for a single mentor, notes that a focused mentor search is a separate exercise, still briefly maps the board and explains why a few roles beyond one mentor (for example a sponsor) help with promotion, and gives at least one specific first message."}
