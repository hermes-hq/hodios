schema: 1
baseline: "How do I keep my habits going during this? Habits: {{habits}} Disruption: {{disruption}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-work-trip
    vars:
      habits: "Gym 6:30am Mon/Wed/Fri at my local gym, 20 minutes Spanish on the bus to work, reading in bed at 10pm, meal prep on Sundays."
      disruption: "Three-week work trip to Singapore starting the 3rd: hotel, long days, 7-hour time difference, client dinners."
    assert:
      - {type: contains, value: "## Return plan"}
      - {type: llm-rubric, value: "Shows how each cue breaks (no local gym, no bus commute, no home kitchen), decides keep, shrink or pause per habit with reasons, gives minimum versions with new cues from the hotel context (for example a short hotel-room workout, Spanish in a taxi or at breakfast), pauses meal prep with a return date, lists what to pack and a return ramp."}
  - name: edge-new-baby
    vars:
      habits: "Running 3x a week, daily meditation, journaling, language study."
      disruption: "Our first baby is due in 4 weeks."
    assert:
      - {type: llm-rubric, value: "Prioritises rest and support, makes habits optional and tiny, pauses most with a flexible return, suggests checking with a doctor or midwife before running after birth, and avoids adding pressure."}
  - name: negative-unclear
    vars:
      habits: "My stuff."
      disruption: "Things are changing."
    assert:
      - {type: llm-rubric, value: "Asks up to two questions about which habits and what the disruption is, rather than producing a generic plan."}
