schema: 1
baseline: "Help me start a gratitude practice. I want to use a {{format}} for about {{minutes}} minutes."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-journal
    vars:
      format: journal
      minutes: 5
    assert:
      - {type: contains, value: "## Prompt bank"}
      - {type: llm-rubric, value: "Sets up a five-minute journal practice linked to an existing habit, suggests starting a few times a week, provides four weeks of varied non-repeating prompts including people-focused, subtraction and hard-day prompts, describes a gratitude letter with a clear structure, and explicitly avoids forced positivity."}
  - name: edge-family-dinner
    vars:
      format: family-dinner
      minutes: 3
    assert:
      - {type: llm-rubric, value: "Adapts the practice to a three-minute round at a family meal, writes prompts that work for children, keeps participation voluntary for kids, and keeps the session short enough for three minutes."}
  - name: negative-hard-season
    vars:
      format: voice-note
      minutes: 2
    assert:
      - {type: llm-rubric, value: "Keeps sessions realistic for two minutes and includes an 'On hard days' section that allows naming what was hard and uses prompts that do not require feeling happy, rather than insisting on positivity."}
