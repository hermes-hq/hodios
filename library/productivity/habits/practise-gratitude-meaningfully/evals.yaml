schema: 1
baseline: "Help me start a gratitude practice. I want to use a {{format}} for about {{minutes}} minutes."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-journal-after-failed-list
    vars:
      format: journal
      minutes: 5
      life_right_now: "Just started a new job in a new city, busy but fine"
      past_attempts: "Wrote three things I was grateful for every night. After a week it was always 'coffee, my bed, my cat' and felt fake."
    assert:
      - {type: contains, value: "## Prompt bank"}
      - {type: llm-rubric, value: "Names repetition and the nightly list as why the last attempt stalled and changes the design (fewer sessions a week, one specific item with a reason, rotating prompt types); ties the habit to an existing cue; gives four weeks of non-repeating prompts that include person, subtraction and hard-day prompts and some about the new job or city (for example people who helped them settle in); describes a gratitude letter with four parts; sessions fit five minutes."}
  - name: edge-family-dinner-young-kids
    vars:
      format: family-dinner
      minutes: 3
      life_right_now: "Two kids, 4 and 9. Dinners are loud."
    assert:
      - {type: llm-rubric, value: "Designs a three-minute round at dinner with prompts a 4-year-old and a 9-year-old can both answer (simple and concrete for the younger child), keeps it voluntary for the children with adults going first, adapts the gratitude letter to something like a family thank-you card or drawing, and keeps every session short enough for three minutes."}
  - name: negative-recent-grief
    vars:
      format: voice-note
      minutes: 2
      life_right_now: "My dad died six weeks ago. My sister said gratitude journaling helped her. Honestly the idea of being grateful right now feels insulting."
    assert:
      - {type: llm-rubric, value: "Acknowledges the loss and that the reluctance is understandable; does not push positivity or suggest gratitude in place of grief; leads with a hard-day mode, lowers the frequency, and frames prompts around support and getting through (for example someone who helped this week, or a memory of their dad they want to keep) rather than blessings; says plainly they can pause or skip the practice; keeps sessions to two minutes; may mention grief support if things feel unmanageable."}
