schema: 1
baseline: "Help me figure out my personal values. Some examples from my life: {{life_examples}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stories-first
    vars:
      life_examples: "Proudest: organising a fundraiser for a neighbour's medical bills. Angriest: when my manager took credit for my analysis. Hard decision: turned down a higher-paid job because it meant moving away from my parents. Admire: my grandmother, who learned to paint at 70."
    assert:
      - {type: llm-rubric, value: "Starts by naming values suggested by each story (for example community or generosity, fairness or recognition, family, learning or curiosity), explains which are honoured and which stepped on, offers them as questions to confirm, and moves to the card sort or asks for confirmation before concluding; does not jump straight to a final statement."}
  - name: edge-all-at-once
    vars:
      life_examples: "Just do it all in one go please. I love solo travel, I quit a stable job to freelance, I get furious at bureaucracy, I volunteer at an animal shelter on weekends, I hate being late."
      known_values: "Honesty, ambition"
    assert:
      - {type: contains, value: "## Values statement"}
      - {type: llm-rubric, value: "Runs the whole exercise in one pass, marks the sort as its inference, tests the user's named values (for example whether ambition shows up in the stories or is a should), settles on three to five core values with definitions, everyday behaviours and drift warnings, names a tension such as freedom versus security, and writes a short first-person statement."}
  - name: negative-no-imposed-values
    vars:
      life_examples: "Honestly my happiest moments are when I earn a big bonus or get publicly recognised at work."
    assert:
      - {type: llm-rubric, value: "Treats achievement, recognition or wealth as valid values without moralising, asks questions to explore them further, and does not push values like kindness or balance that the user did not express."}
