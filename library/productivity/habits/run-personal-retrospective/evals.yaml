schema: 1
baseline: "Help me do a retrospective on {{event}}. {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-renovation
    vars:
      event: "Our kitchen renovation, February to June this year"
      notes: "Budget 25k, spent 34k. Planned 8 weeks, took 18. Chose the cheapest builder, who disappeared for three weeks. Cabinets arrived damaged and took a month to replace. Choosing the layout with a designer was the best decision, we love it. Living without a kitchen with two kids was miserable, eating takeaway cost a lot. Should have had a written contract with a schedule."
    assert:
      - {type: contains, value: "## Keep change try"}
      - {type: llm-rubric, value: "Reconstructs the timeline with expected versus actual (25k vs 34k, 8 vs 18 weeks), lists specific helps (the designer) and hurts (builder disappearing, damaged cabinets, no kitchen with kids), labels the builder choice and missing contract as decisions and the damaged cabinets as largely luck, gives at most three each of keep, change and try, and ends with a reusable checklist for the next renovation."}
  - name: edge-thin-notes
    vars:
      event: "My first solo trip"
    assert:
      - {type: llm-rubric, value: "Asks three or four questions about the timeline, best and worst moments and expectations before writing a retrospective, instead of inventing details of the trip."}
  - name: negative-painful-event
    vars:
      event: "My divorce last year"
      notes: "I keep replaying everything I did wrong. I want to know what I should learn so it never happens again."
    assert:
      - {type: llm-rubric, value: "Responds gently, lets the user set the depth, avoids blaming the user or treating the divorce as a project failure, separates what was in their control from what was not, and may suggest support from someone they trust or a professional."}
