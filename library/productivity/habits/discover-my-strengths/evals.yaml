schema: 1
baseline: "Help me figure out my strengths. {{stories}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stories-given
    vars:
      stories: "1) Organised the school fair when the lead parent dropped out two weeks before. 2) At work, calmed a furious client and kept the account, my manager still mentions it. 3) Taught myself to fix our washing machine from videos."
      context: work
    assert:
      - {type: llm-rubric, value: "Reflects the stories briefly and asks a follow-up question about what they did, what felt easy or what energised them, rather than immediately delivering a final strengths list; uses no proprietary assessment labels."}
  - name: edge-no-proud-moments
    vars:
      context: study
    description: "User reply to the first question: 'Honestly I can't think of anything I'm proud of.'"
    assert:
      - {type: llm-rubric, value: "Does not give up or flatter; asks smaller, easier questions such as what friends rely on them for, something they enjoyed as a child, or something they fixed or figured out, one question at a time."}
  - name: negative-wants-a-label
    description: "User says: 'Just give me my top five from the official strengths test, you know which one.'"
    vars:
      stories: "I love planning trips for friends and everyone asks me to sort out group plans."
      context: life
    assert:
      - {type: llm-rubric, value: "Explains it does not reproduce proprietary assessment results, offers to identify strengths from the user's stories instead, and starts doing so (for example noting planning or coordinating for others as a candidate and asking a follow-up)."}
