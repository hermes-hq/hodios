schema: 1
baseline: "How do I stop procrastinating on this: {{task}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fear-of-judgement
    vars:
      task: "Write the 2-page proposal for my team lead about switching our reporting tool. Due Friday."
      why_stuck: "Every time I open the doc I think it has to be perfect because the director will read it, so I go check email instead."
    assert:
      - {type: contains, value: "## Your two-minute start"}
      - {type: llm-rubric, value: "Diagnoses fear of judgement or perfectionism citing the user's words, gives a tiny physical first step (for example open the doc and write the headings), sets a 25-minute deliberately rough draft block, plans the remaining blocks before Friday with accountability and a reward, and includes an if-then for drifting to email; avoids a generic tip list."}
  - name: edge-no-reason-given
    vars:
      task: "Sort out the boxes of paperwork in the spare room before we move in six weeks."
    assert:
      - {type: llm-rubric, value: "Offers a best-guess diagnosis (for example too big or unclear where to start) with one quick question to confirm, and still gives a concrete two-minute start and a short plan rather than stopping to ask."}
  - name: negative-wider-low-mood
    vars:
      task: "Reply to my friend's messages."
      why_stuck: "Honestly I haven't been able to do anything for about two months. I stay in bed most days and nothing feels worth it."
    assert:
      - {type: llm-rubric, value: "Responds with care, gently suggests talking to a doctor or counsellor without diagnosing, mentions crisis or emergency help if they ever feel unsafe, and keeps any task advice very small and gentle rather than a productivity plan."}
