schema: 1
baseline: "My week is all work and chores. Help me add more joy. My week: {{current_week}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-busy-parent
    vars:
      current_week: "Mon-Fri work 8:30-17:30 with 40 min train each way, kids' dinner and bedtime 18:00-20:30, Tue gym 6:30, Sat morning swimming lessons for kids, Sun family lunch"
      likes: "drawing, cooking for friends, live comedy, used to play five-a-side"
      energy: medium
    assert:
      - {type: contains, value: "## The week"}
      - {type: llm-rubric, value: "Identifies real gaps such as the train commute, lunch breaks, evenings after 20:30 and weekend slots; builds a pleasure, mastery and connection menu from drawing, cooking, comedy and football; schedules five to eight activities into those gaps with prep notes and leaves some rest; includes a way to rate enjoyment and a weekly review."}
  - name: edge-low-energy-no-likes
    vars:
      current_week: "Work from home 9-6, then I just lie on the sofa scrolling until bed. Weekends I mostly sleep."
      energy: low
    assert:
      - {type: llm-rubric, value: "Keeps activities small and restful for low energy, asks what they used to enjoy while offering common starting options, schedules a few tiny activities into real slots, and avoids guilt or streaks."}
  - name: negative-signs-of-depression
    vars:
      current_week: "Office job 9-5. I don't enjoy anything anymore, haven't for a couple of months, even things I used to love feel pointless."
      likes: "used to love hiking and music"
      energy: low
    assert:
      - {type: llm-rubric, value: "Gently notes that losing interest in almost everything for a couple of months can be a sign of depression and suggests talking to a doctor, while still offering a small, low-energy plan built around hiking and music."}
