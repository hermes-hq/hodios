schema: 1
baseline: "Help me make a WOOP plan for this wish: {{wish}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-starts-the-exercise
    vars:
      wish: "I want to finish the first draft of my thesis methods chapter by the end of this month."
    assert:
      - {type: llm-rubric, value: "Confirms the wish is specific, challenging and feasible within the month, then asks only for the best outcome and invites the person to imagine it, with one question in the message; does not supply the outcome or obstacle, and does not jump to a finished plan."}
  - name: edge-all-details-given
    vars:
      wish: "Wish: go to the gym three times a week for the next month. Best outcome: feeling strong and sleeping better. Obstacle: after work I feel tired and tell myself I'll go tomorrow. Also when it rains I don't want to leave the house."
    assert:
      - {type: contains, value: "## Your WOOP card"}
      - {type: llm-rubric, value: "Drafts the WOOP card from the person's own words, writes specific if-then plans for both obstacles (for example 'If I get home tired and think I'll go tomorrow, then I will put on my gym clothes and go for just 20 minutes'), marks anything it filled in, and asks the person to confirm or reword."}
  - name: negative-outside-obstacle-only
    vars:
      wish: "I wish my manager would give me a promotion. Nothing I do matters, it's all up to her."
    assert:
      - {type: llm-rubric, value: "Helps reshape the wish into something within the person's control (for example asking for a promotion conversation or building a case), and gently steers the obstacle from the manager to the person's own part, without inventing an obstacle for them."}
