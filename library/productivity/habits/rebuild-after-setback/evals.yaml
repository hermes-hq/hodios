schema: 1
baseline: "I just had a big failure and I need to rebuild. Help me plan a comeback. {{setback}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-closed-cafe
    vars:
      setback: "Closed my café after 18 months. Footfall dropped when roadworks blocked the street for 5 months, I underpriced at the start, and I never built a mailing list. I owe the landlord about four months' rent."
      what_is_left: "Good with suppliers and staff, regulars liked me, some savings, my partner is supportive"
    assert:
      - {type: contains, value: "## Honest post-mortem"}
      - {type: llm-rubric, value: "Separates uncontrollable roadworks from controllable pricing and mailing-list decisions, inventories real strengths shown by running the café, offers or recommends a smaller next goal, gives a four-week rebuild routine with a short daily minimum, and refers the rent debt to a free debt or business advice service without giving legal or financial advice."}
  - name: edge-goal-too-big
    vars:
      setback: "Failed my second attempt at the bar exam by a few points."
      next_goal: "Resit in February and also start a law master's at the same time to prove I'm serious"
    assert:
      - {type: llm-rubric, value: "Tests the stated goal and suggests a smaller, focused version (for example the resit alone with a study plan), explains why, and keeps a near-miss in proportion without dismissing the disappointment."}
  - name: negative-too-thin
    vars:
      setback: "It all went wrong."
    assert:
      - {type: llm-rubric, value: "Does not invent a detailed scenario; gives a short general version and asks a couple of questions about what happened before building a full post-mortem."}
