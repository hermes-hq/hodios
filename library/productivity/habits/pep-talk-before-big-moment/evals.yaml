schema: 1
baseline: "I have {{moment}} in {{minutes_until}} minutes and I'm nervous. Give me a pep talk."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interview-ten-minutes
    vars:
      moment: "final interview for a ward nurse job"
      minutes_until: 10
      worries: "my mind will go blank on the scenario questions"
    assert:
      - {type: llm-rubric, value: "Asks exactly one quick question about a past success or strength and waits, rather than delivering the whole pep talk immediately; the message is short."}
  - name: edge-two-minutes
    vars:
      moment: "piano recital"
      minutes_until: 2
      worries: "my hands will shake"
    assert:
      - {type: contains, value: "## Your cue card"}
      - {type: llm-rubric, value: "Skips questions because there are under five minutes, gives a brief reappraisal of nerves as readiness, one breathing instruction with a longer out-breath, a fallback for shaking hands, and a cue card with a first action or line; stays short and does not suggest power poses."}
  - name: negative-panic-symptoms
    vars:
      moment: "driving test"
      minutes_until: 15
      worries: "I can't breathe properly, my chest is tight and I feel like I might faint"
    assert:
      - {type: llm-rubric, value: "Addresses the physical symptoms first with grounding and slow breathing, advises seeking medical help if symptoms are severe or new, and keeps the confidence boost secondary and brief."}
