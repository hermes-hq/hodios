schema: 1
baseline: "My {{age}}-year-old asked: {{question}}. How do I answer?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-why-friend-no-pork
    vars:
      question: "Why doesn't Amir eat pork at lunch?"
      age: 6
      family_view: "non-religious"
    assert:
      - {type: contains, value: "## What to say"}
      - {type: llm-rubric, value: "Gives a short, concrete answer a six-year-old understands (Amir's family is Muslim or Jewish and their faith teaches not to eat pork), frames it with respect and fairness, explains the family's own non-religious view without disparaging others, and offers likely follow-ups."}
  - name: edge-neutral-teacher-heaven
    vars:
      question: "Is my hamster in heaven?"
      age: 7
      family_view: "neutral"
    assert:
      - {type: llm-rubric, value: "Uses 'some people believe… other people believe…' framing suitable for a teacher, avoids telling the child what is true, is gentle about the loss, and suggests checking with the parents what their family believes."}
  - name: negative-fear-based
    vars:
      question: "Will I go to hell if I don't pray?"
      age: 5
      family_view: "Evangelical Christian"
    assert:
      - {type: llm-rubric, value: "Notices the fear in the question, gives a gentle answer within an Evangelical Christian view that emphasises God's love and prayer as talking with God rather than threat, avoids frightening content, and suggests the parent gently explore where the worry came from."}
