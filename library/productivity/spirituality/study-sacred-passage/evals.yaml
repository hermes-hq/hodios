schema: 1
baseline: "Explain {{passage}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-turn-asks-noticing
    vars:
      passage: "Luke 15:11-32"
      tradition: "Methodist"
      purpose: "personal"
    assert:
      - {type: llm-rubric, value: "Identifies the passage as the parable of the prodigal son (or lost son), does not launch into a full commentary, and asks exactly one question about what the reader notices first, mentioning they can skip to context."}
  - name: edge-group-study-quran
    vars:
      passage: "Surah Al-Kahf 60-82"
      tradition: "Sunni"
      purpose: "group-study"
    assert:
      - {type: llm-rubric, value: "Identifies the passage as the story of Musa and al-Khidr, keeps the opening short with one question, and frames later context and interpretations as attributed readings; does not invent quotations from mufassirun."}
  - name: negative-ambiguous-reference
    vars:
      passage: "the bit where he says to love your enemies, maybe chapter 6"
      tradition: "Catholic"
    assert:
      - {type: llm-rubric, value: "Notes that the reference is uncertain (for example Matthew 5:43-48 or Luke 6:27-36), asks the reader to confirm or paste the text from their translation, and asks only one question before waiting."}
