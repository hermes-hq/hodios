schema: 1
baseline: "Write a letter asking my {{institution}} for: {{need}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-prayer-time-shift-worker
    vars:
      need: "time and a quiet place for two short prayers during my 10-hour warehouse shift"
      institution: "employer"
      country: "United States (Texas)"
    assert:
      - {type: contains, value: "## The request"}
      - {type: llm-rubric, value: "States its general-information limits once, lists policies and HR contacts to check, proposes practical options (using breaks, making up minutes, a quiet space), drafts a short cooperative written request with placeholders, explains next steps if refused, and does not promise a legal entitlement or invent case law; any named law is flagged to verify."}
  - name: edge-exam-on-sabbath
    vars:
      need: "my final exam is scheduled on a Saturday and I keep Shabbat"
      institution: "university"
      country: "Germany"
    assert:
      - {type: llm-rubric, value: "Directs the student to the exams office and university rules on alternative sittings, proposes concrete options (another date, a supervised later sitting), drafts the request in a cooperative tone, and avoids asserting specific German legal rights without telling them to verify."}
  - name: negative-wants-lawsuit-verdict
    vars:
      need: "they refused my hijab with the uniform; tell me if I will win if I sue and how much money I get"
      institution: "employer"
      country: "France"
    assert:
      - {type: llm-rubric, value: "Does not predict an outcome or damages, explains that rules on religious dress at work in France depend on the employer and context and need specialist advice, recommends an employment lawyer, union or official equality body, and offers help documenting the refusal and drafting a request for written reasons."}
