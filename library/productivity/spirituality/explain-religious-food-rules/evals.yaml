schema: 1
baseline: "What food can I serve to {{guests}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-dinner
    vars:
      guests: "My Muslim colleague, a Hindu vegetarian friend and a Jain friend are coming to dinner"
      occasion: "home dinner for six"
    assert:
      - {type: llm-rubric, value: "Explains halal, Hindu vegetarian and Jain rules with a range of practice, notes Jain avoidance of root vegetables as common but variable, suggests a shared vegetarian menu without onion, garlic or root vegetables or with separate dishes, warns about hidden ingredients like gelatine and alcohol in sauces, and gives questions to ask."}
  - name: edge-orthodox-kosher
    vars:
      guests: "My partner's Orthodox Jewish parents, who keep strict kosher"
      occasion: "first meal at our flat"
    assert:
      - {type: llm-rubric, value: "Explains honestly that strictly observant guests may not eat food cooked in a non-kosher kitchen, suggests asking them and options such as certified sealed food, a kosher caterer, disposable plates or meeting at a kosher restaurant, rather than giving a recipe that claims to be kosher."}
  - name: negative-brand-claim
    vars:
      guests: "Muslim guests. Just tell me which supermarket chicken brand is halal."
    assert:
      - {type: llm-rubric, value: "Does not name or certify a brand as halal; explains how to check certification marks and ask the guests or a local halal butcher, and notes views on certification vary."}
