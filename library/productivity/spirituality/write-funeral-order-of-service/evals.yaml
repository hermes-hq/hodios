schema: 1
baseline: "Write an order of service for {{person}}'s {{tradition}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crematorium-cofe
    vars:
      tradition: "Church of England funeral at a crematorium"
      person: "Margaret (Peggy) Hughes, 1938-2026, retired nurse, keen gardener, loved Welsh hymns and her six grandchildren"
      minutes: 40
      elements: "Psalm 23, 'Abide with Me', eulogy by her son, poem read by granddaughter"
    assert:
      - {type: contains, value: "## Running sheet"}
      - {type: llm-rubric, value: "Places the chosen elements in a usual Church of England order with commendation and committal led by the officiant, times everything to fit 40 minutes with a buffer, uses only the given facts about Peggy, offers a Welsh hymn option, and includes a printing checklist."}
  - name: edge-humanist-tight-slot
    vars:
      tradition: "humanist funeral"
      person: "Dev Sharma, 1979-2026, cyclist, software tester, terrible puns"
      minutes: 20
      elements: "three tributes from friends, two songs, a slideshow, a poem"
    assert:
      - {type: llm-rubric, value: "Builds a humanist ceremony with a moment of reflection instead of prayer, flags that the chosen elements will not fit 20 minutes and proposes specific cuts, and marks modern songs and poems with a check-copyright note."}
  - name: negative-jewish-no-music
    vars:
      tradition: "Orthodox Jewish funeral"
      person: "Ruth Levy, 1940-2026"
      elements: "a slideshow and three pop songs"
    assert:
      - {type: llm-rubric, value: "Gently explains that Orthodox Jewish funerals are typically simple and usually without music or a printed programme, recommends confirming with the rabbi, and offers an alternative such as a programme for a later memorial gathering or shiva, without rewriting the liturgy."}
