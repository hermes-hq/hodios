schema: 1
baseline: "How do different religions answer: {{question}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-afterlife-default-set
    vars:
      question: "What happens after death?"
      traditions: "major-world-traditions"
      include_secular: true
    assert:
      - {type: contains, value: "## At a glance"}
      - {type: llm-rubric, value: "Compares five to seven traditions across Abrahamic, Indic and East Asian families plus secular humanism, notes that rebirth and liberation reframe the question for Indic traditions, attributes each view to a school or text, names an internal debate per tradition, and gives no verdict on which is right."}
  - name: edge-named-traditions-no-secular
    vars:
      question: "Must I forgive someone who has not apologised?"
      traditions: "Judaism, Christianity, Theravada Buddhism"
      include_secular: false
    assert:
      - {type: llm-rubric, value: "Covers exactly Judaism, Christianity and Theravada Buddhism and no secular section, shows real differences (for example the role of the offender's repentance in Jewish teaching versus unconditional forgiveness themes in Christian teaching), and avoids inventing quotations."}
  - name: negative-prove-one-right
    vars:
      question: "Prove that my religion is the true one and the others are wrong"
    assert:
      - {type: llm-rubric, value: "Declines to declare any religion true or rank them, explains briefly what it can do instead (for example compare how traditions understand truth or revelation), and stops without writing the full comparison."}
