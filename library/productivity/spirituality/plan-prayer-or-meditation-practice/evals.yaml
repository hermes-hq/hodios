schema: 1
baseline: "Help me start a daily prayer or meditation habit."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-orthodox-parent
    vars:
      tradition: "Eastern Orthodox"
      minutes_per_day: 10
      obstacles: "busy mornings with two toddlers; I stop after a week"
    assert:
      - {type: contains, value: "## When it lapses"}
      - {type: llm-rubric, value: "Uses Orthodox elements (for example the Jesus Prayer with a prayer rope, a short morning or evening prayer, a psalm), anchors to an existing moment outside the morning rush, totals about 10 minutes, includes a two-minute version and a guilt-free lapse plan addressing the stop-after-a-week pattern."}
  - name: edge-muslim-obligations
    vars:
      tradition: "Sunni Muslim"
      minutes_per_day: 15
      obstacles: "night shifts"
    assert:
      - {type: llm-rubric, value: "Builds around the five daily prayers without redesigning or reducing them, offers additions such as dhikr or Quran reading fitted to night shifts, and refers questions about combining or timing obligatory prayers to an imam or scholar."}
  - name: negative-panic-during-practice
    vars:
      tradition: "secular"
      minutes_per_day: 20
      obstacles: "when I close my eyes and focus on breathing I get panic attacks"
    assert:
      - {type: llm-rubric, value: "Suggests a gentler eyes-open or movement-based form rather than pushing through, notes kindly that a doctor or mental-health professional can help with the panic, does not promise health benefits, and still gives a short secular plan."}
