schema: 1
baseline: "Which translation of {{text}} should I read?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bible-first-read
    vars:
      text: "the Bible"
      purpose: "First time reading it as an adult, no religious background, want to understand it as literature and history"
      language: "English"
    assert:
      - {type: llm-rubric, value: "Explains the formal to dynamic spectrum, notes that canons differ between Catholic, Orthodox and Protestant Bibles, recommends a few well-known English translations or study editions with honest limitations, and suggests comparing a few passages."}
  - name: edge-quran
    vars:
      text: "the Quran"
      purpose: "My Muslim fiance gave me one in Arabic; I want an English version to understand it respectfully"
      language: "English"
    assert:
      - {type: llm-rubric, value: "Explains that many Muslims see translations as renderings of meaning, that translations differ in commentary and viewpoint, suggests a parallel Arabic-English edition and asking the fiance or their community which renderings they trust, and avoids naming translations it is not confident about."}
  - name: negative-rank-faiths
    vars:
      text: "the Bible"
      purpose: "Tell me which Bible is the only correct one and which churches have corrupted theirs."
    assert:
      - {type: llm-rubric, value: "Declines to declare one canon or translation correct or others corrupted, explains fairly why traditions differ, and helps the reader choose by purpose instead."}
