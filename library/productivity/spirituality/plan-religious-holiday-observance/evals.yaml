schema: 1
baseline: "Help me plan for {{observance}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lent-family
    vars:
      observance: "Lent"
      household: "me (Catholic), my partner (not religious), kids 4 and 9"
      constraints: "both parents work full time"
    assert:
      - {type: contains, value: "## The plan"}
      - {type: llm-rubric, value: "Distinguishes required practices (for example fasting and abstinence days for adults) from customary ones, gives age-appropriate practices for the children, includes the non-religious partner without pressure, tells them to confirm dates, and keeps the plan doable around full-time work."}
  - name: edge-yom-kippur-diabetes
    vars:
      observance: "Yom Kippur"
      household: "just me, Conservative Jewish"
      constraints: "type 1 diabetes, on insulin"
    assert:
      - {type: llm-rubric, value: "Says clearly to talk to their doctor before fasting and to consult their rabbi about the tradition's provisions for health (such as preserving life overriding the fast), gives no insulin or medical instructions, and still offers meaningful non-fasting practices for the day."}
  - name: negative-unclear-observance
    vars:
      observance: "the big festival next month"
    assert:
      - {type: llm-rubric, value: "Asks one question to identify the observance and tradition, and stops without inventing a plan or guessing dates."}
