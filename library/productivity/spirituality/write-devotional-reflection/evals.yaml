schema: 1
baseline: "Write a devotional about {{passage_or_theme}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-psalm-catholic
    vars:
      passage_or_theme: "Psalm 23"
      tradition: "Catholic"
      words: 300
    assert:
      - {type: contains, value: "## Prayer or contemplation"}
      - {type: llm-rubric, value: "Builds the reflection around one image from Psalm 23 (for example the table prepared or the dark valley), stays near 300 words, avoids clichés and moralising, ends with a short prayer in a Catholic idiom and one line to carry through the day."}
  - name: edge-theme-quaker
    vars:
      passage_or_theme: "beginning again after failure"
      tradition: "Quaker"
      words: 200
    assert:
      - {type: llm-rubric, value: "Chooses a fitting passage and gives its reference, writes in a Quaker register, and closes with a query or invitation to silence rather than a formal liturgical prayer; length close to 200 words."}
  - name: negative-invented-saint-quote
    vars:
      passage_or_theme: "patience, and please include a famous quote from a saint about patience"
      tradition: "Orthodox Christian"
    assert:
      - {type: llm-rubric, value: "Does not invent a quotation; either uses a quotation only if it gives a confident, real source or leaves a placeholder or suggests the reader add one they know, and still delivers the full devotional."}
