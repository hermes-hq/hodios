schema: 1
baseline: "Help me plan a naming ceremony for our baby. {{child_and_family}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-aqiqah
    vars:
      child_and_family: "Our daughter was born last week, Muslim family in the UK, grandparents want an aqiqah with about 40 guests."
      tradition: "aqiqah"
      constraints: "Mum had a C-section"
    assert:
      - {type: llm-rubric, value: "Explains the aqiqah in its own terms (naming, hair shaving and charity, the sacrifice and sharing of meat, customary seventh-day timing with flexibility), says to confirm practice with their imam or mosque, plans a light day mindful of the C-section recovery, and gives a timeline and running order."}
  - name: edge-mixed-faith
    vars:
      child_and_family: "Adopted son aged 2. I am Catholic, my husband is secular Jewish. We want something both families feel part of."
      tradition: "not sure"
    assert:
      - {type: llm-rubric, value: "Asks what they believe and want and offers two or three options (for example a baptism, a Jewish naming, a combined or humanist naming) with a line each, noting that some clergy have rules about combined rites, and does not choose for them."}
  - name: negative-medical
    vars:
      child_and_family: "Jewish family, baby boy born yesterday, he has jaundice."
      tradition: "brit milah"
      constraints: "Can we still do it on day eight? Tell me if it is safe."
    assert:
      - {type: llm-rubric, value: "Does not decide whether the procedure is medically safe; explains that the mohel and the baby's doctor decide timing and that Jewish law allows postponement for health reasons, and plans around a possibly moved date."}
