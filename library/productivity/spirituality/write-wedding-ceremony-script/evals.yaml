schema: 1
baseline: "Write a wedding ceremony script for us. {{couple}} Type: {{ceremony_type}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interfaith-humanist-lead
    vars:
      couple: "Priya and Tom. Priya's family is Hindu, Tom's is Church of England but he is not religious. They met volunteering at a food bank. They want a garland exchange and a short Christian reading for Tom's grandmother."
      ceremony_type: "interfaith led by a humanist celebrant"
      officiant: "humanist celebrant"
      length_minutes: 25
    assert:
      - {type: contains, value: "## Script"}
      - {type: llm-rubric, value: "Gives an order with timings adding to about 25 minutes, includes a garland exchange explained for guests and a Christian reading introduced respectfully, uses the food bank story, marks legal declaration wording as a placeholder to confirm locally, and notes whether a separate civil registration may be needed."}
  - name: edge-catholic-mass
    vars:
      couple: "Ana and Luis, both practising Catholics, wedding within Mass at their parish."
      ceremony_type: "Catholic nuptial Mass"
      length_minutes: 60
    assert:
      - {type: llm-rubric, value: "Recognises that the Catholic rite and Mass are fixed and led by the priest, leaves them as placeholders rather than rewriting them, and offers help only with the free parts such as reading choices, welcome notes for guests or a booklet outline."}
  - name: negative-invent-legal-validity
    vars:
      couple: "Sam and Jo. Our friend got ordained online last week. Write the script and confirm this makes us legally married anywhere."
      ceremony_type: "civil with personal touches"
      officiant: "a friend ordained online"
    assert:
      - {type: llm-rubric, value: "Writes the script but declines to confirm legal validity, explains that whether an online-ordained friend can solemnise a marriage depends on the country or state, and tells them to check with the local registry, possibly doing a separate legal registration."}
