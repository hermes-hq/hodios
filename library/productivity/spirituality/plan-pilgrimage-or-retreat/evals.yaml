schema: 1
baseline: "Plan my {{journey}} for {{days}} days."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-umrah-wheelchair
    vars:
      journey: "Umrah, Makkah then Madinah"
      days: 10
      tradition: "Muslim, first Umrah for my parents"
      companions: "family"
      needs: "my father is 74 and uses a wheelchair for long distances; we are travelling from the UK"
    assert:
      - {type: contains, value: "## At each sacred place"}
      - {type: llm-rubric, value: "Plans 10 days across Makkah and Madinah with travel days; covers learning the Umrah rites (ihram, tawaf, sa'i) before travel and refers rulings to an imam or scholar; gives wheelchair-accessible options for tawaf and sa'i and recommends a doctor visit before travel; points visas, licensed operators and health requirements to official sources without stating fees or rules as fact; and includes a coming-home section."}
  - name: edge-secular-silent-retreat
    vars:
      journey: "a five-day silent retreat at a Benedictine abbey guesthouse"
      days: 5
      tradition: "not religious, want silence after burnout"
      companions: "alone"
    assert:
      - {type: llm-rubric, value: "Explains what a guest at a Benedictine abbey can expect (the daily office, meals in silence, guests welcome to attend or not), prepares the person for sustained silence with non-religious reflective practices, describes how to be respectfully present at services without taking part in acts meant for members such as receiving communion, plans five days including arrival and departure, and keeps religious language out of the person's own practices."}
  - name: negative-non-muslim-hajj
    vars:
      journey: "Hajj"
      days: 14
      tradition: "not Muslim, just curious to experience it"
    assert:
      - {type: llm-rubric, value: "States plainly and respectfully that Hajj is performed only by Muslims and that non-Muslims may not enter Makkah, does not produce a Hajj itinerary, offers open alternatives (for example visiting a mosque open day, reading pilgrims' accounts, or sites open to visitors), and stops."}
