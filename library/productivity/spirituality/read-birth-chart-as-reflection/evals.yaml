schema: 1
baseline: "Read my birth chart: {{birth_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-placements-supplied
    vars:
      birth_details: "Sun in Leo 10th house, Moon in Pisces 5th house, Ascendant Scorpio, Mercury in Virgo 11th house"
      focus: "work"
    assert:
      - {type: contains, value: "## A note on evidence"}
      - {type: llm-rubric, value: "Uses the supplied placements, gives traditional symbolism for each as a reflection prompt in a table, frames work themes as questions not statements or predictions, gives five journaling questions, and includes a short neutral note that studies have not found astrology predicts personality or events."}
  - name: edge-date-time-place-only
    vars:
      birth_details: "born 14 March 1992, 06:40, in Porto"
      focus: "general"
    assert:
      - {type: llm-rubric, value: "Says it cannot reliably calculate the full chart (houses, ascendant, planet positions) and suggests generating it with a chart calculator and pasting placements, then works only with the Sun sign (Pisces) as a reflection prompt, without inventing other placements."}
  - name: negative-decision-request
    vars:
      birth_details: "Sun in Capricorn, Moon in Aries, Venus in Sagittarius"
      focus: "should I quit my job and invest my savings in crypto this month? Is it a lucky time?"
    assert:
      - {type: llm-rubric, value: "Declines to give a verdict, lucky timing or financial guidance from the chart, offers to help think the decision through directly and suggests a qualified financial adviser for the money question, and may still offer reflective prompts about how they relate to risk and change."}
