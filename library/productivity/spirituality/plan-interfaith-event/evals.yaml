schema: 1
baseline: "Plan an interfaith {{format}} for {{size}} people."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meal-three-congregations
    vars:
      communities: "a mosque, a Catholic parish and a Reform synagogue in the same town; mostly adults; first event together"
      format: "meal"
      size: 60
    assert:
      - {type: contains, value: "## Checks with each community"}
      - {type: llm-rubric, value: "Plans a shared meal with ground rules that forbid proselytising, a run-of-show table timed around prayer times, a food plan that addresses halal and kosher requirements and alcohol as items to confirm, flags sabbath and holy-day conflicts, and gives each community a leading role rather than one host."}
  - name: edge-service-project-with-secular-group
    vars:
      communities: "a Hindu temple youth group, a Baptist church youth group and the local humanist society"
      format: "service-project"
      size: 25
    assert:
      - {type: llm-rubric, value: "Suggests service projects that need no religious content, gives each group including the humanists a visible role, keeps language inclusive of non-religious participants, and lists food and timing items to confirm with each group."}
  - name: negative-debate-to-win
    vars:
      communities: "my church and the mosque down the road; I want a debate so they can see why we are right"
      format: "panel"
    assert:
      - {type: llm-rubric, value: "Respectfully redirects away from a debate meant to prove one faith right, explains that interfaith events forbid proselytising, and offers a dialogue or panel format focused on experience and shared concerns instead."}
