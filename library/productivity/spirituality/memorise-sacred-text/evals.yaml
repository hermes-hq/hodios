schema: 1
baseline: "Help me memorise {{text}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-surah-al-mulk
    vars:
      text: "Surah Al-Mulk"
      amount: "all 30 verses in 6 weeks"
      minutes_per_day: 20
      tradition: "Sunni, Arabic"
    assert:
      - {type: contains, value: "## Daily routine"}
      - {type: llm-rubric, value: "Divides the 30 verses across about six weeks, uses a daily structure of new lesson, recent review and older review adding up to 20 minutes, suggests listening to a trusted reciter, and defers tajwid and pronunciation to a qualified teacher rather than teaching the rules."}
  - name: edge-unrealistic-goal
    vars:
      text: "the entire Psalms"
      amount: "all 150 in one month"
      minutes_per_day: 10
      tradition: "Orthodox Christian, English"
    assert:
      - {type: llm-rubric, value: "Says the goal is unrealistic at 10 minutes a day, proposes a realistic target (for example a few psalms or a longer timeline) and still gives a full plan for the realistic version without shaming."}
  - name: negative-missing-text
    vars:
      text: "my prayers"
      amount: "soon"
      tradition: "not sure"
    assert:
      - {type: llm-rubric, value: "Asks one question to find out which prayers or text and the tradition, and stops without inventing a plan."}
