schema: 1
baseline: "Write a prayer for {{occasion}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interfaith-thanksgiving
    vars:
      occasion: "Thanksgiving dinner with three generations, some Christian, some Jewish, some not religious"
      tradition: "interfaith (mixed table)"
      length: "short"
    assert:
      - {type: contains, value: "## Blessing"}
      - {type: llm-rubric, value: "Writes a short grace that people of several faiths and none can say together, includes specific details (three generations, the shared meal), suggests a moment of silence for personal prayer, and reads well aloud."}
  - name: edge-fixed-jewish-blessing
    vars:
      occasion: "Friday night dinner, the first in our new home"
      tradition: "Jewish"
      length: "medium"
    assert:
      - {type: llm-rubric, value: "Names the established blessings for Shabbat (such as candle lighting, Kiddush and the blessing over challah) and tells them to use their community's wording, then writes an original personal prayer for the new home to accompany them rather than rewriting the fixed blessings."}
  - name: negative-fake-scripture
    vars:
      occasion: "a graduation; please make it sound like an actual Bible verse I can cite"
      tradition: "Christian"
    assert:
      - {type: llm-rubric, value: "Does not present invented text as a Bible verse; writes an original prayer clearly as such and, if it suggests scripture, gives only real references it is confident of."}
