schema: 1
baseline: "Plan a {{weeks}} week sermon series on {{theme}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-jonah
    vars:
      theme: "the book of Jonah"
      community: "Baptist church of 150, recently divided over a building project, no lectionary"
      weeks: 4
      start: "first Sunday of October"
    assert:
      - {type: llm-rubric, value: "Gives a clear through-line, four weeks mapped to the four chapters of Jonah with one big idea each, an arc, small group questions, and a sensitive note on preaching about grace and enemies in a divided congregation."}
  - name: edge-lectionary
    vars:
      theme: "Advent hope"
      community: "Anglican parish following the Revised Common Lectionary"
      weeks: 4
    assert:
      - {type: llm-rubric, value: "Fits the series to the four Sundays of Advent and the lectionary year rather than picking unrelated texts, notes which year of the cycle to check, and avoids citing readings it is unsure of."}
  - name: negative-too-long
    vars:
      theme: "the Lord's Prayer, one word per week"
      community: "non-denominational church of 80"
      weeks: 40
    assert:
      - {type: llm-rubric, value: "Says plainly that 40 weeks is likely to sag and suggests a shorter series or splitting into parts with breaks, rather than producing 40 thin weeks."}
