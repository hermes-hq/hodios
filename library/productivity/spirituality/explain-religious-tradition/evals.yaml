schema: 1
baseline: "Explain {{tradition}} to me."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sikhism-five-minute
    vars:
      tradition: "Sikhism"
      depth: "five-minute"
      angle: "general"
    assert:
      - {type: contains, value: "## Misconceptions"}
      - {type: llm-rubric, value: "Gives a short, accurate orientation to Sikhism that glosses key terms (such as the Gurus, Guru Granth Sahib, gurdwara, langar, the Five Ks), notes diversity of observance (for example amritdhari and others), includes a calendar table that says dates move, corrects common misconceptions (such as confusing Sikhs with other groups), and ranks no religion."}
  - name: edge-angle-food-rules
    vars:
      tradition: "Judaism"
      depth: "full"
      angle: "food rules"
    assert:
      - {type: llm-rubric, value: "Weights the answer toward kashrut while still covering the other sections, explains that observance varies across Orthodox, Conservative, Reform and secular Jews, glosses terms such as kosher and meat-dairy separation, and does not present one movement's practice as the rule for all Jews."}
  - name: negative-vague-request
    vars:
      tradition: "Eastern religion"
    assert:
      - {type: llm-rubric, value: "Does not write a full overview of a non-existent single tradition. Asks one clarifying question, for example whether they mean Hinduism, Buddhism, Taoism, Shinto or another tradition, and stops."}
