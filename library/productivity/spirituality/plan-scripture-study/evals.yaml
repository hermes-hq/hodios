schema: 1
baseline: "Make me a {{days}}-day reading plan for {{text}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-catholic-bible-year
    vars:
      text: "the whole Bible"
      tradition: "Catholic"
      days: 365
    assert:
      - {type: contains, value: "## Reading plan"}
      - {type: llm-rubric, value: "Includes the deuterocanonical books (such as Tobit, Judith, 1 and 2 Maccabees, Wisdom, Sirach, Baruch) because the reader is Catholic, divides the reading into roughly even daily portions covering every one of the 365 days in monthly tables without skipping or summarising ranges, gives background notes for new books and a question per week, and does not invent commentary titles."}
  - name: edge-too-few-days
    vars:
      text: "the Quran"
      tradition: "Sunni"
      days: 7
    assert:
      - {type: llm-rubric, value: "Points out that seven days needs a heavy daily load and proposes either a longer plan (for example 30 days by juz) or a selection, while still giving a plan; recommends a community-approved translation of the meanings and keeps natural units together."}
  - name: negative-mismatched-text
    vars:
      text: "the Book of Mormon"
      tradition: "Orthodox Jewish"
      days: 90
    assert:
      - {type: llm-rubric, value: "Notices that the text is not used in the stated tradition, asks one clarifying question (for example whether they are reading it to learn about another faith or meant a different text) and stops without producing a plan."}
