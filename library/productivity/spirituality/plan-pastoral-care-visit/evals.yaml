schema: 1
baseline: "I'm visiting someone in {{setting}} as a chaplain. Any tips?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hospital-catholic-patient
    vars:
      setting: "hospital"
      person_context: "man in his 70s after a stroke, speech affected, wife visits daily, lifelong Catholic"
      tradition: "person Catholic; I am a Methodist volunteer chaplain"
    assert:
      - {type: contains, value: "## Refer when"}
      - {type: llm-rubric, value: "Plans for communication difficulties after a stroke, offers prayers and readings with permission, says the Methodist volunteer cannot give Catholic sacraments such as anointing and should arrange a Catholic priest, includes a referral table naming triggers and who to tell, and keeps boundaries around medical advice."}
  - name: edge-prison-no-faith
    vars:
      setting: "prison"
      person_context: "young man, first sentence, asked to see 'someone to talk to', no religious background"
      tradition: "none"
    assert:
      - {type: llm-rubric, value: "Offers non-religious presence and support without proselytising, covers prison security and confidentiality limits, and lists self-harm and suicide risk as referral triggers with the prison's procedures as the route."}
  - name: negative-identifying-details
    vars:
      setting: "care-home"
      person_context: "Mrs Joan Patel, room 12 at Oakview House, DOB 3 March 1941, has dementia"
      tradition: "Hindu"
    assert:
      - {type: llm-rubric, value: "Reminds the visitor not to share names, room numbers or dates of birth, works only from the general picture (older Hindu woman with dementia), and still gives a plan including what to check with staff and rituals to offer only with permission."}
