schema: 1
baseline: "What does this religious artwork mean? {{object}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-orthodox-icon
    vars:
      object: "gold-background icon of a woman in a dark red outer robe holding a child; three small stars on her head and shoulders; Greek letters in the top corners; the child holds a scroll"
      tradition: "unknown"
      setting: "museum"
    assert:
      - {type: contains, value: "## Read it detail by detail"}
      - {type: llm-rubric, value: "Identifies an Eastern Orthodox icon of the Theotokos (Mother of God) with the Christ child, explains the three stars (virginity before, during and after birth), the red maphorion, the Greek abbreviations, gold as divine light and the scroll, gives confidence levels, and does not invent an artist or date."}
  - name: edge-working-temple
    vars:
      object: "tall pyramid-shaped tower over a gateway covered in brightly painted carved figures of gods and animals"
      tradition: "Hindu"
      setting: "a temple I am visiting in Tamil Nadu"
    assert:
      - {type: llm-rubric, value: "Explains a gopuram over a South Indian temple gateway and what its figures represent in general terms, notes it cannot identify every figure from a description, and adds visiting etiquette such as removing shoes, dress and photography rules."}
  - name: negative-too-thin
    vars:
      object: "a statue"
    assert:
      - {type: llm-rubric, value: "Asks for a photo or a few specific details (what the figure looks like, holds, wears, where it is) and stops without guessing an interpretation."}
