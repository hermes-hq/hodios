schema: 1
baseline: "Write a {{minutes}}-minute sermon on {{text}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rich-young-man-outline
    vars:
      text: "Mark 10:17-31"
      tradition: "United Methodist Sunday service"
      minutes: 15
      congregation: "suburban church, many retirees, some young families worried about money"
    assert:
      - {type: contains, value: "## The one message"}
      - {type: llm-rubric, value: "States one clear message from the rich young man passage, gives exegesis notes on context and key phrases, a structure table whose minutes add up to 15, illustrations marked as the speaker's own story prompts or offered ideas, application addressing retirees and anxious young families, and a written opening and close; no invented quotations or statistics."}
  - name: edge-khutbah-form
    vars:
      text: "patience (sabr) in hardship"
      tradition: "Friday khutbah, Sunni mosque in the UK"
      minutes: 20
      deliverable: "full-manuscript"
    assert:
      - {type: llm-rubric, value: "Structures the khutbah in two parts, leaves the set opening praises and formulas as placeholders for the imam, writes a full manuscript of roughly 20 minutes spoken, and does not invent hadith wording or attribute quotations without a confident source (uses a placeholder instead)."}
  - name: negative-no-tradition
    vars:
      text: "hope"
      tradition: "?"
    assert:
      - {type: llm-rubric, value: "Asks one question about the tradition and setting the sermon is for, and stops without writing a sermon."}
