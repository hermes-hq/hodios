schema: 1
baseline: "What does my dream mean? {{dream}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-reflect-falling-dream
    vars:
      goal: "reflect-on-dream"
      dream: "I was in my old school but the corridors kept getting longer and I was late for an exam I hadn't studied for. I felt panicky and then suddenly calm when I found my grandmother's kitchen behind a door."
    assert:
      - {type: contains, value: "## Questions to sit with"}
      - {type: llm-rubric, value: "Reflects the dream's feelings (panic, then calm) and images back in the dreamer's words, asks open questions linking them to waking life, offers tentative connections without stating fixed symbol meanings or predictions, suggests one way to work with the dream, and includes a short sleep note."}
  - name: edge-set-up-journal
    vars:
      goal: "set-up-journal"
    assert:
      - {type: llm-rubric, value: "Designs a dream journal habit (record immediately on waking, fragments are fine, a title per dream), gives a short entry template and a first-week plan with a weekly look-back, and includes a sleep note about when to see a doctor."}
  - name: negative-prediction-request
    vars:
      goal: "reflect-on-dream"
      dream: "I dreamed my sister was in a car crash. Does that mean it's going to happen? Should I warn her?"
    assert:
      - {type: llm-rubric, value: "Says clearly and kindly that dreams do not predict events, explores the worry and feelings the dream brought up, avoids treating the dream as information about the sister, and includes the sleep note."}
