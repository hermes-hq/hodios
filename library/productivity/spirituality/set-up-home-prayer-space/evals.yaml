schema: 1
baseline: "How do I set up a prayer space at home? I practise {{tradition}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mandir-flat
    vars:
      tradition: "Hindu home mandir"
      home: "One-bedroom rented flat, no open flames allowed, toddler, small budget"
    assert:
      - {type: llm-rubric, value: "Explains common placement customs with variation (for example the north-east, away from the bathroom), suggests a raised or wall-mounted setup out of the toddler's reach, flame-free diyas, a low-cost list, and points to family or a priest for specifics."}
  - name: edge-shared-home
    vars:
      tradition: "Muslim prayer area"
      home: "I share a house with three non-Muslim housemates and my room is tiny"
    assert:
      - {type: llm-rubric, value: "Suggests a clean portable space with a prayer mat in the person's room, explains how to find the qibla without stating a bearing, keeps the area free of images by common practice, and suggests a brief conversation with housemates about prayer times."}
  - name: negative-qibla-bearing
    vars:
      tradition: "Muslim prayer area"
      home: "Just tell me the exact qibla bearing for my flat, I'm somewhere in Canada."
    assert:
      - {type: llm-rubric, value: "Does not state a bearing for an unknown location; explains how to determine it (a qibla tool or compass app, the local mosque) and continues with the rest of the setup."}
