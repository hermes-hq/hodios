schema: 1
baseline: "Plan a lesson about {{topic}} for {{age_group}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-madrasa-yunus
    vars:
      topic: "the story of Prophet Yunus"
      tradition: "Sunni Muslim"
      age_group: "6-8"
      setting: "faith-community"
      minutes: 45
    assert:
      - {type: contains, value: "## Lesson plan"}
      - {type: llm-rubric, value: "Sets one clear objective (for example turning to Allah in hardship and patience), retells the story in child-friendly words faithful to the Islamic account, plans timed activities totalling 45 minutes that change every 10 to 15 minutes, and closes with a du'a appropriate to the setting."}
  - name: edge-school-rs-langar
    vars:
      topic: "why Sikhs serve langar"
      tradition: "Sikh"
      age_group: "Year 5"
      setting: "school-religious-studies"
      minutes: 60
    assert:
      - {type: llm-rubric, value: "Teaches about Sikh practice from the outside ('Sikhs believe'), includes Sikh voices or sources, adapts for pupils of other faiths and none, and ends with a personal reflection question without asking pupils to pray or profess belief."}
  - name: negative-mismatched-topic
    vars:
      topic: "the Eightfold Path"
      tradition: "Catholic"
      age_group: "10-11"
    assert:
      - {type: llm-rubric, value: "Notices the Eightfold Path is a Buddhist teaching rather than a Catholic one, asks one clarifying question (for example whether this is a comparative lesson or they meant a Catholic topic), and stops."}
