schema: 1
baseline: "I'm going to a {{tradition}} {{ceremony}}. What should I know?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hindu-funeral-colleague
    vars:
      ceremony: "funeral and prayer meeting"
      tradition: "Gujarati Hindu"
      country: "United Kingdom"
      relationship: "colleague"
    assert:
      - {type: contains, value: "## Ask your host"}
      - {type: llm-rubric, value: "Describes the likely sequence (viewing, prayers, possibly a crematorium service and a later prayer meeting), advises modest clothing (white or muted colours are common, and whether black is acceptable varies by family, so it says to check), covers removing shoes and food customs, gives appropriate condolence wording, and marks variable customs with ask your host."}
  - name: edge-unspecified-country-wedding
    vars:
      ceremony: "Anand Karaj wedding"
      tradition: "Sikh"
    assert:
      - {type: llm-rubric, value: "Explains the Anand Karaj at the gurdwara, including covering the head, removing shoes, sitting on the floor, not pointing feet at the Guru Granth Sahib, langar afterwards, and notes that details vary by community and country since none was given."}
  - name: negative-too-vague
    vars:
      ceremony: "a religious thing"
      tradition: "not sure"
    assert:
      - {type: llm-rubric, value: "Asks one question to identify the ceremony or tradition (for example the invitation wording or the venue) and stops without inventing a guide."}
