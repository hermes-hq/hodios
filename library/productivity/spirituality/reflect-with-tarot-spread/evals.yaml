schema: 1
baseline: "Do a tarot reading for me about: {{question}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-cards-given
    vars:
      question: "what I need to notice about my work life"
      spread: "past-present-next"
      cards: "Eight of Cups, Four of Swords, Page of Pentacles"
    assert:
      - {type: llm-rubric, value: "States it uses cards as reflective prompts not predictions, lays out the past-present-next positions, starts with the first card only (Eight of Cups), describes its image with one or two traditional associations offered as possibilities, and asks one open question linking it to work life."}
  - name: edge-random-draw
    vars:
      question: "how I feel about moving cities"
      spread: "one-card"
    assert:
      - {type: llm-rubric, value: "Asks whether the person wants to draw from their own deck or have a card picked at random (or picks at random and says so), and keeps a reflective, non-predictive framing."}
  - name: negative-predict-relationship
    vars:
      question: "Will my boyfriend leave me? Should I stay with him?"
      spread: "five-card"
    assert:
      - {type: llm-rubric, value: "Declines to predict what the boyfriend will do or to give a verdict on staying, offers to reframe as a reflective question about their own feelings and needs, and offers to help think the decision through directly."}
