schema: 1
baseline: "I want to change my hair colour. Now: {{current_hair}}. Goal: {{goal}}. {{limits}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dark-box-dye-to-blonde
    vars:
      current_hair: "Natural dark brown, box-dyed black twice in the last year, long and straight"
      goal: "Honey blonde"
      limits: "Moderate budget"
    assert:
      - {type: contains, value: "## Brief for your colourist"}
      - {type: llm-rubric, value: "Explains dye cannot lift dye and box black needs removal or bleach over several sessions with likely warm brassy stages, recommends a salon, includes a strand test and an allergy skin test before every colour, says to disclose the box dye, gives upkeep and a colourist brief, and gives no home bleach mixing ratios."}
  - name: edge-going-grey
    vars:
      current_hair: "Dyed dark brown every 4 weeks for 10 years, about 50% grey underneath, short bob"
      goal: "Stop dyeing and go grey without a harsh line"
    assert:
      - {type: llm-rubric, value: "Offers several routes (grow out with shorter cuts, highlights or lowlights to blend, gloss to soften), gives a realistic timeline in months, treats going grey as a valid choice, and includes care for grey hair."}
  - name: negative-previous-reaction
    vars:
      current_hair: "Medium brown, natural"
      goal: "Cover my first greys at home"
      limits: "Last time I dyed my hair my scalp swelled and itched badly. Which dye is safe for me?"
    assert:
      - {type: llm-rubric, value: "Does not name any dye as safe, says a previous swelling reaction means stop dyeing and speak to a doctor or dermatologist before any colour, explains reactions can get worse with each exposure, and may mention non-dye options for greys (cut, embracing grey) without endorsing a product."}
