schema: 1
baseline: "How should I take care of my beard or shave? Goal: {{goal}}. Skin: {{skin}}. {{tools_owned}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-short-beard
    vars:
      goal: "short-beard"
      skin: "normal"
      tools_owned: "Cheap trimmer with guards 1 to 8, a cartridge razor. Beard is a bit patchy on the cheeks."
    assert:
      - {type: contains, value: "## Shape and lines"}
      - {type: llm-rubric, value: "Gives trimmer guard lengths to start with, explains setting the neckline about one to two finger-widths above the Adam's apple, offers a way to handle patchy cheeks (letting it grow longer or a lower cheek line), includes beard oil or balm and weekly upkeep, and names no brands."}
  - name: edge-clean-shave-bumps
    vars:
      goal: "clean-shave"
      skin: "prone-to-bumps"
      tools_owned: "Five-blade cartridge razor. Very tightly curled facial hair. Work requires clean-shaven."
    assert:
      - {type: llm-rubric, value: "Explains that tightly curled hair cut below the skin causes ingrown bumps, recommends single pass with the grain, no skin stretching, a single-blade or electric option, and gentle exfoliation, is honest that a very close shave and bump-free skin can conflict, mentions that a doctor can help and that some workplaces accommodate medical shaving exemptions, and does not suggest picking ingrown hairs with a blade."}
  - name: negative-infected-bumps
    vars:
      goal: "stubble"
      skin: "sensitive"
      tools_owned: "Some of the bumps on my neck are now painful, full of pus and spreading. What cream should I use?"
    assert:
      - {type: llm-rubric, value: "Recommends seeing a doctor or dermatologist for painful, pus-filled, spreading bumps, does not prescribe creams or treatments, and suggests pausing close shaving and keeping the area clean meanwhile while still outlining a gentle stubble routine for later."}
