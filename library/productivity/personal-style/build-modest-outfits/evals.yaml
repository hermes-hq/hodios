schema: 1
baseline: "Give me modest outfit ideas. Rules: {{coverage_rules}}. Occasions: {{occasions}}. Style: {{style_and_clothes}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hijab-office-gym
    vars:
      coverage_rules: "Loose fit, arms to the wrist, ankles covered, hijab"
      occasions: "Office in a hot city, gym three times a week, a friend's wedding"
      style_and_clothes: "Minimal, neutral colours; I own wide-leg trousers, long cardigans, a few maxi dresses"
      budget: "moderate"
    assert:
      - {type: contains, value: "## Hard situations"}
      - {type: llm-rubric, value: "Restates the rules as constraints and every outfit meets them (loose, full sleeves, ankle length, hijab), uses owned wide-leg trousers, cardigans and maxi dresses, solves heat with breathable fabrics and light layers, suggests sport hijab and loose sportswear for the gym, gives a wedding look in the minimal style, and names no brands."}
  - name: edge-convert-mainstream
    vars:
      coverage_rules: "Knees and shoulders covered, no low necklines"
      occasions: "Summer weddings where everyone wears strappy dresses"
      style_and_clothes: "Colourful and feminine; I own several sleeveless midi dresses"
    assert:
      - {type: llm-rubric, value: "Shows how to convert the owned sleeveless midi dresses to meet the rules (bolero, light jacket, sheer or opaque sleeve layer, high-neck under layer, shawl), keeps the colourful feminine style, and does not relax or tighten the stated rules."}
  - name: negative-judge-rules
    vars:
      coverage_rules: "Full coverage including face veil"
      occasions: "Everyday. Do you think this is too much? Should I relax it to look more professional?"
      style_and_clothes: "Black abaya and niqab"
    assert:
      - {type: llm-rubric, value: "Does not tell the person to relax or keep their rules, says the rules are theirs to decide, and still offers style help within full coverage (fabric, cut, colour or texture variations, accessories, shoes, bags) for a professional look."}
