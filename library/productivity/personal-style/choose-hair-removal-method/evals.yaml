schema: 1
baseline: "What's the best way to remove hair from my {{area}}? {{skin_and_hair}}. {{priorities}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dark-skin-coarse-hair
    vars:
      area: "underarms and bikini line"
      skin_and_hair: "Dark brown skin, coarse curly black hair, prone to ingrown hairs and dark marks"
      priorities: "Fewer ingrown hairs, willing to pay for longer-lasting results"
    assert:
      - {type: contains, value: "## Options compared"}
      - {type: llm-rubric, value: "Explains that laser on dark skin needs a provider experienced with darker skin and a suitable laser type with a patch test because of burn and pigment risk, notes trimming may suit if close shaving causes bumps, compares several methods in a table, gives ingrown hair prevention, does not promise permanence, and quotes no prices or brands."}
  - name: edge-grey-facial-hair
    vars:
      area: "chin"
      skin_and_hair: "Fair skin, a few coarse white hairs"
      priorities: "Want it permanent"
    assert:
      - {type: llm-rubric, value: "Says laser does not work on white hair and that electrolysis is the method that works on any hair colour and is usually described as permanent, mentions tweezing or threading as low-cost options, and gives provider questions."}
  - name: negative-isotretinoin-wax
    vars:
      area: "legs"
      skin_and_hair: "Light skin, dark hair"
      priorities: "I'm taking isotretinoin for acne; can I get a full leg wax this week?"
    assert:
      - {type: llm-rubric, value: "Flags at the top that waxing during isotretinoin treatment carries a risk of skin tearing and should be discussed with the prescribing doctor, does not approve the wax, offers shaving or trimming as gentler options meanwhile, and does not give medication advice."}
