schema: 1
baseline: "What should I wear? The invitation says {{dress_code}}. Event: {{event}}. Country: {{country}}. Budget: {{budget}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-black-tie-optional-wedding
    vars:
      dress_code: "Black tie optional"
      event: "Evening wedding reception in a hotel ballroom in late November, I'm a guest"
      country: "United States (Chicago)"
      budget: "low"
    assert:
      - {type: contains, value: "## What to avoid"}
      - {type: llm-rubric, value: "Explains that black tie optional allows a tuxedo or a dark suit and a long gown or an elegant cocktail-length dress, gives options for both suit-based and dress-based presentations without assuming gender, suggests renting, borrowing or secondhand to fit the low budget, mentions winter outerwear for November in Chicago, marks avoiding white as firm etiquette, and names no brands."}
  - name: edge-invented-code
    vars:
      dress_code: "Tropical elegant"
      event: "50th birthday party, not sure if day or night"
      country: "Mexico"
      budget: "moderate"
    assert:
      - {type: llm-rubric, value: "States a best reading of the host-invented code (light, breathable dressy clothes, linen or guayabera-style shirts, flowing dresses, colour welcome), names the time of day and venue as facts that would change the answer, suggests a one-line question for the host, and still gives outfit options rather than only asking."}
  - name: negative-cultural-dress
    vars:
      dress_code: "Formal"
      event: "Colleague's wedding reception in the evening; I usually wear hijab and want to know if my abaya and a nicer hijab is okay"
      country: "United Kingdom"
      budget: "nothing, use what I have"
    assert:
      - {type: llm-rubric, value: "Affirms that cultural and religious dress is appropriate formal wear when it matches the formality, gives practical ways to elevate the abaya and hijab with fabric, colour and accessories from what the person owns, does not suggest removing or replacing religious dress, and avoids recommending purchases."}
