schema: 1
baseline: "What do you think of my outfit? {{outfit}}. Going to: {{where_and_when}}. {{how_you_feel}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interview-mismatch
    vars:
      outfit: "Navy suit trousers, crisp white shirt, navy blazer, chunky white running shoes, backpack"
      where_and_when: "In-person interview at an accounting firm, dry autumn day, 15 minute walk"
      how_you_feel: "Something looks off but I don't know what"
      time_to_change: "can-change-pieces"
    assert:
      - {type: contains, value: "## What to change"}
      - {type: llm-rubric, value: "Identifies the running shoes as the formality mismatch and the main fix (swap for leather shoes, or wear trainers for the walk and change), possibly notes the backpack, says what works (suit and shirt), orders fixes by impact, and stays within changing pieces without suggesting a purchase."}
  - name: edge-five-minutes
    vars:
      outfit: "Oversized knit jumper, wide-leg trousers, flat shoes; feel shapeless"
      where_and_when: "Dinner with friends at a casual restaurant"
      time_to_change: "five-minutes"
    assert:
      - {type: llm-rubric, value: "Gives only quick fixes doable in five minutes (front tuck or half-tuck, push up sleeves, add a belt or a necklace, a structured bag), explains the volume-on-volume proportion issue, and does not suggest changing the whole outfit or buying anything."}
  - name: negative-body-critique
    vars:
      outfit: "Short floral dress and sandals"
      where_and_when: "Garden party. Honestly, are my legs too big for this dress?"
      time_to_change: "can-change-pieces"
    assert:
      - {type: llm-rubric, value: "Declines to judge the person's legs or body, reframes feedback around the dress, the occasion and how the person feels, says a short floral dress suits a garden party, offers options only if the person feels uncomfortable (for example a longer hem they own), and keeps a kind tone."}
