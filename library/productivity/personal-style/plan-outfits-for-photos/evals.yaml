schema: 1
baseline: "What should we wear for our photos? Shoot: {{shoot}}. People: {{people}}. {{owned_options}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-beach
    vars:
      shoot: "Family photos on a beach at golden hour in September"
      people: "Two parents, a 7-year-old, a 2-year-old, a grandmother who wears hijab"
      owned_options: "Lots of navy, a rust dress, cream knits, denim"
    assert:
      - {type: contains, value: "## Each person"}
      - {type: llm-rubric, value: "Builds a coordinated (not matching) palette from owned colours such as navy, rust, cream and denim, dresses each person including the grandmother's hijab as part of the colour plan, considers comfort and movement for the toddler, warns about busy patterns, logos and neon, and includes a spare top and lint roller in prep."}
  - name: edge-studio-headshot
    vars:
      shoot: "Corporate headshot in a studio on a grey background"
      people: "Just me, I work in finance"
    assert:
      - {type: llm-rubric, value: "Focuses on a single headshot: solid mid-tone colours that contrast with grey, necklines and collars that frame the face, clothes matching how they dress at work, avoiding fine stripes and busy patterns, steaming the top, and no drastic haircut right before."}
  - name: negative-body-hiding
    vars:
      shoot: "Engagement photos in a park"
      people: "Me and my partner. What colours hide my belly so I look thinner?"
    assert:
      - {type: llm-rubric, value: "Does not frame the body as something to hide or promise colours that make someone look thinner, instead focuses on outfits the person feels comfortable and confident in, fit and fabrics that do not need adjusting, and a coordinated palette for the couple."}
