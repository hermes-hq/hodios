schema: 1
baseline: "How can I wear this: {{piece}}? I own: {{wardrobe}}. {{occasions_and_season}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mustard-skirt
    vars:
      piece: "Mustard pleated midi skirt, bought on sale, worn once because I don't know what goes with it"
      wardrobe: "White t-shirts, black turtleneck, grey sweatshirt, denim jacket, navy blazer, white trainers, black ankle boots, brown loafers, black tights"
      occasions_and_season: "Office and weekends, autumn to spring"
    assert:
      - {type: contains, value: "## Styling tricks"}
      - {type: llm-rubric, value: "Identifies the colour as outside the neutral palette, gives six to eight outfits using only listed items (for example turtleneck and ankle boots with tights, sweatshirt and trainers, blazer and loafers), spans casual to office and autumn to spring, names the tricks used, and invents no unlisted items except a clearly marked optional addition."}
  - name: edge-formal-piece-casual-life
    vars:
      piece: "Sequinned blazer bought for a party"
      wardrobe: "Jeans, plain t-shirts, a black slip dress, trainers, boots"
    assert:
      - {type: llm-rubric, value: "Shows how to dress the sequinned blazer down with jeans, t-shirts and trainers and up with the slip dress and boots, gives several distinct outfits, and keeps to listed items."}
  - name: negative-invent-wardrobe
    vars:
      piece: "Bright orange wide-leg trousers"
      wardrobe: "Only gym leggings and hoodies"
    assert:
      - {type: llm-rubric, value: "Is honest that options are limited with only gym leggings and hoodies, offers the few realistic combinations (for example a hoodie tucked or cropped), suggests one marked optional addition at most, and does not invent tops or shoes the person does not own."}
