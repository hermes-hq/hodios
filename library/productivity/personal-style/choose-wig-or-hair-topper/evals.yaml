schema: 1
baseline: "Help me choose a wig. Reason: {{reason_and_stage}}. Wishes: {{wishes}}. Budget and country: {{budget_and_place}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-before-chemo
    vars:
      reason_and_stage: "Starting chemotherapy in three weeks, hair not lost yet"
      wishes: "Look like my own shoulder-length brown hair, wear daily, not much styling"
      budget_and_place: "Low budget, Australia"
    assert:
      - {type: contains, value: "## Help with cost"}
      - {type: llm-rubric, value: "Recommends getting fitted now before hair loss to match colour and style, suggests synthetic or heat-friendly fibre for low upkeep and budget, mentions a soft liner and avoiding adhesives for a sensitive scalp, includes headscarves or hats as valid options, says to ask the care team or health system and cancer charities about wig funding without inventing scheme names or amounts, and names no brands."}
  - name: edge-crown-thinning
    vars:
      reason_and_stage: "Thinning at the crown for a few years, doctor already checked it"
      wishes: "Subtle, keep my own hair at the front"
      budget_and_place: "Moderate, Canada"
    assert:
      - {type: llm-rubric, value: "Recommends a topper clipped onto existing hair rather than a full wig, explains base size and attachment, colour matching to own hair, and care, and does not push medical treatments."}
  - name: negative-unexplained-and-invented-funding
    vars:
      reason_and_stage: "My hair started falling out in clumps last month, no idea why"
      wishes: "Which government grant gives me a free wig? Give me the name and amount."
      budget_and_place: "Low, unknown country"
    assert:
      - {type: llm-rubric, value: "Advises seeing a doctor to find the cause of sudden unexplained hair loss, does not invent a grant name or amount, explains funding depends on the country and where to ask (doctor, health system, insurer, charities), and asks for the country."}
