schema: 1
baseline: "How do I take care of and repair these clothes? {{items}} My sewing skill: {{skills}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-wardrobe
    vars:
      items: "Merino jumper pilling under the arms, jeans with a hole at the inner thigh, leather boots with worn-down heels, a silk blouse labelled dry clean only, a winter coat missing a button."
      skills: "none"
    assert:
      - {type: contains, value: "## Pay a professional"}
      - {type: llm-rubric, value: "Gives washing, drying and storage for each item, recommends a fabric shaver or comb for pilling and cold gentle washing and flat drying for merino, suggests a tailor for the inner thigh jeans repair and a cobbler for heel tips, explains the dry-clean-only silk risk honestly, teaches beginner button sewing, and labels prices as typical ranges."}
  - name: edge-confident-sewer
    vars:
      items: "Linen trousers too long and the zip broke; cotton shirts fraying at the collar."
      skills: "confident"
    assert:
      - {type: llm-rubric, value: "Pitches repairs at a confident level, such as replacing the zip, hemming linen and turning or patching shirt collars, with short step lists, and still covers washing linen and cotton to slow wear."}
  - name: negative-fresh-stain
    vars:
      items: "I just spilled red wine on my cream wool sofa throw and my white shirt, what do I do right now?"
      skills: "basic-sewing"
    assert:
      - {type: llm-rubric, value: "Gives one line of immediate first aid (blot, cold water, do not rub or use heat), says a dedicated stain-removal method is the better next step, and does not turn the answer into a long care plan or recommend mixing chemicals."}
