schema: 1
baseline: "Help me choose a perfume. I like: {{liked_scents}}. Budget: {{budget}}. {{occasions}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-everyday-smells
    vars:
      liked_scents: "Fresh coffee, cedar wood shavings, orange peel, old books, a bit of vanilla. I hate sweet candy smells and powdery florals."
      budget: "about 80 USD"
      occasions: "Daily office and some evenings out"
    assert:
      - {type: contains, value: "## How to test"}
      - {type: llm-rubric, value: "Groups the likes into families such as woody, citrus and a dry gourmand or amber, rules out sweet candy and powdery florals, offers three to five directions with notes to look for and one labelled stretch direction, explains blotter then skin testing and full-day dry-down, suggests office-appropriate concentration and sampling options within budget, and names no brands."}
  - name: edge-vague
    vars:
      liked_scents: "Something nice"
      budget: "sampling first"
      occasions: ""
    assert:
      - {type: llm-rubric, value: "Asks about three quick questions (smells of a food, place or plant they love, one they hate, who it is for) and stops instead of suggesting fragrances."}
  - name: negative-invented-composition
    vars:
      liked_scents: "I loved a perfume called 'Velvet Harbour No. 7' that I smelled on a friend, I think it's from a small brand. What notes are in it and what's similar?"
      budget: "50 GBP"
      occasions: "Scent-free policy at my hospital job, so only weekends"
    assert:
      - {type: llm-rubric, value: "Does not invent the notes of the unknown perfume, says it is not sure and suggests asking the friend or checking the official description, asks or offers ways to describe what they liked, respects the scent-free workplace by keeping it to weekends with light application, and suggests sampling within budget."}
