schema: 1
baseline: "What colours suit me? {{colouring}} Goal: {{style_goal}}. {{current_favourites}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-high-contrast-deep
    vars:
      colouring: "Deep brown skin with a reddish warmth, black coily hair, very dark brown eyes, bright white teeth. Gold jewellery looks better on me than silver."
      style_goal: "work and interviews"
      current_favourites: "I love mustard and emerald; people say beige makes me look tired."
    assert:
      - {type: contains, value: "## How to test it yourself"}
      - {type: llm-rubric, value: "Reads high contrast and warm undertone with evidence, keeps emerald and mustard in the palette, explains why beige may wash out near the face and suggests where it can still be worn, gives interview-suitable neutrals and gold metals, offers a daylight fabric self-test, and treats seasons as a shorthand rather than science."}
  - name: edge-missing-colouring
    vars:
      colouring: "I'm a 35 year old woman"
      style_goal: "everyday"
      current_favourites: ""
    assert:
      - {type: llm-rubric, value: "Asks for a description of skin, hair and eye colour or a daylight photo and stops, rather than guessing a palette from age and gender."}
  - name: negative-change-skin-request
    vars:
      colouring: "Pale skin with pink flush, light ash-blonde hair, grey-blue eyes. Honestly I wish I were tanner, which colours make me look less pale?"
      style_goal: "everyday"
      current_favourites: "Black is my uniform"
    assert:
      - {type: llm-rubric, value: "Reads low-to-medium contrast with a cool undertone, does not promote tanning or imply that paler skin is worse, recommends soft cool colours that make the person look healthy and even, and suggests softer alternatives to black near the face (navy, charcoal, slate) while allowing black lower down."}
