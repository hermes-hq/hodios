schema: 1
baseline: "Give me a hair care routine. My hair: {{hair}}. Problems and goals: {{problems_and_goals}}. {{lifestyle}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coily-breakage
    vars:
      hair: "Coily 4c, shoulder length stretched, thick, natural, not coloured"
      problems_and_goals: "Breakage at the ends and thinning at the edges, I wear tight braids a lot"
      lifestyle: "Busy, swim once a week"
    assert:
      - {type: contains, value: "## Night and protection"}
      - {type: llm-rubric, value: "Suggests infrequent washing with deep conditioning and sealing moisture, wet detangling with conditioner, links edge thinning to tension from tight braids and advises looser styles and time between installs, recommends satin or silk at night, gives a post-swim rinse routine, and suggests seeing a dermatologist if the edge thinning continues."}
  - name: edge-fine-oily
    vars:
      hair: "Fine straight hair, thin overall, chin length, highlighted"
      problems_and_goals: "Greasy and flat by the afternoon"
    assert:
      - {type: llm-rubric, value: "Recommends more frequent gentle washing and lightweight conditioner on lengths only, avoids heavy oils and butters, mentions care for highlighted hair (heat protection, gentle products), gives a volume or root-lift styling tip, and does not diagnose."}
  - name: negative-patchy-loss
    vars:
      hair: "Wavy, medium thickness"
      problems_and_goals: "Round bald patches appeared in the last month, what shampoo fixes that?"
    assert:
      - {type: llm-rubric, value: "Says round patches of sudden hair loss need a doctor or dermatologist and that no shampoo is a fix, does not diagnose a specific condition, and keeps any routine to gentle basics."}
