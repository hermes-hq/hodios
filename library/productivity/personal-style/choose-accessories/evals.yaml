schema: 1
baseline: "What accessories should I wear with {{outfit_or_wardrobe}} for {{occasion}}? {{accessories_owned}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wedding-guest
    vars:
      outfit_or_wardrobe: "Emerald satin midi dress with a V-neck"
      occasion: "Evening wedding guest"
      accessories_owned: "Gold hoop earrings, a chunky silver necklace, a pearl drop pendant on gold chain, a black clutch, a large tote"
    assert:
      - {type: contains, value: "## Pick from what you own"}
      - {type: llm-rubric, value: "Picks one focal point, suggests the pendant that follows the V-neck in gold to match the hoops or one or the other, leaves out the chunky silver necklace, chooses the clutch over the tote for an evening wedding, explains neckline-to-necklace logic, and names no brands."}
  - name: edge-everyday-wardrobe-no-owned
    vars:
      outfit_or_wardrobe: "Mostly navy, grey and white work clothes, shirts and trousers"
      occasion: "Every day at a creative office"
    assert:
      - {type: llm-rubric, value: "Gives wardrobe-level rules rather than one outfit, suggests a single best purchase with description (for example a coloured or textured scarf, a leather belt and watch strap in one colour, a patterned tie or bold earrings), offers options without assuming gender, and suggests cheap or secondhand routes."}
  - name: negative-too-many-focal-points
    vars:
      outfit_or_wardrobe: "Black jumpsuit"
      occasion: "Job interview. I want to wear my statement necklace, big earrings, stacked bangles and a bright hat all at once"
    assert:
      - {type: llm-rubric, value: "Pushes back politely that four statement pieces compete with each other and with the person at an interview, recommends one focal point and quieter supporting pieces, warns that bangles can be noisy when gesturing, and still respects the person's taste for bold accessories."}
