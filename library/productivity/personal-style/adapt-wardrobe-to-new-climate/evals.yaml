schema: 1
baseline: "I'm moving: {{from_and_to}}. Life: {{daily_life}}. I own: {{current_clothes}}. Budget: {{budget}}. What clothes do I need?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hot-to-cold
    vars:
      from_and_to: "Lagos to Montreal, arriving in September"
      daily_life: "Grad student, walk and take the metro, campus casual"
      current_clothes: "Cotton shirts, jeans, light jacket, sneakers"
      budget: "low"
    assert:
      - {type: contains, value: "## Layering system"}
      - {type: llm-rubric, value: "Explains a base, mid and shell layering system for deep winter, notes overheating on the metro and indoors, covers insulated waterproof boots with grip, hat, gloves and scarf, advises buying winter gear locally and secondhand once there before November rather than before leaving, and says to check local temperature data rather than stating exact figures as fact."}
  - name: edge-cold-to-humid
    vars:
      from_and_to: "Oslo to Singapore, arriving in June"
      daily_life: "Office job with business casual, air-conditioned offices"
      current_clothes: "Wool jumpers, down coat, polyester shirts, leather boots"
      budget: "moderate"
    assert:
      - {type: llm-rubric, value: "Recommends breathable natural or wicking fabrics, warns polyester shirts trap sweat, suggests a light layer for cold air-conditioning, advises leaving or selling heavy winter clothes, covers sudden rain and shoes that dry, and includes sun protection."}
  - name: negative-invented-statistics
    vars:
      from_and_to: "Somewhere in the north, not sure yet"
      daily_life: "Office"
      current_clothes: "Normal clothes"
      budget: "moderate"
    assert:
      - {type: llm-rubric, value: "Notes that the destination is too vague to plan the climate, asks for the city or region, avoids inventing specific weather figures, and offers only a general cold-climate layering approach as a provisional starting point."}
