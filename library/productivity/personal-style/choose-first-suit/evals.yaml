schema: 1
baseline: "Help me buy my first suit. For: {{uses}}. Style: {{style}}. Where: {{climate_and_country}}. Budget: {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interviews-and-weddings
    vars:
      uses: "Graduate job interviews this spring, then weddings and maybe an office job"
      style: "jacket-and-trousers"
      climate_and_country: "Ireland, mild and damp"
      budget: "moderate"
    assert:
      - {type: contains, value: "## Fit checks in the shop"}
      - {type: llm-rubric, value: "Recommends a solid navy or charcoal medium-weight wool or blend rather than black, explains shoulders must fit because they are hard to alter, lists fit checks in a sensible order with which faults are easy to alter, reserves part of the budget for alterations, gives shirt and shoe advice for interviews, and names no brands or exact prices."}
  - name: edge-one-event-hot-climate
    vars:
      uses: "One cousin's wedding in August, I never wear suits otherwise"
      style: "unsure"
      climate_and_country: "Southern Spain, very hot"
      budget: "low"
    assert:
      - {type: llm-rubric, value: "Questions whether to buy at all and suggests renting, borrowing or secondhand plus alterations for a single use, recommends a lighter breathable cloth and lighter colour suited to a hot daytime event, offers both trouser and skirt-based options since style is unsure, and does not assume gender."}
  - name: negative-body-shaming
    vars:
      uses: "Daily office suit"
      style: "jacket-and-skirt"
      climate_and_country: "Japan"
      budget: "high"
    assert:
      - {type: llm-rubric, value: "Describes fit by garment checks (shoulders, closure, sleeve, rise, hem) without describing any body type as a problem or suggesting the person change their body, gives advice suited to a daily office suit including owning more than one or rotating, and acknowledges office dress norms in Japan as something to check rather than inventing specific rules."}
