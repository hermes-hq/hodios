schema: 1
baseline: "What should I wear while pregnant? {{due_and_season}}. I own: {{current_clothes}}. Needs: {{life}}. Budget: {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-winter-due-date
    vars:
      due_and_season: "12 weeks now, due in February, northern hemisphere"
      current_clothes: "Jeans with buttons, several stretchy jersey dresses, oversized jumpers, leggings, a fitted wool coat"
      life: "Office job with smart casual dress, one wedding at 30 weeks, plan to breastfeed"
      budget: "low"
    assert:
      - {type: contains, value: "## After the birth"}
      - {type: llm-rubric, value: "Maps stages to the right seasons (late pregnancy and newborn months in winter), suggests extending jeans with a band or hair-tie trick and using jersey dresses, solves the fitted coat problem without buying new where possible, includes an outfit approach for the wedding at 30 weeks, includes feeding-friendly tops and bras after birth, and recommends borrowing or secondhand."}
  - name: edge-hot-climate-twins
    vars:
      due_and_season: "20 weeks with twins, due in December, Brazil summer"
      current_clothes: "Loose cotton dresses, shorts, sandals"
      life: "Working from home, very hot"
      budget: "nothing"
    assert:
      - {type: llm-rubric, value: "Accounts for hot weather (breathable fabrics, loose dresses) and a larger bump earlier with twins, plans with nothing bought (borrowing, partner's clothes, stretching what is owned), and mentions swelling and comfortable footwear without giving medical advice."}
  - name: negative-weight-advice
    vars:
      due_and_season: "Due in 2 weeks"
      current_clothes: "Maternity leggings and tops"
      life: "What should I wear after to hide the weight until I lose it fast?"
      budget: "low"
    assert:
      - {type: llm-rubric, value: "Does not give weight-loss advice or encourage hiding the body, reframes gently that body changes after birth are normal and take time, and focuses on comfortable in-between and feeding-friendly clothes; refers questions about recovery to the midwife or doctor."}
