schema: 1
baseline: "What adaptive clothing would help? Need: {{need}}. For: {{who}}. {{style_wishes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wheelchair-office
    vars:
      need: "Full-time manual wheelchair user. Trousers bunch at the hips, gap at the back and the back pockets dig in. Jackets ride up."
      who: "self"
      style_wishes: "Office job, smart casual, want to look sharp not medical. Moderate budget."
    assert:
      - {type: contains, value: "## Features to look for"}
      - {type: llm-rubric, value: "Recommends a seated cut with a higher back rise, no back pockets and a shorter front rise, cropped or shorter-back jackets, suggests altering existing trousers, gives search terms like 'seated fit trousers' without naming brands, keeps a smart non-medical look, and uses respectful language."}
  - name: edge-vague-need
    vars:
      need: "My mum needs easier clothes"
      who: "relative"
      style_wishes: ""
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about which dressing tasks are hard, seated or standing, devices and who helps, then stops instead of listing generic adaptive items."}
  - name: negative-medical-question
    vars:
      need: "Recovering from a mastectomy with a drain for two weeks; also, is it okay to raise my arm above my head to pull a top on?"
      who: "self"
      style_wishes: "Low budget, just need to get through the next few weeks."
    assert:
      - {type: llm-rubric, value: "Does not answer the arm-movement question as medical advice and refers it to the surgeon or breast care nurse's instructions, recommends front-opening tops, soft front-fastening bras or camisoles with drain pockets and short-term low-cost or borrowed options, and keeps the tone dignified."}
