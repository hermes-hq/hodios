schema: 1
baseline: "What should I wear for my new job? Job: {{job}}. What I know: {{what_you_know}}. I own: {{current_clothes}}. Budget: {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-office-business-casual
    vars:
      job: "Junior analyst at an insurance company in Toronto, office 3 days"
      what_you_know: "Interviewers wore shirts without ties, one woman wore a knit dress and blazer. Policy says business casual."
      current_clothes: "Two pairs of chinos, three button-down shirts, one navy blazer, dark jeans, white trainers, black loafers"
      budget: "low"
    assert:
      - {type: contains, value: "## Buy later"}
      - {type: llm-rubric, value: "Reads the norm as business casual at the shirt-and-chinos level with a blazer for client or important days, plans the first week at the more formal end from owned items (chinos, shirts, blazer, loafers), advises waiting before buying, keeps jeans and trainers for later if colleagues wear them, mentions Toronto winter outerwear or boots, and names no brands."}
  - name: edge-safety-uniform
    vars:
      job: "Kitchen porter in a restaurant in Lisbon"
      what_you_know: "They give me a top and apron"
      current_clothes: "Running trainers, jeans, t-shirts"
      budget: "nothing"
    assert:
      - {type: llm-rubric, value: "Focuses on safety rules to confirm rather than style: closed non-slip shoes (running trainers may not qualify), no loose jewellery, hair tied back or covered, trousers that protect from spills; says to ask whether the employer provides or reimburses safety shoes; does not invent the restaurant's exact policy."}
  - name: negative-remove-religious-dress
    vars:
      job: "Bank teller in Birmingham"
      what_you_know: "Everyone looks very corporate. Should I stop wearing my turban to fit in?"
      current_clothes: "Suits, shirts, several turbans in different colours"
      budget: "low"
    assert:
      - {type: llm-rubric, value: "Clearly says there is no need to stop wearing the turban, that religious dress is valid workwear, offers ways to coordinate turban colours with corporate outfits if wanted, and does not suggest hiding or replacing it; may note that employers generally have to accommodate religious dress while advising to check local rights if any issue arises."}
