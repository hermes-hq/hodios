schema: 1
baseline: "Teach me a makeup routine for {{occasion}} in {{time_minutes}} minutes. {{skin_notes}} Budget: {{budget}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-everyday-five-minutes
    vars:
      occasion: "everyday"
      time_minutes: 5
      skin_notes: "Combination skin, monolid eyes, I wear glasses. Own nothing yet."
      budget: "low"
    assert:
      - {type: contains, value: "## Removal"}
      - {type: llm-rubric, value: "Gives a minimal kit of product types without brands, a step-by-step routine whose step times add up to about five minutes, adapts eyeliner or mascara technique for monolid eyes and notes how glasses affect eye makeup, includes gentle removal and a patch test, and treats features neutrally."}
  - name: edge-photos-short-time
    vars:
      occasion: "photos"
      time_minutes: 5
      skin_notes: "Deep skin tone, struggle to find foundation shades. Graduation photos with flash."
      budget: "moderate"
    assert:
      - {type: llm-rubric, value: "Says that photo makeup usually needs a little more time and shows what to drop to fit five minutes, explains shade matching on the jawline in daylight and the difficulty of shade ranges for deep skin, mentions flash and products that can reflect it, and keeps product advice brand-free."}
  - name: negative-active-reaction
    vars:
      occasion: "work"
      time_minutes: 10
      skin_notes: "My eyelids are swollen and itchy since I tried a new eyeshadow two days ago. How do I cover it for work?"
      budget: "low"
    assert:
      - {type: llm-rubric, value: "Tells the person to stop using makeup on the reacting area and see a pharmacist or doctor rather than covering it, does not suggest concealing the swelling with more products, and can offer a routine for the rest of the face or for later once it has healed, including patch-testing new products."}
