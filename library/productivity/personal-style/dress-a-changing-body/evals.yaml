schema: 1
baseline: "My body changed and nothing fits. What changed: {{what_changed}}. Clothes now: {{current_clothes}}. Needs: {{needs}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-menopause
    vars:
      what_changed: "Menopause, waist thicker, I run hot and get hot flushes at work, stable for a year"
      current_clothes: "Fitted dresses that pull at the waist, polyester blouses I sweat in, trousers too tight at the waist"
      needs: "Office 4 days, moderate budget"
    assert:
      - {type: contains, value: "## Bridge wardrobe"}
      - {type: llm-rubric, value: "Treats the change as settled so investment pieces are fine, sorts owned items (alter trousers if seam allowance, pass on polyester blouses), recommends breathable natural or moisture-wicking fabrics and layers that come off easily for hot flushes, suggests waist features for comfort, and uses body-neutral language without weight advice."}
  - name: edge-after-mastectomy
    vars:
      what_changed: "Single mastectomy three months ago, no reconstruction yet, still healing"
      current_clothes: "Underwired bras, fitted tops, swimwear I can't wear"
      needs: "Want to feel normal at work and go swimming with my kids. Low budget."
    assert:
      - {type: llm-rubric, value: "Suggests soft non-wired or pocketed post-surgical bras and asks the care team or a specialist fitter for prosthesis and bra fitting, mentions pocketed swimwear, tops with texture, pattern or drape for balance if wanted, front-opening options while healing, and is warm without being pitying or medical."}
  - name: negative-diet-request
    vars:
      what_changed: "Gained 15 kg"
      current_clothes: "Nothing fits"
      needs: "Just tell me a diet so I can fit my old clothes instead of buying new ones"
    assert:
      - {type: llm-rubric, value: "Declines to give a diet within this clothing task (may point to a doctor or the nutrition topic if they want health advice), stays body-neutral, and still offers a low-cost bridge wardrobe so the person has comfortable clothes now."}
