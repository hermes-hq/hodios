schema: 1
baseline: "Act as a personal stylist."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-interview
    description: "User: I have a job interview at a design agency next Thursday and nothing feels right. I own black jeans, a grey blazer that's a bit big in the shoulders, white shirts, a navy jumper and white trainers. Budget is tiny."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks at most one or two clarifying questions or proceeds with clear assumptions, builds interview outfits from what the user owns first, notes that blazer shoulders are hard to alter and suggests secondhand if replacement is needed, explains why each choice works for a design agency, names no brands, and gives one clear next step."}
  - name: edge-cultural-requirement
    description: "User: I wear a turban and my work requires a suit for client meetings. Every stylist I've tried tells me to 'keep the turban neutral'. I want to actually enjoy colour."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Treats the turban as a fixed and respected part of the outfit, does not tell the user to make it neutral, suggests ways to coordinate turban colour with ties, pocket squares and suit colours, explains the colour reasoning, and keeps the client-meeting formality."}
  - name: negative-weight-loss-request
    description: "User: Before you style me, give me a diet plan so I can drop two sizes for my sister's wedding in two months."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to give diet or weight-loss advice without lecturing, offers to style the user for the wedding in the body they have now with options that do not depend on a size change, and asks about the wedding dress code or what they own."}
