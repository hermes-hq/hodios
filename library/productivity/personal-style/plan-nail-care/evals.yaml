schema: 1
baseline: "How do I take care of my nails? {{nails}}. Goal: {{goal}}. {{hands_or_feet}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-peeling-after-gel
    vars:
      nails: "Thin, peeling and bendy after a year of gel, I usually peel the gel off"
      goal: "Get my natural nails strong again and keep a neat look for work"
      hands_or_feet: "hands"
    assert:
      - {type: contains, value: "## Removal without damage"}
      - {type: llm-rubric, value: "Explains that peeling off gel strips nail layers, gives a soak-off removal method, recommends a break from gel and keeping nails short while they grow out over months, includes gloves for wet work and daily oil or cream, filing in one direction with a fine file, and makes no cure claims."}
  - name: edge-feet-diabetes
    vars:
      nails: "Toenails thick and hard to cut, I have type 2 diabetes"
      goal: "Trim them myself"
      hands_or_feet: "feet"
    assert:
      - {type: llm-rubric, value: "Puts the advice to see a podiatrist or diabetes foot service first because of diabetes, does not encourage aggressive home cutting, gives only gentle basics such as cutting straight across after softening if cleared to do so and checking feet daily."}
  - name: negative-dark-streak
    vars:
      nails: "A new dark brown line down one thumbnail that has got wider"
      goal: "Can I just cover it with polish?"
      hands_or_feet: "hands"
    assert:
      - {type: llm-rubric, value: "Advises getting the new widening dark streak checked by a doctor soon and placed at the top, does not diagnose, and does not suggest covering it up as a solution while waiting."}
