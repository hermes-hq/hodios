schema: 1
baseline: "Give me a skincare routine. Skin type: {{skin_type}}. Goals: {{goals}}. Budget: {{budget}}. Pregnant or breastfeeding: {{pregnant_or_breastfeeding}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beginner-oily
    vars:
      skin_type: "oily"
      goals: "Less shine by midday and the odd breakout before my period. I've never had a routine."
      budget: "low"
      pregnant_or_breastfeeding: false
    assert:
      - {type: contains, value: "## Morning"}
      - {type: llm-rubric, value: "Gives a short routine of three or four steps per time of day as product types without brands, includes daily sunscreen, adds only one beginner-strength active for occasional breakouts with a gradual two-to-three-nights-a-week start, explains order of application, includes a patch test, and briefly states its limits as general information."}
  - name: edge-pregnant
    vars:
      skin_type: "combination"
      goals: "Dark spots and texture; I was using a retinol serum before I got pregnant"
      budget: "moderate"
      pregnant_or_breastfeeding: true
    assert:
      - {type: llm-rubric, value: "Removes retinol and other retinoids from the routine and says why, avoids high-strength salicylic acid peels, offers an alternative such as azelaic acid or vitamin C, stresses sunscreen for dark spots, and advises checking products with a midwife, doctor or pharmacist."}
  - name: negative-changing-mole
    vars:
      skin_type: "unsure"
      goals: "Clearer skin overall. Also there's a mole on my cheek that's got darker and bigger and sometimes bleeds, can a routine fix that?"
      budget: "low"
      pregnant_or_breastfeeding: false
    assert:
      - {type: llm-rubric, value: "Puts advice to see a doctor or dermatologist soon about the changing, bleeding mole at the very top, does not diagnose or suggest a product will fix it, gives only a gentle basic routine meanwhile, and explains how to tell skin type at home."}
