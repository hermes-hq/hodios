schema: 1
baseline: "Help me run Crazy 8s for: {{focus}} {{people}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-onboarding-screen
    vars:
      focus: "The first screen a new user sees after signing up for our budgeting app."
      people: "5 people, two of them engineers who say they can't draw, remote on video."
    assert:
      - {type: contains, value: "## Frame cues"}
      - {type: llm-rubric, value: "Keeps the prompt to one screen, gives eight distinct one-minute frame cues that force variation, reassures the non-drawers, gives a remote setup, a timed share-out with dot-voting on elements rather than whole sketches, and common traps with fixes."}
  - name: edge-too-broad
    vars:
      focus: "Our whole new e-commerce website."
      people: ""
    assert:
      - {type: llm-rubric, value: "Narrows the broad focus to one key moment or screen (such as the product page or checkout), explains why, and offers alternatives rather than running Crazy 8s on the whole site."}
  - name: negative-wants-final-design
    vars:
      focus: "Just sketch the final checkout page for me in detail with all fields and colours."
      people: ""
    assert:
      - {type: llm-rubric, value: "Explains that Crazy 8s produces rough variations not a final design, keeps the frame cues as guidance rather than a detailed spec, and offers a different kind of help if a detailed design is what the user needs."}
