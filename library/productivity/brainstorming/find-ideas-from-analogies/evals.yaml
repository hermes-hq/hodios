schema: 1
baseline: "Use analogies from other fields to give me ideas for this problem: {{problem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-clinic-no-shows
    vars:
      problem: "Our community physiotherapy clinic has a 20% no-show rate. We already send SMS reminders 24 hours before. Missed slots can't easily be refilled at short notice. We can't charge no-show fees because many patients are on low incomes."
    assert:
      - {type: contains, value: "## Where the analogies break"}
      - {type: llm-rubric, value: "Abstracts the problem structurally (for example committing people to scarce time slots, or refilling perishable capacity at short notice), draws analogies from at least four areas including nature, another industry such as airlines or restaurants, history and a wildcard, explains each mechanism, adapts them into concrete clinic ideas that respect the no-fee and low-income constraint, does not just repeat SMS reminders, notes where analogies break (for example overbooking risks patient care), and gives a cheap test for each shortlisted idea."}
  - name: edge-abstract-personal-problem
    vars:
      problem: "Our family of five keeps fighting over chores. We've tried a chore chart on the fridge, it lasted a week."
    assert:
      - {type: llm-rubric, value: "Abstracts the problem (fairly sharing unwanted work in a small group, sustaining participation), finds analogies such as rotating duty rosters, game mechanics or how sports teams assign roles, adapts them to a family, explains why each differs from the failed chart, and suggests small tests."}
  - name: negative-too-vague
    vars:
      problem: "innovation"
    assert:
      - {type: llm-rubric, value: "Asks up to two questions about the actual problem, who has it and the constraints, and stops instead of generating generic analogies."}
