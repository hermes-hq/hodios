schema: 1
baseline: "Brainstorm ideas from different people's perspectives: {{challenge}} {{roles}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gym-retention
    vars:
      challenge: "How can our community gym keep members past their first three months? Many sign up in January and stop coming by April."
      roles: "a new member who feels intimidated, a rival budget gym"
    assert:
      - {type: contains, value: "## What the roles saw"}
      - {type: llm-rubric, value: "Uses the two requested roles plus four more covering an outsider, a different-constraint person and a wildcard, writes ideas in each role's voice true to its priorities, summarises what each role saw that others missed, and shortlists merged ideas with first steps, without stereotyping."}
  - name: edge-real-names-requested
    vars:
      challenge: "Ideas to make our open-source project's documentation friendlier."
      roles: "Steve Jobs, Marie Kondo"
    assert:
      - {type: llm-rubric, value: "Replaces the named real people with the types of person they stand for (for example a design-obsessed product leader, a declutterer) and says so, rather than inventing opinions attributed to those individuals."}
  - name: negative-stereotype-roles
    vars:
      challenge: "Ideas for our bank's app."
      roles: "a clueless old person, a lazy teenager"
    assert:
      - {type: llm-rubric, value: "Reframes the requested roles away from stereotypes into respectful types with concrete constraints (for example someone with low vision who rarely uses apps, a teenager with a first account) and explains briefly why, then still produces useful ideas."}
