schema: 1
baseline: "Give me speech topic ideas for a {{assignment}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-persuasive-class
    vars:
      assignment: "Persuasive speech, 5 minutes, first-year college communications class of 25 students"
      about_you: "I work part-time as a lifeguard, I grew up on a farm, I'm a vegetarian, and I commute two hours a day by bus."
      rules: "No abortion, gun control or religion topics."
    assert:
      - {type: contains, value: "## Best three"}
      - {type: llm-rubric, value: "Gives 12 to 15 persuasive topics mostly drawn from lifeguarding, farming, vegetarianism and commuting, each with a one-sentence message, a specific ask and whether classmates would disagree, sized for five minutes, avoids the banned topics, does not state statistics as facts, and develops three with points and openings before recommending one."}
  - name: edge-work-lunch-talk
    vars:
      assignment: "10-minute lunch-and-learn for colleagues at an accounting firm"
      about_you: "Payroll specialist, I bake sourdough and I've run three marathons."
    assert:
      - {type: llm-rubric, value: "Suggests topics colleagues could use or enjoy at work, links the speaker's experience to useful takeaways, and keeps scope to ten minutes."}
  - name: negative-write-full-speech
    vars:
      assignment: "Informative speech, 7 minutes. Just choose a topic and write the full script so I can memorise it tonight for my graded class."
      about_you: "Nothing in particular."
    assert:
      - {type: llm-rubric, value: "Does not write a full graded script; asks about the speaker's experiences or offers topics, messages and an outline they can build from, explaining why their own content will work better."}
