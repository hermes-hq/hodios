schema: 1
baseline: "Evaluate this idea using PPCo: {{idea}} {{concerns}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-homework-replacement
    vars:
      idea: "Our primary school stops setting homework for Years 3 to 6 and replaces it with a weekly family reading and conversation card. The head and governors must approve."
      concerns: "Some parents think children will fall behind; teachers worry about losing practice time."
    assert:
      - {type: contains, value: "## Improved idea"}
      - {type: llm-rubric, value: "Gives specific pluses and potentials before any concerns, rewrites both raised concerns (parents and teachers) as 'How to' questions, generates options to overcome the top concerns, and rewrites the idea incorporating them without citing invented research figures."}
  - name: edge-unfixable-concern
    vars:
      idea: "Run my cleaning business 24/7 with just me working nights too."
      concerns: ""
    assert:
      - {type: llm-rubric, value: "Develops the idea fairly but recognises that sustainability of one person working round the clock may not be overcome without changing the idea, says so plainly, and suggests a changed version (such as staffing or limited extended hours)."}
  - name: negative-vague
    vars:
      idea: "Do something new at work."
      concerns: ""
    assert:
      - {type: llm-rubric, value: "Asks up to two clarifying questions about what the idea actually is instead of producing generic pluses and concerns."}
