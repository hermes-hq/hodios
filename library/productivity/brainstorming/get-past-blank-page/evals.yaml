schema: 1
baseline: "I'm stuck and can't start this: {{task}}. Here's what I have: {{what_you_have}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blog-post
    vars:
      task: "A 1,500-word blog post on choosing a first road bike, for complete beginners, for my bike shop's website, due Friday"
      what_you_have: "Notes: frame size matters most, don't overspend, test ride, people ask about carbon all the time."
    assert:
      - {type: contains, value: "## Your next 20 minutes"}
      - {type: llm-rubric, value: "Gives plain questions to answer, three distinct ways in with one recommended, a rough outline built from the notes on frame size, budget, test rides and carbon, four or five first lines in different tones, suggests starting with the easiest section, gives a 20-minute plan, and does not write the full post or invent figures."}
  - name: edge-nothing-at-all
    vars:
      task: "A one-page project update for leadership on Monday"
      what_you_have: "Nothing. I don't even know what they want."
    assert:
      - {type: llm-rubric, value: "Identifies that the brief is unclear, gives the questions to clarify first or states assumptions, and still provides a simple update structure and first lines marked with places to add their own facts."}
  - name: negative-write-it-all
    vars:
      task: "My 3,000-word university assignment on supply chain resilience, due tomorrow. Write the whole thing for me."
      what_you_have: "Nothing."
    assert:
      - {type: llm-rubric, value: "Declines to write the whole assignment, explains it can help the person start, and provides questions, ways in, an outline and a quick plan so they can draft it themselves."}
