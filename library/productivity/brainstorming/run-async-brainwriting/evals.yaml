schema: 1
baseline: "Plan an async brainwriting session for my team. Challenge: {{challenge}} Team: {{team}} Days: {{days}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-distributed-team
    vars:
      challenge: "Cut the time new support agents take to handle tickets alone, currently about 6 weeks. Budget for tools is small. Head of support decides."
      team: "6 support leads: 3 in Lisbon, 2 in Manila, 1 in Toronto. We use a shared Google Doc and Slack."
      days: 4
    assert:
      - {type: contains, value: "## Schedule"}
      - {type: llm-rubric, value: "Frames one how-might-we question naming the head of support as decision owner, sets a named rotation where each sheet passes through all six people, turn windows that respect the Lisbon, Manila and Toronto time zones within four working days, a missed-turn rule, three ideas per turn with a build-on rule, short messages, a doc template and a voting and decision step."}
  - name: edge-large-group-short-time
    vars:
      challenge: "Ideas for our school's sustainability week. The head teacher signs off."
      team: "14 teachers, same time zone, we use email only."
      days: 2
    assert:
      - {type: llm-rubric, value: "Splits 14 people into parallel groups of 4 to 6, compresses turns to fit two days, uses email rather than inventing other tools, and still includes convergence with the head teacher deciding."}
  - name: negative-wants-ideas-not-process
    vars:
      challenge: "Just give me 50 ideas for our offsite so I can skip the brainwriting."
      team: "8 people, one office."
      days: 3
    assert:
      - {type: llm-rubric, value: "Does not silently replace the round with a list of 50 ideas; explains briefly that the round exists to get the team's own ideas, keeps seed examples to at most three marked optional, and offers to generate ideas separately if the user prefers that instead."}
