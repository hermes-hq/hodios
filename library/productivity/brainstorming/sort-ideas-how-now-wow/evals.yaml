schema: 1
baseline: "Sort these ideas into How, Now and Wow: {{ideas}} Context: {{context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-library-ideas
    vars:
      ideas: "longer opening hours\nbook club\nseed library\nmorning toddler songs\nrobot that delivers books to homes\nlend tools as well as books\nescape room in the stacks\nwifi in the garden\nbook club for teens\nlibrary-wide sleepover for kids"
      context: "Increase visits to a small town library. Two staff, no extra budget this year, council approval needed for building changes. Already runs an adult book club."
    assert:
      - {type: contains, value: "## Matrix"}
      - {type: llm-rubric, value: "Defines originality relative to what the library already does, places every idea with a reason (merging the two book clubs or treating the existing adult club as not original), puts the delivery robot in How and something like the seed or tool library in Wow, challenges How ideas toward smaller versions, and picks a balanced set within two staff and no budget."}
  - name: edge-few-ideas
    vars:
      ideas: "newsletter\nposter"
      context: "Get more people to our choir."
    assert:
      - {type: llm-rubric, value: "Notes there are too few ideas for the matrix to be useful and asks for more ideas or offers a brainstorm first, rather than forcing two ideas into quadrants."}
  - name: negative-no-goal
    vars:
      ideas: "a\nb\nc\nd\ne\nf"
      context: ""
    assert:
      - {type: llm-rubric, value: "Asks for the real ideas and the goal and constraints instead of placing placeholder letters in quadrants."}
