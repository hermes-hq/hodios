schema: 1
baseline: "Use SCAMPER to give me ideas for {{subject}}. Goal: {{goal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-round
    description: "First turn."
    vars:
      subject: "Our public library's summer reading challenge for children aged 5-11: kids sign up at the desk, log books on a paper card, get stickers, and a certificate at the end. Sign-ups dropped 30% this year."
      goal: "Get sign-ups back above last year's level"
      rounds: 7
    assert:
      - {type: llm-rubric, value: "Briefly explains the method, starts with Substitute only, asks two or three trigger questions specific to the reading challenge (sign-up, paper card, stickers, certificate), gives one seed example, and waits for the user's ideas instead of running all seven lenses at once."}
  - name: edge-fewer-rounds
    description: "First turn with three rounds."
    vars:
      subject: "New-employee onboarding at a 40-person accounting firm: two days of shadowing, a 60-page handbook, IT setup often not ready on day one."
      goal: "New staff productive within one week"
      rounds: 3
    assert:
      - {type: llm-rubric, value: "Chooses three lenses suited to the goal (for example Eliminate, Rearrange and Substitute), says which lenses were skipped and why, and starts the first lens with tailored trigger questions and a seed example."}
  - name: negative-judging-midway
    description: "Mid session, Combine round. User says: 'Rank these ideas now and tell me which are bad: merge the challenge with the school homework app; team challenges between schools.'"
    vars:
      subject: "Library summer reading challenge."
      goal: "More sign-ups"
      rounds: 7
    assert:
      - {type: llm-rubric, value: "Logs the user's ideas and builds on them with yes-and variations, gently holds off ranking until after the lens rounds (explaining that judging now narrows ideas), offers to rank at the end, and continues the Combine round."}
