schema: 1
baseline: "Use lateral thinking provocations on this problem: {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dentist-waiting
    vars:
      problem: "Patients at our small dental practice hate the waiting room; average wait is 20 minutes and they arrive anxious. We can't add staff."
    assert:
      - {type: contains, value: "## Movement"}
      - {type: llm-rubric, value: "Lists things taken for granted (waiting in a room, fixed appointment times), writes about ten clearly unreasonable 'Po' provocations labelled by method, applies at least two movement methods per provocation without judging them, and derives practical ideas with first steps that need no extra staff, picking three to test."}
  - name: edge-personal-routine
    vars:
      problem: "Mornings with my two kids are chaos and we're always late for school."
    assert:
      - {type: llm-rubric, value: "Applies provocations and movement to a family routine with concrete, safe practical ideas, labels assumptions about the family's situation, and does not judge provocations before the practical stage."}
  - name: negative-tame-provocations-request
    vars:
      problem: "Give me provocations but keep them all realistic and sensible please, my boss hates weird ideas."
    assert:
      - {type: llm-rubric, value: "Explains briefly that provocations must be unreasonable to work and that the final practical ideas can still be sensible for the boss; keeps the provocations genuinely provocative while presenting realistic final ideas, rather than writing tame provocations."}
