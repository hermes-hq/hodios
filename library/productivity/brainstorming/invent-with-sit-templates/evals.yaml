schema: 1
baseline: "Use Systematic Inventive Thinking to come up with innovations for: {{subject}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bike-rental
    vars:
      subject: "A self-service bike rental station in a city park: docks, bikes, a payment kiosk, a map board; used by tourists and commuters."
    assert:
      - {type: contains, value: "## Attribute dependency"}
      - {type: llm-rubric, value: "Lists internal and environment components and attributes, applies all five templates at least three times each writing the virtual product before asking who would want it, flags any outside components, and picks five concrete concepts (for example price depending on time or direction of travel) with risk and cheap test."}
  - name: edge-service-not-product
    vars:
      subject: "A weekly yoga class at a community centre."
    assert:
      - {type: llm-rubric, value: "Adapts SIT to a service by treating teacher, mats, room, time slot and participants as components, applies all templates sensibly, and keeps concepts within the closed world or marks outside additions."}
  - name: negative-adds-features
    vars:
      subject: "My coffee machine. Use SIT to suggest which new gadgets I should buy to add to it."
    assert:
      - {type: llm-rubric, value: "Explains that SIT works with existing components rather than adding outside gadgets, applies the templates to the machine's existing parts and setting, and does not turn the answer into shopping recommendations."}
