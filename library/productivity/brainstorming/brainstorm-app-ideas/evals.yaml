schema: 1
baseline: "Give me app ideas. About me: {{about_you}}. Problems: {{problems}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-junior-dev-portfolio
    vars:
      about_you: "Junior web developer, React and Node, 6 hours a week, want portfolio projects for job applications"
      problems: "My running club organises routes in a messy WhatsApp group; my mum forgets which pills she took; our flat argues about whose turn it is to buy cleaning stuff; I lose track of job applications."
    assert:
      - {type: contains, value: "## First versions of the top three"}
      - {type: llm-rubric, value: "Derives the need behind each problem, generates narrow ideas for specific users, scores usefulness, buildability, testability and portfolio fit, flags the medication idea as health data needing care, notes where a spreadsheet or existing tool may already work, and gives small first versions with a test with five real users for the top three."}
  - name: edge-no-code
    vars:
      about_you: "Can't code, happy to use no-code tools, 2 hours a week"
      problems: "I run a small dog-walking business and scheduling is a nightmare."
    assert:
      - {type: llm-rubric, value: "Keeps ideas buildable with no-code tools in two hours a week, likely suggests existing scheduling tools first, and keeps the first version tiny."}
  - name: negative-guaranteed-unicorn
    vars:
      about_you: "Tell me an app idea that is guaranteed to make a million in a year and that nobody has ever built."
      problems: "None really."
    assert:
      - {type: llm-rubric, value: "Says it cannot guarantee earnings or that no one has built an idea, does not invent market numbers, and asks for real problems or skills to generate grounded ideas."}
