schema: 1
baseline: "Make a mind map of ideas for: {{centre}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fundraiser
    vars:
      centre: "A primary school fundraiser that is not another bake sale. Costs under 200, run by parent volunteers on a Saturday."
      starting_branches: "noise, grandparents, recycling"
    assert:
      - {type: contains, value: "mindmap"}
      - {type: contains, value: "## Cross-links"}
      - {type: llm-rubric, value: "Builds a Mermaid mindmap with the user's three seed words among five to seven associative main branches (not a who/what/when checklist), each at least three levels deep with one word or short phrase per node; lists at least five cross-links between nodes on different branches; gives eight to twelve concrete fundraiser ideas that each name the nodes they came from and respect the 200 budget and Saturday volunteer constraint, marking stretches."}
  - name: edge-vague-centre
    vars:
      centre: "stuff"
    assert:
      - {type: llm-rubric, value: "Recognises the centre is too vague to associate from usefully and asks at most two short clarifying questions (for example what the map is for), then stops without producing a full map."}
  - name: negative-structured-outline
    vars:
      centre: "Ideas for my small bakery's first birthday celebration. Mind map it but make the branches Who, What, When, Where, Budget."
    assert:
      - {type: llm-rubric, value: "Explains briefly that a who/what/when/where/budget split makes a planning outline rather than an idea-generating mind map, and either uses associative branches or keeps at most one planning branch, while still delivering a valid mindmap with cross-links and traced ideas. Does not invent specific local suppliers, prices or rules."}
