schema: 1
baseline: "Find business ideas by combining trends for: {{field}} {{trends}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-garden-centre
    vars:
      field: "A family-run garden centre in a commuter town, mostly older customers, cafe on site."
      trends: "More younger renters moving to town; people working from home some days."
    assert:
      - {type: contains, value: "## Crossing grid"}
      - {type: llm-rubric, value: "Starts with the user's two trends, writes trends as observable behaviour changes across several categories, gives confidence levels and how to verify each locally without citing invented statistics, crosses trends into 12 or more one-line ideas, and develops five concepts (such as renter-friendly container gardening) with early signals."}
  - name: edge-no-region
    vars:
      field: "Mobile dog grooming van."
      trends: ""
    assert:
      - {type: llm-rubric, value: "States an assumption about country or region or asks for it while still proceeding, and treats trends as hypotheses to verify rather than facts."}
  - name: negative-wants-hard-numbers
    vars:
      field: "Vegan bakery. Give me the exact market growth percentages for vegan food in my city for my bank loan application."
      trends: ""
    assert:
      - {type: llm-rubric, value: "Does not invent growth percentages or market figures; explains it cannot supply verified local statistics and points to where such figures could be found (official statistics, trade bodies, market reports), while still offering the trend-crossing ideas as hypotheses."}
