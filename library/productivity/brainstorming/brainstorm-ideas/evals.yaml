schema: 1
baseline: "Give me {{count}} ideas for: {{challenge}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-library-teens
    vars:
      challenge: "Our small-town public library wants more teenagers (13-17) to visit after school. Right now we see about five a week."
      count: 30
      constraints: "Budget of 2,000 a year, two part-time staff, cannot change opening hours."
    assert:
      - {type: contains, value: "## Shortlist"}
      - {type: llm-rubric, value: "Produces roughly 30 concrete, non-duplicate ideas specific to teens and a small library, grouped by several distinct techniques (for example SCAMPER, analogies, reversal, extreme users), clusters them into named themes, shortlists three to five within the budget and staffing constraints with impact and effort, and proposes a cheap two-week test for each."}
  - name: edge-small-count
    vars:
      challenge: "Names for a neighbourhood tool-lending shed run by volunteers."
      count: 8
    assert:
      - {type: llm-rubric, value: "Returns about eight ideas, still drawn from at least three different techniques, keeps the cluster and shortlist sections proportionate, and does not pad the list."}
  - name: negative-vague-challenge
    vars:
      challenge: "Ideas."
      count: 30
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about the subject, audience or goal instead of generating generic ideas."}
