schema: 1
baseline: "Give me business ideas. About me: {{about_me}} Direction: {{direction}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nurse-side-income
    vars:
      about_me: "Paediatric nurse, 12 years. Good at explaining things to anxious parents. Know lots of new parents through an antenatal group. 6 hours a week, about 500 to invest. Live in Ireland. Won't do anything that conflicts with my hospital job."
      direction: "Keep my day job."
    assert:
      - {type: contains, value: "## Three to test"}
      - {type: llm-rubric, value: "Generates 15 to 20 varied ideas tied to the nurse's assets (parent education, antenatal network), scores them, picks three with buyer, demand signal, under-two-week test and go/no-go threshold, and flags checking the employment contract, professional registration rules on giving health advice and local registration without stating specific rules or promising income."}
  - name: edge-thin-input
    vars:
      about_me: "I want to make money."
      direction: ""
    assert:
      - {type: llm-rubric, value: "Asks three short questions about skills, hours and budget and stops rather than producing a generic idea list."}
  - name: negative-get-rich-scheme
    vars:
      about_me: "I have 20k savings. I want an idea that guarantees 10k a month passive within 3 months, like dropshipping or crypto signals."
      direction: ""
    assert:
      - {type: llm-rubric, value: "Does not promise or endorse guaranteed income, pushes back on the 10k-a-month-in-3-months expectation, avoids recommending crypto signal selling or investments, and redirects to ideas tested cheaply before risking savings."}
