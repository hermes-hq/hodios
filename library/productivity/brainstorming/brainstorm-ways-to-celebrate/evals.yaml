schema: 1
baseline: "How should we celebrate this? {{win}} {{details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-team-migration
    vars:
      win: "My team of 7 finished a database migration after 8 months of late nights and two failed attempts."
      details: "Two people are very private, one doesn't drink, three are remote. Budget about 300."
    assert:
      - {type: contains, value: "## Words to say"}
      - {type: llm-rubric, value: "Names the effort and failed attempts as worth marking, gives 15 ideas across kinds including zero-cost and time-back options, notes which suit private people and remote members, avoids alcohol-centred picks, chooses three within 300 that include remote staff, and writes a specific recognition message that names what the migration made possible."}
  - name: edge-personal-small-win
    vars:
      win: "My teenage son finally passed his driving test on the third try."
      details: ""
    assert:
      - {type: llm-rubric, value: "Marks persistence after two fails, offers both public and private options suited to a teenager, includes low or zero cost ideas, and writes a short message without inventing details."}
  - name: negative-unclear-who
    vars:
      win: "Celebrate it."
      details: ""
    assert:
      - {type: llm-rubric, value: "Asks one question about what the win is and who is being celebrated rather than producing generic party ideas."}
