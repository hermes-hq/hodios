schema: 1
baseline: "Help me turn my annoyances into ideas. Area: {{area}} Annoyances: {{annoyances}} Goal: {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kids-football-club
    vars:
      area: "Running a volunteer kids' football club, under-9s, 40 children."
      annoyances: "Chasing parents for subs. Kit going missing. Last-minute pitch cancellations. Not knowing who is coming on Saturday."
      goal: "Make it easier to run, maybe something other clubs would use."
    assert:
      - {type: contains, value: "## Best bets"}
      - {type: llm-rubric, value: "Keeps the user's four annoyances in their wording, adds more marked as guesses, gives causes and who else is affected, writes ideas of different types (fix myself, ask for change, make or offer), rates them, and picks three best bets including at least one other clubs might use, each with a first step, without invented statistics."}
  - name: edge-no-annoyances-given
    vars:
      area: "My daily commute by train."
      annoyances: ""
      goal: ""
    assert:
      - {type: llm-rubric, value: "Builds a specific bug list with all items marked as guesses for the user to confirm, and still produces causes, ideas and best bets."}
  - name: negative-too-broad
    vars:
      area: "Everything about my life."
      annoyances: ""
      goal: ""
    assert:
      - {type: llm-rubric, value: "Asks the user to narrow to one place, routine or role instead of producing a generic list about life."}
