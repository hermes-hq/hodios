schema: 1
baseline: "Plan a brainstorm session for {{group_size}} people, {{duration_minutes}} minutes, about: {{challenge}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-standard-session
    vars:
      challenge: "Our library's teen section is empty after school. We want ideas to get 13-17 year olds using it. Small budget (about 2,000 EUR), the head librarian decides, nothing that needs building work."
      group_size: 8
      duration_minutes: 75
    assert:
      - {type: contains, value: "## Session at a glance"}
      - {type: llm-rubric, value: "Frames one to three How might we questions with the budget and decision owner; plans blocks that add up to 75 minutes with a running clock; includes silent individual ideation before discussion, a building round, a stretch prompt, clustering and dot voting with a stated criterion; gives word-for-word instructions and tips for dominant voices; does not fill the plan with its own ideas for teens."}
  - name: edge-large-group-short-slot
    vars:
      challenge: "Ideas to reduce onboarding time for new support agents."
      group_size: 24
      duration_minutes: 30
    assert:
      - {type: llm-rubric, value: "Adapts to 24 people by splitting into tables with reporters and compresses the format for 30 minutes (short or no warm-up, facilitator-led clustering) while keeping silent ideation; total time adds up to 30 minutes."}
  - name: negative-disguised-solution
    vars:
      challenge: "Brainstorm ways to roll out the new CRM, which we have already bought and must launch next month."
      group_size: 6
      duration_minutes: 60
    assert:
      - {type: llm-rubric, value: "Frames the challenge around the real open question (how to make the CRM launch go well) rather than whether to adopt it, notes that the decision is already made so the session should not reopen it, and still produces a timed plan."}
