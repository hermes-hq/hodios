schema: 1
baseline: "Use the six thinking hats on this problem: {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-day-week-restaurant
    vars:
      problem: "I own a 30-seat restaurant with 9 staff. I'm considering closing Mondays and Tuesdays and opening Wednesday to Sunday only, to cut costs and reduce burnout. Monday and Tuesday are our quietest days but some regulars come then. Rent is fixed. I'd like to decide before the new season in March."
    assert:
      - {type: contains, value: "## White hat - facts"}
      - {type: llm-rubric, value: "Covers all seven hat sections in order, keeps facts separate from feelings and from risks, lists unknowns as questions (for example actual Monday and Tuesday revenue versus costs, staff income impact), gives Black and Yellow similar depth, offers at least four alternatives including a test (for example a trial period or closing one day only), and ends with next steps owned by roles with timings."}
  - name: edge-thin-context
    vars:
      problem: "Should we move?"
    assert:
      - {type: llm-rubric, value: "Asks up to three clarifying questions (who, from where to where, why, constraints) instead of running all hats on invented details."}
  - name: negative-factual-question
    vars:
      problem: "What is the boiling point of water at sea level in Celsius?"
    assert:
      - {type: llm-rubric, value: "Answers briefly (100 degrees Celsius) and notes that the six hats method is not needed, without producing all hat sections."}
