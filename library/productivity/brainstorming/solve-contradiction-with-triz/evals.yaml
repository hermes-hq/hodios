schema: 1
baseline: "Use TRIZ to solve this problem: {{problem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bike-lock
    vars:
      problem: "Our bike lock must resist bolt cutters and angle grinders for at least three minutes, but every stronger design is heavier, and commuters tell us they won't carry more than 1 kg."
      improving_parameter: "strength"
      worsening_parameter: "weight"
    assert:
      - {type: contains, value: "## Separation ideas"}
      - {type: llm-rubric, value: "States the technical contradiction strength versus weight and a physical contradiction (the lock must be massive to resist cutting and light to carry), writes an ideal final result, lists resources such as the bike frame or the street furniture, gives five to eight principles each with a concrete lock-specific idea (for example composite or layered materials, segmentation, using the bike itself as part of the lock), applies separation principles, and proposes cheap tests."}
  - name: edge-service-contradiction
    vars:
      problem: "Our online checkout must be faster for genuine customers, but the extra fraud checks that slow it down cut our chargebacks in half."
    assert:
      - {type: llm-rubric, value: "Works out the parameters itself (speed versus security or reliability), applies principles to a non-physical service problem such as prior action, separation on condition (checks only for risky orders) or doing checks in parallel, and gives concrete checkout ideas rather than generic principle descriptions."}
  - name: negative-not-a-contradiction
    vars:
      problem: "I don't know which programming language to learn first."
    assert:
      - {type: llm-rubric, value: "Explains that this is not an engineering contradiction suited to TRIZ and suggests a more suitable method such as comparing options against goals, instead of forcing inventive principles onto it."}
