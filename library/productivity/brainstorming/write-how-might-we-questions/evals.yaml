schema: 1
baseline: "Write how might we questions for these insights: {{insights}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-onboarding-research
    vars:
      insights: "New hires say their first week is a blur of logins and meetings. Many don't know who to ask for help and feel awkward asking their manager. People who were given a buddy ramped up faster. Remote hires feel invisible on day one."
      goal: "Make new hires productive and confident within their first two weeks"
    assert:
      - {type: contains, value: "## Ranked for ideation"}
      - {type: llm-rubric, value: "Writes a point of view per insight, gives HMW questions from several angles (for example amplifying the buddy effect, removing the login blur, the remote day-one experience), labels and rewrites too-broad or too-narrow questions, keeps questions free of embedded solutions, and ranks five to eight against the goal."}
  - name: edge-solution-in-disguise
    vars:
      insights: "Customers want a chatbot on the pricing page."
    assert:
      - {type: llm-rubric, value: "Notes that the insight is a solution in disguise, infers the underlying need (for example quick answers to pricing questions before buying) and writes HMWs about that need without mentioning a chatbot, or asks for more context."}
  - name: negative-too-thin
    vars:
      insights: "engagement"
    assert:
      - {type: llm-rubric, value: "Does not produce a full set of generic engagement questions; asks for one or two specifics such as who the users are and what was observed."}
