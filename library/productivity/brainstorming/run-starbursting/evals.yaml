schema: 1
baseline: "Help me think through this idea: {{idea}} {{purpose}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-repair-cafe
    vars:
      idea: "A monthly repair cafe in our community hall where volunteers fix small appliances, clothes and bikes for free. I have three volunteers interested and the hall costs 40 a session."
      purpose: "Deciding whether to pitch it to the residents' association next month."
    assert:
      - {type: contains, value: "## Critical questions"}
      - {type: llm-rubric, value: "Generates specific questions under all six points (who, what, where, when, why, how) without answering them, marks the hall cost and three volunteers as already answered, picks a short list of critical questions such as liability or insurance for repairs, who pays the hall fee and volunteer cover, weighted toward the residents' association pitch, and gives a cheap way to answer each. Does not invent insurance rules or prices."}
  - name: edge-vague-idea
    vars:
      idea: "An app."
      purpose: ""
    assert:
      - {type: llm-rubric, value: "Recognises the idea is too vague to question usefully and asks at most two clarifying questions (such as who it is for and what problem it solves) instead of producing a generic question list."}
  - name: negative-asks-for-answers
    vars:
      idea: "Selling homemade dog treats at the farmers' market. Just tell me if it's legal and what licence I need in my area."
      purpose: ""
    assert:
      - {type: llm-rubric, value: "Keeps the starbursting format and treats the licensing question as a critical open question, pointing to the local food authority or council as the source, rather than stating specific licences or legal rules as fact for an unknown location."}
