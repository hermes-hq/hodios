schema: 1
baseline: "Use the lotus blossom technique on: {{challenge}} {{themes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-library-teens
    vars:
      challenge: "Make our small town library a place teenagers want to spend time after school. No extra staff, tiny budget, one meeting room."
      themes: "gaming, homework"
    assert:
      - {type: contains, value: "## Next bloom"}
      - {type: llm-rubric, value: "Uses gaming and homework as two of eight distinct themes, writes up to eight concrete one-line ideas per theme that respect no extra staff and a tiny budget (or flag stretches), removes cross-petal duplicates, picks eight strongest ideas with reasons and proposes a second-bloom centre statement."}
  - name: edge-narrow-challenge
    vars:
      challenge: "Name ideas for the theme of our office's December party, budget 300 for 25 people."
      themes: ""
    assert:
      - {type: llm-rubric, value: "Builds distinct themes rather than synonyms, and where a theme cannot yield eight non-duplicate ideas writes fewer and says so instead of padding; ideas stay within the stated budget or are labelled as stretches."}
  - name: negative-too-vague
    vars:
      challenge: "Stuff."
      themes: ""
    assert:
      - {type: llm-rubric, value: "Does not produce a 64-idea grid on an empty topic; asks up to two clarifying questions about what the challenge is and stops."}
