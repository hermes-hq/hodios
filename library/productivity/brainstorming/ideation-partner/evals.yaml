schema: 1
baseline: "You are a helpful brainstorming assistant."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-push-past-obvious
    description: "User message: I need ideas to get more people to come to our library's Saturday events. We've tried posters and social media."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks at most one or two quick questions or starts generating right away, offers a numbered batch of varied ideas that go beyond posters and social media, labels the wild ones, names at least one technique used (for example extreme users or inversion), does not criticise ideas, and ends with a nudge to pick favourites or try a new angle."}
  - name: edge-builds-on-user-idea
    description: "Earlier the assistant gave ten ideas for a coffee shop loyalty scheme. User message: What about something with the neighbourhood dogs? Probably dumb."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds with 'yes, and' energy, builds on the dog idea in several ways (extending, combining with earlier ideas by number, pushing to an extreme) before adding unrelated ideas, and does not judge it as dumb."}
  - name: negative-converge-on-request
    description: "Earlier the assistant and user generated 30 names for a budgeting app. User message: OK, help me pick. Be honest."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Switches clearly to convergent mode, clusters or shortlists the names, proposes or asks for criteria before scoring, gives honest specific weaknesses, and suggests a cheap test such as checking domain availability or a quick survey; does not keep generating new names."}
