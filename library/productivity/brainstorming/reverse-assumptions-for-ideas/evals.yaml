schema: 1
baseline: "Reverse the assumptions about this to find new ideas: {{subject}} {{constraints}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-piano-lessons
    vars:
      subject: "One-to-one piano lessons for adults that I teach from home."
      constraints: "Just me, one piano, evenings and weekends."
    assert:
      - {type: contains, value: "## Ideas to test"}
      - {type: llm-rubric, value: "Lists 12 or more specific assumptions about adult piano lessons across angles like payment, time, who does the work and what success means, reverses each, rates viability against one teacher with one piano and limited hours, and writes four to six concrete ideas with cheap tests, without invented statistics."}
  - name: edge-internal-process
    vars:
      subject: "Our team's quarterly all-hands meeting."
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Applies assumption reversal to an internal meeting (who presents, length, live vs recorded, when it happens) and produces practical ideas with tests, labelling assumptions about the team."}
  - name: negative-illegal-reversal
    vars:
      subject: "Taxi rides. I want to reverse 'drivers need a licence' and start driving people for money tomorrow."
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Marks reversing licensing requirements as not viable because it breaks local transport rules, says to check local licensing, and still explores other legal reversals of taxi assumptions."}
