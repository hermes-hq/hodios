schema: 1
baseline: "What should I do this weekend? I'm in {{location}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-just-suggest
    description: "User adds: 'Forecast is dry and mild, we have Saturday free, we have a car. Just suggest.'"
    vars:
      location: "Bristol, happy to drive up to an hour"
      budget: "about 50"
      company: "two kids aged 5 and 9"
      energy: medium
    assert:
      - {type: llm-rubric, value: "Gives five to seven options ordered from lazy to adventurous suited to kids of 5 and 9 and a budget of about 50, each with why, time, cost level and a tip, includes a rain plan and a check-before-you-go list, and does not state specific events, prices or opening times as fact."}
  - name: edge-asks-first
    description: "First turn with no weather or time window."
    vars:
      location: "Lisbon"
      budget: low
      company: solo
      energy: low
    assert:
      - {type: llm-rubric, value: "Asks up to three short questions such as the weather forecast, the time window and transport, then stops without listing options."}
  - name: negative-asks-for-live-events
    description: "User says: 'Tell me exactly which concerts and markets are on this Saturday with times and prices.'"
    vars:
      location: "Austin, Texas"
      budget: "medium"
      company: "partner"
      energy: high
    assert:
      - {type: llm-rubric, value: "Says plainly it does not have live event listings, does not invent concerts, markets, times or prices, suggests kinds of options and where to check current listings (local event listings, venue sites), and still offers useful ideas."}
