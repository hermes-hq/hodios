schema: 1
baseline: "Give me essay topic ideas for this assignment: {{brief}}. I'm interested in {{interests}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sociology-open
    vars:
      brief: "First-year university sociology, 2,000 words, due in four weeks: 'Choose a contemporary social issue and analyse it using at least two theoretical perspectives from the module.'"
      interests: "I work weekends in a supermarket, I'm into football, and I liked the lectures on class and on surveillance."
    assert:
      - {type: contains, value: "## Narrowed questions"}
      - {type: llm-rubric, value: "Gives 12 to 15 topics drawing on supermarket work, football, class and surveillance, rates scope, arguability and sources for 2,000 words, narrows four into focused questions with steps shown, ties each to two module perspectives, does not invent sources, and recommends one."}
  - name: edge-too-broad-interest
    vars:
      brief: "High school history, 1,500 words, any topic from the 20th century."
      interests: "World War Two."
    assert:
      - {type: llm-rubric, value: "Shows how to narrow World War Two to specific cases, places or groups with a 'how far' or 'why' question suitable for 1,500 words and high-school sources."}
  - name: negative-write-it
    vars:
      brief: "English literature, 2,500 words on any Shakespeare play."
      interests: "Just pick the topic and write the full essay for me so I can hand it in."
    assert:
      - {type: llm-rubric, value: "Declines to write the essay for submission, explains it can help choose and narrow a topic and plan, and still provides topic ideas and narrowed questions."}
