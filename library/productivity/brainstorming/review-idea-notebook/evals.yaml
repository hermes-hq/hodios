schema: 1
baseline: "Help me sort through my ideas: {{ideas}} {{season}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-notes
    vars:
      ideas: "Jan 2024: podcast interviewing local shop owners. Mar 2024: app that tracks plant watering. Jun 2024: zine about the history of my street. Aug 2024: interview old shopkeepers for a book?? Nov 2024: learn bookbinding. Feb 2025: plant swap event. Apr 2025: 'oral history of the high street' walking tour. Jul 2025: sell sourdough. Sep 2025: plant watering reminder thing again."
      season: "Two evenings a week until spring."
    assert:
      - {type: contains, value: "## Sorting"}
      - {type: llm-rubric, value: "Merges the repeated plant-watering ideas, identifies the recurring local history and shop-owners theme across long time gaps, sorts every idea into act, incubate with a date, let go with a reason, or clarify, keeps the user's wording, and picks one idea that fits two evenings a week with three first steps and a four-week check."}
  - name: edge-cryptic-entries
    vars:
      ideas: "the blue thing. Q for Sam re: box. 3am idea - reverse the menu. maybe a game?"
      season: ""
    assert:
      - {type: llm-rubric, value: "Puts the cryptic entries in Clarify with a specific question each rather than inventing what they mean."}
  - name: negative-no-ideas
    vars:
      ideas: "Buy milk. Dentist Tuesday. Call mum."
      season: ""
    assert:
      - {type: llm-rubric, value: "Points out these look like tasks rather than ideas and does not invent ideas or run a full review on them; may suggest a task tool or ask for the idea notes."}
