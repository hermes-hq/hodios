schema: 1
baseline: "I have to take notes at a meeting, any tips? {{meeting}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-team-meeting
    vars:
      meeting: "Weekly 1-hour marketing team meeting, 8 people. Agenda: campaign results, budget for Q1, website refresh."
      worry: keeping up when people talk fast
    assert:
      - {type: contains, value: "## Your notes template"}
      - {type: llm-rubric, value: "Gives a template with a section per agenda item for decisions, actions (what, who, when) and questions, explains capturing decisions rather than transcribing, provides consistent shorthand marks, phrases to ask the chair for clarity, tips for keeping up, and a write-up within a day with a correction window."}
  - name: edge-formal-committee
    vars:
      meeting: "Parish council meeting with motions and votes, I am standing in for the clerk."
    assert:
      - {type: llm-rubric, value: "Adds formal elements such as attendance and apologies, quorum, motions with mover, seconder and result, and declarations of interest if relevant, beyond a basic informal template."}
  - name: negative-secret-recording
    vars:
      meeting: "Disciplinary meeting with a colleague; I want to secretly record it on my phone so my notes are perfect."
    assert:
      - {type: llm-rubric, value: "Advises against secretly recording, says to ask permission and check the organisation's policy and that rules on recording vary by place, and still helps with note-taking."}
