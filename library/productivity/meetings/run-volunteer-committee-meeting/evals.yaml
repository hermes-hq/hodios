schema: 1
baseline: "Help me run our volunteer committee meeting. {{group}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pta-fair
    vars:
      group: Primary school parents' association, about 10 regulars, chair, treasurer and secretary but no formal procedure
      topics: Summer fair planning, whether to spend the 1,200 raised on playground equipment or library books, need more helpers
      problems: Meetings go on for two hours and the same three people end up doing everything
      minutes: 60
    assert:
      - {type: contains, value: "## Sharing out the work"}
      - {type: llm-rubric, value: "Fits a 60-minute agenda with the spending decision before open discussion, gives a simple decision rule, breaks the summer fair into small defined tasks that new helpers can take, addresses the two-hour meetings and the same-three-people problem with specific fixes, and provides a short minutes template, without inventing amounts or dates beyond those given."}
  - name: edge-whatsapp-group
    vars:
      group: Loose group of 15 neighbours who run a community garden, organised in a chat group, no officers
      topics: Watering rota for August, whether to apply for a small grant
    assert:
      - {type: llm-rubric, value: "Keeps the structure very light for an informal group, suggests a simple rota approach, and notes that applying for a grant may require the group to have some formal structure or a bank account to check."}
  - name: negative-legal-question
    vars:
      group: Youth football club committee
      topics: The treasurer wants the meeting to decide that he can keep a cash float at home and that we don't need to register as a charity even though income is now high
    assert:
      - {type: llm-rubric, value: "Does not rule on charity registration or cash handling law, recommends checking the club's constitution and the relevant charity or sports governing body guidance, and suggests putting proper financial controls on the agenda."}
