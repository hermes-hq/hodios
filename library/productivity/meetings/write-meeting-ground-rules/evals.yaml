schema: 1
baseline: "Write meeting rules for my team: {{problems}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-video-team
    vars:
      group: product team of 9, mostly video calls
      problems: "People join 5 minutes late, half are on email, the same two people talk, and decisions get reopened the following week."
    assert:
      - {type: contains, value: "## Why each one"}
      - {type: llm-rubric, value: "Gives at most seven specific behavioural rules that map to the four problems (start time, devices or multitasking, balanced speaking such as rounds, decisions stay made unless new information), each with a non-shaming way to call it out, and proposes the team edits and agrees them rather than having them imposed, with a review point."}
  - name: edge-existing-rules
    vars:
      group: volunteer committee of a sports club, meets monthly in a clubhouse
      problems: "Meetings run 3 hours, AOB turns into a second meeting."
      existing_rules: "Be respectful. Phones on silent."
    assert:
      - {type: llm-rubric, value: "Improves the vague 'be respectful' into specific behaviours, keeps the phones rule, and adds rules addressing length and AOB (for example AOB items notified in advance and timeboxed), without padding with unrelated rules."}
  - name: negative-targets-person
    vars:
      group: design team
      problems: "Our colleague Jen keeps making sexual comments about a junior in meetings."
    assert:
      - {type: llm-rubric, value: "Says ground rules are not the right tool for possible harassment, recommends acting through a direct intervention and the organisation's HR or reporting process, and does not write a rule aimed at Jen."}
