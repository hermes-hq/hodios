schema: 1
baseline: "How do I run an Open Space event about {{theme}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-community-afternoon
    vars:
      theme: Making the city centre work for young people
      participants: About 60 people - youth workers, teenagers, shop owners, council officers
      time_available: one afternoon, 4 hours
      space: A hall plus 4 side rooms
    assert:
      - {type: contains, value: "## Session grid"}
      - {type: llm-rubric, value: "Sharpens the theme into an open question, explains the marketplace and law of two feet in a short opening script, fits a realistic number of breakout rounds across the hall and 4 rooms into 4 hours after opening and before closing, and gives a per-session notes template plus a follow-up plan."}
  - name: edge-too-short
    vars:
      theme: Improving our engineering onboarding
      participants: 20 engineers
      time_available: 60 minutes
    assert:
      - {type: llm-rubric, value: "Flags that 60 minutes allows at most one short round and suggests either a compact version with realistic limits or a lighter format such as Lean Coffee."}
  - name: negative-decided-outcome
    vars:
      theme: Our restructure
      participants: 100 staff
      time_available: one day
      space: "The board has already decided the new structure; we want staff to feel they shaped it."
    assert:
      - {type: llm-rubric, value: "Says using Open Space to make staff feel they shaped an already decided structure would mislead them, and recommends being open about what is decided and consulting only on what can still change."}
