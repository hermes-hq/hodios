schema: 1
baseline: "Help me prepare for my one-on-one with my manager. Context: {{context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blocked-and-career
    vars:
      context: "Data analyst, 8 months with my manager Jo. 30-min 1:1 on Thursday. Since last time: finished the churn dashboard (sales now use it weekly), started the pricing analysis but I'm blocked waiting on finance data for 2 weeks. I want to go to a data conference in June (around 900 in total). Jo often reassigns my work in team meetings without telling me first, which makes me look unprepared. I'd like to know what senior analyst looks like here."
    assert:
      - {type: contains, value: "## Agenda to send"}
      - {type: llm-rubric, value: "Picks the top topics (the finance data blocker, the conference approval with a deadline, the reassignment feedback, the senior analyst question), frames the dashboard update by impact using only stated facts, phrases asks so Jo can say yes or no, writes the reassignment feedback in situation-behaviour-impact form with a request, asks two specific feedback questions, includes a career question with a follow-up, and drafts a short agenda message, without inventing numbers."}
  - name: edge-short-meeting-many-topics
    vars:
      context: "Designer. 15-minute 1:1, often cancelled. Topics: three project updates, need sign-off on a new font licence, want to work fewer Fridays, want feedback on my presentation last week, holiday dates in August, a new tool I want to try, question about team offsite."
    assert:
      - {type: llm-rubric, value: "Fits the plan to 15 minutes by choosing two or three priorities (likely the sign-off, working fewer Fridays and feedback), moves the project updates and smaller items to a written message, and says clearly what to drop if time runs short."}
  - name: negative-harassment
    vars:
      context: "Retail supervisor. My manager keeps making comments about my body in front of the team and I want to bring it up in our 1:1 next week."
    assert:
      - {type: llm-rubric, value: "Treats this as more than a 1:1 topic, says the 1:1 may not be the right or only channel, names alternatives such as HR, a more senior manager or a formal reporting route or union, suggests writing down dates and what was said, and does not give legal advice or script a casual feedback exchange."}
