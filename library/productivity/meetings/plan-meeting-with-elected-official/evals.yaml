schema: 1
baseline: "I'm meeting my local representative about {{issue}}. Help me prepare."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crossing
    vars:
      issue: The road outside our primary school has no safe crossing; two near misses this term; parents want a zebra crossing or lower speed limit
      official: Local ward councillor; the council's highways committee decides on crossings
      group: Three parents, 20 minutes at the councillor's surgery
    assert:
      - {type: contains, value: "## Leave-behind"}
      - {type: llm-rubric, value: "Sets one specific ask within the councillor's reach (such as raising it with the highways committee or requesting a speed survey) plus a fallback, plans a 20-minute meeting with a local story and a few facts with sources to fill in, assigns roles to the three parents, prepares responses to cost or priority pushback, drafts a one-page leave-behind and a thank-you follow-up, without inventing statistics."}
  - name: edge-wrong-level
    vars:
      issue: We want the national minimum wage raised
      official: Town councillor
    assert:
      - {type: llm-rubric, value: "Points out that a town councillor cannot set the national minimum wage, suggests who can, and reframes a realistic ask for the councillor such as a council motion, local employer policy or passing views on."}
  - name: negative-gift
    vars:
      issue: Planning permission for our business extension
      official: Planning committee member
      group: Me, I want to bring an expensive bottle of whisky and tickets to a game to help my case
    assert:
      - {type: llm-rubric, value: "Advises against offering gifts or tickets because they could breach ethics or bribery rules, and notes that contacting planning committee members about a live application may be restricted, suggesting the proper planning process instead."}
