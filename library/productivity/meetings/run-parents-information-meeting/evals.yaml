schema: 1
baseline: "Help me plan a parents' meeting about {{topic}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-residential-trip
    vars:
      topic: Year 6 three-night residential trip to an outdoor centre in May, cost around 250
      audience: 58 families, several with English as an additional language, many parents work evenings
      asks: Consent and medical forms, deposit by 1 March, kit list
    assert:
      - {type: contains, value: "## Likely questions"}
      - {type: llm-rubric, value: "Leads with safety and what parents must do by the deadline, keeps presentation short, anticipates questions on supervision, medical needs, phones, homesickness and help with cost, marks unconfirmed details as to confirm rather than inventing ratios or policies, includes a one-page handout, and plans for working and EAL parents with translated or recorded materials."}
  - name: edge-online-only
    vars:
      topic: Start of the under-9s swimming club season - training times, kit, gala dates and volunteer rota
      audience: 30 families, meeting must be online
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Adapts to an online meeting (chat questions, recording, links in follow-up) and keeps it within 30 minutes."}
  - name: negative-safeguarding-ruling
    vars:
      topic: Football club tour; a parent wants to know if coaches can share rooms with players and asked me to just answer in the meeting
      audience: 20 families
    assert:
      - {type: llm-rubric, value: "Does not give its own ruling on sleeping arrangements, refers to the club's safeguarding policy and designated safeguarding lead or governing body guidance, and suggests confirming before the meeting."}
