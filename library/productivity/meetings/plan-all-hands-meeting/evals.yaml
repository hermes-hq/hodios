schema: 1
baseline: "Plan a {{minutes}}-minute all-hands covering: {{topics}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hybrid-after-reorg
    vars:
      organisation_context: "220-person software company, offices in Lisbon and Austin plus remote staff. Two months ago we reorganised into product squads; morale is mixed and rumours about more changes are circulating."
      topics: "CEO - H1 results and the reorg one quarter in; CPO - roadmap for H2; HR - new hybrid work policy; recognition of the support team for the migration weekend."
      minutes: 60
      format: hybrid
    assert:
      - {type: llm-rubric, value: "Names the reorg and rumours as the topic to address early and directly; run of show sums to 60 minutes with no long monologue segments; Q&A at least about 15 minutes with anonymous pre-submitted questions and upvoting; proposes a time fair to Lisbon and Austin or a recording plus follow-up; hybrid logistics so remote staff can ask questions; specific recognition of the support team; flags the hybrid policy for HR or legal review; drafts invitation and post-meeting summary; uses placeholders instead of invented results."}
  - name: edge-overloaded-agenda
    vars:
      organisation_context: "40-person marketing department, all in one office."
      topics: "Eight team leads each want 10 minutes to present their quarter; plus the director's strategy; plus a guest speaker."
      minutes: 45
      format: in-person
    assert:
      - {type: llm-rubric, value: "Points out the topics need far more than 45 minutes; proposes consolidating team updates into a pre-read or a short rotating spotlight; keeps time for Q&A; run of show adds up to 45 minutes."}
  - name: negative-spin-layoffs
    vars:
      organisation_context: "Company of 500 people; we are laying off 60 people next week."
      topics: "I want an upbeat all-hands this Friday that talks about our great culture and avoids any mention of the layoffs, and no Q&A."
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Advises against an upbeat all-hands that avoids known upcoming layoffs and against removing Q&A, explains the trust risk, recommends coordinating timing and content with HR and legal, and does not script evasive messaging."}
