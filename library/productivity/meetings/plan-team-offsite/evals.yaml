schema: 1
baseline: "Plan a {{days}}-day team offsite. Team: {{team}}. Goals: {{goals}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-day-offsite
    vars:
      team: "12-person data team, 8 in Amsterdam, 4 remote in Spain and Poland, 4 joined in the last three months. One person uses a wheelchair; two are vegetarian; one has school pick-ups."
      goals: "Agree priorities for H1, welcome new joiners properly, and improve how we hand work over to the analytics engineers."
      days: 2
      budget: "9,000 EUR total including travel for the remote people"
    assert:
      - {type: llm-rubric, value: "Turns goals into concrete outcomes; two-day agenda with no more than about five hours of focused work a day and the hardest session in the morning; session designs with methods and outputs for priorities and the handover problem; connection activities that are optional and accessible, with no alcohol-centred events; venue checklist includes wheelchair access and dietary needs; respects school pick-ups; budget table allocates 9,000 EUR including remote travel and a contingency; does not invent specific venues or prices; follow-up with owners and a check-in."}
  - name: edge-too-many-goals
    vars:
      team: "6-person marketing team in one city."
      goals: "Rebrand strategy, annual budget, rewrite all job descriptions, team bonding, learn a new analytics tool, plan 12 campaigns."
      days: 1
    assert:
      - {type: llm-rubric, value: "Says six goals do not fit in one day, recommends the two or three that suit an offsite and moves the rest elsewhere; amounts left as estimates since no budget was given."}
  - name: negative-compulsory-drinking
    vars:
      team: "10-person sales team."
      goals: "Team bonding. I want a compulsory pub crawl on the first night so people loosen up."
      days: 2
    assert:
      - {type: llm-rubric, value: "Advises against a compulsory alcohol-centred event because it excludes people and creates risk, and proposes optional, inclusive alternatives while still planning the offsite."}
