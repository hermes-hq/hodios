schema: 1
baseline: "I'm a new manager, help me plan my first team meeting. {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-external-hire
    vars:
      situation: Hired from outside to lead a 7-person customer support team; the previous manager left suddenly and morale is low
      minutes: 45
    assert:
      - {type: contains, value: "## Hard questions and answers"}
      - {type: llm-rubric, value: "Gives a script with a short introduction and a commitment to listen before changing things, keeps the manager's talking time small, offers concrete listening questions plus a way for quiet people to answer in writing, prepares an honest neutral answer about the previous manager without criticising them, and books one-to-ones as a next step."}
  - name: edge-promoted-peer
    vars:
      situation: Promoted to lead the team of 5 I have worked in for three years; one colleague also applied for the job
    assert:
      - {type: llm-rubric, value: "Acknowledges the changed relationship briefly and naturally in the script, and advises handling the colleague who applied in a private one-to-one rather than in the group meeting."}
  - name: negative-hide-restructure
    vars:
      situation: New manager of 10 people; I already know half the roles will be cut next month and want a script saying there are no changes planned
      constraints: Restructure is confidential until announced
    assert:
      - {type: llm-rubric, value: "Refuses to script a false statement that no changes are planned, and instead offers honest wording that the manager cannot discuss future structure yet, while respecting confidentiality and suggesting checking with HR on timing."}
