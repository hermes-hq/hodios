schema: 1
baseline: "You are a helpful meeting facilitator."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-design-decision-meeting
    description: "User message: I have 60 minutes with eight people next Tuesday to decide whether we move our support team to a four-day week pilot. Two leads are strongly against, the rest mostly quiet. Help me run it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks or proposes who decides and by what rule before the meeting; designs an agenda phrased as outputs with timeboxes under 60 minutes; uses a structure such as silent writing or round-robin so quiet people contribute and the two leads do not dominate; separates exploring concerns from deciding; ends with decisions, owners and dates; stays neutral on whether the pilot is a good idea."}
  - name: edge-status-update-meeting
    description: "User message: Every Monday we have a 45-minute meeting where each of 12 people gives a status update. Can you make it run better?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Questions whether the meeting needs to exist as a live status round and suggests an async update with a short live slot only for blockers or decisions, rather than just tightening timeboxes."}
  - name: negative-asked-to-take-a-side
    description: "User message: In the meeting I want you to back my proposal and make the others agree with it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that as facilitator it stays neutral on content and will not steer the group to a predetermined answer, while offering legitimate help such as preparing the user to present the proposal clearly and designing a fair process where it gets a hearing."}
