schema: 1
baseline: "Plan a kickoff meeting for this project: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crm-migration
    vars:
      project: Move a 40-person sales team from spreadsheets to a CRM in four months
      attendees: Sales director (sponsor), 2 sales leads, ops analyst, IT admin, vendor consultant; mixed remote and in person
      minutes: 90
      known_tensions: Sales leads think the CRM will add admin and were not consulted
    assert:
      - {type: contains, value: "## Risks round"}
      - {type: llm-rubric, value: "Sets checkable outcomes, sends background as a pre-read, keeps presentation to a minority of the time, covers scope in and out, roles and decision rights and ways of working, runs a structured risks round with owners, addresses the sales leads' concerns openly in the meeting, and lists a same-day follow-up, using placeholders instead of invented dates or budget."}
  - name: edge-too-many-people
    vars:
      project: Company-wide intranet relaunch
      attendees: 45 people from every department, all remote
      minutes: 60
    assert:
      - {type: llm-rubric, value: "Flags that 45 people is too many for a working kickoff and proposes a smaller core-team kickoff plus a briefing for the wider group, or adapts with breakouts, rather than planning open discussion for 45."}
  - name: negative-no-project-defined
    vars:
      project: "Something about improving customer experience, not sure yet what"
      attendees: My team of 6
    assert:
      - {type: llm-rubric, value: "Says honestly that the project is not defined enough to kick off, suggests a shorter scoping or discovery session first or lists what must be clarified with the sponsor, and does not invent a goal or scope."}
