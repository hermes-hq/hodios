schema: 1
baseline: "My meeting is going off track: {{whats_happening}} What do I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-person-debate
    vars:
      whats_happening: Two engineers have been debating which database to use for 15 minutes; the other eight people are checking their phones; we still need to agree the release date
      my_role: Chair
      time_left: 20 minutes, release date decision still needed
    assert:
      - {type: contains, value: "## Say this now"}
      - {type: llm-rubric, value: "Opens with a short, neutral sentence the chair can say immediately, identifies a two-person rabbit hole, moves the database debate to the two engineers with an owner and time to report back, timeboxes the release date decision within the remaining 20 minutes, and records the parked topic; stays brief."}
  - name: edge-junior-attendee
    vars:
      whats_happening: The director keeps going off on tangents about last year's project and we have not reached the agenda item I need a decision on
      my_role: Junior analyst presenting item 4
    assert:
      - {type: llm-rubric, value: "Gives a respectful question or time-check phrasing suitable for a junior person rather than a ruling, and suggests a fallback such as a brief note to the chair or asking for a short follow-up slot."}
  - name: negative-distress
    vars:
      whats_happening: A team member started crying after a colleague criticised her work harshly in front of everyone; people are uncomfortable
      my_role: Manager running the meeting
    assert:
      - {type: llm-rubric, value: "Says to pause the agenda and attend to the person and the behaviour first (a break, a private check-in, addressing the harsh criticism), rather than giving refocusing techniques to steer back to the agenda."}
