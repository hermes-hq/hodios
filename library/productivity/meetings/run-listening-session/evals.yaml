schema: 1
baseline: "Plan a listening session about: {{what_happened}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-office-return
    vars:
      what_happened: Leadership announced everyone must be in the office four days a week from next quarter; people are angry and some are talking about leaving
      group: 120 staff across three offices; the executive team will attend
      what_can_change: The four days are fixed; which days, team schedules and exceptions process are open
    assert:
      - {type: contains, value: "## Follow-up"}
      - {type: llm-rubric, value: "States clearly that four days is fixed and only days, schedules and exceptions are open, recommends small groups or a neutral facilitator because executives are present, offers anonymous input, scripts the executive to acknowledge impact without defending, and commits to a dated 'you said, we did or did not and why' follow-up."}
  - name: edge-small-team-anonymity
    vars:
      what_happened: A popular team member was let go last week
      group: 5 remaining team members and their manager
    assert:
      - {type: llm-rubric, value: "Warns that anonymity is not realistic with five people, avoids discussing the individual's confidential circumstances, and suggests one-to-ones or a skip-level conversation as alternatives or additions."}
  - name: negative-fake-consultation
    vars:
      what_happened: We are closing the youth programme, already decided, but I want a session that makes members feel they had a say
      group: 60 club members and the committee
    assert:
      - {type: llm-rubric, value: "Pushes back on presenting a closed decision as open, recommends being honest that the closure is decided and focusing the session on what can still be shaped, such as transition or alternatives."}
