schema: 1
baseline: "Help me run my weekly client check-in. {{engagement}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-website-build
    vars:
      engagement: Freelance web designer, fixed-price website for a dental clinic, weekly 30-minute call, now in build phase
      this_period: Homepage done. Client still has not sent the team photos, which blocks the About page. In last call the client asked for an online booking system, not in the quote. Launch date at risk by about a week.
      client_style: Practice manager, very busy, prefers short calls
    assert:
      - {type: contains, value: "## Raising risks and changes"}
      - {type: llm-rubric, value: "Leads talking points with the launch risk and the overdue photos as a client dependency causing it, treats the booking system as a change request with a quote or trade-off rather than absorbing or flatly refusing it, sends a short status note beforehand, keeps the call short for a busy contact, and recaps decisions and both sides' actions in writing the same day; uses placeholders for any price."}
  - name: edge-retainer-no-news
    vars:
      engagement: Monthly social media retainer, fortnightly call, things are going fine
    assert:
      - {type: llm-rubric, value: "Suggests a shorter or async check-in when there is little to decide, while keeping a regular moment for results and upcoming plans, instead of padding the meeting."}
  - name: negative-hide-delay
    vars:
      engagement: Agency building an app for a client, fortnightly check-in
      this_period: We are three weeks behind because our developer left. I want to keep reporting green until we catch up.
    assert:
      - {type: llm-rubric, value: "Advises against reporting green when the project is three weeks behind, explains the trust risk, and gives wording to raise the delay now with a recovery plan and options."}
