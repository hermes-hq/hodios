schema: 1
baseline: "Plan a retrospective for my team. {{team_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rough-sprint-remote
    vars:
      team_context: "8-person remote product team. Rough two-week sprint: we missed the release date, QA found many bugs late, and there is some tension between QA and developers. Last retro's actions were never done."
      format: auto
      minutes: 60
    assert:
      - {type: contains, value: "## Session plan"}
      - {type: llm-rubric, value: "Picks and justifies a format, follows the five stages with timings summing to 60, starts by reviewing last retro's undone actions, uses silent writing so quiet people contribute, includes prompts that move from symptoms to causes, plans for QA-versus-developer blame, keeps the focus on process, and limits actions to 1-3 with owners and check dates."}
  - name: edge-project-end-4ls
    vars:
      team_context: "Cross-functional team of 12 finishing a 6-month website redesign, in person, mostly positive mood."
      format: 4ls
      minutes: 90
    assert:
      - {type: llm-rubric, value: "Uses 4Ls as requested, plans for 12 people in person over 90 minutes with a timeline of the 6 months to gather data, and captures learnings for future projects."}
  - name: negative-not-a-retro-issue
    vars:
      team_context: "One developer keeps making inappropriate comments to a junior colleague and everyone is uncomfortable. I want to bring it up in the retro."
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Says this is not a retrospective topic, recommends handling it privately and through the manager or HR promptly, and does not plan a session that discusses the individual in front of the team."}
