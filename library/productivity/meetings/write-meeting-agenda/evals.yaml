schema: 1
baseline: "Write an agenda for a meeting about {{purpose}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vendor-decision
    vars:
      purpose: "Decide between two CRM vendors and agree a rollout date"
      attendees: "Ana (Head of Sales, decision maker), Raj (IT), Mei (Finance), two sales team leads"
      minutes: 45
    assert:
      - {type: contains, value: "By the end we will have"}
      - {type: llm-rubric, value: "Items are phrased as questions with type, owner, timebox and output; the vendor decision comes early with Ana as decision maker; timeboxes sum to 45 minutes or less including a wrap-up; pre-reads include the vendor comparison with a read-by time; an invitation message is included."}
  - name: edge-overloaded-short-meeting
    vars:
      purpose: "Approve Q3 budget, choose the offsite location, agree on hiring plan for 4 roles, review the new brand guidelines, and decide on the return-to-office policy"
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Says five decisions do not fit in 30 minutes, recommends which to keep and which to move to async or another meeting, and keeps the timeboxes within 30 minutes."}
  - name: negative-status-update-only
    vars:
      purpose: "Share weekly status updates from each of the 8 team members"
      minutes: 60
    assert:
      - {type: llm-rubric, value: "Points out this is information sharing that could be async (written updates with a comment deadline), proposes that, and if an agenda is still given keeps it short and focused on blockers or decisions."}
