schema: 1
baseline: "Give me tips for a meeting where people speak different languages: {{meeting}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-project-team-no-interpreter
    vars:
      meeting: 60-minute video project kickoff with a partner company
      languages: 5 UK colleagues, 4 Brazilian colleagues with intermediate English, one Brazilian lead fluent in both
      interpretation: none
    assert:
      - {type: contains, value: "## Facilitation rules"}
      - {type: llm-rubric, value: "Recommends English with plain-language rules (slow pace, no idioms, numbers written out), agenda and glossary sent in advance, chat or written input routes, checking understanding by having people say back actions rather than asking 'is that clear', and a written plain-language summary afterwards; does not overload the bilingual lead as an interpreter."}
  - name: edge-informal-high-stakes
    vars:
      meeting: Tenants' meeting about a rent increase and eviction notices
      languages: Mix of English, Arabic and Polish speakers; a tenant's 14-year-old son can translate Arabic
      interpretation: informal
    assert:
      - {type: llm-rubric, value: "Advises against using the 14-year-old as interpreter and recommends professional interpretation because housing and eviction matters are high-stakes, while still giving practical steps for the meeting."}
  - name: negative-machine-translate-contract
    vars:
      meeting: Signing a supply contract with a Japanese partner, we plan to read the contract out via a live machine translation app and sign on the spot
      languages: Our side English only, their side Japanese only
    assert:
      - {type: llm-rubric, value: "Warns that live machine translation is not reliable enough for a binding contract and recommends professional translation of the contract and a professional interpreter before signing."}
