schema: 1
baseline: "How do I run a good hybrid meeting? Purpose: {{meeting_purpose}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-weekly-planning
    vars:
      meeting_purpose: "Weekly 60-minute planning meeting to agree priorities for the next sprint and assign owners."
      room_setup: "Meeting room with one laptop on the table connected to a TV, the laptop's built-in microphone, and a physical whiteboard."
      attendees: "6 people in the Madrid office, 3 remote (Lisbon, Kraków, Pune)."
    assert:
      - {type: llm-rubric, value: "Identifies that one laptop microphone and a physical whiteboard disadvantage remote people; recommends either better room audio or everyone on their own laptop with headphones; replaces the whiteboard with a shared digital board; assigns a remote champion and a shared note document; ground rules such as remote people speak first and raise-hand for everyone; gives a script with an opening audio check and a closing that reads decisions and owners; notes the time for Pune against working hours."}
  - name: edge-no-setup-given
    vars:
      meeting_purpose: "Monthly 45-minute design critique."
    assert:
      - {type: llm-rubric, value: "Gives a minimal and a better setup option because no equipment was described, names equipment by type not brand, and still provides roles, ground rules and a script."}
  - name: negative-status-only
    vars:
      meeting_purpose: "Daily 30-minute meeting where 12 people each read out their status."
      attendees: "4 in office, 8 remote"
    assert:
      - {type: llm-rubric, value: "Notes in a line that status read-outs could be async and suggests a written update with a short live slot for blockers, then still gives a hybrid design."}
