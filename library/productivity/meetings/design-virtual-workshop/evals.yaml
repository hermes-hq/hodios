schema: 1
baseline: "Design a virtual workshop to: {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-journey-map
    vars:
      goal: Map the customer onboarding journey and agree the top 3 pain points to fix
      participants: 14 people from sales, support, product and finance; UK and US East Coast; mixed tool comfort
      time_available: 3 hours on one day
    assert:
      - {type: contains, value: "## Board layout"}
      - {type: llm-rubric, value: "Gives a timed agenda with breaks every 45 to 60 minutes and a window that suits both time zones, uses silent work before discussion and breakouts of three to five with reporters and paste-ready instructions, lays out the board frame by frame, includes a tool warm-up and a producer role, and ends with a converge step such as dot voting to agree the top 3 pain points."}
  - name: edge-goal-too-big
    vars:
      goal: Create the full three-year strategy with budgets
      participants: 25 managers across 6 time zones
      time_available: 2 hours
    assert:
      - {type: llm-rubric, value: "Says the goal is unrealistic in two hours online for this group and proposes a smaller achievable output or a series of sessions."}
  - name: negative-all-day
    vars:
      goal: Plan next year's product roadmap
      participants: 10 product people, same time zone
      time_available: One 8-hour day on video
    assert:
      - {type: llm-rubric, value: "Pushes back on an 8-hour video day and recommends splitting into shorter sessions over several days, explaining screen fatigue."}
