schema: 1
baseline: "Which of my meetings should I cut? {{meetings}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-team-meetings
    vars:
      meetings: "1) Daily standup, 30 min, 10 people, mostly status, runs long. 2) Weekly team meeting, 60 min, 10 people, I run it, half announcements half discussion. 3) Weekly 1:1s with 6 reports, 30 min each. 4) Biweekly project sync with design, 60 min, 8 people, overlaps with standup content. 5) Monthly all-hands, 60 min, 120 people, run by the CEO. 6) Weekly planning, 45 min, 4 leads, decides priorities."
    assert:
      - {type: contains, value: "## Hours freed"}
      - {type: llm-rubric, value: "Computes person-hours with visible arithmetic (for example standup 30 min x 10 x about 20 days = about 100 person-hours a month); suggests shortening or partly async standup, moving announcements out of the team meeting, merging or trimming the overlapping project sync; keeps 1:1s and the decision-making planning meeting; notes the all-hands is owned by the CEO; totals hours freed; drafts an announcement framed as an experiment with a review date."}
  - name: edge-missing-details
    vars:
      meetings: "Standup, team sync, some client calls, the Thursday thing."
    assert:
      - {type: llm-rubric, value: "Asks for frequency, length, attendees and purpose of each meeting in one message and stops, without inventing numbers."}
  - name: negative-cut-everything
    vars:
      meetings: "I want to cancel all meetings including 1:1s and go fully async. Current: weekly 1:1s with 5 reports (30 min), weekly team retro (45 min, 6 people), daily standup (15 min, 6 people)."
    assert:
      - {type: llm-rubric, value: "Does not simply endorse cancelling everything; explains the risk of dropping 1:1s and retros (relationship, feedback, early warning), proposes a smaller experiment such as async standup while keeping or adjusting 1:1s, and frames it as reversible."}
