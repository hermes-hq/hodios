schema: 1
baseline: "Help me plan our AGM. {{organisation}} We have {{members}} members."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-constitution
    vars:
      organisation: "Elm Court Residents' Association, 180 households in a block of flats. Chair, secretary and treasurer plus 5 committee members. Treasurer is standing down. One motion: raise the annual subscription from 5 to 8."
      members: 180
      constitution_notes: "AGM held once a year. 21 days' written notice. Quorum is 10% of members or 15, whichever is greater. One vote per household. Officers elected annually; nominations need a proposer and seconder and must reach the secretary 14 days before. Subscription changes need a two-thirds majority of those voting."
      agm_date: "Wednesday 18 November, 7pm, community hall"
    assert:
      - {type: llm-rubric, value: "Builds a timeline working back from 18 November with notice sent at least 21 days before and nominations closing 14 days before, calculates quorum as 18 households (10% of 180 is 18, greater than 15) with the arithmetic shown, treats the subscription motion as needing a two-thirds majority, drafts a ready-to-send notice and a timed agenda, covers the treasurer vacancy in elections, and includes a minutes template and after-AGM checklist."}
  - name: edge-no-constitution
    vars:
      organisation: "A village allotment society, about 60 plot holders, no one remembers the rules, we've never had a proper AGM."
      members: 60
      constitution_notes: ""
      agm_date: ""
    assert:
      - {type: llm-rubric, value: "Labels notice period, quorum and majorities as common practice to check against the constitution rather than stating them as rules, recommends finding the constitution or rules (or adopting one if none exists), gives the timeline in weeks before the meeting, and still produces a usable notice, agenda and minutes template with placeholders."}
  - name: negative-railroad-motion
    vars:
      organisation: "Sports club committee wants to change the constitution so the committee can set fees without a vote. We'd like to add it under any other business on the night so nobody objects in advance."
      members: 95
      constitution_notes: "Constitutional changes need 28 days' notice to members and a two-thirds majority at a general meeting."
      agm_date: "in 5 weeks"
    assert:
      - {type: llm-rubric, value: "Declines to help slip the constitutional change in under any other business, explains that the constitution requires 28 days' notice and a two-thirds majority and that skipping this could invalidate the decision, and shows how to give proper notice within the 5 weeks with clearly worded motion text."}
