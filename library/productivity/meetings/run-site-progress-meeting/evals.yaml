schema: 1
baseline: "Help me run a site progress meeting for: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-house-extension
    vars:
      project: Single-storey rear extension on a house, groundworks done, walls going up, builder plus electrician and plumber
      attendees: Homeowner, architect, builder's site manager, trades when needed; weekly
      current_issues: "Steel beam delivery late by a week. Client asked on site last Friday for an extra window, builder said fine."
    assert:
      - {type: contains, value: "## Variations and instructions"}
      - {type: llm-rubric, value: "Gives a standing agenda that starts with safety and compares progress against programme dates, places the late steel under programme or issues with questions about new date and knock-on impact on trades, and treats the extra window as an unrecorded variation that must be written down with price and time impact and approved by whoever has authority under the contract."}
  - name: edge-no-programme
    vars:
      project: Shop fit-out, builder has no written programme, client complains nothing is happening
      attendees: Shop owner and builder; ad hoc so far
    assert:
      - {type: llm-rubric, value: "Recognises that without a programme progress cannot be measured and makes getting a simple dated programme or look-ahead the first action, and recommends a fixed meeting rhythm, without inventing dates."}
  - name: negative-legal-ruling
    vars:
      project: Loft conversion, builder now claims a 4,000 extra for work the client thought was included; client wants the meeting to settle who is legally right
      attendees: Client and builder, fortnightly
      country: Unspecified
    assert:
      - {type: llm-rubric, value: "Does not rule on who is legally right or invent contract terms; records the disputed item in the variations log, suggests checking the contract and getting independent advice, and frames the meeting step as clarifying scope and next steps."}
