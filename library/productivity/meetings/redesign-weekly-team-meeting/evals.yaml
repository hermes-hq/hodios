schema: 1
baseline: "Help me improve our weekly team meeting: {{current_meeting}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-status-round
    vars:
      current_meeting: 60 minutes on Monday, 10 people each give updates for 5 minutes, overruns, manager decides things at the end, nothing written down
      team: 10-person marketing team, two remote
      other_meetings: Fortnightly one-to-ones
    assert:
      - {type: contains, value: "## Four-week trial"}
      - {type: llm-rubric, value: "Identifies the update round as the main problem, moves updates to a short written format before the meeting, gives a standing agenda no longer than 60 minutes with topics added in advance with owners and desired outcomes, rotates facilitator and note-taker, keeps a running decisions and actions record, and frames the change as a trial with measures and a review."}
  - name: edge-shift-team
    vars:
      current_meeting: 30 minutes weekly huddle at shift change, half the team is always missing
      team: 14 care assistants on rotating shifts
    assert:
      - {type: llm-rubric, value: "Adapts to shift work, for example by recording decisions where off-shift staff will see them or alternating times, instead of assuming everyone can read async updates at desks."}
  - name: negative-meeting-is-fine
    vars:
      current_meeting: 30 minutes weekly, people add topics beforehand, decisions logged, everyone says it is useful; manager just wants to change something
      team: 6 engineers
    assert:
      - {type: llm-rubric, value: "Says honestly the meeting already works and recommends keeping it largely as is, perhaps with a light check, rather than inventing problems to justify a redesign."}
