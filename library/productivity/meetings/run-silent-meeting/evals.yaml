schema: 1
baseline: "Help me run a silent meeting about: {{purpose}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-decision-no-memo
    vars:
      purpose: Decide whether to sunset our legacy Android app next quarter
      attendees: 9 people, product, engineering, support and marketing leads, all remote across 3 time zones
      minutes: 45
    assert:
      - {type: contains, value: "## Run sheet"}
      - {type: llm-rubric, value: "Proposes a decision-memo structure with prompts rather than invented facts, sets labelled comment rules, gives a run sheet where reading and commenting precede discussion, has the author triage comments into themes, discusses blockers first, and closes by recording the decision in the doc and assigning unresolved comments."}
  - name: edge-memo-too-long
    vars:
      purpose: Review the annual plan and surface risks
      attendees: 6 directors in one room
      minutes: 30
      memo: "A 6,000-word annual plan with 14 sections covering every team's goals, budgets and hiring."
    assert:
      - {type: llm-rubric, value: "Estimates the reading time as far longer than 30 minutes allows and recommends cutting to a short summary or pre-reading parts, rather than scheduling an impossible reading block."}
  - name: negative-wrong-fit
    vars:
      purpose: Celebrate the team's launch and thank everyone
      attendees: 25 people in a room
    assert:
      - {type: llm-rubric, value: "Says a silent read-first meeting does not fit a celebration or thank-you purpose and suggests a different format instead of forcing a memo."}
