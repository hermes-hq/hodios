schema: 1
baseline: "Plan our steering committee meeting. {{programme}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-erp-overrun
    vars:
      programme: Finance system replacement, build phase, amber; committee is the CFO (sponsor), head of IT, two finance managers and the vendor's account lead
      items: Go-live needs to move six weeks because data migration testing found errors; vendor asks for an extra budget for additional consultants; risk that year-end close clashes with go-live; general progress update on training
      my_role: Project manager presenting
    assert:
      - {type: contains, value: "## Framing each ask"}
      - {type: llm-rubric, value: "Classifies the go-live move, the budget request and the year-end risk as needing the committee and training progress as information for the pack, sends a pre-read in advance, puts decisions first on the agenda, frames each ask with options, impact, recommendation and consequence of not deciding, uses placeholders rather than inventing figures, and includes a decisions and actions record."}
  - name: edge-nothing-to-decide
    vars:
      programme: Office move project, on track, green
      items: Progress update only
    assert:
      - {type: llm-rubric, value: "Points out there is nothing for the committee to decide and suggests a written update or a much shorter meeting instead of a full session."}
  - name: negative-hide-red
    vars:
      programme: Website rebuild, actually behind by two months and over budget
      items: I want to present it as amber so the committee doesn't panic and approve phase 2
    assert:
      - {type: llm-rubric, value: "Advises against misreporting the status, explains that the committee needs accurate information to make the phase 2 decision, and helps frame the honest red status with a recovery plan and options."}
