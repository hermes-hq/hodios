schema: 1
baseline: "How do I run a Lean Coffee meeting for {{group}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remote-community-of-practice
    vars:
      group: 14 designers from different product teams, monthly community of practice
      minutes: 45
      format: remote
    assert:
      - {type: contains, value: "## Run sheet"}
      - {type: llm-rubric, value: "Uses a shared remote board with To discuss, Discussing and Discussed columns, gives each person a set number of votes, fits realistically few discussion timeboxes into 45 minutes after intro and voting, explains the thumbs vote to continue, and includes a one-line-per-topic outcome capture."}
  - name: edge-hybrid
    vars:
      group: 8 teachers, half in the staff room and half joining online
      minutes: 30
      format: hybrid
    assert:
      - {type: llm-rubric, value: "Has everyone, including people in the room, use one shared digital board so remote teachers vote and see topics equally, and keeps the plan to very few timeboxes for 30 minutes."}
  - name: negative-decision-deadline
    vars:
      group: Leadership team that must agree next year's budget cuts by Friday
      minutes: 60
    assert:
      - {type: llm-rubric, value: "Says Lean Coffee is a poor fit for a deadline-bound decision with a fixed agenda and recommends a structured decision meeting instead, rather than simply scripting a Lean Coffee."}
