schema: 1
baseline: "Write a calendar invite for: {{meeting}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-decision-meeting
    vars:
      meeting: "45 min, decide whether we move the mobile launch from Oct to Nov. Invite eng lead, design lead, marketing, support lead, CEO. People need to read the risk doc first."
      logistics: Video call, we will record for people in other time zones
    assert:
      - {type: contains, value: "## Invite text"}
      - {type: llm-rubric, value: "Title states the decision, the first body line gives purpose and outcome, a short agenda fits 45 minutes, the risk doc is a pre-read with a placeholder link, recording is announced, and no real-looking links or numbers are invented."}
  - name: edge-unclear-attendees
    vars:
      meeting: "1 hour brainstorm on new onboarding flow, invite the whole product org of 30 people"
    assert:
      - {type: llm-rubric, value: "Questions whether 30 people need to attend a brainstorm, suggests marking most as optional or explains how to decide, and keeps the invite concise."}
  - name: negative-info-only
    vars:
      meeting: "30 min to read out the new holiday policy to the team, no discussion needed"
    assert:
      - {type: llm-rubric, value: "Points out that reading out a policy with no discussion may be better as a written message or recording, while still offering the invite if the organiser wants it."}
