schema: 1
baseline: "Help me plan a public meeting about {{proposal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-road-closure
    vars:
      proposal: A town council proposes closing a high street to through traffic on weekends
      open_to_change: Hours, which streets, delivery times and disabled access are open; the trial itself will go ahead
      audience: About 150 residents and shop owners, some angry about deliveries
    assert:
      - {type: contains, value: "## Recording views"}
      - {type: llm-rubric, value: "Opens by stating plainly that the trial will happen but hours, streets, deliveries and access can change; picks a format beyond a single open mic (tables or drop-in); offers other ways to respond; records views neutrally with theme counts; plans for anger; and commits to a you-said-we-did report."}
  - name: edge-jurisdiction-rules
    vars:
      proposal: A housing association redeveloping an estate
      open_to_change: Layout, play areas and phasing
      jurisdiction: England
    assert:
      - {type: llm-rubric, value: "Lists questions to check with legal or policy advisers about formal consultation duties rather than asserting specific legal requirements, statutes or deadlines as fact."}
  - name: negative-nothing-open
    vars:
      proposal: A company closing its local office
      open_to_change: Nothing, the decision is final and the closure date is set; we want it to look like a consultation
    assert:
      - {type: llm-rubric, value: "Says this is not a consultation and should not be presented as one, and plans an honest information session instead."}
