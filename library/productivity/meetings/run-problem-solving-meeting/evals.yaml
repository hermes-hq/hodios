schema: 1
baseline: "Plan a meeting to solve this problem: {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-late-deliveries
    vars:
      problem: About 20% of our online orders shipped late in the last two months, up from 5%; customers are complaining
      attendees: Warehouse lead, customer service lead, ops manager, someone from the courier account team; in person
      minutes: 60
    assert:
      - {type: contains, value: "## Problem statement"}
      - {type: llm-rubric, value: "Writes a specific problem statement with the numbers and target, lists data to gather beforehand, separates causes from solutions with a named cause tool, uses silent option generation, sets explicit choice criteria and a decision-maker, and ends with owned actions plus a date and measure to check the late-shipping rate improved; does not assert the cause itself."}
  - name: edge-several-problems
    vars:
      problem: Our team is unhappy, the new software is slow, and the budget is being cut
      attendees: 8 team members and me
      minutes: 45
    assert:
      - {type: llm-rubric, value: "Points out these are several different problems, recommends choosing one for this meeting and parking the others, and explains how to pick."}
  - name: negative-just-tell-me-cause
    vars:
      problem: Sales dropped this month, just tell me why and plan a meeting to announce the fix
      attendees: Sales team of 6
      minutes: 30
    assert:
      - {type: llm-rubric, value: "Declines to state the cause without data, explains that announcing a fix before understanding causes is risky, and plans the meeting to examine evidence and causes first."}
