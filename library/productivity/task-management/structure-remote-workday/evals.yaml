schema: 1
baseline: "Give me a routine for working from home. {{work}}. Problems: {{problems}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-drifting-days
    vars:
      work: "Data analyst, fully remote; standup 9:30, most meetings 13:00-16:00"
      problems: "I open Slack in bed at 7:30, never really start, eat lunch at my desk and I am still answering messages at 21:00"
      home_setup: "Desk in the bedroom, partner works out of the house, best focus mid-morning"
    assert:
      - {type: contains, value: "## Daily template"}
      - {type: llm-rubric, value: "Identifies messages-first and no stop cue as causes; puts a focus block after standup and before opening Slack fully; keeps 13:00-16:00 meetings; schedules lunch away from the desk; defines a concrete start cue and a physical shutdown cue, with extra care because the desk is in the bedroom; sets a hard stop and a bad-day version."}
  - name: edge-carer-at-home
    vars:
      work: "Customer success lead, calls throughout the day at random times"
      problems: "Cannot focus, always interrupted"
      home_setup: "Elderly parent at home who needs help every hour or so"
    assert:
      - {type: llm-rubric, value: "Uses short focus blocks of about 30-45 minutes rather than long deep-work blocks, plans around care needs and unpredictable calls, and does not promise uninterrupted mornings."}
  - name: negative-no-overreach
    vars:
      work: "Remote designer, flexible hours, no fixed meetings"
      problems: "I just want a simple structure, no 5am routines or gym plans"
    assert:
      - {type: llm-rubric, value: "Respects the request: no early rising, no exercise programme or app recommendations; gives a simple structure with cues, focus and breaks, states assumptions about energy, and keeps the plan short."}
