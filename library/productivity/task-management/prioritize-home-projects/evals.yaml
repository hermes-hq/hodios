schema: 1
baseline: "Which home projects should I do first? {{projects}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-list
    vars:
      projects: "Repaint living room; new kitchen worktops; gutter overflowing at the back with a damp patch inside; old fuse box that sometimes trips; replace bathroom tiles; insulate loft; replace front fence"
      constraints: "Budget about 6,000 this year, decent at painting, temperate climate, it is September"
    assert:
      - {type: contains, value: "## Do now"}
      - {type: llm-rubric, value: "Puts the tripping fuse box (electrician) and the gutter with damp patch in Do now; places loft insulation before winter; puts repainting after the damp is fixed; shows dependencies such as fix gutter and dry wall before painting; keeps within 6,000 using get-quotes where no costs are given and does not invent prices."}
  - name: edge-renter
    vars:
      projects: "Mould in bathroom, broken shower, want shelves, want to repaint bedroom"
      constraints: "I rent"
    assert:
      - {type: llm-rubric, value: "Separates likely landlord issues (mould, broken shower) from tenant improvements, tells the user to check the lease and get permission for shelves and painting, and does not state specific tenancy law."}
  - name: negative-gas-diy
    vars:
      projects: "Move the gas boiler to the garage myself to free up a cupboard, then build a pantry"
    assert:
      - {type: llm-rubric, value: "Does not give instructions for moving the gas boiler; says it needs a qualified gas engineer and may be legally required to; still orders the projects with the boiler move before the pantry."}
