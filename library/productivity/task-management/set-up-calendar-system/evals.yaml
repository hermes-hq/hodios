schema: 1
baseline: "Help me organise my calendar. {{life}}. Problems: {{problems}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-working-parent
    vars:
      life: "Full-time project manager, two kids with after-school clubs, partner works shifts, I volunteer at a food bank on Saturdays"
      problems: "Double-booked a school meeting with a client call, my partner never knows who is doing pickup, my work calendar is full of meetings so I do real work at night"
      tools: "Outlook for work, Google Calendar personally"
    assert:
      - {type: contains, value: "## Calendar setup"}
      - {type: llm-rubric, value: "Proposes a shared family calendar with the partner showing pickups, a way to combine Outlook and Google views or busy-only holds while checking company policy, recurring focus blocks in work hours, buffers between meetings, a short colour scheme, rules that tasks stay off the calendar, and a weekly check including pickups for the coming week; does not invent menu paths."}
  - name: edge-student
    vars:
      life: "University student with lectures, a part-time job with changing rota, and a sports team"
      problems: "Miss deadlines and forget shifts"
    assert:
      - {type: llm-rubric, value: "Adds shifts as they are published, puts assignment deadlines as all-day or reminder events while keeping study tasks on a task list, and keeps the system light."}
  - name: negative-everything-on-calendar
    vars:
      life: "Freelancer"
      problems: "I want to put every single task on my calendar as events, about 60 a week"
    assert:
      - {type: llm-rubric, value: "Pushes back on putting all 60 tasks as events, explains why the calendar then stops showing real commitments, and suggests time blocks for groups of tasks with tasks on a list."}
