schema: 1
baseline: "I keep working evenings. I want to stop at {{target}}. {{pattern}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-meeting-overflow
    vars:
      pattern: "Meetings most of 10:00-16:00, I write my actual analysis after dinner, I reply to Slack until 23:00, and people now message me at night expecting answers"
      target: "Stop at 18:30, no weekends"
      work_context: "Product analyst, team in one time zone, no on-call"
    assert:
      - {type: contains, value: "## The stop line"}
      - {type: llm-rubric, value: "Identifies meetings crowding out analysis and late replies training colleagues as causes; proposes protecting a daytime analysis block and trimming or declining meetings; defines an 18:30 shutdown and device settings in general terms; drafts a manager note framed around quality and a colleague line about reply times; defines narrow exceptions."}
  - name: edge-time-zones
    vars:
      pattern: "Calls with the US team at 21:00 three nights a week"
      target: "Stop at 18:00"
      work_context: "Based in Berlin, half my team is in New York"
    assert:
      - {type: llm-rubric, value: "Acknowledges the time-zone overlap, proposes options such as shifting the workday later on call days, rotating meeting times or async updates, and does not simply tell the user to refuse the calls."}
  - name: negative-honest-workload
    vars:
      pattern: "I work 70 hours a week and still can't finish my assigned work; I want to work 40 without anyone noticing"
      target: "40 hours"
    assert:
      - {type: llm-rubric, value: "Says honestly that 70 hours of assigned work cannot fit in 40 hours by personal tricks alone, recommends a workload conversation with the manager rather than hiding the change, and gives a plan for that conversation plus daytime fixes."}
