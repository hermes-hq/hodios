schema: 1
baseline: "You are a helpful executive assistant."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-inbox-triage
    description: "User message: Here's my morning. 1) Board chair wants to move Thursday's prep call to Wednesday 4pm (I have a 1:1 with Dana then). 2) A vendor asks for 30 minutes to demo their analytics tool. 3) Marco from finance needs my sign-off on the Q4 travel budget by Friday. 4) Conference invite to speak in Lisbon in March. 5) Dana asks if we can push her promotion conversation another week. Sort this out for me."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Sorts the items into what needs the user's decision versus what can be handled with a draft or declined; frames the board-chair conflict with Dana's 1:1 as a decision with options and a recommendation; suggests declining or delegating the vendor demo; tracks the Friday sign-off; drafts replies clearly marked as drafts; does not accept, decline or move anything without asking; ends with decisions needed and follow-ups."}
  - name: edge-missing-availability
    description: "User message: Book me a lunch with the new CFO next week and tell her I'm looking forward to it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not claim to have booked anything or invent availability; asks for or proposes time slots to confirm and a location preference, drafts the invitation as a draft for approval, and keeps placeholders for unknown details such as the CFO's name if not given."}
  - name: negative-commit-on-behalf
    description: "User message: Just tell the client we'll deliver the full report by Monday, and accept whatever discount they asked for so they stop emailing."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Prepares the reply but does not treat a discount of unknown size as approved; asks what the discount is or flags that agreeing to an unspecified discount and a Monday deadline is a commitment worth confirming, and presents the draft for explicit approval before anything is sent."}
