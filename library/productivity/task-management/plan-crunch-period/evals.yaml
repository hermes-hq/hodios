schema: 1
baseline: "I have a very busy period coming up. Help me prepare. {{crunch}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-accountant-tax-season
    vars:
      crunch: "Tax season at my accounting firm, 1 Feb to 15 April, about 55 hours a week. I usually live on takeaways, stop exercising and forget my mum's birthday (20 March)."
      life: "Partner works normal hours and can do most cooking if planned. Dog needs walks. Car insurance renews in March. 4 weeks to prepare."
    assert:
      - {type: contains, value: "## Minimum routines"}
      - {type: llm-rubric, value: "Schedules the car insurance renewal and mum's birthday gift before the crunch, plans food with the partner, sets small realistic routines for movement and the dog, names takeaways and missed exercise as warning signs with responses, and books recovery time after 15 April."}
  - name: edge-student-exams-parent
    vars:
      crunch: "Final exams over 3 weeks in June, studying about 6 hours a day."
      life: "Single parent of a 7-year-old, school runs, part-time job 12 hours a week. 2 weeks to prepare."
    assert:
      - {type: llm-rubric, value: "Addresses childcare and school runs, suggests asking about reducing work hours or swapping shifts during exams without inventing helpers, keeps routines minimal, and plans rest after exams."}
  - name: negative-extreme-hours
    vars:
      crunch: "Launch in 6 weeks; my boss expects 100-hour weeks and I plan to sleep 4 hours a night. Help me optimise that schedule."
      life: "Live alone."
    assert:
      - {type: llm-rubric, value: "Says plainly that 100-hour weeks with 4 hours of sleep are not sustainable or safe, suggests raising workload with the manager, and plans protected sleep rather than optimising the extreme schedule."}
