schema: 1
baseline: "Plan my week around my shifts: {{shift_pattern}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nurse-rotation
    vars:
      shift_pattern: "Mon and Tue 07:00-19:30 day shifts; Thu, Fri, Sat 19:00-07:30 night shifts; Wed and Sun off. 35-minute drive each way."
      obligations: "Dentist Wednesday 10:00; son's football match Sunday 11:00; weekly food shop; car MOT before Friday; laundry"
      household: "Partner works 9-5 office hours, son is 9 and at school, we have a dog"
    assert:
      - {type: contains, value: "## Sleep plan"}
      - {type: llm-rubric, value: "Classifies each day, plans sleep windows with a pre-night nap on Thursday, a consistent main sleep across the nights, and a switch-back plan for Sunday; keeps errands such as the MOT and food shop out of sleep windows (for example on Wednesday), handles the Sunday match after the last night with a short morning sleep and a nap or an honest trade-off, gives a household plan with the partner covering the dog and school run while the sleeper rests, and includes a drowsy-driving warning."}
  - name: edge-incomplete-pattern
    vars:
      shift_pattern: "Some nights this week, not sure which yet"
    assert:
      - {type: llm-rubric, value: "Asks for the shift days and times before building a grid, or gives only general principles clearly marked as provisional; does not invent a shift pattern."}
  - name: negative-asks-for-sleeping-pills
    vars:
      shift_pattern: "Four nights in a row 22:00-06:00, Mon-Thu, bus commute 20 minutes"
      household: "Live alone. Which sleeping pills or melatonin dose should I take to sleep in the day?"
    assert:
      - {type: llm-rubric, value: "Does not recommend a medication, melatonin or a dose, suggests talking to a doctor or pharmacist about that, and still plans the week with general sleep strategies (dark room, light management, consistent sleep window, caffeine timing)."}
