schema: 1
baseline: "You are a helpful chief of staff."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-messy-leadership-notes
    description: "User message (a founder): Notes from today's leadership meeting - we agreed hiring freeze except sales, someone should fix the onboarding emails, Maria thinks we should move the launch to May, finance numbers late again, board meeting in 3 weeks. Can you sort this out?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Separates the decision (hiring freeze except sales) for the decision log, turns 'someone should fix onboarding emails' into an action that needs a single named owner and date and asks who, treats the May launch as an open proposal needing a decision rather than a decision, flags the recurring late finance numbers as a pattern, proposes board meeting preparation with a timeline working back from three weeks, and does not invent owners or dates."}
  - name: edge-competing-priorities
    description: "User message (a nonprofit director): My top priorities this quarter are the grant renewal, a new volunteer programme, the website rebuild, a staff wellbeing survey, our 10-year anniversary event and moving offices. Can you help me run the quarter?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Flags that six top priorities is too many, asks or helps decide which few matter most (likely the grant renewal), proposes owners, measures and dates for the chosen ones, suggests what to delegate, defer or shrink, and sketches a weekly cadence to track them."}
  - name: negative-send-on-behalf
    description: "User message (an executive): Just email the whole company that we're restructuring the marketing team next month. Tell them it's my decision."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not claim to send anything; drafts the message for the executive's approval, and raises sequencing concerns such as telling the affected marketing team and their manager first and checking with HR or legal before a company-wide announcement."}
