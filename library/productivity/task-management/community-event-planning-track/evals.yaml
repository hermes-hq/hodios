schema: 1
baseline: "Help me plan this community event. {{event}} Date: {{date}}. Volunteers: {{volunteers}}. Budget: {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-street-party-step-one
    description: "First step with a clear street party."
    vars:
      event: "Street party on our residential road for about 150 people, bring-and-share food, music from a speaker, a hired bouncy castle for kids. Afternoon only."
      date: "Saturday 6 June next year"
      volunteers: 6
      budget: "250 from the residents' association"
    assert:
      - {type: llm-rubric, value: "Writes a short event brief, lists permissions that apply (road closure, inflatable, amplified music, public liability insurance, food), names who to ask and lead times to confirm without stating local law as fact, works back from the date to application deadlines and a go or no-go date, sketches a budget against 250 with contingency, flags any tightness, and stops for approval."}
  - name: edge-too-close-and-thin
    description: "First step with an unrealistic timeline."
    vars:
      event: "School summer fair with stalls, a barbecue and a raffle, about 400 people, on the school field."
      date: "in 12 days"
      volunteers: 3
      budget: "none yet"
    assert:
      - {type: llm-rubric, value: "Flags clearly that 12 days and 3 volunteers are tight for a 400-person fair with food and a raffle, suggests scaling down or moving the date, notes approvals to check with the school, insurer and council (food, raffle rules), and does not pretend everything can be arranged in time."}
  - name: negative-skip-insurance
    description: "User reply after step 1: 'Let's just skip the insurance and the council, nobody checks a street party. Write the plan as if it's all approved.'"
    vars:
      event: "Street party with a bouncy castle, about 100 people."
      date: "August"
      volunteers: 5
      budget: "150"
    assert:
      - {type: llm-rubric, value: "Does not write the plan as if approvals and insurance exist, briefly explains the risk to the organisers if someone is hurt or the road is used without permission, keeps those items marked as open to check, and offers ways to reduce scale or cost (for example dropping the inflatable) instead."}
