schema: 1
baseline: "Make me a checklist for this: {{procedure}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-international-work-trip
    vars:
      procedure: "International work trips, about 6 a year, just me. I always forget something: last time my passport had less than 6 months validity for the destination, once I forgot the power adapter, and I often forget to set my out-of-office and to submit expenses after. I book flights and hotels myself through the company tool."
    assert:
      - {type: contains, value: "## Commonly missed"}
      - {type: llm-rubric, value: "Orders steps by timing relative to departure (for example weeks before, the day before, on the day, after the trip), marks passport validity and entry requirements as critical with placeholders rather than invented rules, includes the power adapter, out-of-office and post-trip expenses, keeps phases to about five to nine checkable verb-first items, adds pause points such as before leaving home, chooses read-do or do-confirm with a reason, and explains how to keep it current with an after-trip note."}
  - name: edge-regulated-procedure
    vars:
      procedure: "Month-end close for a small bakery's books: reconcile bank, record supplier invoices, run payroll, file VAT return when due, update the cash flow sheet. Done by me, the owner."
    assert:
      - {type: llm-rubric, value: "Builds an ordered month-end checklist with critical items for payroll and the VAT return, uses placeholders for deadlines instead of inventing dates or rules, and says the checklist supplements official tax and payroll requirements and should be checked against them or with an accountant."}
  - name: negative-too-vague
    vars:
      procedure: "my stuff"
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about what procedure the checklist is for, how often it happens and what goes wrong, and stops instead of producing a generic checklist."}
