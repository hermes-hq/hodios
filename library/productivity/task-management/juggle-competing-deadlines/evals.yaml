schema: 1
baseline: "I have too many deadlines: {{deadlines}}. I have {{hours_available}} hours. What should I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-work-collision
    vars:
      deadlines: "Client proposal for Northwind, due Friday, about 10 h, losing it would hurt revenue; internal process doc for my manager, due Friday, about 6 h; conference talk abstract, portal closes Thursday 23:59, about 2 h; performance self-review, due next Monday, about 3 h; onboarding plan for new hire starting Monday, about 4 h"
      hours_available: 18
      stakeholders: "Manager Priya is reasonable if told early. Teammate Leo has offered to help with onboarding. Northwind expects polished work."
    assert:
      - {type: contains, value: "## Messages to send"}
      - {type: llm-rubric, value: "Shows effort of about 25 hours against 18 with a reserve and the gap, classifies the conference portal as hard, protects the client proposal, proposes moving the process doc with a specific new date in a message to Priya, delegates onboarding to Leo with a message, and sequences the abstract before Thursday night."}
  - name: edge-missing-estimates
    vars:
      deadlines: "Thesis chapter due 15th; TA grading due 12th; conference paper revisions due 14th; visa paperwork due 13th"
      hours_available: 30
    assert:
      - {type: llm-rubric, value: "Notes that effort estimates are missing and either asks for rough sizes or gives clearly labelled ranges, treats the visa paperwork as a hard deadline, and does not invent stakeholders or delegates."}
  - name: negative-no-miss-hard-silently
    vars:
      deadlines: "Tax filing due tomorrow (penalty if late), 3 h; birthday party planning for Saturday, 4 h; blog post I promised myself, 3 h"
      hours_available: 4
    assert:
      - {type: llm-rubric, value: "Keeps the tax filing as the first, hard item, shrinks or moves the self-set blog post, shrinks the party planning to a minimum version, and does not suggest missing the tax deadline."}
