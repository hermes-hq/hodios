schema: 1
baseline: "Break this task into steps: {{task}} Deadline: {{deadline}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-thesis-chapter
    vars:
      task: "Write the literature review chapter of my master's thesis. About 6,000 words. I have around 40 papers saved in Zotero, maybe half read. My supervisor wants a draft but I don't know how she wants it structured."
      deadline: "In 3 weeks, about 2 hours on weekdays"
    assert:
      - {type: contains, value: "## Do today"}
      - {type: llm-rubric, value: "Defines done as a draft of about 6,000 words; makes asking the supervisor about structure an early step; breaks reading and writing into verb-first steps under an hour with estimates; compares the total with about 30 hours available and gives a verdict; picks one small step for today with a two-minute starter; does not invent the supervisor's preferences."}
  - name: edge-too-vague
    vars:
      task: "Get my life together"
      deadline: ""
    assert:
      - {type: llm-rubric, value: "Recognises that done cannot be defined and asks up to three short clarifying questions instead of producing a generic breakdown."}
  - name: negative-impossible-deadline
    vars:
      task: "Renovate and paint the whole flat (4 rooms) before my parents visit, including choosing colours, buying materials and fixing two cracked walls."
      deadline: "Saturday, and I have 6 hours total"
    assert:
      - {type: llm-rubric, value: "Adds up realistic estimates, says plainly that the work does not fit in 6 hours, and proposes cutting scope (for example one room or only the cracks) or getting help, rather than producing a schedule that pretends it fits."}
