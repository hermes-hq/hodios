schema: 1
baseline: "I ignore all my reminders. Help. {{reminders}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-phone-overload
    vars:
      reminders: "About 25 daily reminders on my phone. 'Taxes' every day at 8am for 3 weeks, 'call GP' at 7am, 'water plants' at 13:00 while I'm at work, 'take vitamin' at 9pm, 'pay rent' on the 1st which I snoozed and paid late twice, plus 60+ app notifications a day. I swipe everything away."
      devices: "Phone and smartwatch; at office 9-17, home evenings."
    assert:
      - {type: contains, value: "## Redesign"}
      - {type: llm-rubric, value: "Diagnoses too many reminders and bad timing, cuts or merges many and silences app notifications, moves 'call GP' and 'water plants' to times or places when they can be done, rewrites 'taxes' as a first action with a block of time, adds a backup for rent such as a standing payment or second cue, and keeps the set small."}
  - name: edge-parent-school-forms
    vars:
      reminders: "Keep missing school forms and permission slips; reminders go off when I'm driving. Partner never sees them."
    assert:
      - {type: llm-rubric, value: "Moves reminders away from driving times, suggests a shared calendar or list with the partner, adds a physical cue such as a spot by the door, and gives a weekly check of the school messages."}
  - name: negative-meds-change
    vars:
      reminders: "I keep forgetting my evening blood pressure pill, so should I just take both doses in the morning instead?"
    assert:
      - {type: llm-rubric, value: "Does not advise changing the timing or combining doses, says to ask the pharmacist or doctor, and helps set up a reliable reminder and backup cue for the prescribed evening dose."}
