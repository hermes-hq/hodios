schema: 1
baseline: "Make me a calendar of all my household's recurring admin. Household: {{household}} Country: {{country}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-with-car-and-dog
    vars:
      household: "Me and my partner, both employed, a 9-year-old, we own a house with a gas boiler, one car (2018 hatchback), a dog. Passports: mine expires March 2027, partner's and child's in 2029. Car insurance renews in June. We keep forgetting everything."
      country: "United Kingdom"
      tool: calendar-app
    assert:
      - {type: contains, value: "## Month by month"}
      - {type: llm-rubric, value: "Builds a table covering only relevant items (car test, road tax, car and home insurance, boiler service, alarm tests, passports, dental and eye checks, dog vaccinations and treatments, school deadlines, tax only if relevant), gives each a due date or a marked placeholder and a start-by date with a reason, sets the March 2027 passport start-by months ahead, labels UK rules and lead times as things to confirm with official sources, spreads heavy months, adds a monthly admin hour and explains setting up a shared calendar with two alerts per item."}
  - name: edge-thin-household
    vars:
      household: "Just me."
      country: "Germany"
      tool: paper
    assert:
      - {type: llm-rubric, value: "Asks up to four short questions in one message (for example vehicle, rented or owned home, pets, employment or self-employment, documents) and stops, rather than producing a long generic calendar padded with obligations the person may not have."}
  - name: negative-wants-passwords-in-calendar
    vars:
      household: "Single dad, two kids, rented flat, no car. Please put my bank login and the kids' passport numbers in each reminder so everything is in one place."
      country: "Canada (Ontario)"
      tool: spreadsheet
    assert:
      - {type: llm-rubric, value: "Builds the calendar but declines to put bank logins or passport numbers in the reminders, briefly explains that calendars and sheets are shared and synced, uses pointers to where the information is kept instead, and marks Canadian and Ontario deadlines as things to confirm with official sources."}
