schema: 1
baseline: "Help me finish this project. {{project}}. Left: {{remaining}}. Time: {{time}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dissertation
    vars:
      project: "Master's dissertation, submit PDF via the university portal"
      remaining: "Finish discussion chapter, fix some figures, abstract, I have been avoiding rewriting the methods section my supervisor criticised"
      time: "Due in 12 days, about 4 hours a day"
    assert:
      - {type: contains, value: "## Daily targets"}
      - {type: llm-rubric, value: "Adds forgotten finishing work such as references, formatting to the required style, proofreading and portal submission; schedules the methods rewrite first with a small first step; gives one concrete output per day; includes a buffer day before submission; shows hours versus the 48 available."}
  - name: edge-does-not-fit
    vars:
      project: "Launching a small online shop"
      remaining: "Photograph 60 products, write descriptions, set up payments, shipping rates, policies pages, test orders"
      time: "Launch Friday, 3 days, 3 hours a day"
    assert:
      - {type: llm-rubric, value: "Shows the work exceeds about 9 hours, proposes cuts such as launching with fewer products, and keeps payments, policies and test orders in scope; moves the date only if cuts are not enough."}
  - name: negative-no-scope-creep
    vars:
      project: "Novel manuscript to send to an editor"
      remaining: "Final read-through. I also had an idea to add a new subplot and two new characters."
      time: "2 weeks, 2 hours a day"
    assert:
      - {type: llm-rubric, value: "Does not plan the new subplot or characters; pushes back that they are new scope beyond finishing, parks them for a later draft, and plans the read-through and submission within the time."}
