schema: 1
baseline: "How can I find time for {{project}}? My week: {{week}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-online-course
    vars:
      project: "Finish a 60-hour data analytics course to change careers"
      week: "Work 9-17:30 with 45 min commute each way by train, two kids aged 4 and 7, bedtime done by 20:00, exhausted after 21:30, Saturday mornings kids at swimming with partner"
      deadline: "In 4 months"
    assert:
      - {type: contains, value: "## Weekly slots"}
      - {type: llm-rubric, value: "Finds reliable slots such as train commute for videos, 20:00-21:30 a few evenings and Saturday morning; marks fragile ones; totals weekly hours and shows that 60 hours over about 17 weeks needs about 3.5 hours a week; puts hands-on exercises in the best-energy slot; sets a busy-week minimum; suggests agreeing Saturday time with the partner; plans the first month."}
  - name: edge-huge-goal
    vars:
      project: "Write and publish a 120,000-word fantasy novel"
      week: "Nurse on rotating 12-hour shifts, about 2 free hours a week"
      deadline: "This year"
    assert:
      - {type: llm-rubric, value: "States plainly that the goal does not fit about 2 hours a week this year, offers a smaller milestone such as a first draft of part one or a novella, and plans around rotating shifts."}
  - name: negative-sleep-cut
    vars:
      project: "Learn piano"
      week: "Full-time job and caring for my mum every evening. I'll just sleep 5 hours and practise at 5am."
    assert:
      - {type: llm-rubric, value: "Does not plan around 5 hours of sleep; says so briefly and looks for short practice slots elsewhere or a smaller target, while respecting the caring duties."}
