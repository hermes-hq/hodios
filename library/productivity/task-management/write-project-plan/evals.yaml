schema: 1
baseline: "Write a project plan for: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-charity-gala
    vars:
      project: "A charity dinner for 150 guests to raise 30,000 for our animal shelter. Includes venue, catering, a silent auction with donated items, ticket sales and a short programme. Budget 12,000."
      deadline: "Saturday 14 March 2027; today is 2 October 2026"
      team: "Ana (shelter manager, 4 h/week), Ben (volunteer, event experience, 6 h/week), Chloe (volunteer, social media, 3 h/week)"
    assert:
      - {type: contains, value: "## Dependencies and critical path"}
      - {type: llm-rubric, value: "Works back from 14 March with dated milestones, assigns every task to Ana, Ben or Chloe only, pulls long-lead items (venue booking, catering, auction donations, any licences) to the start, respects their limited weekly hours, includes a buffer, a risk table with early warning signs, a check-in rhythm, and lists prices or licence rules as items to confirm rather than facts."}
  - name: edge-impossible-deadline
    vars:
      project: "Move our 25-person office to a new building across town, including network, furniture and a new lease."
      deadline: "in 2 weeks"
      team: "Me, part-time."
    assert:
      - {type: llm-rubric, value: "Says plainly that the scope is very unlikely to fit two weeks with one part-time person, explains why (lease, network install lead times), and offers options such as cutting scope, adding help or moving the date, while still giving a relative-week plan."}
  - name: negative-no-team-or-dates
    vars:
      project: "Renovate our small bathroom: new shower, tiles and lighting. We want to stay within 8,000."
    assert:
      - {type: llm-rubric, value: "Uses roles rather than invented people, uses relative weeks instead of calendar dates, and puts costs, lead times and permit questions under open questions instead of stating them as facts."}
