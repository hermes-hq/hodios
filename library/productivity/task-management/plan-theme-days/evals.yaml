schema: 1
baseline: "Help me set up theme days. {{work_types}} {{fixed}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-freelance-designer
    vars:
      work_types: "Client design work 18 h (needs focus), client calls 4 h, invoicing and admin 3 h, marketing and portfolio 4 h, learning 2 h"
      fixed: "School pick-up 15:00 every day, yoga Wednesday 9-10:30. Best focus in the mornings. Clients sometimes send urgent fixes."
    assert:
      - {type: contains, value: "## The weekly pattern"}
      - {type: llm-rubric, value: "Groups work into themes with hours, puts client design work in mornings, works around 15:00 pick-up and Wednesday yoga, uses half-day themes where whole days are too much, includes a buffer slot for urgent client fixes, and checks the total fits the available hours."}
  - name: edge-mostly-reactive
    vars:
      work_types: "Customer support tickets (most of the day), writing help articles 4 h, team meeting 1 h"
      fixed: "Support hours 9-17, I'm the only person on support."
    assert:
      - {type: llm-rubric, value: "Says that theme days can only cover part of a mostly reactive week, designs a small protected slot for help articles in the quietest period if known or asks for it, and does not pretend support can be paused."}
  - name: negative-too-much-work
    vars:
      work_types: "Sales 20 h, product 25 h, hiring 10 h, finance 8 h, content 10 h"
      fixed: "I can work 45 hours a week."
    assert:
      - {type: llm-rubric, value: "Points out that 73 hours of work does not fit 45 hours, does not build a pattern that pretends it fits, and asks what to cut, delegate or reduce."}
