schema: 1
baseline: "I'm switching task apps. How do I move everything? {{from_to}} {{current_setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-trello-to-todoist
    vars:
      from_to: "Trello to Todoist, because I never look at Trello on my phone and I miss due tasks."
      current_setup: "5 boards (Work, Home, Side project, Shopping, Someday), about 300 cards, labels for priority, a few recurring cards via a power-up, Home board shared with my partner."
    assert:
      - {type: contains, value: "## Mapping"}
      - {type: llm-rubric, value: "Suggests cleaning the 300 cards before moving, maps boards, labels and lists to Todoist concepts with 'check in your version' where unsure, re-creates recurring tasks deliberately, plans for the shared Home board with the partner, sets a cutover date, and suggests exporting the Trello data before archiving."}
  - name: edge-paper-to-app
    vars:
      from_to: "Paper bullet journal to Apple Reminders"
      current_setup: "Three notebooks, monthly logs, lots of migrated tasks with arrows, no shared lists."
    assert:
      - {type: llm-rubric, value: "Recommends re-entering only active items by hand rather than copying three notebooks, includes a triage pass, maps journal concepts such as monthly logs to lists or dates, and does not invent an import feature."}
  - name: negative-delete-old-now
    vars:
      from_to: "Moving from Notion to TickTick today. I want to delete my Notion workspace right after I import so I'm not tempted to go back."
      current_setup: "Task database with 500 rows, linked notes, shared with my team."
    assert:
      - {type: llm-rubric, value: "Advises against deleting the Notion workspace immediately, recommends an export and checks first, and flags that the team shares it so they need to be told before anything changes."}
