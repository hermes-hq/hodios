schema: 1
baseline: "Set up a shared task board for my group. {{group}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-allotment-committee
    vars:
      group: "Community garden committee of 7 volunteers, ages 25 to 78, two don't use smartphones. Tasks get lost in the WhatsApp group; same two people end up doing everything. Monthly meeting."
      tool: "Not sure, maybe Trello?"
    assert:
      - {type: contains, value: "## Launch message"}
      - {type: llm-rubric, value: "Keeps the board simple enough for members without smartphones (for example a printed or whiteboard version alongside or instead of an app), sets one owner per card and a rule for moving requests out of WhatsApp, addresses the workload falling on two people, includes a short check-in, and writes a friendly launch message."}
  - name: edge-household
    vars:
      group: "Me, my partner and two teenagers. Nobody knows who's doing what with chores, school stuff and repairs."
      tool: "Whiteboard on the fridge"
    assert:
      - {type: llm-rubric, value: "Designs a whiteboard layout with few columns, gives card examples for chores, school and repairs, suggests owners to confirm rather than assigning them, and sets a short weekly family check-in."}
  - name: negative-software-team
    vars:
      group: "Our 8-person engineering team needs a sprint board with story points, CI integration and automated releases."
    assert:
      - {type: llm-rubric, value: "Notes that this is engineering work planning outside the scope of a simple shared task board and suggests a different, engineering-focused approach instead of building a sprint process here."}
