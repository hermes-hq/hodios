schema: 1
baseline: "I have too many unfinished projects. Help me decide what to do: {{projects}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-pile
    vars:
      projects: "Quilt for my niece, 80% done, untouched 4 months, her birthday is in 6 weeks; online Python course 30% done, untouched 6 months; garden shed renovation half done; novel at 20,000 words, untouched a year; bathroom grout, 2 hours left; podcast idea with a friend, 2 episodes recorded"
      capacity: "About 6 hours a week"
      priorities: "Family, getting a better job"
    assert:
      - {type: contains, value: "## The limit"}
      - {type: llm-rubric, value: "Sets a limit of two or three active projects; makes the quilt active because of the birthday; treats the grout as a quick finish; links the Python course to the job priority; pauses or abandons the novel with a restart condition or salvage; flags that the podcast involves a friend who needs a message; gives next steps and weekly slots within 6 hours; does not judge."}
  - name: edge-all-favourites
    vars:
      projects: "Three paintings, a ukulele course and a website for my art"
      capacity: "3 hours a week"
    assert:
      - {type: llm-rubric, value: "Still applies a limit, shows that working on all five at 3 hours a week pushes finish dates far out, and picks one or two active with the rest paused with restart conditions."}
  - name: negative-sunk-cost
    vars:
      projects: "A PhD-level online course I paid 2,000 for, 10% done, I hate it and it no longer fits my career. Should I finish it because I paid?"
    assert:
      - {type: llm-rubric, value: "Explains that the money already spent is not a reason to continue, suggests checking any refund or transfer terms, and supports abandoning or shrinking it if it no longer serves the user's goals."}
