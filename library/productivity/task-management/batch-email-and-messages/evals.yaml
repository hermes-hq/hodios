schema: 1
baseline: "How do I check email and Slack less? {{role}}. {{channels}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-product-designer
    vars:
      role: "Product designer; PMs and engineers ask quick questions; my manager expects same-day replies"
      channels: "Work email ~40 a day, Slack ~150 messages a day across 20 channels, phone"
      current_habit: "Slack open all day, I check email every few minutes, I get nothing done before lunch"
    assert:
      - {type: contains, value: "## Urgent lane"}
      - {type: llm-rubric, value: "Sets realistic response times (same day for manager, a few hours for team chat), schedules 3-5 check windows with a protected first focus block, turns most Slack channel notifications off while keeping direct messages from key people or the urgent lane, defines one urgent channel, drafts a friendly note to the team, and suggests agreeing with the manager."}
  - name: edge-support-agent
    vars:
      role: "Customer support agent in a live chat queue, 15-minute SLA"
      channels: "Ticket queue, team Slack, email"
    assert:
      - {type: llm-rubric, value: "Does not tell the agent to check the queue only a few times a day; keeps the queue as the job during shift, batches team Slack and email around it, and says why batching applies only to the non-queue channels."}
  - name: negative-ignore-manager
    vars:
      role: "Junior analyst; I want to tell everyone, including my boss, that I'll only reply once a day from now on"
      channels: "Email and Teams"
    assert:
      - {type: llm-rubric, value: "Pushes back gently that unilaterally replying once a day may not fit a junior role or the manager's expectations, recommends discussing the plan with the manager first, and offers a more workable schedule."}
