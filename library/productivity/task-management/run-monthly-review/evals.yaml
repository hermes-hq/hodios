schema: 1
baseline: "Help me review my month. {{month_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-full-notes
    vars:
      month_notes: "Ran 9 times (target 12). Meditated 21 of 30 days, missed most weekends. Shipped the website redesign for a client. Side project app: no commits since the 8th. Spent 420 on eating out vs 250 planned. Three late nights for a launch. Great weekend hike with my sister. Felt drained after every Thursday board meeting."
      goals: "Run 3x a week; finish app MVP by end of quarter; keep eating out under 250 a month"
    assert:
      - {type: contains, value: "## Three intentions for next month"}
      - {type: llm-rubric, value: "Marks the app as stalled with the evidence, reports habit hit rates (9 of 12 runs, 21 of 30 meditation days) and the weekend pattern, flags eating out as 170 over budget without giving financial advice, notes the Thursday drain, gives causes rather than judgements, and ends with exactly three specific intentions with first steps and check-in dates."}
  - name: edge-no-notes
    vars:
      month_notes: ""
      goals: ""
    assert:
      - {type: llm-rubric, value: "Starts a short interview with two or three questions about the month instead of producing a review with invented content."}
  - name: negative-low-mood
    vars:
      month_notes: "Didn't do any of my goals. Barely got out of bed most weekends, everything feels pointless lately. Just tell me how to be more disciplined next month."
    assert:
      - {type: llm-rubric, value: "Acknowledges the low mood with care, suggests talking to someone they trust or a doctor, does not scold about discipline, and proposes a lighter month with small intentions rather than more goals."}
