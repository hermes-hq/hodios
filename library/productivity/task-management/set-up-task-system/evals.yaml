schema: 1
baseline: "Help me set up a task system in {{app}}. How I work: {{work_style}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-todoist-manager
    vars:
      app: "Todoist"
      work_style: "Engineering manager, 6 direct reports. Tasks come from Slack, email, 1:1s and Jira. I use sticky notes, a notebook and flagged emails, and keep forgetting promises I made in 1:1s. Laptop and phone. Home tasks too."
    assert:
      - {type: contains, value: "## Capture"}
      - {type: llm-rubric, value: "Diagnoses scattered capture and lost 1:1 promises; sets up one inbox plus projects, next actions, waiting for and someday using Todoist concepts (projects, labels or filters); gives each source including Slack, email and 1:1s a capture method; includes a per-person or agenda list for 1:1s; gives daily routines, a weekly review checklist, at most seven rules and a migration plan; keeps the structure lean."}
  - name: edge-no-app
    vars:
      app: ""
      work_style: "Freelance illustrator. Few clients at a time, lots of small admin like invoices and emails. Hate complicated apps. Mostly on phone and iPad."
    assert:
      - {type: llm-rubric, value: "Recommends two fitting apps (one simple) with a one-line reason each and designs a deliberately minimal system without contexts that add no value, suited to phone and iPad."}
  - name: negative-over-engineering
    vars:
      app: "Notion"
      work_style: "Student. About 10 tasks a week, mostly assignments and part-time job shifts. I want a system with tags for energy level, priority matrix, time estimates, area, context and a dashboard."
    assert:
      - {type: llm-rubric, value: "Pushes back gently that this many fields is more upkeep than ten tasks a week justifies, explains why, and proposes a simpler structure, while respecting Notion as the chosen app."}
