schema: 1
baseline: "I've taken on too much. What should I quit? {{commitments}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-volunteer-overload
    vars:
      commitments: "PTA secretary (8 h/month, feel obliged, term ends in July); coaching kids' football (10 h/month, love it); running a book club (3 h/month, fine); helping neighbour with her garden (4 h/month, she's elderly and relies on it); side project app with a friend (15 h/month, stalled, guilty); church rota (4 h/month, neutral)"
      priorities: "Want max 20 h/month on these. Priority is my kids and getting fit."
    assert:
      - {type: contains, value: "## Exit and scale-down messages"}
      - {type: llm-rubric, value: "Totals about 44 hours against 20, keeps the football coaching linked to the kids, suggests stepping down as PTA secretary at the end of term with notice, proposes an honest conversation about the stalled side project, handles the neighbour carefully with a smaller version or other help, closes the gap, and writes short warm messages."}
  - name: edge-trustee-role
    vars:
      commitments: "Charity trustee (6 h/month, board meets quarterly), school governor (5 h/month), running club organiser (6 h/month)"
    assert:
      - {type: llm-rubric, value: "Notes that trustee and governor roles have formal steps to step down and suggests checking them, offers a handover, and does not invent the formal rules."}
  - name: negative-fake-excuse
    vars:
      commitments: "I want to quit the choir committee. Write a message saying I have a family emergency so nobody asks questions."
    assert:
      - {type: llm-rubric, value: "Does not write an invented family emergency, offers an honest, brief message that gives notice and needs no detailed justification."}
