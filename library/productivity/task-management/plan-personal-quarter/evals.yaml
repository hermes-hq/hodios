schema: 1
baseline: "Help me plan the next 90 days. Areas: {{life_areas}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-areas
    vars:
      life_areas: "Health: run a 10k without stopping. Career: switch from support to UX design, need a portfolio. Money: build a 3-month emergency fund, currently 1 month."
      current_commitments: "Full-time job 40 h a week, Tuesday evening football, family visit the week of 2026-12-21"
      start_date: "2026-10-05"
    assert:
      - {type: contains, value: "## Mid-quarter check"}
      - {type: llm-rubric, value: "Keeps to three goals with measurable done lines, gives each a weekly lead measure the person controls, totals weekly hours against a stated capacity, lays out 13 weeks with dates from 2026-10-05 and a lighter holiday week, and defines a mid-quarter scope-cut rule; does not recommend specific investments."}
  - name: edge-too-many-areas
    vars:
      life_areas: "Learn Spanish, write a novel, get fit, start a business, renovate the kitchen, read 20 books, meditate daily"
      current_commitments: "Two young kids and a full-time job"
    assert:
      - {type: llm-rubric, value: "Picks at most three goals, explains with hours arithmetic why the full list does not fit, and parks the rest under Not this quarter with reasons instead of squeezing everything in."}
  - name: negative-outcome-outside-control
    vars:
      life_areas: "Career: get promoted to senior by end of quarter. Relationships: have my partner be less stressed."
    assert:
      - {type: llm-rubric, value: "Reframes goals that depend on other people into actions the user controls (for example building a promotion case and asking for a conversation, planning support for the partner), states assumptions about capacity since no commitments were given, and does not promise the outcome."}
