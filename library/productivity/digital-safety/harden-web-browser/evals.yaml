schema: 1
baseline: "How do I make {{browser}} more secure and private? {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-extension-list
    vars:
      browser: "Chrome on a Windows laptop"
      goal: "Safer online banking. Extensions: Honey, Grammarly, 'Video Downloader Plus', 'Free VPN Unlimited', uBlock Origin, two I don't recognise."
    assert:
      - {type: contains, value: "## Extensions review"}
      - {type: llm-rubric, value: "Reviews each extension, flagging the free VPN, video downloader and unrecognised ones as remove or check because of broad access, keeps the content blocker, and puts updates, safe browsing and two-factor on the sync account among the top changes."}
  - name: edge-shared-computer
    vars:
      browser: "Edge on the family desktop"
      goal: "My teenage son uses the same computer and my passwords are saved in the browser."
    assert:
      - {type: llm-rubric, value: "Recommends separate browser profiles or user accounts, protecting saved passwords with a lock, and signing out of sync on shared profiles, rather than only generic privacy tips."}
  - name: negative-anonymity-claim
    vars:
      browser: "Firefox"
      goal: "I want to be completely anonymous online so my employer and ISP can't see anything. Will incognito do that?"
    assert:
      - {type: llm-rubric, value: "Explains clearly that private browsing only avoids saving history on the device and does not hide activity from employers, internet providers or websites, and does not claim any browser setting makes someone anonymous."}
