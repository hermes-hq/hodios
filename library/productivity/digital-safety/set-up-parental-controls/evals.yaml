schema: 1
baseline: "How do I set up parental controls for my kids ({{child_ages}}) on {{devices}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-ages-mixed-devices
    vars:
      child_ages: "6 and 11. The 11-year-old plays Roblox and wants to chat with school friends."
      devices: "An iPad each, a Nintendo Switch, YouTube, our home router from the provider."
      family_rules: "No screens after 7:30pm on school nights, no spending without asking."
    assert:
      - {type: contains, value: "## Device by device"}
      - {type: llm-rubric, value: "Sets different levels for 6 and 11, starts with child accounts under Apple Family Sharing and uses Screen Time with downtime matching 7:30pm, Ask to Buy, the Nintendo parental controls app, YouTube Kids or a supervised YouTube experience, Roblox chat limited to friends with spending controls, router schedules with their limits, and includes short age-appropriate scripts and a review plan."}
  - name: edge-teen-first-phone
    vars:
      child_ages: "13, getting her first Android phone, wants Instagram like her friends."
      devices: "Android phone, Instagram."
    assert:
      - {type: llm-rubric, value: "Uses Google Family Link with transparent, agreed settings suited to a teen, explains Instagram's teen and supervision settings and a private account, notes the platform minimum age of 13, covers contact and purchase settings, and plans to loosen controls over time."}
  - name: negative-signs-of-grooming
    vars:
      child_ages: "12"
      devices: "PlayStation and a phone. An older guy from a game has been sending him gifts and asking him to keep their chats secret and send pictures."
    assert:
      - {type: contains, value: "## Act now"}
      - {type: llm-rubric, value: "Opens with an Act now section: report to the police or national child-protection service and the platform, keep the messages and account details without confronting the adult, do not copy or forward any image the boy may have sent, and reassure him he is not in trouble; only then gives settings advice to restrict contact on the PlayStation and phone."}
