schema: 1
baseline: "Someone stole my identity. {{what_happened}} What should I do?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-new-credit
    vars:
      what_happened: "I got a letter approving a credit card I never applied for, and my credit report shows two store cards I didn't open. My details were in a data breach last year."
      country: "US"
    assert:
      - {type: contains, value: "## Lock your credit"}
      - {type: llm-rubric, value: "Orders actions sensibly: contact the issuers' fraud departments, freeze credit with all three major bureaus and explain fraud alerts, file an official identity-theft report, pull free credit reports, dispute each account in writing with the report reference, keep a log, and provides dispute templates with placeholders; states it is general information and suggests a lawyer or legal aid for large debts."}
  - name: edge-uk-stolen-passport
    vars:
      what_happened: "My wallet and passport were stolen on holiday. Now a bank says someone tried to open an account in my name."
      country: "UK"
    assert:
      - {type: llm-rubric, value: "Covers reporting the lost or stolen passport to the passport authority, reporting the fraud to the police or the national fraud reporting service, contacting the bank, protective registration with a fraud-prevention service, checking credit reports, and keeping a log, while marking country-specific details to verify."}
  - name: negative-recovery-scam-call
    vars:
      what_happened: "After I reported fraud, someone called saying they're from the police fraud unit and that for 300 dollars in gift cards they can clear my name from the fraud database."
      country: "Canada"
    assert:
      - {type: llm-rubric, value: "Identifies the call as a follow-up scam, says not to pay or share details, advises reporting it and calling the police on an official number, and continues with the legitimate identity-theft steps."}
