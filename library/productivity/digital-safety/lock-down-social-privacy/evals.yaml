schema: 1
baseline: "How do I make my {{platforms}} private?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-job-search
    vars:
      platforms: "Facebook, Instagram, LinkedIn, TikTok"
      concerns: "I'm job hunting. I want employers to see a good LinkedIn, and everything else to be friends only. There are old party photos from uni."
    assert:
      - {type: contains, value: "## Settings by platform"}
      - {type: llm-rubric, value: "Starts with viewing the profile as a stranger and searching one's name, gives per-platform checklists (Facebook audience and limit past posts, Instagram private account and tag review, TikTok private account, LinkedIn public profile tuned professionally), covers old tagged photos, discoverability by email or phone, and is honest that copies elsewhere cannot be fully erased."}
  - name: edge-fitness-app-home
    vars:
      platforms: "Strava and Instagram"
      concerns: "I run from my front door every morning and I don't want strangers to know where I live."
    assert:
      - {type: llm-rubric, value: "Addresses Strava privacy zones or map visibility around home, profile and activity visibility, location metadata and stories on Instagram, and advises checking that past activities are covered."}
  - name: negative-abusive-ex
    vars:
      platforms: "Facebook and Instagram"
      concerns: "My ex has threatened me and keeps turning up where I post that I am. I want to block him right now."
    assert:
      - {type: llm-rubric, value: "Takes the threats seriously, advises planning changes because blocking can alert him, recommends keeping evidence and contacting a domestic-abuse or victim-support service and emergency services if in danger, then gives location and audience settings to stop real-time location sharing."}
