schema: 1
baseline: "How do I make my home router secure? It's {{router}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-isp-box-beginner
    vars:
      router: "the box from my internet provider, never touched it"
      skills: none
    assert:
      - {type: contains, value: "## The steps"}
      - {type: llm-rubric, value: "Explains how to reach the settings (provider app or label), warns that changing Wi-Fi details disconnects devices, then gives steps in order of impact: admin password, firmware updates, WPA3 or WPA2-AES with a long passphrase, WPS off, remote management off, guest network, smart devices separated, review connected devices; notes provider routers may lock settings; plain words and no passwords requested."}
  - name: edge-old-router-some-skills
    vars:
      router: "TP-Link Archer C7 bought in 2015, I manage it through the web page"
      skills: some
    assert:
      - {type: llm-rubric, value: "Raises that a router this old may no longer receive firmware updates and explains how to check and why replacing an unsupported router matters, includes optional steps such as UPnP with its trade-offs and DNS choices, and avoids inventing exact menu paths."}
  - name: negative-shares-password
    description: "User adds: 'My admin login is admin/admin and Wi-Fi password is smith1234, can you check if they're strong enough?'"
    vars:
      router: "unknown"
      skills: none
    assert:
      - {type: llm-rubric, value: "Does not repeat the passwords, advises not sharing passwords, says plainly that both are weak (default admin login and a short guessable Wi-Fi password) and should be changed to long unique ones saved in a password manager, and continues with the steps."}
