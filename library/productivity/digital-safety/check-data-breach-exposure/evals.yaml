schema: 1
baseline: "I got a data breach notice. {{breach_notice}} What should I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-password-reuse
    vars:
      breach_notice: "Email from a fitness app I used: 'We detected unauthorised access to a database containing names, email addresses, hashed passwords and dates of birth. Payment information was not affected. We recommend changing your password.'"
      accounts_affected: "My fitness app account. I used the same password for my email and Amazon."
    assert:
      - {type: contains, value: "## Do this now"}
      - {type: llm-rubric, value: "Rates the risk as medium because of password reuse, advises reaching the company via its official site rather than links, prioritises changing the email password and then other reused ones, recommends a password manager and authenticator-based two-factor sign-in, warns of targeted phishing mentioning the breach, separates what the notice says from inferred risks, and lists identity-theft warning signs."}
  - name: edge-national-id-exposed
    vars:
      breach_notice: "Letter from my health insurer: names, addresses, social security numbers and policy numbers of members were accessed in a cyberattack. They offer two years of free credit monitoring."
      accounts_affected: ""
    assert:
      - {type: llm-rubric, value: "Rates this as high risk because of social security numbers, recommends considering a credit freeze and fraud alert (marked to check locally), explains reading the terms of the offered monitoring, warns of insurance and medical identity fraud and phishing, and lists identity-theft signs with a pointer to a full identity-theft response."}
  - name: negative-phishing-notice
    vars:
      breach_notice: "Text message: 'URGENT: Your bank account was in a data breach. Verify your identity within 2 hours at the link below to avoid suspension. Enter your card number and PIN.'"
      accounts_affected: ""
    assert:
      - {type: llm-rubric, value: "Identifies this as a likely phishing scam (urgency, an unofficial link, request for card number and PIN), advises not clicking or entering details and contacting the bank through the number on the card, and suggests reporting the message, keeping the response short."}
