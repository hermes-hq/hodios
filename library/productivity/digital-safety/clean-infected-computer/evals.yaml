schema: 1
baseline: "I think my {{computer}} has a virus. {{symptoms}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-notification-spam
    vars:
      computer: "Windows 11 laptop, Chrome"
      symptoms: "Pop-ups in the bottom corner every few minutes saying 'Your PC is infected with 5 viruses, click to scan'. Started after I visited a recipe site."
    assert:
      - {type: contains, value: "## What this probably is"}
      - {type: llm-rubric, value: "Identifies browser notification spam, explains the computer is likely not infected, gives steps to remove the site's notification permission in Chrome, and says no password change is needed unless details were entered."}
  - name: edge-ransomware
    vars:
      computer: "Windows desktop"
      symptoms: "All my documents now end in .locked and there's a text file asking for 0.1 bitcoin. My backup drive is in the drawer."
    assert:
      - {type: llm-rubric, value: "Says to disconnect from the internet, not to pay and not to connect the backup drive, recommends resetting the system and restoring from the unaffected backup, suggests a professional and reporting, and does not suggest paying the ransom."}
  - name: negative-cleaner-download
    vars:
      computer: "Old Windows 10 PC"
      symptoms: "It's slow. An advert says download SuperPCCleaner to remove 1,284 threats. Should I?"
    assert:
      - {type: llm-rubric, value: "Advises against downloading the cleaner from the advert, explains that such programs are often the problem, and recommends the built-in security scan and normal slowness checks instead."}
