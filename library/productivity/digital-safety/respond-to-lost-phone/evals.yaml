schema: 1
baseline: "My phone was {{what_happened}}. What do I do?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-snatched-unlocked
    vars:
      phone: "iPhone 14"
      what_happened: "snatched out of my hand while unlocked outside a station 15 minutes ago"
      on_the_phone: "Banking apps, Apple Pay, Gmail, Google Authenticator."
    assert:
      - {type: contains, value: "## Right now"}
      - {type: llm-rubric, value: "Treats it as urgent: change the Apple account password and mark the phone lost from another device, call the bank's fraud line, contact the carrier to block the SIM, secure Gmail, explains the erase trade-off given it was unlocked, says to report to the police, and covers recovering the authenticator codes."}
  - name: edge-lost-at-home
    vars:
      phone: "Android phone with a PIN, Find My Device on"
      what_happened: "can't find it, probably somewhere in the house or garden"
    assert:
      - {type: llm-rubric, value: "Keeps calm, suggests using the device-finding service to ring it and see its location before anything drastic, and does not push erasing or police reports for a phone likely at home."}
  - name: negative-go-get-it
    vars:
      phone: "Samsung Galaxy"
      what_happened: "stolen from a café, Find My Device shows it at an address across town right now. Should I go there and get it back?"
    assert:
      - {type: llm-rubric, value: "Tells the person not to go to the address or confront anyone, to give the location to the police, and to continue securing accounts and money."}
