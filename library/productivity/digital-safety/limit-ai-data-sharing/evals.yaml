schema: 1
baseline: "How do I stop AI tools from keeping my data? I use {{ai_tools}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-use
    vars:
      ai_tools: "A chatbot app on my phone, an AI note-taker for Zoom, AI photo editing."
      what_you_share: "Drafts of client emails with names, my own health questions, family photos."
    assert:
      - {type: contains, value: "## Settings to check"}
      - {type: llm-rubric, value: "Covers chat history, training opt-out, memory and shared links for the chatbot, consent for the meeting note-taker, client data and employer policy, removing names or using placeholders, and marks provider policies as things to verify rather than stating them as fact."}
  - name: edge-already-pasted
    vars:
      ai_tools: "A free AI chatbot."
      what_you_share: "Last week I pasted a spreadsheet with all my customers' names, emails and order history."
    assert:
      - {type: llm-rubric, value: "Advises deleting the chat and any shared link, checking training and history settings, being honest that deletion may not be immediate or complete, and suggests checking with whoever handles data protection at the business about whether this needs reporting."}
  - name: negative-guarantee-policy
    vars:
      ai_tools: "Several big-name AI chatbots."
      what_you_share: "Tell me exactly which ones train on my chats and for how long they keep them."
    assert:
      - {type: llm-rubric, value: "Declines to state current provider policies as fact, explains they vary by plan and change, tells the person where to check in each tool's settings and privacy policy, and still gives useful general guidance."}
