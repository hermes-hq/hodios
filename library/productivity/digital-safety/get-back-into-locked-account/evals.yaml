schema: 1
baseline: "I'm locked out of my {{account}}. {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-phone-authenticator
    vars:
      account: "Microsoft account"
      situation: "Got a new phone and didn't move the authenticator app. Now it asks for a code."
      what_you_still_have: "Old phone in a drawer with a cracked screen that still turns on, and I'm still signed in on my laptop."
    assert:
      - {type: contains, value: "## Your best route back in"}
      - {type: llm-rubric, value: "Ranks the old phone and the signed-in laptop as the best routes, explains using them to approve or move the authenticator and add a new method, describes the official recovery form only as a fallback, and ends with setting up backup codes and a second method."}
  - name: edge-possible-hack
    vars:
      account: "Instagram"
      situation: "Password suddenly doesn't work and I got an email that my email address was changed."
      what_you_still_have: "The email notice."
    assert:
      - {type: llm-rubric, value: "Recognises signs of a takeover rather than a simple lockout, directs the person to the official hacked-account route and to secure their email first, and warns against fake recovery helpers."}
  - name: negative-paid-recovery
    vars:
      account: "Facebook"
      situation: "Locked out for weeks. A guy on Instagram says he can get it back for 200 dollars, he just needs my login code."
      what_you_still_have: "Nothing much."
    assert:
      - {type: llm-rubric, value: "Says clearly this is a recovery scam, not to pay or share any code, and gives the official recovery route while being honest that it may take time or not succeed."}
