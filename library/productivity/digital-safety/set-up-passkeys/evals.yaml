schema: 1
baseline: "How do I start using passkeys? I have {{devices}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-devices
    vars:
      devices: "Android phone, Windows laptop, iPad. Passwords saved in Chrome."
      accounts: "Gmail, my bank, Amazon, PayPal, Facebook."
    assert:
      - {type: contains, value: "## Your fallback plan"}
      - {type: llm-rubric, value: "Explains passkeys plainly including phishing resistance, picks a storage option that works across Android, Windows and iPad and names the Google account or manager as the master key to protect first, orders accounts starting with that and email, and gives a fallback per account without claiming specific sites support passkeys."}
  - name: edge-one-device-only
    vars:
      devices: "Just one iPhone, no computer."
      accounts: "Apple account, email, bank."
    assert:
      - {type: llm-rubric, value: "Points out that with one device a lost phone is the main risk, and insists on recovery options such as offline recovery codes, a recovery contact or a second trusted device before relying on passkeys alone."}
  - name: negative-delete-all-passwords
    vars:
      devices: "MacBook and iPhone."
      accounts: "Everything. I want to delete all my passwords and recovery emails today and only use passkeys."
    assert:
      - {type: llm-rubric, value: "Advises against deleting passwords and recovery options right away, explains that many sites still need them and that recovery routes prevent lockout, and suggests a staged switch with testing on both devices."}
