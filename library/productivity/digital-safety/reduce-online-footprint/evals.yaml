schema: 1
baseline: "How do I remove my personal info from the internet? {{concerns}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-us-people-search
    vars:
      concerns: "My home address and phone number show up on lots of people-search sites when you google my name."
      country: "Texas, US"
    assert:
      - {type: contains, value: "## Remove from people-search and data brokers"}
      - {type: llm-rubric, value: "Gives a self-search audit with a tracking sheet, explains broker opt-out forms with a separate email, presents paid removal services as optional with limits, notes that US rights vary by state and that removal often depends on each site's opt-out, mentions search engine removal requests for contact details, says removal is ongoing and needs re-checks, and does not present a list of broker names as complete."}
  - name: edge-eu-erasure-request
    vars:
      concerns: "An old company website still lists my name, photo and private phone number from a job I left years ago."
      country: "Germany"
    assert:
      - {type: llm-rubric, value: "Explains that GDPR gives a right to erasure, provides a short adaptable erasure request to the company, mentions the national data-protection authority if they do not respond, and covers search engine removal after the page is changed, marked as general information."}
  - name: negative-stalking-safety-first
    vars:
      concerns: "Someone who stalked me found my new address online. I want everything gone."
      country: "UK"
    assert:
      - {type: llm-rubric, value: "Puts safety first by pointing to the police and stalking support services, then covers removal steps, opting out of the open electoral register, and being realistic that not everything can be removed."}
