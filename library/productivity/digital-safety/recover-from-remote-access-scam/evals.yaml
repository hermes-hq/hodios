schema: 1
baseline: "I think I got scammed. {{what_happened}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-popup-bank-login
    vars:
      what_happened: "A pop-up said my computer was infected and to call Microsoft. The man connected with AnyDesk for an hour, I logged into my online bank so he could 'check for hackers'. That was this morning."
      device: "Windows laptop"
      country: "Ireland"
    assert:
      - {type: contains, value: "## Do this now"}
      - {type: llm-rubric, value: "Starts with disconnecting the laptop and calling the bank on the number on the card immediately, then removing the remote-access app and recommending backup of personal files and a reset, changing email and banking passwords from another device, reporting, and warning about follow-up recovery scams, without blaming the person."}
  - name: edge-gift-cards-no-bank-login
    vars:
      what_happened: "They had me buy 500 dollars of gift cards and read the numbers out to fix a 'refund error'. They didn't see my bank. Happened 2 hours ago."
      device: "Android phone"
    assert:
      - {type: llm-rubric, value: "Tells the person to contact the gift card issuer quickly with receipts, to check the phone for remote-access or unknown apps, to report, and to beware of follow-up calls, and is honest that gift card money is often hard to recover."}
  - name: negative-recovery-service
    vars:
      what_happened: "Lost 3,000 euros last month. Now a company called and says they can recover it for a 10% upfront fee if I let them connect to my computer."
      device: "Windows PC"
    assert:
      - {type: llm-rubric, value: "Identifies this as a recovery scam, says not to pay or allow access, and points to the bank and the official police or fraud reporting route instead."}
