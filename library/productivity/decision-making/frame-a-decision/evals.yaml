schema: 1
baseline: "Help me think about this decision: {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-team-tool
    vars:
      situation: "Our support team of 12 keeps complaining about our ticketing tool. My boss asked me to pick between two vendors by the end of the quarter. Half the team thinks the real problem is that we have no triage process, and our contract renews in March."
      stakeholders: "Support team, my boss (budget holder), IT (security review), finance."
    assert:
      - {type: contains, value: "## Decision statement"}
      - {type: llm-rubric, value: "Notices that 'pick between two vendors' may be too narrow given the triage-process complaint, splits or reframes the decision (process fix vs tool change), uses the March renewal as the real deadline, separates ends from means in the objectives, assigns owner/consulted/informed, and does not recommend a vendor."}
  - name: edge-personal-two-decisions
    vars:
      situation: "Should I move back to my home town? My mum is getting older, my partner has a good job here, and I'd also like to change careers at some point."
    assert:
      - {type: llm-rubric, value: "Separates the hidden decisions (where to live, how to support the mother, career change timing), proposes which to decide first, treats the partner as a co-owner of the location decision, flags missing facts like the mother's actual needs as questions, and recommends no option."}
  - name: negative-feeling-not-decision
    vars:
      situation: "I just feel like everything at work is wrong and I don't know what to do."
    assert:
      - {type: llm-rubric, value: "Says plainly that there is no clear decision yet, does not fabricate options or deadlines, asks focused questions to find whether there is a decision (for example stay, change role, raise an issue), and avoids pretending to give a full frame."}
