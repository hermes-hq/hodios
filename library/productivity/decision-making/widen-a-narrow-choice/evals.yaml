schema: 1
baseline: "Help me decide: {{choice}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-whether-or-not
    vars:
      choice: "Should I quit my stable accounting job to open a bakery or not?"
      goals: "I want to do something hands-on and creative, and I can't risk our mortgage."
    assert:
      - {type: contains, value: "## New options"}
      - {type: llm-rubric, value: "Identifies a whether-or-not frame, restates the goal (hands-on creative work without risking the mortgage), generates varied concrete options labelled by move (weekend market stall, part-time baking job, reduced hours, baking for local cafes, a time-boxed test before quitting, saving a runway first), removes options that endanger the mortgage, and does not decide for the user."}
  - name: edge-business-either-or
    vars:
      choice: "We have to choose between hiring a second developer or buying a no-code platform licence."
    assert:
      - {type: llm-rubric, value: "Infers the underlying goal and marks it as inferred, proposes alternatives beyond the two (contractor for a fixed period, trial of the platform while recruiting, reducing scope, a both-and combination), and phrases unknowns such as budget or platform limits as things to check."}
  - name: negative-already-broad
    vars:
      choice: "We compared five suppliers on price, quality, lead time and support, ran samples with three of them, and now need to pick one of the final two."
    assert:
      - {type: llm-rubric, value: "Recognises that the options were already widened and tested, says so, and offers only a few genuinely new additions (for example splitting the order between the two or negotiating terms) rather than padding a long generic list."}
