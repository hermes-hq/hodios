schema: 1
baseline: "Find the logical fallacies in this argument: {{argument_text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-op-ed
    vars:
      argument_text: "We should ban phones in schools. Ever since smartphones arrived in 2012, teen anxiety has soared, so phones clearly cause anxiety. My neighbour's son stopped using his phone and became a straight-A student. Opponents of the ban just want kids to be addicted so tech companies can profit. Either we ban phones completely or we accept a generation that cannot think. Dr. Lee, a respected cardiologist, also supports the ban. Finland's schools are among the best in the world, and several Finnish schools limit phones."
    assert:
      - {type: contains, value: "## Findings"}
      - {type: llm-rubric, value: "Quotes each passage exactly and identifies post hoc or correlation as causation for the 2012 claim, an anecdote used as evidence, a straw man or ad hominem about opponents, a false dilemma, an appeal to irrelevant authority since a cardiologist is not an expert on education or adolescent mental health, and a weak inference from Finland; rates severity, gives a repair for each, credits anything sound, and writes a repaired argument of at most about 150 words with a narrower conclusion."}
  - name: edge-legitimate-moves
    vars:
      argument_text: "According to the national weather service, a category 4 hurricane is expected to make landfall here on Thursday. Hurricanes of that strength regularly destroy roofs and cut power for days. If we don't board up the windows today, the shop is likely to be damaged. So we should board up the windows today."
    assert:
      - {type: llm-rubric, value: "Recognises the argument as largely sound, explicitly passes the appeal to the weather service as a relevant authority and the if-then reasoning as not a slippery slope or fallacy, and at most notes minor weaknesses rather than inventing fallacies."}
  - name: negative-no-argument
    vars:
      argument_text: "The meeting is at 3pm in room 4. Bring your laptop. Lunch will be provided."
    assert:
      - {type: llm-rubric, value: "Says the text contains no argument to analyse (it is logistical information) and does not invent fallacies."}
