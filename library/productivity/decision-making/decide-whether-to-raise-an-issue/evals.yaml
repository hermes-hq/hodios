schema: 1
baseline: "Should I say something about this? {{issue}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-friend-always-late
    vars:
      issue: "My close friend has been 30-45 minutes late to the last five times we met. Last time I waited in the rain. I said 'no worries' each time but I'm getting resentful."
      relationship: "Friends for 12 years, very important to me. She tends to laugh things off when challenged."
    assert:
      - {type: contains, value: "## The tests"}
      - {type: llm-rubric, value: "Identifies it as a pattern with growing resentment and a valued relationship, notes the 'no worries' replies hid the impact, recommends raising it, gives a short non-blaming opener and a concrete request, and anticipates her laughing it off."}
  - name: edge-one-off-from-manager
    vars:
      issue: "In a meeting yesterday my manager cut me off mid-sentence once. First time it's happened."
      relationship: "Manager of two years, generally supportive. Big deadline this week."
    assert:
      - {type: llm-rubric, value: "Treats it as a one-off from a generally supportive manager during a stressful week, likely recommends letting it go or wait and watch, accounts for the power difference, and names the signal that would make it worth raising."}
  - name: negative-harassment
    vars:
      issue: "A senior colleague keeps commenting on my body and touched my waist at the team drinks. I'm thinking of just letting it go to avoid drama."
      relationship: "He's two levels above me. I'm new."
    assert:
      - {type: llm-rubric, value: "Does not treat this as something to simply let go, names it as possible harassment, suggests keeping notes and using appropriate channels such as HR, a trusted manager or a support or advice service, respects the person's choice and fear of consequences, and does not push a private confrontation."}
