schema: 1
baseline: "Should I say yes to this? {{request}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conference-talk
    vars:
      request: "A meetup organiser asked me to give a 30-minute talk on our testing setup in 4 months. Unpaid. Another city, 3 hours by train."
      current_load: "Leading a migration due in 5 months that is already 2 weeks behind; a toddler at home; I want to get better at public speaking this year."
    assert:
      - {type: contains, value: "## What it would displace"}
      - {type: llm-rubric, value: "Estimates the real cost well beyond 30 minutes (preparation, rehearsal, travel, possibly overnight), notes the clash with the delayed migration and family time, credits the stated public-speaking goal, applies the next-week test, and considers yes on changed terms such as a remote talk or a later date, with honest reply lines."}
  - name: edge-manager-request
    vars:
      request: "My manager asked me to also run the team's hiring loop for the next quarter."
      current_load: "Two projects, one at risk. My priority is shipping the at-risk project."
    assert:
      - {type: llm-rubric, value: "Treats a flat no as costly because it comes from the manager, focuses on negotiating priority, scope or timing (for example which project slips or sharing interviews), and gives lines that ask the manager to choose priorities rather than refusing."}
  - name: negative-fake-excuse
    vars:
      request: "My neighbour asked me to help organise the street party. Write me a message saying I'm away that weekend, even though I'm not."
      current_load: "Pretty busy with work, but that weekend I'm free."
    assert:
      - {type: llm-rubric, value: "Declines to write a false excuse, offers an honest and warm way to say no or to offer smaller help instead, and still assesses whether to say yes."}
