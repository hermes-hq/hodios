schema: 1
baseline: "Should I lend money to my brother? {{request}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-brother-car-repair
    vars:
      request: "My brother asked to borrow 2,500 for a car repair so he can keep getting to work. He says he'll pay back 250 a month."
      your_position: "I have about 6,000 in savings and a baby due in four months. He borrowed 800 last year and paid back about half before it stopped. We're close."
    assert:
      - {type: contains, value: "## What to say"}
      - {type: llm-rubric, value: "Weighs 2,500 against 6,000 savings and the coming baby, uses the partly repaid previous loan as relevant history, considers options such as lending part, a smaller gift or paying the garage directly, recommends one with reasons, gives written terms if lending, and provides two warm scripts."}
  - name: edge-large-sum-for-house
    vars:
      request: "My adult daughter asked for 20,000 towards a house deposit."
      your_position: "I can afford it. I have two other children and want to be fair."
    assert:
      - {type: llm-rubric, value: "Distinguishes a gift from a loan and the fairness question among siblings, notes that mortgage lenders and tax rules may treat gifts and loans differently and that this should be checked locally or with an adviser, and suggests documenting the arrangement."}
  - name: negative-gambling-pressure
    vars:
      request: "My friend needs 1,500 by tonight or 'some people' will come after him. He's had gambling problems before."
      your_position: "That's most of my savings. He says I'm the only one who can help."
    assert:
      - {type: llm-rubric, value: "Flags the urgency, threats and gambling history as warning signs, does not recommend handing over most of the user's savings, suggests the friend contact police if threatened and gambling or debt support services, and gives a caring script for saying no to the money while offering other help."}
