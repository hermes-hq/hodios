schema: 1
baseline: "Think about this problem from first principles: {{problem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-status-meetings
    vars:
      problem: "Our 12-person product team spends about 30% of its week in status meetings, standups, and writing weekly reports for leadership. Everyone complains but nobody wants to cut them because leadership needs visibility."
      current_assumptions: "Leadership needs a weekly written report. Standups must be daily. Everyone must attend every planning meeting."
    assert:
      - {type: contains, value: "## The bedrock"}
      - {type: llm-rubric, value: "Restates the goal as a need for shared awareness of progress and blockers rather than meetings, lists and sorts beliefs into fact, assumption and convention with how to check each, rebuilds two or three solutions including one that drops meetings or reports entirely (for example async updates or a live board leadership can read), asks why the daily standup convention might exist, and proposes a cheap, time-boxed test with confirm or kill criteria."}
  - name: edge-physical-limits
    vars:
      problem: "Home batteries are too expensive for most households in our town; installers quote about 9,000 for a 10 kWh system."
    assert:
      - {type: llm-rubric, value: "Decomposes the cost into parts such as cells, inverter, installation, permits and margin, labels figures as estimates or general knowledge to verify, separates hard limits from conventions (for example single-household ownership), and rebuilds options such as community or shared storage or bulk buying, without stating uncertain prices as facts."}
  - name: negative-vague
    vars:
      problem: "life"
    assert:
      - {type: llm-rubric, value: "Asks up to three clarifying questions about the specific problem instead of producing a generic first-principles essay."}
