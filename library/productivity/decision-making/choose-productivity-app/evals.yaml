schema: 1
baseline: "Which productivity app should I use? I need: {{needs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cross-platform-tasks
    vars:
      needs: "A task manager with recurring tasks, a shared grocery and chores list with my partner, natural-language quick add, and reminders by location would be nice"
      devices: "iPhone, Windows laptop, partner has Android"
      budget: "up to about 5 a month"
      current_app: "Apple Reminders"
    assert:
      - {type: contains, value: "## Two-week trial"}
      - {type: llm-rubric, value: "Identifies cross-platform sharing with an Android partner and Windows as a must-have that rules out the current Apple-only app for sharing, compares three or four real cross-platform task apps without stating specific prices as fact, recommends one with a runner-up and honest downsides, designs a two-week trial with concrete workflows such as sharing the grocery list, and gives a migration plan that moves only active and recurring items."}
  - name: edge-habit-not-tool
    vars:
      needs: "I keep forgetting to check my task list and things slip through. I've tried four apps this year."
      current_app: "Todoist"
    assert:
      - {type: llm-rubric, value: "Diagnoses that the problem is likely the review habit rather than the tool, offers a stay-and-fix option with concrete habit changes, and only then discusses switching, rather than recommending a fifth app outright."}
  - name: negative-constraint-respect
    vars:
      needs: "Notes app with end-to-end encryption that works fully offline"
      devices: "Linux desktop and Android phone"
      budget: "free only"
    assert:
      - {type: llm-rubric, value: "Recommends only apps that run on both Linux and Android and have a free option, marks uncertain feature or encryption claims as 'check', does not recommend Apple-only or paid-only apps, and does not invent products."}
