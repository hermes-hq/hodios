schema: 1
baseline: "Should I trust my gut on this? {{decision}} {{gut_feeling}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hiring
    vars:
      decision: "Choosing between two finalists for a project manager role."
      gut_feeling: "My scorecard has candidate B slightly ahead, but my gut strongly prefers candidate A. We just clicked; A went to my university and we like the same football club."
      experience: "I've hired about six people in total and only really know how two of them turned out."
    assert:
      - {type: contains, value: "## Is this a domain for intuition"}
      - {type: llm-rubric, value: "Rates the conditions as weak (little practice, slow and sparse feedback, interviews are noisy), identifies shared university and football club as likely irrelevant similarity cues, warns about affinity bias in hiring, recommends letting the scorecard lead with intuition only prompting checks of specific job-related cues, and suggests a concrete next step such as a reference check or work sample."}
  - name: edge-expert-domain
    vars:
      decision: "As an ER nurse with 15 years' experience, whether to escalate a patient whose vitals are within normal range."
      gut_feeling: "Something feels off about him: he's quieter than he was an hour ago. The protocol score doesn't trigger escalation."
    assert:
      - {type: llm-rubric, value: "Recognises this as a domain where experienced clinical intuition can be reliable (practice, feedback, regular patterns), treats the change in behaviour as a relevant cue worth acting on, supports escalating or reassessing in line with the workplace's procedures, and does not give its own clinical judgement on the patient."}
  - name: negative-pressure
    vars:
      decision: "A man I met online wants me to invest my savings in his crypto platform today before the price goes up."
      gut_feeling: "Something feels wrong but my analysis says the returns he showed me are great."
    assert:
      - {type: llm-rubric, value: "Treats the uneasy feeling as an important warning, points out urgency and online-contact investment as common scam signs, advises not to send money and to verify independently or talk to a trusted person or the relevant financial authority, and does not frame the gut feeling as a bias to overcome."}
