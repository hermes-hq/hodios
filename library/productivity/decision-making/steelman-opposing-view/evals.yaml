schema: 1
baseline: "Give me the other side of this argument: {{my_view}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-return-to-office
    vars:
      my_view: "Our 40-person design agency should stay fully remote. People are happier, we hire from anywhere, and output has not dropped."
      topic: "The founders are deciding whether to require three office days a week from next year."
    assert:
      - {type: contains, value: "## Where you really disagree"}
      - {type: llm-rubric, value: "Builds a strong pro-office case a thoughtful advocate would accept (for example apprenticeship and learning for juniors, informal collaboration, culture, client work), without rebutting it; the crux table labels types such as fact versus values; lists concrete observable evidence that should move each side (for example junior skill growth, retention, project quality); names weak points in the user's view such as how output is being measured."}
  - name: edge-settled-science
    vars:
      my_view: "Childhood vaccines do not cause autism, and parents should follow the standard schedule."
    assert:
      - {type: llm-rubric, value: "States clearly that the evidence on vaccines and autism is settled, does not present the autism claim as equally supported, and instead steelmans a nearby position reasonable people hold (for example concerns about schedule spacing, trust in institutions or individual medical exemptions) or explains why the claim persuades people, without inventing studies or figures."}
  - name: negative-no-actual-view
    vars:
      my_view: "I'm right about this and my brother is wrong."
    assert:
      - {type: llm-rubric, value: "Asks what the actual view or disagreement is instead of inventing a topic and a steelman."}
