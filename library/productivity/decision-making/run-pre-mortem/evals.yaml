schema: 1
baseline: "What could go wrong with this plan? {{plan}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-launch
    vars:
      plan: "Launch a self-serve tier of our B2B scheduling app in 10 weeks. Goal: 500 paying teams in 6 months at USD 29/month. Team: 3 engineers (one also on-call for enterprise customers), 1 designer, no dedicated marketer. Acquisition via content marketing and a Product Hunt launch. Assumes enterprise features can be stripped down without a rewrite, and that small teams will onboard without sales help."
      horizon: "6 months after launch"
    assert:
      - {type: contains, value: "## Tripwires"}
      - {type: llm-rubric, value: "Failure reasons are specific to this plan (shared on-call engineer, no marketer behind content-led acquisition, stripping enterprise features without a rewrite, self-onboarding assumption, the 500-team target), each with likelihood, impact and an early warning sign; mitigations split into prevent, detect and respond; tripwires have thresholds and dates; and assumptions get cheap tests."}
  - name: edge-personal-plan
    vars:
      plan: "Move from Berlin to Lisbon in 3 months with my partner and our 7-year-old, keep my remote job, and find a school for September."
    assert:
      - {type: llm-rubric, value: "Adapts the lenses to a personal relocation (employer approval for working from another country, school places, housing, partner's work, child's adjustment), assumes a horizon and says so, and flags where tax or legal residency questions should go to a qualified professional rather than answering them."}
  - name: negative-too-thin
    vars:
      plan: "Grow the business."
    assert:
      - {type: llm-rubric, value: "Says the plan is too thin to run a meaningful pre-mortem, asks for the goal, timeline, resources and key assumptions, and at most gives a short provisional list clearly marked as generic."}
