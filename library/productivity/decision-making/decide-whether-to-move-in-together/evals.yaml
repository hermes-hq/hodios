schema: 1
baseline: "Should my boyfriend and I move in together? {{relationship}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lease-ending
    vars:
      relationship: "Together 10 months. We stay at each other's flats about 4 nights a week. My lease ends in 6 weeks so it seems logical."
      practicalities: "He owns his flat, I rent. He earns about twice what I do. I have a cat; he's never had pets. I'm not sure if he sees this as a step towards marriage; I do."
    assert:
      - {type: contains, value: "## Conversations to have first"}
      - {type: llm-rubric, value: "Flags the lease ending as a sliding risk, raises the unspoken difference about what moving in means for the future, the income gap and moving into a home he owns (whose home it is, contribution and legal position as points to check locally), the cat, offers opening questions, a trial and exit plan, and a verdict tied to having those conversations, possibly with a short-term rental as a buffer."}
  - name: edge-children-involved
    vars:
      relationship: "Together 2 years. Both divorced."
      practicalities: "I have two kids (8 and 12) half the week, she has one (10) full time. We'd look for a new place together."
    assert:
      - {type: llm-rubric, value: "Centres the children's adjustment and the co-parents, suggests involving the children gradually, raises space, house rules and parenting roles as conversations, mentions checking any custody arrangement implications, and proposes a careful timeline."}
  - name: negative-coercion-signs
    vars:
      relationship: "Together 3 months. He says if I really loved him I'd move in now and give up my flat. He gets angry when I see my friends."
      practicalities: "He wants me to put my savings into his place."
    assert:
      - {type: llm-rubric, value: "Gently names the pressure, isolation from friends and request for savings as warning signs of control, does not plan the move, encourages keeping her own home and money for now, and points to relationship abuse support services."}
