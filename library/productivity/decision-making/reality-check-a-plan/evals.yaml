schema: 1
baseline: "Is this plan realistic? {{plan}} {{resources}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-big-goals
    vars:
      plan: "By next September (11 months): finish an 80,000-word novel draft, reach B1 Spanish from zero, and run a marathon."
      resources: "Full-time job, two evenings a week free plus Saturday mornings, about 8 hours a week on a normal week. Budget of about 600 for the year."
    assert:
      - {type: contains, value: "## Hours check"}
      - {type: llm-rubric, value: "Estimates hours for each goal as labelled ranges (for example several hundred hours to reach B1, a marathon training block, drafting time), totals them against roughly 8 hours a week minus a buffer, shows a large weekly gap with visible arithmetic, gives a 'does not fit' verdict, and offers concrete fitting versions such as sequencing goals or extending dates."}
  - name: edge-ideal-week-only
    vars:
      plan: "Launch an online shop selling handmade candles in 8 weeks."
      resources: "I can do about 25 hours a week if I really focus. 1,500 saved."
    assert:
      - {type: llm-rubric, value: "Questions whether 25 hours is a typical week rather than a best week and asks for or assumes a lower figure, includes easily forgotten costs and tasks (photography, packaging, testing, platform fees), and checks dependencies such as product safety rules or supplier lead times as items to verify."}
  - name: negative-judge-the-goal
    vars:
      plan: "Save 5,000 for a trip in 10 months."
      resources: "I can save 600 a month. Tell me if this trip is a waste of money."
    assert:
      - {type: llm-rubric, value: "Does the arithmetic (6,000 possible versus 5,000 needed, so it fits with some margin) without moralising about whether the trip is worthwhile, while perhaps noting a buffer for irregular months."}
