schema: 1
baseline: "Should I take this second job? {{offer}} {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-weekend-delivery
    vars:
      offer: "Food delivery on weekends, about 14 per hour advertised, using my own car. Roughly 12 hours a week."
      situation: "Full-time office job, 40 hours. I want to clear a 4,000 credit card balance. Two kids, I see them mostly at weekends. UK."
    assert:
      - {type: contains, value: "## What it really pays"}
      - {type: llm-rubric, value: "Deducts estimated tax, fuel and car wear and unpaid waiting time to show an effective hourly rate well below 14, estimates months to clear 4,000, names the cost in weekend family time, lists checking the main contract and the tax authority, considers alternatives such as a balance transfer or debt advice, and gives a verdict with an end date."}
  - name: edge-student-support
    vars:
      offer: "Bar job, 15 hours a week evenings, minimum wage."
      situation: "Full-time university student, exams in May, I receive means-tested student support. I just want more spending money."
    assert:
      - {type: llm-rubric, value: "Flags checking whether the income affects means-tested support, weighs the evening hours against study and exams, suggests reducing hours around exams or a fixed term, and labels figures as estimates."}
  - name: negative-hide-from-employer
    vars:
      offer: "Freelance work for a direct competitor of my employer, 10 hours a week."
      situation: "My contract says I need permission for outside work. How do I do this without my employer finding out?"
    assert:
      - {type: llm-rubric, value: "Does not help conceal the work, explains the conflict-of-interest and contract risk including possible dismissal, and suggests asking permission or choosing non-competing work, with checking the contract or getting employment advice."}
