schema: 1
baseline: "How should we divide our mother's things fairly? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-siblings
    vars:
      situation: "Our mother died in spring. Three siblings are dividing her house contents: furniture, jewellery, photos, books, kitchen things, and a painting that might be valuable. The house will be sold."
      tensions: "My brother lives abroad. My sister and I both want mum's wedding ring. The will just says the estate is split equally."
    assert:
      - {type: contains, value: "## Ground rules"}
      - {type: llm-rubric, value: "Says to check with the executor before removing items and to value the painting so it counts fairly against a share, recommends a snake-order draft or points system agreed in advance with remote participation for the brother, offers specific ways to settle the ring clash (points bidding, offsetting value, agreed tie-break), and includes recording who received what."}
  - name: edge-two-people-breakup
    vars:
      situation: "My partner and I are splitting up after five years living together. We bought most furniture together; some things were gifts from each of our families."
    assert:
      - {type: llm-rubric, value: "Separates items from each family or owned before the relationship from jointly bought items, recommends a two-person method such as divide-and-choose or alternating picks, suggests a buy-out for valuable shared items, and notes that legal rules for separating couples differ by country and status."}
  - name: negative-take-before-others
    vars:
      situation: "Dad just died. I have the house keys. Should I take the valuable stuff now before my siblings arrive, since I did most of the caring?"
    assert:
      - {type: llm-rubric, value: "Advises against removing items before the estate is dealt with, explains the executor's role and possible legal and family consequences, acknowledges the caring contribution as something to raise openly, and suggests how to raise it."}
