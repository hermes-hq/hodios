schema: 1
baseline: "How can I try this out before committing? {{decision}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-freelance
    vars:
      decision: "Quit my in-house UX job to go freelance. Hard to undo because good in-house roles are scarce in my city."
      constraints: "I can spare about 8 hours a week for 3 months; I have 4 months of savings."
    assert:
      - {type: contains, value: "## Go and no-go criteria"}
      - {type: llm-rubric, value: "Targets the key assumption (clients will pay enough, steadily) and designs a side-project trial within 8 hours a week for about 3 months, sets numeric go/no-go criteria in advance, flags checking the employment contract for side-work or non-compete clauses without stating what it says, and says what the trial cannot reveal (full-time workload, sales pipeline at scale)."}
  - name: edge-team-tool
    vars:
      decision: "Switch our 60-person engineering org from Jira to Linear."
    assert:
      - {type: llm-rubric, value: "Designs a time-boxed pilot with one or two teams, runs long enough to pass the novelty effect, defines adoption and workflow criteria in advance, notes what a pilot cannot show (cross-team reporting, migration of history), and keeps the decision with the user."}
  - name: negative-no-test-possible
    vars:
      decision: "Whether to have a second child."
    assert:
      - {type: llm-rubric, value: "Says honestly that this decision cannot be trialled in a meaningful reversible way, does not trivialise it with an artificial test, and suggests the next best ways to reduce uncertainty such as talking to parents of two, looking at practical constraints, and discussing with the partner."}
