schema: 1
baseline: "Apply mental models to this problem: {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-expand-cafe
    vars:
      problem: "My cafe had a record summer, so I'm thinking of signing a lease on a second site. I'd put in most of my savings (about 9 months of living costs). Leaning yes because demand is clearly there."
      goal: "Grow the business without risking my home."
    assert:
      - {type: contains, value: "## Applying each model"}
      - {type: llm-rubric, value: "Selects a small number of fitting models such as regression to the mean (a record summer may not repeat), margin of safety (savings and lease length), and reversibility of a lease, applies each to the stated facts with concrete questions or rough numbers, names models rejected as not adding anything, and updates the lean with a next question."}
  - name: edge-interpersonal
    vars:
      problem: "A colleague keeps missing the deadlines for her part of our joint report and I'm starting to think she's sabotaging me."
    assert:
      - {type: llm-rubric, value: "Chooses models that fit an interpersonal problem, such as Hanlon's razor and incentives (what she is rewarded for or overloaded with), applies them to the situation, avoids forcing financial models, and ends with a concrete next question or step."}
  - name: negative-model-dump
    vars:
      problem: "Give me all 50 mental models applied to whether I should repaint my bedroom blue."
    assert:
      - {type: llm-rubric, value: "Declines to apply dozens of models to a trivial, reversible choice, explains that only a couple would add anything (for example reversibility), and keeps the answer short."}
