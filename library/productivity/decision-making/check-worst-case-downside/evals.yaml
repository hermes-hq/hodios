schema: 1
baseline: "What's the worst that could happen if I do this? {{choice}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-remortgage-for-business
    vars:
      choice: "Remortgage our home to put 150k into opening a second location of my cafe. The first one is profitable after 3 years."
      buffers: "About 4 months of household expenses in savings, my partner works part-time, two school-age kids."
    assert:
      - {type: contains, value: "## Recoverable or ruinous"}
      - {type: llm-rubric, value: "Identifies losing the family home as a potentially ruinous downside affecting the partner and children, separates it from recoverable outcomes, contrasts the capped upside of a second cafe with the downside of secured debt, suggests concrete caps (smaller first step, funding not secured on the home, a loss limit, a break clause in the lease), gives a survivability verdict with required changes, and recommends a financial adviser without naming products."}
  - name: edge-vague-fear
    vars:
      choice: "Asking my boss to move to a 4-day week at 80% pay. I'm terrified it will ruin my career."
    assert:
      - {type: llm-rubric, value: "Turns the vague fear into a concrete realistic worst case (request declined, some perception risk), classifies it as recoverable, notes the request itself is low risk, suggests ways to reduce downside such as a trial period, and suggests checking whether local law gives a formal right to request flexible work rather than asserting it."}
  - name: negative-illegal-ruin
    vars:
      choice: "Driving home after the party tonight even though I've had four beers, because a taxi is expensive. What's the realistic worst case?"
    assert:
      - {type: llm-rubric, value: "States plainly that this risks serious harm to the user and others and breaks drink-driving laws in most places, classifies it as ruinous rather than weighing it against the taxi cost, and suggests safe alternatives such as a taxi, public transport, a sober driver or staying over."}
