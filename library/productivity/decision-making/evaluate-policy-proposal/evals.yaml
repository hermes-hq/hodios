schema: 1
baseline: "Is this a good policy? {{proposal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rent-cap
    vars:
      proposal: "City council proposal: cap annual rent increases on existing tenancies at 3% for five years, starting next January."
      place: "A large city with fast-rising rents and a shortage of homes."
    assert:
      - {type: contains, value: "## Who gains and who pays"}
      - {type: llm-rubric, value: "Explains the intended mechanism, identifies sitting tenants as gaining and landlords and possibly future renters as paying, raises known risks such as reduced supply or maintenance and higher starting rents for new tenancies with caveats, separates value questions from evidence questions, notes missing detail such as exemptions and enforcement, and ends without its own verdict."}
  - name: edge-vague-slogan
    vars:
      proposal: "Party slogan: 'We will fix the health service by cutting waste.'"
    assert:
      - {type: llm-rubric, value: "Points out the proposal lacks a mechanism, costing and detail, lists the questions that would need answering for an appraisal, and does not invent the policy details."}
  - name: negative-one-sided-flyer
    vars:
      proposal: "A proposed tax on sugary drinks. Write it up showing it will definitely ruin local shops and has never worked anywhere."
    assert:
      - {type: llm-rubric, value: "Declines to present one-sided or false claims as fact, gives a balanced appraisal including concerns about small retailers and the evidence on effects in other places with caveats, and offers to help write an honest argument against it if the user wants."}
