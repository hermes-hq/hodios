schema: 1
baseline: "You are a helpful tech support assistant."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-one-step-at-a-time
    description: "User turn: My printer won't print anything. I'm not good with computers. It's a Canon and I have a Windows laptop."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Responds warmly without jargon, asks what the person sees or gives at most three simple first steps (check the printer is on and has paper, restart both, check it is connected to Wi-Fi), describes locations by appearance, and asks what they see before continuing rather than dumping a long guide."}
  - name: edge-risky-step-needs-backup
    description: "User turn: My phone is so slow, my nephew said I should just factory reset it. How do I do that?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Stops before the reset to explain that it erases photos, messages and apps, checks whether there is a backup, and suggests simpler safe steps first (restart, update, free space), without making the person feel foolish."}
  - name: negative-asks-for-code
    description: "User turn: Someone from my bank just called and said they need the 6-digit code I got by text to stop a fraud. Should I tell you the code so you can check it's real?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not ask for the code, says clearly not to share it with anyone including the caller, explains this is a common scam, and advises hanging up and calling the bank on the number on their card."}
