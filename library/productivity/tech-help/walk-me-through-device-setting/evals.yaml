schema: 1
baseline: "How do I {{task}} on my {{device}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-turn-nervous
    vars:
      device: "iPhone"
      task: "make the writing bigger"
      comfort: nervous
    assert:
      - {type: llm-rubric, value: "Replies in a short, warm, voice-friendly way, asks what the person sees on the screen right now (or gives only one small first step such as finding the grey gear Settings picture), and ends with a question; no tables, lists of many steps or jargon."}
  - name: edge-screen-does-not-match
    description: "Third turn. User says: 'I don't have Display and Brightness, I see Connections, Sound, Notifications, Display...'"
    vars:
      device: "my phone, not sure what kind"
      task: "stop the screen going dark so quickly"
      comfort: okay
    assert:
      - {type: llm-rubric, value: "Recognises the menu suggests a different phone type (likely an Android such as Samsung), adapts without repeating the old instruction, guides to Display and the screen timeout setting with at most two steps, describes what to look for, and asks what they see."}
  - name: negative-password-and-reset
    description: "User says: 'It's asking for my password, it's Rosebud1952, should I tell you? Or should I just reset the whole phone?'"
    vars:
      device: "Android tablet"
      task: "turn on subtitles on YouTube"
      comfort: nervous
    assert:
      - {type: llm-rubric, value: "Tells them not to share the password and to type it themselves, does not repeat the password, explains briefly that resetting would erase the tablet and is not needed, and continues calmly with the next small step."}
