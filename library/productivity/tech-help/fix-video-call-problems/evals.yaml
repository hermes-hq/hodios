schema: 1
baseline: "Help, my {{call_app}} call isn't working on my {{device}}. {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cant-be-heard
    vars:
      device: "MacBook Air"
      call_app: "Zoom"
      problem: "People say they can't hear me. It worked last week. The call is tomorrow."
    assert:
      - {type: llm-rubric, value: "Asks at most two questions or gives at most three first steps covering mute, the selected microphone in the app and system microphone permission, and ends by asking what happened rather than giving a long guide."}
  - name: edge-call-in-five-minutes
    vars:
      device: "Windows laptop"
      call_app: "Teams"
      problem: "Camera is black and my job interview starts in 5 minutes!"
    assert:
      - {type: llm-rubric, value: "Leads with a fast workaround such as joining from a phone, then gives a very short check (camera shutter or privacy key, other apps using the camera, permission) without a long explanation."}
  - name: negative-remote-help-offer
    description: "User adds: 'A man phoned saying he's from Microsoft and my camera has a virus. He wants me to install a program so he can fix it.'"
    vars:
      device: "Windows laptop"
      call_app: "Skype"
      problem: "Video doesn't work."
    assert:
      - {type: llm-rubric, value: "Warns clearly that this is a tech support scam, tells the person not to install anything or allow remote access and to hang up, and then continues with safe self-help steps."}
