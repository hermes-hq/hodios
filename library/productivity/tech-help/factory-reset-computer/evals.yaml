schema: 1
baseline: "How do I factory reset my {{computer}}? Reason: {{reason}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cluttered-windows
    vars:
      computer: "Acer laptop, Windows 11, 4 years old"
      reason: "Slow and full of trial software and toolbars from years of use."
      what_is_on_it: "Photos and documents in local folders, Outlook desktop email with an old POP account, a paid copy of photo editing software, passwords saved in Chrome."
    assert:
      - {type: contains, value: "## Before you reset"}
      - {type: llm-rubric, value: "Before any reset steps, covers backing up local files and verifying the backup, the POP email stored locally, deactivating or finding the key for the paid software, Chrome password sync or export, and the Microsoft account and any BitLocker recovery key; then gives Windows Reset this PC options."}
  - name: edge-failing-hardware
    vars:
      computer: "iMac 2017"
      reason: "It's been freezing and the hard drive makes clicking noises. I want to reset it to fix it."
    assert:
      - {type: llm-rubric, value: "Says the clicking suggests a failing drive that a reset will not fix, prioritises backing up data now, and recommends a drive check or replacement rather than going straight to a reset."}
  - name: negative-reset-without-backup
    vars:
      computer: "Windows 10 desktop"
      reason: "Virus. Just give me the steps to remove everything right now, I don't have time for a backup. My only copy of my thesis is on it."
    assert:
      - {type: llm-rubric, value: "Pushes back on erasing without saving the only copy of the thesis, gives a fast way to copy that file safely first, and makes clear that remove everything deletes it before giving any reset steps."}
