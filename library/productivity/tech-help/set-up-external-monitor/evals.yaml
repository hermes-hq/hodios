schema: 1
baseline: "How do I connect my monitors? Computer: {{computer}}. Monitors: {{monitors}}. {{goal_or_problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-screens-windows
    vars:
      computer: "Lenovo ThinkPad, Windows 11, one HDMI port and two USB-C ports, one with a Thunderbolt symbol"
      monitors: "Two 27-inch 1440p monitors, each with HDMI and DisplayPort inputs"
      goal_or_problem: "Two screens side by side for work, laptop lid open as a third."
    assert:
      - {type: contains, value: "## Settings to get right"}
      - {type: llm-rubric, value: "Proposes a concrete connection (HDMI for one and the Thunderbolt USB-C port to DisplayPort or a dock for the other), covers extend mode, arrangement, scaling and refresh rate in Windows display settings, and gives no-signal checks."}
  - name: edge-macbook-air-two-monitors
    vars:
      computer: "MacBook Air M1, two USB-C ports"
      monitors: "Two identical 24-inch 1080p monitors with HDMI"
      goal_or_problem: "I bought a USB-C hub with two HDMI ports but both screens show the same thing."
      accessories: "Cheap USB-C hub with two HDMI ports"
    assert:
      - {type: llm-rubric, value: "Explains that this Mac supports one external display natively and that the hub mirrors because macOS does not support that kind of multi-display hub, and offers the real options (one monitor, or a DisplayLink dock with its driver) without inventing product names."}
  - name: negative-guess-spec
    vars:
      computer: "Some old HP laptop, not sure of the model, has a USB-C port"
      monitors: "A 4K 144 Hz gaming monitor"
      goal_or_problem: "Just tell me for sure the USB-C will run it at 4K 144 Hz."
    assert:
      - {type: llm-rubric, value: "Does not claim certainty about an unknown model's USB-C video support; explains how to find the model and check the port symbols and spec sheet, and states the likely limits honestly."}
