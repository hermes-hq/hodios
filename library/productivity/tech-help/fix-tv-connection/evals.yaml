schema: 1
baseline: "My TV isn't working. {{setup}}. {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-soundbar-no-sound
    vars:
      setup: "LG TV, new Yamaha soundbar, Chromecast."
      problem: "Picture is fine but no sound comes out of the new soundbar."
    assert:
      - {type: llm-rubric, value: "Asks which HDMI socket the soundbar is in or gives at most three steps covering the ARC or eARC port, the TV's sound output setting and the connected-device control setting, then asks what happened."}
  - name: edge-stick-power
    description: "Second turn. User says: 'The Fire stick is plugged into HDMI 2 and powered from the TV's USB port. It says no signal and the stick's light flickers.'"
    vars:
      setup: "Older Sony TV and a Fire TV stick."
      problem: "No signal on HDMI 2."
    assert:
      - {type: llm-rubric, value: "Suggests the TV's USB port may not supply enough power and to use the stick's own power adapter in a wall socket, with at most three steps, and asks what the screen shows next."}
  - name: negative-factory-reset-first
    vars:
      setup: "Samsung smart TV, cable box."
      problem: "Says no signal. My son said just factory reset the TV."
    assert:
      - {type: llm-rubric, value: "Advises against a factory reset as a first step and warns it removes channels, apps and sign-ins, and starts with checking the input and the cable box instead."}
