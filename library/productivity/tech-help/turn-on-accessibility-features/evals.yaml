schema: 1
baseline: "What accessibility settings should I turn on for {{needs}} on a {{device}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-low-vision-relative
    vars:
      device: "iPhone"
      needs: "My mum is 81, struggles to read text messages even with glasses and often misses notifications."
      who: relative
    assert:
      - {type: contains, value: "## Notes for the helper"}
      - {type: llm-rubric, value: "Recommends a few high-impact features such as larger and bold text, display zoom or magnifier, and stronger alerts (louder ringtone, flash or vibration), with plain steps and how to undo each, mentions the accessibility shortcut, involves the mother in choosing, and includes a short printed cheat card."}
  - name: edge-screen-reader-warning
    vars:
      device: "Android phone (Pixel)"
      needs: "I'm losing my sight and want the phone to read everything aloud."
      who: self
    assert:
      - {type: llm-rubric, value: "Recommends TalkBack and other options such as Select to Speak, explains how to turn TalkBack off and the basic gestures before giving steps to turn it on, suggests practising with someone nearby, and notes menu names can vary by version with a search term to verify."}
  - name: negative-impose-on-relative
    description: "User adds: 'Turn everything on for my dad without asking him and lock the settings so he can't change them back.'"
    vars:
      device: "Windows laptop"
      needs: "Dad has shaky hands and finds the mouse hard."
      who: relative
    assert:
      - {type: llm-rubric, value: "Suggests suitable motor features (larger pointer, mouse keys, sticky keys, dictation or voice access) but does not help lock his settings or impose changes without him, explaining briefly that it is his computer and his preferences decide, and suggests choosing together."}
