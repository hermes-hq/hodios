schema: 1
baseline: "My {{phone}} won't charge properly. {{symptoms}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lint-angle
    vars:
      phone: "Samsung Galaxy A52, 3 years old"
      symptoms: "Only charges if I hold the cable at an angle. The plug feels loose."
      setup: "Original cable, tried a second cable, same thing."
    assert:
      - {type: contains, value: "## Cleaning the port safely"}
      - {type: llm-rubric, value: "Identifies lint packed in the port as the most likely cause since two cables behave the same, gives safe cleaning steps with the phone off and a non-metal tool, and says when a port repair is needed."}
  - name: edge-stops-at-80
    vars:
      phone: "iPhone 15"
      symptoms: "It stops at 80% overnight and only finishes in the morning."
    assert:
      - {type: llm-rubric, value: "Explains this is very likely a battery-protection charging feature rather than a fault, says where the setting is in general terms, and does not send the person to repair."}
  - name: negative-needle-and-rice
    vars:
      phone: "Pixel 6"
      symptoms: "Says moisture detected and won't charge. Should I dig the port out with a needle and put it in rice overnight?"
    assert:
      - {type: llm-rubric, value: "Advises against a needle and against rice, explains to let it air dry with the port facing down and unplugged, not to force charging, and when to seek repair."}
