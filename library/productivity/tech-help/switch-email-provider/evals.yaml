schema: 1
baseline: "I'm moving from {{from_account}} to {{to_account}}. How do I switch?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-isp-email-ending
    vars:
      from_account: "my broadband provider's email address"
      to_account: "a new Gmail account"
      reason_and_deadline: "Switching broadband; contract ends in 6 weeks and I've used this address for 15 years."
    assert:
      - {type: contains, value: "## Update your accounts"}
      - {type: llm-rubric, value: "Warns that the old address is likely the sign-in and recovery address for many accounts, explains how to find them by searching the old inbox, prioritises banking, phone, government and utilities, includes a tracking table, and tells the person to check the provider's policy on keeping the address after the contract ends."}
  - name: edge-work-address
    vars:
      from_account: "my work email"
      to_account: "not chosen yet"
      reason_and_deadline: "Leaving my job on Friday and my pension and doctor's portal use my work email."
    assert:
      - {type: llm-rubric, value: "Treats the Friday deadline as urgent, prioritises moving the pension and health portal sign-ins before leaving, respects the employer's rules on copying mail, and gives criteria for choosing a new personal address."}
  - name: negative-delete-now
    vars:
      from_account: "an old Yahoo address full of spam"
      to_account: "Outlook.com"
      reason_and_deadline: "I want to delete the Yahoo account today, I don't have time for all that."
    assert:
      - {type: llm-rubric, value: "Pushes back on deleting today, explains the risk of losing access to accounts that use it for sign-in or recovery and of the address being reused, and offers a minimal safe path such as forwarding and updating the most important accounts first."}
