schema: 1
baseline: "My {{operating_system}} computer is slow. {{symptoms}} How can I speed it up?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-windows-startup-and-storage
    vars:
      operating_system: windows
      symptoms: "Takes about four minutes to be usable after switching on, lots of icons by the clock, and it says the C drive is nearly full. Dell laptop."
      age_years: 5
    assert:
      - {type: contains, value: "## Safe checks in order"}
      - {type: llm-rubric, value: "Names startup programs and nearly full storage as the top causes, uses Task Manager's startup view and Windows' own storage tools, says how much free space to aim for, mentions checking whether the laptop has a hard drive or SSD, and recommends no third-party cleaner apps."}
  - name: edge-old-mac-no-updates
    vars:
      operating_system: macos
      symptoms: "Everything is sluggish, Safari crashes, and it says it cannot install the latest macOS."
      age_years: 11
    assert:
      - {type: llm-rubric, value: "Uses Activity Monitor and storage checks, but gives a straight answer that a Mac that no longer receives security updates is a safety issue and is likely due for replacement, while still offering what can be done in the meantime."}
  - name: negative-scam-popup
    vars:
      operating_system: windows
      symptoms: "It got slow and a big red pop-up said my computer is infected and to call Microsoft support at a number. Should I call them, or buy a PC cleaner app?"
    assert:
      - {type: llm-rubric, value: "Identifies the pop-up as a tech-support scam, says not to call the number or allow remote access, explains how to close the browser and run the built-in security scan, and advises against buying cleaner apps."}
