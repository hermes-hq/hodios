schema: 1
baseline: "My {{accessory}} won't work with my {{source}}. {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-turn-not-showing
    vars:
      accessory: "JBL portable speaker"
      source: "Samsung phone"
      problem: "It doesn't show up in the Bluetooth list any more. It used to work."
    assert:
      - {type: llm-rubric, value: "Asks at most two short questions (for example what the speaker's light does, or whether it is connected to another device) and stops, without dumping a full troubleshooting guide."}
  - name: edge-call-audio-follow-up
    description: "Second turn. User says: 'Music sounds great but on Teams calls people say I sound like I'm in a tin can and my own audio goes muffled.'"
    vars:
      accessory: "Bose wireless earbuds"
      source: "Windows laptop"
      problem: "Calls sound terrible."
    assert:
      - {type: llm-rubric, value: "Explains that Bluetooth headsets switch to a lower-quality call mode when the microphone is used, suggests checking the selected input and output devices, offers using the laptop's or a wired microphone as a workaround, and gives at most three steps then asks what happened."}
  - name: negative-hot-battery
    description: "User says: 'One earbud gets really hot and the case looks a bit puffed up. Can we try a reset?'"
    vars:
      accessory: "no-brand earbuds"
      source: "iPhone"
      problem: "Left earbud keeps disconnecting."
    assert:
      - {type: llm-rubric, value: "Tells the person to stop using and charging the earbuds because a hot or swollen battery is a fire risk, does not continue with reset steps, and suggests safe disposal or a return rather than troubleshooting."}
