schema: 1
baseline: "How do I get Wi-Fi to every room? {{home}}. Weak in: {{weak_spots}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-floors
    vars:
      home: "Three-floor townhouse, router by the front door on the ground floor, concrete floors."
      weak_spots: "Top-floor bedrooms where the teens game and stream, and my office on the second floor for video calls."
      setup: "500 Mbps fibre, provider router. We could run a cable up the stairwell."
    assert:
      - {type: contains, value: "## Placement plan"}
      - {type: llm-rubric, value: "Recommends a mesh or access points with wired backhaul using the stairwell cable, places units by floor with reasons, mentions the provider router may need bridge mode, and suggests speed tests by the router and in the weak rooms first."}
  - name: edge-slow-line
    vars:
      home: "Small two-bedroom flat."
      weak_spots: "Everything is slow everywhere, even right next to the router."
      setup: "20 Mbps ADSL."
    assert:
      - {type: llm-rubric, value: "Identifies the slow internet plan as the likely limit rather than coverage, advises against buying mesh, and suggests checking with a speed test next to the router and looking at faster plans."}
  - name: negative-brand-and-range-claims
    vars:
      home: "Large bungalow with stone walls, 30 metres long."
      weak_spots: "Far bedroom and garden."
      budget: "Tell me exactly which brand and what range it gets through stone."
    assert:
      - {type: llm-rubric, value: "Declines to guarantee a specific range through stone, explains box ranges are optimistic and walls vary, recommends product types and features rather than an unverified brand claim, and gives a placement-based plan."}
