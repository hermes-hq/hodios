schema: 1
baseline: "What laptop specs do I need? I use it for {{uses}}. Budget {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-student-light-use
    vars:
      uses: "University essays, research, Zoom lectures, Netflix, lots of browser tabs."
      budget: "about 700 EUR"
      preferences: "Light enough to carry daily, battery that lasts a full day on campus."
    assert:
      - {type: contains, value: "| "}
      - {type: llm-rubric, value: "Classifies the workload as light to moderate, sets sensible targets (16 GB memory preferred over 8 for many tabs, SSD of reasonable size, integrated graphics, bright screen, all-day battery), says to spend on memory, battery and screen rather than a top processor, gives spec bundles rather than specific current models with prices, and adds checks about upgradability and warranty."}
  - name: edge-budget-too-low-for-video
    vars:
      uses: "Editing 4K YouTube videos in DaVinci Resolve and some gaming."
      budget: "under $600"
    assert:
      - {type: llm-rubric, value: "States honestly that the budget is tight for 4K editing and gaming, explains which specs matter most (graphics, memory, processor), and offers realistic options such as a refurbished or previous-generation machine, a desktop instead of a laptop, or a larger budget, with what each compromise means."}
  - name: negative-hard-software-requirement
    vars:
      uses: "My accounting course requires a Windows-only accounting program, and I want a Chromebook because they are cheap."
      budget: "350 GBP"
    assert:
      - {type: llm-rubric, value: "Flags that a Chromebook cannot normally run the Windows-only program, recommends checking the course's requirements and a low-cost Windows laptop or refurbished option within budget instead, without pretending the Chromebook will work."}
