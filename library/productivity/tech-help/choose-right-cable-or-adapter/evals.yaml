schema: 1
baseline: "What cable do I need to connect {{connect_from}} to {{connect_to}}? {{purpose}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-laptop-to-tv
    vars:
      connect_from: "Windows laptop, USB-C port with a small D-shaped DisplayPort symbol, no HDMI port"
      connect_to: "4K TV, HDMI 2.0 ports"
      purpose: "Watch films and play games at 4K 60 Hz, 3 metres from the sofa."
    assert:
      - {type: contains, value: "## What to look for on the label"}
      - {type: llm-rubric, value: "Recommends a USB-C to HDMI cable or adapter rated for 4K at 60 Hz, notes the DisplayPort symbol means the port supports video, warns against 30 Hz-limited cables, and addresses the 3 metre length."}
  - name: edge-laptop-charger
    vars:
      connect_from: "Laptop with USB-C charging, original charger is 65 W"
      connect_to: "Wall socket"
      purpose: "A spare charger for the office. Can I use my 20 W phone charger instead?"
    assert:
      - {type: llm-rubric, value: "Explains that a 20 W charger will charge the laptop slowly or not at all under load, recommends a USB Power Delivery charger of at least the original wattage with a cable rated for it, and does not claim harm from a higher-watt charger."}
  - name: negative-impossible-reverse
    vars:
      connect_from: "Games console HDMI output"
      connect_to: "Laptop USB-C port"
      purpose: "Use my laptop screen as a monitor for the console with a simple USB-C to HDMI adapter."
    assert:
      - {type: llm-rubric, value: "Explains that USB-C to HDMI adapters are one-way outputs and laptop ports are not video inputs, so a simple adapter will not work; mentions that a capture device is the realistic option and its limits."}
