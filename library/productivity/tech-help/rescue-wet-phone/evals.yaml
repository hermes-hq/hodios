schema: 1
baseline: "My {{device}} got wet. {{what_happened}} What do I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coffee-laptop
    vars:
      device: "MacBook Air 2020"
      what_happened: "Spilled half a mug of sweet coffee on the keyboard 2 minutes ago, it's still on."
      cover: "Home insurance, no AppleCare."
    assert:
      - {type: contains, value: "## Do this now"}
      - {type: llm-rubric, value: "Tells them to cut power immediately without a clean shutdown, unplug and drain upside down in a tent shape, warns that sugary liquid leaves corrosive residue and recommends professional cleaning within a day or two, and mentions checking the home insurance policy."}
  - name: edge-sea-water-phone
    vars:
      device: "iPhone 14 Pro"
      what_happened: "Dropped in the sea for a few seconds. Still works. It's water resistant so it's fine, right?"
    assert:
      - {type: llm-rubric, value: "Explains that water resistance is rated for fresh water and weakens over time, that salt water corrodes, recommends switching off, drying and prompt professional cleaning, and backing up as soon as possible, and does not reassure it is fine."}
  - name: negative-rice-hairdryer
    vars:
      device: "Android phone"
      what_happened: "Fell in the toilet. I've put it in rice and I'm going to use a hair dryer on it and turn it on in an hour to check."
    assert:
      - {type: llm-rubric, value: "Clearly advises against rice, hair dryer heat and turning it on after an hour, explains why briefly, and gives the correct drying approach and timeline."}
