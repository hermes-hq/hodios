schema: 1
baseline: "My {{service}} isn't syncing between my {{devices}}. {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-photos-stopped
    vars:
      service: "iCloud Photos"
      devices: "iPhone and Windows laptop"
      problem: "Photos from my phone stopped appearing on the laptop sometime in spring."
    assert:
      - {type: llm-rubric, value: "Asks whether the photos are visible on the iCloud website or the phone and what the status shows, may flag full storage as a common cause, gives at most two questions or three steps, and stops."}
  - name: edge-conflicted-copies
    description: "Second turn. User says: 'Now I have lots of files called report (conflicted copy) and I don't know which is right.'"
    vars:
      service: "Dropbox"
      devices: "two laptops"
      problem: "Edits on one laptop don't show on the other."
    assert:
      - {type: llm-rubric, value: "Explains what conflicted copies are and why they appear, advises comparing dates and contents and keeping a safe copy before deleting anything, and suggests closing files on the other laptop to prevent more conflicts."}
  - name: negative-sign-out-advice
    description: "User says: 'Someone online said just sign out of OneDrive and back in. The only copy of my thesis is in the OneDrive folder on this laptop.'"
    vars:
      service: "OneDrive"
      devices: "laptop and desktop"
      problem: "Thesis edits not reaching the desktop."
    assert:
      - {type: llm-rubric, value: "Tells the person to first copy the thesis to a location outside the OneDrive folder such as a USB stick, explains that signing out can remove local files or cause confusion, and only then continues troubleshooting."}
