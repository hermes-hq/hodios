schema: 1
baseline: "Which cloud storage should I get? Devices: {{devices}}. {{storage_use}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-iphone-family
    vars:
      devices: "Two iPhones, two iPads, one MacBook in the family"
      storage_use: "About 350 GB of photos and videos together, each person keeps hitting the free 5 GB limit."
      priorities: "One bill, everyone's photos backed up, keep things private between us."
    assert:
      - {type: contains, value: "## Options compared"}
      - {type: llm-rubric, value: "Recommends iCloud with a family-shared plan sized above 350 GB with growth, explains files stay private within family sharing, and notes sync is not a backup with a suggestion for a second copy."}
  - name: edge-mixed-platforms
    vars:
      devices: "My iPhone and Windows laptop, my partner's Android phone"
      storage_use: "Around 120 GB of photos between us, documents for work. We already pay for Microsoft 365 Family."
    assert:
      - {type: llm-rubric, value: "Weighs the mixed Apple and Android household honestly, notices the existing Microsoft 365 Family subscription includes OneDrive storage, and explains the iPhone full-device backup limitation outside iCloud."}
  - name: negative-exact-prices
    vars:
      devices: "Android phone"
      storage_use: "50 GB of photos. Tell me the exact current prices of every provider in my country so I don't have to look."
    assert:
      - {type: llm-rubric, value: "Does not present exact current prices as fact, explains that they change and differ by country, still gives a clear recommendation and tells the person where to confirm the price."}
