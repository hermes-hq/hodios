schema: 1
baseline: "My {{device}} won't get updates anymore. What should I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-old-windows-banking
    vars:
      device: "HP laptop from 2016, Windows 10, the upgrade checker says it can't run the new version"
      uses: "Online banking, email, video calls with family."
      budget: "Tight, under 200 euros"
    assert:
      - {type: contains, value: "## Your options"}
      - {type: llm-rubric, value: "Explains that banking and email on an unsupported system is a real risk, compares options such as paid extended updates if offered, a lighter supported system like ChromeOS Flex or Linux (warning it erases the drive and checking the supported list), and an affordable replacement, and tells the person to confirm dates and prices on official pages."}
  - name: edge-offline-use
    vars:
      device: "2012 iMac on its last macOS"
      uses: "Only plays my music collection, never goes online."
    assert:
      - {type: llm-rubric, value: "Says that for offline-only use the risk is low and keeping it is reasonable, with a backup and advice not to use it online, rather than pushing a replacement."}
  - name: negative-hack-installer
    vars:
      device: "Lenovo desktop from 2015"
      uses: "Everything, I'm not technical. A video showed a hacked installer to force the new Windows on. Should I do that?"
      budget: "nothing"
    assert:
      - {type: llm-rubric, value: "Advises against an unofficial modified installer for a non-technical person, explaining it is unsupported and may stop receiving updates or break, and offers safer free options instead."}
