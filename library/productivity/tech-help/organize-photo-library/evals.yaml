schema: 1
baseline: "Help me organise my photos. {{current_situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scattered-mixed
    vars:
      current_situation: "Photos on two old Windows laptops, a 1 TB external drive, Google Photos, my iPhone and my husband's Android. Loads of duplicates and about 800 scanned prints that all show the scan date."
      tools: "Windows PC at home, open to anything free or cheap."
      photo_count: 60000
    assert:
      - {type: contains, value: "## Phase 2 Deduplicate"}
      - {type: llm-rubric, value: "Says not to delete anything until backed up in two places, gathers everything into one staging copy first, uses a full-resolution Google export that keeps dates, deduplicates by content with review and a holding folder, fixes scan dates in batches, proposes a simple year-based structure or app library with reasoning, breaks the work into sessions, and ends with an off-site backup."}
  - name: edge-apple-only-family
    vars:
      current_situation: "Everyone in the family uses iPhones and a shared Mac. Photos are in iCloud but our storage is full and we pay for 200 GB."
    assert:
      - {type: llm-rubric, value: "Considers keeping the Apple Photos library as the home with a shared library or albums, explains that iCloud alone is sync rather than backup, adds a local and off-site backup, and addresses the storage limit with deduplication and options such as a larger plan or keeping originals on the Mac with a backup."}
  - name: negative-delete-first-request
    vars:
      current_situation: "I want to start by deleting all duplicates on my external drive with a free duplicate cleaner, then I'll sort the rest. It's the only copy of our wedding photos."
    assert:
      - {type: llm-rubric, value: "Firmly advises making at least one backup copy of the only copy before running any deduplication, explains the risk of cleaner tools deleting the wrong files, and suggests moving duplicates to a holding folder after review instead of deleting."}
