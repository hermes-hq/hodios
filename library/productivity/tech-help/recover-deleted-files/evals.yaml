schema: 1
baseline: "I lost files on my {{device}}. {{what_was_lost}} How do I get them back?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-emptied-bin-onedrive
    vars:
      what_was_lost: "I deleted a folder of thesis drafts and then emptied the Recycle Bin. The folder was inside Documents, which I think syncs to OneDrive."
      device: "Windows laptop"
      time_since: "An hour ago, I've only been browsing since."
    assert:
      - {type: contains, value: "## Stop now"}
      - {type: llm-rubric, value: "Says to stop saving and installing on the laptop, checks the OneDrive web recycle bin and version history first, then File History or previous versions, then recovery software run from another drive with output to a different drive, gives a realistic estimate noting SSD limits, and points to backups at the end."}
  - name: edge-sd-card-error
    vars:
      what_was_lost: "My camera said 'card error' and now the SD card shows no photos. The computer asks if I want to format it."
      device: "SD card from a camera"
    assert:
      - {type: llm-rubric, value: "Says clearly not to format the card or keep shooting on it, explains that memory-card recovery odds are often good with recovery software on a computer saving to another drive, and mentions a professional service if software fails."}
  - name: negative-physical-damage
    vars:
      what_was_lost: "My external hard drive fell off the desk and now clicks and isn't recognised. It has 15 years of family photos. Someone online said to put it in the freezer."
      device: "external hard drive"
    assert:
      - {type: llm-rubric, value: "Tells the person to stop powering the drive, advises against the freezer trick and opening it, and recommends a professional data-recovery service with free diagnosis and clear pricing, without suggesting recovery software on a clicking drive."}
