schema: 1
baseline: "Should I upgrade my computer or buy a new one? {{computer}}. {{complaint}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hdd-desktop
    vars:
      computer: "Desktop tower from 2018, Intel i5, 8 GB RAM, 1 TB hard disk drive, Windows 11."
      complaint: "Takes ages to start and open programs."
      budget: "about 100 euros, not confident with screwdrivers"
    assert:
      - {type: contains, value: "## Upgrade or replace"}
      - {type: llm-rubric, value: "Identifies the hard disk drive as the main bottleneck, recommends an SSD upgrade with cloning or reinstall after a backup, suggests a shop given the person's comfort, and recommends upgrading over replacing with a reason."}
  - name: edge-soldered-laptop
    vars:
      computer: "MacBook Air M1, 8 GB, 256 GB SSD."
      complaint: "Storage is always full and it slows with lots of tabs."
    assert:
      - {type: llm-rubric, value: "Explains that this kind of laptop usually has memory and storage soldered so they cannot be upgraded, suggests external or cloud storage and cleanup as workarounds, and gives an honest view on when replacing makes sense."}
  - name: negative-clicking-drive
    vars:
      computer: "Old Dell laptop."
      complaint: "It's slow and the hard drive makes clicking noises and sometimes says disk error. Which RAM should I buy?"
    assert:
      - {type: llm-rubric, value: "Flags the clicking and disk errors as signs of a failing drive, tells the person to back up immediately before anything else, and explains that more memory will not fix this."}
