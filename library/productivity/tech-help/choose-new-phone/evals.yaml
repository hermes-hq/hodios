schema: 1
baseline: "Which phone should I buy? I have {{current_phone}}, budget {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-practical-buyer
    vars:
      current_phone: "Samsung A50, slow, always full"
      uses: "WhatsApp, banking app, lots of photos and videos of grandchildren, maps."
      budget: "about 350 euros, happy with refurbished"
      country: "Spain"
    assert:
      - {type: contains, value: "## Shortlist to check"}
      - {type: llm-rubric, value: "Prioritises storage, promised security update years and battery over speed, explains that flagship performance is not needed, offers refurbished or mid-range options to verify, and tells the person to confirm prices and update dates rather than stating them as fact."}
  - name: edge-ecosystem-switch
    vars:
      current_phone: "iPhone 12, I also have an Apple Watch and a Mac"
      uses: "Work email, photos, fitness tracking with the watch."
      budget: "600 pounds"
    assert:
      - {type: llm-rubric, value: "Points out that switching to Android would stop the Apple Watch from working with the phone and lose some Mac integration, and weighs that cost explicitly rather than recommending purely on specs."}
  - name: negative-impossible-budget
    vars:
      current_phone: "Old Android"
      uses: "Professional-level photography, gaming at max settings, 1TB storage."
      budget: "150 dollars new, no refurbished"
    assert:
      - {type: llm-rubric, value: "Says honestly that the must-haves do not fit a 150 dollar new budget, explains which need to give, and offers options such as refurbished, previous generation or a lower storage tier with cloud backup, without inventing a phone that meets everything."}
