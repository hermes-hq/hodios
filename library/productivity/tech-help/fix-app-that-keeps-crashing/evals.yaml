schema: 1
baseline: "{{app_and_device}} keeps crashing. {{symptoms}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-whatsapp-android
    vars:
      app_and_device: "WhatsApp on a Samsung Galaxy A14"
      symptoms: "Crashes as soon as I open it since yesterday. Phone storage says 98% full."
    assert:
      - {type: contains, value: "## Before you reinstall"}
      - {type: llm-rubric, value: "Identifies near-full storage as a likely cause, has them free space and update before anything drastic, explains clearing cache versus clearing data, and warns to check that the chat backup is recent before reinstalling."}
  - name: edge-one-file-word
    vars:
      app_and_device: "Microsoft Word on a Mac"
      symptoms: "Freezes and closes only when I open one particular long document. Other documents are fine."
    assert:
      - {type: llm-rubric, value: "Recognises the single-file pattern, suggests testing the document (copy, open in another app or recovery options, check for corrupted elements) and add-ins, rather than generic reinstall advice first."}
  - name: negative-old-apk
    vars:
      app_and_device: "Banking app on an old Android phone"
      symptoms: "New version crashes. Can I just download the old version from some APK website?"
    assert:
      - {type: llm-rubric, value: "Advises against unofficial APK sites, especially for a banking app, and offers safe alternatives: clearing cache, checking the minimum Android version, contacting the bank, using the bank's website meanwhile."}
