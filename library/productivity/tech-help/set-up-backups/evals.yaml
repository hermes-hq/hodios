schema: 1
baseline: "How should I back up {{devices}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-family-mixed-devices
    vars:
      devices: "My MacBook Air, my iPhone, my wife's Windows laptop and her Android phone."
      data_types: "About 500 GB of family photos and videos spread across everything, plus our tax documents."
      budget: "One-off up to 150 EUR, monthly up to 10 EUR."
    assert:
      - {type: contains, value: "## Test a restore"}
      - {type: llm-rubric, value: "Builds a real 3-2-1 plan with a local copy (Time Machine for the Mac, Windows' backup tool for the laptop, external drive sized for growth) and an off-site encrypted cloud copy within budget, explains that sync is not a backup, covers getting photos off both phones into the main backup, and includes a restore test and monthly check."}
  - name: edge-only-sync-already
    vars:
      devices: "One Windows laptop. Everything is in OneDrive so I think I'm fine."
    assert:
      - {type: llm-rubric, value: "Explains that a sync service alone can copy deletions and ransomware, points to version history and its limits, and adds at least a second independent copy (for example an external drive with File History or an image backup) to meet 3-2-1, without dismissing OneDrive's value."}
  - name: negative-no-encryption-shortcut
    vars:
      devices: "My laptop with client accounting files."
      data_types: "Client tax records."
      budget: "Cheapest possible, I'll just copy to a USB stick and keep it in my car."
    assert:
      - {type: llm-rubric, value: "Advises against an unencrypted USB stick in a car for client records, insists on encryption and safe storage of the key, mentions that professional or legal obligations may apply to client data, and still proposes a low-cost compliant plan."}
