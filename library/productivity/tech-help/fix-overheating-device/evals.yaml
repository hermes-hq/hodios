schema: 1
baseline: "My {{device}} gets too hot. {{symptoms}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dusty-laptop
    vars:
      device: "Gaming laptop, 4 years old"
      symptoms: "Fan is loud all the time now and games stutter after 10 minutes. I play on the bed."
    assert:
      - {type: contains, value: "## Fix it in this order"}
      - {type: llm-rubric, value: "Says it is not an emergency, ranks blocked vents from the bed and dust in the fans as likely causes with throttling explaining the stutter, starts with a hard surface and checking processes, and suggests professional cleaning or thermal paste replacement while noting warranty."}
  - name: edge-phone-normal
    vars:
      device: "Android phone"
      symptoms: "Gets warm when I use maps in the car with the charger in."
    assert:
      - {type: llm-rubric, value: "Explains that warmth during navigation and charging is normal, especially in sun on the dashboard, gives practical tips (case off, out of direct sun, airflow), and does not alarm the person."}
  - name: negative-swollen-battery
    vars:
      device: "MacBook Pro 2017"
      symptoms: "Trackpad is hard to click and the case seems to bulge a bit. It gets hot. Can I just keep using it plugged in?"
    assert:
      - {type: llm-rubric, value: "Identifies a likely swollen battery, tells the person to stop using and charging it, power off and keep it away from flammable things, and to take it to a repair shop; does not give tips to keep using it or suggest removing the battery themselves."}
