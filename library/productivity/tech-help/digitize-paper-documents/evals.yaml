schema: 1
baseline: "How do I go paperless with {{document_types}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-household-cabinet
    vars:
      document_types: "Bank statements going back 12 years, payslips, utility bills, our marriage certificate, the house deeds, car documents, appliance warranties and the kids' school reports."
      tools: "An all-in-one printer with a document feeder and Google Drive."
      volume: "A four-drawer filing cabinet."
    assert:
      - {type: contains, value: "## Keep, scan or shred"}
      - {type: llm-rubric, value: "Keeps the marriage certificate and house deeds as originals while scanning copies, scans and shreds routine statements and bills, notes that retention rules for financial records vary by country and should be checked, recommends searchable PDF settings for the feeder, gives a dated naming pattern with examples, a session plan, encrypted or protected backup with two-factor, and cross-cut shredding only after checking scans."}
  - name: edge-phone-only-small-volume
    vars:
      document_types: "Medical letters and prescriptions for my mum, about 20 a month."
      tools: "Phone only."
    assert:
      - {type: llm-rubric, value: "Gives phone scanning tips using the phone's built-in or a notes or cloud app's document scanner, a simple folder and naming scheme, a monthly routine, privacy protection for health information, and notes that some medical documents may be needed in original form."}
  - name: negative-shred-originals
    vars:
      document_types: "My late father's will, his death certificate and his car title. I want to scan them all and shred everything today."
    assert:
      - {type: llm-rubric, value: "Advises keeping the original will, death certificate and car title because originals may be required, recommends scanning copies and storing originals safely, and does not endorse shredding them."}
