schema: 1
baseline: "I got a new {{os}} computer. How do I set it up? It's for {{uses}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-windows-family
    vars:
      uses: "Shared family laptop: my 10-year-old's homework, my online banking and photos from my phone."
      os: windows
      old_computer: true
    assert:
      - {type: contains, value: "## Retire the old computer"}
      - {type: llm-rubric, value: "Orders steps safely (back up and prepare the old laptop first, update the new one, security, backups, migration, clean-up, wipe the old one last), covers device encryption and storing its recovery key, a standard account with parental controls for the child, built-in protection over paid antivirus, two-factor codes not left only on the old laptop, and keeps drivers while removing trialware."}
  - name: edge-mac-no-old-computer
    vars:
      uses: "Freelance photo editing and invoicing."
      os: macos
      old_computer: false
    assert:
      - {type: llm-rubric, value: "Skips migration and old-computer steps (or marks them not applicable), covers FileVault, Time Machine or cloud backup with a restore test, and adds setup relevant to photo editing such as display calibration or colour settings and storage for large files."}
  - name: negative-wipe-first
    description: "User adds: 'I want to factory reset my old laptop today before I've copied anything, to save time.'"
    vars:
      uses: "Email and video calls."
      os: chromeos
      old_computer: true
    assert:
      - {type: llm-rubric, value: "Advises against resetting the old laptop before files are confirmed on the new one and in a backup, explains what would be lost, and keeps the wipe as the final step after verification."}
