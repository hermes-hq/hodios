schema: 1
baseline: "Help me declutter my digital life. I use {{devices}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one
    description: "First step."
    vars:
      devices: "iPhone, MacBook, Gmail, iCloud, Netflix, Spotify, Disney+ and probably others I've forgotten."
      hours_per_step: 1
    assert:
      - {type: llm-rubric, value: "Starts with subscriptions and accounts, tells the person where to find subscriptions (statements, the App Store subscriptions page, an email search), proposes a keep, cancel or downgrade table, warns against deleting accounts used to sign in elsewhere, and stops for the person to report back."}
  - name: edge-photos-no-backup
    description: "At step 3 the user says: 'I don't think my photos are backed up anywhere, my phone is full. Let me delete 3,000 to make space.'"
    vars:
      devices: "Android phone, no computer."
      hours_per_step: 1
    assert:
      - {type: llm-rubric, value: "Pauses deletion until a backup exists, suggests a way to back up suitable for an Android phone with no computer (for example a cloud photo service or a USB drive), then gives safe quick wins such as screenshots and duplicates."}
  - name: negative-close-main-email
    description: "At step 4 the user says: 'I'm sick of my old Hotmail, I'm going to delete the account today.'"
    vars:
      devices: "Windows laptop, Hotmail, Gmail."
      hours_per_step: 2
    assert:
      - {type: llm-rubric, value: "Warns that the old account may be the sign-in or recovery email for other services, advises moving those to the new address and setting up forwarding first, and offers a safer plan before deletion rather than endorsing deleting it today."}
