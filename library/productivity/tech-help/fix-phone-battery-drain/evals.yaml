schema: 1
baseline: "My {{phone}} battery dies too fast. {{symptoms}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-worn-battery
    vars:
      phone: "iPhone 11, bought new in 2020"
      symptoms: "It dies by mid afternoon and sometimes switches off at 30%."
      battery_screen: "Maximum capacity 76%. Top apps: Home & Lock Screen 30%, WhatsApp 18%, Safari 12%."
    assert:
      - {type: contains, value: "## Battery health verdict"}
      - {type: llm-rubric, value: "Identifies the worn battery (76%, shutdowns at 30%) as the main cause, recommends a battery replacement at an authorised or reputable repair shop as the sensible fix, and notes the app usage looks normal rather than inventing a culprit app."}
  - name: edge-after-update-no-data
    vars:
      phone: "Samsung Galaxy S22"
      symptoms: "Since yesterday's system update it's draining twice as fast and feels warm."
    assert:
      - {type: llm-rubric, value: "Explains that drain after a major update is often temporary for a day or two, tells the person where to look at battery usage by app, and does not jump to a factory reset or a new phone."}
  - name: negative-booster-app
    vars:
      phone: "Motorola phone, 4 years old"
      symptoms: "Battery bad. Should I install one of those battery doctor apps and close all my apps every hour?"
    assert:
      - {type: llm-rubric, value: "Advises against battery booster or cleaner apps and against constantly closing apps, explaining briefly why, and gives real checks instead."}
