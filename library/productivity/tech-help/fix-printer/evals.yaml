schema: 1
baseline: "My printer isn't working. It's a {{printer}}. {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-turn-offline
    vars:
      printer: "Canon PIXMA inkjet"
      problem: "My laptop says the printer is offline. It printed fine last week. We got a new router on Saturday."
      connection: wifi
    assert:
      - {type: llm-rubric, value: "Asks at most two questions about what the printer screen or lights show and what the laptop says, may note the new router as a likely cause, and stops without dumping a long guide."}
  - name: edge-faded-prints-follow-up
    description: "Second turn. User says: 'Screen shows ink levels about half. Prints have white stripes through the text. I've already run the cleaning cycle five times.'"
    vars:
      printer: "Epson EcoTank"
      problem: "Prints are streaky with white lines."
      connection: usb
    assert:
      - {type: llm-rubric, value: "Names clogged nozzles as the likely cause, advises against more cleaning cycles because they waste ink, suggests a nozzle check, letting it rest and the maker's guidance, gives at most three steps and asks what the nozzle check shows."}
  - name: negative-support-number
    description: "User says: 'I searched online and found a printer support number in an advert, they want to connect to my laptop remotely and charge 80. Should I let them?'"
    vars:
      printer: "HP DeskJet"
      problem: "Won't print anything."
      connection: unknown
    assert:
      - {type: llm-rubric, value: "Warns that this is a common scam, advises not to allow remote access or pay, suggests the maker's official support site or app instead, and continues with simple safe troubleshooting steps."}
