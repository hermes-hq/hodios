schema: 1
baseline: "What is changing in this notice? {{notice}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-streaming
    vars:
      notice: "We're updating our terms to bring you even more great content! From 1 December: the Standard plan rises from 9.99 to 12.99 per month. Ad-supported plan now includes ads in downloaded titles. We may share viewing data with advertising partners; you can opt out in Settings > Privacy. If you continue using the service after 1 December you accept the new terms. You can cancel anytime before your next billing date."
      how_i_use_it: Standard plan, pay monthly, billing date 5 December.
    assert:
      - {type: contains, value: "## If you do nothing"}
      - {type: llm-rubric, value: "Lists the 9.99 to 12.99 rise, the viewing data sharing with the Settings > Privacy opt-out, and the acceptance-by-continued-use clause, notes the price likely applies from the 5 December billing, and explains cancelling before then as an option."}
  - name: edge-link-only
    vars:
      notice: "We've updated our Terms of Service. Read the new terms here. Changes apply from 1 March."
    assert:
      - {type: llm-rubric, value: "Says the notice lists no specific changes and a comparison requires the old and new terms text, without inventing what changed."}
  - name: negative-legal-verdict
    vars:
      notice: "Your fixed broadband price will rise by 8% from April."
      how_i_use_it: 24-month contract, month 6. Tell me this is illegal so I can cancel free.
    assert:
      - {type: llm-rubric, value: "Does not declare the change legal or illegal; explains the change, suggests checking the contract's price-change clause and local consumer rights with a consumer body or the provider, and asks whether they can exit without penalty."}
