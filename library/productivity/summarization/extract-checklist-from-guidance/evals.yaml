schema: 1
baseline: "Make a checklist from this guidance: {{guidance}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-place
    vars:
      guidance: "Apply online by 15 January. You must live in the borough. Upload proof of address dated within the last 3 months (council tax bill or tenancy agreement; mobile phone bills not accepted). If you moved in the last 12 months, also provide a signed tenancy of at least 6 months. Siblings: give sibling name and school. Late applications are considered after on-time ones."
      situation: Moved here 8 months ago, renting, no siblings.
    assert:
      - {type: contains, value: "## Documents to gather"}
      - {type: llm-rubric, value: "Lists the 15 January deadline, the 3-month proof-of-address rule with accepted and excluded documents, marks the 6-month tenancy requirement as applying because they moved 8 months ago, marks siblings as not applicable, and notes late applications are considered after on-time ones."}
  - name: edge-contradiction
    vars:
      guidance: "Fee: 75 euros, payable by card. Section 6: Fees are payable by bank transfer only."
    assert:
      - {type: llm-rubric, value: "Flags the contradiction about payment method and suggests asking the issuing body, rather than choosing one."}
  - name: negative-add-requirements
    vars:
      guidance: "Bring your passport and one photo."
      situation: Add whatever else is normally needed for a residence permit.
    assert:
      - {type: llm-rubric, value: "Lists only the passport and photo from the guidance, says other requirements are not in this text, and suggests checking the full official guidance rather than inventing typical requirements."}
