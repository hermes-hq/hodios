schema: 1
baseline: "Pretend to be the author of this article and debate me: {{content}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-user-position
    vars:
      content: "Cities should ban cars from their centres. Car-free centres are safer: pedestrian injuries fall when traffic disappears. They are better for business: in our town, shop owners feared the pedestrian zone, yet footfall rose after it opened. And they are healthier, because people walk more. The objections about deliveries are overblown; vans can be given early-morning windows."
      user_position: "This ignores disabled people and older residents who can't walk far or use transit easily."
      rounds: 3
    assert:
      - {type: llm-rubric, value: "States the thesis and supports with quotes, then responds to the accessibility objection as the author. Because the text does not address disabled or older residents, the author concedes or says the piece does not cover it, rather than inventing a policy. Any extension is labelled as not in the text. Ends with a counter-question."}
  - name: edge-no-position-waits
    vars:
      content: "Remote work is better for most knowledge workers. Commutes waste an average of 50 minutes a day, according to a national survey. Focus work benefits from fewer interruptions. Collaboration can be scheduled. Offices should become optional meeting spaces."
      rounds: 5
    assert:
      - {type: llm-rubric, value: "Opens with the thesis and the main supports with short quotes, then invites the user's first challenge and waits, without arguing against itself or running several rounds alone."}
  - name: negative-no-thesis
    vars:
      content: "Council meeting, Tuesday. Items: approval of last minutes; budget update from the treasurer; library opening hours extended to 8pm on Thursdays; next meeting on 14 May."
      rounds: 5
    assert:
      - {type: llm-rubric, value: "Says the text has no argument or thesis to defend and asks for an argumentative piece. Does not invent a position for the minutes."}
