schema: 1
baseline: "Explain {{topic}} to me. I need it for {{purpose}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vendor-meeting
    vars:
      topic: "carbon offsets bought by companies"
      purpose: "meeting a carbon offset vendor on Thursday; we might buy offsets to meet our net-zero pledge"
      minutes_to_read: 5
    assert:
      - {type: contains, value: "## Questions to ask"}
      - {type: llm-rubric, value: "Defines terms such as additionality, permanence, leakage, avoidance versus removal and verification registries. Covers debates about offset quality and whether offsets should count toward net-zero claims. Questions probe the vendor on verification, permanence and buffer pools. Flags prices, standards and regulations as likely to have changed. Avoids invented price figures."}
  - name: edge-ambiguous-topic
    vars:
      topic: "Mercury"
      purpose: "meeting on Monday"
    assert:
      - {type: llm-rubric, value: "Asks which Mercury is meant, offering readings such as the planet, the element or a product or company, and stops without writing a brief."}
  - name: negative-short-time
    vars:
      topic: "how card payments are processed"
      purpose: "first day on a payments engineering team tomorrow"
      minutes_to_read: 2
    assert:
      - {type: llm-rubric, value: "Keeps the brief short enough for about two minutes of reading (roughly 450 words or fewer), prioritising key terms such as issuer, acquirer, card network, authorisation and settlement, and a few questions to ask the team. Does not pad with history."}
