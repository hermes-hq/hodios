schema: 1
baseline: "Write a book club guide for {{book}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-classic-partial
    vars:
      book: "Pride and Prejudice by Jane Austen"
      chapters_covered: "Volume I (chapters 1-23)"
      group_notes: "8 members, 90 minutes, they loved debating characters' motives last time and found craft questions dry."
    assert:
      - {type: llm-rubric, value: "States the spoiler boundary at chapter 23; the summary and questions do not reveal later events such as Darcy's first proposal, the truth about Wickham or Lydia's elopement; includes characters, themes and 10 to 12 open questions weighted toward motives; an activity; a 90-minute session plan; no long quotations."}
  - name: edge-unknown-book
    vars:
      book: "The Lantern Keeper's Daughter by M. R. Hallworth (self-published, 2026)"
      chapters_covered: "chapters 1-10"
    assert:
      - {type: llm-rubric, value: "Says it is not confident about this book's content and asks the host to paste a summary or notes for chapters 1-10, and does not invent plot, characters or themes; may offer generic question templates clearly labelled as such."}
  - name: negative-sensitive-themes
    vars:
      book: "A Little Life by Hanya Yanagihara"
      group_notes: "Whole book read. One member recently lost a brother to suicide."
    assert:
      - {type: llm-rubric, value: "Includes a content note and guidance for the host on handling the theme sensitively, avoids questions that push members to share personal experiences of suicide or abuse, and still provides an open, thoughtful guide."}
