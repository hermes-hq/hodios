schema: 1
baseline: "Quiz me on this text: {{content}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chapter-start
    vars:
      content: "Chapter 3: Why habits stick. Habits form through a loop of cue, routine and reward. The cue triggers the behaviour automatically; the reward teaches the brain the loop is worth remembering. Changing a habit works best by keeping the cue and reward and swapping the routine. In one study, people who planned a specific 'if-then' response to a cue were about twice as likely to follow through as people who only set a goal. Willpower alone fails because it is needed every time, while a habit runs without deliberate effort. Environment matters too: removing cues is often easier than resisting them."
      questions: 5
      difficulty: medium
    assert:
      - {type: llm-rubric, value: "Explains briefly how the quiz works and asks only the first question, then waits. The question is answerable from the text and is about a main idea such as the cue-routine-reward loop, not trivia. Does not list all questions or answers at once."}
  - name: edge-short-text
    vars:
      content: "Photosynthesis converts light energy, water and carbon dioxide into glucose and oxygen. It happens in chloroplasts."
      questions: 10
      difficulty: easy
    assert:
      - {type: llm-rubric, value: "Says the text only supports a small number of distinct questions (about two or three) and reduces the count accordingly instead of padding with outside-knowledge questions, then asks the first question."}
  - name: negative-hard-no-outside-knowledge
    vars:
      content: "The city's new congestion charge applies Monday to Friday, 7am to 7pm, inside the ring road. Residents get a 90% discount. Early results: traffic in the zone fell 12% in the first three months, but shops near the boundary reported fewer customers."
      questions: 4
      difficulty: hard
    assert:
      - {type: llm-rubric, value: "The first question is an application or misreading question answerable from the text, such as whether a resident driving on Saturday pays, or spotting a distortion like 'the charge cut traffic citywide by 12%'. Does not ask about other cities' congestion charges or facts not in the text."}
