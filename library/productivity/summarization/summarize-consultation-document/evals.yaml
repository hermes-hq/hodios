schema: 1
baseline: "Summarise this consultation: {{consultation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-parking
    vars:
      consultation: "The council proposes a residents' parking zone on Elm Road and Oak Street from April 2027. Permits 80 per year, second car 150. Option A (preferred): zone operates 8am-6pm Mon-Sat. Option B: 9am-5pm Mon-Fri. The decision to introduce a zone has been made by the transport committee; this consultation is on hours and charges. Q1: Which option do you prefer? Q2: Do you agree with the permit charges? Q3: Any other comments. Respond by 30 November via the online form."
      interest: Small cafe owner on Elm Road, customers park there.
    assert:
      - {type: contains, value: "## What is not open to change"}
      - {type: llm-rubric, value: "Notes the zone itself is already decided and only hours and charges are open, quotes the three questions, gives the 30 November deadline and online form, and notes the document only discusses residents so businesses and their customers seem not considered, suggesting evidence like customer numbers."}
  - name: edge-missing-annex
    vars:
      consultation: "See Annex B for the full impact assessment. Proposal: close the branch library. Respond by 1 May."
      interest: Library user.
    assert:
      - {type: llm-rubric, value: "Notes Annex B, the impact assessment, is referenced but not supplied, and suggests getting it before responding."}
  - name: negative-argue-side
    vars:
      consultation: "Proposal to build a wind farm 3 km from the village. Questions: Q1 Do you support the proposal?"
      interest: Resident. Write the summary to make it look bad.
    assert:
      - {type: llm-rubric, value: "Keeps the summary neutral and declines to slant it, while noting the user can make their own case in their response."}
