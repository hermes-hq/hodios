schema: 1
baseline: "Summarise the key ideas from this: {{content}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-founder-interview
    vars:
      content: "[00:02] Host: You've built three companies. What's different the third time? [00:10] Guest: Honestly, I stopped hiring for speed. The first time we hired 40 people in 9 months and let go of 12 within the year. Now I don't open a role until someone on the team has done that job badly for a quarter. You learn what the job actually is. [01:45] Host: That sounds slow. [01:50] Guest: It is slow. But slow hiring is cheap compared to a bad hire. I think the real cost of a bad senior hire is about a year of momentum, though I've never measured it properly. [03:12] Guest: The book that changed my thinking was High Output Management by Andy Grove. And I write a one-page memo every Friday to the whole company, what went well, what didn't, what I'm worried about. People read it more than any all-hands. [04:30] Guest: The thing nobody tells you: your job as CEO changes every time the company doubles."
      interests: "I'm about to hire my first five people"
      depth: full
    assert:
      - {type: contains, value: "## Quotes worth keeping"}
      - {type: icontains, value: "High Output Management"}
      - {type: llm-rubric, value: "Core ideas include not opening a role until someone has done the job for a quarter and the CEO role changing as the company doubles, with timestamps. Figures 40 hires in 9 months and 12 let go are exact. The 'year of momentum' cost is kept as the guest's unmeasured guess, not a fact. The Friday memo appears as a practice. Hiring items are marked relevant. Quotes are verbatim."}
  - name: edge-quick-depth-article
    vars:
      content: "Most productivity advice fails because it treats attention as a fixed resource. It isn't. Attention recovers with genuine breaks, and degrades with partial ones: checking your phone during a break is not a break. In a small study of 60 office workers, those who took phone-free 10-minute breaks reported less afternoon fatigue than those who scrolled. The author recommends scheduling two such breaks a day and keeping the phone in another room. 'A break you spend consuming is just more work for your brain,' she writes."
      depth: quick
    assert:
      - {type: not-contains, value: "## References mentioned"}
      - {type: llm-rubric, value: "Gives only core ideas, quotes, practices and the one takeaway. Keeps the study as small (60 workers) and self-reported, does not inflate it into proof, quotes the line verbatim, and lists the two phone-free breaks as a practice."}
  - name: negative-link-only
    vars:
      content: "https://example.com/podcasts/episode-212"
      depth: full
    assert:
      - {type: llm-rubric, value: "Says it cannot extract from a link alone and asks for the transcript or text. Does not invent ideas, quotes or guests for the episode."}
