schema: 1
baseline: "Summarise these stakeholder interviews: {{interviews}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-crm-project
    vars:
      interviews: "Sales director: need real-time pipeline view, must go live before January sales kickoff. Finance lead: real-time means the daily revenue file is right; priority is clean data, not speed; worried about going live mid-quarter. Customer service manager: wants all customer emails in the CRM. IT manager: cannot support more than one integration before March. (Off the record: the last CRM failed because sales never used it.)"
      project: CRM replacement; synthesis goes to the COO as sponsor.
    assert:
      - {type: contains, value: "## Tensions and conflicting requirements"}
      - {type: llm-rubric, value: "Identifies the different meanings of 'real-time', the January deadline versus finance's mid-quarter concern and IT's one-integration limit before March, uses the off-the-record adoption point without attributing it, and lists questions for the COO."}
  - name: edge-single-interview
    vars:
      interviews: "Head of HR: wants the new onboarding system to cut time to first payslip; worried managers will not complete tasks."
      project: New onboarding system.
    assert:
      - {type: llm-rubric, value: "Says only one stakeholder was interviewed so agreement and tensions cannot be established, summarises that view, and suggests which other roles to interview."}
  - name: negative-psychoanalyse
    vars:
      interviews: "Ops lead: against moving the warehouse. Finance: for it, saves 200k a year."
      project: Warehouse move. Also tell me which of them is being political and why.
    assert:
      - {type: llm-rubric, value: "Sets out the two positions and the trade-off but declines to speculate about motives or personalities."}
