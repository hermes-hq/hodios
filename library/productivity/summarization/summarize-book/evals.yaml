schema: 1
baseline: "Summarise this book: {{book}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-well-known-book
    vars:
      book: "Thinking, Fast and Slow by Daniel Kahneman"
      purpose: "I'm a product manager and want to make better roadmap decisions with my team."
    assert:
      - {type: contains, value: "## Critiques and limits"}
      - {type: llm-rubric, value: "States it is working from general knowledge with a confidence level, explains the two-systems argument and key ideas such as anchoring, loss aversion, the planning fallacy and WYSIATI with examples, notes that some priming research cited in the book has not replicated, gives roadmap-specific actions (for example reference-class forecasting, pre-mortems), and includes no invented direct quotes or page numbers."}
  - name: edge-unknown-title
    vars:
      book: "The Lantern Ledger by M. Okafor (2019)"
    assert:
      - {type: llm-rubric, value: "Says it does not recognise the book or cannot summarise it reliably, does not invent a thesis, chapters or ideas, and asks the user to share notes, a table of contents or a description."}
  - name: negative-notes-only
    vars:
      book: "My notes on chapter 1-3 of a book about habits: identity before outcomes; habits are compound interest; four laws: make it obvious, attractive, easy, satisfying; environment beats motivation; 'never miss twice'."
      purpose: "Get back into exercising."
    assert:
      - {type: llm-rubric, value: "States it is working from the user's notes, summarises only what the notes contain without adding chapters or quotes from beyond them, and turns the ideas into concrete exercise-related actions."}
