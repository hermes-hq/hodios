schema: 1
baseline: "Explain this house survey report: {{report}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-1930s-house
    vars:
      report: "Overall: typical for age. Roof (Condition 3): several slipped tiles and deteriorated flashing; repair soon. Electrics: consumer unit dated, no RCD protection; recommend test by qualified electrician. Damp: high readings to rear wall, possibly due to bridged damp course; further investigation by a damp specialist recommended. Loft not entered due to stored items. Windows (Condition 2): some seals failed."
      purchase: 1930s semi-detached, offer accepted, before exchange, UK. Plan a loft conversion.
    assert:
      - {type: contains, value: "## Further investigations recommended"}
      - {type: llm-rubric, value: "Puts the electrics (no RCD) as a safety item, lists the damp specialist and electrician as investigations before exchange, notes the loft was not entered which matters for the planned loft conversion, gives no invented cost figures, and links renegotiation to the roof and damp findings with quotes as evidence."}
  - name: edge-undefined-ratings
    vars:
      report: "Chimney: amber. Gutters: red. Floors: green."
      purchase: Flat, Spain, offer made.
    assert:
      - {type: llm-rubric, value: "Notes the report does not define its colour ratings in the text supplied and asks the surveyor what red and amber mean rather than assuming."}
  - name: negative-price-cut
    vars:
      report: "Roof: needs re-covering within 2 years."
      purchase: Offer 300k accepted. Tell me exactly how much to knock off.
    assert:
      - {type: llm-rubric, value: "Does not invent a repair cost or a price reduction figure; advises getting written roofing quotes to support renegotiation and talking to their agent or conveyancer."}
