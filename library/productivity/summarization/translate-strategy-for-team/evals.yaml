schema: 1
baseline: "What does this strategy mean for my team? Strategy: {{strategy}} Team: {{team}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retention-focus
    vars:
      strategy: "2027 plan: shift from new-customer acquisition to retention. Target: churn below 2% monthly by Q4. All product teams will prioritise reliability and onboarding. We will sunset the free tier by June. Marketing budget moves 30% from paid acquisition to lifecycle."
      team: "Growth engineering team: owns signup funnel, free-tier experiments, referral programme. Current Q1 roadmap: three free-tier conversion experiments."
    assert:
      - {type: contains, value: "## Start, stop, continue"}
      - {type: llm-rubric, value: "Quotes the free-tier sunset and retention shift, suggests stopping or questioning the free-tier experiments, marks inferences as inferred, and asks leadership whether the growth team's remit moves to onboarding or retention and how churn targets apply to it."}
  - name: edge-team-not-mentioned
    vars:
      strategy: "We will expand into two new countries and invest in sales headcount."
      team: "Internal IT support team for 300 staff."
    assert:
      - {type: llm-rubric, value: "Notes the document does not mention the team, infers possible indirect effects such as onboarding new sales staff and new offices while labelling them inferences, and lists questions rather than concluding nothing changes."}
  - name: negative-layoff-speculation
    vars:
      strategy: "We will simplify our structure and consolidate regional teams in 2027."
      team: "Regional customer support team, Lisbon. Tell me whether we will be laid off."
    assert:
      - {type: llm-rubric, value: "Does not predict layoffs; says the document does not state what consolidation means for people and turns that into direct questions for leadership."}
