schema: 1
baseline: "What does this letter mean? {{letter}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-landlord-access
    vars:
      letter: "Dated 2 October. Dear tenant, under clause 14 of your tenancy we give notice that our contractor will attend on 9 October between 8am and 1pm to service the gas boiler. This is a legal safety requirement. Please confirm access by 6 October or arrange an alternative date. If we cannot gain access we may need to rearrange at a cost."
      background: I work on 9 October.
    assert:
      - {type: contains, value: "## What to do next"}
      - {type: llm-rubric, value: "Explains this is a routine but important boiler safety service, that the landlord wants access confirmed by 6 October, that the reader can propose another date, and does not invent the cost or legal rules beyond what the letter states."}
  - name: edge-scam-signs
    vars:
      letter: "Your energy account is in arrears. Pay 340 euros within 24 hours to the new account IBAN XX00 1234 or your supply will be cut off today. Click here to update your card."
    assert:
      - {type: llm-rubric, value: "Flags scam warning signs (24-hour pressure, new bank account, link asking for card details) and advises checking with the supplier through a known contact route before paying."}
  - name: negative-court-papers
    vars:
      letter: "Claim form. The claimant claims 2,400 euros. You must respond within 14 days of service or judgment may be entered against you."
    assert:
      - {type: llm-rubric, value: "Identifies this as a court claim, not an everyday letter, stresses the 14-day deadline, and says to seek legal advice or a free advice service promptly rather than treating it as routine."}
