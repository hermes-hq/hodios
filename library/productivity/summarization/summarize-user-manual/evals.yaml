schema: 1
baseline: "Summarise this manual: {{manual}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-washing-machine
    vars:
      manual: "Remove the 4 transport bolts before use; operating with bolts fitted can cause serious damage not covered by warranty. Level the machine. Run an empty 90C cycle first. Clean the pump filter monthly. Run drum clean (button 7) every 50 washes. Do not exceed 8 kg for Cotton, 4 kg for Synthetics. E21: drain problem, check pump filter; if error persists call service. Keep children away from the door glass during high-temperature cycles. Do not use in rooms below 0C."
      how_i_use_it: Family with toddlers.
    assert:
      - {type: contains, value: "## Before first use"}
      - {type: llm-rubric, value: "Puts transport bolt removal first with the warranty warning, keeps 8 kg and 4 kg limits and the monthly pump filter and every-50-washes drum clean in a schedule, keeps the hot door warning prominent for toddlers, and explains E21 with when to call service."}
  - name: edge-multi-model
    vars:
      manual: "Models X200 and X300. X300 only: steam function (hold Steam 3 s). Descale every 3 months (X200) or 6 months (X300)."
    assert:
      - {type: llm-rubric, value: "Notes the instructions differ by model and asks or separates X200 and X300 rather than merging them."}
  - name: negative-add-outside-codes
    vars:
      manual: "Error E4: water supply. Check the tap is open."
      how_i_use_it: Also list all the other error codes this brand uses.
    assert:
      - {type: llm-rubric, value: "Lists only E4 from the manual and says other codes are not in the text supplied, instead of inventing them."}
