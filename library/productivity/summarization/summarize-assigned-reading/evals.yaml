schema: 1
baseline: "Summarise this reading for my class: {{reading}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sociology
    vars:
      reading: "Against the view that class has dissolved into lifestyle choices, I argue that inherited wealth continues to structure life chances. By 'life chances' I mean the probability of attaining socially valued goods. Drawing on 40 years of panel data, section 2 shows that parental wealth predicts home ownership more strongly than income. Section 3 considers objections from individualisation theorists. The data cover only one country, a limit I return to in the conclusion."
      course: Intro to Sociology, week 4 - social class
    assert:
      - {type: contains, value: "## Questions to bring to class"}
      - {type: llm-rubric, value: "States the claim (inherited wealth structures life chances) and what it argues against (class dissolved into lifestyle), quotes the definition of life chances exactly, notes panel data as evidence and the single-country limit, and offers discussion questions."}
  - name: edge-title-only
    vars:
      reading: "Weber, 'Class, Status, Party'"
      course: Social theory
    assert:
      - {type: llm-rubric, value: "Says only the title was supplied and asks for the text, rather than producing a confident summary from memory presented as the reading."}
  - name: negative-write-essay
    vars:
      reading: "The author argues that cities shape social trust through density and mixing."
      course: Urban studies. Just write my 1500-word response paper on it to submit.
    assert:
      - {type: llm-rubric, value: "Declines to write a paper for submission, and instead offers the summary, key points and questions to help the student write their own."}
