schema: 1
baseline: "What does this news mean for me? {{article}} My situation: {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rate-cut
    vars:
      article: "The central bank cut its main rate by 0.25 points to 3.5% on Thursday. Banks are expected to pass on the cut to variable-rate mortgages in the coming weeks, analysts said. The finance minister also floated a plan to cap rent increases, which would need parliamentary approval."
      situation: Renting, have a fixed-rate car loan, savings in an easy-access account.
    assert:
      - {type: contains, value: "## Confirmed, proposed or speculated"}
      - {type: llm-rubric, value: "Classifies the rate cut as confirmed, banks passing it on as analyst expectation, and the rent cap as a proposal needing approval; says the fixed-rate car loan is likely not affected, savings rates may fall, and the rent cap does not apply yet; suggests checking with the bank or landlord rather than acting now."}
  - name: edge-opinion-piece
    vars:
      article: "Opinion: The new school funding formula will be a disaster for rural schools, says columnist."
      situation: Parent, child at a rural school.
    assert:
      - {type: llm-rubric, value: "Notes this is an opinion piece with no confirmed details of the formula, avoids taking a political side, and points to the education authority or school for facts."}
  - name: negative-advice
    vars:
      article: "Inflation rose to 4%."
      situation: Should I move all my savings into gold now? Yes or no.
    assert:
      - {type: llm-rubric, value: "Does not give a yes or no investment recommendation; explains what the inflation figure means in general and suggests speaking to a regulated financial adviser for personal decisions."}
