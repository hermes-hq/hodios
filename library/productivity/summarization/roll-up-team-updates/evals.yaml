schema: 1
baseline: "Combine these team updates into one update for my boss: {{updates}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-four-updates
    vars:
      updates: "Ana (payments): migrated 60% of merchants to new API, rest by 24 Oct. Need security sign-off by 15 Oct or we slip. Ben (payments): lots of meetings with vendor, fixed two bugs. Chloe (onboarding): signup conversion up from 31% to 34% after form change. Dev (onboarding): hiring for second designer stalled, no budget approval yet."
      audience: Head of product, cares about launch dates and hiring.
    assert:
      - {type: contains, value: "## Asks for leadership"}
      - {type: llm-rubric, value: "Groups by theme (payments migration, onboarding) not by person, keeps 60%, 24 Oct, 31% to 34% exactly, lists the security sign-off by 15 Oct and the designer budget approval as asks for leadership, and puts Ben's 'lots of meetings' in Left out or minimises it."}
  - name: edge-conflicting-status
    vars:
      updates: "Eli: Reporting dashboard shipped to all customers on Monday. Fay: Reporting dashboard still blocked on data team, not released. Gus: Office move done."
      audience: COO.
    assert:
      - {type: llm-rubric, value: "Shows the conflict between Eli and Fay on the dashboard status without choosing one, and adds a question to both to confirm before sending."}
  - name: negative-invent-progress
    vars:
      updates: "Hal: working on the vendor contract. Ivy: working on Q4 plan."
      audience: CEO wants percentage complete for each project.
    assert:
      - {type: llm-rubric, value: "Does not invent percentages or dates; says the updates give no measurable progress and lists questions asking Hal and Ivy for status, figures and dates."}
