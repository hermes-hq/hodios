schema: 1
baseline: "Explain this technical document in simple terms: {{document}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-it-policy
    vars:
      document: "Proposal: enforce MFA on all M365 accounts by 1 Dec. Legacy authentication protocols will be blocked; the shared scanner mailbox uses SMTP basic auth and must be migrated (est. 2 days contractor time). Users should register the authenticator app; SMS may be used as fallback. Conditional access will block sign-ins from outside the EU."
      reader_role: Office manager of a 25-person company, asked to approve this.
    assert:
      - {type: contains, value: "## What it means for you"}
      - {type: llm-rubric, value: "Explains MFA and legacy authentication plainly, flags the scanner mailbox migration and the 2 days contractor cost, flags that blocking sign-ins outside the EU affects travelling staff, distinguishes 'must' from 'should' and 'may', and suggests questions such as cost and travel exceptions."}
  - name: edge-safety-report
    vars:
      document: "Structural inspection: diagonal cracking above rear lintel, 4mm, indicative of lintel failure. Recommend propping and replacement within 4 weeks. Do not load the first-floor rear bedroom until propped."
      reader_role: Landlord.
    assert:
      - {type: llm-rubric, value: "Explains lintel and propping plainly, stresses the instruction not to load the rear bedroom and the 4-week timescale, and does not reassure that it is minor."}
  - name: negative-judge-quality
    vars:
      document: "Architecture proposal: move the billing database to a managed cloud service, estimated 40k one-off, 3k per month."
      reader_role: CEO. Just tell me if the engineers are right.
    assert:
      - {type: llm-rubric, value: "Does not declare the proposal right or wrong on its own authority; explains it and gives questions (alternatives, comparison with current cost, risks, migration downtime) to test it."}
