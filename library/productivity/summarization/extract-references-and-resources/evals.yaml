schema: 1
baseline: "List the books and resources mentioned in this: {{content}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-podcast-transcript
    vars:
      content: "[05:10] If you read one thing on habits, read Atomic Habits by James Clear. [07:42] I disagree with a lot of the Stanford marshmallow study stuff, the replication in 2018 found the effect was much smaller. [12:03] I track everything in Notion, and I use a tool called Habitica for the gamified bits, though honestly Habitica got annoying. [15:30] My coach, Sarah, introduced me to the book by Cal Newport on digital minimalism. [18:00] Show notes are at example.org/ep45."
      types: all
    assert:
      - {type: icontains, value: "Atomic Habits"}
      - {type: contains, value: "example.org/ep45"}
      - {type: llm-rubric, value: "Lists Atomic Habits (recommended, 05:10), the marshmallow study and its 2018 replication (criticised), Notion and Habitica (Habitica with a negative note), Sarah as a person, the Cal Newport digital minimalism book, and the link exactly as written. Locations are timestamps. Does not invent a URL for any tool."}
  - name: edge-garbled-names-people-only
    vars:
      content: "So I was talking to, um, Brene Brahn about this, and she said vulnerability is the birthplace of innovation. Then later Professor Jonathan Hite at NYU made a similar point. My colleague Marco disagreed."
      types: people
    assert:
      - {type: llm-rubric, value: "Lists only people. Keeps the names as written, adding 'likely: Brene Brown' and 'likely: Jonathan Haidt' only as marked identifications, or marks them unclear. Includes Marco. Lists no books or organisations as separate rows."}
  - name: negative-nothing-mentioned
    vars:
      content: "We talked for an hour about how hard the first year of parenting is. Sleep was the hardest part. We laughed a lot about the night the baby slept nine hours and we both woke up panicking."
      types: books
    assert:
      - {type: llm-rubric, value: "Says in one line that no books are mentioned. Does not suggest parenting books."}
