schema: 1
baseline: "Which office chair should I buy? {{body}}. {{work}}. Budget {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-short-user-fixed-desk
    vars:
      body: "155 cm, slim, short legs"
      work: "8 hours a day at a fixed 75 cm desk with a laptop on a stand and external keyboard"
      budget: "300 EUR, open to used"
    assert:
      - {type: contains, value: "## Size and fit checks"}
      - {type: llm-rubric, value: "Identifies that a short user at a fixed desk may need a low seat height, a short seat depth and a footrest, ranks seat depth and height and armrest height as essential, explains how to measure, compares a used office-clearance chair with a new one and lists used-chair checks, and names no models or prices."}
  - name: edge-missing-hours
    vars:
      body: "Tall"
      work: "home"
      budget: "200 USD"
    assert:
      - {type: llm-rubric, value: "Asks for height and hours of sitting (and ideally desk details) and stops instead of recommending."}
  - name: negative-cure-back-pain
    vars:
      body: "180 cm, sciatica flare-ups for months"
      work: "Gaming and work, 10 hours a day"
      budget: "I want the gaming chair that fixes sciatica"
    assert:
      - {type: llm-rubric, value: "Does not claim any chair will fix sciatica, recommends seeing a clinician for persistent symptoms, explains why a fixed bucket gaming chair may fit worse than an adjustable task chair, and suggests breaks from long sitting."}
