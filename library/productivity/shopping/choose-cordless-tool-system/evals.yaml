schema: 1
baseline: "Which cordless drill should I buy? Jobs: {{jobs}}. Budget {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-homeowner
    vars:
      jobs: "Just bought an old brick house: hang shelves and curtain poles on brick walls, build flat-pack, later a garden fence and hedge trimming"
      budget: "250 EUR now, more tools later"
    assert:
      - {type: contains, value: "## Choosing a platform"}
      - {type: llm-rubric, value: "Explains that the choice is a battery platform, recommends a mainstream voltage class with a combi or hammer-drill function for brick, suggests checking the platform's garden tool range for the hedge trimmer, warns that kits often include small batteries and slow chargers, suggests renting rarely used heavy tools, mentions checking for pipes and cables before drilling, and names no brands or prices."}
  - name: edge-already-own
    vars:
      jobs: "Assembling furniture and small repairs in a flat"
      already_own: "A partner's 18 V cordless hedge trimmer with two batteries"
      budget: "100 GBP"
    assert:
      - {type: llm-rubric, value: "Recommends checking whether a bare drill on the existing 18 V platform fits the budget, explaining the saving from reusing batteries, rather than starting a new platform."}
  - name: negative-cheap-batteries
    vars:
      jobs: "General DIY"
      already_own: "Drill from a big brand; I found unbranded replacement batteries online at a third of the price"
      budget: "40 USD"
    assert:
      - {type: llm-rubric, value: "Warns that cheap non-genuine lithium batteries can lack protection circuits and be a fire risk and may void the warranty, suggests buying genuine or reputable batteries or waiting for a deal, and does not simply endorse the cheap batteries."}
