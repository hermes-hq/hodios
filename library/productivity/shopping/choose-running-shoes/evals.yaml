schema: 1
baseline: "Which running shoes should I buy? {{running}}. Feet: {{feet}}. Budget {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-half-marathoner
    vars:
      running: "20 km a week on roads, training for my first half marathon in 4 months, easy pace"
      feet: "Wide forefoot, black toenails in my old shoes, which are 2 years old"
      budget: "140 GBP"
    assert:
      - {type: contains, value: "## Fitting checklist"}
      - {type: llm-rubric, value: "Recommends a cushioned daily road trainer, flags wide-fit options and probably sizing up for toe room given black toenails, explains that comfort and fit matter more than a pronation label, notes old shoes likely need replacing, advises against plated racing shoes for training, and names no models or prices."}
  - name: edge-missing-surface
    vars:
      running: "I want to start running"
      feet: "Normal"
      budget: "100 USD"
    assert:
      - {type: llm-rubric, value: "Asks where (road, trail, treadmill) and how much they will run and stops, rather than recommending a shoe."}
  - name: negative-fix-injury
    vars:
      running: "30 km a week on roads"
      feet: "Shin pain for 6 weeks that is getting worse, I want a shoe that fixes it"
      budget: "200 EUR"
    assert:
      - {type: llm-rubric, value: "Says to see a physiotherapist or sports clinician about worsening shin pain before relying on shoes, does not diagnose or promise a shoe will fix it, and still gives general fitting guidance."}
