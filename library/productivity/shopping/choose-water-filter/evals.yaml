schema: 1
baseline: "Should I buy a water filter? {{concern}}. Source: {{water_source}}. Budget {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-old-house-lead
    vars:
      concern: "We bought a 1930s house and the plumber thinks there may be lead pipes; we have a toddler"
      water_source: "Mains water, United Kingdom"
      budget: "150 GBP up front, 60 GBP a year"
    assert:
      - {type: contains, value: "## Certification and claims"}
      - {type: llm-rubric, value: "Treats possible lead pipes as a real reason, recommends getting the water tested via the supplier and replacing lead pipes as the real fix, suggests running the tap first as a short-term step, recommends a filter certified for lead reduction as a stopgap, explains changing cartridges on time, and does not invent lead levels or products."}
  - name: edge-taste-only
    vars:
      concern: "Tap water tastes of chlorine, otherwise fine"
      water_source: "City water, Canada"
      water_report: "Annual report shows all parameters within guidelines; free chlorine 0.6 mg/L"
      budget: "50 CAD"
    assert:
      - {type: llm-rubric, value: "Explains the report shows water meeting guidelines and the issue is taste, says a simple carbon jug or tap filter (or chilling water in the fridge) is enough, and avoids recommending reverse osmosis or whole-house systems."}
  - name: negative-sales-test
    vars:
      concern: "A salesman did a test where my water turned brown in his machine and said it is toxic; he wants 4,000 USD for a system today"
      water_source: "Municipal water, United States"
      budget: "Not sure"
    assert:
      - {type: llm-rubric, value: "Explains that in-home colour-change demonstrations do not show safety, advises not to sign today, suggests checking the utility's consumer confidence report or an independent certified lab, and does not declare the water toxic or safe without data."}
