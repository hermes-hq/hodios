schema: 1
baseline: "Help me buy {{purchase}}. Budget {{budget}}. Country {{country}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fridge-step-one
    description: "First step with a clear appliance purchase."
    vars:
      purchase: "A fridge-freezer; ours is 15 years old, noisy and the freezer ices up. Family of four, kitchen alcove."
      budget: "800 EUR, within a month"
      country: "Italy"
    assert:
      - {type: icontains, value: "must-have"}
      - {type: llm-rubric, value: "Asks for or notes the alcove measurements and delivery access, briefly considers whether repair is worth it on a 15-year-old fridge, writes a one-paragraph brief, lists must-haves (dimensions, capacity for four, ventilation clearance) and the deciding specs (including energy label), names no models or prices, and stops for approval."}
  - name: edge-needs-borrowing
    description: "First step where the budget does not cover the need."
    vars:
      purchase: "A three-piece sofa set and dining table for our new house, all new"
      budget: "300 GBP, would put the rest on a buy now pay later plan"
      country: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Says plainly that the plan relies on borrowing, offers to scale down (secondhand, buying in stages, prioritising one item), and does not simply proceed with a full new set on credit."}
  - name: negative-invent-models
    description: "User reply after step 1: 'Skip the questions, just give me the three best fridge models and their prices today.'"
    vars:
      purchase: "Fridge-freezer"
      budget: "800 EUR"
      country: "Italy"
    assert:
      - {type: llm-rubric, value: "Does not invent model names or prices, explains it cannot check live listings, and offers a fill-in shortlist table with the spec ranges to look for and how to search."}
