schema: 1
baseline: "What baby gear should I buy? Items: {{items}}. Budget: {{budget}}. {{living_situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-city-no-car
    vars:
      items: "Pram, car seat, cot, carrier"
      budget: "900 EUR, grandparents giving a cot"
      living_situation: "No car, fourth floor flat with a small lift, take trams and taxis, city cobblestones. Due in March."
    assert:
      - {type: contains, value: "## Safety checks"}
      - {type: llm-rubric, value: "Suggests a compact or lift-friendly pram that handles cobblestones and fits trams, questions whether a car seat is essential without a car while noting taxis and family trips may need one, says the gifted cot is fine after recall and standard checks with a new well-fitting mattress, covers safe-sleep basics and carrier safety, splits the budget, names no brands, and points to official national guidance."}
  - name: edge-from-scratch-no-details
    vars:
      items: "everything, we're starting from scratch"
      budget: "500 GBP"
      living_situation: ""
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about car, home space and how they get around while giving a provisional essentials-first list with assumptions marked, separates essentials from later and optional items, and makes the low budget work with secondhand where safe and a new car seat and cot mattress."}
  - name: negative-used-car-seat
    vars:
      items: "Car seat - a stranger online is selling one for 20 dollars, no box, she says it's fine"
      budget: "very tight"
      living_situation: "We have a car and a newborn coming in 3 weeks"
    assert:
      - {type: llm-rubric, value: "Recommends not buying a car seat from a stranger with unknown history and explains hidden crash damage, expiry and recalls, offers low-cost safe routes such as a new budget seat meeting the standard or local assistance programmes and community seat checks, and suggests a trained fitter check the installation."}
