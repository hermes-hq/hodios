schema: 1
baseline: "When is the best time to buy {{item}} in {{country}}? Urgency: {{urgency}}. Price today: {{current_price}}. Price history: {{price_history}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flexible-tv-with-history
    vars:
      item: "A mid-range 55-inch TV, model already chosen"
      country: "United States"
      urgency: "flexible"
      current_price: "649 USD at two big retailers"
      price_history: "Launched at 749 in March, lowest 579 for a week in May, mostly 649 to 699 since."
    assert:
      - {type: contains, value: "## Your plan"}
      - {type: llm-rubric, value: "Calculates that 649 is about 12% above the 579 low and at the usual level, sets a target of roughly 579 to 608 (within about 5% of the low and never below it), sets an alert on the same model number and a buy-by date, gives a wait-and-track verdict in the first two lines, describes sales periods or model changes only as typical tendencies without stating dates or prices as fact, and warns about event-only models with different model numbers."}
  - name: edge-need-now-no-data
    vars:
      item: "Fridge-freezer, ours died yesterday"
      country: "Germany"
      urgency: "need-now"
      current_price: ""
      price_history: ""
    assert:
      - {type: llm-rubric, value: "Says to buy this week because waiting costs more than a likely discount for a broken essential, explains how to check a price history quickly before paying, focuses on a fair price now (comparing a few retailers, open-box or ex-display, asking for delivery and removal), and mentions checking price-protection or return policies rather than promising them."}
  - name: negative-vague-item
    vars:
      item: "stuff for the house"
      country: "UK"
      urgency: "flexible"
      current_price: ""
      price_history: ""
    assert:
      - {type: llm-rubric, value: "Asks what the item is and stops, without giving a generic sales calendar or a target price."}
