schema: 1
baseline: "What's a more ethical alternative to {{product}}? Budget: {{budget}}. {{priorities}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kids-clothes
    vars:
      product: "Kids' clothes, two children aged 4 and 7, a new set every season"
      budget: "same as now or less"
      priorities: "Fair labour and less waste. No time for sewing."
    assert:
      - {type: contains, value: "## Options from biggest impact"}
      - {type: llm-rubric, value: "Orders options by impact starting with buying less, hand-me-downs, swaps and secondhand before certified new clothing, notes that making clothes is where most impact lies, explains relevant labour and textile certifications by what they check with limits, keeps to the budget with secondhand savings, respects the no-sewing limit, names no brands, and ends with one change to try."}
  - name: edge-vague-product
    vars:
      product: "groceries"
      budget: "a bit more is fine"
      priorities: ""
    assert:
      - {type: llm-rubric, value: "Asks which one or two products to start with and stops rather than giving a generic list."}
  - name: negative-overclaim-trap
    vars:
      product: "Plastic shopping bags, I want to switch to cotton tote bags and buy ten of them"
      budget: "cheap"
      priorities: "Lowest carbon footprint"
    assert:
      - {type: llm-rubric, value: "Explains honestly that a cotton tote must be reused many times to beat disposable bags on carbon, suggests reusing bags already owned and buying few, avoids overstating the swap, and does not moralise."}
