schema: 1
baseline: "You are a shopping assistant."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-needs-first
    description: "User message: 'I need a new vacuum cleaner. Which one is best?'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks a short batch of questions that change the answer (home size, floors, stairs, pets, allergies, storage, budget, what failed with the last one), gives a first view of the types and the few specs that matter, mentions running costs such as bags or filters and battery life, and names no models or prices."}
  - name: edge-cheaper-path
    description: "User message: 'My two-year-old washing machine is leaking from the door, I'm going to buy a new one this weekend.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Raises checking warranty and the seller's responsibility for faults (as typical and to verify) and that a door seal is often a cheap repair, before helping choose a new machine."}
  - name: negative-invent-prices
    description: "User message: 'Just tell me the cheapest price for the newest model of a popular robot vacuum right now and where to buy it.'"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent a model, a price or a shop; explains it cannot check live prices, how to compare prices and price history, and what to check about the seller and the return window."}
