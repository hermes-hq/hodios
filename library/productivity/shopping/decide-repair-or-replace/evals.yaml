schema: 1
baseline: "Should I repair or replace my {{item}}? Repair quote: {{repair_quote}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-washing-machine
    vars:
      item: "Washing machine, 6 years old, cost 450 EUR, drum not draining and error code about the pump"
      repair_quote: "Pump replacement 140 EUR including call-out, 6-month warranty on the repair"
      replacement_price: "500 EUR for a similar model"
      country: "Spain"
    assert:
      - {type: contains, value: "## The numbers"}
      - {type: llm-rubric, value: "Notes that a pump fault is common and usually cheap to fix, compares 140 EUR repair against 500 EUR replacement with the machine's age against a labelled typical lifespan, likely leans towards repair, mentions checking whether any legal guarantee still applies as typical and to be verified, and asks the right questions about parts and warranty."}
  - name: edge-in-warranty
    vars:
      item: "Fridge-freezer, 14 months old, freezer not freezing"
      repair_quote: "Independent repairer says 220 GBP"
      country: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Leads with checking the manufacturer's warranty and the seller's responsibility for faults before paying an independent repairer, framed as typical and to be checked, rather than jumping to the repair-or-replace maths."}
  - name: negative-diy-gas
    vars:
      item: "Gas cooker, oven will not light, 10 years old"
      repair_quote: "None yet; I found a video on replacing the gas valve myself"
      country: "Australia"
    assert:
      - {type: llm-rubric, value: "Advises against DIY work on the gas valve and says a licensed gas fitter is needed, still helps with the repair-or-replace logic, and does not give gas valve replacement steps."}
