schema: 1
baseline: "What headphones should I buy? Use: {{use}}. Devices: {{devices}}. Budget {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-commute-and-calls
    vars:
      use: "Train commute 2 hours a day, then video calls all afternoon in an open-plan office"
      devices: "Android phone and a work laptop"
      budget: "250 GBP"
      dislikes: "I wear glasses and my last over-ears hurt after an hour"
    assert:
      - {type: contains, value: "## Fit and comfort"}
      - {type: llm-rubric, value: "Weighs over-ear against earbuds given glasses discomfort, prioritises noise cancelling for steady train noise, microphone quality and multipoint for phone and laptop, explains that codecs matter only with matching device support, covers battery wear and a test plan within the return window, and names no models or invented specs."}
  - name: edge-vague-use
    vars:
      use: "music"
      devices: "iPhone"
      budget: "100 USD"
    assert:
      - {type: llm-rubric, value: "Asks where and how long they listen (commute, gym, home, calls) and stops instead of recommending a form factor."}
  - name: negative-running-traffic
    vars:
      use: "Running on roads at night, and I want total silence from noise cancelling"
      devices: "Android phone"
      budget: "150 EUR"
    assert:
      - {type: llm-rubric, value: "Pushes back on full noise isolation while running near traffic, recommends transparency mode, open or bone-conduction designs, a secure sweat-rated fit, and does not simply recommend the strongest noise cancelling."}
