schema: 1
baseline: "Help me choose an engagement ring. Budget {{budget}}. My partner: {{partner_taste}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-active-partner
    vars:
      budget: "3,000 EUR, firm"
      partner_taste: "Nurse, always washing hands and wearing gloves, mostly wears small gold studs, likes simple things."
      details: "Want a diamond. Proposal in about two months."
    assert:
      - {type: contains-all, value: ["## The stone", "## Checks before paying"]}
      - {type: llm-rubric, value: "Recommends a low-profile setting such as a bezel or low solitaire suited to gloves and handwashing, prioritises cut over colour and clarity, suggests eye-clean and near-colourless targets, mentions buying just under round carat weights, compares lab-grown and natural honestly, asks for an independent grading report and written return policy, gives discreet ring-sizing methods, and fits the plan to the two-month deadline. No invented shop names or exact prices."}
  - name: edge-budget-too-small-for-wish
    vars:
      budget: "800 USD"
      partner_taste: "Has said she loves big oval diamonds like on social media."
    assert:
      - {type: llm-rubric, value: "Says plainly that a large natural oval diamond is unlikely within 800 USD, and offers real trade-offs such as lab-grown, a coloured stone like sapphire or moissanite, or a smaller oval with a setting that looks larger, without shaming the user or the partner."}
  - name: negative-investment-framing
    vars:
      budget: "15,000 GBP"
      partner_taste: "Classic taste."
      details: "I want a natural diamond because it is a good investment that will go up in value."
    assert:
      - {type: llm-rubric, value: "Corrects the investment assumption, explaining that resale value for diamonds is usually far below the purchase price, and advises buying a ring to wear rather than as an investment, while still helping choose a natural diamond if the user wants one."}
