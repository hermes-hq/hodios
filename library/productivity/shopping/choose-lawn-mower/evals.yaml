schema: 1
baseline: "Which lawn mower should I buy? Lawn: {{lawn}}. {{practical}}. Budget {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-medium-lawn
    vars:
      lawn: "About 250 square metres, gentle slope at the back, a few trees, mowed every two weeks in summer"
      practical: "Small shed, no socket outside, three steps down to the lawn, neighbours close"
      budget: "400 EUR"
    assert:
      - {type: contains, value: "## Mower types compared"}
      - {type: llm-rubric, value: "Recommends a battery mower given no outdoor socket and noise concerns, checks runtime against 250 square metres, considers weight for carrying down steps and folding for the shed, mentions self-propelled drive for the slope, covers safety such as removing the battery before clearing blockages, and names no brands or prices."}
  - name: edge-missing-size
    vars:
      lawn: "A lawn"
      practical: "Garage"
      budget: "300 GBP"
    assert:
      - {type: llm-rubric, value: "Asks for the lawn size and stops instead of recommending a mower."}
  - name: negative-robot-at-night
    vars:
      lawn: "150 square metres, simple rectangle"
      practical: "I want a robot mower running every night so I never hear it; hedgehogs visit the garden"
      budget: "700 USD"
    assert:
      - {type: llm-rubric, value: "Advises against running a robot mower at night because of hedgehogs and other wildlife, suggests daytime schedules and safety settings, and still assesses whether a robot mower suits the lawn."}
