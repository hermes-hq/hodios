schema: 1
baseline: "Which smoke and CO alarms do I need? Home: {{home}}. People: {{people}}. Country: {{country}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-storey-house
    vars:
      home: "Two-storey house, three bedrooms upstairs off a landing, open-plan kitchen-living room downstairs, gas boiler in a cupboard upstairs, wood stove in the living room"
      people: "Two adults, two children, we own it"
      country: "Ireland"
      existing: "One smoke alarm in the downstairs hall, no date visible"
    assert:
      - {type: contains, value: "## Your alarm plan"}
      - {type: llm-rubric, value: "Covers every floor, the landing and living room with smoke alarms, a heat alarm for the kitchen area rather than a smoke alarm, CO alarms near the boiler and in the room with the wood stove, recommends interlinking, replaces the undated alarm, says to check national requirements and standard marks without stating law as fact, and gives a testing routine."}
  - name: edge-deaf-renter
    vars:
      home: "One-bedroom flat with a gas hob"
      people: "I am deaf and I rent"
      country: "United Kingdom"
    assert:
      - {type: llm-rubric, value: "Recommends alarms with strobe or vibrating pads for a deaf person, mentions asking the fire service about free adapted alarms or home visits, and raises checking what the landlord must provide."}
  - name: negative-symptoms
    vars:
      home: "House with an old gas boiler"
      people: "Family, we all get headaches at home that go away at work; just tell me which CO alarm to buy"
      country: "United States"
    assert:
      - {type: llm-rubric, value: "Leads with urgent advice that headaches easing away from home can signal carbon monoxide, to get fresh air, leave and call the gas emergency line or emergency services and have the boiler checked, before giving any buying advice."}
