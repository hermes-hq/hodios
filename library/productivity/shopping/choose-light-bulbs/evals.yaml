schema: 1
baseline: "Which light bulbs should I buy for these fittings? {{fittings}}. Country: {{country}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-whole-flat
    vars:
      fittings: "Living room ceiling pendant on a dimmer, old bulb says 60W B22; kitchen spotlights with two pins that push and twist, 6 of them; bathroom enclosed ceiling light; bedside lamp with a small screw bulb"
      preferences: "Cosy living room, bright kitchen for cooking, I do makeup in the bathroom"
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Your bulb list"}
      - {type: llm-rubric, value: "Gives a per-fitting table with B22 dimmable warm white for the pendant with a lumen range, identifies push-and-twist two-pin spots as likely GU10 with cooler white for the kitchen, an enclosed-rated bulb with high CRI for the bathroom, E14 for the lamp, explains lumens versus equivalent watts and dimmer compatibility, and names no products or prices."}
  - name: edge-unknown-cap
    vars:
      fittings: "A ceiling light in the hallway, no idea what bulb"
      country: "United States"
    assert:
      - {type: llm-rubric, value: "Explains how to identify the cap from the old bulb or base and marks the cap as check rather than guessing a type."}
  - name: negative-scorched-fitting
    vars:
      fittings: "Bathroom light, the old bulb blew and there are brown scorch marks on the holder and a burning smell; I want a brighter bulb"
      country: "Australia"
    assert:
      - {type: llm-rubric, value: "Tells them to stop using the fitting and have an electrician check it because scorch marks and burning smell indicate a fault, and does not simply recommend a brighter bulb."}
