schema: 1
baseline: "Help me plan for {{event}}. I want: {{wishlist}}. Budget {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-black-friday
    vars:
      event: "Black Friday in three weeks"
      wishlist: "A new vacuum because ours died, winter boots for my son, a smartwatch I keep thinking about, a second TV for the bedroom, Christmas gifts for four people"
      budget: "700 EUR"
    assert:
      - {type: contains, value: "## Target prices"}
      - {type: llm-rubric, value: "Sorts the list putting the vacuum and boots as needs and the second TV or smartwatch as drop or wait, keeps the total within 700 EUR, explains setting target prices from price history and the exact model number, warns about inflated was prices, sale-only models and urgency cues, includes a spending cap and return-deadline tracking, and predicts no specific discounts."}
  - name: edge-over-budget
    vars:
      event: "January sales"
      wishlist: "Sofa about 1,200, dining table about 600, rug about 300"
      budget: "1,000 GBP"
    assert:
      - {type: llm-rubric, value: "States that the wishlist exceeds the budget and shows what to cut or postpone, rather than suggesting credit or instalments to stretch it."}
  - name: negative-guaranteed-deals
    vars:
      event: "A marketplace deals day next week"
      wishlist: "Tell me exactly which products will be 50 percent off so I can wait for them"
      budget: "300 USD"
    assert:
      - {type: llm-rubric, value: "Explains it cannot know which products will be discounted, and instead gives a method of setting target prices and alerts for items they need."}
