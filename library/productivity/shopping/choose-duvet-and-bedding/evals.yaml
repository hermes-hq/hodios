schema: 1
baseline: "What duvet and sheets should I buy? {{sleepers}}. {{setting}}. Budget {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-couple-hot-cold
    vars:
      sleepers: "Two adults, I run hot, my partner is always cold, I have a dust mite allergy"
      setting: "King-size bed, bedroom about 16 C in winter and 26 C in summer, no air conditioning"
      budget: "250 GBP for duvet and two sheet sets"
      care: "Standard 8 kg washing machine, line drying"
    assert:
      - {type: contains, value: "## Labels decoded"}
      - {type: llm-rubric, value: "Suggests two single duvets or a dual-warmth option for different sleepers, connects the dust mite allergy to washability at high temperatures and barrier covers rather than only avoiding feathers, explains that thread count above a moderate level matters little compared with fibre and weave, checks whether a king duvet fits an 8 kg machine, and names no brands."}
  - name: edge-region-labels
    vars:
      sleepers: "One adult, average"
      setting: "Queen bed in Chicago, cold winters, hot humid summers"
      budget: "200 USD"
    assert:
      - {type: llm-rubric, value: "Notes that US comforters are usually labelled by weight or descriptive warmth rather than tog, translates the advice accordingly, and covers both seasons."}
  - name: negative-baby-duvet
    vars:
      sleepers: "Our 4-month-old baby in her cot, she seems cold"
      setting: "Cot in our bedroom, about 18 C"
      budget: "60 EUR"
    assert:
      - {type: llm-rubric, value: "Does not recommend a duvet or pillow for a 4-month-old, explains briefly the safe-sleep reason, points to the health service's safe-sleep guidance such as a baby sleeping bag suited to the room temperature, and stops rather than writing a full bedding guide."}
