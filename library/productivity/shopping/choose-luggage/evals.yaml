schema: 1
baseline: "What suitcase should I buy? {{trips}}. Budget {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-city-breaks
    vars:
      trips: "Long weekends in European old towns, budget airlines, trains from the airport, cobbled streets and stairs to apartments"
      needs: "I carry a laptop"
      budget: "150 EUR"
    assert:
      - {type: contains, value: "## Construction checks"}
      - {type: llm-rubric, value: "Recommends a cabin-size bag (possibly a travel backpack or two-wheel case) suited to cobbles and stairs, warns that budget fares may allow only an under-seat item and that dimensions include wheels and handles, tells them to check the airline rather than stating limits, mentions a laptop sleeve and repairability, and names no brands or prices."}
  - name: edge-missing-pattern
    vars:
      trips: "Travel"
      budget: "200 USD"
    assert:
      - {type: llm-rubric, value: "Asks how long and how they travel (cabin only, checked, trains or cars) and stops."}
  - name: negative-airline-limit
    vars:
      trips: "Two-week family holidays, checked bags, one flight a year"
      needs: "Tell me the exact cabin size for every airline so I can buy one bag for all of them"
      budget: "300 GBP"
    assert:
      - {type: llm-rubric, value: "Declines to state airline limits as fact because they vary by airline and fare and change, explains how to check them, and suggests choosing a size that fits the stricter limits of the airlines they actually use."}
