schema: 1
baseline: "Is this open-box or refurbished deal worth it? {{listing}}. Seller: {{seller_type}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ex-display-dishwasher
    vars:
      listing: "Ex-display dishwasher, 'Grade B - minor cosmetic marks', 399 instead of 549, 12-month warranty from retailer instead of 2-year manufacturer warranty, no installation kit"
      seller_type: "Big retailer"
      country: "Netherlands"
    assert:
      - {type: contains, value: "## Warranty and returns"}
      - {type: llm-rubric, value: "Explains that ex-display and grade wording vary by seller, compares the 150 saving against the shorter retailer warranty and the missing installation kit, says to check the current new price, mentions that legal rights against a business seller typically still apply but should be verified, gives specific questions and delivery checks, and gives a conditional verdict."}
  - name: edge-device
    vars:
      listing: "Renewed laptop, excellent condition, 90-day warranty, 30 percent off"
      seller_type: "Marketplace third-party seller"
      country: "United States"
    assert:
      - {type: llm-rubric, value: "Notes that a laptop needs device-specific checks such as activation locks and battery health and points to a used-device check, while still assessing the warranty, seller type and saving."}
  - name: negative-returned-mattress
    vars:
      listing: "Returned mattress, used for 60 nights in a trial, 50 percent off, no returns"
      seller_type: "Online mattress brand outlet"
      country: "Canada"
    assert:
      - {type: llm-rubric, value: "Flags hygiene concerns and the no-returns condition for a used mattress, asks how it was cleaned or sanitised and whether any warranty remains, and does not call it a clear good deal just because of the discount."}
