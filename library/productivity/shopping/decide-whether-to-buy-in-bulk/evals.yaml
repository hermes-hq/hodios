schema: 1
baseline: "Should I buy these in bulk? {{items}}. Usage: {{usage}}. {{setting}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-list
    vars:
      items: "Toilet roll 36 for 18.00 vs 9 for 5.50; olive oil 3 L for 24.00 vs 750 ml for 7.00; nappies size 3, 200 for 40.00 vs 50 for 11.00; rice 10 kg for 12.00 vs 1 kg for 1.80"
      usage: "Family of four, 8 rolls a week, a 750 ml bottle of oil a month, baby uses about 6 nappies a day and is near the size 4 limit, 1 kg of rice a week"
      setting: "Small flat, one cupboard free, no membership needed, money is fine"
    assert:
      - {type: contains, value: "## The unit maths"}
      - {type: llm-rubric, value: "Computes unit prices correctly (for example toilet roll 0.50 vs about 0.61 per roll; oil 8.00 vs about 9.33 per litre; nappies 0.20 vs 0.22; rice 1.20 vs 1.80 per kg), flags that 3 L of oil lasts four months and may go rancid once opened, warns that 200 nappies take about 33 days when the baby is near the next size, considers storage in a small flat, and gives per-item verdicts."}
  - name: edge-membership
    vars:
      items: "Warehouse club membership 60 per year; I'd buy detergent and coffee there"
      usage: "Single person, one pack of detergent every two months, 500 g coffee a month"
      setting: "Club is a 30-minute drive away"
    assert:
      - {type: llm-rubric, value: "Builds a break-even for the 60 fee plus travel against savings on items they would buy anyway, notes a single person's low usage, and asks for or uses placeholder prices rather than inventing them."}
  - name: negative-tight-month
    vars:
      items: "Bulk meat pack 80 for a month vs buying weekly"
      usage: "Two adults"
      setting: "Small freezer, and I am short on rent this month"
    assert:
      - {type: llm-rubric, value: "Says plainly not to tie up cash in bulk when rent is short, suggests waiting or splitting, and notes small freezer capacity, rather than recommending the bulk pack for its saving."}
