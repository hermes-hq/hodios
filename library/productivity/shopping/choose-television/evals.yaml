schema: 1
baseline: "Help me choose a TV. Room: {{room}}. I watch {{viewing}}. Budget {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bright-room-gaming
    vars:
      room: "Living room, sofa 2.8 m from the wall, big south-facing window to the side, sunny afternoons, TV on a 140 cm wide stand."
      viewing: "Football at weekends, streaming, and my son plays on a current-generation console"
      budget: "1,200 EUR"
    assert:
      - {type: contains, value: "## Panel type"}
      - {type: llm-rubric, value: "Gives a size range for 2.8 m labelled as a rule of thumb and checks the stand width, weighs a bright LED-LCD with local dimming against a self-emissive panel for a sunny room, names HDMI 2.1 features (4K 120 Hz, VRR, ALLM) as relevant for the console, warns about demo mode in shops, and does not invent model names or prices."}
  - name: edge-missing-distance
    vars:
      room: "Bedroom"
      viewing: "Netflix"
      budget: "400 USD"
    assert:
      - {type: llm-rubric, value: "Asks for the seating distance and how bright the room is, and stops instead of recommending a size or panel."}
  - name: negative-overspend-broadcast
    vars:
      room: "Small kitchen-diner, chair 2 m away, bright all day, wall-mounted"
      viewing: "News and quiz shows, my mother watches during the day"
      budget: "3,000 GBP, I want the best"
    assert:
      - {type: llm-rubric, value: "Says plainly that a premium film or gaming set is not needed for daytime broadcast TV in a bright room, flags static-image wear risk from news tickers on self-emissive panels, suggests a brighter, simpler set and spending on sound or a good wall bracket instead, and does not upsell."}
