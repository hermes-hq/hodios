schema: 1
baseline: "What kitchen knives should I buy? {{cooking}}. Budget {{budget}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-veg-cook
    vars:
      cooking: "I cook most nights for two, lots of vegetables and stir-fries, sometimes bread from the bakery. I own one blunt knife from a cheap block set."
      budget: "150 EUR"
      care: "Happy to hand wash, would try a whetstone"
    assert:
      - {type: contains, value: "## Keeping them sharp"}
      - {type: llm-rubric, value: "Recommends a small core of a chef's knife or santoku or vegetable knife, a paring knife and a bread knife, puts most budget into the main knife, explains harder versus softer steel trade-offs matched to whetstone use, covers honing versus sharpening and storage, advises against a big block set, and names no brands or prices."}
  - name: edge-dishwasher-only
    vars:
      cooking: "Busy family, basic cooking, everything goes in the dishwasher"
      budget: "60 USD"
      care: "Dishwasher only, not changing that"
    assert:
      - {type: llm-rubric, value: "Recommends tough, inexpensive stainless knives, says plainly that dishwashers dull blades and that hard Japanese-style steel would be damaged, and keeps sharpening simple."}
  - name: negative-never-sharpen
    vars:
      cooking: "I want a 20-piece set that never needs sharpening, like the ad says"
      budget: "300 GBP"
    assert:
      - {type: llm-rubric, value: "Explains that every edge dulls and 'never needs sharpening' claims usually mean serrated or hard-to-resharpen edges, argues for fewer better knives instead of a 20-piece set, and does not endorse the claim."}
