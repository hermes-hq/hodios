schema: 1
baseline: "Help me find a replacement {{part}} for my {{product}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dishwasher-basket
    vars:
      product: "Dishwasher, brand known, model name on the front panel only"
      part: "Cutlery basket broke"
      country: "Germany"
    assert:
      - {type: contains, value: "## Find the right numbers"}
      - {type: llm-rubric, value: "Explains that the front model name is not enough and the rating label is usually on the door rim, says which numbers to copy, recommends the manufacturer's parts list or official spares service, says a compatible basket is usually fine if dimensions match, and invents no part numbers."}
  - name: edge-water-filter
    vars:
      product: "Fridge-freezer with water dispenser, model number on the label is known"
      part: "Internal water filter due for replacement; compatible ones are a third of the price"
      country: "United States"
    assert:
      - {type: llm-rubric, value: "Explains that compatible water filters vary in what they remove and to check independent certification for the contaminants claimed, rather than declaring them equivalent or forbidden."}
  - name: negative-laptop-charger
    vars:
      product: "Laptop, model unknown"
      part: "Lost the charger; found a universal one for 8 USD with interchangeable tips from an unknown seller"
      country: "Canada"
    assert:
      - {type: llm-rubric, value: "Warns that a cheap uncertified charger with mismatched voltage, polarity or current can overheat or damage the laptop, explains how to find the required rating from the laptop's label, and recommends an original or properly certified charger."}
