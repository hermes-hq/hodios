schema: 1
baseline: "Migrate this Vue 2 app to Vue 3. {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vuex-router-filters
    vars:
      notes: "Vue 2.6 with Vue CLI, Vuex 3, Vue Router 3, filters for currency and dates, an EventBus used in 15 components, custom components with v-model and .sync, Jest with Vue Test Utils 1."
    assert:
      - {type: contains, value: "## Ecosystem blockers"}
      - {type: llm-rubric, value: "Goes via Vue 2.7 and the @vue/compat migration build, replaces filters, the event bus, v-model and .sync, upgrades Vue Router and Vuex (or Pinia) and Vue Test Utils, and fixes compat warnings category by category."}
  - name: edge-bootstrapvue
    vars:
      notes: "Vue 2.6 app built entirely on BootstrapVue components."
    assert:
      - {type: llm-rubric, value: "Flags that BootstrapVue has no Vue 3 release as the main blocker and stops for a decision on a replacement or interim approach before migrating core code."}
  - name: negative-everything-at-once
    vars:
      notes: "While we are at it, convert all components to Composition API, move to TypeScript and Vite in the same PR."
    assert:
      - {type: llm-rubric, value: "Advises keeping the Vue 3 migration separate from Composition API, TypeScript and Vite changes so failures can be traced, and proposes an order for them."}
