schema: 1
baseline: "How do I upgrade my {{engine}} project from {{from_version}} to {{to_version}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-godot-3-to-4
    vars:
      engine: Godot
      from_version: "3.5.3"
      to_version: "4.3"
      project_notes: "2D platformer, GDScript only, 3 custom canvas_item shaders, uses Dialogic and a third-party tilemap plugin, exports to Windows, Linux and Steam Deck. Two-person team, demo for a festival in 10 weeks."
    assert:
      - {type: contains, value: "## Playtest checklist"}
      - {type: llm-rubric, value: "Requires a backup tag and upgrade branch before opening in Godot 4, mentions the engine's project converter and that it misses things, flags the custom shaders and both plugins as items to check against the target version, includes old save-file compatibility, compares performance against a recorded baseline, and weighs the 10-week festival deadline in the go-or-wait decision."}
  - name: edge-unity-lts-render-pipeline
    vars:
      engine: Unity
      from_version: "2021.3 LTS"
      to_version: "2022.3 LTS"
      project_notes: "Mobile 3D game on URP with many Asset Store packages, Addressables, and a console port starting next year."
    assert:
      - {type: llm-rubric, value: "Covers URP and package version alignment, Asset Store package compatibility per package, Addressables content rebuild, re-import time and per-platform texture compression, platform SDK requirements, and tells the user to verify changes in Unity's official upgrade guides rather than asserting specific API removals from memory."}
  - name: negative-week-before-launch
    vars:
      engine: Unity
      from_version: "2022.3"
      to_version: "6"
      project_notes: "We launch on Steam next week and want the new features."
    assert:
      - {type: llm-rubric, value: "Recommends waiting until after launch (or doing it only on a separate branch), explains why an engine upgrade a week before release is risky, and does not produce an upgrade plan that touches the release branch."}
