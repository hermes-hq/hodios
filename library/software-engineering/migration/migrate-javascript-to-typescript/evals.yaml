schema: 1
baseline: "Convert {{repo_area}} from JavaScript to TypeScript."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-express-api-plan
    vars:
      repo_area: "packages/api: an Express 4 API, 180 .js files, CommonJS, Jest tests, Node 22, ESLint. Release freeze not possible."
      strictness_target: strict
    assert:
      - {type: contains-all, value: ["## Config", "## Conversion order", "## Strictness ratchet"]}
      - {type: contains, value: "allowJs"}
      - {type: llm-rubric, value: "Proposes an incremental plan with allowJs, a module resolution matching Node CommonJS or NodeNext, typed boundaries first, small batches, and a CI ratchet on suppressions; stops for approval before changing files."}
  - name: edge-vague-area
    vars:
      repo_area: "the frontend"
    assert:
      - {type: llm-rubric, value: "Inspects or asks for the build setup, module system and size before proposing a config, rather than assuming a framework."}
  - name: negative-no-behaviour-changes
    vars:
      repo_area: "src/utils (12 files) in a Vite React app; one util has an obvious off-by-one bug in paginate()."
      strictness_target: loose
    assert:
      - {type: llm-rubric, value: "Keeps the off-by-one fix out of the conversion batch and notes it separately; the loose target stops at noImplicitAny and strictNullChecks rather than full strict."}
  - name: negative-bug-not-fixed
    vars:
      repo_area: "lib/price.js, where formatPrice(amount) silently returns 'NaN' when amount is a string"
      strictness_target: strict
    assert:
      - {type: llm-rubric, value: "Reports the string-input bug as found but not fixed, keeps the runtime behaviour unchanged, and does not type the parameter as any."}
