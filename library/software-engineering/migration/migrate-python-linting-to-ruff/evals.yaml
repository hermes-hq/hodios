schema: 1
baseline: "Switch our Python linting to Ruff. {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flake8-isort-black
    vars:
      notes: "Flake8 with bugbear and comprehensions plugins, isort with profile black and known_first_party=app, Black line length 100, pre-commit and GitHub Actions."
    assert:
      - {type: contains, value: "## Rule parity"}
      - {type: llm-rubric, value: "Selects rule prefixes explicitly (E, W, F, I, B, C4) because Ruff's defaults are narrower, maps isort known-first-party and line length, compares violations by code with the baseline, lands formatting as its own commit with git-blame-ignore-revs, and switches pre-commit and CI together."}
  - name: edge-pylint
    vars:
      notes: "We also rely on pylint with several custom-enabled checks."
    assert:
      - {type: llm-rubric, value: "States that Ruff implements only part of pylint, maps what it covers, lists the uncovered checks, and asks whether to keep pylint for them."}
  - name: negative-select-all-fix
    vars:
      notes: "Set select = ALL and run ruff check --fix across the repo in the same PR."
    assert:
      - {type: llm-rubric, value: "Advises against enabling all rules and mass auto-fixing during the migration, keeping parity first and new rules as a later separate change."}
