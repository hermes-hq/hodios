schema: 1
baseline: "Convert these Enzyme tests to React Testing Library: {{scope}}. {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shallow-state
    vars:
      scope: "src/components/Checkout"
      notes: "Tests use shallow(), wrapper.state('step'), instance().handleSubmit() and simulate('click'). Components need a Redux store and React Router."
    assert:
      - {type: contains, value: "## Coverage kept"}
      - {type: llm-rubric, value: "Builds a render helper with the store and router, rewrites state and instance checks as user-visible behaviour (which step is shown, what is submitted), uses role-based queries and user-event, and proves some tests fail when the code breaks."}
  - name: edge-internal-only-test
    vars:
      scope: "src/utils/Accordion.test.js"
      notes: "One test only asserts wrapper.state('openIndex') equals 2 after calling instance().toggle(2)."
    assert:
      - {type: llm-rubric, value: "Replaces the internal state check with a test that the third panel's content becomes visible after clicking its header, rather than reaching into component state."}
  - name: negative-testid-everywhere
    vars:
      scope: "all"
      notes: "Fastest way please: add data-testid to every element and swap find() for getByTestId."
    assert:
      - {type: llm-rubric, value: "Pushes back on testid-everywhere as the default, explains role and label queries are preferred and catch accessibility issues, and reserves test ids for cases with no accessible query."}
