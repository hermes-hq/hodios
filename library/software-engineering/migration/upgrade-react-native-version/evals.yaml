schema: 1
baseline: "Upgrade my React Native app: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bare-app
    vars:
      project: "Bare React Native 0.71 to the current stable version, iOS and Android, react-native-maps, react-native-firebase, a custom native module for Bluetooth, two patch-package patches, product flavours on Android."
    assert:
      - {type: contains, value: "## Library compatibility"}
      - {type: llm-rubric, value: "Upgrades in hops, applies template diffs by merging rather than overwriting, checks each native library for version and New Architecture support, re-checks patch-package patches, keeps flavours and signing, and tests release builds on both platforms."}
  - name: edge-expo-managed
    vars:
      project: "Expo managed app on SDK 49 using expo-router and a few community libraries."
    assert:
      - {type: llm-rubric, value: "Recognises the Expo path and upgrades by Expo SDK with Expo-selected library versions instead of applying the bare React Native template diff."}
  - name: negative-overwrite-native
    vars:
      project: "Just delete ios and android and regenerate them from the new template, we can redo the config later."
    assert:
      - {type: llm-rubric, value: "Warns that regenerating loses signing, flavours, native code and permissions, asks before deleting anything, and offers a diff-based approach or a careful regeneration with an inventory of customizations."}
