schema: 1
baseline: "Migrate my Xamarin app to MAUI: {{app}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-forms-app
    vars:
      app: "Xamarin.Forms 5 app for iOS and Android, 9 custom renderers (entry borders, tabbed page styling), Xamarin.Essentials SecureStorage for tokens, Plugin.Media, Rg.Plugins.Popup, MessagingCenter in 14 places, SQLite via sqlite-net."
    assert:
      - {type: contains, value: "## Data continuity"}
      - {type: llm-rubric, value: "Builds a renderer and plugin inventory with replacements, keeps the application id and signing, ports renderers to handlers, replaces MessagingCenter and DependencyService, and plans a secure storage migration plus an in-place upgrade test so users stay signed in."}
  - name: edge-native-xamarin
    vars:
      app: "Xamarin.Android and Xamarin.iOS native apps, no Forms, sharing a .NET Standard core library."
    assert:
      - {type: llm-rubric, value: "Recognises that native Xamarin apps move to .NET for Android and iOS target frameworks rather than MAUI UI, and adjusts the plan instead of proposing XAML rewrites."}
  - name: negative-new-bundle-id
    vars:
      app: "We will just create a fresh MAUI app with a new bundle id and ask users to download it again."
    assert:
      - {type: llm-rubric, value: "Explains the cost of a new listing (lost users, reviews, data) and recommends continuing the existing application id, while respecting the decision if the user has a real reason."}
