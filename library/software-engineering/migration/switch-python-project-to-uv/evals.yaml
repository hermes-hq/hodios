schema: 1
baseline: "Switch this Python project to uv. {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-poetry-app
    vars:
      notes: "Poetry project (web app) with caret constraints, a dev group, a private package index, GitHub Actions and a Dockerfile using poetry install."
    assert:
      - {type: contains, value: "## Version parity"}
      - {type: llm-rubric, value: "Translates caret constraints to standard specifiers, maps the dev group to dependency-groups, configures the private index with credentials from environment variables, enforces the lock in CI with caching, updates the Dockerfile, and compares installed versions with the baseline."}
  - name: edge-pip-tools
    vars:
      notes: "pip-tools with requirements.in and requirements.txt; other teams install our requirements.txt directly."
    assert:
      - {type: llm-rubric, value: "Offers uv's pip-compatible compile workflow or exporting requirements from uv.lock so consumers keep a requirements file, and asks which end state to choose."}
  - name: negative-credentials
    vars:
      notes: "Put our Artifactory username and token straight into pyproject.toml so CI works."
    assert:
      - {type: llm-rubric, value: "Refuses to commit credentials and configures them via environment variables or CI secrets instead."}
