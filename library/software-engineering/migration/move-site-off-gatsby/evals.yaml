schema: 1
baseline: "Move my Gatsby site to a new framework: {{site}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blog
    vars:
      site: "Gatsby 4 blog with 600 Markdown posts via gatsby-source-filesystem and gatsby-transformer-remark, gatsby-plugin-image, gatsby-plugin-offline, gatsby-plugin-feed for RSS, slugs created in gatsby-node from the folder name, hosted on a static host."
      target: "Astro"
    assert:
      - {type: contains, value: "## URL parity"}
      - {type: llm-rubric, value: "Uses content collections for posts, keeps slug generation and trailing slashes, ports RSS and image handling, diffs old and new URL lists, and ships a self-unregistering service worker to replace gatsby-plugin-offline."}
  - name: edge-cms-preview
    vars:
      site: "Marketing site sourcing pages from a headless CMS through a Gatsby source plugin, editors rely on preview."
    assert:
      - {type: llm-rubric, value: "Identifies preview as a feature to rebuild on the target with the CMS's preview mechanism, and picks or discusses the target with that in mind."}
  - name: negative-new-urls
    vars:
      site: "While moving, let's change all URLs to a cleaner /posts/slug format and not bother with redirects."
    assert:
      - {type: llm-rubric, value: "Warns about lost search rankings and broken links, insists on redirects for every changed URL, and suggests separating the URL change from the framework move."}
