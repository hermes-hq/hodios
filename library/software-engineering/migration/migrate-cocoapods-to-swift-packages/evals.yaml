schema: 1
baseline: "Move my iOS app from CocoaPods to SPM. {{podfile}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-pods
    vars:
      podfile: "platform :ios, '15.0'. Pods: Alamofire 5.9.1, SDWebImage 5.19.0, a crash-reporting SDK shipped only as a binary, an internal pod 'DesignKit' with an xcassets resource bundle. post_install sets IPHONEOS_DEPLOYMENT_TARGET for all pods to 15.0. App plus a notification service extension using Alamofire."
    assert:
      - {type: contains, value: "## Pod inventory"}
      - {type: llm-rubric, value: "Orders migration with clean source packages first, handles the binary SDK as a binary target or vendor package, warns that DesignKit's resources must move to a package bundle accessed through Bundle.module, explains what the deployment-target post_install hook did and why it may not be needed, links Alamofire to both the app and the extension, and keeps versions identical."}
  - name: edge-duplicate-linking
    vars:
      podfile: "Pods: FirebaseAnalytics and GoogleUtilities (transitive). We want to move only FirebaseAnalytics now and leave the other Firebase pods for later."
      notes: "Other Firebase pods: FirebaseMessaging, FirebaseCrashlytics."
    assert:
      - {type: llm-rubric, value: "Warns that moving one Firebase product while others stay as pods would link shared dependencies twice, and recommends moving the related group together."}
  - name: negative-cross-platform
    vars:
      podfile: "React Native 0.74 app, Podfile generated by the framework. Remove CocoaPods entirely today."
    assert:
      - {type: llm-rubric, value: "Pushes back: explains the cross-platform framework manages its own CocoaPods integration, so removing it by hand would break builds, and advises following that framework's documented package support instead."}
