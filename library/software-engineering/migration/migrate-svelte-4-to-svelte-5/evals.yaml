schema: 1
baseline: "Migrate my Svelte 4 app to Svelte 5: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sveltekit-app
    vars:
      project: "SvelteKit 1 app with Svelte 4, 120 components, heavy use of $: for derived totals and for fetching when a filter changes, createEventDispatcher in form components, on:submit|preventDefault, a few slots with let: props, a charting library that takes plain arrays."
    assert:
      - {type: contains, value: "## Behaviour checks"}
      - {type: llm-rubric, value: "Upgrades SvelteKit first and runs in legacy mode, uses the migration script per folder, splits $: into $derived for totals and $effect for fetching, converts dispatchers to callback props with parent updates, replaces preventDefault modifiers, converts let: slots to snippets, and passes snapshots to the chart library."}
  - name: edge-component-library
    vars:
      project: "A published Svelte component library consumed by other teams."
    assert:
      - {type: llm-rubric, value: "Treats event and slot changes as public breaking changes, plans a major version with migration notes for consumers, and considers compatibility for consumers still on Svelte 4."}
  - name: negative-effect-everything
    vars:
      project: "Convert every $: to $effect so behaviour stays the same."
    assert:
      - {type: llm-rubric, value: "Explains that $effect runs after DOM updates and that derived values should use $derived, and that blanket effects cause extra renders and loops."}
