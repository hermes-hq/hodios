schema: 1
baseline: "Move my React Native app to the New Architecture: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-custom-modules
    vars:
      project: "React Native 0.74 with the old architecture, react-native-reanimated, react-native-video, an old unmaintained signature-pad library, plus our own native module for secure keychain access and a native chart view component."
    assert:
      - {type: contains, value: "## Own native code"}
      - {type: llm-rubric, value: "Checks each library's support including interop, flags the unmaintained library with options, converts the keychain module to a TurboModule with a typed spec and codegen and the chart view to a Fabric component, and tests runtime behaviour on both platforms rather than relying on a successful build."}
  - name: edge-already-on
    vars:
      project: "Already on a recent version with the New Architecture enabled by default, but one screen using findNodeHandle with UIManager.dispatchViewManagerCommand crashes."
    assert:
      - {type: llm-rubric, value: "Focuses on replacing the imperative findNodeHandle and UIManager usage with refs and view commands in a component spec, rather than repeating the full migration."}
  - name: negative-disable-forever
    vars:
      project: "Can we just turn the New Architecture off permanently and never deal with it?"
    assert:
      - {type: llm-rubric, value: "Explains that newer React Native versions remove the legacy architecture so disabling it only delays the work and blocks upgrades, and suggests how to schedule the migration."}
