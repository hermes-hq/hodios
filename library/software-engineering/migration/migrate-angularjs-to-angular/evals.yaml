schema: 1
baseline: "Help me migrate our AngularJS app to {{target}}. {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hybrid-angular
    vars:
      target: "modern Angular"
      notes: "AngularJS 1.6, 60 screens with UI-Router, script tags with Gulp concat, controllers using $scope inheritance, few tests."
    assert:
      - {type: contains, value: "## First slice"}
      - {type: llm-rubric, value: "Puts preparation first (bundler, TypeScript, component-style directives, removing scope inheritance), proposes a hybrid app with UpgradeModule or downgradeModule and downgradeComponent/downgradeInjectable, addresses router ownership, and migrates a small service and leaf component first."}
  - name: edge-react-target
    vars:
      target: "React"
      notes: "AngularJS 1.8, 25 routes, the team knows React."
    assert:
      - {type: llm-rubric, value: "Recognises ngUpgrade does not apply to React and proposes route-by-route strangling with shared auth and session and a clear routing split."}
  - name: negative-big-bang
    vars:
      target: "modern Angular"
      notes: "We want to freeze features for a year and rewrite everything from scratch on a separate branch."
    assert:
      - {type: llm-rubric, value: "Pushes back on a long feature freeze and long-lived rewrite branch, explaining the risks, and proposes an incremental path while respecting that the decision is the user's."}
