schema: 1
baseline: "Replace moment with {{target_library}}. {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-date-fns
    vars:
      target_library: "date-fns"
      notes: "React app showing invoice dates as 'DD/MM/YYYY', computing due dates with add(30,'days'), and week numbers in a report."
    assert:
      - {type: contains, value: "## Mapping"}
      - {type: llm-rubric, value: "Translates DD/MM/YYYY to dd/MM/yyyy and warns about YYYY as the week-numbering year, handles mutability in the due date code, adds tests for month end and year boundary dates, and runs tests in more than one time zone."}
  - name: edge-timezones
    vars:
      target_library: "recommend one"
      notes: "Scheduling app converting meeting times between user time zones using moment-timezone, Node.js and browsers."
    assert:
      - {type: llm-rubric, value: "Recommends a library with real time zone support (for example Luxon, date-fns-tz or Temporal with a polyfill) with trade-offs, waits for confirmation, and tests DST transitions in the time zones used."}
  - name: negative-regex-swap
    vars:
      target_library: "dayjs"
      notes: "Just swap the import from moment to dayjs everywhere, the API is the same."
    assert:
      - {type: llm-rubric, value: "Explains that Day.js needs plugins for time zones, custom parsing and other features and has immutability differences, and checks uses instead of only swapping imports."}
