schema: 1
baseline: "Migrate this Nuxt 2 app to Nuxt 3. {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ssr-axios-vuex
    vars:
      notes: "Nuxt 2.15 SSR on Node, @nuxtjs/axios, Vuex store, asyncData on most pages, serverMiddleware for a small API, head() for SEO."
    assert:
      - {type: contains, value: "## Module map"}
      - {type: llm-rubric, value: "Replaces axios with $fetch/useFetch, asyncData with useAsyncData using keys, Vuex with Pinia, serverMiddleware with Nitro server handlers, head() with useHead or useSeoMeta, and compares rendered HTML and meta before and after."}
  - name: edge-auth-module
    vars:
      notes: "Nuxt 2 app relies heavily on @nuxtjs/auth with local and OAuth strategies."
    assert:
      - {type: llm-rubric, value: "Flags that the Nuxt 2 auth module has no direct Nuxt 3 version, stops for a decision on a replacement or custom implementation, and does not invent a drop-in module."}
  - name: negative-client-only-fetch
    vars:
      notes: "useAsyncData is giving hydration errors, just move all fetching into onMounted."
    assert:
      - {type: llm-rubric, value: "Warns that moving fetching to onMounted loses server rendering and SEO, and investigates the hydration mismatch (keys, non-deterministic values) instead."}
