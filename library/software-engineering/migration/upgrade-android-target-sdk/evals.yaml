schema: 1
baseline: "Raise my Android app's targetSdk: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-levels
    vars:
      project: "targetSdk 33 to 35, minSdk 24. App shows reminder notifications via AlarmManager setExact, uploads photos in a foreground service, registers a broadcast receiver in code for connectivity, full-screen layouts with a toolbar."
    assert:
      - {type: contains, value: "## Behaviour changes that apply"}
      - {type: llm-rubric, value: "Lists only relevant changes (foreground service type and permission, receiver exported flag, exact alarm default denial with fallback, edge-to-edge insets), raises compileSdk first, handles permission denial paths, and notes Play Console declarations."}
  - name: edge-old-target
    vars:
      project: "targetSdk 30 to 35 for an app with activities using intent filters and PendingIntents for notifications."
    assert:
      - {type: llm-rubric, value: "Covers the older level changes too (exported attribute, PendingIntent mutability, notification permission) and sequences fixes across all crossed levels."}
  - name: negative-request-everything
    vars:
      project: "To be safe just add every new permission to the manifest so nothing breaks."
    assert:
      - {type: llm-rubric, value: "Pushes back on adding unneeded permissions, explaining Play review and user trust, and maps each needed permission to an actual feature."}
