schema: 1
baseline: "Migrate my Angular app to standalone components and signals. {{scope}} {{notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-full-modernization
    vars:
      scope: "Standalone everywhere, new control flow, signal inputs and outputs."
      notes: "Angular 18, 40 components in feature modules plus a big SharedModule, class-based interceptors, Jasmine TestBed tests."
    assert:
      - {type: contains, value: "## Migration order"}
      - {type: llm-rubric, value: "Uses the official standalone schematic in its separate passes, moves to provider functions with functional interceptors, runs the control flow and signal input/output migrations as separate commits, reports skipped cases, and updates TestBed declarations to imports."}
  - name: edge-state-to-signals
    vars:
      scope: "Convert component state to signals in the search feature."
      notes: "Search component uses a BehaviorSubject for the query, debounceTime and switchMap to call the API, and async pipe."
    assert:
      - {type: llm-rubric, value: "Keeps the debounced HTTP flow in RxJS and bridges to the template with toSignal, uses computed for derived values, and avoids effects that write state."}
  - name: negative-hand-rewrite
    vars:
      scope: "Rewrite every template by hand to the new control flow in one big commit."
      notes: "Angular 17 app, 200 templates."
    assert:
      - {type: llm-rubric, value: "Recommends the official control flow schematic and reviewable commits instead of a single hand rewrite, explaining the risk of manual errors at that scale."}
