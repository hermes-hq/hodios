schema: 1
baseline: "Convert this Python project to pyproject.toml: {{current_files}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-library-setup-py
    vars:
      tooling_preference: "hatchling"
      current_files: |
        Library published to PyPI. Layout: geotools/ (package), geotools/data/zones.json, tests/.
        setup.py:
          from setuptools import setup, find_packages
          from geotools import __version__
          setup(name="geotools", version=__version__, packages=find_packages(exclude=["tests"]),
                package_data={"geotools": ["data/*.json"]}, install_requires=["numpy>=1.22", "shapely"],
                extras_require={"plot": ["matplotlib"]}, entry_points={"console_scripts": ["geotools=geotools.cli:main"]},
                python_requires=">=3.8")
        requirements-dev.txt: pytest, black, numpy==1.26.4, shapely==2.0.3
        CI runs python setup.py test on 3.9, 3.10, 3.11.
    assert:
      - {type: contains, value: "## Commands before and after"}
      - {type: llm-rubric, value: "Produces a pyproject.toml with hatchling build-system, dynamic or static version handled explicitly, the plot extra, the geotools console script, and data/zones.json included in the wheel; keeps dependency ranges loose for a library rather than pinning; replaces python setup.py test with a pytest command; questions requires-python >=3.8 given CI tests 3.9+; and verifies wheel contents."}
  - name: edge-research-code
    vars:
      tooling_preference: simplest standard option
      current_files: "Research analysis code: scripts in analysis/, a requirements.txt with unpinned pandas, scipy, matplotlib, statsmodels; run with python analysis/run_all.py. Results must be reproducible for a paper."
    assert:
      - {type: llm-rubric, value: "Treats it as research code needing reproducibility, recommends a lockfile with exact versions (and hashes) generated by a tool, records the Python version, and keeps python analysis/run_all.py working or gives its replacement."}
  - name: negative-missing-files
    vars:
      tooling_preference: "Poetry"
      current_files: "We use setup.py, make it modern."
    assert:
      - {type: llm-rubric, value: "Asks for the actual setup.py, requirements files and layout, and does not invent package names, dependencies or entry points."}
