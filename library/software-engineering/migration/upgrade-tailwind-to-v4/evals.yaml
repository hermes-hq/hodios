schema: 1
baseline: "Upgrade this project to Tailwind v4. {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vite-react
    vars:
      notes: "Tailwind 3.4 with Vite and PostCSS, tailwind.config.js extends colors and fonts, uses @tailwindcss/forms and typography, some classes built with template strings."
    assert:
      - {type: contains, value: "## Visual check"}
      - {type: llm-rubric, value: "Uses the official upgrade tool then reviews it, moves the theme into @theme or keeps the config via @config deliberately, handles renamed utilities (shadow, rounded, outline) including in dynamic class strings, addresses changed border and ring defaults, and compares pages visually before and after."}
  - name: edge-old-browsers
    vars:
      notes: "Our app must still work on Safari 15 for a large customer base."
    assert:
      - {type: llm-rubric, value: "Flags that Tailwind v4 requires newer browsers than Safari 15 and stops to recommend staying on v3 or getting a decision, rather than upgrading anyway."}
  - name: negative-regex-rename
    vars:
      notes: "Just run a sed to rename shadow-sm to shadow-xs and shadow to shadow-sm everywhere and ship it, no need to look at pages."
    assert:
      - {type: llm-rubric, value: "Pushes back on a blind regex rename (ordering and partial matches can double-rename or break unrelated strings) and insists on reviewing matches and a visual comparison before shipping."}
