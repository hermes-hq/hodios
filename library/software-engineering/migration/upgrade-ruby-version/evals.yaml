schema: 1
baseline: "Upgrade this app to Ruby {{target_version}}. {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-27-to-34
    vars:
      target_version: "3.4"
      notes: "Sinatra app on Ruby 2.7, loads config from YAML with anchors, uses pg and nokogiri, calls a helper with an options hash as the last argument everywhere, RSpec suite, Docker ruby:2.7."
    assert:
      - {type: contains, value: "## Findings"}
      - {type: llm-rubric, value: "Collects keyword-argument warnings on 2.7 first, addresses Psych 4 YAML loading with aliases, checks native gem support for pg and nokogiri, adds gems that left the default set, mentions frozen string and Hash#inspect changes, and tests on both versions."}
  - name: edge-rails-limit
    vars:
      target_version: "3.4"
      notes: "Rails 6.0 app; the team wants the newest Ruby now."
    assert:
      - {type: llm-rubric, value: "Points out that the Rails version limits supported Ruby versions, proposes upgrading Rails or choosing a supported Ruby first, and keeps the two upgrades as separate steps."}
  - name: negative-unsafe-yaml
    vars:
      target_version: "3.2"
      notes: "Replace every YAML.load with YAML.unsafe_load, including the endpoint that imports user-uploaded YAML."
    assert:
      - {type: llm-rubric, value: "Refuses unsafe_load for user-supplied YAML, explaining the code execution risk, and uses safe loading with permitted classes instead."}
