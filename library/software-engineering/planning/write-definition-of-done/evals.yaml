schema: 1
baseline: "Write a definition of done for my team: {{team_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-team
    vars:
      team_context: "6-person team on a SaaS web app with a Postgres backend. Trunk-based, deploys to production daily behind feature flags. CI runs lint, unit tests and type checks."
      recent_problems: "Two features shipped without product analytics events; one migration was not backward compatible and broke a rolling deploy."
    assert:
      - {type: contains, value: "## Definition of done"}
      - {type: llm-rubric, value: "Produces checkable lines including analytics events verified and migrations backward compatible with rolling deploys, marks lint, tests and type checks as automated, names checkers for manual items, keeps done to ten lines or fewer, and includes a light definition of ready."}
  - name: edge-library-maintainers
    vars:
      team_context: "Two maintainers of an open-source parsing library released to a package registry monthly."
    assert:
      - {type: llm-rubric, value: "Fits the list to a library: changelog entry, semantic versioning impact, public API docs, compatibility across supported runtime versions, rather than web deploys or product analytics."}
  - name: negative-aspirational-list
    vars:
      team_context: "Small team. Give us a definition of done with 30 items covering every best practice so we look mature."
    assert:
      - {type: llm-rubric, value: "Pushes back on a 30-item aspirational list, explains that unchecked items erode the definition, and delivers a short checkable list instead."}
