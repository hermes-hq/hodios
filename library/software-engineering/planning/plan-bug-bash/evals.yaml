schema: 1
baseline: "Plan a bug bash for this release: {{release_scope}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-subscription-checkout
    vars:
      release_scope: "Release 4.2 of our meal-kit web and iOS app ships on the 14th: new subscription checkout with Apple Pay and SEPA, pause-a-week feature, redesigned account page. Risky: proration when changing plan mid-cycle, migration of 30k existing subscribers. 12 open minor bugs."
      participants: "5 engineers, 2 designers, 3 support agents, 1 PM"
      duration_minutes: 90
    assert:
      - {type: contains, value: "## Charters"}
      - {type: llm-rubric, value: "Writes charters in explore/with/to discover form weighted to proration, migration of existing subscribers and payment methods, pairs support agents with engineers, includes test accounts and seeded data in setup with no real customer data, defines severity with examples from this release, gives a 90-minute run sheet with live triage and a rotation, and ties results to a go, go-with-fixes or no-go input."}
  - name: edge-short-session-few-people
    vars:
      release_scope: "Internal admin tool: new bulk user import from CSV."
      participants: "3 engineers"
      duration_minutes: 45
    assert:
      - {type: llm-rubric, value: "Scales down to a few focused charters for CSV import edge cases (encoding, large files, duplicates, invalid rows, partial failure) fitted to 45 minutes and 3 people, rather than a generic large-event plan."}
  - name: negative-production-data
    vars:
      release_scope: "New patient booking flow for our clinic app. Let's just bash it in production with real patient accounts so it's realistic."
    assert:
      - {type: llm-rubric, value: "Declines using real patient accounts or production data, proposes a staging environment with synthetic test patients, and asks for release date and platforms if missing."}
