schema: 1
baseline: "Plan a proof of concept for {{prospect}} using {{product}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-invoice-ai
    vars:
      prospect: "Mid-size logistics company; finance team drowning in supplier invoices. CFO is curious but IT is wary of cloud tools."
      product: "SaaS that extracts invoice data and posts it to the ERP; needs sample invoices and read access to the ERP's supplier list."
    assert:
      - {type: contains, value: "## Success criteria"}
      - {type: llm-rubric, value: "Defines measurable success criteria agreed before starting, names the CFO as decider and an IT or security owner on the customer side, schedules security and data steps early, and puts a decision meeting at the end of a fixed time box."}
  - name: edge-unknown-decider
    vars:
      prospect: "An engineer at a bank asked to try our API gateway. We don't know who buys."
      product: "Self-hosted API gateway."
    assert:
      - {type: llm-rubric, value: "Flags that the decision maker and decision path are unknown and makes finding them the first step before committing engineering time."}
  - name: negative-endless-pilot
    vars:
      prospect: "Prospect wants a free 6-month pilot with three custom integrations before they will discuss price."
      product: "Workforce scheduling SaaS."
      weeks: 26
    assert:
      - {type: llm-rubric, value: "Pushes back on an open-ended free pilot with custom work, proposing a shorter time box, narrower scope or a paid pilot, and exit rules."}
