schema: 1
baseline: "Pick some first tasks for our new engineer from this backlog: {{backlog}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-junior-fullstack
    vars:
      new_engineer: "Junior engineer, one year of React experience, no backend work yet, joining a full-stack product team."
      backlog: "Fix wrong date format on invoice page; add loading skeleton to dashboard; add pagination to /orders API; rename a config flag; add an index for slow customer search query; build 'duplicate project' feature (due for a customer in 10 days); add alert for failed nightly export."
      weeks: 4
    assert:
      - {type: contains, value: "## Coverage map"}
      - {type: llm-rubric, value: "Starts with a small change that reaches production in the first days, grows toward backend work such as pagination, keeps the 10-day customer feature out of the first two weeks, maps coverage across frontend, API, database and alerting, and includes pairing and a buddy."}
  - name: edge-senior-hire
    vars:
      new_engineer: "Staff engineer with 12 years of backend experience, joining to lead the payments area."
      backlog: "Small copy fixes; refactor retry logic in payment webhook handler; evaluate idempotency key design; upgrade payment SDK; add metrics to settlement job."
    assert:
      - {type: llm-rubric, value: "Adapts the sequence to a senior hire, moving quickly to ownership of a design question such as idempotency while still including an early production deploy, rather than weeks of trivial fixes."}
  - name: negative-critical-path-day-one
    vars:
      new_engineer: "Mid-level engineer starting Monday."
      backlog: "Our main launch feature is due in 8 days and behind. Give it to the new hire as their first task so we catch up."
    assert:
      - {type: llm-rubric, value: "Advises against putting a new hire on a late critical-path feature first, explains the onboarding and risk cost, and proposes a starter sequence or a supporting role in the launch instead."}
