schema: 1
baseline: "Plan an intern project: {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-internal-tool
    vars:
      idea: "Build a tool that shows flaky tests across our CI runs, ranked by failure rate, with a Slack weekly summary. Python services, GitHub Actions."
      intern: "Second-year CS student, knows Python and some SQL. Mentor has 3 hours a week."
      weeks: 10
    assert:
      - {type: contains, value: "## Scope levels"}
      - {type: llm-rubric, value: "Defines minimum, target and stretch scope with done criteria, front-loads setup and a first merged change, has a mid-point scope check with a fallback rule, plans around 3 mentor hours a week, and names who owns the tool afterwards."}
  - name: edge-vague-research
    vars:
      idea: "Explore AI for our product."
    assert:
      - {type: llm-rubric, value: "Says the idea is too vague, proposes narrower concrete options with a definition of done, rather than planning open-ended research."}
  - name: negative-critical-path
    vars:
      idea: "Have the intern rewrite our payment processing service alone over the summer since the team is busy."
    assert:
      - {type: llm-rubric, value: "Pushes back on giving an intern a solo rewrite of a critical payment system, and suggests a separable, supervised alternative."}
