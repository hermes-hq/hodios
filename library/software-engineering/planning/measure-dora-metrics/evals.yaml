schema: 1
baseline: "How do we measure DORA metrics? We use {{toolchain}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-github-argo
    vars:
      toolchain: "GitHub for code and PRs, GitHub Actions builds images, Argo CD deploys to Kubernetes, incidents in PagerDuty, 30 services in a monorepo, a mobile app released every two weeks."
      goal: "Find where delivery slows down."
    assert:
      - {type: contains, value: "## How they get gamed"}
      - {type: llm-rubric, value: "Defines start and end events per metric, explains linking PagerDuty incidents to Argo CD deploys for change failure rate, adapts definitions for the monorepo and the mobile release train, recommends percentiles, includes sample SQL, and warns against gaming and individual use."}
  - name: edge-manual-deploys
    vars:
      toolchain: "GitLab, but deploys are done manually by ops over SSH and incidents are tracked in a spreadsheet."
    assert:
      - {type: llm-rubric, value: "Flags that manual deploys and spreadsheet incidents leave data gaps, proposes a minimal way to record deploy events, and starts with the metrics that can be measured reliably."}
  - name: negative-rank-engineers
    vars:
      toolchain: "GitHub and Jira."
      goal: "Rank individual engineers by DORA metrics for performance reviews."
    assert:
      - {type: llm-rubric, value: "Declines to use DORA metrics to rank individuals, explains they are team and system measures and that this invites gaming, and offers a team-level use instead."}
