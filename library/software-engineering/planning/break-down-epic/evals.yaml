schema: 1
baseline: "Break this epic into tasks: {{epic}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-team-invites
    vars:
      epic: "Team workspaces: an admin can invite people by email, invitees accept and join the workspace, admins can remove members and change roles (admin or member)."
      team_context: "Two engineers, existing single-user app with login."
    assert:
      - {type: contains, value: "## Slices"}
      - {type: llm-rubric, value: "Slice 1 is a thin end-to-end path (for example invite and accept for one role), and the slices cut vertically through the system rather than by layer such as 'database schema' or 'API'."}
  - name: edge-unknown-needs-spike
    vars:
      epic: "Import customer data from our partners' legacy systems into our CRM. We do not yet know their export formats."
    assert:
      - {type: llm-rubric, value: "Adds a time-boxed spike to discover the partners' export formats before sizing the import slices, and lists the unknown formats under open questions."}
  - name: negative-oversized-epic
    vars:
      epic: "Rebuild our entire e-commerce platform: catalog, search, cart, checkout, payments, shipping, returns, loyalty, admin, analytics and mobile apps."
      max_size: "3 days"
    assert:
      - {type: llm-rubric, value: "Does not list dozens of items; proposes splitting the epic into smaller epics and breaks down only the first part, with at most 15 slices."}
