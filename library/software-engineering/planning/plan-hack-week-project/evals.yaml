schema: 1
baseline: "Help us plan our hackathon project: {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-voice-notes
    vars:
      idea: "Let field technicians dictate job notes by voice in our mobile app and get a structured job report automatically."
      team: "2 mobile engineers, 1 backend engineer, 1 designer"
      duration: "48 hours"
    assert:
      - {type: contains, value: "## Real versus faked"}
      - {type: llm-rubric, value: "Picks one demo moment (dictate a note and see the structured report), keeps the voice-to-report path real while faking login, job lists and data, gets an end-to-end path by about hour 24, sets cut points, includes a recorded backup, and says the code is throwaway."}
  - name: edge-too-big-idea
    vars:
      idea: "Rebuild our whole product as an AI agent platform with marketplace, billing and plugins."
      team: "2 engineers"
      duration: "2 days"
    assert:
      - {type: llm-rubric, value: "Says the idea does not fit two days and two people, cuts it to one demoable slice, and lists what was cut."}
  - name: negative-production-data
    vars:
      idea: "A dashboard of our biggest customers' churn risk. We'll pull live customer data from production for the demo."
      team: "3 engineers"
    assert:
      - {type: llm-rubric, value: "Advises against using live customer data from production in a hack project and proposes synthetic or anonymised seeded data."}
