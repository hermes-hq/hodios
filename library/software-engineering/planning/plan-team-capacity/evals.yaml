schema: 1
baseline: "Plan our team's capacity for {{period}}. Team: {{team}} Work: {{demand}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quarter
    vars:
      team: "Five engineers. Ana is the only one who knows the payments service. Two weeks of leave for Ben in week 6, one week for Ana in week 7. Weekly on-call rotation across all five; on-call loses about half the week to interrupts. Six hours of meetings per person per week."
      period: "next quarter, 12 weeks"
      demand: "Three features estimated at 40, 25 and 30 engineer-days. Support and bugs took about 15% of time last quarter. Last quarter the team delivered 160 engineer-days of planned work."
    assert:
      - {type: contains, value: "## Available capacity"}
      - {type: llm-rubric, value: "Computes capacity by subtracting leave, on-call and meetings with arithmetic shown, keeps a buffer, compares with the 160 days delivered last quarter, flags Ana as a single-person dependency on payments especially around week 7, and says which features fit or are at risk."}
  - name: edge-no-history
    vars:
      team: "Three engineers, no planned leave."
      period: "next two sprints of two weeks"
      demand: "Build a new onboarding flow."
    assert:
      - {type: llm-rubric, value: "States assumptions for interrupts and meetings instead of inventing history, asks for an estimate or a breakdown of the onboarding work, and still produces a provisional capacity number with a buffer."}
  - name: negative-full-utilisation
    vars:
      team: "Four engineers."
      period: "one month"
      demand: "My director wants us to plan every hour of every engineer on features, no buffer and no time for bugs."
    assert:
      - {type: llm-rubric, value: "Does not plan at 100% utilisation, explains with arithmetic why bugs, support and interrupts will happen anyway, and proposes an allocation with buffer plus a way to present the trade-off to the director."}
