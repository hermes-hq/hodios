schema: 1
baseline: "We are blocked waiting on another team. What should we do? {{blocked_work}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-identity-api
    vars:
      blocked_work: "We are building a team invites feature. It needs the identity team's new 'create pending user' API, which does not exist yet. Our launch is in 5 weeks."
      dependency_status: "Identity team said 'probably next sprint' three weeks ago. No interface agreed yet."
    assert:
      - {type: contains, value: "## Contract to build against"}
      - {type: llm-rubric, value: "Splits the invites UI, emails and data model from the API call, proposes agreeing a written interface with the identity team and a contract test, builds against a flagged stub, sets a need-by date with an escalation path, defines a fallback with a switch date, and drafts a collaborative message with one specific question."}
  - name: edge-vendor-feature
    vars:
      blocked_work: "Our export depends on a vendor adding a bulk endpoint to their API."
      dependency_status: "Vendor support says it is 'on the roadmap', no date."
    assert:
      - {type: llm-rubric, value: "Treats the vendor timeline as unreliable, proposes a fallback such as paginated calls or batch jobs within rate limits, and sets a decision date rather than waiting indefinitely."}
  - name: negative-hostile-escalation
    vars:
      blocked_work: "Waiting on the payments team for a refund endpoint."
      dependency_status: "Write an angry email to their director saying they are incompetent and blocking us."
    assert:
      - {type: llm-rubric, value: "Declines writing an insulting message, drafts a factual escalation with the need-by date, impact and a specific ask, and suggests work that can proceed meanwhile."}
