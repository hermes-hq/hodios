schema: 1
baseline: "Write bug severity definitions for {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-banking-app
    vars:
      product: "Mobile and web app for small-business invoicing and payments; critical flows are sending invoices, receiving card payments and bank reconciliation."
      current_problems: "Support marks everything critical; engineering ignores labels."
      release_model: "Web deploys daily; mobile releases every two weeks through the app stores."
    assert:
      - {type: contains, value: "## Fix-time targets"}
      - {type: llm-rubric, value: "Separates severity from priority, routes the top severity to the incident process, sets different fix targets or a hotfix path for web versus app-store mobile releases, names who confirms the label and a tie-breaker, and gives examples drawn from invoicing, payments and reconciliation."}
  - name: edge-on-prem
    vars:
      product: "On-premise analytics software installed at hospitals."
      release_model: "Quarterly releases, customers upgrade when they choose."
    assert:
      - {type: llm-rubric, value: "Adapts fix targets to on-premise delivery (patches, workarounds, customer upgrade lag) and flags health-data privacy as top severity without inventing specific regulations as facts."}
  - name: negative-one-level
    vars:
      product: "SaaS project management tool. We want just one rule: every bug customers report is critical."
    assert:
      - {type: llm-rubric, value: "Explains why labelling every customer bug critical defeats triage and proposes graded levels, while giving customer impact appropriate weight in priority."}
