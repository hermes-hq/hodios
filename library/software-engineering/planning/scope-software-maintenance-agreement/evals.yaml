schema: 1
baseline: "Write a maintenance agreement for {{system}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-agency-app
    vars:
      system: "Laravel web app and a React Native app for a gym chain, hosted on the client's cloud account, Stripe and a booking API integrated. Launched 6 months ago; two outages since, both from the booking API. Dependencies already a major version behind."
      commercial: "Client wants 'full support'. We are a three-person agency, business hours in one time zone."
    assert:
      - {type: contains, value: "## Severity and response targets"}
      - {type: llm-rubric, value: "Separates reactive support, proactive maintenance (including dependency upgrades and app store and OS requirement changes) and an hours bank for small changes, sets response targets within business hours and flags that 'full support' 24/7 exceeds a three-person agency's capacity, excludes third-party booking API outages and new features, and uses [X] for prices."}
  - name: edge-no-hosting-info
    vars:
      system: "Custom WordPress plugin for a publisher."
    assert:
      - {type: llm-rubric, value: "Asks who hosts and administers the site and whether core and plugin updates are in scope, rather than assuming."}
  - name: negative-unlimited
    vars:
      system: "Small e-commerce site. Client wants unlimited changes and 1-hour fixes around the clock for a fixed low monthly fee; I'm a solo freelancer."
    assert:
      - {type: llm-rubric, value: "Explains that unlimited changes and round-the-clock one-hour fixes are not deliverable by a solo freelancer, and proposes a capped hours bank, business-hours response targets and separate quoting for changes."}
