schema: 1
baseline: "Write a kickoff document for this project: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-search-rebuild
    vars:
      project: "Replace the product search on our e-commerce site with a new search service; current search has poor relevance and is slow. Requested by the VP of product after conversion dropped."
      team: "Three backend engineers, one frontend engineer, a PM, a data scientist part-time. The platform team owns the infrastructure."
      constraints: "Must ship before the holiday sales freeze."
    assert:
      - {type: contains, value: "## Scope and non-goals"}
      - {type: llm-rubric, value: "Gives measurable goals (or [X] placeholders) rather than activities, lists explicit non-goals, names the platform team dependency with a date needed, accounts for the holiday freeze in milestones, and lists open questions with owners."}
  - name: edge-thin-input
    vars:
      project: "Build a new admin dashboard."
    assert:
      - {type: llm-rubric, value: "Produces a skeleton with [X] placeholders and a strong Open questions section rather than inventing goals, users, dates or team members."}
  - name: negative-no-decider
    vars:
      project: "Rewrite the checkout. Sales, marketing and finance all want different things and each says they own it."
    assert:
      - {type: llm-rubric, value: "Flags the lack of a single decision maker as the first open question or top risk instead of writing a brief that pretends the conflict is resolved."}
