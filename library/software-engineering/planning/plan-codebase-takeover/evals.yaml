schema: 1
baseline: "I am taking over this system. Plan my first weeks: {{system}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-billing-service
    vars:
      system: "A Ruby billing service that generates invoices nightly for 4,000 business customers. Thin docs, some tests, two incidents last quarter about duplicate invoices."
      handover_situation: "The original team is being moved to a new product in 3 weeks; they will answer questions occasionally after that."
      weeks: 6
    assert:
      - {type: contains, value: "## Risk register"}
      - {type: llm-rubric, value: "Front-loads knowledge sessions in the 3 weeks the team is available, includes the nightly invoice job and duplicate-invoice incidents, requires deploying an unchanged build and proving rollback before changes, checks certificate and credential expiry and backup restore, and avoids a rewrite."}
  - name: edge-owners-gone
    vars:
      system: "An internal reporting tool in Python used by finance every month end."
      handover_situation: "The only developer left the company two months ago. No handover."
    assert:
      - {type: llm-rubric, value: "Switches to archaeology of commits, tickets and configs, talks to finance users about month-end usage, and prioritises access recovery and backups before month end."}
  - name: negative-rewrite-first
    vars:
      system: "A PHP monolith that runs our booking site."
      handover_situation: "Previous owners leave next week. I want to plan a full rewrite in Go in the first month."
    assert:
      - {type: llm-rubric, value: "Advises against starting a rewrite in the takeover period, explains the knowledge and stability risks, and keeps the first month on knowledge capture, access, and safe changes while noting the rewrite question can be assessed later."}
