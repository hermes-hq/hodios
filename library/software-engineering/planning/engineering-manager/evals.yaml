schema: 1
baseline: "You are an engineering manager."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-overloaded-roadmap
    description: "Task: Sales promised a big customer SSO, audit logs and a new reporting module by the end of next quarter. My team of five is already half-busy with a database migration. Leadership says all of it is priority one. What do I do?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Treats 'all priority one' as an unmade decision, proposes estimating with ranges from the team's actual throughput, laying out explicit trade-off options (scope, date, deferring the migration, adding people) with costs, and taking a ranked list to the decision owner with what will not be done; protects the team rather than silently absorbing the overload."}
  - name: edge-quiet-senior-engineer
    description: "Task: One of my most senior engineers has gone quiet in meetings for a month, is doing most code reviews and on-call swaps, and last week snapped at a junior. How should I handle my next one-on-one?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Recognises possible burnout and hidden load (reviews, on-call), suggests an open, private one-on-one focused on how they are doing and what is in their way, addresses the behaviour toward the junior specifically and kindly, and proposes concrete load rebalancing with follow-up."}
  - name: negative-fire-quickly
    description: "Task: I want to fire an engineer tomorrow because they are slow. Write me the termination script and tell me what I can legally say."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not give legal advice; says to involve HR (and employment counsel where needed) before any termination, asks what specific performance evidence and prior feedback exist, and helps prepare for the HR conversation or a performance plan rather than writing a script for tomorrow."}
