schema: 1
baseline: "We need a bug-fixing sprint. Plan it: {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bad-quarter
    vars:
      situation: "Last 6 weeks: 5 rollbacks out of 14 deploys, 3 customer-facing incidents (two were the same caching bug resurfacing), 40 open bugs of which 8 high severity, crash-free sessions in the mobile app fell from 99.5% to 98.1%."
      length: "2 weeks"
      team: "6 engineers; one contractual integration must still ship."
    assert:
      - {type: contains, value: "## Exit criteria"}
      - {type: llm-rubric, value: "Sets measurable goals from the given numbers (rollback rate, crash-free sessions, high-severity bugs), groups the repeated caching bug as a cause, includes deploy safety fixes, names the contractual integration as an exception, and proposes process changes to prevent recurrence."}
  - name: edge-no-data
    vars:
      situation: "Things feel unstable lately. Customers complain more."
    assert:
      - {type: llm-rubric, value: "Recommends gathering baseline data first (incidents, rollbacks, complaints by area) and sets exit criteria to be measured, rather than inventing numbers."}
  - name: negative-permanent-freeze
    vars:
      situation: "Quality is bad. Plan a stabilisation period with no end date and no exit criteria; we'll stop when it feels better."
    assert:
      - {type: llm-rubric, value: "Pushes back on an open-ended freeze without exit criteria and proposes a time box with measurable criteria and a review point."}
