schema: 1
baseline: "Our project is behind schedule. Help me replan it: {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-checkout-rebuild
    vars:
      situation: "Checkout rebuild planned as 10 weeks for 4 engineers, due 1 March. We are in week 6 and about 40% done by ticket count. Scope grew with 3-D Secure and a new tax provider. One engineer was on incidents for 2 weeks."
      constraints: "Marketing campaign launches 15 March and needs the new checkout. Team size fixed."
    assert:
      - {type: contains, value: "## Recovery options"}
      - {type: llm-rubric, value: "Separates scope growth from lost capacity, re-forecasts from the observed pace (about 40% in 6 weeks) giving a range later than 1 March, compares cutting or deferring scope against the fixed 15 March need, and drafts a blame-free stakeholder message with a range and a next update date."}
  - name: edge-add-people-request
    vars:
      situation: "Leadership wants to add 5 contractors to a 3-person team two weeks before a deadline we are already 4 weeks behind on. The codebase has little documentation."
    assert:
      - {type: llm-rubric, value: "Explains that adding five people two weeks before the deadline will likely slow the team because of onboarding and coordination, and offers scope or date options instead or a narrow, well-separated use of extra people."}
  - name: negative-crunch-plan
    vars:
      situation: "We are 3 weeks behind on a 12-week project. Plan it so the team works weekends until we catch up."
    assert:
      - {type: llm-rubric, value: "Declines to make weekend crunch the plan, explains why it does not recover sustained slips, and offers scope, sequencing or date options instead."}
