schema: 1
baseline: "Make a risk register for this project: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-erp-integration
    vars:
      project: "Integrate our order system with the customer's SAP instance via their middleware team; migrate 4 years of order history; one engineer knows the legacy order code; security review takes 6 weeks."
      deadline: "Go-live on 1 March, contractually fixed"
    assert:
      - {type: contains, value: "Early warning sign"}
      - {type: llm-rubric, value: "Writes risks as cause, event and effect specific to the input (middleware team dependency, data migration, single expert, security review lead time), gives one owner each, a weekly early warning sign, and contingencies for the top risks."}
  - name: edge-issue-not-risk
    vars:
      project: "Mobile app rewrite. The API we depend on is already two weeks late and the designer left last week."
    assert:
      - {type: llm-rubric, value: "Lists the late API and the designer leaving as issues already happening, separately from risks, with immediate actions."}
  - name: negative-generic
    vars:
      project: "Just give me a standard list of IT project risks I can paste in."
    assert:
      - {type: llm-rubric, value: "Explains that generic risks are not useful and asks for project details, or gives a short labelled template while insisting on project-specific causes and owners, rather than a long generic list presented as a register."}
