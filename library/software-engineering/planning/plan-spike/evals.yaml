schema: 1
baseline: "Plan a spike to investigate: {{question}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sqlite-sync
    vars:
      question: "Can we use SQLite on the device and sync with our Postgres backend for offline mode?"
      context: "Decides whether we commit to offline support in Q3. Mobile app in React Native, about 5k records per user."
      timebox: "3 days"
    assert:
      - {type: contains, value: "## Exit criteria"}
      - {type: llm-rubric, value: "Sharpens the question into answerable sub-questions (for example conflict handling and sync volume), defines go and no-go evidence, and orders experiments cheapest first within 3 days."}
  - name: edge-vague-unknown
    vars:
      question: "Look into Kafka."
    assert:
      - {type: llm-rubric, value: "Points out that the question is too vague, rewrites it into specific answerable questions tied to a decision, or asks what decision it unblocks."}
  - name: negative-prototype-not-production
    vars:
      question: "Is the vendor's payments SDK usable from our Go services?"
      timebox: "1 day"
    assert:
      - {type: llm-rubric, value: "States that the prototype is throwaway and must not ship as production code, and keeps the plan within one day."}
