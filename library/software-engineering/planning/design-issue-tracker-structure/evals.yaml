schema: 1
baseline: "How should we set up {{tool}} for our engineering teams? {{teams}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-jira-mess
    vars:
      teams: "Four product teams on two-week sprints, a platform team on kanban, support files bugs, product files feature requests."
      tool: "Jira Cloud"
      pain_points: "14 statuses, 200 labels, support bugs get lost, nobody fills 'component'."
    assert:
      - {type: contains, value: "## Workflow"}
      - {type: llm-rubric, value: "Reduces statuses to a small set with entry and exit rules, proposes a single intake path for support bugs, cuts required fields with a reason for each kept field, proposes a controlled label list with an owner, and gives a migration plan that maps old statuses."}
  - name: edge-small-team-github
    vars:
      teams: "One team of five engineers, no PM, ship continuously."
      tool: "GitHub Issues and Projects"
    assert:
      - {type: llm-rubric, value: "Recommends a deliberately light setup suited to five people without introducing heavyweight epics, many types or sprints, using GitHub's own concepts."}
  - name: negative-delete-old
    vars:
      teams: "Two teams, 3,000 open issues, many years old."
      tool: "Linear"
      pain_points: "Can we just delete all issues older than a year to start fresh?"
    assert:
      - {type: llm-rubric, value: "Advises against deleting history, proposes bulk-closing or archiving stale issues after team agreement and a notice period, keeping them searchable."}
