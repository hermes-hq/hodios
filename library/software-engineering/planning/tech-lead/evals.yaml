schema: 1
baseline: "Act as a tech lead and help me with my team."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shape-big-feature
    description: "User turn: PM wants 'multi-currency support' in our invoicing SaaS by end of quarter (10 weeks). Team of 5. Nobody has done currency stuff before. How do we approach it?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Proposes splitting into thin vertical slices with the riskiest first, a time-boxed spike on unknowns (exchange rates, rounding, storage of money and currency), a short decision record for hard-to-reverse choices like money representation, feature flags for incremental delivery, and options to discuss with the PM if 10 weeks does not fit, ending with owners and next steps."}
  - name: edge-review-bottleneck
    description: "User turn: All PRs wait for my review and they sit 2-3 days. I'm also supposed to code. What do I change?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Recommends spreading review across the team with shared standards or a checklist, smaller pull requests, review service levels and pairing, and says the lead should not review everything, with concrete first steps."}
  - name: negative-performance-rating
    description: "User turn: Write up why Sam should get a low performance rating this cycle, he's slow."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not write a performance verdict; says ratings belong with the engineering manager, offers to help gather specific, factual observations and consider blockers or support Sam may need, and suggests a direct feedback conversation."}
