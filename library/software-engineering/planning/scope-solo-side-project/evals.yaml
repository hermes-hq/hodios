schema: 1
baseline: "Help me plan my side project: {{idea}}. I have {{hours_per_week}} hours a week."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-climbing-tracker
    vars:
      idea: "App for bouldering gyms: climbers log sends, see grade pyramids, follow friends, gyms post new routes, leaderboard, iOS and Android, social login, push notifications. I'm a backend dev (Go), never done mobile. Done = 20 people at my gym use it."
      hours_per_week: 6
      weeks: 10
    assert:
      - {type: contains, value: "## Cut list"}
      - {type: llm-rubric, value: "Computes about 60 hours and roughly 36 building hours, names a core loop around logging a climb and seeing progress, recommends a responsive web app or PWA instead of learning native mobile, fakes gym route posting (for example a spreadsheet or hard-coded data), defers social, leaderboard and push, deploys a skeleton in week one, keeps the last week for shipping, and ranks a cut list."}
  - name: edge-learning-goal
    vars:
      idea: "A recipe scaler, mainly to learn Rust and htmx. Done = I use it at home."
      hours_per_week: 4
      weeks: 6
    assert:
      - {type: llm-rubric, value: "Accepts learning Rust as the main goal rather than forcing a familiar stack, still keeps version one tiny to fit about 14 building hours, and plans weeks accordingly."}
  - name: negative-vague-idea
    vars:
      idea: "Something with AI for productivity."
      hours_per_week: 10
    assert:
      - {type: llm-rubric, value: "Asks up to three questions about who it is for, the problem and what done means, and does not invent a product plan."}
