schema: 1
baseline: "Help me run PI planning for these teams: {{teams}} Priorities: {{priorities}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-five-teams
    vars:
      teams: "Five teams of 6-8: checkout, catalog, mobile, platform, data. Mobile team is in a time zone 6 hours ahead."
      priorities: "1) New loyalty programme across web and mobile (needs platform events and data pipeline). 2) Checkout performance. 3) Migrate catalog search."
      format: hybrid
    assert:
      - {type: contains, value: "## Dependency board"}
      - {type: llm-rubric, value: "Includes a readiness checklist before the event, an agenda adapted to the time-zone gap, committed versus stretch objectives with business value set by business owners and load under full capacity, pre-fills the loyalty programme dependencies on platform and data, uses ROAM for risks and a confidence vote with rework for low votes."}
  - name: edge-two-teams
    vars:
      teams: "Two teams of four."
      priorities: "Three features for next quarter."
    assert:
      - {type: llm-rubric, value: "Notes that full PI ceremony may be heavy for two teams and suggests a lighter joint planning session, while still covering dependencies and risks."}
  - name: negative-full-load
    vars:
      teams: "Four teams."
      priorities: "Leadership wants every team planned at 100% capacity with no stretch objectives so we commit to everything."
    assert:
      - {type: llm-rubric, value: "Pushes back on 100% loading and explains why it destroys predictability, recommending buffer and stretch objectives."}
