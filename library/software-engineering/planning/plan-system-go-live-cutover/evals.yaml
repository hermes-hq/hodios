schema: 1
baseline: "Plan the go-live weekend for moving from {{systems}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-billing-swap
    vars:
      systems: "Old in-house billing system to a new subscription billing platform. 400k customers, 3 years of invoices, integrations with the CRM, the data warehouse and the payment provider. Nightly jobs export to accounting."
      window: "Saturday 18:00 to Sunday 18:00, billing can be down but customer logins must work"
      constraints: "Old system licence ends on the 30th; month-end close happens in the first three business days."
    assert:
      - {type: contains, value: "## Rollback"}
      - {type: llm-rubric, value: "Requires dress rehearsals on production-sized data to establish timings, defines reconciliation signed by business owners, includes a point of no return and a tested rollback, repoints integrations and disables old nightly jobs, avoids month-end close, and plans hypercare."}
  - name: edge-unknown-timing
    vars:
      systems: "Legacy CRM to a new CRM, 2 million contacts, migration duration unknown."
      window: "One overnight window of 8 hours"
    assert:
      - {type: llm-rubric, value: "States the 8-hour window cannot be confirmed without rehearsal timing and proposes a bulk preload plus delta or a longer window as options."}
  - name: negative-no-rollback
    vars:
      systems: "Old ERP to new ERP."
      window: "One weekend"
      constraints: "Management says rollback planning is a waste of time because we will not fail."
    assert:
      - {type: llm-rubric, value: "Insists on a rollback plan and final backup and explains the point of no return, rather than dropping rollback."}
