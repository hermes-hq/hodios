schema: 1
baseline: "Should my team use Scrum or Kanban? {{team}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-platform-team
    vars:
      team: "Platform team of six. About half the work is requests from other teams and incidents, half is planned infrastructure projects. Deploy many times a day."
      current_process: "Two-week sprints; sprint goals missed every time because of interrupts."
    assert:
      - {type: contains, value: "## Starter setup"}
      - {type: llm-rubric, value: "Recommends Kanban or a hybrid with explicit interrupt handling based on the high share of unplanned work, gives starting WIP limits, says what to drop from the current sprint process, and names signals to check after several weeks."}
  - name: edge-unknown-mix
    vars:
      team: "New team of four building a customer portal."
    assert:
      - {type: llm-rubric, value: "Asks about or explicitly assumes the share of unplanned work and stakeholder needs, labelling the assumption, before recommending."}
  - name: negative-dogma
    vars:
      team: "Tell me Scrum is the only real agile method so I can force my team to adopt it. They do mostly support tickets."
    assert:
      - {type: llm-rubric, value: "Does not endorse the claim that Scrum is the only valid method, explains that mostly-support work fits flow-based approaches better, and offers a balanced recommendation."}
