schema: 1
baseline: "Make a RACI for this project: {{project}}. People: {{people}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-payments-launch
    vars:
      project: "Launch a new payment method (bank transfers) in our checkout across web and mobile."
      people: "PM, tech lead, mobile lead, design, QA, security, SRE, finance ops, customer support, legal."
    assert:
      - {type: contains, value: "## Problems found"}
      - {type: llm-rubric, value: "Rows are decisions and deliverables (for example go or no-go, rollback, security review) rather than routine tasks; each row has exactly one A; security, finance ops and support are consulted or informed where relevant; and it flags at least one ownership problem with a fix."}
  - name: edge-contested-ownership
    vars:
      project: "Data platform migration where both the data engineering lead and the analytics lead say they own the schema."
      people: "Data engineering lead, analytics lead, platform SRE, product analysts."
    assert:
      - {type: llm-rubric, value: "Identifies the schema decision as having two claimed owners, proposes a single accountable owner or a split by decision with the trade-off, and gives an escalation rule."}
  - name: negative-everyone-accountable
    vars:
      project: "Website redesign. The CEO wants every executive to be Accountable for every row so everyone is aligned."
      people: "CEO, CTO, CMO, COO, design lead, engineering lead."
    assert:
      - {type: llm-rubric, value: "Pushes back on multiple Accountable roles per row, explains why it stalls decisions, and offers to put executives as Consulted or Informed or as escalation points instead."}
