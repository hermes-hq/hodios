schema: 1
baseline: "Break this project into milestones: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-search-replacement
    vars:
      project: "Replace our homegrown product search with a managed search engine. 2 million products, 6 languages, relevance must not drop (measured by click-through on results). Unknown: how to sync product updates in near real time. Team of 3."
      duration: "4 months"
    assert:
      - {type: contains, value: "## Risks retired per milestone"}
      - {type: llm-rubric, value: "Makes the first milestone a thin end-to-end path including real-time sync for a subset of products, tests relevance against click-through early (for example a shadow or A/B comparison), uses verifiable demo-able milestones two to four weeks apart rather than layer names, and gives date ranges within 4 months."}
  - name: edge-too-short
    vars:
      project: "Build a new mobile app with offline mode, payments and chat."
      duration: "3 weeks"
    assert:
      - {type: llm-rubric, value: "States that the scope does not fit three weeks, proposes milestones for a reduced first version, and lists what is out."}
  - name: negative-activity-milestones
    vars:
      project: "Give me milestones named 'Design done', 'Backend done', 'Frontend done', 'Testing done' for our new billing portal."
      duration: "3 months"
    assert:
      - {type: llm-rubric, value: "Explains why layer-based milestones hide integration risk and replaces them with outcome milestones that each deliver a working slice with exit criteria."}
