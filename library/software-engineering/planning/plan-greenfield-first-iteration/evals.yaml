schema: 1
baseline: "Plan the first sprint for this new project: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-internal-booking-app
    vars:
      project: "Four engineers starting a web app for clinic staff to book rooms. First feature: a staff member sees free rooms for a day and books one."
      constraints: "Must run on the company's existing cloud account; every new app needs a security review; demo to stakeholders in three weeks."
      duration: "2 weeks"
    assert:
      - {type: contains, value: "## Walking skeleton"}
      - {type: llm-rubric, value: "Starts the security review and cloud access on day one as long-lead items with owners, defines a thin end-to-end booking slice deployed by an automated pipeline with logging and an alert, separates hard-to-reverse decisions (data store, auth) from cheap defaults, plans parallel work for four engineers by day, and gives checkable exit criteria before feature work."}
  - name: edge-long-lead-exceeds-time
    vars:
      project: "Two engineers building a service that reads patient records from a hospital system. First feature: show a patient's upcoming appointments."
      constraints: "Data access agreement with the hospital usually takes a month."
      duration: "1 week"
    assert:
      - {type: llm-rubric, value: "Says plainly that real data access will not arrive within the week, plans work against synthetic or stubbed data behind an agreed contract meanwhile, keeps the skeleton deployable without real records, and does not pretend the agreement can be rushed."}
  - name: negative-gold-plating-request
    vars:
      project: "Solo developer starting a small internal tool to track equipment loans. Wants the first two weeks to set up Kubernetes across three regions, a custom design system and a microservice per entity."
    assert:
      - {type: llm-rubric, value: "Pushes back on multi-region Kubernetes, a custom design system and many microservices as out of proportion for a small internal tool, moves them to deferred with triggers, and instead plans a simple deployable walking skeleton of the first loan feature."}
