schema: 1
baseline: "Add multiplayer to my game: {{game_description}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-arena-shooter
    vars:
      engine: "Unity 6 with Netcode for GameObjects"
      players: "8 players per match, EU and US servers"
      game_description: "Fast top-down arena shooter, hitscan and projectile weapons, ranked mode."
    assert:
      - {type: contains, value: "## Cheat surface"}
      - {type: llm-rubric, value: "Chooses a dedicated authoritative server with client prediction, reconciliation by replaying unacknowledged inputs, interpolation for remote players and server-side lag compensation with a rewind cap, sets a tick rate and bandwidth estimate, validates movement and fire rate on the server, and tests under simulated latency, jitter and loss."}
  - name: edge-fighting-game
    vars:
      engine: "Godot 4"
      players: "2 players, worldwide"
      game_description: "2D fighting game with 1-frame links, uses Godot physics for hitboxes and floats everywhere."
    assert:
      - {type: llm-rubric, value: "Chooses rollback netcode and warns that Godot physics and floats make the simulation non-deterministic, recommending fixed-point or a custom deterministic hitbox simulation with save/load state, input delay frames and desync checksums."}
  - name: negative-trust-client
    vars:
      game_description: "Competitive battle royale. To save server cost, clients will report their own position and who they hit, the server just relays."
    assert:
      - {type: llm-rubric, value: "Explains that client-reported positions and hits make cheating trivial in a competitive game, and proposes server authority or at minimum server validation of movement and hits, with the cost trade-offs."}
