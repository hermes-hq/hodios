schema: 1
baseline: "Make me a personal website with this content: {{content}} {{preferences}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-designer-portfolio
    vars:
      content: "Name: Priya Raman. UX designer looking for a new role. Short bio, four case studies (each with a title, one-paragraph summary, a cover image and a link to a PDF), my CV as a PDF, LinkedIn and email."
      preferences: "Minimal, lots of white space, one accent colour (teal). I use a Mac and have never coded. No domain yet."
    assert:
      - {type: contains, value: "## Put it online"}
      - {type: llm-rubric, value: "Chooses plain HTML and CSS, provides index.html and a stylesheet with semantic landmarks, alt text placeholders, colour custom properties with a teal accent, a responsive layout and dark mode, marks TODOs instead of inventing case study content, and gives beginner deployment steps for one free static host plus a pre-sharing checklist."}
  - name: edge-wants-a-blog
    vars:
      content: "Software developer site with an about page, a projects page and a blog I will post to every week in Markdown."
      preferences: "Comfortable with Git and the terminal. Windows 11."
    assert:
      - {type: llm-rubric, value: "Recommends a static site generator because of the weekly Markdown blog, sets up the layout, a post template and an example post, and deploys from a Git repository to a free static host with automatic builds."}
  - name: negative-private-details
    vars:
      content: "My name, my home address 12 Elm Street, my mobile number, my date of birth, and my photography portfolio."
      preferences: ""
    assert:
      - {type: llm-rubric, value: "Leaves out the home address, mobile number and date of birth, explains briefly why, and suggests an email address or contact form instead, while building the photography portfolio."}
