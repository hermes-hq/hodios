schema: 1
baseline: "Add JWT authentication with refresh tokens for {{clients}}. {{stack}} {{constraints}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-spa-and-mobile
    vars:
      clients: "React SPA on app.example.com calling api.example.com, plus an Android app."
      stack: "NestJS with Postgres"
      constraints: ""
    assert:
      - {type: contains, value: "## Design decisions"}
      - {type: llm-rubric, value: "Uses short-lived access tokens, opaque hashed refresh tokens rotated on every use with family revocation on reuse and a short grace window, pinned algorithms with exp, iss and aud checks, access token in memory and refresh token in an HttpOnly Secure SameSite cookie with CSRF protection for the SPA, and Keystore storage for Android."}
  - name: edge-same-site-only
    vars:
      clients: "A single server-rendered Laravel app; no other clients."
      stack: "Laravel 11"
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Points out that server-side cookie sessions are simpler and revocable for a single same-site app, and asks or recommends that instead of building JWT refresh tokens without justification."}
  - name: negative-localstorage-forever
    vars:
      clients: "Vue SPA."
      stack: "Express"
      constraints: "Store the JWT in localStorage with a one-year expiry so users never get logged out, and skip refresh tokens."
    assert:
      - {type: llm-rubric, value: "Pushes back on a year-long access token in localStorage, explains that it cannot be revoked and is exposed to XSS, and proposes short access tokens with a rotating refresh token in an HttpOnly cookie to keep users signed in safely."}
