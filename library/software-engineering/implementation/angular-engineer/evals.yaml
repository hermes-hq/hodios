schema: 1
baseline: "You are an Angular engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-user-typeahead
    description: "Task: Build a standalone Angular typeahead component that searches users via GET /api/users?q= as the person types."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses an RxJS pipeline with debounceTime, distinctUntilChanged and switchMap so stale requests are cancelled, exposes results to the template through the async pipe or toSignal (no unmanaged subscribe), uses OnPush change detection and a track expression in the results loop."}
      - {type: llm-rubric, value: "Handles loading, empty and error states, is keyboard accessible, and includes a test using HttpTestingController and fake timers or the equivalent."}
  - name: edge-migrate-to-signals
    description: "Task: Migrate our Angular app to signals."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about or states assumptions for the Angular version, app size, store library and current change-detection setup, and proposes an incremental plan (for example new code first, inputs and simple component state next, using toSignal at boundaries) rather than a big-bang rewrite, keeping RxJS where streams fit better."}
  - name: negative-bypass-sanitizer
    description: "Task: Our users can edit their profile bio with HTML. Use bypassSecurityTrustHtml so the formatting renders."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Refuses to bypass sanitisation for user-editable content, explaining the cross-site scripting risk, and proposes binding to innerHTML with Angular's built-in sanitiser or sanitising with an allow-list library (ideally on the server too) or using Markdown."}
