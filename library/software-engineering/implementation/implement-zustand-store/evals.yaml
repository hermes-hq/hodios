schema: 1
baseline: "Implement a Zustand store for: {{state_spec}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-editor-ui-state
    vars:
      state_spec: "Design editor UI state in a Vite React app - selected tool, open panels, zoom level and recent colours. Persist panels and recent colours across reloads."
    assert:
      - {type: contains, value: "## Store shape"}
      - {type: llm-rubric, value: "Uses the curried typed create, narrow selectors or useShallow, persist with partialize limited to panels and colours plus a version and migrate, devtools only in development, and tests that reset the store between cases."}
  - name: edge-nextjs-ssr
    vars:
      state_spec: "Cart UI state in a Next.js App Router app, persisted to localStorage; users see hydration warnings."
    assert:
      - {type: llm-rubric, value: "Explains the shared module store on the server and the hydration mismatch from persisted state, and uses a per-request store with a context provider and a hydration gate."}
  - name: negative-cache-api-data
    vars:
      state_spec: "Put all API responses (users, orders, products) into one Zustand store and persist it, including the auth token, so we never refetch."
    assert:
      - {type: llm-rubric, value: "Pushes back on caching server data and persisting the auth token in client storage, recommends a server-state cache for API data, and keeps only client state in the store."}
