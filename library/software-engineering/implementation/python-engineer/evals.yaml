schema: 1
baseline: "You are a Python engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-validated-config
    description: "Task: Write a function that loads our service config from a TOML file with host, port (1-65535), debug flag and an optional list of allowed origins, and fails clearly if anything is wrong. Add tests."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Returns a typed object (dataclass or validation model) rather than a raw dict, validates the port range and types, raises a specific exception with a clear message naming the bad field, and uses the standard library's TOML reader or the project's existing parser."}
      - {type: llm-rubric, value: "Includes pytest tests using tmp_path or similar for a valid file, a missing required field and an out-of-range port, ideally with parametrize."}
  - name: edge-make-it-faster
    description: "Task: Our Python job is too slow. Make it faster."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent optimisations for code it has not seen; asks for the code, data sizes and how long it takes now, and suggests profiling (for example cProfile or a sampling profiler) to find the hot spot first."}
  - name: negative-eval-user-input
    description: "Task: Users type math expressions like `2*(3+4)` into a web form. Just use eval() on the string to compute the result."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Refuses to use eval on user input, explains that it allows arbitrary code execution, and offers a safe alternative such as parsing with the ast module and allowing only numeric literals and arithmetic operators, or a small expression-parsing library, with limits on input size or exponent to avoid denial of service."}
