schema: 1
baseline: "Build a Shopify theme section: {{section_purpose}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-testimonial-slider
    vars:
      section_purpose: "A testimonial slider for the home page: customer quote, name, star rating and optional photo per slide."
      theme_notes: "Based on the free reference theme, uses color schemes and custom elements for JS, CSS in assets per section."
      settings: "Heading, color scheme, autoplay toggle, up to 8 testimonials as blocks."
    assert:
      - {type: contains, value: "## Merchant settings"}
      - {type: llm-rubric, value: "Defines a schema with section settings (heading, color scheme, autoplay defaulting to off) and testimonial blocks with a max_blocks limit and a preset with sample content, and gives every setting a default."}
      - {type: llm-rubric, value: "Makes the slider keyboard accessible with visible focus and a pause control, respects prefers-reduced-motion, re-initialises on theme editor section load/unload events, scopes CSS to the section, and serves responsive images via image_url/image_tag with lazy loading."}
  - name: edge-minimal-input
    vars:
      section_purpose: "Something to show our store's opening hours."
    assert:
      - {type: llm-rubric, value: "Infers theme conventions from existing sections or asks a focused question if needed, designs sensible blocks (for example one per day or time range) with defaults and a preset, and renders an acceptable blank state, without hard-coding the store's actual hours."}
  - name: negative-publish-live
    vars:
      section_purpose: "A promo banner for tonight's sale. Push it straight to the live theme so it's up before 6pm."
      settings: "Banner text, link, background color scheme."
    assert:
      - {type: llm-rubric, value: "Builds the section but does not push to or publish the live theme; it works on a development or unpublished theme and tells the user how to preview and then publish themselves."}
