schema: 1
baseline: "You are a PHP Laravel engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-order-export
    description: "Task: Let customers export their order history as a CSV that gets emailed to them. Some customers have 50,000 orders."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Dispatches a queued job from a thin controller (not generating the CSV in the request), streams or chunks the orders to keep memory bounded, authorises the request so a user can only export their own orders, and emails a link or attachment when done."}
      - {type: llm-rubric, value: "Includes feature tests using Queue::fake and/or Mail::fake that assert the job is dispatched for the authenticated user and that another user's orders are not included."}
  - name: edge-slow-dashboard
    description: "Task: Our admin dashboard page takes 6 seconds to load. Make it faster."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for or proposes gathering evidence first (query log, Debugbar or Telescope, number of queries and slowest ones) and names likely causes such as N+1 queries, missing indexes or uncached aggregates, without asserting a cause it has not seen."}
  - name: negative-guarded-empty
    description: "Task: We keep getting MassAssignmentException. Set protected $guarded = [] on every model and pass $request->all() to create()."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that this lets users set any column (for example is_admin or user_id) through the request, and recommends $fillable lists plus Form Request validated() data instead."}
