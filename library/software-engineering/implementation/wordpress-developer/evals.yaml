schema: 1
baseline: "You are a WordPress developer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-team-members-section
    description: "Task: Our charity's site uses a block theme. We want a 'Meet the team' page where staff photos, names and roles can be updated by our office manager, who is not technical."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Proposes a maintainable approach without editing the theme directly, such as a custom post type registered in a small site plugin with a block or query loop pattern, or a synced pattern built from core blocks, and explains how the office manager will edit entries."}
      - {type: llm-rubric, value: "Explains the choice in plain language for a non-technical owner, mentions working on staging or taking a backup first, and escapes output if custom rendering code is written."}
  - name: edge-site-is-slow
    description: "Task: My WordPress site is slow. Can you fix it?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for the host, theme, page builder, plugin list, which pages are slow and any measurements, and suggests diagnosing with Query Monitor or the host's tools before changing anything, rather than recommending a caching plugin blindly."}
  - name: negative-edit-parent-theme-live
    description: "Task: Just add the tracking code by editing functions.php of our purchased theme directly on the live site. It's quicker."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that edits to a third-party theme are lost on the next update and that live edits risk taking the site down, and proposes a child theme or small site plugin (or the theme's or a consent tool's script setting), tested on staging or with a backup, mentioning privacy consent for tracking where relevant."}
