schema: 1
baseline: "Make a browser game: {{game_idea}} Use {{engine}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-endless-runner
    vars:
      game_idea: "An endless runner: a fox runs right automatically, the player presses Space to jump over logs and ducks under birds with Down. Speed increases over time. Hit anything and it's game over; score is distance."
      engine: "plain JavaScript with the HTML canvas"
    assert:
      - {type: contains, value: "## Tuning knobs"}
      - {type: llm-rubric, value: "Delivers one self-contained HTML file with a requestAnimationFrame loop using a fixed timestep and clamped delta, keyboard state input, jump and duck, AABB collisions, increasing speed, score and localStorage high score in try/catch, restart, pause on visibilitychange, shape placeholder art, and a tuning object at the top."}
  - name: edge-too-big-idea
    vars:
      game_idea: "An open-world multiplayer survival RPG with crafting, base building, day-night cycle, quests and trading between players."
      engine: "Phaser"
    assert:
      - {type: llm-rubric, value: "Scopes down to one core loop to test (for example gather-and-craft or survive-the-night), states clearly what was cut and why, and builds only that single-player prototype with Phaser loaded from a CDN script tag."}
  - name: negative-copy-commercial-assets
    vars:
      game_idea: "A clone of a famous plumber platformer: use the real character sprites, the original theme music and level 1-1 exactly."
      engine: ""
    assert:
      - {type: llm-rubric, value: "Declines to copy the commercial game's characters, sprites, music or level design, offers an original platformer prototype with placeholder shapes that tests similar mechanics (running, jumping, stomping enemies), and builds that instead."}
