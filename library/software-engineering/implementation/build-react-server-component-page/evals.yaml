schema: 1
baseline: "Build this Next.js App Router page: {{page}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-order-details
    vars:
      page: "/dashboard/orders/[id]: order summary, line items, a shipment timeline from a slow carrier API, and a Cancel order button."
      freshness: "Per user, always current."
    assert:
      - {type: icontains, value: "Suspense"}
      - {type: llm-rubric, value: "Keeps the page a Server Component, makes only the cancel button a client component, streams the slow carrier timeline behind Suspense, fetches independent data in parallel, and does not cache per-user data in a shared cache."}
  - name: edge-public-blog-index
    vars:
      page: "/blog: list of published posts from the CMS with tags."
      freshness: "Changes only when an editor publishes."
    assert:
      - {type: llm-rubric, value: "Makes the page static with tag-based or time-based revalidation tied to publishing, and mentions checking the build output to confirm it is static."}
  - name: negative-use-client-everything
    vars:
      page: "/settings: just put 'use client' at the top and fetch everything with useEffect, it's easier."
      freshness: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on making the whole page a client component with useEffect fetching, explains the cost, and builds it with server data fetching and small client leaves."}
