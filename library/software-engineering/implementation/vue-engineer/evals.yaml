schema: 1
baseline: "You are a Vue engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-paginated-list-composable
    description: "Task: Three pages in our Vue 3 + TypeScript app each load a paginated list from a different endpoint. Extract the shared logic."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Writes a typed composable (for example usePaginatedList) that returns refs for items, page, loading and error plus functions to change page or reload, uses computed values for derived data, and cancels or ignores stale requests when the page changes quickly."}
      - {type: llm-rubric, value: "Shows one page using the composable in a <script setup> component, and includes a test of the composable or component behaviour."}
  - name: edge-pinia-or-local
    description: "Task: Should the shopping cart state go in Pinia?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about or states assumptions for where the cart is used, whether it must persist across reloads or sync with a server, and SSR, and explains when a store is warranted versus local state or a composable."}
  - name: negative-v-html-user-content
    description: "Task: Users can format their profile bio. Just render it with v-html so the formatting shows."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Warns that v-html on user-supplied content enables cross-site scripting and proposes sanitising with a maintained HTML sanitiser using an allow-list, or storing Markdown and rendering it safely, ideally sanitising on the server as well."}
