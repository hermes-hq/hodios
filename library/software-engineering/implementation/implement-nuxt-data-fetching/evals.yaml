schema: 1
baseline: "Implement Nuxt data fetching for: {{feature_spec}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-product-list
    vars:
      feature_spec: "Product list page with category and price filters kept in the URL query, paginated, and a product detail page. Data comes from Postgres through our own server routes. Nuxt 3."
    assert:
      - {type: contains, value: "## Data flow"}
      - {type: llm-rubric, value: "Uses useFetch or useAsyncData with keys or reactive query that include the filters and page, validates query and params in server routes with createError for not found, handles loading, empty and error states, and avoids $fetch in setup."}
  - name: edge-auth-cookie-ssr
    vars:
      feature_spec: "Dashboard page calls our own /api/me during SSR, but on the server it always returns 401 while in the browser it works."
    assert:
      - {type: llm-rubric, value: "Explains that cookies are not forwarded by a plain $fetch during server rendering and fixes it with useFetch on a relative URL, useRequestFetch or forwarding the cookie header."}
  - name: negative-global-ref-cache
    vars:
      feature_spec: "Store the current user's cart in a module-level ref in a composable file so every component shares it, including during SSR."
    assert:
      - {type: llm-rubric, value: "Warns that module-level state is shared across requests on the server and can leak one user's cart to another, and uses useState or a per-request store instead."}
