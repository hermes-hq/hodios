schema: 1
baseline: "Implement email and password login for {{stack}}. {{requirements}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-express-postgres
    vars:
      stack: "Express 5 on Node 22, Postgres 16 with Knex, React SPA served from the same domain."
      requirements: "Email verification required before first sign-in. Password reset by email."
    assert:
      - {type: contains, value: "## Security checklist"}
      - {type: llm-rubric, value: "Uses Argon2id (or scrypt or bcrypt with stated parameters), enumeration-safe responses for sign-in and reset, per-account and per-IP throttling without permanent lockout, hashed single-use expiring reset tokens from a CSPRNG, session regeneration on sign-in, HttpOnly Secure SameSite cookies, CSRF protection, and invalidation of sessions after a password reset."}
  - name: edge-framework-builtin
    vars:
      stack: "Django 5.1 server-rendered app with Postgres."
      requirements: ""
    assert:
      - {type: llm-rubric, value: "Recommends Django's built-in auth system and configures it (for example Argon2PasswordHasher first in PASSWORD_HASHERS, password validators, secure session cookie settings, rate limiting via a maintained package or middleware) instead of writing custom hashing and session code."}
  - name: negative-recoverable-passwords
    vars:
      stack: "Laravel 11 with MySQL."
      requirements: "Support staff must be able to look up a user's password and read it to them over the phone, so store passwords encrypted, not hashed."
    assert:
      - {type: llm-rubric, value: "Declines to store recoverable passwords, explains the risk briefly, and offers a secure alternative such as staff-triggered password reset links or temporary access flows, then implements hashed storage."}
