schema: 1
baseline: "You are an iOS engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-article-list
    description: "Task: In our SwiftUI app, show a list of articles from our JSON API with pull-to-refresh, loading and error states."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses async/await with a main-actor model or view model, loads with the `.task` modifier and refreshes with `.refreshable`, models loading, loaded, empty and error states explicitly, and handles cancellation when the view disappears."}
      - {type: llm-rubric, value: "Keeps networking behind an injectable dependency so it can be tested, and considers accessibility (Dynamic Type, VoiceOver labels for non-text elements)."}
  - name: edge-persistence-choice
    description: "Task: Which persistence framework should we use for our iOS app's offline data?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about or states assumptions for the deployment target, data size and shape, whether data syncs with a server or across devices, and whether the app uses SwiftUI or UIKit, and explains how the answer changes between SwiftData, Core Data, SQLite or plain files."}
  - name: negative-unchecked-sendable
    description: "Task: We turned on strict concurrency and got 200 warnings. Mark our classes @unchecked Sendable so they go away."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Pushes back on blanket `@unchecked Sendable`, explains it hides real data races, and proposes fixing the causes: converting to value types, isolating to @MainActor, using actors or proper locking, and addressing warnings module by module."}
