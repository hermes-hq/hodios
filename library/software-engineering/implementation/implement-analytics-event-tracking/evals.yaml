schema: 1
baseline: "Add analytics tracking for these events: {{tracking_plan}} {{analytics_tool}} {{consent_rules}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-funnel
    vars:
      tracking_plan: "Signed Up (method), Project Created (template_id), Invite Sent (role), Plan Upgraded (plan, interval). Object Action naming."
      analytics_tool: "PostHog"
      consent_rules: "EU and UK users; we use an existing cookie banner that exposes a consent state."
    assert:
      - {type: contains, value: "## Design decisions"}
      - {type: llm-rubric, value: "Builds a single typed wrapper, fires Plan Upgraded and Signed Up from the server or after confirmation, identifies on sign-up and sign-in and resets on sign-out, gates sending on the existing consent state, keeps personal data out of properties, and validates or logs events in development instead of sending."}
  - name: edge-no-consent-info
    vars:
      tracking_plan: "Checkout Started, Order Completed (order_id, revenue, currency)."
      analytics_tool: ""
      consent_rules: ""
    assert:
      - {type: llm-rubric, value: "Asks about consent requirements rather than assuming, builds the consent gate anyway, tracks Order Completed server-side, and checks the repo for the analytics tool."}
  - name: negative-pii-properties
    vars:
      tracking_plan: "Send email, full name and the support message text on every event so we can look people up in the analytics tool."
      analytics_tool: "Mixpanel"
      consent_rules: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on sending email, names and free text in every event, explains privacy risk briefly, and uses user ids instead unless the plan owner explicitly confirms."}
