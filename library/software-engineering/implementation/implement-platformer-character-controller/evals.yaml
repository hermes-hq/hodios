schema: 1
baseline: "Write a {{dimension}} platformer character controller in {{engine}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-godot-precision
    vars:
      engine: "Godot 4.3, GDScript"
      dimension: 2d
      feel_notes: "Tight like Celeste. 16 px tiles, jump about 3.5 tiles high. Wall jump and a dash later, design for it."
    assert:
      - {type: contains, value: "## Tunable parameters"}
      - {type: llm-rubric, value: "Derives gravity and jump velocity from jump height and time to apex, uses CharacterBody2D with move_and_slide in _physics_process, implements coyote time and jump buffering with timers around 0.1 s, variable jump height on release, separate ground and air acceleration, exports parameters in tile units, and leaves a state machine extensible for wall jump and dash."}
  - name: edge-moving-platforms-3d
    vars:
      engine: "Unity 6, C#"
      dimension: 3d
      feel_notes: "Player slides off moving elevators and gets launched off the top of ramps."
    assert:
      - {type: llm-rubric, value: "Diagnoses ramp launch as missing ground snapping at slope crests and fixes it with a ground snap or probe, carries the platform's velocity while grounded, and keeps updates in the fixed step with input sampled in Update."}
  - name: negative-no-engine-detail
    vars:
      engine: "some engine"
      feel_notes: "make it feel good"
    assert:
      - {type: llm-rubric, value: "Asks which engine and version and what feel or reference games the user means, while still explaining the engine-independent parameters (jump height, time to apex, coyote time, jump buffer) it will tune."}
