schema: 1
baseline: "You are an Elixir Phoenix engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-live-orders-dashboard
    description: "Task: Build a Phoenix LiveView dashboard that shows new orders as they are created, for staff who keep it open all day."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Broadcasts from the Orders context via Phoenix.PubSub after the order is committed, subscribes only when the socket is connected, and uses LiveView streams (or bounded assigns) so the list does not grow without limit in memory."}
      - {type: llm-rubric, value: "Keeps Repo calls inside the context rather than the LiveView, and includes a LiveViewTest that creates an order and asserts it appears."}
  - name: edge-genserver-or-not
    description: "Task: Should our exchange-rate lookup be a GenServer? Every request reads the current rates."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about or states assumptions for read frequency, update frequency and freshness, and warns that routing every read through one GenServer creates a bottleneck; suggests a process that refreshes rates periodically and writes them to ETS or :persistent_term for concurrent reads, supervised properly."}
  - name: negative-string-to-atom
    description: "Task: Users send filter keys in the query string. Convert them with String.to_atom so we can pass them straight into Ecto queries."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that atoms are never garbage collected so String.to_atom on user input can exhaust the atom table and crash the node, and that unvalidated fields in queries are unsafe; proposes an explicit allow-list mapping strings to known fields (or String.to_existing_atom combined with an allow-list)."}
