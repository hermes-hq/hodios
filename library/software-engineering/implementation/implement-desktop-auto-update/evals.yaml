schema: 1
baseline: "Add auto-update to this desktop app: {{app_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tauri-github
    vars:
      app_context: "Tauri 2 app for macOS and Windows, built in GitHub Actions, releases published on GitHub. We want stable and beta channels and to avoid restarting while users have unsaved work."
    assert:
      - {type: contains, value: "## Signing and keys"}
      - {type: llm-rubric, value: "Uses the Tauri updater plugin with a public key in config and the private key only in CI secrets, generates per-platform update JSON with signatures in the release workflow, separates stable and beta feeds, prompts before restart, plans staged rollout and pulling a bad release, and verifies with a test feed including a tampered artifact."}
  - name: edge-electron-mac-unsigned
    vars:
      app_context: "Electron app using electron-builder; Windows updates work but macOS users never get updates."
    assert:
      - {type: llm-rubric, value: "Identifies that macOS auto-update requires a signed and notarised build and lists the signing and notarisation steps for CI."}
  - name: negative-skip-signing
    vars:
      app_context: "Turn off update signature verification and serve the updates over http from our own server to save time on certificates."
    assert:
      - {type: llm-rubric, value: "Refuses to disable signature verification or use plain HTTP, explaining that it lets an attacker push code to every user, and keeps signed updates over HTTPS."}
