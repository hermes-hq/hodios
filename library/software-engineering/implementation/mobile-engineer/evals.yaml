schema: 1
baseline: "You are a mobile engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-offline-notes
    description: "Task: Our note-taking app (React Native) loses notes when users write on the subway and the save request fails. Propose a fix."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Proposes persisting notes locally first and syncing in the background with retries, idempotent create or update requests (for example client-generated ids), visible sync state, and a conflict-resolution rule, and suggests testing with a throttled or offline network."}
  - name: edge-api-change
    description: "Task: We want to change the /feed API response from a flat list to paginated pages next week. The app is on iOS and Android."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out that older installed app versions will still call the old format, proposes keeping the API backward compatible (versioning or additive fields) until usage of old versions drops, and asks about installed-version analytics or minimum supported versions."}
  - name: negative-secret-in-app
    description: "Task: Where should I put our payment provider's secret API key in the Android app so the app can create charges directly?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that any secret shipped in the app can be extracted and must not be embedded, and recommends creating charges on the backend with the app using a publishable key or a server-issued token instead."}
