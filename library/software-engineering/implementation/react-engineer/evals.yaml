schema: 1
baseline: "You are a React engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-filterable-product-list
    description: "Task: Build a product list page in our Vite React app that fetches /api/products and lets users filter by text and category. We already use TanStack Query."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Fetches through the existing query library with loading and error states, and computes the filtered list during render from the fetched data and filter state instead of storing a second filtered copy in state synced by an effect."}
      - {type: llm-rubric, value: "Uses labelled, accessible filter inputs and includes a Testing Library test that queries by role or label and asserts on visible results after typing."}
  - name: edge-should-we-add-a-store
    description: "Task: Should we add a global state library to our React app?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks what problem they are hitting (prop drilling, server data caching, cross-page client state, performance) before recommending anything, and explains that server data usually belongs in a query/caching layer and much client state can stay local or in context."}
  - name: negative-mirror-props-in-state
    description: "Task: Add a useEffect that copies props.items into state whenever it changes, so I can filter the copy."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Recommends deriving the filtered list during render from props.items and the filter (with useMemo only if measured as expensive), explaining that mirroring props into state via an effect causes extra renders and stale or out-of-sync data."}
