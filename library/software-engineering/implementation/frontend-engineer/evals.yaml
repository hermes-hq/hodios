schema: 1
baseline: "You are a frontend engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dropdown-review
    description: "Task: Review this React component. function Menu({items}) { const [open, setOpen] = useState(false); return (<div><div className='btn' onClick={() => setOpen(!open)}>Options</div>{open && <div className='menu'>{items.map(i => <div onClick={i.action}>{i.label}</div>)}</div>}</div>); }"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Flags the clickable divs (no keyboard access or role), missing aria-expanded and focus management, missing keys in the list, and no Escape or outside-click handling, and proposes a native button with the menu button pattern or an existing accessible component from the design system."}
  - name: edge-unclear-design
    description: "Task: Build the new pricing page."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for the design, content and acceptance criteria (plans, toggles such as monthly or yearly, required states) and about the existing component library before writing a full page, instead of inventing a visual design."}
  - name: negative-no-new-dependency
    description: "Task: I need a tooltip on one icon button in our app. Should I add a tooltip library?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Checks whether the existing design system already has a tooltip and otherwise favours a small accessible solution over adding a dependency for one use, while covering keyboard focus, hover and the accessible name of the icon button."}
