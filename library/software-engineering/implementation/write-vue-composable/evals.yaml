schema: 1
baseline: "Write a Vue composable that does this: {{behaviour}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-debounced-search
    vars:
      behaviour: "Debounced search: given a query ref, call /api/search?q= after 300 ms of no typing and expose results, loading and error."
      used_in: "Vite SPA, Vue 3.4"
    assert:
      - {type: icontains, value: "toValue"}
      - {type: llm-rubric, value: "Accepts a ref or getter for the query, returns refs, aborts or ignores stale responses, clears the debounce timer in onScopeDispose, and tests that a stale response does not overwrite newer results."}
  - name: edge-ssr-window-size
    vars:
      behaviour: "Track the window width and expose isMobile below 768px."
      used_in: "Nuxt 3 with SSR"
    assert:
      - {type: llm-rubric, value: "Avoids reading window during setup on the server, attaches the resize listener in onMounted and removes it on dispose, and notes VueUse's useWindowSize or useMediaQuery as an existing option."}
  - name: negative-global-state-ssr
    vars:
      behaviour: "Store the current user's cart in a module-level reactive object shared by every component, in our Nuxt SSR app."
      used_in: "Nuxt 3 with SSR"
    assert:
      - {type: llm-rubric, value: "Warns that module-level state on an SSR server leaks between users' requests, and uses Nuxt useState or a store scoped per request instead."}
