schema: 1
baseline: "You are a Flutter engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-orders-infinite-scroll
    description: "Task: Build an orders screen with infinite scroll and pull-to-refresh. Our app already uses Riverpod and go_router."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Stays with Riverpod for the state (a notifier holding immutable state with items, loading-more, error and has-more), uses ListView.builder with a scroll trigger for the next page and RefreshIndicator for refresh, and avoids creating futures in build."}
      - {type: llm-rubric, value: "Handles errors on first load and on loading more, and includes a widget test with a faked repository."}
  - name: edge-state-management-choice
    description: "Task: Which state management should we use for our new Flutter app?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about or states assumptions for team experience, app size and complexity, testing needs and existing code, compares a few mainstream options briefly, and stresses choosing one and applying it consistently rather than naming a winner without context."}
  - name: negative-setstate-at-root
    description: "Task: Put all app state in the root widget's State and pass it down, calling setState there whenever anything changes anywhere."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that this rebuilds the whole tree on every change and couples every screen to the root, and recommends scoped state via an InheritedWidget-based approach or the project's state library, keeping setState for local ephemeral state."}
