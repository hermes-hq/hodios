schema: 1
baseline: "Make this web app a PWA: {{app_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-field-app
    vars:
      app_context: "Vite React app for field inspectors with login. They should open the app and the last viewed job pages without signal. Hosted on Netlify."
    assert:
      - {type: contains, value: "## Caching strategy"}
      - {type: llm-rubric, value: "Writes a complete manifest with maskable icons, uses the build's PWA tooling, precaches hashed assets, network-first navigations with an offline page, clears user data caches on sign-out, adds an update prompt instead of blind skipWaiting, sets no-cache for the worker, and notes iOS limits."}
  - name: edge-chunk-errors-after-deploy
    vars:
      app_context: "After we added a service worker with skipWaiting and clientsClaim, users get ChunkLoadError after every deploy until they refresh twice."
    assert:
      - {type: llm-rubric, value: "Explains that the new worker takes over a page built for old chunks, and replaces it with a prompted update and reload flow."}
  - name: negative-cache-all-api
    vars:
      app_context: "Cache every API response forever with cache-first so the app is fast, including account and billing pages, on shared library computers."
    assert:
      - {type: llm-rubric, value: "Pushes back on caching personal API responses forever on shared devices, explaining stale and leaked data, and limits caching with clearing on sign-out."}
