schema: 1
baseline: "Build a {{framework}} component: {{description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-user-list
    vars:
      framework: react
      styling: "CSS modules"
      description: "A list of team members fetched from an API. Each row shows avatar, name, role and a 'Remove' button. Emits onRemove(memberId)."
    assert:
      - {type: contains, value: "## API"}
      - {type: llm-rubric, value: "Implements loading, empty and error-with-retry states, uses real button elements with accessible names that include the member's name, takes text through props or i18n rather than hard-coding, and includes tests for each state."}
  - name: edge-screenshot-guessing
    vars:
      framework: vue
      styling: "match project"
      description: "[Screenshot] A pricing card with a plan name, price per month, a list of features with check icons and a highlighted 'Choose plan' button. The middle card has a 'Most popular' badge."
    assert:
      - {type: llm-rubric, value: "Separates what is read from the screenshot from what is guessed, maps colours to tokens instead of hard-coding hex values, and treats the check icons as decorative or labels them appropriately."}
  - name: negative-duplicate-component
    vars:
      framework: react
      styling: "match project"
      description: "A generic Button component with primary and secondary variants. Note: the repo already has src/components/Button.tsx with a 'variant' prop."
    assert:
      - {type: llm-rubric, value: "Notices the existing Button component and proposes reusing or extending it rather than creating a duplicate."}
