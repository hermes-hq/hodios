schema: 1
baseline: "Implement React Native navigation for: {{nav_spec}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shop-app
    vars:
      nav_spec: "Expo app with Expo Router. Onboarding and sign in, then tabs for Home, Search and Profile; product detail opens from Home and Search; settings as a modal; links like shop.example/p/123 open the product."
    assert:
      - {type: contains, value: "## Navigation tree"}
      - {type: llm-rubric, value: "Uses Expo Router route groups with auth gating that removes sign-in from history, a splash during session restore, typed routes, ids as params, modal at the root, deep link mapping for the product path including landing after sign-in, and tests for back behaviour."}
  - name: edge-back-to-login
    vars:
      nav_spec: "React Navigation app. After signing in, pressing Android back takes users back to the login screen."
    assert:
      - {type: llm-rubric, value: "Explains that navigate after sign-in keeps login in the stack and switches to conditional rendering of screen groups based on auth state."}
  - name: negative-pass-objects
    vars:
      nav_spec: "Pass the whole product object and an onSave callback function as route params to the detail screen."
    assert:
      - {type: llm-rubric, value: "Warns that functions and large objects as params break deep links and state persistence and go stale, and passes an id while sharing callbacks through state or context."}
