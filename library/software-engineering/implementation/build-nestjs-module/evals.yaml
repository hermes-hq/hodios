schema: 1
baseline: "Build a NestJS module for: {{feature_spec}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-teams-module
    vars:
      feature_spec: "Teams module using TypeORM. Admins create and rename teams; members list the teams they belong to; anyone else gets 404 for a team."
    assert:
      - {type: contains, value: "## Module"}
      - {type: llm-rubric, value: "Uses DTOs with class-validator under a whitelisting ValidationPipe, wires the repository with forFeature, scopes queries to membership in the service, uses a roles guard with Reflector, and writes e2e tests that apply the same global pipes as main.ts."}
  - name: edge-nested-dto
    vars:
      feature_spec: "Create an order with an array of line items in one request body."
    assert:
      - {type: llm-rubric, value: "Adds ValidateNested and Type decorators so the nested line items are actually validated, and tests an invalid nested item."}
  - name: negative-return-user-entity
    vars:
      feature_spec: "GET /users/:id should return the User entity exactly as stored, including passwordHash, so the admin panel can show it."
    assert:
      - {type: llm-rubric, value: "Refuses to return the password hash, explains the risk, and returns a response DTO or excluded field instead."}
