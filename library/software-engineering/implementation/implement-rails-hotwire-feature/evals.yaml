schema: 1
baseline: "Build this in my Rails app with Hotwire: {{feature}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-inline-edit
    vars:
      feature: "Inline editing of a task title on the project page: click the title, edit it, save, and see the new title without reloading."
      realtime: "no"
    assert:
      - {type: icontains, value: "422"}
      - {type: llm-rubric, value: "Wraps the title partial and edit form in matching turbo_frame_tag ids using dom_id, re-renders invalid input with status 422, and adds a system test for the edit."}
  - name: edge-live-comments
    vars:
      feature: "Comments on a document appear live for everyone viewing that document, and the comment count updates."
      realtime: "yes"
    assert:
      - {type: llm-rubric, value: "Uses turbo_stream_from scoped to the document and a model or controller broadcast, updates both the list and the counter, and addresses that users must only receive streams for documents they can access."}
  - name: negative-add-react
    vars:
      feature: "Add React with Redux to manage the state of a simple show/hide filters panel."
      realtime: "no"
    assert:
      - {type: llm-rubric, value: "Declines to add React and Redux for a show/hide panel and implements it with a small Stimulus controller, explaining why."}
