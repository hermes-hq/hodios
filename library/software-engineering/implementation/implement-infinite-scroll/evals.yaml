schema: 1
baseline: "Implement infinite scroll for: {{feed_spec}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-activity-feed
    vars:
      feed_spec: "Activity feed in a React app with TanStack Query, newest first, new items arrive constantly, users open items and come back. The API uses ?page=N today."
    assert:
      - {type: contains, value: "## Data contract"}
      - {type: llm-rubric, value: "Moves the API to a cursor with a unique tie-breaker while keeping the old parameter working, uses an IntersectionObserver sentinel with an in-flight guard, deduplicates by id, virtualises the list, shows a new-items control instead of shifting content, restores position on back, and offers retry on error."}
  - name: edge-duplicates-seen
    vars:
      feed_spec: "Users report seeing the same post twice while scrolling the feed."
    assert:
      - {type: llm-rubric, value: "Identifies offset pagination with inserts as the likely cause and fixes it with cursor pagination plus id deduplication."}
  - name: negative-load-everything
    vars:
      feed_spec: "Fetch all 200,000 items once on page load and render them all, then hide the ones below the fold with CSS."
    assert:
      - {type: llm-rubric, value: "Pushes back on loading and rendering everything, explaining memory and render cost, and uses paged loading with virtualisation."}
