schema: 1
baseline: "Build this Flutter screen: {{screen}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-riverpod-list
    vars:
      screen: "Workouts history list loaded from our API, newest first, with pull to refresh; tapping opens the workout detail route. The project uses Riverpod and go_router."
    assert:
      - {type: llm-rubric, value: "Uses Riverpod (not a new package) with an AsyncValue-style state, puts the API behind a repository interface, uses ListView.builder, handles empty and error with retry, and writes widget tests with a fake repository."}
  - name: edge-form-with-await
    vars:
      screen: "Edit profile form with name and bio; on save, call the API, then pop the screen and show a snackbar. The project uses Bloc."
    assert:
      - {type: llm-rubric, value: "Disposes the text controllers, checks context.mounted after the awaited save before popping or showing a snackbar, and implements the save state in a Bloc or Cubit with tests."}
  - name: negative-futurebuilder-in-build
    vars:
      screen: "Just use FutureBuilder(future: api.getItems()) in build and call http directly from the widget; also add GetX for state."
    assert:
      - {type: llm-rubric, value: "Explains that creating the future in build refetches on every rebuild and that calling http from the widget blocks testing, declines to add GetX alongside the existing approach, and uses a repository and the project's state layer."}
