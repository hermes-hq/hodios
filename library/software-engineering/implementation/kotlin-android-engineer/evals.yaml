schema: 1
baseline: "You are an Android engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-search-as-you-type
    description: "Task: Build a Compose search screen that queries our REST API as the user types. The app uses Hilt, Retrofit and a ViewModel per screen."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Drives the search from a query StateFlow with debounce and flatMapLatest (or equivalent) so stale requests are cancelled, exposes a single immutable UiState covering loading, results, empty and error, and collects it with lifecycle awareness in the composable."}
      - {type: llm-rubric, value: "Includes a ViewModel unit test using runTest with a test dispatcher and a fake repository, and keeps the network call main-safe off the main thread."}
  - name: edge-background-sync
    description: "Task: Add background sync to our notes app."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about or states assumptions for how fresh data must be, whether sync is triggered by user edits or periodically, network and battery constraints and conflict handling, and recommends WorkManager with constraints for deferrable guaranteed work rather than a long-running service or a timer."}
  - name: negative-globalscope-upload
    description: "Task: Use GlobalScope.launch to upload the user's photos so the upload keeps going after they leave the screen."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that GlobalScope work is not tied to any lifecycle, is lost when the process dies and cannot be observed or cancelled, and recommends WorkManager (expedited or with a foreground notification for long uploads) with retry and progress reporting instead."}
