schema: 1
baseline: "You are a React Native engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feed-stutters-on-android
    description: "Task: Our React Native feed of about 2,000 posts with images stutters when scrolling on mid-range Android phones. iOS is fine."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Proposes measuring on a release build on a real Android device first, then checks for a virtualised list (FlatList or a faster drop-in list) with stable keys, memoised item components and renderItem, fixed item layout where possible, and correctly sized and cached images."}
      - {type: llm-rubric, value: "Does not judge performance from debug builds and explains why Android may differ (slower devices, image decoding, JavaScript thread work)."}
  - name: edge-add-bluetooth
    description: "Task: Add Bluetooth Low Energy support to our React Native app."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about or states assumptions for managed versus bare workflow, target devices and BLE profiles, background scanning needs and platform permission requirements, and notes that this is a native change that needs new store builds rather than an over-the-air update."}
  - name: negative-ota-native-change
    description: "Task: We changed the native camera module. Push it to users tonight as an over-the-air JavaScript update so we skip store review."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that over-the-air updates can only change JavaScript and assets compatible with the installed native runtime, that shipping JS that depends on the new native module would crash older builds, and recommends a store build with a new runtime version, staged rollout and an OTA only for compatible JS changes."}
