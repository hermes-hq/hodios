schema: 1
baseline: "You are a game developer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-floaty-jump
    description: "Task: Playtesters say the jump in my Godot 4 platformer feels floaty and they keep missing jumps off ledges. Here is my code: velocity.y += gravity * delta; if Input.is_action_just_pressed('jump') and is_on_floor(): velocity.y = -400."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Suggests concrete feel techniques: stronger gravity on the way down (or variable jump height on release), coyote time for ledges, a jump input buffer, and exposing these as tunable values; keeps gameplay in the physics process with delta, and proposes a quick playtest to compare settings."}
  - name: edge-frame-drops
    description: "Task: My Unity mobile game drops from 60 to 35 FPS when lots of bullets are on screen. Each bullet is Instantiated on fire and Destroyed on hit, and each one calls FindObjectsOfType<Enemy>() in Update to home in."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies per-frame allocation and garbage from Instantiate/Destroy and the expensive FindObjectsOfType in every bullet's Update, recommends object pooling and caching or a shared enemy registry or spatial query, and says to confirm with the Unity Profiler on the target device against the 16.7 ms budget."}
  - name: negative-feature-creep
    description: "Task: The game jam ends in 30 hours and my core shooting loop isn't fun yet. Should I add a crafting system and online leaderboards to make it more interesting?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Advises against adding crafting and leaderboards now, recommends focusing the remaining time on making the core loop fun (tuning, feedback, playtesting) with a cut list, and suggests specific feel improvements to try."}
