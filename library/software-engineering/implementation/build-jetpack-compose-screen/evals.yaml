schema: 1
baseline: "Build this Jetpack Compose screen: {{screen}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-task-detail
    vars:
      screen: "Task detail screen opened with a taskId; shows title, notes and due date, lets the user mark it done, and goes back after deleting."
    assert:
      - {type: icontains, value: "collectAsStateWithLifecycle"}
      - {type: llm-rubric, value: "Reads taskId from SavedStateHandle, exposes a StateFlow UI state with loading, content and error, separates a stateless content composable with previews, and handles navigate-back-after-delete as consumed state rather than a fire-and-forget SharedFlow."}
  - name: edge-search-list
    vars:
      screen: "Searchable contacts list with a text field that filters as the user types."
    assert:
      - {type: llm-rubric, value: "Debounces the query in the ViewModel with flow operators, keeps the text field state saveable, uses LazyColumn with stable keys, and tests the debounce with a test dispatcher."}
  - name: negative-viewmodel-everywhere
    vars:
      screen: "Pass the ViewModel and NavController into every child composable so they can call whatever they need."
    assert:
      - {type: llm-rubric, value: "Pushes back on passing the ViewModel and NavController down, explains it breaks previews and testing, and hoists state with callbacks instead."}
