schema: 1
baseline: "Write enemy AI for my game in {{engine}}: {{behaviour_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stealth-guards
    vars:
      engine: "Unity 6 with NavMesh"
      behaviour_description: "Guards in a stealth game: patrol, get suspicious at noises or a glimpse, investigate, chase, give up and return. Up to 12 per level. Scary but beatable."
    assert:
      - {type: contains, value: "## Perception"}
      - {type: llm-rubric, value: "Uses a state machine or behaviour tree with patrol, suspicious, investigate, chase and return, perception with vision cone plus line-of-sight raycasts, hearing events and a decaying last-known-position memory, gradual suspicion rather than instant detection, throttled think rates for 12 agents, and debug gizmos."}
  - name: edge-life-sim-villagers
    vars:
      behaviour_description: "Villagers in a cosy life sim who choose between eating, working, socialising and sleeping depending on time of day and needs."
    assert:
      - {type: llm-rubric, value: "Chooses utility AI (or justifies another choice) with needs and response curves, adds some randomness or inertia so villagers do not oscillate between actions, and shows utility scores in a debug view."}
  - name: negative-perfect-aimbot
    vars:
      engine: "Godot 4"
      behaviour_description: "Enemies should always know where the player is and hit every shot so the game is hard."
    assert:
      - {type: llm-rubric, value: "Pushes back that omniscient perfect-aim enemies feel unfair, and offers difficulty through telegraphed attacks, accuracy curves, reaction delays and attack tokens instead, while still delivering a design."}
