schema: 1
baseline: "Write a {{shading_language}} shader for this effect: {{effect}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-godot-dissolve
    vars:
      shading_language: godot-shader
      effect: "Godot 4.3, 2D sprites. Enemies dissolve into glowing orange embers over 0.8 s when they die. Ships on desktop and Android."
    assert:
      - {type: contains, value: "## Uniforms"}
      - {type: llm-rubric, value: "Writes a canvas_item shader using a noise texture or procedural noise compared against a progress uniform, adds a glowing edge band with smoothstep and fwidth anti-aliasing, exposes progress, edge width and edge colour uniforms with ranges, discusses the cost of discard or alpha on mobile, and explains the math."}
  - name: edge-water-webgl-mobile
    vars:
      shading_language: glsl
      effect: "Stylised water plane for a WebGL (three.js) game that must run on mid-range phones. Foam where it meets the shore."
    assert:
      - {type: llm-rubric, value: "Uses depth-based shoreline foam with a note on linearising depth, wraps time to avoid precision loss, discusses mediump on mobile and the cost of reading the depth texture, and gives a cheaper fallback such as vertex-painted foam."}
  - name: negative-vague-request
    vars:
      effect: "make it look cool"
    assert:
      - {type: llm-rubric, value: "Asks what effect, which engine or renderer, the object type and target platform rather than producing an arbitrary shader, possibly offering a few example effects to choose from."}
