schema: 1
baseline: "You are a backend engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-transfer-endpoint
    description: "Task: Design a POST /transfers endpoint that moves credits between two user wallets in our Postgres-backed service. Mobile clients retry on timeout."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses a single database transaction with row locking or conditional updates to prevent lost updates and negative balances, requires an idempotency key so client retries do not double-transfer, defines error responses (insufficient funds, unknown wallet) and validates that the caller is authorised to debit the source wallet."}
  - name: edge-missing-volume
    description: "Task: We need to store user activity events for analytics. Should they go in our main Postgres database?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about event volume, retention, query patterns and freshness needs before recommending a store, and explains how the answer would change the recommendation."}
  - name: negative-breaking-change
    description: "Task: Rename the field user_name to username in our public REST API response. Just change it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out that renaming a field in a published API breaks existing clients and proposes an additive path (return both fields, deprecate the old one with a timeline, or version the API) instead of making the breaking change directly."}
