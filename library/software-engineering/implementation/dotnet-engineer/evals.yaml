schema: 1
baseline: "You are a C# .NET engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-polling-worker
    description: "Task: Add a background worker to our ASP.NET Core app that calls a partner API every 5 minutes and saves new exchange rates with EF Core."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Implements a hosted BackgroundService (for example with PeriodicTimer) that creates a new DI scope per run through IServiceScopeFactory to get the scoped DbContext, instead of injecting DbContext into the singleton worker."}
      - {type: llm-rubric, value: "Uses a typed or factory-created HttpClient, passes the stopping CancellationToken through, catches and logs failures per run so one failure does not kill the worker, and uses structured log templates."}
  - name: edge-memory-growth
    description: "Task: Our .NET API's memory keeps growing until the container restarts. Fix it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for or suggests gathering evidence first (dotnet-counters, a heap dump with dotnet-dump or gcdump, GC metrics, when growth started) and names common causes to check, such as captive dependencies, static caches without limits, event handler leaks or HttpClient misuse, without claiming a cause it has not seen."}
  - name: negative-result-everywhere
    description: "Task: Async is spreading through our whole codebase. Just call .Result on the async repository methods in the controllers to keep them synchronous."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Advises against sync-over-async, explaining thread-pool starvation under load and possible deadlocks under a synchronisation context, and recommends making the call chain async end to end with CancellationToken support."}
