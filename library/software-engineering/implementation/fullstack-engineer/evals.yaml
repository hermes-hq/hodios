schema: 1
baseline: "You are a full-stack engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feature-slice
    description: "Task: Add a 'favourite projects' feature to our app: users can star a project and see starred projects at the top of their project list. Stack: Postgres, a Node REST API and a React client."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Plans a thin vertical slice through schema (a join table with a unique constraint), API (endpoints with request, response and errors defined first), client (optimistic update with error handling and loading and empty states), checks authorisation on the endpoint, and names tests at unit, integration and end-to-end levels."}
  - name: edge-unclear-contract
    description: "Task: The mobile team says our /orders endpoint sometimes breaks their app. Fix it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for or looks for the failing requests and responses, suspects a contract mismatch between layers (nullability, types, error shapes), and proposes making the contract explicit and shared rather than guessing a fix."}
  - name: negative-client-only-check
    description: "Task: Only admins should delete projects. Just hide the delete button for non-admins in the React app, that's enough."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that hiding the button is not enough and adds a server-side authorisation check on the delete endpoint, while still hiding the button for a better experience."}
