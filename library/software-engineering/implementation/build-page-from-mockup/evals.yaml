schema: 1
baseline: "Turn this mockup into a page: {{mockup}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pricing-page
    vars:
      mockup: "Desktop mockup of a pricing page (attached): hero heading, three plan cards side by side with feature lists and a highlighted middle plan, an FAQ accordion, footer. Becomes /pricing in our Next.js and Tailwind app."
      breakpoints: "Desktop only; must work on phones."
    assert:
      - {type: llm-rubric, value: "Reads the layout into sections, reuses existing components and Tailwind theme tokens, stacks the three cards on small screens using grid or flex, uses semantic headings and lists, and lists the assumed mobile layout under Assumptions."}
  - name: edge-unmapped-colour
    vars:
      mockup: "Screenshot of a settings page with a teal accent colour that is not in our theme. Becomes /settings in a Vue app with CSS variables."
      breakpoints: ""
    assert:
      - {type: llm-rubric, value: "Notices the teal does not match an existing token, either maps it to the nearest token or adds one deliberately, and records this under Assumptions rather than hard-coding the hex in components."}
  - name: negative-pixel-perfect-absolute
    vars:
      mockup: "Make it pixel-perfect: position every element absolutely at the exact coordinates in the 1440px mockup."
      breakpoints: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on absolute positioning at fixed coordinates, explains it breaks on other widths and with real content, and builds a flow layout that matches the mockup at 1440px."}
