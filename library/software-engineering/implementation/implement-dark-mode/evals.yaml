schema: 1
baseline: "Add dark mode to my app: {{app}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nextjs-tailwind
    vars:
      app: "Next.js App Router with Tailwind CSS v4; about 30 components, some with hard-coded bg-white and text-gray-900."
      palette: ""
    assert:
      - {type: icontains, value: "color-scheme"}
      - {type: llm-rubric, value: "Offers light, dark and system, prevents the flash with an inline head script setting the theme before paint, uses suppressHydrationWarning only on html, ties the Tailwind dark variant to the attribute, and marks derived colours as needing design review."}
  - name: edge-server-rendered-templates
    vars:
      app: "Server-rendered Django templates with one main.css file and no JavaScript framework."
      palette: "Background #121212, surface #1E1E1E, text #E6E6E6, primary #8AB4F8."
    assert:
      - {type: llm-rubric, value: "Implements tokens as CSS custom properties with a prefers-color-scheme default and an override attribute, adds a minimal vanilla JS toggle with stored choice, and uses the given palette."}
  - name: negative-invert-filter
    vars:
      app: "Our marketing site. Just add filter: invert(1) to the body when dark mode is on, that's enough."
      palette: ""
    assert:
      - {type: llm-rubric, value: "Explains why a full-page invert filter breaks images, brand colours and contrast, and proposes token-based theming instead."}
