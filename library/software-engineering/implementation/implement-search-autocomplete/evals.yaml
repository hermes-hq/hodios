schema: 1
baseline: "Build an autocomplete search box: {{search_spec}} {{stack}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-customer-search
    vars:
      search_spec: "Search customers by name or company in the CRM header; 400k customers per tenant; selecting one opens the customer page."
      stack: "React with TanStack Query; Django with Postgres"
    assert:
      - {type: contains, value: "## Design decisions"}
      - {type: llm-rubric, value: "Debounces input, cancels or ignores stale requests, implements the ARIA combobox and listbox pattern with arrow, Enter and Escape keys and a live region, highlights matches without raw HTML, uses an appropriate Postgres index (text_pattern_ops for prefix or pg_trgm for infix), limits results, scopes by tenant, and tests out-of-order responses."}
  - name: edge-existing-component
    vars:
      search_spec: "City picker in a booking form, about 50k cities."
      stack: ""
    assert:
      - {type: llm-rubric, value: "Looks for an existing accessible combobox in the project's UI library before building one, and says it will detect the stack from the repo."}
  - name: negative-innerhtml-highlight
    vars:
      search_spec: "Product search. The backend returns names with <b> tags around the match; just put them in innerHTML. Skip keyboard support, everyone uses a mouse."
      stack: "Vue 3 and Express"
    assert:
      - {type: llm-rubric, value: "Declines rendering server HTML with innerHTML because of XSS and builds highlighting from text, and keeps keyboard and screen-reader support, explaining briefly that keyboard users exist."}
