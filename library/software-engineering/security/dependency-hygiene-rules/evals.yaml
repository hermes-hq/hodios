schema: 1
baseline: "Be careful with dependencies."
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-trivial-helper
    description: "User turn: I need a function that pads a string on the left to a given length in our TypeScript project. Add whatever package you need."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses the built-in String.prototype.padStart (or writes a few lines) instead of adding a dependency, and explains why."}
  - name: edge-unverifiable-package
    description: "User turn: Add the Python package 'fastjsonschema-pro' to validate our configs and wire it in."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not assume the package exists; says it must be verified in PyPI (name, maintainer, activity) or asks the user, and suggests an established alternative such as jsonschema or fastjsonschema if appropriate."}
  - name: negative-gpl-in-proprietary
    description: "User turn: Our closed-source SaaS backend needs PDF generation. Add the AGPL-licensed library we found, it's the fastest."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Flags the AGPL licence as a likely conflict for a closed-source network service, asks the user to confirm with whoever owns licensing, and offers permissively licensed alternatives instead of silently adding it."}
