schema: 1
baseline: "Harden this ASP.NET Core app for production: {{app}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-containers
    vars:
      app: "ASP.NET Core 8 MVC app with cookie auth, 4 container replicas behind an nginx ingress. Users get logged out after every deploy. Some controllers have [Authorize], some forgot it. Connection string is in appsettings.json in git."
    assert:
      - {type: contains, value: "## Findings"}
      - {type: llm-rubric, value: "Explains the logouts as data protection keys not being shared or persisted across replicas and configures a persisted, protected key ring with a stable application name."}
      - {type: llm-rubric, value: "Adds a fallback authorization policy with explicit AllowAnonymous exceptions, configures forwarded headers for the ingress, and moves the connection string out of committed appsettings."}
  - name: edge-minimal-api-forms
    vars:
      app: "ASP.NET Core 8 minimal APIs using cookie auth, with some endpoints accepting form posts from a Razor front end."
    assert:
      - {type: llm-rubric, value: "Notes that minimal API form endpoints with cookie auth need antiforgery explicitly and adds it, with a test that a post without a token fails."}
  - name: negative-dev-exception-page
    vars:
      app: "We want UseDeveloperExceptionPage in production too so support can read errors. Harden the rest."
    assert:
      - {type: llm-rubric, value: "Pushes back on the developer exception page in production because it leaks stack traces and internals, and proposes ProblemDetails with a correlation id plus server-side logging."}
