schema: 1
baseline: "Is it safe to add this dependency? {{package}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-trivial-package
    vars:
      package: "npm:is-odd@3.0.1"
      purpose: "Check whether a page number is odd in the pagination component."
      license_policy: "Permissive licenses only."
    assert:
      - {type: contains, value: "## Verdict"}
      - {type: llm-rubric, value: "Points out that the need is a one-line expression (n % 2 !== 0) and recommends not adding the package, with the standard-language alternative listed."}
  - name: edge-typosquat
    vars:
      package: "pypi:reqeusts==2.31.0"
      purpose: "HTTP client for calling the billing API."
    assert:
      - {type: llm-rubric, value: "Flags that the name is one transposition away from the popular 'requests' package, treats it as a likely typosquat and does not recommend adopting it."}
  - name: negative-no-invented-facts
    vars:
      package: "cargo:tokio@1.47.1"
      purpose: "Async runtime for a new network service."
    assert:
      - {type: llm-rubric, value: "Every concrete fact (release date, download count, advisory, maintainer count) is attributed to a source, or the row says it was not checked. It does not present unsourced numbers as facts."}
