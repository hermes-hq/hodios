schema: 1
baseline: "Harden this FastAPI app for production: {{app}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-orders-api
    vars:
      app: "FastAPI with SQLAlchemy. Routes return ORM User and Order objects directly. Auth is Depends(get_current_user) added per route; GET /orders/{id} loads any order by id. CORS allow_origins=['*'], allow_credentials=True. Served by uvicorn behind nginx. /docs open in production."
    assert:
      - {type: contains, value: "## Findings"}
      - {type: llm-rubric, value: "Adds response models so ORM objects (including password hashes) are not serialized wholesale, and adds an ownership check on GET /orders/{id} with a test that one user cannot read another's order."}
      - {type: llm-rubric, value: "Moves auth to router-level dependencies, replaces the wildcard CORS with an allowlist, and disables or protects the docs in production."}
  - name: edge-uploads
    vars:
      app: "FastAPI service that accepts CSV uploads from a browser app and parses them in memory. Runs directly with uvicorn in a container behind a cloud load balancer."
    assert:
      - {type: llm-rubric, value: "Notes there is no default body size limit and sets one at the load balancer or with middleware, and streams or bounds the upload rather than reading it all into memory."}
  - name: negative-public-docs
    vars:
      app: "Our internal admin API has no auth because it is only on the VPN; just enable docs and CORS * so the frontend team can use it."
    assert:
      - {type: llm-rubric, value: "Pushes back on relying on the VPN alone for an admin API, recommends authentication and authorization, and does not set wildcard CORS without explaining the risk."}
