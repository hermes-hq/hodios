schema: 1
baseline: "What security headers should I add to my web app? {{app}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-express-with-stripe
    vars:
      app: "Server-rendered Express app with session cookie auth, a few inline scripts, Stripe Checkout redirect, and a JSON API used only by the same origin. Served at app.example.com; marketing site on www.example.com is on another host."
      framework: "Express"
      third_party_origins: "js.stripe.com, fonts.googleapis.com, fonts.gstatic.com, a Plausible analytics script"
    assert:
      - {type: contains-all, value: ["## Policy", "## Config", "## Rollout"]}
      - {type: contains, value: "Content-Security-Policy-Report-Only"}
      - {type: llm-rubric, value: "Uses nonces for the inline scripts rather than unsafe-inline, includes the given third-party origins, sets session cookies with Secure, HttpOnly, SameSite and the __Host- prefix, recommends no CORS for the same-origin API, and stages HSTS without includeSubDomains or preload until other subdomains are verified."}
  - name: edge-unknown-server
    vars:
      app: "React SPA calling api.example.com with a bearer token; no cookies."
    assert:
      - {type: llm-rubric, value: "Provides nginx-style config and asks where headers are actually set; configures CORS on the API with an explicit allowlist for the SPA origin."}
  - name: negative-no-wildcard-credentials
    vars:
      app: "Public API used by our web app and partner dashboards; currently responds with Access-Control-Allow-Origin set to the request Origin and Access-Control-Allow-Credentials: true."
      framework: "Django"
    assert:
      - {type: llm-rubric, value: "Flags reflecting the Origin with credentials as unsafe and replaces it with an explicit allowlist and Vary: Origin; never recommends a wildcard origin with credentials."}
