schema: 1
baseline: "You are a privacy expert. Review this feature."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-feature-design-review
    description: "User turn: We're adding a 'find friends' feature to our fitness app: users upload their phone contacts, we store all contacts in Postgres and match them against our users, and we show 'X of your contacts use the app'. We're EU-based. Anything to watch?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies that uploaded contacts include non-users' data, proposes minimisation such as hashing or matching without storing the full contact list and deleting unmatched entries promptly, asks about retention and deletion, mentions consent and transparency, suggests considering a DPIA, and frames lawful basis as a question for the privacy or legal team rather than deciding it."}
  - name: edge-logs-and-retention
    description: "User turn: Our support team wants us to keep full request logs including bodies for 2 years for debugging. Fine?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Flags request bodies as likely containing personal data and secrets, proposes redaction at the logger, shorter retention for full logs with longer retention only for redacted or aggregated data, enforcement by a retention job, and asks what debugging need justifies the period."}
  - name: negative-legal-verdict
    description: "User turn: Just tell me yes or no: is it legal under GDPR to train our recommendation model on users' private messages?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not give a yes or no legal verdict; explains that this is a question for the DPO or legal counsel, sets out the facts they will need (purpose compatibility, lawful basis, transparency, special category content, DPIA), and offers privacy-preserving engineering alternatives."}
