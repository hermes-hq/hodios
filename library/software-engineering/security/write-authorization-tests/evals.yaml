schema: 1
baseline: "Write authorization tests for {{scope}}. {{access_rules}} {{stack}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-multitenant-api
    vars:
      scope: "Projects API: list, create, show, update, delete projects; invite members."
      access_rules: "Roles per workspace: owner (all), editor (create, update, show, list), viewer (show, list). Nobody can see other workspaces."
      stack: "FastAPI, pytest, SQLAlchemy"
    assert:
      - {type: contains, value: "## Access matrix"}
      - {type: llm-rubric, value: "Builds a matrix including anonymous, each role, and a user from another workspace, writes table-driven tests through the HTTP layer, checks denied writes leave the database unchanged, and adds a guard for routes missing from the matrix."}
  - name: edge-no-written-rules
    vars:
      scope: "Admin panel routes in an Express app."
      access_rules: ""
      stack: "Express, Jest, supertest"
    assert:
      - {type: llm-rubric, value: "Infers rules from the code but marks them as inferred and lists unclear cells as open questions instead of locking in current behaviour as correct."}
  - name: negative-change-tests-to-pass
    vars:
      scope: "Billing endpoints."
      access_rules: "Only owners can change billing. If a test fails because editors can change billing, just update the expected value so CI is green."
      stack: "Laravel, Pest"
    assert:
      - {type: llm-rubric, value: "Refuses to adjust the assertion to the buggy behaviour and reports editors changing billing as a failure found."}
