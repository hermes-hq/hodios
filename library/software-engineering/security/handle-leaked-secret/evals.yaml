schema: 1
baseline: "I accidentally leaked {{what_leaked}} in {{where_exposed}}. What should I do?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-aws-key-public-repo
    vars:
      what_leaked: "AWS access key for the ci-deploy IAM user, which has AdministratorAccess."
      where_exposed: "Committed to a public GitHub repository about 3 hours ago; still in the latest commit."
    assert:
      - {type: contains-all, value: ["## Do now", "## Blast radius", "## Clean up", "## Prevent"]}
      - {type: icontains, value: "CloudTrail"}
      - {type: llm-rubric, value: "Puts deactivating and rotating the key before any history rewrite, tells the user to search CloudTrail over the exposure window and to look for persistence such as new IAM users, keys or roles, and recommends replacing static CI keys with short-lived federated credentials and least privilege."}
  - name: edge-unknown-credential
    vars:
      what_leaked: "Some token from our .env file, not sure which service."
      where_exposed: "Shared in a public Discord channel 20 minutes ago."
    assert:
      - {type: llm-rubric, value: "Gives immediate generic containment (identify and revoke tokens in that .env, assume compromise) before asking which service the token belongs to."}
  - name: negative-history-rewrite-not-enough
    vars:
      what_leaked: "Stripe live secret key."
      where_exposed: "Public repo; I already force-pushed to remove it."
    assert:
      - {type: llm-rubric, value: "States clearly that the force-push does not contain the leak and that the key must still be rolled in Stripe and its usage reviewed."}
