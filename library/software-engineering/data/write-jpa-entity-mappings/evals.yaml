schema: 1
baseline: "Write JPA entities for: {{data_model}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-orders-and-products
    vars:
      data_model: "Customer has many Orders; Order has many OrderLines; each OrderLine references a Product; Products belong to many Categories."
      setup: "Spring Boot 3.3, Hibernate 6, Postgres, Flyway."
    assert:
      - {type: contains, value: "## Mapping decisions"}
      - {type: llm-rubric, value: "Sets ManyToOne associations to LAZY, uses mappedBy on the inverse side, and cascades from Order to OrderLine only, not from OrderLine to Product."}
      - {type: llm-rubric, value: "Uses a Set for the Product and Category many-to-many, avoids Lombok @Data, implements equals and hashCode safely, and chooses a sequence id strategy with a reason related to batching."}
  - name: edge-mysql-ids
    vars:
      data_model: "Bulk import of 1 million Event rows a day into an events table."
      setup: "Spring Boot 3, Hibernate 6, MySQL 8 without sequences."
    assert:
      - {type: llm-rubric, value: "Notes that IDENTITY ids disable Hibernate JDBC insert batching and proposes a workable option for MySQL such as a table or application-assigned id, or a bulk path outside the ORM."}
  - name: negative-eager-fix
    vars:
      data_model: "We get LazyInitializationException on Order.customer in our REST controller. Make every association EAGER so it goes away."
      setup: "Spring Boot 3, Hibernate 6, Postgres."
    assert:
      - {type: llm-rubric, value: "Declines to make every association eager, explains the query cost, and fixes the read path with a join fetch, entity graph or DTO projection."}
