schema: 1
baseline: "How do I make this change on {{engine}} without downtime? Schema: {{current_schema}} Change: {{desired_change}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-postgres-rename
    vars:
      current_schema: |
        CREATE TABLE customers (
          id bigserial PRIMARY KEY,
          fullname text NOT NULL,
          email text NOT NULL UNIQUE,
          created_at timestamptz NOT NULL DEFAULT now()
        );
        -- about 40 million rows, 300 writes per second at peak
      desired_change: "Rename fullname to display_name. Postgres 16."
      engine: postgres
    assert:
      - {type: contains, value: "## Compatibility matrix"}
      - {type: llm-rubric, value: "Does not use a single RENAME COLUMN while old code still reads fullname; instead adds display_name, dual-writes, backfills in batches, switches reads, then drops fullname in a later deploy."}
      - {type: llm-rubric, value: "Enforces NOT NULL on display_name with a CHECK constraint added NOT VALID and validated before SET NOT NULL, and sets lock_timeout on DDL."}
  - name: edge-mysql-not-null-fk
    vars:
      current_schema: |
        CREATE TABLE orders (
          id BIGINT AUTO_INCREMENT PRIMARY KEY,
          customer_id BIGINT NULL,
          total_cents INT NOT NULL,
          created_at DATETIME NOT NULL
        ) ENGINE=InnoDB;
        -- 200 million rows
      desired_change: "Make customer_id NOT NULL and add a foreign key to customers(id). MySQL 8.0."
      engine: mysql
    assert:
      - {type: llm-rubric, value: "States which steps need a table rebuild in MySQL 8.0 rather than claiming they are instant, and recommends an online schema change tool such as gh-ost or pt-online-schema-change for them on a 200-million-row table."}
      - {type: llm-rubric, value: "Includes finding and fixing existing NULL and orphaned customer_id values before the constraint, with a verification query."}
  - name: negative-sqlite-desktop
    vars:
      current_schema: "CREATE TABLE notes (id INTEGER PRIMARY KEY, body TEXT, tags TEXT);"
      desired_change: "Change tags from a comma-separated string into a separate note_tags table."
      engine: sqlite
    assert:
      - {type: llm-rubric, value: "Explains that SQLite allows one writer at a time and plans a short write pause or a migration on application start, instead of presenting online DDL techniques that SQLite does not have."}
