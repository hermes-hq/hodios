schema: 1
baseline: "Turn this spreadsheet into a database: {{sheet_description}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-orders-sheet
    vars:
      database: recommend
      users: "Three shop staff enter orders on laptops; the owner wants monthly sales by product and a list of unpaid orders. Nobody codes; a freelance developer helps a few hours a month."
      sheet_description: |
        One tab "Orders", 2,300 rows. Columns: Date (mix of 03/04/2025 and 2025-04-03 and "April 3"), Customer, Email, Phone, Address, Item 1, Qty 1, Price 1, Item 2, Qty 2, Price 2, Item 3, Qty 3, Price 3, Total (typed by hand), Paid? (yes / y / Y / blank), Notes. Unpaid orders are highlighted yellow. Some customers appear with different spellings.
    assert:
      - {type: contains, value: "## Cleaning rules"}
      - {type: llm-rubric, value: "Separates customers, orders, order lines and products with keys; replaces Item 1..3 columns with an order_lines table; computes totals by query and reconciles them against the typed Total; treats the yellow highlight as a payment status to capture; gives rules for mixed date formats, Paid? values and duplicate customer spellings with a rejects list; writes an idempotent import script that prints counts; and recommends something the non-coding staff can enter data into (forms or a low-code tool) with backups."}
  - name: edge-personal-data-sample
    vars:
      database: "Postgres"
      sheet_description: "Members tab: Name, Email, Date of birth, Medical notes, Membership type, Joined. Sample: Jane Example, jane@example.org, 1980-02-01, asthma inhaler, Family, 2019."
    assert:
      - {type: llm-rubric, value: "Does not repeat the sample personal or medical details in the output, uses placeholders, and includes access control, minimising sensitive fields such as medical notes, and backups in the plan."}
  - name: negative-no-columns
    vars:
      database: recommend
      sheet_description: "Our inventory spreadsheet is a mess, put it in a database."
    assert:
      - {type: llm-rubric, value: "Asks for tabs, column headers, sample rows and what the sheet is used for before designing, and does not invent a schema presented as theirs."}
