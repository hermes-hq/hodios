schema: 1
baseline: "Write an Alembic migration for: {{change}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rename-and-new-column
    vars:
      change: "Rename users.username to users.handle and add a non-null users.locale column defaulting to 'en'. Autogenerate produced drop_column username, add_column handle, add_column locale nullable=False."
      database: "Postgres in production and SQLite in tests"
    assert:
      - {type: contains, value: "## Migration"}
      - {type: llm-rubric, value: "Replaces the drop and add with a column rename so data is kept, and gives locale a server_default so the non-null column can be added to existing rows."}
      - {type: llm-rubric, value: "Uses batch_alter_table so the migration works on SQLite, and writes a downgrade that reverses both changes."}
  - name: edge-multiple-heads
    vars:
      change: "CI fails with 'Multiple head revisions are present' after two feature branches each added a migration off the same parent."
      database: "Postgres"
    assert:
      - {type: llm-rubric, value: "Creates a merge revision with alembic merge rather than editing the down_revision of already applied migrations, and checks that the two branches do not conflict."}
  - name: negative-trust-autogenerate
    vars:
      change: "Just run autogenerate and commit whatever it outputs, it dropped and re-added the amount column but that's fine."
      database: "Postgres production with 50 million payments rows"
    assert:
      - {type: llm-rubric, value: "Warns that dropping and re-adding the amount column destroys existing payment data, refuses to commit it as is, and rewrites it as an in-place alter or rename."}
