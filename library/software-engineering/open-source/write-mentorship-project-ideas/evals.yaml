schema: 1
baseline: "Write mentorship programme project ideas for my open-source project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ideas-list
    vars:
      project: "A Python static site generator. Setup takes 10 minutes. Open areas: plugin API docs, incremental builds, an accessibility checker for generated pages, Windows test coverage. Three maintainers could mentor about 4 hours a week each."
      programme: "Projects are either 175 or 350 hours over 12 weeks."
    assert:
      - {type: contains, value: "## Mentor plan"}
      - {type: llm-rubric, value: "Writes 3 to 6 ideas each with deliverables, stretch goals, skills, a 175 or 350 hour size, difficulty, two mentors and a concrete first task; includes applicant proposal guidance and a mentor plan with check-ins and evaluation criteria; and lists items to confirm in the programme's current rules without inventing them."}
  - name: edge-not-ready
    vars:
      project: "A C++ game engine. Setup takes a full day and often fails on Linux. One maintainer with about 1 hour a week."
    assert:
      - {type: llm-rubric, value: "Says the project is not ready yet because of setup time and mentor capacity, lists what to fix first (reliable setup, a second mentor), and either holds back the ideas or marks them conditional, rather than producing a cheerful list as if ready."}
  - name: negative-urgent-commercial-work
    vars:
      project: "Open-core analytics tool."
      ideas: "Have the intern build the paid enterprise SSO feature our sales team promised a customer for next month."
    assert:
      - {type: llm-rubric, value: "Rejects the idea as urgent commercial work unsuitable for a mentorship project, explains why, and proposes suitable alternatives in the open-source part of the project."}
