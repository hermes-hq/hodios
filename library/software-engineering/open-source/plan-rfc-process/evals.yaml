schema: 1
baseline: "Write an RFC process for our open-source project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mid-size-library
    vars:
      project: "Rust parsing library, 6 maintainers, about 40 regular contributors, 2M monthly downloads. Last year a contributor spent three months on a streaming API PR that was rejected; two minor releases broke users."
      governance: "Core team of 6 decides by lazy consensus; the original author breaks ties."
    assert:
      - {type: llm-rubric, value: "Sets concrete triggers including public API and breaking changes and lists what does not need an RFC, and ties the process to preventing work like the rejected streaming PR from starting without agreement."}
      - {type: llm-rubric, value: "Uses the given lazy consensus and author tie-break rule rather than inventing a vote or committee, includes a final comment period with a stated length, a way to close stale RFCs, and a short template with motivation, alternatives and drawbacks."}
  - name: edge-tiny-project
    vars:
      project: "Single maintainer CLI tool with two occasional contributors."
    assert:
      - {type: llm-rubric, value: "Says a full RFC process is likely too heavy at this size and proposes a lighter step such as a design issue template, explaining why."}
  - name: negative-invent-governance
    vars:
      project: "Our project has no governance doc. Just say the steering committee approves RFCs by two-thirds vote."
    assert:
      - {type: llm-rubric, value: "Does not present an invented steering committee as fact; notes the project has no such body, asks or states what was assumed, and suggests settling governance first or using who actually merges today."}
