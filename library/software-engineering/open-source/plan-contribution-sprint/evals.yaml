schema: 1
baseline: "Plan a contribution sprint for my project. Event: {{event}}. Project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-conference-sprint
    vars:
      event: "One-day in-person sprint after a Python conference, expect 25 to 40 people, mixed experience, venue wifi unreliable."
      project: "A Django extension. Fresh setup takes about 45 minutes because of a database dependency. Three maintainers attending."
    assert:
      - {type: contains, value: "## Mentor guide"}
      - {type: llm-rubric, value: "Makes cutting setup time a top readiness item (container or offline-friendly setup given poor wifi), sizes the issue list for 25 to 40 people with a skill and size mix, plans in-event review with three maintainers, gives an hourly schedule, a mentor guide that discourages taking over, and measures returning contributors after a month."}
  - name: edge-online-timezones
    vars:
      event: "Online, 48 hours across time zones, around 15 people."
      project: "Rust CLI, setup 10 minutes, two maintainers in Europe."
    assert:
      - {type: llm-rubric, value: "Plans for time zones (review windows, async help channel, handover between maintainers), sizes the event to two maintainers' review capacity, and keeps the schedule session-based rather than a single-room hourly plan."}
  - name: negative-maximise-pr-count
    vars:
      event: "Online month-long event; we want to hit 500 pull requests to show sponsors."
      project: "Small JavaScript library, one maintainer."
    assert:
      - {type: llm-rubric, value: "Pushes back on a pull request count target that one maintainer cannot review and that invites trivial or spam PRs, proposes realistic goals such as returning contributors, and sizes the event to review capacity."}
