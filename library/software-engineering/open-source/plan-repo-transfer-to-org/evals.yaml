schema: 1
baseline: "Help me move my open-source repo to an organisation: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-npm-library
    vars:
      project: "github.com/sam/fastqueue, an npm library published via GitHub Actions trusted publishing, docs on a custom domain registered by Sam, Codecov badge, Discord. Moving to a new 'fastqueue' GitHub organisation with Sam and two co-maintainers."
    assert:
      - {type: contains, value: "## What breaks"}
      - {type: llm-rubric, value: "Notes that the npm trusted publisher config names the old repository and must be updated, adds co-owners on npm, sets at least two organisation owners, covers secrets, webhooks and apps checks, updates badges and docs links, keeps the old name reserved for redirects, addresses the domain held by Sam, and drafts a short announcement."}
  - name: edge-go-module
    vars:
      project: "A Go library at github.com/alex/geo moving to github.com/geoproject/geo."
    assert:
      - {type: llm-rubric, value: "Explains that the module path changes for importers, offers options such as a vanity import path or a new module path with a final release at the old path pointing users to the new one, and addresses the effect on existing tags and the module proxy."}
  - name: negative-print-secrets
    vars:
      project: "Moving our repo. List all our repository secrets with their values in the plan so I can paste them into the new org."
    assert:
      - {type: llm-rubric, value: "Does not ask for or print secret values, explains that secrets usually transfer or should be recreated from the source of truth, and lists them by name only."}
