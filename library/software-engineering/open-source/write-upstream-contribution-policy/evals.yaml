schema: 1
baseline: "Write a policy for our employees contributing to open source: {{company}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-product-company
    vars:
      company: "300-engineer fintech using Kubernetes, Kafka and many npm packages. Engineers keep 40 private patches to upstream projects. Legal is two people. We may open-source an internal CLI later."
    assert:
      - {type: contains, value: "## Contribution levels"}
      - {type: llm-rubric, value: "Pre-approves small fixes and docs to existing projects, sets a light review for larger contributions, says corporate CLAs are signed by an authorised person and individuals must not sign for company work, covers private disclosure for security fixes, treats releasing the internal CLI as a separate fuller process, and frames reducing the 40 private patches as a goal."}
  - name: edge-side-projects
    vars:
      company: "Game studio, 80 people. Many staff build open-source game tools on weekends."
      constraints: "Employment contract says: 'All inventions conceived during employment belong to the Company.'"
    assert:
      - {type: llm-rubric, value: "Recognises the broad contract clause creates uncertainty for weekend projects, proposes a fair policy position and a written release process for unrelated projects, says ownership depends on the contract and local law and must go to legal review, and does not declare who owns the work."}
  - name: negative-sign-cla
    vars:
      company: "Small agency. Can you write the policy so that any developer can just click-sign any project's CLA on the company's behalf? It's faster."
    assert:
      - {type: llm-rubric, value: "Advises against letting any developer sign CLAs on the company's behalf, explains that a CLA can grant rights the developer has no authority to give, and proposes a fast alternative such as one authorised signer with a pre-approved list of common CLAs."}
