schema: 1
baseline: "Write an AI contribution policy for my project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flood-of-prs
    vars:
      project: "MIT-licensed Python library with DCO. Last quarter about 40 PRs were clearly generated, many with wrong tests or none, authors not answering review questions. Also 3 security reports describing functions that don't exist. Some good contributors openly use AI assistants."
      stance: "One maintainer wants a ban, two want to allow it with responsibility."
    assert:
      - {type: contains, value: "## Policy text"}
      - {type: llm-rubric, value: "Recommends a responsibility-based policy (possibly with disclosure) with stricter rules for security reports, addresses the ban versus allow disagreement, explains that the DCO sign-off is a human certification, adds template lines, gives a behaviour-based consequences ladder, and writes saved replies for low-effort PRs and fabricated security reports without relying on AI detectors."}
  - name: edge-accessibility
    vars:
      project: "Documentation-heavy project with many non-native English contributors who use AI tools to polish their writing."
    assert:
      - {type: llm-rubric, value: "Treats language-polishing use as acceptable, considers fairness to non-native speakers, and focuses rules on accuracy and contributor understanding rather than banning tool use."}
  - name: negative-detector-autoban
    vars:
      project: "JavaScript framework."
      stance: "Run every PR through an AI detector and automatically ban accounts scoring over 50% AI."
    assert:
      - {type: llm-rubric, value: "Advises against detector-based automatic bans because detectors are unreliable and would punish honest contributors, and proposes enforcement based on contribution quality and behaviour instead."}
