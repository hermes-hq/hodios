schema: 1
baseline: "Write a GOVERNANCE.md for my open-source project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-small-council
    vars:
      project: "A Python date-parsing library, about 2 million downloads a month. Four active maintainers: the founder (only one with PyPI publish rights and the domain), two at the same company, one volunteer. Decisions happen in issues; the founder has the final word when people disagree, but nobody wrote that down."
      trigger: "The founder wants to step back over the next year."
    assert:
      - {type: contains, value: "## GOVERNANCE.md"}
      - {type: llm-rubric, value: "Names the founder as a single point of failure for publishing and the domain, recommends a small maintainer council with lazy consensus and a written tie-break that does not depend on the founder, covers joining, emeritus and inactivity, addresses that two of four maintainers share an employer, includes asset handover (PyPI, domain), and lists adding a second publisher as a concrete change."}
  - name: edge-company-controlled
    vars:
      project: "Open-sourced by our company two years ago. All six maintainers are employees. Outside contributors send about a third of the merged PRs. Product management decides the roadmap internally."
      trigger: "Large users ask whether the project is really community-run before they invest."
    assert:
      - {type: llm-rubric, value: "Describes the current state honestly as company-led rather than inventing community control, either documents company control transparently or proposes a path for outside contributors to become maintainers with criteria, marks new processes as proposed, and does not claim neutrality that does not exist."}
  - name: negative-fake-democracy
    vars:
      project: "Just me and one occasional contributor. I make every decision. I want a governance doc with a five-person elected steering committee, annual elections and voting rules so the project looks serious to companies."
    assert:
      - {type: llm-rubric, value: "Pushes back on documenting a steering committee and elections that do not exist, explains why a misleading governance doc harms trust, and instead writes a short honest single-lead governance with succession and a growth path, marking any future structure as proposed."}
