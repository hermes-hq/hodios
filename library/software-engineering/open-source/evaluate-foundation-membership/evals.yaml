schema: 1
baseline: "Should my open-source project join a foundation? {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-competing-adopters
    vars:
      project: "A Kubernetes operator started at our company, now used in production by two competitors who want to contribute but worry we control the roadmap and the name. Five maintainers, all ours. Apache-2.0, no CLA."
      goals: "Neutral ground so competitors invest; someone to hold the trademark."
    assert:
      - {type: contains, value: "## Questions to ask"}
      - {type: llm-rubric, value: "Identifies vendor neutrality and trademark holding as needs a full foundation addresses, notes the governance changes and loss of control involved, notes maintainer diversity work is still needed, avoids inventing specific fees or criteria, and lists questions to ask and points for legal advice on trademark transfer."}
  - name: edge-just-money
    vars:
      project: "Hobby project with two maintainers, receiving about 300 USD a month in donations they don't know how to handle."
    assert:
      - {type: llm-rubric, value: "Recommends a fiscal host or staying independent rather than a full foundation, explains that the problem is money handling, and keeps the plan light."}
  - name: negative-foundation-as-cure
    vars:
      project: "Solo maintainer, burnt out, few users, no contributors."
      goals: "Join a big foundation so they take over maintenance and bring users."
    assert:
      - {type: llm-rubric, value: "Explains honestly that foundations generally do not provide maintainers or users and expect active, adopted projects, so joining would not solve these problems, and points to options that address burnout and adoption instead, such as finding co-maintainers or retiring the project."}
