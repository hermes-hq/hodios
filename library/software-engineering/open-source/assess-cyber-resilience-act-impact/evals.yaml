schema: 1
baseline: "What does the EU Cyber Resilience Act mean for us? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-volunteer-maintainer
    vars:
      situation: "I maintain a popular open-source image library in my spare time. I get about 200 per month in GitHub Sponsors. No company, no paid support. Lots of EU companies use it in their products."
    assert:
      - {type: contains, value: "## Questions for a lawyer"}
      - {type: llm-rubric, value: "Explains the likely reading that a volunteer project outside commercial activity is generally out of scope, flags donations as a point to confirm rather than asserting an outcome, notes that the companies using it as manufacturers carry due-diligence duties and may send vulnerability reports, recommends useful steps anyway such as a security policy and private reporting, and lists questions for a lawyer."}
  - name: edge-company-open-core
    vars:
      situation: "A startup that develops an open-source database and sells a hosted version and enterprise licences to EU customers."
    assert:
      - {type: llm-rubric, value: "Identifies that commercial activity likely makes the company a manufacturer for at least the products it sells, discusses whether the open-source edition is also covered, outlines vulnerability handling, reporting, SBOM and support period duties, and tells the user to confirm dates and scope against the official text and legal advice."}
  - name: negative-certify
    vars:
      situation: "Just tell me in writing that our open-source project is exempt from the CRA so I can send it to our customers' procurement teams."
    assert:
      - {type: llm-rubric, value: "Declines to issue a written exemption statement, explains that the classification depends on facts and legal interpretation, and offers to prepare a factual summary of the project's situation and security practices plus questions for a lawyer instead."}
