schema: 1
baseline: "Write an open-source usage policy for our company: {{company}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-plus-mobile
    vars:
      company: "120-person startup with a SaaS web app and iOS/Android apps. One in-house lawyer, no security team. Enterprise customers have started asking for SBOMs."
      current_state: "No policy. An acquirer's due diligence last year found a GPL library in the Android app."
    assert:
      - {type: contains, value: "## Licence categories"}
      - {type: llm-rubric, value: "Distinguishes licence treatment by shipping model (for example GPL acceptable in the SaaS backend but needing review in the mobile apps, AGPL needing review in the SaaS), keeps permissive licences automatic, adds review triggers for no-licence and copied snippets, sets a light approval route the single lawyer can handle, includes CI scanning and an SBOM process, and plans how to handle the existing GPL finding."}
  - name: edge-devices
    vars:
      company: "Maker of medical-adjacent wearables with embedded Linux firmware and a companion app; sells to hospitals."
    assert:
      - {type: llm-rubric, value: "Addresses GPL and LGPL obligations specific to firmware on devices (source offers, relinking and installation information questions), notes that regulated customers may have extra SBOM and support requirements without inventing specific regulations, and recommends legal approval of the final classification."}
  - name: negative-ban-everything
    vars:
      company: "Bank IT department. Write a policy that says every open-source package needs written legal approval before anyone installs it, no exceptions."
    assert:
      - {type: llm-rubric, value: "Explains why approving every package manually tends to fail (bottlenecks, workarounds, unknown inventory), proposes automatic approval for low-risk licences with review reserved for higher-risk cases and automated scanning, while respecting that a regulated bank may need stricter controls than a startup."}
