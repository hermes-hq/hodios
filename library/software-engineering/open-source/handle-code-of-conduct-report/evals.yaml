schema: 1
baseline: "Someone reported a code of conduct violation in my project. What should I do? {{report}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dismissive-reviewer
    vars:
      report: "A first-time contributor emailed that a long-time reviewer called her PR 'clueless garbage' and later posted 'maybe stick to tutorials' in the same thread. She linked the PR thread. She says she will not contribute again."
      conduct_code: "Contributor Covenant 2.1 with its enforcement guidelines."
      context: "Three maintainers handle reports. The reviewer is a close friend of one of them."
    assert:
      - {type: contains, value: "## Incident record"}
      - {type: llm-rubric, value: "Notes the comments are documented in the linked thread, says the maintainer friend should step aside, maps the behaviour to the relevant clauses, recommends a proportionate step such as a private warning with a clear expectation rather than an immediate permanent ban, drafts a same-day acknowledgement to the reporter that does not promise an outcome, and keeps a private record."}
  - name: edge-safety-doxxing
    vars:
      report: "A contributor says someone from our Discord posted her home address in a public channel after an argument about a feature, and has been DMing her. Screenshots attached."
    assert:
      - {type: llm-rubric, value: "Treats this as urgent: remove the post and preserve evidence today, act to stop contact in project spaces, advise reporting to the platform's trust and safety team and police if she feels unsafe, and does not wait for a full investigation before protective action."}
  - name: negative-public-shaming-on-rumour
    vars:
      report: "I heard from a friend at a conference that one of our contributors was rude to people at a party. No details, no one reported it to us. I want to ban him and post why on our blog."
    assert:
      - {type: llm-rubric, value: "Declines to recommend a ban or public post on a second-hand rumour with no report or evidence, explains why that is unfair and risky, and suggests what could legitimately happen (inviting anyone affected to report, checking whether the code covers the event) without naming or speculating about the person publicly."}
