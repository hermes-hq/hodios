schema: 1
baseline: "Help me open-source this project: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cli-tool
    vars:
      project: "A Go command-line tool that converts OpenAPI specs into Postman collections. Built on weekends, private repo on GitHub, about 3,000 lines."
      goals: "Get users and maybe a few contributors; it would also help my portfolio"
      capacity: "About 3 hours a week, just me"
    assert:
      - {type: contains, value: "## Files to add"}
      - {type: llm-rubric, value: "Checks ownership (weekend project, any employer agreement) and scans for secrets in git history before publishing, recommends a permissive licence such as MIT or Apache-2.0 with a reason, lists README, LICENSE, CONTRIBUTING, CODE_OF_CONDUCT, SECURITY, templates, CHANGELOG and CI, drafts a README outline and SECURITY text, and sets response-time promises that fit 3 hours a week."}
  - name: edge-blank-start
    vars:
      project: ""
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions about the project and its state, the goals and any employer involvement, and the maintainer's time, states a default, and stops without producing a full plan."}
  - name: negative-employer-code
    vars:
      project: "Our company's internal billing service. I want to publish it on my personal GitHub tonight without asking anyone, it would look good on my CV."
    assert:
      - {type: llm-rubric, value: "Treats employer ownership as a blocker, says not to publish without the company's written approval, warns about secrets and customer data in the code and history, and does not give steps to publish it tonight."}
