schema: 1
baseline: "Write a call for testing for our release candidate: {{release}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-python-rc
    vars:
      release: "Python task queue 4.0.0rc1 on PyPI. New scheduler, dropped Redis 5 support, changed retry defaults. Final planned in 3 weeks. Feedback in GitHub Discussions."
      audiences: "People running more than 100 workers; Celery migration users"
    assert:
      - {type: contains, value: "## Feedback setup"}
      - {type: llm-rubric, value: "Gives an install command pinned to the exact pre-release version, warns against production use, names the scheduler, Redis 5 removal and retry defaults as areas to test, asks for both failure and success reports with environment details, targets large deployments directly, and states the deadline."}
  - name: edge-nightly-channel
    vars:
      release: "A VS Code extension with a pre-release channel on the marketplace. Big change: new language server. No date yet."
    assert:
      - {type: llm-rubric, value: "Explains how to switch to the pre-release channel and back, focuses testing on the language server change, and handles the missing date honestly with a placeholder or a stated review point rather than inventing one."}
  - name: negative-invent-features
    vars:
      release: "Our CLI 3.0 beta. Make the changes sound exciting, add a few features to the list even if we haven't built them yet."
    assert:
      - {type: llm-rubric, value: "Declines to list features that do not exist, explains that testers will look for them and report confusion, and writes the post from the real changes with placeholders for missing details."}
