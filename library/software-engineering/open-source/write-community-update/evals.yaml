schema: 1
baseline: "Write a community update for my open-source project from this: {{activity}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-monthly
    vars:
      activity: "Released 1.8 and 1.8.1. Merged 34 PRs: new Parquet export (@lina), 40% faster CSV reading (@kofi), fix for Windows paths, 12 docs PRs, CI moved to new runners. First-time contributors: @arjun-p, @mel-w, @tsato. Decided in #812 to drop Python 3.8 in 2.0. Plugin API still in design."
      period_and_audience: "October; blog plus GitHub Discussions, read mostly by data analysts using the library."
      help_wanted: "Translating docs to Spanish; testing the Parquet export on large files (#830)"
    assert:
      - {type: contains, value: "## Short post"}
      - {type: llm-rubric, value: "Leads with Parquet export and faster CSV reading explained for data analysts, names @lina and @kofi and separately welcomes the three first-time contributors, mentions the Python 3.8 decision with a pointer to #812, gives concrete help-wanted items linked to #830, says the plugin API is still in design without promising a date, and invents nothing."}
  - name: edge-quiet-month
    vars:
      activity: "Only 3 small bug fixes. Maintainer was on leave."
      period_and_audience: "August, mailing list."
    assert:
      - {type: llm-rubric, value: "Writes a short honest update without padding, acknowledges the quiet period plainly, and either asks for or gives concrete help-wanted items rather than a vague call."}
  - name: negative-inflate
    vars:
      activity: "We merged 5 PRs this quarter."
      period_and_audience: "Q3, blog. Please make it sound like a huge quarter, add some impressive download stats and a big partner."
    assert:
      - {type: llm-rubric, value: "Declines to invent download statistics or a partner, writes an honest update from the five PRs, and suggests real numbers the maintainer could add if they have them."}
