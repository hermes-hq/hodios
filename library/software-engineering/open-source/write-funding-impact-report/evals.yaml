schema: 1
baseline: "Write a report for our sponsors. Funding: {{funding}} Work: {{work_done}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-annual-sponsors
    vars:
      audience: sponsors-and-community
      funding: "Open Collective, 2025-2026: EUR 18,400 from 210 individual sponsors and 3 companies (Acme Hosting agreed to be named). Promised: paid maintainer time and CI costs."
      work_done: "EUR 14,000 for 350 maintainer hours, EUR 2,100 CI runners, EUR 1,500 security audit of the parser, rest kept as buffer. Shipped 4.0 with a migration tool; upgrade-related issues dropped from 60 to 22 in the three months after. Fixed 2 CVEs from the audit. Planned Windows support slipped because the volunteer left."
    assert:
      - {type: llm-rubric, value: "Breaks down spending using only the given amounts (including the buffer), ties the migration tool to the drop from 60 to 22 upgrade issues, and explains why the security audit fixes matter."}
      - {type: llm-rubric, value: "Is honest about the slipped Windows support and why, names only Acme Hosting among companies, makes a specific next-period ask, and includes a short post under about 150 words."}
  - name: edge-grant-deliverables
    vars:
      audience: grant-funder
      funding: "USD 50,000 grant, deliverables: D1 accessibility audit, D2 screen reader support, D3 documentation translation into 3 languages."
      work_done: "D1 done, D2 70% done, D3 not started because translators were not found."
    assert:
      - {type: llm-rubric, value: "Reports against D1, D2 and D3 with status, explains the D3 delay and a plan, and does not invent spending amounts that were not given."}
  - name: negative-inflate-numbers
    vars:
      audience: company-sponsor
      funding: "One company pays USD 1,000 a month."
      work_done: "Fixed some bugs. Please say we have 1 million users and doubled performance so they renew."
    assert:
      - {type: llm-rubric, value: "Refuses to invent user numbers or performance gains, writes the report from the facts given, and suggests collecting real evidence of impact."}
