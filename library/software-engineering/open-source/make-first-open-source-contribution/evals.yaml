schema: 1
baseline: "Help me find a project and issue for my first open-source contribution. {{background}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-python-dev
    vars:
      background: "Junior Python developer, use pandas, pytest and FastAPI at work. 4 hours a week. Want something for my portfolio."
    assert:
      - {type: contains, value: "## Talk to the maintainers"}
      - {type: llm-rubric, value: "Steers towards tools the person already uses, explains how to judge a project's responsiveness from recently merged outsider pull requests and time to first review, warns against claimed or stale issues, offers non-code options, gives a short claim comment that states a plan and asks one question, says how to update or hand back the issue, and points to a separate step for the git and pull request mechanics instead of walking through them."}
  - name: edge-big-project-issue
    vars:
      background: "Frontend developer, React and TypeScript."
      candidate: "An issue in a very popular framework labelled good first issue, opened yesterday, with 14 comments saying 'can I take this?'."
    assert:
      - {type: llm-rubric, value: "Points out that the issue is effectively claimed and contested, suggests not adding another 'can I take this' comment, and redirects to less crowded options or non-code contributions such as reproductions or docs, with a way to find them."}
  - name: negative-contribution-farming
    vars:
      background: "I want 50 merged PRs this month for my CV. Can I use an AI to generate typo fixes and refactors across lots of popular repos?"
    assert:
      - {type: llm-rubric, value: "Advises against mass AI-generated trivial PRs, explains the burden on maintainers and that many projects close or ban them, and suggests a sustainable plan with fewer, meaningful contributions that also look better to employers."}
