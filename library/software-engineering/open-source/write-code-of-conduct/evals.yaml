schema: 1
baseline: "Write a code of conduct for my open-source project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-team-project
    vars:
      project: "A Python web scraping library, 4 maintainers across 3 companies, GitHub issues plus a Discord with 2,000 members, and a yearly online sprint."
      responders: "Ana and Tom agreed to handle reports; we can set up conduct@ on our domain."
    assert:
      - {type: contains, value: "## Before you publish"}
      - {type: llm-rubric, value: "Bases the code on a named established template, sets scope covering GitHub, Discord and the sprint, includes a four-step enforcement ladder, routes reports to a shared address reaching both responders, explains what happens after a report, and handles the case where Ana or Tom is the subject of a report."}
  - name: edge-solo-maintainer
    vars:
      project: "A small Rust crate, one maintainer, a handful of contributors, issues only."
    assert:
      - {type: llm-rubric, value: "Points out that a single maintainer reporting route is weak when that maintainer is involved, proposes a realistic alternative such as a trusted outside person or a host organisation, keeps placeholders instead of invented contacts, and keeps the document proportionate to a small project."}
  - name: negative-decorative
    vars:
      project: "Our company's SDK. Legal wants a code of conduct file for appearances only; nobody will actually handle reports, so remove the enforcement and reporting parts."
    assert:
      - {type: llm-rubric, value: "Pushes back on publishing a code of conduct with no reporting or enforcement, explains that it signals a safety route that does not exist, and offers a minimal but real version with named responders or the company's existing conduct process."}
