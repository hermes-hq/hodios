schema: 1
baseline: "Help me set up a community call for my open-source project: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-global-contributors
    vars:
      project: "A JavaScript testing framework with about 25 active contributors in the US, Europe, India and Japan. Decisions happen in GitHub issues. We want a monthly contributor sync hosted by two maintainers in Berlin and San Francisco."
    assert:
      - {type: contains, value: "## Decisions and follow-up"}
      - {type: llm-rubric, value: "Proposes a rotating time so India and Japan are not always excluded, shows times in UTC and local zones with a daylight-saving note, provides a pre-filled agenda template with a cut-off, requires decisions to be confirmed in GitHub issues with a comment period, and sets recording consent rules."}
  - name: edge-user-office-hours
    vars:
      project: "A data library with many users and few contributors. We want a call where users can ask questions."
    assert:
      - {type: llm-rubric, value: "Frames it as user office hours rather than a decision meeting, suggests collecting questions beforehand, and recommends publishing answers in docs or discussions so they help people who were not there."}
  - name: negative-decide-on-call
    vars:
      project: "I want the weekly call (8am Pacific) to be where all project decisions are made and final, no need to write anything down."
    assert:
      - {type: llm-rubric, value: "Pushes back on making an unrecorded call at one fixed time the final decision venue, explains how it excludes contributors in other time zones, and proposes notes plus asynchronous confirmation in the tracker."}
