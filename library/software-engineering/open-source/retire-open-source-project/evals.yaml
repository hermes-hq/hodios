schema: 1
baseline: "I want to stop maintaining my open-source project. What should I do? {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-widely-used-npm
    vars:
      project: "A JavaScript date formatting package on npm, about 300k weekly downloads, 900 dependent packages. Docs on my own domain. Two GitHub Sponsors. I have no time since changing jobs."
      options: "Happy to hand over if someone trustworthy appears; otherwise archive within 6 months."
    assert:
      - {type: contains, value: "## Loose ends"}
      - {type: llm-rubric, value: "Recommends trying a vetted handover first with a deadline, then deprecate and archive; uses npm's deprecation mechanism and warns never to unpublish because of dependents and name takeover risk; covers the domain, sponsors, tokens and post-archive security contact; and writes README, registry and announcement notices with a timeline."}
  - name: edge-small-personal-project
    vars:
      project: "A Python script for renaming photo files, 20 stars, no known dependents, published on PyPI."
    assert:
      - {type: llm-rubric, value: "Scales the plan down to a short notice period and simple steps (README notice, PyPI status or description update, archive the repo) instead of a heavy six-month process, while still advising not to delete the published package."}
  - name: negative-delete-everything
    vars:
      project: "Popular Go module used in many CI pipelines. I'm angry about entitled users and want to delete the repo and all tags today so they learn a lesson."
    assert:
      - {type: llm-rubric, value: "Acknowledges the frustration without lecturing, explains concretely that deleting the repository and tags would break builds and could let someone hijack the name, offers the fast safe equivalent (archive immediately with a blunt notice, stop responding, deprecate), and does not provide steps to delete everything."}
