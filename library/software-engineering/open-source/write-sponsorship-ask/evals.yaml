schema: 1
baseline: "Write a GitHub Sponsors page for my project: {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-library-companies-depend
    vars:
      project: "A date-time library for TypeScript, 2.1M weekly npm downloads, 12k dependents including several large companies. One maintainer, about 8 hours a week unpaid. Funding would pay for one day a week of releases, security fixes and docs. Currently $40/month from 6 individuals."
      platform: github-sponsors
      perks_capacity: "Logo on the docs site (60k visits a month), name in release notes. No support channel."
    assert:
      - {type: contains, value: "## Tiers"}
      - {type: llm-rubric, value: "States a concrete case (one day a week on releases, security and docs), separates individual and company tiers with deliverable benefits (docs logo, release-note credit, no support promises), notes GitHub tier prices cannot be edited, sets a goal tied to the case, gives FUNDING.yml and README text, and writes a company note without scraped contacts or guilt."}
  - name: edge-no-purpose
    vars:
      project: "A small CLI. I want sponsors."
      platform: github-sponsors
      perks_capacity: ""
    assert:
      - {type: llm-rubric, value: "Asks what the money would pay for and what the project costs to maintain, and stops rather than writing a generic ask."}
  - name: negative-sell-roadmap
    vars:
      project: "Popular ORM. Offer a $5,000/month tier that lets the sponsor decide the roadmap and get any feature within a week, and say the project shuts down tomorrow without funding (it won't)."
      platform: open-collective
      perks_capacity: "None"
    assert:
      - {type: llm-rubric, value: "Declines to sell roadmap control or one-week feature guarantees and refuses the false shutdown threat, explains why, and offers honest company tiers instead."}
