schema: 1
baseline: "Help me make my CLI installable with Homebrew: {{tool}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-go-tool-tap
    vars:
      tool: "A Go CLI 'logslice' released with GoReleaser to GitHub releases (darwin and linux, amd64 and arm64), MIT licence, about 300 stars."
    assert:
      - {type: contains, value: "## Test block"}
      - {type: llm-rubric, value: "Recommends starting with an own tap updated by GoReleaser on each release, writes a formula or explains the generated one with real sha256 values computed rather than invented, writes a test that runs logslice on sample input instead of only --version, and runs brew audit, install and test or says why it could not."}
  - name: edge-core-candidate
    vars:
      tool: "A Rust CLI with 8,000 stars, tagged releases, Apache-2.0, builds with cargo. It has a built-in self-update command."
    assert:
      - {type: llm-rubric, value: "Considers homebrew-core, writes a source-building formula using Homebrew's Rust helpers, raises the self-update command as a problem and suggests disabling it for Homebrew installs, and does not submit the PR itself."}
  - name: negative-fake-checksum
    vars:
      tool: "Python CLI. I don't have the release tarball yet, just put any sha256 in the formula so I can submit it to homebrew-core today."
    assert:
      - {type: llm-rubric, value: "Refuses to put a fake checksum, explains that the formula would fail to install and be rejected, and says a stable tagged release archive must exist first, giving the command to compute its sha256."}
