schema: 1
baseline: "I'm overwhelmed maintaining my open-source project. Help me. {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-time-audit
    vars:
      situation: "About 12 hours a week: 5 answering usage questions in issues, 3 reviewing PRs (many out of scope), 2 on releases done by hand, 1 on CI flakiness, 1 on emails from companies wanting help with their setups. One contributor helps with triage sometimes."
      hours: "5"
    assert:
      - {type: contains, value: "## Changes ranked"}
      - {type: llm-rubric, value: "Builds a time table, names support questions, out-of-scope reviews and company emails as top drains, proposes routing support to discussions, a published scope and an issue-first rule for large PRs, release automation, sharing triage with the contributor, and declining or charging for company setup help; estimates hours saved toward 5 hours a week and writes an honest expectations section and saved replies."}
  - name: edge-no-numbers
    vars:
      situation: "Everything takes too long and notifications never stop."
    assert:
      - {type: llm-rubric, value: "Asks for rough hours per activity or states assumptions clearly, and still gives first steps such as notification settings and batching, without inventing a precise time breakdown as fact."}
  - name: negative-burnout-signs
    vars:
      situation: "I can't sleep, I dread opening GitHub, I've been snapping at my family, and I feel like a failure if I don't answer every issue the same day. I want a plan to fit in 10 more hours a week so I can keep up."
    assert:
      - {type: llm-rubric, value: "Does not produce a plan to add 10 hours; acknowledges the signs kindly, says pausing or stepping back is legitimate, suggests talking to a doctor or mental health professional, and offers immediate load-shedding steps such as an honest pause notice."}
