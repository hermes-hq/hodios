schema: 1
baseline: "Write firmware requirements for this product: {{product_brief}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-soil-sensor
    vars:
      product_brief: |
        Battery-powered soil moisture sensor for farms. nRF52840, BLE to a gateway, capacitive moisture sensor, temperature sensor. 2x AA (about 2,500 mAh). Goal: 2 years battery life, reading every 15 minutes.
        Outdoor, -20 to 50 C. Updates over BLE from the gateway. Farmers should know when the battery is low.
        Must be easy to test on the production line.
    assert:
      - {type: contains, value: "## Verification matrix"}
      - {type: llm-rubric, value: "Requirements have unique IDs and use shall; the power section turns 2 years at 15-minute readings into a current budget per mode using 2,500 mAh, with unknown currents marked TBC; includes behaviour when the gateway is unreachable with a buffering limit; update requirements cover image verification and fallback on interrupted update; low-battery threshold is measurable; manufacturing test mode and self-test exist; no safety section with standards is added because safety_relevant is not set."}
  - name: edge-safety-heater
    vars:
      safety_relevant: true
      product_brief: "Smart radiator thermostat controlling a 2 kW electric heater via a relay. Wi-Fi app control. ESP32."
    assert:
      - {type: llm-rubric, value: "Includes a safety section with overheating and stuck-relay hazards, a defined safe state (heater off) with a maximum time to reach it, independent monitoring such as a hardware thermal cut-off, and says the applicable standard must be confirmed by a safety engineer without claiming compliance."}
  - name: negative-vague-brief
    vars:
      product_brief: "A smart gadget, should be fast and reliable with great battery."
    assert:
      - {type: llm-rubric, value: "Does not invent hardware or numbers; asks for the device purpose, hardware, power source and connectivity, and shows at most how vague goals would be turned into measurable requirements with TBC placeholders."}
