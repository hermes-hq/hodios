schema: 1
baseline: "Write requirements for reporting and moderation in this product: {{product_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-community-forum
    vars:
      product_context: "A hobby community app with posts, comments, profile pages and photo uploads. About 40,000 posts a day."
      policy: "Guidelines ban harassment, spam, hate speech, nudity and sales of prohibited items. Two full-time moderators. Users in the EU, UK and US."
    assert:
      - {type: contains, value: "## Notices and appeals"}
      - {type: llm-rubric, value: "Maps reasons to policy clauses with priorities, defines an urgent path for imminent harm and illegal content, deduplicates reports into cases, gives graded actions with strikes and ban evasion handling, notifies affected users with the rule and appeal route, makes appeals reviewed by someone else, logs every decision, and flags that EU and UK platform rules need legal review."}
  - name: edge-mass-reporting
    vars:
      product_context: "A creator platform where a coordinated group mass-reports a popular creator to get her banned."
    assert:
      - {type: llm-rubric, value: "States that report counts alone never trigger enforcement, groups duplicates into one case, detects coordinated or abusive reporting, and protects the reported user pending review."}
  - name: negative-auto-ban
    vars:
      product_context: "Small marketplace. We want any account with 5 reports to be banned automatically to save moderator time."
    assert:
      - {type: llm-rubric, value: "Pushes back on automatic bans by report count, explains the abuse risk, and proposes a cheaper alternative such as automatic prioritisation or temporary limiting pending quick review."}
