schema: 1
baseline: "Write requirements for messaging in this product: {{feature_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-marketplace-messaging
    vars:
      feature_description: "Buyers message sellers about a listing in a second-hand marketplace app before buying."
      context: "iOS, Android and web. We take payment on the platform and lose revenue when people pay outside. Push and email notifications exist."
    assert:
      - {type: contains, value: "## Safety controls"}
      - {type: llm-rubric, value: "Links conversations to listings, limits first contact and new-account rates, addresses contact detail sharing as a business rule with scam risk, specifies blocking and reporting with context to moderators, attachment limits and scanning, hidden previews on locked screens, and retention including deleted accounts."}
  - name: edge-teen-users
    vars:
      feature_description: "A study app where students aged 13 and up can message classmates in the same study group."
    assert:
      - {type: llm-rubric, value: "Applies stricter defaults for minors (limited who can message, no messages from strangers, easy reporting, restricted media) and flags the need for a child safety and legal review."}
  - name: negative-unclear-who
    vars:
      feature_description: "Add chat."
    assert:
      - {type: llm-rubric, value: "Asks who messages whom and why before writing rules, rather than assuming open messaging between all users."}
