schema: 1
baseline: "Write a software requirements specification from these notes: {{source_material}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-permit-portal
    vars:
      source_material: "City council wants an online portal for residents to apply for parking permits, upload proof of address, pay the fee and receive a digital permit. Officers review applications. Must connect to the council's payment provider and the vehicle registry. It should be fast and easy to use and secure. About 60,000 residents."
      context: "SRS goes to suppliers in a public tender and is signed off by the council."
    assert:
      - {type: contains, value: "## Non-functional requirements"}
      - {type: llm-rubric, value: "Uses unique ids with single shall statements, rationale and source, splits compound needs, turns 'fast', 'easy' and 'secure' into measurable criteria or TBDs in open issues, specifies interfaces to the payment provider and vehicle registry, includes accessibility as a requirement to confirm for the public sector, and gives a verification method per requirement."}
  - name: edge-design-in-notes
    vars:
      source_material: "The system must use a MySQL database, a React front end and send an SMS when the order ships. Orders must be processed quickly."
    assert:
      - {type: llm-rubric, value: "Separates design constraints (MySQL, React) from functional requirements, recording them as constraints only if they are genuine client constraints or raising them as open issues, writes the SMS requirement as a single testable statement, and replaces 'quickly' with a measurable TBD."}
  - name: negative-too-thin
    vars:
      source_material: "An app."
    assert:
      - {type: llm-rubric, value: "Asks for source material about purpose, users and functions instead of producing an SRS filled with invented requirements."}
