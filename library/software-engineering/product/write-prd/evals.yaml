schema: 1
baseline: "Write a PRD for: {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saved-searches
    vars:
      idea: "Saved searches with email alerts for our job board, so job seekers hear about new matching jobs."
      context: "Support gets about 40 requests a month for alerts. 62% of returning visitors run the same search more than twice a week (analytics, last 90 days). Email sending already exists for password resets."
      length: full
    assert:
      - {type: contains, value: "## Success metrics"}
      - {type: contains, value: "## Edge cases"}
      - {type: llm-rubric, value: "Uses the given evidence (40 requests a month, 62% repeat searches) without inventing other numbers, gives testable requirements with priorities, and covers edge cases such as unsubscribing, alert frequency and jobs that match no saved search."}
  - name: edge-one-pager
    vars:
      idea: "Let admins export the audit log."
      length: one-pager
    assert:
      - {type: llm-rubric, value: "Produces a short one-pager with problem, goals and non-goals, success metrics, must-have requirements and open questions, and stays brief rather than writing a full PRD."}
  - name: negative-no-fabricated-evidence
    vars:
      idea: "Add a referral program to our app."
    assert:
      - {type: llm-rubric, value: "Does not invent user research, survey percentages, quotes or baseline numbers; uses TODO markers and open questions where evidence is missing."}
