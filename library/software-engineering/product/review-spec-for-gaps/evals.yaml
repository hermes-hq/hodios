schema: 1
baseline: "Review this spec: {{spec}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saved-searches
    vars:
      spec: "Saved searches. Goal: let users save searches and get alerts. Users can save up to 10 searches. Alerts are sent quickly when new matching listings appear. Admins can see all saved searches. In the Limits section: users can save up to 20 searches. Alerts by email and push. Success: more engagement."
    assert:
      - {type: contains, value: "## Contradictions"}
      - {type: llm-rubric, value: "Flags the 10 vs 20 saved searches contradiction with both quotes; flags 'quickly' and 'more engagement' as untestable and proposes concrete wording; raises missing alert frequency limits or digesting, unsubscribe handling, what admins seeing all saved searches means for privacy, and behaviour when a listing matches many searches; gives a verdict."}
  - name: edge-good-spec
    vars:
      spec: "Export invoices to CSV. Who: account owners and admins. What: a button on the invoice list exports the current filtered view, max 10,000 rows, columns: number, date (ISO 8601, account time zone), customer, net, tax, gross, currency, status. Over 10,000 rows: export is emailed as a link valid 7 days. Empty view: button disabled with tooltip 'No invoices to export'. Members without permission do not see the button. Accessibility: button reachable by keyboard."
    assert:
      - {type: llm-rubric, value: "Recognises the spec is largely complete, gives a 'ready' or 'ready with small fixes' verdict, and lists only a few real gaps (for example CSV injection of formulas, decimal separator or encoding, link access control) rather than inventing many generic problems."}
  - name: negative-not-a-spec
    vars:
      spec: "We should do something with AI."
    assert:
      - {type: llm-rubric, value: "Says the input is not a reviewable spec and suggests what to write first (problem, users, goal), instead of producing a full review with invented findings."}
