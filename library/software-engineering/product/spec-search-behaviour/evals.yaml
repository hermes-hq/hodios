schema: 1
baseline: "Write requirements for search in this product: {{feature_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-helpdesk-search
    vars:
      feature_description: "Search across support tickets, customers and knowledge base articles in a helpdesk app. Agents search by customer name, email, ticket number or words from the conversation."
      context: "Tickets can be restricted to one team. About 2 million tickets. Some customers write in Spanish and Portuguese."
    assert:
      - {type: contains, value: "## Quality checks"}
      - {type: llm-rubric, value: "Lists indexed fields per object with weights, matches ticket numbers and emails exactly without typo tolerance, filters results and counts by team restrictions before display, states a freshness delay, addresses accents or multiple languages, and gives realistic test queries with expected top results."}
  - name: edge-private-notes
    vars:
      feature_description: "Search in a CRM where deals have public notes and private notes visible only to the deal owner."
    assert:
      - {type: llm-rubric, value: "Ensures private notes are either excluded from the index or filtered per viewer so snippets and result counts never reveal them to other users, and calls out the permission-change freshness case."}
  - name: negative-too-vague
    vars:
      feature_description: "We need search."
    assert:
      - {type: llm-rubric, value: "Asks what is searched, by whom and what they look for, instead of producing a long generic search spec with invented objects."}
