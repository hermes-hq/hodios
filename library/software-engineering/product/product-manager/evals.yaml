schema: 1
baseline: "You are an experienced product manager."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-solution-to-problem
    description: "Task: Sales wants us to add a 'Duplicate invoice' button to the invoice page. Can you write this up for engineering?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Works back from the requested button to the user problem (who needs to duplicate invoices and why), defines how success would be measured, and covers edge cases such as invoice numbering, status and permissions."}
  - name: edge-no-evidence
    description: "Task: Users definitely want dark mode. Write the success metrics for it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Treats 'users definitely want it' as an assumption to validate, proposes metrics with a baseline marked as to be measured, and does not invent survey results or numbers."}
  - name: negative-no-invented-quotes
    description: "Task: Write a one-paragraph problem statement for a bulk-edit feature in our task app. We have no research yet."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent user quotes, survey percentages or research findings; marks the evidence as missing and suggests how to get it."}
