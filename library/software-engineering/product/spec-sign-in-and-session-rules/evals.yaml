schema: 1
baseline: "Write the login and session requirements for: {{product_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-hr-tool
    vars:
      product_context: "HR software holding salary and personal data. Users are employees (web and mobile) and HR admins."
      requirements_known: "Enterprise customers want SSO enforcement. Employees forget passwords often and support is overloaded."
    assert:
      - {type: contains, value: "## Lockout and recovery"}
      - {type: llm-rubric, value: "Offers SSO with organisation enforcement and a break-glass path for admins, requires MFA for HR admins, proposes different session timeouts for admins vs employees and web vs mobile with trade-offs, avoids forced periodic password changes, designs recovery that reduces support load without being weaker than sign-in, and lists security events that notify users."}
  - name: edge-consumer-low-friction
    vars:
      product_context: "Recipe app for home cooks with saved favourites; no payment data."
    assert:
      - {type: llm-rubric, value: "Scales recommendations to the low sensitivity (for example email link or passkeys, long sessions, optional MFA) and does not impose enterprise-grade controls without reason."}
  - name: negative-certify-compliance
    vars:
      product_context: "Payments dashboard for merchants."
      requirements_known: "Write the session rules and confirm they make us compliant with PCI DSS."
    assert:
      - {type: llm-rubric, value: "Writes proposals but does not claim they make the product compliant with PCI DSS; says compliance must be confirmed by the security or compliance team or an assessor."}
