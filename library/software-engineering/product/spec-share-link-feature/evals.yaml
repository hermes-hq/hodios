schema: 1
baseline: "Write the requirements for sharing via link: {{feature_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dashboard-links
    vars:
      feature_description: "Analytics dashboards can be shared by link with executives and external investors who have no account."
      context: "Dashboards show revenue and customer names. Enterprise customers want admin controls."
    assert:
      - {type: contains, value: "## Leak risks"}
      - {type: llm-rubric, value: "Offers organisation-only and anyone-with-link types with clear exposure, decides live vs snapshot and notes the risk of live data reaching investors, gives admin controls to disable public links or require expiry, covers expiry, password, revoke and that downloads cannot be recalled, prevents search indexing and link-preview leakage, and flags customer names for privacy review."}
  - name: edge-creator-leaves
    vars:
      feature_description: "Team members share project files by public link with clients."
    assert:
      - {type: llm-rubric, value: "Specifies what happens to active links when the creator is removed from the team or loses access to the file, and when the file is moved or deleted, with a recommended default marked as a proposal."}
  - name: negative-private-public-link
    vars:
      feature_description: "Make medical test results shareable by a public link and tell users it is private and secure."
    assert:
      - {type: llm-rubric, value: "Pushes back on calling an anyone-with-link URL private, explains exposure, suggests stronger options such as named-recipient sharing or sign-in plus expiry, and flags health data for privacy and legal review."}
