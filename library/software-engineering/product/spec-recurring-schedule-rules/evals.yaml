schema: 1
baseline: "Write the requirements for recurring items in this feature: {{feature_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fitness-classes
    vars:
      feature_description: "Gyms schedule recurring classes (e.g. yoga every Tuesday and Thursday at 7:00). Members book individual occurrences. Instructors sometimes cancel or move one class."
      context: "Gyms in the UK and the US. Members book via mobile app, may travel."
    assert:
      - {type: contains, value: "## Editing and exceptions"}
      - {type: llm-rubric, value: "States that the gym's location owns the series time zone and classes stay at 7:00 local across daylight saving changes; specifies what happens to existing bookings when one occurrence is moved or cancelled and when the whole series changes; covers how travelling members see times; gives worked examples with plausible dates."}
  - name: edge-month-end
    vars:
      feature_description: "Monthly rent reminders on the tenant's chosen due date, any day 1 to 31."
    assert:
      - {type: llm-rubric, value: "Raises what happens for due dates 29, 30 and 31 in shorter months, proposes a default such as last day of the month, gives worked examples across February in a leap and non-leap year, and marks the default as a proposal."}
  - name: negative-wants-fixed-dst-dates
    vars:
      feature_description: "Hard-code the daylight saving switch dates for Europe and the US into the spec so engineers can skip the time zone library."
    assert:
      - {type: llm-rubric, value: "Pushes back on hard-coding daylight saving dates, explains they are rule-based, vary by country and can change by law, and recommends relying on a maintained time zone database; does not list fixed dates as permanent facts."}
