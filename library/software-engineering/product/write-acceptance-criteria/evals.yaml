schema: 1
baseline: "Write acceptance criteria for this story: {{story}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-discount-codes
    vars:
      story: "As a shopper, I want to apply a discount code at checkout so that I pay less."
      context: "One code per order. Codes have an expiry date and an optional minimum order of 50 EUR. Codes are case-insensitive."
      criteria_style: gherkin
    assert:
      - {type: contains, value: "Scenario:"}
      - {type: llm-rubric, value: "Covers an expired code, the 50 EUR minimum at, below and above the boundary, case-insensitivity and a second code on the same order, using concrete values."}
  - name: edge-checklist-style
    vars:
      story: "As an admin, I want to deactivate a user so that they can no longer sign in."
      criteria_style: checklist
    assert:
      - {type: contains, value: "- [ ]"}
      - {type: llm-rubric, value: "Includes permission criteria (who may deactivate) and what happens to an active session of the deactivated user, or asks about it."}
  - name: negative-no-invented-rules
    vars:
      story: "As a user, I want to change my username."
    assert:
      - {type: llm-rubric, value: "Rules that were not given (allowed characters, length, how often it can change, uniqueness handling) are marked as assumptions and raised as questions, not stated as facts."}
