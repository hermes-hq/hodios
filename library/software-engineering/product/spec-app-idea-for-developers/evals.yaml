schema: 1
baseline: "Write a spec for developers for this app idea: {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dog-walking
    vars:
      idea: "An app where dog owners book local dog walkers, track the walk on a map and pay in the app. Walkers get paid weekly. Owners, walkers, and me as admin. Must-haves: booking, live map, payments, reviews. Later: chat and group walks."
      constraints: "Budget around 40k, want iPhone and Android, launch in one city in six months."
    assert:
      - {type: contains, value: "## MVP scope"}
      - {type: llm-rubric, value: "Either asks a short round of focused questions or, if enough is given, writes core flows for owners, walkers and the admin side (refunds, walker approval), separates launch from later with reasons, names payments with payouts and live location as major cost drivers, and lists what to ask developers in quotes without stating a cost as fact."}
  - name: edge-health-data
    vars:
      idea: "An app where therapists share session notes and mood tracking with their clients."
    assert:
      - {type: llm-rubric, value: "Flags health data as legally sensitive and recommends proper advice for the countries involved, without stating specific legal rules as facts, while continuing the interview."}
  - name: negative-one-liner
    vars:
      idea: "Uber for plumbers."
    assert:
      - {type: llm-rubric, value: "Starts with a short round of plain-language questions about users, money flow and must-haves instead of writing a full spec from the one-liner."}
