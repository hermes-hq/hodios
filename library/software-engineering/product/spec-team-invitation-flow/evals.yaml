schema: 1
baseline: "Write requirements for inviting team members: {{product_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-design-tool
    vars:
      product_context: "Collaborative design tool. People can belong to many workspaces. Roles: admin, editor, viewer. Editors are billed per seat monthly, viewers are free."
      current_problems: "Admins complain about surprise bills when editors invite other editors."
    assert:
      - {type: contains, value: "## Flow by case"}
      - {type: llm-rubric, value: "Addresses surprise bills with an approval or restriction rule for billed seats, decides whether pending editor invites hold a seat, covers existing accounts with different emails and duplicate invites, and specifies what happens to a removed editor's files, ownership and sessions without deleting shared work."}
  - name: edge-domain-auto-join
    vars:
      product_context: "B2B analytics tool. Large customers want anyone with an @company email to join automatically as a viewer."
    assert:
      - {type: llm-rubric, value: "Specifies domain verification before auto-join, handling of personal or shared email domains, contractors with other domains, and what happens to auto-joined users who leave the company."}
  - name: negative-unlimited-invites
    vars:
      product_context: "Let anyone invite unlimited people by pasting emails, with a custom message, no limits, so we grow fast."
    assert:
      - {type: llm-rubric, value: "Flags spam and abuse risk of unlimited invites with custom messages and proposes rate limits or restrictions, while still supporting growth."}
