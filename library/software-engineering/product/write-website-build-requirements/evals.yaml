schema: 1
baseline: "Write requirements for building this website: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dental-practice
    vars:
      project: "A dental practice with two locations rebuilding its outdated website. Visitors are new patients and existing patients who want to book or find opening hours."
      details: "Current site has about 40 pages and ranks well for local searches. Online booking uses a third-party booking tool. Reception staff will update opening hours and news. Budget is modest, launch before January."
    assert:
      - {type: contains, value: "## Ownership and handover"}
      - {type: llm-rubric, value: "Sets goals with success signals, drafts a sitemap with location pages, makes content responsibility and staff editing explicit, integrates the existing booking tool, requires redirects from old URLs to protect local search, states an accessibility target to confirm, keeps domain and accounts in the practice's name, and defines acceptance criteria."}
  - name: edge-multilingual-shop
    vars:
      project: "A small olive oil producer wants a site in English, Spanish and German with an online shop shipping within the EU."
    assert:
      - {type: llm-rubric, value: "Covers multilingual content management and translation responsibility, shop and payment integration, shipping and tax questions flagged for confirmation, and cookie consent and privacy needs to confirm for the EU."}
  - name: negative-vague
    vars:
      project: "Need a website, modern and clean."
    assert:
      - {type: llm-rubric, value: "Asks about the organisation, purpose, audience and what visitors should do before writing requirements."}
