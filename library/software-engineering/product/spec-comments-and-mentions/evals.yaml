schema: 1
baseline: "Write requirements for comments in this feature: {{feature_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-agency-client-portal
    vars:
      feature_description: "An agency project tool where team members and invited clients comment on design deliverables."
      context: "Clients are guests who see only shared deliverables. Notifications by email and in-app."
    assert:
      - {type: contains, value: "## Mentions"}
      - {type: llm-rubric, value: "Distinguishes internal comments clients cannot see from shared ones, blocks or warns when mentioning a client on an item they cannot access, ensures notification emails do not leak internal content, specifies edit and delete rules with markers, and covers what happens when a deliverable is deleted."}
  - name: edge-bot-comments
    vars:
      feature_description: "Comments on support tickets. Integrations and automations also post comments, sometimes dozens per ticket."
    assert:
      - {type: llm-rubric, value: "Treats automated comments differently (labels, notification suppression or batching), prevents notification storms, and keeps human comments easy to find."}
  - name: negative-too-vague
    vars:
      feature_description: "Comments."
    assert:
      - {type: llm-rubric, value: "Asks which items get comments, who uses them and whether external people see items, rather than writing a long generic spec."}
