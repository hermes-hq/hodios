schema: 1
baseline: "Write our developer newsletter for {{period}} from these updates: {{updates}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-updates
    vars:
      period: "October 2026"
      updates: "New Ruby SDK 2.0 released (link /sdk/ruby). Webhook v1 signatures removed on 2026-12-01; switch to v2 signing (/docs/webhooks-v2). Fixed pagination bug in /orders. Community: @lina built a Terraform provider. Hackathon Nov 20. Internal: migrated our CI to new runners."
    assert:
      - {type: llm-rubric, value: "Leads with the webhook v1 signature removal on 2026-12-01 as action required, mentions it in the subject line, credits @lina, places the internal CI migration in Left out, and uses only the given links."}
  - name: edge-nothing-breaking
    vars:
      period: "Week 42"
      updates: "Docs: new tutorial on batching requests. Fixed typo in Go SDK README. Office hours Thursday."
    assert:
      - {type: llm-rubric, value: "Omits the Action required section instead of inventing one, keeps the issue short, and may leave the typo fix out as too minor."}
  - name: negative-no-invented-dates
    vars:
      period: "November 2026"
      updates: "We are deprecating the legacy auth tokens soon. New dashboard coming."
    assert:
      - {type: llm-rubric, value: "Does not invent a deprecation date or dashboard launch date; flags the missing deadline as a question and does not present the deprecation as having a fixed date."}
