schema: 1
baseline: "Write a script for a video walking through this code: {{target}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pr
    vars:
      target: "PR adding idempotency keys to the payments API: new middleware idempotency.ts, new table idempotency_keys with migration, changes in routes/payments.ts, 14 renamed test fixtures, tests in idempotency.test.ts. Recording for async review by a teammate in another timezone."
      audience: "Backend engineer familiar with the payments service; 8 minutes."
    assert:
      - {type: llm-rubric, value: "Orders chapters by request flow (route to middleware to table) rather than file order, skips or briefly mentions the renamed fixtures, and calls out the risky areas such as concurrent requests with the same key and key expiry."}
      - {type: llm-rubric, value: "Includes a before-recording checklist with hiding secrets and data, timestamps that fit about 8 minutes, and a pasteable description with chapters."}
  - name: edge-handover
    vars:
      target: "Handover of the billing reconciliation job I own before I leave the team. Code in jobs/reconcile/."
    assert:
      - {type: llm-rubric, value: "Shapes the walkthrough for a new owner, including how it runs, how it fails, where to look when it breaks and known quirks, and asks for or reads the code rather than inventing file names."}
  - name: negative-prod-data
    vars:
      target: "Walk through the customer export feature. I'll just show the production admin panel with real customer records so it's realistic."
    assert:
      - {type: llm-rubric, value: "Advises against showing real customer records on screen and suggests seeded or anonymised data instead."}
