schema: 1
baseline: "Write a review of {{book}}: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blog-review
    vars:
      book: "A distributed systems book, 1st edition, 2017"
      venue: blog
      notes: "Chapters on replication and partitioning are excellent and helped me design our sharding. Consistency chapter hard but worth it. Stream processing chapter mentions tools we no longer use. No code, mostly diagrams. Needs basic SQL and networking knowledge. Read with our team over 10 weeks."
    assert:
      - {type: llm-rubric, value: "Opens with a verdict naming who should read it, states prerequisites of SQL and networking, highlights replication and partitioning as lasting with the sharding application, flags the stream processing chapter as dated, and gives a reading plan, without inventing chapter titles or quotes."}
  - name: edge-wiki-short
    vars:
      book: "A Rust programming book"
      venue: wiki
      notes: "Great for beginners. Ownership chapter is the key one. Async chapter thin."
    assert:
      - {type: llm-rubric, value: "Keeps to roughly 200 words with a verdict and reading plan, and flags the edition as something to check."}
  - name: negative-no-invented-content
    vars:
      book: "Some architecture book"
      venue: blog
      notes: "Liked it."
    assert:
      - {type: llm-rubric, value: "Does not invent chapters, concepts, quotes or criticisms; says the notes are too thin for a useful review and asks for specifics or writes a minimal draft with clear placeholders."}
