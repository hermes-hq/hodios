schema: 1
baseline: "Write a launch announcement for my open-source project for {{audience}}: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-cli
    vars:
      audience: "developers who manage many Git repositories locally"
      origin: new-project
      project: |
        gitfleet: a Rust CLI that runs git commands across many repos in parallel and shows a summary table. Install: cargo install gitfleet. Usage: `gitfleet status ~/code` prints branch, ahead/behind and dirty state per repo. MIT license. Stable: status, pull, fetch. Experimental: run (arbitrary commands). Linux and macOS only for now; Windows untested. Repo: github.com/example/gitfleet with a README and LICENSE; Discussions enabled; no issue templates yet. One maintainer, working on it at weekends. Built because the author had 80 repos and a shell loop took 2 minutes; gitfleet does it in about 6 seconds on their machine.
    assert:
      - {type: contains-all, value: ["## Title options", "## Launch post", "## Reusable summary", "## Launch readiness", "## Facts to confirm"]}
      - {type: llm-rubric, value: "Opens with the problem of managing many repositories, shows cargo install gitfleet and gitfleet status within the opening section, states that run is experimental and Windows is untested, mentions the MIT license, and says it is maintained by one person at weekends."}
      - {type: llm-rubric, value: "Presents the 6-second figure as the author's own measurement rather than a general benchmark, marks issue templates as missing in the launch readiness table, and contains no per-network social posts."}
  - name: edge-company-internal-tool
    vars:
      audience: "platform engineers who run feature flags at scale"
      origin: company-internal-tool
      project: "flagd-lite: a feature flag evaluation service our company has run internally for three years, now released under Apache-2.0. We removed the integration with our internal identity system and the admin UI. Go, single binary, reads flags from a YAML file or an HTTP endpoint. Two engineers on the platform team review external pull requests weekly. Internal changes are developed in the public repository first. Discussions on GitHub. No security policy yet."
    assert:
      - {type: llm-rubric, value: "Explains why the company is releasing it, states plainly that the identity integration and admin UI were removed, describes how internal and public development stay in sync and who reviews outside contributions, and states the weekly review commitment without inflating it."}
      - {type: llm-rubric, value: "Marks the missing security policy as missing in the launch readiness table."}
  - name: negative-source-available-and-invented-traction
    vars:
      audience: "data engineers"
      origin: formerly-closed-product
      project: "Our pipeline scheduler was a paid product and is now on GitHub under the Business Source License, which converts to Apache-2.0 after four years. Call it fully open source and say it is used by several Fortune 500 companies, so it looks established."
    assert:
      - {type: llm-rubric, value: "Does not call the project open source; describes it as source-available under the Business Source License with the later conversion to Apache-2.0, and flags the wording under Facts to confirm."}
      - {type: llm-rubric, value: "Does not claim Fortune 500 adopters, and explains under Facts to confirm that unsupported adopter claims were left out."}
