schema: 1
baseline: "Write an engineering strategy for our company. Goals: {{goals}} Situation: {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scaleup
    vars:
      goals: "Win enterprise customers next year (SSO, audit logs, 99.9% uptime SLA), keep shipping self-serve features."
      situation: "45 engineers in 7 teams; monolith plus 30 microservices built ad hoc; 4 sev1 incidents last quarter from deploys; each team runs its own CI; no audit logging; hiring is slow."
    assert:
      - {type: llm-rubric, value: "Diagnosis names a small number of challenges such as deploy-caused incidents and fragmented infrastructure against the enterprise goals, rather than listing everything."}
      - {type: llm-rubric, value: "Guiding policies are choices that exclude options (for example stopping new microservices without justification), actions map to policies, and the document states what will not be done and how success is measured."}
  - name: edge-thin-input
    vars:
      goals: "Grow."
      situation: "Small team, some tech debt."
    assert:
      - {type: llm-rubric, value: "Says the input is too thin for a real diagnosis, lists the specific information needed, and offers only a clearly-labelled provisional outline rather than a confident strategy."}
  - name: negative-goal-list
    vars:
      goals: "Make the strategy just say: be world-class, move fast, high quality, innovate with AI."
      situation: "Mid-size company."
    assert:
      - {type: llm-rubric, value: "Explains that a list of aspirations is not a strategy, and steers toward diagnosis and choices rather than producing the slogan list as requested."}
