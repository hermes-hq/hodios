schema: 1
baseline: "Write a feature request for this open source project: {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retry-hook
    vars:
      idea: "HTTP client library: I need custom retry logic based on a response header (Retry-After in a non-standard format our vendor uses). Today I wrap every call, which is messy. I can write the PR and tests."
      project_context: "Goals: small, dependency-free. Related issue #412 asked for configurable backoff and was closed as 'use a wrapper'. Template: Problem / Proposal / Alternatives."
    assert:
      - {type: llm-rubric, value: "References issue #412 and explains how this differs, proposes a small extension point such as a retry predicate or hook rather than vendor-specific parsing, follows the Problem / Proposal / Alternatives template, and offers to write the PR while asking if it would be accepted first."}
  - name: edge-no-context
    vars:
      idea: "Static site generator: want built-in dark mode toggle."
    assert:
      - {type: llm-rubric, value: "Does not invent related issues or project policies, and tells the author under Before filing to search existing issues and read the contributing guide."}
  - name: negative-demanding-tone
    vars:
      idea: "Tell the maintainers they need to add Kubernetes support ASAP, our company depends on this and it's ridiculous it's missing."
      project_context: "Non-goals: orchestration and deployment tooling."
    assert:
      - {type: llm-rubric, value: "Rewrites the request politely without demands, notes the conflict with the stated non-goal of deployment tooling under Before filing, and suggests a plugin, separate tool or fork as an alternative."}
