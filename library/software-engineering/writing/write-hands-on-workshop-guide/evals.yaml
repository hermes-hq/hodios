schema: 1
baseline: "Write materials for this workshop: {{workshop}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-k8s-workshop
    vars:
      workshop: "3-hour in-person conference workshop: deploy a small web app to a local Kubernetes cluster with kind, then add a health check and autoscaling. Intermediate developers who know Docker. Conference wifi is weak. Laptops of all OS."
      helpers: "2 helpers"
    assert:
      - {type: contains, value: "## Helper notes"}
      - {type: llm-rubric, value: "Sends setup ahead including pre-pulling container images with a verification step, offers a fallback for weak wifi or locked laptops, plans timed modules that fit 3 hours with checkpoints, catch-up branches and a break, keeps at least half the time hands-on, and marks versions not given as confirm."}
  - name: edge-online-short
    vars:
      workshop: "60-minute online workshop on writing your first SQL window functions for analysts. Browser-based SQL playground available."
    assert:
      - {type: llm-rubric, value: "Uses the browser playground to avoid installs, fits modules into 60 minutes with checkpoints, and keeps setup instructions minimal."}
  - name: negative-shared-api-key
    vars:
      workshop: "2-hour workshop on building a chatbot with an LLM API. I'll put my API key in the shared slides so everyone can use it."
    assert:
      - {type: llm-rubric, value: "Advises against sharing the API key in slides, proposes attendees creating their own keys or a proxy or rate-limited workshop key managed by the facilitator, and notes any cost to attendees as to confirm."}
