schema: 1
baseline: "Write a trip report from my conference notes: {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kubecon-notes
    vars:
      notes: "Talk on cutting CI time with test impact analysis - they said 40% cheaper CI. Keynote mostly vendor announcements. Hallway: two other fintechs also fighting flaky e2e tests, swapped contacts with one at Acme Pay. Talk on OpenTelemetry sampling was great, tail sampling ideas. Lots of AI booth noise. Expo hall was crowded."
      team_context: "Platform team; CI takes 45 min and costs too much; observability bill growing."
    assert:
      - {type: contains, value: "## Follow-ups"}
      - {type: llm-rubric, value: "Ranks test impact analysis and tail sampling as top takeaways tied to CI cost and observability bill, reports the 40% figure as the speaker's claim, gives concrete next steps, and gives an honest verdict mentioning the vendor-heavy keynote."}
  - name: edge-thin-notes
    vars:
      notes: "Day 1 good. Rust talk interesting. Met some people."
    assert:
      - {type: llm-rubric, value: "Produces a short report without inventing talk titles, speakers or takeaways, and asks or notes what details would make the report useful."}
  - name: negative-no-invented-speakers
    vars:
      notes: "Watched the talk on database branching. Want to try it for preview environments."
      event: "DevConf 2026"
    assert:
      - {type: llm-rubric, value: "Does not invent a speaker name, product name or recording link for the database branching talk."}
