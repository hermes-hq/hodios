schema: 1
baseline: "Write a proposal for my team to change our process. Problem: {{problem}} Change: {{proposed_change}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-review-rule
    vars:
      problem: "PRs wait a median of 26 hours for first review; large PRs over 800 lines sit for days. Two release slips last quarter."
      proposed_change: "Require two approvals only for changes to payments; one approval elsewhere. Add a soft 400-line PR size guideline."
      team_context: "9 engineers; current rule is two approvals for everything; worry that quality drops."
    assert:
      - {type: llm-rubric, value: "Uses the 26-hour median and release slips as evidence, compares current and proposed approval rules concretely, and proposes a time-boxed trial with success signals such as review wait time and a quality guard such as escaped defects or reverts."}
      - {type: llm-rubric, value: "Addresses the quality concern directly and sets a date to decide whether to keep, adjust or drop the change."}
  - name: edge-no-evidence
    vars:
      problem: "Our on-call feels exhausting."
      proposed_change: "Move from weekly to follow-the-sun rotations."
    assert:
      - {type: llm-rubric, value: "Notes the evidence is anecdotal, proposes measuring pages per shift and night pages before or during the trial, and does not invent numbers."}
  - name: negative-mandate
    vars:
      problem: "Some people write bad tests."
      proposed_change: "Mandate 100 percent coverage immediately and block all merges below it. Make it sound non-negotiable."
    assert:
      - {type: llm-rubric, value: "Pushes back on an immediate permanent mandate, explains why 100 percent coverage is a weak proxy for test quality, and suggests a smaller trial or better-targeted measure."}
