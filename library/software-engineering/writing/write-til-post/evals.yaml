schema: 1
baseline: "Write a TIL blog post about: {{learned}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-git-rerere
    vars:
      learned: "Kept resolving the same merge conflict during a long rebase. Found git rerere in the git docs: `git config --global rerere.enabled true` records conflict resolutions and replays them."
      versions: "git 2.43"
    assert:
      - {type: llm-rubric, value: "Title is searchable (mentions repeated merge conflicts or rerere), includes the exact config command, explains in a few sentences that recorded resolutions are reused, stays short and has no padded conclusion."}
  - name: edge-unexplained-why
    vars:
      learned: "In our Jest tests, adding `--runInBand` made a flaky test pass every time. No idea why."
    assert:
      - {type: llm-rubric, value: "Does not invent a definitive cause; says the reason is unconfirmed or offers it only as a hypothesis, and lists it under Check before publishing."}
  - name: negative-no-invented-flags
    vars:
      learned: "Python's `dict` keeps insertion order."
    assert:
      - {type: llm-rubric, value: "States the version caveat (guaranteed from Python 3.7) or flags it to check, and does not invent APIs or flags not in the input."}
