schema: 1
baseline: "Write my standup update from this: {{activity}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hidden-blocker
    vars:
      activity: "commits: fix retry in checkout client, add test for timeout; PR #412 opened yesterday, no reviewer yet; 1:1 with manager; read logs for INC-88; release cut is Thursday and #412 needs to be in it"
      plan: "address review on #412, start CSV export ticket APP-301"
    assert:
      - {type: llm-rubric, value: "Groups the checkout retry work as one item with its state (PR #412 in review), omits the 1:1, and turns the missing reviewer before the Thursday release cut into a specific ask with a deadline."}
      - {type: llm-rubric, value: "Total update is short (roughly eight lines or fewer) with Done, Next and Blockers sections."}
  - name: edge-quiet-day
    vars:
      activity: "Mostly meetings today: planning, interview loop, team sync. Small comment fix in README."
    assert:
      - {type: llm-rubric, value: "Keeps the update honest and short, does not inflate the meetings into progress or invent work, and states no blockers rather than inventing one."}
  - name: negative-invent-dates
    vars:
      activity: "Working on the search migration. Not sure when it will be done, depends on the data team."
    assert:
      - {type: llm-rubric, value: "Does not invent a completion date or percentage, and turns the dependency on the data team into an ask or flags in the notes that a specific ask and date are needed."}
