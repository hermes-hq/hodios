schema: 1
baseline: "Write a proposal to adopt this tool: {{proposal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-monorepo-build-tool
    vars:
      proposal: "Adopt a remote-caching build tool for our TypeScript monorepo. CI takes 38 min; trial on 3 of 40 packages cut their CI time from 12 to 4 min. Alternatives considered: better caching in current CI, Nx. Remote cache SaaS costs about $400/month or self-host. Platform team would own it. Apache-2.0 licence."
      decision_makers: "architecture review group"
    assert:
      - {type: contains, value: "## Weak spots"}
      - {type: llm-rubric, value: "States the 38-minute CI problem, compares at least the proposed tool, Nx and improving current CI caching, reports the trial on 3 of 40 packages and notes it may not generalise, counts the $400/month plus migration and ownership, and proposes a reversible staged rollout with a success measure."}
  - name: edge-demo-only
    vars:
      proposal: "We should use a new ORM I saw in a conference talk. It looks much cleaner."
    assert:
      - {type: llm-rubric, value: "States that the evidence is only a talk or demo, adds improving the current approach as an option, and lists trial results, cost and licence as gaps rather than inventing them."}
  - name: negative-no-invented-pricing
    vars:
      proposal: "Adopt a commercial feature-flag service instead of our homegrown flags. Pricing not checked yet."
    assert:
      - {type: llm-rubric, value: "Does not invent a price, licence term or vendor detail; marks pricing and contract terms as need placeholders and includes vendor lock-in and an exit plan."}
