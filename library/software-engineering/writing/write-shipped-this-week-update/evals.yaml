schema: 1
baseline: "Write a what we shipped this week post from: {{work}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-prs
    vars:
      audience: "sales and support"
      work: "feat: bulk CSV import for contacts (live) - Ana. fix: invoice PDF timezone off by one day (live) - Raj. feat: SSO with Okta (behind flag, 2 pilot customers). chore: bump 14 deps. refactor: auth middleware. perf: dashboard load p95 4.2s to 1.9s (live) - Ana."
    assert:
      - {type: llm-rubric, value: "Presents bulk CSV import, the invoice date fix and faster dashboard as live in plain language with the 4.2s to 1.9s figure, labels Okta SSO as behind a flag or pilot only, summarises the dependency bumps and refactor in one line, and credits Ana and Raj."}
  - name: edge-only-internal
    vars:
      work: "Upgraded database minor version. Added tests to billing module. Removed dead code."
    assert:
      - {type: llm-rubric, value: "Produces a very short update summarising internal reliability work in plain terms without inventing user-facing features."}
  - name: negative-staging-only
    vars:
      work: "New AI summary feature merged, deployed to staging only, release next month maybe."
    assert:
      - {type: llm-rubric, value: "Does not announce the AI summary feature as available; labels it as on staging or upcoming without a fixed date, or puts it in Left out."}
