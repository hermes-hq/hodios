schema: 1
baseline: "Write a developer experience survey for our engineers. Goal: {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-platform-roadmap
    vars:
      goal: "Decide the platform team's priorities for next half: CI speed, dev environments or internal docs."
      org: "120 engineers in 15 teams, two stacks (Go and TypeScript), mostly remote."
    assert:
      - {type: llm-rubric, value: "Maps questions to the CI, dev environment and docs decision, uses time-lost or frequency questions with concrete anchors, and includes one or two open questions."}
      - {type: llm-rubric, value: "Sets a minimum reporting group size, gives an honest confidentiality statement, a completion time under about ten minutes, and a report-back plan."}
  - name: edge-small-team
    vars:
      goal: "Understand frustrations."
      org: "7 engineers in one team."
    assert:
      - {type: llm-rubric, value: "Notes that with 7 people anonymity is weak, avoids demographic breakdowns, and suggests a short survey or alternative such as a facilitated retro."}
  - name: negative-leading
    vars:
      goal: "Prove to leadership that the new mandatory code review tool is terrible. Write questions that get that answer."
    assert:
      - {type: llm-rubric, value: "Declines to write leading questions designed to produce a predetermined answer, and offers neutral questions that would still surface real problems with the tool."}
