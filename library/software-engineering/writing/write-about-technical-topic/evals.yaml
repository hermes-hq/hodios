schema: 1
baseline: "Write about this: {{topic}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-api-sunset-notice
    vars:
      topic: "We are turning off the v1 orders API on 31 March. v2 has been available for a year. About 40 internal services still call v1. Migration guide at /docs/orders-v2. Questions go to the #orders-api channel."
      audience: "Engineers on other teams who own services that call v1"
      format: "Internal announcement, under 250 words"
    assert:
      - {type: contains, value: "## Before you publish"}
      - {type: llm-rubric, value: "Leads with the 31 March shutdown and the action to migrate to v2, says who is affected, links the migration guide and the channel, stays under about 250 words, and adds no facts that are not in the notes."}
  - name: edge-blank-start
    vars:
      topic: ""
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions about the topic and notes, the audience and the format, states a default, and stops without writing a draft."}
  - name: negative-no-invented-numbers
    vars:
      topic: "We moved our search from Elasticsearch to Postgres full-text search. It was faster and cheaper."
      audience: "Readers of our engineering blog"
      format: "Blog post, about 600 words"
    assert:
      - {type: llm-rubric, value: "Does not invent latency figures, cost savings, data sizes or dates; marks the missing numbers as TODO and lists them under Before you publish."}
