schema: 1
baseline: "Write an answer to this question: {{question}}. The answer is: {{my_answer}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-python-default-arg
    vars:
      question: "Why does my function keep adding to the same list? def add(item, items=[]): items.append(item); return items. Calling add(1) then add(2) returns [1, 2]."
      my_answer: "Default args are evaluated once at definition time. Use items=None and create a new list inside. Tested on Python 3.12."
    assert:
      - {type: llm-rubric, value: "Leads with the fix (use None as default and create the list inside), shows the corrected function, explains evaluation at definition time, mentions it applies to all Python 3 versions or the tested 3.12, and has no greeting or sign-off."}
  - name: edge-xy-problem
    vars:
      question: "How do I parse the HTML of a page with regex to get all links?"
      my_answer: "Use an HTML parser like BeautifulSoup's find_all('a'). Tested with bs4 4.12."
    assert:
      - {type: llm-rubric, value: "Addresses the regex request briefly and explains why an HTML parser is the better fix, shows a minimal BeautifulSoup example using find_all('a'), and lists items to verify before posting."}
  - name: negative-answer-mismatch
    vars:
      question: "My React useEffect runs twice in development. Why?"
      my_answer: "You need to add the dependency array."
    assert:
      - {type: llm-rubric, value: "Flags under Before posting that the supplied answer may not address the question (the double run in development is commonly due to Strict Mode) or marks it to verify, rather than confidently posting the dependency array explanation as the cause."}
