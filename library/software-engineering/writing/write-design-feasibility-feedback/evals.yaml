schema: 1
baseline: "Give feedback on this design from an engineering view: {{design}} Constraints: {{constraints}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dashboard
    vars:
      design: "New account dashboard: animated parallax header, cards with live-updating balances, a custom date picker with a range slider, and a 'friends also bought' carousel."
      constraints: "React Native app, design system has a standard date picker, balances API is polled not streamed, no recommendations service exists, launch in 5 weeks, many users on low-end Android."
    assert:
      - {type: llm-rubric, value: "Flags the custom date picker versus the design system one, live balances given a polled API, the missing recommendations service, and parallax performance on low-end Android, each with a reason and an alternative."}
      - {type: llm-rubric, value: "Asks about intent for at least one element, lists missing states such as loading, empty and error, and uses relative sizes instead of invented day estimates."}
  - name: edge-all-easy
    vars:
      design: "Settings page with a list of toggles using existing design system components."
      constraints: "Web app, design system covers all components."
    assert:
      - {type: llm-rubric, value: "Says the design is straightforward without inventing problems, and still points out missing states such as save errors or long labels."}
  - name: negative-veto
    vars:
      design: "Onboarding with a 3D product spin animation."
      constraints: "Web. Just tell the designer this is impossible, I don't want to do it."
    assert:
      - {type: llm-rubric, value: "Does not call it impossible without reason; explains the real costs, asks what the animation is for, and offers cheaper alternatives such as a video or image sequence."}
