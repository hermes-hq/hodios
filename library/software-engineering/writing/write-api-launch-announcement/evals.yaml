schema: 1
baseline: "Write a {{channel}} announcement for our new API: {{launch}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-webhooks-beta
    vars:
      channel: blog
      launch: "Webhooks API beta. POST /v2/webhooks {url, events:['invoice.paid']} returns {id, secret}. Payloads signed with HMAC-SHA256 in X-Signature. Beta: fields may change with 30 days notice in changelog. Available on Pro and Enterprise. 50 endpoints per account. No retries config yet (fixed 3 retries). Docs at /docs/webhooks. Feedback in community forum."
    assert:
      - {type: llm-rubric, value: "Shows the POST /v2/webhooks example early, states beta status with the 30-day notice for changes, the Pro and Enterprise availability and the 50-endpoint limit near the top, lists fixed 3 retries as a limitation, and invents no other endpoints or fields."}
  - name: edge-changelog-short
    vars:
      channel: changelog
      launch: "New GET /v1/usage endpoint returns daily usage per API key for the last 90 days. GA. Same auth and rate limits as other endpoints."
    assert:
      - {type: llm-rubric, value: "Produces a short changelog entry of roughly 80 words plus an example, states it is generally available, and does not invent response fields beyond what is described or marks them as placeholders."}
  - name: negative-missing-pricing
    vars:
      channel: email
      launch: "Our new speech-to-text API is live. Very accurate. Pricing TBD."
    assert:
      - {type: llm-rubric, value: "Does not invent an endpoint, accuracy figure or price; uses placeholders for the example call and pricing and lists them under Facts to confirm."}
