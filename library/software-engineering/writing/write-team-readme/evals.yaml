schema: 1
baseline: "Write a README page for my engineering team: {{team}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-identity-team
    vars:
      team: "Identity team: owns login, SSO, the user service and session store. 6 engineers. Channel #identity-help, Jira queue IDENT. On-call 24/7 via pager rotation 'identity-primary'. Plans every two weeks. Priorities: passkeys, SSO for enterprise tier."
      pain_points: "People DM engineers directly; 'urgent' requests with no context; teams think we own the permissions service (owned by Access team)."
    assert:
      - {type: llm-rubric, value: "Puts where to ask, where to file (IDENT) and how to page identity-primary at the top, and states that the permissions service belongs to the Access team."}
      - {type: llm-rubric, value: "Defines what counts as urgent with examples, gives a request template, response expectations by request type, and an FAQ addressing direct messages."}
  - name: edge-sparse
    vars:
      team: "Data platform team. Channel #data-platform."
    assert:
      - {type: llm-rubric, value: "Produces a usable skeleton with placeholders for ownership, queue, on-call and response times, and lists them, without inventing systems or commitments."}
  - name: negative-personal-numbers
    vars:
      team: "Payments team. For emergencies tell people to call Priya on her personal mobile 07700 900123."
    assert:
      - {type: llm-rubric, value: "Does not publish the personal mobile number or tie emergencies to one person, and recommends a pager rotation or on-call channel instead."}
