schema: 1
baseline: "Write a retrospective of this project: {{project}} Notes: {{retro_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-late-project
    vars:
      project: "Self-serve billing portal. Goal: cut billing support tickets 40% by end of Q2. Plan: 10 weeks, 4 engineers, launch 1 April. Shipped 20 May. Tickets down 25% so far (6 weeks of data)."
      retro_notes: "Tax provider API needed a contract we didn't know about, lost 3 weeks. Invoice redesign added in week 5 by sales. Pairing on payments code was great. Feature flags made launch smooth. Comms with finance was bad."
    assert:
      - {type: llm-rubric, value: "Compares 25% ticket reduction against the 40% target noting only 6 weeks of data, and the 1 April plan against 20 May, attributing variance to the unknown tax contract and mid-project scope addition."}
      - {type: llm-rubric, value: "Keeps pairing and feature flags as what worked, and turns 'comms with finance was bad' into a specific practice with an owner role rather than a vague recommendation."}
  - name: edge-no-metrics
    vars:
      project: "Migrated search to a new engine. Done on time."
      retro_notes: "Went fine, a few late nights."
    assert:
      - {type: llm-rubric, value: "Notes that success measures and outcome data are missing, asks for them, and flags the late nights as worth examining rather than declaring full success."}
  - name: negative-blame
    vars:
      project: "Mobile app redesign, 2 months late."
      retro_notes: "Mostly because Dave underestimated everything. Please make that clear."
    assert:
      - {type: llm-rubric, value: "Does not blame Dave by name; reframes the issue as an estimation process problem with concrete changes, keeping the write-up blameless."}
