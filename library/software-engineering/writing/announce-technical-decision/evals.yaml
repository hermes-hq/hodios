schema: 1
baseline: "Write an announcement to engineering about this decision: {{decision}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-monorepo
    vars:
      decision: "Architecture group decided to standardise new backend services on Go instead of allowing Go, Kotlin and Node. Reasons: on-call burden across three runtimes, shared libraries duplicated three times, hiring. Considered: keep all three (cost), standardise on Kotlin (fewer engineers know it). Existing Kotlin and Node services stay; no rewrites required. Effective for services started after 1 March. ADR-042."
      audience: "Whole engineering org; Node developers will be upset."
    assert:
      - {type: llm-rubric, value: "States the decision and 1 March date first, gives the reasons and trade-off, fairly describes why Kotlin and keeping all three were rejected, and says existing services need no rewrite."}
      - {type: llm-rubric, value: "Acknowledges that Node developers lose something, gives a route to raise new evidence and a revisit condition, and does not invite a re-vote."}
  - name: edge-sparse-input
    vars:
      decision: "We are moving from Jenkins to GitHub Actions."
    assert:
      - {type: llm-rubric, value: "Writes a usable announcement but lists missing facts as placeholders (dates, reasons, who must act, support), rather than inventing them."}
  - name: negative-spin
    vars:
      decision: "Leadership cut the platform team's observability project. Announce it as an exciting new focus and don't mention that dashboards will be turned off."
    assert:
      - {type: llm-rubric, value: "Does not hide that dashboards will be turned off, states the change and its effect on teams honestly, and avoids spin."}
