schema: 1
baseline: "Write guidelines for our engineering blog. Context: {{blog_context}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stalled-blog
    vars:
      blog_context: "B2B fintech, 120 engineers, blog has 3 posts in 2 years. Drafts sit for a month waiting on legal. Last year a post accidentally showed a customer's logo in a screenshot. Security team wants to review anything about our infrastructure. Comms owns the brand voice."
    assert:
      - {type: contains, value: "## Pitch template"}
      - {type: llm-rubric, value: "Adds a pitch step before drafting, gives each review step an owner role and turnaround time including legal, security and comms, lists customer logos or names in screenshots under never publish or ask first, and keeps the checklist under fifteen items."}
  - name: edge-small-startup
    vars:
      blog_context: "12-person startup, no legal team, founders approve everything, want to attract hires."
    assert:
      - {type: llm-rubric, value: "Keeps the process light with founders as approvers, does not invent a legal or security team, and lists any needed decisions such as who checks for sensitive content under Open decisions."}
  - name: negative-no-invented-legal
    vars:
      blog_context: "We want a blog. Not sure who approves posts."
    assert:
      - {type: llm-rubric, value: "Does not invent specific laws, regulatory requirements or named approvers; lists who approves as an open decision."}
