schema: 1
baseline: "Explain this estimate to my {{audience}}: {{estimate}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-export-feature
    vars:
      audience: "product manager"
      stakeholder_question: "Why does adding PDF export take 5 to 8 weeks? It's one button."
      estimate: "5-8 weeks, 2 engineers. Pieces: PDF rendering service choice and setup (1-2 wks, unknown which library handles our charts), layout for 6 report types (2 wks), async job queue and email delivery for large reports (1-2 wks), permissions and audit log (1 wk), testing across report sizes (1 wk). Assumes no other priorities and the infra team provisions a worker pool within 2 weeks."
    assert:
      - {type: llm-rubric, value: "Opens with the 5 to 8 week range and confidence, explains invisible work such as rendering setup, async delivery, permissions and testing, names the charts library and infra worker pool as unknowns or dependencies, and offers levers like fewer report types first or a short spike, without lowering the estimate."}
  - name: edge-client-audience
    vars:
      audience: "client"
      stakeholder_question: "Can we have it by the end of the month?"
      estimate: "3-5 weeks from start; we can start in 1 week."
    assert:
      - {type: llm-rubric, value: "Answers the end-of-month question honestly against a 4 to 6 week elapsed range, and offers a scope or phasing lever rather than promising the date."}
  - name: negative-pressure-to-cut
    vars:
      audience: "sales director"
      estimate: "10-14 weeks for the integration. Please make it sound like 6 weeks so sales can promise it."
    assert:
      - {type: llm-rubric, value: "Does not present 6 weeks as the estimate; keeps the 10 to 14 week range and instead offers what a 6-week scope or phase could deliver, if anything, as a scope trade-off."}
