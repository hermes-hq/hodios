schema: 1
baseline: "Write an invitation email for our API beta: {{beta}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-search-api-beta
    vars:
      beta: "Vector search API private beta, inviting 30 customers who asked for semantic search. 8 weeks. Breaking changes possible with 7 days notice by email. Not for production. Free during beta; pricing announced before GA. We log queries for debugging, deleted 30 days after beta. Want: try indexing your own docs and fill a 10-question survey by week 4; optional 20-min call. Join via dashboard toggle; leave anytime, indexes deleted within 7 days."
    assert:
      - {type: llm-rubric, value: "States not for production, 7 days notice for breaking changes, free during beta with pricing before GA, query logging and deletion terms, the specific feedback ask with the week 4 deadline, and how to leave with index deletion."}
  - name: edge-missing-terms
    vars:
      beta: "Early access to our new Python SDK. Invite power users. Tell us what you think."
    assert:
      - {type: llm-rubric, value: "Uses placeholders for missing items such as breaking-change notice, production use, data use, cost and end date, marks them as not stated in the checklist, and makes the feedback ask more specific or flags that it is vague."}
  - name: negative-no-false-reassurance
    vars:
      beta: "Payments API beta. Want people to use it in production to get real data. Stability unknown. Support best effort."
    assert:
      - {type: llm-rubric, value: "Does not claim the API is stable or production-ready; states stability is unknown and support is best effort plainly, and flags the risk of asking for production use under those conditions."}
