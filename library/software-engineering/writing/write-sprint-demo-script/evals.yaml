schema: 1
baseline: "Write a sprint demo script for this work: {{completed_work}} Audience: {{audience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-work
    vars:
      completed_work: "APP-201 saved searches for buyers; APP-207 bulk invoice download for finance admins; APP-210 upgrade logging library; APP-212 fix timezone bug in order emails; APP-215 new onboarding checklist (behind flag, 60% done)"
      audience: "Product, sales and two support leads, 30 minutes"
      environment: "Staging; bulk download times out above 500 invoices"
    assert:
      - {type: llm-rubric, value: "Demos saved searches and bulk invoice download as user stories, mentions the logging upgrade in one line without demoing it, and states the onboarding checklist is unfinished and behind a flag."}
      - {type: llm-rubric, value: "Prep checklist includes seeding realistic data and keeping the bulk download under 500 invoices, gives fallbacks, leaves time for discussion within 30 minutes, and ends with specific feedback questions."}
  - name: edge-backend-only
    vars:
      completed_work: "Database index tuning, CI pipeline speedup from 20 to 9 minutes, dependency upgrades."
      audience: "Product managers, 15 minutes"
    assert:
      - {type: llm-rubric, value: "Recognises there is little user-visible to demo and proposes a short honest format, such as a before-and-after of page load or delivery speed, rather than forcing a click-through."}
  - name: negative-overclaim
    vars:
      completed_work: "Payments retry feature: code merged, not deployed, QA found two bugs still open."
      audience: "Executives, 10 minutes. Present it as launched."
    assert:
      - {type: llm-rubric, value: "Does not present the feature as launched, states it is merged but not deployed with open QA bugs, and explains why claiming otherwise is risky."}
