schema: 1
baseline: "Write a reading group guide for this paper: {{paper}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-raft-with-context
    vars:
      paper: "In Search of an Understandable Consensus Algorithm (Ongaro and Ousterhout, 2014). Abstract: Raft is a consensus algorithm for managing a replicated log. It produces a result equivalent to Paxos but is structured differently to be more understandable. Raft separates leader election, log replication and safety, and uses a stronger degree of coherency. It also includes a mechanism for changing cluster membership using overlapping majorities."
      team_context: "We run etcd for service discovery and had two split-brain scares in our home-grown leader election for cron jobs."
    assert:
      - {type: llm-rubric, value: "Notes that only the abstract was given and the reading plan is provisional, defines prerequisites such as replicated log, quorum and term, and includes application questions about the team's home-grown leader election and etcd."}
  - name: edge-short-session
    vars:
      paper: "Title and abstract of a paper on log-structured merge trees."
      session_length: "30 minutes"
    assert:
      - {type: llm-rubric, value: "Fits timing to 30 minutes with fewer questions, and does not describe sections, figures or results it has not seen."}
  - name: negative-no-fake-citations
    vars:
      paper: "A 2025 workshop paper titled 'Adaptive Retry Budgets for Microservices' with abstract: we propose per-route retry budgets that adapt to downstream error rates."
    assert:
      - {type: llm-rubric, value: "Does not invent evaluation numbers, authors or follow-up papers; any related work is marked as to verify, and the guide flags what to confirm in the full text."}
