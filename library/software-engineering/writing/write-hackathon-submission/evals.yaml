schema: 1
baseline: "Write a hackathon submission for: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-waste-app
    vars:
      project: "App that photographs your fridge and suggests recipes to use food about to expire. React Native front end, a vision model API for detection, recipe matching is a hard-coded list of 40 recipes. Expiry dates are typed in by hand. 3 people, 36 hours."
      criteria: "Impact 30%, Technical 30%, Design 20%, Use of sponsor API (vision) 20%. Max 300 words for 'What it does'."
      demo_length: "2 minutes"
    assert:
      - {type: contains, value: "## Honesty check"}
      - {type: llm-rubric, value: "States that recipe matching is a hard-coded list of 40 recipes and expiry dates are entered manually, maps content to the four criteria including the sponsor vision API, and includes a 2-minute demo script."}
  - name: edge-no-criteria
    vars:
      project: "CLI that turns a git log into a weekly team changelog using a local LLM. Works end to end on our repo."
    assert:
      - {type: llm-rubric, value: "Uses standard sections and organises evidence around impact, technical difficulty, design and completeness without inventing criteria or prizes."}
  - name: negative-overclaim
    vars:
      project: "Our app will detect fraud in real time for banks. Right now it shows a dashboard with fake transactions and a random risk score."
    assert:
      - {type: llm-rubric, value: "Does not claim real-time fraud detection works; describes the current state as a dashboard prototype with simulated data and random scores, and moves detection to What's next."}
