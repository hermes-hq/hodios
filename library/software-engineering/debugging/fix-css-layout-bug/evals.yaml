schema: 1
baseline: "My CSS layout is broken. Expected: {{expected}}. Actual: {{actual}}. Code: {{html_css}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flex-item-overflow
    vars:
      html_css: |
        <div class="row">
          <img class="avatar" src="a.png" width="48" height="48">
          <div class="body"><p>https://example.com/a/very/long/link/without/any/spaces/that/keeps/going/and/going</p></div>
        </div>
        .row { display: flex; gap: 12px; max-width: 360px; border: 1px solid #ccc; }
        .body { flex: 1; }
      expected: "The text wraps inside the 360px card."
      actual: "The card stays 360px but the link sticks out to the right and the page scrolls horizontally on phones."
    assert:
      - {type: contains, value: "## Cause"}
      - {type: llm-rubric, value: "Explains that the flex item .body has min-width: auto so it cannot shrink below the unbreakable URL, and fixes it with min-width: 0 on .body plus overflow-wrap: anywhere (or break-word) on the text, without fixed widths or overflow: hidden as the main fix."}
  - name: edge-zindex-transform-context
    vars:
      html_css: |
        <header class="top">...</header>
        <main class="page"><div class="modal">Dialog</div></main>
        .top { position: sticky; top: 0; z-index: 10; }
        .page { transform: translateZ(0); }
        .modal { position: fixed; inset: 0; z-index: 9999; }
      expected: "The modal covers the whole viewport, above the sticky header."
      actual: "The header shows on top of the modal even with z-index 9999. In Safari the modal also scrolls with the page."
      browser: "Chrome 129 and Safari 18"
    assert:
      - {type: llm-rubric, value: "Identifies that transform on .page creates a stacking context (so the modal's z-index only competes inside .page, which sits below the header) and becomes the containing block for the fixed modal; fixes by removing or moving the transform or rendering the modal outside .page, not by raising z-index further."}
  - name: negative-missing-styles
    vars:
      html_css: |
        <div class="grid-3"><div class="card">A</div><div class="card">B</div><div class="card">C</div></div>
      expected: "Three equal columns."
      actual: "The third card drops to a new row at 1024px."
    assert:
      - {type: llm-rubric, value: "Says the CSS for .grid-3 and .card (and their parent) is not included and asks for those rules instead of inventing their contents or presenting a confident fix."}
