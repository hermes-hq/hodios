schema: 1
baseline: "Give me a buggy program and let me debug it."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-java-random
    vars:
      language: Java
      bug_class: random
    assert:
      - {type: contains, value: "Case file"}
      - {type: llm-rubric, value: "Presents a user-style bug report with steps, expected and actual results, a line-numbered Java program of moderate size, explains how to request runs, logs, values and history, and keeps the root cause only inside the collapsed case file."}
  - name: edge-concurrency
    vars:
      language: "JavaScript (Node)"
      bug_class: concurrency
    assert:
      - {type: llm-rubric, value: "The bug report describes an intermittent failure (for example happens sometimes under load), consistent with a race or ordering bug in async code, without naming the cause in visible text."}
  - name: negative-missing-language
    vars:
      language: ""
      bug_class: logic
    assert:
      - {type: llm-rubric, value: "Asks which programming language to use and stops without generating a program."}
