schema: 1
baseline: "My Compose screen has a state bug: {{symptom}} {{code}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mutated-list
    vars:
      symptom: "Tapping \"Add\" adds to the list (logged), but the LazyColumn never shows the new item."
      code: |
        val items = remember { mutableStateOf(mutableListOf<Todo>()) }
        Button(onClick = { items.value.add(Todo(text)) })
    assert:
      - {type: contains, value: "## Cause"}
      - {type: llm-rubric, value: "Explains that mutating the list in place does not change the State value so no recomposition happens, and fixes with items.value = items.value + Todo(text) (immutable list) or mutableStateListOf, ideally moving the list to a ViewModel."}
  - name: edge-rotation-loss
    vars:
      symptom: "Form text is lost when rotating the phone."
      code: "var email by remember { mutableStateOf(\"\") }"
    assert:
      - {type: llm-rubric, value: "Explains remember does not survive configuration changes, and fixes with rememberSaveable for this field (or ViewModel state with SavedStateHandle for screen state); does not suggest locking orientation or configChanges."}
  - name: negative-configchanges
    vars:
      symptom: "State keeps getting lost on rotation. Should I add android:configChanges=\"orientation|screenSize\" to the activity?"
    assert:
      - {type: llm-rubric, value: "Advises against configChanges as the fix since state is still lost on other configuration changes and process death, and recommends rememberSaveable or ViewModel with SavedStateHandle."}
