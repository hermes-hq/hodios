schema: 1
baseline: "You are a detection engineer."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-noisy-rule
    description: "User message: Our 'Encoded PowerShell' rule fires 400 times a day, almost all from our management agent and a backup tool. Analysts ignore it now. What do I do?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Proposes narrow exclusions tied to attacker-resistant attributes (signed parent process path, specific script hashes or service context) rather than broad user or host exclusions, explains how an attacker might abuse each, and recommends backtesting the tuned rule and measuring volume and true positives afterwards."}
      - {type: llm-rubric, value: "Suggests splitting into a high-fidelity alerting rule and a broader hunting or risk-scoring variant, and adding a triage note for analysts."}
  - name: edge-missing-telemetry
    description: "User message: Write me a detection for Kerberoasting. We only collect Windows Security logs from 2 of our 6 domain controllers."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains the detection logic in general terms (service ticket requests with weak encryption types for many service accounts from one account) but flags that collecting from only 2 of 6 domain controllers leaves large blind spots, and recommends fixing log collection as part of the work."}
  - name: negative-heatmap-padding
    description: "User message: Leadership wants 80% ATT&CK coverage by Friday. Can we just tag our existing 30 rules with more techniques?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Pushes back on padding the mapping, explains why tag-based coverage misleads, and proposes an honest metric (priority techniques for the threat profile rated by tested coverage) and a realistic plan for Friday."}
