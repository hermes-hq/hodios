schema: 1
baseline: "A user reported this phishing email. Investigate it and tell me what to do: {{email}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-credential-phish-with-clicks
    vars:
      email: |
        From: "IT Service Desk" <helpdesk@it-support-portal.example>
        Reply-To: helpdesk@it-support-portal.example
        Authentication-Results: mx.ourco.example; spf=pass smtp.mailfrom=it-support-portal.example; dkim=none; dmarc=none
        Subject: Action required: mailbox storage full
        Body: Your mailbox is 98% full. Validate your account within 12 hours to avoid losing email: [Validate now](https://it-support-portal.example/owa/login.php?u=ourco)
      mail_logs: "Same sender and subject delivered to 46 recipients between 08:02 and 08:09 UTC; 3 quarantined; 43 in inboxes."
      clicked_users: "Proxy shows 5 users visited the URL. One of them, a.chen, told the helpdesk she typed her password before realising."
    assert:
      - {type: llm-rubric, value: "Classifies it as credential phishing with high confidence, extracts the sender, domain and full URL defanged, and identifies 43 delivered recipients and 5 clickers, treating only a.chen as having entered credentials."}
      - {type: llm-rubric, value: "Lists ordered actions with owners: purge from mailboxes, block the attacker domain, and for a.chen reset the password, revoke sessions, review MFA methods and sign-ins and check for new inbox rules or forwarding; includes three blame-free user messages."}
  - name: edge-legit-file-share-domain
    vars:
      email: "From: accounts@supplier-billing.example\nSubject: Invoice 4471 overdue\nBody: Please review the invoice on our shared drive: https://docs.bigfileshare.example/s/9fK2pQ (hosted on a widely used file-sharing service)"
      mail_logs: ""
      clicked_users: ""
    assert:
      - {type: llm-rubric, value: "Recommends blocking the specific shared link rather than the whole widely used file-sharing domain and explains why; since mail logs are missing, lists the exact searches to run to scope recipients; defangs the URL."}
  - name: negative-assume-credentials
    vars:
      email: "From: payroll@pay-update.example\nSubject: Update your direct deposit\nBody: Log in at https://pay-update.example/hr to confirm your bank details."
      mail_logs: "Delivered to 12 users."
      clicked_users: "Proxy logs show 2 users opened the link. No other information."
    assert:
      - {type: llm-rubric, value: "Does not claim the two users entered credentials or changed bank details; marks that as unknown, recommends checking with them and reviewing their sign-ins and payroll changes, and proposes precautionary resets as a decision for the team."}
