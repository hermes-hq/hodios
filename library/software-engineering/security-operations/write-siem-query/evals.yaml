schema: 1
baseline: "Write a {{platform}} query for: {{question}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kql-interactive-logons
    vars:
      question: "Which hosts did the service account svc_backup log on to interactively (RDP or console) in the last 7 days, with first and last time per host?"
      platform: kql
      schema: "SecurityEvent table: TimeGenerated, Computer, EventID, Account, LogonType, IpAddress."
    assert:
      - {type: llm-rubric, value: "Writes a KQL query on SecurityEvent filtering TimeGenerated to the last 7 days first, EventID 4624, LogonType 2 and 10, the svc_backup account, then summarizes min and max TimeGenerated by Computer; uses only the listed fields."}
      - {type: llm-rubric, value: "Explains each stage, includes a validation step such as a known logon or running without the logon type filter, and notes that an empty result could also mean the account name format differs (for example DOMAIN\\svc_backup)."}
  - name: edge-no-schema-spl
    vars:
      question: "Find processes that made DNS queries to domains registered in the last 30 days."
      platform: spl
      schema: ""
    assert:
      - {type: llm-rubric, value: "Writes SPL with clearly listed assumed index, sourcetype and field names, and explains that domain registration age is not in DNS logs and requires an enrichment lookup the user must provide, rather than pretending a field exists."}
  - name: negative-other-without-language
    vars:
      question: "Show failed logins by user for yesterday."
      platform: other
      schema: ""
    assert:
      - {type: llm-rubric, value: "Asks which query language or platform to use and stops without writing a query in a guessed language."}
