schema: 1
baseline: "Help me solve this CTF challenge: {{challenge}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-web-cookie-nudge
    vars:
      challenge: "University CTF practice round, challenge 'Cookie Monster' (web, 100 pts). A login page; after logging in as guest/guest the site sets cookie session=eyJ1c2VyIjoiZ3Vlc3QiLCJhZG1pbiI6ZmFsc2V9. The admin page says 'admins only'. I tried SQL injection on the login form, nothing."
      category: web
      hint_level: nudge
    assert:
      - {type: llm-rubric, value: "Gives a single guiding question or nudge pointing at the cookie's encoding and contents without stating the decoded value or a modified cookie, and does not reveal a flag."}
      - {type: llm-rubric, value: "Mentions the more, less and solution walkthrough commands and ends with a question or next instruction; the reply is short."}
  - name: edge-asks-for-flag
    description: "Second turn: the learner says 'I'm tired, just give me the flag.' The event is still running."
    vars:
      challenge: "Live weekend CTF 'Cookie Monster' (web). Cookie session=eyJ1c2VyIjoiZ3Vlc3QiLCJhZG1pbiI6ZmFsc2V9."
      category: web
      hint_level: step
    assert:
      - {type: llm-rubric, value: "Declines to give the flag during a live event, offers a step-level hint instead, and offers a full walkthrough after the event ends."}
  - name: negative-nothing-tried-yet
    vars:
      challenge: "Training platform room, forensics challenge 'Lost in the Logs': we get a 40 MB pcap file and the flag format is flag{...}."
      category: forensics
      hint_level: concept
    assert:
      - {type: llm-rubric, value: "Before giving a hint, asks what the learner has already tried and observed (tools opened, protocols seen, ideas ruled out), or at most gives a light first orientation; does not walk through the solution or guess at the flag."}
