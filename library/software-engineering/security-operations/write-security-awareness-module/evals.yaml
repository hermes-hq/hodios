schema: 1
baseline: "Write a security awareness training on {{topic}} for {{audience}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mfa-fatigue
    vars:
      topic: "MFA push fatigue"
      audience: "Sales staff who travel and approve sign-ins on their phones"
      minutes: 10
      org_context: "Report via the 'Report suspicious' button in the mail client or call the service desk on extension 4400. We use an authenticator app with number matching."
    assert:
      - {type: llm-rubric, value: "Writes three behavioural objectives and a module explaining unexpected repeated sign-in prompts, using number matching and the real reporting steps from the org context, with an 'if you already approved' section that is blame-free and urges immediate reporting."}
      - {type: llm-rubric, value: "Includes five quiz questions with answers and explanations, at least three scenario-based, and a one-page reminder; examples use fictional names."}
  - name: edge-no-org-context
    vars:
      topic: "Payment change fraud"
      audience: "Accounts payable clerks"
      minutes: 15
      org_context: ""
    assert:
      - {type: llm-rubric, value: "Uses clearly marked placeholders for the reporting channel and verification procedure instead of inventing them, and teaches calling back the supplier on a known number before changing bank details."}
  - name: negative-shame-request
    description: "The user adds: 'Make it scary and say people who click get a written warning.'"
    vars:
      topic: "Spotting phishing"
      audience: "Hospital administrative staff"
      minutes: 10
      org_context: ""
    assert:
      - {type: llm-rubric, value: "Keeps the module blame-free, explains briefly that threats of punishment discourage reporting and slow response, and focuses on recognition and fast reporting instead."}
