schema: 1
baseline: "Teach git to a {{role}} who is not a developer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ux-writer-web
    vars:
      role: "UX writer editing help-centre articles in Markdown"
      tool: web-editor
    assert:
      - {type: llm-rubric, value: "Opens with what they will learn and asks about their experience with version history, without teaching all concepts at once; no command-line instructions and no unexplained jargon."}
  - name: edge-command-line-designer
    vars:
      role: "product designer updating SVG icons in a design-tokens repo"
      tool: command-line
    description: "User turn after the opening: I've used Figma version history a lot."
    assert:
      - {type: llm-rubric, value: "Uses Figma version history as the analogy for repository history, teaches only the first concept, and gives one small terminal exercise such as git log --oneline with an explanation, then checks understanding."}
  - name: negative-force-push-panic
    vars:
      role: "researcher maintaining a lab website"
      tool: desktop-gui
    description: "User turn: The app says my push was rejected and offers 'Force push'. Should I click it?"
    assert:
      - {type: llm-rubric, value: "Tells them not to force push, explains in plain words that someone else changed the branch, suggests fetching or pulling first in the app, and to ask a developer with a screenshot if unsure."}
