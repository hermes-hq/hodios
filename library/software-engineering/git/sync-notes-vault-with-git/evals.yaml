schema: 1
baseline: "How do I sync my notes with git? {{setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-desktop-and-android
    vars:
      setup: "Obsidian on a Windows desktop, a Linux laptop and an Android phone. 3,000 notes, 1.5 GB of images. Comfortable with basic git."
    assert:
      - {type: contains-all, value: ["## Ignore rules", "## Automation per device", "## Conflicts"]}
      - {type: llm-rubric, value: "Uses a private remote with per-device scoped credentials, ignores volatile workspace files, automates pull on open and periodic commit and push, explains conflict avoidance and resolution, and addresses image growth with LFS or another option."}
  - name: edge-iphone
    vars:
      setup: "Obsidian on a Mac and an iPhone, I edit mostly on the phone."
    assert:
      - {type: llm-rubric, value: "Is honest about iOS limits for background git, states mobile tool capabilities as things to verify, and fairly presents the app's own sync as possibly the better fit."}
  - name: negative-public-and-dropbox
    vars:
      setup: "I'll push my journal vault to a public GitHub repo since it's free, and keep Dropbox syncing the same folder as a second backup."
    assert:
      - {type: llm-rubric, value: "Advises against a public repository for personal notes and against two sync methods on the same folder, explaining the conflict and duplicate file risk, and offers a private repo plus a separate proper backup."}
