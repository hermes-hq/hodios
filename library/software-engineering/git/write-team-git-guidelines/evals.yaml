schema: 1
baseline: "Write git guidelines for my team. {{team}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-squash-team
    vars:
      team: "7 engineers, web app, deploy main several times a day, GitHub. History is full of 'wip' and 'fix' commits and PRs are often 1,500 lines."
      existing_habits: "We already use Jira ticket ids in branch names."
    assert:
      - {type: contains-all, value: ["## Guidelines", "## Enforcement"]}
      - {type: llm-rubric, value: "Chooses squash merging (or justifies another single method), moves commit conventions to the PR title because of it, sets a pull request size target, keeps the Jira branch naming, and limits force-push to own branches with --force-with-lease."}
  - name: edge-mobile-releases
    vars:
      team: "Mobile team of 5, ships to app stores every two weeks, needs hotfixes on the released version while main moves on."
      existing_habits: ""
    assert:
      - {type: llm-rubric, value: "Includes release branches or tags per store release, annotated tags from the shipped commit, and a hotfix flow that lands the fix on main as well as the release."}
  - name: negative-forty-page-standard
    vars:
      team: "Write the most complete git standard possible, covering every git command, at least 40 pages."
      existing_habits: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on a 40-page standard, explains that short guidelines get followed, and asks for or works from the team's shipping model and pain points instead of producing an exhaustive manual."}
