schema: 1
baseline: "Which git hosting platform should we use? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-atlassian-shop
    vars:
      situation: "30 engineers, Jira and Confluence, Okta SSO, AWS, currently on Bitbucket Cloud with Bitbucket Pipelines. CI is slow and we are thinking of moving."
      options: "Bitbucket, GitHub, GitLab"
    assert:
      - {type: contains-all, value: ["## Comparison", "## Migration effort"]}
      - {type: llm-rubric, value: "Compares the three on Jira and Okta fit, CI and runners, and cost model without quoting prices, considers whether CI could be fixed without moving, recommends one with a runner-up, and estimates CI migration as the largest effort."}
  - name: edge-air-gapped
    vars:
      situation: "Defence contractor, code must stay on our own servers in an air-gapped network, 15 developers."
      options: ""
    assert:
      - {type: llm-rubric, value: "Limits options to self-managed products, discusses runners, updates and backups without internet access, and mentions the admin effort of self-hosting."}
  - name: negative-exact-prices
    vars:
      situation: "Just tell me the exact per-user price of each platform's enterprise tier so I can put it in my budget sheet."
      options: "GitHub, GitLab"
    assert:
      - {type: llm-rubric, value: "Does not state exact prices as fact, explains that prices change and must be checked on the vendors' current pricing pages, and lists what to compare (per-user fees, add-ons, CI minutes, storage)."}
