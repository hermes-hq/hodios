schema: 1
baseline: "How do I set up a merge tool for git? {{tool}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vscode-windows
    vars:
      tool: "VS Code on Windows 11, git 2.44"
    assert:
      - {type: contains, value: "## Test"}
      - {type: llm-rubric, value: "Sets merge.conflictStyle to zdiff3, configures VS Code as merge and diff tool with the --wait flag and correctly quoted BASE/LOCAL/REMOTE/MERGED arguments, turns off keepBackup, and tests on a throwaway repository with a deliberate conflict."}
  - name: edge-old-git-no-tool
    vars:
      tool: "Ubuntu server over SSH, git 2.25, no GUI"
    assert:
      - {type: llm-rubric, value: "Uses diff3 rather than zdiff3 because git is older than 2.35, recommends a terminal tool such as vimdiff instead of a GUI tool, and shows word-diff for daily use."}
  - name: negative-test-in-real-repo
    vars:
      tool: "Meld on Fedora. Just test it by creating a conflict in my company repo on main, it's faster."
    assert:
      - {type: llm-rubric, value: "Declines to create a test conflict in the real repository or on main and uses a temporary throwaway repository instead."}
