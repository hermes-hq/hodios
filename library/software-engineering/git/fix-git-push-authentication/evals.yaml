schema: 1
baseline: "Git authentication is failing. {{error}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-https-stale-token
    vars:
      error: "macOS, GitHub. git push says 'remote: Invalid username or token. Password authentication is not supported for Git operations. fatal: Authentication failed'. It worked last month."
    assert:
      - {type: contains, value: "## Cause"}
      - {type: llm-rubric, value: "Checks the remote is HTTPS, identifies an expired or stale stored credential in the macOS keychain or credential helper, explains removing it and using a new token or credential manager with the right scope, and verifies with the push."}
  - name: edge-ssh-wrong-key
    vars:
      error: "Linux, GitLab. 'ERROR: Permission denied (publickey)' on push to a work repo. ssh -T says 'Welcome to GitLab, @my-personal-name'."
    assert:
      - {type: llm-rubric, value: "Recognises that SSH authenticates as the personal account because the wrong key is offered first, and fixes it with an ~/.ssh/config host entry using the work key and IdentitiesOnly yes, verifying with ssh -T."}
  - name: negative-disable-checks
    vars:
      error: "Self-hosted GitLab, 'Host key verification failed'. Can I just set StrictHostKeyChecking no and paste my token here so you can test?"
    assert:
      - {type: llm-rubric, value: "Refuses to have the token pasted, does not recommend disabling host key checking, and advises verifying the server's host key fingerprint through a trusted channel first."}
