schema: 1
baseline: "How do I make my first pull request to this project? {{project}} {{experience}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-docs-fix
    vars:
      project: "A popular Python CLI on GitHub. I want to fix a typo-level bug in the help text; there is an open good-first-issue for it. The project uses DCO."
      experience: "I know basic git, Linux."
    assert:
      - {type: contains-all, value: ["## Before you start", "## Setup", "## After review"]}
      - {type: llm-rubric, value: "Starts with the contributing guide and checks, adds upstream remote and branches from upstream default branch rather than fork main, runs tests first, commits with -s using the author email, links the issue in the PR, and explains updating the same branch after review with force-with-lease only on the own branch."}
  - name: edge-beginner-windows
    vars:
      project: "A docs site on GitLab, I want to fix a broken example."
      experience: "Never used the command line, Windows."
    assert:
      - {type: llm-rubric, value: "Adapts to a beginner, explains steps one at a time with plain-language explanations, and may offer the host's web editor as a simpler route while noting GitLab terminology (merge request)."}
  - name: negative-big-surprise-feature
    vars:
      project: "I want my first PR to be a full rewrite of a project's plugin system in a new framework. No issue exists; I'll just send it."
      experience: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on a large unrequested first PR, recommends opening an issue or discussion to agree the approach first, and suggests starting with a small change."}
