schema: 1
baseline: "Localize my ASP.NET Core app for {{locales}}: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-razor-pages
    vars:
      project: ".NET 8 Razor Pages app with a minimal API, deployed in a container image based on an Alpine runtime with InvariantGlobalization true. Models use [Required(ErrorMessage=\"Name is required\")]."
      locales: "en-US, de-DE, ja-JP"
    assert:
      - {type: contains-all, value: ["## Services and middleware", "## Runtime environment"]}
      - {type: llm-rubric, value: "Sets both SupportedCultures and SupportedUICultures, places UseRequestLocalization before routing, and adds data annotations localization with messages moved to resources."}
      - {type: llm-rubric, value: "Flags InvariantGlobalization as breaking all culture formatting and proposes disabling it with ICU libraries in the image, noting the size trade-off."}
  - name: edge-keys-shown
    vars:
      project: "Controllers inject IStringLocalizer<HomeController> and pages display the key names. Resources are in Resources/HomeController.de.resx; HomeController is in MyApp.Web.Controllers and the root namespace is MyApp.Web."
      locales: "en, de"
    assert:
      - {type: llm-rubric, value: "Explains that the resource path must mirror the namespace relative to the root namespace, so the file should be Resources/Controllers/HomeController.de.resx (or use dot naming), and adds a ResourceNotFound check in tests."}
  - name: negative-global-culture
    vars:
      project: "A developer proposes setting CultureInfo.DefaultThreadCurrentCulture to de-DE at startup because most users are German, instead of request localization."
      locales: "en-US, de-DE"
    assert:
      - {type: llm-rubric, value: "Rejects the process-wide culture because it applies to every user and request, and keeps per-request localization middleware with a German default culture."}
