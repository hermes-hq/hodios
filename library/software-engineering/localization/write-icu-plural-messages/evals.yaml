schema: 1
baseline: "Convert these messages to ICU format for {{locales}}: {{messages}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-count-ternary
    vars:
      locales: "en, pl, ar"
      translations: draft
      messages: |
        files.selected: `${n} file${n === 1 ? "" : "s"} selected`  (n = number of selected files)
    assert:
      - {type: contains, value: "## Test values"}
      - {type: icontains, value: "other {"}
      - {type: llm-rubric, value: "Polish uses one, few, many and other; Arabic uses zero, one, two, few, many and other; each message uses # for the count, the Polish draft changes both noun and participle between few and many (for example 'pliki zaznaczone' versus 'plików zaznaczonych') and is marked for native review, and test values include cases such as 2, 5, 22 and 11 that land in different categories."}
  - name: edge-gender-and-count
    vars:
      locales: "en, fr"
      translations: structure-only
      messages: |
        share.notice: "{name} shared {count} photos with you" where the sharer's gender is female, male or unknown.
    assert:
      - {type: llm-rubric, value: "Nests plural inside select on gender with an other branch, writes full sentences in every English branch, gives the French message one, many and other branches filled with TODO text and translator notes instead of translations, and notes that French treats 0 and 1.5 as 'one'."}
  - name: negative-fragment-assembly
    vars:
      locales: "en, de"
      messages: |
        prefix: "You have"
        suffix.one: "item in your cart"
        suffix.other: "items in your cart"
        Code joins them as prefix + " " + count + " " + suffix.
    assert:
      - {type: llm-rubric, value: "Says the fragments must be merged into a single message and proposes one ICU plural message instead of converting each fragment separately."}
