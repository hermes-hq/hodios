schema: 1
baseline: "Write code that can be translated."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cart-summary-component
    description: "User turn: Add a line to our React cart page (we use react-intl) that says 'You have 3 items in your cart, total $42.50, delivered by Friday'."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses a single catalog message with a meaningful key and named placeholders, ICU plural for the item count, FormattedNumber or Intl.NumberFormat with the currency code instead of a hard-coded $, and a locale-aware date format for the delivery day; does not concatenate fragments."}
  - name: edge-css-layout-request
    description: "User turn: Style the notification badge so it sits 8px to the left of the bell icon and the text is left-aligned. We are adding Hebrew next quarter."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses logical properties such as margin-inline-end or inset-inline-start and text-align: start instead of left, and explains these flip automatically in right-to-left layouts."}
  - name: negative-internal-log
    description: "User turn: Add a debug log line in our Go worker that prints the job id and duration in milliseconds."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Writes a plain log line without moving it into a translation catalog, since developer logs are not user-facing, and does not add i18n noise."}
