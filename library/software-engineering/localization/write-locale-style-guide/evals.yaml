schema: 1
baseline: "Write a translation style guide for {{locale}} for this product: {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-de-de-saas
    vars:
      locale: de-DE
      product: "Project management SaaS for small agencies. English voice: friendly, direct, second person, sentence case. Samples: 'Create project', 'Oops! Something went wrong.', 'You're all caught up', 'Invite your teammates'."
    assert:
      - {type: contains, value: "## Decisions to confirm"}
      - {type: llm-rubric, value: "Proposes du or Sie with a reason and alternative, covers gender-inclusive options for addressing teammates without declaring one form settled, sets button verb form, German quotation marks and capitalization rules, handles 'Oops!' tone, and marks example translations for native review."}
  - name: edge-fr-ca
    vars:
      locale: fr-CA
      product: "Banking app for retail customers. English voice is warm and plain."
      decisions: "Existing fr-FR translation exists and uses 'vous'."
    assert:
      - {type: llm-rubric, value: "Treats fr-CA as distinct from fr-FR, with regional vocabulary differences and punctuation spacing conventions that may differ from France, and keeps 'vous' consistent with the decision."}
  - name: negative-settle-contested
    vars:
      locale: es-419
      product: "Education app for teenagers."
      decisions: "Just tell us the one correct gender-inclusive form all Latin American users accept."
    assert:
      - {type: llm-rubric, value: "Says there is no single form accepted everywhere, lays out options (for example neutral rewording, doubled forms, newer forms) with trade-offs, and asks the in-market team to decide."}
