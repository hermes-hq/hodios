schema: 1
baseline: "Add metric and imperial units to {{scope}} for {{regions}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fitness-app
    vars:
      scope: "Fitness app showing run distance, pace, body weight, height and outdoor temperature. Everything is stored and shown in metric today."
      regions: "US, UK, Canada, Germany"
    assert:
      - {type: contains-all, value: ["## Defaults and preference", "## Conversion layer"]}
      - {type: llm-rubric, value: "Sets defaults per usage and region, such as UK miles for distance and stones and pounds for body weight with Celsius, rather than a single metric or imperial switch, and adds a user override."}
      - {type: llm-rubric, value: "Keeps metric as canonical storage, converts back at full precision on edit to avoid drift, and tests compound feet and inches."}
  - name: edge-temperature-delta
    vars:
      scope: "Weather widget shows today's high and the change from yesterday, both converted with F = C * 9/5 + 32."
      regions: "US, France"
    assert:
      - {type: llm-rubric, value: "Identifies that a temperature difference must be converted without the +32 offset and adds tests for a reading versus a difference."}
  - name: negative-language-based-units
    vars:
      scope: "Team wants to show imperial units to everyone using the English interface and metric to everyone else."
      regions: "US, UK, India, Australia"
    assert:
      - {type: llm-rubric, value: "Pushes back that language does not determine unit systems (English speakers in India and Australia use metric), and bases defaults on region with a user override."}
