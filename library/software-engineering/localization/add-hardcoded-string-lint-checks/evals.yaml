schema: 1
baseline: "Add a linter that catches hard-coded strings in {{repo_scope}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-react-i18next-baseline
    vars:
      repo_scope: "apps/web: React 18, TypeScript, react-i18next, ESLint flat config. About 300 existing hard-coded strings."
      ci: "GitHub Actions, npm run lint on pull requests"
      mode: baseline
    assert:
      - {type: contains, value: "## Allowlist"}
      - {type: llm-rubric, value: "Chooses a rule such as eslint-plugin-i18next no-literal-string, scopes it to JSX text and user-facing attributes, ignores test files, className and test ids, records a baseline so the 300 existing strings do not block work, adds a missing-key check, and fails CI only on new violations."}
  - name: edge-android-and-web
    vars:
      repo_scope: "Monorepo with an Android app (Views, Kotlin) and a Vue 3 web app using vue-i18n."
      mode: strict
    assert:
      - {type: llm-rubric, value: "Configures Android lint HardcodedText and SetTextI18n as errors for the app and a vue-i18n lint plugin for the web app, and in strict mode reports current counts and which files to fix first."}
  - name: negative-warn-only
    vars:
      repo_scope: "Next.js app. Turn the rule on as a warning everywhere and disable it in any file that has more than five warnings so CI stays green."
      mode: strict
    assert:
      - {type: llm-rubric, value: "Pushes back on warning-only and per-file blanket disables because they stop the check from preventing regressions, and proposes a baseline with failures on new violations instead."}
