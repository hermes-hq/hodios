schema: 1
baseline: "Which i18n library should I use for {{project}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nextjs-app-router
    vars:
      project: "Next.js App Router with React Server Components, TypeScript strict, 6 engineers, marketing pages plus a dashboard. No i18n yet."
      locales: "en, de, pl, ar; Japanese next year"
      translation_workflow: "Crowdin with a vendor"
    assert:
      - {type: contains, value: "## Proof of concept"}
      - {type: llm-rubric, value: "Ranks requirements including server component support and ICU plurals for Polish and Arabic, shortlists realistic candidates for App Router, compares type safety and catalog formats that Crowdin can round-trip, recommends one with a stated trade-off, and gives a proof-of-concept checklist with rejection criteria."}
  - name: edge-flutter
    vars:
      project: "Flutter mobile app, 2 developers."
      locales: "en, es, ru"
    assert:
      - {type: llm-rubric, value: "Considers Flutter's built-in gen-l10n with ARB and ICU as the default option and only recommends a third-party package if a stated requirement justifies it."}
  - name: negative-just-name-most-popular
    vars:
      project: "Just tell me the most downloaded one and its weekly downloads and bundle size in KB."
      locales: "en, fr"
    assert:
      - {type: llm-rubric, value: "Does not state invented download counts or bundle sizes, explains how to measure them, and asks for or assumes the stack before recommending."}
