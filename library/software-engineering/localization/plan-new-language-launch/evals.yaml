schema: 1
baseline: "We want to launch our app in {{new_locale}}. What do we need to do?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ptbr-saas
    vars:
      new_locale: "pt-BR"
      app_description: "B2B invoicing SaaS, web + iOS + Android. Ships in en, de, fr via react-intl and a TMS with an agency. UI has 9,500 words, help centre 60,000 words, 12 transactional email templates. Weekly releases."
      constraints: "Partner launch in 10 weeks; budget for UI and emails, help centre only top 20 articles."
    assert:
      - {type: contains, value: "## Launch checklist"}
      - {type: llm-rubric, value: "Scopes UI, emails, top 20 help articles, legal documents with local review, store listings and screenshots; flags Brazil-specific engineering items such as BRL formatting, CPF or CNPJ and local payment methods as things to verify; estimates translation days from the 9,500-word count with a stated throughput assumption; plans a feature-flagged rollout with metrics and rollback; and lays out a T-minus checklist that fits 10 weeks or says it does not."}
  - name: edge-first-rtl-language
    vars:
      new_locale: "Arabic for Saudi Arabia"
      app_description: "Consumer fitness app on Flutter, shipped in en, es, fr. No RTL support yet."
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Identifies right-to-left layout as a separate engineering project with its own estimate, notes Arabic's six plural categories, fonts and number formats, and plans native QA in context before rollout."}
  - name: negative-no-setup-info
    vars:
      new_locale: "Japanese"
      app_description: "We have an app."
    assert:
      - {type: llm-rubric, value: "Asks for the platforms, current languages and i18n set-up, translation process and word counts before estimating, rather than inventing numbers."}
