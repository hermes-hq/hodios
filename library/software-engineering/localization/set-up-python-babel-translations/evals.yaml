schema: 1
baseline: "Add translations to my Python web app for {{locales}}: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fastapi
    vars:
      project: "FastAPI app on uvicorn with several workers, Jinja2 email templates, Pydantic validation errors returned as English strings. No i18n yet."
      locales: "en, de, pt_BR"
    assert:
      - {type: contains-all, value: ["## Extraction setup", "## Locale per request"]}
      - {type: llm-rubric, value: "Loads Babel Translations per locale at startup, resolves the locale per request in middleware or a dependency into a ContextVar, and avoids a module-level current locale."}
      - {type: llm-rubric, value: "Includes the pybabel extract command with lazy keywords and a Jinja mapping, and a concurrency test with two locales."}
  - name: edge-flask-babel-upgrade
    vars:
      project: "Flask app upgraded to Flask-Babel 4; the @babel.localeselector decorator now raises AttributeError. WTForms labels are defined with gettext at class level and always appear in English."
      locales: "en, fr"
    assert:
      - {type: llm-rubric, value: "Moves locale selection to the locale_selector argument for Flask-Babel 3 and later, and switches class-level labels to lazy_gettext, adding that keyword to extraction."}
  - name: negative-fstrings
    vars:
      project: "Developers want to keep writing _(f'Hello {name}, you have {n} messages') because it reads better."
      locales: "en, es"
    assert:
      - {type: llm-rubric, value: "Explains that f-strings are evaluated before lookup so the message cannot be extracted or matched, and rewrites it with ngettext and named placeholders."}
