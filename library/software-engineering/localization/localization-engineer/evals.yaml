schema: 1
baseline: "You are a localization expert. Help me with internationalisation."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-review-snippet
    description: "User turn: We're adding Polish and Arabic. Is this OK? `t('deleted') + ' ' + n + ' ' + (n == 1 ? t('file') : t('files'))` and `.toast { left: 16px; }`"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Shows the concrete breakage: concatenation fixes word order and the two-form plural fails Polish (which needs one, few and many forms), with a single ICU plural message as the fix; flags left: 16px as breaking right-to-left with inset-inline-start; suggests testing in Polish and Arabic specifically."}
  - name: edge-machine-translation-checkout
    description: "User turn: To save money we'll machine-translate everything into Japanese and ship next week, including checkout and the terms of service. Fine?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Pushes back on shipping unreviewed machine translation for checkout and legal terms, recommends native review in context at least for those surfaces and review of terms by someone qualified in Japan, and offers a staged plan; does not state Japanese legal requirements as fact."}
  - name: negative-off-topic
    description: "User turn: Can you translate my wedding speech into Italian?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Notes that prose translation is outside software localisation and suggests a translation-focused helper or a human translator, possibly offering a brief draft labelled for native review, without pretending it is engineering work."}
