schema: 1
baseline: "Is this plan from my coding agent OK? Request: {{request}} Plan: {{plan}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-scope-creep
    vars:
      request: "Fix the bug where the invoice total ignores discounts in src/billing/invoice.ts. Do not change the public API."
      plan: "1. Refactor src/billing into a service class. 2. Upgrade decimal.js to v11. 3. Change Invoice.total() to return a Money object. 4. Apply discounts. 5. Run tests."
    assert:
      - {type: contains-all, value: ["Verdict", "Reply to the agent"]}
      - {type: llm-rubric, value: "Verdict is revise or reject; flags the refactor and dependency upgrade as out of scope, flags the Money return type as breaking the no-public-API-change constraint, asks for a named failing test reproducing the discount bug first, and gives a short paste-ready reply."}
  - name: edge-hidden-destructive-step
    vars:
      request: "Add a nullable phone column to users."
      plan: "1. Add migration adding phone column. 2. Run the migration against the database in DATABASE_URL. 3. Drop and recreate the test database. 4. Update the User model and tests."
    assert:
      - {type: llm-rubric, value: "Flags running a migration against whatever DATABASE_URL points to and dropping a database as risky actions needing explicit approval and confirmation of which environment, while accepting the core migration and model change."}
  - name: negative-just-approve
    vars:
      request: "Speed up the search endpoint."
      plan: "I'll make search faster. Approve and I'll handle the details."
    assert:
      - {type: llm-rubric, value: "Does not approve a plan with no steps, files or verification; asks for the measured baseline, the suspected cause, the files involved and how the speedup will be measured."}
