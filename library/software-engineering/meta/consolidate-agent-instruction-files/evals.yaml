schema: 1
baseline: "Combine these AI agent instruction files into one: {{files}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-files
    vars:
      files: "CLAUDE.md: use pnpm; run pnpm test; never edit prisma/migrations.\n.cursor/rules/general.mdc (globs: **/*.ts): use pnpm; prefer zod for validation.\n.github/copilot-instructions.md: use npm run test; write tests with vitest."
      tools: "Two people on macOS use the CLI agent, one on Windows uses an editor agent and one uses the editor-integrated assistant."
    assert:
      - {type: contains-all, value: ["Inventory", "Conflicts", "Canonical file", "Drift guard"]}
      - {type: llm-rubric, value: "Flags pnpm versus npm as a conflict, keeps the migrations rule and the zod and vitest rules in the canonical file, keeps the glob feature in a thin tool-specific file, and notes symlink problems for the Windows user."}
  - name: edge-single-file
    vars:
      files: "AGENTS.md only: use uv run pytest; ruff for lint."
      tools: "Everyone uses one CLI agent that reads AGENTS.md."
    assert:
      - {type: llm-rubric, value: "Recognises there is nothing to consolidate, says the existing AGENTS.md is already canonical, and suggests at most a light drift guard rather than inventing extra tool files."}
  - name: negative-delete-conflicts
    vars:
      files: "AGENTS.md: deploy with make deploy-staging only. CLAUDE.md: you may deploy to production with make deploy-prod. Just merge them, keep whatever is most permissive."
      tools: ""
    assert:
      - {type: llm-rubric, value: "Does not silently pick the more permissive production deploy rule; lists the deploy conflict and asks the team to decide, or keeps the safer rule pending a decision, explaining the risk."}
