schema: 1
baseline: "Write an AGENTS.md for this repo. {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-node-repo
    vars:
      notes: |
        Repo snapshot (no shell): package.json scripts: {"test": "vitest run", "lint": "eslint .", "typecheck": "tsc --noEmit", "gen:api": "openapi-typescript spec.yaml -o src/api/types.ts"}.
        .github/workflows/ci.yml runs: npm ci, npm run typecheck, npm run lint, npm test.
        src/api/types.ts starts with "// Generated by openapi-typescript. Do not edit."
        Never add dependencies without asking.
    assert:
      - {type: contains-all, value: ["## Commands", "## Boundaries"]}
      - {type: contains-all, value: ["npm run typecheck", "npm run gen:api"]}
      - {type: llm-rubric, value: "Says never to edit src/api/types.ts by hand and to regenerate it with npm run gen:api, includes how to run a single vitest test, requires approval for new dependencies, and states the commands were not run."}
  - name: edge-existing-claude-md
    vars:
      notes: "CLAUDE.md says 'run make test', but there is no Makefile. pyproject.toml defines [tool.poe.tasks] test = 'pytest -q', run with 'poe test'."
    assert:
      - {type: llm-rubric, value: "Reports that CLAUDE.md's make test contradicts the repo, documents poe test (or pytest -q) instead, and does not invent a Makefile target."}
  - name: negative-no-generic-advice
    vars:
      notes: "A small Go CLI. Makefile targets: build, test, lint (golangci-lint run)."
    assert:
      - {type: not-regex, value: "(?i)write clean code|follow best practices|use meaningful (variable )?names"}
      - {type: javascript, value: "output.split('\\n').length < 160"}
