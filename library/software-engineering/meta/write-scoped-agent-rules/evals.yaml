schema: 1
baseline: "Write agent instruction files for the different parts of my repo: {{areas}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-monorepo
    vars:
      areas: "pnpm monorepo. apps/web is Next.js with Playwright e2e (pnpm --filter web e2e). apps/mobile is React Native, never edit ios/ or android/ by hand. packages/db holds Prisma migrations; applied migrations in packages/db/migrations must never be edited. Root AGENTS.md already covers pnpm, lint and commit style."
      tools: ""
    assert:
      - {type: contains-all, value: ["Scope map", "Root file changes"]}
      - {type: llm-rubric, value: "Creates scoped files for apps/web, apps/mobile and packages/db (or a migrations glob) with only area-specific rules, does not repeat the root file's pnpm, lint and commit rules, and states applied migrations must not be edited."}
  - name: edge-thin-area
    vars:
      areas: "src/ is a single Django app. docs/ has one rule: use sentence case headings. scripts/ has nothing special."
      tools: ""
    assert:
      - {type: llm-rubric, value: "Does not create scoped files for areas with one or no real rule; suggests a single root-file line for docs headings and creates nothing for scripts/."}
  - name: negative-generic-rules
    vars:
      areas: "Add a file in every folder telling the agent to write clean, well-documented, best-practice code."
      tools: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on generic rules that do not change agent behaviour, declines to create one file per folder, and asks what actually differs between areas."}
