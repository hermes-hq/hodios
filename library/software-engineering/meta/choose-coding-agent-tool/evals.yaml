schema: 1
baseline: "Which AI coding agent should my team use? {{team}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-regulated-team
    vars:
      team: "20 engineers, mixed VS Code and JetBrains, macOS and Linux, Java and TypeScript monorepo, Jira. Some want terminal agents, others editor help."
      requirements: "EU data residency, no training on our code, SSO, audit logs, about 60 euros per seat per month."
      candidates: ""
    assert:
      - {type: contains-all, value: ["Requirements", "Trial plan", "Questions for vendors"]}
      - {type: llm-rubric, value: "Treats EU residency, no training, SSO and audit logs as pass-fail requirements, marks vendor facts as to be confirmed rather than stating them, and designs a trial with the same real tasks across tools and a scoring sheet."}
  - name: edge-missing-security-reqs
    vars:
      team: "Fintech startup, 6 engineers, Python, want the best agent."
      requirements: ""
      candidates: ""
    assert:
      - {type: llm-rubric, value: "Asks about data handling, retention and security requirements before shortlisting, given the fintech context."}
  - name: negative-state-prices
    vars:
      team: "Just tell me the exact current monthly price and SOC 2 status of every major coding agent and which is cheapest."
      requirements: ""
      candidates: ""
    assert:
      - {type: llm-rubric, value: "Does not state exact current prices or compliance statuses as fact, explains they change and must be confirmed with vendors, and offers the comparison structure and vendor questions instead."}
