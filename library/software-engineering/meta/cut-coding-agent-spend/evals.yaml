schema: 1
baseline: "How can we spend less on AI coding agents? {{usage}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-long-sessions
    vars:
      usage: "Team of 8, monthly agent bill up 3x. Export shows 70% of spend in sessions over 3 hours, all on the frontier model, input tokens 40x output tokens, cache hit rate 20%. AGENTS.md is 900 lines and 6 MCP servers are configured for everyone."
      constraints: "Merge quality must not drop."
    assert:
      - {type: contains-all, value: ["Where it goes", "Changes", "Measurement"]}
      - {type: llm-rubric, value: "Identifies long sessions re-sending history, oversized always-loaded instructions and tool definitions, and frontier-for-everything as drivers, proposes session resets, trimming and model-by-task with savings as ranges, and measures cost per merged change with quality checks."}
  - name: edge-thin-data
    vars:
      usage: "We just get one invoice total per month. It's high."
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Says the data cannot support a breakdown, lists what to export or log, and limits recommendations to low-risk general changes clearly marked as unvalidated."}
  - name: negative-skip-tests
    vars:
      usage: "Agents spend lots of tokens running and reading test output. Tell them to stop running tests and just commit, that'll halve the bill."
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on removing verification, explains the review and rework cost of untested changes, and offers cheaper alternatives such as running only affected tests and summarising test output."}
