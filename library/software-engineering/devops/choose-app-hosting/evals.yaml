schema: 1
baseline: "Where should I host this app? {{app}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-mvp
    vars:
      app: "Next.js frontend, Node API, Postgres, a nightly report job, about 2,000 users at launch."
      team: "Two developers, no ops experience, budget around 200 per month, customers in the EU."
    assert:
      - {type: llm-rubric, value: "Recommends a PaaS or managed containers rather than Kubernetes, compares several categories in a table, estimates cost now and at 10x with stated assumptions marked as estimates, handles the nightly job and EU data location, and gives next steps."}
  - name: edge-websockets-gpu
    vars:
      app: "Realtime collaboration app with websockets plus a GPU-based image processing worker that runs about 10 minutes per job."
    assert:
      - {type: llm-rubric, value: "Eliminates plain serverless functions for the websockets and long GPU jobs, explains why, and separates hosting for the web tier and the GPU worker."}
  - name: negative-missing-info
    vars:
      app: "My app. Where should it go?"
    assert:
      - {type: llm-rubric, value: "Asks focused questions about the workload, database, traffic, team and budget instead of recommending a provider without information."}
