schema: 1
baseline: "Write a bitbucket-pipelines.yml that does this: {{goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-node-deploy
    vars:
      goal: "Lint and test every pull request for a Node 20 app using npm; deploy main to staging automatically and tags to production after a manual click."
      requirements: "Tests need Postgres 16. Deploy target is AWS."
    assert:
      - {type: llm-rubric, value: "Defines a pull-requests pipeline with cached npm ci, a Postgres 16 service with pinned image, deployment steps for staging and production with trigger manual for production, passes build output as artifacts, and uses OIDC or named secured variables for AWS."}
  - name: edge-memory-limit
    vars:
      goal: "Build a large Java Gradle project plus run Elasticsearch as a service for tests; builds fail with exceeded memory."
    assert:
      - {type: llm-rubric, value: "Explains that services share the step's memory, sets size 2x or larger and service memory limits, and caches Gradle dependencies."}
  - name: negative-hardcoded-keys
    vars:
      goal: "Deploy to AWS; just paste the access key and secret into the YAML."
    assert:
      - {type: llm-rubric, value: "Refuses to put keys in the file and uses OIDC or secured deployment variables, listing what to create."}
