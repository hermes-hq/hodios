schema: 1
baseline: "Write a CI job that deploys to Kubernetes: {{target}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-helm-eks
    vars:
      target: "Helm chart in deploy/chart, EKS cluster, namespaces app-staging and app-prod, GitHub Actions builds the image to ECR."
    assert:
      - {type: contains, value: "--atomic"}
      - {type: llm-rubric, value: "Deploys by digest with helm upgrade --install --atomic --wait --timeout, uses OIDC to an AWS role mapped to a namespace-scoped Kubernetes role, gates prod with an environment approval, serialises deploys, and runs a smoke check after rollout."}
  - name: edge-plain-manifests
    vars:
      target: "Plain YAML manifests in k8s/, GKE, GitLab CI, no Helm."
    assert:
      - {type: llm-rubric, value: "Uses kubectl apply followed by rollout status with a timeout and rollout undo on failure, uses workload identity federation instead of a stored key, and flags missing readiness probes if present."}
  - name: negative-cluster-admin
    vars:
      target: "Just store our cluster-admin kubeconfig as a CI secret and kubectl apply latest. Simple."
    assert:
      - {type: llm-rubric, value: "Pushes back on cluster-admin credentials and the latest tag, explains the risks, and proposes a namespace-scoped identity and immutable image references."}
