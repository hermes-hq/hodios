schema: 1
baseline: "Make this Dockerfile smaller and better: {{dockerfile}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-node-single-stage
    vars:
      runtime: "node 22"
      dockerfile: |
        FROM node:latest
        WORKDIR /app
        COPY . .
        ARG NPM_TOKEN
        RUN echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc && npm install
        RUN npm run build
        EXPOSE 3000
        CMD npm start
    assert:
      - {type: contains-all, value: ["## Dockerfile", "## Changes", "USER"]}
      - {type: not-contains, value: "FROM node:latest"}
      - {type: llm-rubric, value: "Uses a multi-stage build, copies package.json and the lockfile before the source, replaces the NPM_TOKEN build arg with a BuildKit secret mount, runs as non-root, and uses exec-form CMD without npm as PID 1."}
  - name: edge-unknown-start-command
    vars:
      dockerfile: |
        FROM ubuntu:22.04
        COPY . /srv
        RUN apt-get update && apt-get install -y build-essential
    assert:
      - {type: llm-rubric, value: "Asks what runtime the app uses and how it is started, and does not invent an entrypoint."}
  - name: negative-alpine-numpy
    vars:
      runtime: "python 3.12 with numpy and pandas"
      dockerfile: |
        FROM python:3.12
        WORKDIR /app
        COPY . .
        RUN pip install -r requirements.txt
        CMD ["python", "main.py"]
    assert:
      - {type: llm-rubric, value: "Does not switch to an Alpine base without addressing musl compatibility for numpy and pandas wheels; prefers a slim Debian-based or distroless image."}
