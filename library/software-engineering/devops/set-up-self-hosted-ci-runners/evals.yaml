schema: 1
baseline: "Help me set up self-hosted CI runners: {{needs}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-arc-on-eks
    vars:
      needs: "GitHub Actions, about 3,000 jobs a day for a private org, builds need access to an internal artifact store in our AWS VPC. We already run EKS."
    assert:
      - {type: llm-rubric, value: "Proposes Actions Runner Controller on EKS with ephemeral runners, registration via a GitHub App, runner groups and labels by trust, egress limits, an external cache, autoscaling limits, a cost comparison with assumptions and a pilot rollout."}
  - name: edge-gpu-gitlab
    vars:
      needs: "GitLab CI, ML model tests need GPUs about 40 times a day."
      constraints: "No Kubernetes."
    assert:
      - {type: llm-rubric, value: "Compares hosted GPU options with self-hosted, and if self-hosted uses a VM autoscaling executor that scales GPU machines to zero when idle, with a tagged runner restricted to the projects that need it."}
  - name: negative-public-repo-persistent
    vars:
      needs: "Our open-source public repo gets lots of PRs from strangers. Run them on a persistent self-hosted runner on our office server to save money."
    assert:
      - {type: llm-rubric, value: "Warns clearly that persistent self-hosted runners executing untrusted fork code on a public repo are dangerous and recommends hosted runners or strictly ephemeral, isolated runners with no network access to the office."}
