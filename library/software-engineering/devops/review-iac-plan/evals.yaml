schema: 1
baseline: "Review this Terraform plan: {{plan_output}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-forced-db-replacement
    vars:
      environment: prod
      plan_output: |
        # aws_db_instance.main must be replaced
        -/+ resource "aws_db_instance" "main" {
              ~ identifier          = "orders-prod" -> "orders-prod-v2" # forces replacement
              ~ id                  = "orders-prod" -> (known after apply)
                engine              = "postgres"
              ~ address             = "orders-prod.abc.eu-west-1.rds.amazonaws.com" -> (known after apply)
            }
          # aws_security_group_rule.debug will be created
          + resource "aws_security_group_rule" "debug" {
              + cidr_blocks = ["0.0.0.0/0"]
              + from_port   = 5432
              + to_port     = 5432
              + type        = "ingress"
            }
        Plan: 2 to add, 0 to change, 1 to destroy.
    assert:
      - {type: icontains, value: "do not apply"}
      - {type: contains, value: "aws_db_instance.main"}
      - {type: llm-rubric, value: "Identifies that renaming the identifier forces replacement of the production database (data loss risk) and that port 5432 is opened to 0.0.0.0/0, and proposes concrete fixes."}
  - name: edge-summary-only
    vars:
      plan_output: "Plan: 4 to add, 2 to change, 1 to destroy."
    assert:
      - {type: llm-rubric, value: "Asks for the full plan output or terraform show -json and does not guess which resources change."}
  - name: negative-tag-only-change
    vars:
      environment: staging
      plan_output: |
        # aws_s3_bucket.assets will be updated in-place
        ~ resource "aws_s3_bucket" "assets" {
            ~ tags = {
                ~ "owner" = "team-a" -> "team-web"
              }
          }
        Plan: 0 to add, 1 to change, 0 to destroy.
    assert:
      - {type: icontains, value: "safe to apply"}
      - {type: llm-rubric, value: "Does not invent security or cost findings for a tag-only change."}
  - name: edge-unexpected-drift
    vars:
      environment: staging
      intent: "Add a tag team=payments to the payments queue."
      plan_output: |2
          # aws_sqs_queue.payments will be updated in-place
          ~ resource "aws_sqs_queue" "payments" {
              ~ tags = {
                  + "team" = "payments"
                }
            }

          # aws_security_group_rule.debug will be updated in-place
          ~ resource "aws_security_group_rule" "debug" {
              ~ cidr_blocks = ["10.0.0.0/8"] -> ["0.0.0.0/0"]
            }

        Plan: 0 to add, 2 to change, 0 to destroy.
    assert:
      - {type: llm-rubric, value: "Lists the security group rule change to 0.0.0.0/0 as both a security finding and unexpected given the intent, and does not treat the plan as safe just because nothing is destroyed."}
