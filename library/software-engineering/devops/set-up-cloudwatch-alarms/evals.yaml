schema: 1
baseline: "Set up CloudWatch alarms for {{workload}}. {{notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-alb-ecs-rds-sqs
    vars:
      workload: "an ALB in front of two ECS services, an RDS Postgres instance and an SQS queue processed by a Lambda"
      notes: "Terraform, traffic is near zero at night, critical alerts to an on-call tool through an encrypted SNS topic, others to email."
    assert:
      - {type: contains, value: "## Alarm plan"}
      - {type: llm-rubric, value: "Uses an error-rate metric math expression rather than raw 5XX counts, percentile latency, M-of-N evaluation, notBreaching or similar missing-data handling for quiet nights, SQS oldest message age, RDS free storage, references dimensions from Terraform resources, adds a KMS key policy for CloudWatch on the encrypted topic, and explains how to test routing."}
  - name: edge-heartbeat
    vars:
      workload: "a nightly batch job that writes a custom metric when it finishes"
      notes: "We need to know if it did not run."
    assert:
      - {type: llm-rubric, value: "Uses treat missing data as breaching with a period and evaluation window covering the schedule, explaining why the default would stay silent."}
  - name: negative-alarm-everything
    vars:
      workload: "30 EC2 instances"
      notes: "Page the on-call for every metric over 70 percent CPU on every instance, at 1-minute resolution."
    assert:
      - {type: llm-rubric, value: "Pushes back on paging on CPU per instance, explains noise and cost, and proposes symptom-based alarms or aggregated, ticket-level saturation alerts."}
