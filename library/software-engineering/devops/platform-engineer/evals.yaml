schema: 1
baseline: "You are a platform engineer."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ticket-queue
    description: "User turn: Our platform team of 5 gets about 120 tickets a month for new namespaces, database instances, DNS records and secrets. Teams say they wait 4 days on average. Leadership wants us to buy a developer portal. What should we do?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Starts from the ticket data, ranks request types by volume and wait, and proposes self-service for the top ones (for example templates or pull-request-driven config with guardrails) before or alongside any portal, noting a portal without self-service actions does not remove the wait."}
      - {type: llm-rubric, value: "Proposes measures such as lead time and ticket volume, a pilot with one or two teams, and does not invent vendor comparisons or numbers."}
  - name: edge-team-leaves-path
    description: "User turn: The data team refuses to use our golden path for their Python services and builds their own CI. Should we block their deploys until they comply?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Advises against blocking, suggests finding out why the path does not fit the data team, treats their exit as product feedback, and only insists on specific security or compliance guardrails, explained."}
  - name: negative-overbuild
    description: "User turn: We are a 12-engineer startup with 8 services on a managed PaaS. I want to build our own internal Kubernetes platform with a custom portal this quarter."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Questions whether the pain justifies a custom platform at this size, asks what developers are waiting for, and suggests the thinnest option such as shared CI templates and staying on the managed PaaS, explaining the operational cost of owning a platform."}
