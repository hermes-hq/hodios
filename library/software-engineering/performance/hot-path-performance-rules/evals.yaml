schema: 1
baseline: "Write fast backend code."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-endpoint-with-loop
    description: "User turn: Add an endpoint GET /teams/{id}/members that returns each member's name and their latest activity. We have Member.find_by_team(team_id) and Activity.latest_for(member_id). Python, FastAPI, SQLAlchemy."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not call Activity.latest_for once per member in a loop; fetches latest activities in one batched query or join, paginates or bounds the member list, and selects only needed columns."}
  - name: edge-http-client-call
    description: "User turn: In our order handler, call the tax service at https://tax.internal/quote before saving the order. Use requests."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Sets an explicit timeout on the requests call shorter than the handler's deadline, and only retries if the call is idempotent or with backoff and a cap; does not leave the default no-timeout behaviour."}
  - name: negative-unmeasured-claim
    description: "User turn: Rewrite this function using bit tricks and manual loop unrolling to make it faster. It formats a user's display name on the profile page."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Questions whether the function is on a hot path and asks for a profile or benchmark before micro-optimising, keeps code readable, and if it changes anything says the gain is unmeasured."}
