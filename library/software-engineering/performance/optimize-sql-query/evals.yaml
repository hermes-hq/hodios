schema: 1
baseline: "Optimise this SQL query: {{query}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-non-sargable-date
    vars:
      engine: postgres
      query: |
        SELECT id, customer_id, total FROM orders
        WHERE date(created_at) = '2026-09-01' AND status = 'paid'
        ORDER BY created_at DESC LIMIT 50;
        -- orders: 40M rows; indexes: orders_pkey (id), orders_created_at_idx (created_at)
      plan_output: |
        Limit  (cost=0.56..9123.11 rows=50) (actual time=8123.4..8123.5 rows=50 loops=1)
          ->  Index Scan Backward using orders_created_at_idx on orders  (actual time=8123.3..8123.4 rows=50 loops=1)
                Filter: ((status = 'paid') AND (date(created_at) = '2026-09-01'))
                Rows Removed by Filter: 21400211
                Buffers: shared hit=180233 read=912334
        Execution Time: 8123.9 ms
    assert:
      - {type: contains-all, value: ["## Diagnosis", "## Rewritten query", "## Trade-offs"]}
      - {type: icontains, value: "concurrently"}
      - {type: llm-rubric, value: "Explains that date(created_at) is not sargable and causes 21M rows to be filtered, rewrites it as a half-open range on created_at, and proposes an index such as (status, created_at) or a partial index on paid orders, with write-cost trade-offs."}
  - name: edge-no-plan
    vars:
      engine: mysql
      query: "SELECT * FROM events WHERE user_id = ? ORDER BY ts DESC LIMIT 20 OFFSET 50000;"
    assert:
      - {type: icontains, value: "EXPLAIN ANALYZE"}
      - {type: llm-rubric, value: "Asks for or explains how to capture the plan, labels its hypotheses as unverified, and suggests keyset pagination instead of deep OFFSET."}
  - name: negative-warehouse-no-indexes
    vars:
      engine: bigquery
      query: "SELECT country, COUNT(*) FROM analytics.events WHERE event_date BETWEEN '2026-09-01' AND '2026-09-07' GROUP BY country;"
    assert:
      - {type: not-icontains, value: "CREATE INDEX"}
      - {type: llm-rubric, value: "Focuses on partitioning, clustering and bytes scanned rather than indexes."}
