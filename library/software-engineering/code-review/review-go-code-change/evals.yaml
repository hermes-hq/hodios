schema: 1
baseline: "Review this Go code: {{diff}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-leak-and-shadow
    vars:
      context: "Go 1.21. HTTP service; fetchPrice is called per request."
      diff: |
        +func fetchPrice(id string) (float64, error) {
        +    ch := make(chan float64)
        +    go func() { p, _ := slowLookup(id); ch <- p }()
        +    select {
        +    case p := <-ch:
        +        return p, nil
        +    case <-time.After(200 * time.Millisecond):
        +        return 0, errors.New("timeout")
        +    }
        +}
        +func save(o Order) (err error) {
        +    if o.Valid() {
        +        res, err := db.Exec(q, o.ID)
        +        _ = res
        +        if err != nil { log.Print(err) }
        +    }
        +    return err
        +}
    assert:
      - {type: contains, value: "## Findings"}
      - {type: llm-rubric, value: "Explains that on timeout nobody receives from the unbuffered channel, so the goroutine blocks forever and leaks one goroutine per slow request; fixes with a buffered channel of size 1 and a context passed to slowLookup. Also notes the lookup error is discarded."}
      - {type: llm-rubric, value: "Flags that err is shadowed by := inside the if block, so save returns nil even when the Exec fails."}
  - name: edge-go-1-22-loop
    vars:
      context: "go.mod says go 1.22."
      diff: |
        +for _, u := range users {
        +    g.Go(func() error { return notify(ctx, u) })
        +}
    assert:
      - {type: llm-rubric, value: "Recognises that since Go 1.22 each iteration has its own u, so there is no loop-variable capture bug, and does not report one; approves or raises only minor points."}
  - name: negative-correct-error-flow
    vars:
      context: "Go 1.23."
      diff: |
        +resp, err := client.Do(req)
        +if err != nil {
        +    return fmt.Errorf("fetch %s: %w", url, err)
        +}
        +defer resp.Body.Close()
        +if resp.StatusCode != http.StatusOK {
        +    return fmt.Errorf("fetch %s: status %d", url, resp.StatusCode)
        +}
    assert:
      - {type: llm-rubric, value: "Recognises the error check before the deferred Close and %w wrapping as correct and approves or raises only minor points (such as draining the body for connection reuse on the non-200 path or confirming the client has a timeout); does not invent nil-pointer or unchecked-error findings."}
