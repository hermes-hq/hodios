schema: 1
baseline: "Is this algorithm correct? {{problem}} {{code}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-greedy-coins
    vars:
      problem: "Given coin denominations (1 <= len <= 50, values up to 10^4, always including 1) and an amount up to 10^4, return the minimum number of coins."
      claim: "Greedy, O(n log n)."
      code: |
        def min_coins(coins, amount):
            count = 0
            for c in sorted(coins, reverse=True):
                count += amount // c
                amount %= c
            return count
    assert:
      - {type: contains, value: "## Counterexamples"}
      - {type: llm-rubric, value: "Gives a concrete counterexample such as coins [1, 3, 4] and amount 6, where greedy returns 3 (4+1+1) but the optimum is 2 (3+3), traced step by step."}
      - {type: llm-rubric, value: "Explains greedy is only optimal for canonical coin systems, and outlines a dynamic programming fix with O(amount × coins) time that fits the constraints."}
  - name: edge-correct-binary-search
    vars:
      problem: "Return the index of target in a sorted array of distinct ints (length up to 10^5), or -1."
      code: |
        def search(a, t):
            lo, hi = 0, len(a) - 1
            while lo <= hi:
                mid = (lo + hi) // 2
                if a[mid] == t: return mid
                if a[mid] < t: lo = mid + 1
                else: hi = mid - 1
            return -1
    assert:
      - {type: llm-rubric, value: "Declares the code correct, states the invariant that the target if present lies in a[lo..hi], checks the empty array and single element cases, and notes Python integers do not overflow, without inventing bugs."}
  - name: negative-hidden-quadratic
    vars:
      problem: "Remove all zeros from a list of up to 10^6 integers, preserving order."
      claim: "O(n)"
      code: |
        def strip_zeros(xs):
            i = 0
            while i < len(xs):
                if xs[i] == 0: xs.pop(i)
                else: i += 1
            return xs
    assert:
      - {type: llm-rubric, value: "Rejects the O(n) claim, explaining that list.pop(i) shifts elements so the worst case is O(n^2), which is too slow at 10^6, and notes it mutates the input; proposes a linear approach."}
