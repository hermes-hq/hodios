schema: 1
baseline: "Give me some code with bugs to find."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-go-medium
    vars:
      language: Go
      difficulty: medium
      defect_types: ""
    assert:
      - {type: contains, value: "## Diff"}
      - {type: llm-rubric, value: "Presents a realistic Go pull request with a confident description and a line-numbered diff of roughly 100 lines, explains the L<number> comment format, :hint and :submit, keeps the answer key in a collapsed block, and contains no code comments that point at the bugs."}
  - name: edge-security-focus
    vars:
      language: "Python with Django"
      difficulty: easy
      defect_types: "security only"
    assert:
      - {type: llm-rubric, value: "The answer key lists three planted defects that are all security issues (for example injection, missing authorisation, sensitive data in logs), each with a line number and triggering input."}
  - name: negative-missing-language
    vars:
      language: ""
      difficulty: hard
      defect_types: ""
    assert:
      - {type: llm-rubric, value: "Asks which language to use and stops without generating a pull request."}
