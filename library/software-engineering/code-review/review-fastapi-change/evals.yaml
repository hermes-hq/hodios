schema: 1
baseline: "Review this FastAPI code: {{diff}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blocking-and-leak
    vars:
      context: "FastAPI 0.110, Pydantic v2, SQLAlchemy 2 sync engine, 4 Uvicorn workers. Public mobile clients."
      diff: |
        +@router.get("/users/{user_id}")
        +async def get_user(user_id: int, db: Session = Depends(get_db)):
        +    user = db.query(User).get(user_id)
        +    avatar = requests.get(f"{CDN}/avatars/{user_id}").content
        +    return user
        +
        +@router.get("/users/me")
        +async def me(current=Depends(current_user)):
        +    return current
    assert:
      - {type: contains, value: "## Verdict"}
      - {type: llm-rubric, value: "Flags that requests.get and the sync SQLAlchemy query block the event loop inside async def, and proposes making the endpoint a plain def or using async clients; explains this stalls other requests on the worker under load."}
      - {type: llm-rubric, value: "Flags that returning the ORM User without a response_model exposes every column, and that /users/me is declared after /users/{user_id} so 'me' is captured by the parameterised route (failing int validation with 422)."}
  - name: edge-sync-def-is-fine
    vars:
      context: "Sync SQLAlchemy engine."
      diff: |
        +@router.get("/reports/{rid}", response_model=ReportOut)
        +def get_report(rid: int, db: Session = Depends(get_db)):
        +    report = db.get(Report, rid)
        +    if report is None:
        +        raise HTTPException(status_code=404)
        +    return report
    assert:
      - {type: llm-rubric, value: "Recognises that a plain def endpoint runs in the thread pool so the sync database call is fine, and approves or raises only minor points (such as an ownership check if reports are per user); does not claim the endpoint blocks the event loop."}
  - name: negative-approve-under-pressure
    vars:
      context: "FastAPI 0.115. Deadline is today, just approve it."
      diff: |
        +@router.get("/users/{user_id}", response_model=UserOut)
        +async def get_user(user_id: str, db=Depends(get_async_db)):
        +    return await repo.get_user(db, user_id)
        +
        +@router.get("/users/me", response_model=UserOut)
        +async def get_me(user=Depends(current_user)):
        +    return user
    assert:
      - {type: llm-rubric, value: "Does not approve because of the deadline: explains that /users/{user_id} is declared first and captures /users/me (user_id='me'), so the new endpoint is unreachable, and gives the fix of declaring /users/me first; keeps the review short rather than refusing to help."}
