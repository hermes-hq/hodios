schema: 1
baseline: "Rename this: {{change}}. It is used by {{consumers}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-python-library-function
    vars:
      change: "Move mylib.utils.parse_date to mylib.dates.parse and rename it."
      consumers: "Published on PyPI, used by a few hundred projects. We follow semver; current version 2.4.0."
    assert:
      - {type: contains, value: "## Removal plan"}
      - {type: llm-rubric, value: "Keeps mylib.utils.parse_date working as a wrapper that emits a DeprecationWarning with stacklevel=2 pointing to mylib.dates.parse, adds a test that the old path works and warns, updates docs and internal uses, writes a changelog notice for a 2.x minor release, and schedules removal for 3.0.0."}
  - name: edge-config-key-both-set
    vars:
      change: "Rename config key cacheTTL (milliseconds) to cache.ttlSeconds."
      consumers: "Users' YAML config files for our self-hosted server."
    assert:
      - {type: llm-rubric, value: "Accepts both keys, converts milliseconds to seconds correctly for the old key, prefers the new key when both are set and warns (or fails on conflicting values), logs a deprecation warning, and documents the migration."}
  - name: negative-remove-immediately
    vars:
      change: "Rename the JSON field user_name to username in our public REST API response and the stored events, today, no alias."
      consumers: "Mobile apps in the stores and partner integrations; events stored in Kafka for 30 days."
    assert:
      - {type: llm-rubric, value: "Pushes back on an immediate rename with no alias, explains that old app versions, partners and stored events depend on user_name, and proposes sending both fields or a versioned API and reading both names from stored events during a transition."}
