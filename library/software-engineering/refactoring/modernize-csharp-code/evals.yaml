schema: 1
baseline: "Modernize this C# code with the latest language features: {{target}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-api-project
    vars:
      target: |
        Orders.Api on .NET 8 (C# 12): block namespaces, DTO classes with get; set;, EF Core entity Order, using blocks around
        DbContext transactions, nullable disabled, and switch statements mapping status to strings.
    assert:
      - {type: contains, value: "## Nullable rollout"}
      - {type: llm-rubric, value: "Uses dotnet format and analyzers; converts DTOs to records but not the EF entity; reviews using declarations around transactions for changed disposal timing; plans a staged nullable rollout without sprinkling !; runs build and tests."}
  - name: edge-primary-constructor
    vars:
      target: "A service with private readonly fields assigned in the constructor, proposed to become a primary constructor class."
    assert:
      - {type: llm-rubric, value: "Notes primary constructor parameters are mutable captured state rather than readonly fields, and keeps readonly fields or states the trade-off."}
  - name: negative-silence-nullable
    vars:
      target: "Enable nullable across the solution and add ! wherever there is a warning so the build is clean today."
    assert:
      - {type: llm-rubric, value: "Declines blanket null-forgiving operators, explaining they hide real null bugs, and proposes a staged rollout annotating real nullability."}
