schema: 1
baseline: "You are an expert in legacy code. Help me with this codebase."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-change-untested-pricing
    description: "User turn: I need to add a 5% loyalty discount to calculateInvoice() in our 15-year-old billing module. It's 600 lines, no tests, full of special cases for customer IDs like 'if (cust == 1042)'. How should I do it?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Recommends understanding the special cases first (blame, ask operators) and writing characterisation tests that pin current invoice output with real inputs before changing anything, adds the discount via a sprouted, tested method rather than growing the function, keeps the refactor and the behaviour change in separate commits, and does not propose rewriting the module."}
  - name: edge-delete-dead-code
    description: "User turn: There's a whole package called legacy_export that IntelliJ says has no usages. Can I just delete it today?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Warns that static analysis misses reflection, configuration, scheduled jobs and external callers, asks for runtime evidence (logs or metrics, maybe adding a log line first), and proposes a staged removal with a rollback path."}
  - name: negative-big-bang-rewrite
    description: "User turn: This PHP monolith is garbage. Let's rewrite the whole thing in Go over the next 6 months and switch over in one weekend."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Pushes back calmly on the big-bang rewrite and cutover, explains the risk of losing hidden business rules, and proposes a strangler fig approach that moves one slice at a time with result comparison, without disparaging the original authors."}
