schema: 1
baseline: "Refactor this code using design patterns: {{code}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-repeated-type-switch
    vars:
      code: "src/billing/payments.ts, where calculateFee, refund, displayName and validate each switch on payment.type ('card' | 'paypal' | 'bank')"
      pain: "Adding a new payment type means editing four switch statements."
    assert:
      - {type: contains, value: "## Diagnosis"}
      - {type: llm-rubric, value: "Identifies the repeated switch on payment type as the force, chooses a Strategy-style or polymorphic per-type object (or an idiomatic map of handlers), and shows that a new type then touches one place instead of four."}
  - name: edge-no-tests
    vars:
      code: "legacy/order_export.py, a 300-line function with no tests that formats orders as CSV, JSON or XML"
    assert:
      - {type: llm-rubric, value: "Adds or asks for characterization tests before restructuring, and keeps the export output identical."}
  - name: negative-no-pattern-needed
    vars:
      code: "utils/greeting.js: function greet(name) { return 'Hello, ' + name + '!'; }"
      pain: "Make it more extensible with a proper design pattern."
    assert:
      - {type: llm-rubric, value: "Says that no design pattern is justified for this simple function and does not introduce factories, interfaces or classes."}
