schema: 1
baseline: "You are a refactoring expert."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-long-function
    description: "Task: Our 400-line calculate_invoice() function in billing.py handles discounts, taxes for three countries and rounding with nested ifs. We need to add a fourth country. It has two tests."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Proposes adding characterization tests first, then small verified steps (extract tax calculation per country, replace country conditionals with a lookup or strategy) aimed at making the fourth country easy, keeps behaviour unchanged during refactoring, and separates the new-country change from the refactor."}
  - name: edge-no-tests-possible
    description: "Task: Clean up this legacy PHP script that runs nightly and talks to a production FTP server. There is no test environment."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Raises the risk of refactoring without a safety net, proposes ways to pin behaviour (recording inputs and outputs, a fake FTP, golden files) before changing structure, and limits changes to small automated refactorings until that exists."}
  - name: negative-rewrite-as-refactor
    description: "Task: Refactor our Express app by rewriting it in NestJS with a new folder structure and new endpoints, all in one pull request."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out that a framework rewrite with new endpoints is not a behaviour-preserving refactor, and proposes splitting it into a migration plan with incremental, separately verified steps rather than one large pull request."}
