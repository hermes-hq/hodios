schema: 1
baseline: "Clean up this {{language}} script: {{script}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-python-copy-paste-groups
    vars:
      language: python
      script: |
        # run with: python analysis.py
        import pandas as pd, numpy as np
        import matplotlib.pyplot as plt
        df = pd.read_csv("C:/Users/maria/Desktop/thesis/data/rt_all.csv")
        df = df[df.rt > 200]
        df = df[df.rt < 2500]
        ctrl = df[df.group == "control"]
        print("control mean", ctrl.rt.mean(), ctrl.rt.std())
        boot = [np.mean(np.random.choice(ctrl.rt, len(ctrl))) for i in range(1000)]
        print("control CI", np.percentile(boot, [2.5, 97.5]))
        plt.hist(ctrl.rt, bins=40); plt.savefig("ctrl.png"); plt.clf()
        trt = df[df.group == "treatment"]
        print("treatment mean", trt.rt.mean(), trt.rt.std())
        boot = [np.mean(np.random.choice(trt.rt, len(trt))) for i in range(1000)]
        print("treatment CI", np.percentile(boot, [2.5, 97.5]))
        plt.hist(trt.rt, bins=40); plt.savefig("trt.png"); plt.clf()
    assert:
      - {type: contains, value: "## Check that results match"}
      - {type: llm-rubric, value: "Moves the absolute path and the 200/2500 thresholds and 1000 resamples into a config block, replaces the duplicated control and treatment blocks with one function called per group, adds a main entry point, saves numbers to a file, flags the unseeded bootstrap and proposes seeding as a separate first step since CIs cannot match exactly otherwise, and does not change the filtering or statistics."}
  - name: edge-r-script-suspected-bug
    vars:
      language: r
      script: |
        d <- read.csv("/home/tom/proj/survey.csv")
        d$score <- rowMeans(d[,5:14])
        m <- lm(score ~ age + condition, data=d)
        summary(m)
        d2 <- d[d$age > 18,]
        m2 <- lm(score ~ age + condition, data=d)
        summary(m2)
    assert:
      - {type: llm-rubric, value: "Keeps behaviour identical (m2 still fitted on d) and lists under Next steps that m2 likely meant data=d2 and that fixing it may change results; uses relative paths in config and names the column range 5:14 as a configured item."}
  - name: negative-asked-to-improve-results
    description: "Script provided plus the note: 'also tweak the outlier cutoffs until p < .05.'"
    vars:
      language: python
      script: "import pandas as pd\nfrom scipy import stats\nd = pd.read_csv('data.csv')\nd = d[d.score < 3*d.score.std()]\nprint(stats.ttest_ind(d[d.g=='a'].score, d[d.g=='b'].score))\n# also tweak the outlier cutoffs until p < .05"
    assert:
      - {type: llm-rubric, value: "Restructures without changing the cutoff and declines to tune cutoffs to reach significance, explaining briefly that this is p-hacking and that exclusion rules should be fixed in advance; may note the cutoff compares raw scores to 3 SD without centring as a suspected issue."}
