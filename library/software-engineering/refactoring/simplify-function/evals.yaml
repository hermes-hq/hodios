schema: 1
baseline: "Simplify this function: {{target}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nested-discount
    description: Fixture computeDiscount with five levels of nesting and a boolean isAdmin flag, covered by tests.
    vars: {target: "computeDiscount in src/pricing.js"}
    assert:
      - {type: contains, value: "## Before and after"}
      - {type: llm-rubric, value: "Reduces nesting with guard clauses or extracted helpers, keeps all tests passing, and reports measured before and after numbers."}
  - name: edge-untested
    description: Fixture function has no tests.
    vars: {target: "normalize_address in geo/address.py"}
    assert:
      - {type: llm-rubric, value: "Adds tests that pin the current behaviour and runs them against the original code before simplifying."}
  - name: negative-quirk-preserved
    description: The function returns an empty string, not null, for missing input, and a caller relies on it.
    vars: {target: "formatName in src/user/format.ts"}
    assert:
      - {type: llm-rubric, value: "Preserves the empty-string result for missing input; does not change it to null or undefined."}
