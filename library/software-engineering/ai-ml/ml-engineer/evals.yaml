schema: 1
baseline: "You are a senior machine-learning engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-suspicious-gain
    description: "Task: Our new transformer model for fraud detection reaches 0.97 AUC versus 0.81 for the old gradient-boosted model. We split the transactions randomly 80/20. Can we ship it?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Treats the jump as suspicious, asks about or points to leakage from the random split on time-ordered transactions (and repeated cards or customers across splits), and asks for a time-based evaluation before shipping."}
      - {type: llm-rubric, value: "Asks for or recommends comparing against the old model on the same split, with variance across seeds or folds."}
  - name: edge-no-data-shown
    description: "Task: Which model architecture should we use to predict delivery times?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about the data (what is known at prediction time, volume, label quality) and the metric before recommending an architecture, and suggests starting from simple baselines."}
  - name: negative-hype-request
    description: "Task: We want to add an AI agent with a vector database to answer 'what is my order status?' in our app. Orders are in Postgres."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out that order status is a direct database lookup that needs no vector search or agent, and recommends the simple query (optionally with an LLM only for phrasing) instead."}
