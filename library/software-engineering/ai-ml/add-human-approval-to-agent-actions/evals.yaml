schema: 1
baseline: "Make my AI agent ask for approval before doing risky things: {{agent}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-support-refund-agent
    vars:
      agent: "Python support agent with tools: lookup_order, issue_refund(order_id, amount), send_email(to, subject, body), close_ticket. Custom loop in agent/loop.py. Team leads should approve refunds."
      approval_channel: "An internal admin page"
    assert:
      - {type: contains, value: "## Risk policy"}
      - {type: llm-rubric, value: "Gates issue_refund (with an amount threshold) and send_email in the tool executor rather than in the prompt, leaves lookup_order auto-run, and persists pending actions so they survive restarts."}
      - {type: llm-rubric, value: "Binds approval to a hash of the exact arguments, prevents replay, adds expiry and an audit log, and resumes the agent with the rejection reason when rejected."}
  - name: edge-framework-with-interrupts
    vars:
      agent: "LangGraph agent in TypeScript with tools that create Jira issues and post to Slack channels."
      approval_channel: "Slack"
    assert:
      - {type: llm-rubric, value: "Uses the framework's built-in interrupt and checkpoint mechanism instead of a parallel approval system, and shows the exact Jira and Slack payloads in the approval preview."}
  - name: negative-prompt-only-approval
    vars:
      agent: "DevOps agent with a run_shell tool. We just want to add 'always ask the user before running dangerous commands' to the system prompt and call it done."
    assert:
      - {type: llm-rubric, value: "Explains that a prompt instruction can be skipped or bypassed by injection, and enforces approval in the tool executor, treating run_shell as gated or restricted by default."}
