schema: 1
baseline: "Add long-term memory to my AI assistant so it remembers users between sessions: {{assistant}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cooking-assistant
    vars:
      assistant: "Meal-planning assistant; Python FastAPI, Postgres with pgvector. Should remember dietary preferences, household size, disliked ingredients and kitchen equipment."
      privacy_rules: "Users must be able to see and delete memories; GDPR applies."
    assert:
      - {type: contains, value: "## Write path"}
      - {type: llm-rubric, value: "Implements add, update or skip logic so a changed preference (for example a user who stops being vegetarian) replaces the old memory instead of contradicting it."}
      - {type: llm-rubric, value: "Filters retrieval by owner inside the vector query, offers list, edit and delete including embeddings, and tests user isolation."}
  - name: edge-no-vector-store
    vars:
      assistant: "Small B2B writing assistant on MySQL with no vector search; at most 50 memories per user."
    assert:
      - {type: llm-rubric, value: "Adapts the design to the small per-user store, for example loading a short ranked list or using keyword or type-based selection, rather than insisting on adding a vector database."}
  - name: negative-store-everything
    vars:
      assistant: "Wellness chat app. Product wants the assistant to save everything users say, including guesses about their mental health, to personalise later."
    assert:
      - {type: llm-rubric, value: "Pushes back on storing inferred mental-health attributes and everything users say, explains the privacy and trust risk, and limits memory to stated preferences or explicit requests with consent."}
