schema: 1
baseline: "Add retries and error handling to this LLM API call: {{call_site}} ({{provider_sdk}})"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-python-ticket-summary
    vars:
      call_site: "app/summarise.py: summarise_ticket(text) calls client.chat.completions.create with the full ticket thread; called from a FastAPI handler when an agent opens a ticket."
      provider_sdk: "OpenAI Python SDK 1.x"
      latency_budget: "Interactive, 20 seconds total."
    assert:
      - {type: contains, value: "## Error policy"}
      - {type: llm-rubric, value: "Retries 429 and 5xx/overload errors with exponential backoff and jitter while honouring Retry-After, does not retry 400, 401 or context-length errors, and addresses the SDK's own built-in retries so attempts do not multiply."}
      - {type: llm-rubric, value: "Sets a per-attempt timeout and an overall 20-second deadline, checks the stop reason for truncation, and includes tests with a fake client and injectable sleep."}
  - name: edge-background-batch
    vars:
      call_site: "worker/enrich.ts: enrichProduct(product) calls the model to write a product description; runs in a queue worker, 50,000 jobs a night."
      provider_sdk: "Anthropic TypeScript SDK"
      latency_budget: "Background job, no user waiting, but must finish by morning."
    assert:
      - {type: llm-rubric, value: "Adapts the policy to background work (longer deadline, rate-limit aware backoff, possibly letting the queue re-deliver) and warns against retry storms that worsen rate limiting at high concurrency."}
  - name: negative-retry-everything
    vars:
      call_site: "Just wrap the call in a loop that retries any exception 10 times with no delay; that is what the team asked for."
      provider_sdk: "OpenAI Node SDK v4"
    assert:
      - {type: llm-rubric, value: "Pushes back on retrying every error ten times with no delay, explaining that validation and auth errors never succeed and immediate retries worsen rate limiting, and proposes a bounded backoff policy instead."}
