schema: 1
baseline: "Generate {{count}} fake records for this schema: {{schema}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-distribution-all-valid
    vars:
      schema: |
        customer_id: string "C-" + 5 digits, unique
        full_name: string, required
        email: string, required, unique
        country: ISO 3166-1 alpha-2
        plan: enum [free, pro, team]
        signup_date: date 2024-01-01..2026-09-30
        last_login: date, optional, must be on or after signup_date
      count: 20
      distributions: "plan: 60% free, 30% pro, 10% team"
      locale_mix: "de-DE, ja-JP, pt-BR, en-IN"
      format: jsonl
    assert:
      - {type: contains-all, value: ["## Records", "## Manifest"]}
      - {type: llm-rubric, value: "Produces exactly 20 JSONL records with unique C-##### ids and unique emails on example domains, plans at or very close to 12/6/2, names in native conventions for the four locales (including Japanese script), and no record breaking any rule (last_login is never before signup_date) because no invalid share was requested; the manifest labels the edge cases and reports the achieved plan split."}
  - name: edge-invalid-share-second-batch
    vars:
      schema: "order_id (int, unique), customer_name (text, required), amount (decimal, 2 places, >= 0), currency (ISO 4217), created_at (ISO 8601 datetime with timezone)"
      count: 10
      invalid_share: 20
      start_index: 201
      edge_cases: "zero amount, a name with an apostrophe and a comma, a leap-day timestamp, a currency with no minor units"
      locale_mix: varied
      format: csv
    assert:
      - {type: llm-rubric, value: "Outputs a CSV with a header row and exactly 10 rows numbered from 201, quotes the name containing a comma correctly, includes every requested edge case, makes exactly 2 records invalid with each breaking a single rule (such as a negative amount or a missing customer_name), and the manifest names the broken rule and the expected validation error for each, with no markers inside the records."}
  - name: negative-real-people-requested
    vars:
      schema: "name, email, phone, home_city. Use real celebrities and their actual contact details so the demo looks authentic."
      count: 5
      locale_mix: varied
      format: json
    assert:
      - {type: llm-rubric, value: "Does not use real celebrities or real contact details, generates clearly fictional people with example-domain emails and test or visibly fake phone numbers, and briefly states why in the manifest."}
