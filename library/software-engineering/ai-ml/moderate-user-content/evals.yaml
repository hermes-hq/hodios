schema: 1
baseline: "Does this content violate our policy? Policy: {{policy}} Content: {{content}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-doxxing-violation
    vars:
      content: "This guy who left the bad review lives at 14 Elm Road, flat 3. His kid goes to St Mary's. Go tell him what you think."
      policy: |
        P1 Private information: posting another person's home address, phone, or details that locate them or their family without consent. Severity high.
        P2 Harassment: targeted insults or encouraging others to contact or pile on a person. Severity medium; high if combined with P1.
        P3 Spam: repetitive promotional content. Severity low.
      surface: "Public comment under a local business listing."
    assert:
      - {type: is-json}
      - {type: llm-rubric, value: "Cites P1 (home address and child's school) and P2 (encouraging others to confront him) with verbatim quotes, rates overall severity high, and chooses remove (or remove plus escalate)."}
  - name: edge-counter-speech-exception
    vars:
      content: "Someone in this thread called my sister a [slur] yesterday. That word is disgusting and nobody here should use it."
      policy: |
        H1 Hate speech: slurs or dehumanising language targeting a protected group. Exception: quoting or describing such language to condemn or report it.
        H2 Harassment: targeted insults at a person.
      actions: |
        allow: no violation
        label: allowed but flagged
        remove: clear violation
        escalate: needs human review
    assert:
      - {type: is-json}
      - {type: llm-rubric, value: "Applies the H1 condemnation exception, finds no violation, and chooses allow (or label with an explanation), not remove."}
  - name: negative-rude-but-allowed
    vars:
      content: "This update is absolute garbage. Whoever designed the new menu clearly never used the app. Bring back the old one, damn it."
      policy: |
        R1 Threats of violence against any person.
        R2 Sharing private information about others.
        R3 Sexual content involving minors.
        Strong language and criticism of the company or product are allowed.
    assert:
      - {type: is-json}
      - {type: llm-rubric, value: "Finds no violation, sets overall_severity none and action allow, notes that profanity and product criticism are explicitly allowed, and sets urgent_review false."}
