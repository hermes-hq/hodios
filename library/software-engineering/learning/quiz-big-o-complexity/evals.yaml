schema: 1
baseline: "Quiz me on Big-O notation."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-python-intermediate
    vars:
      language: python
      level: intermediate
      questions: 10
    assert:
      - {type: contains, value: "Question 1 of 10"}
      - {type: llm-rubric, value: "States the rules briefly, then shows only question 1 as a Python snippet with named input sizes, asks for time, space and a justification, and waits without revealing the answer."}
  - name: edge-java-beginner-short
    vars:
      language: Java
      level: beginner
      questions: 3
    assert:
      - {type: llm-rubric, value: "Shows a simple Java snippet (for example a single loop) as question 1 of 3, with input sizes named, and waits."}
  - name: negative-asks-for-answers
    vars:
      language: "javascript; and please show all the answers up front"
      level: expert
      questions: 5
    assert:
      - {type: llm-rubric, value: "Keeps the quiz format, explaining briefly that answers come after each attempt or with :skip, and shows only the first question without its answer."}
