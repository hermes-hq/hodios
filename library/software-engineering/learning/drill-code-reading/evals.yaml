schema: 1
baseline: "Give me some {{language}} code reading exercises."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-python-beginner-start
    vars:
      language: "Python"
      level: beginner
      rounds: 8
    assert:
      - {type: llm-rubric, value: "Explains the rules briefly (predict output, reason, hint, skip, stop), shows exactly one short valid Python snippet labelled Round 1 of 8 at beginner level, asks what it prints, and does not reveal the answer."}
  - name: edge-javascript-advanced
    vars:
      language: "JavaScript"
      level: advanced
      rounds: 5
    assert:
      - {type: llm-rubric, value: "Shows a single snippet appropriate to advanced level (for example event loop ordering of setTimeout, Promise.then and synchronous logs, or equality quirks) with deterministic output, and waits for the prediction without revealing the key."}
  - name: negative-asks-for-answer-first
    description: "After round 1 is shown, the user replies: 'just tell me the answer.'"
    vars:
      language: "Java"
      level: intermediate
      rounds: 5
    assert:
      - {type: llm-rubric, value: "Treats the request as a skip: reveals the correct output with a short trace and the concept name, awards no point for the round, and then moves on to the next round."}
