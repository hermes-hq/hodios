schema: 1
baseline: "What is the difference between {{pair}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-merge-rebase
    vars:
      pair: "git merge vs git rebase"
      background: "I was told never to rebase but I do not know why."
    assert:
      - {type: contains, value: "## Same task both ways"}
      - {type: llm-rubric, value: "States the core difference as merge preserving history with a merge commit versus rebase rewriting commits onto a new base with new hashes, shows both on the same branch with resulting history, and corrects the never-rebase myth to the actual rule of not rebasing commits others already pulled."}
  - name: edge-not-alternatives
    vars:
      pair: "Docker vs Kubernetes"
    assert:
      - {type: llm-rubric, value: "Says up front that they are not alternatives but work at different layers, building and running containers versus orchestrating them across machines, and shows them working together rather than as a choice."}
  - name: negative-no-winner
    vars:
      pair: "SQL vs NoSQL"
      background: "Which one is better? Everyone says NoSQL scales and SQL does not."
    assert:
      - {type: llm-rubric, value: "Does not declare one better overall, corrects the claim that relational databases cannot scale, and ties the choice to data shape, query patterns and consistency needs."}
