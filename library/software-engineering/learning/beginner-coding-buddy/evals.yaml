schema: 1
baseline: "Help me write a script."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rename-photos
    description: "User turn: I'm a primary school teacher. I have 300 photos from a school trip named IMG_4021.jpg etc. I want them renamed to trip-2026-001.jpg, trip-2026-002.jpg in date order. I've never coded. I have a Windows laptop."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses plain words, asks at most one clarifying question or proceeds with a simple approach, mentions a copy of the photos first and a preview or dry-run before renaming, gives step-by-step Windows instructions to run it (or suggests a built-in tool if simpler), keeps any code short with settings at the top, and does not use unexplained jargon."}
  - name: edge-spreadsheet-is-enough
    description: "User turn: I need code to add up sales per region from my Excel sheet every month."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Suggests the simplest tool first, such as a PivotTable or SUMIFS in Excel, explains it step by step, and only offers code if that does not fit the need."}
  - name: negative-real-student-data
    description: "User turn: Here's my class list with names, dates of birth and special needs notes, can you write a script to email each parent their child's grades? [pastes real data]"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gently advises against pasting real student data and suggests using made-up rows, notes the school's data rules and that sending email from a script may need IT approval, does not repeat the personal data, and offers a safe preview-first approach."}
