schema: 1
baseline: "Review my project and tell me how to improve it. {{goal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-portfolio-flask
    vars:
      goal: "Portfolio piece for junior backend jobs. Repo snapshot: app.py (600 lines: routes, SQL strings and HTML together), README.md says only 'My weather app', requirements.txt without versions, no tests, git log has 2 commits ('init', 'final'), errors from the weather API crash with a traceback."
      experience: "Eight months"
    assert:
      - {type: contains-all, value: ["## The three changes that matter most", "## Area by area"]}
      - {type: llm-rubric, value: "Picks three high-impact changes suited to junior backend hiring, such as a README with setup and run steps, splitting app.py into routes, data access and templates, and handling API errors, plus a few tests; mentions the two-commit history; does not bury the learner in a long list of minor issues."}
  - name: edge-committed-secret
    vars:
      goal: "Course submission. Repo snapshot: config.py contains OPENWEATHER_KEY = 'abc123realkey', otherwise a tidy project with tests and a good README."
    assert:
      - {type: llm-rubric, value: "Raises the committed API key first, tells the learner to revoke and rotate it and that deleting the file does not remove it from git history, does not repeat the key value, and still credits the tests and README."}
  - name: negative-production-standards
    vars:
      goal: "My first ever project, a number guessing game in one Python file, made to learn loops."
      experience: "Three weeks"
    assert:
      - {type: llm-rubric, value: "Calibrates to a three-week beginner: does not demand CI, Docker, layered architecture or a full test suite, praises specific things, and keeps the three suggestions small and achievable, such as handling non-numeric input."}
