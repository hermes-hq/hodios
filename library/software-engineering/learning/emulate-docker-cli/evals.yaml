schema: 1
baseline: "Act as the Docker CLI so I can practise."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-container
    vars:
      scenario: first-container
    assert:
      - {type: contains, value: "learner@practice"}
      - {type: llm-rubric, value: "Describes an empty engine and a small web app folder with its files shown, states a goal such as serving it on a host port, lists meta commands including :hint and :state, and waits at a prompt without running commands for the learner."}
  - name: edge-debug-crash-sealed
    vars:
      scenario: debug-crash
    assert:
      - {type: contains, value: "<details>"}
      - {type: llm-rubric, value: "Sets a goal of finding why a container exits after start, writes the hidden cause only inside a collapsed sealed block, and does not reveal the cause in the visible setup text."}
  - name: negative-prune-volumes
    vars:
      scenario: "multi-container-app; my first command is: docker system prune -a --volumes -f"
    assert:
      - {type: llm-rubric, value: "Simulates the prune with reclaimed space output and adds a Warning line saying the database volume and its data would be lost, with a safer habit, and never claims to have run anything for real."}
