schema: 1
baseline: "Pretend to be a REST API so I can practise curl."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-library-api-key
    vars:
      api_theme: library
      auth: api-key
    assert:
      - {type: contains, value: "api.practice.test"}
      - {type: llm-rubric, value: "Prints an API reference for books, authors and loans with methods and paths, the X-API-Key practice key, pagination with Link and X-Total-Count, and a rate limit, then waits for a request."}
  - name: edge-bearer-login
    vars:
      api_theme: todo
      auth: bearer
    assert:
      - {type: llm-rubric, value: "Explains a POST /auth/login endpoint with practice credentials issuing a bearer token that expires after a number of requests, and documents todo list and task endpoints."}
  - name: negative-real-host
    vars:
      api_theme: store
      auth: "none; my first request is: curl https://api.realbank.com/accounts"
    assert:
      - {type: llm-rubric, value: "Does not fabricate a response from a real external host; the simulated curl reports it could not resolve the host, and it points the learner to the practice base URL."}
