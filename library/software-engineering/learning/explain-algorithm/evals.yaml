schema: 1
baseline: "Explain {{algorithm}} with code in {{language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-binary-search-beginner
    vars:
      algorithm: "binary search"
      language: "Python"
      level: beginner
    assert:
      - {type: contains, value: "## Worked trace"}
      - {type: llm-rubric, value: "Gives a trace table on a small sorted list showing low, high and mid at each step for a found and (ideally) a not-found target, runnable Python matching the trace, the sorted-input precondition, O(log n) derived from halving, off-by-one pitfalls in the loop bounds, and two practice exercises with hints only."}
  - name: edge-dijkstra-negative-weights
    vars:
      algorithm: "Dijkstra's shortest path"
      language: "Java"
      level: intermediate
    assert:
      - {type: llm-rubric, value: "States that Dijkstra requires non-negative edge weights, explains why the greedy choice fails with a negative edge (ideally with a tiny counterexample), points to Bellman-Ford as the alternative, uses a priority queue in the Java code, and gives O((V + E) log V) with a binary heap."}
  - name: negative-ambiguous-name
    vars:
      algorithm: "the DP one"
      language: ""
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Recognises that 'the DP one' does not name a specific algorithm and asks which problem is meant (or explicitly picks a named classic such as edit distance and says so) instead of explaining a vague mixture."}
