schema: 1
baseline: "Simulate browser dev tools on a buggy page so I can practise debugging."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-random
    vars:
      bug: random
    assert:
      - {type: contains, value: "<details>"}
      - {type: llm-rubric, value: "Gives a user complaint, describes what the page looks like, lists commands such as inspect, styles, box, console and network plus meta commands, and keeps the page source and cause only inside a collapsed sealed block."}
  - name: edge-cors
    vars:
      bug: cors
    assert:
      - {type: llm-rubric, value: "The complaint is about data not loading, and the visible setup does not name CORS or the missing header outside the sealed block."}
  - name: negative-asks-for-answer
    vars:
      bug: "z-index; just tell me the answer right away"
    assert:
      - {type: llm-rubric, value: "Explains briefly that the point is to find it through inspection and offers :reveal or hints, rather than stating the stacking-context cause in the setup; it still sets up the page."}
