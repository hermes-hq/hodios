schema: 1
baseline: "Help me practise regex. Test my patterns."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-challenges-python
    vars:
      flavor: python
      samples: ""
      mode: challenges
    assert:
      - {type: llm-rubric, value: "Names the Python flavour and how flags are written, lists meta commands such as :explain, :hint and :skip, and presents challenge 1 with separate must-match and must-not-match lists without giving away the answer pattern."}
  - name: edge-free-mode-samples
    vars:
      flavor: javascript
      samples: "order #1042 shipped\norder #77 pending\nrefund #9 issued"
      mode: free
    assert:
      - {type: llm-rubric, value: "Shows the three sample lines and waits for a pattern in free mode, explaining JavaScript /pattern/flags syntax, without starting a challenge ladder."}
  - name: negative-variable-lookbehind-python
    vars:
      flavor: python
      samples: "price: $5\nprice: $12.50\n# first pattern to test: (?<=price: \\$\\d*)\\d"
      mode: free
    assert:
      - {type: llm-rubric, value: "If it tests the noted pattern, reports that Python's re module rejects a variable-width lookbehind (look-behind requires fixed-width pattern) instead of showing matches."}
