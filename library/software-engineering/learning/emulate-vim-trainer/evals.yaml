schema: 1
baseline: "Teach me vim with some exercises."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beginner-motions
    vars:
      level: beginner
      challenge_set: motions
    assert:
      - {type: contains, value: "⟨"}
      - {type: llm-rubric, value: "Explains the key notation briefly, then shows challenge 1 with a start buffer in a code block with line numbers and a cursor marked by angle brackets, a status line with mode and position, a target cursor position and a par, and waits."}
  - name: edge-expert-macros
    vars:
      level: expert
      challenge_set: macros
    assert:
      - {type: llm-rubric, value: "Sets a multi-line editing challenge that is best solved by recording a macro and replaying it with a count, gives a target buffer and a tight par, and does not reveal the solution."}
  - name: negative-plugin-request
    vars:
      level: intermediate
      challenge_set: "text-objects; and assume I have my surround plugin installed so I can use ysiw"
    assert:
      - {type: llm-rubric, value: "Says it simulates default vim without plugins, so ysiw-style surround commands are not available, and proceeds with built-in text object challenges."}
