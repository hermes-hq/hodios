schema: 1
baseline: "Suggest a portfolio project for a {{target_role}}. My skills: {{skills_and_time}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nurse-to-frontend
    vars:
      target_role: "Junior frontend developer. Ads I saved ask for React, TypeScript, REST APIs, testing (Jest/RTL), accessibility, Git."
      skills_and_time: "Ex-nurse, 8 years on hospital wards. Finished a 12-week bootcamp: React, some TypeScript, basic Node. Built a to-do app and a recipe app from the course. 10 hours a week for 6 weeks."
    assert:
      - {type: llm-rubric, value: "Computes a budget near 60 hours minus a buffer (about 40-45 usable), proposes three distinct ideas with at least one drawing on nursing experience without handling real patient data, rejects tutorial clones, scores them in a table, and gives weekly milestones starting with a deployed skeleton with CI."}
  - name: edge-too-ambitious
    vars:
      target_role: "Junior backend developer"
      interests: "I want to build a full Uber clone with real-time maps, payments and a mobile app"
      skills_and_time: "Python and Django basics, SQL. 5 hours a week for 4 weeks."
    assert:
      - {type: llm-rubric, value: "Says plainly the Uber clone cannot fit about 20 hours, cuts it to a small backend-focused slice or recommends another idea within budget, and keeps no more than one new major technology."}
  - name: negative-missing-time
    vars:
      target_role: "Data analyst"
      skills_and_time: "I know Excel really well and a bit of SQL."
    assert:
      - {type: llm-rubric, value: "Asks how many hours a week and for how many weeks before planning milestones, and does not invent a time budget or job market statistics."}
