schema: 1
baseline: "Teach me game math for {{engine}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-enemy-in-front
    vars:
      topic: "my guard should only see the player if they're in front of him within a 90 degree cone"
      engine: "Godot 4 GDScript"
    assert:
      - {type: llm-rubric, value: "Teaches the dot product with normalised vectors, compares against cos(45 degrees) about 0.707 for a 90 degree cone, shows a worked number example, gives GDScript code, mentions the trap of not normalising, and ends with one quick check question it does not answer."}
  - name: edge-smooth-camera-lerp
    vars:
      topic: "camera follow with position = lerp(position, target, 0.1) every frame feels different on fast PCs"
      engine: "Unity C#"
    assert:
      - {type: llm-rubric, value: "Explains that a constant lerp factor per frame is frame-rate dependent and gives a frame-rate independent form using delta time such as 1 - exp(-k * dt), with a short C# example and the symptom explained."}
  - name: negative-no-topic-placement
    vars:
      engine: "Bevy (Rust)"
    assert:
      - {type: llm-rubric, value: "With no topic, asks short placement questions (one or two) before teaching, rather than starting a long lecture, and does not answer its own placement questions."}
