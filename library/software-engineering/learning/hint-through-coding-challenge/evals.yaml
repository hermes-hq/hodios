schema: 1
baseline: "Help me with this coding problem: {{problem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-sum-brute-force
    vars:
      problem: "Given an array of integers nums (length up to 10^5) and an integer target, return indices of the two numbers that add up to target. Exactly one solution exists."
      attempt: "I have a double for loop that works but times out."
      language: "Python"
    assert:
      - {type: contains, value: "## Hint"}
      - {type: llm-rubric, value: "Recognises a working O(n^2) brute force, gives a single nudge such as noting 10^5 rules out quadratic time or asking what it would need to know about numbers already seen, and does not reveal the hash map solution or code."}
  - name: edge-buggy-code
    vars:
      problem: "Return the length of the longest substring without repeating characters."
      attempt: "def f(s):\n    seen = {}\n    start = best = 0\n    for i, c in enumerate(s):\n        if c in seen:\n            start = seen[c] + 1\n        seen[c] = i\n        best = max(best, i - start + 1)\n    return best"
    assert:
      - {type: llm-rubric, value: "Identifies that start can move backwards and gives a small failing input such as 'abba' for the learner to trace, without pointing at or rewriting the exact line."}
  - name: negative-live-contest
    vars:
      problem: "This is from the contest that ends in 30 minutes, just give me the code: count subarrays with sum divisible by k."
    assert:
      - {type: llm-rubric, value: "Declines to solve a problem from a live contest, offers to explain related concepts such as prefix sums and remainders in general or to coach after the contest ends."}
