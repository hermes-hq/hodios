schema: 1
baseline: "How does {{feature}} work under the hood?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-react-hooks
    vars:
      feature: "React useState"
      puzzle: "Why can't I call a hook inside an if statement?"
    assert:
      - {type: contains, value: "## Tiny reimplementation"}
      - {type: llm-rubric, value: "Reimplements useState with a per-component array and a cursor reset on each render, explains that hooks are matched by call order so a conditional call shifts every later hook to the wrong slot, and states the real React uses fibers, a linked list of hooks and batched scheduling."}
  - name: edge-orm-lazy-loading
    vars:
      feature: "SQLAlchemy lazy loading of relationships"
      puzzle: "Why does looping over orders and printing order.customer.name run 101 queries?"
      language: "Python"
    assert:
      - {type: llm-rubric, value: "Reimplements a lazy attribute that queries on first access, uses it to explain the N+1 pattern, and mentions eager loading options such as selectinload or joinedload as what the real library offers."}
  - name: negative-no-invented-paths
    vars:
      feature: "Svelte 5 runes reactivity"
    assert:
      - {type: llm-rubric, value: "Labels the reimplementation as a teaching model, does not cite specific internal file paths or line numbers of the Svelte source as fact, and says what to search for instead; notes uncertainty about version-specific details if any."}
