schema: 1
baseline: "Act as a GraphQL API so I can practise queries."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-store
    vars:
      schema_theme: store
    assert:
      - {type: contains, value: "pageInfo"}
      - {type: llm-rubric, value: "Prints an SDL schema for products, variants, carts and orders with non-null markers, an interface or union, an enum, input types, connection-style pagination and one field that needs authentication, writes seed data in a collapsed block, and explains how to send operations with variables and headers."}
  - name: edge-library-auth
    vars:
      schema_theme: library
    assert:
      - {type: llm-rubric, value: "Documents which field requires the Bearer practice-token header and keeps the seed records fictional."}
  - name: negative-misspelt-field
    vars:
      schema_theme: "social; my first operation is: query { user(id: \"1\") { nmae } }"
    assert:
      - {type: llm-rubric, value: "If it answers the operation, it returns only an errors array (no data) with a message that the field nmae cannot be queried on the user type, suggesting name, plus a locations entry, rather than returning data."}
