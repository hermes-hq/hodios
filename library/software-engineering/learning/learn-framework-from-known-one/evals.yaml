schema: 1
baseline: "I know {{known}}. Teach me {{target}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-react-to-vue
    vars:
      known: "React 18 with hooks"
      target: "Vue 3 with the Composition API"
      goal: "Maintain an existing Vue app at a new job."
    assert:
      - {type: contains-all, value: ["## Concept map", "## False friends"]}
      - {type: llm-rubric, value: "Explains Vue's fine-grained reactivity with ref and reactive versus React re-rendering the component function, maps useState, useEffect, props and context to ref, watch or watchEffect, props and provide/inject, flags false friends such as destructuring a reactive object losing reactivity and .value on refs, and shows the same feature in both."}
  - name: edge-backend-frameworks
    vars:
      known: "Django 5"
      target: "Ruby on Rails 7"
    assert:
      - {type: llm-rubric, value: "Maps Django models, views, URLs, templates, forms and migrations to Rails models, controllers, routes, views, strong parameters and migrations, explains the convention-over-configuration difference, and flags that a Django view corresponds to a Rails controller action rather than a Rails view."}
  - name: negative-no-version-mixing
    vars:
      known: "Express"
      target: "NestJS"
      goal: "I keep seeing old tutorials, please do not mix versions."
    assert:
      - {type: llm-rubric, value: "States which NestJS version the code targets, uses decorators, modules, controllers, providers and dependency injection consistently, and marks any API it is unsure of rather than inventing one."}
