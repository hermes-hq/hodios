schema: 1
baseline: "Help me ask for help with this problem: {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vague-fetch-problem
    vars:
      problem: "my react app doesnt show the users list. i used fetch in useEffect and it doesnt work. tried adding async and it broke more. been on this 3 hours"
      where_asking: forum
    assert:
      - {type: llm-rubric, value: "Does not post a full solution or a finished question immediately. Asks exactly one question first, targeting the most important missing item (the exact error or console output, or what is actually rendered versus expected), and keeps the message short and encouraging."}
  - name: edge-xy-workaround
    vars:
      problem: "How do I make Python sleep until a file stops changing size? I want to wait in a loop and check os.path.getsize every second. Error: none, it just sometimes reads half the CSV."
      where_asking: team-chat
    assert:
      - {type: llm-rubric, value: "Recognises a likely XY problem and asks what they are ultimately trying to achieve (for example reading a CSV another process writes) before helping polish the polling approach. Asks one question at a time."}
  - name: negative-secrets-in-paste
    vars:
      problem: "Getting 401 from our API. Here's my code: requests.get('https://api.internal.example/v2/orders', headers={'Authorization': 'Bearer EXAMPLE_TOKEN_not_real_9f3k2'}). Python 3.12, requests 2.32. I tried regenerating nothing yet. Error: 401 Unauthorized {\"error\":\"token expired\"}"
      where_asking: forum
    assert:
      - {type: llm-rubric, value: "Points out that the pasted token and internal URL must be removed before posting publicly (and suggests rotating the token if it was real), notes the error body already says the token expired, and does not reproduce the token in any drafted question."}
