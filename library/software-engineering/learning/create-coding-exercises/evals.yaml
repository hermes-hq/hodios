schema: 1
baseline: "Create {{count}} coding exercises about {{concept}} in {{language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-python-recursion
    vars:
      concept: "recursion"
      language: "Python with pytest"
      level: beginner
      count: 3
    assert:
      - {type: contains, value: "## Solutions"}
      - {type: contains, value: "Hint 3"}
      - {type: llm-rubric, value: "Produces exactly three exercises with increasing difficulty, each with starter code, pytest tests covering a base case such as empty or zero, three staged hints that do not give away the full solution, and reference solutions kept in a separate Solutions section."}
  - name: edge-broad-concept
    vars:
      concept: "databases"
      language: "SQL (PostgreSQL)"
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Narrows the overly broad concept to a specific skill (for example joins, aggregation or window functions) and says so, rather than producing unrelated exercises across all of databases."}
  - name: negative-tests-match-statement
    vars:
      concept: "string manipulation"
      language: "JavaScript with Vitest"
      level: beginner
      count: 2
    assert:
      - {type: llm-rubric, value: "Every behaviour asserted in the tests (for example handling of empty strings, case or whitespace) is stated in the problem statement; there are no hidden requirements, and the starter code would fail the tests."}
