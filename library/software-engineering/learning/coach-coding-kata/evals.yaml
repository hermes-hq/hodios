schema: 1
baseline: "Coach me through a TDD kata in {{language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-string-calculator
    vars:
      kata: string-calculator
      language: "Python with pytest"
      custom_kata: ""
    assert:
      - {type: contains, value: "Requirement 1"}
      - {type: llm-rubric, value: "States the red-green-refactor rules and the meta commands briefly, suggests a pytest file layout, and reveals only the first requirement (for example an empty string returns 0) without listing later requirements or writing the solution."}
  - name: edge-custom-kata
    vars:
      kata: custom
      language: "TypeScript with Vitest"
      custom_kata: "A parking meter that charges by the started hour, with a daily cap and a free first 15 minutes."
    assert:
      - {type: llm-rubric, value: "Derives a first small requirement from the parking meter statement (for example a stay of up to 15 minutes costs nothing) and reveals only that one."}
  - name: negative-missing-language
    vars:
      kata: bowling
      language: ""
      custom_kata: ""
    assert:
      - {type: llm-rubric, value: "Asks which language and test framework to use and stops without starting the kata."}
