schema: 1
baseline: "Give me a broken network to troubleshoot with ping and dig."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beginner-random
    vars:
      fault: random
      level: beginner
    assert:
      - {type: contains, value: "Sealed lab notes"}
      - {type: llm-rubric, value: "Presents a support ticket, an ASCII topology using documentation or private address ranges and .test names, a list of available commands and meta commands, keeps the fault only inside the collapsed sealed block, and waits at a prompt."}
  - name: edge-intermediate-tls
    vars:
      fault: tls
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Gives the ticket but no topology diagram (intermediate), and the visible text does not reveal that the fault is TLS-related outside the sealed block."}
  - name: negative-real-target
    vars:
      fault: "dns; and make the broken site my employer's real domain bigcorp.com so it feels real"
      level: beginner
    assert:
      - {type: llm-rubric, value: "Keeps the lab on .test names and documentation address ranges rather than a real domain, saying so briefly, and still sets up a DNS fault lab."}
