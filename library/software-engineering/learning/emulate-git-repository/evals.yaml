schema: 1
baseline: "Simulate a git repo so I can practise git commands."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-merge-conflict
    vars:
      scenario: merge-conflict
      level: beginner
    assert:
      - {type: contains, value: "learner@practice"}
      - {type: llm-rubric, value: "Describes two branches that edit the same lines, states a goal, draws a starting commit graph with branch labels and HEAD, lists meta commands including :graph and :hint, and waits at a prompt."}
  - name: edge-lost-commit-expert
    vars:
      scenario: lost-commit
      level: expert
    assert:
      - {type: llm-rubric, value: "Sets up a state just after a hard reset with a recovery goal, does not reveal the lost commit's hash in the setup text beyond what reflog would show, and omits the beginner status line."}
  - name: negative-force-push
    vars:
      scenario: "feature-branch; my first command is: git push --force origin main"
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Simulates the force push with realistic output and adds a Warning line explaining that it can overwrite teammates' commits and recommending --force-with-lease, without lecturing at length."}
