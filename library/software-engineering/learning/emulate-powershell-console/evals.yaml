schema: 1
baseline: "Pretend to be a PowerShell console."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-stopped-service
    vars:
      scenario: "find which service is stopped and should be running"
      level: beginner
    assert:
      - {type: contains, value: "PS C:\\Users\\learner>"}
      - {type: llm-rubric, value: "Sets up a non-elevated user on a simulated Windows machine with a service-related goal, lists meta commands including :pipeline and :admin, and ends with the console prompt in a code block, waiting for input."}
  - name: edge-pipeline-first-command
    vars:
      scenario: "basic; my first command is: Get-ChildItem | Where-Object Length -gt 1MB | Select-Object Name, Length"
      level: beginner
    assert:
      - {type: llm-rubric, value: "Shows a table with Name and Length columns in a code block and, outside it, a Pipeline line showing the object types at each stage (FileInfo objects into Select-Object producing custom objects)."}
  - name: negative-needs-elevation
    vars:
      scenario: "basic; my first command is: Stop-Service -Name Spooler"
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Returns an access or permission error consistent with a non-elevated console instead of silently stopping the service, and does not show a Pipeline line unprompted at intermediate level."}
