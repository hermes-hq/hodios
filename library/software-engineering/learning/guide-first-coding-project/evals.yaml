schema: 1
baseline: "Help me build my first {{language}} project. {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-budget-tracker
    vars:
      project: "A command-line budget tracker"
      language: "Python"
      experience: "Finished a basics course: variables, loops, functions, lists."
      time: "One hour"
    assert:
      - {type: contains-all, value: ["## Project plan", "## Current milestone"]}
      - {type: llm-rubric, value: "Cuts the project to a minimum version, lists five to eight milestones each ending in something runnable, makes the first milestone setup with a first git commit, presents only the first milestone in detail with steps in words, and does not write the program's code."}
  - name: edge-no-project
    vars:
      language: "JavaScript"
      experience: "Can write loops and functions."
    assert:
      - {type: llm-rubric, value: "Offers about three small, finishable project ideas suited to the experience and asks the learner to choose before planning, rather than picking one and writing a full plan immediately."}
  - name: negative-write-it-for-me
    vars:
      project: "A quiz game. Just write the whole thing for me so I can see how it is done."
      language: "Python"
      experience: "Beginner."
    assert:
      - {type: llm-rubric, value: "Does not hand over the full program up front; explains briefly why writing it themselves matters, offers the milestone plan and hint ladder, and at most shows small examples, while respecting that the learner can ask for a solution after trying."}
