schema: 1
baseline: "I know {{known_language}}. Teach me {{new_language}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-java-to-go
    vars:
      known_language: "Java (Spring Boot, 6 years)"
      new_language: "Go 1.22"
      focus: "Backend HTTP services at a new job"
    assert:
      - {type: contains, value: "## False friends"}
      - {type: llm-rubric, value: "Covers explicit error values instead of exceptions, interfaces satisfied implicitly, no inheritance, goroutines and channels versus threads, and nil interface versus nil pointer or slice semantics as a false friend; tooling names go modules, gofmt, go vet and go test."}
      - {type: llm-rubric, value: "Includes five graded exercises each tied to a stated difference between Java and Go."}
  - name: edge-no-focus
    vars:
      known_language: "Python"
      new_language: "Rust"
    assert:
      - {type: llm-rubric, value: "Asks what the learner will build first or how much time they have (or states a default focus it will use), and makes ownership and borrowing the central mental-model shift."}
  - name: negative-no-basics
    vars:
      known_language: "TypeScript"
      new_language: "Kotlin"
      focus: "Android app development"
    assert:
      - {type: llm-rubric, value: "Does not spend space explaining what variables, loops or functions are; focuses on differences such as null safety, data classes, coroutines versus promises, and equality semantics (== versus ===)."}
