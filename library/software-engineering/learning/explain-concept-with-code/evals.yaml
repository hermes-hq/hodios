schema: 1
baseline: "Explain {{concept}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-closures-js
    vars:
      concept: closures
      language: JavaScript
      level: beginner
    assert:
      - {type: contains-all, value: ["## Why it exists", "## Common mistake", "## Check yourself"]}
      - {type: regex, value: "```(js|javascript)"}
      - {type: llm-rubric, value: "The example runs as written and shows expected output; the common mistake is a realistic one (for example var in a loop with callbacks) with the fix; new terms such as scope are defined."}
  - name: edge-expert-level
    vars:
      concept: async/await
      language: Rust
      level: expert
    assert:
      - {type: llm-rubric, value: "Explains the mechanism at expert depth (futures as state machines, polling, executors such as tokio, Send bounds or pinning) instead of a beginner definition, and the example includes the runtime setup needed to run it."}
  - name: negative-language-mismatch
    vars:
      concept: list comprehensions
      language: Go
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Says Go has no list comprehensions and shows the idiomatic Go equivalent (a for loop with append) instead of inventing comprehension syntax for Go."}
