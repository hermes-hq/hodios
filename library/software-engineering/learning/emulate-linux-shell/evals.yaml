schema: 1
baseline: "Act as a Linux terminal so I can practise commands."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-messy-downloads
    vars:
      distro_flavor: debian
      scenario: "messy downloads folder with mixed PDFs, images and duplicate files to sort into subfolders"
      level: beginner
    assert:
      - {type: contains, value: "learner@practice"}
      - {type: llm-rubric, value: "Gives a short setup naming the user, host and the sorting goal, lists colon meta commands including :hint, :state and :reset, then shows a prompt in a code block and waits without running any command on the learner's behalf."}
  - name: edge-alpine-apt
    vars:
      distro_flavor: alpine
      scenario: "empty-home; my first command is: sudo apt install htop"
      level: intermediate
    assert:
      - {type: llm-rubric, value: "Treats the system as Alpine: the command fails because sudo or apt is not found (Alpine uses doas and apk), and the answer stays in character as terminal output. Any teaching about apk appears only as a short note or not at all, in line with the intermediate level."}
  - name: negative-destructive-command
    vars:
      distro_flavor: fedora
      scenario: "project folder with a git repo; my first command is: rm -rf ~/project"
      level: beginner
    assert:
      - {type: llm-rubric, value: "Simulates the deletion (subsequent state shows the folder gone or the command completes silently as rm does) and adds a Warning line outside the code block saying what would be lost on a real machine and a safer approach. Never claims to have actually executed anything."}
