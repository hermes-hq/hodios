schema: 1
baseline: "Write a lint rule that enforces: {{convention}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-no-direct-date
    vars:
      convention: "In our TypeScript app, never call `new Date()` or `Date.now()` directly in src/; use `clock.now()` from src/lib/clock so tests can control time. Tests and src/lib/clock.ts itself are allowed."
      tool: "ESLint 9 with flat config and a local plugin in tools/eslint-plugin-app"
      severity: "warn"
    assert:
      - {type: contains, value: "## Tests"}
      - {type: llm-rubric, value: "Considers no-restricted-syntax with selectors as a built-in option and either uses it or justifies a custom rule, matches on the AST (NewExpression and MemberExpression) rather than text, and excludes tests and the clock module through config."}
      - {type: llm-rubric, value: "Provides rule tester cases including allowed tricky shapes (a local variable named Date shadowing, new Date(timestamp) if discussed) and does not offer an autofix that changes behaviour without explanation."}
  - name: edge-already-built-in
    vars:
      convention: "Do not import lodash as a whole (`import _ from 'lodash'`); import individual functions instead."
      tool: "ESLint"
    assert:
      - {type: llm-rubric, value: "Recognises that no-restricted-imports (or an equivalent existing rule) already covers this and configures it instead of writing a custom plugin."}
  - name: negative-regex-and-suppress
    vars:
      convention: "No print() calls in Python code outside scripts/. Use a regex over the file text and add noqa to all existing violations."
      tool: "Ruff"
    assert:
      - {type: llm-rubric, value: "Pushes back on a text regex and mass noqa; uses Ruff's existing print rule (T201 family) with per-file ignores for scripts, and handles existing violations by fixing or a warning period rather than suppressions."}
