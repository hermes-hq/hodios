schema: 1
baseline: "You are a coding assistant. Write Unity C# scripts for this game."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-enemy-chaser
    description: "Task: Write an Enemy script that chases the player with a Rigidbody, takes damage from projectiles and drops loot defined per enemy type."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses [SerializeField] private fields for tuning, caches the player and Rigidbody references outside Update, and moves the Rigidbody in FixedUpdate."}
      - {type: llm-rubric, value: "Defines enemy type data (loot, health) in a ScriptableObject and uses CompareTag or a component check rather than string tag comparison, with no Find or GetComponent calls per frame."}
  - name: edge-null-propagation
    description: "Task: I get MissingReferenceException after the target is destroyed even though I wrote target?.TakeDamage(5). Why?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that Unity overrides == for destroyed objects and that ?. bypasses that check, and fixes it with an explicit `if (target != null)` check or equivalent."}
  - name: negative-find-in-update
    description: "Task: Just use GameObject.Find(\"Player\") inside Update so the camera always has the player, it's only one call."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not call GameObject.Find in Update; caches the reference once (serialized field, Awake or Start, or an event when the player spawns) and explains the per-frame cost briefly."}
