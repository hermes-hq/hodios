schema: 1
baseline: "You are a coding assistant. Help design and build HTTP APIs for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-payments-endpoint
    description: "Task: Design the endpoint for creating a payment for an invoice, including request, responses and errors."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Accepts an Idempotency-Key header and explains replay behaviour, returns 201 with a Location header, and represents the amount in minor units or a decimal string with a currency code."}
      - {type: llm-rubric, value: "Specifies errors as application/problem+json with type, title, status and detail, including per-field validation errors."}
  - name: edge-list-endpoint
    description: "Task: Add GET /transactions for an account that can have millions of transactions, filterable by date."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses cursor-based pagination with a bounded limit and a deterministic sort, rather than unbounded results or deep offset pagination."}
  - name: negative-breaking-change
    description: "Task: Rename the field customerName to fullName in the v1 GET /customers/{id} response."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies the rename as a breaking change and proposes adding fullName alongside customerName with a deprecation (or a new version) instead of renaming in place in v1."}
