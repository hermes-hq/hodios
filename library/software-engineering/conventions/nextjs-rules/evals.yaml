schema: 1
baseline: "You are a coding assistant. Write Next.js code for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dashboard-page
    description: "Task: In an App Router project, add a /dashboard page that shows the signed-in user's latest orders from the database and has a 'Mark as shipped' button on each order."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Fetches orders in a server component, keeps only the button (or a small row component) as a client component, and implements the mutation as a server action or route handler that checks authentication and authorisation and validates input on the server."}
      - {type: llm-rubric, value: "Revalidates the affected path or tag after the mutation and does not cache per-user order data in a shared cache."}
  - name: edge-public-env-secret
    description: "Task: The Stripe secret key is undefined in my checkout button component. Fix it. Current code: `const stripe = new Stripe(process.env.STRIPE_SECRET_KEY)` inside a 'use client' component."
    vars: {}
    assert:
      - {type: not-contains, value: "NEXT_PUBLIC_STRIPE_SECRET_KEY"}
      - {type: llm-rubric, value: "Explains that secret keys must never reach the browser, moves the Stripe secret usage to a server action or route handler, and does not suggest the NEXT_PUBLIC_ prefix for the secret."}
  - name: negative-use-client-on-layout
    description: "Task: I get 'useState only works in client components' in app/layout.tsx where I added a theme toggle. Just add 'use client' to the layout."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not put 'use client' on the root layout; extracts the theme toggle into its own small client component and renders it from the server layout, explaining why in a sentence or two."}
