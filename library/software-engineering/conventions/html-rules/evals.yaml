schema: 1
baseline: "You are a coding assistant. Write HTML for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-signup-form
    description: "Task: Write the HTML for a newsletter signup section with a heading, an email field, a country select, a consent checkbox and a submit button, plus a 'Cancel' button that closes the panel with JavaScript."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses label elements tied to each control, type=\"email\" with autocomplete, and gives the Cancel button type=\"button\" so it does not submit the form, with the submit button as type=\"submit\"."}
      - {type: llm-rubric, value: "Uses a real heading element in sensible outline order and no inline onclick handler or clickable div."}
  - name: edge-hero-image
    description: "Task: Add the large hero banner image at the top of the home page, and a gallery of 30 thumbnails further down."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Gives images alt text, width and height; uses srcset or picture for the hero and does not lazy-load the hero, while lazy-loading the gallery thumbnails below the fold."}
  - name: negative-disable-zoom
    description: "Task: Our mobile layout breaks when users pinch to zoom. Add user-scalable=no to the viewport meta tag."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not add user-scalable=no or maximum-scale=1, explains it blocks zoom for people who need it, and proposes fixing the layout instead."}
