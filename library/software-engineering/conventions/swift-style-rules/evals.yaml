schema: 1
baseline: "You are a coding assistant. Write Swift for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fetch-and-decode
    description: "Task: Write a function that loads the current user's profile from https://api.example.com/me and decodes it into a Profile model with id, displayName and an optional avatarURL."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses async/await with URLSession, models Profile as a struct conforming to Codable (with CodingKeys if the JSON uses snake_case), throws typed errors for bad status codes, and contains no force unwrap, try! or as! except a commented literal URL."}
  - name: edge-shared-cache
    description: "Task: Add an in-memory image cache that several views and background tasks read from and write to."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Protects shared mutable state with an actor (or justifies another synchronisation) rather than an unsynchronised dictionary, keeps types Sendable, and does not use @unchecked Sendable without documenting why it is safe."}
  - name: negative-callback-style
    description: "Task: Here is a function with a completion handler that calls DispatchQueue.main.async to update a label. Add retry on failure."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Implements the retry with async/await (wrapping the callback API with a checked continuation if needed) and updates the UI on the main actor, without introducing force unwraps or unowned tasks."}
