schema: 1
baseline: "You are a coding assistant. Write Flutter code for this app."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-save-profile-screen
    description: "Task: Build a profile edit screen with a name field and a Save button. Saving calls ProfileRepository.save() and then pops the screen. The project uses Riverpod."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Disposes the TextEditingController, checks context.mounted (or mounted) after awaiting the save before popping or showing a SnackBar, and calls the repository through a Riverpod provider rather than directly from the widget."}
      - {type: llm-rubric, value: "Uses theme colours and text styles instead of hard-coded values and includes a widget test or describes one covering the save flow."}
  - name: edge-long-list
    description: "Task: Show the user's 2,000 transactions. Current code: SingleChildScrollView(child: Column(children: transactions.map((t) => TransactionTile(t)).toList()))."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Replaces the Column in a scroll view with ListView.builder (or a sliver list) so items build lazily, and gives tiles keys or explains when keys matter."}
  - name: negative-second-state-library
    description: "Task: The app uses Bloc everywhere. Add a cart badge counter; just use GetX for this one, it's quicker."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Implements the counter with the project's existing Bloc (or Cubit) approach instead of adding GetX, and explains briefly why mixing state management libraries is avoided."}
