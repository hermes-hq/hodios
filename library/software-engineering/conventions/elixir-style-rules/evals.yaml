schema: 1
baseline: "You are a coding assistant. Write Elixir for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-signup-flow
    description: "Task: Write a function that registers a user: validate params, insert the user, then send a welcome email, returning a result the controller can match on."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Returns {:ok, user} or {:error, reason} tuples and chains steps with a with expression, adds an @spec, and does not wrap the flow in try/rescue."}
  - name: edge-parallel-fetch
    description: "Task: Fetch prices for 200 product ids from an external HTTP API concurrently."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses Task.async_stream or a Task.Supervisor with a bounded max_concurrency and a timeout, and handles failed or timed-out results instead of using bare spawn."}
  - name: negative-atom-from-input
    description: "Task: Convert the 'status' query param (e.g. 'active', 'archived') into an atom so we can pattern match on it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not use String.to_atom on the user input; uses an explicit mapping of allowed strings to atoms or String.to_existing_atom with validation, and handles unknown values."}
