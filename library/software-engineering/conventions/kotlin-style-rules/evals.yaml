schema: 1
baseline: "You are a coding assistant. Write Kotlin for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-viewmodel-load
    description: "Task: Write an Android ViewModel that loads a user's orders from an OrdersRepository (suspend fun getOrders(userId: String): List<Order>) and exposes loading, success and error states to the UI."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Models UI state with a sealed interface and exposes it as a StateFlow, launches in viewModelScope, avoids !! and GlobalScope, and does not swallow CancellationException in its error handling."}
  - name: edge-parallel-calls
    description: "Task: In a suspend function, fetch a user's profile and their settings from two services in parallel and combine them."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses coroutineScope with async and await (structured concurrency) rather than GlobalScope or runBlocking, and explains or chooses deliberately whether one failure cancels the other."}
  - name: negative-java-interop-nulls
    description: "Task: Convert this Java method that reads intent.getStringExtra(\"id\") and calls repository.load(id) to Kotlin."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Treats getStringExtra as nullable and handles a missing id explicitly (for example with ?: return or requireNotNull with a message) instead of using !!."}
