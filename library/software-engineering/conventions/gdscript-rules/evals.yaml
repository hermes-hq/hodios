schema: 1
baseline: "You are a coding assistant. Write GDScript for this Godot project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coin-pickup
    description: "User turn: Godot 4.3. Write a coin pickup: when the player touches it, add 10 to the score shown in the HUD and remove the coin."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses an Area2D with a typed body_entered handler, emits a typed signal (or uses a score service) instead of reaching the HUD through get_node paths, exports the coin value, uses static typing throughout, and calls queue_free."}
  - name: edge-enemy-move-in-process
    description: "User turn: My enemy is a CharacterBody2D. Write code to move it toward the player at 120 pixels per second, I usually put everything in _process."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Moves the body in _physics_process using velocity and move_and_slide, exports the speed with a range hint, caches the player reference instead of searching every frame, and types all variables."}
  - name: negative-per-frame-allocation
    description: "User turn: Every frame, build a new array of all enemies with get_tree().get_nodes_in_group and sort it by distance to find the nearest one. Keep it simple."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out the per-frame allocation and sort cost, and offers a cheaper approach such as a cached list updated on signals, a throttled check, or a single pass tracking the minimum distance without allocating, while still solving the task."}
