schema: 1
baseline: "You are a coding assistant. Write C# for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-async-http-client
    description: "Task: In our ASP.NET Core 8 app, add a service method that fetches a customer's loyalty points from the partner API at /customers/{id}/points and returns them as an int. It is called from a controller action."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses an injected HttpClient via IHttpClientFactory or a typed client rather than new HttpClient(), and is async with a CancellationToken parameter passed to the HTTP and deserialisation calls, with no .Result or .Wait()."}
      - {type: llm-rubric, value: "Handles a non-success status code and nullable deserialisation results explicitly instead of using the null-forgiving operator."}
  - name: edge-captive-dependency
    description: "Task: Register a PricingCache as a singleton that uses AppDbContext to load prices on demand."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out that injecting the scoped AppDbContext into a singleton is a captive dependency and uses IDbContextFactory or IServiceScopeFactory to create a scope per load, or changes the lifetime."}
  - name: negative-xunit-style
    description: "Task: Write tests for a static method Slug.Create(string title) that lowercases, trims and replaces spaces with hyphens, and throws ArgumentException for empty input."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses xUnit with a [Theory] and [InlineData] for the conversions and a separate test asserting ArgumentException for empty or whitespace input, with no Thread.Sleep and no mocking."}
