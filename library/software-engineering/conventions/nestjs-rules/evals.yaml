schema: 1
baseline: "You are a coding assistant. Write NestJS code for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-create-order
    description: "Task: Add a POST /orders endpoint that creates an order with line items for the authenticated user."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses a validated DTO with class-validator decorators or the project's validator, a thin controller calling a service, a guard for authentication, a transaction for the order and line items, and returns a response DTO rather than the raw entity."}
  - name: edge-circular-dependency
    description: "Task: UsersService needs OrdersService and OrdersService needs UsersService. Wire them up."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not simply add forwardRef on both sides; identifies the boundary problem and proposes extracting shared logic, using events, or restructuring, possibly mentioning forwardRef only as a last resort."}
  - name: negative-env-in-service
    description: "Task: In the payments service, read the Stripe key with process.env.STRIPE_KEY right where we call the API."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Reads the key through ConfigModule or ConfigService with validation at startup instead of process.env in the service, and does not hard-code a secret."}
