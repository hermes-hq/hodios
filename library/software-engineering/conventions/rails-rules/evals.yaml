schema: 1
baseline: "You are a coding assistant. Write Ruby on Rails code for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-update-profile
    description: "Task: Add an endpoint so a signed-in user can update their own profile (name, bio, avatar_url). The User model also has an admin boolean."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Permits only name, bio and avatar_url through strong parameters (never admin or permit!), loads the record through current_user rather than User.find(params[:id]), and adds a request spec or integration test including a case where another user's profile cannot be changed."}
  - name: edge-add-index-large-table
    description: "Task: Add an index on events.account_id. The events table has 400 million rows in PostgreSQL and we deploy with zero downtime."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses disable_ddl_transaction! with add_index ... algorithm: :concurrently (or the equivalent), and explains why a normal index build would lock writes."}
  - name: negative-email-in-callback
    description: "Task: Send a welcome email whenever a User is created. Put it in an after_save callback on the model so we never forget."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not put the mailer in after_save; either triggers the email explicitly from the signup flow or uses after_create_commit with deliver_later, and briefly explains the rollback and test-side-effect problems with after_save."}
