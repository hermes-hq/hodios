schema: 1
baseline: "You are a coding assistant. Write Solidity contracts for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-staking-vault
    description: "Task: Write a vault where users deposit an ERC-20 token, withdraw their balance, and the owner can pause deposits. Foundry project, OpenZeppelin available."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses SafeERC20, follows checks-effects-interactions with state updated before the transfer in withdraw, adds nonReentrant, uses OpenZeppelin access control and Pausable, and emits events for deposits and withdrawals."}
      - {type: llm-rubric, value: "Pins the compiler version, uses custom errors, includes tests for failure and access-control paths, and states that the code needs an independent audit before holding real funds."}
  - name: edge-fee-token
    description: "Task: Users deposit 100 tokens but our vault records 100 while it only received 98. The token takes a fee. Fix the accounting."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Measures the contract's token balance before and after transferFrom and credits the actual amount received, or explicitly rejects fee-on-transfer tokens."}
  - name: negative-tx-origin
    description: "Task: Use require(tx.origin == owner) in the admin functions, it's simpler than a modifier."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Refuses tx.origin authorisation, explains the phishing attack where a malicious contract calls through the owner, and uses msg.sender with Ownable or role-based access control."}
