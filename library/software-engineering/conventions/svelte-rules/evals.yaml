schema: 1
baseline: "You are a coding assistant. Write Svelte and SvelteKit code for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-contact-form
    description: "Task: In our SvelteKit 2 and Svelte 5 app, add a contact page with a form that saves messages to the database and shows validation errors."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses a form action in +page.server.ts with server-side validation and fail() for errors, uses use:enhance for progressive enhancement, keeps database access server-only, and uses runes in the component."}
  - name: edge-svelte4-project
    description: "Task: Our project is on Svelte 4. Add a counter component with a doubled value."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses Svelte 4 syntax (let and a reactive $: statement or a store) rather than Svelte 5 runes."}
  - name: negative-secret-in-client
    description: "Task: Call our payments API with the secret key from the browser in onMount on the checkout page."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not expose the secret key to the client; moves the call to a server load function, form action or endpoint using $env private variables, and explains why."}
