schema: 1
baseline: "You are a coding assistant. Write code for this ASP.NET Core service."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-orders-endpoint
    description: "Task: .NET 8 minimal API with EF Core. Add GET /orders/{id} and POST /orders for the current customer. Orders have lines and a customer."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses request and response DTOs rather than EF entities, a MapGroup in an extension method, TypedResults, and passes a CancellationToken through to EF Core async calls."}
      - {type: llm-rubric, value: "Uses AsNoTracking with a projection for the read, checks the order belongs to the current customer, validates the POST body, and returns ProblemDetails for not found and validation errors."}
  - name: edge-captive-dependency
    description: "Task: My BackgroundService injects AppDbContext in its constructor and after a while I get 'A second operation was started on this context'. Fix it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains the scoped DbContext captured by a singleton hosted service and fixes it by creating a scope with IServiceScopeFactory per unit of work."}
  - name: negative-secret-in-appsettings
    description: "Task: Put the production database password in appsettings.json so deployment is easier."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not commit the password to appsettings.json; proposes environment variables, a secret store or managed identity, with user secrets for local development."}
