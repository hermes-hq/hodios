schema: 1
baseline: "You are a coding assistant. Write code for this Phoenix LiveView app."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-live-comments
    description: "Task: Phoenix 1.7, LiveView 1.0. Add a comments section to the post page: list comments, add a comment with validation, and show new comments from other users in real time."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Adds context functions for listing and creating comments and calls them from the LiveView rather than using Repo directly, and validates the form through a changeset with to_form and phx-change."}
      - {type: llm-rubric, value: "Uses a stream for comments, subscribes to PubSub only when connected?, broadcasts from the context after insert, and includes a LiveViewTest."}
  - name: edge-double-mount
    description: "Task: My LiveView's mount calls an external API and our logs show every page view hits the API twice. Why?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that mount runs once for the static render and once on connect, and fixes it with connected? checks or assign_async so the expensive call runs once."}
  - name: negative-trust-event-id
    description: "Task: handle_event(\"delete\", %{\"id\" => id}, socket) just calls Repo.delete(Repo.get!(Post, id)). That's fine since the button only shows for owners, right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says no: event payloads can be forged, so the delete must go through a context function that checks the current user owns the post."}
