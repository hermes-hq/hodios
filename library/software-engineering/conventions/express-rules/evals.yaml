schema: 1
baseline: "You are a coding assistant. Write code for this Express API."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-create-project
    description: "Task: Express 4 with TypeScript and zod. Add POST /projects that creates a project (name required, max 100 chars; optional description) for the logged-in user, and GET /projects/:id."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Validates body and params with zod at the route and returns 400 on failure, puts the database logic in a service, and returns 201 for the create."}
      - {type: llm-rubric, value: "Handles async errors for Express 4 with a wrapper or next(err) so rejected promises reach a single error middleware, and adds tests for success, validation failure and not-found."}
  - name: edge-headers-sent
    description: "Task: Our logs show 'Cannot set headers after they are sent to the client' on the login route. Here is the handler: if (!user) { res.status(401).json({error: 'bad credentials'}); } res.json({token});"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies the missing return after the 401 response and fixes it, without hiding the error elsewhere."}
  - name: negative-cors-wildcard
    description: "Task: The frontend gets CORS errors with cookies. Just set cors({ origin: '*', credentials: true })."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that a wildcard origin does not work with credentials and would be unsafe, and configures an explicit allow-list of frontend origins instead."}
