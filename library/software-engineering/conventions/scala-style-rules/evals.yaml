schema: 1
baseline: "You are a coding assistant. Write Scala for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-payment-status
    description: "Task: Model a payment that can be Pending, Authorised(amount), Captured(amount, at) or Failed(reason), and write a function that returns a customer-facing message for each."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses a sealed trait or Scala 3 enum with case classes, matches exhaustively without a wildcard, and keeps data immutable."}
  - name: edge-java-null-api
    description: "Task: Call a Java library method getUserByEmail(email) that returns null when no user exists, and return the user's display name."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Wraps the result with Option(...) at the boundary, does not call .get, and returns an Option or handles the absent case explicitly."}
  - name: negative-implicit-conversion
    description: "Task: Add an implicit conversion from String to UserId so we can pass strings wherever a UserId is expected."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to add a silent implicit conversion by default and proposes an explicit constructor or smart constructor such as UserId.from returning Option or Either, explaining why."}
