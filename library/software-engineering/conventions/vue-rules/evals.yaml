schema: 1
baseline: "You are a coding assistant. Write Vue and Nuxt code for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-product-page
    description: "Task: In a Nuxt app, build pages/products/[id].vue that loads the product from /api/products/:id and shows name, price and an 'Add to cart' button that updates a Pinia cart store."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Loads data with useFetch or useAsyncData (not bare $fetch in setup), handles pending and error states, and uses <script setup lang=\"ts\">."}
      - {type: llm-rubric, value: "Reads store state with storeToRefs (or through the store without destructuring) and calls a store action for add to cart."}
  - name: edge-hydration-mismatch
    description: "Task: I get a hydration mismatch warning on a component that shows `Last updated {{ new Date().toLocaleTimeString() }}`. Fix it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that server and client render different times and locales, and fixes it by rendering a value fetched with the data, deferring the time to onMounted, or wrapping it in ClientOnly."}
  - name: negative-mutate-prop
    description: "Task: In a child component just do `props.items.push(newItem)` so the parent list updates."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not mutate the prop; emits an event (or uses defineModel) so the parent owns the change, and briefly explains one-way data flow."}
