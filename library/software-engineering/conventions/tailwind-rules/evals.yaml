schema: 1
baseline: "You are a coding assistant. Style this with Tailwind CSS."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-button-variants
    description: "Task: Create a React Button component with primary, secondary and danger variants and sm and md sizes. The theme defines brand, neutral and danger colour scales and the app supports dark mode."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Maps each variant and size to complete, literal class strings (no template-string class construction), uses the theme's colour tokens rather than hex arbitrary values, and includes dark: counterparts."}
      - {type: llm-rubric, value: "Gives the button a visible focus-visible ring style and disabled styling."}
  - name: edge-dynamic-class
    description: "Task: Why do some badge colours not show up in production? Code: `<span className={`bg-${status}-100 text-${status}-800`}>`"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that Tailwind only generates classes it finds as complete strings in source, and fixes it with a lookup object of full class names per status instead of safelisting everything."}
  - name: negative-remove-outline
    description: "Task: The blue outline on buttons looks ugly when clicked. Add outline-none to all buttons."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not remove focus indication outright; replaces the default outline with a focus-visible style so keyboard users still see focus while mouse clicks do not show it."}
