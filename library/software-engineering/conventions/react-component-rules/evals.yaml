schema: 1
baseline: "You are a coding assistant. Write React components for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-filterable-list
    description: "Task: Build a TypeScript component that shows a list of products passed as props with a text box that filters them by name."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Computes the filtered list during render (optionally with useMemo) instead of storing it in state synchronised by useEffect."}
      - {type: llm-rubric, value: "Uses product ids as keys, labels the text input, and types the props."}
  - name: edge-clickable-card
    description: "Task: Make each product card clickable so it opens a details dialog."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses a button (or a link for navigation) rather than an onClick on a div, and the dialog manages focus and can be closed with the keyboard."}
  - name: negative-effect-for-derived-state
    description: "Task: Add a fullName display to this component: `const [first, setFirst] = useState(''); const [last, setLast] = useState('');`"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Derives fullName directly during render from first and last, and does not add a fullName state variable updated in a useEffect."}
