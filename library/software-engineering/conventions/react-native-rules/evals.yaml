schema: 1
baseline: "You are a coding assistant. Write React Native code for this app."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-login-token-storage
    description: "Task: After login, store the refresh token so the user stays signed in across app restarts. Expo managed app with TypeScript."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Stores the token with a secure keychain or keystore library (for example expo-secure-store), not AsyncStorage, wrapped in a small typed module, and handles a missing or invalid token on startup."}
  - name: edge-camera-permission
    description: "Task: Add a 'Scan receipt' button that opens the camera."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Requests camera permission when the button is pressed (not at app launch), handles denied and permanently denied states with a route to settings, and adds the iOS usage description and Android permission configuration."}
  - name: negative-scrollview-map
    description: "Task: Render the 5,000 contacts with contacts.map inside a ScrollView, keep it simple."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses a virtualised list such as FlatList with keyExtractor instead of ScrollView with map, and explains the memory and performance reason in a sentence."}
