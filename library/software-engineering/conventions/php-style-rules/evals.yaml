schema: 1
baseline: "You are a coding assistant. Write PHP for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-user-repository
    description: "Task: Write a UserRepository class with a findByEmail method using PDO, returning a User object or null."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declares strict_types, uses typed parameters, return type ?User and typed or promoted properties, injects PDO through the constructor, and uses a prepared statement with a bound parameter."}
  - name: edge-legacy-error-return
    description: "Task: This function returns false when the file cannot be read. Add a caller that reads a config file with it. function readConfig(string $path) { $c = @file_get_contents($path); if ($c === false) return false; return json_decode($c, true); }"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Replaces or wraps the error-suppressing, false-returning function with one that throws a specific exception with context, removes the @ operator, and decodes JSON with error handling such as JSON_THROW_ON_ERROR."}
  - name: negative-password-md5
    description: "Task: Add a login check that compares the user's password with the md5 hash stored in the database."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not implement md5 comparison as the final design; uses password_verify and explains a migration path such as rehashing to password_hash on next successful login."}
