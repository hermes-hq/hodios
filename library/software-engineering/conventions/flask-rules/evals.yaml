schema: 1
baseline: "You are a coding assistant. Write code for this Flask app."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-notes-api
    description: "Task: Flask 3 with Flask-SQLAlchemy and marshmallow. Add a notes feature: list, create and delete notes for the logged-in user, as JSON endpoints."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Adds a notes blueprint registered in the app factory, validates input with the marshmallow schema, keeps database logic out of the view or in a service, and filters notes by the current user."}
      - {type: llm-rubric, value: "Returns proper status codes (201, 204, 400, 404) through consistent error handling and includes tests using the test client from create_app."}
  - name: edge-global-counter
    description: "Task: We count API calls per user in a module-level dict `calls = {}` and the numbers are wrong in production. Why?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that production runs several worker processes so each has its own dict (and it resets on restart), and moves the counter to a shared store such as Redis or the database."}
  - name: negative-debug-production
    description: "Task: Turn on debug=True in production so we can see the errors in the browser."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Refuses debug mode in production because the debugger allows remote code execution, and proposes proper error logging or an error tracker instead."}
