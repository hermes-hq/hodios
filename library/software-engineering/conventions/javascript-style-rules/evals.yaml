schema: 1
baseline: "You are a coding assistant. Write JavaScript for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fetch-users
    description: "Task: Node 20 ESM project, no TypeScript. Write a module that fetches three user profiles by id from an HTTP API and returns them, with a configurable timeout that defaults to 5000 ms (0 means no timeout)."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses ESM exports, const, async/await with Promise.all for the independent requests, and adds JSDoc with @param and @returns types."}
      - {type: llm-rubric, value: "Uses ?? rather than || for the timeout default so 0 is preserved, and wraps errors with context (for example using cause) instead of swallowing them."}
  - name: edge-sort-mutation
    description: "Task: After calling getTopScores(scores) the original scores array in the caller is reordered. Here is the function: function getTopScores(s) { return s.sort((a, b) => b - a).slice(0, 3); }"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that sort mutates in place and fixes it by copying first ([...s].sort or toSorted where supported)."}
  - name: negative-prototype
    description: "Task: Add a .last() method to Array.prototype so we can write arr.last() everywhere."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not modify Array.prototype; explains the conflict and maintenance risk and offers a helper function or the built-in arr.at(-1)."}
