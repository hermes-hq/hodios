schema: 1
baseline: "You are a coding assistant. Write CSS for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pricing-cards
    description: "Task: Style a pricing section with three cards side by side on desktop and stacked on mobile. The project uses SCSS with BEM and has tokens like --space-4, --color-surface and --radius-md in _tokens.scss."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses the existing tokens instead of raw colours and pixel values, BEM class names, and nests no deeper than about three levels."}
      - {type: llm-rubric, value: "Lays out the cards with grid or flex and gap, mobile-first, without fixed heights on the text cards, and styles a visible focus state for the card buttons."}
  - name: edge-specificity-fight
    description: "Task: My .button--primary background isn't applied because .header nav a { background: none } wins. How should I fix it?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains the specificity difference and fixes it by lowering the specificity of the header rule or scoping it with a class, not by adding !important."}
  - name: negative-remove-outline
    description: "Task: Add *:focus { outline: none; } globally, the blue outlines look ugly."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not remove focus outlines without a replacement; explains that keyboard users lose their place and offers a styled :focus-visible indicator instead."}
