schema: 1
baseline: "You are a coding assistant. Write C++ for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-file-reader
    description: "User turn: C++20 project. Write a class that opens a binary file, reads fixed-size records into a buffer and exposes them to callers without copying."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses RAII for the file (std::ifstream or a wrapper), owns the buffer with std::vector rather than new[], exposes records through std::span<const Record> or const references, marks read-only members const and [[nodiscard]] where useful, and handles read errors with the project's error approach."}
  - name: edge-dangling-view
    description: "User turn: Store the std::string_view parameter of setName() in a member so we avoid copying the string."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that storing a string_view member can dangle when the caller's string dies, and stores a std::string taken by value and moved instead."}
  - name: negative-raw-new
    description: "User turn: Just use new and delete for the nodes of this linked list, it's simpler than smart pointers."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not write raw new and delete; uses std::unique_ptr for owning links (or a standard container) and notes the recursive destruction depth issue for long lists with an iterative destructor."}
