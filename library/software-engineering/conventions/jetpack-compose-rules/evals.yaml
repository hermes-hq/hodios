schema: 1
baseline: "You are a coding assistant. Write Jetpack Compose code for this Android app."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-search-screen
    description: "Task: Build a search screen. The ViewModel calls repository.search(query) and the screen shows results, a loading indicator and an error with retry. The project uses Hilt."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Separates a route composable that uses the ViewModel from a stateless screen that takes uiState and event lambdas, exposes a single immutable StateFlow of UI state, and collects it with collectAsStateWithLifecycle."}
      - {type: llm-rubric, value: "Uses LazyColumn with keys from item ids, accepts a modifier parameter, and adds previews of the stateless screen with fake state."}
  - name: edge-effect-keys
    description: "Task: My screen reloads the profile only the first time even when userId changes. Code: LaunchedEffect(Unit) { viewModel.load(userId) }."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that LaunchedEffect(Unit) runs once per entering composition, keys the effect on userId (or moves the trigger into the ViewModel via saved state or a flow), and does not add a side effect to the composable body."}
  - name: negative-pass-viewmodel-down
    description: "Task: Just pass the ViewModel into ProductCard so it can call addToCart directly, it's simpler than lambdas."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not pass the ViewModel into the child composable; uses an onAddToCart lambda hoisted from the route, and explains briefly that this keeps the card previewable, testable and reusable."}
