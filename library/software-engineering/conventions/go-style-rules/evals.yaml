schema: 1
baseline: "You are a coding assistant. Write Go for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-http-client-call
    description: "Task: Write a function that fetches a user by id from our internal HTTP API and decodes the JSON response into a User struct."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Takes ctx context.Context as the first parameter and builds the request with http.NewRequestWithContext, and wraps errors with %w and context such as the user id."}
      - {type: llm-rubric, value: "Checks the response status code, closes the body, and returns errors rather than panicking or logging and returning."}
  - name: edge-parallel-fetch
    description: "Task: Speed this up by fetching all 50 users in parallel instead of one by one."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses errgroup or an equivalent pattern so every goroutine stops on context cancellation and errors reach the caller, bounds the concurrency, and avoids unsynchronised writes to shared state."}
  - name: negative-premature-interface
    description: "Task: Add a function that formats a price in cents as a string like 12.34 EUR, with tests."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Implements a plain function without introducing an interface or goroutine, and writes a table-driven test with named subtests and got/want failure messages."}
