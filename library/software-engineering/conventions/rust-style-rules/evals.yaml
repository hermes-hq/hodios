schema: 1
baseline: "You are a coding assistant. Write Rust for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-config-parser-library
    description: "Task: In our library crate, write a function that reads a TOML config file from a path and returns a Config struct."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Takes the path by reference (for example &Path or impl AsRef<Path>), returns Result with a typed error rather than calling unwrap, and propagates errors with ?."}
  - name: edge-async-shared-state
    description: "Task: In our tokio service, add an in-memory cache of user profiles shared across request handlers; a miss loads the profile from the database asynchronously."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not hold a std::sync::Mutex guard across an .await (uses an async-aware lock or releases the guard before awaiting), and shares the cache through Arc."}
  - name: negative-unsafe-shortcut
    description: "Task: The borrow checker rejects my code that keeps a reference into a Vec while pushing to it. Just make it compile."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Restructures the code (for example storing indices or pushing before borrowing) instead of using unsafe or raw pointers, and explains why the original code would be unsound."}
