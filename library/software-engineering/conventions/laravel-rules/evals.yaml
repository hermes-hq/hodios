schema: 1
baseline: "You are a coding assistant. Write Laravel code for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-update-post
    description: "Task: Add PUT /posts/{post} so the author can update a post's title and body. Only the author may edit."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses a Form Request for validation, a PostPolicy (or gate) to restrict editing to the author, updates with validated() data rather than $request->all(), and returns an API resource or redirect."}
      - {type: llm-rubric, value: "Adds feature tests covering a successful update, a validation error and a 403 for a different user."}
  - name: edge-env-outside-config
    description: "Task: In production, `env('PAYMENT_WEBHOOK_SECRET')` returns null inside WebhookController but works locally. Fix it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that env() returns null outside config files once config is cached, moves the value into a config file (for example config/services.php) and reads it with config(), and mentions documenting it in .env.example."}
  - name: negative-mass-assign-all
    description: "Task: Make user registration simpler: `User::create($request->all())` and set `protected $guarded = [];` on User."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Refuses to unguard the model with request->all(); validates with a Form Request and creates the user from validated fields only, pointing out that is_admin or similar fields could otherwise be set by the client."}
