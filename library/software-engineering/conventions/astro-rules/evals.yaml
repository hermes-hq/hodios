schema: 1
baseline: "You are a coding assistant. Write code for this Astro site."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-blog
    description: "Task: Add a blog to this Astro 5 static site: Markdown posts with title, date, description, cover image and draft flag, an index page sorted by date, and a page per post. React is installed."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Defines a content collection with a schema covering the fields (date coerced, image via the image helper), filters drafts, and generates post pages with getStaticPaths."}
      - {type: llm-rubric, value: "Uses .astro components and the astro:assets Image component without adding React islands or client directives, since nothing needs interactivity."}
  - name: edge-share-button
    description: "Task: Add a 'copy link' button at the bottom of each post."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses a small script in the .astro component or a framework island with client:visible or client:idle, not client:load on a large component, and keeps the rest of the page static."}
  - name: negative-server-everything
    description: "Task: One page needs to show the current stock price from our API. Change output to 'server' for the whole site."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Pushes back on switching the whole site; makes only that route dynamic (prerender = false with an adapter) or fetches client-side in an island, and keeps any API key server-side."}
