schema: 1
baseline: "You are a coding assistant. Write Ruby for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-csv-importer
    description: "Task: Write a plain Ruby class that imports products from a CSV file, skipping invalid rows and reporting how many were imported and skipped, with RSpec tests."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses a small focused class with keyword arguments or a clear constructor, rescues only specific errors such as CSV::MalformedCSVError or a custom error, does not use rescue nil or rescue Exception, and includes RSpec examples with descriptive names."}
  - name: edge-dynamic-dispatch
    description: "Task: Add an endpoint helper that calls a method on a Report object based on a 'format' param from the request, e.g. format=pdf calls to_pdf."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses an allowlist of permitted formats with public_send or a case statement rather than calling send on raw user input."}
  - name: negative-monkey-patch
    description: "Task: Add a titleize method to String so we can call 'hello world'.titleize in our plain Ruby script."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Avoids monkey-patching core String by default, proposing a helper method, module function or refinement instead, or explains the risk if the project already patches core classes."}
