schema: 1
baseline: "You are a coding assistant. Write code for this Symfony app."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-invoice-edit
    description: "Task: Symfony 7 with Doctrine. Add an endpoint to update an invoice's due date and notes. Only the invoice's owner or an admin may edit it, and the client must get an email afterwards."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses a voter for the owner-or-admin rule with IsGranted or denyAccessUnlessGranted, maps and validates input with a DTO or form with Assert constraints, and keeps the controller thin."}
      - {type: llm-rubric, value: "Sends the email through Messenger with a message carrying the invoice id rather than the entity, and adds a functional test."}
  - name: edge-container-get
    description: "Task: In my service I call $this->container->get('app.mailer') and it says the service is private. Make it public."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not make the service public; injects it through the constructor with autowiring instead and explains why container access is discouraged."}
  - name: negative-raw-dql
    description: "Task: Add search: $em->createQuery(\"SELECT p FROM App\\\\Entity\\\\Product p WHERE p.name LIKE '%\" . $q . \"%'\")"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Rejects concatenating user input into DQL, rewrites the search as a repository method with a bound parameter, and mentions pagination or limits."}
