schema: 1
baseline: "You are a coding assistant. Write Java for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-repository-lookup
    description: "Task: The project uses Java 21. Add a method to OrderService that finds an order by id from OrderRepository, applies a percentage discount to its total, and returns the updated order. Orders are currently a mutable class with getters and setters."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not return null for a missing order: returns Optional or throws a specific exception, and never calls Optional.get()."}
      - {type: llm-rubric, value: "Uses BigDecimal with an explicit RoundingMode for the discounted total and prefers an immutable result (for example a record or a copy) rather than mutating shared state."}
  - name: edge-stream-overuse
    description: "Task: Rewrite this loop as a stream if it improves it: for (int i = 0; i < lines.size(); i++) { try { results.add(parse(lines.get(i), i + 1)); } catch (IOException e) { errors.add(new LineError(i + 1, e.getMessage())); } }"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Keeps a loop (or explains why) because the stream version would need checked-exception handling, index tracking and side effects, rather than forcing a convoluted stream."}
  - name: negative-test-style
    description: "Task: Write tests for a method isValidIban(String iban) that returns true for valid IBANs."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses JUnit 5 with a @ParameterizedTest and a value source such as @CsvSource or @ValueSource for valid and invalid inputs including null or empty strings, without Thread.sleep or mocking the class under test."}
