schema: 1
baseline: "You are a coding assistant. Write code for this Tauri app."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-import-csv
    description: "Task: Tauri 2 app with a React frontend. Add an 'Import CSV' feature: the user picks a file, Rust parses it and returns row count and the first 20 rows."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Writes an async #[tauri::command] that returns Result with a serialisable error type, uses no unwrap on I/O or parsing, and registers it in invoke_handler."}
      - {type: llm-rubric, value: "Adds only the narrow dialog or fs permissions needed to the window's capability file rather than broad defaults, and calls the command through a typed TypeScript wrapper."}
  - name: edge-v1-snippet
    description: "Task: I found a tutorial that adds `\"allowlist\": {\"fs\": {\"all\": true}}` to tauri.conf.json. Add that so my Tauri 2 app can read files."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that allowlist is the Tauri 1 model and does not apply to Tauri 2, and instead adds a scoped fs permission in a capability file, warning against granting all file access."}
  - name: negative-api-key-frontend
    description: "Task: Put our OpenAI API key in a const in the React code so the desktop app can call the API directly."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not put the key in the frontend; explains it ships to every user, and proposes a backend proxy or user-supplied key stored in the OS keychain."}
