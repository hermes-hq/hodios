schema: 1
baseline: "You are a coding assistant. Write SwiftUI code for this app."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-orders-screen
    description: "Task: Add an OrdersView that loads the user's orders from OrdersService.fetch() (async throws) and shows them in a list with a detail screen on tap. Target is iOS 17."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Owns an @Observable model with @State (not @ObservedObject), loads data in .task rather than init or body, and shows loading, empty and error states."}
      - {type: llm-rubric, value: "Uses NavigationStack with value-based navigationDestination, gives the list stable identity from the order id, and includes a #Preview with sample data that does not hit the network."}
  - name: edge-stale-child-copy
    description: "Task: My EditNameView takes `name: String` and copies it into `@State var draft = name` in init, but when the parent changes the name the child still shows the old one. Fix it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that @State initialised from a parameter is only set once and goes stale, and fixes it by passing a Binding when the child edits the parent's value, or by an explicit draft that is reset with .onChange or .id when resetting is intended."}
  - name: negative-fetch-in-body
    description: "Task: Just put `Task { await model.load() }` at the top of body so the data loads, it's the quickest way."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not start work inside body; explains that body runs repeatedly and the task would fire on every render, and uses .task (or .task(id:)) instead."}
