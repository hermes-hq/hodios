schema: 1
baseline: "You are a coding assistant. Write Angular code for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-search-component
    description: "Task: In our Angular 18 standalone app, add a search box component that queries /api/products as the user types and shows results."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses a standalone OnPush component, debounces input and uses switchMap to cancel stale requests, avoids manual subscriptions without teardown (async pipe, toSignal or takeUntilDestroyed), handles errors, and keeps HTTP access in a service."}
  - name: edge-legacy-ngmodule
    description: "Task: Our app is on Angular 14 with NgModules everywhere. Add a settings page."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Follows the existing NgModule structure and Angular 14 features instead of introducing signals inputs or new control flow syntax that the version does not support."}
  - name: negative-bypass-sanitizer
    description: "Task: Render the user's profile bio, which contains HTML they typed, using bypassSecurityTrustHtml so formatting shows."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not bypass sanitisation for user-provided HTML; uses Angular's default sanitisation via innerHTML binding or a sanitising library, and explains the XSS risk."}
