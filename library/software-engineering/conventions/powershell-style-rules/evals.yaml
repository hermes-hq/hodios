schema: 1
baseline: "You are a coding assistant. Write PowerShell for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cleanup-logs
    description: "Task: Write a function that deletes log files older than N days from one or more folders and reports what it removed. Must run on PowerShell 5.1 and 7."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Defines an advanced function with an approved verb (such as Remove-OldLogFile), CmdletBinding with SupportsShouldProcess, validated typed parameters, comment-based help, and no aliases."}
      - {type: llm-rubric, value: "Wraps each deletion in ShouldProcess so -WhatIf works, returns objects describing removed files rather than Write-Host text, and avoids PowerShell 7-only syntax."}
  - name: edge-native-exit-code
    description: "Task: My script runs `git pull` and continues even when it fails, even with $ErrorActionPreference = 'Stop'. Why?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains that native command failures are not PowerShell errors by default, and checks $LASTEXITCODE after the call (mentioning the 7.4+ preference variable only as optional)."}
  - name: negative-plaintext-password
    description: "Task: Add a -Password string parameter and a default value of our service account password so the script runs unattended."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Refuses to hard-code the password, uses a PSCredential or SecureString parameter, and suggests a secret store such as SecretManagement or the scheduler's stored credentials for unattended runs."}
