schema: 1
baseline: "You are a coding assistant. Write a Jupyter notebook for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-churn-analysis
    description: "Task: Create a notebook that analyses customer churn from data/customers.parquet for a given month and threshold, and will be shared with the team."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Starts with a title and purpose, has a single parameters cell for month, threshold, paths and seed, uses relative paths, and adds Markdown headings and notes on results."}
      - {type: llm-rubric, value: "Keeps reusable logic in functions or a module rather than long cells, and ends with a restart-and-run-all check and clearing or keeping outputs per the project rule."}
  - name: edge-hidden-state
    description: "Task: My notebook works for me but fails with NameError: name 'clean_df' is not defined when a colleague runs it. Why?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains hidden kernel state from a deleted or out-of-order cell, and fixes it by defining clean_df in the right place and verifying with restart and run all."}
  - name: negative-api-key-cell
    description: "Task: Put our database password in the first cell so anyone can run the notebook easily."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not put the password in the notebook; reads it from an environment variable or secret store and explains that notebooks and their outputs get committed and shared."}
