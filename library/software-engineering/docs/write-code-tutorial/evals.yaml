schema: 1
baseline: "Write a tutorial about {{topic}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fastapi-todo
    vars:
      topic: "Build a small REST API for a to-do list with create, list and complete endpoints and tests."
      reader_level: beginner
      stack: "Python 3.12, FastAPI, SQLite, pytest"
    assert:
      - {type: contains, value: "## Author checklist"}
      - {type: icontains, value: "checkpoint"}
      - {type: llm-rubric, value: "Every step has the file path, complete code with no ellipsis inside runnable code, the command to run and an expected output; install commands pin versions; beginner terms such as virtual environment and endpoint are explained."}
  - name: edge-no-stack
    vars:
      topic: "Add authentication to a web app."
    assert:
      - {type: llm-rubric, value: "Asks which stack (language, framework, auth approach) to use before writing, or clearly states the stack and versions it chose and why, rather than writing framework-ambiguous code."}
  - name: negative-expert-no-basics
    vars:
      topic: "Implement a lock-free single-producer single-consumer ring buffer and benchmark it."
      reader_level: expert
      stack: "Rust 1.80, criterion"
    assert:
      - {type: llm-rubric, value: "Skips installation basics and explains memory ordering choices (Acquire/Release) and trade-offs; flags any uncertain API detail in the Author checklist rather than asserting it."}
