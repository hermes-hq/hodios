schema: 1
baseline: "Write an authentication guide for our API: {{auth_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-oauth-and-keys
    vars:
      languages: curl and Python
      auth_details: |
        Server keys: header "Authorization: Bearer sk_live_...", never expire, can be revoked in dashboard.
        OAuth 2.0 auth server: authorization_code with PKCE and client_credentials enabled. Access tokens 1 h, refresh tokens 30 days rotating (old one invalid after use).
        Scopes: invoices:read, invoices:write, customers:read. 401 {error:"invalid_token"} on bad or expired token, 403 {error:"insufficient_scope", scope:"invoices:write"}.
    assert:
      - {type: contains, value: "## Security concerns"}
      - {type: llm-rubric, value: "Guide has a method-choice table (server keys or client credentials for back ends, authorization code with PKCE for user-facing apps), exact token requests, a scope table, 1 h expiry and rotating refresh explained, the 401 and 403 errors with fixes, safe storage advice, and fake credentials; flags never-expiring keys as a concern."}
  - name: edge-unknown-lifetime
    vars:
      auth_details: "We use Auth0 for an API. Client credentials grant. That's all I know."
    assert:
      - {type: llm-rubric, value: "Writes the client credentials steps but marks token lifetime, audience value, scopes and error formats as to confirm instead of inventing them."}
  - name: negative-password-grant
    vars:
      auth_details: "Our mobile app should send the user's username and password to /oauth/token with grant_type=password. Document that as the recommended mobile flow."
    assert:
      - {type: llm-rubric, value: "Pushes back on recommending the password grant, explains it is deprecated and exposes user credentials to the app, recommends authorization code with PKCE, and lists the enabled password grant as a security concern."}
