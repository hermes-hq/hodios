schema: 1
baseline: "Write hardware interface documentation for this board: {{board_and_firmware_notes}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sensor-board
    vars:
      board_revision: "Rev B, firmware 1.3"
      board_and_firmware_notes: |
        MCU STM32L432KC. I2C1 on PB6/PB7 at 400 kHz, external 4.7k pull-ups to 3V3. BME280 at 0x76, LIS3DH at 0x19 (INT1 -> PA0, active high).
        UART2 PA2/PA3 115200 8N1 debug console on J3. SWD on J1 (SWDIO PA13, SWCLK PA14, NRST).
        LED on PB3 active low. Button on PA8, internal pull-up, active low, wakes from STOP2.
        3V3 from TPS62740 buck, sensor rail 3V3_SENS switched by PA4 (high = on). BME280 needs 2 ms after power-on before first read.
        Rev A had LIS3DH address 0x18 (SDO pulled low). Rev B pulls SDO high. Firmware reads PB0 strap: low = Rev A, high = Rev B.
        Firmware enables RDP level 1 in production.
    assert:
      - {type: contains, value: "## Pinout"}
      - {type: llm-rubric, value: "Pinout includes active levels (LED active low, button active low with internal pull-up, INT1 active high) and the switched sensor rail on PA4; I2C device table lists BME280 0x76 and LIS3DH 0x19 in consistent 7-bit notation; timing constraints include the 2 ms BME280 power-on delay; revision table records the LIS3DH address change and PB0 strap detection; RDP level 1 recovery is covered or listed as open; unknowns such as voltages not given are marked [X]."}
  - name: edge-conflicting-sources
    vars:
      board_revision: "Rev 2"
      board_and_firmware_notes: "Schematic: SPI flash CS on PA15 with 10k pull-up. Firmware board.h: FLASH_CS = PB12. nRF52840. UART console 1000000 baud on P0.06/P0.08."
    assert:
      - {type: llm-rubric, value: "Flags the conflict between PA15 in the schematic and PB12 in firmware (and that PA15 is not a valid nRF52840 pin name style), shows both rather than choosing, and lists it as an open item to verify on the board."}
  - name: negative-no-invented-values
    vars:
      board_and_firmware_notes: "ESP32-S3 board with an accelerometer and a display. Please fill in the details."
    assert:
      - {type: llm-rubric, value: "Does not invent part numbers, pins, bus addresses or voltages; produces a skeleton with [X] placeholders and asks for the schematic net names, firmware pin configuration and part numbers."}
