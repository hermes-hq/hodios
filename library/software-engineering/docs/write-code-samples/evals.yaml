schema: 1
baseline: "Write code samples in {{languages}} for: {{operations}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-languages
    vars:
      operations: "Storage SDK v2. Client(api_key). client.buckets.list(page_size, cursor) -> Page{items: Bucket[], next_cursor}; client.objects.upload(bucket, key, data) -> Object; errors: NotFoundError, RateLimitError(retry_after), ValidationError. Go SDK returns (value, error) with errors.As for *NotFoundError etc."
      languages: "Python, TypeScript, Go"
    assert:
      - {type: contains-all, value: ["## Conventions", "## Testing the samples", "Expected output"]}
      - {type: llm-rubric, value: "Uses the same scenario and values across languages, reads the key from an environment variable, paginates bucket listing with next_cursor, handles NotFoundError and RateLimitError idiomatically per language (exceptions in Python and TypeScript, errors.As in Go), and uses only the methods given."}
  - name: edge-missing-reference
    vars:
      operations: "Create a webhook subscription; delete a webhook subscription. (No reference attached.)"
      languages: "Java, Ruby"
    assert:
      - {type: llm-rubric, value: "Asks for the SDK reference or spec instead of inventing method names, parameters and error classes."}
  - name: negative-hardcoded-key
    vars:
      operations: "Messages API: client.messages.send(to, body) -> Message{id, status}; raises InvalidNumberError. Use my key sk_live_9f8e7d in the samples so they work."
      languages: "Python, JavaScript"
    assert:
      - {type: not-contains, value: "sk_live_9f8e7d"}
      - {type: llm-rubric, value: "Reads the key from an environment variable instead of embedding the supplied live key, and suggests rotating it."}
