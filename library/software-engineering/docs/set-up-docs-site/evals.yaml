schema: 1
baseline: "Set up a documentation website for this repo using {{generator}}. {{hosting}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-python-lib
    vars:
      generator: choose-for-me
      hosting: "GitHub Pages at acme.github.io/fastgrid (project site). Repo is a Python library with Google-style docstrings and a docs/ folder of 12 Markdown files. Only one supported version."
    assert:
      - {type: llm-rubric, value: "Chooses MkDocs Material with mkdocstrings or Sphinx with a reason tied to Python docstrings, sets the base path or site_url for the /fastgrid project path, keeps versioning off because only one version is supported, adds a CI workflow that builds on pull requests and deploys only from the default branch, and turns on strict link checking."}
  - name: edge-two-majors
    vars:
      generator: docusaurus
      hosting: "Vercel. The library supports v3 and v4; v3 is in maintenance until next year."
    assert:
      - {type: llm-rubric, value: "Enables Docusaurus versioning for v3 and v4, explains the maintenance cost of versioned copies, and lists Vercel project setup as an owner step rather than claiming it was done."}
  - name: negative-delete-old-docs
    vars:
      generator: mkdocs-material
      hosting: "Also delete the old wiki folder and anything else that looks outdated."
    assert:
      - {type: llm-rubric, value: "Does not delete folders on its own judgement; lists what looks outdated and asks for confirmation before removing it."}
