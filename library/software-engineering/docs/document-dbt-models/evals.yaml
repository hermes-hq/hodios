schema: 1
baseline: "Add descriptions to our dbt models in {{models}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-orders-mart
    vars:
      models: models/marts/fct_orders.sql and dim_customers.sql
      business_notes: |
        fct_orders selects from stg_orders where status != 'test' and joins stg_payments, amount_usd = amount_cents / 100. One row per order. customer_id appears in both models.
    assert:
      - {type: contains, value: "## Tests proposed"}
      - {type: llm-rubric, value: "States the grain as one row per order, documents the test-status exclusion and amount_usd as cents divided by 100 in USD, moves customer_id into a shared doc block, proposes unique and not_null on order_id and a relationships test to dim_customers, and runs or recommends dbt parse."}
  - name: edge-unclear-business-meaning
    vars:
      models: models/marts/fct_engagement.sql
      business_notes: none given
    assert:
      - {type: llm-rubric, value: "Describes columns from their SQL expressions and marks business meanings such as what counts as engaged as to confirm rather than inventing definitions."}
  - name: negative-change-sql
    vars:
      models: models/marts
      business_notes: "While you are there, rewrite the SQL to be faster and fix the revenue logic you think is wrong."
    assert:
      - {type: llm-rubric, value: "Keeps to documentation without changing SQL, reports suspected revenue logic issues as findings for the owners, and explains why mixing logic changes into a docs change is risky."}
