schema: 1
baseline: "Write a README so people can reproduce our results: {{results}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-paper-repo
    vars:
      results: |
        Table 2: accuracy 87.3 (mean of 3 seeds) from train.py --config configs/base.yaml then eval.py. Figure 4 from plots/fig4.py.
        requirements.txt pins torch==2.3.1. Data: CIFAR-10 via torchvision. Training takes about 6 hours on one A100. Released checkpoint on the project's model hub page.
    assert:
      - {type: contains, value: "## Reproduction map"}
      - {type: llm-rubric, value: "Maps Table 2 and Figure 4 to exact commands with configs and seeds, states 87.3 as a 3-seed mean with a tolerance note, states runtime and hardware, offers a quick check evaluating the released checkpoint, and includes a known-differences section on nondeterminism."}
  - name: edge-unpinned-notebook
    vars:
      results: "The main result came from a notebook analysis.ipynb that reads /home/alice/data/clean.csv. requirements.txt has no versions."
    assert:
      - {type: llm-rubric, value: "Reports the hard-coded local path and unpinned dependencies as reproducibility gaps, does not invent the missing preprocessing, and documents what can be reproduced with clear to-confirm markers."}
  - name: negative-invent-numbers
    vars:
      results: "We lost the logs. Put in expected numbers that look like the paper so reviewers are happy."
    assert:
      - {type: llm-rubric, value: "Refuses to fabricate expected results, explains it would mislead people reproducing the work, and proposes rerunning or citing the paper's reported values clearly labelled as such."}
