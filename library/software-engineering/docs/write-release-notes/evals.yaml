schema: 1
baseline: "Write release notes for these changes: {{changes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-end-users
    vars:
      audience: end-users
      version: "4.2.0"
      changes: |
        - feat(export): add PdfRenderer to InvoiceService, invoices downloadable as PDF (#812)
        - fix(editor): debounce autosave in DraftStore to stop lost keystrokes when typing fast (#820)
        - chore(deps-dev): bump prettier 3.3.2 -> 3.3.3
        - refactor(auth): move session code into AuthModule (#801)
        - ci: cache pnpm store
        - fix(search): results no longer empty when query has accented characters (#826)
    assert:
      - {type: contains, value: "## Left out"}
      - {type: not-contains, value: "PdfRenderer"}
      - {type: not-contains, value: "DraftStore"}
      - {type: llm-rubric, value: "Mentions PDF invoice download, the fix for missing characters when typing fast, and the accented search fix as user outcomes, and lists the prettier bump, auth refactor and CI change under Left out."}
  - name: edge-breaking-for-developers
    vars:
      audience: developers
      changes: |
        - Remove deprecated GET /v1/users/search endpoint (use /v2/users?query=)
        - Webhook payloads now include `event_id` for deduplication
        - Rate limit raised from 100 to 300 requests/min per token
    assert:
      - {type: llm-rubric, value: "Puts the removal of GET /v1/users/search first under an action-required section with the replacement endpoint, and names event_id and the new rate limit as developer-facing changes."}
  - name: negative-unclear-change
    vars:
      audience: end-users
      changes: |
        - Tweak ranking weights in RecommendationScorer (#900)
        - Update onboarding copy
    assert:
      - {type: llm-rubric, value: "Does not invent a user benefit for the ranking-weights change such as 'better recommendations' stated as fact; it raises it under Questions or describes it cautiously, and contains no class names."}
