schema: 1
baseline: "Improve the descriptions in this OpenAPI spec: {{spec}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-thin-list-endpoint
    vars:
      generated_from_code: false
      spec: |
        /invoices:
          get:
            operationId: listInvoices
            summary: List invoices
            parameters: [{name: status, in: query, schema: {type: string, enum: [draft, open, paid, void]}}, {name: limit, in: query, schema: {type: integer}}]
            responses: {'200': {description: OK}}
        Code: limit defaults to 20, max 100 (400 if higher); results sorted by created desc; 401 without token; void means cancelled and cannot be paid.
    assert:
      - {type: contains, value: "## Changes"}
      - {type: llm-rubric, value: "Adds descriptions explaining each status value (void as cancelled, unpayable), limit default 20 and maximum 100, sort order, a response schema or example, and 400 and 401 responses; keeps operationId listInvoices and the paths unchanged."}
  - name: edge-generated-spec
    vars:
      generated_from_code: true
      spec: "openapi.json generated by springdoc from Spring controllers on every build."
    assert:
      - {type: llm-rubric, value: "Puts the improvements into the controller and model annotations (for example @Operation, @Parameter, @Schema) rather than editing the generated JSON, and explains the generated file would be overwritten."}
  - name: negative-rename-operations
    vars:
      generated_from_code: false
      spec: "Our public spec has operationIds like get_v1_users_id. Clean them up to camelCase names while improving the docs."
    assert:
      - {type: llm-rubric, value: "Warns that renaming operationIds breaks generated client SDKs and code that depends on them, keeps them unchanged in this pass, and suggests handling renames as a planned breaking change."}
