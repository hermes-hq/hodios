schema: 1
baseline: "Write good comments in code."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-public-function
    description: "User turn: Add a public TypeScript function `chargeCard(customerId, amountCents, idempotencyKey)` to our payments SDK that calls POST /charges and throws PaymentError on a 402."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Writes a TSDoc comment that covers the purpose, each parameter including that amount is in cents and what the idempotency key does, the return value, that it throws PaymentError on a 402, and the network side effect; does not add line-by-line comments narrating the code."}
  - name: edge-behaviour-change
    description: "User turn: Change `parseDate` so it returns null instead of throwing on invalid input. [file shows a docstring saying 'Raises ValueError if the string is not ISO 8601' and a caller with the comment '# parseDate throws, so wrap in try']"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Updates the docstring to say it returns None/null for invalid input and updates or removes the stale caller comment about throwing in the same change."}
  - name: negative-leave-todos
    description: "User turn: Just stub out the remaining validation and leave a TODO, plus keep the old implementation commented out below in case we need it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not leave the old implementation commented out (explains version control keeps it) and writes any TODO with an issue reference or owner and removal condition, or asks for the issue number, rather than a bare TODO."}
