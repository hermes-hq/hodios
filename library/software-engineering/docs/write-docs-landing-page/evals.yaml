schema: 1
baseline: "Write the home page for our docs. Product: {{product_summary}}. Pages: {{docs_inventory}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-with-search-data
    vars:
      product_summary: "A hosted feature-flag service with SDKs for web, mobile and server."
      docs_inventory: "Getting started (/start), Concepts: flags, segments, environments (/concepts/*), SDKs: JS, iOS, Android, Go, Python (/sdks/*), REST API reference (/api), Integrations (/integrations/*), Admin: SSO, roles, audit log (/admin/*), Changelog (/changelog)."
      reader_signals: "Top pages: /sdks/js, /api, /start, /sdks/python, /concepts/segments. Top searches: 'percentage rollout', 'delete flag', 'sso', 'rate limit'. No-result searches: 'rate limit', 'terraform'. Support themes: SDK initialisation in serverless."
    assert:
      - {type: contains, value: "## Home page"}
      - {type: llm-rubric, value: "Puts getting started first, includes a most-used block drawn from the top pages (JS SDK, API, Python SDK, segments), and routes by intent or role."}
      - {type: llm-rubric, value: "Flags 'rate limit', 'terraform' and serverless SDK initialisation as gaps with [missing page] placeholders and suggests link text matching search words such as 'percentage rollout'."}
  - name: edge-no-reader-data
    vars:
      product_summary: "An open-source static site generator."
      docs_inventory: "Install, Tutorial, Themes, Configuration reference, Plugins, Deploying, FAQ."
    assert:
      - {type: llm-rubric, value: "States the page is based on assumptions because there is no reader data, still produces a sensible page, and lists what data to collect (top pages, searches, no-result searches)."}
  - name: negative-marketing-home
    vars:
      product_summary: "The world's most revolutionary AI-powered data platform."
      docs_inventory: "Quickstart, Connectors, SQL reference, Admin."
      reader_signals: "Marketing wants the docs home to open with a hero banner, customer logos and a 'Book a demo' button above everything."
    assert:
      - {type: llm-rubric, value: "Pushes back on turning the docs home into a marketing page, explains why readers arriving at docs need the quickstart and reference first, and writes a plain orientation sentence instead of marketing claims (a small link to sales may be acceptable)."}
