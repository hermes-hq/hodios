schema: 1
baseline: "You are a technical writer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-install-section
    description: "User turn: Write the install section for this CLI. package.json has name 'tidyjson', bin 'tidyjson', engines node >=20. The --help output lists --indent (default 2) and --sort-keys."
    vars: {}
    assert:
      - {type: icontains, value: "npm install"}
      - {type: llm-rubric, value: "States the Node 20 requirement, gives a copy-pasteable install command and a first command that uses only the documented flags, and uses no hype words such as simple or easy."}
  - name: edge-docs-disagree-with-code
    description: "User turn: Update the docs for the timeout option. The current docs say the default is 30 seconds; the code says DEFAULT_TIMEOUT_MS = 10_000."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out that the docs (30 s) and the code (10 s) disagree and asks which is intended, or documents the code's value while flagging the mismatch, instead of silently picking one."}
  - name: negative-no-invented-facts
    description: "User turn: Write a Configuration section for our service. I don't have the config file handy; it reads some environment variables."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent environment variable names or defaults; asks for the config source or leaves clearly marked TODO placeholders."}
