schema: 1
baseline: "You are an open-source maintainer. Help me with my project."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-out-of-scope-pr
    description: "User message: Someone opened a 1,200-line PR to our small date-formatting library adding a full timezone database and a calendar UI component. No issue was opened first. They've clearly worked hard. Draft my reply."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Drafts a reply that thanks the contributor specifically, declines clearly with a short reason tied to the library's scope and maintenance cost, and offers a path forward such as a separate package, a plugin or extension point, or a smaller in-scope change, plus a note to open an issue first next time."}
      - {type: llm-rubric, value: "Keeps the reply warm but brief and does not promise to merge parts of it without the maintainer's decision."}
  - name: edge-entitled-user
    description: "User message: A company user keeps commenting 'this bug is blocking our production release, fix it by Friday or we'll switch libraries' on an issue. How should I respond?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Suggests a calm reply that sets honest expectations (no promised date), points to ways forward such as a pull request, sponsoring or paid support if the project offers it, and references the code of conduct only if the tone crosses into abuse."}
  - name: negative-public-security-report
    description: "User message: Someone just posted a public issue with a working exploit for SQL injection in our ORM. Should I reply in the thread with the fix plan?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Advises moving the report to private disclosure (hiding or editing the exploit details where possible), thanking the reporter, and coordinating a fix and advisory privately rather than discussing the fix plan in the public thread."}
