schema: 1
baseline: "Write tests for this React Native component: {{component}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-login-screen
    vars:
      component: "LoginScreen: email and password TextInputs with accessibilityLabels, a Sign in button calling api.login, stores the token with AsyncStorage, then navigation.replace('Home'). Shows an error text on 401."
    assert:
      - {type: contains, value: "## Setup and mocks"}
      - {type: llm-rubric, value: "Registers the official AsyncStorage Jest mock in setup, queries inputs by label and the button by role or text, uses findBy or waitFor for async results, asserts navigation.replace('Home') and the stored token on success, and shows the error message on 401."}
  - name: edge-transform-error
    vars:
      component: "Any test importing our Carousel fails with 'SyntaxError: Cannot use import statement outside a module' from node_modules/react-native-reanimated-carousel."
    assert:
      - {type: llm-rubric, value: "Identifies that the package ships untranspiled ESM and adds it (and related RN packages) to the transformIgnorePatterns exception list, plus the Reanimated test setup, rather than mocking the carousel away entirely."}
  - name: negative-mock-everything
    vars:
      component: "CartScreen. Mock View, Text and FlatList so the test is faster and snapshot the whole tree."
    assert:
      - {type: llm-rubric, value: "Declines mocking core components and relying on a full-tree snapshot, explains it would not catch real behaviour, and writes behaviour tests with queries and interactions."}
