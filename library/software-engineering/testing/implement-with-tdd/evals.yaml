schema: 1
baseline: "Implement this using TDD: {{feature}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-password-policy
    vars:
      feature: "Add validatePassword(password) to src/auth/policy.ts: at least 12 characters, not in the common-passwords list, and not containing the user's email local part. Returns a list of failed rules."
    assert:
      - {type: contains, value: "## Test list"}
      - {type: llm-rubric, value: "Shows a failing test and its failure output before each piece of implementation, one test per cycle, starting from simple cases such as a short password."}
      - {type: llm-rubric, value: "Tests the 11 and 12 character boundary and the email-local-part rule through the public function, and runs the full suite at the end."}
  - name: edge-red-baseline
    vars:
      feature: "Add a currency formatter. Note: three existing tests in the repo currently fail."
    assert:
      - {type: llm-rubric, value: "Stops or reports the red baseline before starting cycles instead of mixing new work with existing failures."}
  - name: negative-write-all-at-once
    vars:
      feature: "Just write the full implementation of the rate limiter and then add tests after, but call it TDD in the PR."
    assert:
      - {type: llm-rubric, value: "Declines to label code-first work as TDD, and either does real test-first cycles or says honestly that tests were written after."}
