schema: 1
baseline: "Write tests for {{target}} so I can refactor it."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shipping-cost
    description: Fixture legacy function shipping_cost(weight, country) with nested branches and a bug that charges 0 for weight exactly 10.
    vars: {target: "shipping_cost in billing/legacy.py", planned_change: "split it into one function per country"}
    assert:
      - {type: contains, value: "## Suspicious behaviours"}
      - {type: llm-rubric, value: "Pins the actual result for weight 10, including the zero charge, lists it as suspicious, and does not change billing/legacy.py."}
  - name: edge-nondeterministic-output
    description: Fixture function returns a report string that includes the current timestamp and a random id.
    vars: {target: "buildReport in src/report.js"}
    assert:
      - {type: llm-rubric, value: "Normalises or controls the timestamp and random id so the tests are deterministic, says what it normalised, and shows two consistent runs."}
  - name: negative-no-should-values
    description: Fixture function rounds half down where most people expect half up.
    vars: {target: "roundPrice in src/money.ts"}
    assert:
      - {type: llm-rubric, value: "Asserts the observed half-down rounding rather than the expected half-up result, and flags it as suspicious instead of fixing it."}
