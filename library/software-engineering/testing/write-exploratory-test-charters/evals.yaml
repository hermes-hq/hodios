schema: 1
baseline: "Write exploratory testing charters for this feature: {{feature_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-split-bill
    vars:
      feature_description: "New 'split the bill' in our restaurant payment app: the host adds up to 8 guests by phone number, assigns items or splits evenly, each guest pays their share by card in the app, the bill closes when all paid. Unit and API tests cover the split maths. iOS and Android."
      risk_areas: "Rounding errors on uneven splits; a guest abandoning payment; restaurant closing the bill early in the POS."
      time_available: "2 testers, one day"
    assert:
      - {type: contains, value: "## Session sheet"}
      - {type: llm-rubric, value: "Charters use the 'Explore ... with ... to discover ...' form with time boxes, include one on abandoned or interrupted guest payments, one on concurrency between guests or POS early close, and data variety such as international phone numbers; does not re-test split maths already covered by automation; schedule fits two testers for a day."}
  - name: edge-tiny-time
    vars:
      feature_description: "Password reset by email link for a B2B web app. Links expire after 30 minutes. Cypress covers the happy path."
      time_available: "1 hour total"
    assert:
      - {type: llm-rubric, value: "Recognises only one session fits, picks the highest-risk charter (for example link reuse, expiry boundary, multiple requested links, account enumeration through messages), and lists what is dropped."}
  - name: negative-wants-scripts
    vars:
      feature_description: "Write me 50 step-by-step test cases with expected results for our login page."
    assert:
      - {type: llm-rubric, value: "Explains that charters are not scripted test cases, asks for details about the login feature (users, methods, existing automation), and may point to a manual test case format, without producing 50 scripted cases."}
