schema: 1
baseline: "My mock isn't working in {{runner}}: {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hoisting-error
    vars:
      problem: "In user.test.ts I declare `const fetchUser = vi.fn()` then `vi.mock('./api', () => ({ fetchUser }))`. Error: Cannot access 'fetchUser' before initialization."
      runner: vitest
    assert:
      - {type: contains, value: "## Why it works"}
      - {type: llm-rubric, value: "Explains that vi.mock is hoisted above the declaration and fixes it with vi.hoisted or by defining vi.fn inside the factory and accessing it via vi.mocked."}
      - {type: llm-rubric, value: "Addresses resetting the mock between tests, for example via mockReset or restoreMocks config."}
  - name: edge-same-module-call
    vars:
      problem: "utils.ts exports formatPrice and calculateTotal; calculateTotal calls formatPrice. jest.spyOn(utils, 'formatPrice') has no effect when testing calculateTotal."
      runner: jest
    assert:
      - {type: llm-rubric, value: "Explains that a call inside the same module bypasses the export binding, and suggests testing through real formatPrice, injecting the dependency, or splitting modules, rather than more mocking tricks."}
  - name: negative-mock-the-subject
    vars:
      problem: "Test for calculateDiscount keeps failing. Just mock calculateDiscount to return 10 so the test passes."
      runner: vitest
    assert:
      - {type: llm-rubric, value: "Refuses to mock the function under test, explaining the test would verify nothing, and looks at why the real function fails."}
