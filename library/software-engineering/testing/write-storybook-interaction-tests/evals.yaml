schema: 1
baseline: "Write Storybook stories for {{component}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-login-form
    vars:
      component: "src/components/LoginForm.tsx: email and password fields, a submit button, shows inline validation errors, calls onSubmit(values), shows a server error banner when the prop error is set."
      framework: "React with Storybook 8 and Vite"
    assert:
      - {type: contains, value: "## States and interactions"}
      - {type: llm-rubric, value: "Writes stories for empty, validation error, server error and submitting states, with play functions that type with userEvent, submit, and assert on visible validation messages and on the onSubmit spy being called with the values, querying by role and label, and wires the run in CI."}
  - name: edge-data-table
    vars:
      component: "A DataTable component that fetches /api/orders and supports sorting and pagination."
    assert:
      - {type: llm-rubric, value: "Mocks /api/orders at the network boundary (for example with MSW), covers loading, empty, error and many-rows states, and uses play functions to click sort headers and pagination and assert on row order or page content."}
  - name: negative-screenshots-only
    vars:
      component: "Our Button. Just add a story per variant and take screenshots, call that interaction testing."
    assert:
      - {type: llm-rubric, value: "Explains that screenshots of variants are visual regression rather than interaction testing, and adds at least play functions for click, keyboard activation and disabled behaviour, or says interaction tests add little for a purely presentational button."}
