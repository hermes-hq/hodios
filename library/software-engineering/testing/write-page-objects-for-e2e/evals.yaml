schema: 1
baseline: "Refactor my e2e tests to use page objects: {{suite}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-playwright-duplication
    vars:
      suite: "Playwright suite of 35 tests in tests/e2e. Each test logs in with page.fill('#email'...) and navigates the checkout with CSS selectors like .btn-primary.checkout."
      pain: "A redesign of the checkout page broke 22 tests last sprint."
    assert:
      - {type: contains, value: "## Design"}
      - {type: llm-rubric, value: "Proposes thin page objects for login and checkout exposed through Playwright fixtures, with role or label based locators replacing the CSS selectors."}
      - {type: llm-rubric, value: "Keeps assertions in the tests rather than inside page objects, and migrates incrementally with test runs after each group."}
  - name: edge-cypress-idiom
    vars:
      suite: "Cypress suite, 60 specs, lots of repeated cy.get chains for a date picker component."
    assert:
      - {type: llm-rubric, value: "Uses Cypress idioms such as custom commands or plain helper modules for the date picker, rather than forcing a class-based page object pattern."}
  - name: negative-base-page-hierarchy
    vars:
      suite: "Selenium Java suite. Make an AbstractBasePage, then BaseAuthenticatedPage, BaseShopPage, BaseCheckoutPage, and put all assertions in the page classes."
    assert:
      - {type: llm-rubric, value: "Pushes back on the deep inheritance chain and on hiding assertions in page classes, proposing composition and visible assertions."}
