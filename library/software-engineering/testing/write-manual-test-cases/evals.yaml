schema: 1
baseline: "Write test cases for this feature: {{feature_description}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-discount-codes
    vars:
      format: table
      feature_description: |
        Checkout discount codes. AC1: a valid code reduces the order subtotal by its percentage (10%, 15% or 25%). AC2: expired codes show "This code has expired". AC3: only one code per order. AC4: codes do not apply to gift cards. AC5: store admins can create codes with an expiry date; staff cannot.
    assert:
      - {type: contains, value: "## Smoke pass"}
      - {type: llm-rubric, value: "Cases have IDs, priorities, preconditions, numbered steps, exact test data and specific expected results (for example a subtotal of 100.00 becoming 85.00 with a 15% code, the exact expired message); covers a second code being rejected, a basket with only a gift card, and a staff role being unable to create codes; smoke pass contains only P1 cases."}
  - name: edge-csv-import
    vars:
      format: csv
      feature_description: "Users can change their notification preferences (email, SMS, push) on the Settings page and click Save. A confirmation toast appears."
    assert:
      - {type: llm-rubric, value: "Outputs CSV with the columns ID, Title, Priority, Preconditions, Steps, Test data, Expected result, Result, Notes, in fenced csv blocks with every cell quoted and steps inside one cell, keeps the smoke pass to at most 10 cases, and marks unconfirmed details such as the toast text or SMS opt-in rules as [CONFIRM] with questions listed."}
  - name: negative-vague-feature
    vars:
      feature_description: "The new dashboard."
    assert:
      - {type: llm-rubric, value: "Does not write test cases or fabricate rules, widgets or messages; asks what the dashboard shows, which user roles use it, its acceptance criteria and any limits or messages, and stops."}
