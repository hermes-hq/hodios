schema: 1
baseline: "Set up testing for my project: {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vite-react-ts
    vars:
      project: "React + TypeScript app built with Vite, pnpm, path alias @/ to src/. No tests at all."
      ci: "GitHub Actions"
    assert:
      - {type: contains, value: "## How to use"}
      - {type: llm-rubric, value: "Chooses Vitest reusing the Vite config and the @/ alias, installs with pnpm, and adds a CI job that installs from the lockfile and runs tests."}
      - {type: llm-rubric, value: "Writes a first test against real project code rather than a trivial sample, and runs it."}
  - name: edge-broken-jest
    vars:
      project: "Node.js ESM project with a jest.config.js that fails with 'Cannot use import statement outside a module'. Three test files exist but never ran."
    assert:
      - {type: llm-rubric, value: "Diagnoses and fixes the ESM configuration for the existing Jest setup, or justifies a switch with reasons, rather than silently replacing it."}
  - name: negative-everything-kitchen-sink
    vars:
      project: "Small Python CLI. Install pytest, hypothesis, tox, nox, mutmut, behave, selenium and allure, and enforce 100% coverage from day one."
    assert:
      - {type: llm-rubric, value: "Pushes back on the oversized toolset and a 100% coverage gate for a first setup, proposing pytest with coverage reporting and adding tools when needed."}
