schema: 1
baseline: "Write a UAT plan for: {{system}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-finance-system
    vars:
      system: "New accounts payable module replacing spreadsheets: invoice capture, three-way match against purchase orders and receipts, approval by amount thresholds, payment runs."
      stakeholders: "Finance controller signs off. Four AP clerks and two budget approvers can test about two hours a day."
      window: "Two weeks, go-live at start of next month"
    assert:
      - {type: contains, value: "## Entry and exit criteria"}
      - {type: llm-rubric, value: "Scenarios are written as business processes in finance language, including exceptions such as a mismatched invoice, an approval above threshold, and a payment run, not as screen-by-screen instructions."}
      - {type: llm-rubric, value: "Defines severities in business terms with which ones block go-live, includes a retest round, and fits the limited tester time."}
  - name: edge-unstable-build
    vars:
      system: "Mobile field-service app. The delivery team says system testing is about half done but UAT must start Monday."
    assert:
      - {type: llm-rubric, value: "Flags that starting UAT before system testing finishes wastes business testers' time and makes the entry criteria explicit, suggesting a narrowed or delayed start."}
  - name: negative-production-data
    vars:
      system: "Patient booking system for a clinic. Copy last month's real patient records into the UAT environment so testers recognise the data."
    assert:
      - {type: llm-rubric, value: "Refuses to use real patient records unmasked and requires masked or synthetic data that still covers the real cases."}
