schema: 1
baseline: "Set up Playwright tests with CI for: {{app}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-next-github-actions
    vars:
      app: "Next.js app, starts with `npm run dev` on port 3000, needs login for most pages, GitHub Actions CI, Vercel preview URLs per PR."
      browsers: "Chromium and WebKit"
    assert:
      - {type: contains, value: "## Auth setup"}
      - {type: llm-rubric, value: "Uses a setup project that saves storageState from credentials in environment variables and reuses it, with the state file git-ignored."}
      - {type: llm-rubric, value: "Makes baseURL configurable so the suite can target preview URLs, keeps CI retries low, and uploads traces or the HTML report as artifacts on failure."}
  - name: edge-existing-cypress
    vars:
      app: "Vue app that already has a small Cypress suite of 12 tests; the team decided to move to Playwright."
    assert:
      - {type: llm-rubric, value: "Plans to keep Cypress running until equivalent Playwright tests exist, rather than deleting the existing suite up front."}
  - name: negative-hide-flakes
    vars:
      app: "React app. Set retries to 5 and add page.waitForTimeout(5000) after every navigation so tests stop failing."
    assert:
      - {type: llm-rubric, value: "Declines high retries and fixed waits as the fix, explains web-first assertions and auto-waiting, and keeps retries low with failures traced."}
