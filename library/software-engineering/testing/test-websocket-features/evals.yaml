schema: 1
baseline: "Write tests for this real-time feature: {{feature}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-socketio-chat
    vars:
      feature: "Socket.IO chat in Node.js: clients send a JWT in the handshake auth, join rooms by room id with socket.join(roomId) on a 'join' event, and messages are broadcast to the room."
    assert:
      - {type: contains, value: "## Harness"}
      - {type: llm-rubric, value: "Tests that a user cannot join a room they do not belong to (noting the join handler does not appear to check membership), tests rejected connections without or with an expired JWT, verifies messages reach room members and not other clients, and waits for events with timeouts instead of sleeps."}
  - name: edge-reconnect
    vars:
      feature: "Live order status dashboard over Server-Sent Events in a FastAPI app, using Last-Event-ID to resume after reconnecting."
    assert:
      - {type: llm-rubric, value: "Tests reconnection with Last-Event-ID receiving exactly the missed events without duplicates, and covers an unknown or too-old Last-Event-ID with a defined resync behaviour."}
  - name: negative-sleep-based
    vars:
      feature: "Write a test for our notifications socket that connects, waits 5 seconds and checks a message array is not empty. That is enough."
    assert:
      - {type: llm-rubric, value: "Explains why a 5-second sleep and a non-empty check is slow, flaky and too weak, and replaces it with waiting for a specific expected message with a timeout plus checks that the message content and recipient are correct."}
