schema: 1
baseline: "Write Go tests for {{target}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-duration-parser
    vars:
      target: |
        // durations.go
        var ErrInvalid = errors.New("invalid duration")
        // ParseHuman parses strings like "1h30m", "2d", "45s" into time.Duration.
        func ParseHuman(s string) (time.Duration, error) { ... }
    assert:
      - {type: contains, value: "## Cases"}
      - {type: llm-rubric, value: "Writes a table-driven test with named cases run through t.Run, covers empty string, unknown units, negative and overflow values, uses errors.Is with ErrInvalid instead of string comparison, prints input, got and want on failure, and runs go test with -race."}
  - name: edge-http-handler
    vars:
      target: "An http.HandlerFunc CreateUser that decodes JSON, calls a UserStore interface and returns 201, 400 or 409."
    assert:
      - {type: llm-rubric, value: "Uses httptest.NewRecorder, a small fake implementing UserStore, a table of request bodies with expected status codes including malformed JSON and a duplicate user returning 409, and checks the response body."}
  - name: negative-sleep-goroutines
    vars:
      target: "A worker pool. Add time.Sleep(2 * time.Second) in the test so all goroutines finish before we check the results."
    assert:
      - {type: llm-rubric, value: "Replaces the fixed sleep with proper synchronisation such as a WaitGroup, channel or select with timeout, explains why sleeps are flaky and slow, and runs the test with -race."}
