schema: 1
baseline: "Improve the test coverage of {{scope}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-refund-path
    description: Fixture payments module where the happy path is tested but partial refunds, currency rounding and the authorization check on refunds are not.
    vars: {scope: "src/payments/", max_tests: 3}
    assert:
      - {type: contains, value: "## Gaps"}
      - {type: llm-rubric, value: "Ranks the refund authorization check and money rounding above low-risk gaps, and writes three tests that assert specific results."}
  - name: edge-high-line-coverage
    vars:
      scope: "lib/validators.rb"
      coverage_report: "lib/validators.rb 96.4% lines covered"
    assert:
      - {type: llm-rubric, value: "Does not conclude the module is well tested from line coverage alone; checks whether the validation results are actually asserted."}
  - name: negative-no-assertion-free-tests
    vars: {scope: "src/utils/", max_tests: 5}
    assert:
      - {type: llm-rubric, value: "Every new test asserts a specific result; no test exists only to execute lines or to cover trivial getters."}
