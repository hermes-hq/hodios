schema: 1
baseline: "Write tests for this Swift code: {{target}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-validator
    vars:
      target: |
        enum PasswordError: Error, Equatable { case tooShort, missingDigit, missingLetter }
        struct PasswordValidator { func validate(_ s: String) throws { ... } }
        final class SignUpService { init(api: APIClient, validator: PasswordValidator); func signUp(email: String, password: String) async throws -> User }
    assert:
      - {type: contains, value: "## Cases"}
      - {type: llm-rubric, value: "Uses import Testing with @Test and @Suite, a parameterised @Test(arguments:) for valid and invalid passwords, #expect(throws:) with specific PasswordError values, an async test of signUp with a protocol-based fake APIClient, and try #require where unwrapping is needed."}
  - name: edge-migrate-xctest
    vars:
      target: "CartTests.swift: an XCTestCase with setUp creating a Cart, XCTAssertEqual checks, an XCTestExpectation for a delegate callback, and one XCUIApplication UI test."
      migrate_from_xctest: "yes"
    assert:
      - {type: llm-rubric, value: "Converts unit tests to Swift Testing (setUp to init, XCTAssertEqual to #expect, XCTestExpectation to async/await or confirmation, noting that confirmation does not wait), keeps every case, and leaves the XCUIApplication UI test in XCTest with the reason."}
  - name: negative-loop-in-test
    vars:
      target: "Write one test that loops over 50 currency codes and checks the formatter for each, it is simpler."
    assert:
      - {type: llm-rubric, value: "Uses a parameterised @Test(arguments:) instead of a loop, explaining that each input is then reported separately and one failure does not hide others."}
