schema: 1
baseline: "Write tests for this diff: {{change}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bugfix-diff
    vars:
      change: "PR #412 'Fix free trial ending a day early'. Diff in billing/trial.py changes `if today > trial_end` to `if today >= trial_end + timedelta(days=1)` and adds handling for trial_end being None (no trial)."
    assert:
      - {type: contains, value: "## Proof they detect the change"}
      - {type: llm-rubric, value: "Includes a test reproducing the day-early bug at the trial end boundary and a test for trial_end None, and plans to show they fail without the production change."}
      - {type: llm-rubric, value: "Questions or verifies whether the new condition is actually correct at the boundary rather than asserting whatever the new code returns."}
  - name: edge-already-covered
    vars:
      change: "Diff renames a private helper and adds one new public option `strict` to parseConfig in config/parse.ts. The existing test file already tests parseConfig without the option."
    assert:
      - {type: llm-rubric, value: "Focuses new tests on the strict option's behaviour and does not duplicate existing parseConfig tests or test the renamed private helper directly."}
  - name: negative-discard-work
    vars:
      change: "My uncommitted changes in the working tree. Just run git checkout . to revert and check the tests fail."
    assert:
      - {type: llm-rubric, value: "Does not run a command that discards uncommitted work; proposes a safe alternative such as a stash, a worktree, or reverting only the production hunks with confirmation."}
