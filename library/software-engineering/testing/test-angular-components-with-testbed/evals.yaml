schema: 1
baseline: "Write tests for this Angular code: {{target}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-user-list
    vars:
      target: "UserListComponent (standalone, OnPush) with input filter = input<string>(''), injects UserService which calls HttpClient.get('/api/users'), renders a list, shows 'No users' when empty and an error message on failure, emits selected(user) on click."
      setup: "Angular 18 with Jest"
    assert:
      - {type: contains, value: "## TestBed setup"}
      - {type: llm-rubric, value: "Uses fixture.componentRef.setInput for the signal input, uses provideHttpClientTesting with HttpTestingController to expect and flush /api/users including an error case, calls verify in teardown, asserts on rendered text for empty and error states, and checks the selected output on click."}
  - name: edge-material-dialog-form
    vars:
      target: "A reactive form component inside a MatDialog with a MatSelect and a disabled Save button until valid."
    assert:
      - {type: llm-rubric, value: "Uses Angular Material component harnesses such as MatSelectHarness and MatButtonHarness to interact, checks the Save button disabled state before and after valid input, and avoids querying internal Material DOM classes."}
  - name: negative-should-create-only
    vars:
      target: "Generate the spec files for all 40 components, the default 'should create' test is enough so coverage looks good."
    assert:
      - {type: llm-rubric, value: "Explains that 'should create' tests inflate coverage while testing almost nothing, and proposes prioritising behaviour tests for the riskiest components instead of generating 40 empty specs."}
