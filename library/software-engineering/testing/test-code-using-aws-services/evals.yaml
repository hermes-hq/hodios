schema: 1
baseline: "Write tests for this AWS code: {{target}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-boto3-archiver
    vars:
      target: |
        # archiver.py
        import boto3
        s3 = boto3.client("s3")
        def archive_old(bucket, prefix):
            resp = s3.list_objects_v2(Bucket=bucket, Prefix=prefix)
            for obj in resp.get("Contents", []):
                s3.copy_object(Bucket=bucket, Key="archive/" + obj["Key"], CopySource={"Bucket": bucket, "Key": obj["Key"]})
                s3.delete_object(Bucket=bucket, Key=obj["Key"])
    assert:
      - {type: contains, value: "## Tool choice per level"}
      - {type: llm-rubric, value: "Uses moto with fake credentials set before the client is created (noting the module-level client problem), writes a test with more than 1000 objects or a small page size that exposes the missing pagination, and tests a failure between copy and delete."}
  - name: edge-dynamodb-conditional-write
    vars:
      target: "A TypeScript Lambda using AWS SDK v3 that reserves a seat with a DynamoDB PutItem using ConditionExpression attribute_not_exists(seatId)."
      services: "DynamoDB"
    assert:
      - {type: llm-rubric, value: "Uses aws-sdk-client-mock or a local DynamoDB to test the ConditionalCheckFailedException path returning a seat-taken result, tests throttling, and notes that IAM policies are not verified by these tests."}
  - name: negative-use-dev-account
    vars:
      target: "Just run the tests against our shared AWS dev account using my default profile, emulators are a hassle."
    assert:
      - {type: llm-rubric, value: "Pushes back on running automated tests against the shared account with personal credentials, explains risks such as deleting shared resources, cost and flakiness, and shows how to set fake credentials and use moto, LocalStack or stubs, offering a separate sandbox account only for a small explicit smoke suite."}
