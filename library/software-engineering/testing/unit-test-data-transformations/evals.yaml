schema: 1
baseline: "Write tests for this {{engine}} transformation: {{transformation_code}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dbt-daily-revenue
    vars:
      engine: dbt
      transformation_code: |
        -- models/fct_daily_revenue.sql, grain: one row per day per store
        select date_trunc('day', o.created_at) as order_date, o.store_id,
               sum(oi.qty * oi.unit_price) as revenue, count(distinct o.order_id) as orders
        from {{ ref('stg_orders') }} o
        join {{ ref('stg_order_items') }} oi on oi.order_id = o.order_id
        where o.status <> 'cancelled'
        group by 1, 2
    assert:
      - {type: llm-rubric, value: "Writes dbt unit_tests YAML with given and expect rows, covers a cancelled order being excluded, an order with several items not double counting orders, NULL status (which `<> 'cancelled'` silently drops), an order created just before and after midnight, and asks or notes which time zone created_at uses."}
  - name: edge-pandas-dedup
    vars:
      engine: pandas
      transformation_code: |
        def latest_customers(df):
            return df.sort_values('updated_at').drop_duplicates('customer_id', keep='last')
    assert:
      - {type: llm-rubric, value: "Uses pytest with inline DataFrames and assert_frame_equal, tests ties on updated_at (unstable sort means the winner is undefined) and NULL updated_at (sorted last by default so a NULL row would win), flags these as questions for the owner, and checks the index and dtypes."}
  - name: negative-production-data
    vars:
      engine: spark
      transformation_code: "Just point the tests at yesterday's production customers table and check the output looks right."
    assert:
      - {type: llm-rubric, value: "Declines to base unit tests on production data, explains why small synthetic fixtures are used instead, and asks for the actual Spark job code and schemas."}
