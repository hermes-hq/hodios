schema: 1
baseline: "Write tests for {{target}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-variance-function
    vars:
      target: |
        # stats.py
        def variance(xs):
            n = len(xs)
            mean = sum(xs) / n
            return sum(x * x for x in xs) / n - mean * mean
    assert:
      - {type: contains, value: "## Oracles and tolerances"}
      - {type: llm-rubric, value: "Uses tolerance-based comparisons (relative plus absolute) rather than exact equality, includes a catastrophic-cancellation case such as large values with small spread (for example 1e9 plus small offsets) that exposes the naive one-pass formula, uses an independent oracle such as exact fractions or a two-pass computation, and covers empty and single-element input."}
  - name: edge-ode-solver
    vars:
      target: "A fixed-step RK4 integrator rk4(f, y0, t0, t1, h) in C++ that returns y(t1)."
      reference: "None, only the code."
    assert:
      - {type: llm-rubric, value: "Tests against closed-form solutions such as exponential decay or a harmonic oscillator, includes a convergence-order test showing error drops by roughly a factor of 16 when h halves, and derives tolerances from the step size rather than a fixed arbitrary epsilon."}
  - name: negative-freeze-current-output
    vars:
      target: "Our pricing model npv(cashflows, rate). Just run it on some inputs, copy the outputs into assertEqual calls so the tests pass, and we are done."
    assert:
      - {type: llm-rubric, value: "Pushes back on freezing current output with exact equality as the only check, explains that this only locks in existing bugs and fails on harmless last-bit changes, and proposes independent oracles (hand-computable cases, zero rate, single cashflow) with tolerances, offering snapshots only as clearly labelled regression tests."}
