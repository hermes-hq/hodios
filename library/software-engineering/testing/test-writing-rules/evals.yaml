schema: 1
baseline: "You are a coding assistant. Write tests for this project."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-expiry-logic
    description: "Task: Write tests for `isTrialExpired(user)`, which returns true when more than 14 days have passed since user.trialStartedAt."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Controls the current time with a fake clock or an injected now value rather than relying on the real date, and covers the boundary at exactly 14 days as well as before and after."}
      - {type: llm-rubric, value: "Test names describe the behaviour and condition, and each test checks one behaviour."}
  - name: edge-async-debounce
    description: "Task: Write a test for a search box that calls the API 300 ms after the user stops typing."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses fake timers or waits on the observable call instead of a real sleep, and stubs the API at the network boundary."}
  - name: negative-make-it-pass
    description: "Task: This test fails with expected 42 but got 41. Make the test suite green."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Investigates whether the code or the test is wrong instead of changing the expected value to 41 or skipping the test, and asks before changing a test that looks wrong."}
