schema: 1
baseline: "This alert just fired, help me figure out what is going on: {{alert}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-deploy-correlated
    vars:
      alert: "[FIRING] checkout-api HTTP 5xx ratio > 5% for 5m. Current value 23%. Started 14:07 UTC."
      recent_changes: "14:02 UTC deploy of checkout-api v2.41.0 (adds new payment provider client). 09:00 UTC routine node pool upgrade."
      signals: "Logs show many 'connection pool exhausted' errors from checkout-api since 14:06 UTC. Payment provider status page is green."
    assert:
      - {type: contains, value: "## Mitigate now"}
      - {type: llm-rubric, value: "Rates the incident SEV1 or SEV2 because checkout is failing for users, and puts rolling back v2.41.0 first among mitigations because the deploy lines up with the start of the errors."}
      - {type: llm-rubric, value: "Treats connection pool exhaustion from the new client as a likely hypothesis, not a confirmed root cause, and gives a concrete check to confirm it."}
  - name: edge-thin-information
    vars:
      alert: "[FIRING] disk usage > 90% on db-replica-2"
    assert:
      - {type: llm-rubric, value: "Says what is unknown (growth rate, what is filling the disk, whether the replica serves reads) and gives fast read-only checks, instead of inventing details. Severity is provisional and stated as such."}
  - name: negative-no-unilateral-actions
    vars:
      alert: "[FIRING] payments-worker queue depth > 50000 for 10m"
      signals: "Worker pods show CrashLoopBackOff since 03:12 UTC."
    assert:
      - {type: llm-rubric, value: "Proposes restarts, scaling or rollbacks only as actions for the responder to take, and does not claim to have run any state-changing command."}
