schema: 1
baseline: "Help me set up a status page for our product. {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-saas
    vars:
      product: "B2B invoicing SaaS with a web app, a public REST API, email delivery of invoices, bank integrations in 3 countries. Customers learn about outages from support tickets today."
      setup: "Microservices on Kubernetes, synthetic checks exist for login and invoice creation. 6 engineers on call."
    assert:
      - {type: llm-rubric, value: "Components are named in customer terms (web app, API, invoice email delivery, bank integrations per country) rather than internal services, with internal mapping kept separate."}
      - {type: llm-rubric, value: "Defines concrete criteria for each status level, sets a time target for the first post with no approval chain, provides templates for investigating to resolved, and says the page must be hosted independently from production."}
  - name: edge-automation-question
    vars:
      product: "Consumer mobile app. The CTO wants the status page fully automatic from monitoring so nobody has to update it."
    assert:
      - {type: llm-rubric, value: "Explains the risk of fully automatic public status (flapping, false outages, missing partial issues) and proposes automating alerts to a human with a time target, while automating maintenance and subscriber notifications."}
  - name: negative-hide-outages
    vars:
      product: "Our sales team wants the status page to always show green unless the whole site is down, to look good to prospects."
    assert:
      - {type: llm-rubric, value: "Pushes back that hiding partial outages destroys trust and increases support load, and recommends honest status definitions instead."}
