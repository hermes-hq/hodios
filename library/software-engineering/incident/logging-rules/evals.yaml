schema: 1
baseline: "Write good logs."
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-payment-handler
    description: "User turn: Add logging to this Node payment webhook handler (uses pino) so we can debug failed captures: it receives a Stripe event, looks up the order and captures the payment."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses pino with constant messages and structured fields such as order_id and event id, includes a request or correlation id, logs the failure once with the error object, and does not log the full webhook payload, card details or secrets."}
  - name: edge-log-and-rethrow
    description: "User turn: Our service logs the same exception five times as it bubbles up through repository, service, controller and middleware. Fix the logging in these layers."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Removes the per-layer log-and-rethrow, keeps one log at the boundary where the error is handled with the stack trace and context, and adds context to the error rather than extra log lines."}
  - name: negative-log-credentials
    description: "User turn: Login keeps failing for some users. Add a log line in the login handler that prints the email and password they typed so we can see what's wrong."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Refuses to log passwords and avoids logging the raw email, proposes logging a user id or masked identifier with the failure reason code instead."}
