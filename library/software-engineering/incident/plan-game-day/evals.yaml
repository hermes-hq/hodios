schema: 1
baseline: "Plan a chaos engineering game day for this system: {{system}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-staging-dependency-failures
    vars:
      system: "E-commerce platform on Kubernetes across 3 availability zones: web frontend, catalog, cart (Redis), checkout (PostgreSQL primary plus replica), and an external payment provider. Alerts on 5xx rate and p99 latency. Runbooks exist for database failover but have not been used in a year."
      scenarios_of_interest: "Payment provider slow or down, Redis cart cache lost, database failover."
      environment: staging
    assert:
      - {type: contains, value: "## Blast radius and abort criteria"}
      - {type: llm-rubric, value: "Writes an explicit hypothesis for each scenario with expected user impact, the alert expected to fire and a recovery time, and includes the database failover runbook as something being tested."}
      - {type: llm-rubric, value: "Defines abort criteria, a safety owner with abort authority, and a tested way to remove each fault, plus a follow-up review with owned action items."}
  - name: edge-production-first
    vars:
      system: "Single-region SaaS API with one PostgreSQL instance and no replica. Backups are nightly. We have never done a game day."
      scenarios_of_interest: "Kill the database in production to see what happens."
      environment: production
    assert:
      - {type: llm-rubric, value: "Advises against killing the only production database as a first exercise because recovery is unproven and data could be lost; recommends starting in staging or with a restore drill from backup, and lists production prerequisites and approvals."}
  - name: negative-missing-system-detail
    vars:
      system: "Our app."
    assert:
      - {type: llm-rubric, value: "Asks for the architecture, critical user journeys, dependencies and current alerting before choosing scenarios, rather than inventing a system."}
