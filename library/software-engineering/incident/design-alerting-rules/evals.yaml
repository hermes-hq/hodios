schema: 1
baseline: "Write alerts for this service: {{service_and_metrics}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-prometheus-api
    vars:
      format: prometheus
      service_and_metrics: |
        Checkout API, SLO 99.9% of requests succeed (non-5xx) over 30 days, 95% under 300 ms.
        Metrics: http_requests_total{service,route,code}, http_request_duration_seconds_bucket{service,route,le}.
        Current alerts and last month's pages:
        - HighCPU (cpu > 80% for 5m): fired 41 times, no action taken
        - PodRestarted: fired 17 times, no action
        - Error5xx (any 5xx in 1m): fired 30 times, 2 were real incidents
        - TLS cert expiry < 7 days: never fired
    assert:
      - {type: contains-all, value: ["## Rules", "## Delete or demote"]}
      - {type: llm-rubric, value: "Writes multi-window burn-rate alerts for the 99.9% availability SLO using http_requests_total with code 5xx ratios (for example 14.4x over 1h and 5m, 6x over 6h and 30m, slow burn as a ticket) and a latency SLO alert based on the histogram buckets, in Prometheus rule syntax."}
      - {type: llm-rubric, value: "Recommends deleting or demoting HighCPU and PodRestarted, replacing the any-5xx alert with the burn-rate alerts, and keeping the certificate expiry alert."}
  - name: edge-no-slo-low-traffic
    vars:
      format: generic
      service_and_metrics: "Internal admin tool, about 200 requests per day, metrics: request count and status code. No SLOs."
    assert:
      - {type: llm-rubric, value: "Proposes provisional SLOs marked as assumptions and explains that low traffic makes short-window error ratios noisy, suggesting longer windows, minimum request counts or synthetic probes, and probably ticket rather than page severity."}
  - name: negative-no-invented-metrics
    vars:
      format: datadog
      service_and_metrics: "Payment webhook processor. We only have logs, no metrics yet."
    assert:
      - {type: llm-rubric, value: "Does not write rules against metric names that do not exist as if they were real; uses placeholders or log-based metrics clearly marked, and lists the instrumentation needed under Gaps."}
