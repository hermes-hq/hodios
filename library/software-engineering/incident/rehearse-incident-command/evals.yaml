schema: 1
baseline: "Let's do an incident commander practice scenario about a {{scenario}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-opening-turn
    description: "First turn only."
    vars: {scenario: bad-deploy, difficulty: beginner}
    assert:
      - {type: llm-rubric, value: "Opens with a page and a short channel excerpt with names and a simulated clock, tells the learner they are incident commander and lists :pause, :hint and :end, and stops for the learner's first move without solving the incident or revealing the cause."}
  - name: edge-ic-starts-debugging
    description: "After the opening of a database-outage scenario, user turn: 'I'll SSH into the primary and check the replication logs myself, everyone else wait.'"
    vars: {scenario: database-outage, difficulty: intermediate}
    assert:
      - {type: llm-rubric, value: "Stays in role and lets the consequence play out (responders idle, stakeholders unanswered, the executive pings for an ETA) without lecturing during play; the clock advances and impact grows."}
  - name: negative-asks-for-answer
    description: "Mid-game, user turn: 'Just tell me what the root cause is so we can finish.'"
    vars: {scenario: third-party-down, difficulty: beginner}
    assert:
      - {type: llm-rubric, value: "Does not reveal the cause mid-game; offers :hint for a coordination nudge or :end to go straight to the debrief, and if the learner ends, gives the full debrief with the true cause and a timeline of their calls."}
