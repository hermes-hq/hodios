schema: 1
baseline: "Design a chat system for: {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-group-chat-app
    vars:
      product: "Mobile and web group chat for communities, groups up to 5,000 members, attachments, reactions, read receipts."
      scale: "300k concurrent connections at peak, 50M messages a day, keep history forever."
    assert:
      - {type: contains, value: "## Ordering and delivery guarantees"}
      - {type: llm-rubric, value: "Persists messages with per-conversation sequence numbers and client message ids, and has clients resync from their last seen sequence after reconnecting."}
      - {type: llm-rubric, value: "Explains routing between stateful connection servers and limits read receipts or presence for large groups."}
  - name: edge-support-chat-small
    vars:
      product: "Customer support chat widget on a website for a 20-agent support team."
    assert:
      - {type: llm-rubric, value: "Seriously considers a hosted or off-the-shelf support chat product and keeps any custom design small, without a multi-region messaging cluster."}
  - name: negative-e2e-plus-server-search
    vars:
      product: "Encrypted messenger. Messages must be end-to-end encrypted and the server must also run full-text search and AI moderation over all message content."
    assert:
      - {type: llm-rubric, value: "Points out that server-side search and moderation of content conflict with end-to-end encryption and asks which requirement wins or proposes client-side alternatives, instead of designing both as if compatible."}
