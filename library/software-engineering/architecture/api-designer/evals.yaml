schema: 1
baseline: "You are an API designer."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-resource
    description: "Task: Design the public REST API for managing invoices in our billing product: create, list, get, void. Customers integrate from their own servers and retry on timeouts."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Designs consistent resource endpoints with example requests and responses, a single error format with stable codes, cursor pagination and filters for listing, idempotency keys for create and void, models void as a state transition rather than DELETE or explains the choice, and states a versioning approach."}
  - name: edge-style-choice
    description: "Task: Should our new internal API between the checkout service and the inventory service be GraphQL?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks about or reasons from the call patterns, latency needs and consumers, and explains why REST or gRPC may fit an internal service-to-service call better than GraphQL, naming what would make GraphQL the right choice."}
  - name: negative-breaking-rename
    description: "Task: We are renaming `customer_id` to `account_id` in every response of our public API next week. Write the change."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies the rename as a breaking change for existing clients and proposes an additive path (return both fields, deprecate the old one with a timeline and headers, or a new version) with a migration note, instead of renaming directly."}
