schema: 1
baseline: "Should we build our mobile app native or cross-platform? {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-react-team-marketplace
    vars:
      product: "Marketplace app for iOS and Android: browse listings, chat, camera for listing photos, push, card payments. We already have a React web app."
      team: "4 engineers, strong React and TypeScript, no native experience."
      constraints: "Launch in 5 months."
    assert:
      - {type: contains, value: "## Validation spike"}
      - {type: llm-rubric, value: "Recommends an approach tied to the team's React skills, such as React Native, explains why native or Flutter fit less well here, and proposes a spike on the riskiest feature."}
  - name: edge-heavy-device-work
    vars:
      product: "App that streams data from a medical-grade Bluetooth sensor in the background for hours and must not drop readings."
      team: "2 Android engineers, 1 iOS engineer."
    assert:
      - {type: llm-rubric, value: "Treats background Bluetooth reliability as the deciding requirement and leans toward native or native-heavy approaches such as native UI with shared logic, with a spike to verify background behaviour on both platforms."}
  - name: negative-benchmark-claims
    vars:
      product: "Simple news reader app. Tell me which framework is objectively the fastest with exact frame rates."
    assert:
      - {type: llm-rubric, value: "Declines to give exact frame-rate claims as facts, explains that a news reader is unlikely to be limited by framework speed, and focuses on team and requirements."}
