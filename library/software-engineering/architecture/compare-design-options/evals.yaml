schema: 1
baseline: "Which option should we choose? {{problem}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-search-options
    vars:
      problem: "Users want full-text search over 2 million support tickets. Today we use LIKE queries in Postgres and they time out."
      options: "1) Postgres full-text search with GIN indexes 2) Elasticsearch cluster 3) A hosted search service"
      criteria: "Time to ship (we have 3 weeks), operational load on a 3-person team, relevance quality"
    assert:
      - {type: contains, value: "## Comparison"}
      - {type: llm-rubric, value: "Rates each option against the three given criteria with reasons tied to this problem, and recommends one option while naming its main cost."}
  - name: edge-no-options-given
    vars:
      problem: "Our nightly batch job that recalculates invoices now takes 7 hours and must finish in 4."
    assert:
      - {type: llm-rubric, value: "Proposes two or three realistic options, says that it derived the criteria itself, and considers improving the current job before replacing it."}
  - name: negative-no-false-precision
    vars:
      problem: "Choose between AWS Lambda and containers on ECS for a new internal API."
      constraints: "Must run inside our existing VPC."
    assert:
      - {type: not-regex, value: "(?i)total score|weighted score"}
      - {type: llm-rubric, value: "Does not present invented prices or benchmarks as facts; says what to check where a choice depends on cost or limits."}
