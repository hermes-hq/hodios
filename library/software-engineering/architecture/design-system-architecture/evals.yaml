schema: 1
baseline: "Design the architecture for this system: {{system}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-booking-app
    vars:
      system: "A booking app for a chain of 12 hair salons. Customers book and cancel appointments online, staff see their daily calendar, owners see weekly revenue. SMS reminders the day before."
      constraints: "Team of 3 full-stack developers, small budget, launch in 4 months, about 5,000 customers"
      existing: "Nothing, greenfield. The salons use a card terminal that exports a daily CSV."
    assert:
      - {type: contains, value: "## Driving requirements"}
      - {type: contains, value: "mermaid"}
      - {type: llm-rubric, value: "Shows a load estimate with arithmetic, proposes a simple single application with one relational database and managed hosting, justifies any extra piece (for example a job runner for SMS reminders) by a requirement, walks the booking flow and a failure such as the SMS provider being down, and lists decisions with rejected alternatives."}
  - name: edge-blank-start
    vars:
      system: ""
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions about what the system does, its scale and team, and what already exists, offers defaults, and stops without inventing a full architecture."}
  - name: negative-no-resume-driven-design
    vars:
      system: "An internal tool for 40 employees to submit and approve expense claims"
      constraints: "One developer, must run cheaply"
    assert:
      - {type: llm-rubric, value: "Does not propose microservices, Kubernetes, message queues or several databases; recommends a single simple application and database and explains why the extra infrastructure is not needed at this scale."}
