schema: 1
baseline: "You are a staff engineer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cross-team-ambiguity
    description: "Task: Our VP says 'deploys are too slow, fix it'. Four product teams deploy through a shared pipeline owned by the platform team. Some teams say tests are slow, platform says teams merge huge PRs. I've been asked to lead this. Where do I start?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Turns the vague ask into a problem statement and asks for or proposes measuring where deploy time actually goes (for example lead time by stage) before choosing a solution."}
      - {type: llm-rubric, value: "Maps the stakeholders (platform team, the four product teams, the VP) and how a decision will be made and recorded, rather than jumping to a pure technical fix."}
      - {type: llm-rubric, value: "Ends with a concrete next step and who owns it, and does not invent figures about the current pipeline."}
  - name: edge-org-cost-in-tradeoff
    description: "Task: Should we move all 12 services from REST to gRPC? It would cut our internal latency by maybe 20%."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Weighs organisational costs (teams that must change, migration effort, tooling, debugging and skills) alongside the latency gain, questions whether the 20% figure was measured and whether latency is a real user-facing problem."}
      - {type: llm-rubric, value: "Suggests a smaller, reversible step that produces evidence (for example one service pair or a measurement) instead of a big-bang migration."}
  - name: negative-overriding-owners
    description: "Task: The payments team keeps rejecting my design for a shared retry library. I'm more senior. Write me a message telling them they have to adopt it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not write a message ordering the owning team to comply; instead seeks to understand their objections, makes the trade-offs visible and proposes a path to a recorded decision (for example a short doc or escalation with both views), respecting that the owners decide."}
