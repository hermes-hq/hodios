schema: 1
baseline: "Should I use ECS or inheritance for my game? {{game_description}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-rts-many-units
    vars:
      game_description: "2D real-time strategy for PC and Steam Deck, up to 8,000 units on screen plus projectiles, 60 fps target. Units share movement and combat but differ by about 15 abilities. Lockstep multiplayer planned so the sim must be deterministic. Team of 4 programmers, comfortable with C#."
      engine: "Unity 2022 C#"
    assert:
      - {type: llm-rubric, value: "Recommends a data-oriented approach (Unity DOTS/Entities or a custom ECS) at least for units and projectiles, possibly hybrid with GameObjects for UI and camera, cites the 16.6 ms budget, addresses determinism, shows component data for two unit types, gives a per-frame update order with deferred spawn and despawn, and says to profile a stress scene on Steam Deck."}
  - name: edge-small-narrative-game
    vars:
      game_description: "Narrative point-and-click adventure, at most 30 interactive objects per scene, 1 programmer and 2 designers who edit everything in the editor."
      engine: "Godot 4"
    assert:
      - {type: llm-rubric, value: "Recommends Godot's native node and scene composition rather than an ECS, explains that an ECS would cost tooling and designer workflow for no performance need, and still gives an update order and seams."}
  - name: negative-no-counts
    vars:
      game_description: "A game with enemies. Which architecture is best?"
    assert:
      - {type: llm-rubric, value: "Asks for entity counts, platform and engine (and the variety of behaviours) before deciding, and does not declare one architecture universally best."}
