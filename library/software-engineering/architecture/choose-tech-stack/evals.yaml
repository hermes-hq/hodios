schema: 1
baseline: "What tech stack should I use for {{product}}?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-mvp
    vars:
      product: "B2B scheduling SaaS for clinics: web app, calendar sync, SMS reminders, maybe a mobile app next year. 50 clinics in year one."
      team: "Two founders: one strong in Python and Django, one frontend dev with React."
      constraints: "EU customers, launch in 4 months."
    assert:
      - {type: contains, value: "## Alternatives considered"}
      - {type: llm-rubric, value: "Builds on the team's Python and React skills with a relational database and managed hosting, as a single deployable app, and buys SMS rather than building it."}
      - {type: llm-rubric, value: "Addresses EU data location as a hosting constraint and lists choices to avoid such as microservices or Kubernetes at this stage."}
  - name: edge-unknown-team
    vars:
      product: "A marketplace for second-hand bikes."
      team: "Not hired yet."
    assert:
      - {type: llm-rubric, value: "Explains that the hiring market and future team skills drive the choice, recommends mainstream options with a large hiring pool, and states the assumption or asks about the founders' skills."}
  - name: negative-hype-stack
    vars:
      product: "Simple internal expense approval tool for 30 employees."
      team: "One developer who knows PHP and Laravel."
      constraints: "We want Rust microservices on Kubernetes with an event store because it is modern."
    assert:
      - {type: llm-rubric, value: "Pushes back on Rust microservices, Kubernetes and event sourcing for this tool and recommends building on the developer's Laravel skills, or even buying an existing tool."}
