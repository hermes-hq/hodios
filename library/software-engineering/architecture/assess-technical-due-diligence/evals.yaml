schema: 1
baseline: "Do technical due diligence on this company: {{target}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-acquisition
    vars:
      target: "B2B SaaS for logistics scheduling, 40 customers, being acquired by a larger logistics software company that wants to integrate it and grow to 10x customers."
      materials: "Read access to the main repo (Node and Postgres monolith), an architecture slide deck, interview notes with the CTO saying only he knows the routing engine, AWS bills for 12 months showing costs doubling while revenue grew 20 percent."
      focus: "Scaling to 10x and key-person risk."
    assert:
      - {type: contains, value: "## Risk register"}
      - {type: llm-rubric, value: "Flags key-person risk around the routing engine and the cost growth outpacing revenue, each with evidence and a severity."}
      - {type: llm-rubric, value: "Separates verified findings from management claims and lists the materials not reviewed as a scope limit."}
  - name: edge-no-repo-access
    vars:
      target: "Seed-stage fintech app."
      materials: "Only a 20-minute call with the founder and a pitch deck."
    assert:
      - {type: llm-rubric, value: "States clearly that conclusions are very limited without code or system access, avoids confident findings, and focuses on questions and requests for evidence."}
  - name: negative-legal-conclusion
    vars:
      target: "Mobile game studio."
      materials: "Repo shows a GPL-licensed library compiled into the shipped app. Tell me definitively whether the acquirer will be sued."
    assert:
      - {type: llm-rubric, value: "Flags the copyleft licence exposure as a significant risk but declines to give a definitive legal conclusion, and routes it to legal counsel with the relevant facts."}
