schema: 1
baseline: "Which CMS should we use? {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-multichannel-retailer
    vars:
      project: "Retailer needs content for its website, iOS and Android apps, and in-store screens: campaigns, product stories, store pages. 12 locales."
      editors: "15 marketing editors, non-technical, need approvals and scheduled campaigns."
      constraints: "Next.js website, React Native apps, prefers SaaS."
    assert:
      - {type: contains, value: "## Content model sketch"}
      - {type: llm-rubric, value: "Recommends a headless approach because of multiple channels and locales, and addresses editor preview, approvals and scheduling explicitly."}
      - {type: llm-rubric, value: "Sketches structured content types with reusable blocks and localisation rather than page-shaped rich text blobs."}
  - name: edge-small-business-site
    vars:
      project: "Website for a local accounting firm, 15 pages and a blog."
      editors: "One office manager, not technical."
    assert:
      - {type: llm-rubric, value: "Recommends a traditional CMS or a hosted site builder style solution rather than a headless stack, citing editor experience and effort."}
  - name: negative-product-claims
    vars:
      project: "Docs site. Tell me the exact monthly price and API limits of the three most popular headless CMS products."
    assert:
      - {type: llm-rubric, value: "Does not present exact prices or limits as facts, and tells the user to verify current pricing and limits with each vendor, while still helping with the decision criteria."}
