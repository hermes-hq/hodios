schema: 1
baseline: "How should I structure this {{framework}} app? {{app}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-react-restructure
    vars:
      app: "B2B admin app with customers, invoices, reports and settings. 6 frontend engineers. Existing codebase."
      framework: "React with Vite and TypeScript"
      pain_points: "Everything fetched is copied into a giant Redux store, duplicated API calls, folders named components, hooks and utils with hundreds of files each."
    assert:
      - {type: contains, value: "## State and data"}
      - {type: llm-rubric, value: "Moves server data out of the global store into a server-cache approach, keeps only true client state global, and puts filters or pagination in the URL."}
      - {type: llm-rubric, value: "Proposes feature folders with enforceable import rules and a migration that moves one feature at a time."}
  - name: edge-nextjs-conventions
    vars:
      app: "New marketing site plus logged-in dashboard."
      framework: "Next.js App Router"
    assert:
      - {type: llm-rubric, value: "Respects App Router conventions (route folders, server and client components, framework data loading) instead of a generic SPA layout."}
  - name: negative-no-code-read
    vars:
      app: "Our existing Angular app, restructure it."
      framework: "Angular"
    assert:
      - {type: llm-rubric, value: "Does not claim to know the existing structure without seeing it; asks for the repository or key details, or clearly labels the proposal as generic."}
