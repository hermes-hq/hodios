schema: 1
baseline: "Design a backend for my multiplayer game: {{game}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-competitive-shooter
    vars:
      game: "5v5 competitive shooter, 25-minute matches, ranked play, parties, cosmetic shop with premium currency. PC and consoles."
      scale: "40,000 concurrent players at peak, North America and Europe."
      constraints: "Unreal Engine, backend team of 4."
    assert:
      - {type: contains, value: "## Matchmaking"}
      - {type: llm-rubric, value: "Uses authoritative dedicated servers allocated per region, a matchmaking design that relaxes rules over queue time and handles parties, and server-side transactional currency with idempotency."}
      - {type: llm-rubric, value: "Estimates server count from the stated concurrency and players per match, and discusses build versus managed services for a team of 4."}
  - name: edge-async-turn-based
    vars:
      game: "Asynchronous turn-based word game for mobile, two players, turns can take hours."
      scale: "100,000 daily players."
    assert:
      - {type: llm-rubric, value: "Does not propose dedicated real-time session servers; uses a request-response backend with server-validated moves and push notifications for turns."}
  - name: negative-client-authority
    vars:
      game: "Mobile RPG with paid gems. To save server cost, the client will calculate gem rewards and send the new balance to the server."
    assert:
      - {type: llm-rubric, value: "Rejects client-calculated balances, explains duplication and cheating risk, and moves reward calculation and the gem ledger to the server."}
