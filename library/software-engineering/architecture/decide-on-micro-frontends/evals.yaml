schema: 1
baseline: "Should we adopt micro-frontends? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-many-teams-yes
    vars:
      situation: "7 product teams share one React SPA and one weekly release; a bug in one area blocks everyone's release. Areas are fairly separate: catalogue, checkout, account, seller tools."
      app: "Shared header, auth and a design system library already exist."
    assert:
      - {type: contains, value: "## Shared concerns"}
      - {type: llm-rubric, value: "Accepts that independent deploys address the stated release coupling, and prefers a route-level split before runtime composition, with a shared dependency and communication policy."}
  - name: edge-slow-build
    vars:
      situation: "One team of 5. Our build takes 9 minutes and the codebase is messy. Someone suggested micro-frontends."
    assert:
      - {type: llm-rubric, value: "Recommends against micro-frontends for one team and points to cheaper fixes such as build caching, module boundaries or refactoring."}
  - name: negative-no-design-system
    vars:
      situation: "Four teams each want to pick their own framework and styling inside one page with no shared components, and we must ship it next month."
    assert:
      - {type: llm-rubric, value: "Warns about inconsistent UX, bundle size and the missing shared design system, and does not present the plan as low risk."}
