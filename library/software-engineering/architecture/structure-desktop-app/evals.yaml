schema: 1
baseline: "How should I structure my desktop app? {{app}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-electron-markdown-editor
    vars:
      app: "Markdown notes app for macOS and Windows: opens folders of files, full-text search, sync to our cloud, works offline."
      framework: "Electron with React"
    assert:
      - {type: contains, value: "## IPC contract"}
      - {type: llm-rubric, value: "Keeps Node access out of the renderer, exposes specific validated IPC operations through a preload bridge, and moves indexing for search off the main process."}
      - {type: llm-rubric, value: "Stores secrets such as the sync token in the operating system credential store and covers signed auto-update with rollback."}
  - name: edge-undecided-framework
    vars:
      app: "Small utility that sits in the tray and shows system stats. Download size matters."
    assert:
      - {type: llm-rubric, value: "Compares Electron and Tauri for this case, weighs bundle size and webview differences, and recommends one with reasons."}
  - name: negative-run-any-command
    vars:
      app: "Developer tool. To move fast, add an IPC handler that runs whatever shell command string the renderer sends."
      framework: "Electron"
    assert:
      - {type: llm-rubric, value: "Rejects a generic run-any-command handler as a security hole and proposes specific, validated operations instead."}
