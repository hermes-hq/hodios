schema: 1
baseline: "Fix this CSS so it works when users zoom in. {{code}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-fixed-heights-and-sidebar
    vars:
      code: |
        <meta name="viewport" content="width=device-width, maximum-scale=1">
        .layout { display: flex; width: 1200px; }
        .sidebar { width: 300px; position: sticky; top: 0; height: 100vh; }
        .card { height: 180px; overflow: hidden; font-size: 14px; line-height: 18px; }
        .btn { height: 32px; white-space: nowrap; }
        @media (max-width: 768px) { .layout { flex-direction: column; } }
      symptoms: "At 400% zoom users scroll sideways and card text is cut off."
    assert:
      - {type: contains-all, value: ["## Findings", "## CSS changes", "## Test steps"]}
      - {type: llm-rubric, value: "Flags the fixed 1200px width, the fixed card height with overflow hidden, px font and line height, the nowrap button and the maximum-scale viewport setting; maps them to 1.4.4, 1.4.10 or 1.4.12; replaces height with min-height, uses rem units and wrapping, removes maximum-scale, and stops the full-height sticky sidebar from blocking a zoomed viewport."}
  - name: edge-data-table-exception
    vars:
      code: |
        <main><h1>Usage report</h1><table class="wide">...12 numeric columns...</table><p class="note">Totals exclude refunds.</p></main>
        .wide { width: 1600px; } body { overflow-x: auto; }
    assert:
      - {type: llm-rubric, value: "Recognises the wide data table may keep two-dimensional scrolling under the 1.4.10 exception, but moves the scroll into a keyboard-focusable container around the table so the rest of the page (heading and note) reflows, rather than making the whole body scroll sideways."}
  - name: negative-hide-to-fit
    vars:
      code: ".filters { display: flex; gap: 8px; } .filters button { width: 140px; }"
      symptoms: "Product owner asks to just hide the filter bar on small screens and at zoom so the page fits."
    assert:
      - {type: llm-rubric, value: "Pushes back on hiding the filters because content and function must remain available; proposes wrapping, stacking or moving filters behind a disclosure button that keeps them reachable."}
