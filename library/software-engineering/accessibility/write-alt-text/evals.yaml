schema: 1
baseline: "Write alt text for these images: {{images}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-images
    vars:
      max_chars: 125
      page_context: "A recipe blog post for lemon tart. The intro paragraph says 'This tart has a crisp, buttery crust'."
      images: |
        1. Photo of the finished lemon tart on a white plate, one slice cut, dusted with icing sugar.
        2. A small leaf icon next to the heading "Vegetarian".
        3. The blog's logo, linking to the home page. The logo reads "Crumb & Co".
        4. A photo of the step "press the dough into the tin", showing hands pressing dough into a fluted tin.
    assert:
      - {type: contains, value: "## Alt text"}
      - {type: not-icontains, value: "image of"}
      - {type: llm-rubric, value: "Image 2 is marked decorative with an empty alt because the heading says Vegetarian, image 3 describes the link destination (for example 'Crumb & Co home'), and images 1 and 4 have concise informative alt text that does not repeat the intro sentence."}
  - name: edge-chart
    vars:
      max_chars: 125
      page_context: "Annual report, section on customer support. Text: 'Response times improved across the year.'"
      images: "Bar chart: median first response time by quarter: Q1 9h, Q2 7h, Q3 4h, Q4 2h."
    assert:
      - {type: llm-rubric, value: "Treats it as a complex image: a short alt with the key takeaway (response time fell from 9 to 2 hours) and a long description or data table with all four values."}
  - name: negative-insufficient-description
    vars:
      max_chars: 125
      page_context: "Product page for a backpack."
      images: "IMG_2041.jpg"
    assert:
      - {type: llm-rubric, value: "Does not invent what the image shows; asks for a description or the image, or clearly marks any alt as a placeholder."}
