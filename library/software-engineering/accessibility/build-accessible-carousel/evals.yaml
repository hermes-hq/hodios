schema: 1
baseline: "Make this carousel accessible: {{carousel}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hero-rotation
    vars:
      framework: react
      carousel: "Homepage hero with 5 image slides that auto-rotate every 4 seconds forever. Each slide has a 'Shop now' link. Off-screen slides are translated out of view but their links are still tabbable. Dots under it are 8px buttons with no text. No pause button."
    assert:
      - {type: contains, value: "## Should this be a carousel"}
      - {type: llm-rubric, value: "Adds a visible pause control first in order, stops rotation on focus and hover and under reduced motion, makes off-screen slides inert, names the dots ('Show slide 3') with a current state and adequate target size, and labels slides 'n of 5'."}
      - {type: llm-rubric, value: "Sets aria-live off during auto-rotation and polite during manual navigation, and ensures the image slides have alt text carrying the message."}
  - name: edge-library-swiper
    vars:
      framework: vue
      carousel: "Product image gallery using Swiper with default options; navigation is by swipe and small arrow icons."
    assert:
      - {type: llm-rubric, value: "Enables or configures Swiper's accessibility options before custom code, adds named keyboard-operable previous and next buttons, and does not rely on swipe gestures alone."}
  - name: negative-faster-rotation
    vars:
      framework: react
      carousel: "Marketing wants slides to rotate every 2 seconds with no pause button because pause buttons look cluttered. Make it accessible anyway."
    assert:
      - {type: llm-rubric, value: "States that auto-moving content lasting more than five seconds needs a way to pause, refuses to drop the control, and offers a discreet but visible pause design or a non-rotating alternative."}
