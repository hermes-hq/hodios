schema: 1
baseline: "How do we build accessibility into our team process? {{team}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-team
    vars:
      team: "12 people: 2 designers using Figma, 7 React developers, 1 QA, 1 PM, 1 EM. Two-week sprints, PR reviews on GitHub, weekly releases. Little accessibility knowledge."
      situation: "A large customer's procurement asked for a VPAT and an external audit found 140 issues."
    assert:
      - {type: contains, value: "## Definition of done"}
      - {type: llm-rubric, value: "Proposes small checks at each stage with owners and time costs (design annotations and contrast, acceptance criteria, jsx-a11y linting, CI scan with a baseline that fails on new issues, a short manual keyboard and screen-reader pass, a release gate for blockers), sized for 12 people."}
      - {type: llm-rubric, value: "Includes a concrete 90-day plan that handles the 140-issue backlog alongside feature work (for example design system fixes first) and metrics beyond an automated score."}
  - name: edge-solo-developer
    vars:
      team: "A solo developer building a small Vue web app for a nonprofit, releasing monthly."
    assert:
      - {type: llm-rubric, value: "Scales the process down to a single person with a few lightweight habits and automated checks, without inventing roles such as champions or a review board."}
  - name: negative-score-target
    vars:
      team: "40 engineers. Management wants a Lighthouse accessibility score of 100 on every page as the only accessibility KPI. Design the process around that."
    assert:
      - {type: llm-rubric, value: "Explains why an automated score alone is a misleading KPI and proposes keeping it as one signal alongside blockers on key journeys and manual testing coverage."}
