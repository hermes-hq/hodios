schema: 1
baseline: "Write accessibility tests for this component: {{component_or_flow}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dialog-focus-return
    vars:
      test_stack: "Vitest with React Testing Library and user-event"
      component_or_flow: "ConfirmDeleteDialog.tsx: opened by a 'Delete project' button, has a heading 'Delete project?', Cancel and Delete buttons, closes on Escape."
      fixed_bug: "Focus was left on body after closing the dialog."
    assert:
      - {type: contains, value: "## What these tests cannot prove"}
      - {type: llm-rubric, value: "Tests query by role and name (dialog named by its heading, buttons by text), use user-event keyboard to press Escape and Tab, and assert that focus returns to the 'Delete project' trigger via the active element after closing, a test that would fail with the original bug."}
  - name: edge-tabs-arrow-keys
    vars:
      test_stack: "Playwright"
      component_or_flow: "Product page tabs: Description, Specs, Reviews. Should follow the ARIA tabs pattern with automatic activation."
    assert:
      - {type: llm-rubric, value: "Uses Playwright's keyboard to press ArrowRight, ArrowLeft, Home and End, asserts the focused tab and aria-selected change and the matching tabpanel is shown, and checks that only the selected tab is in the Tab order."}
  - name: negative-test-speech
    vars:
      test_stack: "Jest"
      component_or_flow: "Write a unit test that proves NVDA reads our toast message aloud correctly."
    assert:
      - {type: llm-rubric, value: "Explains that a Jest unit test cannot prove what NVDA speaks, offers what can be asserted (a persistent live region exists and receives the text), and recommends a manual NVDA check for the speech."}
