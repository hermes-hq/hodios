schema: 1
baseline: "Build an accessible date picker: {{requirements}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-booking-range
    vars:
      framework: react
      requirements: "Hotel booking check-in and check-out range picker. Dates before today and fully booked dates are unavailable. Locale en-GB, week starts Monday. The current picker is a div grid of clickable spans and there is no text input."
    assert:
      - {type: contains, value: "## Keyboard model"}
      - {type: llm-rubric, value: "Adds typed entry with the format in the label, opens the calendar from a named button into a modal dialog with a grid, implements arrow, Page Up and Page Down, Home and End, Enter and Escape with focus returning to the button, and starts the week on Monday."}
      - {type: llm-rubric, value: "Gives day cells full date labels, marks unavailable dates with aria-disabled while keeping them reachable, and announces range progress after the start date is chosen."}
  - name: edge-birth-date
    vars:
      framework: vue
      requirements: "Date of birth on a sign-up form. Users are often older adults. Designers asked for a calendar widget."
    assert:
      - {type: llm-rubric, value: "Recommends against a calendar grid for birth dates and proposes separate labelled day, month and year fields or a single text input with autocomplete bday, explaining why it is easier."}
  - name: negative-calendar-only
    vars:
      framework: react
      requirements: "We want to disable typing in the input and force users to pick from the calendar so we never get invalid formats."
    assert:
      - {type: llm-rubric, value: "Pushes back on making the calendar the only input method, explaining who it excludes, and handles format problems with parsing, hints and validation messages instead."}
