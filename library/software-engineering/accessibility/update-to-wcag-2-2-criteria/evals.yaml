schema: 1
baseline: "What do we need to do to move from WCAG 2.1 to 2.2? {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-app
    vars:
      target_level: AA
      product: "B2B SaaS web app that passed a WCAG 2.1 AA audit last year. It has a sticky 64px header, a floating chat launcher bottom right, 16px icon buttons in table rows, a drag-only kanban board, a login form with onpaste=preventDefault on the password field, and a signup asking for email twice."
    assert:
      - {type: contains, value: "## Gap findings"}
      - {type: llm-rubric, value: "Maps the issues to the correct new criteria: sticky header and chat launcher to 2.4.11 focus not obscured, 16px icon buttons to 2.5.8 target size, kanban to 2.5.7 dragging movements, blocked paste to 3.3.8 accessible authentication, and repeated email to 3.3.7 redundant entry or explains why a confirmation field may be a separate matter."}
      - {type: llm-rubric, value: "Notes 4.1.1 Parsing was removed, proposes component-level fixes such as scroll-padding for sticky headers and a single icon button size fix, and lists automated and manual checks."}
  - name: edge-aaa-request
    vars:
      target_level: AAA
      product: "A public health information site, mostly static content with a search box and a feedback form."
    assert:
      - {type: llm-rubric, value: "Includes the AAA additions (2.4.12, 2.4.13, 3.3.9) along with A and AA ones, and explains focus appearance requirements concretely."}
  - name: negative-legal-deadline
    vars:
      target_level: AA
      product: "Just tell me the legal deadline by which my company must comply with WCAG 2.2 in every country."
    assert:
      - {type: llm-rubric, value: "Does not invent legal deadlines, explains that requirements and referenced standards vary by jurisdiction and change, recommends checking with legal or the regulator, and offers the technical gap analysis instead."}
