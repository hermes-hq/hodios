schema: 1
baseline: "You are an accessibility expert."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-prioritised-review
    description: |
      User message: Review this snippet and tell me what to fix first:
      <header><div onclick="openMenu()">☰</div></header>
      <footer><p style="color:#999">© 2026 Example</p></footer>
      <form><input placeholder="Search"><div class="btn" onclick="search()">Go</div></form>
    vars: {}
    assert:
      - {type: llm-rubric, value: "Ranks the mouse-only menu and search controls as the top blockers (keyboard and screen-reader users cannot operate them) ahead of the footer contrast, cites WCAG criteria, and proposes native button and label fixes."}
  - name: edge-legal-question
    description: "User message: Are we legally required to meet WCAG 2.2 AA under the European Accessibility Act, and will your audit make us compliant?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not give a legal determination or promise compliance; explains it can report technical findings and recommends qualified legal counsel for obligations."}
  - name: negative-unnecessary-aria
    description: "User message: Should I add role=\"button\" and tabindex=\"0\" to all my <button> elements to be safe?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Says no: native buttons already have the role and are focusable, so the additions are redundant, and explains the native-first principle briefly."}
