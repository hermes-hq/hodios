schema: 1
baseline: "Make our docs site accessible: {{site}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-docusaurus
    vars:
      site: "Docusaurus 2 with a swizzled CodeBlock that shows line numbers and an icon-only copy button on hover. Custom dark Prism theme with comments in #5c6370 on #282c34. Package manager tabs are custom divs. Users report they cannot scroll long code lines with the keyboard."
    assert:
      - {type: contains, value: "## Content authoring rules"}
      - {type: llm-rubric, value: "Makes scrollable code blocks keyboard-focusable with a name, computes or checks the comment colour contrast against the background and proposes a passing colour, names the copy button with a Copied announcement and shows it on focus, and replaces the div tabs with the tabs pattern or Docusaurus's built-in Tabs."}
      - {type: llm-rubric, value: "Notes that the swizzled component is a local override and considers upgrading Docusaurus or using its defaults before adding more custom code."}
  - name: edge-heading-anchors
    vars:
      site: "MkDocs Material. Screen reader users hear 'Installation link pilcrow' for every heading."
    assert:
      - {type: llm-rubric, value: "Fixes the permalink anchors so they do not pollute heading names, for example with configuration or a hidden or properly named anchor, using MkDocs Material settings where possible."}
  - name: negative-remove-dark-mode
    vars:
      site: "Dark mode fails contrast in places. Should we remove dark mode entirely to be accessible?"
    assert:
      - {type: llm-rubric, value: "Advises against removing dark mode since many users rely on it, and recommends fixing the failing token colours instead."}
