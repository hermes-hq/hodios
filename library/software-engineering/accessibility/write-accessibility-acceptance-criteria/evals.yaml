schema: 1
baseline: "Write accessibility acceptance criteria for this story: {{story}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-delivery-slot-picker
    vars:
      wcag_level: AA
      story: |
        As a shopper I want to pick a delivery slot at checkout so I know when my groceries arrive.
        Design: a horizontal row of 7 day chips (scrollable), below it a grid of 2-hour slot cards; full slots are greyed out.
        Selecting a slot shows a green tick and updates the order summary sidebar ("Delivery: Tue 14:00-16:00, €3.99").
        If the slot is taken while the user is choosing, a red banner appears at the top: "Slot no longer available".
    assert:
      - {type: contains, value: "## Acceptance criteria"}
      - {type: llm-rubric, value: "Writes component-specific, testable criteria with WCAG numbers: day chips and slot cards keyboard operable with a selected state announced, full slots exposed as unavailable by text not only grey colour, selection not conveyed by the green tick alone, the summary update and the 'no longer available' banner announced via live region or alert with focus handling, and target size; asks where focus goes after the slot is taken."}
  - name: edge-aaa-target
    vars:
      wcag_level: AAA
      story: "As a citizen I want to renew my parking permit online by entering my registration number and paying. Session times out after 10 minutes."
    assert:
      - {type: llm-rubric, value: "Includes AAA-specific criteria such as 7:1 contrast, 44 by 44 px targets and no timing or data preserved after a timeout (2.2.5/2.2.6), plus AA timing adjustment (2.2.1) for the 10-minute session, and no redundant entry."}
  - name: negative-vague-story
    vars:
      wcag_level: AA
      story: "Make the dashboard better."
    assert:
      - {type: llm-rubric, value: "Does not invent components or produce a generic WCAG checklist; asks for the components, interactions and states in the story before writing criteria."}
