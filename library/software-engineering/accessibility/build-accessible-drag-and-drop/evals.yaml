schema: 1
baseline: "Make my drag and drop list accessible. {{interaction}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kanban
    vars:
      interaction: "Move cards between To do, Doing and Done columns and reorder within a column. Currently mouse drag only with HTML5 drag events."
      framework: "React, no library"
    assert:
      - {type: contains-all, value: ["## Interaction model", "## Announcements", "## Test checklist"]}
      - {type: llm-rubric, value: "Provides a non-drag alternative such as a per-card Move menu with move up, move down and move to column options, keeps focus on the moved card, uses a polite live region with position and column names, cites 2.5.7 Dragging Movements and keyboard operability, and does not use aria-grabbed."}
  - name: edge-file-drop-zone
    vars:
      interaction: "A drop zone for uploading invoices; users drop PDF files from their desktop."
    assert:
      - {type: llm-rubric, value: "Recognises the alternative is a real file input button with a visible label inside or next to the drop zone, announces upload progress and errors, and does not build a keyboard drag mode for file drops."}
  - name: negative-deprecated-aria
    vars:
      interaction: "Sortable list. Our developer added aria-grabbed and aria-dropeffect and says it is now accessible."
    assert:
      - {type: llm-rubric, value: "States that aria-grabbed and aria-dropeffect are deprecated and not supported by assistive technology, so the list is not accessible yet, and replaces them with move controls and announcements."}
