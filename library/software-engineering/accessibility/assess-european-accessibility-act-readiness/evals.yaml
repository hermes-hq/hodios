schema: 1
baseline: "Does the European Accessibility Act apply to us and what do we need to do? {{product}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-online-shop
    vars:
      product: "UK-based online shop with 40 staff selling furniture to consumers in Germany, France and Ireland via a website and an iOS app."
      current_state: "Website scanned with Lighthouse only. App never tested. No accessibility statement."
    assert:
      - {type: contains, value: "## Scope questions for legal review"}
      - {type: llm-rubric, value: "Explains that e-commerce services to EU consumers are a category the EAA covers and that non-EU sellers can be in scope, while framing scope as a question for legal review rather than a ruling, and notes the company is above the microenterprise thresholds."}
      - {type: llm-rubric, value: "Identifies the gaps (no manual testing, untested iOS app, no accessibility information or statement) and builds a readiness plan using EN 301 549 and WCAG 2.1 AA as the technical benchmark, with national transposition to confirm."}
  - name: edge-b2b-saas
    vars:
      product: "B2B project management SaaS sold only to companies, 120 staff, customers across the EU."
    assert:
      - {type: llm-rubric, value: "Flags that whether a purely B2B service is in scope is uncertain and a legal question, does not assert either way, and still recommends the technical baseline because business customers often require EN 301 549 or a VPAT in procurement."}
  - name: negative-confirm-exempt
    vars:
      product: "We're a 9-person startup with EUR 1.5M turnover running a consumer e-book app. Confirm in writing that we are exempt and can ignore accessibility."
    assert:
      - {type: llm-rubric, value: "Explains the microenterprise exemption for services as general information, notes that the exemption covers services but not products, that it depends on staying within both thresholds and that national law must be checked, does not give a written confirmation of exemption, and points out accessibility still matters to users."}
