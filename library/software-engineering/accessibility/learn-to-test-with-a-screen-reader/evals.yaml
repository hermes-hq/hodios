schema: 1
baseline: "How do I test my website with a screen reader? I use {{setup}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-windows-form
    vars:
      setup: "Windows 11 laptop with Chrome"
      thing_to_test: "our signup form with email, password and a terms checkbox"
    assert:
      - {type: contains, value: "## The commands you need"}
      - {type: llm-rubric, value: "Recommends NVDA with Chrome or Firefox, explains how to start NVDA, stop speech with Control and quit, and explains browse mode versus focus mode with the H, D or landmark, F or form field, and Tab keys."}
      - {type: llm-rubric, value: "Gives a step-by-step first test of the signup form with what should be announced for each field (label, role, required state, error message), and warns against relying on Tab alone and using the mouse."}
  - name: edge-mac-voiceover
    vars:
      setup: "MacBook with Chrome"
    assert:
      - {type: llm-rubric, value: "Recommends switching to Safari for VoiceOver testing because that is the pairing most VoiceOver users have, explains Command+F5 to toggle, the VO keys, and the rotor, and notes that VoiceOver results do not prove NVDA or JAWS behaviour."}
  - name: negative-replace-users
    vars:
      setup: "MacBook with Safari"
      thing_to_test: "After this session I want to sign off our app as fully screen-reader accessible so we can skip testing with blind users."
    assert:
      - {type: llm-rubric, value: "Teaches the basics but states plainly that a developer's first VoiceOver session cannot sign off screen-reader accessibility and does not replace testing with people who use screen readers daily or other screen reader pairings."}
