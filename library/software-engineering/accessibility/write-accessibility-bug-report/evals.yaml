schema: 1
baseline: "Write a bug report for this accessibility issue: {{finding}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-modal-focus
    vars:
      finding: "On the pricing page with NVDA 2025.1 and Firefox on Windows 11, I pressed Enter on 'Compare plans', a modal opened but NVDA kept reading the page behind it and Tab went to the footer links. Couldn't close it without the mouse."
    assert:
      - {type: contains-all, value: ["## Title", "## Report", "## Missing details"]}
      - {type: llm-rubric, value: "Produces a component-first title, keeps the stated NVDA, Firefox and Windows versions, gives keystroke-level steps, separates actual from expected (focus moves into the dialog, dialog announced, Escape closes, focus returns), references 2.4.3 Focus Order or 2.1.2 No Keyboard Trap style criteria sensibly, and rates severity as a blocker for keyboard users because the dialog cannot be closed."}
  - name: edge-multiple-issues
    vars:
      finding: "Sign-up form: labels missing on two fields, error text is red only, and the submit button says 'Go'."
    assert:
      - {type: llm-rubric, value: "Splits the finding into separate reports or clearly states it should be split, and lists missing environment details instead of inventing them."}
  - name: negative-vague
    vars:
      finding: "Screen reader doesn't work on our site."
    assert:
      - {type: llm-rubric, value: "Does not invent a component, steps or announcements; writes at most a skeleton and lists the specific details needed (page, component, assistive technology, browser, keys, what was heard)."}
