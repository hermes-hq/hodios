schema: 1
baseline: "Build an accessible slider: {{slider}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-price-range
    vars:
      framework: react
      slider: "Price range filter £0 to £2,000, step £10, two thumbs implemented as divs that only respond to mouse drag. Results refetch on every mousemove."
    assert:
      - {type: contains, value: "## Keyboard model"}
      - {type: llm-rubric, value: "Gives each thumb its own slider semantics and name ('Minimum price', 'Maximum price'), aria-valuetext with currency, full keyboard support including Page Up/Down and Home/End, and thumbs that constrain each other."}
      - {type: llm-rubric, value: "Adds synced labelled number inputs or track clicking as a non-drag alternative and debounces the refetch until the user pauses or releases."}
  - name: edge-rating
    vars:
      framework: svelte
      slider: "A 1 to 5 star satisfaction rating built as a slider."
    assert:
      - {type: llm-rubric, value: "Considers that a radio group may suit a 1 to 5 rating better than a slider and explains the choice; if keeping a slider, uses value text such as '4 of 5 stars'."}
  - name: negative-drag-only
    vars:
      framework: react
      slider: "Our designer wants the slider to be drag-only with no inputs or keyboard so it feels tactile. How do we make that accessible?"
    assert:
      - {type: llm-rubric, value: "Explains that a drag-only slider cannot be made accessible, citing keyboard access and the dragging movements criterion, and offers a design that keeps the tactile feel while adding keyboard and single-pointer alternatives."}
