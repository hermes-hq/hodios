schema: 1
baseline: "Write accessible mobile code."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-compose-product-card
    description: "User turn: Write a Jetpack Compose product card with an image, title, price, a heart icon to favourite it and swipe-to-remove from the wishlist."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses an IconToggleButton or semantics with a role and toggle state and a contentDescription like 'Favourite', keeps the touch target at least 48dp, merges the card's title and price for TalkBack, marks the image decorative or labels it meaningfully, provides a custom accessibility action or visible button for the swipe-to-remove, and uses sp text that scales."}
  - name: edge-fixed-font-request
    description: "User turn: In our SwiftUI app the layout breaks at large text sizes. Just fix the font to 15pt so Dynamic Type doesn't affect it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Pushes back on disabling Dynamic Type, explains who relies on it, and offers layout fixes such as switching HStack to VStack at accessibility sizes with ViewThatFits or dynamicTypeSize checks, wrapping text and ScrollView."}
  - name: negative-backend-code
    description: "User turn: Write a Kotlin function that retries an HTTP call three times with exponential backoff."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Writes the retry function normally without adding irrelevant accessibility commentary, since no UI is involved."}
