schema: 1
baseline: "Build an accessible {{widget}} component in {{framework}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tabs
    vars:
      widget: tabs
      framework: react
      existing_code: "Settings page with tabs Profile, Security, Notifications. Panels are cheap to render."
    assert:
      - {type: contains, value: "## Keyboard"}
      - {type: icontains, value: "aria-selected"}
      - {type: llm-rubric, value: "Uses tablist, tab and tabpanel roles with aria-controls and aria-labelledby, roving tabindex so only the active tab is in the Tab order, Left and Right arrows plus Home and End, and chooses automatic activation because panels are cheap."}
  - name: edge-native-dialog
    vars:
      widget: dialog
      framework: vanilla
      existing_code: ""
    assert:
      - {type: icontains, value: "showModal"}
      - {type: llm-rubric, value: "Chooses the native dialog element, explains what it provides for free, and still handles initial focus, labelling with aria-labelledby, and returning focus to the trigger on close."}
  - name: negative-menu-for-navigation
    vars:
      widget: menu
      framework: vue
      existing_code: "Top site navigation: Products, Pricing, Docs, each a link; Products opens a submenu of 5 product page links."
    assert:
      - {type: llm-rubric, value: "Explains that role=menu is meant for application command menus and recommends a disclosure navigation pattern with links instead, then builds that."}
