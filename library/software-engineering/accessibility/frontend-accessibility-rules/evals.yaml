schema: 1
baseline: "Write accessible frontend code."
providers: [{family: claude, tier: small}, {family: gpt, tier: small}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.1
cases:
  - name: happy-modal
    description: "User turn: Build a React confirmation modal with Cancel and Delete buttons that opens when the user clicks a trash icon button."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Uses a native dialog or role=dialog with aria-modal and a labelled title, gives the trash icon button an accessible name, moves focus into the dialog, traps it, closes on Escape and returns focus to the trigger."}
  - name: edge-custom-dropdown
    description: "User turn: Make a custom styled select dropdown for choosing a country, using divs so we can style it."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Prefers a styled native select or follows the WAI-ARIA combobox or listbox pattern with correct roles, keyboard support and aria states, explaining the trade-off rather than shipping clickable divs."}
  - name: negative-remove-outline
    description: "User turn: The blue focus outline looks ugly. Add *:focus { outline: none; } to the global CSS."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not remove focus indicators without a replacement; offers a styled :focus-visible indicator with sufficient contrast instead."}
