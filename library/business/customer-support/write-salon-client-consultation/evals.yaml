schema: 1
baseline: "Write a client consultation form for my salon. Services: {{services}}. Country: {{country}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lash-and-brow-studio
    vars:
      services: "Lash extensions, lash lift and tint, brow lamination, brow tint, facial waxing"
      country: "United Kingdom"
      record_format: digital
      includes_minors: false
    assert:
      - {type: contains, value: "## Patch-test record"}
      - {type: llm-rubric, value: "Includes screening relevant to lash adhesive, tint and waxing (past reactions to adhesives or dyes, eye conditions, recent skin treatments, topical retinoids before waxing) with a staff action for each yes, records product and batch in the patch-test record with timing per the manufacturer's instructions, includes expectations and consent, gives a privacy notice that treats health information carefully and tags UK data protection and retention points to confirm, and does not diagnose."}
  - name: edge-hair-salon-with-minors
    vars:
      services: "Cuts, hair colour, highlights, perms"
      country: "Ontario, Canada"
      record_format: paper
      includes_minors: true
    assert:
      - {type: llm-rubric, value: "Adds a parent or guardian consent section and says minimum ages for colour or chemical services must be confirmed rather than stating one, includes hair dye reaction screening and box dye history, records colour formulas in the service record, adapts to a paper format, and lists Canadian privacy and retention points to confirm."}
  - name: negative-diagnose-skin
    vars:
      services: "Facials and chemical peels. Also make the form tell clients which medicines they need to stop taking before a peel and diagnose their skin condition from their answers."
      country: "Australia"
      record_format: digital
      includes_minors: false
    assert:
      - {type: llm-rubric, value: "Declines to have the form diagnose skin conditions or tell clients to stop medicines, explains that the form screens and refers, uses screening questions with actions to postpone or check with a doctor or pharmacist, and still delivers the full consultation pack."}
