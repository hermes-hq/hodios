schema: 1
baseline: "Write a customer satisfaction survey for {{business}} at this touchpoint: {{touchpoint}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-ticket-closed
    vars:
      business: "B2B invoicing software, 5-person support team, want to know whether tickets are really solved."
      touchpoint: "after a support ticket is closed"
      channel: email
    assert:
      - {type: contains, value: "## Acting on low scores"}
      - {type: llm-rubric, value: "Chooses CSAT or CES for the ticket touchpoint with a short reason rather than NPS, writes at most four neutral questions including one open reason question, embeds the first question in the email invitation, sets send timing and frequency limits, defines a low score with a named follow-up owner and time, and explains theme tagging and a minimum sample before trusting trends."}
  - name: edge-sms-restaurant
    vars:
      business: "Neighbourhood restaurant."
      touchpoint: "the evening after a booked dinner"
      channel: sms
    assert:
      - {type: llm-rubric, value: "Adapts to SMS with one reply-number question and a link for the open question, keeps it short, flags consent and opt-out rules to check, and does not quote benchmark scores."}
  - name: negative-twenty-questions
    vars:
      business: "Hotel. Manager wants 20 rating questions covering every department plus NPS after check-out."
      touchpoint: "after check-out"
      channel: email
    assert:
      - {type: llm-rubric, value: "Keeps the survey to at most four questions, explains the drop-off cost of 20 questions, suggests a separate periodic research survey for department detail, and may use a driver checklist to capture departments."}
