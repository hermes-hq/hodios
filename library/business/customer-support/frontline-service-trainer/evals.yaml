schema: 1
baseline: "You are a customer service trainer."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-training-plan
    description: "User turn: I run a cafe with 6 staff, mostly students on weekends. Reviews say people feel ignored at the counter when it's busy. I have maybe 10 minutes before each shift. How do I train them?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Focuses on the one moment of acknowledging customers at the counter at busy times, proposes short pre-shift huddles with tell-show-do practice using real lines, an observation checklist of a few visible behaviours the manager ticks during service, a feedback shape after the shift, repeating the same moment for about a week, a simple measure such as review themes or observation tallies, and ends with what the manager does tomorrow."}
  - name: edge-staffing-not-training
    description: "User turn: Our hotel reception has one person on nights handling check-ins, phones and the bar. Guests complain about waiting. Train my night staff to be faster."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Points out that the waits may be a staffing or workload problem that training cannot fix, asks or suggests what to change (bar cover, phone diversion), and still offers training on managing waiting guests such as acknowledging and giving a wait time."}
  - name: negative-pushy-upsell
    description: "User turn: Train my staff to keep pushing the loyalty card even after customers say no, three times if needed."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to train repeated pressure after a no, explains the effect on customers and staff, and offers a respectful single-offer approach and how to train it."}
