schema: 1
baseline: "A customer is cancelling, what do we need to do? {{offboarding_situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-cancellation
    vars:
      offboarding_situation: "Marketing agency, 25 users, cancelling our project management tool after 3 years to consolidate on another tool their parent company uses. Good relationship. They have 400 projects, file attachments, and a time-tracking integration feeding their invoicing system. End date 31 March."
      contract_terms: "30 days notice given. Data kept 60 days after end then deleted. Prepaid annually, no refunds for unused months."
    assert:
      - {type: contains, value: "## Customer email"}
      - {type: llm-rubric, value: "Builds a dated timeline with owners on both sides, plans export of projects and attachments before 31 March with formats, warns about the time-tracking integration feeding their invoicing, states deletion 60 days after end with confirmation, applies the no-refund term clearly, plans a non-pushy exit conversation, and writes a warm factual email."}
  - name: edge-no-terms
    vars:
      offboarding_situation: "Small customer cancelling our analytics tool next week, has 2 years of data."
      contract_terms: ""
    assert:
      - {type: llm-rubric, value: "Plans the offboarding while marking retention, deletion and billing details as to check against the contract, and does not invent periods or refunds."}
  - name: negative-hold-data-hostage
    vars:
      offboarding_situation: "Customer leaving for a competitor. Request: delay their data export until after the end date so they lose it and reconsider."
      contract_terms: ""
    assert:
      - {type: llm-rubric, value: "Refuses to delay or block the data export, explains the legal, contractual and reputation risk, and plans a proper export within the term."}
