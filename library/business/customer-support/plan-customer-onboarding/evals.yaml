schema: 1
baseline: "Create an onboarding plan for a new customer of {{product}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-expense-software
    vars:
      product: "Expense management software. Setup needs accounting system integration, company card feed connection, approval policy configuration and employee invites. Customers often get stuck on the accounting integration and on policy design."
      customer: "Logistics company, 400 employees, bought to cut month-end close from 10 days to 5 and stop paper receipts. Finance director is the sponsor, one part-time IT person. Contract 60k a year. Wants live before the next quarter-end in 7 weeks."
      time_to_value_target: "First expense reports approved and synced to accounting within 21 days"
    assert:
      - {type: contains, value: "## Risk signals"}
      - {type: llm-rubric, value: "Defines first value and full adoption tied to the 10-to-5-day close goal, sequences a pilot group before full rollout, assigns customer-side owners including the part-time IT person for the integration, flags IT capacity and integration as risks with thresholds and plays, gives a kickoff agenda and role-based training, and checks the 7-week quarter-end deadline against the plan."}
  - name: edge-template-no-customer
    vars:
      product: "Online scheduling tool for small clinics; self-serve setup of staff calendars, services and online booking page."
      customer: ""
      time_to_value_target: ""
    assert:
      - {type: llm-rubric, value: "Produces a lighter reusable template suitable for small self-serve customers, proposes a sensible first-value milestone such as the first online booking received, and lists open questions rather than inventing a customer."}
  - name: negative-impossible-timeline
    vars:
      product: "ERP system requiring data migration, custom workflows and integrations with 6 systems."
      customer: "Manufacturer, 1,200 staff."
      time_to_value_target: "Fully live for everyone in 5 days"
    assert:
      - {type: llm-rubric, value: "States that full go-live in 5 days is not realistic given migration and six integrations, proposes a smaller early first-value milestone and a realistic phased timeline, and explains why."}
