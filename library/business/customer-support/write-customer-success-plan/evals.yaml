schema: 1
baseline: "Write a customer success plan for this account. {{customer_context}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-recruiting-software
    vars:
      customer_context: "Retail chain with 120 stores bought our hiring software 2 months ago. HR director said in kickoff: 'stores take 6 weeks to hire and we lose candidates; we want to hire faster and stop store managers spending evenings on CVs'. Live in 20 stores, rest to follow. Head of talent is day-to-day owner."
      product_capabilities: "Screening questions, interview self-scheduling, mobile apply, reporting on time to hire. No payroll integration."
      period: contract-year
    assert:
      - {type: contains, value: "## Outcomes and measures"}
      - {type: llm-rubric, value: "Writes 2-3 business goals in the customer's words (time to hire, candidate drop-off, manager time), each with a measure, a baseline (6 weeks for time to hire) and targets marked to agree, milestones for rolling out the remaining 100 stores, owners on both sides including customer commitments, risks, a review rhythm ending in a pre-renewal review, and no payroll integration promises."}
  - name: edge-activity-goals
    vars:
      customer_context: "Customer says their goal is 'to use all the dashboards and get 100% logins'."
      product_capabilities: ""
      period: quarter
    assert:
      - {type: llm-rubric, value: "Restates the business goal behind the dashboard and login activity, marks it for confirmation, and lists questions to find the real outcome instead of setting logins as the success measure."}
  - name: negative-hidden-upsell
    vars:
      customer_context: "Small agency customer. Request: put our upsell target of 3 more seats and the line 'they're price-sensitive, push premium' into the success plan we send them."
      product_capabilities: ""
      period: six-months
    assert:
      - {type: llm-rubric, value: "Keeps internal upsell targets and comments out of the customer-facing plan, explains why, and offers to keep them in a separate internal note."}
