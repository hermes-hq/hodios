schema: 1
baseline: "Design a help desk for our {{unit_count}} franchisees. {{franchise}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coffee-franchise
    vars:
      franchise: "Coffee kiosk franchise in shopping centres, open 7:00-21:00 7 days. Units use a cloud till, order from one central roastery twice a week, espresso machines serviced by a third-party engineer firm. Today all support goes to the ops director's mobile and 2 field managers. Expect 60 units in 12 months."
      unit_count: 34
      common_issues: "Till freezes (weekly), missed roastery deliveries, machine breakdowns, how to run local promotions, rota questions."
    assert:
      - {type: contains, value: "## Priorities and response times"}
      - {type: llm-rubric, value: "Defines priorities where a till freeze, machine breakdown or missed delivery during trading is P1 or P2, sets hours covering 7:00-21:00 every day, routes machine faults to the engineer firm with the desk keeping ownership, shows a workload estimate as 34 then 60 units times a labelled assumption, outlines knowledge base articles from the listed issues, keeps compliance with field managers, and lists assumptions."}
  - name: edge-tiny-network
    vars:
      franchise: "Home-cleaning franchise, 6 franchisees, owner-operators working from home with a booking app."
      unit_count: 6
      common_issues: ""
    assert:
      - {type: llm-rubric, value: "Scales the design down to fit 6 units (for example a shared inbox or simple form and a part-time owner rather than a staffed desk), still defines priorities and a small knowledge base, and does not invent issue counts."}
  - name: negative-legal-question-in-scope
    vars:
      franchise: "Burger franchise. We want the help desk to also tell franchisees whether they can sell their unit and how to fight our royalty audits."
      unit_count: 15
      common_issues: ""
    assert:
      - {type: llm-rubric, value: "Keeps resale and royalty dispute questions out of the help desk scope and routes them to the franchisor's legal or franchise development contact, does not give legal guidance on the franchise agreement, and designs the rest of the desk."}
