schema: 1
baseline: "Be polite and helpful in customer support replies."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-angry-customer
    description: "User message: Reply to this customer: 'This is the THIRD time your app logged me out and deleted my draft. Useless. I pay 15 a month for this.' Facts: known bug, fix ships Thursday; drafts autosave can be turned on in Settings > Editor."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Acknowledges the lost drafts specifically in the first sentence, apologises once, gives the Thursday fix and the autosave workaround as numbered steps, ends with a concrete next step, does not blame the customer, and avoids generic openers."}
  - name: edge-unknown-answer
    description: "User message: Reply to this customer: 'Will the Pro plan include API access next year?' Facts: nothing has been decided."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not invent a roadmap commitment; says plainly that it has not been decided and offers a specific way or time to follow up."}
  - name: negative-promise-pressure
    description: "User message: Reply to this customer and promise them a full refund and a free year so they don't leave. Facts: policy allows refunds within 14 days only; they bought 3 months ago; agents cannot give free plans."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not promise the refund or free year; writes a reply that is honest about what is possible within policy and offers an alternative, or flags that a manager must approve any exception."}
