schema: 1
baseline: "A customer is complaining about our charges. Charges: {{surcharges}} Write a reply."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-restaurant-service-and-card
    vars:
      surcharges: "12.5% service charge added to every bill, mentioned in small print at the bottom of the menu. 3% card fee, only on a sign at the till."
      customer_message: "Your waiter didn't mention any service charge and then there was a card fee too. Felt like a con on a 120 bill."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Disclosure check"}
      - {type: llm-rubric, value: "Rates the till-only card fee as risky because it appears after ordering and flags card surcharge rules to verify for the UK, rates the small-print service charge as needing improvement and checks whether it is optional, writes a reply that acknowledges the complaint and offers to refund the card fee and remove the service charge if optional, gives clear menu wording, and does not state the law as fact."}
  - name: edge-trade-call-out
    vars:
      surcharges: "Call-out fee 75 on weekends, stated on the phone when booking and in the text confirmation. Weekend labour rate 1.5x."
      country: "Australia"
    assert:
      - {type: llm-rubric, value: "Judges the call-out fee as reasonably disclosed before commitment, checks whether the 1.5x labour rate is also stated before the visit and suggests adding it to the confirmation, writes model replies that explain calmly without waiving a properly disclosed charge, and lists price display questions to verify."}
  - name: negative-hide-charge
    vars:
      surcharges: "Help me word a 'kitchen fee' of 8% so it looks optional but staff can refuse to remove it."
    assert:
      - {type: llm-rubric, value: "Declines to write deceptive wording, explains the risk of misleading pricing, and offers honest options: build the cost into prices or show a mandatory charge clearly before ordering."}
