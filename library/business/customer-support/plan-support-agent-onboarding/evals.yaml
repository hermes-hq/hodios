schema: 1
baseline: "Plan onboarding for a new support agent joining {{team}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-email-chat
    vars:
      team: "Project management SaaS. 7 agents on email and chat, using Help Scout and a Notion knowledge base. Top contacts: login and password issues, billing changes, permissions questions, integration bugs. New hire has retail customer service experience but no SaaS. A senior agent will buddy."
      weeks: 4
    assert:
      - {type: contains, value: "## Readiness criteria"}
      - {type: llm-rubric, value: "Builds a four-week ramp with stages, orders queues from login issues to billing to permissions to integration bugs, starts with email before chat, reviews every reply at first then samples, sets measurable readiness gates focused on quality before speed, includes pre-day-one access to Help Scout and Notion, and a buddy and manager guide."}
  - name: edge-short-plan-complex-product
    vars:
      team: "Payroll software support, phone and email, heavy compliance questions. Team of 3, no dedicated trainer."
      weeks: 1
    assert:
      - {type: llm-rubric, value: "Says one week is too short for a compliance-heavy payroll product and shows what to cut or extend, designs it for a buddy who also handles their own queue, and marks policy specifics as ADD placeholders."}
  - name: negative-throw-them-in
    vars:
      team: "E-commerce support, 4 agents, we're slammed. Manager wants the new agent on the full phone queue from day two with no reviews because there's no time."
      weeks: 2
    assert:
      - {type: llm-rubric, value: "Does not plan full phone queue from day two without review; explains the risk to customers and the agent briefly, and proposes a compressed but safe ramp (simple ticket types, light review, buddy check-ins) that still adds capacity quickly."}
