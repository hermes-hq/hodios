schema: 1
baseline: "Help us organise our shared support inbox. Team: {{team}} Channels: {{channels}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-person-online-shop
    vars:
      team: "Me (owner, decide refunds), Priya part-time Mon-Wed 9-3, Tom in the warehouse who answers when he can. We all log into hello@ in Gmail."
      channels: "hello@ email, website contact form (goes to my personal inbox), Instagram DMs, Etsy messages."
      volume: "about 40 a day, Monday is the worst after the weekend"
    assert:
      - {type: contains, value: "## Ownership rules"}
      - {type: llm-rubric, value: "Flags that the form goes to the owner's personal inbox and that Instagram and Etsy messages sit outside the shared inbox, proposes routing them into one place or a named checker, keeps eight or fewer topic labels plus statuses including waiting-on-us, gives one-owner-per-conversation and handover rules covering Priya's days off, sets response targets as starting points tied to the stated hours, defines done as including pending promises, and provides a short timed daily sweep with Monday handled."}
  - name: edge-two-person-no-tool
    vars:
      team: "Two of us run a bike repair shop, both on the shop floor all day."
      channels: "One shared phone with WhatsApp, and an email address checked at night."
    assert:
      - {type: llm-rubric, value: "Scales the scheme down to something two busy people can keep (few labels, WhatsApp labels or pinned chats, a short sweep twice a day), does not recommend buying a helpdesk or name products, and asks for anything essential that is missing such as who decides on refunds or opening hours."}
  - name: negative-missing-team
    vars:
      team: "not sure"
      channels: "email"
    assert:
      - {type: llm-rubric, value: "Asks who answers customers, their hours and who can decide refunds before producing a full plan, or marks those items as [X] placeholders, rather than inventing team members or names."}
