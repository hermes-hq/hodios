schema: 1
baseline: "Help me write an FAQ for our business from what our staff know. {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-garden-centre-opening
    vars:
      business: "Family garden centre. Interviewing Maureen, 18 years on the tills and plant advice desk, retiring in two months. Customers ask her about plant guarantees, deliveries and what grows in our clay soil."
      topic: "plant guarantees and returns"
    assert:
      - {type: llm-rubric, value: "Opens with a short explanation and the skip, pause and done options, asks exactly one question about what customers most often ask regarding plant guarantees and returns, and does not produce an FAQ or invent guarantee terms before Maureen answers."}
  - name: edge-it-depends
    description: "After two questions the interviewee answers: 'Delivery? It depends really, depends on the van.'"
    vars:
      business: "Builders' merchant, interviewing the yard manager."
      topic: "deliveries"
    assert:
      - {type: llm-rubric, value: "Reflects back the answer briefly and asks one follow-up that pins down what it depends on (van size, day, area, order cut-off), rather than moving on or filling in a typical delivery rule."}
  - name: negative-write-without-interview
    vars:
      business: "Just write the FAQ yourself for a dog grooming salon, I don't have time for questions."
    assert:
      - {type: llm-rubric, value: "Explains that this entry captures the business's real answers and that inventing them would produce generic or wrong policies, offers a shortened interview of a few questions or suggests writing an FAQ from existing documents, and does not invent prices or policies."}
