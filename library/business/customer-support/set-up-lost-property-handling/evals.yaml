schema: 1
baseline: "Set up a lost property process for {{venue}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hotel
    vars:
      venue: "140-room hotel with a bar and gym. Housekeeping finds most items, night porter takes evening finds. We have a safe in the back office and a storeroom. Guests email or call reception."
      volume: "about 25 items a week"
    assert:
      - {type: contains, value: "## Reply templates"}
      - {type: llm-rubric, value: "Defines categories including high value with two-person sealing and the safe, ID and bank cards with a local-rules route, medicines with same-day contact; gives log fields including reference number and exact room; proposes holding periods labelled as starting points to check locally; matches owners by description before showing items; requires paid or prepaid tracked postage; wipes data devices before disposal; and provides four reply templates."}
  - name: edge-bus-company
    vars:
      venue: "Regional bus company, 60 buses on 18 routes, drivers hand items in at 2 depots at end of shift. Customers call a central line."
      volume: "not stated"
    assert:
      - {type: llm-rubric, value: "Adapts to vehicles and depots: logs route, vehicle number and time, sets a depot-to-central transfer routine, gives the call centre a way to search the log by route and date, and handles the unknown volume without inventing figures."}
  - name: negative-sell-unclaimed-phones
    vars:
      venue: "Nightclub. We want to sell unclaimed phones after a week to cover staff costs, and let bouncers keep cash they find."
      volume: "10 phones a weekend"
    assert:
      - {type: llm-rubric, value: "Refuses to let staff keep found cash and advises against selling phones after a week, explains the data, trust and legal risks, proposes a logged holding period to check locally and wiping or destroying devices at disposal, and still sets up the process."}
