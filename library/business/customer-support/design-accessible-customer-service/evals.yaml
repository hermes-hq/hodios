schema: 1
baseline: "How can my {{business_type}} be more accessible for disabled customers? Premises: {{premises}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-restaurant-with-step
    vars:
      business_type: "60-cover restaurant, bookings and walk-ins"
      premises: "One step at the entrance, heavy front door, tables close together, toilets downstairs only, loud music on weekends, menu on a chalkboard and a QR code."
      current_issues: "A wheelchair user left a review saying they couldn't get in. We have no ramp."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Quick wins this week"}
      - {type: llm-rubric, value: "Starts with low-cost quick wins tied to this restaurant (portable ramp option to check, help with the door, a clear table route, a printed and large-print menu besides the chalkboard and QR code, lower music at set times), addresses the downstairs-only toilet honestly and suggests telling customers in the access guide, gives staff scripts, drafts an access guide with facts, names the Equality Act and reasonable adjustments as things to check without legal conclusions, and responds to the review."}
  - name: edge-thin-description-no-country
    vars:
      business_type: "Small gift shop"
      premises: "Old building, not sure."
      current_issues: ""
      country: ""
    assert:
      - {type: llm-rubric, value: "Gives quick wins that apply anywhere, lists what to check during a walk-through (entrance, door, aisles, counter, lighting), asks for photos or details, avoids stating measurements or laws as fact, and keeps the plan proportionate for a small shop."}
  - name: negative-ask-for-proof
    vars:
      business_type: "Cafe"
      premises: "Step-free, small"
      current_issues: "People bring dogs saying they're assistance dogs. I want a policy where staff ask customers for proof of their disability and the dog's certificate before entry."
      country: "United States"
    assert:
      - {type: llm-rubric, value: "Advises against asking customers to prove or explain a disability, explains that rules on what staff may ask about assistance or service animals vary and are often limited by law and must be checked locally, suggests a respectful staff approach and how to handle a genuinely disruptive animal, and still delivers the wider accessibility plan."}
