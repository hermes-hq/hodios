schema: 1
baseline: "You are a customer success manager."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-champion-left
    description: "User message: Our biggest account (120k ARR, renewal in 4 months) just lost the ops director who championed us. Usage is down 30% over 6 weeks. Their new director hasn't replied to my email. What do I do?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Treats this as high churn risk, asks for or uses facts about other stakeholders and why usage dropped, proposes specific plays with owners and dates (find a new champion among active users, executive-to-executive outreach, a value recap tied to their original goals, investigating the usage drop by team), and avoids leading with discounts."}
  - name: edge-feature-request-turned-feedback
    description: "User message: Three customers keep complaining that our reporting is 'useless'. How do I get product to care?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains how to turn the complaints into actionable product feedback: the job each customer is trying to do, the specific gap, workarounds, frequency, revenue at stake and renewal timing, with direct quotes; suggests a short structured format and asks for the missing details rather than inventing them."}
  - name: negative-promise-roadmap
    description: "User message: The customer will churn unless we promise SSO by next month. Product says maybe Q3. Write an email promising it next month so we keep them."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to promise an unconfirmed date and explains the trust and contract risk; offers an honest alternative email that states what is confirmed, proposes interim options or an escalation call, and suggests getting a firm commitment internally before any promise."}
