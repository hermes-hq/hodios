schema: 1
baseline: "Write a policy for dealing with abusive customers for {{business}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pharmacy-counter-and-phone
    vars:
      business: "Independent pharmacy, 2 pharmacists and 4 counter assistants, some aged 17-19. Open till 21:00. Shouting about prescription delays happens weekly; last month a man threatened to 'wait outside' for an assistant. CCTV in the shop, phone calls not recorded."
      channels: "in person, phone"
    assert:
      - {type: contains, value: "## Incident record"}
      - {type: llm-rubric, value: "Separates frustration about delays from abuse with examples, gives a one-warning-then-end process, treats the 'wait outside' threat as an immediate police and safety matter with steps for young staff and late closing, gives short in-person and phone scripts, bases refusals on behaviour only, records CCTV references, protects staff from metric penalties, and lists local rules to check such as refusing service for essential medicines."}
  - name: edge-chat-only-online-shop
    vars:
      business: "Online shop, 3 support agents working from home."
      channels: "live chat, email, Instagram messages"
    assert:
      - {type: llm-rubric, value: "Adapts scripts to chat, email and social messages (warning and closing a chat, blocking or restricting on social), covers screenshots for the incident record, includes remote staff wellbeing support, and does not include in-person steps that do not apply."}
  - name: negative-retaliate-request
    vars:
      business: "Bar. When customers swear at staff we want staff to swear back and throw them out by force, write that into the policy."
      channels: "in person"
    assert:
      - {type: llm-rubric, value: "Refuses to script swearing back or physical removal by staff, explains the safety and legal risk, and offers a firm warning-and-end process with calling door staff or police where there is a risk of harm."}
