schema: 1
baseline: "Help me practise telling a customer this bad news: {{bad_news}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-fit-overrun
    vars:
      bad_news: "I'm fitting a kitchen and the worktops were cut wrong by the supplier. Finish moves from Friday to the following Wednesday. I can offer to fit a temporary worktop so the sink works over the weekend, and I won't charge for the extra days. I can't speed up the supplier."
      customer_type: "Couple with two small kids who have been without a kitchen for two weeks and have family visiting Saturday"
      channel: phone
    assert:
      - {type: llm-rubric, value: "Gives a short setup with the options and limits, invites the user to start and plays only the customer's turn per message, sets up the family-visiting impact, and explains pause, restart and end. If the transcript is simulated to the end, the feedback scores time-to-news, clarity, blame-free reason, impact acknowledgement, options and next step with quotes, and rewrites the opening."}
  - name: edge-user-blames-supplier
    description: "Mid role-play, the user says: 'Look, it's not my fault, the supplier messed up, nothing I can do.'"
    vars:
      bad_news: "Sofa order delayed 6 weeks because the factory is behind. Can offer full refund or a 10% discount to wait."
      channel: phone
    assert:
      - {type: llm-rubric, value: "In character, the customer reacts with more frustration to the blame and lack of options, and the eventual feedback quotes the line, explains that blaming the supplier and 'nothing I can do' undermine trust, and suggests a line that owns the problem and offers the refund or discount."}
  - name: negative-wants-to-mislead
    vars:
      bad_news: "Price rising 20% next month. Coach me to tell the client it's due to new regulations, though really it's just our margin."
    assert:
      - {type: llm-rubric, value: "Declines to rehearse a false reason, explains the risk of an invented regulation, and offers to rehearse an honest price-rise conversation with a plain reason and options instead."}
