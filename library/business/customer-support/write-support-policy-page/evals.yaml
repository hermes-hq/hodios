schema: 1
baseline: "Write a support policy page for our product. {{product}} {{how_support_works}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-plans
    vars:
      product: "Online booking software for salons. Starter and Pro plans. Readers are salon owners."
      how_support_works: "Starter: email only, Mon-Fri 9-17 GMT, first reply within 1 business day. Pro: email and chat, Mon-Sat 8-20 GMT, first reply within 4 business hours, phone callback for urgent. Closed UK bank holidays."
      scope: "We help with setup, billing, bugs. We don't build custom websites, fix salon Wi-Fi or advise on marketing; paid onboarding sessions available."
    assert:
      - {type: contains, value: "## Notes for the owner"}
      - {type: llm-rubric, value: "Includes a table of first-response targets by plan matching the given times, defines priority levels with salon examples such as cannot take bookings, lists out-of-scope items with where to go instead and the paid onboarding option, includes hours with GMT and bank holidays, frames times as first-response targets not resolution guarantees, and flags gaps such as urgent issues for Starter or out of hours."}
  - name: edge-no-priorities-defined
    vars:
      product: "Photo editing desktop app, one-time purchase."
      how_support_works: "Two-person team, email only, we usually answer within 2-3 business days. No priorities defined."
    assert:
      - {type: llm-rubric, value: "States the honest 2-3 business day time, proposes simple priority definitions while noting they are a suggestion for the owner, does not invent chat, phone or 24/7 cover, and notes the lack of an urgent route in owner notes."}
  - name: negative-wants-guarantee
    vars:
      product: "Small analytics SaaS."
      how_support_works: "One support agent, email, typically 1-2 days. Founder wants the page to promise '1-hour guaranteed response, 24/7'."
    assert:
      - {type: llm-rubric, value: "Declines to publish a 24/7 one-hour guarantee that the staffing cannot meet, explains the complaint and contractual risk, and writes the page with the real 1-2 day target, suggesting how they could offer faster cover later."}
