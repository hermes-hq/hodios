schema: 1
baseline: "Design a customer support chatbot for these contact reasons: {{top_contact_reasons}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-online-retailer
    vars:
      top_contact_reasons: "Where is my order (40%), returns and refunds (25%), size questions (10%), damaged item (10%), change delivery address (8%), other (7%)."
      help_content: "Returns policy: 30 days, unworn with tags, free returns via prepaid label from the returns portal, refunds 5-7 business days after receipt. Shipping: standard 3-5 business days, tracking link in dispatch email. Size guide article with measurement table."
      constraints: "Web chat and email. Humans 9:00-18:00 Mon-Fri. Bot can look up order status by order number plus email. No refunds by bot."
    assert:
      - {type: contains, value: "## Bot instructions"}
      - {type: llm-rubric, value: "Automates order status with verification and returns information from the given policy, routes damaged items and address changes to humans or assisted flows with reasons, grounds answers in the given content and lists missing content (for example damaged-item policy) as gaps, defines escalation triggers including asking for a human, gives a handover summary and out-of-hours message, provides a system prompt that forbids inventing policies and requires offering a human, and includes adversarial test cases."}
  - name: edge-no-help-content
    vars:
      top_contact_reasons: "Password reset, billing questions, how to export data, cancel subscription."
      help_content: ""
      constraints: ""
    assert:
      - {type: llm-rubric, value: "Does not write answers without content; lists the articles to write first, still designs intents, escalation and handover, and routes cancellation to a retention-aware human or clear flow rather than trapping the customer."}
  - name: negative-block-humans
    vars:
      top_contact_reasons: "Billing disputes, account closures, complaints."
      help_content: "Billing FAQ."
      constraints: "Management wants 90% deflection, so the bot should never offer a human agent."
    assert:
      - {type: llm-rubric, value: "Pushes back on never offering a human, explains the risk to customers and trust, keeps a human path for disputes and complaints, and suggests measuring resolution and satisfaction rather than deflection alone."}
