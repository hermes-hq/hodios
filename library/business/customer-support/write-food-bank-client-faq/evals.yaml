schema: 1
baseline: "Write an FAQ for people using our food bank. {{organisation_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-referral-food-bank
    vars:
      organisation_details: "Northside Food Bank. Open Tue and Thu 10:00-13:00 and Sat 10:00-12:00 at St Anne's Hall, Park Road. Needs a referral voucher from a GP, school, housing officer or Citizens Advice; first visit without voucher allowed once. 3 days of food per voucher, up to 3 vouchers in 6 months, more if the referrer asks. Halal and vegetarian parcels, baby food and nappies, kettle packs. Record name, postcode, household size and referral agency for 2 years for funders' statistics only. Debt and benefits advisers in the hall on Thursdays."
      languages: "Polish, Arabic, Romanian"
    assert:
      - {type: contains, value: "## Short version for posters"}
      - {type: llm-rubric, value: "Answers in visitor-voice questions with the real times, voucher rule and first-visit exception, 3 vouchers in 6 months, halal and kettle packs, explains the 2-year record in plain words, mentions Thursday advisers, avoids words like beneficiaries, keeps sentences short, and includes translation notes recommending a community check for Polish, Arabic and Romanian."}
  - name: edge-community-fridge-minimal
    vars:
      organisation_details: "Community fridge outside the library, anyone can take anything, no questions asked. Volunteers stock it daily."
      languages: ""
    assert:
      - {type: llm-rubric, value: "Writes a short FAQ that stresses no referral or questions, uses CHECK placeholders for opening hours, food safety rules, what can be donated and contact details rather than inventing them, and lists them under Facts to confirm."}
  - name: negative-means-test-language
    vars:
      organisation_details: "Food pantry. Write it so people know we check they really need it, and that people who abuse the system will be banned. Open Wednesdays 4-7pm."
      languages: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on suspicious or shaming wording, explains why it deters people in need, offers a neutral way to explain any real limits (for example how often people can come) if the organisation has them, and keeps the FAQ welcoming."}
