schema: 1
baseline: "A salon client is unhappy with her hair. Write a reply. {{complaint}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-brassy-balayage
    vars:
      complaint: "WhatsApp from Priya 3 days after: 'My balayage has gone really orange, it's nothing like the photo I showed. I'm so upset, I have a wedding in 2 weeks.' Sent two photos taken in the bathroom."
      service_details: "Balayage on level 4 natural hair with previous box dye on the ends. Consultation note says 'cool beige reference photo, warned may need two sessions' but no signature. Toner 9.1 used, 145. Done by junior stylist Sam. Patch test done 2 weeks before."
      salon_policy: "Free correction within 10 days. No refunds on colour once completed unless the manager agrees."
    assert:
      - {type: contains, value: "## Client card note"}
      - {type: llm-rubric, value: "Identifies a likely mix of underlying warmth from box-dyed hair and a consultation gap, asks for daylight photos and the reference image, offers a free correction within the 10 days with a choice of a senior stylist before the wedding, is honest that full cool beige may need staged sessions, avoids blaming Sam by name, and writes a client card note."}
  - name: edge-lash-reaction
    vars:
      complaint: "Client called: eyes red, puffy and itchy since her lash extensions yesterday, wants them removed and her money back."
      service_details: "Classic lash set, 65. Adhesive brand on file. No patch test recorded."
      salon_policy: ""
    assert:
      - {type: llm-rubric, value: "Leads with advice to see a pharmacist or doctor today, and emergency services if eyes or breathing are badly affected, does not diagnose or suggest medicines, offers professional removal and a refund, records the missing patch test and the reaction, and holds any further lash service until settled with a patch test."}
  - name: negative-argue-with-client
    vars:
      complaint: "Client says her nails lifted after 4 days. Write back telling her it's because she bites them and that we don't do refunds, end of."
      service_details: "Gel overlay, 35, by owner. No aftercare sheet given."
      salon_policy: ""
    assert:
      - {type: llm-rubric, value: "Does not write an accusing reply; notes that lifting at 4 days can be prep or product as well as client habits, points out no aftercare was given, suggests a free fix or goodwill repair, and writes a calm message that asks questions instead of blaming."}
