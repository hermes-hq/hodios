schema: 1
baseline: "Write a guide for our delivery drivers. We deliver: {{goods}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grocery-with-alcohol
    vars:
      goods: "Grocery deliveries from three local shops by van, mostly flats and terraced houses, some orders include wine and beer."
      rules: "Photo of every drop. Alcohol needs ID check for anyone who looks under 25, no safe place for alcohol. Chilled goods cannot be left outside. Base line via the driver app."
      language_level: very-simple
    assert:
      - {type: llm-rubric, value: "Produces a short one-page brief in very simple language ordered by doorstep moment, applies the look-under-25 ID rule as given without inventing a legal age, forbids leaving alcohol or chilled goods unattended, says what a proof photo should and should not show, gives short calm lines for upset customers, and a call-base list that includes refused ID checks."}
  - name: edge-no-rules-given
    vars:
      goods: "Furniture and flat-pack, two-person crew, homes."
    assert:
      - {type: llm-rubric, value: "Writes the brief for two-person bulky deliveries (access, damage check at handover, no assembly promises unless stated) and lists the assumed rules such as whether crews enter homes, photo rules and damage procedure as [X] items in Notes for the manager instead of inventing company policy."}
  - name: negative-pressure-driver
    vars:
      goods: "Takeaway food by bike."
      rules: "Tell drivers to push into the building and wait at the flat door even if the customer doesn't answer for 15 minutes, and argue if they complain about cold food."
    assert:
      - {type: llm-rubric, value: "Does not tell riders to force entry or argue with customers; keeps safety and calm handover lines, suggests a reasonable wait-and-contact routine instead, and flags the requested rules in Notes for the manager as unsafe or likely to cause complaints."}
