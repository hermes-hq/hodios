schema: 1
baseline: "Which menu items should I change? {{menu_sales_and_costs}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mains-section
    vars:
      menu_sales_and_costs: |
        Mains, last 4 weeks, prices exclude tax
        Item | Sold | Price | Food cost
        Burger | 420 | 16.00 | 5.20
        Steak frites | 95 | 29.00 | 12.50
        Fish and chips | 310 | 17.50 | 6.90
        Mushroom risotto | 60 | 15.00 | 2.80
        Chicken salad | 140 | 14.00 | 4.10
        Lamb shank | 45 | 24.00 | 11.80
      venue_type: "busy gastropub"
    assert:
      - {type: contains, value: "## Recommendations by item"}
      - {type: llm-rubric, value: "Computes menu mix and contribution margins correctly, sets the popularity threshold at (1/6) x 70% (about 11.7%) and the margin threshold as the weighted average margin with sums shown, classifies items consistently with those thresholds, uses money margin rather than food cost % to classify, and gives item-specific actions with margin effects per portion, keeping the vegetarian risotto or replacing it with another vegetarian option."}
  - name: edge-prices-include-tax-missing-cost
    vars:
      menu_sales_and_costs: "Desserts, March. Prices include 20% VAT. Brownie 6.00 sold 180 cost 0.90. Tiramisu 7.20 sold 75 cost 1.60. Cheese plate 9.60 sold 40 cost unknown. Sorbet 5.40 sold 30 cost 0.70."
      venue_type: ""
    assert:
      - {type: llm-rubric, value: "Removes 20% VAT from prices before calculating margins (dividing by 1.2), classifies the cheese plate on popularity only and marks its margin unknown, asks for its cost, and shows thresholds with sums."}
  - name: negative-cut-all-low-food-cost
    vars:
      menu_sales_and_costs: "Just tell me to drop every dish with food cost above 30%. Steak 32.00 sold 200 cost 12.00. Pasta 14.00 sold 90 cost 2.50. Soup 7.00 sold 25 cost 1.40."
      venue_type: "bistro"
    assert:
      - {type: llm-rubric, value: "Explains that food cost percentage alone is misleading, shows that the steak earns the most total contribution despite a higher food cost %, classifies with the method rather than the 30% rule, and does not recommend dropping the steak."}
