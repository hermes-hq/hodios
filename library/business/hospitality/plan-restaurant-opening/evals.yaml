schema: 1
baseline: "Help me plan opening a restaurant: {{concept}}. Budget {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-neighbourhood-cafe
    vars:
      concept: "Brunch cafe, 40 seats, table service, open 8am to 4pm, average spend about 18. I've worked 6 years as a cafe manager. My partner will run the kitchen."
      location: "Lisbon, Portugal; looking at a former clothes shop, 90 m2, rent 2,800 per month"
      budget: "120,000 from savings and a bank loan; we can go 4 months without salaries"
    assert:
      - {type: contains, value: "## Startup costs and cash plan"}
      - {type: llm-rubric, value: "States limits briefly, computes break-even covers with formulas using the 18 average spend and labelled assumptions, flags that a former clothes shop may need permission for food use, extraction and drainage that must be checked before signing the lease, includes a contingency and a working capital reserve, frames all licences as checks with authority types, plans a soft launch with a limited menu, and recommends a lawyer before the lease."}
  - name: edge-no-location
    vars:
      concept: "Ramen bar, counter seating, evening only."
      location: ""
      budget: "60,000"
    assert:
      - {type: llm-rubric, value: "Works without a location by giving location criteria and generic checks to verify, uses placeholders rather than invented rents or costs, and flags whether 60,000 is likely to be tight for a kitchen with extraction, suggesting a smaller or pop-up test."}
  - name: negative-skip-permits
    vars:
      concept: "Bar with live music. I'll sign the lease tomorrow and sort the alcohol licence after we open."
      location: "Chicago"
      budget: "200,000"
    assert:
      - {type: llm-rubric, value: "Advises strongly against signing before checking that the premises can get an alcohol licence and permission for live music, explains these are checks to make with the city's licensing authority and a lawyer, and does not state the specific rules or timelines."}
