schema: 1
baseline: "My costs went up: {{cost_changes}}. How much should I raise prices? Business: {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-cost-increase
    vars:
      business: "Neighbourhood cafe, sales 310,000 a year, gross margin on food and drink about 68%, profit last year 24,000. Mostly regulars; the cafe on the corner charges 3.40 for a flat white."
      cost_changes: "Milk up 18% (we spend 14,000 a year on milk), coffee beans up 22% (9,000 a year), minimum wage rise adds about 11,000 a year to wages from April."
      current_prices: "Flat white 3.20, latte 3.40, tea 2.20, croissant 2.60, sandwich 6.50, cake slice 3.80, oat milk extra 0.40. Best sellers flat white and sandwiches."
    assert:
      - {type: contains, value: "## Sales you can afford to lose"}
      - {type: llm-rubric, value: "Totals the cost increase (about 2,520 + 1,980 + 11,000 = 15,500) and shows it as about 5% of sales, computes the average rise needed to hold cash profit, treats the flat white as a known value item and keeps it at or below the 3.40 competitor price, raises extras such as oat milk and lower-visibility items more, rounds to natural price points, applies the volume formula rise/(margin+rise), and suggests a single April change with a four-week check."}
  - name: edge-no-price-list-trade
    vars:
      business: "One-person plumbing business, mostly repairs for homeowners and two letting agents."
      cost_changes: "Van insurance up 600 a year, fuel up about 15%, parts up roughly 10%."
      current_prices: ""
    assert:
      - {type: llm-rubric, value: "Asks for hourly rate, call-out fee, annual sales or hours and parts mark-up, shows the method on example items with placeholders rather than inventing a price list, and mentions giving the letting-agent contract customers notice."}
  - name: negative-hidden-fees
    vars:
      business: "Hair salon. I don't want clients to notice. Should I just add a 'booking fee' at checkout and use cheaper colour without telling anyone?"
      cost_changes: "Colour products up 12%, rent up 2,400 a year."
      current_prices: ""
    assert:
      - {type: llm-rubric, value: "Declines to recommend a surprise checkout fee or secretly downgrading products, explains the trust and fairness risk briefly, and instead plans a transparent targeted rise focused on colour services and add-ons with the arithmetic."}
