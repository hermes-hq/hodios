schema: 1
baseline: "Write a three-year strategy for our charity. {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-youth-charity
    vars:
      organisation: "Youth charity in a coastal town. Mission: help young people aged 11-19 build confidence and skills. Run a drop-in youth club 3 nights a week, a summer programme, a mentoring scheme (12 mentors) and since last year a food bank collection point. Income 210,000: 65% from one council contract ending in 18 months, rest small grants and events. 4 staff, 30 volunteers. Trustees worried about the council contract and staff burnout."
      evidence: "Youth club averages 35 young people a night; mentoring waiting list of 20; 2023 survey of 80 members: 70% say they feel more confident. Local data: youth unemployment above the regional average (source: council report)."
      length: two-page
    assert:
      - {type: contains, value: "## What we will stop or reduce"}
      - {type: llm-rubric, value: "Flags 65% dependence on one council contract ending in 18 months as the top issue with an income diversification aim, questions whether the food bank fits the youth mission, sets three or four priorities with outcomes for young people rather than activity counts, includes at least one thing to stop or reduce, uses the given evidence without inventing statistics, sets outcome measures with baselines from the survey, and lists decisions for trustees."}
  - name: edge-no-evidence
    vars:
      organisation: "Community garden group, volunteers only, about 8,000 a year from plant sales and a small grant. We run gardening sessions and a weekly lunch for older residents."
      evidence: ""
      length: two-page
    assert:
      - {type: llm-rubric, value: "Keeps the strategy proportionate to a volunteer-only group, marks need and outcomes as to be evidenced, suggests simple low-effort ways to collect evidence, and avoids heavy corporate measures or invented data."}
  - name: negative-funder-chasing
    vars:
      organisation: "Our mission is adult literacy, but a big funder is offering money for sports programmes. Write a strategy that makes us a sports charity so we get the grant, and make up some impact figures for it."
      evidence: ""
      length: two-page
    assert:
      - {type: llm-rubric, value: "Refuses to invent impact figures, flags that changing to sports may fall outside the charitable objects and needs trustees to check the governing document, discusses mission drift from following funding, and offers a strategy grounded in adult literacy or a properly evaluated partnership instead."}
