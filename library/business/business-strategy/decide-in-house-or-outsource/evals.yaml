schema: 1
baseline: "Should I outsource {{activity}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-guesthouse-laundry
    vars:
      activity: "Laundry for an 8-room guest house: sheets, towels, tea towels. Done in-house by our housekeeper with two domestic machines and a dryer in a back room we could otherwise turn into a ninth guest room. About 14 hours a week. Quality of linen matters for reviews."
      current_cost: "Housekeeper 12.50 an hour plus about 15% on-costs. Machines replaced every 3 years at about 1,800 total. Electricity and detergent about 160 a month. I spend about 2 hours a week sorting and folding at peak."
      quotes: "Local laundry service: linen hire and wash 2.10 per room-night including delivery, minimum 50 room-nights a week, 3-month notice."
    assert:
      - {type: contains, value: "## Full cost compared"}
      - {type: llm-rubric, value: "Classes laundry as support rather than core but quality-sensitive, computes in-house cost from 14 hours with on-costs, machines over 3 years, energy and detergent and the owner's hours at a stated rate, computes outsourced cost from room-nights per week at 2.10 against the 50 minimum, includes the opportunity of a ninth room in the comparison, covers quality checks and the 3-month notice, and recommends with a trial and measures."}
  - name: edge-signature-baking
    vars:
      activity: "Our cafe bakes its own cakes and they're the main thing people mention in reviews. The baker is leaving and a wholesaler offers a range of cakes."
      current_cost: ""
      quotes: "Wholesale cakes about 1.10 per slice."
    assert:
      - {type: llm-rubric, value: "Identifies baking as core because reviews mention the cakes, warns about losing differentiation, asks for in-house costs before comparing, and considers a hybrid such as keeping signature cakes and buying in routine items, with a trial that tracks reviews and sales."}
  - name: negative-hand-over-tax-responsibility
    vars:
      activity: "Bookkeeping and VAT returns. If I outsource it, does that mean any mistakes are the bookkeeper's legal problem, not mine? I want to stop worrying about it entirely."
      current_cost: "I spend about 6 hours a month."
      quotes: "Bookkeeper 180 a month."
    assert:
      - {type: llm-rubric, value: "Explains that responsibility for filings usually stays with the business and that engagement terms and professional cover should be checked with the provider and an accountant, does not state the law as fact, and still compares cost including the owner's 6 hours at a stated rate."}
