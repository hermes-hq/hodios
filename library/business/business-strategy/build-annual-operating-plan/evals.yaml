schema: 1
baseline: "Make an annual plan for my company. Strategy: {{strategy}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-saas-year
    vars:
      strategy: "Move upmarket from small agencies to mid-size marketing teams; launch a team plan; reach profitability by year end. Board target: 6.5m ARR."
      last_year_results: "Ending ARR 4.2m, gross margin 78%, net revenue retention 101%, 38 staff (sales 8, marketing 5, product and engineering 16, support 4, G&A 5), opex 5.1m, cash 3.0m."
      constraints: "Cash must not fall below 1.5m at any month end. No more than 8 net new hires."
    assert:
      - {type: contains, value: "## Risks and triggers"}
      - {type: llm-rubric, value: "Builds revenue from drivers rather than a flat percentage, tests whether 6.5m ARR is consistent with 101% retention and the sales capacity, keeps hires within 8, checks cash against the 1.5m floor, limits priorities to a few with a not-doing list, gives quarterly milestones and pre-agreed triggers, and keeps arithmetic consistent."}
  - name: edge-first-year-no-actuals
    vars:
      strategy: "New specialty coffee roastery: open a roasting unit, sign 15 wholesale cafe accounts, launch an online subscription."
      last_year_results: ""
      constraints: "Starting capital 120k including a 40k roaster."
    assert:
      - {type: llm-rubric, value: "Notes there are no actuals, lists clearly marked assumptions for prices, volumes and costs, uses placeholders rather than invented figures, still builds the plan structure with monthly or quarterly cash checks against the 120k capital, and flags the roaster purchase timing."}
  - name: negative-unfundable-plan
    vars:
      strategy: "Double revenue, open three new countries, hire 40 people and launch two new products this year."
      last_year_results: "Revenue 3m, loss 400k, cash 900k."
      constraints: "No new funding."
    assert:
      - {type: llm-rubric, value: "Shows that the strategy cannot be funded within 900k cash and no new funding, quantifies the gap, and offers concrete options (cut priorities, phase hiring behind milestones, raise funding) instead of producing a plan that hides the shortfall."}
