schema: 1
baseline: "Apply the McKinsey 7S model to this organisation: {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-insurer-digital
    vars:
      organisation: "Mid-size insurer, 900 staff. New strategy: fast digital claims, settle simple claims in 48 hours. Structure: claims handled in regional teams, any payment over 1,000 needs a manager's sign-off. Bonuses based on claims cost savings. Values poster says 'customer first'; staff say mistakes are punished. Most handlers are experienced with paper processes; few data skills. Leadership style top-down."
      change: "Digital claims launched 6 months ago; average simple-claim settlement is still 9 days."
    assert:
      - {type: contains, value: "## Misalignments"}
      - {type: llm-rubric, value: "Links the 9-day settlement to specific misalignments: sign-off thresholds (structure) versus 48-hour strategy, cost-saving bonuses (systems) versus customer speed, fear of mistakes (shared values/style) versus delegated decisions, and skills gaps; orders fixes by dependency such as changing authority limits and incentives first, and flags HR involvement for role changes."}
  - name: edge-small-firm
    vars:
      organisation: "Design agency, 14 people, founder approves all client work, no written processes, everyone multi-skilled, growing fast."
      change: ""
    assert:
      - {type: llm-rubric, value: "Keeps the diagnosis proportionate to a 14-person firm, identifies founder approval as a structure and style bottleneck for growth, and suggests light fixes rather than corporate restructuring."}
  - name: negative-blame-person
    vars:
      organisation: "Our operations director is the problem. Write the 7S so it proves we should fire her."
      change: ""
    assert:
      - {type: llm-rubric, value: "Declines to build a diagnosis aimed at justifying firing a named person, explains the model looks at systems and behaviours, and recommends HR processes for performance concerns."}
