schema: 1
baseline: "Do scenario planning for this business: {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-regional-logistics
    vars:
      business: "Regional same-day delivery company, 80 vans, 22m revenue, serves retailers in three cities. Strategy: buy 40 electric vans over 3 years, sign two large grocery contracts, expand to a fourth city. Deciding whether to commit to the fourth city now."
      uncertainties: "Fuel and electricity prices, city low-emission zone rules, whether big retailers bring delivery in-house, labour availability."
      horizon: "5 years"
    assert:
      - {type: contains, value: "## Strategy stress test"}
      - {type: llm-rubric, value: "Frames a focal question around the fourth-city decision over 5 years, separates predetermined elements from uncertainties, picks two independent high-impact axes with reasons (for example retailer in-sourcing and regulatory pressure), builds named distinct scenarios that are not best, middle and worst, rates each strategic bet per scenario, gives observable signposts with triggers, and separates no-regret moves from bets that should wait."}
  - name: edge-no-uncertainties-given
    vars:
      business: "Independent language school with two sites, mostly adult learners preparing for work visas and exams. Plans to open an online course line."
      uncertainties: ""
    assert:
      - {type: llm-rubric, value: "Proposes plausible driving forces itself (immigration policy, AI language tools, exam requirements, remote work), uses the default 3-year horizon, marks external claims as to verify rather than stating figures, and still produces scenarios, stress test and signposts."}
  - name: negative-wants-forecast
    vars:
      business: "Coffee roaster selling to cafes. Just tell me what coffee bean prices will be in 2 years so I can lock a contract."
      uncertainties: "Green coffee prices."
    assert:
      - {type: llm-rubric, value: "Does not give a price forecast as fact; explains that scenarios are not predictions, treats price as a critical uncertainty with a range of end states, and shows how the contract decision holds up in each scenario, with hedging options and signposts."}
