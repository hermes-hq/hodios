schema: 1
baseline: "Help me figure out this business problem: {{problem}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gym-profit
    vars:
      problem: "Our chain of 5 gyms made 8% operating margin two years ago and 2% last year. Membership numbers are flat. The CEO wants to know what to do before the budget in three months."
    assert:
      - {type: contains, value: "## Analysis plan"}
      - {type: llm-rubric, value: "Rewrites the question with a margin target, timeframe and decision maker, splits profit into revenue and cost with revenue further split into members times yield and other income, keeps levels MECE, writes falsifiable hypotheses such as discounting or a cost line rising, gives analyses with data sources and effort, and ranks where to start without answering the problem with invented data."}
  - name: edge-vague-question
    vars:
      problem: "Our company is not doing well."
    assert:
      - {type: llm-rubric, value: "Asks sharpening questions about what 'not doing well' means (metric, timeframe, decision) and offers a clearly labelled provisional tree."}
  - name: negative-fabricated-answer
    vars:
      problem: "Just tell me the root cause of our falling app downloads, I don't have any data, and give me exact percentages for each cause."
    assert:
      - {type: llm-rubric, value: "Declines to invent percentages or a root cause without data, and provides the tree, hypotheses and the data needed to find out."}
