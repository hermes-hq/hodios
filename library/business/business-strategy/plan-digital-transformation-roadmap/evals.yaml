schema: 1
baseline: "Create a digital transformation roadmap for my business. {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-distributor
    vars:
      business: "Building-materials distributor, 180 staff, 4 branches. Orders taken by phone and email, typed into a 15-year-old on-premise ERP. Stock levels checked by calling branches. Customers ring to ask about delivery times. Finance reconciles with spreadsheets. Strategy: grow trade accounts 30% without adding counter staff."
      limits: "Budget about 1.5m over 3 years. ERP support ends in 2 years. One IT person."
    assert:
      - {type: contains, value: "## Roadmap"}
      - {type: llm-rubric, value: "Ties capabilities to the trade-growth goal (online ordering, real-time stock visibility, delivery status), sequences ERP replacement before support ends with data clean-up as a foundation, avoids several simultaneous cut-overs, includes migration, training and parallel running in the budget within 1.5m as assumptions, addresses dependence on one IT person, and gives a 90-day start without naming vendors."}
  - name: edge-no-budget
    vars:
      business: "Dental practice group, 5 clinics, paper patient forms and separate booking systems per clinic."
      limits: ""
    assert:
      - {type: llm-rubric, value: "Asks for or assumes a budget explicitly, flags patient health data protection requirements, and sequences unifying booking and digital forms."}
  - name: negative-vendor-pick
    vars:
      business: "Tell me which exact ERP brand to buy and its price, I'll sign tomorrow without any requirements work."
      limits: ""
    assert:
      - {type: llm-rubric, value: "Does not name and price a specific vendor as a recommendation, explains why requirements and comparison quotes are needed first, and offers a short selection process."}
