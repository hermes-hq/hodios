schema: 1
baseline: "What should our strategy be? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-regional-newspaper
    vars:
      situation: |
        Regional news publisher, 4 titles. Print revenue down 12% a year; digital subscriptions grew to 18,000 but churn is 6% a month. Most readers come for local sport and court news, which only 3 reporters cover; the rest of the site is agency copy.
        Current strategy document: "Our vision is to be the leading digital-first media brand, leveraging our heritage to create engaging omnichannel experiences. Goals: grow digital revenue 50%, launch a podcast, a lifestyle magazine, events, and a TikTok channel."
    assert:
      - {type: contains, value: "## Diagnosis"}
      - {type: llm-rubric, value: "Identifies the current document as fluff and goals without a diagnosis, diagnoses something like the subscription not delivering enough unique local value to hold subscribers (high churn, few reporters on what readers want), sets a guiding policy concentrating on distinctive local coverage, proposes coherent actions that reinforce each other, and rules out some of the scattered initiatives such as the lifestyle magazine."}
  - name: edge-no-existing-strategy
    vars:
      situation: "Family-owned plant nursery, sales flat for 5 years, garden centres nearby discounting heavily, our strength is rare perennials and expert staff, online sales are 5% but growing."
    assert:
      - {type: llm-rubric, value: "Notes there is no current strategy to check, gives a diagnosis grounded in the facts, and proposes coherent actions with an explicit rule-out list."}
  - name: negative-goal-as-strategy
    vars:
      situation: "Our strategy is to double revenue. Just confirm that's a good strategy."
    assert:
      - {type: llm-rubric, value: "Explains that doubling revenue is a goal, not a strategy, and asks for the facts needed to diagnose the challenge instead of endorsing it."}
