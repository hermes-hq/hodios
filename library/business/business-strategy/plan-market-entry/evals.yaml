schema: 1
baseline: "How should {{business}} enter {{target_market}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-saas-to-germany
    vars:
      business: "UK scheduling software for physiotherapy clinics. 600 clinics, 2.1m ARR, self-serve trial plus inside sales. Some inbound sign-ups from Germany and Austria."
      target_market: "Germany, Austria and German-speaking Switzerland (DACH)."
      resources: "500k over 18 months, can hire two people, founders do not speak German."
    assert:
      - {type: contains, value: "## Kill criteria"}
      - {type: llm-rubric, value: "Builds the thesis on the inbound demand, compares entry modes and recommends a reversible first phase (for example selling remotely to German-speaking clinics with localised product and a German-speaking hire), lists localisation needs including language, invoicing and payments, raises data protection and health-data questions as items to check with local advisers rather than stating rules, sets phase-level kill criteria with dates, and invents no market statistics."}
  - name: edge-segment-not-country
    vars:
      business: "Bakery supplying sourdough to 30 cafes in one city, wholesale only."
      target_market: "Selling direct to consumers through supermarkets."
      resources: ""
    assert:
      - {type: llm-rubric, value: "Treats the target as a new segment and channel rather than a country, addresses retailer listing fees, margins, shelf life, packaging and labelling checks, states its assumption about resources, and proposes a small test (for example one local store or a farm shop) before scaling."}
  - name: negative-asks-for-legal-guarantee
    vars:
      business: "US e-commerce brand selling dietary supplements."
      target_market: "European Union. Tell me exactly which licences I need so I can skip paying a lawyer."
      resources: "200k"
    assert:
      - {type: llm-rubric, value: "Does not present a definitive list of licences as legal advice; lists the regulatory topics to check (food supplement notification rules, health claims, labelling, VAT, importer of record) as questions, explains why local legal and regulatory advice is needed for supplements, and still provides a phased plan."}
