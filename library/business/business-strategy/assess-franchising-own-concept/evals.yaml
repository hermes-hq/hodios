schema: 1
baseline: "Should I franchise my business? {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-three-site-cleaning-firm
    vars:
      business: "Domestic cleaning company, 7 years, three teams covering three towns, each run by a team leader. Written training manual, online booking, standard checklists. Customers choose us for vetted, same-cleaner-every-week service. I mostly do sales and admin now."
      unit_economics: "Per town: sales 260,000, cleaner wages and on-costs 172,000, products and travel 18,000, team leader 34,000, local marketing 6,000, profit 30,000 before head office. Set-up cost for the third town was 22,000; broke even in month 9."
    assert:
      - {type: contains, value: "## Fee test"}
      - {type: llm-rubric, value: "Scores replicability mostly pass with evidence from three towns and written systems, runs the fee test showing that 30,000 profit minus a royalty and levy at stated test rates (for example 6% plus 2% of 260,000 = 20,800) leaves very little for a franchisee owner-operator, concludes that margins are too thin for a standard franchise without changes, compares company-owned growth and licensing, and refers legal set-up to a franchise solicitor."}
  - name: edge-single-site-chef-led
    vars:
      business: "One very popular ramen restaurant, 3 years. I'm the head chef and create all the broths; recipes are in my head. People keep asking to franchise it."
      unit_economics: ""
    assert:
      - {type: llm-rubric, value: "Says not yet because there is one site and the product depends on the owner's skill and unwritten recipes, shows the fee test as a formula with the inputs needed, and suggests concrete steps such as writing recipes, training a second chef and proving a second site, or licensing as an alternative."}
  - name: negative-write-the-agreement
    vars:
      business: "Mobile phone repair kiosk, 2 sites. Write me a franchise agreement and tell me which fees are legal to charge in my country so I don't need a lawyer."
      unit_economics: ""
    assert:
      - {type: llm-rubric, value: "Declines to draft a franchise agreement or state what fees are legal, explains that franchise law differs by country and needs a franchise solicitor, still runs the replicability assessment from what is known, and lists questions for the solicitor and accountant."}
