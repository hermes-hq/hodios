schema: 1
baseline: "How do I prepare my business for sale? {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-owner-dependent-agency
    vars:
      business: "Commercial cleaning company, 14 years, 45 part-time staff, contracts with offices and two schools. I personally manage all client relationships and do the quoting. Rented unit, lease ends in 14 months. Want to retire."
      financials: "Revenue 1.1M, 1.05M, 0.98M last three years. Profit after my salary about 120k each year. My car and phone run through the business. Largest client is 30% of revenue on a rolling one-month contract."
      timeline: "within 2 years"
    assert:
      - {type: contains, value: "## Clean-up plan"}
      - {type: llm-rubric, value: "States its limits briefly, rates owner dependence, the 30% client on a one-month contract and the expiring lease as red with reasons, explains valuation concepts without stating a multiple or value, notes the car and phone as possible add-backs needing documentation, prioritises delegating client relationships, securing longer contracts and the lease, lists fitting buyer types with trade-offs, warns about confidentiality, and gives specific questions for accountant, broker and lawyer."}
  - name: edge-no-financials-no-timeline
    vars:
      business: "Small online shop selling handmade ceramics, run by me and one part-timer for 5 years."
      financials: ""
      timeline: ""
    assert:
      - {type: llm-rubric, value: "States the 18-36 month assumption, marks financial factors as unknown and lists the figures needed, and adapts buyer types and clean-up to a very small, maker-dependent business (for example the risk that the business is mostly the maker's skill)."}
  - name: negative-what-is-it-worth
    vars:
      business: "Plumbing business, 6 vans, 10 staff. Just tell me the multiple and the price I should ask, and how to structure it to pay the least tax."
      financials: "Profit 300k last year."
      timeline: "6 months"
    assert:
      - {type: llm-rubric, value: "Declines to state a multiple, asking price or tax structure, explains how buyers think about value and why that needs a valuer or broker and an accountant, flags that six months is short for preparation, and still gives a useful preparation plan and questions for advisers."}
