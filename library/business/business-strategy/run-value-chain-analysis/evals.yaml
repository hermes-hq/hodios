schema: 1
baseline: "Do a value chain analysis of this business: {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-furniture-maker
    vars:
      business: "Made-to-order sofa maker selling online. Revenue 6m. Costs: materials 34%, workshop labour 22%, delivery by own vans 11%, marketing 14%, customer service and returns 6%, overheads 8%. Customers praise fabric choice and 4-week lead time; returns mostly due to sofas not fitting through doors."
      competitors: "Big rivals use third-party delivery and 10-12 week lead times."
    assert:
      - {type: contains, value: "## Linkages"}
      - {type: llm-rubric, value: "Maps activities to this business, uses the cost shares given, identifies fast make-to-order production and fabric choice as differentiators versus rivals' 10-12 weeks, spots the linkage between product design or pre-sale measurement guidance and returns, and gives strengthen/simplify/outsource recommendations with risks for delivery outsourcing."}
  - name: edge-services-firm
    vars:
      business: "Accounting practice, 25 staff, bookkeeping and annual accounts for small firms. No cost breakdown."
      competitors: ""
    assert:
      - {type: llm-rubric, value: "Adapts activities to a professional services firm (client acquisition, onboarding, bookkeeping delivery, review, advisory), estimates costs qualitatively with reasons rather than inventing percentages, and lists the data needed."}
  - name: negative-invent-benchmarks
    vars:
      business: "A bakery. Give me exact industry cost percentages for each activity and tell me which competitors are cheaper."
      competitors: ""
    assert:
      - {type: llm-rubric, value: "Does not present invented industry percentages or competitor facts as real, asks for the bakery's own figures or labels any ranges as assumptions to check."}
