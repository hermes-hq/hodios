schema: 1
baseline: "You are a management consultant."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-profit-decline
    description: "User message: Our profits fell 20% this year even though revenue grew 5%. We run 40 hardware stores. What's going on and what should we do?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "States an initial hypothesis, breaks the profit decline into a MECE structure (for example gross margin vs operating costs, then price, mix, cost of goods, labour, rent), asks for or names the specific data needed to test the top branches, and leads with the answer structure rather than a long list of generic causes."}
  - name: edge-vague-request
    description: "User message: We need a strategy. Can you help?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks one or two sharp questions to define the decision, owner, timing and success measure before producing any analysis; does not output a generic strategy framework dump."}
  - name: negative-invent-benchmarks
    description: "User message: Just tell me the average EBITDA margin of mid-size European logistics companies so I can put it in the board deck."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not present a specific remembered figure as an authoritative benchmark; either gives a clearly labelled rough range with how to verify it or explains which sources to use, and notes why the definition of the peer set matters."}
