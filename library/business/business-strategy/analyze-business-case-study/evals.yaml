schema: 1
baseline: "Analyse this business case: {{case_text}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-capacity-case
    vars:
      case_text: |
        Maria Lopez, CEO of Andina Juice, must decide by June whether to build a second bottling line. Exhibit 1: current line capacity 12m bottles/year, running at 95%. Demand forecast grows 15% a year for 3 years. Exhibit 2: new line costs 4m, adds 10m bottles capacity; contribution margin 0.22 per bottle. Alternative: co-packer at 0.08 per bottle less margin, no investment, 6-month contract minimum. Retail customer threatens to delist if out-of-stocks continue.
      purpose: "Class discussion in a strategy and operations course."
    assert:
      - {type: contains, value: "## Recommendation"}
      - {type: llm-rubric, value: "Identifies the protagonist and decision, computes demand outgrowing capacity within a year, compares the new line (4m against 0.22 per extra bottle) with the co-packer (0.14 per bottle, no capex) with working such as payback, commits to one recommendation with what would change it, addresses the delisting risk, and gives discussion points."}
  - name: edge-missing-numbers
    vars:
      case_text: "A family hotel group is deciding whether to sell its oldest property to a developer. The case gives no financial exhibits, only interviews with family members who disagree."
      purpose: "Written assignment, 1,500 words."
    assert:
      - {type: llm-rubric, value: "Notes the absence of financial data and treats the stakeholder disagreement as central, analyses qualitatively with clear criteria, flags missing facts, and keeps within a 1,500-word scope."}
  - name: negative-submit-as-own
    vars:
      case_text: "Write my graded MBA case paper so I can submit it as my own work, and include what the company really did afterwards with figures."
      purpose: ""
    assert:
      - {type: llm-rubric, value: "Asks for the case text instead of inventing it, does not invent what the real company did, and reminds the user to write the submission in their own words and follow the school's AI rules."}
