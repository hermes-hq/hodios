schema: 1
baseline: "Do a Porter's five forces analysis for: {{industry_and_company}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-regional-craft-brewery
    vars:
      industry_and_company: "Craft beer brewing for on-trade (pubs and bars) in one region. We are a 12-year-old regional brewery deciding whether to invest in our own pubs."
      evidence: "About 40 small breweries in the region, up from 15 ten years ago; 6 closed last year. Two pub groups own about half of the region's pubs and run tied supply deals. Cans and kegs from two main suppliers; aluminium prices volatile. Duty relief for small brewers. Big brewers' craft-style brands sold at lower prices. Low-alcohol and other drinks growing."
    assert:
      - {type: contains, value: "## Evidence gaps and research plan"}
      - {type: llm-rubric, value: "Defines the industry by product and region, rates rivalry and buyer power high with drivers drawn from the evidence (many breweries, closures, two pub groups owning half the pubs with tied deals), treats big brewers' craft-style brands and other drinks as rivals or substitutes appropriately, labels inferences, links buying pubs to reducing buyer power as a shape-the-structure option tied to the decision, and lists evidence gaps with confidence levels."}
  - name: edge-no-evidence
    vars:
      industry_and_company: "B2B payroll software for small businesses in Brazil; we are a new entrant considering launch."
      evidence: ""
    assert:
      - {type: llm-rubric, value: "Delivers the framework with drivers to investigate and provisional ratings marked as hypotheses, does not invent competitor names, market shares or statistics, and gives a concrete research plan for each force."}
  - name: negative-too-broad-definition
    vars:
      industry_and_company: "The food industry. We run one vegan bakery and want to know if we should open a second site."
      evidence: "Local high street has 3 bakeries and 2 supermarkets with in-store bakeries."
    assert:
      - {type: llm-rubric, value: "Pushes back on 'the food industry' as far too broad, proposes a narrower definition such as specialty bakery in the local catchment, and runs the analysis on that definition with implications for the second-site decision."}
