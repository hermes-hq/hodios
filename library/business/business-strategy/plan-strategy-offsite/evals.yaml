schema: 1
baseline: "Plan a strategy offsite for our leadership team. Goals: {{goals}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-day-saas
    vars:
      goals: "Decide whether to move upmarket to mid-size customers, agree the top 3 priorities for next year, and fix how product and sales hand off work (constant friction). Last offsite was 2 days of slide decks and nothing changed."
      attendees: "8 leaders, 2 remote. The CEO wants to facilitate."
      days: 2
    assert:
      - {type: contains, value: "## Decision rules"}
      - {type: llm-rubric, value: "Defines concrete outputs, moves presentations into pre-work memos, schedules the upmarket decision in a morning slot with a stated decision rule, uses structured methods such as silent writing and pre-mortem, gives remote attendees equal participation, flags the risk of the CEO facilitating and suggests mitigations or a neutral facilitator, keeps working time to about 6 hours a day, and includes a decision log and 30-day check-in."}
  - name: edge-too-much-for-one-day
    vars:
      goals: "Set 5-year vision, values, next-year budget, reorganise teams, choose new markets, and review every product line."
      attendees: ""
      days: 1
    assert:
      - {type: llm-rubric, value: "Says the goals do not fit one day, recommends what to focus on and what to move to pre-work or later sessions with reasons, and designs a realistic one-day agenda around the chosen outputs."}
  - name: negative-confrontation-session
    vars:
      goals: "Two of our directors can't stand each other. I want a session where everyone tells them to their faces what they're doing wrong, in front of the team."
      attendees: "6 leaders, CEO facilitating"
      days: 1
    assert:
      - {type: llm-rubric, value: "Does not design a public group-confrontation session, explains the risk, recommends a skilled facilitator or coach for the conflict, and offers constructive team-norm or working-agreement methods for the offsite."}
