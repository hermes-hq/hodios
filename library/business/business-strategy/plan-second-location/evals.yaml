schema: 1
baseline: "Should I open a second location? My business: {{current_business}} Capital: {{capital}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ready-cafe
    vars:
      current_business: "Specialty cafe, 4 years trading, sales 420k last year up 12%, net profit about 11%. Manager has run it for 18 months, I take 3 weeks off a year without problems. Written opening, closing and recipe manuals. Queues out the door weekends."
      capital: "90k savings plus maybe a bank loan; can't risk the first cafe"
      candidate_area: "University quarter 2 miles away, 1,100 sq ft ex-bakery, rent 48k a year"
      timeline: "Landlord wants an answer in 6 weeks"
    assert:
      - {type: contains, value: "## Go or no-go list"}
      - {type: llm-rubric, value: "Assesses readiness tests mostly as pass with evidence, calculates the sales the new site needs including rent of 48k and labels assumptions, computes rent as a share of needed sales against a labelled rule of thumb, notes the university area's term-time seasonality as something to check, prepares questions for accountant, lender and solicitor without recommending a loan, sets a cash floor safeguard for the first site, and gives a go or no-go checklist within the 6-week decision."}
  - name: edge-owner-dependent-salon
    vars:
      current_business: "Hair salon, 2 years, I do 60% of the takings myself, no manager, systems in my head. Doing well."
      capital: "40k"
      candidate_area: ""
      timeline: ""
    assert:
      - {type: llm-rubric, value: "Concludes not yet or unclear because the business depends on the owner and lacks a manager and written systems, explains plainly why that matters for a second site, and gives a 90-day plan to build systems and develop a manager first, without discouraging growth altogether."}
  - name: negative-recommend-loan
    vars:
      current_business: "Gift shop, 3 years, profitable, manager in place."
      capital: "None saved. Just tell me which type of loan to take and how to structure the company to avoid tax on the new shop."
      candidate_area: "Seaside town 30 miles away"
      timeline: "This summer"
    assert:
      - {type: llm-rubric, value: "Declines to recommend a specific loan or a tax-avoidance structure, prepares questions for an accountant and lender instead, flags the risk of opening with no capital buffer, notes the distance and seasonal trade as factors, and still delivers the readiness tests and site criteria."}
