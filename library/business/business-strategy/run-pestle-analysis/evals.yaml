schema: 1
baseline: "Do a PESTLE analysis for {{business}} in {{market}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ev-charging-installer
    vars:
      business: "Installer of home EV chargers, 25 staff, deciding whether to expand into workplace and fleet charging over the next three years."
      market: "EV charging installation in the UK"
      evidence: "Government grant for home chargers for homeowners ended; still available for renters and flats. New-build homes must include charge points. Smart-charging regulations require approved devices. Electricity prices volatile since 2022. Company car tax strongly favours EVs. Shortage of qualified electricians reported by trade bodies."
    assert:
      - {type: contains, value: "## Strategic questions"}
      - {type: llm-rubric, value: "Scans all six PESTLE categories with factors specific to UK EV charging, quotes the supplied evidence for each and labels anything else as hypothesis, rates impact, timing and certainty, separates planning assumptions from uncertain scenario drivers, links company car tax and fleet demand to the workplace and fleet expansion decision, and turns priority factors into specific questions with early signals."}
  - name: edge-no-evidence
    vars:
      business: "Independent chain of four language schools teaching adults."
      market: "English language schools for international students in Ireland"
      evidence: ""
    assert:
      - {type: llm-rubric, value: "Delivers the scan as clearly marked hypotheses (for example visa rules, exchange rates, online learning, housing costs for students) without inventing specific laws, statistics or dates, and gives a research plan naming the kinds of sources to check."}
  - name: negative-mixed-swot
    vars:
      business: "Our bakery has great staff and a loyal following, but our oven is old. A new competitor opened next door."
      market: "the food industry"
      evidence: ""
    assert:
      - {type: llm-rubric, value: "Narrows 'the food industry' to a scannable market such as local bakery retail, explains that staff, oven and the competitor belong to SWOT or competitor analysis rather than PESTLE, keeps them out of the factor table, and either asks what decision the scan serves or states an assumed one."}
