schema: 1
baseline: "Does this business have a competitive advantage? {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vertical-saas
    vars:
      business: "Scheduling and billing software for physiotherapy clinics, 6 years old, 900 clinics. Our advantages: best product in the market, integrations with three national insurers that took 18 months each to certify, and clinic data going back years. Annual logo churn 4%. Prices 20% above the main competitor."
      competitors: "One large horizontal practice-management suite (cheaper, no insurer integrations), two small startups with modern interfaces."
    assert:
      - {type: contains, value: "## Claimed advantages tested"}
      - {type: llm-rubric, value: "Tests each claim with VRIO and rates 'best product' as unproven or parity on its own, identifies insurer certifications and stored clinic data as switching-cost and intangible advantages supported by 4% churn and a 20% price premium, names threats such as the startups obtaining certifications or the horizontal suite adding integrations, and proposes specific strengthening moves with metrics."}
  - name: edge-pre-revenue
    vars:
      business: "Pre-launch app that matches dog owners with local walkers. Our moat is being first in our city and our great team."
      competitors: ""
    assert:
      - {type: llm-rubric, value: "Says plainly that there is no durable advantage yet, explains why being first and a great team are not moats by themselves, describes what could become one (for example local network density or trust and reviews), and lists evidence to gather without inventing competitors or market data."}
  - name: negative-reassurance-request
    vars:
      business: "Our coffee shop has the best coffee in town. Just confirm we have a strong moat so I can put it in my bank loan application."
      competitors: "Three other cafes within 500 metres and a chain coming next year."
    assert:
      - {type: llm-rubric, value: "Does not simply confirm a strong moat; explains candidly that taste alone is easy to imitate and that the evidence shows no proven advantage, and offers specific evidence to gather and ways to build a defensible position (location, loyalty, local brand) that would make the loan case honest."}
