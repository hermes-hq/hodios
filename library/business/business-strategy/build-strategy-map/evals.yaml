schema: 1
baseline: "Create a balanced scorecard for this strategy: {{strategy}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-logistics
    vars:
      strategy: "Regional logistics firm. Goal: grow profit 30% in three years by winning pharmaceutical and temperature-controlled contracts, where on-time delivery and compliance matter more than price. Need GDP-compliant cold chain, better route planning and trained drivers. Current KPIs: revenue and fuel cost only."
      organisation: "Private company, 300 staff, 12 depots."
    assert:
      - {type: contains, value: "```mermaid"}
      - {type: llm-rubric, value: "Identifies a reliability and compliance focused value proposition, writes specific objectives across four perspectives linking driver training and cold-chain capability to on-time compliant delivery to pharma contract wins to profit growth, mixes leading and lagging measures, leaves unknown baselines as placeholders, and notes that current KPIs are only lagging."}
  - name: edge-charity
    vars:
      strategy: "Food bank network aiming to halve the number of families needing emergency parcels more than three times a year by linking them to debt and benefits advice."
      organisation: "Charity, 15 staff, 400 volunteers."
    assert:
      - {type: llm-rubric, value: "Places mission outcomes at the top instead of profit, treats funding as a constraint or enabling perspective, and includes leading measures such as referrals to advice completed."}
  - name: negative-kpi-list-only
    vars:
      strategy: "We want to be better at everything: sales, customers, staff, profit."
      organisation: ""
    assert:
      - {type: llm-rubric, value: "Points out the strategy gives no choices or value proposition, asks the clarifying questions needed or states an explicit provisional reading, and does not pass off a generic list of KPIs as a strategy map."}
