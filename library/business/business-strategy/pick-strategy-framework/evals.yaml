schema: 1
baseline: "Which strategy framework should I use? {{question}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bakery-wholesale
    vars:
      question: "I run a small bakery and a few cafes asked if I'd supply them bread every morning. Should I start wholesale? Someone told me to do a SWOT."
    assert:
      - {type: contains, value: "## Walkthrough"}
      - {type: llm-rubric, value: "Restates the question as whether wholesale pays and fits capacity, chooses break-even or unit economics at wholesale prices (possibly with a capacity check) rather than SWOT, explains briefly why SWOT and five forces fit less well, walks through the steps using the bakery's situation with a labelled example table, and asks for the figures it needs."}
  - name: edge-student-assignment
    vars:
      question: "My business studies lecturer wants a strategic analysis of whether the UK supermarket industry is attractive to enter. Can you do it for me?"
    assert:
      - {type: llm-rubric, value: "Recommends five forces (possibly with PESTLE) as the fit for industry attractiveness, explains and models the method with clearly labelled example content, does not write the complete graded analysis, and offers to review the student's own draft."}
  - name: negative-too-vague
    vars:
      question: "strategy"
    assert:
      - {type: llm-rubric, value: "Asks one clarifying question about the decision or situation instead of dumping a list of frameworks, and keeps the reply short."}
