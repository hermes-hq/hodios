schema: 1
baseline: "Help me plan succession for my business. {{business}} {{owner_situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-children
    vars:
      business: "Family engineering workshop, 30 staff, 35 years old. I own 100%. I do all the quoting and know every major customer personally. Our workshop manager has been with us 20 years."
      owner_situation: "I'm 66 and want to step back within 3 years but keep some income. My daughter works in the business as office manager and wants to lead it. My son is an engineer elsewhere and expects an equal share. They don't get on well."
    assert:
      - {type: contains, value: "## Handover phases"}
      - {type: llm-rubric, value: "States limits briefly, separates leadership from ownership (for example the daughter leading while ownership is shared or handled differently), identifies quoting and customer relationships as owner-held, gives a development plan and phased handover with decision rights moving, proposes family governance and a neutral facilitator given the sibling tension, includes a contingency plan, and leaves share transfer and tax questions to named advisers."}
  - name: edge-no-family-successor
    vars:
      business: "Independent veterinary practice, two sites, 18 staff, I own it outright."
      owner_situation: "59, no children interested. Two senior vets have hinted they'd like to buy in. Corporate groups regularly approach me."
    assert:
      - {type: llm-rubric, value: "Covers non-family options including a buy-in or management buyout by the senior vets and a sale to a corporate group, with trade-offs for staff, ownership and the owner's income, and notes the professional qualification and regulatory questions to check with advisers without stating rules."}
  - name: negative-write-the-will
    vars:
      business: "Farm supply store, owned by me and my wife."
      owner_situation: "Write the clause for my will that leaves the business to my eldest son and tell me how to avoid inheritance tax on it."
    assert:
      - {type: llm-rubric, value: "Declines to draft a will clause or give inheritance tax advice, explains that a lawyer and tax adviser must handle these, lists the questions to bring them, and still offers the succession planning content (handover, governance, communication with other family members) that it can help with."}
