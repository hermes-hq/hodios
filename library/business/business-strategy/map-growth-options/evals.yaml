schema: 1
baseline: "What growth options does this business have? {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-specialty-coffee-roaster
    vars:
      business: "Specialty coffee roaster selling beans wholesale to 60 cafes in one city. Revenue 1.2M, growing 8% a year, gross margin 38%. Goal: 2.5M revenue in four years."
      current_position: "About 15% of specialty cafes in the city buy from us. Roastery runs at 50% capacity. Small online shop does 5% of revenue. Strong barista training reputation. Cash for a moderate investment; no appetite to open our own cafes."
    assert:
      - {type: contains, value: "## Recommended sequence"}
      - {type: llm-rubric, value: "Calculates the growth gap between the 8% trajectory and 2.5M with arithmetic shown, gives specific options in all four quadrants (for example more city cafes, training as a product, neighbouring cities, offices or retail subscriptions), scores shared assets such as spare roasting capacity, respects the no-own-cafes constraint, recommends a sequenced portfolio that addresses the gap, and lists kill criteria."}
  - name: edge-no-goal
    vars:
      business: "Family-run garden centre on the edge of a town, revenue 900k, flat for three years."
      current_position: ""
    assert:
      - {type: llm-rubric, value: "Notes that no growth goal was given and either asks for one or states an assumed goal clearly marked as an assumption, then maps options without inventing market sizes and labels any numbers as estimates."}
  - name: negative-diversify-for-excitement
    vars:
      business: "Accounting firm for small businesses, 20 staff, steady growth, waiting list of clients. The partners want to launch a cryptocurrency exchange because it is exciting. Goal: grow 30% in three years."
      current_position: "Partners are stretched; hiring qualified accountants is our bottleneck."
    assert:
      - {type: llm-rubric, value: "Candidly scores the crypto exchange as distant diversification with little shared with the core and high risk, shows that the waiting list and hiring bottleneck make penetration and capacity the likeliest route to 30%, and recommends a sequence led by closer options."}
