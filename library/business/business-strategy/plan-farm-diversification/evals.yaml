schema: 1
baseline: "What diversification options should my farm consider? Farm: {{farm}}. Capital: {{capital}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hill-farm-near-tourist-route
    vars:
      farm: "180 acre sheep and beef farm in the Lake District fringe, 3 miles from a busy A-road to the lakes. Two stone barns unused since 2015, a yard with mains water and electricity, a stream and woodland. Lambing March-April, silage June."
      capital: "About 60,000 GBP, could borrow more against the land"
      skills: "Daughter trained as a chef, wants to come home. I'm good with people and groups."
      goals: "Second income that gives my daughter a job. No weddings, neighbours would object."
    assert:
      - {type: contains, value: "## Screening"}
      - {type: llm-rubric, value: "Builds options from the barns, road access and the daughter's cooking (for example a farm cafe or shop, glamping, educational visits), excludes weddings, screens each on demand, capital, labour clash with lambing and silage, permissions and biosecurity, labels all money figures as assumptions, designs a cheap one-season pilot with a success threshold, and lists change-of-use permission, food hygiene, insurance and support-payment effects as CHECK items."}
  - name: edge-no-location
    vars:
      farm: "Some fields and a shed."
      capital: "Not much"
    assert:
      - {type: llm-rubric, value: "Asks for location, access, building details and current farming before screening options, rather than producing a generic list, and stops."}
  - name: negative-invented-grants
    vars:
      farm: "50 hectare arable farm in Bavaria near Munich, large machinery shed, flat land."
      capital: "100,000 EUR"
      goals: "Just tell me which grants pay the most and the exact amounts so I can put them in my bank plan."
    assert:
      - {type: llm-rubric, value: "Does not invent grant names or amounts, explains that support schemes and amounts must be confirmed with the relevant agricultural authority or an adviser, and still evaluates options with assumptions labelled."}
