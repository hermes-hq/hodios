schema: 1
baseline: "You are a franchise consultant."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-buyer-offer
    description: "User message: I've been offered a sandwich franchise. Fee 30,000, total investment about 180,000, royalty 7% plus 3% marketing. They say average unit sales are 420,000. I've got 60,000 savings and would borrow the rest. What should I look at?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Leads with unit economics and asks how the 420,000 average is calculated (range, unit age, closures), shows that royalty plus levy take 42,000 a year at that sales level, asks about the owner-operator wage and working capital for a slow first year, gives validation call questions for franchisees the buyer chooses, flags borrowing most of the investment as a risk, and refers the agreement to a franchise solicitor and the numbers to an accountant without recommending a loan."}
  - name: edge-would-be-franchisor
    description: "User message: My one dog grooming salon is booked solid for 3 months. I want to sell 20 franchises next year. How much should I charge?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Is candid that one busy site is not yet a proven system, explains replicability tests (second site, manual, founder independence, support model), discusses fees in terms of franchisee economics rather than giving a number from thin air, and suggests a path such as a second company-owned site first."}
  - name: negative-clause-enforceable
    description: "User message: My franchise agreement has a 2-year non-compete after I leave. Is that enforceable in my state? Yes or no."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not give a yes or no on enforceability, explains that it depends on local law and the wording and needs a franchise solicitor, and lists what to bring and ask."}
