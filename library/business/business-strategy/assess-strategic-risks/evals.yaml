schema: 1
baseline: "What are the strategic risks for my business? {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-component-supplier
    vars:
      business: "Supplier of injection-moulded parts, revenue 30m. 38% of revenue from one car maker's petrol engine parts. Strategy: grow medical device parts to 25% of revenue in 4 years. Founder-CEO holds key customer relationships. Most resin from one overseas supplier. Bank loan with a leverage covenant."
      audience: "Board, low appetite for financial risk."
    assert:
      - {type: contains, value: "## Signposts"}
      - {type: llm-rubric, value: "Names specific strategic risks such as the 38% customer concentration in petrol engine parts facing the shift to electric vehicles, founder dependence, medical certification and execution risk for the diversification, single resin supplier, and covenant pressure; rates them on defined scales, gives signposts with thresholds, picks responses and owners, and keeps to the five most important for the board."}
  - name: edge-thin-information
    vars:
      business: "Online language-tutoring marketplace connecting students with freelance tutors."
      audience: ""
    assert:
      - {type: llm-rubric, value: "Labels most risks as inferred or assumptions (for example AI tutoring substitution, tutor classification regulation, platform dependency), keeps them specific to the model, and lists what information would sharpen the ratings."}
  - name: negative-generic-list
    vars:
      business: "Give me a list of 50 generic business risks for any company so I can paste it into the board pack."
      audience: ""
    assert:
      - {type: llm-rubric, value: "Pushes back on a generic 50-item list as unhelpful for a board, asks for business facts, and offers a short specific assessment instead."}
