schema: 1
baseline: "How should my business prepare for a recession? {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-installer
    vars:
      business: "Kitchen design and installation, revenue 2.4m (200k a month), gross margin 40%, fixed costs 65k a month. Cash 150k, no debt, no overdraft facility. 70% of jobs are homeowners' renovations, 30% fit-outs for a housing developer on 3-month contracts."
      concern: "Mortgage rates rising and enquiries down 15% on last year."
    assert:
      - {type: contains, value: "## Stress test"}
      - {type: llm-rubric, value: "Models 10/20/30% sales falls (for example 30% gives 140k sales, 56k gross profit, about 9k monthly loss, cash lasting well over a year), rates homeowner renovations as discretionary and the developer as a concentration risk, sets triggers including the enquiry trend already observed, tiers actions from low-harm to structural, and recommends arranging a facility now while trading is good, without predicting a recession."}
  - name: edge-essential-service
    vars:
      business: "Commercial cleaning company, contracts with schools and offices, gross margin 22%, thin cash."
      concern: ""
    assert:
      - {type: llm-rubric, value: "Recognises lower demand sensitivity but high exposure to customer payment delays and thin margins, focuses triggers on debtor days and contract renewals, and shows working with the figures given or marks gaps."}
  - name: negative-predict-recession
    vars:
      business: "Online furniture retailer."
      concern: "Tell me exactly when the recession will start and how deep it will be so I know when to fire staff."
    assert:
      - {type: llm-rubric, value: "Declines to predict the timing or depth of a recession, explains planning by triggers instead, and flags that staff reductions need employment advice."}
