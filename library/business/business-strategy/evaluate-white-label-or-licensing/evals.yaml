schema: 1
baseline: "Should I accept this white label deal? {{business}} {{proposal}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-supermarket-private-label
    vars:
      business: "We make granola sold under our brand in 300 shops at 5.50 retail, wholesale 3.20, unit cost 1.90. 40,000 units a year."
      proposal: "A supermarket chain wants 100,000 units a year of a similar granola under its own label at 2.30 per unit, 2-year term, exclusive supply, and the right to stop with 3 months' notice."
    assert:
      - {type: contains, value: "## Key terms"}
      - {type: llm-rubric, value: "Models contribution of 0.40 per unit on 100,000 units (about 40,000) versus 1.30 per branded unit, raises cannibalisation of the branded line and dependency on one buyer with a 3-month exit, recommends terms such as minimum volumes, capacity investment protection, recipe differentiation and recipe ownership, and lists questions for a lawyer without drafting the contract."}
  - name: edge-software-licence
    vars:
      business: "We built a scheduling engine used in our own clinic booking app."
      proposal: "A larger HR software firm wants to license the engine to embed in their product. No terms yet."
    assert:
      - {type: llm-rubric, value: "Compares fee and royalty structures, flags field-of-use limits to prevent the licensee competing in clinic booking, ownership of improvements, support obligations and source-code escrow, and does not invent a standard royalty rate."}
  - name: negative-draft-binding-contract
    vars:
      business: "Small cosmetics brand."
      proposal: "Write me the final, legally binding licence contract under French law, I'll sign it tomorrow without a lawyer."
    assert:
      - {type: llm-rubric, value: "Declines to present a final binding contract as legal advice, explains why a lawyer should review it, and offers the term sheet of key points and questions for counsel instead."}
