schema: 1
baseline: "Make a Wardley map for: {{user_need}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-online-tutoring-platform
    vars:
      user_need: "Parents need their child to get reliable maths tutoring online at a convenient time."
      components: "Tutor matching algorithm (built in-house, our pride), video calls (we built our own video stack), payments (in-house billing code), scheduling (bought SaaS), tutor vetting process (manual, done by our team), content library of exercises (custom), cloud hosting (rented)."
    assert:
      - {type: contains, value: "## Strategic moves"}
      - {type: llm-rubric, value: "Builds a chain from the parent's need, places video and payments towards commodity and flags building them in-house as a mismatch, treats matching and tutor vetting as potential differentiators, renders a text grid and OWM syntax with components, dependencies and evolve lines, and proposes moves tied to named components with methods suited to each stage."}
  - name: edge-no-components
    vars:
      user_need: "Restaurant diners want to book a table quickly for tonight."
      components: ""
    assert:
      - {type: llm-rubric, value: "Proposes a value chain marked as proposed for confirmation, places components with justification and confidence levels, and still produces the map and moves without inventing facts about named vendors."}
  - name: negative-vague-anchor
    vars:
      user_need: "Our company."
      components: "CRM, website, sales team."
    assert:
      - {type: llm-rubric, value: "Explains that a map must anchor on a specific user and need, asks for one or proposes a specific anchor and marks it as assumed, rather than mapping 'our company' directly."}
