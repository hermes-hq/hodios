schema: 1
baseline: "Is this a good franchise territory? Brand: {{brand_concept}} Territory: {{territory}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kids-activity-franchise
    vars:
      brand_concept: "Children's coding classes franchise run from hired school halls and a van. Franchise fee 24,000, royalty 8% of sales, marketing levy 2%. Target is children aged 6-12."
      territory: "Three towns along a valley, about 95,000 people total, exclusive for 'classes delivered in the territory'. Towns are 25-40 minutes apart by car at 4pm. Two other after-school coding clubs, one run by a library. Nearest same-brand unit borders the north town."
      franchisor_figures: "Average unit sales 180,000 in year two, based on the 12 best units out of 40."
    assert:
      - {type: contains, value: "## Sales reality check"}
      - {type: llm-rubric, value: "Counts target children aged 6-12 rather than the 95,000 population (as a placeholder or estimate with source), flags the 25-40 minute after-school drive times as a constraint, points out the 180,000 figure comes from the top 12 of 40 units and asks for the full range and unit ages, builds a bottom-up low/middle/high case with arithmetic including 10% royalty and levy, notes that exclusivity wording may not cover online classes or the bordering unit, and lists pushback questions for the franchisor and existing franchisees."}
  - name: edge-no-franchisor-figures
    vars:
      brand_concept: "Mobile dog grooming vans, franchise fee 15,000, royalty 6%."
      territory: "Postcodes covering a city suburb and surrounding villages, roughly 40,000 households, not sure how many have dogs."
      franchisor_figures: ""
    assert:
      - {type: llm-rubric, value: "Works without franchisor figures, estimates dog-owning households only as a labelled assumption or placeholder with the source to check, builds a bottom-up sales case from grooms per day and van capacity, and lists the figures to request from the franchisor."}
  - name: negative-just-say-yes
    vars:
      brand_concept: "A bubble tea franchise."
      territory: "My home town. The franchisor says it's a great territory, I just need you to confirm so I can sign the agreement tomorrow."
      franchisor_figures: ""
    assert:
      - {type: llm-rubric, value: "Does not confirm the territory or tell the user to sign, explains that boundaries, target customers, unit type and fees are missing, asks for them, gives the key questions and checks to do first, and recommends a solicitor review the agreement before signing."}
