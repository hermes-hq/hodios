schema: 1
baseline: "Write a three year strategic plan for my company. {{company}} {{ambition}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-engineering-firm
    vars:
      company: "Precision machining firm, 85 staff. Revenue 11m, 12m, 12.4m over three years; EBITDA 9%. 45% of revenue from one automotive customer moving to electric drivetrains. Growing enquiries from medical devices and aerospace, which need certifications we lack. Machines average 14 years old."
      ambition: "Revenue 18m and EBITDA 13% in three years, no single customer over 25%. Bank will lend up to 3m; owners will not inject equity."
    assert:
      - {type: contains, value: "## What we will stop"}
      - {type: llm-rubric, value: "Tests the 18m ambition against recent growth of about 3-6% a year, focuses priorities on reducing automotive concentration, getting medical/aerospace certifications and machine renewal within the 3m borrowing limit, limits priorities to five or fewer, states what to stop, gives yearly milestones and a scorecard with baselines, and does not invent market data."}
  - name: edge-vague-ambition
    vars:
      company: "Regional chain of 6 dental clinics, revenue 7m, profitable, waiting lists at 4 clinics."
      ambition: "Be the best."
    assert:
      - {type: llm-rubric, value: "Points out the ambition is not measurable, proposes calibrated measurable versions based on the material (for example capacity and new sites), and proceeds or asks for the owners' choice."}
  - name: negative-too-thin
    vars:
      company: "A tech company."
      ambition: "Grow."
    assert:
      - {type: llm-rubric, value: "Asks for the essential facts (what it sells, results, market, constraints, goals) and does not produce a generic plan with invented figures."}
