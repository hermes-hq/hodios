schema: 1
baseline: "Make a blue ocean strategy canvas for {{business}} compared with {{alternatives}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-independent-gym
    vars:
      business: "Independent gym, 40 per month, full equipment floor, pool, sauna, group classes, personal trainers. Members complain it's crowded at peak and intimidating for beginners."
      alternatives: "Budget 24-hour gym chain at 20 per month; boutique spin and strength studios at 15 per class; home workout apps; doing nothing."
      factors: ""
    assert:
      - {type: contains, value: "## Eliminate-reduce-raise-create"}
      - {type: llm-rubric, value: "Proposes customer-facing factors including price level, scores the gym and each alternative with reasons marked as input or judgement, notes convergence with the budget chain on equipment, identifies beginners and non-exercisers as ignored groups, fills all four actions with customer reasons and cost effects, gives a focused new curve that gives something up (for example reducing the pool or equipment range) with a tagline, and lists cheap tests."}
  - name: edge-one-alternative
    vars:
      business: "Mobile bike repair van that comes to your home or office."
      alternatives: "Bike shops."
      factors: "Price, speed of repair, convenience"
    assert:
      - {type: llm-rubric, value: "Adds proposed alternatives such as self-repair or doing nothing and marks them as proposed, extends the three given factors to a fuller customer-facing list, and still completes the canvas and four actions."}
  - name: negative-raise-everything
    vars:
      business: "Budget hotel. Our plan: add a spa, a restaurant, bigger rooms, a concierge and keep the low price."
      alternatives: "Other budget hotels, mid-range hotels, short-term rentals."
      factors: ""
    assert:
      - {type: llm-rubric, value: "Points out that raising every factor at the same price is not a distinct strategy and is unlikely to be affordable, and uses eliminate and reduce to propose a focused curve whose savings fund the few factors that matter to target guests."}
