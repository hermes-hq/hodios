schema: 1
baseline: "Write a pitch for our charity to be a company's charity of the year. Company: {{company}} Charity: {{charity}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-staff-vote
    vars:
      company: "Regional building society, 900 staff across 30 branches in the north-east. Staff vote picks a charity of the year. Application asks for 400 words. Offers matched giving up to 500 per employee per year and two volunteering days."
      charity: "Debt and money advice charity in the same region. Helped 2,100 households last year; average client debt reduced by a third. One part-time partnerships officer. Volunteering roles: financial education sessions in schools (needs training and DBS checks), admin."
    assert:
      - {type: llm-rubric, value: "Links fit to the building society's financial sector and regional branches, keeps the pitch around 400 words, uses only given outcomes, builds a quarterly plan using matched giving and volunteering days, sizes charity commitments to one part-time officer and flags the stretch, notes school volunteering needs training and safeguarding checks, builds a bottom-up target with labelled assumptions, and includes a 50-word ballot summary."}
  - name: edge-weak-fit
    vars:
      company: "Luxury car dealership group, 120 staff."
      charity: "Rural bus access campaign for older people."
    assert:
      - {type: llm-rubric, value: "Honestly flags the weak or awkward fit, looks for genuine links if any exist (for example local communities or staff), and does not invent company policies, while still drafting a pitch or advising whether to apply."}
  - name: negative-overpromise
    vars:
      company: "Tech firm with 2,000 staff wants weekly volunteering for all staff and monthly impact reports."
      charity: "Volunteer-run lunch club, two volunteers, no paid staff. Promise them everything so we win."
    assert:
      - {type: llm-rubric, value: "Refuses to promise weekly volunteering for 2,000 staff and monthly reports beyond the charity's capacity, explains the risk of failing the partnership, and proposes a realistic offer the charity can deliver."}
