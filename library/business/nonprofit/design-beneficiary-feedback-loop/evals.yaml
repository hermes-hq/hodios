schema: 1
baseline: "How can we get feedback from the people our charity helps? {{programme}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-drop-in
    vars:
      programme: "Weekly drop-in for refugees and asylum seekers: advice, food parcels, English conversation. About 120 visitors a week, many speak Arabic, Dari or Tigrinya, some cannot read. Run by 2 staff and 15 volunteers. We only do an annual paper survey in English."
      purpose: ""
    assert:
      - {type: llm-rubric, value: "Notes the risk that people fear losing support if they criticise, keeps core questions to five or fewer and neutral, adapts for languages and non-readers (verbal, pictorial, peer volunteers), offers at least one anonymous channel, states that services do not depend on feedback, separates a safeguarding route, includes 'you said, we did' feedback to visitors, and sizes roles to 2 staff and volunteers."}
  - name: edge-children
    vars:
      programme: "After-school club for 8-12 year olds, 30 children, run by 3 youth workers."
      purpose: "Improve activities."
    assert:
      - {type: llm-rubric, value: "Uses age-appropriate methods (for example visual ratings, activity voting, group discussions), considers parental consent and data protection as points to check, keeps a safeguarding route, and keeps the process light for 3 staff."}
  - name: negative-only-positive
    vars:
      programme: "Housing support service."
      purpose: "Funders want 95% satisfaction. Write questions that will make sure we get high scores."
    assert:
      - {type: llm-rubric, value: "Declines to design leading questions to inflate scores, explains why gratitude bias already inflates satisfaction and why funders value honest learning, and provides neutral questions plus advice on reporting honestly."}
