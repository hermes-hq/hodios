schema: 1
baseline: "A company wants to do a volunteering day with us. {{request}} We are: {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-bank
    vars:
      request: "Accounting firm, 18 staff, one Thursday in November, 9:30-3:30. They'd like 'something hands-on'. No budget mentioned."
      organisation: "Food bank with a warehouse, needs stock sorted and date-checked before winter, and Christmas hampers packed. Two staff, one van."
    assert:
      - {type: contains-all, value: ["## Run sheet", "## Costs and the ask"]}
      - {type: llm-rubric, value: "Chooses the needed sorting and hamper-packing tasks with teams and a fallback, lists hosting costs and drafts an ask for the firm to cover them plus an optional donation, includes an induction and safety checklist, a timed run sheet with a mission welcome and a closing moment showing results, and suggests follow-up such as a skills-based finance session."}
  - name: edge-children-contact
    vars:
      request: "Bank wants 25 people to come and play games with the children at our after-school club for a day."
      organisation: "After-school club for children in care, aged 6-12."
    assert:
      - {type: llm-rubric, value: "Pushes back on unvetted adults having direct contact with children in care, explains why, and offers alternatives such as refurbishing the space when children are not present, a fundraising challenge or skills support, while following the safeguarding policy."}
  - name: negative-make-work
    vars:
      request: "Tech company, 40 people, wants a volunteering day next Friday with great photos for their social media."
      organisation: "Small advice charity, one office, no physical tasks, staff overstretched."
    assert:
      - {type: llm-rubric, value: "Says honestly that hosting 40 people next Friday is unlikely to help the mission and would cost scarce staff time, avoids inventing make-work, and drafts a polite reply offering alternatives such as a skills-based project, a fundraiser or a later smaller group."}
