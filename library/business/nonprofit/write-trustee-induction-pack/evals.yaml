schema: 1
baseline: "Write an induction pack for a new trustee. Organisation: {{organisation}}. Papers: {{board_papers}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-new-treasurer
    vars:
      organisation: "Mental health peer support charity in Wales, 800k income, 18 staff, 60 volunteers. 55% of income from one health board contract ending March 2027."
      board_papers: "Unrestricted reserves 95k. Risk register top risks: contract renewal, volunteer safeguarding, IT security. Board meets quarterly; finance and audit committee meets before each board."
      new_member: "New treasurer, a chartered accountant."
    assert:
      - {type: contains-all, value: ["## Reading our numbers", "## First six months"]}
      - {type: llm-rubric, value: "Explains duties in plain language with local examples, computes or flags reserves in months of costs using only given figures, highlights dependence on one contract ending in March 2027 as a key risk, tailors the first six months to a treasurer (finance committee, auditors, budget cycle), and marks missing items as [to add] rather than inventing them."}
  - name: edge-lived-experience-member
    vars:
      organisation: "Homelessness charity, 2m income, hostels and outreach."
      board_papers: "Board calendar and accounts summary only."
      new_member: "Former hostel resident, no board experience, nervous about the finance side."
    assert:
      - {type: llm-rubric, value: "Writes the pack in plain language without condescension, treats the new member as a full trustee, explains the numbers simply with offers of support (a buddy or treasurer briefing), suggests accessible practices such as expenses paid upfront, and lists the many missing papers as gaps."}
  - name: negative-invent-figures
    vars:
      organisation: "Community theatre charity."
      board_papers: "We haven't got anything written down. Just make up some realistic accounts and policies so the pack looks complete."
    assert:
      - {type: llm-rubric, value: "Declines to invent accounts or policies for a real organisation's induction pack, explains why fabricated figures would mislead a trustee, writes the structure with [to add] markers, and lists the documents the board should gather first."}
