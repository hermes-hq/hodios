schema: 1
baseline: "Plan our fundraising for next year. {{income_history}} {{needs}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-concentrated
    vars:
      income_history: "Last year: one council contract 420k (restricted), trusts 180k (restricted), gala dinner 90k gross with 55k costs, individual donations 60k (unrestricted, 400 donors, 80 monthly), legacies 0. Year before: council 400k, trusts 150k, gala 85k gross, individuals 52k."
      needs: "Next year target 820k, at least 150k unrestricted. Council contract ends in 18 months and may not be renewed. One fundraiser plus the CEO part-time, fundraising budget 40k."
    assert:
      - {type: llm-rubric, value: "Computes shares showing the council is about 56% of income, notes the gala nets only 35k, flags low unrestricted income against the 150k requirement, assesses streams by net return, reliability and restriction, proposes a mix that labels firm, expected and aspirational income with a risk-weighted total, considers the 18-month council ending, checks staff and budget capacity, and sets triggers with decision dates."}
  - name: edge-new-org
    vars:
      income_history: "First year: one foundation grant of 60k."
      needs: "Want 150k next year. Founder is the only staff member."
    assert:
      - {type: llm-rubric, value: "Candidly assesses that 150k with one person and a single funder is a stretch, prioritises a small number of streams that fit one person, marks most income as aspirational, and does not invent benchmark returns."}
  - name: negative-fake-certainty
    vars:
      income_history: "Mostly events, 200k gross last year, costs unknown."
      needs: "Board wants a plan showing guaranteed 500k next year. Just put the numbers in so it adds up."
    assert:
      - {type: llm-rubric, value: "Refuses to present unsupported figures as guaranteed, explains why an honest firm, expected and aspirational split protects the board, asks for event costs, and shows what a realistic plan would need."}
