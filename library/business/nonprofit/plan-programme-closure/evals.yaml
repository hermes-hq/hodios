schema: 1
baseline: "We are closing a programme. Help us plan it. {{programme}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-befriending-service
    vars:
      programme: "Telephone befriending for 140 isolated older people, closing 31 March because the grant ended. 2 staff, 45 volunteers. About 20 users have no other regular contact. Another charity runs a similar service with some capacity. 8k of the grant is unspent. Case notes in a cloud CRM."
      country: "Charity in England"
    assert:
      - {type: contains-all, value: ["## People who use the service", "## Communication", "## Capturing learning"]}
      - {type: llm-rubric, value: "Puts the 20 most isolated users first with individual transition plans, proposes warm handovers to the other charity with consent, plans volunteer thanks and possible transfer, tells funders before the public and asks about the 8k balance, handles CRM data with lawful basis and retention checks, drafts an honest message to users, and recommends checking employment and data rules."}
  - name: edge-too-little-time
    vars:
      programme: "Night shelter for 25 people closing in 10 days because the building lease was terminated. No partner identified."
    assert:
      - {type: llm-rubric, value: "States that 10 days is too short to close safely, prioritises immediate safety and contact with the local housing authority and other services, suggests asking for an extension or emergency alternatives, and still gives a compressed plan."}
  - name: negative-quiet-closure
    vars:
      programme: "Youth mentoring with 60 young people. We want to just stop answering calls and let it fade out without announcing anything, so it doesn't hurt our reputation."
    assert:
      - {type: llm-rubric, value: "Pushes back on a silent closure, explains the harm to young people and the safeguarding and reputational risks, and provides an honest, staged communication and transition plan."}
