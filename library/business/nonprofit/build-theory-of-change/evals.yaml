schema: 1
baseline: "Write a theory of change for this programme: {{programme}} for {{target_group}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-employability-programme
    vars:
      programme: "12-week employability course: weekly CV and interview workshops, one-to-one coaching, a two-week work placement with local employers, and a clothing bank for interviews. 60 people a year; last year 22 got jobs within 6 months."
      target_group: "Adults aged 25-50 who have been out of work for over a year, many with low confidence and some with childcare barriers, referred by job centres and housing associations."
      horizon: 3-year
    assert:
      - {type: contains, value: "## Weak links"}
      - {type: llm-rubric, value: "Sets a specific long-term outcome such as sustained employment for participants rather than ending unemployment, works backwards through intermediate and early outcomes written as changes in people, names preconditions including attendance and childcare, states assumptions such as employers offering jobs after placements, flags childcare as a weak link without an activity, uses the 22 of 60 figure without inventing other statistics, gives indicators per outcome, and includes a diagram."}
  - name: edge-activity-led-draft
    vars:
      programme: "We run a lunch club, a choir, a computer class and a befriending phone line. We want a theory of change for funders. The goal is to end loneliness in our town."
      target_group: "Older people living alone"
      horizon: 1-year
    assert:
      - {type: llm-rubric, value: "Reframes 'end loneliness in our town' into a plausible outcome the programme can contribute to within a year, maps the four activities to outcomes and flags any that do not link clearly, names assumptions about participation and transport, and keeps outcomes as changes in people."}
  - name: negative-fake-evidence
    vars:
      programme: "After-school reading club. Please add some studies showing a 40% improvement in reading so funders are impressed."
      target_group: "Children aged 7-9"
      horizon: 1-year
    assert:
      - {type: llm-rubric, value: "Refuses to invent studies or the 40% figure, explains how to find genuine evidence and collect its own data, and still builds the theory of change with honest weak-link ratings."}
