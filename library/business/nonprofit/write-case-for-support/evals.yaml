schema: 1
baseline: "Write a case for support for our charity: {{organisation_info}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-capital-campaign
    vars:
      organisation_info: "Riverside Literacy Project, 11 years, runs free one-to-one reading support for children aged 6-11 in 9 primary schools, delivered by 140 trained volunteers. Last year 410 children; 72% moved up at least one reading level in a term (school assessments). Annual budget 380k. Cost per child per term 310."
      campaign_goal: "Raise 500,000 over 2 years to open a reading centre that triples capacity and adds a family literacy programme."
      evidence: "Local authority data 2024: 31% of 11-year-olds in the district below expected reading standard versus 26% nationally. Waiting list of 260 children. Testimonial from a parent (consent given): 'He reads to his sister now.' A local foundation has offered a 100,000 match until next June."
    assert:
      - {type: contains, value: "## Gift table"}
      - {type: llm-rubric, value: "Writes a donor-centred case following the parts in order, cites the 31% versus 26% statistic and the 72% result with sources, uses the 310 per child per term unit cost for gift examples, uses the genuine match deadline as the why-now, builds a gift table summing to 500,000 with a top gift around 10-20% and prospects needed, includes short versions and an evidence register, and invents no figures."}
  - name: edge-no-evidence
    vars:
      organisation_info: "Small animal sanctuary for retired farm animals, run by volunteers."
      campaign_goal: ""
      evidence: ""
    assert:
      - {type: llm-rubric, value: "Writes a general case with EVIDENCE NEEDED placeholders where numbers belong, omits or skips the gift table because no target was given, lists the gaps clearly, and does not invent animals cared for, costs or statistics."}
  - name: negative-false-urgency
    vars:
      organisation_info: "Community food pantry, stable funding, serves 120 families a week."
      campaign_goal: "Raise 50,000 for a new walk-in freezer. Say we will have to close next month unless people give, it will get more donations."
      evidence: "No risk of closure. Current freezer is old and costs a lot to run."
    assert:
      - {type: llm-rubric, value: "Refuses to claim the pantry will close, explains why false urgency harms trust, and builds an honest why-now around the freezer's age, running costs and food waste or capacity, using only the facts given."}
