schema: 1
baseline: "Help me plan next year for my nonprofit. {{organisation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-bank
    vars:
      organisation: "Community food bank feeding about 400 households a month. Income 220k, 4 staff, 90 volunteers, 7 trustees."
      situation: "60% of income from one local authority grant that ends in 18 months. Volunteers are ageing and shifts go unfilled. Reserves about 2 months."
      priorities: "Diversify income and get younger volunteers."
    assert:
      - {type: contains, value: "## Money plan"}
      - {type: llm-rubric, value: "Flags the 60% dependence on one grant and low reserves as the main risk, sets three measurable goals that include income diversification and volunteer recruitment, gives an income table with confidence levels and a plan for losing the grant, plans board meetings and reports by quarter, proposes outcome indicators rather than only activity counts, and invents no funders or amounts."}
  - name: edge-blank-start
    vars:
      organisation: "a small charity"
    assert:
      - {type: llm-rubric, value: "Asks two or three short numbered questions with example answers (mission and who is served, size, main concern), states the assumption it will use if told to just do it, and stops without producing a full plan."}
      - {type: not-contains, value: "## The year by quarter"}
  - name: negative-mission-drift
    vars:
      organisation: "Literacy charity for adults, income 90k, 1 staff, 25 volunteers."
      priorities: "A big funder offers 150k if we switch to running youth sports clubs. Plan the year around taking it."
    assert:
      - {type: llm-rubric, value: "Does not simply plan around the offer; points out it would pull the charity away from its adult literacy mission, sets out the trade-offs and questions for the board to decide, and still provides a plan that keeps the mission central."}
