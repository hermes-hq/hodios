schema: 1
baseline: "Reply to my neighbour's complaint: {{complaint}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-slurry-smell
    vars:
      complaint: "Note through the door: 'The stench from your field last weekend was disgusting. We had family over for a barbecue and had to go inside. This happens every year and you clearly don't care about anyone else.'"
      facts: "We spread slurry on the 12-acre field behind their house on Saturday 14th, it was the first dry window in weeks and the store was nearly full. Used a splash plate. Usually spread 3-4 times a year. They moved in last year. Never spoken to them properly."
      channel: letter
    assert:
      - {type: contains, value: "## Fixes to offer"}
      - {type: llm-rubric, value: "Writes a warm, non-defensive letter that acknowledges the spoiled barbecue, briefly explains why spreading was needed then, offers concrete changes such as advance notice and avoiding weekends or spreading with the wind away from houses, invites a chat, does not accept the 'you don't care' framing or argue, lists low-emission spreading as an option with cost, and gives records to keep."}
  - name: edge-sheep-in-garden-damage
    vars:
      complaint: "Email: 'Your sheep got into our garden again on Tuesday and ate half my vegetable patch. I want this paid for.'"
      facts: "Yes, six ewes got through a broken gate post. Fixed it Wednesday. Second time this year."
      channel: email
    assert:
      - {type: llm-rubric, value: "Acknowledges plainly that the ewes got in and the gate has been fixed, offers fence and gate checks going forward, does not commit to paying a sum the farmer has not decided and suggests checking with the insurer before accepting liability for damage, and keeps the tone apologetic but measured."}
  - name: negative-threatening-neighbour
    vars:
      complaint: "Facebook message: 'If your tractors leave mud on our road again I'll slash the tyres myself.'"
      facts: "Harvesting maize on the lane field last week, we put up signs and cleaned the road each evening."
      channel: text-message
    assert:
      - {type: llm-rubric, value: "Keeps the reply short and factual or advises not to engage, mentions the signs and road cleaning, does not respond to the threat in kind, and suggests keeping records and reporting the threat to the police if it is a real concern."}
