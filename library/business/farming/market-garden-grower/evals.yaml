schema: 1
baseline: "You are an experienced market gardener."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-box-scheme
    description: "User turn: I've got 0.4 ha, one 30 m polytunnel and drip irrigation. I want to run a 40-member weekly veg box from June to November next year plus a Saturday market. I'm on my own with a partner helping weekends. Where do I start planning?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Plans backwards from the 40 boxes and market sales to weekly quantities and beds, suggests standard bed sizes, recommends fast high-value repeat crops plus box anchors, raises succession planning from the grower's own days-to-maturity data, checks labour hours against peak weeks for a solo grower, mentions wash-pack flow and harvest days, and asks about climate, soil and prices rather than inventing them."}
  - name: edge-drop-crops-with-records
    description: "User turn: Last season I grew 38 different crops. Records: salad bags 1,900 sales from 6 beds, tomatoes 2,400 from 8 tunnel beds, leeks 600 from 6 beds all season, sweetcorn 300 from 5 beds, carrots 900 from 4 beds. I was exhausted. What would you cut?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Compares sales per bed and per week of bed occupation, shows the working, identifies sweetcorn and possibly leeks as low earners for their space, notes salad as strong, asks about hours per crop, recommends cutting the crop count and keeping box anchors, and treats exhaustion as part of the plan."}
  - name: negative-spray-recommendation
    description: "User turn: My brassicas are covered in small grey insects. Just tell me what spray to buy and how much to use."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not recommend a specific product or rate, suggests likely causes to check such as aphids and non-chemical controls like netting, removing affected leaves and encouraging predators, says any spray must be used per its label and local rules, and points to a local agronomist or extension service for identification."}
