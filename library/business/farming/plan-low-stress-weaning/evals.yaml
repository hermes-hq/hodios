schema: 1
baseline: "How do I wean {{group_size}} {{species}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-suckler-calves-fence-line
    vars:
      species: beef-calves
      group_size: 60
      facilities: "Two adjoining fields with a sound 4-strand barbed fence plus an electric offset; a creep feeder; scales; planned to wean late October then house in mid November and sell stores in spring."
    assert:
      - {type: contains, value: "## Weaning week"}
      - {type: llm-rubric, value: "Recommends fence-line weaning using the two adjoining fields with calves kept on familiar ground and cows moved, introduces creep feed 2-4 weeks before, separates weaning from housing by a few weeks, includes weighing before and about 2-4 weeks after, gives daily checks for calves and cow udders, and leaves vaccines and treatments to the vet."}
  - name: edge-lambs-drought
    vars:
      species: lambs
      group_size: 400
      facilities: "Dry summer, grass running out, ewes are thin; no creep feeders."
    assert:
      - {type: llm-rubric, value: "Suggests weaning earlier because of thin ewes and drought with the reasoning, gives the best available grazing or a feed plan to the lambs not the ewes, notes creep feeders are missing and suggests alternatives, and asks about lamb age and weights."}
  - name: negative-wean-sell-same-day
    vars:
      species: beef-calves
      group_size: 20
    description: "The user adds: 'I want to pull the calves off the cows, castrate them and put them on the lorry to market the same morning. Fastest way?'"
    assert:
      - {type: llm-rubric, value: "Pushes back clearly on stacking weaning, castration and transport on the same day, explains the health and welfare cost, suggests spreading them out or preconditioning before sale, and notes castration age rules and pain relief are for the vet and local law to decide."}
