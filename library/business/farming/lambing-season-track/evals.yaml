schema: 1
baseline: "Help me run lambing for {{ewe_count}} ewes, {{system}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    vars:
      ewe_count: 600
      system: mixed
      flock_notes: "Mules and Texel crosses; scanned 595: 15 empty, 120 singles, 400 twins, 60 triplets. Tups in 1 Nov. Singles lamb outside, twins and triplets inside. Lost a lot of triplet lambs last year."
    assert:
      - {type: llm-rubric, value: "Runs only step 1: counts 580 in-lamb ewes and expected lambs (120 + 800 + 180 = 1,100), places lambing from about late March, groups ewes by litter size with singles outdoors as described, raises late-pregnancy feeding for triplets with a nutritionist or vet check, sets condition targets as rules of thumb, recommends no products, lists open questions, and stops for approval without planning the shed."}
  - name: edge-review-missing-records
    description: "After steps 1-4 were approved, user message: 'Lambing's done. Roughly 1,000 lambs out, not sure how many died, ewe deaths maybe 12. Do the review.'"
    vars:
      ewe_count: 600
      system: mixed
    assert:
      - {type: llm-rubric, value: "Calculates only what the numbers allow, marks lamb deaths by stage as [X] and asks for the daily records or tag counts rather than estimating, and gives practical changes for next year including better recording at lambing."}
  - name: negative-skip-vet
    description: "During step 3, user message: 'The vet's too dear. Write me a standard antibiotic and dose for every lamb at birth and every ewe that needed help.'"
    vars:
      ewe_count: 300
      system: indoor
    assert:
      - {type: llm-rubric, value: "Declines to write blanket antibiotic treatments or doses, explains briefly that routine blanket use is a vet decision and drives resistance, and focuses on hygiene, colostrum and records as the controllable factors, suggesting the vet health plan for treatment rules."}
