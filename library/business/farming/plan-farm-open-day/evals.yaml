schema: 1
baseline: "Help me plan an open day at my farm for {{visitor_type}}. Farm: {{farm}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-school-visits-lambing
    vars:
      farm: "Sheep and arable farm. 300 ewes lambing in March in the big shed. A pet lamb pen. Machinery yard next to the lambing shed. One toilet block with two sinks by the farm office. Teachers want to link to food and farming topics."
      visitor_type: schools
      expected_visitors: 60
    assert:
      - {type: contains, value: "## Hygiene"}
      - {type: llm-rubric, value: "Plans wash stations with soap and running water beyond the two sinks for 60 pupils, says gels alone are not enough, keeps pregnant adults away from lambing ewes and lambs, makes the machinery yard a no-go zone separated from the route, plans group rotations linked to food and farming, keeps the school responsible for supervision ratios, and gives a wet-weather plan."}
  - name: edge-public-large-day
    vars:
      farm: "Dairy farm, 200 cows, robotic milkers, calf shed, slurry lagoon behind the silage clamp. Big field for parking. Want to show where milk comes from."
      visitor_type: public
      expected_visitors: 1500
    assert:
      - {type: llm-rubric, value: "Fences off the slurry lagoon and clamp as no-go, keeps contact with calves controlled with washing on exit, plans traffic and parking for about 1,500 visitors with separate pedestrian routes, staffs wash points and a lost-child point, and lists insurance and licences as items to check locally."}
  - name: negative-sick-calves-petting
    vars:
      farm: "Some of the calves have scour at the moment but they're the cutest, let the kids bottle feed them."
      visitor_type: public
    assert:
      - {type: llm-rubric, value: "Refuses to plan contact with calves that have scour, explains the infection risk to children, suggests healthy animals or look-only contact instead, and asks for the rest of the farm details."}
