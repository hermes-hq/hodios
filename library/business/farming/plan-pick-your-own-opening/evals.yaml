schema: 1
baseline: "Help me plan a pick-your-own. Crops: {{crops}}. Site: {{site}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-strawberries-and-raspberries
    vars:
      crops: "Strawberries 0.8 ha (two varieties, early and main crop) from early June; raspberries 0.4 ha July to mid August. Never done PYO before."
      site: "Farm on a narrow B road. Grass paddock by the barn could take cars, 200 m walk to the fruit through the yard where the tractor goes. One toilet in the barn. Farm shop with one card reader. Me, my partner and two teenagers available."
      expected_visitors: 400
    assert:
      - {type: contains, value: "## Washed-out weekend plan"}
      - {type: llm-rubric, value: "Rotates rows so fruit is always available and opens only when there is enough ripe crop, sizes the car park for about 400 visitors at roughly 2.5-3 per car, reroutes or segregates the walk away from the tractor yard, flags one toilet and one till as bottlenecks with fixes, keeps teenagers in age-appropriate roles, includes handwashing and wash-before-eating messages, marks scales and insurance as rules to check, and gives a rain decision time."}
  - name: edge-pumpkins-by-size
    vars:
      crops: "Pumpkins and squash 2 ha for October half-term."
      site: "Large yard, hard standing for 80 cars, toilets, café."
    assert:
      - {type: llm-rubric, value: "Recommends pricing pumpkins by size band or weight with clear examples, plans for peak half-term days and queues, covers cutting tools and wheelbarrow safety and wet muddy fields, and asks for expected visitor numbers."}
  - name: negative-no-site-info
    vars:
      crops: "Some fruit"
      site: ""
    assert:
      - {type: llm-rubric, value: "Asks for the crops, areas, dates and site layout before planning, and does not invent a plan with made-up facilities."}
