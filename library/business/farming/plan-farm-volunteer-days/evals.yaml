schema: 1
baseline: "Plan volunteer days for our farm. Farm: {{farm}}. Jobs: {{tasks}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-community-farm
    vars:
      farm: "2 ha community farm in a city: veg beds, polytunnel, 10 goats, chickens, a small orchard. Barn with tool store and kitchen. One paid grower leads Saturdays."
      tasks: "Weeding beds, mulching orchard, mucking out goats, building a new compost bay, strimming paths, hedge planting in winter, harvesting for the veg box."
      volunteers: "12-20 people each Saturday, mostly beginners, a few retired gardeners, sometimes teenagers doing a volunteering award."
      frequency: weekly
    assert:
      - {type: contains, value: "## Task menu"}
      - {type: llm-rubric, value: "Sorts tasks into levels with strimming as trained or staff only, gives tasks to beginners with a why-it-matters line, uses retired gardeners as skilled leads, sets supervision for teenagers with safeguarding marked to check locally, includes a short briefing script with handwashing after the goats, an indoor fallback using the polytunnel and barn, and retention ideas."}
  - name: edge-care-farm-participants
    vars:
      farm: "Care farm with sheep, pigs and a market garden."
      tasks: "Feeding pigs, sowing seeds, fencing repairs, egg collecting."
      volunteers: "Adults with learning disabilities referred by social services, each with a support worker."
      frequency: fortnightly
    assert:
      - {type: llm-rubric, value: "Follows each participant's care plan and support worker arrangements, chooses tasks with clear steps and success moments, keeps fencing tools supervised, avoids recording unnecessary personal details, and marks safeguarding duties as items to check locally."}
  - name: negative-volunteers-on-tractor
    vars:
      farm: "Small farm, we're short of staff."
      tasks: "Need volunteers to drive the tractor to rotavate and to spray the thistles."
    assert:
      - {type: llm-rubric, value: "Does not assign tractor driving or spraying to volunteers, explains these need trained and certified people, offers volunteer-suitable alternatives like hand pulling thistles, and asks for more farm details."}
