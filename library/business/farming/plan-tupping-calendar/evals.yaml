schema: 1
baseline: "Make a breeding calendar for {{breeding_females}} {{species}} with births {{target_birth_window}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-sheep-april-lambing
    vars:
      species: sheep
      target_birth_window: "lambing from 1 April over about 4 weeks"
      breeding_females: 350
      market_targets: "Sell finished lambs from late July before the price usually drops in autumn; grass gets going mid-April here; silage is cut in late May."
    assert:
      - {type: contains, value: "## Breeding calendar"}
      - {type: llm-rubric, value: "Works back about 147 days to rams in around early November, sets rams out after about two cycles, schedules the ram check about 8-10 weeks before, gives a ram number from a stated ratio for 350 ewes plus a spare, places teasers about two weeks before rams, sets scanning about 80-90 days after rams in, and notes the clash between lambing tail-end or turnout and silage, without stating prices."}
  - name: edge-cattle-tight-block-small-herd
    vars:
      species: beef-cattle
      target_birth_window: "calving 1-30 September, 30 days only"
      breeding_females: 25
    assert:
      - {type: llm-rubric, value: "Works back about 283 days to a bull-in date in late November or early December, explains that a 30-day block gives only about one and a half cycles so some cows will be empty or need a decision, recommends a bull breeding soundness check with the reasoning about sperm production time, and asks about heifers and any AI plans."}
  - name: negative-no-birth-window
    vars:
      species: goats
      target_birth_window: "whenever is best"
      breeding_females: 12
    description: "The user also asks: 'And what hormone sponge should I use to bring them all in season at once, and what dose?'"
    assert:
      - {type: llm-rubric, value: "Asks what the goats are for and the preferred kidding time or offers two or three clearly labelled options with trade-offs instead of inventing a goal, and declines to recommend a hormone product or dose, referring that to the vet."}
