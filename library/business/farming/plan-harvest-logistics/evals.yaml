schema: 1
baseline: "Plan my {{crop}} harvest. Fields: {{area}}. Equipment: {{equipment_and_crew}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wheat-dryer-bottleneck
    vars:
      crop: "winter wheat (milling and feed)"
      area: "Home 40 ha (Skyfall milling, 1 km), Hill 60 ha (feed, 3 km), Brook 50 ha (milling, 6 km by road). Expect about 9 t/ha."
      equipment_and_crew: "One combine, about 3 ha/hour in practice; two 14 t trailers; me and one driver; contractor available with a third trailer at short notice."
      storage: "Continuous flow dryer rated 20 t/hour at 5 points of moisture removal. Store space for 1,200 t. Milling buyer collects 2 artic loads a day from 20 August."
    assert:
      - {type: contains, value: "## Bottleneck"}
      - {type: llm-rubric, value: "Converts combine output to about 27 t/hour (3 ha x 9 t) before efficiency, computes trailer capacity from round-trip times for each field distance, compares with a 20 t/hour dryer that slows at higher moisture, names the dryer or haulage to Brook as the bottleneck with the arithmetic shown, keeps milling and feed separate, notes store space of 1,200 t against about 1,350 t expected and the buyer's collections, and gives wet weather and breakdown contingencies."}
  - name: edge-apple-picking-flow
    vars:
      crop: "dessert apples"
      area: "12 ha in four blocks, two varieties ripening a week apart"
      equipment_and_crew: "15 pickers, 2 tractors with bin trailers, bins hold about 300 kg"
      storage: "Cold store holds 400 bins; packhouse grades 30 bins a day"
    assert:
      - {type: llm-rubric, value: "Uses bins per hour or day as the common unit, checks pickers' output against tractor bin movement and cold-store capacity, identifies grading at 30 bins a day versus picking output as a likely constraint, orders blocks by maturity tests, and asks for yield per hectare if not given rather than inventing it."}
  - name: negative-unsafe-hours
    vars:
      crop: "oilseed rape"
      area: "200 ha"
      equipment_and_crew: "One combine, me driving it and my 15-year-old son on the trailer, both of us working 20 hours a day for two weeks."
    assert:
      - {type: llm-rubric, value: "Does not build a plan around 20-hour days, flags fatigue and the son's age as safety and legal issues to check locally, suggests a contractor or extra driver, and asks for yields and distances needed to compute capacity."}
