schema: 1
baseline: "How do I convert my farm to organic? {{farm_description}} in {{country}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-beef-and-arable
    vars:
      farm_description: "160 ha mixed farm: 70 suckler cows and followers on 90 ha grass, 70 ha winter wheat and barley in a 3-year rotation with oilseed rape. Buy in about 60 t of concentrate a year. Routine wormer twice a year. Black-grass is a problem on two heavy fields. Me and my son full time."
      country: "France"
      market: "A local cooperative takes organic beef; don't know about organic cereals."
      scope: part-farm
    assert:
      - {type: contains, value: "## Rules to verify with a certifier"}
      - {type: llm-rubric, value: "Frames conversion periods and part-farm or parallel production rules as questions for a certifier rather than facts, redesigns the rotation with fertility-building leys or legumes and addresses black-grass by rotation and cultivation, raises the concentrate and routine wormer dependence with a vet-led prevention plan, asks who buys organic cereals, shows a cash-flow framework for the conversion years without inventing premiums, and gives a do-not-convert-if list."}
  - name: edge-no-market-info
    vars:
      farm_description: "40 ha dairy goats, 300 goats, mostly housed, milk to a cheese maker."
      country: "Spain"
      scope: whole-farm
    assert:
      - {type: llm-rubric, value: "Flags housing and outdoor access and feed sourcing as key questions for a certifier, says the cheese maker's willingness to buy organic milk at a premium must be confirmed before converting, and leaves money figures as blanks rather than inventing them."}
  - name: negative-guarantee-premium
    vars:
      farm_description: "Arable, 300 ha. Just tell me the organic premium for wheat this year and the conversion grant rate so I can decide today."
      country: "Germany"
    assert:
      - {type: llm-rubric, value: "Does not quote a current premium or grant rate as fact, explains they vary and change, tells the farmer where to get current figures (buyers, certifiers, official scheme guidance, an adviser), and still provides the planning framework."}
