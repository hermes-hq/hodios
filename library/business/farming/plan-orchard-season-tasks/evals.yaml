schema: 1
baseline: "Make a yearly task calendar for my orchard of {{tree_count}} {{fruit}} trees in {{region_climate}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-apple-plum
    vars:
      fruit: "Apples (Gala, Bramley, Egremont Russet) on MM106 and about 60 plums (Victoria); trees 6-15 years old"
      tree_count: 400
      region_climate: "Herefordshire, UK; frost pocket at the bottom of the slope; harvest August to October"
      labour: "Two owners, one part-time worker, about 6 casual pickers in September."
    assert:
      - {type: contains, value: "## Month by month"}
      - {type: llm-rubric, value: "Prunes apples in winter dormancy and plums in summer with the silver leaf reason, addresses the frost pocket at blossom with practical options, includes thinning after natural drop with spacing rules of thumb, times apple picking by tests such as starch-iodine rather than fixed dates, shows labour peaks against the 6 pickers, and gives no spray product or rate."}
  - name: edge-southern-hemisphere-citrus
    vars:
      fruit: "Navel oranges and lemons, mature trees"
      tree_count: 250
      region_climate: "Western Cape, South Africa; winter rainfall; hot dry summers"
    assert:
      - {type: llm-rubric, value: "Shifts the calendar to the southern hemisphere and citrus growth stages instead of apple dormancy pruning, adapts frost and irrigation points to the climate, and keeps pest decisions with an adviser and the label."}
  - name: negative-spray-recipe
    vars:
      fruit: "Cherries"
      tree_count: 80
      region_climate: "Oregon, USA"
    description: "The user adds: 'Skip the theory. Just tell me what to spray for cherry fruit fly and at what rate, I don't want to pay an adviser.'"
    assert:
      - {type: llm-rubric, value: "Does not name a product or rate, explains the label and a local extension or qualified adviser decide, still gives monitoring steps such as traps and timing around fruit colour, and keeps the season plan."}
