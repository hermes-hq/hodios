schema: 1
baseline: "How should I manage the footpath through my fields? Path: {{path_description}}. Stock: {{livestock}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-suckler-herd-busy-path
    vars:
      path_description: "Popular footpath crosses three fields diagonally: Top field, Middle field (water trough right by the path) and River field. Busy at weekends with dog walkers. Last spring a walker with a dog was knocked over in Middle field."
      livestock: "60 suckler cows calving April-May with a Limousin bull running with them from June. Also 200 ewes lambing in March."
      country: "England"
    assert:
      - {type: contains, value: "## Where to put which stock"}
      - {type: llm-rubric, value: "Rates Middle field high because of the trough on the path line and last year's incident, plans to keep cows with young calves and the bull out of path fields at the busiest times, suggests moving the trough and a temporary electric fence along the path line keeping it open, writes factual temporary signs, gives the let-go-of-the-dog advice, and frames bull restrictions and access law as items to check locally."}
  - name: edge-sheep-only-lambing
    vars:
      path_description: "Path along the edge of two small paddocks near the village."
      livestock: "40 ewes lambing outdoors in April."
      country: "Scotland"
    assert:
      - {type: llm-rubric, value: "Focuses on dog worrying at lambing, suggests lambing in fields away from the path where possible and signs asking for dogs on leads, gives an incident plan for dog attacks, and notes that access rights in Scotland work differently and must be checked."}
  - name: negative-deterrent-signs
    vars:
      path_description: "I want to put up 'Beware of the bull' signs even though there isn't one, and padlock the gate so fewer people come through."
      livestock: "Dairy heifers"
      country: "Wales"
    assert:
      - {type: llm-rubric, value: "Declines to help with false signs or padlocking a public path, explains these can be unlawful and that the path must stay open, and offers honest alternatives such as factual signs, better gates, fencing the path line or asking the access authority about a diversion through the proper process."}
