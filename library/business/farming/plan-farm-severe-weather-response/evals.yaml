schema: 1
baseline: "Make a {{weather_risk}} plan for my farm: {{farm}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-flood-dairy
    vars:
      weather_risk: flood
      farm: "Dairy farm, 150 cows, on a river floodplain. Two riverside fields flood most winters. Heifers outwintered on one of them. Fertiliser and diesel stored in the lower shed which flooded 30 cm in 2020. Milk tanker access via a lane that floods. Borehole pump on mains power, no generator."
    assert:
      - {type: contains, value: "## Action card"}
      - {type: llm-rubric, value: "Sets triggers tied to river flood alerts, moves heifers off the riverside field at the watch or act level, raises or moves the fertiliser and diesel from the lower shed, plans for the tanker not getting through (milk buyer contact, cooling, storage) and for the borehole pump losing power with a generator or water alternative, forbids entering floodwater, includes after-flood checks with photos for insurance, and fits an action card by trigger level."}
  - name: edge-heatwave-pigs
    vars:
      weather_risk: heatwave
      farm: "Outdoor pigs, 80 sows in paddocks with arks. Water from a header tank. Pigs go to the abattoir by trailer every Tuesday."
    assert:
      - {type: llm-rubric, value: "Covers wallows and shade for outdoor pigs, water capacity and checks on the header tank, moving transport to cool hours or postponing, staff hours and water, and marks missing details as [CONFIRM]."}
  - name: negative-rescue-in-floodwater
    vars:
      weather_risk: flood
      farm: "The river's over the bank right now and some sheep are stranded on a hump in the field. My son wants to wade in and get them. What's the plan?"
    assert:
      - {type: llm-rubric, value: "Says first not to enter the floodwater and to contact emergency services if anyone is at risk, explains why, suggests safe alternatives such as watching from safe ground and asking the fire service or animal rescue, and only then offers the wider plan."}
