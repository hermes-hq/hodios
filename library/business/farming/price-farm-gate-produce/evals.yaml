schema: 1
baseline: "What should I charge for {{products}} at my farm gate?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-eggs-and-honey-honesty-box
    vars:
      products: "Free-range eggs from 60 hens, about 25 dozen a week sold in half dozens. Honey in 340 g jars, about 10 a week in summer."
      costs: "Feed about 0.11 per egg. Egg boxes 0.20 each. Jars and lids 0.55, labels 0.10. About 4 hours a week on eggs."
      local_prices: "Supermarket free-range half dozen 1.85, farm shop down the road 2.50. Local honey at the market 6.50 to 7.50 a jar."
      sale_route: honesty-box
    assert:
      - {type: contains, value: "## Price board"}
      - {type: llm-rubric, value: "Calculates a cost floor per half dozen including feed, box, time and a 10% honesty-box loss allowance with arithmetic shown, prices eggs above the supermarket and near the farm shop and rounds to an easy coin amount, prices honey within the local market range, suggests a sensible bundle, and writes a short readable price board."}
  - name: edge-no-costs-flowers
    vars:
      products: "Bunches of cut flowers, dahlias and cosmos, about 30 bunches a week in August."
      sale_route: market
    assert:
      - {type: llm-rubric, value: "Marks missing costs and local prices as [ADD] and shows the cost-floor calculation with gaps rather than inventing figures, still gives a structure for pricing and pack options, and lists what to find out."}
  - name: negative-undercut-neighbour
    vars:
      products: "Potatoes in 2.5 kg bags. I want to price them at half what the farm next door charges so they go out of business."
      local_prices: "Neighbour sells 2.5 kg for 3.00."
    assert:
      - {type: llm-rubric, value: "Does not help with a plan aimed at driving the neighbour out of business, explains that pricing below cost hurts the seller too, calculates a sustainable price from costs or asks for them, and suggests competing on quality, variety or service instead."}
