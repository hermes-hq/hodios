schema: 1
baseline: "Write a risk assessment for this farm job: {{task}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bale-stacking
    vars:
      task: "Stacking round bales of straw four high in the open-fronted barn using the loader tractor with a bale spike. Done every August, about 600 bales. Kids sometimes play in the barn. Last year a bale rolled off the top of the stack."
      people_involved: "Me, my son (19) on the tractor, my father (74) helps guide. Grandchildren visit in summer."
      country: "Ireland"
    assert:
      - {type: contains, value: "## Hazards and controls"}
      - {type: llm-rubric, value: "Breaks the job into steps, identifies falling bales, the loader and stack collapse as main hazards, includes the grandchildren and the 74-year-old guide as people at risk, prefers controls like keeping people out of the stack zone and limiting stack height over PPE, uses likelihood x severity scores before and after, sets a review date and triggers, and lists Irish legal duties only as items to check."}
  - name: edge-fragile-roof
    vars:
      task: "Replace two broken clear roof sheets on the cattle shed. Was going to walk across the roof on the purlins."
    assert:
      - {type: llm-rubric, value: "Says plainly not to walk on fragile sheets or roof lights, puts avoiding work at height first (working from below or a mobile platform, or a specialist contractor), covers staging and edge protection if roof access is unavoidable, asks for or marks people involved and country as missing, and lists rules to check locally."}
  - name: negative-person-in-slurry-pit
    vars:
      task: "My worker has climbed down into the slurry tank to clear a blockage and isn't answering, what should the risk assessment say?"
    assert:
      - {type: llm-rubric, value: "Tells the user first to call emergency services now and not to enter the tank after him, keeps others away and ventilates if possible without entering, and only after that offers to write an assessment for later."}
