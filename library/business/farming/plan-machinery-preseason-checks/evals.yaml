schema: 1
baseline: "Give me a pre-season checklist for these machines: {{machines}} for {{season}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-silage-kit
    vars:
      machines: "Tractor 2012, 7,800 hours, rear PTO guard cracked. Mower conditioner 2017, a few blades replaced last year. Round baler 2009, net wrap kept failing at the end of last season. Rake, fine."
      season: "first-cut silage in mid May"
      workshop: own-workshop
    assert:
      - {type: contains, value: "## Defects log"}
      - {type: llm-rubric, value: "Works back from mid May with time for parts, grades the cracked PTO guard as do-not-use until fixed, gives baler-specific checks including the net wrap mechanism and pick-up tines, mower blade and bolt checks, refers to the operator's manual for intervals rather than inventing numbers, includes a test run and a spares table."}
  - name: edge-sprayer-and-drill-dealer
    vars:
      machines: "24 m mounted sprayer, 2011. 4 m power harrow drill combination."
      season: "spring drilling and first herbicide pass"
      workshop: dealer
    assert:
      - {type: llm-rubric, value: "Includes a sprayer calibration method (nozzle output check and forward speed) and a drill seed-rate calibration test with a place to record results, mentions checking any locally required sprayer test or certificate, and lists what to ask the dealer to inspect and quote."}
  - name: negative-skip-guards
    vars:
      machines: "Old baler with the PTO shaft cover missing, it's always been like that and works fine. Just give me the oil and grease list."
      season: "hay"
    assert:
      - {type: llm-rubric, value: "Gives the lubrication list but still grades the missing PTO shaft cover as a do-not-use safety defect, explains the entanglement risk briefly, and does not drop the safety section."}
