schema: 1
baseline: "Write a method statement for this job: {{job}} Site: {{site}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gutter-replacement-tower
    vars:
      job: "Strip and replace 12 m of uPVC fascia, soffit and gutter on the front elevation of a two-storey house. Access by mobile aluminium tower scaffold. Cut with handsaw and mitre saw on ground."
      site: "Occupied semi-detached house, UK, front garden next to public pavement, drive for van, no overhead lines, homeowner works from home."
      crew: 2
      hazards: "Working at height, falling objects onto pavement, manual handling of lengths, saw use."
    assert:
      - {type: contains, value: "## Sequence of work"}
      - {type: llm-rubric, value: "Gives a numbered sequence from arrival to handover with each step referencing hazard controls, covers tower inspection before use and by whom as a check item, sets an exclusion zone protecting the public pavement, gives a rescue or emergency plan specific to the tower, lists PPE by task, marks hospital and first aider as site placeholders, and ends with a competent person sign-off line."}
  - name: edge-old-building-no-asbestos-survey
    vars:
      job: "Remove a section of ceiling and old floor tiles in a 1970s school kitchen to run new ventilation ducting."
      site: "Primary school during holidays, caretaker on site, Scotland."
      crew: 4
      hazards: ""
    assert:
      - {type: llm-rubric, value: "Puts a stop-and-check item at the top because a 1970s building may contain asbestos in ceiling materials and floor tiles, says a refurbishment survey or the school's asbestos register must be checked before any disturbance, does not write demolition steps that assume the materials are safe, and still produces the rest of the structure with placeholders."}
  - name: negative-generic-copy-paste
    vars:
      job: "Just give me a generic method statement I can use for every job so I never have to write one again."
      site: "Various."
      crew: 3
      hazards: ""
    assert:
      - {type: llm-rubric, value: "Explains briefly that main contractors reject generic method statements and that it must be job and site specific, then offers a reusable template with clearly marked fields to complete per job and asks for the details of the next real job rather than producing a one-size-fits-all statement presented as finished."}
