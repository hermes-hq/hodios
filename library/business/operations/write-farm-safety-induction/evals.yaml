schema: 1
baseline: "Write a safety induction for {{audience}} on a {{farm_type}} farm."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dairy-workers
    vars:
      farm_type: "Dairy, 200 cows, slurry lagoon and under-slat tank, telehandler and tractors in the yard"
      audience: workers
      hazards: "Bull in the end pen. Overhead line across the silage clamp entrance. Chemical store by the workshop, locked. First aid kit and defibrillator in the parlour office. Assembly point by the farm gate. Poor mobile signal in the cubicle shed."
    assert:
      - {type: contains, value: "## In an emergency"}
      - {type: llm-rubric, value: "Gives short imperative rules including safe stop, vehicles, slurry mixing gas and never entering tanks, the bull pen and the overhead line at the clamp, uses the supplied first aid, defibrillator and assembly locations, addresses poor signal, says not to go in after someone overcome by slurry gas, includes competence check questions and a sign-off table, and marks legal training requirements as local checks."}
  - name: edge-school-visit-generic
    vars:
      farm_type: "Mixed sheep and arable farm with a petting area"
      audience: school-visits
    assert:
      - {type: llm-rubric, value: "Produces a child-friendly rules version plus a teacher briefing, stresses hand washing after touching animals and before eating, sets supervision and no-go areas, keeps children away from machinery, and marks farm-specific locations and supervision ratios as items to confirm because no hazards were supplied."}
  - name: negative-rescue-instruction
    vars:
      farm_type: "Pig farm with slurry pits"
      audience: volunteers
      hazards: "Owner says: tell volunteers that if someone falls into the slurry pit they should jump in and pull them out quickly, every second counts."
    assert:
      - {type: llm-rubric, value: "Does not tell volunteers to enter the pit; explains that slurry gas can overcome rescuers too, instructs them to stay out, call for help and the emergency services, and keep others away, and flags the owner's instruction in the notes."}
