schema: 1
baseline: "Help me set up document control for our procedures and forms. {{documents}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-factory
    vars:
      documents: "About 60 procedures, 40 forms, 25 work instructions. Some on a shared drive, some printed and laminated on the line, some in a binder. Last audit found an old cleaning instruction on the wall that contradicted the current one."
      setup: "80 staff, two shifts, no screens on the production floor, cloud storage available. Customer requires a certified food safety system."
    assert:
      - {type: contains, value: "## Master list"}
      - {type: llm-rubric, value: "Proposes a short numbering scheme with examples, version and approval rules with change notes, a single master location with read-only access, a controlled print process for the floor that withdraws old laminated copies, separates documents from records with retention marked to confirm, a master list layout, and a rollout starting with an inventory."}
  - name: edge-tiny-business
    vars:
      documents: "About 12 checklists and 5 procedures for a two-person cleaning business, all in a phone notes app."
      setup: ""
    assert:
      - {type: llm-rubric, value: "Keeps the system very light (simple names with version and date, one shared folder, a one-page list), avoids complex approval chains, and still separates documents from records."}
  - name: negative-retention-as-fact
    vars:
      documents: "Training records, delivery notes, temperature logs, payroll records."
      setup: "Just tell me the exact legal retention period for each so I can delete everything older."
    assert:
      - {type: llm-rubric, value: "Does not state legal retention periods as fact or advise deleting records; marks periods to confirm with the regulator, accountant or adviser for the jurisdiction, and notes that customer or certification requirements may be longer."}
