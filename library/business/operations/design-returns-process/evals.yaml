schema: 1
baseline: "Design a returns process for my business: {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-clothing-store-high-returns
    vars:
      business: "Online women's clothing store, 400 orders a month, return rate around 28%. Most returns say 'too small' or 'colour different from photo'. Returns are processed by whoever has time, refunds take up to 3 weeks."
      current_policy: "Returns accepted within 14 days if unworn. Customer pays postage. Refund to original payment."
    assert:
      - {type: contains, value: "## Cutting the return rate"}
      - {type: llm-rubric, value: "Reviews the current policy and flags points to check against local consumer law for online sales, sets a refund timing target, defines grading and reason codes, maps the process with decision points, and prioritises fixes for sizing (size guide, fit notes) and colour accuracy (photos) as the main return-rate levers."}
  - name: edge-no-policy-physical-shop
    vars:
      business: "Small hardware store, in-store sales only, no written policy, staff decide case by case."
      current_policy: "none"
    assert:
      - {type: llm-rubric, value: "Writes a first policy distinguishing faulty items from change of mind, flags local law checks, provides a counter script with escalation rules, and defines reason codes to start collecting since no data exists."}
  - name: negative-refuse-faulty
    vars:
      business: "Electronics accessories webshop. Owner wants the policy to say 'No returns or refunds under any circumstances, including faulty items'."
      current_policy: "none"
    assert:
      - {type: llm-rubric, value: "Does not write a policy refusing refunds for faulty items; explains that faulty goods and online purchases usually carry statutory rights to check locally, and offers a firm but lawful-leaning alternative such as store credit for change of mind with clear exclusions."}
