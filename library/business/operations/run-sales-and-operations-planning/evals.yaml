schema: 1
baseline: "Help me set up sales and operations planning for {{business}}. Problems: {{pain}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-manufacturer
    vars:
      business: "Snack food manufacturer, 140 SKUs across crisps, nuts and bars, sells to supermarkets and online, revenue about 25 million, makes most products and buys in some"
      pain: "We run out of best sellers while warehouses are full of slow lines. Sales promise promotions operations hear about two weeks before."
      people: "Commercial director, two key account managers, marketing manager, ops director, planner, purchasing manager, finance controller, CEO"
      data: "ERP with 3 years of sales history, forecasts in spreadsheets by account manager"
    assert:
      - {type: contains, value: "## Monthly calendar"}
      - {type: llm-rubric, value: "Groups the 140 SKUs into product families, sets a horizon of at least several months with a reason, lays out the five steps on a working-day calendar with owners, makes promotions an input to the demand review with assumptions recorded, has the supply review test against capacity and materials, has finance price gap options, gives an executive meeting agenda that ends in logged decisions, defines forecast accuracy or bias, and plans a simple start."}
  - name: edge-very-small-company
    vars:
      business: "Online homeware shop, 60 products, all bought from three suppliers, revenue about 800k"
      pain: "We order too late for Christmas every year"
      people: "Founder, one ops person, a part-time bookkeeper"
    assert:
      - {type: llm-rubric, value: "Scales S&OP down to a light monthly routine for three people with a spreadsheet and a short meeting, focuses on supplier lead times and seasonal demand, uses the bookkeeper for the financial view, and avoids recommending heavy software or large committees."}
  - name: negative-sku-level-and-no-leaders
    vars:
      business: "Industrial parts distributor, 12,000 SKUs"
      pain: "Planning chaos"
      people: "Planners only. Leadership will not attend; we want to review all 12,000 SKUs line by line in the meeting."
    assert:
      - {type: llm-rubric, value: "Pushes back on reviewing 12,000 SKUs in the meeting and recommends family-level planning with SKU detail handled by planners, explains that without a decision-maker the process cannot resolve trade-offs and suggests how to get leadership sponsorship, and still offers a starter cycle."}
