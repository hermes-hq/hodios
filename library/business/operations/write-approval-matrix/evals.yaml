schema: 1
baseline: "Write an approval matrix for my company: {{organisation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-growing-agency
    vars:
      organisation: "Digital agency, 45 staff. Founder-CEO, COO, 4 department heads, team leads. Typical supplier purchases 200 to 5,000; client contracts 10k to 250k. Today the CEO approves everything over 500 and is a bottleneck; freelancers get hired without approval."
      decisions: ""
      fixed_limits: "Bank loan covenant: capital spend over 50,000 needs lender notice."
    assert:
      - {type: contains, value: "## Approval matrix"}
      - {type: llm-rubric, value: "Organises by decision type with tiers for team leads, heads, COO and CEO, includes freelancer hiring, uses whole-contract value and bans splitting, separates approval from payment release, lists items needing two approvers regardless of value, reflects the covenant as a reserved or flagged item, and marks proposed limits as proposals to confirm."}
  - name: edge-tiny-team
    vars:
      organisation: "Owner plus 3 staff in a shop. Owner wants staff to handle refunds and small purchases without calling her."
      decisions: "Refunds, discounts, petty purchases, supplier orders."
      fixed_limits: ""
    assert:
      - {type: llm-rubric, value: "Keeps the matrix small and proportionate for four people, sets placeholder limits for refunds and purchases with reasoning, includes recording and a weekly owner review, and avoids corporate machinery that does not fit."}
  - name: negative-self-approval
    vars:
      organisation: "15-person company. The finance manager wants to approve their own expense claims and pay rise up to 10,000 so things move faster."
      decisions: ""
      fixed_limits: ""
    assert:
      - {type: llm-rubric, value: "Does not allow self-approval of expenses or pay; explains the control reason and assigns another approver such as the owner or a director."}
