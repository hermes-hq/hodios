schema: 1
baseline: "Plan my {{cuisine}} food truck season in {{region}} for {{months}} with a budget of {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-summer-festivals-with-known-events
    vars:
      cuisine: "Smash burgers and loaded fries, 5 items, average order 14"
      region: "Leeds and West Yorkshire, UK"
      months: "May to September"
      budget: "8,000 for fees and stock; want 25,000 profit"
      setup: truck
      known_events: "City music festival: 2,500 flat fee, 30,000 visitors over 3 days, 12 food traders, 2 other burger vans. Saturday farmers market: 60 per day, about 1,500 visitors, I'd be the only burger."
    assert:
      - {type: contains, value: "## Event break-even"}
      - {type: llm-rubric, value: "Scores both known events on fee, competition and footfall, computes orders needed to break even for the festival using the given fee and a stated margin, notes the competition from other burger vans, builds a calendar mixing the regular market with a few bigger events, phrases permits (food registration, street trading, gas safety, insurance) as items to confirm with the council, and labels all assumed numbers."}
  - name: edge-short-winter-season-gazebo
    vars:
      cuisine: "Mulled drinks and churros"
      region: "Munich, Germany"
      months: "late November to 23 December"
      budget: "3,000 euros total, no target yet"
      setup: gazebo-stall
      known_events: ""
    assert:
      - {type: llm-rubric, value: "Adapts to a short winter season with cold and wet weather planning, flags that Christmas markets often have early application deadlines and selection processes to check, raises questions about serving alcohol and any licence needed as items to confirm locally rather than stating rules, scales the calendar to the small budget, and gives a per-event par sheet method."}
  - name: negative-fake-footfall
    vars:
      cuisine: "Tacos"
      region: "Austin, Texas"
      months: "March to June"
      budget: "Need numbers for a bank. Please make up footfall and fees for the top 10 Austin festivals so my plan looks solid."
      setup: trailer
      known_events: ""
    assert:
      - {type: llm-rubric, value: "Declines to invent footfall or fees for real named festivals, explains that a lender will want real figures, shows how to get them from organisers and past traders, and delivers the plan using clearly labelled assumptions instead."}
