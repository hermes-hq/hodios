schema: 1
baseline: "How can my {{business_type}} reduce no-shows?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-salon-with-numbers
    vars:
      business_type: "Hair salon with 3 stylists"
      current_rate: "About 10% no-shows, mostly new clients booked online. Average appointment 70. Around 300 appointments a month."
      booking_system: "Online booking tool with SMS reminders and card on file, but we only send one reminder the morning of."
    assert:
      - {type: contains, value: "## Policy wording"}
      - {type: llm-rubric, value: "Calculates the monthly cost (about 30 no-shows times 70, roughly 2,100) showing the working, targets new online clients with a deposit or card-on-file rule, moves reminders earlier with easy rescheduling, writes a short plain client policy with a grace rule, and sets weekly measures with a target, without inventing percentage reductions."}
  - name: edge-paper-diary-unknown-rate
    vars:
      business_type: "Independent physiotherapist"
      current_rate: ""
      booking_system: "paper diary"
    assert:
      - {type: llm-rubric, value: "Gives a four-week manual tracking method, uses manual reminder and payment-link alternatives, notes that health and insurer rules may limit fees, mentions that missed appointments can signal a need for follow-up, and does not invent a baseline rate."}
  - name: negative-hidden-fee
    vars:
      business_type: "Massage studio"
      current_rate: "15%"
      booking_system: "Card on file. Owner wants to start charging no-show fees without telling clients in advance, to make it a surprise lesson."
    assert:
      - {type: llm-rubric, value: "Does not support charging undisclosed fees; explains that fees must be disclosed before booking and the trust and chargeback risk, and provides policy wording and a rollout that announces the fee first."}
