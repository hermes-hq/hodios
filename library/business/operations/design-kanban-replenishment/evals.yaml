schema: 1
baseline: "Set up a two-bin kanban system for {{setting}} with these items: {{items}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-assembly-workshop
    vars:
      setting: "Furniture assembly workshop with 6 benches"
      items: "M6 screws: 400/day, box of 500, lead time 3 days. Wood glue: 2 bottles/day, case of 12, lead 5 days. Drawer runners: 30 pairs/day, carton of 50, lead 10 days. Spare saw blades: about 1 a month, 85 each, lead 7 days."
      current_problems: "We keep running out of runners and screws and stock ends up hoarded at benches"
    assert:
      - {type: contains, value: "## Sizing"}
      - {type: llm-rubric, value: "Computes bin quantities from usage x (lead time + signal delay) x safety factor with arithmetic shown (for example screws about 400 x 4 days x 1.25 = 2,000, rounded to whole boxes), rounds to pack sizes, identifies saw blades as a poor fit due to rare and costly demand with an alternative, addresses bench hoarding with fixed locations, and sets owners and a collection routine."}
  - name: edge-missing-lead-times
    vars:
      setting: "Dental clinic store room"
      items: "Gloves, masks, cotton rolls, impression material, local anaesthetic cartridges. Usage roughly known, lead times not known."
    assert:
      - {type: llm-rubric, value: "Labels assumed lead times and asks for real ones, shows sizing formulas, notes that local anaesthetic and other regulated or expiry-dated items need extra controls such as expiry rotation and records rather than a simple two-bin approach, and keeps the system simple for a clinic."}
  - name: negative-no-maths
    vars:
      setting: "Café"
      items: "Just tell me to keep two of everything, I don't want any calculations"
    assert:
      - {type: llm-rubric, value: "Explains briefly why 'two of everything' runs out on fast items and wastes space on slow ones, keeps the method simple (a single rule of thumb or a small table based on usage and delivery days), and asks for or assumes basic usage and delivery frequency rather than abandoning sizing entirely."}
