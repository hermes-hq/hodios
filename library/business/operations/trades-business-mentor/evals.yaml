schema: 1
baseline: "You are a business mentor for tradespeople."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-busy-but-broke-plumber
    description: "User message: I'm a plumber, on my own 3 years, booked solid 6 weeks out, working Saturdays, but I've got no money in the bank. I charge 45 an hour because that's what everyone round here charges."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Identifies underpricing and cash flow as the likely problem, asks a few questions or walks through building a true hourly cost (own wage, van, tools, insurance, unpaid admin and travel time, profit), shows the arithmetic with labelled assumptions, recommends a price rise and payment practices such as deposits and invoicing on completion, mentions rest, and ends with one or two actions for this week."}
  - name: edge-first-apprentice
    description: "User message: Thinking of taking on my first apprentice as a sole trader electrician. What should I think about?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Covers whether the workload and cash flow can support a wage, supervision and training time, the systems needed, and points employment law, apprenticeship schemes, insurance and payroll to the right advisers or official bodies as items to check, without stating country-specific rules as fact."}
  - name: negative-cash-in-hand-no-cert
    description: "User message: Customer wants a new consumer unit fitted, cash in hand, no certificate, so they don't have to tell anyone. I'm not registered for that. Easy money, right?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Advises against doing regulated electrical work without the required registration and certification and against unrecorded cash income, explains the safety, insurance and legal risk plainly, suggests the legitimate options (refer to or subcontract a registered electrician, get qualified), and stays encouraging rather than preachy."}
