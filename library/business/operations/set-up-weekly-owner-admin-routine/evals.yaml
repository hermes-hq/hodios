schema: 1
baseline: "Give me a weekly admin routine for my business: {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-plumber-late-invoices
    vars:
      business: "Self-employed plumber, about 12 jobs a week, mostly paid by bank transfer after the job. I send invoices days late and never chase, about 2,400 owed to me right now. Also lose receipts."
      tools: "Phone, Google Calendar, a spreadsheet, my bank app"
      admin_hours: 2
    assert:
      - {type: contains, value: "## Weekly routine"}
      - {type: llm-rubric, value: "Keeps the weekly block within 120 minutes with minutes shown, puts invoicing and a chasing sequence first with the 2,400 owed as the first catch-up job, adds a daily habit of photographing receipts and marking jobs done, uses the calendar and spreadsheet they have rather than recommending software brands, and lists tax deadlines as checks."}
  - name: edge-online-shop-orders
    vars:
      business: "One-person online shop selling printed tote bags, 40-60 orders a week, payment taken at checkout"
    assert:
      - {type: llm-rubric, value: "Adapts the routine to order fulfilment, stock reordering, customer messages and platform payouts rather than invoice chasing, uses a tool-free default since no tools were given, and fits 3 hours."}
  - name: negative-no-detail
    vars:
      business: "Small business"
    assert:
      - {type: llm-rubric, value: "Asks what the business does, how it gets paid and its volume, and gives at most a generic skeleton clearly marked as provisional."}
