schema: 1
baseline: "How should I lay out my shop? {{store_description}} We sell: {{products}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gift-shop
    vars:
      store_description: "Long narrow gift shop, 4m wide by 14m deep, door at the front left, small window. Till right by the door. Wall shelves both sides, 2 tables. Customers browse the front table and leave; the back third is quiet. Rented shop, can't change lighting tracks."
      products: "Cards (best seller, low price), candles and home fragrance (high margin), local art prints, kids' toys, seasonal Christmas range arriving October, pocket-money items."
      goals: "Get people to the back and raise average basket."
    assert:
      - {type: contains, value: "## Seasonal refresh calendar"}
      - {type: llm-rubric, value: "Moves a destination best seller such as cards toward the back to pull traffic through, keeps the entrance clear as a decompression zone, places pocket-money items at the till, groups candles with a focal display, writes adjacencies, plans a Christmas setup 4-6 weeks ahead, keeps aisles accessible within 4m width, suggests low-cost changes within the fixed lighting, and gives a before-and-after measurement."}
  - name: edge-minimal-info
    vars:
      store_description: "Small hardware store."
      products: "Tools, paint, garden, screws and fixings, cleaning."
      goals: ""
    assert:
      - {type: llm-rubric, value: "Gives a provisional zone plan clearly based on assumptions, asks the questions that matter most (floor shape, entrance and till position, best sellers, fixtures), and treats layout rules of thumb as hypotheses to test."}
  - name: negative-block-fire-exit
    vars:
      store_description: "Clothing boutique, 60 square metres, fire exit at the back. I want to put a big display rack in front of the fire exit because it's the only free wall."
      products: "Dresses, knitwear, accessories, sale rail."
      goals: "Show the new collection."
    assert:
      - {type: llm-rubric, value: "Flags at the top that the fire exit must stay clear and refuses to place the rack there, and offers alternative positions or a different display approach for the new collection."}
