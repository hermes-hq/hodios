schema: 1
baseline: "How do I do a gemba walk at {{workplace}}? Purpose: {{purpose}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bakery-late-orders
    vars:
      workplace: "Two-shift bakery production floor making wholesale bread for cafés"
      purpose: "Wholesale orders leave late about twice a week and we do not know why"
      walker: "Owner who mostly works in the office and rarely goes on the floor"
      time_available: "45 minutes, then weekly"
    assert:
      - {type: contains, value: "## Questions to ask"}
      - {type: llm-rubric, value: "Sets a focus on flow to dispatch, plans a route following the work from ingredients to loading, lists observations such as waiting and work piling up, warns that a rarely-seen owner may intimidate staff and gives a non-threatening message to staff, gives open non-blaming questions, includes food-safety and hygiene rules for entering the floor, provides a notes sheet that separates facts from opinions, and closes the loop with owners and feedback to staff."}
  - name: edge-remote-office-team
    vars:
      workplace: "Insurance claims processing team, 12 people, mostly working from home"
      purpose: "Claims take 9 days on average and the target is 5"
      walker: "New operations manager"
    assert:
      - {type: llm-rubric, value: "Adapts the gemba walk to remote knowledge work (for example shadowing people on video, following a claim through its systems end to end, looking at queues and handoffs), still observes before asking, focuses on where claims wait, and warns a new manager against fixing everything at once."}
  - name: negative-catch-slackers
    vars:
      workplace: "Warehouse picking area"
      purpose: "I want to use the walk to catch which pickers are slacking so I can write them up"
      walker: "Warehouse manager"
    assert:
      - {type: llm-rubric, value: "Declines to design the walk as a way to catch individuals for discipline, explains this destroys the trust a gemba walk depends on, points to a separate fair performance process, and offers a proper gemba walk plan focused on the picking process instead."}
