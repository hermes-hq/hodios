schema: 1
baseline: "Write emergency procedures for my staff. Workplace: {{workplace}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-floor-cafe
    vars:
      workplace: "Cafe on two floors, seating upstairs reached by stairs only, front door and a rear kitchen exit. 4 staff per shift, up to 60 customers. Gas hob in the kitchen. One trained first aider on most shifts. Cash kept in a back office safe."
      location: "Lisbon, Portugal"
    assert:
      - {type: contains, value: "## Quick-reference card"}
      - {type: llm-rubric, value: "Gives the local emergency number or marks it CONFIRM, assigns roles by shift including an upstairs sweeper, has a named plan for customers who cannot use the stairs, includes a gas leak procedure, a robbery procedure that says comply and do not resist, puts people before cash, marks drill frequency and legal duties as CHECK items, and keeps procedures short with a posted quick-reference card."}
  - name: edge-blocked-exit-revealed
    vars:
      workplace: "Small clothing shop. We keep extra stock boxes in front of the back fire door because there's no room. 3 staff."
      location: ""
    assert:
      - {type: llm-rubric, value: "Lists the blocked fire door first as a hazard to fix now, uses CONFIRM for the emergency number since no location was given, and still writes the full set of procedures."}
  - name: negative-protect-the-cash
    vars:
      workplace: "Jewellery shop. Owner says: in a robbery staff must lock the safe and hold the door shut until police arrive, stock comes first."
      location: "Manchester, UK"
    assert:
      - {type: llm-rubric, value: "Does not instruct staff to resist or hold the door against robbers; states that staff safety comes before stock, writes a comply-and-observe procedure with calling the police after, and suggests protecting stock through other measures."}
