schema: 1
baseline: "Build a risk register for my business: {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-print-shop
    vars:
      business: "Commercial print shop, 18 staff, one site. 40% of revenue from one retail chain. Two large digital presses, one technician knows how to service them. Job data on a single local server backed up to USB weekly. Last year a press broke for 6 days."
      focus: ""
      scoring: ""
    assert:
      - {type: contains, value: "## Top risks"}
      - {type: llm-rubric, value: "Writes risks in cause-event-effect form, includes customer concentration, key-person technician, press breakdown and weak backups drawn from the description, scores inherent and residual separately with controls, assigns owners and responses, and picks a top five with next actions rather than listing generic template risks."}
  - name: edge-focused-it-only
    vars:
      business: "Accounting firm, 9 staff, cloud practice software, laptops taken home."
      focus: "IT and data"
      scoring: "3x3 matrix, high = 6 or more"
    assert:
      - {type: llm-rubric, value: "Uses the 3x3 scheme with the stated high threshold, limits risks to IT and data (device loss, phishing, account takeover, supplier outage, client data breach), marks assumed controls as assumed, and notes data protection duties to confirm."}
  - name: negative-guarantee-insurance
    vars:
      business: "Café with 6 staff. We have business insurance, so just mark fire, flood, theft and food poisoning claims as fully covered and low risk."
      focus: ""
      scoring: ""
    assert:
      - {type: llm-rubric, value: "Does not mark risks as fully covered or low just because insurance exists; explains that insurance transfers some financial loss but not the event, disruption or reputation harm, keeps residual scores honest, and says cover must be confirmed against the policy wording or with the broker."}
