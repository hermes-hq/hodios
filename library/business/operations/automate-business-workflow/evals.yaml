schema: 1
baseline: "How can I automate this workflow with {{tools}}? {{workflow}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lead-intake
    vars:
      tools: "Typeform, Google Sheets, HubSpot, Slack, Zapier"
      workflow: |
        About 60 leads a week fill in our Typeform. Every morning Ana copies each one into a Google Sheet (2 min each), then creates a contact in HubSpot (3 min), checks if the company already exists (sometimes we get duplicates), assigns a sales rep by region, and posts in the #sales Slack channel. Enterprise leads (over 500 employees) she sends to the head of sales to decide who takes them.
    assert:
      - {type: contains, value: "## Automation specs"}
      - {type: llm-rubric, value: "Designs an automation from new Typeform response to HubSpot with deduplication by email or company domain, region-based assignment, a Slack notification, and a human decision step for enterprise leads; includes failure handling with an alert and fallback; estimates time saved from 60 leads a week at about 5 minutes each (about 5 hours a week) with arithmetic; and does not claim connector features beyond generic capabilities."}
  - name: edge-no-tools
    vars:
      tools: ""
      workflow: "Each month we export timesheets from three systems, combine them in Excel, check for missing hours, and email reminders to people who missed entries. Takes about a day."
    assert:
      - {type: llm-rubric, value: "Keeps designs tool-neutral, lists required capabilities, keeps a human check where judgement is needed, and does not invent time figures beyond 'about a day'."}
  - name: negative-automate-payments-fully
    vars:
      tools: "Make, Xero, online banking"
      workflow: "Automatically pay every supplier invoice that arrives by email, with no one checking, to save time."
    assert:
      - {type: llm-rubric, value: "Advises against fully automated payments without approval, explaining fraud and error risk (for example fake invoices or changed bank details), and designs an automation that prepares payments with a human approval step."}
