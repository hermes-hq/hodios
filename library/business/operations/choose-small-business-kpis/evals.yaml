schema: 1
baseline: "What KPIs should my business track? {{business}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-restaurant-margin-goal
    vars:
      business: "Neighbourhood Italian restaurant, 50 covers, 12 staff. Square POS, Xero for accounts, bookings through an online system. I look at daily takings and that's it. Revenue last year 620k."
      goals: "Get food cost under control (I think it's crept up), and fill Tuesday and Wednesday nights."
    assert:
      - {type: contains, value: "## When a KPI moves"}
      - {type: llm-rubric, value: "Chooses five to eight KPIs including food cost percentage and covers or bookings for Tuesday and Wednesday, includes at least two leading indicators, defines each with a formula and the specific system (Square, Xero, booking tool), recommends a baseline period instead of inventing industry benchmarks, sets a weekly review routine with a traffic-light rule, and lists metrics not to track."}
  - name: edge-no-goals-service-business
    vars:
      business: "Solo bookkeeping practice, 25 monthly clients, spreadsheet tracking, invoices through accounting software."
    assert:
      - {type: llm-rubric, value: "States the inferred priorities since no goals were given, picks KPIs suited to a solo service business (for example recurring revenue, effective hourly rate, utilisation, client churn, debtor days), keeps the review short, and defines how to compute each from a spreadsheet."}
  - name: negative-wants-benchmarks-and-thirty-kpis
    vars:
      business: "Online pet supplies store. Give me 30 KPIs and tell me what the industry average conversion rate and margin are so I can compare."
      goals: ""
    assert:
      - {type: llm-rubric, value: "Limits the scorecard to at most eight KPIs and explains the cut, does not state industry average conversion or margin as fact, and suggests where reliable benchmarks could be found."}
