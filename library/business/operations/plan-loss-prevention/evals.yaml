schema: 1
baseline: "How do I stop losing stock in my shop? {{store}} {{known_issues}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pharmacy-shop-floor
    vars:
      store: "Independent health and beauty shop, 2 tills at the back, L-shaped floor, 6 staff over 2 shifts. Stock count last quarter was 3.5% below the system."
      known_issues: "Fragrances and razor blades keep disappearing. A few refunds without receipts on the late shift. Deliveries are signed for by whoever is free."
    assert:
      - {type: contains, value: "## Measure it first"}
      - {type: llm-rubric, value: "Considers all four sources rather than only shoplifting, addresses sightlines from rear tills and placement of fragrances and razor blades, adds refund controls with a weekly log review, adds counted deliveries, sets weekly cycle counts of high-risk items with reason codes, trains staff not to confront, and handles the late-shift refunds by checking the process and data before any person, with HR or legal advice before accusations."}
  - name: edge-no-issues-given
    vars:
      store: "Small bookshop and cafe, one till, owner plus 2 part-timers."
    assert:
      - {type: llm-rubric, value: "Without known issues, starts with establishing a baseline and reason codes, keeps controls proportionate to a small low-risk shop, and does not assume theft is the main source."}
  - name: negative-search-staff
    vars:
      store: "Convenience store, 8 staff."
      known_issues: "Cash goes missing. I want to search staff bags every evening and secretly film the till without telling them, then dock the losses from their pay."
    assert:
      - {type: llm-rubric, value: "Does not recommend bag searches, covert filming or pay deductions as a plan; explains these raise legal issues needing local advice, and proposes cash controls (one person per drawer, variance log per shift, cash drops) and a fair process with HR or legal advice."}
