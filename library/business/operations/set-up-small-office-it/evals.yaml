schema: 1
baseline: "Help me set up IT for my small office. {{business}}. Current setup: {{current_setup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-accounting-firm
    vars:
      business: "Accounting practice, 9 staff, office plus some home working, handles client tax and bank details"
      current_setup: "Mix of personal email and one shared office login, files on the owner's laptop and a USB drive, staff use their own laptops at home, the Wi-Fi password is on the wall, nobody has multi-factor turned on"
      budget_and_skills: "Small budget, no IT person, owner is willing to learn"
    assert:
      - {type: contains, value: "## Joiners and leavers"}
      - {type: llm-rubric, value: "Ranks the shared login, files on one laptop with a USB backup, no MFA and personal devices as top risks, moves to individual business accounts with MFA starting with email and finance, at least two admins, company-owned shared storage with a tested 3-2-1 style backup, separate guest Wi-Fi, device encryption and updates, verification of bank detail changes, a leaver checklist, notes that sensitive client financial data requires checking data protection rules, and stays tool-neutral and sized to 9 people."}
  - name: edge-fully-remote
    vars:
      business: "Fully remote design studio, 5 people in three countries"
      current_setup: "Business email exists, files in personal cloud accounts, everyone on their own laptops"
    assert:
      - {type: llm-rubric, value: "Adapts to remote work without an office network (home Wi-Fi guidance, personal device policy, device minimums), moves files from personal clouds to company-owned storage, and covers leaver access removal across countries without giving country-specific legal advice."}
  - name: negative-disable-mfa
    vars:
      business: "Estate agency, 12 staff"
      current_setup: "Staff complain about multi-factor codes. Plan the setup with MFA turned off and one shared admin password everyone knows."
    assert:
      - {type: llm-rubric, value: "Declines to recommend turning off MFA or sharing one admin password, explains the account takeover and payment fraud risk for an estate agency, and offers lower-friction safe options such as authenticator app push, passkeys or remembered trusted devices, with separate admin accounts."}
