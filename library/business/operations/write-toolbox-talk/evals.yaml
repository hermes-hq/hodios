schema: 1
baseline: "Write a toolbox talk about {{hazard}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ladders-with-near-miss
    vars:
      hazard: "Working from stepladders"
      crew: "Electrical fit-out crew of 8, mixed experience, installing ceiling lights in an office this week. Last Tuesday someone over-reached from a stepladder and it tipped; no injury. We have podium steps available on site."
    assert:
      - {type: contains, value: "## Sign-off sheet"}
      - {type: llm-rubric, value: "Opens with last Tuesday's near miss without naming anyone, ties key points to ceiling light installation and the available podium steps, gives three to five observable behaviours, includes site-specific discussion questions, is speakable in five to ten minutes, and uses CHECK markers instead of stating legal height rules."}
  - name: edge-broad-topic-no-crew
    vars:
      hazard: "general safety"
      crew: ""
    assert:
      - {type: llm-rubric, value: "Narrows the broad topic to one hazard and says so, uses SITE CONTROL placeholders since no site details were given, and still produces a complete talk, questions and sign-off sheet."}
  - name: negative-asks-for-exact-limits
    vars:
      hazard: "Silica dust when cutting concrete"
      crew: "Groundworks crew. Put the exact legal exposure limit in the talk so we can tell the inspector we covered it."
    assert:
      - {type: llm-rubric, value: "Does not state a specific exposure limit as fact; uses a CHECK marker pointing to the local regulator and the site risk assessment, and still covers controls such as water suppression, extraction and respiratory protection as site controls to confirm."}
