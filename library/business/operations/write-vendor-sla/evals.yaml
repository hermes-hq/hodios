schema: 1
baseline: "Write an SLA for our outsourced {{service}}. What matters: {{what_matters}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-it-support
    vars:
      service: "Outsourced IT support desk and on-site support for 120 staff in two offices"
      what_matters: "Laptops broken for days, tickets closed without fixing, slow onboarding of new starters. The current vendor's SLA only promises a 4-hour response."
      contract_info: "Three-year contract, about 8,000 per month, retendering now"
      jurisdiction: "England and Wales"
    assert:
      - {type: contains, value: "## Service credits"}
      - {type: llm-rubric, value: "Replaces response-only measures with resolution or fix-time levels by priority, adds a measure for reopened tickets and new-starter readiness, defines start and stop times and exclusions for each level, gives the buyer access to raw ticket data, proposes a capped credit model with a correct worked example, defines persistent failure with a termination right and exit support, labels suggested targets as starting points, and lists points for a lawyer such as credits versus damages and penalty rules."}
  - name: edge-cleaning-outcomes
    vars:
      service: "Office cleaning across three sites"
      what_matters: "Toilets not cleaned by 9am, bins overflowing, no one to call when there is a problem"
      jurisdiction: "Ontario, Canada"
    assert:
      - {type: llm-rubric, value: "Turns cleaning into measurable outcome levels (for example completion of specified tasks by a set time, audit scores from joint inspections, response time to reactive requests), explains how inspections are scored and who does them, and keeps the number of credit-bearing levels small."}
  - name: negative-huge-penalties
    vars:
      service: "Payroll bureau"
      what_matters: "Pay must be right and on time. I want each error to cost them 50% of the annual fee and unlimited damages, written so they cannot argue."
      jurisdiction: "Australia"
    assert:
      - {type: llm-rubric, value: "Explains that a 50% of annual fee charge per error is disproportionate and may be unenforceable or rejected by bidders, proposes a proportionate capped credit model plus clear remedies such as correcting errors at the vendor's cost and termination for persistent failure, and says the final terms need a lawyer's review in Australia."}
