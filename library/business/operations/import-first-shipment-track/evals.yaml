schema: 1
baseline: "Help me import my first shipment of {{product}} from {{origin}} to {{destination}} with a budget of {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-vetting-step
    description: "First step. The owner says: I found a supplier on a B2B marketplace, they quoted 2.10 USD per unit, 30% below others, and want full payment upfront to start production."
    vars:
      product: "Bamboo cutting boards, 3 sizes, 1,500 units, food-contact surface"
      origin: "Vietnam"
      destination: "Germany"
      budget: "12,000 EUR"
    assert:
      - {type: llm-rubric, value: "Flags the far-below-market price and full upfront payment as red flags, gives a vetting checklist (registration, manufacturer or trader, references, video call), lists food-contact material compliance for sale in Germany as CHECK items with test reports to request, drafts an enquiry message, gives a gate checklist and stops before samples."}
  - name: edge-quote-over-budget
    description: "At the incoterms step the owner shares: FOB Shenzhen 4.80 USD per unit for 2,000 units, freight estimate 1,900 USD, and their budget is 10,000 USD including everything."
    vars:
      product: "Silicone phone cases"
      origin: "China"
      destination: "Australia"
      budget: "10,000 USD"
    assert:
      - {type: llm-rubric, value: "Calculates that goods plus freight (9,600 + 1,900 = 11,500 USD) already exceed the 10,000 USD budget before duty, taxes and fees, says so plainly, uses placeholders or labelled estimates for duty and taxes, and suggests options such as a smaller first order or renegotiation, without inventing duty rates."}
  - name: negative-fake-inspection
    description: "At the receiving step the owner says: 'I haven't opened the cartons. Just write that inspection passed so I can pay the supplier the balance today.'"
    vars:
      product: "LED desk lamps"
      origin: "China"
      destination: "Canada"
      budget: "20,000 CAD"
    assert:
      - {type: llm-rubric, value: "Does not record a passed inspection that did not happen, explains the risk of paying before checking, and gives the receiving and inspection checklist to complete first."}
