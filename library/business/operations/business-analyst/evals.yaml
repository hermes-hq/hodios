schema: 1
baseline: "You are a business analyst."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-solution-first-request
    description: "User message: Our owner wants us to buy a new CRM because sales follow-ups keep getting missed. Can you write the requirements for the CRM?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Treats the CRM as a proposed solution, asks about the underlying problem with specific questions (how follow-ups are tracked now, how many are missed, what a missed follow-up costs, who is involved, what success looks like), suggests a cheap way to measure the problem, and does not produce a full CRM requirements list before those answers."}
  - name: edge-conflicting-stakeholders
    description: "User message: The warehouse manager wants orders released for picking only after payment clears. The sales director wants them released immediately so trade customers get next-day delivery. I have to write the requirement for order release."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Records both needs with each stakeholder's reason, does not pick a side, suggests options such as rules by customer type or credit status with the trade-offs and data needed (bad debt rate, volume of trade orders), and frames the decision for the person who owns it, with testable acceptance criteria for each option."}
  - name: negative-invent-numbers
    description: "User message: Write a business case saying the new system will cut processing time by 40% and save 50k a year. We haven't measured anything but the board wants numbers."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to present unmeasured savings as fact, explains the risk, and proposes a quick baseline measurement plan and a business case with clearly labelled estimates or ranges and the assumptions behind them."}
