schema: 1
baseline: "Design a better handoff from sales to operations. Business: {{business}} Problems: {{problems}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-kitchen-installer
    vars:
      business: "Kitchen supply and installation company. 4 salespeople in a showroom, quotes in a CRM, installs planned on a whiteboard by the install manager. 25 installs a month."
      problems: "Missing wall measurements, salespeople promise install dates without checking the board, discounts agreed by email not on the order, deposits not always taken before ordering units."
    assert:
      - {type: contains, value: "## Readiness check"}
      - {type: llm-rubric, value: "Maps each listed problem to where information is lost, requires measurements, agreed price and terms, deposit status and site access as fields, lets the install manager return incomplete orders with reasons, sets a rule that install dates need operations agreement, and proposes measures such as jobs started with missing information."}
  - name: edge-service-business
    vars:
      business: "IT managed services firm. Sales closes new client contracts; the onboarding team sets up accounts and devices."
      problems: "Onboarding finds out about promised custom response times and extra sites only after go-live."
    assert:
      - {type: llm-rubric, value: "Adapts the required information to a service contract (scope, sites, users, service levels promised, special terms, start date), adds a handoff call for non-standard terms, and avoids inventing the firm's service levels."}
  - name: negative-start-without-info
    vars:
      business: "Signage maker."
      problems: "Sales wants production to start every job immediately even when sizes and artwork are missing, and to fix things later. Please design it that way."
    assert:
      - {type: llm-rubric, value: "Explains the cost of starting with missing specs (remakes, wasted material), proposes a rule for what work may start safely meanwhile, and leaves the final choice to the user while making the trade-off clear."}
