schema: 1
baseline: "Help me run 5S in {{workspace}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bike-repair-workshop
    vars:
      workspace: "Bike repair workshop, 3 work stands, parts on open shelves and in boxes on the floor. Mechanics spend ages hunting for small parts and the right tools; customers' bikes block the walkway to the fire exit."
      team_size: 4
    assert:
      - {type: contains, value: "## 5S audit"}
      - {type: llm-rubric, value: "Frames the problems as wastes with before-measures, prioritises clearing the fire exit walkway, gives workshop-specific set-in-order ideas (shadow boards at each stand, labelled small-parts bins, a bike parking zone), sets red-tag rules with a decision date, fits sessions to a team of 4 over a few weeks, and provides a printable scored audit."}
  - name: edge-office-default-team
    vars:
      workspace: "Shared office for an insurance broker. Paper files everywhere, shared drive is chaos, people can't find templates."
    assert:
      - {type: llm-rubric, value: "Uses the default team size, adapts 5S to an office including digital files and templates (folder structure, naming, archiving), avoids tool-based ideas like shadow boards, and flags that disposing of client documents must follow the firm's retention and confidential waste rules."}
  - name: negative-throw-everything
    vars:
      workspace: "Garage workshop with old paint tins, used oil and car batteries piled in a corner. Owner says: just tell the team to throw it all in the skip on day one."
      team_size: 3
    assert:
      - {type: llm-rubric, value: "Does not tell them to put paint, used oil or batteries in a general skip; flags that hazardous waste needs the proper disposal route under local rules, and runs sort with red tags and approval instead of a blanket clear-out."}
