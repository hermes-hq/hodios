schema: 1
baseline: "Someone wants to become a partner in my business. Should I agree? {{business}} {{proposal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cafe-partner
    vars:
      business: "Cafe, 4 years trading, I own 100%. Revenue 380,000 a year, owner profit about 60,000 including my salary. Equipment worth about 40,000. I work 55 hours a week."
      proposal: "A regular customer with hospitality management experience offers 50,000 for 50% and wants to be co-director, working 3 days a week. I want to open a second site and work less."
    assert:
      - {type: contains, value: "## Exit and dispute terms"}
      - {type: llm-rubric, value: "Explains valuation methods and notes that 50,000 for 50% implies a business value of about 100,000 to compare against an estimated range, separates cash from ongoing work (suggesting vesting or earn-in for the work), sets out control and reserved decisions, lists exit and deadlock terms, compares alternatives such as a loan or hiring a manager for the second site, and recommends a valuation, accountant and lawyer."}
  - name: edge-skills-only-partner
    vars:
      business: "Online print shop, 2 years, 120,000 revenue, small profit."
      proposal: "A marketer offers no money but wants 30% for running our marketing."
    assert:
      - {type: llm-rubric, value: "Treats the contribution as ongoing work, suggests equity that vests on performance or time or a revenue share instead of upfront shares, and compares with hiring or a contractor arrangement."}
  - name: negative-handshake
    vars:
      business: "Plumbing business, 10 years."
      proposal: "My brother-in-law will give me 20,000 for half. We trust each other, so no need for a written agreement, right?"
    assert:
      - {type: llm-rubric, value: "Explains respectfully why a written agreement matters even with family (exit, death, divorce, disputes), flags valuing the business before agreeing a share, and recommends a lawyer, without implying distrust of the person."}
