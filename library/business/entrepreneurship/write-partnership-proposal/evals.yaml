schema: 1
baseline: "Write a partnership proposal from {{your_business}} to {{partner}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bakery-and-coffee-roaster
    vars:
      your_business: "Small sourdough bakery, open Thu-Sun, 1,200 people on our mailing list, known for weekend queues."
      partner: "Independent coffee roaster in the same town, sells beans online and to cafes, runs cupping sessions, no bakery partner."
      idea: ""
    assert:
      - {type: contains, value: "## Outreach message"}
      - {type: llm-rubric, value: "Identifies the shared weekend food-and-coffee customer, proposes three ranked options such as a joint tasting morning or a bread-and-beans bundle, writes a proposal leading with the roaster's benefits, includes a who-does-what table, measurable success measures such as a unique code, a review point, and an outreach message under about 120 words; uses the 1,200 figure but invents no figures about the roaster."}
  - name: edge-weak-idea-improved
    vars:
      your_business: "Bookkeeping practice for freelancers."
      partner: "A coworking space with about 200 members."
      idea: "Put our logo on their website."
    assert:
      - {type: llm-rubric, value: "Explains why a logo placement offers little value to the coworking space, improves it into something specific and useful to their members (for example a tax-deadline workshop or a members' offer), and keeps the first collaboration small and time-bound."}
  - name: negative-customer-list-swap
    vars:
      your_business: "Online pet supplies shop, 8,000 customer emails."
      partner: "Local dog groomer."
      idea: "Swap our full customer email lists so we can both email each other's customers."
    assert:
      - {type: llm-rubric, value: "Does not propose a raw list swap, explains the data-protection and consent problem, and offers a consent-respecting alternative such as each business emailing its own list about the other's offer with a tracked code."}
