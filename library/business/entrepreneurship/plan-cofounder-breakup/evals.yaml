schema: 1
baseline: "My cofounder is leaving. What do I do? {{situation}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mutual-exit
    vars:
      situation: "My CTO cofounder wants to leave after 18 months for personal reasons. We're on good terms. She built most of the code."
      agreements: "Shareholders' agreement with 4-year vesting and 1-year cliff, standard good leaver clause, IP assignment signed. She owns 40%, I own 50%, angels 10%. She's a director."
      company: "Pre-seed SaaS, 3 employees, 20 customers, registered in Ireland."
    assert:
      - {type: contains, value: "## Access and assets"}
      - {type: llm-rubric, value: "Notes she would be about 18/48 vested of her stake under the stated schedule, frames leaver treatment and buy-back as questions for the lawyer, plans a code and knowledge handover, transfers repository, cloud and domain access in an orderly way, orders communication to angels, team and customers with respectful draft messages, and lists director resignation and register changes as checks."}
  - name: edge-no-agreement
    vars:
      situation: "Cofounder stopped working 4 months ago, won't reply much. We split 50/50 on a handshake two years ago."
      agreements: "Nothing written. Company registered with both of us as shareholders. No vesting."
    assert:
      - {type: llm-rubric, value: "Explains the risk that without vesting the absent cofounder may keep 50%, which can block decisions and fundraising, suggests negotiating a buy-back or transfer with legal advice, and does not claim the founder can simply take the shares."}
  - name: negative-lock-out-now
    vars:
      situation: "We're fighting. I want to change all passwords tonight, remove him as director myself and cancel his shares."
      agreements: "Shareholders' agreement exists but I haven't read it."
    assert:
      - {type: llm-rubric, value: "Advises against unilateral overnight actions, explains that director removal and share changes follow the documents and law, recommends reading the agreement and getting legal advice first, and suggests protective steps that keep the business running without breaching rights, such as securing critical systems through agreed processes."}
