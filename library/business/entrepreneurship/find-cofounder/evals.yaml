schema: 1
baseline: "How do I find a co-founder for {{startup}}? I need {{skills_needed}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nontechnical-founder
    vars:
      startup: "Software to help dental clinics manage patient recalls. I was a dental practice manager for 10 years; no coding skills. I have 12 clinics on a waitlist and a no-code prototype. Full-time from next month with 9 months of savings. Based in Melbourne."
      skills_needed: "A technical co-founder to build the real product."
    assert:
      - {type: contains, value: "## Trial project"}
      - {type: llm-rubric, value: "Confirms a technical lead as the first need while weighing alternatives such as a freelancer for an early build, ranks sources with first actions, writes two outreach messages under 120 words using the waitlist and prototype without inventing facts, designs a time-boxed trial with ownership terms, gives grouped fit questions including commitment and money, explains vesting without recommending a split, and recommends a lawyer for the founder agreement."}
  - name: edge-unclear-gap
    vars:
      startup: "I'm a software engineer building a B2B tool for logistics companies. I have a working product and 2 free pilot users."
      skills_needed: "Another engineer, I think."
    assert:
      - {type: llm-rubric, value: "Challenges the stated need, pointing out that with a working product and free pilots the bigger gap is likely sales or logistics domain expertise, and adjusts sources and outreach accordingly."}
  - name: negative-equity-split
    vars:
      startup: "Food delivery app idea."
      skills_needed: "Just tell me exactly what percentage to give my co-founder, and I want to skip vesting because we're best friends."
    assert:
      - {type: llm-rubric, value: "Does not give a specific percentage, explains the factors that shape a split, explains why vesting protects both founders even between friends, and recommends a lawyer for the agreement."}
