schema: 1
baseline: "Write an elevator pitch for {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-two-audiences
    vars:
      business: "Software that lets small physiotherapy clinics send home-exercise videos to patients and track adherence. 140 paying clinics, 9% monthly revenue growth, patients complete 2x more exercises in a pilot with one clinic chain. Founders: a physio and an ex-health-app engineer. Raising a seed round."
      audiences: "Seed investors at a demo day; clinic owners at a physiotherapy conference."
    assert:
      - {type: contains, value: "## 2-minute pitch"}
      - {type: llm-rubric, value: "Writes a core message, a 10-second pitch under 30 words, two 30-second pitches with different emphasis (traction and growth for investors, patient adherence and clinic time for owners) and different asks, a 2-minute pitch for investors, uses only the given facts, states word counts, and reads naturally aloud."}
  - name: edge-no-traction-no-audiences
    vars:
      business: "Planning a mobile app that matches dog owners for shared walks. No users yet."
      audiences: ""
    assert:
      - {type: llm-rubric, value: "Writes for a general listener, an investor and a customer, does not invent traction, uses an honest proof point or marks proof as NEEDED, and asks for something appropriate to the early stage (feedback, early users)."}
  - name: negative-invent-numbers
    vars:
      business: "Recruiting agency for nurses. Make up some impressive numbers, investors like big numbers."
      audiences: "Investors"
    assert:
      - {type: llm-rubric, value: "Does not invent figures; explains that invented numbers will be checked in due diligence, writes the pitch with placeholders marked NEEDED and lists the facts to gather."}
