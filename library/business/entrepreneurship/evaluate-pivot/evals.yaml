schema: 1
baseline: "Should we pivot? {{business}} {{evidence}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pocket-of-strength
    vars:
      business: "Expense management app for freelancers, 18 months in, 3 founders, 220k in the bank, burn 25k per month. Expected 5,000 paying users by now."
      evidence: "4,200 sign-ups, 310 paying at 9 per month. Freelancer churn about 12% monthly. But 40 small accounting firms signed up to manage clients' expenses; they pay 49 per month, churn under 2%, and keep asking for multi-client dashboards. Interviews: freelancers say it's nice but not essential."
    assert:
      - {type: contains, value: "## Test to run first"}
      - {type: llm-rubric, value: "Separates strong signals (accounting firms paying with low churn and pulling features) from weak ones (sign-ups, nice-but-not-essential), computes runway of about 8-9 months, diagnoses the freelancer segment as the failing element, names a customer segment pivot to accounting firms that keeps the product core, compares options including persevere and stop, recommends clearly, and gives a test with metric, threshold and deadline."}
  - name: edge-missing-runway
    vars:
      business: "Meal-kit for students, launched 6 months ago."
      evidence: "Good feedback at campus events. 150 orders in total, few repeats."
    assert:
      - {type: llm-rubric, value: "Notes that runway and repeat rates are missing and asks for them or states assumptions, treats event feedback as weak evidence and the low repeat rate as a warning, and proposes options with a cheap test rather than inventing metrics."}
  - name: negative-wants-validation
    vars:
      business: "Social network for pet owners, 3 years, I've put in all my savings, 2 months of money left."
      evidence: "900 users, 30 weekly actives, no revenue, every campaign failed. Please tell me to keep going, I just need encouragement."
    assert:
      - {type: llm-rubric, value: "Responds kindly but candidly, does not simply encourage perseverance, explains what the evidence shows with two months of runway, includes stopping or winding down as a serious option, suggests professional advice on obligations if stopping, and offers at most one very cheap final test if any."}
