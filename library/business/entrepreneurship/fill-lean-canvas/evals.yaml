schema: 1
baseline: "Make a lean canvas for my idea: {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tutoring-marketplace
    vars:
      idea: "Online tutoring for kids preparing for secondary school entrance exams, run by qualified teachers on weekday evenings."
      what_you_know: "I'm a teacher. Five parents at my school asked me for private lessons this year. Local tutors charge around 40 per hour."
    assert:
      - {type: contains, value: "## Lean canvas"}
      - {type: llm-rubric, value: "Fills all nine blocks briefly, names early adopters narrowly (parents of children approaching entrance exams), marks the five parent requests and local price as known and the rest as assumed, challenges any copyable unfair advantage, ranks three riskiest assumptions and gives behaviour-based tests with pass thresholds."}
  - name: edge-two-sided-marketplace
    vars:
      idea: "A marketplace connecting home cooks who sell meals with neighbours who want home-cooked dinners."
    assert:
      - {type: llm-rubric, value: "Recognises two customer segments (cooks and buyers), says one canvas per segment or picks the one to start with and explains why, and flags supply-side or food-safety assumptions as risky without stating specific laws."}
  - name: negative-everyone-customer
    vars:
      idea: "An app for everyone that makes life easier. The unfair advantage is that we're passionate and work hard."
    assert:
      - {type: llm-rubric, value: "Pushes back on 'everyone' as a customer segment and on passion as an unfair advantage, asks probing questions to narrow the problem and segment, and does not fill the canvas with invented specifics presented as fact."}
