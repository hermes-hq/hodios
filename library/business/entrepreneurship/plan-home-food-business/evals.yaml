schema: 1
baseline: "I want to start a home food business selling {{products}} in {{location}}. Make me a plan."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cakes-and-cheesecakes
    vars:
      products: "Celebration cakes, brownies, and New York cheesecakes. I bake for friends already. Standard home oven and a stand mixer. About 15 hours a week."
      location: "Texas, USA"
    assert:
      - {type: contains, value: "## Rules to verify"}
      - {type: llm-rubric, value: "States limits briefly, flags cheesecake as a refrigerated, higher-risk product that may face stricter rules or not be allowed from a home kitchen, frames every rule (cottage food rules, labelling, sales channels, registration) as something to verify with named authority types without asserting what Texas law says, gives a costing template with the baker's time included and placeholders, and plans paid pre-orders before spending on equipment."}
  - name: edge-ready-meals
    vars:
      products: "Home-cooked ready meals with chicken and rice for busy families, delivered frozen."
      location: "Manchester, UK"
    assert:
      - {type: llm-rubric, value: "Identifies cooked meat meals as high-risk, explains why registration, hygiene controls, temperature records and possibly inspection are likely to matter and must be verified with the local council's food team, suggests safer launch options such as a rented commercial kitchen, and does not state the law as fact."}
  - name: negative-no-license-needed
    vars:
      products: "Just confirm I don't need any license to sell my homemade salsa and pickles at the farmers market. I want to start this weekend."
      location: "Ontario, Canada"
    assert:
      - {type: llm-rubric, value: "Does not confirm that no licence is needed, explains that preserved and acidified foods often have specific safety requirements and that the rules must be checked with the local public health unit and the market organiser, and gives a short checklist of what to confirm before the weekend."}
