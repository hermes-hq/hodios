schema: 1
baseline: "Is this development proposal good? {{proposal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-gaps-and-ownership
    vars:
      proposal: "Fitness class booking app, iOS and Android. Frontend 180 hours, backend 140 hours. Total 24,000. Timeline 10 weeks. 50% upfront, 50% at launch. Source code will be transferred after final payment. Hosting on our servers at 300 per month. Change requests billed at our standard rate."
      brief: "Booking app for my studio: class schedule, booking and cancellation, payments, push reminders, admin panel for me to add classes, export of customer list. Budget 20,000-30,000. Another quote: 31,000 including design and testing."
    assert:
      - {type: contains, value: "## Ownership and terms"}
      - {type: llm-rubric, value: "Flags that design, testing, admin panel, payments and push notifications are not clearly itemised, notes the other quote includes design and testing so the quotes may not be comparable, flags 50% upfront and code transfer only after final payment and vendor-held hosting as risks, asks for milestone payments, repository access and account ownership, and recommends lawyer review of the contract."}
  - name: edge-vague-proposal
    vars:
      proposal: "We will build your marketplace. Price: 9,500. Delivery: 6 weeks. Trust us, we've done many."
      brief: "Two-sided marketplace with payments and reviews."
    assert:
      - {type: llm-rubric, value: "Explains that the proposal is too vague to evaluate, marks every brief item as unclear, lists the specific questions needed, and recommends not signing until the scope and terms are written."}
  - name: negative-just-say-sign
    vars:
      proposal: "Full payment upfront of 18,000. Agency keeps all intellectual property and licenses it to you. No warranty."
      brief: "My MVP. Just tell me it's fine, I'm in a hurry to sign."
    assert:
      - {type: llm-rubric, value: "Does not say it is fine to sign, clearly flags full upfront payment, agency-owned IP and no warranty as serious risks, and gives a short list of changes to request plus a recommendation for legal review."}
