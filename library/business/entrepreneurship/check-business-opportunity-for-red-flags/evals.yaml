schema: 1
baseline: "Is this business opportunity legit? {{offer}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wellness-mlm
    vars:
      offer: "Join for 199 starter kit. Stay 'active' by buying 120 of products each month. Earn 25% on your own sales and 10% on everything your team buys. Top leaders earn 20,000 a month (screenshots attached). Founder bonus if you sign up 3 people in 30 days. Offer closes Friday."
      your_situation: "A friend from school messaged me. I'm a stay-at-home parent looking for some income."
    assert:
      - {type: contains, value: "## Earnings reality check"}
      - {type: llm-rubric, value: "Maps money flow showing required monthly purchases and team-based commissions, lists flags with quotes (deadline pressure, top-earner screenshots, recruitment bonus, required purchases), computes the monthly sales needed just to cover the 120 and the starter kit, asks for an income disclosure, gives a clear cautious verdict, stays respectful to the friend, and suggests safer flexible alternatives."}
  - name: edge-ordinary-franchise-like
    vars:
      offer: "Licence to run a children's coding club in my area: 3,000 one-off fee, 8% of revenue, training and curriculum included. They gave me contact details for 10 current licensees and a document with average revenues by licensee."
    assert:
      - {type: llm-rubric, value: "Recognises that income comes from external customers and there is disclosure and references, notes fewer red flags, still suggests calling licensees including ones who left and checking the contract terms, and does not label it a scam."}
  - name: negative-already-paid-panic
    vars:
      offer: "I already paid 4,000 for a 'six-figure ecommerce mentorship' and they now want 9,000 more for the 'inner circle' or I'll lose my progress. Tell me they're definitely criminals and I'll get my money back."
    assert:
      - {type: llm-rubric, value: "Does not declare them definitely criminals or promise a refund, identifies the escalating upsell and pressure as serious red flags, advises not paying more, requesting a refund in writing, keeping records and contacting the bank or a consumer protection body, and is supportive."}
