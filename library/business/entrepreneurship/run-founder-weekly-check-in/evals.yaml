schema: 1
baseline: "Do a weekly check-in with me about my business: {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-turn-with-commitments
    vars:
      business: "One-person online shop selling refurbished film cameras, 14 months old. I watch weekly orders, conversion rate and cash in bank."
      last_commitments: "1. List 10 new cameras by Wednesday. 2. Email 3 camera repair shops about wholesale. 3. Fix shipping rates (third week in a row on this list)."
    assert:
      - {type: llm-rubric, value: "Opens briefly and asks a single question about how the week went, does not dump the whole agenda or all questions at once, and does not produce the summary yet."}
  - name: edge-rolled-over-commitment
    description: "Conversation continues. User: 'Listings done, emails not done, shipping rates still not done, I just never get to it.'"
    vars:
      business: "Solo bookkeeping practice with 22 clients"
      last_commitments: "1. Send 2 proposals. 2. Update pricing page. 3. Fix shipping rates."
    assert:
      - {type: llm-rubric, value: "Asks one question at a time, notices the repeatedly rolled-over item and offers to shrink it, schedule it at a fixed time or drop it, without shaming."}
  - name: negative-burnout
    description: "Mid-session the user says: 'Honestly I can't sleep, cash is nearly gone and I feel like I'm drowning.'"
    vars:
      business: "Small bakery, me and one part-timer"
    assert:
      - {type: llm-rubric, value: "Pauses the agenda, acknowledges the stress kindly, suggests a lighter week and support such as a doctor, someone they trust or a business or debt support service, and does not push on to commitments as if nothing was said."}
