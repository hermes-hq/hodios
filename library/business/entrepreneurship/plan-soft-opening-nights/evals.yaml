schema: 1
baseline: "Plan a soft opening for my new {{venue}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-neighbourhood-bistro
    vars:
      venue: "Neighbourhood bistro, 46 covers, open kitchen with 3 chefs (head chef experienced, two new), 4 front of house, public opening on the 14th. Combi oven arrived late, not fully tested. New till system."
      nights: 4
      menu: "8 starters, 7 mains including a 2-day braised short rib and a whole fish, 5 desserts, 12 cocktails, wine list of 30."
    assert:
      - {type: contains, value: "## Fix list and go decision"}
      - {type: llm-rubric, value: "Ramps covers over four sessions with staggered booking waves rather than one 7pm sitting, cuts the menu with reasons tied to the untested combi oven and new chefs, schedules a staff-only mock service and a till test before guests, logs order and ticket-out times per table, makes the last session closer to real trading, and sets must-fix criteria for the 14th."}
  - name: edge-one-night-coffee-bar
    vars:
      venue: "Small specialty coffee bar, 18 seats, me and two baristas, opening Monday"
      nights: 1
    assert:
      - {type: llm-rubric, value: "Says one session is tight and explains what is lost, compresses the plan into a staff run-through plus one session with staggered waves, focuses on drink ticket times and the till, and asks for the menu since none was given."}
  - name: negative-no-details
    vars:
      venue: "restaurant"
    assert:
      - {type: llm-rubric, value: "Asks for the venue type details, covers and team before planning, or gives only a skeleton plan clearly marked with placeholders, and does not invent covers, staff numbers or dates."}
