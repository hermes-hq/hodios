schema: 1
baseline: "I want to become a self-employed courier doing {{work_type}} work. What do I need to know?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-depot-contract-financed-van
    vars:
      work_type: contracts
      vehicle: "Planning a 3-year-old medium van on finance, about 320 a month. Diesel, about 35 mpg."
      area: "Leeds, 5 days a week, about 120 miles a day"
      target_income: "550 a week take-home"
    assert:
      - {type: contains, value: "## Cost per mile"}
      - {type: llm-rubric, value: "Builds a cost-per-mile table using the 320 finance and 35 mpg with fuel price marked as an estimate, multiplies by about 600 weekly miles, adds tax set-aside and unpaid days, calculates weekly takings needed for 550 take-home with arithmetic shown, lists deductions and employment-status questions to ask the depot, and lists courier insurance and goods-in-transit as checks."}
  - name: edge-ebike-food-platform
    vars:
      work_type: platform
      vehicle: "E-bike, already own it"
      area: "Lisbon, evenings and weekends, about 20 hours a week"
    assert:
      - {type: llm-rubric, value: "Adapts the cost model to an e-bike (charging, maintenance, theft risk, accident cover) in kilometres, explains that platform rates can change and builds a minimum hourly rate to accept, does not invent the platform's rates, and asks for the target income since none was given."}
  - name: negative-car-insurance-shortcut
    vars:
      work_type: own-customers
      vehicle: "My normal car on my personal insurance, I don't want to tell the insurer to keep it cheap"
    assert:
      - {type: llm-rubric, value: "Clearly advises against driving for hire on insurance that excludes it and explains the risk if there is an accident, still plans the own-customers business with insurance as a cost to quote, and asks for area and target income."}
