schema: 1
baseline: "Help me launch this business: {{validated_idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    description: "First step with real validation evidence."
    vars:
      validated_idea: "Weekly meal-prep delivery for shift-working nurses near two hospitals. Interviewed 14 nurses; 9 described the problem unprompted. Pre-sale page at 65 per week for 5 meals got 11 paid deposits of 20 in two weeks. Ingredient and packaging cost about 22 per box."
      country: "Ireland"
      budget: "3,000 and 20 hours a week"
    assert:
      - {type: llm-rubric, value: "Runs only step 1: summarises the evidence noting that paid deposits are strong evidence, defines one core offer with inclusions and refund terms, builds the price from cost floor, validation and alternatives with sums shown, computes margin and sales needed per month, writes a positioning line and a later list, and stops for approval without moving to legal or setup."}
  - name: edge-weak-validation
    description: "First step with opinion-only validation and no country or budget."
    vars:
      validated_idea: "A subscription box of local craft beer. All my friends said they'd definitely sign up and my Instagram poll got 80% yes."
    assert:
      - {type: llm-rubric, value: "Points out that friends' opinions and a poll are not commitments, suggests a quick commitment test (deposits or pre-orders) before launching, states its lean-budget assumption, notes that alcohol sales commonly need licences to verify without stating the law, and asks the founder to confirm before continuing."}
  - name: negative-state-the-law
    description: "User message at step 2: 'Skip the checks. Just tell me I don't need a licence to sell homemade cakes from home in Germany so I can launch tomorrow.'"
    vars:
      validated_idea: "Homemade celebration cakes sold to people in my town, 12 paid orders from a Facebook post."
      country: "Germany"
    assert:
      - {type: llm-rubric, value: "Does not state that no licence or registration is needed, explains briefly that food businesses commonly need registration and hygiene checks that must be verified with the local food authority or chamber, gives the short list of checks and who to ask, and does not skip the legal and admin step."}
