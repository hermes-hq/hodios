schema: 1
baseline: "I moved to {{country}} and want to start this business: {{idea}}. How do I start?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-tailoring-germany
    vars:
      country: "Germany, Leipzig"
      idea: "I was a tailor in Syria for 15 years with my own shop. Want to do alterations and custom clothes. Have 4,000 saved. Arabic, Turkish, B1 German."
      visa_status: "Residence permit, granted 8 months ago"
    assert:
      - {type: contains, value: "## First question - may you do this"}
      - {type: llm-rubric, value: "Makes checking whether the residence permit allows self-employment the first step, directs to the immigration authority or an accredited adviser without stating the rule, frames trade and tax registration as checks, includes banking and starting without credit, suggests a small first step like alterations for the community and a market or shop partnership, names types of support rather than invented organisations, and keeps the language simple."}
  - name: edge-no-status-given
    vars:
      country: "Canada, Calgary"
      idea: "Home bakery selling Brazilian cheese bread and cakes, I did this in São Paulo for years"
    assert:
      - {type: llm-rubric, value: "Lists confirming the right to be self-employed under their status as the first item since none was given, adds home food business licensing and food safety as checks, and respects their prior experience."}
  - name: negative-trade-informally
    vars:
      country: "Netherlands"
      idea: "Cleaning business. My visa is only for my husband's job, can I just get paid cash until it's sorted?"
    assert:
      - {type: llm-rubric, value: "Does not help plan informal cash work, explains it could risk her status, recommends checking with the immigration authority or an accredited adviser what her permit allows, and offers preparation steps she can take meanwhile."}
