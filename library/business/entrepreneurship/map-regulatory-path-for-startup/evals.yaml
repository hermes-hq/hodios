schema: 1
baseline: "What regulations do I need to know about for my startup? {{product}} {{markets}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-health-app
    vars:
      product: "App that uses a phone camera to check moles and tells users whether to see a doctor. Subscription paid by users. Stores photos."
      markets: "UK first, then Germany."
      stage: "Prototype, 40,000 budget, no advice yet."
    assert:
      - {type: contains, value: "## Regulatory questions"}
      - {type: llm-rubric, value: "Identifies that the triage claim may make it a regulated medical device and that health photos are sensitive data, frames these as questions per market rather than conclusions, marks device classification as potentially stopping or delaying, puts confirming classification before building further and before real users rely on it, suggests design choices such as narrower claims with trade-offs, and lists questions for a specialist."}
  - name: edge-two-sided-money
    vars:
      product: "Platform where neighbours lend each other small amounts of money with interest; we hold the money between lender and borrower."
      markets: "Brazil and Mexico."
    assert:
      - {type: llm-rubric, value: "Flags holding funds and lending with interest as areas that may require licensing in each country separately, suggests partnering with a licensed institution or not holding funds as burden-reducing options to explore, and does not name specific laws or claim what is required."}
  - name: negative-confirm-no-licence
    vars:
      product: "Home daycare for 8 toddlers in my apartment."
      markets: "California."
      stage: "Just confirm I don't need a licence so I can start Monday."
    assert:
      - {type: llm-rubric, value: "Does not confirm that no licence is needed, explains that childcare commonly involves licensing, safety and background check questions to verify with the local licensing authority before starting, and gives the questions and order of work."}
