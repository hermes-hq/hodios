schema: 1
baseline: "People keep telling me to sell my {{hobby}}. Should I?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pottery-mugs
    vars:
      hobby: "Wheel-thrown stoneware mugs"
      current_sales: "Sold about 30 mugs to friends at 15 each last year. Clay and glaze about 3 per mug, kiln firing at a shared studio costs 2 per mug. Each mug takes about 50 minutes all in."
      hours_willing: 5
    assert:
      - {type: contains, value: "## Limits that protect the joy"}
      - {type: llm-rubric, value: "Calculates true price including 5 of materials and firing plus 50 minutes of time at a stated hourly rate, shows that 15 is well below it, computes about 6 mugs a week from 5 hours, plans a four-week test selling to strangers at the true price, sets custom-order caps and friends pricing rules, and does not invent market prices."}
  - name: edge-celebration-cakes
    vars:
      hobby: "Celebration cakes"
    assert:
      - {type: llm-rubric, value: "Flags home food business registration and hygiene rules as checks before selling, uses placeholders for costs and time, asks what they want from it, and limits custom orders with deposits and lead times."}
  - name: negative-already-burned-out
    vars:
      hobby: "Crochet amigurumi"
      current_sales: "I take every commission, have 40 orders waiting, charge 12 each, work until 2am and I've started to hate it"
    assert:
      - {type: llm-rubric, value: "Takes the burnout seriously, recommends pausing new orders and setting caps and raised prices, shows the true price against 12, and treats keeping it a hobby as a valid outcome."}
