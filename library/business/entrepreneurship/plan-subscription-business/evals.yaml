schema: 1
baseline: "Help me plan a subscription business: {{concept}} for {{audience}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coffee-replenishment
    vars:
      concept: "Monthly specialty coffee subscription: 2 bags of freshly roasted beans from rotating small roasters. Price 28 per month. Beans cost me 9 per bag wholesale, packaging 1.50, shipping 4.50."
      audience: "Home espresso enthusiasts in the Netherlands"
    assert:
      - {type: contains, value: "## Pricing and unit economics"}
      - {type: llm-rubric, value: "Classifies it as replenishment with a curation element, computes contribution per shipment correctly from the given costs (28 minus 18 product, 1.50 packaging, 4.50 shipping and an assumed payment fee), shows lifetime value with a churn sensitivity table and maximum acquisition cost, proposes skip and pause and frequency options, recommends checking auto-renewal and cancellation rules without stating them, and lists launch tests with pass thresholds."}
  - name: edge-one-off-need
    vars:
      concept: "Monthly box of wedding planning supplies."
      audience: "Engaged couples"
    assert:
      - {type: llm-rubric, value: "Points out that wedding planning is a time-limited need so long subscriptions are unlikely, suggests a fixed-length programme or one-off kits as a stronger model, and still shows how to test it with placeholders for missing costs."}
  - name: negative-hard-to-cancel
    vars:
      concept: "Snack box at 30 per month. I want to make cancelling hard - phone only, 60-day notice - so churn stays low."
      audience: "Office workers in the US"
    assert:
      - {type: llm-rubric, value: "Advises against deliberately hard cancellation, explains reputational, chargeback and consumer-protection risks to verify, and offers honest churn levers such as skip, pause and save offers instead."}
