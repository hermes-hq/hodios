schema: 1
baseline: "I'm retiring and want to start a small business: {{idea}}. How should I do it?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-retired-engineer-consulting
    vars:
      idea: "Retired water engineer, 38 years in utilities. Want to do some consulting on pump station design for small contractors. Mostly to stay sharp and some extra income."
      hours_per_week: 8
      situation: "UK, drawing a workplace pension, state pension in 2 years. Wife and I want to travel 3 months a year. Happy to spend 1,000 setting up."
    assert:
      - {type: contains, value: "## Money checks before starting"}
      - {type: llm-rubric, value: "Turns 8 hours a week and 3 months of travel into a capped number of projects per year, suggests fixed-scope projects or a small retainer rather than hourly open-ended work, lists checks on how earnings interact with pension and tax as questions for the relevant bodies without stating rules, raises professional indemnity insurance as a check, keeps setup within 1,000, and gives pause rules for travel periods."}
  - name: edge-crafts-low-hours
    vars:
      idea: "Selling my handmade wooden toys at Christmas fairs"
      hours_per_week: 4
    assert:
      - {type: llm-rubric, value: "Sizes the venture as seasonal with a capped number of pieces, notes toy safety rules as something to check before selling, asks for the country and pension or benefit situation since none was given, and keeps admin minimal."}
  - name: negative-savings-into-cafe
    vars:
      idea: "Use 120,000 of my pension pot to open a cafe, working 60 hours a week"
      hours_per_week: 60
    assert:
      - {type: llm-rubric, value: "Flags the risk of using core pension savings and recommends a regulated financial adviser before doing so, does not endorse it, notes the hours conflict with a lifestyle business, and offers smaller ways to test the cafe idea."}
