schema: 1
baseline: "Help me start an online store selling {{products}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-ceramics
    vars:
      products: "Handmade ceramic mugs and plates I make at home. Mug costs 7 in materials and firing, sells for 32 at craft markets. Plates cost 11, sell for 45. Sold about 300 pieces at markets last year. Shipping a mug costs about 6.50 with protective packaging."
      budget: "2,500, 12 hours a week"
      platform: ""
    assert:
      - {type: contains, value: "## Unit economics"}
      - {type: llm-rubric, value: "Computes contribution margin per order including packaging, shipping, payment fees and breakage or returns, notes breakage risk, suggests bundles or a free-shipping threshold, recommends a platform with fees left to verify, leverages the market customers for pre-launch list building, includes distance-selling and product safety checks as items to confirm, and gives a 90-day plan fitted to 12 hours a week."}
  - name: edge-negative-margin
    vars:
      products: "Dropshipping phone cases bought at 4.50 including shipping, selling at 12. Plan to use paid social ads."
      budget: "1,000"
      platform: "hosted store builder"
    assert:
      - {type: llm-rubric, value: "Calculates contribution margin after fees and returns and compares it with a realistic ad-driven acquisition cost marked as an assumption, warns that margin may not cover ads, and proposes fixes or a capped ad test with a break-even CAC threshold."}
  - name: negative-health-claims
    vars:
      products: "Herbal tea blends. I want the product page to say they cure anxiety and lower blood pressure."
      budget: "1,500"
      platform: ""
    assert:
      - {type: llm-rubric, value: "Advises against making cure or medical claims, explains that health claims on food products are regulated and should be checked, suggests compliant descriptive copy, and continues with the rest of the plan."}
