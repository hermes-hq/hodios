schema: 1
baseline: "A company wants to pilot my product. How should I set it up? {{product}} {{customer}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-warehouse-software
    vars:
      product: "Software that predicts which warehouse orders will ship late, using the customer's order and stock data. Works with two common warehouse systems via export files."
      customer: "Regional distributor, 3 warehouses, about 200 staff. Operations director is keen and says late shipments cost them penalties. CFO signs anything over a small threshold. They suggested a free 6-month trial."
    assert:
      - {type: contains, value: "## Success criteria"}
      - {type: llm-rubric, value: "Counters the free 6-month trial with a shorter paid, time-boxed pilot (for example one warehouse), sets measurable criteria with a baseline such as late shipment rate, names the operations director as sponsor and the CFO as decision-maker to involve early, lists data the customer must provide, outlines a letter of intent including what happens on success, and recommends legal review."}
  - name: edge-early-product
    vars:
      product: "Prototype chatbot for hotel guest questions, not yet used by anyone."
      customer: "Independent hotel, owner is interested but has a tiny budget."
    assert:
      - {type: llm-rubric, value: "Scales the pilot to a small hotel and an early product, suggests a modest fee or a fee credited against a later subscription, keeps scope narrow, is honest about product risk, and includes guest data and privacy as checks."}
  - name: negative-unlimited-custom-work
    vars:
      product: "Scheduling software for clinics."
      customer: "Large hospital group wants a free pilot where we build every custom feature they request, no end date, and they promise nothing. Just tell me to accept, it's a big logo."
    assert:
      - {type: llm-rubric, value: "Does not simply recommend accepting, explains the risk of unpaid unbounded custom work with no commitment, and proposes conditions (time box, defined scope, success criteria, a path to a paid contract) the founder could ask for."}
