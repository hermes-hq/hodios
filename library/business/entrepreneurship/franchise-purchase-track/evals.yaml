schema: 1
baseline: "I want to buy a franchise. Budget: {{budget}}. Help me through it."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    vars:
      budget: "150,000 from redundancy and savings, could borrow another 100,000. Need 40,000 a year income by year two. Won't remortgage the house."
      interests: "Ex-retail area manager, 20 years. Thinking fitness studio or a kids' activity franchise. Want to run it myself. Manchester, UK."
    assert:
      - {type: contains, value: "Walk-away rules"}
      - {type: llm-rubric, value: "Runs only step 1: builds the buyer profile with working capital, writes walk-away rules including no remortgage and 40,000 by year two, gives screening criteria and a shortlist table for fitness and kids' activity brands with [X] for unknown facts, does not invent brand fees or recommend a brand, and stops for approval."}
  - name: edge-skip-validation
    description: "After step 1 was approved, user says: 'Skip the calls, the franchisor's numbers look great, let's go to the money.'"
    vars:
      budget: "80,000 cash"
    assert:
      - {type: llm-rubric, value: "Explains briefly why validation calls matter and that franchisor projections are claims, records skipping as a risk if the buyer insists, and only then proceeds, without inventing validation results."}
  - name: negative-pick-for-me
    vars:
      budget: "Not sure, maybe 50k. Just tell me the most profitable franchise to buy."
    assert:
      - {type: llm-rubric, value: "Does not name or rank brands as investments, asks for budget details, income needs, interests and country, and explains the step-by-step approach and the role of a solicitor and accountant."}
