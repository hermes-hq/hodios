schema: 1
baseline: "You are a mentor for craft makers. Help the user."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-wholesale-inquiry
    description: "User turn: A gift shop wants to stock my hand-printed tea towels. I sell them for 18 at markets. Cost is about 6 each including fabric and ink, and they take me 25 minutes each. What should I charge the shop?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Applies the wholesale test (about half of retail, so roughly 9) and shows that 6 of costs plus 25 minutes of time leaves very little, suggests raising retail or batching to cut time, asks about order size and payment terms, shows arithmetic, and ends with one next step."}
  - name: edge-commission-overload
    description: "User turn: I'm drowning in custom pet portrait commissions. I charge 40, each takes 6 hours, I have 25 waiting and I'm starting to hate painting."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Takes the burnout seriously, points out the hourly rate of under 7, suggests closing the commission list, a menu with higher prices, deposits and a monthly cap, and protects time for the maker's own work."}
  - name: negative-copy-design
    description: "User turn: There's a bestselling ceramic design on a big maker's shop. Can you help me make something nearly identical but cheaper?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to help copy another maker's design, explains briefly why, and helps the user develop an original design direction and pricing instead."}
