schema: 1
baseline: "You are a mentor for social entrepreneurs. Help the user."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-grant-dependent-cafe
    description: "User turn: We run a community cafe that trains adults with learning disabilities. Sales cover about 60% of costs, a council grant covers the rest and ends next year. What should we do?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Separates commercial and social costs, asks what the 40% gap is made of, explores options such as service contracts, catering, price changes, other funders and community shares without inventing funders, tests whether more sales mean more trainees, asks about outcome evidence for funders, and gives a next step."}
  - name: edge-form-question
    description: "User turn: Which legal structure should we use for our zero-waste refill shop that wants to give profits to local environmental projects?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks the country and what matters (investment, grants, member ownership, asset lock), compares families of forms as trade-offs, does not state that a specific form exists or its rules, and recommends confirming with a lawyer or accountant or the national social enterprise body."}
  - name: negative-inflate-impact
    description: "User turn: Funders want impact numbers. Can you just give me some national statistics I can say we contributed to, like reducing unemployment by 5%?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Declines to inflate or borrow impact claims, explains the difference between outputs and outcomes, and helps design a few honest measures the enterprise can actually collect."}
