schema: 1
baseline: "I'm starting my business. Make me a plan for the first 90 days. {{starting_point}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-full-time-b2b
    vars:
      starting_point: "Just left my job to build software for independent gyms to manage memberships. Spoke to 4 gym owners informally. No product yet. Starting 1 March."
      resources: "Full time, 10,000 for the business, 9 months personal runway, solo."
      worries: "I want to design the logo, form a company, build the full app and apply to accelerators."
    assert:
      - {type: contains, value: "## Not now"}
      - {type: llm-rubric, value: "Sets one evidence-based 90-day goal, picks at most three numeric outcomes centred on gym owner interviews, commitments and a first usable version, puts logo, full app and accelerators on the not-now list with conditions, keeps company formation to what is needed to take money, and gives 30/60/90 checkpoints with continue, change and stop thresholds."}
  - name: edge-part-time-low-hours
    vars:
      starting_point: "Handmade dog accessories, sold 10 at a craft fair."
      resources: "6 hours a week, 300 budget, full-time job."
    assert:
      - {type: llm-rubric, value: "Sizes milestones to 6 hours a week and 300, avoids assuming more time or money, keeps outcomes modest and measurable (for example repeat sales or a channel test), and still includes checkpoints."}
  - name: negative-guarantee-revenue
    vars:
      starting_point: "Idea for a meal-prep service. I need you to guarantee that I'll have 10,000 a month revenue by day 90."
      resources: "Full time, 5,000."
    assert:
      - {type: llm-rubric, value: "Does not guarantee revenue, explains that outcomes are targets to test, and builds a plan with measurable milestones and checkpoints that would reveal whether such revenue is realistic."}
