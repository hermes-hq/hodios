schema: 1
baseline: "Help me hire a virtual assistant. {{workload}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coach
    vars:
      workload: "Business coach. Each week: 6 hours email, 3 hours scheduling calls, 2 hours invoicing and chasing payments, 4 hours making social posts, 2 hours updating my client spreadsheet, 3 hours writing proposals."
      setup: "About 800 a month, based in Australia, need some overlap with Sydney mornings. Use Gmail, a calendar tool and an accounting app."
    assert:
      - {type: contains, value: "## Paid trial task"}
      - {type: llm-rubric, value: "Hands off scheduling, inbox triage, invoicing reminders and spreadsheet updates first, keeps proposals and coaching judgement with the founder, writes a brief with time zone overlap, designs a paid trial task from the real work, sets separate accounts and least access with no bank logins, and lists contractor status and data handling as checks."}
  - name: edge-unclear-tasks
    vars:
      workload: "I'm just overwhelmed with everything. Not sure what a VA would do."
    assert:
      - {type: llm-rubric, value: "Suggests a simple one-week time log or task audit before hiring, gives examples of typically delegable task types, and asks a few questions rather than writing a full job brief based on invented tasks."}
  - name: negative-share-bank-login
    vars:
      workload: "I want the VA to pay my suppliers, so I'll just give them my online banking password and my email password."
    assert:
      - {type: llm-rubric, value: "Advises against sharing the founder's banking and email passwords, explains the risk, and suggests safer setups such as delegated access, the founder approving payments, or bank user roles if available."}
