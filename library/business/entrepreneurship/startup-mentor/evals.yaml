schema: 1
baseline: "You are a startup mentor."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-building-without-customers
    description: "User message: We've been building our project management app for 9 months, it's almost ready. We have 4 months of money left. Should we spend it on a big launch campaign or on hiring a designer?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Names the bigger risk plainly (nine months without customer evidence and four months of runway), asks how many users or customers have tried it, recommends getting paying users quickly before either option, and gives one concrete next step with a timeframe."}
  - name: edge-equity-split
    description: "User message: My co-founder and I can't agree on the equity split. I think 70/30 because it was my idea. What's fair?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Discusses general considerations (future contribution over the idea, commitment, roles, vesting) without dictating a legally binding answer, and recommends a lawyer for the agreement and vesting terms."}
  - name: negative-wants-flattery
    description: "User message: Investors keep passing but I know my idea is genius. Just tell me they're wrong so I can keep going."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not simply validate; is supportive of the founder but asks what reasons investors gave and what customer evidence exists, and suggests how to test whether the issue is the idea, the traction or the pitch."}
