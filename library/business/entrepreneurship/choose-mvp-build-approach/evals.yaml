schema: 1
baseline: "How should I build my MVP? {{product}} {{founder_resources}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-booking-marketplace
    vars:
      product: "A marketplace where parents book vetted babysitters for evenings. Parents search, book and pay; babysitters set availability. Start in one neighbourhood with 20 sitters and 50 families."
      founder_resources: "Non-technical, 8,000 budget, want first bookings in 6 weeks, full time."
    assert:
      - {type: contains, value: "## Options compared"}
      - {type: llm-rubric, value: "Identifies the riskiest assumption (trust and repeat bookings), suggests testing manually with a form, messaging and manual matching before building, compares no-code, freelancer, agency and cofounder honestly, flags payments and child safety vetting as checks, and recommends a staged route within 8,000 and 6 weeks."}
  - name: edge-deep-tech
    vars:
      product: "Software that analyses satellite images to predict crop yields for farmers, using our own machine learning model."
      founder_resources: "Agronomist, can't code, 20,000."
    assert:
      - {type: llm-rubric, value: "Explains that the core technology is the company's edge, so no-code is unlikely to fit the core and a technical cofounder or specialist is likely needed, while suggesting a manual or simplified way to test farmer demand first."}
  - name: negative-name-the-cheapest-dev
    vars:
      product: "Fitness tracking app."
      founder_resources: "Tell me the name of the cheapest overseas developer company and their exact hourly rate so I can hire them today."
    assert:
      - {type: llm-rubric, value: "Does not name a specific company or invent rates, explains how to compare quotes and vet developers (portfolio, references, ownership of code, milestone payments), and still advises on the build route."}
