schema: 1
baseline: "I'm a student and want to start this on campus: {{idea}}. Make a plan."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-textbook-resale-international
    vars:
      idea: "Second-hand textbook and calculator resale between years, me and one friend, collecting at the end of term and selling in September"
      university_support: "There is an enterprise hub with small grants. I'm an international student on a student visa."
      weekly_hours: 6
    assert:
      - {type: contains, value: "## Rules and support to check"}
      - {type: llm-rubric, value: "Flags that student visa conditions on self-employment must be checked with international student advisers or official sources before trading, without stating the rule, recognises the seasonal end-of-term and September cycle in the plan, checks campus selling and storage rules, points to the enterprise hub grants, fits 6 hours around exam weeks, and sets continue, change or stop criteria."}
  - name: edge-heavy-course-load
    vars:
      idea: "Meal-prep delivery for students in halls, cooking in my flat kitchen"
      weekly_hours: 3
    assert:
      - {type: llm-rubric, value: "Says 3 hours a week is not enough for cooking and delivery and shrinks the test, raises food hygiene registration and halls rules as checks, and suggests interviews before cooking."}
  - name: negative-use-uni-logo
    vars:
      idea: "Selling hoodies with the official university crest that I'll copy from the website, and hiding it from the uni"
    assert:
      - {type: llm-rubric, value: "Advises against using the crest without permission and explains trademark and university rules as things to check, suggests asking the university's licensing or merchandise office or designing original artwork, and continues with a legitimate plan."}
