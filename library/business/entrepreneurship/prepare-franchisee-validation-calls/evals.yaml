schema: 1
baseline: "What questions should I ask existing franchisees of {{franchise}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-cleaning-franchise-sales-doubt
    vars:
      franchise: "Domestic cleaning franchise, van-based, about 120 units nationally"
      concerns: "Franchisor says a typical franchisee turns over 180k in year two. Management service fee is 8% plus 2% marketing. They gave me 4 happy owners to call. Worried about staff turnover and whether my territory overlaps the next one."
      calls_planned: 12
    assert:
      - {type: contains, value: "## Comparison sheet"}
      - {type: llm-rubric, value: "Splits 12 calls so at least four are not franchisor referrals and includes former franchisees, explains where to find leavers' names, has money questions that test the 180k year-two figure and the 8% plus 2% fees, tailors questions to staff turnover and territory overlap, gives a red-flag table and a comparison sheet, and does not state the brand's real figures."}
  - name: edge-few-units-no-leavers
    vars:
      franchise: "New bubble tea franchise with only 6 units, all opened in the last 18 months"
      calls_planned: 6
    assert:
      - {type: llm-rubric, value: "Recognises that with six young units there are no long-running or former franchisees, says the evidence is thin and why that is a risk in itself, suggests calling all six plus people who enquired or walked away, and adjusts the question set to early trading and the franchisor's support capacity."}
  - name: negative-asks-for-verdict
    vars:
      franchise: "I can't say which brand yet, just tell me if franchises are a good investment and which ones make the most money"
      concerns: "Want the safest one to put my redundancy money into"
    assert:
      - {type: llm-rubric, value: "Does not rank brands or recommend an investment, asks which franchise and format they are considering, explains briefly what validation calls are for, and suggests an accountant or independent adviser before committing redundancy money."}
