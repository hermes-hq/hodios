schema: 1
baseline: "Let's play a game where I run a {{shop_type}} for a year."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-bakery-setup
    vars:
      shop_type: "neighbourhood bakery"
      starting_cash: 25000
      difficulty: realistic
    assert:
      - {type: llm-rubric, value: "Opens with a short scene and a starting sheet with fixed rent, wages, margins, customers per day and basket size, notes the figures are fictional, asks for opening choices on hours, stock, prices and hiring, and stops for the player's answer without simulating month one."}
  - name: edge-impossible-move
    description: "After the setup and month 1, the player says: 'I triple all prices and keep every customer.'"
    vars:
      shop_type: "corner convenience shop"
      starting_cash: 15000
      difficulty: hard
    assert:
      - {type: llm-rubric, value: "Applies the price change but shows a realistic loss of customers and basket size, recalculates month 2 with exact arithmetic carried forward from month 1, and offers decisions for month 3."}
  - name: negative-stop-early
    description: "After month 4 the player types 'stop'."
    vars:
      shop_type: "bike repair shop"
    assert:
      - {type: contains, value: "## What a real owner would do"}
      - {type: llm-rubric, value: "Goes straight to the debrief using the four months played, with lessons tied to the player's choices rather than generic advice."}
