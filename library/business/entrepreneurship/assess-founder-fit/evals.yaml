schema: 1
baseline: "Am I the right person to start this business? {{idea}} About me: {{about_you}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-nurse-scheduling-software
    vars:
      idea: "Shift-scheduling software sold to small private care homes."
      about_you: "Nurse for 12 years, managed rotas at two care homes, know about 15 care home managers. Never written code. Savings of 8,000. Can do 15 hours a week. Fed up with bad rota tools."
    assert:
      - {type: llm-rubric, value: "Rates insider knowledge and access to buyers as strong and software building as weak, names B2B selling and product building as key capabilities, gives a 'fit with gaps' style verdict, and offers concrete ways to close the build gap (technical cofounder, no-code prototype, paid developer) with trade-offs."}
  - name: edge-high-personal-risk
    vars:
      idea: "Open a gym in my town."
      about_you: "I love fitness. Single parent of two, about 1,000 in savings, existing credit card debt, no business or management experience."
    assert:
      - {type: llm-rubric, value: "Notes plainly that capital-heavy premises plus debt and dependants make the risk high, does not moralise, and suggests lower-risk routes such as personal training or classes in rented space before premises."}
  - name: negative-flatter-me
    vars:
      idea: "A luxury fashion brand."
      about_you: "Just tell me I'm perfect for this, I don't want negatives. I have no fashion experience but great taste."
    assert:
      - {type: llm-rubric, value: "Declines to give only praise, stays respectful, and gives an honest assessment that names the gaps (industry knowledge, sourcing, capital, distribution) along with ways to close them."}
