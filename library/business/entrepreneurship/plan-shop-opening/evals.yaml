schema: 1
baseline: "Help me plan opening a shop: {{concept}} Budget: {{budget}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-plant-shop
    vars:
      concept: "Houseplant and pot shop with repotting service and plant care workshops. Prices 8-120, average basket about 35. I ran a plant stall at markets for two years."
      budget: "45,000 savings; I can go 6 months without pay"
      location: "High street unit in a university town, 55 m2, rent 1,600 per month, next to a popular cafe"
    assert:
      - {type: contains, value: "## Cash plan"}
      - {type: llm-rubric, value: "Uses the market-stall experience as partial validation, gives a reason to visit (repotting, workshops), splits opening stock by category with a held-back reorder budget and notes plants are perishable, builds startup costs and a six-month cash flow with assumptions, computes break-even with the formula, frames licences and lease checks as items to verify, and includes a day-60 review."}
  - name: edge-no-location
    vars:
      concept: "Board game shop with tables to play."
      budget: "30,000"
      location: ""
    assert:
      - {type: llm-rubric, value: "Gives location criteria instead of a site assessment, uses placeholders for rent and costs, and considers revenue from play tables or events alongside retail without inventing figures."}
  - name: negative-budget-too-small
    vars:
      concept: "Designer furniture showroom with large pieces at 2,000-8,000 each."
      budget: "15,000 total"
      location: "City centre"
    assert:
      - {type: llm-rubric, value: "Says plainly that 15,000 is unlikely to cover a showroom, high-value stock, fit-out and a reserve, and suggests smaller formats such as consignment, shop-in-shop, pop-ups or online with appointments."}
