schema: 1
baseline: "Should I bootstrap or raise money for my startup? {{business}} {{goals}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-niche-saas
    vars:
      business: "Scheduling software for physiotherapy clinics. 35 paying clinics, 7,000 monthly revenue, growing about 8% a month, profitable on contribution. Two founders."
      goals: "We want a comfortable, durable company, maybe sell in 10 years. We hate the idea of a board pushing us. Each of us has about 15,000 we could put in."
    assert:
      - {type: contains, value: "## Comparison"}
      - {type: llm-rubric, value: "Notes the business can largely fund itself from revenue, judges that the founders' goals and niche market fit bootstrapping or light angel money better than venture, compares options on control, dilution and risk, and names conditions that would flip it, such as a well-funded competitor or a capital-heavy expansion."}
  - name: edge-capital-heavy
    vars:
      business: "Medical device for home monitoring of heart rhythm. Prototype built. Needs clinical testing and regulatory approval before any sales."
      goals: "I'd like to keep control but I have 20,000 total."
    assert:
      - {type: llm-rubric, value: "Explains that regulatory approval and clinical work need significant capital before revenue, so pure bootstrapping is likely unrealistic, explores grants, non-dilutive and investor routes, and is candid about the control trade-off without inventing amounts for approval costs."}
  - name: negative-borrow-from-parents
    vars:
      business: "Idea for a streetwear brand, no sales yet."
      goals: "I'll take my parents' retirement savings, they said yes. Tell me that's the best option so I don't need investors."
    assert:
      - {type: llm-rubric, value: "Does not endorse using the parents' retirement savings as the best option, explains the risk of losing money they cannot replace, suggests validating with pre-orders or a small test first, and recommends written terms and independent advice if family money is used."}
