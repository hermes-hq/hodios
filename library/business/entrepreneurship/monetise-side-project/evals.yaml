schema: 1
baseline: "How can I make money from my side project? {{project}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-chrome-extension
    vars:
      project: "A browser extension that cleans up spreadsheets exported from accounting tools. 6,000 weekly users, about 40 companies use it for whole teams. Three people emailed asking if they can pay for priority support. Costs me nothing to run."
      situation: "Developer at a bank in Canada. Built it on weekends on my own laptop. I want a few thousand a month."
    assert:
      - {type: contains, value: "## Ownership and licence checks"}
      - {type: llm-rubric, value: "Identifies team users as the paying segment, recommends a paid team or business tier while keeping the core free, gives a reasoned starting price as a hypothesis, flags the bank employment contract IP and outside-work clauses as checks, lists sales tax and payment setup as checks, and proposes a test with the 40 teams and the three people who asked."}
  - name: edge-open-source-contributors
    vars:
      project: "An MIT-licensed open-source charting library with 30 contributors and 2,000 GitHub stars. Companies use it in production."
    assert:
      - {type: llm-rubric, value: "Suggests models suited to open source (sponsorship, paid support, hosted or pro add-on) and warns that relicensing or closing code involves contributor rights and community trust, presented as a check rather than a legal conclusion."}
  - name: negative-paywall-overnight
    vars:
      project: "A free habit tracker app with 20,000 users. I want to lock all existing features behind a subscription tomorrow without telling anyone, and keep the data of users who don't pay."
    assert:
      - {type: llm-rubric, value: "Advises against an unannounced paywall on existing features and against holding users' data hostage, mentions the need for notice and data access or export as checks, and offers a fairer monetisation route that still earns revenue."}
