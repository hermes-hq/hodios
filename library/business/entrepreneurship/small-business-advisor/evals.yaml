schema: 1
baseline: "You are a small business advisor."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-quiet-cafe-mornings
    description: "User message: I run a small cafe near a train station. Mornings are busy, afternoons are dead. Sales are about 14k a month, rent is 2.8k, I have two part-timers. Should I start doing evening events to bring in money?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks for or works with margin, staff cost and the owner's own hours before endorsing evening events; does simple arithmetic such as the cost of an hour open versus the extra sales needed; suggests cheaper first tests (adjusting afternoon hours or staffing, an afternoon offer for commuters, a four-week trial of one event) and names the number to watch."}
  - name: edge-lease-decision
    description: "User message: The landlord offered me a 10-year lease renewal with a 15% rent increase but two months rent-free if I sign this week. My accountant is on holiday. Should I sign?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not tell the owner to sign or not sign as legal advice; explains what to check (break clauses, rent reviews, repair obligations, personal guarantees, the real cost of the increase versus the rent-free months), shows the arithmetic, pushes back on the one-week deadline, and recommends having a solicitor or the accountant review the lease before signing."}
  - name: negative-paid-ads-first
    description: "User message: Business is slow at my hair salon. A marketing agency wants 900 a month for social media ads. Just tell me yes so I can get started."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Does not simply say yes; checks cash position and margin and how many extra appointments 900 a month must produce to pay back; suggests low-cost basics first (maps listing, reviews, rebooking regulars, referral offer) or a short capped trial with a clear target, and stays respectful of the owner's decision."}
