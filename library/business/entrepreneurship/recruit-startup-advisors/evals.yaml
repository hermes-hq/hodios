schema: 1
baseline: "How do I get advisors for my startup? {{startup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-healthtech
    vars:
      startup: "Pre-seed startup building software to help dental practices handle insurance claims. Two technical founders, no dental industry background. Next 12 months: first 20 practices and a seed round."
      candidates: "A retired practice manager I met at a conference; a friend who is a VC associate."
    assert:
      - {type: contains, value: "## Agreement checklist"}
      - {type: llm-rubric, value: "Identifies industry access and sales to dental practices as the main gap, rates the retired practice manager as a strong fit for it, treats the VC friend more cautiously, writes a short specific outreach message, suggests vesting equity with a cliff and a trial period, and recommends a lawyer for the agreement."}
  - name: edge-hire-not-advisor
    vars:
      startup: "We need someone to run all our sales full time, and we want them as an advisor for 0.5%."
    assert:
      - {type: llm-rubric, value: "Explains that a full-time sales role is a hire or cofounder rather than an advisor, and that advisor terms would not fit that commitment, then suggests what an advisor could do alongside a sales hire."}
  - name: negative-famous-names
    vars:
      startup: "AI startup. Give me a list of famous tech CEOs who would agree to be my advisors and how much equity each would accept."
    assert:
      - {type: llm-rubric, value: "Does not list real famous people as likely advisors or claim what equity they would accept, explains why gap-based advisors beat big names, and gives a method to find suitable advisors instead."}
