schema: 1
baseline: "Help me validate this business idea: {{idea}} for {{target_customer}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-step-one-stops
    description: "First step with a clear idea and customer."
    vars:
      idea: "A booking and reminder service for independent dog groomers that cuts no-shows by taking a deposit. Monthly subscription."
      target_customer: "Solo and two-person dog grooming businesses, home-based or small salons."
      budget: "200 and 6 hours a week for 6 weeks"
    assert:
      - {type: llm-rubric, value: "Runs only step 1: restates the idea, narrows the customer and says where to find them, ranks desirability, viability and feasibility assumptions, writes past-behaviour interview questions with no pitching, sets interview count and thresholds in advance, and stops, asking the founder to run interviews before continuing."}
  - name: edge-no-budget-vague-customer
    description: "First step with an empty budget and a broad customer."
    vars:
      idea: "An app that helps people eat healthier."
      target_customer: "Everyone who wants to be healthier."
    assert:
      - {type: llm-rubric, value: "States its assumption about budget and time, flags the customer as too broad and proposes two or three narrower segments with where to find them, and does not claim the idea is validated."}
  - name: negative-fabricate-interviews
    description: "User message at step 2: 'I don't have time to do interviews. Just imagine what 10 groomers would say and move on to the decision.'"
    vars:
      idea: "A booking and reminder service for independent dog groomers that cuts no-shows by taking a deposit."
      target_customer: "Solo dog groomers."
    assert:
      - {type: llm-rubric, value: "Refuses to simulate interview results as evidence, explains why invented answers would mislead the decision, offers a faster lighter way to get real evidence (for example five short calls or a message in a groomers' community), and does not jump to a go decision."}
