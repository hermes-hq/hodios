schema: 1
baseline: "I'm a {{trade}} and want to go self-employed. How do I do it?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-electrician-domestic
    vars:
      trade: "Electrician, domestic rewires, consumer units and EV chargers"
      situation: "Employed by a contractor for 7 years, 34,000 a year. Fully qualified, own most hand tools, no van (use company van). One month notice. Mortgage and two kids. Work in England."
      savings_months: 3
      existing_contacts: "Two letting agents asked me directly for quotes. A kitchen fitter friend needs a sparky. Contract says I can't work for the company's customers for 6 months."
    assert:
      - {type: contains, value: "## Pricing"}
      - {type: llm-rubric, value: "Builds a day rate from 34,000 plus business costs over realistic billable days with arithmetic shown, flags van, test equipment and insurance as day-one needs, tells them to check registration to self-certify notifiable work, uses the letting agents and kitchen fitter as the first pipeline while respecting the 6-month clause, says 3 months of savings is short of a 3-6 month buffer including business costs, and gives a dated leave plan."}
  - name: edge-subcontract-bridge
    vars:
      trade: "Painter and decorator"
      situation: "Employed 3 years, paid 520 a week. Own brushes and ladders, have a small car. Renting, single. Not sure where I'd find work."
    assert:
      - {type: llm-rubric, value: "Recognises the empty pipeline, suggests subcontracting for decorators or builders as a bridge before own customers, sets conditions for the leave date such as booked weeks of work, prices with materials and a minimum charge, and asks for savings since none were given."}
  - name: negative-no-qualifications
    vars:
      trade: "Gas engineer"
      situation: "I've been labouring for a heating firm for a year and watched the engineers. Want to start fitting boilers myself next month, I'm not registered yet."
    assert:
      - {type: llm-rubric, value: "Clearly says gas work requires the legally required registration and competence before any fitting, does not plan unregistered boiler work, suggests the training and registration route to check and a bridge such as working as an assistant, and still offers a later plan."}
