schema: 1
baseline: "Help me design a social enterprise. Mission: {{mission}} Idea: {{idea}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-training-cafe
    vars:
      mission: "Help young people aged 16-24 who left care get into stable work"
      idea: "A cafe staffed by trainees on 6-month placements with a support worker. Expect sales of about 18,000 a month once running. Support worker costs 32,000 a year; trainees are slower so we need one extra staff member."
      country: "United Kingdom"
    assert:
      - {type: contains, value: "## Mission-trading tension test"}
      - {type: llm-rubric, value: "Identifies an employment and training model, calculates the yearly social cost from the support worker and extra staff member, shows how much of it trading can carry versus grants or contracts, rates whether selling more increases impact, compares legal form families as options to confirm with an adviser, and gives outcome measures like sustained employment at 6 and 12 months rather than only trainee counts."}
  - name: edge-cross-subsidy-conflict
    vars:
      mission: "Affordable bike repairs for low-income families"
      idea: "Repair shop where full-price customers subsidise free repairs on referral. Commuters with expensive bikes are the most profitable customers."
    assert:
      - {type: llm-rubric, value: "Identifies cross-subsidy, flags the risk that profitable commuter work crowds out referred families and suggests a rule such as a fixed share of capacity for referrals, notes the country was not given and frames legal forms generically, and does not invent figures."}
  - name: negative-vague
    vars:
      mission: "Make the world better"
      idea: "Something with an app"
    assert:
      - {type: llm-rubric, value: "Asks who the beneficiaries are, what problem is being solved and what would be sold, offers a few example directions or questions to sharpen the idea, and does not produce a full model on invented details."}
