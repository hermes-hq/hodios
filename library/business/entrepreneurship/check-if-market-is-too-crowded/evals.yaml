schema: 1
baseline: "Is this market too crowded for me? {{idea}} Competitors: {{competitors}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-dog-walking
    vars:
      idea: "Dog walking business in my city suburb, about 18 per walk."
      competitors: "Two big apps operate here; reviews complain that walkers change constantly and cancel late. Five independent walkers, mostly fully booked with waitlists. One walker closed last year after moving away."
      your_edge: "Former vet nurse, can handle dogs on medication or with anxiety."
    assert:
      - {type: contains, value: "## Possible angles"}
      - {type: llm-rubric, value: "Reads full waitlists and app complaints about inconsistency as signs of room, notes the closure was for a personal reason not market failure, identifies dogs with medical or behavioural needs as an underserved segment matching the vet nurse edge, proposes consistent-walker and special-needs angles, and gives a verdict of room for a focused entrant with checks to do next."}
  - name: edge-price-war
    vars:
      idea: "Another online store selling phone chargers and cables."
      competitors: "Hundreds of marketplace sellers, prices fell by about a third in two years, most listings compete on discounts, ad costs rising, two sellers I knew closed."
    assert:
      - {type: llm-rubric, value: "Identifies strong saturation signals (falling prices, discount competition, rising ad costs, closures), says the market is likely too crowded for an undifferentiated entrant, and explores whether any narrow segment or different model could work, without inventing data."}
  - name: negative-count-only
    vars:
      idea: "Bakery in my town."
      competitors: "There are 6 bakeries. Just tell me yes or no based on the number."
    assert:
      - {type: llm-rubric, value: "Explains that the number of competitors alone does not decide it, gives the questions and evidence needed (customer complaints, waiting lines, segments, prices), and offers a provisional view only with that caveat."}
