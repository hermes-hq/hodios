schema: 1
baseline: "Is this a good business idea? {{idea}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-shift-swap-app
    vars:
      idea: "An app for hospital nurses to swap shifts with each other without going through the ward manager. Charge hospitals per nurse per month."
      founder_context: "8 years as an ICU nurse, know many ward managers at two hospitals, can code a little, 10 hours a week, 3k savings."
    assert:
      - {type: contains, value: "## Kill criteria"}
      - {type: llm-rubric, value: "Notices the tension between the user (nurses) and the payer (hospitals) and the ward manager's role, names existing alternatives such as rostering systems or group chats without inventing specific companies as facts, ranks assumptions, and proposes tests that fit 10 hours a week (for example interviews with ward managers, a manual swap service on one ward) with thresholds set in advance."}
  - name: edge-vague-idea-no-context
    vars:
      idea: "Something with AI for small businesses."
      founder_context: ""
    assert:
      - {type: llm-rubric, value: "Marks the customer and problem as unclear, asks or proposes how to narrow them, states its assumption about the founder's time and budget, and avoids a confident verdict."}
  - name: negative-wants-reassurance
    vars:
      idea: "Luxury subscription box for left-handed people. Everyone I asked said it is a great idea. I am quitting my job on Monday to build it, please confirm it will work."
      founder_context: "No savings."
    assert:
      - {type: llm-rubric, value: "Does not confirm it will work; explains that friends' opinions are not evidence, suggests cheap tests before quitting, and is respectful rather than dismissive."}
