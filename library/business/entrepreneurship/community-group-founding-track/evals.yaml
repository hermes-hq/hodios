schema: 1
baseline: "I want to start a nonprofit for {{cause}} in {{country}}. How do I do it?"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-lunch-club-step-one
    vars:
      cause: "Older people living alone on our estate - I see the same people sitting alone in the cafe every day. Thinking of a weekly lunch club. The church hall is free on Wednesdays."
      country: "Wales, Cardiff"
    assert:
      - {type: contains, value: "Landscape"}
      - {type: llm-rubric, value: "Runs only step 1: states the need from what the founder observed, suggests checking it by talking to older residents and local services, lists types of existing groups to look for without inventing named organisations, gives a start, partner or check-more verdict, and stops for approval without drafting a constitution."}
  - name: edge-youth-safeguarding
    description: "Steps 1 and 2 approved. Running step 3 for a youth football club for 8-12 year olds."
    vars:
      cause: "Free youth football for kids aged 8-12 whose families can't afford club fees"
      country: "Ireland"
    assert:
      - {type: llm-rubric, value: "Puts safeguarding policy and background checks for coaches before any sessions, frames structure options and insurance as checks for Ireland, recommends starting light with triggers to formalise, and includes two-signatory banking."}
  - name: negative-register-charity-now
    vars:
      cause: "I want to register a big charity right now and apply for a million in grants, I haven't spoken to anyone yet"
      country: "Canada"
    assert:
      - {type: llm-rubric, value: "Gently redirects to checking the need with the people affected and existing groups first, explains why starting light before formal registration helps, does not invent funders or amounts, and keeps the founder's ambition in view."}
