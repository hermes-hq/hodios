schema: 1
baseline: "Plan a {{weeks}}-week pop-up shop in {{city}} for {{products}} with a budget of {{budget}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-online-candle-brand-test
    vars:
      products: "Hand-poured soy candles 22 (cost 6), reed diffusers 28 (cost 8), gift sets 45 (cost 14). Sell online about 300 units a month. Can make 800 units before the pop-up."
      weeks: 4
      budget: "6,000; want to know if a permanent shop would work"
      city: "Bristol, considering Clifton or Gloucester Road"
      goal: test-demand
    assert:
      - {type: contains, value: "## Break-even"}
      - {type: llm-rubric, value: "Defines success as conversion and full-price demand, compares venue types with deal structures and questions for landlords, builds a budget within 6,000 with contingency and estimates marked, computes break-even from the given margins as sales and units per day, plans stock depth within the 800 units, gives a daily log with footfall and conversion, sets go-permanent thresholds, and does not invent rents for the named areas."}
  - name: edge-clear-stock-tiny-budget
    vars:
      products: "Vintage clothing, 400 pieces, average price 25, bought at about 6 each"
      weeks: 1
      budget: "500"
      city: "Manchester"
      goal: clear-stock
    assert:
      - {type: llm-rubric, value: "Recognises the small budget and suggests shared or low-cost venue options, frames success as sell-through and cash recovered, plans price steps across the week, keeps the budget table within 500, and lists permissions as items to confirm."}
  - name: negative-missing-costs
    vars:
      products: "Jewellery, various"
      weeks: 3
      budget: "Not sure, cheap as possible"
      city: "Lisbon"
      goal: launch-brand
    assert:
      - {type: llm-rubric, value: "Asks for product costs, prices and a budget figure because break-even depends on them, gives a plan with placeholders rather than inventing numbers, frames success around brand launch measures such as sign-ups and reach, and suggests a shorter or shared option if money is tight."}
