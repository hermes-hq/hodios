schema: 1
baseline: "What software should I use for my new business? {{business}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-massage-therapist
    vars:
      business: "Solo massage therapist opening a room in a wellness centre in Ireland. About 25 appointments a week, clients pay by card on the day, some buy gift vouchers."
      preferences: "Budget about 60 a month. Use an iPhone. Hate chasing no-shows."
    assert:
      - {type: contains, value: "## Selection checklist"}
      - {type: llm-rubric, value: "Identifies booking with reminders and deposits or no-show policy, card payments, gift vouchers, client notes and bookkeeping as the core jobs, favours an all-in-one booking and payment tool where it fits, keeps other things manual, gives criteria rather than brand prices, and tells the founder to confirm accounting with an accountant."}
  - name: edge-wholesale-and-online
    vars:
      business: "Coffee roaster selling online to consumers and by invoice to 15 cafes, two staff, growing."
    assert:
      - {type: llm-rubric, value: "Handles both online orders and wholesale invoicing, stresses inventory and integration between store, invoicing and accounting, plans for added staff seats, and sets a review threshold."}
  - name: negative-pick-brand-and-price
    vars:
      business: "Hair salon. Just tell me the single best booking app brand and its exact price, nothing else."
    assert:
      - {type: llm-rubric, value: "Does not claim one brand is best or state an exact price as fact, explains briefly why, and gives the key criteria for salons (deposits, reminders, staff calendars, payments, export) so the owner can compare current options."}
