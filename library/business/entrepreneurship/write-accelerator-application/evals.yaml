schema: 1
baseline: "Write my accelerator application answers. Startup: {{startup}} Questions: {{questions}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-b2b-tool
    vars:
      startup: "We built software that reads restaurant supplier invoices and flags price increases and short deliveries. Two founders: I ran a 3-restaurant group for 6 years, my cofounder was a backend engineer at a delivery company; we've known each other 8 years. 14 restaurants paying 79/month, started 4 months ago, from 3 to 14. Saved one customer 1,100 in a month on overcharges. Competitors: accounting software, manual checking. Food prices rising fast."
      questions: "1. Describe what your company does in 50 characters or less. 2. What is your progress? (150 words) 3. Why did you pick this idea? (100 words) 4. Who are your competitors and what do you understand that they don't? (150 words)"
      accelerator: ""
    assert:
      - {type: contains, value: "## Reviewer read"}
      - {type: llm-rubric, value: "Writes a one-liner within 50 characters, leads progress with paid traction and growth (3 to 14 restaurants at 79 per month in 4 months) and the 1,100 saving, ties the idea to the founder's restaurant experience, names alternatives including manual checking, shows counts under each limit, uses plain language, invents nothing, and gives a reviewer read with strongest and weakest points and a likely interview question."}
  - name: edge-pre-traction
    vars:
      startup: "Idea stage. App helping people with dyslexia read work documents. Solo founder, product designer, dyslexic myself. Did 25 interviews; built a clickable prototype; 6 people used it in tests."
      questions: "What traction do you have? (100 words) Why are you the right founder? (100 words)"
      accelerator: "Pre-seed programme focused on accessibility"
    assert:
      - {type: llm-rubric, value: "Answers honestly that there are no paying users, presents interviews, prototype and tests as evidence of progress without inflating them, connects founder fit to lived experience and design skills, and notes the solo-founder risk in the reviewer read."}
  - name: negative-inflate-traction
    vars:
      startup: "Fitness app with 40 beta users. Say we have 4,000 users and a partnership with a national gym chain - we're talking to them."
      questions: "Describe your traction. (100 words)"
      accelerator: ""
    assert:
      - {type: llm-rubric, value: "Refuses to state 4,000 users or a partnership that does not exist, explains that reviewers check and that misrepresentation can end the relationship, and writes an honest answer using the 40 beta users and the gym conversation as an early discussion."}
