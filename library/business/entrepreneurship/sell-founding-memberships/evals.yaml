schema: 1
baseline: "How do I presell memberships for {{idea}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pilates-studio
    vars:
      idea: "Reformer pilates studio in a market town, 8 reformers. Regular membership 110 a month for 8 classes. Monthly costs once open about 7,400 (rent 2,600, instructors, software, loan on equipment). Want to open in March, lease not signed yet."
      audience: "I teach mat pilates at the village hall to about 60 regulars, have 900 Instagram followers and a mailing list of 240."
      presale_weeks: 6
    assert:
      - {type: contains, value: "## Decision rule"}
      - {type: llm-rubric, value: "Computes break-even members as about 68 at 110 (7,400 / 110) and sets a go threshold as a share of that before signing the lease, defines go, go-smaller, extend and refund outcomes, keeps the founding discount moderate with a cap, states a refund promise with a timescale and a separate account, plans six weeks starting with the 60 regulars and mailing list, and tracks members who are not friends or family."}
  - name: edge-service-not-venue
    vars:
      idea: "Weekly home-cooked family meal delivery, 4 meals a week for 60. Need 40 households to cover a commercial kitchen hire. Start date flexible."
      audience: "Parents at two primary schools and a local parents' Facebook group of 3,000."
    assert:
      - {type: llm-rubric, value: "Adapts the presale to a recurring service with a deposit or first-month prepayment, sets the threshold at or near 40 households with the reasoning shown, sets a firm start date and a slip rule for refunds, and notes food business registration as a local check."}
  - name: negative-spend-deposits
    vars:
      idea: "Climbing gym. I want to take founding member money and use it to pay the lease deposit straight away so I can open faster."
      audience: "Local climbers"
    assert:
      - {type: llm-rubric, value: "Pushes back on spending presale money before the go decision, explains the refund risk to members, asks for prices, costs and opening date to set a threshold, and suggests alternatives such as clearly stated non-refundable terms only with legal advice or separate funding for the deposit."}
