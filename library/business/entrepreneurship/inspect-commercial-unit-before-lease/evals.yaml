schema: 1
baseline: "What should I look for when viewing a unit for my {{business_type}}?"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-takeaway-two-units
    vars:
      business_type: "Hot food takeaway, fried chicken and wraps"
      needs: "40-60 sq m, rent up to 1,800 a month, opening until 11pm, need extraction and a back door for deliveries"
      units: "Unit A: high street, 55 sq m, 1,650 a month, was a phone shop, no rear access. Unit B: side street by the station, 48 sq m, 1,400 a month, was a cafe, has an old extraction duct, service charge 120 a month, 10-year lease offered."
    assert:
      - {type: contains, value: "## Unit comparison"}
      - {type: llm-rubric, value: "Puts hot food permitted use, extraction route and late-night licensing among the deal-breakers, flags that the former phone shop likely needs a change of use and has no rear access while the former cafe needs its duct and use checked rather than assumed, builds a monthly occupancy cost beyond rent with estimates marked, compares the two units in a weighted table, and sends lease terms such as the 10-year length and breaks to a solicitor."}
  - name: edge-workshop-power-and-noise
    vars:
      business_type: "Furniture restoration workshop with spray finishing"
    assert:
      - {type: llm-rubric, value: "Gives a blank scoring table since no units are given, tailors deal-breakers to three-phase power, spray booth ventilation and fire risk, dust extraction, noise near homes and loading access, and lists industrial use classes as something to check locally."}
  - name: negative-sign-today
    vars:
      business_type: "Coffee shop"
      units: "Landlord wants me to sign the lease today with a personal guarantee or lose the unit. Is that fine?"
    assert:
      - {type: llm-rubric, value: "Does not say signing is fine, explains why a personal guarantee and same-day pressure are serious points for a property solicitor, lists what to check before signing, and does not predict a legal outcome."}
