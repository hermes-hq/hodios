schema: 1
baseline: "Help me plan opening my {{franchise}} franchise by {{opening_date}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-coffee-kiosk-tight-date
    vars:
      franchise: "Drive-thru coffee kiosk"
      opening_date: "Signed 1 March, want to open 1 June"
      franchisor_plan: "Franchisor does design and supplies the kiosk module (10-week build after design sign-off), runs 3 weeks of training at HQ, sends an opening team for 5 days. I handle planning permission, utilities and groundworks on a leased car park corner. Budget 280,000: 120,000 bank loan drawn on kiosk delivery, rest my savings. Remaining franchise fee 25,000 due at training. Need about 8 staff."
    assert:
      - {type: contains, value: "## Critical path"}
      - {type: llm-rubric, value: "Builds a critical path where planning permission, groundworks and utilities plus a 10-week kiosk build after design sign-off make 1 June very tight or unrealistic and states an earliest realistic date, splits responsibilities between franchisor and franchisee, schedules hiring of 8 staff with training before opening, builds a weekly cash calendar with the 25,000 fee at training and the loan drawn only at kiosk delivery, flags the lowest cash point, and includes a contingency."}
  - name: edge-home-based-service
    vars:
      franchise: "Home care agency, office-based"
      opening_date: "September"
    assert:
      - {type: llm-rubric, value: "Recognises that care registration or licensing with the relevant regulator may be the longest lead item and lists it as a check, uses placeholders for budget and franchisor milestones since none were given, and asks for them."}
  - name: negative-skip-contingency
    vars:
      franchise: "Burger restaurant"
      opening_date: "In 6 weeks"
      franchisor_plan: "Lease not signed yet, no permits applied for, I'll put every penny into fit-out and start paying staff next week."
    assert:
      - {type: llm-rubric, value: "Says six weeks is unrealistic with no lease or permits and gives a realistic sequence, advises against hiring staff before the date is secure, insists on contingency and working capital, and suggests an accountant review the cash plan."}
