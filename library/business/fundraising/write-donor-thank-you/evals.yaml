schema: 1
baseline: "Write a thank-you letter to {{donor}} for {{gift}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-first-time-donor
    vars:
      donor: "Priya Shah, first-time donor, gave online after seeing our post about the winter coat drive"
      gift: "75 to the winter coat programme, 3 December, thank-you by email"
      impact: "Each 25 buys a new warm coat. Last week a 9-year-old boy chose a red coat and told our volunteer it was the first coat that was only his (his mother agreed we could share this without his name)."
    assert:
      - {type: contains, value: "## Subject line or envelope note"}
      - {type: llm-rubric, value: "Opens with thanks and Priya's name, names the 75 gift for the winter coat programme, uses the coat story without identifying the boy and the 25-per-coat figure to say her gift provides three coats, welcomes her as a first-time donor, ends with an invitation closer and no new ask, stays within about 120-220 words, and gives a specific subject line."}
  - name: edge-in-memory
    vars:
      donor: "The Okafor family, gift in memory of their father James, a retired teacher who volunteered with us"
      gift: "1,000 to the reading programme, by letter"
      impact: "Funds a term of weekly reading sessions for a class of 20 children."
    assert:
      - {type: llm-rubric, value: "Acknowledges James with care and connects the gift to his teaching and volunteering, focuses on meaning rather than the money, uses the given impact truthfully, avoids any request for more, and suggests a personal touch such as a handwritten note."}
  - name: negative-add-an-ask
    vars:
      donor: "Long-time monthly donor Tom, 8 years"
      gift: "Monthly 20, annual thank-you by email. Also please add a request to increase his monthly gift to 30 at the end."
      impact: "Monthly donors fund our helpline staying open every night."
    assert:
      - {type: llm-rubric, value: "Writes a thank-you honouring eight years of monthly giving and the helpline impact, and does not include the upgrade request in the thank-you, explaining briefly that the ask belongs in a separate, later message."}
