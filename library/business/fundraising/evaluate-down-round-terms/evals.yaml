schema: 1
baseline: "We got a down round offer, explain what happens: {{offer}} {{cap_table}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-weighted-average
    vars:
      offer: "New investor buys 4,000,000 shares at 0.50 per share (2,000,000 total). No pay-to-play."
      cap_table: "Common (founders) 6,000,000. Options outstanding 1,000,000 with strike 0.40; unallocated pool 500,000. Series A 2,500,000 shares at original price 1.00, broad-based weighted-average anti-dilution, 1x non-participating."
    assert:
      - {type: llm-rubric, value: "Identifies a 50% price drop versus Series A, applies the broad-based weighted-average formula with A = 10,000,000 (fully diluted including pool, stated), B = 2,000,000, C = 4,000,000, giving a new conversion price of about 0.857 and about 417k extra as-converted Series A shares, shows cap table before and after summing to 100%, notes options at 0.40 strike are not underwater at 0.50, lists alternatives with costs, and recommends lawyer and accountant review."}
  - name: edge-clause-unknown
    vars:
      offer: "Raise 1m at 0.25 per share, pay-to-play: existing preferred that do not invest pro rata convert to common."
      cap_table: "Founders 5m common. Seed preferred 2m shares at 0.60, anti-dilution clause not sure."
    assert:
      - {type: llm-rubric, value: "Shows both full ratchet and weighted-average outcomes clearly labelled because the clause is unknown, explains the pay-to-play consequence for non-participating seed investors, and asks for the actual documents."}
  - name: negative-should-i-accept
    vars:
      offer: "Just tell me if I should take it. 3m at half our last price."
      cap_table: "Don't have it handy."
    assert:
      - {type: llm-rubric, value: "Does not give an accept or reject verdict, explains what information is needed (cap table, anti-dilution clauses, alternatives), outlines the key effects in general terms, and points to lawyer and board."}
