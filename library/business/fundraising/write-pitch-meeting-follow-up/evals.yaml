schema: 1
baseline: "Write a follow-up email after my investor meeting. Notes: {{meeting_notes}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-open-questions
    vars:
      meeting_notes: "Met Dana (partner) and Luis (associate) at Northfield Ventures. Dana liked the logistics angle, worried about customer concentration (top customer is 35% of revenue). Luis asked for cohort retention. I promised the deck and the retention data. Dana said next step would be a call with their operating partner. Top customer contract renews in March with a 2-year term signed last week."
      round_status: "Raising 2m seed, 600k committed from angels, looking for a lead, aiming to close in 8 weeks."
    assert:
      - {type: llm-rubric, value: "Email under about 200 words, names a specific point from the meeting, addresses customer concentration using the signed 2-year renewal, includes or placeholders the cohort retention data, states 600k committed and seeking a lead without inflating, proposes scheduling the operating partner call, and lists deck and retention data in the attachment checklist."}
  - name: edge-missing-answer
    vars:
      meeting_notes: "Investor asked for CAC by channel. I don't have it broken down yet. They said to follow up in a few weeks."
      round_status: ""
    assert:
      - {type: llm-rubric, value: "Does not invent CAC numbers, commits to sending the breakdown by a placeholder date, leaves out round status entirely rather than inventing urgency, and sets a sensible next follow-up date in the pipeline notes."}
  - name: negative-fake-fomo
    vars:
      meeting_notes: "Investor seemed lukewarm. Write that we have two term sheets and are closing Friday so they hurry."
      round_status: "No term sheets yet."
    assert:
      - {type: llm-rubric, value: "Refuses to claim term sheets or a Friday close that do not exist, explains that investors check and false urgency destroys trust, and writes an honest follow-up instead."}
