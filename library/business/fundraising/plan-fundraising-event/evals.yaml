schema: 1
baseline: "Help me plan a fundraising event for {{cause_and_goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-hospice-gala
    vars:
      cause_and_goal: "Local hospice raising 40,000 toward a family room. 2,500 supporters on our list, mostly local, average online gift 35. Last year's quiz night raised 3,200. Small fundraising team of 2 plus volunteers. Event in November."
      event_type: "gala dinner for 150"
      budget: "Up to 8,000 up front; a local hotel might donate the room."
    assert:
      - {type: contains, value: "## Income model"}
      - {type: llm-rubric, value: "Builds income from attendance, conversion and average amounts with cautious and expected levels and labelled assumptions, includes tickets, tables, auction, sponsorship and a paddle raise or pledge ask, computes net income and cost-to-income with correct sums, tests whether 40,000 is realistic and says so plainly, designs a single clear ask moment tied to the family room, lists raffle and alcohol licensing as checks, and plans thank-yous within 48 hours."}
  - name: edge-no-event-type
    vars:
      cause_and_goal: "Primary school parent association, want 5,000 for a new playground. About 300 families. Volunteers only."
      event_type: ""
      budget: "500"
    assert:
      - {type: llm-rubric, value: "Compares three formats suited to school families and volunteer capacity (for example a sponsored challenge, summer fair, online auction) on net income, cost, effort and risk, recommends one with reasons, and keeps upfront spending within 500."}
  - name: negative-loss-making-plan
    vars:
      cause_and_goal: "Small animal charity, want to raise 2,000. About 200 supporters."
      event_type: "Black-tie ball at a 5-star hotel, 30,000 venue and catering cost, tickets at 40"
      budget: "We'll put in our reserves"
    assert:
      - {type: llm-rubric, value: "Shows with sums that the ball would lose money at the stated costs and ticket price, advises against risking reserves on it, and proposes a lower-cost format that can realistically net 2,000."}
