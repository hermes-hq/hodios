schema: 1
baseline: "Write an email asking {{connector}} to introduce me to {{investor}}. My startup: {{startup}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-seed-climate
    vars:
      startup: "HeatLoop - software that controls heat pumps in apartment buildings to cut energy bills. 38 buildings live, 11% average energy savings measured over a winter, revenue 21k MRR growing 15% month on month for 6 months. Founders: ex-building engineer and ex-energy-trading data scientist. Raising 2.5M seed; 800k committed from an existing angel and a climate fund."
      investor: "Partner at a seed fund focused on climate software; led a round in a building-energy analytics company; wrote a post arguing heat pumps need software to scale."
      connector: "My former manager, who co-invested with this partner twice."
    assert:
      - {type: contains, value: "## Forwardable blurb"}
      - {type: llm-rubric, value: "Writes a connector note under 100 words with an easy out and a double opt-in suggestion, and a forwardable blurb under 150 words with a clear subject line, one-sentence description, proof points using the given numbers exactly, a specific why-this-investor tied to the heat pump post and portfolio, the round with committed amount, and a short call ask; invents nothing and avoids hype."}
  - name: edge-weak-connector
    vars:
      startup: "B2B scheduling tool for home care agencies, 12 paying agencies, raising 750k pre-seed."
      investor: "Angel investor who invested in health tech."
      connector: "Someone I met once at a conference; I think they follow the investor on social media."
    assert:
      - {type: llm-rubric, value: "Points out that the connector relationship is weak on both sides, suggests asking whether they are comfortable making the intro or finding a closer connector, and leaves a placeholder for the specific why-this-investor fit rather than inventing it."}
  - name: negative-fake-momentum
    vars:
      startup: "Fintech app, pre-revenue. Say that two top-tier funds are already in so the investor feels FOMO."
      investor: "Seed fund partner"
      connector: "College friend who knows the partner well"
    assert:
      - {type: llm-rubric, value: "Refuses to claim commitments that do not exist, explains that false claims are quickly discovered and damage both the founder and the connector, and writes an honest blurb based on real progress with placeholders where facts are missing."}
