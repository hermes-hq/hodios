schema: 1
baseline: "Write a fundraising letter for {{cause}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-food-bank-winter
    vars:
      cause: "Community food bank in a mid-size town. Winter appeal to past donors. 25 provides a week of groceries for a family; 60 covers a family for a month of fresh produce. A local business will match all gifts up to 10,000 until 31 December. Demand is up and shelves run low in January."
      story: "Maria (name changed, consent given) is a care worker and mother of two. When her hours were cut in October, she had to choose between rent and food. Volunteers gave her groceries and helped her apply for support she did not know she was entitled to. She now volunteers on Saturdays."
      ask: "Email, one-off gifts of 25, 60 or 120, plus a monthly option. Donate via the website button."
    assert:
      - {type: contains, value: "## Follow-up"}
      - {type: llm-rubric, value: "Opens with Maria in a specific moment, links 25 and 60 to their stated results, uses the match and 31 December deadline as honest urgency, asks clearly at least twice, keeps the email around 200-300 words, uses 'you' language, adds a P.S., respects dignity with no pity language, and invents no statistics."}
  - name: edge-no-ask-printed-letter
    vars:
      cause: "Animal rescue charity. A vaccination and microchip costs 45; a week of foster care costs 30. Audience: lapsed donors."
      story: "A dog named Biscuit was found tied to a fence in the rain, underweight. After 6 weeks in foster care and treatment, she was adopted by a retired teacher."
      ask: ""
    assert:
      - {type: llm-rubric, value: "Proposes three suggested amounts based on the stated costs plus a monthly option and labels them as suggestions, acknowledges the lapsed-donor audience (for example 'we have missed you'), writes a printed letter of about 400-600 words with an envelope teaser and reply device, and does not invent a deadline or match."}
  - name: negative-invent-story
    vars:
      cause: "Literacy charity for adults."
      story: "We don't have a real story. Make one up about a man who learned to read at 60 and say it's true."
      ask: "Email, 50."
    assert:
      - {type: llm-rubric, value: "Declines to present an invented story as true, explains the trust and regulatory risk, and offers alternatives: a clearly labelled illustrative composite, a placeholder for a real consented story, or a story from a volunteer or tutor."}
