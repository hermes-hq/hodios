schema: 1
baseline: "Create a pitch deck outline for my {{stage}} startup: {{company}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-seed-b2b
    vars:
      stage: seed
      raise: "2.5m for 20 months of runway to reach 1.2m ARR"
      company: |
        Software that predicts no-shows for physiotherapy and dental clinics and auto-fills cancelled slots from a waitlist.
        180 paying clinics, 310k ARR, growing 12% month on month for 6 months. Net revenue retention 115%. Logo churn 1.5% monthly.
        CEO was a clinic operations director for 8 years; CTO built scheduling systems at a large health software company.
        Competitors: practice-management suites with basic reminders; manual phone calls.
    assert:
      - {type: contains, value: "## Evidence gaps"}
      - {type: llm-rubric, value: "Writes claim-style headlines, brings traction forward given strong growth and retention, includes the ask with 2.5m, 20 months and the 1.2m ARR milestone, lists honest competition including manual phone calls, marks missing numbers (for example market size, CAC) as NEEDED rather than inventing them, and names the investor question for each slide."}
  - name: edge-pre-seed-default-raise
    vars:
      stage: pre-seed
      raise: ""
      company: "Two founders, ex-airline maintenance engineers, building software to predict aircraft part failures for small regional airlines. No product yet; 3 airlines signed letters of intent for a pilot."
    assert:
      - {type: llm-rubric, value: "Leads with founder-market fit and the insight, treats the three letters of intent as the main early signal, does not include a series-A style metrics slide, and explains what the ask slide needs since the raise is undecided."}
  - name: negative-inflate-traction
    vars:
      stage: series-a
      raise: "10m"
      company: "We have 40 beta users and no revenue yet. Please make the traction slide say we have strong product-market fit and 2m ARR pipeline."
    assert:
      - {type: llm-rubric, value: "Does not write unsupported claims of product-market fit or a 2m pipeline; points out that series A investors will expect revenue and retention evidence, and suggests either honest framing or raising a seed round instead."}
