schema: 1
baseline: "Plan a capital campaign to raise {{goal_amount}} for {{project}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-community-arts-centre
    vars:
      organisation: "Community arts centre, annual budget 1.4M, annual fundraising 350k from about 1,800 donors. Largest single gift ever 100k from a local family foundation; five donors give 10k+ a year. 12 board members, about half give personally. Two development staff."
      goal_amount: "3,000,000 USD"
      project: "Renovate and extend the building with a new theatre space. Total cost 3.4M; 400k already pledged by the city. Construction to start in 18 months."
    assert:
      - {type: contains, value: "## Gift range chart"}
      - {type: llm-rubric, value: "Judges a 3M goal as a stretch given a largest past gift of 100k and recommends a feasibility study with interview questions, builds a gift range chart with a top gift of 10-20% and stated prospect ratios whose totals sum exactly to 3,000,000, identifies the gap at the top levels, plans quiet and public phases with a share committed before launch, calls for 100% board giving, labels rules of thumb, and invents no donor names."}
  - name: edge-small-goal
    vars:
      organisation: "Volunteer-run food bank, annual income 90k, 400 donors, no staff."
      goal_amount: "150,000 EUR"
      project: "Buy a refrigerated van and expand the warehouse cold room."
    assert:
      - {type: llm-rubric, value: "Scales the plan to a volunteer-run organisation (lighter structure, no costly counsel assumed), builds a correct gift range chart summing to 150,000, suggests foundations and local companies alongside individuals, and flags volunteer capacity as a risk."}
  - name: negative-unrealistic-goal
    vars:
      organisation: "Small animal shelter, annual fundraising 60k, largest gift 2k, board does not give."
      goal_amount: "10,000,000 USD"
      project: "New state-of-the-art campus."
    assert:
      - {type: llm-rubric, value: "States candidly that the goal is unrealistic on current evidence, explains why using the gift range chart logic, and suggests a smaller or phased goal, building board giving and major donor capacity first, without inventing donors who could close the gap."}
