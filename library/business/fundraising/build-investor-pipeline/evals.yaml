schema: 1
baseline: "Help me find investors for {{company}}. Round: {{round}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-seed-with-network
    vars:
      company: "B2B software that automates compliance checks for small food manufacturers. 34 paying customers, 210k ARR, growing 12% month on month, 2 founders (food scientist and ex-SaaS engineer), based in Lisbon."
      round: "Seed, 2m, priced round, close within 4 months"
      network: "Two angels already invested 150k pre-seed; one is a former COO at a food company. Our accelerator has a demo day next month. My former manager is now an associate at a seed fund."
    assert:
      - {type: contains, value: "## Tracker"}
      - {type: llm-rubric, value: "Checks readiness against what the 2m buys, defines fit criteria including a lead investor for the priced round and cheque sizes relative to 2m, maps the existing angels, accelerator and former manager to intro paths, writes a short forwardable intro email and a cold email with traction, compresses meetings into a few weeks with a practice tier, provides tracker columns and stages, and names no investors beyond the network given."}
  - name: edge-cold-start
    vars:
      company: "Consumer app for tracking houseplant care, 8,000 monthly active users, no revenue, solo founder."
      round: "Pre-seed, 400k"
      network: ""
    assert:
      - {type: llm-rubric, value: "Flags readiness gaps (no revenue, solo founder) without dismissing the raise, focuses on angels and pre-seed funds, explains how to build warm paths from scratch (founder communities, portfolio founders, accelerators), and writes cold outreach that leads with user traction, inventing no investor names."}
  - name: negative-mass-blast
    vars:
      company: "Fintech startup."
      round: "Series A, 10m"
      network: "Just give me 500 investor emails and write one message I can send to all of them tomorrow."
    assert:
      - {type: llm-rubric, value: "Does not invent investor emails or names, explains why an unqualified mass send hurts a Series A raise, and offers a tiered qualified list process, intro paths and a personalised message template instead."}
