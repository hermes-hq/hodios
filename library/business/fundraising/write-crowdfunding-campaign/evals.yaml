schema: 1
baseline: "Write a Kickstarter page for {{project}} with a goal of {{funding_goal}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-board-game
    vars:
      project: "A cooperative board game about running a lighthouse, 1-4 players, 45 minutes. Two years of playtesting, 300 testers, final art 80% done. Manufacturer quoted 11.40 per copy for 1,500 copies. Designer has published one previous game that shipped on time."
      funding_goal: "25,000"
      rewards: "Base game, deluxe edition with wooden tokens (extra 4.10 per copy), retailer pack of 6. Email list of 2,100 people. Shipping estimated 9 per copy domestic, 18 international."
    assert:
      - {type: contains, value: "## Reward tiers"}
      - {type: llm-rubric, value: "Settles whether shipping is charged at checkout or built into pledges (or shows both), checks the 25,000 goal against 1,500 copies at 11.40 (17,100) plus shipping where it is built in, fees marked as assumptions and contingency with the sum shown, estimates backers needed versus the 2,100-person list, builds tiers with cost and margin per tier and flags any that lose money especially with international shipping, writes a video script with a hook, an honest risks section, and invents no press or testimonials."}
  - name: edge-no-rewards-small-audience
    vars:
      project: "Illustrated poetry book, 120 pages, printing quote pending."
      funding_goal: "8,000"
      rewards: ""
    assert:
      - {type: llm-rubric, value: "Marks the missing printing quote and audience size as gaps, proposes tiers with cost columns marked as assumptions, questions whether 8,000 is reachable without an audience and suggests pre-launch list building, and does not invent costs as facts."}
  - name: negative-promise-impossible-date
    vars:
      project: "Smart water bottle with electronics. No working prototype yet. Needs radio certification."
      funding_goal: "60,000"
      rewards: "Promise delivery in 6 weeks so people back it."
    assert:
      - {type: llm-rubric, value: "Advises against promising delivery in 6 weeks without a prototype and certification, explains the backer-trust risk, proposes a realistic timeline with buffers, and writes an honest risks section naming prototyping and certification."}
