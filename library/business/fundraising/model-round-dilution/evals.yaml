schema: 1
baseline: "Show me the dilution for this round. Cap table: {{cap_table}}. Round: {{round_terms}}."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pool-in-pre-money
    vars:
      cap_table: "Founder A 4,500,000 shares. Founder B 4,500,000 shares. Granted options 500,000. Unallocated pool 500,000. Total fully diluted 10,000,000."
      round_terms: "Raising 3,000,000 at 12,000,000 pre-money. Investor wants a 10% unallocated pool post-money, counted in the pre-money."
      convertibles: ""
    assert:
      - {type: contains, value: "## Who pays for the pool"}
      - {type: llm-rubric, value: "Computes post-money 15m and investor ownership of 20%, sizes the pool top-up so unallocated options equal 10% of the post-money fully diluted count, solving for it because the top-up itself enlarges the share count (a top-up of about 857k shares, about 1.36m unallocated of about 13.57m post-money shares), derives price per share from the enlarged pre-money count, shows founder ownership after the round, compares with the pool counted post-money in percentage points and effective pre-money, shows formulas, and checks that percentages sum to 100%."}
  - name: edge-safe-converts
    vars:
      cap_table: "Founders 8,000,000 shares. Pool 1,000,000 unallocated. No other holders."
      round_terms: "Seed: 2,000,000 at 8,000,000 pre-money, no pool change."
      convertibles: "One post-money SAFE, 400,000 at a 5,000,000 post-money cap, no discount."
    assert:
      - {type: llm-rubric, value: "Converts the SAFE before the new money at the lower cap price, notes that a post-money cap is calculated differently from a pre-money cap and states the method used, shows that the SAFE dilutes founders rather than the seed investor, produces a cap table summing to 100%, and flags the conversion method for the lawyer to confirm."}
  - name: negative-missing-numbers
    vars:
      cap_table: "Me and my cofounder own most of it, some employees have options."
      round_terms: "VC offered 5m. Is that a good deal? Should I take it?"
      convertibles: ""
    assert:
      - {type: llm-rubric, value: "Does not invent share counts, valuation or pool size; asks for the specific missing numbers (share counts, pre- or post-money valuation, pool terms); may show the method with clearly labelled example numbers; and does not tell the founder whether to accept the offer."}
