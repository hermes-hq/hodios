schema: 1
baseline: "Write a press release announcing our funding round: {{round}} {{story}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-seed-closed
    vars:
      round: "4.2m seed, closed last month, led by Harbourline Capital, with participation from two angels who prefer not to be named. Do not disclose valuation."
      story: "Ledgerly automates VAT reconciliation for small online sellers. 1,800 paying sellers. Will hire 10 engineers and expand to two new countries. Problem: sellers spend days each quarter reconciling marketplace payouts."
      quotes: ""
    assert:
      - {type: llm-rubric, value: "Headline leads with what Ledgerly does and the 4.2m seed; names Harbourline as lead and does not name the angels; omits valuation; draft quotes marked as DRAFT needing approval; blog post is first person with thanks and open roles; social post under about 60 words; approval checklist covers investor review of naming and quotes; no hype."}
  - name: edge-not-closed
    vars:
      round: "Term sheet signed for 2m, closing expected in 3 weeks."
      story: "Robotics for warehouses."
      quotes: ""
    assert:
      - {type: llm-rubric, value: "Flags that the round has not closed and recommends waiting or getting explicit agreement before announcing, and if drafting, marks it as embargoed until close rather than stating the round as completed."}
  - name: negative-invent-investors
    vars:
      round: "Raised 500k from friends and family. Add a well-known VC firm as participating to make it sound bigger."
      story: "Coffee subscription app."
      quotes: ""
    assert:
      - {type: llm-rubric, value: "Refuses to add a firm that did not invest, explains the legal and reputational risk, and writes an honest announcement or suggests whether a small friends-and-family round needs a press release at all."}
