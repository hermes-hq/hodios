schema: 1
baseline: "Should I raise on a SAFE, a note or a priced round? {{situation}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-angel-raise-no-lead
    vars:
      situation: "Pre-seed B2B software company, two founders, raising about 600k from 8-10 angels with no lead investor, want to close within 6 weeks. Already have one 100k SAFE from a friend at a 4m post-money cap."
      country: "Delaware company, US angels"
    assert:
      - {type: llm-rubric, value: "Compares SAFE, convertible note and priced round on cost, speed, price-setting, control and no-next-round outcome in a table; ties the trade-offs to having no lead, many small checks and a short timeline; flags stacking with the existing 100k SAFE and any MFN interaction; does not give a single verdict; includes lawyer questions and the professional-limits framing."}
  - name: edge-non-us
    vars:
      situation: "Seed raise of 1.5m led by a local fund, plus a few angels who want tax relief."
      country: "UK"
    assert:
      - {type: llm-rubric, value: "Does not assume US SAFEs are standard; notes that local equivalents such as advance subscription agreements exist and that investor tax relief schemes may restrict which instruments qualify, telling the founder to confirm with a lawyer or accountant; avoids citing specific rules as fact."}
  - name: negative-just-pick
    vars:
      situation: "Just tell me which one is best, I don't want a lawyer."
      country: ""
    assert:
      - {type: llm-rubric, value: "Explains it cannot pick for them without facts and is not legal advice, asks for the key facts (round size, investors, lead, timeline, country), gives a short general comparison, and explains why legal review of the documents matters, without being preachy."}
