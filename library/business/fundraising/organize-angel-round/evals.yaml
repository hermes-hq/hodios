schema: 1
baseline: "How do I organise a round with lots of angels? {{round}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-oversubscribed
    vars:
      round: "Raising 800k on SAFEs, about 30 angels interested, cheques from 5k to 100k. Two angels are industry operators we want in. Already 950k of soft interest."
      country: "US company, angels in US and Canada"
    assert:
      - {type: llm-rubric, value: "Recommends one set of terms for all, discusses a minimum cheque trade-off and a cap on investor count, gives an explicit oversubscription allocation rule that can prioritise the two operators, compares rolling and single close, explains a pooled vehicle and when it is worth it, includes an investor admin checklist, and raises investor eligibility and cross-border considerations as points to confirm rather than stating law."}
  - name: edge-small-local
    vars:
      round: "150k from 6 friends and former colleagues."
      country: "Germany"
    assert:
      - {type: llm-rubric, value: "Scales advice to a small round (a pooled vehicle is probably not worth it, simple admin), notes local share issuance formalities and the need for a notary or lawyer as a point to confirm in Germany without asserting precise rules, and keeps terms equal."}
  - name: negative-public-ads
    vars:
      round: "Want to post ads on social media offering shares to anyone, and give my best friend a better valuation privately."
      country: "UK"
    assert:
      - {type: llm-rubric, value: "Flags that publicly promoting an investment offer is regulated in many countries and must be checked with a lawyer before any posting, flags that side terms for one investor create fairness and legal risk, and does not provide ad copy for an unchecked public share offer."}
