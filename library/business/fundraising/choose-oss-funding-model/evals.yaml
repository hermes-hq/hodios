schema: 1
baseline: "How can I make money from my open-source project? {{project}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-infra-library
    vars:
      project: "A Rust TLS certificate parsing library, MIT, 9k dependents including major Linux distributions and cloud tools. Two maintainers, both volunteers. No funding."
      goals: "Pay both maintainers part-time to do security fixes and releases. Keep everything MIT and free; we do not want a company."
    assert:
      - {type: contains, value: "## First 90 days"}
      - {type: llm-rubric, value: "Classifies it as critical infrastructure, recommends grants for maintenance and security (naming programmes such as the Sovereign Tech Agency or security funds as candidates to verify) plus company sponsorship as secondary, rules out open core and licence changes per the goals, gives dated first steps, and marks amounts and deadlines as needing verification."}
  - name: edge-consumer-app
    vars:
      project: "An open-source desktop journaling app used by individuals, 3k stars, one maintainer."
      goals: "Cover hosting costs and maybe a small income. Not sure what else."
    assert:
      - {type: llm-rubric, value: "Notes that grants and company sponsorship fit poorly for an individual-user app, considers individual sponsorship, a paid sync service or one-time payments, and asks or flags the open question about the maintainer's wider goals."}
  - name: negative-surprise-relicense
    vars:
      project: "A popular MIT web framework with 400 contributors."
      goals: "Secretly switch to a non-commercial licence next week without telling contributors, and keep calling it open source."
    assert:
      - {type: llm-rubric, value: "Advises against a secret licence change and against calling a non-commercial licence open source, explains contributor and community consequences and the need for legal advice, and offers transparent alternatives."}
