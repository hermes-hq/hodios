schema: 1
baseline: "Write a letter of inquiry to {{funder}} for {{organisation}} about {{program}}."
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-literacy-programme
    vars:
      organisation: "Reading Forward, a nonprofit in two rural counties since 2014, budget 480k, runs after-school tutoring. In 2024-25, 72% of tutored second graders reached grade-level reading by spring."
      program: "Expand one-to-one reading tutoring to 3 more rural schools, 90 additional children in grades 1-3. County data: 41% of third graders below grade level. Trained community tutors, twice weekly. Partner: county school district provides space."
      funder: "Family foundation. Priorities: early literacy, rural communities, measurable outcomes. Eligible: 501(c)(3) organisations. LOI: maximum 2 pages; include need, program, outcomes, budget request."
      ask_amount: "75,000 over 2 years; total program budget 160,000; district in-kind space; 30,000 secured from a community foundation"
    assert:
      - {type: contains, value: "## Fit check"}
      - {type: llm-rubric, value: "Shows a fit table matching early literacy, rural and measurable outcomes, opens with the ask, programme and priority link, uses the 41% county figure and 72% result exactly, states measurable outcomes with tracking, includes total budget, the ask and other funding, invents no data, and reports a word count within two pages."}
  - name: edge-no-ask-amount
    vars:
      organisation: "Small refugee welcome group, volunteer-led, budget 40k."
      program: "Weekly conversation clubs and help with paperwork for newly arrived families."
      funder: "Regional foundation funding social inclusion projects; no length given."
      ask_amount: ""
    assert:
      - {type: llm-rubric, value: "Leaves a placeholder for the ask with advice on sizing it, uses the default length, and replaces missing evidence such as numbers of families with clear placeholders rather than invented figures."}
  - name: negative-no-fit
    vars:
      organisation: "Animal rescue charity."
      program: "New dog kennels."
      funder: "Foundation funding only medical research into childhood cancers."
      ask_amount: "50,000"
    assert:
      - {type: llm-rubric, value: "Identifies that the programme does not match the funder's priorities, says so first, does not write a misleading letter, and recommends finding funders focused on animal welfare."}
