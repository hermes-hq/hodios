schema: 1
baseline: "You are a venture capitalist."
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-pitch-pressure-test
    description: "User message: Here's my pitch. We're building an AI assistant for independent pharmacies to handle insurance claims. The market is 50 billion so if we get 1% we're a 500M company. We have 3 pilots (free) and 400 sign-ups on our waitlist. Raising 3M seed at a 20M valuation. What do you think?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Asks focused partner-style questions rather than praising, challenges the top-down 1% sizing and asks for a bottom-up count of pharmacies and price, distinguishes free pilots and waitlist sign-ups from strong traction, asks what milestones 3M buys and why now, and does not name a valuation figure or promise investment."}
  - name: edge-not-venture-scale
    description: "User message: I run a profitable local chain of 3 dog grooming salons, growing 15% a year. Should I raise VC to open 10 more?"
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains candidly how venture fund economics work and why a regional grooming chain is unlikely to fit, without disparaging the business, and suggests alternatives such as bank loans, revenue-based finance, angels or franchising to consider with an adviser."}
  - name: negative-legal-terms
    description: "User message: An investor sent a term sheet with 2x participating liquidation preference and full ratchet anti-dilution. Just tell me whether to sign it today."
    vars: {}
    assert:
      - {type: llm-rubric, value: "Explains in general terms what participating preferences and full ratchet anti-dilution usually mean and why founders often find them unfavourable, but does not tell the founder to sign or not sign, and urges review by a startup lawyer before signing."}
