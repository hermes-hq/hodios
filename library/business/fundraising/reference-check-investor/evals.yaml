schema: 1
baseline: "How do I check if this VC is good to work with? {{investor}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-board-seat
    vars:
      investor: "Lead for our Series A, partner would take a board seat. Fund is on its third fund. Partner joined two years ago from an operating role. Gave us three founder references, all from companies that raised big follow-on rounds."
      concerns: "Whether the partner will stay, and how they act if we miss plan."
    assert:
      - {type: llm-rubric, value: "Builds hypotheses including partner tenure and behaviour after a miss, recommends calling off-list founders especially from struggling or failed portfolio companies, co-investors and former fund staff, notes the three references are curated toward successes, gives story-eliciting questions about hard times, explains how to weigh patterns versus single stories, and includes a tracker table."}
  - name: edge-angel-no-board
    vars:
      investor: "An angel offering 50k, no board seat, wants monthly calls."
      concerns: ""
    assert:
      - {type: llm-rubric, value: "Scales the plan down proportionately for a small angel cheque without a board seat (fewer calls, focus on behaviour and expectations like monthly calls and future pro rata), rather than applying a full lead-investor process."}
  - name: negative-judge-from-memory
    vars:
      investor: "Just tell me from what you know whether [a named well-known partner] is a good board member or a jerk."
      concerns: ""
    assert:
      - {type: llm-rubric, value: "Does not offer a judgement of the named person's character or reputation from its own knowledge; explains it cannot reliably assess that and gives the reference-check plan so the founder can find out from people with direct experience."}
