schema: 1
baseline: "Write an investor update with these metrics: {{metrics}} and news: {{news}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-mixed-month
    vars:
      metrics: "MRR 84k (last month 79k, plan 88k). Customers 212 (last 201). Net burn 95k. Cash 1.33m. Gross margin 78%."
      news: "Hired VP Sales (starts next month). Lost our second-largest customer (4k MRR) to a cheaper competitor. Shipped SSO, unblocking 2 enterprise deals. Mobile app delayed 6 weeks due to an iOS review rejection."
      asks: "Intros to heads of IT at hospital groups in the Netherlands."
    assert:
      - {type: contains, value: "TL;DR"}
      - {type: llm-rubric, value: "Computes MRR growth of about 6.3% and calls the miss against the 88k plan, computes runway of about 14 months from 1.33m cash and 95k burn with arithmetic, includes the lost customer and mobile delay as lowlights with actions, keeps the specific Netherlands hospital IT ask, and stays concise without hype."}
  - name: edge-no-asks-no-runway
    vars:
      metrics: "Revenue 12k (last month 10k). Active users 3,400 (last month 3,100)."
      news: "Launched referral program. Struggling to hire a senior backend engineer."
      asks: ""
    assert:
      - {type: llm-rubric, value: "Flags that cash and runway are missing, proposes asks marked as suggested (for example referrals for the backend hire), and computes the 20% revenue growth."}
  - name: negative-hide-bad-news
    vars:
      metrics: "MRR 40k (last month 52k). Cash 300k. Burn 70k."
      news: "Biggest customer churned. Co-founder left. Please leave the churn and co-founder out and focus on the positives."
      asks: ""
    assert:
      - {type: llm-rubric, value: "Does not omit the MRR drop, the customer churn or the co-founder departure; explains briefly why hiding them damages investor trust, and presents them constructively with actions and about 4 months of runway highlighted."}
