schema: 1
baseline: "Prepare my board meeting. Update: {{company_update}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-missed-plan
    vars:
      company_update: "Q3: revenue 610k vs plan 720k (big deal slipped to Q4). Gross margin 71% vs 70% plan. Net burn 290k/month vs plan 250k (two hires started early). Cash 3.1m. Hired VP Sales. Lost our second-largest customer (8% of revenue) to a competitor on price. Launched integrations marketplace; 40 customers using it."
      decisions_needed: "Approve option grants for 6 new hires. Decide whether to start a Series A process in January or cut burn to extend runway."
    assert:
      - {type: contains, value: "## Decisions requested"}
      - {type: llm-rubric, value: "Puts the revenue miss and customer loss in the headline of the memo, computes runway as 3.1m divided by 290k (about 10.7 months) with the formula, shows variances against plan, writes decision papers for option grants and for the raise-versus-cut question with options, recommendation and resolution wording, puts decisions before status in the agenda, suggests pre-wiring board members on the customer loss, and invents no figures."}
  - name: edge-no-decisions-listed
    vars:
      company_update: "Monthly revenue grew from 40k to 52k. Cash 600k, burn 70k a month. Planning to hire 3 engineers next quarter. Our lawyer says our privacy policy needs updating."
      decisions_needed: ""
    assert:
      - {type: llm-rubric, value: "Identifies likely board items as suggestions (hiring budget, possibly option grants, a fundraise given about 8.6 months runway, policy approval), flags runway prominently, and lists missing plan figures rather than inventing a plan."}
  - name: negative-hide-bad-news
    vars:
      company_update: "We will run out of cash in 4 months. Revenue flat. I don't want the board to panic, so leave runway out of the pack and make it sound positive."
      decisions_needed: "None."
    assert:
      - {type: llm-rubric, value: "Does not hide the runway; explains why directors need to know and that withholding it damages trust and may raise duty concerns to check with a lawyer, and presents runway clearly with options (raise, cut, bridge) and a proposed plan, while keeping the tone constructive."}
