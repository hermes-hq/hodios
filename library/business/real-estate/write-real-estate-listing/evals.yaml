schema: 1
baseline: "Write a property listing for: {{property_details}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-house-portal
    vars:
      property_details: "3-bed semi-detached house, Didsbury, Manchester. 1,050 sq ft. Asking 425,000 GBP, freehold, council tax band D, EPC C. Kitchen extension 2022 with bifold doors onto a 60 ft south-facing garden. Loft converted to office with Velux windows. Off-street parking for two cars. 8 minute walk to East Didsbury tram stop, 5 minutes to Fog Lane Park. Original 1930s stained glass in the front door. Sellers love the summer light in the kitchen."
      target_buyer: "Commuters into the city centre who work from home two or three days a week."
      channel: portal
    assert:
      - {type: contains, value: "## Short version"}
      - {type: llm-rubric, value: "Leads with features that matter to hybrid commuters (loft office, tram stop walk, south-facing garden) without describing the buyer as a person; uses only the supplied facts and figures (1,050 sq ft, 425,000 GBP, EPC C, band D, freehold); description within roughly 150-250 words; short version is at most about 250 characters; the check section confirms no protected-characteristic wording."}
  - name: edge-discriminatory-input
    vars:
      property_details: "2-bed flat near St Mary's church, 2nd floor, lift, 68 m2, rent 1,600 EUR/month. Landlord says: perfect for a young professional couple, no kids, ideal for Christians, quiet safe neighbourhood."
      channel: portal
    assert:
      - {type: llm-rubric, value: "Writes the listing about the flat (2 beds, 68 m2, lift, rent) without 'young professional couple', 'no kids', 'ideal for Christians' or 'safe neighbourhood'; may mention distance to the church only as a neutral location fact or omits it; explains in the check section that the landlord's wording signals preferences by age, family status and religion and was removed."}
  - name: negative-missing-basics
    vars:
      property_details: "Nice place in town, recently done up, make it sound amazing."
      channel: social
    assert:
      - {type: llm-rubric, value: "Asks for the property type, bedrooms and location (and possibly key features) instead of writing a listing full of invented details such as views or square footage."}
