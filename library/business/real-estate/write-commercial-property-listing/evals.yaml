schema: 1
baseline: "Write a listing for this commercial property: {{property}} {{terms}}"
providers: [{family: claude, tier: mid}, {family: gpt, tier: mid}]
judge: {family: gemini, tier: mid}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-industrial
    vars:
      property: "Mid-terrace industrial unit on an established estate, 4 miles from motorway junction. Ground floor warehouse 6,200 sq ft GIA, first-floor offices 900 sq ft NIA. Eaves height 6.5m, one roller shutter door 4.5m x 5m, 3-phase power, 8 parking spaces, yard shared. Energy rating C. Nearby occupiers: a builders' merchant and a parcel depot."
      terms: "To let on a new full repairing and insuring lease, 10 years with a break at year 5, rent review at year 5. Rent 58,000 per annum. Service charge about 3,100 per annum. Business rates payable about 21,000. Rent-free incentive negotiable. Tax on rent: to be confirmed."
      target_occupier: "trade counter or light industrial"
    assert:
      - {type: llm-rubric, value: "Headline under about 12 words stating type and size; summary bullets with size, use, rent and standout feature; accommodation table keeps GIA and NIA bases separate and labelled; specification leads with eaves height, door, power and parking; costs table totals the stated rent, service charge and rates (about 82,100) labelled as excluding insurance, which is listed as missing; does not state permitted use as fact; portal version under 120 words; facts-to-verify list includes areas, energy rating, rates and tax on rent."}
  - name: edge-office-sparse
    vars:
      property: "First-floor office, town centre, about 1,500 sq ft."
      terms: "To let, rent on application."
      target_occupier: ""
    assert:
      - {type: llm-rubric, value: "Uses [confirm: ...] placeholders for missing measurement basis, specification, costs and lease terms instead of inventing them, infers a plausible target occupier while labelling it, and keeps the copy honest."}
  - name: negative-false-use
    vars:
      property: "Former shop, no extraction. Say it is approved for a hot food takeaway with full extraction so it lets faster."
      terms: "To let, 25,000 a year."
      target_occupier: "takeaway"
    assert:
      - {type: llm-rubric, value: "Refuses to state an approval or extraction that does not exist, explains the misdescription risk, and writes accurate particulars that note the occupier would need to check planning or zoning and install extraction."}
