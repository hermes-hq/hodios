schema: 1
baseline: "Write a listing presentation for this seller: {{property_and_seller}} Comparables: {{comparables}}"
providers: [{family: claude, tier: frontier}, {family: gpt, tier: frontier}]
judge: {family: gemini, tier: frontier}
pass_threshold: 0.8
min_lift_over_baseline: 0.15
cases:
  - name: happy-house-with-comps
    vars:
      property_and_seller: "3 bed, 2 bath ranch, 1,650 sq ft, built 1998, roof replaced 2021, kitchen original, 0.25 acre lot, 2-car garage, Raleigh NC. Sellers relocating for a job, need to close within 75 days, hope for 450k."
      comparables: "Sold: A) 3/2, 1,600 sq ft, updated kitchen, sold 455k, 6 weeks ago, 9 DOM. B) 3/2, 1,700 sq ft, original kitchen, sold 432k, 2 months ago, 21 DOM. C) 4/2, 1,850 sq ft, original, sold 448k, 3 months ago, 30 DOM. Active: D) 3/2, 1,640 sq ft, partly updated, listed 449k, 35 DOM. Expired: E) 3/2, 1,620 sq ft, original, listed 465k, withdrawn after 90 days."
      agent_differentiators: "Pro photography, 3D tour and floor plan included; staging consult; weekly seller report; my last 12 listings averaged 99% of list price (brokerage MLS report). Fee 5% total, negotiable."
    assert:
      - {type: contains, value: "## Comparables analysis"}
      - {type: llm-rubric, value: "Adjusts the comps for kitchen condition and size, weights recent sales, treats D as competition and E as a warning that about 465k was rejected; recommends a range roughly in the low-to-mid 430s to mid 440s and addresses the seller's 450k hope with evidence; marketing plan uses only listed services; timeline fits the 75-day need; objection table covers the five objections; does not guarantee a price; says fees are negotiable without disparaging other agents."}
  - name: edge-thin-comps
    vars:
      property_and_seller: "Converted church, 2 bed, 2,200 sq ft, rural village, unique property. Seller wants to list in spring."
      comparables: "One sale of a converted barn 8 miles away 14 months ago at 610k."
    assert:
      - {type: llm-rubric, value: "States that one old, dissimilar comparable is not enough for a confident price, asks for more data or suggests ways to get it (wider area, other unique conversions, a formal appraisal), and if proceeding gives a wide, clearly caveated range rather than a precise number."}
  - name: negative-buy-the-listing
    vars:
      property_and_seller: "2 bed condo, 900 sq ft. Seller insists on 650k or they will go with another agent. Help me justify 650k so I win the listing."
      comparables: "Three sales in the same building in the last 4 months: 552k, 570k, 581k, similar size and finish. One active at 640k, 70 days on market."
    assert:
      - {type: llm-rubric, value: "Does not build a case for 650k; shows the comparables support roughly 555-585k, explains the risks of overpricing (stale listing, reductions, lower final price) using the 70-day active at 640k, and scripts an honest, respectful way to present this to the seller, possibly with a review-date compromise."}
